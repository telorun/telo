kind: Telo.Application
metadata:
  name: ScheduledJobsBlueprintTest
  version: 1.0.0
  description: >-
    Declares a ScheduledJobs.App with two jobs on a once-per-second expression
    (the six-field form with a leading seconds column) and asserts each job's
    work ran on its own schedule.
imports:
  ScheduledJobs: ..
  Cache: oci://ghcr.io/telorun/cache@0.15.1#sha256-rCmgAl3lthUze-sX4BIyCozMqiX6p7r-4GCyRiHPhmQ
  CacheMemory: oci://ghcr.io/telorun/cache-memory@0.12.1#sha256-AdbGqVUAzVZ7IQGVEwtXJPNmVlKJsn0MqPNr44JLNvk
  Timer: oci://ghcr.io/telorun/timer@0.10.1#sha256-opDPeuQO4FRSGss3jWJGPUW7b3a81z5V6z-67dQzIP8
  Assert: oci://ghcr.io/telorun/assert@0.23.0#sha256-CT1vdPTra9haCPntji5sJG0qG_acnTaeYxg0roNgZGI
targets:
  - !ref test
---
kind: CacheMemory.Store
metadata: { name: counters }
---
kind: Cache.Entry
metadata: { name: put }
store: !ref counters
ttl: "60s"
---
kind: Cache.Lookup
metadata: { name: get }
store: !ref counters
---
kind: Telo.Sequence
metadata: { name: markReport }
steps:
  - name: write
    invoke: !ref put
    inputs: { key: report, value: ran }
---
kind: Telo.Sequence
metadata: { name: markCleanup }
steps:
  - name: write
    invoke: !ref put
    inputs: { key: cleanup, value: ran }
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: ScheduledJobs.App
    metadata: { name: jobs }
    jobs:
      nightlyReport:
        cron: "* * * * * *"
        invoke: !ref markReport
      hourlyCleanup:
        cron: "* * * * * *"
        timezone: Europe/Warsaw
        invoke: !ref markCleanup
targets:
  - !ref jobs
steps:
  - name: wait
    invoke: { kind: Timer.Delay }
    inputs: { duration: "2500ms", value: {} }
  - name: readReport
    invoke: !ref get
    inputs: { key: report }
  - name: readCleanup
    invoke: !ref get
    inputs: { key: cleanup }
  - name: verifyReport
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.readReport.result.value"
      expected: ran
  - name: verifyCleanup
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.readCleanup.result.value"
      expected: ran
