# `lifecycle: shared` on a library — one instantiation for the whole
# application. Two libraries import the same store; neither knows the other
# exists, and neither declares a connection. The read only succeeds because both
# reached the SAME instance: two instantiations would be two in-memory
# databases, and the reader would fail with `no such table`.
kind: Telo.Application
metadata:
  name: SharedLibrary
  version: 1.0.0
imports:
  Left: ./__fixtures__/shared-library/left
  Right: ./__fixtures__/shared-library/right
  Assert: ../modules/assert
  Run: ../modules/run
targets:
  - !ref Left.seed
  - !ref verify
---
kind: Run.Sequence
metadata:
  name: verify
steps:
  - name: read
    invoke: !ref Right.readMarks
  - name: assertRow
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.read.result.rows"
      expected:
        - body: left was here
