modules:
  modules/image: Added
body: "New kind Image.Fit: scales an image down to fit within maxWidth and maxHeight
  (each 1 to 16384), keeping its aspect ratio and never enlarging it, and always
  re-encodes it, so no input metadata survives. Inputs: image (bytes), maxWidth,
  maxHeight, and format and quality overriding the resource's; resource fields format
  (png, jpeg or webp, default png), quality (1 to 100, default 80), maxBytes (default
  26214400) and maxPixels (default 40000000). Outputs: image, width, height and
  mediaType. It reads PNG, JPEG, WebP and GIF: an EXIF orientation is applied wherever
  the file carries one (a JPEG, a WebP, a PNG) and the box is measured on the upright
  image; a GIF is taken as stored and an animated one yields its first frame. Two codes
  are declared. ERR_IMAGE_TOO_LARGE, with data limit (maxBytes or maxPixels) and max, is
  raised from the header before anything is decoded. ERR_UNSUPPORTED_IMAGE is raised for
  bytes that are not a readable image of those four formats: from the signature or
  header before decoding, or when the decoder rejects a corrupt or truncated body. The
  controller package gains the ./fit export."
