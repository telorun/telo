modules:
  modules/conversation: Added
body: "New module: the conversation contract every chat server and client speaks — the
  Conversation.Spec, Conversation.Event and Conversation.Entry shapes, the route body
  shapes, and the Conversation.Conversation abstract a chat endpoint extends. A
  conversation is a forest (a turn's parent may be null for a new root), every entry
  carries its turn, its place among its siblings and its tool calls' approvals, entries
  page newest first and are read through a chosen entry, and a conversation summary says
  whether its latest turn is still running so a client can reopen it. The spec lists
  only the operations branch and cancel; Conversation.conversations is the
  DataModel.Collection over ConversationSummary (filters title contains and archived eq,
  sort updatedAt) that GET /conversations speaks, so a page lists conversations with a
  Ui.Listing over a Ui.CollectionSource."
