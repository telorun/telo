    - code: SCHEMA_VIOLATION
      message: "Mcp.Prompts/First: /entries/0/name must NOT have fewer than 1 characters"
---
kind: Assert.Manifest
metadata:
  name: promptNameEmptyAtRuntime
source: ./__fixtures__/refusals/prompt-name-empty/telo.yaml
expect:
  errors: []
  runFails: "Resource does not match schema for kind Mcp.Prompts"
