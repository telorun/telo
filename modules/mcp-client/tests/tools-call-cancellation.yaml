kind: Telo.Application
metadata:
  name: McpClientToolsCallCancellationTest
  version: 1.0.0
  description: |
    A tools/call whose invocation is cancelled while the server is still working
    on it rejects as cancelled, and the server is told: it receives
    `notifications/cancelled` for that request and counts it.
imports:
  McpClient: ../
  Run: ../../run
  Assert: ../../assert
targets: [ !ref testCancelledCall ]
---
kind: McpClient.StdioClient
metadata: { name: localMcp }
command: node
args:
  - ./__fixtures__/stdio-server.mjs
clientInfo: { name: telo-test, version: 1.0.0 }
---
kind: McpClient.ToolsCall
metadata: { name: callTool }
client: !ref localMcp
---
# The step's bound cancels the call while `wait_for_cancel` is unanswered; the
# call ends only if the cancellation reaches the request.
kind: Run.Sequence
metadata: { name: testCancelledCall }
steps:
  - name: bounded
    try:
      - name: wait
        timeout: 300
        invoke: !ref callTool
        inputs: { name: wait_for_cancel }
      - name: unreachable
        throw: { code: ERR_TEST_UNREACHABLE, message: "a cancelled tools/call completed" }
    catch:
      - name: timedOut
        invoke: !ref Assert.equals
        inputs: { actual: !cel "error.code", expected: ERR_STEP_TIMEOUT }
  - name: count
    invoke: !ref callTool
    inputs: { name: cancelled_count }
  - name: serverSawCancellation
    invoke: !ref Assert.equals
    inputs:
      actual: !cel "steps.count.result.content"
      expected: [{ type: text, text: "1" }]
