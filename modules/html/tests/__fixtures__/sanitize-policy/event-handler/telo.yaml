# A policy allowing an event handler attribute: refused by `telo check` at the
# declaration, and by the controller at creation.
kind: Telo.Library
metadata:
  name: SanitizeEventHandler
imports:
  Html: ../../../..
exports:
  resources: [policy]
---
kind: Html.SafeTree
metadata: { name: policy }
elements: [p]
attributes:
  p:
    onclick: {}
