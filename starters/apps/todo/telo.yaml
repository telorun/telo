kind: Telo.Application
metadata:
  name: TodoApp
  version: 1.0.0
  categories: [Transport, Storage, UI]
  description: |
    A complete app served as one unit, with no hand-written frontend: the REST
    todo API (one `Crud.Api` over the `todos` collection) and an admin UI
    declared in the same manifest (`UiReact.App`) — a filterable, sortable,
    paged listing with create, edit and delete — on a single port.

    The UI and the API share one collection, so renaming a property is a
    `telo check` error rather than a broken page, and a column the database
    fills in is read by both and written by neither. `/` is the whole screen in
    one `CrudUi.Admin`; `/status` is the same screen written out by hand, with
    presets and a pinned filter — what you drop down to when the one-liner has
    no key for it.

    Run, then open http://localhost:8077, or:
        curl -s 'localhost:8077/api/todos?isDone.eq=false&limit=10'
# Module `lang:` — the language this application's texts are written in — and
# `UiReact.App.words` are read from 0.121.0.
requires:
  telo: ">=0.121.0"
lang: en
# The UI modules, `crud` and `crud-ui` come from this repository while their
# changes are unreleased, with `http-server`, `sql` and `sqlite`, which `crud`
# imports from it too; `telo upgrade --pin-local` pins them once they ship.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.41.1#sha256-TGV1OIU5OtaAhU74roamA-r5DsdqgovsNtkxc8M4wIc
  Sql: oci://ghcr.io/telorun/sql@0.29.0#sha256-0GUgGzPO5QbrzSS1LiIfbkG4qCeOq2W03R1P2PkIsXQ
  SQLite: oci://ghcr.io/telorun/sqlite@0.12.0#sha256-HsbZ6L56HZ9PlvE4WWcgL8qojF0P623wYLv30oUGifQ
  Crud: oci://ghcr.io/telorun/crud@0.33.0#sha256-8uhIx7xGju4Jg0_LArW_9OdYPIc-NF-ndT6d2_sQHBM
  CrudUi: oci://ghcr.io/telorun/crud-ui@0.2.0#sha256-epjhcgiT_rkY86-Ef3B4E65LLEBj3sTWPu5hzeEUrdA
  Ui: oci://ghcr.io/telorun/ui@0.8.0#sha256-lFtULN4n9ItwMCL0s0s5jJPe7TiJO4Tt2xUkEMatulw
  UiReact: oci://ghcr.io/telorun/ui-react@0.9.0#sha256-NZX-2O20TcLARSIedCU1Fu-9Ay3XsjpqUfGiWlfanVk
targets:
  - !ref migrate
  - !ref server
ports:
  http: { env: PORT, protocol: tcp, default: 8077 }
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: { name: Telo.HostPath, entry: file }
    default: todo.db
---
# What creates a todo: its title alone. A new todo is not done — the column's
# default says so — and the create form has the one field.
kind: Telo.JsonSchema
metadata: { name: NewTodo }
schema:
  type: object
  required: [text]
  additionalProperties: false
  properties:
    text: { type: string, title: Task, minLength: 1 }
---
# What an update replaces. `isDone` is required, so an update leaving it out is
# refused rather than clearing it; leaving out the optional `dueOn` clears it.
kind: Telo.JsonSchema
metadata: { name: TodoEdit }
extends: NewTodo
schema:
  type: object
  required: [isDone]
  properties:
    isDone: { type: boolean, title: Done }
    dueOn: { type: string, title: Due, format: date }
---
# What is read back: everything written, the key, and `createdAt`, which the
# table fills in. It is in no write shape, so no request can set it.
kind: Telo.JsonSchema
metadata: { name: Todo }
extends: TodoEdit
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
    createdAt: { type: string, title: Created }
---
# One collection for the API and the UI: a record's shape for each operation,
# and what the list may be filtered and sorted by. The API accepts nothing
# else, and the UI offers exactly this.
kind: Crud.Collection
metadata: { name: todos }
model: !ref Todo
table: !ref todosTable
schemas: { list: !ref Todo, create: !ref NewTodo, update: !ref TodoEdit }
query:
  filters:
    - { property: text, operator: contains }
    - { property: isDone, operator: eq }
    # A date range is two filters on one property: from this day, to this day.
    - { property: dueOn, operator: gte }
    - { property: dueOn, operator: lte }
  sort: [{ property: text }, { property: dueOn }, { property: createdAt }]
---
# Where the browser reads the collection: the path the API is mounted at.
kind: CrudUi.CollectionSource
metadata: { name: todosSource }
collection: !ref todos
basePath: /api/todos
---
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.dbFile"
---
kind: SQLite.Table
metadata: { name: todosTable }
table: todos
columns:
  id: { type: integer, primaryKey: true, identity: always }
  text: { type: text, nullable: false }
  is_done: { type: integer, nullable: false, default: 0 }
  due_on: { type: text }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata: { name: migrate }
connection: !ref db
tables: [!ref todosTable]
---
# How the written-out screen on `/status` shows the collection; its bar, its
# listing and both forms name it.
kind: Ui.CollectionPresentation
metadata: { name: todosPresentation }
source: !ref todosSource
---
# The whole frontend. `/` is one `CrudUi.Admin` — listing, filters, and the
# create and edit forms all come from the collection — given three keys that
# say how it behaves. `/status` is the same screen written out by hand.
kind: UiReact.App
metadata: { name: ui }
title: Todos
words: !ref Ui.words
theme: !ref UiReact.defaultTheme
tokens: { kind: Ui.DesignTokens, color.accent: "#1f8fff", radius.md: 6px }
pages:
  - kind: Ui.Page
    path: /
    title: Todos
    children:
      - type: composite
        ref:
          kind: CrudUi.Admin
          source: !ref todosSource
          # The bar shows only the filters chosen, as chips, kept in the address
          # and the browser.
          filters:
            show: chosen
            summary: chips
            state: { key: todos, address: true, store: { kind: Ui.LocalStore } }
          create:
            # A drawer, and a full-size dialog on a narrow screen.
            surface: { kind: Ui.Drawer, side: end, compact: { kind: Ui.Dialog, size: full } }
            afterSubmit: again
          edit:
            surface: { kind: Ui.Drawer, side: end, address: { name: todo } }
            unsaved: confirm
  - kind: Ui.Page
    path: /status
    title: By status
    children:
      - { type: text, text: Todos by status, style: heading }
      - type: composite
        ref:
          kind: Ui.Filters
          presentation: !ref todosPresentation
          # The bar folds behind a toggle.
          policy: { placement: { kind: Ui.CollapsiblePlacement } }
          fields:
            # Pinned: the search box stays outside the fold.
            - { property: text, operator: contains, pinned: true }
            # No control: the presets below are the only way to set it.
            - { property: isDone, operator: eq, control: none }
            # Behind the toggle: a range of due days, from one to another.
            - { property: dueOn, operator: gte }
            - { property: dueOn, operator: lte }
          presets:
            - { label: All, values: [] }
            - { label: Open, values: [{ property: isDone, operator: eq, value: false }] }
            - { label: Done, values: [{ property: isDone, operator: eq, value: true }] }
          content:
            type: composite
            ref:
              kind: Ui.Listing
              presentation: !ref todosPresentation
              model: !ref Todo
              # An opener with nothing but its form opens as the listing
              # decides: a dialog that closes after a save.
              create: { form: { kind: Ui.Form, model: !ref NewTodo, presentation: !ref todosPresentation } }
              edit: { form: { kind: Ui.Form, model: !ref TodoEdit, presentation: !ref todosPresentation } }
              delete: true
---
kind: Http.Server
metadata: { name: server }
listen: { port: !cel "ports.http" }
openapi:
  info: { title: Todo API, version: 1.0.0 }
mounts:
  - path: /api/todos
    # The entire REST API over the collection's table: GET / (a paged list,
    # filtered and sorted by what its `query` declares), GET /{id}, POST /,
    # PUT /{id} (replace) and DELETE /{id}; both writes answer with the todo.
    mount: { kind: Crud.Api, connection: !ref db, plural: todos, singular: todo, collection: !ref todos }
  - { path: /, mount: !ref ui }
