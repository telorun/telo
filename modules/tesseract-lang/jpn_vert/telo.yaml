kind: Telo.Library
metadata:
  name: TesseractLangJpnVert
  version: 0.2.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Recognize Japanese, vertical text text in images, offline: the trained model for reading
    printed Japanese, vertical text (Japanese script) with Tesseract optical character recognition.
