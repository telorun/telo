kind: Telo.Application
metadata:
  name: UrlShortener
  version: 1.0.0
  categories: [ Transport, Performance, Reliability ]
  description: |
    A URL shortener exercising the cache, rate-limit, run (Detach), sql, and
    http-server modules end to end. A thin root that owns the shared schema
    and HTTP server and wires two libraries:

      redirect/  POST /links {code,url} → {code,shortUrl}, GET /{code} (cache
                 read-through, rate-limit, detached click recording)
      admin/     GET /admin/links, GET /admin/links/{code}

    Zero external infra: a shared SQLite file + in-process CacheMemory.Store.
    The address short links point at is the `site` need, so run it locally with
    `TELO_NEED_SITE__URL=http://localhost:8080`.
requires:
  # 0.118.0: `site` is a `Telo.PublicUrl` need, a kind an older analyzer does not
  # declare.
  telo: ">=0.118.0"
imports:
  Http: oci://ghcr.io/telorun/http-server@0.38.0#sha256-QUCZmb_cvTor4YhWUAj3YdRj-kacNkmkXLnycjXLBtA
  Sql: oci://ghcr.io/telorun/sql@0.28.0#sha256-JC2SN6Ha8hlq9gnRGahvVNVwe-cUXHXtS8rdeo1BC24
  SQLite: oci://ghcr.io/telorun/sqlite@0.10.0#sha256-qTwG1VYpO8_AGN2UaJPWEIHyt1rt8OUlxLKtLcJkf4Q
  Database:
    source: ./database
    variables:
      dbFile: !cel "variables.dbFile"
  Redirect:
    source: ./redirect
    variables:
      dbFile: !cel "variables.dbFile"
    needs:
      site: !ref site
  Admin:
    source: ./admin
    variables:
      dbFile: !cel "variables.dbFile"
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: Telo.HostPath
    default: ./tmp/url-shortener.db
ports:
  http:
    env: PORT
    default: 8080
needs:
  site:
    kind: Telo.PublicUrl
    parameters: { port: http }
targets:
  - !ref setupDb
  - !ref server
---
kind: SQLite.Schema
metadata: { name: setupDb }
connection: !ref Database.connection
tables:
  - !ref Database.links
  - !ref Database.clicks
---
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
trustProxy: true
openapi:
  info: { title: URL Shortener, version: 1.0.0 }
mounts:
  - path: /
    mount: !ref Redirect.routes
  - path: /admin
    mount: !ref Admin.routes
