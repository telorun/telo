kind: Telo.Application
metadata:
  name: UiSurfacesTest
  version: 1.0.0
  description: |
    Each surface kind provides where an opened page appears with every member it takes
    filled: what is declared as written, the rest from the kind's defaults. An
    address is carried as declared, and a compact surface — by reference or
    declared in place — as the dialog or drawer it provides. A page opened in
    any of them carries the surface on its destination.
imports: { Ui: ../, Probe: ./__fixtures__/probe, Assert: ../../assert }
targets:
  - !ref main
---
kind: Ui.Dialog
metadata: { name: wide }
size: large
modal: false
dismiss: { outside: false }
address: { name: todo }
compact: !ref sheet
---
kind: Ui.Drawer
metadata: { name: sheet }
side: bottom
size: full
---
kind: Ui.Popover
metadata: { name: bubble }
side: top
align: end
dismiss: { escape: false }
compact: { kind: Ui.Dialog, size: small }
---
kind: Ui.InlineSurface
metadata: { name: inRow }
---
kind: Ui.Panel
metadata: { name: beside }
side: start
size: small
dismiss: { closeButton: false }
address: { name: todo }
---
kind: Ui.Page
metadata: { name: todoPage }
path: /todos/{id}
title: Todo
children: [{ type: text, text: Todo }]
---
kind: Ui.OpenPage
metadata: { name: inPanel }
page: !ref todoPage
pathParams: { id: 7 }
surface: !ref beside
---
kind: Ui.OpenPage
metadata: { name: inPopover }
page: !ref todoPage
pathParams: { id: 7 }
surface: !ref bubble
---
kind: Ui.OpenPage
metadata: { name: inLine }
page: !ref todoPage
pathParams: { id: 7 }
surface: !ref inRow
---
kind: Ui.OpenPage
metadata: { name: inDefault }
page: !ref todoPage
pathParams: { id: 7 }
---
kind: Telo.Sequence
metadata: { name: main }
steps:
  - name: wide
    invoke: { kind: Probe.Read, source: !ref wide }
  - name: bubble
    invoke: { kind: Probe.Read, source: !ref bubble }
  - name: inRow
    invoke: { kind: Probe.Read, source: !ref inRow }
  - name: beside
    invoke: { kind: Probe.Read, source: !ref beside }
  - name: inPanel
    invoke: { kind: Probe.Read, source: !ref inPanel }
  - name: inPopover
    invoke: { kind: Probe.Read, source: !ref inPopover }
  - name: inLine
    invoke: { kind: Probe.Read, source: !ref inLine }
  - name: inDefault
    invoke: { kind: Probe.Read, source: !ref inDefault }
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        wide: !cel "steps.wide.result"
        bubble: !cel "steps.bubble.result"
        inRow: !cel "steps.inRow.result"
        beside: !cel "steps.beside.result"
        opened: !cel "[steps.inPanel.result, steps.inPopover.result, steps.inLine.result, steps.inDefault.result].map(d, {'type': d.type, 'surface': d.surface, 'keepsSurface': d.keepsSurface})"
      expected:
        wide:
          type: dialog
          size: large
          modal: false
          dismiss: { escape: true, outside: false, closeButton: true }
          address: { name: todo }
          compact:
            type: drawer
            side: bottom
            size: full
            modal: true
            dismiss: { escape: true, outside: true, closeButton: true }
        bubble:
          type: popover
          side: top
          align: end
          dismiss: { escape: false, outside: true }
          compact:
            type: dialog
            size: small
            modal: true
            dismiss: { escape: true, outside: true, closeButton: true }
        inRow: { type: inline }
        beside:
          type: panel
          side: start
          size: small
          dismiss: { escape: true, closeButton: false }
          address: { name: todo }
        opened:
          - type: openPage
            surface:
              type: panel
              side: start
              size: small
              dismiss: { escape: true, closeButton: false }
              address: { name: todo }
            keepsSurface: false
          - type: openPage
            surface:
              type: popover
              side: top
              align: end
              dismiss: { escape: false, outside: true }
              compact:
                type: dialog
                size: small
                modal: true
                dismiss: { escape: true, outside: true, closeButton: true }
            keepsSurface: false
          - { type: openPage, surface: { type: inline }, keepsSurface: false }
          - type: openPage
            surface: { type: dialog, size: medium, modal: true, dismiss: { escape: true, outside: true, closeButton: true } }
            keepsSurface: true
