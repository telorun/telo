kind: Telo.Application
metadata:
  name: PortMismatch
  version: 1.0.0
  description: |
    A mount naming an address need served on another port than the server's is
    refused when the server initializes, naming the need and both ports.
imports:
  Http: ../../../
  Run: ../../../../run
  Assert: ../../../../assert
ports:
  http: { env: PORT, default: 8943 }
  status: { env: STATUS_PORT, default: 8944 }
needs:
  status:
    kind: Telo.PublicUrl
    parameters: { port: status }
targets:
  - !ref test
---
kind: Http.Api
metadata: { name: statusApi }
routes:
  - request: { path: /, method: GET }
    returns:
      - status: 200
        content: { application/json: { body: { ok: true } } }
---
kind: Run.Sequence
metadata: { name: serve }
with:
  - kind: Http.Server
    metadata: { name: server }
    listen:
      address: 127.0.0.1
      port: !cel "ports.http"
    mounts:
      - hostnames: [ !ref status ]
        path: /
        mount: !ref statusApi
targets:
  - !ref server
steps: []
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: attempt
    try:
      - name: start
        invoke: !ref serve
      - name: unreached
        throw:
          code: ERR_EXPECTED_REFUSAL
          message: the server started on a port its address need does not name
    catch:
      - name: verify
        invoke: { kind: Assert.Equals }
        inputs:
          actual:
            # A scope's initialization failure reaches the catch wrapped; its code
            # is carried in the message.
            refused: !cel "error.message.contains('[ERR_HOSTNAMES_PORT_MISMATCH]')"
            namesNeed: !cel "error.message.contains(\"need 'status'\")"
            namesPorts: !cel "error.message.contains(\"port 'status' (8944)\") && error.message.contains('listens on port 8943')"
          expected:
            refused: true
            namesNeed: true
            namesPorts: true
