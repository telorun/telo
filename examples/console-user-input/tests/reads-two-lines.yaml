kind: Telo.Application
metadata:
  name: ConsoleUserInputExampleTest
  version: 1.0.0
  description: >-
    Answers `examples/console-user-input` the way a person would: wait for the
    prompt, type, wait for the next one, type again, and check what it echoed back.
    The second prompt only exists once the first is answered, so this is the shape
    the example cannot be tested in any other way.
imports:
  App: oci://ghcr.io/telorun/app@0.7.2#sha256-29SmNhB_A4l2fGjs5eiV0pYRetQ8-ylNBnPHY_iqgOs
  Channel: oci://ghcr.io/telorun/channel@0.4.1#sha256-0AdimfyKquQp_v2xG3qY5IR4DnAOrI8GH1AV8fFa54I
  Assert: oci://ghcr.io/telorun/assert@0.22.2#sha256-Rh9B2qPXTZKRjB9hbsGaFJKk25OmsxL2YfBSit177Lw
targets:
  - !ref app
  - !ref test
---
kind: App.Instance
metadata: { name: app }
source: ../telo.yaml
# It blocks on its first prompt, so its targets never all finish dispatching.
awaitStart: false
---
kind: Channel.ReadUntil
metadata: { name: read }
channel: !ref app
timeout: "10s"
---
kind: Channel.SendLine
metadata: { name: send }
channel: !ref app
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: usernamePrompt
    invoke: !ref read
    inputs: { until: "Username: " }
  - name: sendUsername
    invoke: !ref send
    inputs: { text: Ada }

  - name: passwordPrompt
    invoke: !ref read
    inputs: { until: "Password: " }
  - name: sendPassword
    invoke: !ref send
    inputs: { text: secret }

  - name: echoed
    invoke: !ref read
    inputs: { until: "\n" }

  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.echoed.result.text"
      expected: "Username: Ada, Password: secret\n"
