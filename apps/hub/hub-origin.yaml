# Reading a module from wherever it is published.
#
# Every transport-specific read goes through the generic `telo module …` CLI
# verbs, so nothing here — and nothing downstream — speaks OCI or HTTP directly.
# This library owns the whole of that boundary: how a ref pins to a version, what
# counts as a concrete version, and how a non-zero exit becomes a value the
# caller decides about rather than an exception it has to catch.
#
# `lifecycle: shared` because ingest and registration both read origins and there
# is one CLI and one shell host behind them. Isolated, each importer would get
# its own, and the two would drift the moment one gained a timeout the other
# lacked.
#
# Failures are RETURNED, not thrown: registration answers a bad ref with a 400
# carrying the reason, while ingest turns the same failure into a recorded
# attempt. Throwing here would force one of the two to catch and re-derive what
# the other reads directly.
kind: Telo.Library
metadata:
  name: HubOrigin
  description: >-
    Reads a published Telo module from its own host: which versions exist with
    each version's content digest, and a version's manifest with the metadata
    the CLI derives from it.
lifecycle: shared
requires:
  # `resources:` inputs and `lifecycle:` on a library.
  telo: ">=0.83.0"
imports:
  Shell: oci://ghcr.io/telorun/shell@0.13.1#sha256-EuLg0IyhQahI2u11cyY5gqPLbLxecA6zwofr2nRT8Ow
  Yaml: oci://ghcr.io/telorun/yaml@0.11.0#sha256-KSC6vlR1yOvXgCUZzj6g4p0r_T-6SfMqQPLR_HQnktk
  Run: oci://ghcr.io/telorun/run@0.31.0#sha256-nwScCIsE4_c40LSm8abAb5qDKQxVnTU8ORlf7Xjyys4
resources:
  shellHost:
    kind: Shell.LocalHost
    description: Where the telo CLI runs.
variables:
  # The command these reads run: a program and its leading arguments, to which
  # each read appends its own. `["telo"]` by default; the composition root binds
  # the telo that runs the hub, so the CLI contract read here is the hub's own
  # generation.
  teloCommand:
    type: array
    items: { type: string }
    minItems: 1
    default: [telo]
exports:
  resources:
    - pinnedRef
    - moduleVersions
    - moduleManifest
---
kind: Shell.Command
metadata:
  name: teloCli
host: !ref shellHost
---
kind: Yaml.Parse
metadata:
  name: parseYaml
---
# How a ref pins to one version, in one place. A direct `https://` ref addresses
# a single file at a fixed location and takes NO `@version` suffix — appending
# one produces a 404 — and neither does a local path, which is one directory on
# disk. Only an OCI ref pins, with `@<version>`.
kind: Run.Value
metadata:
  name: pinnedRef
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      ref: { type: string }
      version: { type: string }
    required: [ref, version]
value: !cel "inputs.ref.startsWith('oci://') ? inputs.ref + '@' + inputs.version : inputs.ref"
---
# The versions a ref actually resolves to, newest-first, each with its digest
# (or, when that one tag's digest cannot be read, the reason, with `digest`
# empty), and with the `latest` tag dropped — it is an alias, not a version, and
# ingesting it would store the same content twice under two names.
#
# One CLI process reads every digest: the reconcile pass reads every version of
# every tracked module, and a process per version was most of its cost.
kind: Run.Sequence
metadata:
  name: moduleVersions
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      ref: { type: string }
    required: [ref]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      ok: { type: boolean }
      error: { type: string }
      versions:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            version: { type: string }
            # The transport-native content digest of the version. Opaque by
            # design: it exists to detect a re-pushed tag, never to be compared
            # across transports. '' when `error` says why it could not be read.
            digest: { type: string }
            error: { type: string }
          required: [version, digest, error]
      # '' when the ref resolves but publishes no concrete version.
      latest: { type: string }
    required: [ok, error, versions, latest]
steps:
  - name: run
    invoke: !ref teloCli
    inputs:
      args: !cel "variables.teloCommand + ['module', 'versions', inputs.ref, '--json', '--digests']"
      timeoutMs: 120000
  - name: parsed
    if: !cel "steps.run.result.exitCode == 0"
    then:
      - name: docs
        invoke: !ref parseYaml
        inputs:
          text: !cel "steps.run.result.stdout"
      - name: concrete
        value: !cel >-
          steps.docs.result.docs[0]
            .filter(e, string(e.version) != 'latest')
            .map(e, {
            'version': string(e.version),
            'digest': 'digest' in e ? string(e.digest) : '',
            'error': 'error' in e ? string(e.error) : ''
          })
outputs:
  ok: !cel "steps.run.result.exitCode == 0"
  error: !cel "steps.run.result.exitCode == 0 ? '' : steps.run.result.stderr"
  versions: !cel "'concrete' in steps ? steps.concrete.result : []"
  latest: !cel >-
    'concrete' in steps && size(steps.concrete.result) > 0 ? steps.concrete.result[0].version : ''
---
# One version's manifest, plus everything the CLI derives from it.
#
# `payload` is the verb's own JSON object verbatim — cache key, integrity, the
# runtime block — and `docs` the parsed manifest documents. Passed through rather
# than projected, because what a consumer wants out of it is the consumer's
# business: this library's job ends at "the origin answered, here is what it
# said".
kind: Run.Sequence
metadata:
  name: moduleManifest
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      ref: { type: string }
      version: { type: string }
    required: [ref, version]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      ok: { type: boolean }
      error: { type: string }
      payload: { type: object, additionalProperties: true }
      docs: { type: array }
    required: [ok, error, payload, docs]
steps:
  - name: pinned
    invoke: !ref pinnedRef
    inputs:
      ref: !cel "inputs.ref"
      version: !cel "inputs.version"
  - name: run
    invoke: !ref teloCli
    inputs:
      args: !cel "variables.teloCommand + ['module', 'manifest', steps.pinned.result, '--json']"
      timeoutMs: 120000
  - name: parsed
    if: !cel "steps.run.result.exitCode == 0"
    then:
      - name: payload
        invoke: !ref parseYaml
        inputs:
          text: !cel "steps.run.result.stdout"
      - name: docs
        invoke: !ref parseYaml
        inputs:
          text: !cel "steps.payload.result.docs[0].manifest"
outputs:
  ok: !cel "steps.run.result.exitCode == 0"
  error: !cel "steps.run.result.exitCode == 0 ? '' : steps.run.result.stderr"
  payload: !cel "'payload' in steps ? steps.payload.result.docs[0] : {}"
  docs: !cel "'docs' in steps ? steps.docs.result.docs : []"
