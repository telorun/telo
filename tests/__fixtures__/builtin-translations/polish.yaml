kind: Telo.Application
metadata: { name: PolishServer, version: 1.0.0 }
lang: pl
imports: { Http: ../../../modules/http-server, Api: ./api }
ports: { http: { env: PORT, protocol: tcp } }
targets: [!ref server]
---
kind: Http.Server
metadata: { name: server }
listen: { address: 127.0.0.1, port: !cel "ports.http" }
mounts: [{ path: /, mount: !ref Api.api }]
