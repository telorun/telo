            - [ input, labels, auto, scope ]
            - [ input, includeBlocked, auto, scope ]
            - [ input, pace, slider, speed ]
          groups: [ [ scope, What to count ], [ speed, How fast ] ]
          state: { key: estimate, address: true, store: { type: memory }, fields: [ projectCode, labels, includeBlocked, pace ] }
          answer: [ projectCode, hours, tasks, weeks, finishBy, breakdown ]
          result: [ text, text, value, list ]
          texts:
            - hours: { root: result, path: [ hours ] }
              tasks: { root: result, path: [ tasks ] }
              project: { root: result, path: [ projectCode ] }
            - weeks: { root: result, path: [ weeks ] }
              pace: { root: input, path: [ pace ] }
          value: [ { root: result, path: [ finishBy ] }, { type: string, format: date } ]
          list:
            - By label
            - { root: result, path: [ breakdown ] }
