kind: Telo.Application
metadata:
  name: IntegerIntoNumberSlotTest
  version: 1.0.0
  description: |
    JSON types compare by containment: a value declared `integer` — or a value
    type whose base is one, a port — satisfies a slot declared `number`, as a
    call-site argument and as a resource's own field. `telo check` accepts the
    wiring the kernel accepts.
imports:
  Run: ../modules/run
  Assert: ../modules/assert
variables:
  count: { env: INTEGER_INTO_NUMBER_COUNT, type: integer, default: 3 }
targets:
  - !ref test
---
kind: Run.Value
metadata: { name: measure }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [count, port]
    properties:
      count: { type: integer }
      port: { x-telo-type: Telo.TcpPort }
value:
  count: 4
  port: 8080
---
kind: Run.Value
metadata: { name: halve }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [n]
    properties:
      n: { type: number }
value: !cel "inputs.n / 2.0"
---
kind: Telo.Definition
metadata:
  name: Scaled
  description: Returns the factor it is configured with.
capability: Telo.Invocable
schema:
  type: object
  additionalProperties: false
  properties:
    factor: { type: number, x-telo-eval: compile }
resources:
  - kind: Run.Value
    metadata: { name: echo }
    value: !cel "self.factor"
invoke: !ref echo
---
kind: Self.Scaled
metadata: { name: scaled }
factor: !cel "variables.count"
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: measured
    invoke: !ref measure
  - name: halfCount
    invoke: !ref halve
    inputs:
      n: !cel "steps.measured.result.count"
  - name: halfPort
    invoke: !ref halve
    inputs:
      n: !cel "steps.measured.result.port"
  - name: factor
    invoke: !ref scaled
  - name: assertAccepted
    inputs:
      actual:
        halfCount: !cel "steps.halfCount.result"
        halfPort: !cel "steps.halfPort.result"
        factor: !cel "steps.factor.result"
      expected:
        halfCount: 2.0
        halfPort: 4040.0
        factor: 3
    invoke:
      kind: Assert.Equals
