kind: Telo.Library
metadata:
  name: FieldRead
  version: 0.0.0
  description: Reads its need's url by field only, so nothing observes the version it states.
imports:
  Kinds: ../kinds
needs:
  access:
    kind: Kinds.DatabaseAccess
    version: ">=15.0.0"
---
kind: Kinds.Plain
metadata: { name: label }
fields:
  value: !cel "resources.access.url"
