kind: Telo.Application
metadata: { name: XTeloEvalCompile, version: 1.0.0 }
imports:
  Http: ../modules/http-server
  HttpClient: ../modules/http-client
  Assert: ../modules/assert
---
# Http.Server declares x-telo-eval: compile on port, host, baseUrl, etc.
# Using a CEL expression for port verifies compile expansion runs before the
# controller's create() — without it, Fastify would receive a CompiledValue
# object instead of a number and fail to start on the right port.
kind: Telo.Sequence
metadata: { name: testCompileEval }
with:
  - kind: Http.Api
    metadata: { name: testApi }
    routes:
      - request: { path: /ping, method: GET }
        returns:
          - { status: 200, content: { application/json: { body: { pong: true } } } }
  - kind: Http.Server
    metadata: { name: testServer }
    listen:
      address: !cel "'127.0.0.1'"
      port: !cel "8857"
    mounts:
      - path: /api
        mount: !ref testApi
targets:
  - !ref testServer
steps:
  - name: ping
    invoke: { kind: HttpClient.Request, url: http://127.0.0.1:8857/api/ping, method: GET }

  - name: assertPong
    inputs:
      pong: !cel "steps.ping.result.body.pong"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties: { pong: { type: boolean, const: true } }
        required: [pong]
