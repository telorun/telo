kind: Telo.Library
metadata:
  name: codec
  version: 0.6.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Data]
  description: |
    The shared contract for stream codecs: encoding turns a stream of records into a
    stream of bytes ready for transport, decoding turns bytes back into values or
    records. Transport-neutral and format-agnostic — each wire format supplies its
    own implementation, and consumers pipe streams through whichever one they hold.
exports:
  kinds:
    - Encoder
    - Decoder
---
# Encoder abstract — record/byte iterables to byte iterables.
#
# Encoders are plain Telo.Invocables; the streaming dimension lives in the
# schema via `x-telo-stream: true` on the `input` and `output` properties.
# Encoders carry no MIME declaration — the consumer (e.g. an Http.Api route's
# `content[mime]` map key) is the only Content-Type source. Transport-neutral.
kind: Telo.Abstract
metadata:
  name: Encoder
  description: >-
    Serializes a stream of records or bytes into a stream of byte chunks ready for
    transport, one wire format per implementation. It declares no media type — the
    consumer that sends the bytes decides how they are labelled.
capability: Telo.Invocable
inputType:
  kind: Type.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-stream: true
        description: Async iterable of records (or bytes) to encode.
    required: [input]
    additionalProperties: false
outputType:
  kind: Type.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-stream: true
        description: Async iterable of Uint8Array chunks ready for transport.
    required: [output]
    additionalProperties: false
---
# Decoder abstract — byte iterables to structured values (or record streams).
#
# The output shape varies per concrete decoder: simple decoders collect to a
# single value (`{text: string}`, `{bytes: Uint8Array}`); streaming decoders
# emit another `Stream<...>` (`{records: Stream<unknown>}`). The abstract
# leaves outputType open; concrete kinds declare their own.
kind: Telo.Abstract
metadata:
  name: Decoder
  description: >-
    Parses a stream of byte chunks back into usable values, one wire format per
    implementation. The result shape is the implementation's own: a single collected
    value for simple formats, another stream for framed ones.
capability: Telo.Invocable
inputType:
  kind: Type.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-stream: true
        description: Async iterable of Uint8Array chunks to decode.
    required: [input]
    additionalProperties: false
