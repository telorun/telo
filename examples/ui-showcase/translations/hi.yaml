  - { text: Design, translation: "डिज़ाइन" }
  - { text: Building, translation: "निर्माण" }
  - { text: Writing, translation: "लेखन" }
  - { text: Research, translation: "शोध" }
  - { text: People needed, translation: "आवश्यक लोग" }
  - { text: Start, translation: "शुरुआत" }
  - { text: Kick-off, translation: "किक-ऑफ़" }
  - { text: Daily call, translation: "दैनिक कॉल" }
  - { text: Details, translation: "विवरण" }
  - { text: Markdown is welcome., translation: "आप Markdown का उपयोग कर सकते हैं।" }
  - { text: Keep me posted by, translation: "सूचना पाने का माध्यम" }
  - { text: Chat, translation: "चैट" }
  - { text: Phone, translation: "फ़ोन" }
  - { text: Keywords, translation: "कीवर्ड" }
  - { text: "Lower-case words; Enter or a comma adds one.", translation: "छोटे अक्षरों वाले शब्द; Enter या अल्पविराम एक शब्द जोड़ता है।" }
  - { text: Site access code, translation: "साइट प्रवेश कोड" }
  - { text: Never kept between visits., translation: "विज़िट के बीच कभी नहीं रखा जाता।" }
  - { text: Received, translation: "प्राप्त" }
  - { text: Lead, translation: "लीड" }
