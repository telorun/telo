  - name: verifyTables
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        kinds: !cel "steps.nodes.result.tables.map(c, c.type)"
        derived:
          columns: !cel "steps.nodes.result.tables[2].layout.columns.map(c, ['sort' in c ? c.sort : '-', c.header.message[0]])"
          pageSize: !cel "steps.nodes.result.tables[2].pageSize"
          create: !cel "[steps.nodes.result.tables[2].create.to.type, steps.nodes.result.tables[2].create.to.href.path, steps.nodes.result.tables[2].create.to.surface]"
          edit: !cel "[steps.nodes.result.tables[2].edit.to.type, steps.nodes.result.tables[2].edit.to.href.path, steps.nodes.result.tables[2].edit.to.surface]"
          delete: !cel "steps.nodes.result.tables[2].delete"
        written:
          pageSize: !cel "steps.nodes.result.tables[6].pageSize"
          rowStyle: !cel "steps.nodes.result.tables[6].rowStyle"
          columns: !cel "steps.nodes.result.tables[6].layout.columns.map(c, [c.header.message[0], 'sort' in c ? c.sort : '-', 'style' in c ? c.style : null])"
        members:
          source: !cel "[steps.nodes.result.tables[10].basePath, steps.nodes.result.tables[10].pageSize]"
          columns: !cel "steps.nodes.result.tables[10].layout.columns.map(c, [c.header.message[0], c.value.path, c.present])"
        byQuery:
          links: !cel "steps.nodes.result.tables[14].children[0].children.map(c, c.to.href.path.value)"
          query: !cel "steps.nodes.result.tables[14].children[1].query"
          filters: !cel "steps.nodes.result.tables[14].children[1].filters"
          fixed: !cel "steps.nodes.result.tables[18].filters"
        surfaces: !cel >-
          [24, 28, 32, 36, 40, 44].map(i, steps.nodes.result.tables[i]).map(t, [
            t.create.to.type, t.create.to.surface, t.edit.to.type, t.edit.to.surface, t.delete])
        ownPage: !cel "[steps.nodes.result.tables[48].create.to, steps.nodes.result.tables[48].edit.to]"
        polish: !cel "[steps.polishTables.result.body.children[0].children[0].text.message[0], steps.polishTables.result.body.children[0].children[2].layout.columns[3].labels[1].label.message[0]]"
