  minLength:
    message:
      plural: limit
      cases:
        one: Must be at least {$limit} character
        other: Must be at least {$limit} characters
    values: { limit: { type: integer } }
    description: Under a field whose value fails `minLength`.
  maxLength:
    message:
      plural: limit
      cases:
        one: Must be at most {$limit} character
        other: Must be at most {$limit} characters
    values: { limit: { type: integer } }
