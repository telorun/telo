kind: Telo.Application
metadata: { name: Broken, version: 1.0.0 }
lang: en
imports: { Desktop: ../../.. }
ports: { http: { env: PORT, default: 8080 } }
needs:
  desktopHost:
    kind: Telo.DesktopHost
    parameters: { identifier: run.telo.broken, productName: Broken, icon: !module-path icon.png, port: http }
targets:
  - !ref mainWindow
  - !ref tray
---
kind: Desktop.Window
metadata: { name: otherWindow }
host: !ref desktopHost
---
kind: Desktop.Window
metadata: { name: mainWindow }
host: !ref otherWindow
---
kind: Desktop.TrayIcon
metadata: { name: tray }
host: !ref desktopHost
icon: !module-path tray.jpg
menu:
  - { type: item, label: Open, action: { invoke: { kind: Desktop.ShowWindow, window: !ref other } } }
  - { type: item, label: Quit, action: { invoke: { kind: Desktop.Quit, host: !ref otherWindow } } }
---
kind: Desktop.TrayIcon
metadata: { name: other }
host: !ref desktopHost
icon: !module-path icon.png
