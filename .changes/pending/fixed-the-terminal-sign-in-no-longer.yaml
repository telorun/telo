modules:
  modules/oauth-client: Fixed
body: "The terminal sign-in no longer fails dispatch with `ERR_INPUT_INVALID` when the
  authorization server sends no `iss`: `TokenExchange` takes a null `iss` (the response
  carried none) and its own issuer check decides, refusing only when the server
  advertises the parameter. The documented flow stops when the redirect carried no code
  and passes `iss` through as it arrived."
