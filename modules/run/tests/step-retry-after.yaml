kind: Telo.Application
metadata:
  name: RunStepRetryAfterTest
  version: 1.0.0
  description: |
    A step's `retry.retryAfter` reads the failure just caught as `error` and
    waits what it yields instead of the computed backoff. The policy's own
    backoff here is an hour, so the run finishes only because the failure's
    `data.waitMs` is honoured — and the dispatch record shows the re-attempt
    happened. The delays are durations, written as text or as integer
    milliseconds.

    `telo check` holds the same policy to its target: a `nonRetryable` code the
    target cannot throw is a warning, an `error.data` field its codes do not
    declare is an error, and a negative delay or a zero timeout is refused by
    the bounds the policy's duration slots declare.
imports:
  Run: ../
  Assert: ../../assert
targets:
  - !ref test
  - !ref attempts
---
kind: Run.Sequence
metadata: { name: limited }
steps:
  - name: refuse
    throw:
      code: ERR_RATE_LIMITED
      message: slow down
      data: { waitMs: 5 }
---
kind: Assert.Events
metadata: { name: attempts }
filter:
  - type: "limited.InvokeRejected"
expect:
  # The first attempt and the one re-attempt the budget allows.
  - event: limited.InvokeRejected
    times: 2
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: waitAsAsked
    try:
      - name: call
        invoke: !ref limited
        timeout: 5000
        retry:
          attempts: 1
          initialDelay: 1h
          maxDelay: 2h
          retryAfter: !cel "duration(string(error.data.waitMs) + 'ms')"
    catch:
      - name: exhausted
        invoke: { kind: Assert.Equals }
        inputs:
          actual: !cel "error.code"
          expected: ERR_RATE_LIMITED
  - name: checked
    invoke:
      kind: Assert.Manifest
      source: ./__fixtures__/retry-policy-checks/telo.yaml
      expect:
        warnings:
          - code: NON_RETRYABLE_CODE_NOT_THROWN
            message: "retry.nonRetryable names 'ERR_NEVER_THROWN'"
        errors:
          - code: CEL_UNKNOWN_FIELD
            message: "error.data.'wait' is not defined"
          - code: SCHEMA_VIOLATION
            message: "timeout must be a Telo.Duration greater than 0s, not 0s"
          - code: SCHEMA_VIOLATION
            message: "initialDelay must be a Telo.Duration at least 0s, not -0.005s"
