  # notice of tesseract-ocr/tessdata.
  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/mya.traineddata.gz:
        { upstream: mya, member: package/4.0.0_best_int/mya.traineddata.gz, sha256: a6ac329fbc61a902c05bb10ec7a863e9983e3da65dc558fe1db909b61af67ce4, executable: false }
---
kind: TesseractModel.Language
metadata:
  name: mya
  description: Burmese, Myanmar script
code: mya
data: !module-path ./tessdata/mya.traineddata.gz
