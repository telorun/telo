---
# A reference slot behind a local `$ref`, in a root `anyOf` branch, under a root
# `additionalProperties` and at depth 1 and 3 of a recursive shape is a Phase-5
# injection site: a `!ref` arrives as the live instance, an inline declaration
# is extracted and runs. A scope in a root `anyOf` branch or behind a `$ref` is
# stood up and runs its `with:` resources.
kind: Assert.Manifest
metadata:
  name: refSlotReachRuns
source: ./__fixtures__/check-run-agreement/ref-slot-reach/telo.yaml
expect:
  runs: true
---
# `!ref nosuch` at each of those slots is reported at its concrete path, as at a
# plain `properties` slot; a consumer invoking each resource fails at run.
kind: Assert.Manifest
metadata:
  name: refSlotReachUnresolved
source: ./__fixtures__/check-run-agreement/ref-slot-reach/unresolved/lib/telo.yaml
expect:
  errors:
    - code: UNRESOLVED_REFERENCE
      message: "Reach.ViaDefs/viaDefs: reference at 'target' → resource 'nosuch' not found"
    - code: UNRESOLVED_REFERENCE
      message: "Reach.ViaRootAnyOf/viaRootAnyOf: reference at 'target' → resource 'nosuch' not found"
    - code: UNRESOLVED_REFERENCE
      message: "Reach.ViaRootMap/viaRootMap: reference at 'missing' → resource 'nosuch' not found"
    - code: UNRESOLVED_REFERENCE
      message: "Reach.ViaRecursion/viaRecursion: reference at 'node.next.target' → resource 'nosuch' not found"
---
kind: Assert.Manifest
metadata:
  name: refSlotReachUnresolvedDefsAtRuntime
source: ./__fixtures__/check-run-agreement/ref-slot-reach/unresolved/via-defs.yaml
expect:
  errors: []
  runFails: "Resource 'nosuch' not found in module context"
---
kind: Assert.Manifest
metadata:
  name: refSlotReachUnresolvedRootAnyOfAtRuntime
source: ./__fixtures__/check-run-agreement/ref-slot-reach/unresolved/via-root-any-of.yaml
expect:
  errors: []
  runFails: "Resource 'nosuch' not found in module context"
---
kind: Assert.Manifest
metadata:
  name: refSlotReachUnresolvedRootMapAtRuntime
source: ./__fixtures__/check-run-agreement/ref-slot-reach/unresolved/via-root-map.yaml
expect:
  errors: []
  runFails: "Resource 'nosuch' not found in module context"
---
kind: Assert.Manifest
metadata:
  name: refSlotReachUnresolvedRecursionAtRuntime
source: ./__fixtures__/check-run-agreement/ref-slot-reach/unresolved/via-recursion.yaml
expect:
  errors: []
  runFails: "Resource 'nosuch' not found in module context"
---
# `x-telo-scope` off a named top-level property — nested under an object, on an
# array item, under a root `additionalProperties` — has no one field to stand a
# scope up from. Refused at the annotation, and by the kernel at registration.
kind: Assert.Manifest
metadata:
  name: scopeSlotMisplaced
source: ./__fixtures__/check-run-agreement/ref-slot-reach/scope-misplaced/lib/telo.yaml
expect:
  errors:
    - code: SCOPE_SLOT_MISPLACED
      message: "'NestedObject' declares `x-telo-scope` at 'schema.properties.outer.properties.with.x-telo-scope'"
    - code: SCOPE_SLOT_MISPLACED
      message: "'ArrayItem' declares `x-telo-scope` at 'schema.properties.groups.items.x-telo-scope'"
    - code: SCOPE_SLOT_MISPLACED
      message: "'RootMap' declares `x-telo-scope` at 'schema.additionalProperties.x-telo-scope'"
---
kind: Assert.Manifest
metadata:
  name: scopeSlotMisplacedNestedObjectAtRuntime
source: ./__fixtures__/check-run-agreement/ref-slot-reach/scope-misplaced/telo.yaml
expect:
  errors: []
  runFails: "it is nested under an object ('outer.with'). A scope belongs on a named top-level property — one in the schema root's `properties` or in a root `anyOf` / `oneOf` / `allOf` branch's, written directly or through a local `$ref`. Move the annotation there. [ERR_SCOPE_SLOT_MISPLACED]"
---
kind: Assert.Manifest
metadata:
  name: scopeSlotMisplacedArrayItemAtRuntime
source: ./__fixtures__/check-run-agreement/ref-slot-reach/scope-misplaced/telo.yaml
expect:
  errors: []
  runFails: "it applies to the items of an array ('groups[]'). A scope belongs on a named top-level property — one in the schema root's `properties` or in a root `anyOf` / `oneOf` / `allOf` branch's, written directly or through a local `$ref`. Move the annotation there. [ERR_SCOPE_SLOT_MISPLACED]"
---
kind: Assert.Manifest
metadata:
  name: scopeSlotMisplacedRootMapAtRuntime
source: ./__fixtures__/check-run-agreement/ref-slot-reach/scope-misplaced/telo.yaml
expect:
  errors: []
  runFails: "it applies to the values of an open-keyed map ('{}'). A scope belongs on a named top-level property — one in the schema root's `properties` or in a root `anyOf` / `oneOf` / `allOf` branch's, written directly or through a local `$ref`. Move the annotation there. [ERR_SCOPE_SLOT_MISPLACED]"
---
# A reference slot paired with an argument map through its own `inputs:`
# pointer — behind a local `$ref`, in a root `anyOf` branch, under a root
# `additionalProperties` — is checked at the call site, as a plain slot is: a
# map supplying an input the slot's kind does not declare checks clean, and the
# target receives it.
kind: Assert.Manifest
metadata:
  name: refSlotReachPairedInputsRuns
source: ./__fixtures__/check-run-agreement/ref-slot-reach/paired-inputs.yaml
expect:
  runs: true
---
# A string at a key one union branch declares a reference slot and a sibling
# branch a string — at the schema root and one object down — is a value.
kind: Assert.Manifest
metadata:
  name: refSlotReachValueAlternativeRuns
source: ./__fixtures__/check-run-agreement/ref-slot-reach/value-alternative.yaml
expect:
  runs: true
---
# The same key merely annotated by an `allOf` member is a conjunct, not an
# alternative: the string is the removed string-reference spelling, refused at
# the declaring library and, from a silent consumer, where the slot is resolved.
kind: Assert.Manifest
metadata:
  name: refSlotReachValueConjunct
source: ./__fixtures__/check-run-agreement/ref-slot-reach/value-conjunct/lib/telo.yaml
expect:
  errors:
    - code: INVALID_REFERENCE_FORM
      message: "Reach.ValueViaAllOf/conjunct: string reference at 'target' → 'hello' is not supported"
---
kind: Assert.Manifest
metadata:
  name: refSlotReachValueConjunctAtRuntime
source: ./__fixtures__/check-run-agreement/ref-slot-reach/value-conjunct/telo.yaml
expect:
  errors: []
  runFails: "'target' must be a `!ref` to a resource satisfying `Telo.Invocable`."
---
# A sibling branch of a discriminated union giving the key a string is not an
# alternative where the discriminator selects the reference branch: the string
# is refused at the declaring library and, from a silent consumer, where the
# slot is resolved.
kind: Assert.Manifest
metadata:
  name: refSlotReachValueDiscriminated
source: ./__fixtures__/check-run-agreement/ref-slot-reach/value-discriminated/lib/telo.yaml
expect:
  errors:
    - code: INVALID_REFERENCE_FORM
      message: "Reach.ValueViaDiscriminated/discriminated: string reference at 'inner.target' → 'hello' is not supported"
---
kind: Assert.Manifest
metadata:
  name: refSlotReachValueDiscriminatedAtRuntime
source: ./__fixtures__/check-run-agreement/ref-slot-reach/value-discriminated/telo.yaml
expect:
  errors: []
  runFails: "'inner.target' must be a `!ref` to a resource satisfying `Telo.Invocable`."
