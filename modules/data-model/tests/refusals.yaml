  runFails: "[ERR_DATA_MODEL_FACET_UNSUPPORTED] RuntimeError: DataModel.Collection 'collection': 'query.facets[1]' facets by 'tags', which holds an object or a list"
---
kind: Assert.Manifest
metadata: { name: relationUnknownProperty }
source: ./__fixtures__/refusals/relation-unknown-property/lib/telo.yaml
expect:
