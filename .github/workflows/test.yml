      # Staged files are fetched from third parties on first use; cache them so a
      # flaky download fails one job at most once per key.
      - name: Restore staged module files
        id: staged
        uses: ./.github/actions/restore-staged-files
        with:
          scope: ${{ github.job }}

      # A manifest test runs the CLI, which is all that reads built output: the
      # kernel builds every module controller from source at load.
      - name: Build for Node.js
        shell: bash
        run: pnpm --filter "@telorun/cli..." run build

      - name: Check module manifests
        if: needs.select.outputs.platform_suites == 'true'
        run: pnpm run check modules/*/telo.yaml packages/runner-core/workspace-app/telo.yaml

      - name: Check example manifests
        if: needs.select.outputs.platform_suites == 'true'
        run: >-
          pnpm run check examples/*/telo.yaml examples/*/*/telo.yaml
          examples/schema-evolution/v1.yaml examples/templated-api/library.yaml

      - name: Check starter and blueprint manifests
        if: needs.select.outputs.platform_suites == 'true'
        run: pnpm run check starters/apps/*/telo.yaml starters/libs/*/telo.yaml blueprints/*/telo.yaml

      - name: Run telo manifest tests (Node)
        if: needs.select.outputs.platform_mode != 'none'
        shell: bash
        env:
          SUITE_ARGS: ${{ needs.select.outputs.args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$SUITE_ARGS")
          pnpm run test:node "${args[@]}"

      - name: Run the example test suites (Node)
        if: needs.select.outputs.platform_suites == 'true'
        run: pnpm run telo:node ./examples/test-suite.yaml

      - name: Run the starter test suites (Node)
        if: needs.select.outputs.platform_suites == 'true'
        run: pnpm run telo:node ./starters/test-suite.yaml

      - name: Run the blueprint test suites (Node)
        if: needs.select.outputs.platform_suites == 'true'
        run: pnpm run telo:node ./blueprints/test-suite.yaml

      - name: Save staged module files
        if: always() && steps.staged.outputs.key != '' && steps.staged.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-staged-files
        with:
          key: ${{ steps.staged.outputs.key }}
          paths: ${{ steps.staged.outputs.paths }}

