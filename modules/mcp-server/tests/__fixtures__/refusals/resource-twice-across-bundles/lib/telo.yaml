# `telo check` reports this here; a consumer's check sees nothing, so there the
# resource refuses itself when the application boots.
kind: Telo.Library
metadata:
  name: McpResourceTwiceAcrossBundles
  version: 1.0.0
  description: Test fixture exporting an HTTP endpoint whose two resources bundles share an entry.
imports:
  Mcp: ../../../../../
  Run: ../../../../../../run
exports:
  resources: [server]
---
kind: Run.Value
metadata: { name: answer }
value:
  text: ok
---
kind: Mcp.Resources
metadata: { name: First }
entries:
  - uri: note://a
    name: Entry
    handler: !ref answer
    inputs: {}
    result:
      contents:
        - { uri: "note://a", text: ok }
---
kind: Mcp.Resources
metadata: { name: Second }
entries:
  - uri: note://a
    name: Entry
    handler: !ref answer
    inputs: {}
    result:
      contents:
        - { uri: "note://a", text: ok }
  - uri: note://b
    name: Entry
    handler: !ref answer
    inputs: {}
    result:
      contents:
        - { uri: "note://b", text: ok }
---
kind: Mcp.HttpEndpoint
metadata: { name: server }
serverInfo: { name: fixture, version: 1.0.0 }
resources: [ !ref First, !ref Second ]
