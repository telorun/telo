units:
  modules/mcp-client: Security
  modules/mcp-server: Security
body: Updated @modelcontextprotocol/sdk to 1.32 or later, which fixes OAuth credentials
  being sent to the wrong server (GHSA-6qxp-vccf-f47h), the unbounded request size
  (GHSA-f897-62hf-6gxq) and the transitive hono and proxy-addr advisories
  (GHSA-jqcg-44mw-7w3h).
