modules:
  modules/http-server: Added
body: "Request bodies are bounded. Http.Server takes maxBodyBytes (an integer of at
  least 1, default 1048576) for every mount, and an Http.Api route's own maxBodyBytes
  replaces it for that route, larger or smaller; no value switches the limit off. No
  more than that many bytes of a body are ever buffered or handed to a handler. A body
  over the limit is answered 413 with Connection: close and the error envelope, code
  ERR_REQUEST_BODY_TOO_LARGE, data maxBodyBytes and the declared contentLength. The
  answer is the server's own: no catches list sees it, and its request span ends
  rejected with that error type. Breaking: streamed bodies (contentTypeParsers stream:
  true) and multipart bodies were unlimited and are now counted as the handler pulls
  them, so a route taking more than 1 MiB must set maxBodyBytes; the chunk that crosses
  the limit cancels the request's invocation with reason request-body-too-large and the
  413 is sent at that moment, with whatever the handler already wrote left as it is.
  Breaking: the 413 for a buffered body was the framework's own body (statusCode, code
  FST_ERR_CTP_BODY_TOO_LARGE, error, message) and is now the envelope. Breaking: a
  streamed request.body reaches a mount as an async iterable of byte chunks, no longer
  the raw request stream. Breaking: a request body not read to its end is no longer
  drained: the connection is closed after the response. Whenever a response is finished
  while the body has not arrived in full, whoever wrote it, it carries Connection: close
  when its headers were not yet sent and the connection is closed at its end otherwise;
  a body that had arrived in full keeps the connection. New docs page:
  request-bodies.md."
