# A reference in a kind's template body is no attachment: the sink stays
# unattached in the configuration that declares the application's job as well.
kind: Telo.Application
metadata:
  name: SinkAttachmentDefinitionBody
imports:
  Run: ../../../modules/run
variables:
  flag1: { env: FLAG_1, type: boolean, default: false }
targets:
  - !if
    if: !cel "variables.flag1"
    then: !ref job
---
kind: Telo.Definition
metadata: { name: Job }
capability: Telo.Runnable
schema: { type: object }
resources:
  - kind: Run.Sequence
    metadata: { name: seq }
    steps:
      - name: a
        invoke: !ref traces
run: !ref seq
---
kind: SinkAttachmentDefinitionBody.Job
metadata: { name: job }
---
kind: Telo.LogTraceSink
metadata: { name: traces }
