modules:
  modules/ai: Added
  modules/openai: Added
body: "One failure list for every language model, and prompt-cache breakpoints.
  `Ai.Model` and `Ai.ModelStream` now declare the thirteen codes a model may raise —
  `ERR_MODEL_ACCESS_DENIED`, `ERR_MODEL_RATE_LIMITED`, `ERR_MODEL_QUOTA_EXCEEDED`,
  `ERR_MODEL_UNAVAILABLE`, `ERR_MODEL_TIMEOUT`, `ERR_MODEL_UNREACHABLE`,
  `ERR_MODEL_CONTEXT_TOO_LONG`, `ERR_MODEL_CONTENT_REFUSED`,
  `ERR_MODEL_REQUEST_REJECTED`, `ERR_MODEL_CONTENT_UNSUPPORTED`,
  `ERR_MODEL_TOOL_ARGUMENTS_INVALID`, `ERR_MODEL_RESPONSE_INVALID` and
  `ERR_INVALID_REFERENCE` — with typed `error.data` (`status`, `retryAfterSeconds`,
  `partType`, `scheme`, `mediaType`, `tool`), and the four OpenAI language kinds raise
  only those: every HTTP status, the endpoint's own error object wherever it appears, a
  transport failure, a malformed or cut-short answer and a failed or truncated stream
  each arrive under the code that says whether another try is worthwhile, with
  `retryAfterSeconds` read from `Retry-After`. Nothing else leaves one of those kinds:
  an error raised while the request is built is `ERR_MODEL_REQUEST_REJECTED`, one raised
  while a success response is read is `ERR_MODEL_RESPONSE_INVALID`, each keeping the
  original as its `cause`, and a member of a 2xx body or of a stream frame that has the
  wrong shape — a `tool_calls` that is not a list of objects, a tool call with no
  `function`, an `output` holding something that is not an object — is
  `ERR_MODEL_RESPONSE_INVALID` naming the member; a text, id, name, count or finish
  reason of the wrong type is read as absent, and tool arguments that are not JSON text
  are `ERR_MODEL_TOOL_ARGUMENTS_INVALID`. `@telorun/ai` exports a constructor per code,
  `modelFailureFromStatus`, `retryAfterSeconds`, `MODEL_FAILURE_CODES` and
  `modelFailureFromError` for provider authors — the last is the boundary every error of
  a call passes through: it returns a cancellation, a durable suspension, a contract
  error of the dispatch and a failure already among the thirteen as they are, and asks
  the provider what anything else is. A content part a caller sends may carry
  `cacheBreakpoint`, `system` on `Ai.Text`, `Ai.TextStream`, `Ai.Agent` and
  `Ai.AgentStream` is a string or a non-empty list of text parts, and usage gains
  `cacheWritePromptTokens`; OpenAI caches on its own, so the marker is dropped there.
  BREAKING: `ERR_OPENAI_REQUEST_FAILED`, `ERR_OPENAI_INVALID_TOOL_ARGUMENTS` and the
  unprefixed `ERR_CONTENT_UNSUPPORTED` are no longer raised — a `catches:` entry naming
  one is `UNDECLARED_THROW_CODE`, and the new codes are `UNCOVERED_THROW_CODE` unless a
  catch-all follows; a failed run or mid-stream error that names nothing known is
  `ERR_MODEL_UNAVAILABLE`. A kind extending `Ai.Model` or `Ai.ModelStream` must restate
  the list and is refused at load when it declares a code outside it. A chat stream that
  ends with neither a finish reason nor `[DONE]`, an error frame inside one, and a 2xx
  body that is not the answer now fail instead of returning an empty or clean-looking
  completion; one reaching `[DONE]` with no finish reason finishes `other`. The OpenAI
  kinds ask their request for the body as text and decode it themselves, so a `success:`
  / `retryOn:` rule on a request handed to one sees `body` undecoded. `error.data` of a
  refused content part gains `mediaType`."
