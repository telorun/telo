kind: Telo.Library
metadata:
  name: TesseractLangYor
  version: 0.1.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Recognize Yoruba text in images, offline: the trained model for reading
    printed Yoruba (Latin script) with Tesseract optical character recognition.
