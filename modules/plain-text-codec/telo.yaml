kind: Telo.Library
metadata:
  name: PlainTextCodec
  version: 0.9.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Data]
  description: |
    Plain UTF-8 text on the wire: a stream of text pieces — including the delta
    records a model emits while streaming — becomes bytes, and a byte stream is
    collected back into one string. The simplest way to serve or read a text payload.
imports:
  Codec: ../codec
exports:
  kinds:
    - Encoder
    - Decoder
---
# Encoder: records → UTF-8 bytes. Accepts `{delta: string}`, bare strings,
# and Uint8Array pass-through. Other shapes throw.
kind: Telo.Definition
metadata:
  name: Encoder
  description: >-
    Encodes a stream of text into UTF-8 bytes, accepting plain strings, streaming
    delta records, or bytes passed straight through.
capability: Telo.Invocable
extends: Codec.Encoder
controllers:
  - pkg:telo/local/js?path=./nodejs/encoder-controller.mjs&local_path=./nodejs/src/encoder-controller.ts
schema:
  type: object
  additionalProperties: false
---
# Decoder: byte stream → single UTF-8 string. Accepts `Uint8Array` chunks
# (Buffer is a subtype) and bare strings as a pass-through convenience.
kind: Telo.Definition
metadata:
  name: Decoder
  description: >-
    Collects a byte stream into a single UTF-8 string, for when a text payload has to
    be held whole rather than consumed piece by piece.
capability: Telo.Invocable
extends: Codec.Decoder
controllers:
  - pkg:telo/local/js?path=./nodejs/decoder-controller.mjs&local_path=./nodejs/src/decoder-controller.ts
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      text:
        type: string
        description: UTF-8 string formed by concatenating every chunk in `input`.
    required: [ text ]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
