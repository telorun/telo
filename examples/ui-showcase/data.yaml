---
# One row per open session: signing in writes it, signing out deletes it, and
# the guard on `/api/private` reads the cookie's token against it.
kind: SQLite.Table
metadata: { name: sessionsTable }
table: sessions
columns:
  id: { type: integer, primaryKey: true, identity: always }
  token: { type: text, nullable: false, unique: true }
  person_email: { type: text, nullable: false }
  created_at: { type: text, nullable: false, defaultExpression: "datetime('now')" }
---
# ---- The projects collection, served by crud ----
# What creates a project. The table fills in what it leaves out.
kind: Telo.JsonSchema
metadata: { name: ProjectDraft }
schema:
  type: object
  additionalProperties: false
  required: [ code, name, status ]
  properties:
    code: { type: string, title: Code, pattern: "^[A-Z]{2,4}-[0-9]+$" }
    name: { type: string, title: Name, minLength: 1 }
    status:
      type: string
      title: Status
      enum: [ active, paused, done ]
      oneOf:
        - { const: active, title: Active }
        - { const: paused, title: Paused }
        - { const: done, title: Finished }
    leadEmail: { type: string, title: Lead }
    budget: { type: number, title: Budget, minimum: 0 }
    velocity: { type: number, title: Velocity, minimum: 0 }
    featured: { type: boolean, title: Featured }
    open: { type: boolean, title: Taking requests }
    brief: { type: string, title: Brief, format: uri-reference }
    startedOn: { type: string, title: Started, format: date }
---
# What replaces a project. A replace writes every property it declares, so the
# columns that may not be null are required here.
kind: Telo.JsonSchema
metadata: { name: ProjectEdit }
extends: ProjectDraft
schema:
  type: object
  required: [ budget, velocity, featured, open ]
---
# What is read back: the key, and every column the table always fills in.
kind: Telo.JsonSchema
metadata: { name: Project }
extends: ProjectEdit
schema:
  type: object
  required: [ id ]
  properties:
    id: { type: integer }
---
kind: Crud.Collection
metadata: { name: projects }
model: !ref Project
table: !ref projectsTable
schemas: { list: !ref Project, create: !ref ProjectDraft, update: !ref ProjectEdit }
query:
  filters:
    - { property: code, operator: eq }
    - { property: code, operator: in }
    - { property: name, operator: contains }
    - { property: status, operator: eq }
    - { property: status, operator: in }
    - { property: leadEmail, operator: eq }
    - { property: featured, operator: eq }
    - { property: open, operator: eq }
    - { property: budget, operator: gte }
    - { property: budget, operator: lte }
    - { property: startedOn, operator: gte }
    - { property: startedOn, operator: lte }
  sort: [{ property: code }, { property: name }, { property: budget }, { property: startedOn }]
---
# Where the browser reads the projects: the tables, the choices and the pickers
# over them name this one source.
kind: Ui.CollectionSource
metadata: { name: projectsSource }
collection: !ref projects
basePath: /api/projects
---
# ---- The tasks collection, served by crud ----
# What creates a task. The table fills in what it leaves out, and a form starts
# from the defaults.
kind: Telo.JsonSchema
metadata: { name: TaskDraft }
schema:
  type: object
  additionalProperties: false
  required: [ title, projectCode ]
  properties:
    title: { type: string, title: Task, minLength: 1, maxLength: 80 }
    projectCode: { type: string, title: Project, pattern: "^[A-Z]{2,4}-[0-9]+$" }
    assigneeEmail: { type: string, title: Assignee }
    status:
      type: string
      title: Status
      enum: [ todo, doing, review, done ]
      oneOf:
        - { const: todo, title: To do }
        - { const: doing, title: In progress }
        - { const: review, title: In review }
        - { const: done, title: Finished }
      default: todo
    priority: { type: integer, title: Priority, minimum: 1, maximum: 5, default: 3 }
    estimate: { type: number, title: Estimate, minimum: 0, maximum: 40, multipleOf: 0.5 }
    dueOn: { type: string, title: Due, format: date }
    label:
      type: string
      title: Label
      enum: [ bug, feature, chore, docs ]
      oneOf:
        - { const: bug, title: Bug }
        - { const: feature, title: Feature }
        - { const: chore, title: Chore }
        - { const: docs, title: Docs }
    blocked: { type: boolean, title: Blocked, default: false }
---
# What replaces a task: the columns that may not be null are required.
kind: Telo.JsonSchema
metadata: { name: TaskEdit }
extends: TaskDraft
schema:
  type: object
  required: [ status, priority, blocked ]
---
kind: Telo.JsonSchema
metadata: { name: Task }
extends: TaskEdit
schema:
  type: object
  required: [ id ]
  properties:
    id: { type: integer }
---
# Every operator a filter bar can send, each over the property it suits: text
# contains, an equality on each enumerated, boolean and key property, a range
# of dates, numbers compared both ways, and `in` over status, label and
# assignee.
kind: Crud.Collection
metadata: { name: tasks }
model: !ref Task
table: !ref tasksTable
schemas: { list: !ref Task, create: !ref TaskDraft, update: !ref TaskEdit }
query:
  filters:
    - { property: title, operator: contains }
    - { property: projectCode, operator: eq }
    - { property: assigneeEmail, operator: eq }
    - { property: assigneeEmail, operator: in }
    - { property: status, operator: eq }
    - { property: status, operator: in }
    - { property: priority, operator: gte }
    - { property: priority, operator: lte }
    - { property: estimate, operator: gt }
    - { property: estimate, operator: lt }
    - { property: dueOn, operator: gte }
    - { property: dueOn, operator: lte }
    - { property: label, operator: eq }
    - { property: label, operator: in }
    - { property: blocked, operator: eq }
  sort: [{ property: title }, { property: status }, { property: priority }, { property: estimate }, { property: dueOn }]
---
# Where the browser reads the tasks, and how every screen over them shows them:
# each listing, filter bar and form of tasks names this presentation, and the
# generated admin screen this source.
kind: CrudUi.CollectionSource
metadata: { name: tasksSource }
collection: !ref tasks
basePath: /api/tasks
---
kind: Ui.CollectionPresentation
metadata: { name: tasksPresentation }
source: !ref tasksSource
---
# ---- The people collection, served by crud ----
# What adds a person. The pickers read it to offer the team, search it by name
# and label a chosen e-mail with one `email.in` lookup.
kind: Telo.JsonSchema
metadata: { name: PersonDraft }
schema:
  type: object
  additionalProperties: false
  required: [ name, email, role, joinedOn ]
  properties:
    name: { type: string, title: Name, minLength: 1 }
    email: { type: string, title: E-mail, minLength: 3 }
    role: { type: string, title: Role }
    location: { type: string, title: Location }
    joinedOn: { type: string, title: Joined, format: date }
    active: { type: boolean, title: Active, default: true }
    contact: { type: string, title: Contact, format: uri }
---
kind: Telo.JsonSchema
metadata: { name: PersonEdit }
extends: PersonDraft
schema:
  type: object
  required: [ active ]
---
kind: Telo.JsonSchema
metadata: { name: Person }
extends: PersonEdit
schema:
  type: object
  required: [ id ]
  properties:
    id: { type: integer }
---
kind: Crud.Collection
metadata: { name: people }
model: !ref Person
table: !ref peopleTable
schemas: { list: !ref Person, create: !ref PersonDraft, update: !ref PersonEdit }
query:
  filters:
    - { property: email, operator: eq }
    - { property: email, operator: in }
    - { property: name, operator: contains }
    - { property: role, operator: eq }
    - { property: active, operator: eq }
  sort: [{ property: name }]
---
kind: Ui.CollectionSource
metadata: { name: peopleSource }
collection: !ref people
basePath: /api/people
---
# ---- Related records: authors, their posts, and the people they report to ----
# The writers of the studio's blog. Seeded with their keys, so the posts seeded
# below name them on every start.
kind: SQLite.Table
metadata: { name: authorsTable }
table: authors
columns:
  id: { type: integer, primaryKey: true }
  name: { type: text, nullable: false }
  email: { type: text, nullable: false, unique: true }
seeds:
  key: [id]
  rows:
    - { id: 1, name: Sofia Rossi, email: sofia@northwind.example }
    - { id: 2, name: Maya Harris, email: maya@northwind.example }
    - { id: 3, name: James Walker, email: james@northwind.example }
    - { id: 4, name: Grace Okafor, email: grace@northwind.example }
---
# A post names its author by key. The foreign key is what `posts.authorId`'s
# relation is checked against; deleting an author leaves their posts unsigned.
kind: SQLite.Table
metadata: { name: postsTable }
table: posts
columns:
  id: { type: integer, primaryKey: true, identity: always }
  seed_key: { type: text, unique: true }
  title: { type: text, nullable: false }
  author_id: { type: integer }
  status: { type: text, nullable: false, default: draft }
  published_on: { type: text }
foreignKeys:
  posts_author: { columns: [author_id], references: { table: !ref authorsTable, columns: [id] }, onDelete: set null }
seeds:
  key: [seed_key]
  rows:
    - { seed_key: P01, title: How we plan a sprint, author_id: 1, status: published, published_on: "2026-10-05" }
    - { seed_key: P02, title: Designing for small screens, author_id: 2, status: published, published_on: "2026-10-12" }
    - { seed_key: P03, title: "Our handbook, rewritten", author_id: 1, status: published, published_on: "2026-10-19" }
    - { seed_key: P04, title: Offline sync without tears, author_id: 3, status: review, published_on: "2026-11-02" }
    - { seed_key: P05, title: A palette that passes contrast, author_id: 2, status: review, published_on: "2026-11-09" }
    - { seed_key: P06, title: Writing release notes people read, author_id: 1, status: draft }
    - { seed_key: P07, title: The case for boring tools, author_id: 3, status: draft }
---
# The studio's reporting lines: each person names the one they report to, so
# the people form a tree whose roots report to nobody.
kind: SQLite.Table
metadata: { name: employeesTable }
table: employees
columns:
  id: { type: integer, primaryKey: true }
  name: { type: text, nullable: false }
  title: { type: text, nullable: false }
  manager_id: { type: integer }
foreignKeys:
  employees_manager: { columns: [manager_id], references: { table: !ref employeesTable, columns: [id] }, onDelete: set null }
seeds:
  key: [id]
  rows:
    - { id: 1, name: Ada Brooks, title: Managing director }
    - { id: 2, name: Liam Carter, title: Head of engineering, manager_id: 1 }
    - { id: 3, name: Maya Harris, title: Lead designer, manager_id: 1 }
    - { id: 4, name: James Walker, title: Engineer, manager_id: 2 }
    - { id: 5, name: Tomás Ortega, title: Data engineer, manager_id: 2 }
    - { id: 6, name: Sofia Rossi, title: Writer, manager_id: 3 }
    - { id: 7, name: Grace Okafor, title: Studio manager }
---
kind: Telo.JsonSchema
metadata: { name: AuthorDraft }
schema:
  type: object
  additionalProperties: false
  required: [name, email]
  properties:
    name: { type: string, title: Name, minLength: 1 }
    email: { type: string, title: E-mail, minLength: 3 }
---
kind: Telo.JsonSchema
metadata: { name: Author }
extends: AuthorDraft
schema: { type: object, required: [id], properties: { id: { type: integer } } }
---
# The authors, looked up by key in one `id.in` request when a post names them,
# and searched by name when one is picked.
kind: Crud.Collection
metadata: { name: authors }
model: !ref Author
table: !ref authorsTable
schemas: { list: !ref Author, create: !ref AuthorDraft, update: !ref AuthorDraft }
query:
  filters: [{ property: id, operator: in }, { property: name, operator: contains }]
  sort: [{ property: name }]
---
# One authors URL, written once: the authors screen and every picker of an
# author read it.
kind: CrudUi.CollectionSource
metadata: { name: authorsSource }
collection: !ref authors
basePath: /api/authors
---
# What writes a post. A post with no author is unsigned, and one with no date
# is not scheduled.
kind: Telo.JsonSchema
metadata: { name: PostDraft }
schema:
  type: object
  additionalProperties: false
  required: [title, status]
  properties:
    title: { type: string, title: Title, minLength: 1 }
    authorId: { type: integer, title: Author }
    status:
      type: string
      title: Status
      enum: [draft, review, published]
      oneOf:
        - { const: draft, title: Draft }
        - { const: review, title: In review }
        - { const: published, title: Published }
      default: draft
    publishedOn: { type: string, title: Published on, format: date }
---
kind: Telo.JsonSchema
metadata: { name: Post }
extends: PostDraft
schema: { type: object, required: [id], properties: { id: { type: integer } } }
---
# The posts. `authorId` holds an author's key, which the relation declares and
# the table's foreign key agrees with; its present values and counts, and the
# statuses', are what a facet request answers.
kind: Crud.Collection
metadata: { name: posts }
model: !ref Post
table: !ref postsTable
schemas: { list: !ref Post, create: !ref PostDraft, update: !ref PostDraft }
query:
  filters:
    - { property: title, operator: contains }
    - { property: authorId, operator: eq }
    - { property: status, operator: eq }
    - { property: publishedOn, operator: gte }
    - { property: publishedOn, operator: lte }
  sort: [{ property: title }, { property: publishedOn }]
  facets: [{ property: authorId }, { property: status }]
relations:
  authorId: { collection: !ref authors }
---
kind: CrudUi.CollectionSource
metadata: { name: postsSource }
collection: !ref posts
basePath: /api/posts
---
# How every screen over posts shows the author: by name, with the e-mail as a
# hint, searched by name. Listings, filter bars and forms over posts name it.
kind: Ui.CollectionPresentation
metadata: { name: postsPresentation }
source: !ref postsSource
relations:
  authorId:
    source: !ref authorsSource
    label: !cel "row.name"
    hint: !cel "row.email"
    search: { property: name, operator: contains }
---
kind: Telo.JsonSchema
metadata: { name: EmployeeDraft }
schema:
  type: object
  additionalProperties: false
  required: [name, title]
  properties:
    name: { type: string, title: Name, minLength: 1 }
    title: { type: string, title: Title, minLength: 1 }
    managerId: { type: integer, title: Reports to }
---
kind: Telo.JsonSchema
metadata: { name: Employee }
extends: EmployeeDraft
schema: { type: object, required: [id], properties: { id: { type: integer } } }
---
# The reporting lines: `managerId` holds another employee's key, a relation of
# the collection to itself. A tree reads the roots with `managerId.absent=true`
# and a person's reports with `managerId=<id>`.
kind: Crud.Collection
metadata: { name: employees }
model: !ref Employee
table: !ref employeesTable
schemas: { list: !ref Employee, create: !ref EmployeeDraft, update: !ref EmployeeDraft }
query:
  filters:
    - { property: id, operator: in }
    - { property: name, operator: contains }
    - { property: managerId, operator: eq }
    - { property: managerId, operator: absent }
  sort: [{ property: name }]
relations:
  managerId: { collection: !ref employees }
---
kind: CrudUi.CollectionSource
metadata: { name: employeesSource }
collection: !ref employees
basePath: /api/employees
