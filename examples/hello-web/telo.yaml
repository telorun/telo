kind: Telo.Application
metadata:
  name: HelloWeb
  version: 1.0.0
  categories: [Transport, UI]
  description: |
    A two-page web app: `/` and `/settings`, declared as a UI with a header menu
    and no hand-written frontend. It knows nothing about windows;
    `examples/hello-desktop` wraps it in a desktop shell without changing it.

    Run, then open http://localhost:8080/
lang: en
requires: { telo: ">=0.133.0" }
imports:
  Http: ../../modules/http-server
  Ui: ../../modules/ui
  UiReact: ../../modules/ui-react
ports: { http: { env: PORT, default: 8080 } }
targets:
  - !ref helloServer
  - { name: openUi, invoke: !ref openUi, inputs: { url: !cel "resources.helloServer.status.localUrl" } }
---
kind: Ui.Page
metadata: { name: home }
path: /
title: Home
width: contained
children:
  - { type: text, text: "Hello, world!", style: title }
  - { type: text, text: This page is declared in YAML and drawn by the UI renderer., style: muted }
  - { type: link, text: Open settings, href: { path: !ref settings }, button: { kind: Ui.TextButton }, style: accent }
---
kind: Ui.Page
metadata: { name: settings }
path: /settings
title: Settings
width: contained
children:
  - { type: text, text: Settings, style: title }
  - { type: text, text: Nothing to configure yet., style: muted }
---
kind: UiReact.App
metadata: { name: helloUi }
title: Hello
theme: !ref UiReact.defaultTheme
pages: [!ref home, !ref settings]
layout:
  kind: Ui.PageLayout
  header:
    - type: pane
      ref:
        kind: Ui.Navbar
        title: Hello
        navigation:
          items:
            - { type: page, page: !ref home }
            - { type: page, page: !ref settings }
---
kind: Http.Server
metadata: { name: helloServer }
listen: { port: !cel "ports.http" }
mounts:
  - { path: /, mount: !ref helloUi }
---
kind: Telo.OpenUrl
metadata: { name: openUi }
