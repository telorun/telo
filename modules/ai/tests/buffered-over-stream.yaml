kind: Telo.Application
metadata:
  name: BufferedOverStreamTest
  version: 1.0.0
  description: |
    `Ai.Buffered` presents a streaming model as a buffered one, so a provider
    that only streams is usable by `Ai.Text` and `Ai.Agent` — which is most of
    the calls anyone makes.

    Asserted through `Ai.Text`, not by invoking the adapter directly: what has to
    hold is that it is accepted wherever an `Ai.Model` is, and that the folded
    answer is the one the stream carried.
imports:
  Ai: ../
  AiEcho: ./__fixtures__/ai-echo.yaml
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
# Streaming only — it implements Ai.ModelStream and nothing else, which is the
# situation the adapter exists for.
kind: AiEcho.EchoModelStream
metadata: { name: streaming }
suffix: "!"
emitProviderState: "reasoning-token-abc"
---
kind: Ai.Buffered
metadata: { name: folded }
model: !ref streaming
---
kind: Ai.Text
metadata: { name: chat }
model: !ref folded
---
# The same adapter driving a TOOL LOOP. This is the payoff: a provider that only
# streams becomes usable by `Ai.Agent`, whose loop needs a complete answer per
# turn to read `toolCalls` off — so the fold has to carry them, not just text.
kind: AiEcho.EchoModelStream
metadata: { name: streamingWithTool }
emitToolCall:
  name: multiply
  arguments: { a: 6, b: 7 }
---
kind: Ai.Buffered
metadata: { name: foldedWithTool }
model: !ref streamingWithTool
---
kind: Run.Value
metadata: { name: multiplier }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      a: { type: number }
      b: { type: number }
value:
  product: !cel "inputs.a * inputs.b"
---
kind: Ai.Tools
metadata: { name: localTools }
tools:
  - tool: !ref multiplier
    name: multiply
    description: Multiply two numbers.
    parameters:
      type: object
      additionalProperties: false
      required: [a, b]
      properties:
        a: { type: number }
        b: { type: number }
---
kind: Ai.Agent
metadata: { name: assistant }
model: !ref foldedWithTool
toolProviders:
  - provider: !ref localTools
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: ask
    inputs:
      prompt: hello
    invoke: !ref chat
  # The echo streams one delta per code point; folding them back must produce
  # exactly what a buffered echo would have returned.
  - name: assertText
    inputs:
      actual: !cel "steps.ask.result.text"
      expected: "hello!"
    invoke: !ref Assert.equals
  - name: assertFinish
    inputs:
      actual: !cel "steps.ask.result.finishReason"
      expected: stop
    invoke: !ref Assert.equals
  - name: assertUsage
    inputs:
      actual: !cel "steps.ask.result.usage.totalTokens"
      expected: 0
    invoke: !ref Assert.equals

  # The loop runs to completion over a stream-only provider: the fold surfaced
  # the tool call, the agent dispatched it, and the second turn saw its result.
  - name: toolLoop
    inputs:
      prompt: "multiply please"
    invoke: !ref assistant
  - name: assertToolResult
    inputs:
      actual: !cel "steps.toolLoop.result.text"
      expected: "{\"product\":42}"
    invoke: !ref Assert.equals

  # The chain a fold must not break: `providerState` is what lets reasoning
  # survive a tool loop, and it is optional on the output — so dropping it was
  # silent. Asserted against the ADAPTER, since `Ai.Text`'s own contract is
  # deliberately narrower and stops at text.
  - name: direct
    inputs:
      messages:
        - role: user
          content: hello
    invoke: !ref folded
  - name: assertProviderState
    inputs:
      actual: !cel "steps.direct.result.providerState"
      expected: "reasoning-token-abc"
    invoke: !ref Assert.equals
  # And the parts really are folded into `content`, not just concatenated text.
  - name: assertContent
    inputs:
      actual: !cel "steps.direct.result.content"
      expected:
        - { type: text, text: "hello!" }
    invoke: !ref Assert.equals
