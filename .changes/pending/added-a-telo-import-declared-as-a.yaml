units:
  analyzer: Added
body: "A Telo.Import declared as a scope member is followed by the loader wherever a
  choice writes it: beneath a holder a whole-document !if or !switch declares, in a
  scope array written as !if (with: !if …), and as a member a tag chooses at a
  scope-member position (a Telo.Import branch named by the tag's metadata, no longer
  BRANCH_CASE_INVALID there; at a document position it still is). A source that does not
  resolve, load or identify is refused at the member in every configuration, and the
  import's other findings — its host-path inputs, the need table's refusals at it, the
  import-anchored refusals of what it reaches — are reported only where it is present,
  labelled by the choice. A library need such an import leaves to the environment is
  required only where the import is (telo needs report: required when …)."
