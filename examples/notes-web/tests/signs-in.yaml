kind: Telo.Application
metadata:
  name: NotesWebSignInTest
  version: 1.0.0
  description: >-
    Runs `examples/notes-web` unmodified with the stand-in identity provider it starts itself, once with
    the provider returning the code in the redirect's query and once as a form POST. A
    client plays the browser: sign-in through the provider ends with the session naming the
    user, which the home page reads; a returned state that is not the browser's, and a replayed return, are refused.
imports:
  App: ../../../modules/app
  HttpClient: ../../../modules/http-client
  Assert: ../../../modules/assert
targets:
  - !ref queryMode
  - !ref formPostMode
  - !ref hostileName
---
kind: HttpClient.Client
metadata: { name: browser }
followRedirects: false
throwOnHttpError: false
---
kind: HttpClient.Request
metadata: { name: visit }
client: !ref browser
responseType: text
---
kind: Telo.Sequence
metadata: { name: signInFlow }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [notes, idp, notesPort, mode, shown]
    properties: { notes: { type: string }, idp: { type: string }, notesPort: { type: integer }, mode: { type: string }, shown: { type: string } }
steps:
  - name: page
    invoke: !ref visit
    inputs: { url: !cel "inputs.notes + '/_telo/ui/page?path=/'" }
  - name: anonymous
    invoke: !ref visit
    inputs: { url: !cel "inputs.notes + '/api/session'" }
  - name: login
    invoke: !ref visit
    inputs: { url: !cel "inputs.notes + '/auth/login'" }
  - name: stateCookie
    value: !cel "steps.login.result.headers['set-cookie'].split(';')[0]"
  - name: state
    value: !cel "steps.stateCookie.result.substring(12)"
  - name: authorize
    invoke: !ref visit
    inputs: { url: !cel "steps.login.result.headers['location']" }
  - name: returned
    if: !cel "inputs.mode == 'query'"
    then:
      - name: code
        value: !cel "steps.authorize.result.headers['location'].split('code=')[1].split('&')[0]"
      - name: callback
        invoke: !ref visit
        inputs:
          url: !cel "steps.authorize.result.headers['location']"
          headers: { cookie: !cel "steps.stateCookie.result" }
    else:
      - name: code
        value: !cel "steps.authorize.result.body.split('name=\"code\" value=\"')[1].split('\"')[0]"
      - name: callback
        invoke: !ref visit
        inputs:
          url: !cel "inputs.notes + '/auth/callback'"
          method: POST
          headers: { cookie: !cel "steps.stateCookie.result", content-type: application/x-www-form-urlencoded }
          body: { code: !cel "steps.code.result", state: !cel "steps.state.result" }
  - name: sessionCookie
    value: !cel "'notes-session=' + steps.callback.result.headers['set-cookie'].split('notes-session=')[1].split(';')[0]"
  - name: signedIn
    invoke: !ref visit
    inputs: { url: !cel "inputs.notes + '/api/session'", headers: { cookie: !cel "steps.sessionCookie.result" } }
  # A second sign-in whose return carries a state this browser was not sent away with.
  - name: login2
    invoke: !ref visit
    inputs: { url: !cel "inputs.notes + '/auth/login'" }
  - name: stateCookie2
    value: !cel "steps.login2.result.headers['set-cookie'].split(';')[0]"
  - name: authorize2
    invoke: !ref visit
    inputs: { url: !cel "steps.login2.result.headers['location']" }
  - name: forged
    if: !cel "inputs.mode == 'query'"
    then:
      - name: forgedState
        invoke: !ref visit
        inputs:
          url: !cel "inputs.notes + '/auth/callback?code=' + steps.authorize2.result.headers['location'].split('code=')[1].split('&')[0] + '&state=forged'"
          headers: { cookie: !cel "steps.stateCookie2.result" }
    else:
      - name: forgedState
        invoke: !ref visit
        inputs:
          url: !cel "inputs.notes + '/auth/callback'"
          method: POST
          headers: { cookie: !cel "steps.stateCookie2.result", content-type: application/x-www-form-urlencoded }
          body: { code: !cel "steps.authorize2.result.body.split('name=\"code\" value=\"')[1].split('\"')[0]", state: forged }
  # The first return again, with the cookie the browser held at the time.
  - name: replayed
    invoke: !ref visit
    inputs:
      url: !cel "inputs.notes + '/auth/callback?code=' + steps.code.result + '&state=' + steps.state.result"
      headers: { cookie: !cel "steps.stateCookie.result" }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        page: { status: !cel "steps.page.result.status", reads: !cel "steps.page.result.body.children[1].source.path.value", signInLink: !cel "steps.page.result.body.children[1].content.children[1].children[1].href.path.value" }
        anonymous: { status: !cel "steps.anonymous.result.status", user: !cel "steps.anonymous.result.body.user" }
        login:
          status: !cel "steps.login.result.status"
          sendsToProvider: !cel "steps.login.result.headers['location'].startsWith(inputs.idp + '/authorize?response_type=code&client_id=notes-example&redirect_uri=http%3A%2F%2F127.0.0.1%3A' + string(inputs.notesPort) + '%2Fauth%2Fcallback&state=' + steps.state.result + '&response_mode=' + inputs.mode)"
        callback: { status: !cel "steps.callback.result.status", location: !cel "steps.callback.result.headers['location']" }
        signedIn: { status: !cel "steps.signedIn.result.status", names: !cel "steps.signedIn.result.body.user == inputs.shown" }
        forgedState: { status: !cel "steps.forgedState.result.status", setsSession: !cel "steps.forgedState.result.headers['set-cookie'].contains('notes-session=')" }
        replayed: { status: !cel "steps.replayed.result.status", setsSession: !cel "steps.replayed.result.headers['set-cookie'].contains('notes-session=')" }
      expected:
        page: { status: 200, reads: /api/session, signInLink: /auth/login }
        anonymous: { status: 200, user: "" }
        login: { status: 302, sendsToProvider: true }
        callback: { status: 302, location: / }
        signedIn: { status: 200, names: true }
        forgedState: { status: 400, setsSession: false }
        replayed: { status: 400, setsSession: false }
---
kind: Telo.Sequence
metadata: { name: queryMode }
with:
  - kind: App.Instance
    metadata: { name: notes }
    source: ../telo.yaml
    ports: { http: 8861, provider: 8862 }
    variables: { responseMode: query }
targets: [!ref notes]
steps:
  - name: flow
    invoke: !ref signInFlow
    inputs: { notes: "http://127.0.0.1:8861", idp: "http://127.0.0.1:8862", notesPort: 8861, mode: query, shown: alice }
---
kind: Telo.Sequence
metadata: { name: formPostMode }
with:
  - kind: App.Instance
    metadata: { name: notes }
    source: ../telo.yaml
    ports: { http: 8863, provider: 8864 }
    variables: { responseMode: form_post }
targets: [!ref notes]
steps:
  - name: flow
    invoke: !ref signInFlow
    inputs: { notes: "http://127.0.0.1:8863", idp: "http://127.0.0.1:8864", notesPort: 8863, mode: form_post, shown: alice }
---
# A user name carrying markup is handed over as data; the page draws it as text.
kind: Telo.Sequence
metadata: { name: hostileName }
with:
  - kind: App.Instance
    metadata: { name: notes }
    source: ../telo.yaml
    ports: { http: 8865, provider: 8866 }
    variables: { responseMode: query, standInUser: "<script>alert(1)</script>" }
targets: [!ref notes]
steps:
  - name: flow
    invoke: !ref signInFlow
    inputs: { notes: "http://127.0.0.1:8865", idp: "http://127.0.0.1:8866", notesPort: 8865, mode: query, shown: "<script>alert(1)</script>" }
