# A store listing a node type another library exported, whose table the
# application's own schema does not list.
kind: Telo.Library
metadata:
  name: ExportedTableNotInSchema
imports:
  Types: ../types
  SQLite: ../../../../../sqlite
  Layers: ../../../..
exports:
  resources: [bad]
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Layers.LayersTable
metadata: { name: graphLayers }
table: graph_layers
---
kind: Layers.ChangesetsTable
metadata: { name: graphChangesets }
table: graph_changesets
---
kind: Layers.ChangesetBasesTable
metadata: { name: graphChangesetBases }
table: graph_changeset_bases
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref Types.knowsTable, !ref graphLayers, !ref graphChangesets, !ref graphChangesetBases]
---
kind: Layers.Store
metadata: { name: bad }
connection: !ref db
schema: !ref appSchema
layer: lost
nodes: [!ref Types.person]
layers: !ref graphLayers
changesets: !ref graphChangesets
changesetBases: !ref graphChangesetBases
