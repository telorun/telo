units:
  modules/postgres: Added
  modules/sqlite: Added
body: The module declares the rename of `beforeMigrations:` to `prepare:` itself
  (`SQL_BEFORE_MIGRATIONS_RENAMED`), so a manifest using the old key is migrated under
  any import alias, reported at its own line, and rewritten by `telo migrate`; it
  requires a telo release that reads library `migrations:`.
