---
# The typeface the brand ships. Inter comes with the example (`fonts/`, under
# the SIL Open Font License), so the `/brand` application serves its four
# faces with `@font-face`.
kind: Font.Family
metadata: { name: inter }
family: Inter
faces:
  normal: !include-bytes fonts/Inter-Regular.woff2
  bold: !include-bytes fonts/Inter-Bold.woff2
  italic: !include-bytes fonts/Inter-Italic.woff2
  boldItalic: !include-bytes fonts/Inter-BoldItalic.woff2
---
# Files served under each application's mount: a link node's `href` and an
# image's `src` resolve under the mount they are drawn in.
kind: Http.Static
metadata: { name: files }
root: !module-path ./files
---
# The session check behind every `/api/private` mount: a cookie naming no row
# of `sessions` is answered 401 with no body, which a reader shows as
# ERR_UI_UNAUTHORIZED and its sign-in gate reads again on.
kind: Telo.Sequence
metadata: { name: sessionGuard }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [ token ]
    properties: { token: { type: string, x-telo-sensitive: true } }
steps:
  - name: session
    invoke: { kind: Sql.Query, connection: !ref db }
    inputs:
      sql: !sql "SELECT token FROM sessions WHERE token = ${{ inputs.token }}"
  - name: open
    if: !cel "size(steps.session.result.rows) == 0"
    then:
      - { name: refuse, throw: { code: UNAUTHORIZED, message: Sign in first. } }
---
# The projects collection: list, read, create, replace and delete, with
# paging, sorting and the filters the collection declares.
kind: Crud.Api
metadata: { name: projectsApi }
connection: !ref db
singular: project
plural: projects
collection: !ref projects
