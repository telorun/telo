kind: Telo.Application
metadata:
  name: ValueTypeArgumentsTest
  version: 1.0.0
  description: |
    Type arguments on a value type, checked where a produced value meets a
    consuming slot. Both sides name `Telo.Stream`, so the CEL type fits and
    nothing before this could see the disagreement — cel-js types by constructor
    identity, so every stream is one CEL type and always will be. The ARGUMENT is
    what differs, and comparing it is a parallel structural pass over the schemas
    the analyzer already walks.

    Covers the mismatch, the gradual case (an omitted argument is *any*, so an
    unmigrated producer or consumer keeps checking exactly as it did), and the
    diagnostic reported for a name that is not a value type at all.
imports:
  Assert: ../modules/assert
  Run: ../modules/run
targets:
  - !ref testValueTypeArguments
---
kind: Assert.Manifest
metadata: { name: rejectsArgumentMismatch }
source: ./__fixtures__/stream-argument-mismatch.yaml
expect:
  errors:
    - code: CEL_TYPE_ARGUMENT_MISMATCH
---
kind: Assert.Manifest
metadata: { name: acceptsMatchingAndOmittedArguments }
source: ./__fixtures__/stream-argument-gradual.yaml
expect:
  errors: []
---
kind: Assert.Manifest
metadata: { name: rejectsUnknownValueType }
source: ./__fixtures__/value-type-unknown.yaml
expect:
  errors:
    - code: X_TELO_TYPE_UNKNOWN
---
kind: Run.Sequence
metadata: { name: testValueTypeArguments }
steps:
  - name: mismatch
    invoke: !ref rejectsArgumentMismatch
  - name: gradual
    invoke: !ref acceptsMatchingAndOmittedArguments
  - name: unknownName
    invoke: !ref rejectsUnknownValueType
