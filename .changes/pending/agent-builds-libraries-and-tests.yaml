modules:
  apps/authoring-agent: Added
body: "The agent now builds an application as several files and verifies it. Domain
  areas become feature libraries under `apps/<slug>/`, tests are written against their
  exports in `apps/<slug>/tests/` — a `Test.Suite` at `tests/telo.yaml` plus one file
  per behaviour — and the application manifest is left as wiring. That split is what
  makes the behaviour testable at all: nothing can import a `Telo.Application`, so a
  single `apps/<slug>/telo.yaml` is reachable only by running the whole app, which is
  the shape it used to produce. A new `run_manifest` tool executes a suite, one test
  file, or a throwaway PROBE, so the agent can get its own tests green rather than
  declaring them ready to run — and can answer its own questions about systems it can
  reach: given a spreadsheet id and a token it reads the tabs and column headers
  itself instead of asking the user to transcribe them, leaving only the identifier
  and the credential's env var to ask about. Having no credential is no longer a
  refusal either: the agent drives OAuth consent through `oauth-client`'s DEVICE
  flow, printing a verification URL and code for the user to approve — the redirect
  flow is unusable here, since the container is not reachable from the user's
  browser. That runs in two parts, because a poll cannot outlast the run timeout
  while a human signs in, and the second part does the reading in the same run since
  an in-memory grant dies with the process that obtained it. Registering the OAuth
  client stays the user's. Probes read and never write, are deleted after, and a
  failed one becomes a question rather than a guess; the enforceable control is the
  credential's own scope, since the agent authors the probe. It is
  gated by `ALLOW_MANIFEST_RUNS`, OFF by default, because a manifest the agent wrote
  is arbitrary code reaching the network with whatever credentials the container
  holds, and a child process inherits the operator environment apart from the
  scrubbed `OPENAI_API_KEY` — enable it only where the caller owns the container.
  A build is not done while the thing that was ASKED FOR does not happen: a source
  fetched and then ignored, a join that returns a constant, a `value:` step holding
  example rows where a computation belongs. Shipping a manifest that checks clean and
  renders a report of invented numbers is the worst outcome available, because it
  reads as real and nothing downstream flags it — so a computation the agent cannot
  work out is reported at the top of its reply instead, and a gap in the central
  feature is asked about BEFORE building around it rather than footnoted after. A
  `default:` for a fact only the user has is an invented answer wearing a nicer word,
  so such a variable is declared required. Runs are bounded by `runTimeoutMs` (120s),
  since a suite terminates and
  an application does not. A turn's step budget rises from 16 to 40, which a
  several-file build with a check-and-fix per file needs to finish at all. Tests
  that depend on a third-party service now mock it with an `Http.Server` scoped to
  the test's own sequence rather than calling it, and the library under test is
  pointed at that mock through its base-URL variable — so an external service's URL
  and credential are library variables from the start, since a library with the
  vendor's URL written into it cannot be tested."
