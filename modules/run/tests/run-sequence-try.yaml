kind: Telo.Application
metadata:
  name: RunSequenceTry
  version: 1.0.0
imports:
  Run: ../
  JavaScript: ../../javascript
  Assert: ../../assert
targets:
  - !ref testTryBlocks
---
kind: Run.Sequence
metadata:
  name: testTryBlocks
steps:
  # --- try/catch: error is thrown, caught, swallowed; sequence continues ---
  - name: catchError
    try:
      - name: thrower
        invoke:
          kind: JavaScript.Script
          code: |
            function main() { throw new Error("caught me") }
    catch:
      - name: caughtMessage
        inputs:
          msg: "${{ error.message }}"
          step: "${{ error.step }}"
          code: "${{ error.code }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              msg:
                type: string
              step:
                type: string
              # A plain Error (not an InvokeError) gets the INTERNAL_ERROR code,
              # so error.code is never null inside a catch.
              code:
                const: "INTERNAL_ERROR"

  # Error was swallowed — sequence continues here.
  - name: afterCatch
    inputs:
      continued: true
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          continued:
            const: true

  # --- try/finally: success path, finally always runs with error==null ---
  - name: trySuccess
    try:
      - name: workDone
        invoke:
          kind: JavaScript.Script
          code: |
            function main() { return { done: true } }
    finally:
      - name: finallyOnSuccess
        inputs:
          done: "${{ steps.workDone.result.done }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              done:
                const: true

  - name: verifyFinallyRan
    inputs:
      result: "${{ steps.finallyOnSuccess.result }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            const: true

  # --- try/catch/finally: error thrown, catch runs, finally always runs ---
  - name: fullTryCatchFinally
    try:
      - name: failStep
        invoke:
          kind: JavaScript.Script
          code: |
            function main() { throw new Error("boom") }
    catch:
      - name: catchRan
        inputs:
          msg: "${{ error.message }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              msg:
                const: "boom"
    finally:
      - name: finallyRan
        inputs:
          x: 1
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              x:
                const: 1

  - name: verifyCatchRan
    inputs:
      result: "${{ steps.catchRan.result }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            const: true

  - name: verifyFinallyAfterCatch
    inputs:
      result: "${{ steps.finallyRan.result }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            const: true

  # --- try: when guard skips entire block ---
  - name: skippedTry
    when: "${{ false }}"
    try:
      # Would fail if reached.
      - name: tryShouldNotRun
        inputs:
          x: 1
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              x:
                const: 0

  # --- try/catch nested inside if ---
  - name: nestedTryCatch
    if: "${{ true }}"
    then:
      - name: innerTry
        try:
          - name: innerFail
            invoke:
              kind: JavaScript.Script
              code: |
                function main() { throw new Error("inner") }
        catch:
          - name: innerCaught
            inputs:
              msg: "${{ error.message }}"
            invoke:
              kind: Assert.Schema
              schema:
                type: object
                properties:
                  msg:
                    const: "inner"

  - name: verifyNestedCatch
    inputs:
      result: "${{ steps.innerCaught.result }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            const: true

  # --- rethrow of a plain error's code: must propagate INTERNAL_ERROR, not
  # fail with INVALID_THROW_STEP (the bug this guards against). ---
  - name: rethrowPlain
    try:
      - name: innerRethrow
        try:
          - name: plainFail
            invoke:
              kind: JavaScript.Script
              code: |
                function main() { throw new Error("deep") }
        catch:
          - name: reraise
            throw:
              code: "${{ error.code }}"
              message: "${{ error.message }}"
    catch:
      - name: caughtReraised
        inputs:
          code: "${{ error.code }}"
          msg: "${{ error.message }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code:
                const: "INTERNAL_ERROR"
              msg:
                const: "deep"
