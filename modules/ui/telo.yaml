kind: Telo.Definition
metadata:
  name: DateRangeField
  description: >-
    A form field entering a period from one date to another, with named
    presets — today, this week, last month, this quarter — computed in the
    viewer's time zone, an optional starting preset, and a warning for a range
    longer than a limit. A start after the end blocks submission.
capability: Telo.Invocable
extends: Self.Field
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#DateRangeFieldController]
schema:
  type: object
  additionalProperties: false
  required: [presets]
  properties:
    presets:
      title: Presets
      description: >-
        Ranges a press sets: the whole `unit` holding today, moved by `offset`
        units — `{ unit: month, offset: -1 }` is last month.
      type: array
      items:
        type: object
        additionalProperties: false
        required: [label, unit, offset]
        properties:
          label: { title: Label, $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
          unit: { title: Unit, enum: [day, week, month, quarter, year] }
          offset: { title: Offset, type: integer }
    weekStart:
      title: Week start
      description: The day a week begins on, for a `week` preset.
      enum: [monday, sunday]
      default: monday
    initialPreset:
      title: Initial preset
      description: >-
        The label of the preset the field starts at — its text as written —
        when the record, the address and the store hold nothing for it.
      type: string
    warnLongerThan:
      title: Warn longer than
      description: A length past which the range is shown a warning, without blocking.
      type: object
      additionalProperties: false
      required: [unit, count]
      properties:
        unit: { title: Unit, enum: [day, week, month, quarter, year] }
        count: { title: Count, type: integer, minimum: 1 }
  x-telo-resource-rules:
    - condition: !cel >-
        !has(self.initialPreset) || self.presets.exists(x,
          type(x.label) == string ? x.label == self.initialPreset : 'text' in x.label && x.label.text == self.initialPreset)
      code: UI_DATE_RANGE_PRESET_UNKNOWN
      message: >-
        starts at a preset it does not declare. Name the label of one of its
        `presets`, or remove `initialPreset`.
    - in: /presets
      condition: !cel "self.presets.exists_one(x, x.label == this.label)"
      code: UI_DATE_RANGE_PRESET_LABEL_DUPLICATE
      message: >-
        has the label of another preset. A preset is chosen by its label: give
        each its own.
  x-telo-referrer-rules:
    - referrer: Self.Form
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, (has(referrer.model.schema) ? referrer.model.schema : referrer.model),
          !has(m.properties) || !(self.property in m.properties)
          || cel.bind(p, m.properties[self.property],
             'type' in p && p.type == 'object' && 'properties' in p && type(p.properties) == map
             && size(p.properties) == 2 && 'from' in p.properties && 'to' in p.properties
             && [p.properties.from, p.properties.to].all(d,
                  type(d) == map && 'type' in d && d.type == 'string' && 'format' in d && d.format == 'date')))
      code: UI_DATE_RANGE_PROPERTY_INVALID
      message: >-
        enters a property that is not a date range: an object of exactly `from`
        and `to`, each `type: string` with `format: date`.
    - referrer: Self.Action
      resolve: [/inputModel]
      condition: !cel >-
        cel.bind(m, (has(referrer.inputModel.schema) ? referrer.inputModel.schema : referrer.inputModel),
          !has(m.properties) || !(self.property in m.properties)
          || cel.bind(p, m.properties[self.property],
             'type' in p && p.type == 'object' && 'properties' in p && type(p.properties) == map
             && size(p.properties) == 2 && 'from' in p.properties && 'to' in p.properties
             && [p.properties.from, p.properties.to].all(d,
                  type(d) == map && 'type' in d && d.type == 'string' && 'format' in d && d.format == 'date')))
      code: UI_DATE_RANGE_PROPERTY_INVALID
      message: >-
        enters a property that is not a date range: an object of exactly `from`
        and `to`, each `type: string` with `format: date`.
    - referrer: Self.Form
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, (has(referrer.model.schema) ? referrer.model.schema : referrer.model),
          !has(self.initialPreset) || !has(m.properties) || !(self.property in m.properties)
          || !('default' in m.properties[self.property]))
      code: UI_DATE_RANGE_DEFAULT_CONFLICT
      message: >-
        starts at a preset while the model gives the property a `default` too.
        Remove `initialPreset`, or the property's `default`.
    - referrer: Self.Action
      resolve: [/inputModel]
      condition: !cel >-
        cel.bind(m, (has(referrer.inputModel.schema) ? referrer.inputModel.schema : referrer.inputModel),
          !has(self.initialPreset) || !has(m.properties) || !(self.property in m.properties)
          || !('default' in m.properties[self.property]))
      code: UI_DATE_RANGE_DEFAULT_CONFLICT
      message: >-
        starts at a preset while the model gives the property a `default` too.
        Remove `initialPreset`, or the property's `default`.
---
# Where a field's options come from. Each option is a record of `model`, read
# as its `value`, its `label`, and an optional `hint` and `href`.
kind: Telo.Abstract
metadata:
  name: OptionSource
  description: >-
    Where the options of a choice or picker field come from: records read
    from an API, each offered as the value it yields, a label, an optional
    hint and an optional link. Provides what a renderer reads them with, so a
    source of options is declared once and used by any field.
capability: Telo.Provider
outputType: !ref OptionSourceSpec
schema:
  type: object
  required: [model, value, label]
  properties:
    model:
      title: Model
      description: The shape of one option's record.
      x-telo-ref: { kind: Telo.Type, use: schema }
    value:
      title: Value
      description: What choosing the option yields, as a path into the record.
      x-telo-eval: accessor
      x-telo-context:
        type: object
        properties: { row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor } }
    label:
      title: Label
      description: How the option is shown, as a path into the record or a fixed text.
      type: string
      x-telo-eval: accessor
      x-telo-context:
        type: object
        properties: { row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor } }
    hint:
      title: Hint
      description: Text shown beside the label.
      type: string
      x-telo-eval: accessor
      x-telo-context:
        type: object
        properties: { row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor } }
    href:
      title: Link
      description: Where the chosen option links to, an address over the record's `row`.
      $ref: "telo://Self/Address"
      x-telo-context:
        type: object
        properties: { row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor } }
---
kind: Telo.Definition
metadata:
  name: CollectionOptions
  description: >-
    Options read from a REST collection: paged as the list scrolls, searched
    as the viewer types with a filter the collection accepts, narrowed by
    fixed filters or by other values of the form, and a chosen value labelled
    by one lookup when its label is not in hand. A search or value the
    collection would refuse is caught before deploy.
capability: Telo.Provider
extends: Self.OptionSource
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#CollectionOptionsController]
schema:
  type: object
  additionalProperties: false
  required: [source]
  properties:
    source:
      title: Source
      description: >-
        Where the options are read from: `value` is filtered with `in`,
        `search` and every filter are filters its collection lists.
      x-telo-ref: { kind: Self.CollectionSource, use: dependency }
    filters:
      title: Filters
      description: >-
        Equalities applied to every request, keyed by model property: a fixed
        value, or a path into the form's `values`. While one holds nothing,
        nothing is read or offered; when one changes, the options are read
        again.
      type: object
      x-telo-context:
        type: object
        properties:
          values: { x-telo-context-from-referrer: values, x-telo-context-eval: accessor }
      additionalProperties:
        type: [string, number, integer, boolean]
        x-telo-eval: accessor
        x-telo-value-schema-from: { from: /model, member: "0#" }
    pageSize:
      title: Page size
      description: >-
        Options per request, sent as `limit`: a page as the list scrolls, and
        at most this many chosen values per label lookup.
      type: integer
      minimum: 1
      maximum: 100
      default: 25
    search:
      title: Search
      description: >-
        The filter what the viewer types is sent as, after a pause or at once
        on Enter. Omitted, the options are not searched.
      type: object
      additionalProperties: false
      required: [property, operator]
      properties:
        property: { title: Property, type: string }
        operator: { title: Operator, enum: [eq, contains, gt, gte, lt, lte, in] }
  x-telo-resource-rules:
    - resolve: [/model]
      in: /filters
      condition: !cel "has((has(self.model.schema) ? self.model.schema : self.model).properties) && key in (has(self.model.schema) ? self.model.schema : self.model).properties"
      code: UI_SOURCE_FILTER_UNKNOWN_PROPERTY
      message: >-
        filters its source by a property the option model does not declare.
        Use a property of `model`, or add this one to it.
    - resolve: [/source/collection]
      in: /filters
      condition: !cel >-
        !has(self.source.collection.query) || !has(self.source.collection.query.filters)
        || self.source.collection.query.filters.exists(f, f.property == key && f.operator == 'eq')
      code: UI_SOURCE_FILTER_NOT_ACCEPTED
      message: >-
        filters its source by a property the collection does not accept an
        equality on. Declare it with operator `eq` under the collection's
        `query.filters`, or remove this filter.
    - resolve: [/source/collection]
      condition: !cel >-
        !has(self.search) || !has(self.source.collection.query) || !has(self.source.collection.query.filters)
        || self.source.collection.query.filters.exists(f, f.property == self.search.property && f.operator == self.search.operator)
      code: UI_OPTION_SEARCH_NOT_ACCEPTED
      message: >-
        searches with a property and operator the collection does not accept.
        Declare the pair under the collection's `query.filters`, or change
        `search`.
    - resolve: [/source/collection]
      condition: !cel >-
        'root' in self.value && self.value.root == 'row' && size(self.value.path) == 1
        && (!has(self.source.collection.query) || !has(self.source.collection.query.filters)
            || self.source.collection.query.filters.exists(f, f.property == self.value.path[0] && f.operator == 'in'))
      code: UI_OPTION_VALUE_NOT_FILTERABLE
      message: >-
        yields a value no request can look options up by: `value` must be a
        property of the record, read as `row.<property>`, that the collection
        accepts with operator `in`, so a chosen value is labelled by one
        request.
---
kind: Telo.Definition
metadata:
  name: Component
  description: >-
    Places a custom browser component on a page or in a data grid cell, with the
    properties it is given: fixed values, or values read from the row it is
    drawn for. The properties are checked against what the component declares,
    so a missing or mistyped one is caught before the page is ever loaded.
capability: Telo.Provider
extends: Self.Composite
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ComponentController]
schema:
  type: object
  additionalProperties: false
  required: [component]
  properties:
    component:
      title: Component
      description: The component to draw.
      x-telo-ref: { kind: Self.ComponentExport, use: dependency }
    model:
      title: Model
      description: The shape of the row, for properties read from one.
      x-telo-ref: { kind: Telo.Type, use: schema }
    props:
      title: Properties
      description: What the component receives, by name.
      type: object
      x-telo-value-schema-from: "/component/props"
      x-telo-context:
        type: object
        properties: { row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor } }
      additionalProperties: { x-telo-eval: accessor }
---
kind: Telo.Definition
metadata:
  name: ComponentExport
  description: >-
    Publishes one browser component a module ships, so pages anywhere can place
    it: the module's browser entry, the name it is exported under, and the
    properties it accepts. Declared beside the code, which lets every use be
    checked against the declared properties.
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ComponentExportController]
schema:
  type: object
  additionalProperties: false
  required: [entry, export, props]
  properties:
    entry:
      title: Entry
      description: The specifier of one of the declaring module's browser entries.
      type: string
    export:
      title: Export
      description: The name the component is exported under.
      type: string
      x-telo-browser-export: { entry: /entry }
    props:
      title: Properties
      description: The properties the component accepts.
      x-telo-ref: { kind: Telo.Type, use: schema }
---
kind: Telo.Definition
metadata:
  name: DesignTokens
  description: >-
    Brand values for an interface, independent of how it is drawn: brand and
    status colours, corner radii, spacing steps, shadows, font sizes, line
    heights, the typefaces for body text, headings and code, and a page's
    width and inset. A closed set of
    names, so a misspelled token is an error rather than a style that silently
    does nothing; any look reads the same names.
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#DesignTokensController]
schema:
  type: object
  additionalProperties: false
  properties:
    color.background: { type: string }
    color.surface: { type: string }
    color.text: { type: string }
    color.muted: { type: string }
    color.border: { type: string }
    color.accent: { type: string }
    color.accent-text: { type: string }
    color.danger: { type: string }
    color.warning: { type: string }
    color.success: { type: string }
    radius.sm: { type: string }
    radius.md: { type: string }
    radius.lg: { type: string }
    space.xs: { type: string }
    space.sm: { type: string }
    space.md: { type: string }
    space.lg: { type: string }
    space.xl: { type: string }
    space.page:
      title: Page inset
      description: >-
        The inline space between the edge of the screen (or of the room beside
        the navigation) and a page's content, and the header's: a CSS length
        in `px` or `rem`, never `em`, which would resolve against each part's
        own font size.
      type: string
      pattern: "^(0|[0-9]+(\\.[0-9]+)?|\\.[0-9]+)(px|rem)$"
    shadow.sm: { type: string }
    shadow.md: { type: string }
    font.body: { x-telo-ref: { kind: Font.Family, use: dependency } }
    font.heading: { x-telo-ref: { kind: Font.Family, use: dependency } }
    font.mono: { x-telo-ref: { kind: Font.Family, use: dependency } }
    font-size.sm: { type: string }
    font-size.md: { type: string }
    font-size.lg: { type: string }
    font-size.xl: { type: string }
    line-height.body: { type: string }
    line-height.heading: { type: string }
    width.page:
      title: Page width
      description: >-
        The widest a contained page's content is drawn: a CSS length in `px`
        or `rem`, never `em`, which would resolve against each part's own font
        size.
      type: string
      pattern: "^(0|[0-9]+(\\.[0-9]+)?|\\.[0-9]+)(px|rem)$"
---
# The texts a renderer of this vocabulary shows of its own — loading, empty
# states, buttons, confirmations, each profile keyword's validation message, the
# date range's — by key, in English. A translation per language is shipped
# beside it (`translations/`).
kind: Telo.KeyedTranslations
metadata: { name: Translations }
keys:
  loading: { message: Loading…, description: Drawn while a read has not answered yet. }
  noRows:
    message: No rows.
    description: Drawn where a listing's records would be when it has none.
  nothingFound: { message: Nothing found., description: Drawn when a search finds no record. }
  save: Save
  cancel: Cancel
  close: Close
  newRecord:
    message: New
    description: The button opening the form that creates a record.
  edit: Edit
  delete: Delete
  deleteRowQuestion: { message: Delete this row?, description: Asks to confirm deleting a row. }
  deleteRowDetail:
    message: This cannot be undone.
    description: Under the question confirming a row's deletion.
  previousPage: Previous page
  pagerRange:
    message: "{$first}–{$last} of {$total}"
    values: { first: { type: integer }, last: { type: integer }, total: { type: integer } }
    description: "The pager's position: the first and last record shown, of how many."
  pagerEmpty:
    message: 0 of {$total}
    values: { total: { type: integer } }
    description: The pager when no record is shown.
  nextPage: Next page
  loadMore: { message: Load more, description: Appends the next page of records. }
  moveTo: { message: Move to, description: Opens the places a record can be moved to. }
  valueCount:
    message: "{$label} ({$count})"
    values: { label: { type: string }, count: { type: integer } }
    description: A value offered with how many records hold it.
  yes: "Yes"
  no: "No"
  none: None
  any: Any
  select: Select…
  choose: Choose…
  more: More
  menu: Menu
  siteNavigation:
    message: Site
    description: Names the site's navigation for assistive technology.
  collapseNavigation: Collapse navigation
  expandNavigation: Expand navigation
  search:
    message: Search {$label}
    values: { label: { type: string } }
    description: Searches the options of the labelled field.
  remove:
    message: Remove {$label}
    values: { label: { type: string } }
    description: Removes the labelled value or filter.
  clear:
    message: Clear {$label}
    values: { label: { type: string } }
    description: Clears the labelled field.
  filters: Filters
  addFilter: Add filter
  apply: Apply
  reset: Reset
  done: Done
  presets: Presets
  operatorEq: { message: is, description: "A filter's operator, before its value: equal to." }
  operatorContains:
    message: contains
    description: "A filter's operator, before its value: contains the text."
  operatorGt:
    message: after
    description: "A filter's operator, before its value: greater than."
  operatorGte:
    message: from
    description: "A filter's operator, before its value: greater than or equal to."
  operatorLt:
    message: before
    description: "A filter's operator, before its value: less than."
  operatorLte:
    message: to
    description: "A filter's operator, before its value: less than or equal to."
  operatorIn:
    message: one of
    description: "A filter's operator, before its values: any of them."
  operatorAbsent: { message: not set, description: "A filter's operator: the value is not set." }
  filterControl:
    message: "{$label} {$operator}"
    values: { label: { type: string }, operator: { type: string } }
    description: "A filter control's caption: the field and its operator."
  filterChip:
    message: "{$label} {$operator} {$value}"
    values: { label: { type: string }, operator: { type: string }, value: { type: string } }
    description: "A chosen filter: the field, its operator and its value."
  filterGroupSummary:
    message: "{$label}: {$summary}"
    values: { label: { type: string }, summary: { type: string } }
    description: "A group of filters folded into one line: the field and what is chosen."
  rangeFrom: { message: From, description: The start of a date range. }
  rangeTo: { message: To, description: The end of a date range. }
  rangeStartsAfterEnd:
    message: Must not start after it ends
    description: Under a date range whose start is after its end.
  rangeLongerThanDays:
    message:
      plural: count
      cases: { one: "Longer than {$count} day", other: "Longer than {$count} days" }
    values: { count: { type: integer } }
    description: Under a date range longer than its limit.
  rangeLongerThanWeeks:
    message:
      plural: count
      cases: { one: "Longer than {$count} week", other: "Longer than {$count} weeks" }
    values: { count: { type: integer } }
    description: Under a date range longer than its limit.
  rangeLongerThanMonths:
    message:
      plural: count
      cases: { one: "Longer than {$count} month", other: "Longer than {$count} months" }
    values: { count: { type: integer } }
    description: Under a date range longer than its limit.
  rangeLongerThanQuarters:
