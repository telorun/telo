kind: Telo.Library
metadata:
  name: NotesRepository
  version: 1.0.0
  description: |
    A reusable `Telo.Library` for a `notes` table: it owns the SQLite connection,
    the schema migration, and typed `SqlRepository` create/read resources, and
    exports them as ready-made singletons. Importers add `Migrate` to their
    `targets` and dispatch to `CreateNote` / `ListNotes` from their own routes —
    no hand-written SQL beyond the migration.
imports:
  Sql: oci://ghcr.io/telorun/sql@0.23.0#sha256-7OoJzJcGyUpfWe4u1c_4aBXB_isG21LaeN8sPmwfufI
  SQLite: oci://ghcr.io/telorun/sqlite@0.3.0#sha256-l33FRF4pw2ohB7HEnRd1NcX402er1kBS_YnC5W-Bg60
  SqlRepository: oci://ghcr.io/telorun/sql-repository@0.12.0#sha256-45lXhHhBS-iYFpsHpq-SBG60e0OOtY_VGfCnUOxSyRY
exports:
  resources:
    - migrate
    - createNote
    - listNotes
---
kind: SQLite.Connection
metadata:
  name: db
file: ./tmp/notes.sqlite
---
kind: SQLite.Table
metadata:
  name: notes
table: notes
columns:
  id: { type: integer, primaryKey: true, identity: always }
  title: { type: text, nullable: false }
  body: { type: text }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
tables:
  - !ref notes
---
kind: SqlRepository.Create
metadata:
  name: createNote
connection: !ref db
table: !ref notes
---
kind: SqlRepository.Read
metadata:
  name: listNotes
connection: !ref db
table: !ref notes
