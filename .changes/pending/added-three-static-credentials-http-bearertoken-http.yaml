modules:
  modules/http-client: Added
body: "Three static credentials — `Http.BearerToken`, `Http.ApiKeyHeader` and
  `Http.QueryKey`. `Http.Credential` had exactly one implementation, OAuth's, which is
  why every module talking to a keyed API grew its own `apiKey` field: a second way to
  say the same thing, and a second place for the 401 re-acquire-and-retry not to happen.
  A static credential answers `forceRefresh` with the same material, which the abstract
  already anticipates. Material that resolved to nothing is refused at the credential
  rather than sent and answered 401, one indirection from the line that has to change."
