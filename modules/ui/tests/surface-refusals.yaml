h a type, or name a field kind that enters it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Action/actionRequiredNotEntered: leaves a property the input model requires with no field, so a valid record could never be sent. List a field for every required property, or leave `fields` out where each one is a scalar or a list of scalars." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Action/actionRequiredNotEnterable: leaves a property the input model requires with no field, so a valid record could never be sent. List a field for every required property, or leave `fields` out where each one is a scalar or a list of scalars." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Action/actionClearUnknown at 'clearAnswerOn[1]': clears its answer on a property the input model does not declare, which never changes. Use a property of `inputModel`, or remove this entry." }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Listing/rowActionInputs: inputs at 'rowActions[0].inputs' do not satisfy remove's declared inputType: / is missing required property 'count'" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Listing/rowActionInputs: inputs at 'rowActions[0].inputs' do not satisfy remove's declared inputType: / must NOT have additional properties ('total' is not allowed)" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Listing/rowActionInputs: inputs at 'rowActions[0].inputs.note' do not satisfy remove's declared inputType: /note must be string" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Data/listRowActionInputs: inputs at 'content.rowActions[0].inputs' do not satisfy remove's declared inputType: / is missing required property 'count'" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Data/listRowActionInputs: inputs at 'content.rowActions[0].inputs' do not satisfy remove's declared inputType: / must NOT have additional properties ('total' is not allowed)" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Data/listRowActionInputs: inputs at 'content.rowActions[0].input