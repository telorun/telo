# An application with no translations: it serves English only, so its
# responses carry no Content-Language and no Vary.
kind: Telo.Application
metadata: { name: UiEnglishFixtureApp, version: 1.0.0 }
requires: { telo: ">=0.129.0" }
lang: en
imports: { Http: ../../../../http-server, Ui: ../../../../ui, UiReact: ../../../ }
ports: { http: { env: PORT, default: 8134 } }
targets: [!ref server]
---
kind: Http.Server
metadata: { name: server }
listen: { address: 127.0.0.1, port: !cel "ports.http" }
mounts:
  - path: /
    mount:
      kind: UiReact.App
      title: Invoices
      theme: !ref UiReact.defaultTheme
      pages:
        - kind: Ui.Page
          path: /
          title: Invoices
          children:
            - { type: text, text: Unpaid invoices }
