# What the engine returns: each result's title, URL and `content` as the snippet
# ("" when absent), in rank order. `published_date`, an HTTP-date (or an ISO 8601
# date-time), is read as an instant; a null or unreadable one — an unknown month
# included — is left out rather than failing the call. A
# result without a URL is dropped, and a URL is returned exactly as reported.
kind: Telo.Application
metadata:
  name: TavilyResultMappingTest
  version: 1.0.0
imports:
  Tavily: ..
  Http: ../../http-client
  Server: ../../http-server
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref resultMapping
---
kind: Tavily.WebSearchEngine
metadata: { name: engine }
request:
  kind: Http.Request
  client: { kind: Http.Client, baseUrl: "http://localhost:18859" }
---
kind: Run.Value
metadata: { name: canned }
value:
  query: dates
  results:
    - { title: Dated, url: "https://a.example/", content: dated, score: 0.9, published_date: "Tue, 11 Mar 2025 17:00:00 GMT" }
    - { title: Absent, url: "https://b.example/", published_date: null }
    - { title: Iso, url: "https://c.example/", content: iso, published_date: "2025-03-11T17:00:00Z" }
    - { title: Impossible, url: "https://d.example/", content: impossible, published_date: "Tue, 11 Foo 2025 17:00:00 GMT" }
    - { url: "https://e.example/", content: untitled }
    - { title: IRI, url: "https://de.wikipedia.org/wiki/Straße", content: iri }
    - { title: Space, url: "https://example.com/a b", content: space }
    - { title: No URL, content: dropped }
---
kind: Run.Sequence
metadata: { name: resultMapping }
with:
  - kind: Server.Api
    metadata: { name: FakeTavily }
    routes:
      - request:
          path: /search
          method: POST
          schema:
            body: { type: object, additionalProperties: true }
        handler: !ref canned
        returns:
          - status: 200
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel "result"
  - kind: Server.Server
    metadata: { name: FakeServer }
    port: 18859
    mounts:
      - path: /
        mount: !ref FakeTavily
targets:
  - !ref FakeServer
steps:
  - name: dates
    invoke: !ref engine
    inputs: { query: dates }
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      # Instants compared as their RFC 3339 text.
      actual: !cel >-
        {'results': steps.dates.result.results.map(r, has(r.publishedAt)
            ? {'title': r.title, 'url': r.url, 'snippet': r.snippet, 'publishedAt': string(r.publishedAt)}
            : {'title': r.title, 'url': r.url, 'snippet': r.snippet}),
         'more': has(steps.dates.result.nextCursor)}
      expected:
        results:
          - { title: Dated, url: "https://a.example/", snippet: dated, publishedAt: "2025-03-11T17:00:00.000Z" }
          - { title: Absent, url: "https://b.example/", snippet: "" }
          - { title: Iso, url: "https://c.example/", snippet: iso, publishedAt: "2025-03-11T17:00:00.000Z" }
          - { title: Impossible, url: "https://d.example/", snippet: impossible }
          - { title: "", url: "https://e.example/", snippet: untitled }
          - { title: IRI, url: "https://de.wikipedia.org/wiki/Straße", snippet: iri }
          - { title: Space, url: "https://example.com/a b", snippet: space }
        more: false
