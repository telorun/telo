modules:
  modules/http-server: Added
body: "Every request is one span opened by Http.Server before CORS, a mount's guard and
  body parsing, named '<METHOD> <route>' with http.request.method, http.route and
  http.response.status_code, ending when the response completes (streamed and hijacked
  replies included) as ok, rejected, failed or cancelled. The guard, content-type
  parsers, route handlers, the not-found handler and MCP tool calls all run on its
  context, so a client disconnect cancels the guard as well as the handler. A request
  carrying a W3C traceparent continues the caller's trace. Breaking: Http.Api no longer
  opens a span of its own, and the mount contract is register(app, prefix,
  requestScope); Http.Api refuses a request when registered without a scope
  (ERR_HTTP_REQUEST_SCOPE_MISSING). Requires telo >=0.104.0."
