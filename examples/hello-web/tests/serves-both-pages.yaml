kind: Telo.Application
metadata:
  name: HelloWebExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/hello-web` unmodified on a port of this test's own and reads the
    UI documents of both of its pages.
imports:
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    ports: { http: 8851 }
targets:
  - !ref app
steps:
  - name: shell
    invoke: { kind: HttpClient.Request, url: "http://127.0.0.1:8851/", method: GET, responseType: text }
  - name: app
    invoke: { kind: HttpClient.Request, method: GET }
    inputs: { url: "http://127.0.0.1:8851/_telo/ui/app" }
  - name: home
    invoke: { kind: HttpClient.Request, method: GET }
    inputs: { url: "http://127.0.0.1:8851/_telo/ui/page", query: { path: / } }
  - name: settings
    invoke: { kind: HttpClient.Request, method: GET }
    inputs: { url: "http://127.0.0.1:8851/_telo/ui/page", query: { path: /settings } }
  - name: verifyPages
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        shell: !cel "steps.shell.result.status"
        title: !cel "steps.app.result.body.title"
        navigation: !cel "steps.app.result.body.navigation.items.map(i, i.path)"
        home: !cel "steps.home.result.body.children.map(c, c.type)"
        homeHeading: !cel "steps.home.result.body.children[0].text"
        settings: !cel "steps.settings.result.body.children.map(c, c.type)"
        settingsHeading: !cel "steps.settings.result.body.children[0].text"
      expected:
        shell: 200
        title: { lang: en, message: [Hello] }
        navigation: [/, /settings]
        home: [text, text, link]
        homeHeading: { lang: en, message: ["Hello, world!"] }
        settings: [text, text]
        settingsHeading: { lang: en, message: [Settings] }
