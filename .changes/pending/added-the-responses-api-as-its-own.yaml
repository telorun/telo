modules:
  modules/openai: Added
body: "`OpenAI.ResponsesModel` and `OpenAI.ResponsesModelStream` — OpenAI's `/v1/responses`
  API, buffered and streaming, carrying a `reasoning` block (`effort`, `summary`).
  `/chat/completions` refuses a non-`none` reasoning effort alongside function tools, so
  an agent — which is nothing but tools — could only run with reasoning off; these kinds
  are how a reasoning model drives a tool loop. The encrypted reasoning comes back as the
  contract's `providerState`, is replayed on the next turn spliced ahead of the calls it
  reasoned about, and is tagged with the model and dialect that produced it, so a
  transcript moved elsewhere is dropped rather than sent on. Separate kinds rather than a
  dialect flag on the existing pair: the two APIs share a vendor and little else —
  `input` items against `messages`, `instructions` against a system role, flat tools
  against nested ones, an `output` array against `choices`, named `response.*` events
  against `[DONE]`-terminated chunks — so under one kind `reasoning` would be a field that
  is sometimes a hard 400. The completions pair stays the portable one: almost no
  OpenAI-compatible endpoint serves `/v1/responses`. Covered offline by a whole-request
  assertion and a recorded stream transcript, and live against the real endpoint on both
  paths. A failed run raises rather than reporting a finish reason, on both halves, and
  a stream whose bytes stop with no terminal event is reported as interrupted rather than
  as a clean stop with zero usage."
