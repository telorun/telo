          # the SHA-pinned URL 404s for a short while. Poll until it serves.
          for attempt in $(seq 1 30); do
            if curl -fsSL "$URL" >/dev/null 2>&1; then
              break
            fi
            echo "URL not available yet (attempt $attempt), sleeping 10s..."
            sleep 10
          done
          set +e
          output=$(pnpm run telo "$URL" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "telo exited with status $status"
            exit "$status"
          fi
          echo "$output" | grep -q "Hello from Telo!"

      # Example, starter and blueprint tests import the working copy's modules by
      # relative path, so a breaking module change fails the PR that caused it.
      - name: Run the example test suites (Node)
        if: needs.select.outputs.suites == 'true'
        run: pnpm run telo:node ./examples/test-suite.yaml

      - name: Run the starter test suites (Node)
        if: needs.select.outputs.suites == 'true'
        run: pnpm run telo:node ./starters/test-suite.yaml

      - name: Run the blueprint test suites (Node)
        if: needs.select.outputs.suites == 'true'
        run: pnpm run telo:node ./blueprints/test-suite.yaml

      - name: Save staged module files
        if: always() && steps.staged.outputs.key != '' && steps.staged.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-staged-files
        with:
          key: ${{ steps.staged.outputs.key }}
          paths: ${{ steps.staged.outputs.paths }}

  docker:
    name: "Linux: manifest tests (Docker)"
    runs-on: ubuntu-latest
    needs: select
