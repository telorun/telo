kind: Telo.Library
metadata:
  name: Run
  version: 0.22.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Compute]
  description: >-
    Control flow for manifests: ordered sequences of steps with conditionals, loops,
    switches and error handling; iteration and mapping over collections at a chosen
    concurrency; first-match decision tables; pure value shaping with CEL; and
    background dispatch that returns without waiting.
exports:
  kinds:
    - Sequence
    - Value
    - Choice
    - Loop
    - Iteration
    - Projection
    - Detach
---
kind: Telo.Definition
metadata:
  name: Sequence
  description: Runs an ordered list of steps — invoke, if, while, switch, try, throw — over a typed inputs/outputs contract.
capability: Telo.Runnable
topology: Sequence
controllers:
  - pkg:telo/local/js?path=./nodejs/sequence.mjs&local_path=./nodejs/src/sequence.ts
throws:
  inherit: true
schema:
  type: object
  $defs:
    step:
      title: Step
      description: Single executable step or control-flow block.
      type: object
      properties:
        name:
          title: Name
          description: Unique step name.
          type: string
      oneOf:
        - title: invoke
          description: Invokes an invocable or runnable resource.
          properties:
            invoke:
              title: Invoke
              description: Resource to invoke for this step.
              x-telo-topology-role: invoke
              # A reference is always an object (a `!ref` sentinel or its resolved
              # `{kind, name}`); requiring an object rejects a bare-string ref —
              # which `validateReferenceForms` cannot catch at this nested slot —
              # at `telo check` instead of as an obscure runtime failure.
              type: object
              x-telo-ref:
                kind: Telo.Executable
                use: call
                inputs: /inputs
            inputs:
              title: Inputs
              description: Inputs passed to the invoked resource.
              x-telo-topology-role: inputs
              type: object
              additionalProperties: true
            retry:
              title: Retry
              description: Retry policy for step invocation.
              type: object
              properties:
                attempts:
                  title: Attempts
                  description: Maximum retry attempts.
                  type: integer
                delay:
                  title: Delay
                  description: Delay between retries.
                  type: string
          required:
            - invoke

        - title: if/then/else
          description: Conditional branch; executes then or else based on a boolean expression.
          properties:
            if:
              title: If
              description: CEL boolean expression; true executes then, false executes else.
              x-telo-topology-role: predicate
              type: boolean
            elseif:
              title: Else If
              description: Additional condition-branch pairs evaluated when if is false.
              x-telo-topology-role: branch-list
              type: array
              items:
                type: object
                properties:
                  if:
                    title: If
                    description: CEL boolean expression for this else-if branch.
                    x-telo-topology-role: predicate
                    type: boolean
                  then:
                    title: Then
                    description: Steps executed when this else-if condition is true.
                    x-telo-topology-role: branch
                    type: array
                    items:
                      $ref: "#/$defs/step"
                required:
                  - if
                  - then
            then:
              title: Then
              description: Steps executed when if evaluates true.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/step"
            else:
              title: Else
              description: Steps executed when if (and all elseif conditions) evaluate false.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/step"
          required:
            - if
            - then

        - title: while/do
          description: Loop; executes do steps repeatedly while condition is true.
          properties:
            while:
              title: While
              description: CEL boolean expression; evaluated before each iteration.
              x-telo-topology-role: predicate
              type: boolean
            do:
              title: Do
              description: Steps executed on each iteration.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/step"
          required:
            - while
            - do

        - title: switch/cases/default
          description: Multi-branch dispatch; matches a value expression against case keys.
          properties:
            switch:
              title: Switch
              description: CEL expression; result matched against case keys.
              x-telo-topology-role: discriminator
              type: string
            cases:
              title: Cases
              description: Map of value to step list; executed when switch matches the key.
              x-telo-topology-role: case-map
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: "#/$defs/step"
            default:
              title: Default
              description: Steps executed when no case matches.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/step"
          required:
            - switch
            - cases

        - title: try/catch/finally
          description: Error boundary; executes try steps and handles failure via catch and finally.
          properties:
            try:
              title: Try
              description: Steps executed; halts on first failure and jumps to catch.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/step"
            catch:
              title: Catch
              description: Steps executed when try fails; receives error context.
              x-telo-topology-role: branch
              x-telo-error-context:
                type: object
                description: The caught failure (always present inside catch).
                properties: &errorContextProps
                  code:
                    description: Structured error code; INTERNAL_ERROR for plain errors.
                    type: string
                  message:
                    description: Human-readable error message.
                    type: string
                  step:
                    description: Name of the step that threw.
                    type: string
                  data:
                    description: Structured payload from an InvokeError, else undefined.
                additionalProperties: false
              type: array
              items:
                $ref: "#/$defs/step"
            finally:
              title: Finally
              description: Steps always executed after try/catch regardless of outcome.
              x-telo-topology-role: branch
              # error is null on the success path and the caught failure when a
              # try/catch failure propagates (see executeTryStep). Typed nullable
              # so the analyzer flags unguarded field access (CEL_NULLABLE_ACCESS).
              x-telo-error-context:
                type: ["object", "null"]
                description: The caught failure, or null when try (and catch) succeeded.
                properties: *errorContextProps
                additionalProperties: false
              type: array
              items:
                $ref: "#/$defs/step"
          required:
            - try

        - title: throw
          description: >-
            Throws an InvokeError unconditionally. Works inside catch blocks via CEL
            (e.g. code set to `!cel "error.code"`).
          properties:
            throw:
              title: Throw
              description: InvokeError descriptor; code is required, message/data optional.
              type: object
              properties:
                code:
                  title: Code
                  description: Structured error code; uppercase SNAKE_CASE by convention.
                  type: string
                message:
                  title: Message
                  description: Human-readable error message. Defaults to `code` when omitted.
                  type: string
                data:
                  title: Data
                  description: Optional structured payload attached to the error.
              required:
                - code
          required:
            - throw

        - title: value
          description: >-
            Computes a value and publishes it as `steps.<name>.result`, with no
            dispatch — no resource, no span, no topology node. For an
            intermediate derived from an earlier step: reshape a response,
            total some rows, build the next call's inputs.
          properties:
            value:
              title: Value
              description: >-
                A CEL expression — or a structure (map / array) with `!cel`
                leaves — evaluated in the step scope: `inputs`, the results of
                the steps before it, and whatever the enclosing kind binds
                (`item` / `index` / `items`, `iteration` / `previous`).
          required:
            - value
      required:
        - name

  properties:
    with:
      title: With
      # Visibility covers both `/steps` (where steps reference with-resources)
      # and `/targets` (the run-before-steps references), so a `!ref` in either
      # resolves against the scoped resources.
      x-telo-scope: [ "/steps", "/targets" ]
      description: Resources available during sequence execution; torn down when done
    targets:
      title: Targets
      type: array
      description: with-resources to run() before executing steps; torn down when done. Reference each with a `!ref <name>`.
      items:
        title: Target
        description: A with-resource to run before steps — write it as a `!ref`.
        x-telo-ref:
          kind: [Telo.Runnable, Telo.Service]
          use: call
        # Structural constraint alongside the annotation, mirroring the builtin
        # Application `targets` items: admit the `!ref` string and the resolved
        # `{kind, name}` shape so AJV doesn't reject a resolved ref.
        anyOf:
          - type: string
          - type: object
            required: [kind, name]
            properties:
              kind: { type: string }
              name: { type: string }
            additionalProperties: true
    inputType:
      title: Input Type
      description: >-
        The sequence's input contract — a named type reference or an inline type definition. Callers supply values at invoke
        time and the body reads them as `!cel "inputs.<name>"`. The kernel binds
        this contract to the resource: declared defaults are filled and every
        call is validated against it before dispatch.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    outputType:
      title: Output Type
      description: >-
        The result contract — a named type reference or an inline type definition. Declaring it types
        `steps.<name>.result` for callers, has every result slot checked
        statically by `x-telo-value-schema-from`, and has the produced value
        validated at dispatch.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    outputs:
      title: Outputs
      type: object
      description: >-
        A CEL map (key → `!cel` expression) evaluated over `steps.*` and
        `inputs.*` after the steps run. Its value becomes the sequence's
        `result` — what a caller sees, e.g. an `Http.Api` route's `returns:`.
        Omit it to return the raw step-results map.
      additionalProperties: true
      x-telo-context:
        type: object
        properties:
          inputs: {}
      x-telo-value-schema-from: outputType
    steps:
      title: Steps
      description: Ordered sequence of steps to execute.
      x-telo-topology-role: steps
      type: array
      x-telo-step-context:
        invoke: invoke
        outputType: outputType
        value: value
      items:
        $ref: "#/$defs/step"
  required:
    - steps
  examples:
    - inputType:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [userId]
          properties:
            userId: {}
            limit: { type: integer }
      steps:
        - name: fetchUser
          invoke: !ref GetUser
          inputs:
            bindings:
              - !cel "inputs.userId"
        - name: count
          invoke: !ref CountPosts
          inputs:
            bindings:
              - !cel "inputs.userId"
              - !cel "inputs.limit"
      outputs:
        name: !cel "steps.fetchUser.result.rows[0].name"
        postCount: !cel "steps.count.result.rows[0].n"
---
kind: Telo.Definition
metadata:
  name: Value
  description: Evaluates a CEL expression over typed inputs and returns the shaped value — a declarative value-only script.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/value.mjs&local_path=./nodejs/src/value.ts
schema:
  type: object
  properties:
    inputType:
      title: Input Type
      description: >-
        The value's input contract — a named type reference or an inline type definition. Callers supply values at invoke
        time and the body reads them as `!cel "inputs.<name>"`. The kernel binds
        this contract to the resource: declared defaults are filled and every
        call is validated against it before dispatch.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    outputType:
      title: Output Type
      description: >-
        The result contract — a named type reference or an inline type definition. Declaring it types
        `steps.<name>.result` for callers, has every result slot checked
        statically by `x-telo-value-schema-from`, and has the produced value
        validated at dispatch.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    bindings:
      title: Bindings
      description: >-
        Named intermediate values, read by bare name inside the expressions
        below and by each other. Evaluation order is derived from what each one
        references — declaration order carries no meaning — and each is computed
        at most once per call, only if something reads it. A name already in
        scope (`inputs`, a kernel global) is rejected by `telo check`.
      type: object
      additionalProperties: true
      # The name IS the interface — bindings are read bare in CEL — so a name
      # that does not lex as an identifier could never be referenced.
      propertyNames:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      x-telo-context:
        type: object
        x-telo-bindings-from: bindings
        properties:
          inputs:
            type: object
            x-telo-context-from: "inputType"
    value:
      title: Value
      description: >-
        A CEL expression — or a structure (map / array) with `!cel` leaves —
        evaluated at invoke time over `inputs` and `bindings`. Its result becomes the
        resource's invoke result and may be any shape (object, array, scalar).
        The declarative replacement for a `Js.Script` that only shapes a value
        (concat, field mapping, a constant literal) with no I/O or branching.
      x-telo-context:
        type: object
        x-telo-bindings-from: bindings
        properties:
          inputs:
            type: object
            x-telo-context-from: "inputType"
      x-telo-value-schema-from: outputType
  required:
    - value
  examples:
    - inputType:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [a, b]
          properties:
            a: { type: number }
            b: { type: number }
      value:
        product: !cel "inputs.a * inputs.b"
    - value:
        - { type: text, text: page rendered }
        - { type: image, data: aGVsbG8=, mediaType: image/png }
---
# Run.Choice — a first-match decision table. Rows are evaluated in manifest
# order; the first `when` that is true contributes its `value` as the invoke
# result. Where Run.Value shapes ONE value (branching only via nested CEL
# ternaries, unreadable past two arms) and Run.Sequence's `switch` matches
# equality keys, Choice takes arbitrary predicates and stays a pure value — no
# steps, no side effects. Declare `outputType` to give every row one shared
# result contract and to type `steps.<name>.result` for callers.
kind: Telo.Definition
metadata:
  name: Choice
  description: First-match decision table — returns the value of the first choice whose predicate holds, or a declared default.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/choice.mjs&local_path=./nodejs/src/choice.ts
throws:
  codes:
    ERR_NO_MATCH:
      description: No choice matched and no `default` is declared.
    ERR_INVALID_PREDICATE:
      description: A choice's `when` evaluated to something other than a boolean.
    # A row whose `value` does not satisfy `outputType` raises the kernel's
    # ambient ERR_OUTPUT_INVALID — the contract is enforced once, where every
    # kind's is. It stays catchable by name; it is simply not this kind's to
    # declare.
schema:
  type: object
  additionalProperties: false
  required:
    - choices
  properties:
    inputType:
      title: Input Type
      description: >-
        The decision table's input contract — a named type reference or an inline type definition. Callers supply values at invoke
        time and the body reads them as `!cel "inputs.<name>"`. The kernel binds
        this contract to the resource: declared defaults are filled and every
        call is validated against it before dispatch.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    outputType:
      title: Output Type
      description: >-
        Named type reference or inline type definition every row's `value` must
        satisfy. Optional; declaring it is what gives the table one shared
        result contract and lets a caller's `steps.<name>.result` type-check.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    bindings:
      title: Bindings
      description: >-
        Named intermediate values, read by bare name inside the expressions
        below and by each other. Evaluation order is derived from what each one
        references — declaration order carries no meaning — and each is computed
        at most once per call, only if something reads it. A name already in
        scope (`inputs`, a kernel global) is rejected by `telo check`.
      type: object
      additionalProperties: true
      # The name IS the interface — bindings are read bare in CEL — so a name
      # that does not lex as an identifier could never be referenced.
      propertyNames:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      x-telo-context:
        type: object
        x-telo-bindings-from: bindings
        properties:
          inputs:
            type: object
            x-telo-context-from: "inputType"
    choices:
      title: Choices
      description: >-
        Ordered decision rows. The FIRST row whose `when` is true wins —
        manifest order is the priority — and no later row is evaluated.
      type: array
      minItems: 1
      # Anchored on the array (not its items) so the annotation resolves
      # `inputs` against the resource root rather than an individual row.
      x-telo-context:
        type: object
        x-telo-bindings-from: bindings
        properties:
          inputs:
            type: object
            x-telo-context-from: "inputType"
      items:
        title: Choice
        type: object
        additionalProperties: false
        required:
          - when
          - value
        properties:
          when:
            title: When
            type: boolean
            description: >-
              CEL predicate over `inputs`. Must evaluate to a boolean — a
              truthy string or number is an authoring mistake in a decision
              table, not a match, and is reported as ERR_INVALID_PREDICATE.
          value:
            title: Value
            description: >-
              A CEL expression — or a structure (map / array) with `!cel`
              leaves — evaluated over `inputs` when this row wins. Its result
              becomes the resource's invoke result. Checked against `outputType`
              at analysis time when one is declared, so a row that disagrees
              with the table's contract is caught before it ever wins.
            x-telo-value-schema-from: outputType
    default:
      title: Default
      description: >-
        Value produced when no row matches. Omit it to make a non-exhaustive
        table an error (ERR_NO_MATCH) instead of a silent null.
      type: object
      additionalProperties: false
      required:
        - value
      x-telo-context:
        type: object
        x-telo-bindings-from: bindings
        properties:
          inputs:
            type: object
            x-telo-context-from: "inputType"
      properties:
        value:
          title: Value
          description: The fallback value, evaluated over `inputs` like a row's `value`.
          x-telo-value-schema-from: outputType
  examples:
    - inputType:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [order]
          properties:
            order: {}
      choices:
        - when: !cel "inputs.order.total >= 100"
          value:
            tier: free
            cost: 0
        - when: !cel "inputs.order.weight > 20"
          value:
            tier: freight
            cost: !cel "inputs.order.weight * 2"
      default:
        value:
          tier: standard
          cost: 10
---
kind: Telo.Definition
metadata:
  name: Iteration
  description: Runs a step body once per collection element with configurable concurrency and whole-operation error catches.
capability: Telo.Runnable
controllers:
  - pkg:telo/local/js?path=./nodejs/iteration.mjs&local_path=./nodejs/src/iteration.ts
throws:
  inherit: true
schema:
  type: object
  $defs:
    bodyStep:
      title: Step
      description: Single executable step or control-flow block. No while block — the kind is itself the loop.
      type: object
      properties:
        name:
          title: Name
          description: Unique step name.
          type: string
      oneOf:
        - title: invoke
          description: Invokes an invocable or runnable resource.
          properties:
            invoke:
              title: Invoke
              description: Resource to invoke for this step.
              x-telo-topology-role: invoke
              type: object
              x-telo-ref:
                kind: Telo.Executable
                use: call
                inputs: /inputs
            inputs:
              title: Inputs
              description: Inputs passed to the invoked resource.
              x-telo-topology-role: inputs
              type: object
              additionalProperties: true
            retry:
              title: Retry
              description: Retry policy for step invocation.
              type: object
              properties:
                attempts:
                  title: Attempts
                  description: Maximum retry attempts.
                  type: integer
                delay:
                  title: Delay
                  description: Delay between retries.
                  type: string
          required:
            - invoke
        - title: if/then/else
          description: Conditional branch; executes then or else based on a boolean expression.
          properties:
            if:
              title: If
              description: CEL boolean expression; true executes then, false executes else.
              x-telo-topology-role: predicate
              type: boolean
            elseif:
              title: Else If
              description: Additional condition-branch pairs evaluated when if is false.
              x-telo-topology-role: branch-list
              type: array
              items:
                type: object
                properties:
                  if:
                    title: If
                    description: CEL boolean expression for this else-if branch.
                    x-telo-topology-role: predicate
                    type: boolean
                  then:
                    title: Then
                    description: Steps executed when this else-if condition is true.
                    x-telo-topology-role: branch
                    type: array
                    items:
                      $ref: "#/$defs/bodyStep"
                required:
                  - if
                  - then
            then:
              title: Then
              description: Steps executed when if evaluates true.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/bodyStep"
            else:
              title: Else
              description: Steps executed when if (and all elseif conditions) evaluate false.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/bodyStep"
          required:
            - if
            - then
        - title: switch/cases/default
          description: Multi-branch dispatch; matches a value expression against case keys.
          properties:
            switch:
              title: Switch
              description: CEL expression; result matched against case keys.
              x-telo-topology-role: discriminator
              type: string
            cases:
              title: Cases
              description: Map of value to step list; executed when switch matches the key.
              x-telo-topology-role: case-map
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: "#/$defs/bodyStep"
            default:
              title: Default
              description: Steps executed when no case matches.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/bodyStep"
          required:
            - switch
            - cases
        - title: try/catch/finally
          description: Error boundary; executes try steps and handles failure via catch and finally.
          properties:
            try:
              title: Try
              description: Steps executed; halts on first failure and jumps to catch.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/bodyStep"
            catch:
              title: Catch
              description: Steps executed when try fails; receives error context.
              x-telo-topology-role: branch
              x-telo-error-context:
                type: object
                description: The caught failure (always present inside catch).
                properties: &iterationErrorProps
                  code:
                    description: Structured error code; INTERNAL_ERROR for plain errors.
                    type: string
                  message:
                    description: Human-readable error message.
                    type: string
                  step:
                    description: Name of the step that threw.
                    type: string
                  data:
                    description: Structured payload from an InvokeError, else undefined.
                additionalProperties: false
              type: array
              items:
                $ref: "#/$defs/bodyStep"
            finally:
              title: Finally
              description: Steps always executed after try/catch regardless of outcome.
              x-telo-topology-role: branch
              x-telo-error-context:
                type: ["object", "null"]
                description: The caught failure, or null when try (and catch) succeeded.
                properties: *iterationErrorProps
                additionalProperties: false
              type: array
              items:
                $ref: "#/$defs/bodyStep"
          required:
            - try
        - title: throw
          description: Throws an InvokeError unconditionally.
          properties:
            throw:
              title: Throw
              description: InvokeError descriptor; code is required, message/data optional.
              type: object
              properties:
                code:
                  title: Code
                  description: Structured error code; uppercase SNAKE_CASE by convention.
                  type: string
                message:
                  title: Message
                  description: Human-readable error message. Defaults to code when omitted.
                  type: string
                data:
                  title: Data
                  description: Optional structured payload attached to the error.
              required:
                - code
          required:
            - throw

        - title: value
          description: >-
            Computes a value and publishes it as `steps.<name>.result`, with no
            dispatch — no resource, no span, no topology node. For an
            intermediate derived from an earlier step: reshape a response,
            total some rows, build the next call's inputs.
          properties:
            value:
              title: Value
              description: >-
                A CEL expression — or a structure (map / array) with `!cel`
                leaves — evaluated in the step scope: `inputs`, the results of
                the steps before it, and whatever the enclosing kind binds
                (`item` / `index` / `items`, `iteration` / `previous`).
          required:
            - value
      required:
        - name
  properties:
    inputType:
      title: Input Type
      description: >-
        The iteration's input contract — a named type reference or an inline type definition. Callers supply values at invoke
        time and the body reads them as `!cel "inputs.<name>"`. The kernel binds
        this contract to the resource: declared defaults are filled and every
        call is validated against it before dispatch.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    outputType:
      title: Output Type
      description: >-
        The result contract — a named type reference or an inline type definition. Declaring it types
        `steps.<name>.result` for callers, has every result slot checked
        statically by `x-telo-value-schema-from`, and has the produced value
        validated at dispatch.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    collection:
      title: Collection
      description: >-
        CEL expression resolving to the array or stream iterated over. A stream is
        pulled lazily, one element at a time per worker, so a source too large to
        hold in memory can still be iterated; `items` is then not in scope (see
        `steps`). `anyOf` rather than `oneOf`: a reader that does not know
        `x-telo-type` sees the stream branch as an empty schema matching anything,
        so under `oneOf` an array would match both branches and fail.
      anyOf:
        - type: array
        - x-telo-type: Telo.Stream
      x-telo-context:
        type: object
        properties:
          inputs: {}
    concurrency:
      title: Concurrency
      description: >-
        CEL integer resolving to the maximum number of elements processed at once;
        1 (default) runs strictly ordered. Sees inputs.
      type: integer
      minimum: 1
      default: 1
      x-telo-context:
        type: object
        properties:
          inputs: {}
    catches:
      title: Catches
      description: >-
        Whole-operation error contract. Maps a throw that escapes the entire
        iteration to a fallback result; an unmatched throw propagates (fail-fast).
      x-telo-error-context:
        type: object
        description: The escaped failure (sees error and inputs).
        properties: *iterationErrorProps
        additionalProperties: false
      x-telo-context:
        type: object
        properties:
          inputs: {}
      type: array
      items:
        title: Catch Entry
        type: object
        properties:
          when:
            title: When
            description: CEL condition selecting this entry (sees error and inputs).
            type: boolean
          value:
            title: Value
            description: Fallback result returned when this entry matches.
    steps:
      title: Steps
      description: >-
        Body run once per element of collection. Sees item and index, plus items
        (the whole collection) when the collection is an array — a stream has no
        materialized collection to expose, and re-exposing the cursor this loop
        pulls from would let a step drain it and end the iteration early.
      x-telo-topology-role: steps
      x-telo-step-context:
        invoke: invoke
        outputType: outputType
        value: value
      x-telo-context:
        type: object
        properties:
          inputs: {}
          item: { x-telo-context-element-from: "collection" }
          index: { type: integer }
          items: { x-telo-context-collection-from: "collection" }
      type: array
      items:
        $ref: "#/$defs/bodyStep"
  required:
    - collection
    - steps
  examples:
    - collection: !cel "inputs.users"
      concurrency: 5
      steps:
        - name: send
          invoke: !ref SendEmail
          inputs:
            to: !cel "item.email"
