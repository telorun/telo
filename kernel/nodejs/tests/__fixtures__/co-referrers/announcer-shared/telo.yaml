# Announces its own topic; every import of it reaches one module instance.
kind: Telo.Library
metadata: { name: CoSharedAnnouncer }
lifecycle: shared
imports: { Co: ../kinds }
exports: { resources: [Joined, announce] }
---
kind: Co.Topic
metadata: { name: Joined }
schema: { type: object }
---
kind: Co.Announce
metadata: { name: announce }
topic: !ref Joined
