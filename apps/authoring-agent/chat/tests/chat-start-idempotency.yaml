kind: Telo.Application
metadata:
  name: ChatStartIdempotency
  version: 1.0.0
  description: |
    POST /chat with an Idempotency-Key admits a turn at most once: a repeat
    returns the original turnId and the conversation holds exactly one turn,
    whose first record is the message; the same key
    with a different message is refused with ERR_IDEMPOTENCY_KEY_REUSED. A refused
    start writes nothing: an agent whose spend ceiling is already reached answers
    429 ERR_AT_CAPACITY, leaves the conversation empty, and refuses a retry under
    the same key again rather than replaying the refusal. A key whose admission is
    still claimed by another request answers 409 ERR_IDEMPOTENCY_KEY_IN_FLIGHT —
    the claim is seeded straight into the instance's `agent.sqlite`, so the
    overlap is a fact rather than a race — and starts nothing. A start refused
    because another turn of the conversation is running answers 409
    ERR_TURN_IN_PROGRESS naming that turn, leaves only that turn in the
    conversation, and refunds its reservation: with room for exactly two
    reservations, a second refused start is refused the same way rather than
    for capacity.

    Key-free: the admitted turn fails in the background at its first model call
    (a dummy key, or no network), which is not what is under test — the message
    is the turn's first record, journaled before the model is reached.
imports:
  App: oci://ghcr.io/telorun/app@0.2.0#sha256-vCNxysnNWaauCz5xcqXg2SfrotM1xhZ3VwlEzumpO2o
  Fs: oci://ghcr.io/telorun/fs@0.11.0#sha256-P7Z6jMuBPjPpHOgwcZXYpjuDsrXlORUMG1X79g00gfE
  HttpClient: oci://ghcr.io/telorun/http-client@0.22.3#sha256-OtxM1NSmRcDovSy6N_tkX-pIwtty4MMwj-RPDO0QH1s
  Sql: oci://ghcr.io/telorun/sql@0.25.0#sha256-x8UXPZbNmoCuldq7EAcotw6KfwZr9baCKrRX_8TKaYc
  SQLite: oci://ghcr.io/telorun/sqlite@0.7.0#sha256-iAGE4n-r6dEjTPbJQkAV65pRjILsJI47aderaurBVvs
  Run: oci://ghcr.io/telorun/run@0.27.1#sha256-O1CdVvYs_O7Zj-PNQxMS3NdgWL6e8M2A0J9Wu0rTnIU
  Assert: oci://ghcr.io/telorun/assert@0.20.1#sha256-mnAbFggBHChh_rXaSbeEjj8y1PHyY-y42YGO2TgAClQ
variables:
  # This test's own workspaces, emptied before each run.
  scratch:
    env: CHAT_TEST_IDEMPOTENCY_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/chat-start-idempotency
targets:
  - !ref test
---
kind: Run.Sequence
metadata: { name: test }
steps:
  # Created first so the removal always has something to remove.
  - name: prepare
    invoke: { kind: Fs.DirectoryCreation }
    inputs:
      path: !cel "string(variables.scratch)"
      createParents: true
  - name: reset
    invoke: { kind: Fs.FileRemoval }
    inputs:
      path: !cel "string(variables.scratch)"
      recursive: true
  - name: sameKey
    invoke:
      kind: Run.Sequence
      with:
        - kind: App.Instance
          metadata: { name: agent }
          source: ../../telo.yaml
          ports: { http: 18433 }
          variables:
            workspaceDir: !cel "variables.scratch.joinPath('admitted')"
          secrets:
            openaiApiKey: dummy-key-never-used
      targets: [ !ref agent ]
      steps:
        - name: conversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18433/conversations
            method: POST
        - name: first
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18433/chat
            method: POST
          inputs:
            headers: { idempotency-key: send-1 }
            body:
              conversationId: !cel "steps.conversation.result.body.id"
              message: add a health endpoint
        - name: repeat
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18433/chat
            method: POST
          inputs:
            headers: { idempotency-key: send-1 }
            body:
              conversationId: !cel "steps.conversation.result.body.id"
              message: add a health endpoint
        - name: reused
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18433/chat
            method: POST
          inputs:
            headers: { idempotency-key: send-1 }
            body:
              conversationId: !cel "steps.conversation.result.body.id"
              message: something else entirely
        - name: replayed
          invoke: { kind: Assert.Equals }
          inputs:
            actual:
              first: !cel "steps.first.result.status"
              repeat: !cel "steps.repeat.result.status"
              sameTurn: !cel "steps.repeat.result.body.turnId == steps.first.result.body.turnId"
              reused: !cel "steps.reused.result.status"
              reusedCode: !cel "steps.reused.result.body.code"
            expected:
              first: 200
              repeat: 200
              sameTurn: true
              reused: 422
              reusedCode: ERR_IDEMPOTENCY_KEY_REUSED
        # The admitted turn journals the message as its first record, off the
        # request path — so wait for it to appear, then count.
        - name: history
          retry: { attempts: 40, initialDelay: 100, factor: 1, jitter: none }
          invoke:
            kind: Run.Sequence
            steps:
              - name: read
                invoke:
                  kind: HttpClient.Request
                  method: GET
                inputs:
                  url: !interpolate "http://127.0.0.1:18433/conversations/${{ inputs.conversationId }}/records"
              - name: notYet
                if: !cel "size(steps.read.result.body.turns) == 0 || size(steps.read.result.body.turns[0].records) == 0"
                then:
                  - name: waiting
                    throw:
                      code: ERR_TEST_NO_USER_RECORD_YET
                      message: The admitted turn has not recorded the user message yet.
            outputs:
              turns: !cel "steps.read.result.body.turns"
          inputs:
            conversationId: !cel "steps.conversation.result.body.id"
        - name: oneTurn
          invoke: { kind: Assert.Equals }
          inputs:
            actual:
              turns: !cel "steps.history.result.turns.map(t, t.turnId)"
              first: !cel "steps.history.result.turns[0].records[0].data"
            expected:
              turns: [ !cel "steps.first.result.body.turnId" ]
              first: { type: user-message, content: add a health endpoint, model: gpt-5.2 }
  - name: atCapacity
    invoke:
      kind: Run.Sequence
      with:
        - kind: App.Instance
          metadata: { name: agent }
          source: ../../telo.yaml
          ports: { http: 18434 }
          variables:
            workspaceDir: !cel "variables.scratch.joinPath('refused')"
            # Below one turn's reservation, so every start is refused.
            budgetLimit: 1
          secrets:
            openaiApiKey: dummy-key-never-used
      targets: [ !ref agent ]
      steps:
        - name: conversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18434/conversations
            method: POST
        - name: refused
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18434/chat
            method: POST
          inputs:
            headers: { idempotency-key: send-1 }
            body:
              conversationId: !cel "steps.conversation.result.body.id"
              message: add a health endpoint
        # A refusal releases the key: the same key is a fresh attempt, refused
        # on its own merits, not a replay of an admission.
        - name: retried
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18434/chat
            method: POST
          inputs:
            headers: { idempotency-key: send-1 }
            body:
              conversationId: !cel "steps.conversation.result.body.id"
              message: add a health endpoint
        - name: read
          invoke:
            kind: HttpClient.Request
            method: GET
          inputs:
            url: !interpolate "http://127.0.0.1:18434/conversations/${{ steps.conversation.result.body.id }}/records"
        - name: nothingWritten
          invoke: { kind: Assert.Equals }
          inputs:
            actual:
              status: !cel "steps.refused.result.status"
              code: !cel "steps.refused.result.body.code"
              hasRetryAfter: !cel "'retryAfter' in steps.refused.result.body"
              retriedCode: !cel "steps.retried.result.body.code"
              turns: !cel "steps.read.result.body.turns"
            expected:
              status: 429
              code: ERR_AT_CAPACITY
              hasRetryAfter: true
              retriedCode: ERR_AT_CAPACITY
              turns: []
  - name: inFlight
    invoke:
      kind: Run.Sequence
      with:
        - kind: App.Instance
          metadata: { name: agent }
          source: ../../telo.yaml
          ports: { http: 18435 }
          variables:
            workspaceDir: !cel "variables.scratch.joinPath('in-flight')"
          secrets:
            openaiApiKey: dummy-key-never-used
        # The instance's own database, reached from outside it.
        - kind: SQLite.Connection
          metadata: { name: agentDb }
          file: !cel "variables.scratch.joinPath('in-flight').joinPath('.telo-agent').joinPath('agent.sqlite')"
        - kind: Sql.Command
          metadata: { name: seedClaim }
          connection: !ref agentDb
      targets: [ !ref agent ]
      steps:
        - name: conversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18435/conversations
            method: POST
        # An unexpired claim on `<conversationId>:<key>`, as another request
        # admitting under that key leaves it: the record Idempotency.Once writes.
        - name: claim
          invoke: !ref seedClaim
          inputs:
            sql: "INSERT INTO turn_admissions (store_key, value, version, expires_at) VALUES (?, ?, ?, ?)"
            bindings:
              - !cel "steps.conversation.result.body.id + ':send-1'"
              - '{"holder":"another-request","settled":false}'
              - claim-1
              # 2100-01-01: never lapses within the test.
              - 4102444800000
        - name: overlapping
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18435/chat
            method: POST
          inputs:
            headers: { idempotency-key: send-1 }
            body:
              conversationId: !cel "steps.conversation.result.body.id"
              message: add a health endpoint
        - name: read
          invoke:
            kind: HttpClient.Request
            method: GET
          inputs:
            url: !interpolate "http://127.0.0.1:18435/conversations/${{ steps.conversation.result.body.id }}/records"
        - name: refusedInFlight
          invoke: { kind: Assert.Equals }
          inputs:
            actual:
              status: !cel "steps.overlapping.result.status"
              code: !cel "steps.overlapping.result.body.code"
              turns: !cel "steps.read.result.body.turns"
            expected:
              status: 409
              code: ERR_IDEMPOTENCY_KEY_IN_FLIGHT
              turns: []
  - name: leaseRefused
    invoke:
      kind: Run.Sequence
      with:
        - kind: App.Instance
          metadata: { name: stub }
          source: ./__fixtures__/provider-stub/telo.yaml
          ports: { http: 18437 }
        - kind: App.Instance
          metadata: { name: agent }
          source: ../../telo.yaml
          ports: { http: 18436 }
          variables:
            workspaceDir: !cel "variables.scratch.joinPath('lease-refused')"
            modelEndpoint: http://127.0.0.1:18437/v1
            # Two turns' reservations, and no more.
            budgetLimit: 80000
          secrets:
            openaiApiKey: stub-key
      targets: [ !ref stub, !ref agent ]
      steps:
        - name: conversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18436/conversations
            method: POST
        # The stub holds its model call until released — never, here — so the
        # turn is still running when the next two starts arrive.
        - name: running
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18436/chat
            method: POST
          inputs:
            body:
              conversationId: !cel "steps.conversation.result.body.id"
              message: STUB_SLOW build it
        - name: overlapping
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18436/chat
            method: POST
          inputs:
            body:
              conversationId: !cel "steps.conversation.result.body.id"
              message: and another thing
        - name: again
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18436/chat
            method: POST
          inputs:
            body:
              conversationId: !cel "steps.conversation.result.body.id"
              message: and another thing
        - name: read
          invoke:
            kind: HttpClient.Request
            method: GET
          inputs:
            url: !interpolate "http://127.0.0.1:18436/conversations/${{ steps.conversation.result.body.id }}/records"
        - name: refusedAndTakenBack
          invoke: { kind: Assert.Equals }
          inputs:
            actual:
              overlapping: [ !cel "steps.overlapping.result.status", !cel "steps.overlapping.result.body.code" ]
              activeTurn: !cel "steps.overlapping.result.body.activeTurnId == steps.running.result.body.turnId"
              again: [ !cel "steps.again.result.status", !cel "steps.again.result.body.code" ]
              turns: !cel "steps.read.result.body.turns.map(t, t.turnId)"
            expected:
              overlapping: [409, ERR_TURN_IN_PROGRESS]
              activeTurn: true
              again: [409, ERR_TURN_IN_PROGRESS]
              turns: [ !cel "steps.running.result.body.turnId" ]
