apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-runner.name" . }}
  namespace: {{ .Values.runnerNamespace }}
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
---
# Scoped to the session namespace only — minimal blast radius if compromised.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-runner.name" . }}
  namespace: {{ .Values.sessionNamespace }}
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
rules:
  # `update` on services/ingresses is what lets a watch session re-patch its
  # routing when a reload changes an app's declared port set. Without it the app
  # binds the new port inside the pod and is simply unreachable: no ingress, no
  # error, no event.
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/attach"]
    verbs: ["get", "create"]
  # The workspace application's manifest, delivered to a watch session's pod as
  # a content-addressed ConfigMap the runner reconciles at start. `list`/`delete`
  # are for the boot-time sweep: the name is content-addressed, so every release
  # that changes the manifest would otherwise leave one behind permanently. Reconciled by
  # the runner rather than shipped by this chart so the manifest and the code
  # that depends on it version as one artifact — a chart-only upgrade cannot
  # leave them skewed.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-runner.name" . }}
  namespace: {{ .Values.sessionNamespace }}
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-runner.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-runner.name" . }}
    namespace: {{ .Values.runnerNamespace }}
---
# Read-only namespace check used by /v1/probe.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-runner.name" . }}-{{ .Release.Namespace }}-probe
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-runner.name" . }}-{{ .Release.Namespace }}-probe
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-runner.name" . }}-{{ .Release.Namespace }}-probe
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-runner.name" . }}
    namespace: {{ .Values.runnerNamespace }}
