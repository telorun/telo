    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/sin.traineddata.gz:
        { upstream: sin, member: package/4.0.0_best_int/sin.traineddata.gz, sha256: 02d34b1f6565d26991fa25605c0bbddd3e39d9eefe471fce4b8a27fe9363ec94, executable: false }
