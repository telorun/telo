kind: Telo.Application
metadata:
  name: ShopAssistant
  version: 1.0.0
  description: |
    A shop's support assistant built on the AgentApp blueprint: it answers
    customers from the conversation so far and looks orders up itself. There is
    no server, route, database or tool loop to write — only the model, what the
    assistant is told, and the one tool it may use.

    Set your OpenAI key in a sibling `.env.local`:
        OPENAI_API_KEY=sk-...

    Run, then:
        curl -s -XPOST localhost:8854/conversations/c1/messages -H 'content-type: application/json' \
          -d '{"message":"Where is my order A-1001?"}'
        curl -s localhost:8854/conversations/c1/messages
imports:
  AgentApp: ..
  # Published, like the modules the blueprint itself imports: importing the
  # local copies of these beside the blueprint's published `ai` is refused with
  # DUPLICATE_IMPORT_ALIAS.
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  OpenAI: oci://ghcr.io/telorun/openai@0.13.0#sha256-Tt9DaH254A972an-WTH_mtJOy9HAuUuH_SK1_bfOvHM
  Http: oci://ghcr.io/telorun/http-client@0.23.0#sha256-6WAIh0ajnTlkWNuP-59e1qNVUXVSJDWZxvPVACQg1AM
targets:
  - !ref assistant
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8854
variables:
  history:
    env: CONVERSATIONS_FILE
    type: string
    x-telo-type: Telo.HostPath
    default: .telo/shop-conversations.sqlite
secrets:
  openaiApiKey:
    env: OPENAI_API_KEY
    type: string
---
kind: AgentApp.App
metadata:
  name: assistant
port: !cel "ports.http"
title: Shop assistant
history: !cel "variables.history"
model:
  kind: OpenAI.ChatModel
  model: gpt-4o-mini
  request:
    kind: Http.Request
    client:
      kind: Http.Client
      baseUrl: https://api.openai.com/v1
      credential:
        kind: Http.BearerToken
        token: !cel "secrets.openaiApiKey"
system: |
  You are the support assistant of a small online shop. Be brief and friendly.
  Look an order up with `order_status` before saying anything about it, and
  never guess a delivery date the lookup did not give you.
tools:
  - tool: !ref orderStatus
    name: order_status
    description: Where an order is and when it is expected, by its order number.
    parameters:
      type: object
      additionalProperties: false
      required: [orderId]
      properties:
        orderId: { type: string, description: "The order number, e.g. A-1001." }
---
# Stands in for the shop's order system: replace it with a query against yours.
kind: Run.Value
metadata:
  name: orderStatus
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [orderId]
    properties:
      orderId: { type: string }
value: !cel >-
  inputs.orderId == 'A-1001'
    ? {'status': 'shipped', 'expected': '2026-09-24'}
    : {'status': 'unknown'}
