kind: Telo.Application
metadata:
  name: UiReactActionTest
  version: 1.0.0
  description: |
    An application serves an action, a table's row actions and a page list's
    row actions as the nodes they provide — each row action carrying its
    action's own node, its inputs and its condition — and the routes they name
    take exactly what the renderer sends: the record a jsdom test holds the
    action's form to is answered with the files its result is drawn from, a
    record the shared input shape refuses is the 400 envelope naming the
    property, and the record a row action binds is accepted by its route.
imports:
  App: ../../app
  Run: ../../run
  HttpClient: ../../http-client
  Assert: ../../assert
targets:
  - !ref test
---
kind: Run.Sequence
metadata:
  name: test
with:
  - kind: App.Instance
    metadata: { name: fixture }
    source: ./__fixtures__/action/telo.yaml
    ports:
      http: 19331
targets:
  - !ref fixture
steps:
  - name: page
    invoke: { kind: HttpClient.Request, url: "http://127.0.0.1:19331/admin/_telo/ui/page?path=/" }
  - name: verifyPage
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.page.result.status"
        action: !cel "steps.page.result.body.children[0]"
        table: !cel "steps.page.result.body.children[1].type"
        rowActions: !cel "steps.page.result.body.children[1].rowActions.map(r, {'action': [r.action.path, r.action.label, r.action.result], 'inputs': r.inputs, 'confirm': r.confirm, 'enabled': r.enabled})"
        months: !cel "steps.page.result.body.children[2]"
      expected:
        status: 200
        action:
          type: action
          schema:
            type: object
            additionalProperties: false
            required: [month]
            properties:
              month: { type: string, title: Month, pattern: "^[0-9]{4}-[0-9]{2}$" }
              copies: { type: integer, title: Copies, minimum: 1 }
              formats: { type: array, title: Formats, items: { enum: [pdf, csv] } }
              recipients: { type: array, title: Recipients, items: { type: string, minLength: 3 } }
          path: /api/reports
          label: { lang: und, message: [Generate] }
          fields:
            - { type: input, property: month, label: { lang: und, message: [Month] }, description: null, labels: [], control: auto }
            - { type: input, property: copies, label: { lang: und, message: [Copies] }, description: null, labels: [], control: auto }
            - type: input
              property: formats
              label: { lang: und, message: [Formats] }
              description: null
              labels: [{ value: pdf, label: { lang: und, message: [pdf] } }, { value: csv, label: { lang: und, message: [csv] } }]
              control: auto
            - { type: input, property: recipients, label: { lang: und, message: [Recipients] }, description: null, labels: [], control: auto }
          groups: []
          state: { address: false, store: { type: memory }, fields: [month, copies, formats, recipients] }
          answer:
            type: object
            required: [files]
            properties:
              files:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string, title: File }
                    url: { type: string, title: Download, format: uri-reference }
          result:
            type: list
            heading: { lang: und, message: [Files] }
            rows: { root: result, path: [files] }
            columns:
              - { header: { lang: und, message: [File] }, labels: [], value: { root: row, path: [name] }, present: { type: string } }
              - { header: { lang: und, message: [Download] }, labels: [], value: { root: row, path: [url] }, present: { type: string, format: uri-reference } }
          failure:
            type: stack
            style: danger
            children:
              - { type: value, value: { root: error, path: [code] }, labels: [], present: { type: string }, style: strong }
              - { type: value, value: { root: error, path: [message] }, labels: [], present: { type: string } }
          onSuccess: { refreshes: [/api/todos] }
          concurrency: serial
          clearAnswerOn: [month]
        table: table
        rowActions:
          - action: [ /api/archive, { lang: und, message: [Archive] }, { type: value, value: { root: result, path: [ archived ] }, labels: [], present: { type: boolean } } ]
            inputs:
              id: { root: row, path: [id] }
              status: { value: archived }
            confirm: { lang: und, message: [Archive this task?] }
            enabled:
              at: { root: row, path: [text] }
              matches: { minLength: 1 }
              disabledText: { lang: und, message: [Name it first.] }
        months:
          type: list
          heading: { lang: und, message: [Months] }
          rows: { root: query, path: [months] }
          columns:
            - { header: { lang: und, message: [Month] }, labels: [], value: { root: row, path: [] }, present: { type: string } }
          rowActions:
            - action: !cel "steps.page.result.body.children[0]"
              inputs:
                month: { root: row, path: [] }

  - name: run
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:19331/api/reports
      method: POST
      headers: { content-type: application/json }
      body: !include-text ./__fixtures__/action/report-request.json
  - name: refused
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:19331/api/reports
      method: POST
      body: { month: September }
  - name: archive
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:19331/api/archive
      method: POST
      headers: { content-type: application/json }
      body: !include-text ./__fixtures__/action/archive-request.json
  - name: verifyRoutes
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        run:
          status: !cel "steps.run.result.status"
          body: !cel "steps.run.result.body"
        refused:
          status: !cel "steps.refused.result.status"
          error: !cel "steps.refused.result.body.error"
          details: !cel "steps.refused.result.body.details.map(d, d.path)"
        archive:
          status: !cel "steps.archive.result.status"
          body: !cel "steps.archive.result.body"
      expected:
        run:
          status: 200
          body:
            files:
              - { name: 2026-09.pdf, url: /files/2026-09.pdf }
              - { name: 2026-09.csv, url: /files/2026-09.csv }
        refused:
          status: 400
          error: ValidationError
          details: [month]
        archive:
          status: 200
          body: { archived: true }
