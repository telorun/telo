kind: Telo.Application
metadata:
  name: UiMarkdownAndTimeTest
  version: 1.0.0
  description: |
    A page draws Markdown it reads, with a control on each item the server
    names in it, and dates as times — a `time` node and a list's time column,
    relative or absolute — each as a renderer receives it. Refused by `telo
    check`: an annotation reading a member its row does not declare, Markdown
    read from something that is not a string, a time read from a string with no
    date format, and `relative` on a value; a time over such a string is
    refused again when a reader in a library is first read.
imports: { Ui: ../, Assert: ../../assert }
targets:
  - !ref main
  - !ref refused
  - !ref timeNotDate
  - !ref timeNotDateAtRuntime
---
kind: Telo.JsonSchema
metadata: { name: PlanDetail }
schema:
  type: object
  required: [plan, events]
  properties:
    plan:
      type: object
      required: [latestRevision]
      properties:
        latestRevision:
          type: object
          required: [seq, body, createdAt, items]
          properties:
            seq: { type: integer }
            body: { type: string }
            createdAt: { type: string, format: date-time }
            items:
              type: array
              items:
                type: object
                required: [id, line, count]
                properties: { id: { type: string }, line: { type: integer }, count: { type: integer } }
    events:
      type: array
      items:
        type: object
        required: [type, createdAt]
        properties:
          type: { type: string, title: Event }
          createdAt: { type: string, format: date-time, title: When }
---
kind: Ui.Page
metadata: { name: plan }
path: /plans/{id}
children:
  - type: query
    query:
      kind: Ui.Query
      model: !ref PlanDetail
      url:
        path: "/api/plans/{id}"
        pathParams: { id: !cel "params.id" }
    content:
      - type: stack
        children:
          - type: time
            value: !cel "data.plan.latestRevision.createdAt"
            relative: true
          - type: markdown
            value: !cel "data.plan.latestRevision.body"
            annotations:
              rows: !cel "data.plan.latestRevision.items"
              line: !cel "row.line"
              count: !cel "row.count"
              action:
                mutation:
                  kind: Ui.Mutation
                  inputModel:
                    kind: Telo.JsonSchema
                    schema:
                      type: object
                      required: [id, revision, author, body]
                      properties:
                        id: { type: string }
                        revision: { type: integer }
                        item: { type: string }
                        author: { type: string, title: Your name }
                        body: { type: string, title: Comment }
                  url:
                    path: /api/plans/{id}/comments
                    pathParams:
                      id: !cel "input.id"
                inputs:
                  id: !cel "params.id"
                  revision: !cel "data.plan.latestRevision.seq"
                  item: !cel "row.id"
                  author: !cel "prompt.author"
                  body: !cel "prompt.body"
                label: Comment
                prompt:
                  kind: Ui.Prompt
                  model:
                    kind: Telo.JsonSchema
                    schema:
                      type: object
                      required: [author, body]
                      properties:
                        author: { type: string, title: Your name }
                        body: { type: string, title: Comment }
          - type: list
            rows: !cel "data.events"
            columns:
              - value: !cel "row.type"
              - type: time
                value: !cel "row.createdAt"
---
kind: Telo.Sequence
metadata: { name: main }
steps:
  - name: page
    invoke: !ref plan
    inputs: { request: { headers: {} } }
  - name: timeIs
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.page.result.children[0].content[0].children[0]"
      expected:
        type: time
        value: { root: data, path: [plan, latestRevision, createdAt] }
        relative: true
        present: { type: string, format: date-time }
        fill: false
  - name: markdownIs
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel >-
        cel.bind(m, steps.page.result.children[0].content[0].children[1], {
          'members': sort(keys(m)),
          'value': m.value,
          'rows': m.annotations.rows,
          'line': m.annotations.line,
          'count': m.annotations.count,
          'inputs': m.annotations.action.inputs,
          'prompted': m.annotations.action.prompt.fields.map(f, f.property),
          'label': m.annotations.action.label.text
        })
      expected:
        members: [annotations, fill, type, value]
        value: { root: data, path: [plan, latestRevision, body] }
        rows: { root: data, path: [plan, latestRevision, items] }
        line: { root: row, path: [line] }
        count: { root: row, path: [count] }
        inputs:
          id: { root: params, path: [id] }
          revision: { root: data, path: [plan, latestRevision, seq] }
          item: { root: row, path: [id] }
          author: { root: prompt, path: [author] }
          body: { root: prompt, path: [body] }
        prompted: [author, body]
        label: Comment
  - name: columnsAre
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.page.result.children[0].content[0].children[2].columns.map(c, has(c.type) ? {'type': c.type, 'header': c.header.text, 'value': c.value, 'present': c.present} : {'header': c.header.text, 'value': c.value, 'present': c.present})"
      expected:
        - { header: Event, value: { root: row, path: [type] }, present: { type: string } }
        - { type: time, header: When, value: { root: row, path: [createdAt] }, present: { type: string, format: date-time } }
  - name: timeColumnIs
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "sort(keys(steps.page.result.children[0].content[0].children[2].columns[1]))"
      expected: [header, present, relative, type, value]
  - name: timeColumnRelative
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.page.result.children[0].content[0].children[2].columns[1].relative"
      expected: false
---
kind: Assert.Manifest
metadata: { name: refused }
source: ./__fixtures__/invalid/markdown-time/check.yaml
expect:
  errors:
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.View/lineTypo: !cel: 'row.lnie' is not defined (available: id, line, count)"
    - code: CEL_TYPE_ERROR
      message: "Ui.View/markdownNotString: CEL at 'content.content[0].value' reads 'data.seq', declared 'integer', but the field expects 'string'"
    - code: CEL_TYPE_ERROR
      message: "Ui.View/timeColumnNoFormat: CEL at 'content.content[0].columns[0].value': 'row.type' is a string with no format; the field takes a string of format date or date-time"
    - code: SCHEMA_VIOLATION
      message: "Ui.View/valueRelative: /content/content/0 must NOT have additional properties ('relative' is not allowed)"
---
kind: Assert.Manifest
metadata: { name: timeNotDate }
source: ./__fixtures__/invalid/markdown-time/lib/telo.yaml
expect:
  errors:
    - code: CEL_TYPE_ERROR
      message: "Ui.View/timeNoFormat: CEL at 'content.content[0].value': 'data.title' is a string with no format; the field takes a string of format date or date-time"
---
kind: Assert.Manifest
metadata: { name: timeNotDateAtRuntime }
source: ./__fixtures__/invalid/markdown-time/telo.yaml
expect:
  errors: [{ code: CEL_TYPE_ERROR, message: "Ui.View/timeNoFormat: CEL at 'content.content[0].value': 'data.title' is a string with no format; the field takes a string of format date or date-time." }]
  runFails: "Ui.View 'timeNoFormat' content.content[0].value: 'data.title' is a string with no format; a time takes a string of format date or date-time."
