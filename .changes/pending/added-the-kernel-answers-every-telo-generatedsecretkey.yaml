units:
  kernel: Added
body: "The kernel answers every `Telo.GeneratedSecretKey` and `Telo.GeneratedPassword`
  need nothing supplies from `TELO_HOST_SECRET_SEED`: the value is derived from the
  seed, the need's kind, path and parameters, so it is the same on every restart and
  never stored. A seed that is not 32 bytes of unpadded base64url is
  `ERR_NEED_HOST_VALUE_INVALID`, a supplied key or password its need refuses is
  `ERR_NEED_VALUE_INVALID`, and the seed is hidden from controllers and stripped from a
  started child application, like the other host values."
