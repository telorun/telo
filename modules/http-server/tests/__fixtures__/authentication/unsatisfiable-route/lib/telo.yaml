# A route denying anonymous callers under a mount naming no verifier. `telo check` reports it here; a consumer's check sees nothing, so there
# the server refuses itself when it is created.
kind: Telo.Library
metadata:
  name: UnsatisfiableRoute
  version: 1.0.0
  description: Test fixture exporting a server refused as AUTHENTICATION_UNSATISFIABLE.
imports: { Http: ../../../../../, Auth: ../../../../../../auth, Authz: ../../../../../../authz }
exports: { resources: [server] }
---
kind: Auth.TrustedHeader
metadata: { name: gateway }
---
kind: Http.Api
metadata: { name: api }
routes:
  - request: { path: /ping, method: GET }
    returns: [{ status: 204 }]
---
kind: Http.Api
metadata: { name: closedApi }
routes:
  - request: { path: /closed, method: GET }
    authentication: { anonymous: deny }
    returns: [{ status: 204 }]
---
kind: Http.Server
metadata: { name: server }
listen: { port: 8972 }
mounts:
  - path: /
    mount: !ref closedApi
    authentication: { anonymous: allow }
    # Expressions elsewhere in the entry do not stop the rule judging it.
    authorization:
      policy: { kind: Authz.CelPolicy, rules: [{ when: !cel "true" }] }
      action: !cel "request.method + ' ' + request.path"
    guard:
      invoke: { kind: Telo.Sequence, steps: [{ name: pass, value: 1 }] }
      inputs: { path: !cel "request.path" }
