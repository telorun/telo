[package]
name = "telo-templating"
version = "0.135.0"
license = "MIT"
edition = "2021"
publish = false
description = "Telo templating — YAML tag sentinels shared by the manifest loader, and the CEL tag engines over telorun-cel."

[dependencies]
# Written order is part of what a manifest says (a tag's keys, a `...`
# splice's place, emitted map order), and it is what the Node loader keeps.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
# The hole grammar asks the engine where a quoted literal ends, and trims by the value
# crate's ECMAScript whitespace.
telorun-cel = { path = "../../cel/rust" }
telorun-cel-value = { path = "../../cel/rust/value" }
# The value-type vocabulary the dialect registers, the host seam a value crosses on its way
# out, and the typed frame the conformance vectors are written in.
telorun-sdk-core = { path = "../../sdk/rust/core" }

[dev-dependencies]
# The conformance vectors pin doubles to the last digit, and serde_json's default float
# parsing is not correctly rounded.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
