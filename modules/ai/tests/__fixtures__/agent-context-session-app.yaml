# Runs the library's agent call that supplies one provider's caller data and not
# the other's. This consumer's entry-scoped check is silent about the library's
# call site, so the agent's bound contract is what refuses it.
kind: Telo.Application
metadata:
  name: AgentContextSessionMissingApp
  version: 1.0.0
imports:
  Lib: ./agent-context-session
targets:
  - !ref Lib.callWithoutSessionId
