            - [ Where, "-", null ]
            - [ Status, status, { by: { root: row, path: [ status ] }, cases: { todo: muted, doing: accent, review: warning, done: success } } ]
            - [ Priority, priority, { by: { root: row, path: [ priority ] }, cases: { "5": danger, "4": warning }, default: muted } ]
            - [ Estimate, estimate, null ]
            - [ Due, dueOn, null ]
            - [ Assignee, "-", null ]
        members:
          source: [ /api/task-board, 6 ]
          columns:
