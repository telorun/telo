kind: Telo.Application
metadata:
  name: ScheduleCronTest
  version: 1.0.0
  description: |
    Runs a Schedule.Cron on a once-per-second expression (the 6-field form with
    a leading seconds column) and asserts the body fired. Proves the cron parser
    is genuinely bundled into the module artifact — the manifest declares no npm
    controller package, so a working tick means the inlined dependency loaded.
imports:
  Schedule: ../
  Cache: ../../cache
  CacheMemory: ../../cache-memory
  Timer: ../../timer
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref TestCron
---
kind: CacheMemory.Store
metadata: { name: Counters }
---
kind: Cache.Entry
metadata: { name: Put }
store: !ref Counters
ttl: "60s"
---
kind: Cache.Lookup
metadata: { name: Get }
store: !ref Counters
---
kind: Run.Sequence
metadata:
  name: Bump
steps:
  - name: read
    invoke: !ref Get
    inputs: { key: cron }
  - name: write
    invoke: !ref Put
    inputs:
      key: cron
      value: !cel "steps.read.result.state == 'miss' ? 1 : steps.read.result.value + 1"
---
kind: Run.Sequence
metadata:
  name: TestCron
with:
  - kind: Schedule.Cron
    metadata: { name: EverySecond }
    cron: "* * * * * *"
    timezone: UTC
    invoke: !ref Bump
targets:
  - !ref EverySecond
steps:
  - name: wait
    invoke: { kind: Timer.Delay }
    inputs:
      duration: "2500ms"
      value: {}
  - name: read
    invoke: !ref Get
    inputs: { key: cron }
  - name: verifyFired
    inputs:
      actual: !cel "steps.read.result.state != 'miss'"
      expected: true
    invoke: { kind: Assert.Equals }
