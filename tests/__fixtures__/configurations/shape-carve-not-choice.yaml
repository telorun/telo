# A kind's value is held to a `not` around a named shape that varies under
# `variables.flag1`: the value fits the shape, so `not` refuses it, where the
# flag is true.
kind: Telo.Application
metadata: { name: ShapeCarveNotChoice }
variables: { flag1: { env: FLAG_1, type: boolean, default: false } }
---
kind: Telo.JsonSchema
metadata: { name: Inner }
schema: !if
  if: !cel "variables.flag1"
  then: { type: string }
  else: { type: integer }
---
kind: Telo.JsonSchema
metadata: { name: Outer }
schema: { not: { $ref: "telo://Self/Inner" } }
---
kind: Telo.Definition
metadata: { name: Holder }
capability: Telo.Runnable
schema: { type: object, properties: { v: { $ref: "telo://Self/Outer" } } }
---
kind: Self.Holder
metadata: { name: holder }
v: text
