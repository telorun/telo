kind: Telo.Application
metadata:
  name: InheritedHttpClientTest
  version: 1.0.0
imports:
  Ph: ./__fixtures__/inherited-client/telo.yaml
  Http: ../modules/http-client
  Run: ../modules/run
  Assert: ../modules/assert
targets:
  - !ref testInheritedClient
---
# A PlaceholderClient IS an Http.Client (inherits its controller + capability),
# constructed from { host } via the definition's base: mapping.
kind: Ph.PlaceholderClient
metadata:
  name: placeholder
host: jsonplaceholder.typicode.com
---
# The inherited client drops into Http.Request's `client` slot with no special
# handling — it duck-types as a Client (its snapshot() carries baseUrl/headers).
kind: Run.Sequence
metadata:
  name: testInheritedClient
steps:
  - name: fetchUser
    inputs: {}
    invoke:
      kind: Http.Request
      client: !ref placeholder
      url: /users/1
      method: GET

  - name: assertResponse
    inputs:
      status: !cel "steps.fetchUser.result.status"
      id: !cel "steps.fetchUser.result.body.id"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status:
            type: integer
            const: 200
          id:
            type: integer
            const: 1
        required:
          - status
          - id

  # A `base:`-form child's own fields are construction inputs consumed by the
  # mapping, so they are NOT published — the reading is the parent's alone.
  # Asserted as the whole reading so the narrowing cannot drift into publishing
  # `host` alongside it.
  - name: assertBaseFormPublishesParentOnly
    inputs:
      actual: !cel "resources.placeholder"
      expected:
        baseUrl: https://jsonplaceholder.typicode.com
        headers:
          X-From: placeholder-jsonplaceholder.typicode.com
        timeout: 10000
        followRedirects: true
    invoke:
      kind: Assert.Equals
