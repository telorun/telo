[package]
name = "telo-desktop-host"
version = "0.136.0"
license-file = "../../../LICENSE"
edition = "2021"
publish = false
description = "The webview helper `telo run` drives as the desktop host: native windows and tray icons over a framed link. Builds the `telo-desktop-host` binary."

[lib]
name = "telo_desktop_host"
path = "src/lib.rs"

[[bin]]
name = "telo-desktop-host"
path = "src/main.rs"

[features]
# Off by default: the native toolkit (WebKitGTK, WebView2, WKWebView) is needed
# only to build the binary, never for the protocol, decisions and tables.
gui = ["dep:wry", "dep:tao", "dep:tray-icon", "dep:zbus"]

[dependencies]
serde_json = "1"
sha1 = "0.11"
# Icons are PNG files; decoding them needs no native toolkit.
png = "=0.18.1"
wry = { version = "=0.55.1", optional = true }
tao = { version = "=0.35.3", optional = true }
# The `gtk` feature is the Linux StatusNotifier tray; `libxdo` (a default) is not needed.
tray-icon = { version = "=0.24.2", optional = true, default-features = false, features = ["gtk"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Asks the session bus whether a StatusNotifierWatcher exists.
zbus = { version = "=5.19.0", optional = true, features = ["blocking-api"] }
