[package]
name = "telorun-sdk"
version = "0.0.0"
edition = "2021"
publish = false
description = "Pure-Rust traits and FFI backends for authoring Telo controllers in Rust."

[lib]
crate-type = ["rlib"]

# No default backend. A controller crate carries no `[features]` block, so the
# only way to select a backend from outside is `--features telorun-sdk/<backend>`
# on the build the hosting kernel invokes — `--no-default-features` there would
# apply to the controller crate, not to this dependency. With neither feature on
# (a bare `cargo check`, rust-analyzer) the traits still compile and the impl is
# still checked; only the FFI bridge is absent.
[features]
napi = ["dep:napi", "dep:napi-derive"]
native = ["dep:jsonschema"]

[dependencies]
serde_json = "1"
thiserror = "1"
telorun-abi = { path = "./abi" }
jsonschema = { version = "0.49", default-features = false, optional = true }
napi = { version = "2", default-features = false, features = ["napi4", "serde-json"], optional = true }
napi-derive = { version = "2", optional = true }
telorun-sdk-macros = { path = "./macros" }
