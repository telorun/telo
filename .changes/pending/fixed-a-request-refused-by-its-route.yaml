modules:
  modules/http-server: Fixed
body: "A request refused by its route's schema now names what was refused. Each entry of
  the 400 envelope's details[] is built from the validator's own finding: location is
  the validated part (body, query, params, headers); path names the refused field from
  that part's root, property names joined by a dot and a list position written in
  brackets against its list (note, address.street, items[0].name); message is the
  validator's own sentence (must NOT have more than 5 characters, must match format
  \"date\", must be integer). A missing required property and a property the schema does
  not declare are each named themselves, the parent's path plus the name. Before, every
  refusal but a missing required property arrived with an empty path and a message cut
  out of the validator's prose. The envelope's fields and status are unchanged; a client
  that matched the old message text must match the new."
