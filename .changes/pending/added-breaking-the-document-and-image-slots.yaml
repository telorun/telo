modules:
  modules/pdf: Added
body: "Breaking: the document and image slots of `Pdf.Rasterizer` (input `data`, output
  `image`) and `Pdf.FormFields` (input `data`, output `data`) are declared as bytes
  (`Telo.Bytes`) instead of `type: object`. A `data` argument that is not bytes now
  fails the call with `ERR_INPUT_INVALID` before the controller runs, where it raised
  `ERR_INVALID_INPUT`, and `telo check` reports an expression of another type. The
  outputs no longer fit a slot declared as a JSON type; pass them to a slot declared as
  bytes."
