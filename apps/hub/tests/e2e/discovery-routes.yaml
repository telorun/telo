kind: Telo.Application
metadata:
  name: HubE2EDiscoveryRoutes
  version: 1.0.0
  description: |
    End-to-end tests for the hub's discovery HTTP surface, run against a live
    hub at http://localhost:8040 that has tracked the seeded refs
    (the `oci://ghcr.io/telorun/*` set in docker-compose `SEED_REFS`, which is
    what a fresh database contains — assert only on those, never on a ref some
    other test registers). Covers /health, per-resource and per-module
    search, /refs typeahead, /module/versions including its 404 path, and the
    /modules catalogue listing and its paging.
imports:
  HttpClient: oci://ghcr.io/telorun/http-client@0.22.3#sha256-OtxM1NSmRcDovSy6N_tkX-pIwtty4MMwj-RPDO0QH1s
  Run: oci://ghcr.io/telorun/run@0.27.1#sha256-O1CdVvYs_O7Zj-PNQxMS3NdgWL6e8M2A0J9Wu0rTnIU
  Assert: oci://ghcr.io/telorun/assert@0.20.1#sha256-mnAbFggBHChh_rXaSbeEjj8y1PHyY-y42YGO2TgAClQ
targets:
  - !ref health
  - !ref searchResources_FindsSeededKind
  - !ref searchResources_SemanticMatch
  - !ref searchModules_GroupsByModule
  - !ref refs_FuzzyMatchesSeededRef
  - !ref moduleVersions_ListsSeededVersions
  - !ref moduleVersions_UntrackedReturns404
  - !ref categories_ListsDeclaredFacet
  - !ref searchModules_FiltersByCategory
  - !ref implementations_ListsBackendsOfContract
  - !ref module_ReturnsDetailForSeededRef
  - !ref module_UntrackedReturns404
  - !ref module_UnknownVersionReturns404
  - !ref searchResources_RejectsUnknownRuntime
  - !ref searchResources_AcceptsKnownRuntime
  - !ref searchResources_RejectsUnknownCategory
  - !ref searchResources_BroadensWhenCategoryExcludesEverything
  - !ref searchResources_CarriesCategoryFacet
  - !ref searchModules_RejectsUnknownCategory
  - !ref modules_ListsExactlyTheRefsModuleAnswers
  - !ref modules_PagesChainByNext
  - !ref modules_RejectsInvalidLimit
---
kind: Run.Sequence
metadata: { name: health }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitHealth }
      url: http://localhost:8040/health
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertHealth }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              status: { const: ok }
            required: [status]
        required: [status, body]
---
# The seeded timer module defines Timer.Delay; an intent-shaped lexical
# query on "delay" must surface it as a kind hit carrying the exact location
# ref + version (the shape search_resources / the editor build on).
kind: Run.Sequence
metadata: { name: searchResources_FindsSeededKind }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitSearchResources }
      url: http://localhost:8040/search/resources?q=delay
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertSearchResources }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              query: { const: delay }
              hits:
                type: array
                items:
                  type: object
                  properties:
                    kind: { type: string }
                    capability: { type: string }
                    description: { type: string }
                    module:
                      type: object
                      properties:
                        ref: { type: string }
                        version: { type: string }
                        description: { type: string }
                        repository: { type: string }
                        license: { type: string }
                      required: [ref, version, description, repository, license]
                    score: { type: number }
                  required: [kind, capability, module, score]
                contains:
                  type: object
                  properties:
                    kind: { const: Delay }
                    module:
                      type: object
                      properties:
                        ref: { const: "oci://ghcr.io/telorun/timer" }
                      required: [ref]
                  required: [kind, module]
            required: [query, hits]
        required: [status, body]
---
# The module-first projection groups the same hits and lists every exported
# kind, so a module card needs no second manifest fetch.
kind: Run.Sequence
metadata: { name: searchModules_GroupsByModule }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitSearchModules }
      url: http://localhost:8040/search/modules?q=console
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertSearchModules }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              hits:
                type: array
                contains:
                  type: object
                  properties:
                    module:
                      type: object
                      properties:
                        ref: { const: "oci://ghcr.io/telorun/console" }
                        repository: { type: string }
                        license: { type: string }
                      required: [ref, repository, license]
                    matchedKinds:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        properties:
                          kind: { type: string }
                          capability: { type: string }
                          description: { type: string }
                          score: { type: number }
                        required: [kind, capability, score]
                    # Every exported kind carries full detail, not just a name,
                    # so a client can preview any of them without a second
                    # request — the property that lets a result list stay
                    # scannable.
                    exportedKinds:
                      type: array
                      contains:
                        type: object
                        properties:
                          kind: { const: WriteLine }
                          capability: { type: string, minLength: 1 }
                          description: { type: string, minLength: 1 }
                          extends: { type: object }
                          runtime: { type: object }
                          deprecated: { type: object }
                        required: [kind, capability, description, extends, runtime, deprecated]
                    # A library's public surface is two lists, and console is
                    # the seeded module that has both: a kinds-only index would
                    # miss `writeLine`, a ready-made instance an importer
                    # references as `!ref <Alias>.writeLine`.
                    #
                    # `kind` is what the instance instantiates, read from its
                    # declaring doc — a bare name told a reader they could write
                    # the `!ref` but not what they would get. It is non-empty
                    # here precisely because `writeLine` is declared locally;
                    # a re-export would carry an empty one.
                    exportedResources:
                      type: array
                      contains:
                        type: object
                        properties:
                          name: { const: writeLine }
                          kind: { const: WriteLine }
                          description: { type: string, minLength: 1 }
                          declared: { const: writeLine }
                        required: [name, kind, description, declared]
                  required: [module, matchedKinds, exportedKinds, exportedResources]
            required: [hits]
        required: [status, body]
---
# Lexical typeahead: a partial (even typo-adjacent) token must complete to the
# registered ref, deduped to the latest tracked version.
kind: Run.Sequence
metadata: { name: refs_FuzzyMatchesSeededRef }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitRefs }
      url: http://localhost:8040/refs?q=consol
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertRefs }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              refs:
                type: array
                contains:
                  type: object
                  properties:
                    ref: { const: "oci://ghcr.io/telorun/console" }
                    latestVersion: { type: string, minLength: 1 }
                    description: { type: string }
                    repository: { type: string }
                    license: { type: string }
                  required: [ref, latestVersion, description, repository, license]
            required: [refs]
        required: [status, body]
---
kind: Run.Sequence
metadata: { name: moduleVersions_ListsSeededVersions }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitModuleVersions }
      url: http://localhost:8040/module/versions?ref=oci%3A%2F%2Fghcr.io%2Ftelorun%2Ftimer
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertModuleVersions }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              ref: { const: "oci://ghcr.io/telorun/timer" }
              # Not pinned to a version number: these are published modules
              # whose newest release moves, and what this route owes a caller
              # is a non-empty newest-first list for the ref it echoes back.
              #
              # `integrity` is the import pin for that version, and every
              # seeded ref is `oci://` — a transport that always produces a
              # hash — so it OUGHT to be required here. It is not yet, and the
              # reason is a bootstrap, not a shrug: the hub container tracks
              # with the `telo` its base image ships (see the workflow comment
              # above `Build workspace packages`), never the workspace one, so
              # `telo module manifest --json` in CI is a release that predates
              # the field and reports no pin. Make this `required` once a CLI
              # release carrying `integrity` lands in `telorun/node` and
              # TELO_NODE_VERSION is bumped to it — until then the shape is
              # asserted, the value cannot be. The CLI half is covered where it
              # can run: `cli/nodejs/tests/module-manifest.test.ts`.
              versions:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    version: { type: string, minLength: 1 }
                    integrity: { type: string, pattern: "^sha256-[A-Za-z0-9_-]{43}$" }
                  required: [version]
            required: [ref, versions]
        required: [status, body]
---
kind: Run.Sequence
metadata: { name: moduleVersions_UntrackedReturns404 }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitUntrackedVersions }
      url: http://localhost:8040/module/versions?ref=e2e/nonexistent-module
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertUntrackedVersions }
      schema:
        type: object
        properties:
          status: { const: 404 }
          body:
            type: object
            properties:
              error: { const: Module not tracked }
            required: [error]
        required: [status, body]
---
# Semantic ranking (Phase 2): an intent-shaped query with NO substring or
# lexical overlap with the kind ("delay") must still surface Timer.Delay via
# the vector arm. This can only pass if ingest embedded the seeded kinds and the
# RRF query fuses the vector hits — it fails on lexical-only ranking.
kind: Run.Sequence
metadata: { name: searchResources_SemanticMatch }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitSemanticSearch }
      url: "http://localhost:8040/search/resources?q=pause%20execution%20for%20a%20while"
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertSemanticSearch }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              hits:
                type: array
                minItems: 1
                contains:
                  type: object
                  properties:
                    kind: { const: Delay }
                    module:
                      type: object
                      properties:
                        ref: { const: "oci://ghcr.io/telorun/timer" }
                      required: [ref]
                  required: [kind, module]
            required: [hits]
        required: [status, body]
---
# The browse axes. Shape-only: which slugs exist depends on what the seeded
# modules declare, and the seed set is deliberately small — what must hold is
# that the facet query, the array-containment filter, and the contract join all
# execute and project the documented shape.
kind: Run.Sequence
metadata: { name: categories_ListsDeclaredFacet }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitCategories }
      url: http://localhost:8040/categories
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertCategories }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              categories:
                type: array
                items:
                  type: object
                  properties:
                    # `category` is the derived slug (what a filter takes),
                    # `label` the authored display text.
                    category: { type: string }
                    label: { type: string }
                    modules: { type: integer }
                  required: [category, label, modules]
            required: [categories]
        required: [status, body]
---
# Browse is the same endpoint with a facet filter and no query: the response
# must carry the pagination contract (`total`) so a caller can tell a complete
# listing from a truncated one.
kind: Run.Sequence
metadata: { name: searchModules_FiltersByCategory }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitBrowseByCategory }
      url: "http://localhost:8040/search/modules?q=&category=scheduling&limit=50"
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertBrowseByCategory }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              query: { const: "" }
              category: { const: scheduling }
              total: { type: integer }
              hits:
                type: array
                items:
                  type: object
                  properties:
                    module:
                      type: object
                      properties:
                        ref: { type: string }
                        version: { type: string }
                        # Slug matches the filter; label is whatever the author
                        # wrote (`Scheduling`), which is what a chip prints.
                        categories:
                          type: array
                          items:
                            type: object
                            properties:
                              slug: { type: string }
                              label: { type: string }
                            required: [slug, label]
                          contains:
                            type: object
                            properties:
                              slug: { const: scheduling }
                            required: [slug]
                      required: [ref, version, categories]
                  required: [module]
            required: [query, category, total, hits]
        required: [status, body]
---
kind: Run.Sequence
metadata: { name: implementations_ListsBackendsOfContract }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitImplementations }
      url: http://localhost:8040/implementations?ref=oci%3A%2F%2Fghcr.io%2Ftelorun%2Fkv-store&kind=Store
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertImplementations }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              extends:
                type: object
                properties:
                  ref: { const: "oci://ghcr.io/telorun/kv-store" }
                  kind: { const: Store }
                required: [ref, kind]
              # The seeded redis and memory backends both `extends` this
              # abstract from their own modules, which is the whole point of
              # the derived axis: the abstract's module never learns who
              # implements it, the resolved (ref, kind) join does.
              implementations:
                type: array
                minItems: 2
                items:
                  type: object
                  properties:
                    ref: { type: string }
                    kind: { const: Store }
                    capability: { type: string }
                  required: [ref, kind, capability]
                allOf:
                  - contains:
                      type: object
                      properties:
                        ref: { const: "oci://ghcr.io/telorun/kv-store-redis" }
                      required: [ref]
                  - contains:
                      type: object
                      properties:
                        ref: { const: "oci://ghcr.io/telorun/kv-store-memory" }
                      required: [ref]
            required: [extends, implementations]
        required: [status, body]
---
# GET /module — everything a module page renders in one call. Distinct from
# /search/*: keyed by ref rather than ranked, and it serves the full kind list
# rather than only what a query matched.
#
# The seeded `timer` module is used because it is in the compose SEED_REFS set
# and exports at least one kind. Values that move with a release (version,
# description) are asserted as shape; what is pinned is the contract — the ref
# echoes back, and the kind list is non-empty and carries the per-kind fields a
# page needs.
kind: Run.Sequence
metadata: { name: module_ReturnsDetailForSeededRef }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitModuleDetail }
      url: http://localhost:8040/module?ref=oci%3A%2F%2Fghcr.io%2Ftelorun%2Ftimer
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertModuleDetail }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              module:
                type: object
                properties:
                  ref: { const: "oci://ghcr.io/telorun/timer" }
                  version: { type: string, minLength: 1 }
                  latestVersion: { type: string, minLength: 1 }
                  # Derived from the ref, never declared — so unlike the runtime
                  # facets below it does not wait on a CLI release.
                  publisher: { const: "ghcr.io/telorun" }
                  transport: { const: oci }
                  # Present as a fixed shape even when the module declares none;
                  # a typed client must never have to probe for these.
                  deprecated:
                    type: object
                    properties:
                      reason: { type: string }
                    required: [reason]
                  runtime:
                    type: object
                    properties:
                      runtimes: { type: array }
                      full: { type: array }
                      languages: { type: array }
                      portable: { type: boolean }
                    required: [runtimes, languages, portable]
                required: [ref, version, latestVersion, publisher, transport, deprecated, runtime]
              kinds:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    kind: { type: string, minLength: 1 }
                    capability: { type: string }
                    description: { type: string }
                    extends:
                      type: object
                      properties:
                        kind: { type: string }
                        ref: { type: string }
                      required: [kind, ref]
                    runtime: { type: object }
                    deprecated: { type: object }
                  required: [kind, capability, description, extends, runtime, deprecated]
              versions:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
            required: [module, kinds, exportedResources, versions]
        required: [status, body]
---
# One 404 covers both "never registered" and "no such version": the caller's
# next move is identical, and separating them would leak which refs are tracked.
kind: Run.Sequence
metadata: { name: module_UntrackedReturns404 }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitUntrackedModule }
      url: http://localhost:8040/module?ref=e2e/nonexistent-module
      method: GET
  - name: assert
    inputs:
      actual: !cel "{'status': steps.hit.result.status, 'body': steps.hit.result.body}"
      expected:
        status: 404
        body:
          error: Module not tracked
    invoke:
      kind: Assert.Equals
---
# A tracked ref at a version that was never published takes the same 404 path,
# rather than falling back to the latest version and quietly answering a
# question the caller did not ask.
kind: Run.Sequence
metadata: { name: module_UnknownVersionReturns404 }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitUnknownVersion }
      url: http://localhost:8040/module?ref=oci%3A%2F%2Fghcr.io%2Ftelorun%2Ftimer&version=0.0.0-nope
      method: GET
  - name: assert
    inputs:
      actual: !cel "steps.hit.result.status"
      expected: 404
    invoke:
      kind: Assert.Equals
---
# The runtime filter is an enum, so a wrong value is an error rather than a
# near-empty result set. Without the enum an unrecognized value matches only
# portable kinds, which reads as "no such module" — and `nodejs` vs a guessed
# `node` is exactly the mistake a caller makes, since `nodejs` is what an
# `imports:` entry's `runtime:` field uses.
kind: Run.Sequence
metadata: { name: searchResources_RejectsUnknownRuntime }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitBadRuntime }
      url: "http://localhost:8040/search/resources?q=delay&runtime=deno"
      method: GET
  - name: assert
    inputs:
      actual: !cel "steps.hit.result.status"
      expected: 400
    invoke:
      kind: Assert.Equals
---
# The accepted value returns the ordinary 200 shape. Deliberately not asserting
# non-empty hits: the hub container tracks with the `telo` its base image ships,
# which predates the runtime block, so every seeded row has an empty runtime set
# until a CLI release lands (same bootstrap as `integrity` above).
kind: Run.Sequence
metadata: { name: searchResources_AcceptsKnownRuntime }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitGoodRuntime }
      url: "http://localhost:8040/search/resources?q=delay&runtime=nodejs"
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertGoodRuntime }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              runtime: { const: nodejs }
              hits: { type: array }
            required: [runtime, hits]
        required: [status, body]
---
# The category facet is open and author-declared, so it cannot be an enum the way
# `runtime` is — the guard is a lookup against the declared slugs instead. It has
# to be a 400: left to the filter, an unknown category selects nothing, and an
# empty hit list reads as "Telo has no such kind" rather than "bad argument".
kind: Run.Sequence
metadata: { name: searchResources_RejectsUnknownCategory }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitBadCategory }
      url: "http://localhost:8040/search/resources?q=delay&category=coordination-typo"
      method: GET
  - name: assert
    inputs:
      actual: !cel "steps.hit.result.status"
      expected: 400
    invoke:
      kind: Assert.Equals
---
# A KNOWN category that selects nothing for this query re-runs the search without
# it and says so, rather than returning the empty set.
#
# The pair must be picked from what the compose stack SEEDS, not from the
# standard library at large: the seeded corpus carries only compute,
# observability, scheduling and storage, so a category outside it takes the
# 400 path above instead and tests nothing. `console` × `storage` works because
# `console` matches the seeded console kinds strongly enough that the unfiltered
# arm is reliably non-empty, while terminal I/O is far enough from key/value
# storage — lexically and semantically — that the filtered arm is reliably empty.
kind: Run.Sequence
metadata: { name: searchResources_BroadensWhenCategoryExcludesEverything }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitExcludingCategory }
      url: "http://localhost:8040/search/resources?q=console&category=storage"
      method: GET
  - name: assert
    inputs:
      actual:
        status: !cel "steps.hit.result.status"
        dropped: !cel "steps.hit.result.body.categoryFilterDropped"
        recovered: !cel "size(steps.hit.result.body.hits) > 0"
      expected:
        status: 200
        dropped: true
        recovered: true
    invoke: { kind: Assert.Equals }
---
# The facet rides on EVERY response, not just /categories: it is what makes an
# open vocabulary learnable from inside a search, and a caller who has to fetch
# it separately guesses instead.
kind: Run.Sequence
metadata: { name: searchResources_CarriesCategoryFacet }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitFacetCarrier }
      url: "http://localhost:8040/search/resources?q=delay"
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertFacetCarried }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              categoryFilterDropped: { const: false }
              categories:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    category: { type: string }
                    label: { type: string }
                    modules: { type: integer }
                    kinds: { type: integer }
                  required: [category, label, modules, kinds]
            required: [categories, categoryFilterDropped]
        required: [status, body]
---
# /search/modules is guarded through the same vocabulary. Leaving it unguarded
# would just relocate the defect: an agent that falls back from kinds to modules
# would hit the silent empty set again.
kind: Run.Sequence
metadata: { name: searchModules_RejectsUnknownCategory }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitBadCategoryModules }
      url: "http://localhost:8040/search/modules?q=delay&category=coordination-typo"
      method: GET
  - name: assert
    inputs:
      actual: !cel "steps.hit.result.status"
      expected: 400
    invoke:
      kind: Assert.Equals
---
# GET /modules lists exactly the refs GET /module answers 200 for — local refs
# and tesseract-lang packs included, since both routes read one predicate. Only
# the seeded refs are compared, never a ref registered by hand into the stack.
kind: Run.Sequence
metadata: { name: modules_ListsExactlyTheRefsModuleAnswers }
steps:
  - name: seeded
    value:
      - oci://ghcr.io/telorun/kv-store
      - oci://ghcr.io/telorun/kv-store-redis
      - oci://ghcr.io/telorun/kv-store-memory
      - oci://ghcr.io/telorun/timer
      - oci://ghcr.io/telorun/scheduler
      - oci://ghcr.io/telorun/run
      - ./modules/ocr
      - ./modules/tesseract-model
      - ./modules/tesseract
      - ./modules/tesseract-lang/pol
      - ./modules/tesseract-lang/deu
      - ./modules/tesseract-lang/fra
      - oci://ghcr.io/telorun/console
  - name: list
    invoke:
      kind: HttpClient.Request
      url: http://localhost:8040/modules
      method: GET
  - name: probe
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.refs"
      steps:
        - name: detail
          invoke:
            kind: HttpClient.Request
            url: http://localhost:8040/module
            method: GET
          inputs:
            query:
              ref: !cel "string(item)"
      outputs:
        ref: !cel "string(item)"
        found: !cel "steps.detail.result.status == 200"
        latestVersion: !cel "steps.detail.result.status == 200 ? steps.detail.result.body.module.latestVersion : ''"
    inputs:
      refs: !cel "steps.seeded.result"
  - name: assert
    inputs:
      actual:
        status: !cel "steps.list.result.status"
        next: !cel "steps.list.result.body.next"
        listed: !cel >-
          steps.list.result.body.modules
            .filter(m, m.ref in steps.seeded.result)
            .map(m, {'ref': m.ref, 'latestVersion': m.latestVersion})
        ascending: !cel >-
          enumerate(steps.list.result.body.modules).all(e,
            e.index == 0 || steps.list.result.body.modules[e.index - 1].seq < e.value.seq)
      expected:
        status: 200
        next: null
        # Ordered as /modules orders them, so the comparison is of sets.
        listed: !cel >-
          steps.list.result.body.modules
            .filter(m, m.ref in steps.probe.result.filter(p, p.found).map(p, p.ref))
            .map(m, {'ref': m.ref,
                     'latestVersion': steps.probe.result.filter(p, p.ref == m.ref)[0].latestVersion})
        ascending: true
    invoke: { kind: Assert.Equals }
  - name: nothingMissing
    inputs:
      actual: !cel >-
        steps.probe.result.filter(p, p.found)
          .filter(p, !(p.ref in steps.list.result.body.modules.map(m, m.ref)))
      expected: []
    invoke: { kind: Assert.Equals }
---
# Walking /modules two at a time yields the full listing page by page: each page
# is the next two entries past the cursor, `next` is the page's last seq while
# pages are full, and the walk ends on the page whose `next` is null.
kind: Run.Sequence
metadata: { name: modules_PagesChainByNext }
steps:
  - name: full
    invoke:
      kind: HttpClient.Request
      url: http://localhost:8040/modules
      method: GET
  - name: walk
    invoke:
      kind: Run.Loop
      condition: !cel "previous == null || previous.page.result.body.next != null"
      maxIterations: 1000
      steps:
        - name: cursor
          value: !cel "previous == null ? 0 : previous.page.result.body.next"
        - name: page
          invoke:
            kind: HttpClient.Request
            url: http://localhost:8040/modules
            method: GET
          inputs:
            query:
              after: !cel "string(steps.cursor.result)"
              limit: "2"
        - name: check
          inputs:
            actual:
              status: !cel "steps.page.result.status"
              body: !cel "steps.page.result.body"
            expected:
              status: 200
              body:
                modules: !cel >-
                  enumerate(inputs.full.filter(m, m.seq > steps.cursor.result))
                    .filter(e, e.index < 2).map(e, e.value)
                next: !cel >-
                  size(inputs.full.filter(m, m.seq > steps.cursor.result)) >= 2
                    ? inputs.full.filter(m, m.seq > steps.cursor.result)[1].seq
                    : null
          invoke: { kind: Assert.Equals }
      outputs:
        finished: !cel "steps.page.result.body.next == null"
    inputs:
      full: !cel "steps.full.result.body.modules"
  - name: assert
    inputs:
      actual: !cel "steps.walk.result.finished"
      expected: true
    invoke: { kind: Assert.Equals }
---
# `limit` is bounded by the route's query schema, so an out-of-range page size is
# the caller's mistake rather than an empty or unbounded page.
kind: Run.Sequence
metadata: { name: modules_RejectsInvalidLimit }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      url: http://localhost:8040/modules?limit=0
      method: GET
  - name: assert
    inputs:
      actual: !cel "steps.hit.result.status"
      expected: 400
    invoke: { kind: Assert.Equals }
