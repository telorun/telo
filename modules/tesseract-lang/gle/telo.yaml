  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/gle.traineddata.gz:
        { upstream: gle, member: package/4.0.0_best_int/gle.traineddata.gz, sha256: 89a1eca11aff0e62280bdaa6c0344eb1de765b67058a7cbace95bf5b8b4b7be4, executable: false }
---
kind: TesseractModel.Language
metadata:
  name: gle
  description: Irish, Latin script
code: gle
data: !module-path ./tessdata/gle.traineddata.gz
