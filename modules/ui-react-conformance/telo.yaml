kind: Telo.Library
metadata:
  name: UiReactConformance
  version: 0.5.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [UI, Testing]
  description: >-
    Conformance testing for web interface themes and control sets: draws every
    screen element the renderer has in a simulated browser and reports what a
    theme leaves unstyled, which layout properties it must not override, and
    which interactive controls break keyboard, focus, dismissal or value
    reporting. Run from a theme module's own tests; an empty list means it
    conforms.
requires:
  # The checks resolve the renderer's built entries through this module's
  # direct import of ui-react, which runtimes before this release do not do.
  # On 0.120.1 the import of ui-react is refused first: this block makes the
  # refusal name this module too (MODULE_REQUIRES_NEWER_RUNTIME), verified by
  # execution of `check`.
  telo: ">=0.121.0"
imports:
  # The design token names come from `ui`'s code entry, their CSS spelling
  # from ui-react's contract entry.
  Ui: ../ui
  UiReact: ../ui-react
exports: { kinds: [CheckTheme, CheckControls] }
---
# One thing a check found wrong. The `check` names what is wrong, and the
# `subject` is what it is wrong about.
kind: Telo.JsonSchema
metadata: { name: Problem }
schema:
  type: object
  additionalProperties: false
  required: [check, subject, message]
  properties:
    check:
      title: Check
      description: What is wrong.
      type: string
      enum: [part-unstyled, unstyled-stale, property-reserved, token-default-missing, token-unread, stylesheet-unparseable, vector-failed, scene-failed, controls-load-failed]
    subject:
      title: Subject
      description: >-
        What it is wrong about: a part, `<part>: <property>`, a token's dotted
        name, a stylesheet's path, `<Control>: <vector>`, a scene's name, or a
        control set.
      type: string
    message:
      title: Message
      description: What was found, and what to do about it.
      type: string
---
kind: Telo.Definition
metadata:
  name: CheckTheme
  description: >-
    Checks a theme against the renderer's styling and controls contract: every
    element it draws is styled or listed as deliberately unstyled with a reason,
    no rule overrides a layout property behaviour depends on, every brand token
    has a default and is read, every stylesheet parses, every screen still works
    with the theme's controls, and each of its control sets behaves. Answers the
    problems found, none when it conforms.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/ui-react-conformance.mjs&local_path=./nodejs/src/index.ts#CheckThemeController]
inputType: { kind: Telo.JsonSchema, schema: { type: object, additionalProperties: false } }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [problems]
    properties:
      problems:
        title: Problems
        description: What the theme does not meet, in the order of the checks; empty when it conforms.
        type: array
        items: { $ref: "telo://Self/Problem" }
schema:
  type: object
  additionalProperties: false
  required: [theme]
  properties:
    theme:
      title: Theme
      description: The theme checked.
      x-telo-ref: { kind: UiReact.Theme, use: dependency }
    unstyled:
      title: Unstyled
      description: >-
        Parts the theme deliberately leaves to the renderer's layout alone, each
        with the reason. A part listed here that the theme does style is
        reported as stale.
      type: array
      items:
        type: object
        additionalProperties: false
        required: [part, reason]
        properties:
          part: { title: Part, type: string }
          reason: { title: Reason, type: string, minLength: 1 }
---
kind: Telo.Definition
metadata:
  name: CheckControls
  description: >-
    Checks a set of interactive controls against the renderer's controls
    contract: every vector of each control it implements is run in a simulated
    browser — the intents and values it reports, where focus goes, the parts and
    states it draws, focus trapping, dismissal reasons. Answers the problems
    found, none when it conforms.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/ui-react-conformance.mjs&local_path=./nodejs/src/index.ts#CheckControlsController]
inputType: { kind: Telo.JsonSchema, schema: { type: object, additionalProperties: false } }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [problems]
    properties:
      problems:
        title: Problems
        description: The vectors the set fails, or that it did not load; empty when it conforms.
        type: array
        items:
          allOf:
            - { $ref: "telo://Self/Problem" }
            - { properties: { check: { enum: [vector-failed, controls-load-failed] } } }
schema:
  type: object
  additionalProperties: false
  required: [controls]
  properties:
    controls:
      title: Controls
      description: The control set checked.
      x-telo-ref: { kind: UiReact.Controls, use: dependency }
