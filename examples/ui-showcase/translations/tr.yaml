  # Forms.
  - { text: Every control from the model, translation: Modelden her denetim }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "Alan yazılmadığında form, her özellik için şemasına göre seçilen bir denetim çizer: bir metin kutusu, numaralandırma için bir liste, sayı kutuları, bir tarih, bir tarih ve saat, bir saat, belge için çok satırlı bir kutu, bir onay kutusu, numaralandırma listesi için yan yana seçenekler ve sözcük listesi için yazılan etiketler. Açıklama alanının altında bir ipucu, varsayılan değer ise başlangıç değeridir." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "Her alan, dokunulduğu anda modele göre denetlenir: başlığın uzunluğu, kişi sayısı, 50'lik adımlarla bütçe, anahtar sözcüklerin yazımı. Sunucu başka bir talepte kullanılan bir başlığı reddeder ve yanıtı başlık alanına düşer. Yazılanlar adreste ve bu tarayıcıda saklanır — modelin yalnızca yazılabilir olarak işaretlediği giriş kodu hariç." }
  - { text: Each control chosen by hand, translation: Elle seçilen her denetim }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "Her alan için yazılmış bir denetimle aynı talep: başlık türetilmiş denetimine bırakılır; tür yan yana seçenekler, kanallar çoklu seçimli bir liste, kişi sayısı bir kaydırıcı, aciliyet bir geçiş düğmesi ve anahtar sözcükler etiketler olarak. Yazılanlar yalnızca bu sekme için saklanır." }
  - { text: Requests received, translation: Alınan talepler }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "İki formun gönderdiği son talepler; her kayıttan sonra yeniden okunur." }
  - { text: "Choices, pickers and dates", translation: "Seçimler, seçiciler ve tarihler" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "Bir proje için kişi rezervasyonu. Proje, projeler koleksiyonundan okunan bir listeden seçilir; her seçenekte ipucu olarak kodu yer alır. Sorumlu bir iletişim kutusunda, adına göre aranarak, üstte seçilen roldeki aktif üyeler arasından seçilir; başka bir rol seçmek seçenekleri yeniden okur ve sorumluyu yalnızca hâlâ uyuyorsa korur. İnceleyenler bir çekmecede, aynı anda birkaç kişi, sponsor ise bir açılır balonda seçilir; sponsor varsayılan bir e-postayla başlar ve tek bir sorguyla kişinin adı olarak gösterilir. Yardımcılar yan yana, üçer üçer sunulur; geri kalanlar için Daha fazla vardır. Seçilen kişi e-postasına bağlantı verir." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "Dönem, hazır aralıkları olan iki tarihtir; haftaları pazar günü başlar, başlangıçta gelecek ayı gösterir ve üç ayı aşınca uyarır. Sunucu, başlamadan önce biten ya da bir yılı aşan bir dönemi reddeder ve yanıtı dönem alanına düşer. Sorumlunun çevresindeki kişiler bir sorumlu seçildiğinde, saha adresi ise yalnızca sahadaki işler için gösterilir." }
  - { text: The project, translation: Proje }
  - { text: "Which project, and who leads the work.", translation: "Hangi proje ve işi kim yürütüyor." }
  - { text: Around the lead, translation: Sorumlunun çevresi }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "İşi kim inceliyor, kim destekliyor ve kim yardım ediyor." }
  - { text: When and where, translation: Ne zaman ve nerede }
  - { text: Tomorrow, translation: Yarın }
  - { text: Next week, translation: Gelecek hafta }
  - { text: This month, translation: Bu ay }
  - { text: Next month, translation: Gelecek ay }
  - { text: Next quarter, translation: Gelecek çeyrek }
  - { text: Next year, translation: Gelecek yıl }
  - { text: Bookings, translation: Rezervasyonlar }
  - { text: "The latest bookings, read again after every save.", translation: "Son rezervasyonlar; her kayıttan sonra yeniden okunur." }

