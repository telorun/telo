kind: Telo.Application
metadata:
  name: NotesDesktop
  version: 1.0.0
  description: |
    The `notes-web` sign-in app in a desktop window. The identity provider's answer
    arrives at `/auth/callback`, a path the desktop host is told to expect, so the
    sign-in that started in the window ends in the window.

    Run: telo run ./examples/notes-desktop
lang: en
imports: { App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II, Desktop: oci://ghcr.io/telorun/desktop@0.2.0#sha256-cU03iOG4aAfb5a_xw1BA7mTrL2xbyVdR5up42nAKnJo }
ports: { http: { env: PORT, default: 53817 } }
needs:
  desktopHost:
    kind: Telo.DesktopHost
    parameters:
      identifier: run.telo.examples.notes
      productName: Notes
      icon: !module-path icon.png
      port: http
      callbackPaths: [/auth/callback]
targets:
  - !ref web
  - !ref mainWindow
---
kind: App.Instance
metadata: { name: web }
source: ../notes-web
ports: { http: !cel "ports.http" }
---
kind: Desktop.Window
metadata: { name: mainWindow }
host: !ref desktopHost
title: Notes
size: { width: 960, height: 640 }
