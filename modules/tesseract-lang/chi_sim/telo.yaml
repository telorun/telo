  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/chi_sim.traineddata.gz:
        { upstream: chi_sim, member: package/4.0.0_best_int/chi_sim.traineddata.gz, sha256: b8a23f10c7de500891eb458a8adc9cc58ab7f242f08b7d149f5e9aea4ad5db7c, executable: false }
---
kind: TesseractModel.Language
metadata:
  name: chi_sim
  description: Chinese (Simplified), Han script
code: chi_sim
data: !module-path ./tessdata/chi_sim.traineddata.gz
