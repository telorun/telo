modules:
  modules/ui-react: Added
body: "UiReact.App, a mount that serves a Ui interface as a web application: the page
  shell, per-request application and page documents, content-addressed scripts,
  stylesheets and fonts, and an event stream, drawn by a prebuilt React renderer. Ships
  the styling contract (parts, states, cascade layers) and the ui_react-1 component ABI
  with the useHost host module. An edit form sends the whole row back, since PUT
  replaces it: the row's model properties with each field's entered value over them, and
  an emptied field left out. Requires telo 0.112.0 or newer (requires: telo:
  \">=0.112.0\")."
