# A provider's status read in the own field of a sibling declared in the same
# `with:` scope: a member's own fields never see a sibling in `resources`. This
# library's own check refuses the read (`CEL_UNKNOWN_FIELD`); the kernel refuses
# it when the sequence opens its scope and creates the member.
kind: Telo.Library
metadata:
  name: ScopedProviderStatusAtStartup
  version: 1.0.0
  description: >-
    Fixture library reading a scoped provider's observed state in a sibling
    member's own field, which the kernel refuses when the scope opens and this
    library's own check reports.
imports:
  Status: ../kinds
  Run: ../../../../../modules/run
exports:
  resources: [check]
---
kind: Run.Sequence
metadata:
  name: check
with:
  - kind: Status.Endpoint
    metadata:
      name: first
    port: 1
  - kind: Status.Endpoint
    metadata:
      name: second
    port: !cel "resources.first.status.port"
steps:
  - name: read
    invoke: !ref second
