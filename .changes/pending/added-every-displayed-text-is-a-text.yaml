modules:
  modules/ui: Added
body: "Every displayed text is a Text written in the module's lang: (ui declares lang:
  en): node texts are Ui.BoundText - a Text, or { text, values } whose accessor values a
  renderer fills in the page - and action labels, column headers, group labels, presets,
  disabledText and confirm are Texts; a placeholder nothing fills is refused by telo
  check. New Ui.Words kind and the exported English set Ui.words hold the words a
  renderer draws on its own, and texts ui fills in are word references { word: <id> }.
  Provided nodes carry text records (the TextRecord fragment), labels: [{ value, label
  }] on value nodes, list and table columns, filter fields and every field spec, a
  required description on field specs, and a date range's initialPreset as the preset's
  index or null. @telorun/ui exports SpecTranslator, which replaces every text record of
  a provided node by following Ui.SpecNode, and isWords. Breaking: a renderer receives
  records and word references where it received strings."
