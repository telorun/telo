---
kind: Telo.Definition
metadata:
  name: FindRelationships
  description: >-
    Lists the links of one type in a knowledge graph, optionally only those from a
    given source or to a given target, filtered by their properties and ordered by
    source then target, and read a bounded page at a time through an opaque
    cursor until the listing ends.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph.mjs&local_path=./nodejs/src/index.ts#FindRelationships
throws:
  codes:
    GRAPH_CURSOR_INVALID:
      description: >-
        The cursor is malformed, of an envelope version this runtime does not
        read, or was issued for another operation, type or filter.
inputType:
  type: object
  additionalProperties: false
  properties:
    source:
      title: Source
      description: Only relationships starting at this node.
      x-telo-schema-projection-from: { from: /relationship/source, pick: /relationship/source/key }
    target:
      title: Target
      description: Only relationships ending at this node.
      x-telo-schema-projection-from: { from: /relationship/target, pick: /relationship/target/key }
    where:
      title: Where
      description: >-
        Operator-first filter over the relationship's own properties: each
        operator holds a partial property map, and every comparison is ANDed.
        `eq` of null matches a relationship without the property and `ne` of null
        one that has it; no other comparison matches a missing property.
      type: object
      additionalProperties: false
      properties:
        eq: { x-telo-schema-projection-from: /relationship }
        ne: { x-telo-schema-projection-from: /relationship }
        lt: { x-telo-schema-projection-from: /relationship }
        lte: { x-telo-schema-projection-from: /relationship }
        gt: { x-telo-schema-projection-from: /relationship }
        gte: { x-telo-schema-projection-from: /relationship }
    limit:
      title: Limit
      description: The most relationships returned in one page.
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
    cursor:
      title: Cursor
      description: >-
        The `next` of an earlier page of this same listing — same type, same
        filter — passed back unchanged to read the page after it. Omitted, the
        listing starts at its beginning.
      type: string
outputType:
  type: object
  required: [relationships]
  additionalProperties: false
  properties:
    relationships:
      title: Relationships
      description: One page of the matching relationships, ordered by source then target.
      type: array
      items:
        type: object
        required: [source, target, properties]
        additionalProperties: false
        properties:
          source: { x-telo-schema-projection-from: { from: /relationship/source, pick: /relationship/source/key } }
          target: { x-telo-schema-projection-from: { from: /relationship/target, pick: /relationship/target/key } }
          properties: { x-telo-schema-projection-from: /relationship }
          origin:
            title: Origin
            description: The layer the value was resolved from; set only by a layered store.
            type: string
    next:
      title: Next
      description: >-
        The cursor of the following page. Present only when more exist; absent on
        the last page.
      type: string
schema:
  type: object
  required: [store, relationship]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The graph holding the relationships.
      x-telo-ref:
        kind: Self.Store
        use: dependency
    relationship:
      title: Relationship
      description: The relationship type listed. The store must list it in 'relationships:'.
      x-telo-ref:
        kind: Self.Relationship
        use: dependency
  x-telo-resource-rules:
    - resolve: [/store]
      condition: !cel "self.store.?relationships.orValue([]).exists(r, r.name == self.relationship.name)"
      code: GRAPH_TYPE_NOT_IN_STORE
      message: names a relationship type its store does not list in 'relationships:'.
---
# Graph.Traverse — a path expressed as a list of hops, each over one relationship
# type in a direction, repeated a bounded number of times. The hops must chain
# from `from` to `to`, which is checked from the declarations before anything
# runs; the result is the distinct set of end nodes, never the paths.
kind: Telo.Definition
metadata:
  name: Traverse
  description: >-
    Follows links through a knowledge graph from one starting entity, hop by hop
    along declared link types and directions, each hop repeatable a bounded number
    of times, and returns the distinct entities reached at the end — friends of
    friends, documents citing documents — filtered, ordered by key and read a
    bounded page at a time through an opaque cursor.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph.mjs&local_path=./nodejs/src/index.ts#Traverse
throws:
  codes:
    GRAPH_NODE_NOT_FOUND:
      description: The start node does not exist.
    GRAPH_CURSOR_INVALID:
      description: >-
        The cursor is malformed, of an envelope version this runtime does not
        read, or was issued for another operation, type or filter.
inputType:
  type: object
  required: [key]
  additionalProperties: false
  properties:
    key:
      title: Key
      description: The start node's key, typed from the `from` node type's key.
      x-telo-schema-projection-from: { from: /from, pick: /from/key }
    where:
      title: Where
      description: >-
        Operator-first filter over the end nodes' properties: each operator holds
        a partial property map, and every comparison is ANDed. `eq` of null
        matches a node without the property and `ne` of null one that has it; no
        other comparison matches a missing property.
      type: object
      additionalProperties: false
      properties:
        eq: { x-telo-schema-projection-from: { from: /to, omit: [/to/key] } }
        ne: { x-telo-schema-projection-from: { from: /to, omit: [/to/key] } }
        lt: { x-telo-schema-projection-from: { from: /to, omit: [/to/key] } }
        lte: { x-telo-schema-projection-from: { from: /to, omit: [/to/key] } }
        gt: { x-telo-schema-projection-from: { from: /to, omit: [/to/key] } }
        gte: { x-telo-schema-projection-from: { from: /to, omit: [/to/key] } }
    limit:
      title: Limit
      description: The most end nodes returned in one page.
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
    cursor:
      title: Cursor
      description: >-
        The `next` of an earlier page of this same listing — same type, same
        filter — passed back unchanged to read the page after it. Omitted, the
        listing starts at its beginning.
      type: string
outputType:
  type: object
  required: [nodes]
  additionalProperties: false
  properties:
    nodes:
      title: Nodes
      description: One page of the distinct end nodes reached, ordered by key.
      type: array
      items:
        type: object
        required: [key, properties]
        additionalProperties: false
        properties:
          key: { x-telo-schema-projection-from: { from: /to, pick: /to/key } }
          properties: { x-telo-schema-projection-from: { from: /to, omit: [/to/key] } }
          origin:
            title: Origin
            description: The layer the value was resolved from; set only by a layered store.
            type: string
    next:
      title: Next
      description: >-
        The cursor of the following page. Present only when more exist; absent on
        the last page.
      type: string
schema:
  type: object
  required: [store, from, hops, to]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The graph traversed.
      x-telo-ref:
        kind: Self.Store
        use: dependency
    from:
      title: From
      description: The node type the traversal starts at.
      x-telo-ref:
        kind: Self.Node
        use: dependency
    to:
      title: To
      description: The node type the traversal ends at; the result holds nodes of this type.
      x-telo-ref:
        kind: Self.Node
        use: dependency
    hops:
      title: Hops
      description: >-
        The path, in order. Each hop follows one relationship type in a direction,
        between `minHops` and `maxHops` times; the hops must chain from `from` to
        `to`.
      type: array
      minItems: 1
      items:
        type: object
        required: [relationship]
        additionalProperties: false
        properties:
          relationship:
            title: Relationship
            description: The relationship type this hop follows.
            x-telo-ref:
              kind: Self.Relationship
              use: dependency
          direction:
            title: Direction
            description: >-
              `out` follows a relationship from its source to its target, `in` from
              its target to its source, `both` either way.
            type: string
            enum: [out, in, both]
            default: out
          minHops:
            title: Min Hops
            description: The fewest times this hop is followed.
            type: integer
            minimum: 1
            default: 1
          maxHops:
            title: Max Hops
            description: >-
              The most times this hop is followed; defaults to `minHops`. A
              repeated hop stops at this bound whatever cycles the graph holds.
            type: integer
            minimum: 1
  x-telo-resource-rules:
    - resolve: [/store]
      condition: !cel >-
        self.store.nodes.exists(n, n.name == self.from.name)
          && self.store.nodes.exists(n, n.name == self.to.name)
          && self.hops.all(h, self.store.?relationships.orValue([]).exists(r, r.name == h.relationship.name))
      code: GRAPH_TYPE_NOT_IN_STORE
      message: >-
        names a node type or relationship type its store does not list in 'nodes:'
        or 'relationships:'.
    # The node type each hop enters must be the one the previous hop left, the
    # first must be `from` and the last must leave at `to`: one list equality.
    - resolve: [/hops]
      condition: !cel >-
        [self.from.name] + self.hops.map(h,
            h.?direction.orValue('out') == 'in' ? h.relationship.source.name : h.relationship.target.name)
          == self.hops.map(h,
            h.?direction.orValue('out') == 'in' ? h.relationship.target.name : h.relationship.source.name)
            + [self.to.name]
      code: GRAPH_HOPS_DISCONNECTED
      message: >-
        declares hops that do not chain from 'from' to 'to': each hop must start at
        the node type the previous one ended at (a relationship's source for
        `out`, its target for `in`), the first at 'from', and the last must end at
        'to'.
    - resolve: [/hops]
      in: /hops
      condition: !cel >-
        this.relationship.source.name == this.relationship.target.name
          || (this.?direction.orValue('out') != 'both'
            && this.?maxHops.orValue(this.?minHops.orValue(1)) <= 1)
      code: GRAPH_HOP_REPEAT_MIXED_TYPES
      message: >-
        follows a relationship whose source and target are different node types
        with `direction: both` or more than one repetition, which could not chain
        onto itself. Only a relationship between nodes of one type repeats.
    - in: /hops
      condition: !cel "!('maxHops' in this) || this.maxHops >= this.?minHops.orValue(1)"
      code: GRAPH_HOP_RANGE_INVALID
      message: sets maxHops below minHops.
