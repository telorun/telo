steps:
  - name: parse
    invoke: { kind: Html.JsonTree }
    inputs: { html: !cel "variables.page" }
  - name: select
    invoke:
      kind: Html.Selection
      selector: ":playing"
    inputs: { document: !cel "steps.parse.result" }
  - name: assertMatches
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.select.result.nodes.map(n, n.attrs.id)"
      expected: []
