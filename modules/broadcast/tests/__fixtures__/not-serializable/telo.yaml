kind: Telo.Application
metadata:
  name: BroadcastNotSerializable
  version: 1.0.0
  description: A channel whose message type holds a stream.
imports: { Broadcast: ../../.. }
---
kind: Broadcast.MemoryChannel
metadata: { name: uploads }
name: uploads
messageType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      parts: { type: array, items: { x-telo-type: { name: Telo.Stream, of: Telo.Bytes } } }
