kind: Telo.Library
metadata:
  name: ai-openai
  version: 0.12.1
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: >-
    Language-model access for OpenAI and any OpenAI-compatible endpoint — Azure
    OpenAI, gateways, self-hosted servers — over the chat completions HTTP API with no
    vendor SDK. Supplies buffered completions, token streaming and tool calling to
    whichever operation holds the model.
imports:
  Ai: ../ai
exports:
  kinds:
    - OpenaiModel
---
kind: Telo.Definition
metadata:
  name: OpenaiModel
  description: >-
    A chat model served by OpenAI or an OpenAI-compatible endpoint: model id, API key,
    an optional base URL for gateways or Azure, and default request options that
    per-call overrides win over.
capability: Telo.Provider
extends: Ai.Model
controllers:
  - pkg:npm/@telorun/ai-openai@0.9.0?local_path=./nodejs#openai-model
schema:
  type: object
  properties:
    model:
      title: Model ID
      description: OpenAI model identifier passed to the API (e.g. gpt-4o, gpt-4o-mini).
      type: string
    apiKey:
      title: API Key
      description: Secret reference; typically `${{ secrets.OPENAI_API_KEY }}`.
      type: string
      x-telo-eval: compile
    baseUrl:
      title: Base URL
      description: Optional override for the OpenAI API base URL (Azure OpenAI, OpenAI-compatible gateways).
      type: string
      x-telo-eval: compile
    options:
      title: Options
      description: Model-level defaults as camelCase OpenAI request params (temperature, maxTokens, topP, …), normalized to snake_case and merged into the request body. Merged beneath Ai.Text.options / Ai.TextStream.options and per-call inputs.options; downstream wins.
      type: object
      additionalProperties: true
  required: [ model, apiKey ]
  additionalProperties: false
  examples:
    - model: gpt-4o-mini
      apiKey: "${{ secrets.openaiApiKey }}"
    - model: gpt-4o
      apiKey: "${{ secrets.openaiApiKey }}"
      baseUrl: https://my-gateway.example.com/v1
      options:
        temperature: 0.2
        maxTokens: 512
