    - { type: page, page: !ref rootThemes, icon: !ref themesIcon }
---
# The overview at the root: the view every application places, and nodes of
# this application's own evaluated per request.
kind: Ui.Page
metadata: { name: rootOverview }
path: /
title: Overview
children:
  - { type: composite, ref: !ref overviewPage }
  - type: stack
    children:
      - { type: text, text: Per request, style: heading }
      - type: text
        style: muted
        text: These nodes are the page's own, so their when and their text are evaluated for every request.
      - type: text
        style: accent
        text: Your browser asked for Polish.
        when: !cel "request.lang == 'pl'"
      - type: text
        text: Your browser did not ask for Polish.
        when: !cel "request.lang != 'pl'"
      - type: badge
        style: accent
        text: The Acme brand is on.
        when: !cel "'cookie' in request.headers && Self.cookie(request.headers['cookie'], 'showcase-brand') == 'acme'"
      - type: text
        style: muted
        text: A text an expression computes is shown as computed, never translated.
      - type: text
        text: !cel "'user-agent' in request.headers ? 'User-Agent: ' + request.headers['user-agent'] : 'No User-Agent header was sent.'"
---
# The conditions at the root, with a node of the page's own reading its query.
kind: Ui.Page
metadata: { name: rootConditions }
path: /conditions
title: Conditions
query: { mode: { type: string, enum: [compact, detailed] } }
children:
  - { type: composite, ref: !ref conditionsPage }
  - type: stack
    children:
      - { type: text, text: A page's own query, style: heading }
      - type: text
        style: muted
        text: This page declares mode as well, and its own nodes read it.
      - type: text
        style: success
        text: The page reads mode as detailed.
        shown: { at: !cel "query.mode", matches: { const: detailed } }
      - type: value
        value: !cel "query.mode"
---
# The themes at the root, with links to the other two mounts and the brand switch.
kind: Ui.Page
metadata: { name: rootThemes }
path: /themes
title: Themes
children:
  - { type: composite, ref: !ref themesPage }
  - type: stack
    children:
      - { type: text, text: Switch the mount or the brand, style: heading }
      - type: text
        style: muted
        text: >-
          These links are this application's own: a link resolves under the mount it is drawn in, so only the
          application at the root reaches the other two. Each is an ordinary load of another application.
      - type: columns
        children:
          - { type: link, text: Open the Radix mount, href: /radix/themes }
          - { type: link, text: Open the brand mount, href: /brand/themes }
      - type: text
        style: muted
        text: >-
          This application's brand is chosen for every request. The switch sets or clears a cookie and comes
          back here, and while the cookie is there the Acme token set is used instead of the theme's own.
      - type: columns
        children:
          - { type: link, text: Use the Acme brand, href: "/api/brand?set=acme" }
          - { type: link, text: "Use the theme's own values", href: "/api/brand?set=none" }
      - type: badge
        style: accent
        text: The Acme brand is on.
        when: !cel "'cookie' in request.headers && Self.cookie(request.headers['cookie'], 'showcase-brand') == 'acme'"
