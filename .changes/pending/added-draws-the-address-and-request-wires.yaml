modules:
  modules/ui-react: Added
body: "Draws the address and request wires `ui` now produces: a link, menu item,
  `value`, `list` or table column, relation or option-source `href` is expanded in the
  browser over its row, query and data roots (an address that does not resolve is drawn
  as plain text and reported once as `ERR_UI_ADDRESS_UNRESOLVED`); a reader's `source`
  is a request target (unresolved: nothing is sent and its failure is drawn); an action
  sends its `request` — `POST`, `PUT` and `PATCH` with the input less the consumed
  properties, `DELETE` with no body — and a 2xx with no body is a success unless a
  result tree, `navigate` or a `refreshes` entry reads it. After a success the resolved
  target path, each `refreshes` path and a listing's own base and record paths are
  announced, and every `Ui.Data`, `Ui.Listing` and `Ui.Chat` reading exactly that path
  reads again. A move to the page already shown keeps its nodes mounted. A manifest
  written against the old `href` string, `source.params` or action `path` wire no longer
  renders."
