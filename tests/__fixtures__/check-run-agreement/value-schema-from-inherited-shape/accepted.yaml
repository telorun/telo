# Calls the kind typed through its inherited annotation with caller data its
# reader accepts: the check is clean and the call returns.
kind: Telo.Application
metadata:
  name: ValueSchemaFromInheritedShapeAccepted
  version: 1.0.0
imports:
  Lib: ./accepted-lib
  Run: ../../../../modules/run
targets:
  - !ref calls
---
kind: Lib.Caller
metadata:
  name: caller
readers:
  - contextType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required: [turnId]
        properties:
          turnId: { type: string }
---
kind: Run.Sequence
metadata:
  name: calls
steps:
  - name: call
    invoke: !ref caller
    inputs:
      context: { turnId: "t1" }
