# `telo check` reports this here; a consumer's check sees nothing, so there the
# resource refuses itself when the application boots.
kind: Telo.Library
metadata:
  name: McpPromptNameEmpty
  version: 1.0.0
  description: Test fixture exporting a prompt entry declaring an empty name.
imports:
  Mcp: ../../../../../
  Run: ../../../../../../run
exports:
  resources: [First]
---
kind: Run.Value
metadata: { name: answer }
value:
  text: ok
---
kind: Mcp.Prompts
metadata: { name: First }
entries:
  - name: ""
    handler: !ref answer
    inputs: {}
    result:
      messages:
        - { role: user, content: { type: text, text: !cel "result.text" } }
