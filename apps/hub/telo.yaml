# Telo Hub — federated discovery
#
# Umbrella metadata index over Telo modules hosted on any transport (HTTP
# registry, OCI). Registered module refs are tracked through the generic
# `telo module versions|digest|manifest` CLI verbs, each version's `telo.yaml`
# is cached to the static manifest bucket (studio's browser-safe OCI read
# path), and every `Telo.Definition` is indexed one row per
# `(module-version, resource-kind)` for per-resource search. The hub stores
# only derived metadata — never artifact payloads — so it can vanish and every
# install still works (resolution is origin-direct).
#
# THIS FILE IS THE COMPOSITION ROOT and nothing else: it binds the environment,
# owns the one connection, the one bucket, the one embedder, the one vector index
# and the one shell host, hands each of them to the libraries that need it, and
# mounts the HTTP and MCP surfaces over what they export. The nine concerns that
# used to live here are six libraries beside it:
#
#   hub-schema.yaml   the tables, the shared derivations, the ingest claim
#   hub-origin.yaml   reading a module from wherever it is published
#   hub-ingest.yaml   one version → bucket bytes, rows and vectors, durably
#   hub-search.yaml   ranked search over kinds and modules
#   hub-catalog.yaml  keyed reads: one module, one version, one manifest
#   hub-registry.yaml validating and recording a submitted ref
#
# No library knows any other exists, apart from the two dependency edges that are
# real: ingest and registration both read origins, and both issue the claim.

kind: Telo.Application
metadata:
  name: TeloHub
  version: 0.8.1
  description: >-
    Federated discovery hub: tracks registered module refs across transports,
    caches manifests, and serves per-resource search over HTTP and MCP.
requires:
  # 0.83.0: `resources:` on an import — the instances handed down to each library.
  # 0.87.0: a route's `catches:` is checked against a union the analyzer resolves
  # by following an exported entry point into its declaring library. An older
  # runtime sees `{∅}` for every cross-module handler and rejects seven of the
  # codes below.
  telo: ">=0.87.0"
imports:
  Http: oci://ghcr.io/telorun/http-server@0.29.2#sha256-9MtWZqXF9agsYRx97nLMJZW7YYwXpW2dLYcn_oA4kUs
  Sql: oci://ghcr.io/telorun/sql@0.24.0#sha256-g0Bw5AjrBOGmgGbmsKFb7q833AYlutxV1fDWka47t2I
  Postgres: oci://ghcr.io/telorun/postgres@0.4.0#sha256-urAQgZtDIlbm4PFi0OlBgYPTU0fSdFbw3l3sHVdh-MQ
  Run: oci://ghcr.io/telorun/run@0.26.0#sha256-ZhW56yiMCImqBh0wJ4mVaUvh5WuUVIaWErASFx--wCY
  Shell: oci://ghcr.io/telorun/shell@0.11.4#sha256-modXQfwktXBMR5nkigZU4nqYCm8KJgUjFfzJjr-Cc4g
  S3: oci://ghcr.io/telorun/s3@0.8.0#sha256-utdJQwmumCl0orYETnVY1oA7ytOZuik8syMIRZ1t_8o
  Mcp: oci://ghcr.io/telorun/mcp-server@0.16.0#sha256-GGSQyzXynfdHeMNTS3vqOceP1Uw9rCoJriPlL_Ph-fU
  Console: oci://ghcr.io/telorun/console@0.17.4#sha256-T3hXxYNK-UClSE_wssnkYI-urC-4c8CEx82rSBc-dR4
  Embedding: oci://ghcr.io/telorun/embedding@0.11.4#sha256-SgB_TzvQFqoiKCzLuR9qgYSXtbzDVU_FUbmLq26H6Go
  OpenAI: oci://ghcr.io/telorun/openai@0.3.1#sha256-FVg-jmRPGB43Or9_LU8XhDhG_G2Mio56iiSDwi_ofLk
  HttpClient: oci://ghcr.io/telorun/http-client@0.22.0#sha256-UyC8nQDnKHXyPpPPHC7TS8MicesLsgDUKWBYObf5oQ4
  CacheMemory: oci://ghcr.io/telorun/cache-memory@0.9.0#sha256-xf5Sl63MYbMSM4GzzRPVNrqbtrxQ27x9cwFKrDCjCEM
  RateLimit: oci://ghcr.io/telorun/rate-limit@0.12.4#sha256-_E2AqSEEsTotJXiSmk9GBqlnlwW8JRXNJXZWbx-olxY
  VectorStore: oci://ghcr.io/telorun/vector-store@0.10.3#sha256-pf5RXD52Y8bNjLiVVpZZ7W4ApLftZcjv0bsOtYbmK_8
  VectorStorePgvector: oci://ghcr.io/telorun/vector-store-pgvector@0.12.0#sha256-2PYbXSCmI2WlRtVQoQJO6ebJzmVHBOe1kJk8c3-wjfg
  Scheduler: oci://ghcr.io/telorun/scheduler@0.9.0#sha256-4MpeweWGk4LedDa34TE9lELndNfl9YyBLAyOiHyap9s
  Durable: oci://ghcr.io/telorun/durable-local@0.3.0#sha256-zMx3J2RRD_eb5c8BRWE9CaWZ1_XsiiB_6SaF5o7csNg
  # ── The hub's own libraries ────────────────────────────────────────────────
  # Each is handed the instances declared below. `hub-schema` and `hub-origin`
  # declare `lifecycle: shared`, so the imports of them here and inside
  # `hub-ingest` / `hub-registry` all resolve to ONE instantiation — which is
  # what lets those two reach the claim and the CLI without the composition
  # being linearized into a chain.
  Schema:
    source: ./hub-schema.yaml
    resources:
      connection: !ref db
  Search:
    source: ./hub-search.yaml
    resources:
      connection: !ref db
      embedQuery: !ref embedQuery
      vectorMatch: !ref vectorMatch
    variables:
      minScore: !cel "variables.vectorMinScore"
  Catalog:
    source: ./hub-catalog.yaml
    resources:
      connection: !ref db
      bucketGet: !ref getManifest
  Ingest:
    source: ./hub-ingest.yaml
    resources:
      connection: !ref db
      bucketPut: !ref putManifest
      embedPassage: !ref embedPassage
      vectorUpsert: !ref vectorUpsert
      vectorRemove: !ref vectorRemove
      shellHost: !ref localShell
    variables:
      teloBin: !cel "variables.teloBin"
      ingestRev: !cel "variables.ingestRev"
  Registry:
    source: ./hub-registry.yaml
    resources:
      connection: !ref db
      rateLimit: !ref registerRateLimit
      shellHost: !ref localShell
      scheduleIngest: !ref Ingest.scheduleIngest
    variables:
      teloBin: !cel "variables.teloBin"
      ingestRev: !cel "variables.ingestRev"
ports:
  http:
    env: PORT
    default: 8040
variables:
  dbConnection:
    env: DB_CONNECTION
    type: string
  bucketName:
    env: MANIFEST_BUCKET_NAME
    type: string
  bucketEndpoint:
    env: MANIFEST_BUCKET_ENDPOINT
    type: string
  bucketForcePathStyle:
    env: MANIFEST_BUCKET_FORCE_PATH_STYLE
    type: boolean
    default: false
  # Curated first-party ref list, JSON array (e.g. '["oci://ghcr.io/telorun/console","oci://ghcr.io/acme/telo-s3"]').
  # Registered idempotently on boot; the reconcile pass ingests them.
  seedRefs:
    env: SEED_REFS
    type: array
    default: []
  # When the reconcile pass runs. Standard 5-field cron, in UTC.
  trackCron:
    env: TRACK_CRON
    type: string
    default: "*/15 * * * *"
  # Disable the periodic reconcile (tests and one-shot ingests drive
  # `Ingest.scheduleDueVersions` directly).
  trackEnabled:
    env: TRACK_ENABLED
    type: boolean
    default: true
  # The revision of the ingest pipeline. Raising it makes every tracked version
  # due exactly once — the whole-registry re-ingest control, and what a change to
  # what ingest EXTRACTS is deployed with. Per-version and per-module re-ingest
  # is a write to `version_ingest.ingest_rev` instead; see the README.
  ingestRev:
    env: INGEST_REV
    type: integer
    default: 1
  # Path of the telo CLI the origin reads shell out to (`telo` on PATH by default).
  teloBin:
    env: TELO_BIN
    type: string
    default: telo
  # Self-hosted embeddinggemma-300m server, OpenAI-compatible /embeddings API.
  # The `/v1` base URL the embedding controller appends `/embeddings` to.
  embedderBaseUrl:
    env: EMBEDDER_BASE_URL
    type: string
  # Relevance floor for the semantic arm — see the note beside `minScore` in
  # hub-search.yaml, which is where it is applied.
  vectorMinScore:
    env: VECTOR_MIN_SCORE
    type: number
    default: 0.3
  # Per-IP budget for the open /register verb. Registration is unauthenticated
  # and reads a remote origin, so it is the one endpoint that must not be free
  # to hammer.
  registerRateLimit:
    env: REGISTER_RATE_LIMIT
    type: integer
    default: 5
  registerRateWindow:
    env: REGISTER_RATE_WINDOW
    type: string
    default: 10m
secrets:
  bucketAccessKeyId:
    env: MANIFEST_BUCKET_ACCESS_KEY_ID
    type: string
  bucketSecretAccessKey:
    env: MANIFEST_BUCKET_SECRET_ACCESS_KEY
    type: string
targets:
  # Migrations first: every read below and the ingest claim itself are written
  # against tables this creates.
  - !ref Schema.migrations
  - !ref seedModules
  - !ref hubServer
  # Continues ingest runs whose process died, and starts the ones the reconcile
  # pass and /register schedule.
  - !ref resumer
  # One pass at boot. A cron fires at calendar instants, so without this a fresh
  # deployment — or a compose stack that has just seeded its refs — would sit
  # unindexed until the next quarter hour. It only enumerates, claims and
  # schedules; the runs themselves execute through the resumer above, so this
  # does not hold the boot sequence open for the length of an ingest.
  - ref: !ref Ingest.scheduleDueVersions
    when: !cel "variables.trackEnabled"
  - ref: !ref reconcile
    when: !cel "variables.trackEnabled"
---
# ── Storage ───────────────────────────────────────────────────────────────────
# The static manifest cache (manifests.telo.sh in production): an S3-compatible
# bucket (Cloudflare R2 / MinIO) ingest writes each version's telo.yaml into at
# the deterministic `<transport>/<host>/<path…>/<version>/telo.yaml` key — the
# key the `telo` CLI computes with the analyzer's shared helper, so the write key
# and studio's read key never drift. Never artifact payloads.

kind: S3.Bucket
metadata:
  name: manifestStore
bucketName: !cel "variables.bucketName"
endpoint: !cel "variables.bucketEndpoint"
forcePathStyle: !cel "variables.bucketForcePathStyle"
accessKeyId: !cel "secrets.bucketAccessKeyId"
secretAccessKey: !cel "secrets.bucketSecretAccessKey"
createIfMissing: true
# The manifest cache is the public, cookieless read plane — studio fetches
# cached telo.yaml with anonymous CORS GETs. On R2 public access comes from the
# domain binding instead; this covers S3-compatible local/dev backends.
publicRead: true
---
kind: S3.Put
metadata:
  name: putManifest
bucketRef: !ref manifestStore
---
kind: S3.Get
metadata:
  name: getManifest
bucketRef: !ref manifestStore
---
# ── Database ──────────────────────────────────────────────────────────────────
# ONE connection, handed to every library that reads or writes. It is also the
# connection the durable journal records through, which is what makes an ingest
# step's record commit with the step — see hub-ingest.yaml.

kind: Postgres.Connection
metadata:
  name: db
connectionString: !cel "variables.dbConnection"
---
# ── Semantic search: embedding model + pgvector index ────────────────────────
# The embedder is a self-hosted embeddinggemma-300m sidecar (OpenAI-compatible);
# the vector index is a pgvector table the backend owns, living in the same
# database as the relational rows. The RRF search query never touches that
# table — it only fuses the ids VectorStore.Match returns.

# The sidecar's endpoint, declared as an account. It carries no `credential:` at
# all — the self-hosted server needs none, which is the honest spelling of what
# used to be an `apiKey: unused` placeholder.
kind: HttpClient.Client
metadata:
  name: embedderClient
baseUrl: !cel "variables.embedderBaseUrl"
---
kind: HttpClient.Request
metadata:
  name: embedderRequest
client: !ref embedderClient
---
kind: OpenAI.EmbeddingModel
metadata:
  name: embedder
# Pinned to the stored vectors: embeddinggemma-300m → 768 dims. A model change
# is a re-embed, never an in-place swap.
model: embeddinggemma-300m
request: !ref embedderRequest
# embeddinggemma is prompt-tuned: it expects these exact wrappers, and without
# them the similarity spread collapses (every kind lands in a narrow band and
# the ranking degenerates into orthographic noise — "Schema" outranking a real
# scheduling match for the query "schedule"). Changing either wrapper is a
# re-embed of the whole index, exactly like changing the model.
queryPrompt: "task: search result | query: {text}"
passagePrompt: "title: none | text: {text}"
---
kind: Embedding.Passage
metadata:
  name: embedPassage
model: !ref embedder
---
kind: Embedding.Query
metadata:
  name: embedQuery
model: !ref embedder
---
# The vectors table (`resource_vectors`) is provisioned by this Store on init —
# CREATE EXTENSION vector + table + HNSW index. 768 dims is fixed at creation.
kind: VectorStorePgvector.Store
metadata:
  name: vectorIndex
connection: !ref db
dimensions: 768
metric: cosine
table: resource_vectors
---
kind: VectorStore.Record
metadata:
  name: vectorUpsert
store: !ref vectorIndex
---
kind: VectorStore.Match
metadata:
  name: vectorMatch
store: !ref vectorIndex
topK: 50
---
kind: VectorStore.Removal
metadata:
  name: vectorRemove
store: !ref vectorIndex
---
# ── Rate limiting (open /register verb) ──────────────────────────────────────
# Counters live in an in-process memory store: the hub is a single instance, and
# a limiter that resets on restart is the right trade here (a Cache.Redis store
# is a drop-in swap if the hub is ever replicated). The guard is non-throwing —
# it returns a verdict and the caller maps it to a 429.

kind: CacheMemory.Store
metadata:
  name: rateLimitCounters
---
kind: RateLimit.Guard
metadata:
  name: registerRateLimit
store: !ref rateLimitCounters
limit: !cel "variables.registerRateLimit"
window: !cel "variables.registerRateWindow"
---
# ── Local shell (origin reads → telo CLI) ────────────────────────────────────
# Every transport-specific read goes through the generic `telo module …` CLI
# verbs — nothing here speaks OCI or the registry protocol directly.

kind: Shell.LocalHost
metadata:
  name: localShell
---
# ── Boot and background work ─────────────────────────────────────────────────

# The curated seed list: rows only. What ingests them is the reconcile pass,
# which is also what re-ingests them when their content moves.
kind: Run.Iteration
metadata:
  name: seedModules
collection: !cel "variables.seedRefs"
steps:
  - name: register
    invoke: !ref Registry.registerModule
    inputs:
      ref: !cel "string(item)"
---
# The reconcile pass. A cron rather than a sleep loop, so a tick means a
# calendar instant rather than "an interval after whatever the last pass took",
# and a pass that overruns does not push every later one along with it.
kind: Scheduler.Cron
metadata:
  name: reconcile
cron: !cel "variables.trackCron"
invoke: !ref Ingest.scheduleDueVersions
---
# Picks up ingest runs whose process died, and starts the ones the reconcile pass
# and /register schedule — a scheduled run is admitted immediately and executed
# here, which is what keeps the request path free of the work.
kind: Durable.Resumer
metadata:
  name: resumer
workflow: !ref Ingest.ingestVersion
interval: 2s
---
# ── HTTP surface (telo.sh) ────────────────────────────────────────────────────
# The cloud CLI: the generic read verbs plus discovery as HTTP paths. Dynamic
# reads only — the static manifest read lives on the bucket domain, and
# install/run stay origin-direct and never touch this app.

kind: Http.Server
metadata:
  name: hubServer
host: "0.0.0.0"
port: !cel "ports.http"
cors:
  origin: "*"
  methods: "GET,POST,OPTIONS"
openapi:
  info:
    title: Telo Hub
    # The HTTP API's own version, not the app version (which changie owns) —
    # deliberately outside the release replacement.
    version: 1.0.0
    description: >-
      Federated discovery over Telo modules: per-resource search, ref
      autocomplete, and version enumeration for registered modules.
mounts:
  - path: /health
    mount: !ref health
  - path: /mcp
    mount: !ref mcpHttp
  - path: /
    mount: !ref publicApi
---
kind: Http.Api
metadata:
  name: health
routes:
  - request:
      path: /readiness
      method: GET
    returns:
      - status: 200
        content:
          application/json:
            body:
              status: "ok"
  - request:
      path: /liveness
      method: GET
    returns:
      - status: 200
        content:
          application/json:
            body:
              status: "ok"
---
kind: Http.Api
metadata:
  name: publicApi
routes:
  # Search and browse are ONE surface: `category` narrows the same query, and an
  # empty `q` degrades to an unranked listing, so `?q=&category=storage` browses
  # a category without a second endpoint that would drift from this one.
  - request:
      path: /search/resources
      method: GET
      schema:
        query:
          type: object
          properties:
            q: { type: string, default: "", description: "Search query over resource kinds." }
            category:
              type: string
              default: ""
              description: "Narrow to kinds in this category. Empty means no facet filter."
            runtime:
              type: string
              default: ""
              # Enumerated, because an unrecognized value would otherwise select
              # only portable kinds — a near-empty result set that reads as "no
              # such module" rather than "bad filter". The labels match the
              # `runtime:` field on an `imports:` entry, so `nodejs` (not `node`)
              # is what an author who has read a manifest will reach for.
              enum: ["", "nodejs", "rust"]
              description: >-
                Narrow to kinds a given kernel can load ("nodejs", "rust"). Telo
                is polyglot, so a kind's controllers decide which kernels can host
                it; without this filter a caller composing for one kernel is
                offered kinds it cannot run. Kinds with no controllers at all are
                portable and always match. Empty means no filter.
    handler: !ref Search.searchResources
    inputs:
      q: !cel "request.query.q"
      category: !cel "request.query.category"
      runtime: !cel "request.query.runtime"
    returns:
      - status: 200
        content:
          application/json:
            body:
              query: !cel "request.query.q"
              category: !cel "request.query.category"
              runtime: !cel "request.query.runtime"
              categories: !cel "result.categories"
              categoryFilterDropped: !cel "result.categoryFilterDropped"
              hits: !cel "result.hits"
    catches:
      # A category outside the declared vocabulary is the caller's mistake, so
      # it is a 400 carrying the vocabulary — not a 200 with an empty list.
      - status: 400
        when: !cel "error.code == 'ERR_UNKNOWN_CATEGORY'"
        content:
          application/json:
            body:
              error: !cel "error.message"

  - request:
      path: /search/modules
      method: GET
      schema:
        query:
          type: object
          properties:
            q: { type: string, default: "", description: "Search query, results grouped by module." }
            category:
              type: string
              default: ""
              # Not an enum — the vocabulary is open. Guarded instead: see the
              # note on /search/resources.
              description: >-
                Narrow to modules in this category. A slug outside the declared
                vocabulary is a 400, not an empty list; a recognized one that
                selects nothing for the query is dropped and reported as
                `categoryFilterDropped`. Empty means no facet filter.
            runtime:
              type: string
              default: ""
              enum: ["", "nodejs", "rust"]
              description: >-
                Narrow to modules a given kernel can load ("nodejs", "rust"). A
                module matches when that kernel runs at least one of its kinds —
                the hit's `runtime.full` says whether it covers all of them.
                Empty means no filter.
            limit:
              type: integer
              default: 20
              minimum: 1
              maximum: 100
              description: "Page size. Browsing a whole category needs more than a ranked top-N."
            offset: { type: integer, default: 0, minimum: 0, description: "Rows to skip." }
    handler: !ref Search.searchModules
    inputs:
      q: !cel "request.query.q"
      category: !cel "request.query.category"
      runtime: !cel "request.query.runtime"
      limit: !cel "request.query.limit"
      offset: !cel "request.query.offset"
    returns:
      - status: 200
        content:
          application/json:
            body:
              query: !cel "request.query.q"
              category: !cel "request.query.category"
              runtime: !cel "request.query.runtime"
              categories: !cel "result.categories"
              categoryFilterDropped: !cel "result.categoryFilterDropped"
              total: !cel "result.total"
              hits: !cel "result.hits"
    catches:
      - status: 400
        when: !cel "error.code == 'ERR_UNKNOWN_CATEGORY'"
        content:
          application/json:
            body:
              error: !cel "error.message"

  # Browse, not search: the categories that actually exist, with how many
  # modules and kinds sit in each. Answered by the SAME resource the search
  # guard consults, so "what slugs exist" has one definition — publishing a slug
  # here that the guard would reject was the divergence this collapses.
  - request:
      path: /categories
      method: GET
    handler: !ref Search.categoryVocabulary
    inputs:
      category: ""
    returns:
      - status: 200
        content:
          application/json:
            body:
              categories: !cel >-
                result.categories.map(c, {'category': c.category, 'label': c.label,
                                          'modules': c.modules, 'kinds': c.kinds})

  # Every kind that implements a given contract, across module boundaries — the
  # derived grouping axis. A backend is discoverable from the abstract it
  # extends without the abstract's module knowing it exists.
  - request:
      path: /implementations
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Ref of the module owning the extended kind." }
            kind: { type: string, description: "Extended kind's suffix, e.g. Store." }
          required: [ref, kind]
    handler: !ref Catalog.implementations
    inputs:
      ref: !cel "request.query.ref"
      kind: !cel "request.query.kind"
    returns:
      - status: 200
        content:
          application/json:
            body:
              extends: !cel "{'ref': request.query.ref, 'kind': request.query.kind}"
              implementations: !cel "result.implementations"

  # Lexical ref typeahead (pg_trgm): completes a ref whose name the author
  # already knows — the memorable token at an OCI path's tail matches without
  # the scheme/host boilerplate, and a typo still hits. Not the semantic
  # /search/* — no embedder in this path, ever.
  - request:
      path: /refs
      method: GET
      schema:
        query:
          type: object
          properties:
            q: { type: string, default: "", description: "Fuzzy substring over registered refs." }
    handler: !ref Catalog.refSuggestions
    inputs:
      q: !cel "request.query.q"
    returns:
      - status: 200
        content:
          application/json:
            body:
              query: !cel "request.query.q"
              refs: !cel "result.refs"

  # Everything a module page renders, in one call. `/search/*` answers "which
  # module should I use"; this answers "tell me about this one", which a search
  # hit cannot: it is keyed by ref rather than ranked, serves a specific version
  # rather than only the latest, and carries the full kind list with the
  # per-kind detail a card has no room for.
  - request:
      path: /module
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Module ref exactly as registered." }
            version:
              type: string
              default: ""
              description: "Tracked version to describe. Empty means the latest."
          required: [ref]
    handler: !ref Catalog.moduleDetail
    inputs:
      ref: !cel "request.query.ref"
      version: !cel "request.query.version"
    returns:
      - status: 200
        when: !cel "result.found"
        content:
          application/json:
            body:
              module: !cel "result.module"
              kinds: !cel "result.kinds"
              exportedResources: !cel "result.exportedResources"
              versions: !cel "result.versions"
      # One 404 for both "never registered" and "no such version": the caller's
      # next move is the same either way, and distinguishing them would leak
      # which refs are tracked.
      - status: 404
        content:
          application/json:
            body:
              error: Module not tracked

  - request:
      path: /module/versions
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Module ref exactly as registered." }
          required: [ref]
    handler: !ref Catalog.moduleVersionList
    inputs:
      ref: !cel "request.query.ref"
    returns:
      - status: 200
        when: !cel "result.found"
        content:
          application/json:
            body:
              ref: !cel "request.query.ref"
              versions: !cel "result.versions"
      - status: 404
        content:
          application/json:
            body:
              error: Module not tracked

  # Open, unauthenticated self-service registration (the apps/hub-web SPA on
  # hub.telo.run POSTs here cross-origin). Validates the ref resolves to a real
  # Telo module and, on success, records it and schedules its first ingest.
  #
  # 202, not 200: indexing is asynchronous now, so "accepted" is the honest
  # claim and `GET /register/status?ref=` is what says when it is searchable.
  - request:
      path: /register
      method: POST
      schema:
        body:
          type: object
          additionalProperties: false
          properties:
            ref:
              type: string
              minLength: 1
              description: "Module ref to register (e.g. oci://ghcr.io/acme/telo-s3 or https://host/path/telo.yaml)."
          required: [ref]
    handler: !ref Registry.registerAndValidate
    inputs:
      ref: !cel "request.body.ref"
      clientIp: !cel "request.ip"
    returns:
      - status: 429
        when: !cel "result.rateLimited"
        headers:
          Retry-After: !cel "string(result.retryAfter)"
        content:
          application/json:
            body:
              error: !cel "result.error"
              retryAfter: !cel "result.retryAfter"
      - status: 202
        when: !cel "result.accepted"
        content:
          application/json:
            body:
              registered: true
              ref: !cel "result.ref"
              status: pending
      - status: 400
        content:
          application/json:
            body:
              error: !cel "result.error"
    catches:
      # The CLI emits JSON on a clean exit, but a malformed payload would surface
      # as ERR_PARSE_FAILED — treat that as an unreadable module (400). Any other
      # throw is a server-side fault: return only the error CODE, never the
      # message, since this endpoint is anonymous and a raw message can carry
      # host paths or upstream detail.
      - status: 400
        when: !cel "error.code == 'ERR_PARSE_FAILED'"
        content:
          application/json:
            body:
              error: could not read module metadata
      - status: 500
        content:
          application/json:
            body:
              code: !cel "error.code"
              error: registration failed

  # What a client polls after a 202. Answered from the ROWS — the authoritative
  # record of what has been ingested — rather than from a durable run: a run is
  # per version and its id carries a digest and an attempt the client does not
  # hold, while a ref spans many versions.
  - request:
      path: /register/status
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Module ref exactly as submitted to /register." }
          required: [ref]
    handler: !ref Catalog.registrationStatus
    inputs:
      ref: !cel "request.query.ref"
    returns:
      # 404 with the SAME shape as every other answer: a client polling this
      # reads one body, and `status` is the field it branches on. A 404 whose
      # body carried only an error string is indistinguishable to that client
      # from a hub it could not reach, which is a different fact entirely.
      - status: 404
        when: !cel "result.status == 'unknown'"
        content:
          application/json:
            body:
              ref: !cel "result.ref"
              status: !cel "result.status"
              error: Module not registered
      - status: 200
        content:
          application/json:
            body:
              ref: !cel "result.ref"
              status: !cel "result.status"
              latestVersion: !cel "result.latestVersion"
              versionsKnown: !cel "result.versionsKnown"
              versionsIngested: !cel "result.versionsIngested"
              error: !cel "result.error"
              nextAttemptAt: !cel "result.nextAttemptAt"

  - request:
      path: /health
      method: GET
    handler:
      kind: Run.Value
      value:
        status: ok
    returns:
      - status: 200
        content:
          application/json:
            body:
              status: !cel "result.status"
---
# ── MCP surface ───────────────────────────────────────────────────────────────

kind: Mcp.Tools
metadata:
  name: HubTools
entries:
  # search_resources — the unit an LLM composes with is a resource kind it can
  # import, not a package. Each hit carries the kind suffix and the exact
  # module location ref to import it under a chosen alias.
  - name: search_resources
    description: |
      Search resource kinds across every registered Telo module, on any host or
      transport. Each hit carries the kind suffix (e.g. `Bucket` — the prefix
      is YOUR import alias), its capability and description, the kernels that
      can load it, and the owning module's exact location ref + version. Follow
      up with `get_module_manifest(ref)` to read the full schemas.
    argumentsSchema:
      type: object
      properties:
        query: { type: string, description: "What the resource should do (name or description)." }
        category:
          type: string
          default: ""
          # Not enumerable — the vocabulary is open, so the guard is a hard
          # error naming the real slugs and every response carries the facet,
          # rather than a silent empty set.
          description: >-
            Optional domain slug to narrow the search. OMIT IT UNLESS YOU KNOW
            THE SLUG EXISTS: categories are declared by module authors and open-
            ended, so a guessed one is rejected rather than answered. Every
            response lists the real vocabulary under `categories`; searching
            once without this argument is the way to learn it.
        runtime:
          type: string
          default: ""
          # Enumerated so a wrong value is a tool error, not a near-empty result
          # set: an unrecognized value would match only portable kinds, which
          # reads as "nothing like that exists" rather than "bad argument".
          enum: ["", "nodejs", "rust"]
          description: >-
            Optional kernel the composed manifest will run on (`nodejs`,
            `rust`). Telo is polyglot and a kind's controllers decide which
            kernels can host it, so without this you may be offered a kind the
            target kernel cannot load. Kinds with no controllers are portable and
            always match. Omit unless the caller named a runtime.
      required: [query]
      additionalProperties: false
    handler: !ref Search.searchResources
    inputs:
      q: !cel "request.arguments.query"
      category: !cel "request.arguments.?category.orValue('')"
      runtime: !cel "request.arguments.?runtime.orValue('')"
    result:
      content:
        - type: text
          # `categories` rides on every response so one search teaches the whole
          # facet vocabulary, and `categoryFilterDropped` says the hits are from
          # a widened search rather than from the requested category.
          text: !cel >-
            json({'query': request.arguments.query, 'categories': result.categories,
                  'categoryFilterDropped': result.categoryFilterDropped, 'hits': result.hits})
    catches:
      # -32602 (invalid params), not an empty hit list: a guessed category that
      # answered "no such kind" is what sent an agent hunting for a capability
      # it had already found. The message carries the real slugs.
      - when: !cel "error.code == 'ERR_UNKNOWN_CATEGORY'"
        error:
          code: -32602
          message: !cel "error.message"

  # get_module_manifest — keyed off the module's location ref, serving the
  # cached telo.yaml.
  - name: get_module_manifest
    description: |
      Fetch the raw `telo.yaml` for a tracked module by its location ref
      (e.g. `oci://ghcr.io/acme/telo-s3`). The response
      contains the `Telo.Library` and `Telo.Definition` docs that fully
      describe the module's public surface. `version` defaults to `latest`
      (the latest tracked version).
    argumentsSchema:
      type: object
      properties:
        ref: { type: string, description: "Module location ref exactly as returned by search_resources." }
        version:
          type: string
          default: latest
          description: Exact version to fetch, or `latest` (default).
      required: [ref]
      additionalProperties: false
    handler: !ref Catalog.moduleManifestText
    inputs:
      ref: !cel "request.arguments.ref"
      version: !cel "request.arguments.?version.orValue('latest')"
    result:
      content:
        - type: text
          text: !cel "result.text"
    catches:
      - when: !cel "error.code == 'ERR_NOT_FOUND'"
        error:
          code: -32004
          message: Module not found
      - when: !cel "error.code == 'ERR_INVALID_REFERENCE' || error.code == 'ERR_INVALID_RESPONSE'"
        error:
          code: -32603
          message: !cel "error.message"
---
kind: Mcp.HttpEndpoint
metadata:
  name: mcpHttp
serverInfo:
  name: telo-hub
  # Restated for now. `!cel "module.version"` is what this should be — the
  # binding exists — but `serverInfo` on the PINNED mcp-server is not yet a CEL
  # slot. The annotation is in this repo's `modules/mcp-server`; switching here
  # waits on publishing that and moving the pin.
  version: 0.6.2
instructions: !literal |
  This MCP server is the **Telo hub** — federated discovery over Telo modules
  hosted on any registry or OCI host. Telo is a declarative runtime: YAML
  manifests describe desired state; the kernel resolves resources and runs a
  controller per kind. CEL expressions are written as `!cel "..."` tags.

  Fetch these for full context:
  - https://telo.run/llms.txt — guide & kind reference.
  - https://telo.run/examples.md — working example manifests.
  - https://telo.run/cel.md — CEL function reference.

  ## Tools
  - `search_resources(query, category?)` — find resource KINDS by what they do.
    Each hit carries the kind suffix (`Bucket`), its capability/description, and
    the owning module's exact location ref + version. Search UNFILTERED first:
    `category` is an open, author-declared vocabulary, a guessed slug is
    rejected outright, and a wrong-but-real one hides the answer. Every response
    lists the real slugs under `categories`, so one call teaches you the set.
  - `get_module_manifest(ref, version?)` — read a tracked module's `telo.yaml`
    by location ref. Its `Telo.Definition` docs are JSON Schemas: the EXACT
    field shapes you must produce. `version` defaults to `latest`.

  ## Composing an application
  1. `search_resources` for each capability you need.
  2. `get_module_manifest` on each hit's `module.ref`; read the
     `Telo.Definition` schemas — never guess fields from a kind name.
  3. Write one `Telo.Application`. Declare dependencies in the `imports` map
     (PascalCase alias → the hit's `ref@version`, e.g.
     `S3: oci://ghcr.io/acme/telo-s3@1.2.0`). A hit's kind suffix is written as
     `<YourAlias>.<suffix>` — the prefix is the alias you chose, never a fixed
     name. `targets` lists the runnables/services to start.

  ## Must-know
  - No `spec:` wrapper — resource fields sit at the doc top level.
  - `variables:` / `secrets:` entries each need an `env:` var name and a
    JSON-Schema `type:`.
  - Tag dynamic leaves with `!cel`, not whole inline collections.
  - Install/run resolve against the module's own host — the hub only stores
    discovery metadata and cached manifests, never artifact payloads.
tools:
  - !ref HubTools
