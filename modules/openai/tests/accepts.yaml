  - name: chatNoAccepts
    try:
      - name: chatNoAcceptsCall
        inputs: { messages: [{ role: user, content: [{ type: image, mediaType: image/png, data: aGk= }] }] }
        invoke: !ref chatPlain
      - name: chatNoAcceptsReached
        throw: { code: TEST_FAILED, message: chatNoAccepts reached an answer }
    catch:
      - name: chatNoAcceptsSeen
        value: !cel "error.code + ':' + (has(error.data.mediaType) ? error.data.mediaType : '-')"
  - name: chatListed
