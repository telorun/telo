        failure:
          assign:
            - /api/assign
            - Assign
            - [ id, assigneeEmail ]
            - danger
            - - [ text, null ]
              - [ text, { at: { root: error, path: [] }, matches: { required: [ status ] } } ]
              - [ value, null ]
            - { id: { root: input, path: [ id ] } }
            - { title: { root: result, path: [ title ] }, assignee: { root: result, path: [ assignee ] } }
          refused:
            - /api/estimate
            - [ days ]
            - { type: value, value: { root: result, path: [ days ] }, labels: [], present: { type: integer } }
            - warning
            - { code: { root: error, path: [ code ] } }
            - { root: error, path: [ message ] }
        navigate:
          - [ /api/project-page, [ choice ], { navigate: { root: result, path: [ page ] }, refreshes: [] } ]
          - [ /api/homepage, [], { navigate: { root: result, path: [ homepage ] }, refreshes: [] } ]
        counts: [ { path: /api/task-counts, params: { code: { value: TEL-42 } } }, { root: data, path: [ code ] } ]
        move: [ /api/task-status, [ id, status ], { refreshes: [ /api/task-counts, /api/tasks ] }, [ text, value ] ]
        comment:
          - /api/comments
          - serial
          - [ taskId ]
          - at: { root: values, path: [ body ] }
            matches: { minLength: 3 }
            disabledText: { lang: en, message: [ Write three characters or more. ] }
          - { refreshes: [ /api/comments ] }
          - id: { root: result, path: [ id ] }
            title: { root: result, path: [ taskTitle ] }
            count: { root: result, path: [ count ] }
        table:
          source: [ /api/tasks, { projectCode: { value: TEL-42 } }, 8 ]
          rowActions:
            - - /api/task-status
              - Start
              - { id: { root: row, path: [ id ] }, status: { value: doing } }
              - "-"
              - []
              - [ { const: todo }, Already started. ]
              - [ Started ]
            - - /api/task-status
              - Close
              - { id: { root: row, path: [ id ] }, status: { value: done } }
              - Close this task?
              - []
              - [ { not: { const: done } }, Already finished. ]
              - [ Closed ]
            - - /api/assign
              - Assign
              - { id: { root: row, path: [ id ] } }
              - "-"
              - [ assigneeEmail ]
              - []
              - [ { placeholder: title }, " is assigned to ", { placeholder: assignee }, "." ]
        list:
          source: { path: /api/comments, params: {} }
          rows: { root: data, path: [ comments ] }
          rowActions:
            - - /api/comments/pin
