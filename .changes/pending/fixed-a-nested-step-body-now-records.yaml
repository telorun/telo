modules:
  modules/durable-local: Fixed
  modules/run: Fixed
body: "A nested step body now records under the step that dispatched it instead of
  restarting at the root. Two nested bodies with a same-named step shared one key, and
  first-writer-wins handed the second the first's result — with no mismatch to detect
  when both dispatched the same target. The dispatching step's path rides the invocation
  context, so a nested body's keys hang under it and a crash inside one resumes inside
  it. Also: a run whose process was cancelled is left interrupted rather than settled as
  failed, so it stays resumable — settling it terminal made every crash produce an
  unrecoverable run, from the one feature whose purpose is surviving crashes."
