[package]
name = "telorun-sdk-core"
version = "0.109.0"
edition = "2021"
publish = false
description = "The Telo SDK's value domain — CEL values, typed frames, plain encodings, value types, logging — without a controller backend."

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
# The conformance vectors are read with serde_json, whose default float parsing
# is not correctly rounded; the vectors pin doubles to the last digit.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The controller-protocol vectors validate message bodies against their schemas,
# at the version and feature set `telorun-sdk`'s `native` backend uses.
jsonschema = { version = "0.49", default-features = false }
