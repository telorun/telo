kind: Telo.Application
metadata:
  name: JavaScriptDemo
  version: 1.0.0
  description: A demo showcasing a JavaScript script run from flat `targets`.
imports:
  JavaScript: oci://ghcr.io/telorun/javascript@0.12.0#sha256-HG9Ydrm-jnzR6H1phgJy_PUKxAtSUEy76QxmMn1VcLY
  Console: oci://ghcr.io/telorun/console@0.17.0#sha256-KqtPsRldzuy143cbP7H-z0jWgbju-NuP59ItFjkWUg4
targets:
  - name: Step1
    invoke: !ref MultiplyBy2
    inputs:
      value: 42
  - name: PrintResult
    invoke: !ref Console.writeLine
    inputs:
      output: |
        Evaluated JavaScript code.
        Result is: ${{ steps.Step1.result.result }}
---
kind: JavaScript.Script
metadata:
  name: MultiplyBy2
code: |
  function main({ value }) {
    return { result: value * 2 }
  }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      value: { type: number }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      result: { type: number }
