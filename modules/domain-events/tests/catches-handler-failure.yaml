# A library catching the wrapped failure around its emit is covered, whatever
# code an importer's handler throws.
kind: Telo.Application
metadata: { name: DomainEventsCatches, version: 1.0.0 }
imports: { Domain: ../, Assert: ../../assert, Catching: ./__fixtures__/lib-catching }
targets: [!ref test]
---
kind: Domain.Handler
metadata: { name: refuses }
event: !ref Catching.Registered
inputs: !cel "event"
invoke:
  kind: Telo.Sequence
  inputType: !ref Catching.Registered
  steps:
    - { name: refuse, throw: { code: MY_OWN_CODE, message: refused } }
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: register
    invoke: !ref Catching.register
    inputs: { email: "ada@lovelace.dev" }
  - name: assertCaught
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.register.result.outcome.result"
      expected: ERR_DOMAIN_EVENT_HANDLER_FAILED
