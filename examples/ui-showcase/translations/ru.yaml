# The showcase in Russian: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads and translated into Russian's four cases (`one`, `few`, `many`, and
# `other` for fractions); a word told apart by its context is translated once
# per context.
kind: I18n.Catalog
metadata:
  name: russian
lang: ru
texts:
  # Applications and pages.
  - { text: UI showcase, translation: Витрина интерфейса }
  - { text: UI showcase — Radix, translation: Витрина интерфейса — Radix }
  - { text: UI showcase — brand, translation: Витрина интерфейса — бренд }
  - { text: UI showcase — sidebar, translation: Витрина интерфейса — боковая панель }
  - { text: Overview, translation: Обзор }
  - { text: Conditions, translation: Условия }
  - { text: Data, translation: Данные }
  - { text: Tables, translation: Таблицы }
  - { text: Filters, translation: Фильтры }
  - { text: Forms, translation: Формы }
  - { text: Actions, translation: Действия }
  - { text: Components, translation: Компоненты }
  - { text: CRUD, translation: CRUD }
  - { text: Themes, translation: Темы }
  # The navigation's groups.
  - { text: Building blocks, translation: Основные элементы }
  - { text: Input, translation: Ввод }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: Логотип витрины интерфейса }
  - { text: Language, translation: Язык }
  - { text: Theme, translation: Тема }
  - { text: Default, translation: По умолчанию }
  - { text: Radix, translation: Radix }
  - { text: Brand, translation: Бренд }
  - { text: Sidebar, translation: Боковая панель }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: При каждом запросе }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "Эти узлы принадлежат самой странице, поэтому их when и текст вычисляются при каждом запросе." }
  - { text: Your browser asked for Polish., translation: Ваш браузер запросил польский. }
  - { text: Your browser did not ask for Polish., translation: Ваш браузер не запрашивал польский. }
  - { text: The Acme brand is on., translation: Бренд Acme включён. }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "Текст, вычисленный выражением, показывается как есть и никогда не переводится." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "Ссылка, которую этот запрос делает недействительной, заменяется узлом ошибки, а остальная часть страницы отдаётся как обычно." }
  - { text: Leaves the application, translation: Уводит из приложения }

  # The overview.
  - { text: Every node type, translation: Все типы узлов }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "Блок, стопка и колонки содержат другие узлы, и каждый отрисовывает свои дочерние узлы по-своему." }
  - { text: A box, translation: Блок }
  - { text: Groups its children., translation: Группирует дочерние узлы. }
  - { text: A stack, translation: Стопка }
  - { text: Draws its children one under another., translation: Отрисовывает дочерние узлы друг под другом. }
  - { text: A badge, translation: Значок }
  - { text: Columns, translation: Колонки }
  - { text: "Draw their children side by side, as these three are.", translation: "Отрисовывают дочерние узлы рядом друг с другом, как эти три." }
  - { text: Text in each style, translation: Текст в каждом стиле }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "Стиль говорит, что означает узел, а тема решает, как это выглядит. У узла может быть несколько стилей." }
  - { text: Heading, translation: Заголовок }
  - { text: Subheading, translation: Подзаголовок }
  - { text: Muted, translation: Приглушённый }
  - { text: Strong, translation: Выделенный }
  - { text: Accent, translation: Акцент }
  - { text: Danger, translation: Опасность }
  - { text: Warning, translation: Предупреждение }
  - { text: Success, translation: Успех }
  - { text: Strong and accent, translation: Выделенный и акцент }
  - { text: Links, translation: Ссылки }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "Ссылка на объявленную страницу ведёт внутри приложения; файл, отдаваемый в точке монтирования, загружается обычным образом; https и mailto уводят из приложения." }
  - { text: Go to Conditions, translation: Перейти к условиям }
  - { text: A file the server serves, translation: "Файл, который отдаёт сервер" }
  - { text: Write to us, translation: Написать нам }
  - { text: Images, translation: Изображения }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "Изображение по адресу, то же изображение как украшение с пустым alt и разметка SVG, отрисованная как изображение и никогда не вставляемая в страницу." }
  - { text: The showcase mark, translation: Знак витрины }
  - { text: Three overlapping circles, translation: Три пересекающихся круга }
  - { text: Values by their schema, translation: Значения по их схеме }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "Каждое значение отрисовывается так, как предписывает его свойство модели, и читается из записи команды, которую загружает страница." }
  - { text: Visit the team homepage, translation: Перейти на сайт команды }
  - { text: "A uri, drawn as a link with a text of its own", translation: "Адрес uri, отрисованный как ссылка со своим текстом" }
  - { text: A uri-reference to a declared page, translation: Ссылка uri-reference на объявленную страницу }
  - { text: A uri-reference to a served file, translation: Ссылка uri-reference на отдаваемый файл }
  - { text: A mailto address, translation: Адрес mailto }
  - { text: "An address the rule refuses, drawn as plain text", translation: "Адрес, отклонённый правилом, отрисованный как обычный текст" }
  - { text: A date, translation: Дата }
  - { text: A date and time, translation: Дата и время }
  - { text: A boolean, translation: Логическое значение }
  - { text: An enumeration's label, translation: Метка перечисления }
  - { text: A list, translation: Список }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "Строки из одного ответа, без разбиения на страницы. Заголовок по умолчанию берётся из названия свойства, а последний столбец показывается, только пока команда нанимает сотрудников." }
  - { text: Projects under way, translation: Текущие проекты }
  - { text: Project, translation: Проект }
  - { text: Texts, translation: Тексты }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": Проектов пока нет.
        one: "Пока {$count} проект."
        few: "Пока {$count} проекта."
        many: "Пока {$count} проектов."
        other: "Пока {$count} проекта."
  - { text: "{$team} started {$project} most recently.", translation: "Последний проект, начатый командой {$team}, — {$project}." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "Форма множественного числа, выбранная в браузере по прочитанному числу, и текст, значения которого берутся из записи." }
  - { text: Open, context: state, translation: Открыто }
  - { text: Open, context: verb, translation: Открыть }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "Собственный текст узла различается так же: значок сообщает, что TEL-42 открыт, а ссылка предлагает открыть его задачи." }
  - { text: Style rules, translation: Правила стилей }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "Стиль строки и ячейки выбирается по значению строки. Избранный проект выделен, у каждого статуса свой цвет, а статус, не названный ни в одном случае, получает стиль по умолчанию. У двух столбцов в заголовке одно и то же слово, Open, различаемое по контексту, с которым написан каждый заголовок." }
  - { text: Composites, translation: Композиты }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "Вся эта страница — представление, которое каждое приложение размещает по ссылке. Ниже — представление, записанное прямо там, где оно размещено, и собственный составной вид этого примера, у которого нет контроллера." }
  - { text: A view declared inline at the node that places it., translation: "Представление, объявленное прямо в узле, который его размещает." }
  - { text: A callout, translation: Выноска }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Объявлена один раз как вид, который расширяет Ui.Composite и предоставляет представление, и размещена с собственными полями." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: Вкладки }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "Содержимое на вкладках, по одной вкладке за раз. Выбранная вкладка входит в адрес страницы, поэтому перезагрузка или отправленная кому-то ссылка снова её открывает." }
  - { text: Summary, translation: Сводка }
  - { text: "A tab holds any nodes, as a box does.", translation: "Вкладка вмещает любые узлы, как и блок." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "Отрисовываются только узлы выбранной вкладки." }
  - { text: Chosen, translation: Выбранная }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "Каждая вкладка доставляется по своему when, как и любой узел." }
  # The labels of the overview's models.
  - { text: Code, translation: Код }
  - { text: Name, translation: Название }
  - { text: Status, translation: Статус }
  - { text: Active, translation: Активен }
  - { text: Paused, translation: Приостановлен }
  - { text: Finished, translation: Завершён }
  - { text: Budget, translation: Бюджет }
  - { text: Started, translation: Начат }
  - { text: Free, context: subscription, translation: Бесплатный }
  - { text: Enterprise, context: subscription, translation: Корпоративный }
  - { text: Version, translation: Версия }
  - { text: Team, context: subscription, translation: Командный }

  # Conditions.
  - { text: Delivered and drawn, translation: Доставлен и отрисован }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "when узла решает на сервере, доставлять ли его, а shown решает в браузере, отрисовывать ли доставленный узел." }
  - { text: Never delivered — this node is not in the page document., translation: Никогда не доставляется — этого узла нет в документе страницы. }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "Доставлен, но никогда не отрисовывается: статус не paused, поэтому браузер держит этот узел скрытым." }
  - { text: Delivered by its when and drawn by its shown., translation: Доставлен по своему when и отрисован по своему shown. }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "Условие размещения вокруг композита, у узла которого есть собственное условие, оборачивается в блок, и оба условия должны выполняться." }
  - { text: Both conditions hold., translation: Оба условия выполняются. }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "Представление, содержимое которого отключено его собственным when, не предоставляет узла, поэтому размещающий его композит опускается." }
  - { text: Never provided., translation: Никогда не предоставляется. }
  - { text: Every keyword of a condition, translation: Все ключевые слова условия }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "Каждая строка ниже отрисована, потому что её условие выполняется для сводки проекта TEL-42, прочитанной страницей: статус active, четыре участника, скорость 2.5, теги design и web, руководитель — менеджер, note равно null, а codename отсутствует." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: над ним работают от 1 до 10 человек." }
  - { text: "required: the lead has an e-mail.", translation: "required: у руководителя есть e-mail." }
  - { text: "properties: the lead is a manager.", translation: "properties: руководитель — менеджер." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: над ним работают не менее трёх человек." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: над ним работают не более девяти человек." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: скорость больше 2." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: скорость меньше 3." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: скорость кратна 0.5." }
  - { text: "type: the status is a string.", translation: "type: статус — строка." }
  - { text: "type, as a list: the note is a string or null.", translation: "type в виде списка: note — строка или null." }
  - { text: "const: the status is active.", translation: "const: статус — active." }
  - { text: "enum: the status is active or paused.", translation: "enum: статус — active или paused." }
  - { text: "not: the status is not paused.", translation: "not: статус не paused." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code начинается с TEL или OPS." }
  - { text: "items: every tag has at least two letters.", translation: "items: в каждом теге не менее двух букв." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: тегов не менее двух." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: тегов не более пяти." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: теги не повторяются." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: в code не менее трёх символов." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: в code не более десяти символов." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code состоит из букв, дефиса и цифр." }
  - { text: Missing and null, translation: Отсутствие и null }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null — это присутствующее значение. Отсутствующее значение не удовлетворяет ни одному условию, даже под not, поэтому отсутствие проверяется на родителе." }
  - { text: The note is present and null., translation: note присутствует и равно null. }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "Никогда не отрисовывается: отсутствующий codename не удовлетворяет not." }
  - { text: "The project has no codename, tested on the summary.", translation: "У проекта нет codename — проверено на сводке." }
  - { text: Query parameters, translation: Параметры запроса }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "Этот узел чтения объявляет mode, список значений tag и ticket, соответствующий шаблону. Параметр, опущенный в адресе, одиночный параметр, указанный дважды, или значение, которое отклоняет его объявление, считаются отсутствующими." }
  - { text: Mode detailed, translation: Режим detailed }
  - { text: Two tags, translation: Два тега }
  - { text: A valid ticket, translation: Корректный ticket }
  - { text: A refused ticket, translation: Отклонённый ticket }
  - { text: Mode given twice, translation: Режим указан дважды }
  - { text: Clear the query, translation: Очистить запрос }
  - { text: mode is detailed., translation: mode — detailed. }
  - { text: There are two tag values or more., translation: Значений tag два или больше. }
  - { text: The ticket matches its pattern., translation: ticket соответствует своему шаблону. }
  - { text: "No ticket, or one its pattern refuses.", translation: "ticket нет, или его отклоняет шаблон." }
  - { text: Enablement, translation: Доступность }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "Кнопку можно нажать, только пока выполняется её условие над содержимым формы, а пока оно не выполняется, кнопка объясняет почему. Тег, который у проекта уже есть, отклоняется, а строки выше перечитывают сводку после добавления тега." }
  - { text: Tag TEL-42, translation: Добавить тег к TEL-42 }
  - { text: Tag, translation: Тег }
  - { text: Type a tag of three letters or more., translation: Введите тег не короче трёх букв. }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation:
      plural: count
      cases:
        one: "Добавлен тег {$tag}: теперь у TEL-42 {$count} тег."
        few: "Добавлен тег {$tag}: теперь у TEL-42 {$count} тега."
        many: "Добавлен тег {$tag}: теперь у TEL-42 {$count} тегов."
        other: "Добавлен тег {$tag}: теперь у TEL-42 {$count} тега."
  - { text: A page's own query, translation: Собственный запрос страницы }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "Эта страница тоже объявляет mode, и его читают её собственные узлы." }
  - { text: The page reads mode as detailed., translation: Страница читает mode как detailed. }

  # Data.
  - { text: A reader and its parameters, translation: Узел чтения и его параметры }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "Проект — это параметр project в адресе страницы, отправляемый вместе с чтением; без него параметр не отправляется, и маршрут отвечает для TEL-42. Код, которого нет ни у одного проекта, отрисовывает дерево ошибки." }
  - { text: A code no project has, translation: "Код, которого нет ни у одного проекта" }
  - { text: No project, translation: Без проекта }
  - { text: Reading the project…, translation: Чтение проекта… }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, руководитель — {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "Узел чтения, вложенный в содержимое этого узла, читает людей, работающих над тем же проектом." }
  - { text: Working on it, translation: Работают над ним }
  - { text: Role, translation: Роль }
  - { text: E-mail, translation: E-mail }
  - { text: "No answer · {$code}", translation: "Нет ответа · {$code}" }
  - { text: Readers that fail, translation: Узлы чтения с ошибками }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "Без собственного дерева ошибки узлы чтения отрисовывают код и сообщение ошибки — для несуществующего проекта, для защищённого маршрута, прочитанного без сеанса, и для ответа, который отклоняет модель узла чтения (список проектов, прочитанный как один проект)." }
  - { text: "Never drawn: there is no such project.", translation: "Никогда не отрисовывается: такого проекта нет." }
  - { text: "Signed in, so this reads: {$name}", translation: "Вход выполнен, поэтому прочитано: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "Никогда не отрисовывается: список — не проект." }
  - { text: Read again on focus, translation: Повторное чтение при фокусе }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "Этот узел чтения заново читает время сервера каждый раз, когда окно снова получает фокус. Переключитесь в другое окно и вернитесь." }
  - { text: Read at, translation: Прочитано в }
  - { text: A sign-in gate, translation: Шлюз входа }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "Шлюз читает, открыт ли сеанс, и перечитывает это каждый раз, когда запрос внутри него получает ответ 401. Вход открывает сеанс для участника команды; e-mail, которого нет ни у кого в команде, отклоняется у своего поля. Внутри узел чтения защищённого маршрута показывает учётную запись. Тихое завершение сеанса оставляет учётную запись на экране, пока следующий защищённый запрос — проверка ниже или возврат фокуса — не будет отклонён; тогда шлюз переключается на представление для вышедшего пользователя." }
  - { text: You are signed out., translation: Вы вышли из системы. }
  - { text: Sign in, translation: Войти }
  - { text: "Signed in as {$name}", translation: "Вы вошли как {$name}" }
  - { text: "Member since {$since}", translation: "Участник с {$since}" }
  - { text: Check the session, translation: Проверить сеанс }
  - { text: End the session quietly, translation: Тихо завершить сеанс }
  - { text: Sign out, translation: Выйти }

  # The labels of the task models.
  - { text: Task, translation: Задача }
  - { text: Assignee, translation: Исполнитель }
  - { text: Priority, translation: Приоритет }
  - { text: Estimate, translation: Оценка }
  - { text: Due, translation: Срок }
  - { text: Label, translation: Метка }
  - { text: Blocked, translation: Заблокировано }
  - { text: To do, translation: К выполнению }
  - { text: In progress, translation: В работе }
  - { text: In review, translation: На проверке }
  - { text: Bug, translation: Ошибка }
  - { text: Feature, translation: Функция }
  - { text: Chore, translation: Обслуживание }
  - { text: Docs, translation: Документация }
  - { text: Contact, translation: Контакт }
  - { text: Project name, translation: Название проекта }
  - { text: Brief, translation: Описание }

  # Tables.
  - { text: Columns from the model, translation: Столбцы из модели }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "Если столбцы не заданы, таблица показывает по одному столбцу на каждое свойство модели, кроме ключа строки, с заголовком из его названия и отрисовкой по его типу. Она показывает 25 строк на странице (по умолчанию) и открывает формы создания и редактирования в диалоговом окне — поверхности, которую таблица использует, если не указана другая." }
  - { text: "Written columns, sorting and style rules", translation: "Заданные столбцы, сортировка и правила стилей" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "Столбцы заданы вручную, в указанном порядке, один — с собственным заголовком. Столбец сортируется, если коллекция указывает его свойство для сортировки. Строка заблокированной задачи выделена и окрашена в красный, у каждой ячейки статуса свой цвет, а приоритет, не названный ни в одном случае, получает стиль по умолчанию. Восемь строк на странице." }
  - { text: Where, translation: Где }
  - { text: Members behind a reference, translation: Поля за ссылкой }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "Доска задач возвращает каждую задачу с вложенными в неё исполнителем и проектом. Столбец над вложенным полем берёт его название и способ отображения через именованную структуру, через определение самой модели и через ссылку, собственное название которой важнее структуры, на которую она указывает: контакт — это почтовая ссылка, а описание — ссылка на страницу." }
  - { text: Filtered by the address, translation: Фильтр по адресу }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "Эта таблица объявляет параметр project и отправляет его как условие равенства с каждым запросом. Без проекта в адресе она ничего не читает." }
  - { text: Atlas redesign tasks, translation: Задачи редизайна Atlas }
  - { text: Billing migration tasks, translation: Задачи миграции биллинга }
  - { text: Blocked tasks, translation: Заблокированные задачи }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "Эта таблица фильтруется по фиксированному значению, записанному в ней, и показывает только заблокированные задачи." }
  - { text: Where a form opens, translation: Где открывается форма }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "Каждая таблица ниже открывает формы создания и редактирования на своей поверхности. Сохранение перезагружает все таблицы задач на странице." }
  - { text: Dialogs, translation: Диалоговые окна }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "Создание — в маленьком диалоговом окне, которое остаётся открытым и очищается для следующей задачи. Редактирование — в большом диалоговом окне, которое не блокирует страницу и игнорирует щелчок вне его; после сохранения значения в нём остаются, несохранённые данные отбрасываются без вопроса, а само окно входит в адрес. В каждой строке есть удаление с подтверждением." }
  - { text: Drawers, translation: Шторки }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "Создание — в маленькой шторке от начального края; редактирование — в большой шторке от конечного края, без кнопки закрытия. Обе закрываются после сохранения и спрашивают, прежде чем отбросить несохранённые данные." }
  - { text: Sheets, translation: Листы }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "Создание — в листе сверху, который не блокирует страницу; редактирование — в полноэкранном листе снизу, который входит в адрес." }
  - { text: Popovers, translation: Всплывающие окна }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "Создание — в карточке рядом с кнопкой «Создать», по центру относительно неё; ниже порога ширины карточка становится полноценным диалоговым окном. Редактирование — в карточке под кнопкой строки, выровненной по её концу, которую не закрывает щелчок вне её и которая остаётся открытой после сохранения." }
  - { text: In line, translation: Прямо на странице }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "Форма создания открывается над строками, а форма редактирования — под строкой, которую она меняет. Ниже порога ширины форма создания открывается в листе снизу." }
  - { text: Panels, translation: Панели }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "Создание — в маленькой панели у начального края, которую не закрывает Escape. Редактирование — в большой панели у конечного края, которая входит в адрес, а строки рядом с ней остаются доступными; ниже порога ширины она становится листом снизу." }
  - { text: A page of its own, translation: Отдельная страница }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "Создание и редактирование заменяют содержимое страницы под одним именем в адресе, поэтому адрес указывает либо на новую задачу, либо на задачу с этим ключом, а «Назад» закрывает форму. Поверхность объявлена один раз, и на неё ссылаются оба." }

  # Filters.
  - { text: Every filter the collection accepts, translation: "Все фильтры, которые принимает коллекция" }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "Если поля не заданы, панель фильтров отрисовывает по одному элементу управления на каждый фильтр, который принимает коллекция, в её порядке и по свойству модели: список для перечисления или значения «да/нет», в остальных случаях поле ввода нужного типа, и одну подпись над двумя границами диапазона. Она стоит над таблицей, применяет выбор сразу, а введённый текст — по Enter, и ничего не сохраняет между посещениями." }
  - { text: Every control, translation: Все элементы управления }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "Все способы ввода фильтра: вводимый текст, варианты рядом, список, вводимые теги, ползунок, переключатель и две даты под одной подписью. Фильтр проекта нигде не отрисовывается, и задаёт его только пресет. Статус начинается со значения по умолчанию, а пресет задаёт фильтры, которые называют пресеты, и очищает остальные названные ими. Чипы показывают сводку выбора, а значения входят в адрес. Ниже порога ширины панель фильтров сворачивается, а закреплённый текстовый фильтр остаётся вне свёрнутой части." }
  - { text: Urgent, translation: Срочные }
  - { text: Atlas only, translation: Только Atlas }
  - { text: Stuck, translation: Застрявшие }
  - { text: "Beside, as chips, while typing", translation: "Сбоку, чипами, во время ввода" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "Элементы управления стоят в столбце у начального края. Видны только выбранные вами фильтры: добавьте фильтр из списка панели фильтров, а удаление фильтра очищает его. Каждый фильтр — это чип с его значением, открывающий его элемент управления. Вводимый текст применяется после паузы, а две границы числа подписаны «после» и «до». Выбор сохраняется в этом браузере между посещениями. Ниже порога ширины панель фильтров открывается в листе снизу." }
  - { text: "Beside at the end, applied by a button", translation: "Сбоку у конечного края, применение кнопкой" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "Элементы управления стоят у конечного края, и изменение ждёт кнопки «Применить», а пресет, «Сбросить» и удаление чипа сводки применяются сразу. Нескольких исполнителей вводят через запятую. Выбор сохраняется только для этой вкладки и переживает перезагрузку." }
  - { text: Due by October, translation: Срок до октября }
  - { text: "Folded, starting open", translation: "Сворачиваемая, изначально развёрнута" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "Элементы управления сворачиваются за переключателем, который показывает число фильтров со значением, и изначально развёрнуты. Закреплённый текстовый фильтр остаётся вне свёрнутой части, а остальные добавляются из списка панели фильтров. Статус начинается со значения «В работе»; его удаление очищает и это значение по умолчанию, а «Сбросить» возвращает его. Значения сохраняются и в адресе, и в этом браузере, причём приоритет у адреса, а выбранное состояние сворачивания запоминается." }
  - { text: "Folded, starting closed", translation: "Сворачиваемая, изначально свёрнута" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "Изначально свёрнута. Закреплённый текстовый фильтр, «Применить» и «Сбросить» остаются вне свёрнутой части. Метка начинается со значения по умолчанию — «Ошибка», — пока её не изменят, а «Сбросить» возвращает значение по умолчанию." }
  - { text: In a dialog, translation: В диалоговом окне }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "Элементы управления открываются в маленьком диалоговом окне по кнопке, которая показывает число фильтров со значением, и закрываются кнопкой «Готово». Открытое окно входит в адрес, поэтому его открывает ссылка. Закреплённый текстовый фильтр остаётся рядом с кнопкой, а чипы показывают сводку выбора." }
  - { text: In a drawer, translation: В шторке }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "Элементы управления открываются в шторке от начального края, которую не закрывает щелчок вне её. Введённые значения применяются после паузы." }
  - { text: In a popover, translation: Во всплывающем окне }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "Элементы управления открываются в карточке под кнопкой, выровненной по её концу; ниже порога ширины — в листе снизу." }

