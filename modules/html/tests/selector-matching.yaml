kind: Telo.Application
metadata:
  name: HtmlSelectorMatchingTest
  version: 1.0.0
  description: >-
    Selector matching, one case per construct — the bar any controller of these
    kinds must pass. Each case selects from one page and compares the ids matched.
imports:
  Html: ../
  Run: ../../run
  Assert: ../../assert
variables:
  page:
    env: HTML_SELECTOR_PAGE
    type: string
    default: |-
      <!DOCTYPE html><html lang="en"><body>
      <nav id="nav"><a id="navlink" href="/">home</a></nav>
      <article id="art"><section id="sec"><p id="p1">one</p><p id="p2" class="x">two</p></section><a id="artlink" href="/x">x</a></article>
      <ul id="list"><li id="l1" class="x">1</li><li id="l2" class="a">2</li><li id="l3" class="x">3</li><li id="l4" class="b">4</li><li id="l5" class="x">5</li></ul>
      <div id="imgbox"><h2 id="t1">T</h2><img id="i1" src="a.png"></div>
      <div id="textbox"><h2 id="t2">T</h2><p id="t2p">p</p></div>
      <table id="tbl"><colgroup><col id="c1"><col id="c2" span="2"></colgroup><tr><td id="r1a">a</td><td id="r1b" colspan="2">b</td></tr><tr><td id="r2a">a</td><td id="r2b">b</td><td id="r2c">c</td></tr></table>
      <form id="f"><input id="cb" type="checkbox" checked><input id="ra" type="radio" name="g"><input id="rb" type="radio" name="g"><input id="ph" placeholder="x"><input id="num" type="number" min="1" max="5" value="3"><input id="big" type="number" min="1" max="5" value="9"><input id="req" required><button id="b1">go</button><button id="b2">again</button><input id="dis" disabled><progress id="pg"></progress></form>
      <x-widget id="xw"></x-widget><p id="he" lang="he" dir="rtl">שלום</p><p id="blank"> </p><input id="up" type="CHECKBOX" data-x="abc">
      </body></html>
targets:
  - !ref nthChildOf
  - !ref nthLastChildOf
  - !ref nthChildOfList
  - !ref isComplex
  - !ref notComplex
  - !ref whereComplex
  - !ref hasChild
  - !ref hasNextSibling
  - !ref hasLaterSibling
  - !ref columnCombinator
  - !ref nthCol
  - !ref nthLastCol
  - !ref default
  - !ref indeterminate
  - !ref placeholderShown
  - !ref inRange
  - !ref outOfRange
  - !ref valid
  - !ref invalid
  - !ref defined
  - !ref attributeValueCase
  - !ref attributeValueExact
  - !ref attributeValueFlag
  - !ref lang
  - !ref dir
  - !ref checked
  - !ref disabled
  - !ref empty
  - !ref neverHover
  - !ref neverFocus
  - !ref neverFocusWithin
  - !ref neverFocusVisible
  - !ref neverVisited
  - !ref neverTarget
  - !ref neverTargetWithin
  - !ref neverLocalLink
  - !ref neverUserInvalid
  - !ref neverPlaying
  - !ref neverPaused
  - !ref neverModal
  - !ref neverFullscreen
  - !ref neverPopoverOpen
  - !ref neverAutofill
  - !ref neverStateOpen
  - !ref neverCurrent
  - !ref neverPast
  - !ref neverFuture
  - !ref nestedScope
---
# `:nth-child(An+B of S)` counts only the siblings matching S.
kind: Run.Sequence
metadata: { name: nthChildOf }
steps:
  - name: parse
    invoke: { kind: Html.JsonTree }
    inputs: { html: !cel "variables.page" }
  - name: select
    invoke:
      kind: Html.Selection
      selector: "li:nth-child(2n+1 of .x)"
    inputs: { document: !cel "steps.parse.result" }
  - name: assertMatches
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.select.result.nodes.map(n, n.attrs.id)"
      expected: [l1, l5]
---
# `:nth-last-child(An+B of S)`, from the end.
kind: Run.Sequence
metadata: { name: nthLastChildOf }
steps:
  - name: parse
    invoke: { kind: Html.JsonTree }
    inputs: { html: !cel "variables.page" }
  - name: select
    invoke:
      kind: Html.Selection
      selector: "li:nth-last-child(1 of .x)"
    inputs: { document: !cel "steps.parse.result" }
  - name: assertMatches
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.select.result.nodes.map(n, n.attrs.id)"
      expected: [l5]
---
