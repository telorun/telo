project: http-server
kind: Fixed
body: 'Http.Server request records no longer leak unbounded cardinality or misreport the server.
  http.route fell back to the concrete URL when no route matched, so an unauthenticated 404
  scan wrote arbitrary strings into the info-level attribute dashboards group on; the key
  is now omitted, which is also what OpenTelemetry requires with no match. http.server.stopped
  is emitted only for a server that actually listened, so a consumer pairing start with stop
  never sees an unmatched close. url.scheme reports the socket rather than the advertised
  baseUrl, which is routinely https behind a TLS terminator while the socket is plaintext.
  The logger adapter is also injected unconditionally: gating it on info handed Fastify its
  null logger at level: warn and silently dropped every diagnostic Fastify owns — its error-handler
  failures, reply-send failures and aborted-request hooks — which are exactly the records
  warn is meant to keep.'
