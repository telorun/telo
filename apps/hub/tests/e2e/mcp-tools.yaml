kind: Telo.Application
metadata:
  name: HubE2EMcpTools
  version: 1.0.0
  description: |
    End-to-end tests for the hub's MCP endpoint at /mcp, run against a live
    hub at http://localhost:8040 that has tracked the seeded refs. Locks in
    the two-tool discovery loop: `search_resources` returns kind hits carrying
    the exact module location ref, and `get_module_manifest(ref)` returns the
    tracker-cached telo.yaml for that ref.
imports:
  McpClient: oci://ghcr.io/telorun/mcp-client@0.14.3#sha256-aKULlBjNPeDoxlWYH3IzgxtLPNrre40dxTHkX-vpYB8
  Run: oci://ghcr.io/telorun/run@0.24.2#sha256-BFRCvbtbCRmj6SAu60wo_qbiQCJj1bGqKaKnhQwPJfw
  Assert: oci://ghcr.io/telorun/assert@0.17.4#sha256-dgMgHGwUzhmSzbxkxjpKMBsLx9IDSNxuNCjY6ReoxH0
  Yaml: oci://ghcr.io/telorun/yaml@0.10.3#sha256-xgWF987hJC2tA6q4SP3BUhSzZz2eSbVmVUK4DVOGupk
targets:
  - !ref SearchResources_ReturnsKindHits
  - !ref SearchResources_CarriesCategoryVocabulary
  - !ref GetModuleManifest_ReturnsCachedYaml
---
kind: McpClient.HttpClient
metadata: { name: HubMcp }
url: http://localhost:8040/mcp
clientInfo: { name: telo-test, version: 1.0.0 }
---
kind: McpClient.ToolsCall
metadata: { name: McpToolCall }
client: !ref HubMcp
---
kind: Yaml.Parse
metadata: { name: ParsePayload }
---
kind: Run.Sequence
metadata: { name: SearchResources_ReturnsKindHits }
steps:
  - name: call
    invoke: !ref McpToolCall
    inputs:
      name: search_resources
      arguments:
        query: delay a task
  - name: parse
    invoke: !ref ParsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  # The hit list itself is not assertable as a literal — scores and the rest of
  # the corpus move — so the claim is stated directly: the query echoes back,
  # and the seeded timer's Delay is somewhere in the results.
  - name: assert
    inputs:
      actual:
        query: !cel "steps.parse.result.docs[0].query"
        foundTimerDelay: !cel >-
          steps.parse.result.docs[0].hits.exists(h,
            h.kind == 'Delay' && h.module.ref == 'oci://ghcr.io/telorun/timer')
      expected:
        query: delay a task
        foundTimerDelay: true
    invoke:
      kind: Assert.Equals
---
kind: Run.Sequence
metadata: { name: GetModuleManifest_ReturnsCachedYaml }
steps:
  - name: call
    invoke: !ref McpToolCall
    inputs:
      name: get_module_manifest
      arguments:
        ref: oci://ghcr.io/telorun/timer
  - name: parse
    invoke: !ref ParsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  # Projected to the two facts this route owes a caller — the whole owner doc
  # carries a description, version and exports that move with every release.
  # The keys are `docKind` / `moduleName`, not `kind` / `name`: a literal object
  # carrying a `kind` key reads as an inline resource definition.
  - name: assert
    inputs:
      actual:
        docKind: !cel "steps.parse.result.docs[0].kind"
        moduleName: !cel "steps.parse.result.docs[0].metadata.name"
      expected:
        docKind: Telo.Library
        moduleName: Timer
    invoke:
      kind: Assert.Equals
---
# The facet rides on every tool response, which is the only way an agent learns
# an open, author-declared vocabulary from inside the discovery loop. Without it
# a guessed `category` was answered with an empty hit list — indistinguishable
# from "Telo has no such kind", and enough to send an agent hunting for a
# capability it had already been shown.
kind: Run.Sequence
metadata: { name: SearchResources_CarriesCategoryVocabulary }
steps:
  - name: call
    invoke: !ref McpToolCall
    inputs:
      name: search_resources
      arguments:
        query: repeat a step while a condition holds
  - name: parse
    invoke: !ref ParsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  # `run` is categorized Compute, and Run.Loop is what an app that repeats work
  # actually needs — the kind an unfiltered search has to surface.
  - name: assert
    inputs:
      actual:
        dropped: !cel "steps.parse.result.docs[0].categoryFilterDropped"
        knowsCompute: !cel "steps.parse.result.docs[0].categories.exists(c, c.category == 'compute')"
        foundRunLoop: !cel >-
          steps.parse.result.docs[0].hits.exists(h,
            h.kind == 'Loop' && h.module.ref == 'oci://ghcr.io/telorun/run')
      expected:
        dropped: false
        knowsCompute: true
        foundRunLoop: true
    invoke:
      kind: Assert.Equals
