kind: Telo.Application
metadata:
  name: ThrowsInheritedDispatch
  version: 1.0.0
  description: >-
    A kind declaring no `throws:` takes its ancestor's: a code the ancestor
    declares leaves a dispatch of the child as a declared code, and the
    dispatch record carries no undeclared rejection for it.
imports: { Assert: ../modules/assert }
targets:
  - !ref test
---
kind: Telo.Definition
metadata: { name: Raiser }
capability: Telo.Invocable
throws: { codes: { BOOM: { description: Always raised. } } }
schema: { type: object }
resources:
  - kind: Telo.Sequence
    metadata: { name: inner }
    steps:
      - { name: raise, throw: { code: BOOM } }
invoke: !ref inner
---
kind: Telo.Definition
metadata: { name: ChildRaiser }
extends: Self.Raiser
---
kind: Self.ChildRaiser
metadata: { name: raised }
---
kind: Assert.Events
metadata: { name: rejections }
filter:
  - { type: "raised.InvokeRejected" }
  - { type: "raised.InvokeRejected.Undeclared" }
expect:
  - { event: raised.InvokeRejected, times: 1 }
  - { event: raised.InvokeRejected.Undeclared, times: 0 }
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: call
    try:
      - name: dispatch
        invoke: !ref raised
    catch:
      - name: caught
        if: !cel "error.code != 'BOOM'"
        then:
          - { name: wrongCode, throw: { code: WRONG_CODE, message: !cel "error.code" } }
  - name: verify
    invoke: !ref rejections
