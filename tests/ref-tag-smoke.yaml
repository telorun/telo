kind: Telo.Application
metadata:
  name: RefTagSmoke
  version: 1.0.0
imports:
  Run: ../modules/run
  Assert: ../modules/assert
targets:
  # `!ref` works in `Telo.Application.targets` (which is itself an
  # `x-telo-ref: Telo.Runnable` slot) just as in any other ref slot.
  - !ref testRefTag
---
# Run.Value declared at the top level under a stable name. The
# Run.Sequence step below references it with the `!ref` YAML tag — the
# bare resource name carries the reference, no kind/name object form
# needed at the slot.
kind: Run.Value
metadata:
  name: computeSum
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      a: { type: number }
      b: { type: number }
value:
  value: !cel "inputs.a + inputs.b"
---
kind: Run.Sequence
metadata:
  name: testRefTag
steps:
  - name: callByRef
    inputs:
      a: !cel "5.0"
      b: !cel "7.0"
    invoke: !ref computeSum
  - name: assertResult
    inputs:
      value: "${{ steps.callByRef.result.value }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          value:
            type: number
            const: 12
        required: [ value ]
