# A journal keeping removal markers for less than no time: refused by
# `telo check` at the declaration, and by the controller when the resource is
# created.
kind: Telo.Library
metadata:
  name: MarkerRetentionNegative
imports:
  RecordStream: ../../..
exports:
  resources: [journal]
---
kind: RecordStream.Journal
metadata: { name: journal }
store: { kind: RecordStream.MemoryJournalStore }
markerRetention: "-1s"
