kind: Telo.Application
metadata:
  name: UrlShortener
  version: 1.0.0
  categories: [ Transport, Performance, Reliability ]
  description: |
    A URL shortener exercising the cache, rate-limit, run (Detach), sql, and
    http-server modules end to end. A thin root that owns the shared schema
    and HTTP server and wires two libraries:

      redirect/  POST /links {code,url} → {code,shortUrl}, GET /{code} (cache
                 read-through, rate-limit, detached click recording)
      admin/     GET /admin/links, GET /admin/links/{code}

    Zero external infra: a shared SQLite file + in-process CacheMemory.Store.
    The address short links point at is the `site` need, so run it locally with
    `TELO_NEED_SITE__URL=http://localhost:8080`.
requires:
  # 0.118.0: `site` is a `Telo.PublicUrl` need, a kind an older analyzer does not
  # declare.
  # 0.129.0: the `ui-react` renderer.
  telo: ">=0.129.0"
lang: en
imports:
  Ui: oci://ghcr.io/telorun/ui@0.10.0#sha256-s8kb_jL0N5qNLqp9GDKFfgJ7K1IUQ5bf3Mz6h1sjS_k
  UiReact: oci://ghcr.io/telorun/ui-react@0.11.0#sha256-Y0BOJSKmVUeEfRBkF6aC1pgBrGpaWQNPdlpf6C6l2FQ
  Http: oci://ghcr.io/telorun/http-server@0.43.0#sha256-cmk_CIEwtw9Tpv3LjPVqstfObUL4owHq410ST-nn8fI
  Sql: oci://ghcr.io/telorun/sql@0.31.0#sha256-QamrEtwX41Cim9gVjoKuuKQBGGrb19C0r63im-rRcmY
  SQLite: oci://ghcr.io/telorun/sqlite@0.14.0#sha256-2bFuhkRBtPY9mcybUoFc1l4D009TOlYuW5zCJeKbrMU
  Database:
    source: ./database
    variables:
      dbFile: !cel "variables.dbFile"
  Redirect:
    source: ./redirect
    variables:
      dbFile: !cel "variables.dbFile"
    needs:
      site: !ref site
  Admin:
    source: ./admin
    variables:
      dbFile: !cel "variables.dbFile"
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: { name: Telo.HostPath, entry: file }
    default: ./tmp/url-shortener.db
ports: { http: { env: PORT, default: 8080 } }
needs: { site: { kind: Telo.PublicUrl, parameters: { port: http } } }
targets:
  - !ref setupDb
  - !ref server
---
kind: SQLite.Schema
metadata: { name: setupDb }
connection: !ref Database.connection
tables:
  - !ref Database.links
  - !ref Database.clicks
---
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
trustProxy: true
openapi: { info: { title: URL Shortener, version: 1.0.0 } }
mounts:
  - path: /
    mount: !ref Redirect.routes
  - path: /admin
    mount: !ref Admin.routes
  - path: /ui/api
    mount: !ref Redirect.shortenRoutes
  - path: /ui
    mount: !ref app
---
kind: Telo.JsonSchema
metadata: { name: ShortenRequest }
schema:
  type: object
  required: [url]
  additionalProperties: false
  properties: { url: { type: string, title: URL to shorten, pattern: "^https?://[^\\s]+$" } }
---
kind: Telo.JsonSchema
metadata: { name: ShortenAnswer }
schema:
  type: object
  required: [code, shortUrl]
  properties: { code: { type: string }, shortUrl: { type: string, title: Short URL } }
---
kind: UiReact.App
metadata: { name: app }
title: URL Shortener
theme: !ref UiReact.defaultTheme
pages:
  - kind: Ui.Page
    path: /
    title: Shorten a URL
    children:
      - type: composite
        ref:
          kind: Ui.Action
          inputModel: !ref ShortenRequest
          outputModel: !ref ShortenAnswer
          request: { target: /api/shorten }
          label: Shorten
          result:
            type: stack
            children:
              - { type: text, text: Your short URL, style: muted }
              - { type: value, value: !cel "result.shortUrl", style: strong }
