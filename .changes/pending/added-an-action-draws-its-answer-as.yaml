modules:
  modules/ui: Added
body: "An action draws its answer as node trees: result (over result, input and values)
  for a success and failure (over error, input and values) for anything else, ui filling
  a default failure; onSuccess navigates and refreshes readers and tables by path;
  concurrency parallel or serial; clearAnswerOn (UI_ACTION_CLEAR_UNKNOWN_PROPERTY, twin
  ERR_UI_ACTION_CLEAR_UNKNOWN_PROPERTY). Ui.RowAction is one shape for a table's rows
  and a list node's rows, with its own enabled; a table declares query for its row
  actions; a row action carries its action's own node on the wire. Breaking:
  Ui.Action.lists is removed — write a list node in result — and
  UI_ROW_ACTION_DRAWS_LISTS with its twin is gone; the wire action node and row action
  change shape and a table node carries query."
