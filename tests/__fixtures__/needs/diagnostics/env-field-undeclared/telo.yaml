kind: Telo.Application
metadata:
  name: EnvFieldUndeclared
  version: 0.0.0
  description: An application need binding an environment name to a field its type does not declare.
imports:
  Fx: ../../types
needs:
  databaseAccess:
    kind: Fx.DatabaseAccess
    env: { url: DATABASE_URL, host: DATABASE_HOST }
