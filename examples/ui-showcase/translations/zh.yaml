  - { text: Kick-off, translation: "启动会" }
  - { text: Daily call, translation: "每日电话会" }
  - { text: Details, translation: "详情" }
  - { text: Markdown is welcome., translation: "支持 Markdown。" }
  - { text: Keep me posted by, translation: "通知方式" }
  - { text: Chat, translation: "聊天" }
  - { text: Phone, translation: "电话" }
  - { text: Keywords, translation: "关键词" }
  - { text: "Lower-case words; Enter or a comma adds one.", translation: "小写单词；按 Enter 或输入逗号即可添加。" }
  - { text: Site access code, translation: "场地门禁码" }
