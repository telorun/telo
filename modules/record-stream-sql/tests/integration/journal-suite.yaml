kind: Telo.Application
metadata:
  name: RecordStreamSqlJournalSuitePostgres
  version: 1.0.0
  description: |
    The journal's shared behaviour suite over the SQL store on PostgreSQL. The suite
    needs an empty store, so this test's own table is cleared before it runs.

    NEEDS A CONTAINER ENGINE: it starts its own PostgreSQL. Kept out of `tests/` proper for exactly that reason.
imports:
  Pg:
    source: ../../../postgres/tests/__fixtures__/container
    variables: { engineUrl: !cel "variables.engineUrl" }
    secrets: { engineToken: !cel "secrets.engineToken" }
  Suite:
    source: ../../../record-stream/tests/__fixtures__/journal-suite
    resources: { store: !ref store }
  RecordStreamSql: ../../
  Postgres: ../../../postgres
  Sql: ../../../sql
  Run: ../../../run
variables:
  engineUrl: { env: TELO_HOST_CONTAINER_ENGINE_URL, type: string, default: "unix:///var/run/docker.sock" }
secrets:
  engineToken: { env: TELO_HOST_CONTAINER_ENGINE_TOKEN, type: string, default: "" }
targets:
  - !ref clear
  - !ref Suite.expiry
  - !ref Suite.markerRetention
  - !ref Suite.roundTrip
  - !ref Suite.typedValues
  - !ref Suite.failedReplaysCode
  - !ref Suite.unknownKeyWaits
  - !ref Suite.removal
  - !ref Suite.secondWriterBusy
  - !ref Suite.pausedWriterStaysLive
  - !ref Suite.removedAcrossPages
  - !ref Suite.cancelledRead
  - !ref Suite.resumeContinuesFailed
  - !ref Suite.resumeKeyStates
  - !ref Suite.resumeLiveWriterBusy
  - !ref Suite.readSnapshot
  - !ref Suite.readStates
  - !ref Suite.claimAdopted
  - !ref Suite.claimOneDrain
  - !ref Suite.claimRefusals
  - !ref Suite.claimResumeTakesOver
  - !ref Suite.claimSameWriterEnded
  - !ref Suite.claimGoesStale
  - !ref Suite.claimResumeStale
---
kind: Postgres.Connection
metadata: { name: db }
access: !ref Pg.databaseAccess
---
# A table of its own, so no other test's journal shares it.
kind: RecordStreamSql.JournalStore
metadata: { name: store }
connection: !ref db
table: record_stream_journal_suite_test
---
kind: Run.Sequence
metadata: { name: clear }
steps:
  - name: entries
    invoke: { kind: Sql.Command, connection: !ref db }
    inputs: { sql: "DELETE FROM record_stream_journal_suite_test" }
  - name: keys
    invoke: { kind: Sql.Command, connection: !ref db }
    inputs: { sql: "DELETE FROM record_stream_journal_suite_test_keys" }
