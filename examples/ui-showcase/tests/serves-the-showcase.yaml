              - "-"
              - []
              - [ { root: row, path: [ pinned ] }, { const: false } ]
              - { refreshes: [ /api/comments ] }
            - - /api/comments/delete
              - Delete
              - { id: { root: row, path: [ id ] } }
              - Delete this comment?
              - []
              - []
              - { refreshes: [ /api/comments ] }
            - - /api/comments/edit
              - Edit
              - { id: { root: row, path: [ id ] } }
              - Rewrite this comment?
              - [ body ]
              - []
              - { refreshes: [ /api/comments ] }
        more:
          - [ /api/tasks, Add it and open the tables, [ [ input, title ], [ choice, projectCode ] ], { navigate: { value: /tables }, refreshes: [ /api/tasks ] }, false ]
          - [ /api/team-links, Open the handbook, [], { navigate: { root: result, path: [ handbook ] }, refreshes: [] }, true ]
          - [ /api/team-links, Open the mirror, [], { navigate: { root: result, path: [ mirror ] }, refreshes: [] }, true ]
        mirrorResult: { mirror: { root: result, path: [ mirror ] } }
