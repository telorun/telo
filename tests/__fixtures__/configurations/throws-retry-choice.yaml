# A retried step's operation is chosen by `variables.flag1`: the code its policy
# stops on is thrown in one configuration only.
kind: Telo.Application
metadata: { name: ThrowsRetryChoice }
imports: { T: ./throws/kinds }
variables:
  flag1: { env: FLAG_1, type: boolean, default: false }
targets:
  - !ref main
---
kind: T.FailA
metadata: { name: failA }
---
kind: T.FailB
metadata: { name: failB }
---
kind: Telo.Sequence
metadata: { name: main }
steps:
  - name: call
    invoke: !if
      if: !cel "variables.flag1"
      then: !ref failA
      else: !ref failB
    retry:
      attempts: 2
      nonRetryable: [ERR_A]
