units:
  sdk: Added
  kernel: Added
body: "Every schema refusal raised as ERR_INPUT_INVALID or ERR_OUTPUT_INVALID carries
  data: { issues } — a bound contract's in either direction, a module function's
  arguments or result, and an error's data its kind does not declare — one finding per
  refusal with its pointer, keyword (required, format, or invalid) and params, never
  quoting the value, and the built-in entries of the two codes declare that data as null
  or an object holding issues. Breaking: a contract refusal's data was absent and is now
  { issues }, a module function's refusal data gains issues beside function, and an
  undeclared-data refusal's issues are findings rather than sentences."
