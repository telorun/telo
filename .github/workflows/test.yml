        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # The kernel's napi-loader test and several module tests shell out to a
      # real `cargo build` of fixture crates, so the Rust toolchain is on the
      # unit-test path here exactly as it is on ubuntu.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Controller crates are built into the workspace-anchored `.telo` cache,
          # keyed by SDK backend, which is NOT the workspace `target/` this action
          # caches by default. Without naming it every run rebuilds each napi
          # controller and its dependency tree from cold — minutes on Windows.
          cache-directories: .telo/cargo

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Staged files are fetched from third parties on first use; cache them so a
      # flaky download fails one job at most once per key.
      - name: Restore staged module files
        id: staged
        uses: ./.github/actions/restore-staged-files
        with:
          scope: ${{ github.job }}

      # The same selection as the Linux unit job — see the note there for why
      # modules are built. The excluded packages are browser bundles and the
      # docs site: nothing here reads their output, they have no
      # macOS-specific path, and the Linux unit job builds them.
      - name: Build for Node.js
        shell: bash
        env:
          BUILD_ARGS: ${{ needs.select.outputs.unit_build_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$BUILD_ARGS" | tr -d '\r')
          pnpm -r "${args[@]}" --filter "!@telorun/studio" --filter "!telo-vscode" --filter "!@telorun/pages" --filter "!@telorun/hub-web" run build

      - name: Run package unit tests
        if: needs.select.outputs.platform_unit_mode == 'full' || (needs.select.outputs.platform_unit_mode == 'selected' && needs.select.outputs.unit_test_args != '[]')
        shell: bash
        env:
          TEST_ARGS: ${{ needs.select.outputs.unit_test_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$TEST_ARGS" | tr -d '\r')
          pnpm -r "${args[@]}" --no-bail test

      - name: Save staged module files
        if: always() && steps.staged.outputs.key != '' && steps.staged.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-staged-files
        with:
          key: ${{ steps.staged.outputs.key }}
          paths: ${{ steps.staged.outputs.paths }}

  macos-manifest:
    name: "macOS: manifest tests (Node)"
    runs-on: macos-latest
    timeout-minutes: 60
    needs: select
    if: needs.select.outputs.platform_mode != 'none' || needs.select.outputs.platform_suites == 'true'

    env:
