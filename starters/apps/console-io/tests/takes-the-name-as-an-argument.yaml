kind: Telo.Application
metadata:
  name: ConsoleIoStarterArgumentTest
  version: 1.0.0
  description: >-
    Supplies the starter's name and greeting by name, as its command line would:
    it must greet without asking and go straight to the command prompt.
imports:
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  Channel: oci://ghcr.io/telorun/channel@0.4.0#sha256-nD_0ZsyaVddeihAxep3t4y7Di0V0wSRrscxi5Pb5uuE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref app
  - !ref test
---
kind: App.Instance
metadata: { name: app }
source: ../telo.yaml
variables: { name: Grace, greeting: Welcome }
awaitStart: false
---
kind: Channel.ReadUntil
metadata: { name: read }
channel: !ref app
timeout: "10s"
---
kind: Channel.SendLine
metadata: { name: send }
channel: !ref app
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: greeting
    invoke: !ref read
    inputs: { until: "\n> " }
  - name: sendQuit
    invoke: !ref send
    inputs: { text: quit }
  - name: farewell
    invoke: !ref read
    inputs: { until: "\n" }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        greeting: !cel "steps.greeting.result.text"
        farewell: !cel "steps.farewell.result.text"
      expected:
        greeting: "Welcome, Grace! Type help for commands.\n> "
        farewell: "Goodbye, Grace.\n"
