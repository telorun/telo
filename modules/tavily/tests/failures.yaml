# Every failure is a contract code, whatever the client's settings, and the raw
# HTTP status never escapes: 401 is ERR_SEARCH_ACCESS_DENIED, 429 is
# ERR_SEARCH_RATE_LIMITED, 432 and 433 are ERR_SEARCH_QUOTA_EXCEEDED, and
# anything else — a 400 or 422 from the engine's own mapping, a 5xx — a body that
# is not Tavily's search response, and an unreachable API are ERR_SEARCH_FAILED.
# A client with `throwOnHttpError` maps the same way.
kind: Telo.Application
metadata:
  name: TavilyFailuresTest
  version: 1.0.0
imports:
  Tavily: ..
  Http: ../../http-client
  Server: ../../http-server
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref failures
---
kind: Tavily.WebSearchEngine
metadata: { name: engine }
request:
  kind: Http.Request
  client: { kind: Http.Client, baseUrl: "http://localhost:18862" }
---
kind: Tavily.WebSearchEngine
metadata: { name: throwingEngine }
request:
  kind: Http.Request
  client: { kind: Http.Client, baseUrl: "http://localhost:18862", throwOnHttpError: true }
---
# Nothing listens on this port.
kind: Tavily.WebSearchEngine
metadata: { name: unreachableEngine }
request:
  kind: Http.Request
  client: { kind: Http.Client, baseUrl: "http://localhost:18863", timeout: 2000 }
---
kind: Run.Value
metadata: { name: errors }
value:
  denied: "Unauthorized: missing or invalid API key."
  limited: Rate limit exceeded.
  plan: This request exceeds your plan's set usage limit.
  payg: This request exceeds the pay-as-you-go limit.
  invalid: Invalid topic.
  broken: Internal server error.
---
kind: Run.Sequence
metadata: { name: failures }
with:
  - kind: Server.Api
    metadata: { name: FakeTavily }
    routes:
      - request:
          path: /search
          method: POST
          schema:
            body: { type: object, additionalProperties: true }
        handler: !ref errors
        returns:
          - status: 401
            when: !cel "request.body.query == 'denied'"
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel "{'detail': {'error': result.denied}}"
          - status: 429
            when: !cel "request.body.query == 'limited'"
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel "{'detail': {'error': result.limited}}"
          - status: 432
            when: !cel "request.body.query == 'plan'"
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel "{'detail': {'error': result.plan}}"
          - status: 433
            when: !cel "request.body.query == 'payg'"
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel "{'detail': {'error': result.payg}}"
          - status: 400
            when: !cel "request.body.query == 'invalid'"
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel "{'detail': {'error': result.invalid}}"
          - status: 422
            when: !cel "request.body.query == 'unprocessable'"
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: { detail: [{ loc: [body, max_results], msg: Input should be less than or equal to 20 }] }
          - status: 500
            when: !cel "request.body.query == 'broken'"
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel "{'detail': {'error': result.broken}}"
          - status: 200
            when: !cel "request.body.query == 'html'"
            content:
              text/html:
                body: "<html><body>results</body></html>"
          - status: 200
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: { query: other }
  - kind: Server.Server
    metadata: { name: FakeServer }
    port: 18862
    mounts:
      - path: /
        mount: !ref FakeTavily
targets:
  - !ref FakeServer
steps:
  - name: outcomes
    invoke:
      kind: Run.Projection
      collection:
        - { engine: plain, query: denied }
        - { engine: plain, query: limited }
        - { engine: plain, query: plan }
        - { engine: plain, query: payg }
        - { engine: plain, query: invalid }
        - { engine: plain, query: unprocessable }
        - { engine: plain, query: broken }
        - { engine: plain, query: html }
        - { engine: plain, query: other }
        - { engine: throwing, query: denied }
        - { engine: throwing, query: limited }
        - { engine: throwing, query: plan }
        - { engine: throwing, query: broken }
        - { engine: unreachable, query: anything }
      steps:
        - name: attempt
          try:
            - name: pick
              switch: !cel "item.engine"
              cases:
                plain:
                  - name: plainSearch
                    invoke: !ref engine
                    inputs: { query: !cel "item.query" }
                throwing:
                  - name: throwingSearch
                    invoke: !ref throwingEngine
                    inputs: { query: !cel "item.query" }
              default:
                - name: unreachableSearch
                  invoke: !ref unreachableEngine
                  inputs: { query: !cel "item.query" }
          catch:
            - name: caught
              value:
                code: !cel "error.code"
                message: !cel >-
                  error.message.startsWith('The request to Tavily failed: ')
                    ? 'The request to Tavily failed: …' : error.message
      outputs: !cel "steps.caught.result"
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.outcomes.result"
      expected:
        - code: ERR_SEARCH_ACCESS_DENIED
          message: "Tavily rejected the API key: Unauthorized: missing or invalid API key."
        - code: ERR_SEARCH_RATE_LIMITED
          message: "Tavily asks the caller to slow down: Rate limit exceeded."
        - code: ERR_SEARCH_QUOTA_EXCEEDED
          message: "The Tavily plan limit is reached: This request exceeds your plan's set usage limit."
        - code: ERR_SEARCH_QUOTA_EXCEEDED
          message: "The Tavily pay-as-you-go limit is reached: This request exceeds the pay-as-you-go limit."
        - code: ERR_SEARCH_FAILED
          message: "Tavily answered HTTP 400: Invalid topic."
        - code: ERR_SEARCH_FAILED
          message: "Tavily answered HTTP 422: Input should be less than or equal to 20"
        - code: ERR_SEARCH_FAILED
          message: "Tavily answered HTTP 500: Internal server error."
        - code: ERR_SEARCH_FAILED
          message: Tavily answered 200 with a body that is not its search response.
        - code: ERR_SEARCH_FAILED
          message: Tavily answered 200 with a body that is not its search response.
        - code: ERR_SEARCH_ACCESS_DENIED
          message: "Tavily rejected the API key: Unauthorized: missing or invalid API key."
        - code: ERR_SEARCH_RATE_LIMITED
          message: "Tavily asks the caller to slow down: Rate limit exceeded."
        - code: ERR_SEARCH_QUOTA_EXCEEDED
          message: "The Tavily plan limit is reached: This request exceeds your plan's set usage limit."
        - code: ERR_SEARCH_FAILED
          message: "Tavily answered HTTP 500: Internal server error."
        - code: ERR_SEARCH_FAILED
          message: "The request to Tavily failed: …"
