# Writes `top` once outside any draft, from its own process: one person named
# after this process.
kind: Telo.Application
metadata:
  name: StackProcessWriter
  version: 1.0.0
include:
  - ./model.yaml
imports:
  Postgres: ../../../../../postgres
  Layers: ../../../..
  Graph: ../../../../../graph
  Run: ../../../../../run
variables:
  dbHost: { env: DB_HOST, type: string }
  dbPort: { env: DB_PORT, type: integer }
  name: { env: ACTOR_NAME, type: string }
targets:
  - !ref work
---
kind: Postgres.Connection
metadata: { name: db }
access:
  kind: Postgres.DatabaseAccess
  fields:
    url:
      scheme: postgres
      host: !cel "variables.dbHost"
      port: !cel "variables.dbPort"
      user: postgres
      password: postgres
      path: /postgres
      query: { options: "-c search_path=public" }
---
kind: Run.Sequence
metadata: { name: work }
steps:
  - name: write
    invoke: { kind: Graph.CreateNode, store: !ref top, node: !ref person }
    inputs: { key: !cel "variables.name", properties: { name: Written } }
