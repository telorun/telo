units:
  cel: Added
body: "A record type carries `fieldEnums`: per declared field whose schema admits a
  finite set of values (a `const`, an `enum` or a union of them, `null` among them),
  that set, read as the field's type reads it. Record equality, the environment digest
  and `schemaOwnTypesAgree` compare it as a set, so two shapes differing only in a
  constant stay two members of a union; a meet intersects the sets and an empty
  intersection makes the field absent. The checker reads `<chain>.<m> == <literal>`
  (either order), `!=` and `<chain>.<m> in [<literals>]` as proofs beside `!= null`,
  `has()` and the type test, narrowing a union to the shapes whose `m` can equal (or
  differ from) the listed literals, and the refusal of a member only some shapes declare
  names that test where one tells them apart. A union joined with a type it does not
  include now widens by kin in a conditional, an aggregate literal and a type
  parameter's binding (`[{'a': 'x'}] + ms` over a list of a union of records checks),
  instead of being \"not one type\". `check` takes `assumptions` — conditions known to
  have held or failed at the site, each a source or a parsed tree, with the chains
  `rebound` there — read as if a `?:` enclosed the expression; the conformance rows
  carry them as `assumptions`. In `telorun-cel`, `CheckOptions` gains `assumptions` and
  is no longer `Copy`, and `check_with` now answers a `Result`, refusing an assumption
  tree resolved under another namespace set as `check_parsed_with` does."
