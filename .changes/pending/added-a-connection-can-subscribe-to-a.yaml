modules:
  modules/postgres: Added
body: "A connection can subscribe to a PostgreSQL notification channel and send on one
  (listen / notify). The subscription gets its own connection rather than a pooled one —
  a listener holds its connection for as long as it is subscribed — and replays every
  subscription after a reconnect, since LISTEN is a property of the connection that
  carried it. Reported rather than raised on a drop: a lost notification is a lost
  optimisation, and a poller is what makes recovery certain."
