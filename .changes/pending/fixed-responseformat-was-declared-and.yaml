modules:
  modules/openai: Fixed
body: "`responseFormat` — a declared `Ai.Model` contract input — was accepted and
  silently dropped by every chat kind, so a caller asking for a JSON schema got an
  unconstrained answer with no diagnostic. It is now translated per dialect: the chat
  kinds send `response_format`, the responses kinds send `text.format`, which is where
  that API moved it and which refuses the chat spelling outright. Two reachable failures
  also join the kinds' declared `throws:` unions, so a `catches:` can name them and a
  route mounting a handler is required to cover them — `ERR_INVALID_REFERENCE` when
  `request` did not resolve to a live `Http.Request`, and the new
  `ERR_OPENAI_INVALID_TOOL_ARGUMENTS` where a model's tool arguments are not a JSON
  object, which previously escaped as an uncoded error no manifest could catch."
