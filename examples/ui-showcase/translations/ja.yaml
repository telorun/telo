  - { text: Start, translation: "開始日" }
  - { text: Kick-off, translation: "キックオフ" }
  - { text: Daily call, translation: "デイリーコール" }
  - { text: Details, translation: "詳細" }
  - { text: Markdown is welcome., translation: "Markdown を使用できます。" }
  - { text: Keep me posted by, translation: "連絡方法" }
  - { text: Chat, translation: "チャット" }
  - { text: Phone, translation: "電話" }
  - { text: Keywords, translation: "キーワード" }
  - { text: "Lower-case words; Enter or a comma adds one.", translation: "小文字の単語。Enter またはカンマで追加します。" }
  - { text: Site access code, translation: "現場の入場コード" }
  - { text: Never kept between visits., translation: "訪問の間で保持されることはありません。" }
  - { text: Received, translation: "受信日時" }
  - { text: Lead, translation: "責任者" }
  - { text: "Lead's role", translation: "責任者の役割" }
  - { text: Manager, translation: "マネージャー" }
  - { text: Engineer, translation: "エンジニア" }
  - { text: Designer, translation: "デザイナー" }
  - { text: Writer, translation: "ライター" }
  - { text: Reviewers, translation: "レビュアー" }
  - { text: Sponsor, translation: "スポンサー" }
  - { text: Helpers, translation: "協力者" }
  - { text: Period, translation: "期間" }
  - { text: The studio books a year at most., translation: "スタジオの予約は最長 1 年です。" }
  - { text: On site, translation: "現地作業" }
  - { text: Site address, translation: "現地の住所" }
  - { text: Notes, translation: "メモ" }
  - { text: Location, translation: "場所" }
  - { text: Joined, translation: "参加日" }

  # Forms.
  - { text: Every control from the model, translation: "モデルから生成されるすべてのコントロール" }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "フィールドを記述しない場合、フォームはプロパティごとに 1 つのコントロールをスキーマに基づいて選んで描画します。テキストボックス、列挙値のリスト、数値ボックス、日付、日時、時刻、ドキュメント用の複数行ボックス、チェックボックス、列挙値のリストには横並びの選択肢、単語のリストにはタグ入力です。説明はフィールドの下のヒントに、デフォルトは初期値になります。" }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "各フィールドは一度触れられるとモデルに照らして検証されます。タイトルの長さ、人数、50 刻みの予算、キーワードの綴りです。サーバーは他の依頼と同じタイトルを拒否し、その応答はタイトルのフィールドに表示されます。入力内容はアドレスとこのブラウザーに保持されます — モデルが書き込み専用と指定している入場コードを除きます。" }
  - { text: Each control chosen by hand, translation: "手動で選んだ各コントロール" }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "同じ依頼を、フィールドごとにコントロールを記述して作成します。タイトルは導出されたコントロールのまま、種類は横並びの選択肢、連絡手段は複数選択のリスト、人数はスライダー、緊急はスイッチ、キーワードはタグです。入力内容はこのタブでのみ保持されます。" }
  - { text: Requests received, translation: "受信した依頼" }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "2 つのフォームが送信した最新の依頼で、保存のたびに再読み込みされます。" }
  - { text: "Choices, pickers and dates", translation: "選択肢、ピッカー、日付" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "プロジェクトにメンバーを割り当てます。プロジェクトはプロジェクトのコレクションから読み取ったリストから選び、各選択肢にはコードがヒントとして付きます。責任者は、その上で選んだ役割の稼働中メンバーの中から、ダイアログで名前を検索して選びます。別の役割を選ぶと選択肢が再読み込みされ、責任者はまだ条件に合う場合だけ残ります。レビュアーはドロワーで複数同時に、スポンサーはポップオーバーで選びます。スポンサーはデフォルトのメールアドレスから始まり、1 回の照会でその人の名前として表示されます。協力者は 3 人ずつ横並びで提示され、残りは「さらに表示」で表示されます。選んだ人はそのメールアドレスへのリンクになります。" }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "期間はプリセット付きの 2 つの日付で、週は日曜日から始まり、初期値は来月で、3 か月を超えると警告します。サーバーは開始前に終わる期間や 1 年を超える期間を拒否し、その応答は期間のフィールドに表示されます。責任者の周囲のメンバーは責任者を選ぶと表示され、現地の住所は現地作業の場合にだけ表示されます。" }
  - { text: The project, translation: "プロジェクト" }
  - { text: "Which project, and who leads the work.", translation: "どのプロジェクトで、誰が作業を率いるか。" }
  - { text: Around the lead, translation: "責任者の周囲" }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "誰が作業をレビューし、誰がスポンサーとなり、誰が協力するか。" }
  - { text: When and where, translation: "日時と場所" }
  - { text: Tomorrow, translation: "明日" }
  - { text: Next week, translation: "来週" }
  - { text: This month, translation: "今月" }
  - { text: Next month, translation: "来月" }
  - { text: Next quarter, translation: "次の四半期" }
  - { text: Next year, translation: "来年" }
  - { text: Bookings, translation: "割り当て" }
  - { text: "The latest bookings, read again after every save.", translation: "最新の割り当てで、保存のたびに再読み込みされます。" }

  # The labels of the actions page's models.
  - { text: Only these labels, translation: "これらのラベルのみ" }
  - { text: Count blocked tasks, translation: "ブロック中のタスクを含める" }
  - { text: Hours a week, translation: "週あたりの時間" }
  - { text: Done by, translation: "完了予定日" }
  - { text: No label, translation: "ラベルなし" }
  - { text: Tasks, translation: "タスク" }
  - { text: Hours, translation: "時間" }
  - { text: Days, translation: "日数" }
  - { text: Task number, translation: "タスク番号" }
  - { text: "Assignee's e-mail", translation: "担当者のメールアドレス" }
  - { text: Comment, translation: "コメント" }
  - { text: Comment number, translation: "コメント番号" }
  - { text: Pinned, translation: "ピン留め" }
  - { text: Written, translation: "投稿日時" }
  - { text: New text, translation: "新しいテキスト" }

  # Actions.
  - { text: A bare button, translation: "ボタンのみ" }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "プロパティのない入力モデルはボタンだけを描画します。このボタンは TEL-42 のブロック中のタスクをすべて解除し、下にあるタスク数と TEL-42 のテーブルが再読み込みされます。" }
  - { text: Unblock TEL-42, translation: "TEL-42 のブロックを解除" }
  - { text: An answer drawn from the result, translation: "結果から描画される応答" }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "このルートはプロジェクトの未完了タスクの見積もりを合計します。フィールドは入力モデルのもので、2 つのセクションに分かれ、プロジェクトはプロジェクトのコレクションから、ペースはスライダーで選びます。入力内容はアドレスに保持されます。応答はボタンの下に描画されます。結果と送信したレコードに基づく文、作業の完了予定日、ラベルごとの時間のリストです。" }
  - { text: What to count, translation: "集計対象" }
  - { text: How fast, translation: "ペース" }
  - { text: Estimate, context: verb, translation: "見積もる" }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} に未完了の作業はありません。"
        other: "{$project} の未完了タスク {$tasks} 件で {$hours} 時間"
  - { text: "About {$weeks} weeks at {$pace} hours a week, done by", translation: "週 {$pace} 時間で約 {$weeks} 週間、完了予定日は" }
  - { text: By label, translation: "ラベル別" }
  - { text: When it fails, translation: "失敗した場合" }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "アクション独自の失敗ツリーで、エラーと送信したレコードに基づいて描画されます。タスク 4 を james@northwind.example に割り当てると成功します。メールアドレスを省略するか、チーム外の人を指定すると、拒否はそのフィールドに表示されます。タスク 999 は 404 を返し、退職した tomas@northwind.example は 409 を返します。" }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "このアクションは見積もりルートの応答を日数として読み取りますが、ルートは日数を返しません。応答はアクションの出力モデルで拒否され、失敗ツリーがそのことを示します。" }
  - { text: Estimate in days, translation: "日数で見積もる" }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: このボタンが読み取る応答ではありません。" }
  - { text: Where a success goes, translation: "成功時の移動先" }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "1 つ目はプロジェクトのタスク一覧ページを返し、アプリケーションはそこへ移動します。2 つ目はチームのホームページ、つまりページを置き換える https アドレスを返します。" }
  - { text: Open its tasks, translation: "タスクを開く" }
  - { text: Visit the homepage, translation: "ホームページへ" }
  - { text: Reading again after a success, translation: "成功後の再読み込み" }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "タスクを移動すると、下の件数（リーダー）とさらに下の TEL-42 のテーブルの両方が再読み込みされます。応答にはタスクと新しいステータスが示されます。" }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: 未着手 {$todo}、進行中 {$doing}、レビュー中 {$review}、完了 {$done}、ブロック中 {$blocked}。" }
  - { text: Move, translation: "移動" }
  - { text: "Task {$id}, {$title}, is now", translation: "タスク {$id}（{$title}）の現在のステータス:" }
  - { text: One press after another, translation: "連続した押下" }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "コメントは、どれほど素早く押しても、ボタンを押した順に 1 件ずつ送信されます。ボタンは 3 文字入力されるまで待機し、その理由を表示します。別のタスクを選ぶと直前の応答がクリアされます。下部に一覧表示されたコメントは、送信のたびに再読み込みされます。" }
  - { text: Add the comment, translation: "コメントを追加" }
  - { text: Write three characters or more., translation: "3 文字以上入力してください。" }
  - { text: "Comment {$id} added to {$title}, which has {$count} comments now.", translation: "コメント {$id} を {$title} に追加しました。コメントは {$count} 件になりました。" }
  - { text: Row actions on a table, translation: "テーブルの行アクション" }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "TEL-42 の各タスクには 3 つのボタンがあり、押すとそれぞれ応答に置き換わります。「開始」は未着手のタスクでのみ、即座に実行されます。「閉じる」は先に確認し、完了したタスクには表示されません。「割り当て」は行に含まれないメールアドレスを入力するダイアログを開き、サーバーの拒否をそのフィールドに表示します。" }
  - { text: Number, translation: "番号" }
  - { text: Start, context: verb, translation: "開始" }
  - { text: Closed, translation: "クローズ済み" }
  - { text: Close this task?, translation: "このタスクを閉じますか？" }
  - { text: Already started., translation: "開始済みです。" }
  - { text: Already finished., translation: "完了済みです。" }
  - { text: Assign, translation: "割り当て" }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} を {$assignee} に割り当てました。" }
  - { text: "Task {$id} is unchanged.", translation: "タスク {$id} は変更されていません。" }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: "リストの行アクション" }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "最新のコメントで、リーダーが描画するリストです。ピン留めしたものが先頭に並びます。「ピン留め」はまだピン留めされていないコメントに即座に実行され、「削除」は先に確認し、「編集」はダイアログで新しいテキストを求めます。空のままにするとそのフィールドで拒否されます。リストは操作のたびに再読み込みされます。" }
  - { text: Latest comments, translation: "最新のコメント" }
  - { text: Pin, translation: "ピン留め" }
  - { text: Already pinned., translation: "ピン留め済みです。" }
  - { text: Delete this comment?, translation: "このコメントを削除しますか？" }
  - { text: Rewrite this comment?, translation: "このコメントを書き換えますか？" }
  - { text: More places a success goes, translation: "成功時のその他の移動先" }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "1 つ目はタスクを追加し、マニフェストに書かれたアドレスであるテーブルのページへ移動します。2 つ目はハンドブックのアドレス、つまりサーバーがマウント配下で配信するファイルを返し、通常の読み込みになります。3 つ目はチームのミラー、つまりブラウザーが別のホストと解釈するアドレスを返します。どこにも移動せず、応答がそのことを示します。" }
  - { text: Add it and open the tables, translation: "追加してテーブルを開く" }
  - { text: Open the handbook, translation: "ハンドブックを開く" }
  - { text: Open the mirror, translation: "ミラーを開く" }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "応答は {$mirror} でしたが、移動先のアドレスではないため、ページはそのままです。" }
  - { text: "Refused, and unanswered", translation: "拒否と無応答" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "プロジェクトを一時停止できるのはマネージャーだけです。セッションがない場合、ガードは 401 を返します。データのページでマネージャーではない james@northwind.example としてサインインすると、ルートは本文なしで 403 を返します。ada@northwind.example としてサインインするとプロジェクトを一時停止し、稼働中でないプロジェクトはページの言語で拒否します。各拒否はアクションのデフォルトの失敗ツリーで描画されます。" }
  - { text: Pause the project, translation: "プロジェクトを一時停止" }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "{$code} は稼働中ではないため、一時停止できません。" }
  - { text: "{$name} is paused.", translation: "{$name} を一時停止しました。" }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "このルートはすべてのリクエストを自分自身に送り返すため、ブラウザーは途中で諦め、応答はまったく届きません。失敗ツリーがそのことを示します。エラーにはステータスがありません。" }
  - { text: Call a route that never answers, translation: "応答しないルートを呼び出す" }
  - { text: "The route answered, with the status", translation: "ルートが応答しました。ステータス:" }
  - { text: "No answer arrived, so there is no status.", translation: "応答が届かなかったため、ステータスはありません。" }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: "アドレスを読み取る行アクション" }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "テーブルはアドレスが指定するプロジェクトのタスクを一覧表示し、「移動」は押した時点でテーブルのクエリから読み取った、アドレスが指定するステータスへタスクを移します。移動のすべてのフィールドは行とアドレスで決まるため、ダイアログは何も尋ねず、単なる確認になります。プロジェクトとステータスを選んでください:" }
  - { text: TEL-42 into review, translation: "TEL-42 をレビューへ" }
  - { text: APP-5 to finished, translation: "APP-5 を完了へ" }
  - { text: OPS-7 back to in progress, translation: "OPS-7 を進行中に戻す" }
  - { text: Neither, translation: "指定なし" }
  - { text: Moved to, translation: "移動先" }
  - { text: Move this task to the status the address names?, translation: "このタスクをアドレスが指定するステータスへ移動しますか？" }
  - { text: Choose a status above first., translation: "先に上でステータスを選んでください。" }

  # Components.
  - { text: A component on the page, translation: "ページ上のコンポーネント" }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "TSX で書かれ、このサンプルのライブラリーで提供されるコンポーネントで、固定のプロパティで配置されています。ホストが提供するものをすべて使います。現在のページを表示し、開いているパネルをアドレスに保持し、navigate と href からのリンクで別のページへ移動し、https アドレスは拒否されます。fetch で TEL-42 の状況を読み取ってタスクを追加し、notifyChanged でタスクの変更を通知し — その結果、下のテーブルが再読み込みされます — onChanged で受け取ったすべての変更を、テーブル自身の編集や削除も含めて数えます。追加したタスクは、ページの隅にある独自のレイヤーで通知されます。" }
  - { text: A component in a cell, translation: "セル内のコンポーネント" }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "優先度のカラムは、各行の優先度とタスクがブロック中かどうかを受け取るコンポーネントが描画します。テーブルはコンポーネントが書き込むのと同じコレクションから TEL-42 のタスクを一覧表示するため、上でタスクが追加されると再読み込みされます。テーブルでの編集や削除はコンポーネントに伝わります。" }
  - { text: Its stylesheet, translation: "スタイルシート" }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "コンポーネントのソースは独自のスタイルシートをインポートし、アプリケーションはそれを telo.component レイヤー、つまりテーマとブランドの後、アプリケーション自身のスタイルシートの前に配置します。その中のすべての値はデザイントークンを参照するため、デスクとメーターは各マウントの外観に従います。" }

  # CRUD.
  - { text: A generated admin screen, translation: "生成された管理画面" }
  - { text: "One declaration over the tasks collection the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the collection, so the screen offers exactly what the API accepts.", translation: "API の提供元であるタスクモデルに対する 1 つの宣言です。フィルターバー、並べ替え可能でページ分割されたテーブル、タスクの追加フォームと変更フォーム、そしてすべての行の確認付き削除です。カラム、フィールド、フィルターはすべてモデルから導出されるため、画面は API が受け付けるものをそのまま提供します。" }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "バーはテーブルの横の終了側の端に置かれ、選んだフィルターだけを、それぞれコントロールを開くチップとして表示します。選択内容はこのブラウザーのキー aside に保持されます — これはフィルターのページでテーブルの横にあるバーのキーと同じなので、どちらかのページで選んだフィルターは両方で選択されます。" }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "新しいタスクは終了側の端からのドロワーで開き、保存後も空になって開いたままなので次のタスクを続けて作成できます。タスクの変更はリストの横のパネルで行い、パネルはアドレスの一部になります。未保存の入力があるまま離れようとすると、先に確認します。" }

  # Related records.
  - { text: "Related records", translation: "関連レコード" }
  - { text: "Posts and their authors", translation: "投稿とその著者" }
  - { text: "Each post names its author by key. The author column shows the author's name instead, read in one request for every author on the page, and the bar's author filter offers every author by name. The create and edit forms pick the author from a list of authors, searched by name.", translation: "各投稿は著者をキーで示します。著者列は代わりに著者の名前を表示し、ページ上のすべての著者について1回のリクエストで読み込みます。バーの著者フィルターは各著者を名前で提示します。作成フォームと編集フォームは、名前で検索できる著者の一覧から著者を選びます。" }
  - { text: "Only the authors with posts", translation: "投稿のある著者だけ" }
  - { text: "These filters offer only the authors and the statuses present among the posts the other filters leave, each with how many posts it has. The posts are drawn as cards, and as a list below the breakpoint, loading more as you reach the end.", translation: "これらのフィルターは、ほかのフィルターが残す投稿の中にある著者とステータスだけを、それぞれの投稿数とともに提示します。投稿はカードとして描かれ、ブレークポイント未満では一覧として描かれ、末尾に達するとさらに読み込みます。" }
  - { text: "On a board by status", translation: "ステータス別のボード" }
  - { text: "One column per status, each read and counted on its own. Drag a card to another column, or move it from its menu, to change its status; every list of posts on the page reads again.", translation: "ステータスごとに1列で、各列は個別に読み込まれ数えられます。ステータスを変えるには、カードを別の列へドラッグするか、メニューから移動します。ページ上の投稿の一覧はすべて読み込み直されます。" }
  - { text: "On a calendar", translation: "カレンダー上" }
  - { text: "The posts on the day each is published, a month at a time; the month shown reads every post dated in it. A post with no date is not on the calendar.", translation: "投稿はそれぞれの公開日に、1か月ずつ表示されます。表示中の月は、その月の日付を持つすべての投稿を読み込みます。日付のない投稿はカレンダーに載りません。" }
  - { text: "The authors", translation: "著者" }
  - { text: "The authors' own screen, generated from their collection. It reads the same address the posts' author filter and picker read, so an author added here is offered there at once.", translation: "著者自身の画面で、そのコレクションから生成されます。投稿の著者フィルターと選択欄が読むのと同じアドレスを読むので、ここで追加した著者はすぐにそこでも提示されます。" }
  - { text: "Reporting lines as a tree", translation: "ツリーで見る報告系統" }
  - { text: "Each person names who they report to, a relation of the people to themselves. The tree reads the people who report to nobody first, and a person's reports when they are opened. The form picks the manager from the same people.", translation: "各人は自分の上司を示します。人と人自身の関係です。ツリーはまず誰にも報告しない人を読み、ある人を開くとその部下を読み込みます。フォームは同じ人たちの中から上司を選びます。" }
  # The labels of the related-records page's models.
  - { text: "Author", translation: "著者" }
  - { text: "Draft", translation: "下書き" }
  - { text: "Published", translation: "公開済み" }
  - { text: "Published on", translation: "公開日" }
  - { text: "Reports to", translation: "上司" }
  - { text: "Post", translation: "投稿" }

  # Themes.
  - { text: Four mounts of one design, translation: "1 つのデザインの 4 つのマウント" }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "同じページが 4 回配信され、各アプリケーションが独自のテーマ、ブランド、ナビゲーションを指定します。ページは 4 つすべてから参照によって配置される 1 組のビューなので、異なるのは外観とナビゲーションだけです。" }
  - { text: At the root, translation: "ルート" }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "組み込みの外観に、このサンプル独自のスタイルシートを重ね、リクエストごとにブランドを選びます。Cookie で要求されている間は Acme のトークンセット、それ以外はテーマ自身の値です。" }
  - { text: Under /radix, translation: "/radix 配下" }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Radix テーマです。スタイルシートと 13 個のコントロール — 選択リスト、ダイアログ、ドロワー、ポップオーバー、メニュー、ツールチップ — を備え、ブランドはテーマに任せています。" }
  - { text: Under /brand, translation: "/brand 配下" }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "このサンプル独自のテーマです。ここで書かれたスタイルシートと独自のトークン値のもとで Radix のコントロールを使います。アプリケーションのブランドは 1 つのトークンセットで、テーマが指定する Inter 書体を同梱しています。" }
  - { text: Under /sidebar, translation: "/sidebar 配下" }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "組み込みの外観で、ナビゲーションはページ横のサイドバーにあり、レールに折りたたむことができ、開いたグループを記憶します。スマートフォンでは下端に沿ったタブバーになります。" }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "リンクは描画されたマウントの配下で解決されるため、マウント間のリンクとブランドの切り替えはルートアプリケーションのテーマのページにあります。" }
  - { text: Every design token, translation: "すべてのデザイントークン" }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "固定されたセットの各トークンを、このページのテーマとブランドが与える値で示します。値はレンダラーが投影するカスタムプロパティから読み取り、その値でサンプルを描画します。別のマウントを開くか、ルートでブランドを切り替えると値が変わります。" }
  - { text: Typefaces, translation: "書体" }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "本文と見出しの書体を 4 つのスタイルそれぞれで示し、各スタイルをこのアプリケーションが配信しているかどうかも示します。/brand 配下では Inter のレギュラー、ボールド、イタリック、ボールドイタリックで、サンプルに同梱されページとともに配信されます。他の 2 つのマウントは何も配信せず、閲覧者のフォントで描画します。" }
  - { text: Switch the mount or the brand, translation: "マウントまたはブランドを切り替え" }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "これらのリンクはこのアプリケーション自身のものです。リンクは描画されたマウントの配下で解決されるため、他の 2 つに到達できるのはルートのアプリケーションだけです。いずれも別のアプリケーションの通常の読み込みです。" }
  - { text: Open the Radix mount, translation: "Radix のマウントを開く" }
  - { text: Open the brand mount, translation: "ブランドのマウントを開く" }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "このアプリケーションのブランドはリクエストごとに選ばれます。切り替えると Cookie が設定またはクリアされてこのページに戻り、Cookie がある間はテーマ自身の値の代わりに Acme のトークンセットが使われます。" }
  - { text: Use the Acme brand, translation: "Acme ブランドを使用" }
  - { text: "Use the theme's own values", translation: "テーマの値を使用" }

