kind: Telo.Application
metadata:
  name: UiFilterPolicyCombinationsTest
  version: 1.0.0
  description: |
    No member of a filter bar's policy limits another: every way of showing
    filters, of drawing their controls, of applying a change and of summarising
    the bar is accepted with every placement kind, checked and provided.
imports:
  Ui: ../
  Probe: ./__fixtures__/probe
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref main
---
kind: Telo.JsonSchema
metadata:
  name: Todo
schema:
  type: object
  properties:
    text: { type: string }
---
kind: Ui.Collection
metadata:
  name: todos
query:
  filters:
    - { property: text, operator: contains }
  sort: []
---
# show × controls × apply × summary, each under the four placement kinds.
kind: Ui.View
metadata:
  name: every
content:
  type: stack
  children:
    - { type: composite, ref: { kind: Ui.Filters, model: !ref Todo, collection: !ref todos, content: { type: text, text: Todos }, policy: { show: all, controls: direct, apply: commit, summary: none, placement: { kind: Ui.AbovePlacement } } } }
    - { type: composite, ref: { kind: Ui.Filters, model: !ref Todo, collection: !ref todos, content: { type: text, text: Todos }, policy: { show: all, controls: direct, apply: commit, summary: none, placement: { kind: Ui.AsidePlacement } } } }
