modules:
  modules/ai-openai: Deprecated
  modules/embedding-openai: Deprecated
body: Merged into the `openai` module, which serves every OpenAI endpoint — chat, images
  and embeddings — under one import. One module per SYSTEM rather than per endpoint, so
  moderation, audio, batch and files arrive there as further kinds rather than as a
  module apiece. The rename rides the release that already breaks every consumer's
  imports; done later it would be a second break of the same manifests. `telo upgrade`
  moves a pin within a ref and does not cross a rename, so a consumer edits its
  `imports:` by hand once.
