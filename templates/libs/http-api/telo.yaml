kind: Telo.Library
metadata:
  name: HelloApiLibrary
  version: 1.0.0
  description: |
    A reusable `Telo.Library` that defines a single `HelloApi` (`Http.Api`) plus
    the `SayHello` handler it dispatches to. Importers receive `HelloApi` under
    their chosen alias and can mount it on any `Http.Server` — define the route
    once, mount it on as many paths/servers as you like.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.24.0#sha256-9smTNeAG3kqd69fqYtTC5K1QKSCogC3WA_DnVIUVV8g
  Run: oci://ghcr.io/telorun/run@0.22.0#sha256-FeYAHs_krf06Dk68n5Mtjp0wLSfOvDLslREHP54BiJM
exports:
  resources:
    - HelloApi
---
kind: Http.Api
metadata:
  name: HelloApi
routes:
  - request:
      path: /hello
      method: GET
      schema:
        query:
          type: object
          properties:
            name:
              type: string
          required: [ "name" ]
    handler: !ref SayHello
    inputs:
      name: !cel "request.query.name"
    returns:
      - status: 200
        content:
          application/json:
            schema:
              type: object
              properties:
                greeting: { type: string }
              required: [ greeting ]
              additionalProperties: false
            body:
              greeting: !cel "'Hello ' + result.message + '!'"
---
kind: Run.Value
metadata:
  name: SayHello
inputs:
  name: { type: string }
value:
  message: !cel "inputs.name"
