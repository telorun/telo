  # Actions.
  - { text: A bare button, translation: "Un simple bouton" }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "Un modèle d'entrée sans propriétés dessine le bouton seul. Celui-ci débloque chaque tâche bloquée de TEL-42, et les compteurs de tâches et le tableau de TEL-42 plus bas sont relus." }
  - { text: Unblock TEL-42, translation: "Débloquer TEL-42" }
  - { text: An answer drawn from the result, translation: "Une réponse dessinée à partir du résultat" }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "La route additionne les estimations des tâches ouvertes d'un projet. Ses champs sont ceux du modèle d'entrée, en deux sections, le projet choisi dans la collection des projets et le rythme sur un curseur ; ce qui est saisi est conservé dans l'adresse. La réponse est dessinée sous le bouton : des phrases sur le résultat et l'enregistrement envoyé, la date à laquelle le travail serait terminé, et une liste des heures par étiquette." }
  - { text: What to count, translation: "Que compter" }
  - { text: How fast, translation: "À quel rythme" }
  - { text: Estimate, context: verb, translation: "Estimer" }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} n'a aucune tâche ouverte."
        one: "{$hours} h dans {$tasks} tâche ouverte de {$project}"
        many: "{$hours} h dans {$tasks} de tâches ouvertes de {$project}"
        other: "{$hours} h dans {$tasks} tâches ouvertes de {$project}"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation:
      plural: weeks
      cases:
        one: "Environ {$weeks} semaine à {$pace} h par semaine, terminé d'ici le"
        many: "Environ {$weeks} de semaines à {$pace} h par semaine, terminé d'ici le"
        other: "Environ {$weeks} semaines à {$pace} h par semaine, terminé d'ici le"
  - { text: By label, translation: "Par étiquette" }
  - { text: When it fails, translation: "En cas d'échec" }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "Un arbre d'échec propre à l'action, dessiné à partir de l'erreur et de l'enregistrement envoyé. Attribuez la tâche 4 à james@northwind.example et l'action réussit. Omettez l'e-mail, ou indiquez quelqu'un hors de l'équipe, et le refus arrive sur le champ ; la tâche 999 répond 404, et tomas@northwind.example, qui est parti, 409." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "Cette action lit la réponse de la route d'estimation comme un nombre de jours, que la route ne donne pas : la réponse est refusée par le modèle de sortie de l'action, et son arbre d'échec le signale." }
  - { text: Estimate in days, translation: "Estimer en jours" }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code} : la réponse n'est pas celle que lit ce bouton." }
  - { text: Where a success goes, translation: "Où mène un succès" }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "La première répond avec la page listant les tâches d'un projet, et l'application s'y rend. La seconde répond avec la page d'accueil de l'équipe, une adresse https qui remplace la page." }
  - { text: Open its tasks, translation: "Ouvrir ses tâches" }
  - { text: Visit the homepage, translation: "Visiter la page d'accueil" }
  - { text: Reading again after a success, translation: "Relecture après un succès" }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "Déplacer une tâche relit à la fois les compteurs ci-dessous, un lecteur, et le tableau de TEL-42 plus bas. La réponse indique la tâche et son nouveau statut." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code} : à faire {$todo}, en cours {$doing}, en revue {$review}, terminé {$done}, bloqué {$blocked}." }
  - { text: Move, translation: "Déplacer" }
  - { text: "Task {$id}, {$title}, is now", translation: "La tâche {$id}, {$title}, est maintenant" }
  - { text: One press after another, translation: "Une pression après l'autre" }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "Les commentaires sont envoyés l'un après l'autre, dans l'ordre où le bouton est pressé, aussi vite que ce soit. Le bouton attend trois caractères et indique pourquoi ; choisir une autre tâche efface la dernière réponse. Les commentaires listés en bas sont relus après chacun." }
  - { text: Add the comment, translation: "Ajouter le commentaire" }
  - { text: Write three characters or more., translation: "Écrivez au moins trois caractères." }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        one: "Le commentaire {$id} est le premier de {$title}."
        many: "Commentaire {$id} ajouté à {$title}, qui compte maintenant {$count} de commentaires."
        other: "Commentaire {$id} ajouté à {$title}, qui compte maintenant {$count} commentaires."
  - { text: Row actions on a table, translation: "Actions de ligne dans un tableau" }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "Chaque tâche de TEL-42 propose trois boutons, chacun remplacé par sa réponse une fois pressé. Démarrer s'exécute immédiatement, seulement sur une tâche encore à faire. Fermer demande d'abord, et n'est pas proposé sur une tâche terminée. Attribuer ouvre une boîte de dialogue pour l'e-mail, que la ligne ne donne pas, et affiche le refus du serveur sur son champ." }
  - { text: Number, translation: "Numéro" }
  - { text: Start, context: verb, translation: "Démarrer" }
  - { text: Closed, translation: "Fermé" }
  - { text: Close this task?, translation: "Fermer cette tâche ?" }
  - { text: Already started., translation: "Déjà démarrée." }
  - { text: Already finished., translation: "Déjà terminée." }
  - { text: Assign, translation: "Attribuer" }
  - { text: "{$title} is assigned to {$assignee}.", translation: "La tâche {$title} est attribuée à {$assignee}." }
  - { text: "Task {$id} is unchanged.", translation: "La tâche {$id} n'a pas changé." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: "Actions de ligne dans une liste" }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "Les derniers commentaires, une liste dessinée par un lecteur, les épinglés en premier. Épingler s'exécute immédiatement sur un commentaire pas encore épinglé, Supprimer demande d'abord, et Modifier demande le nouveau texte dans une boîte de dialogue ; le laisser vide est refusé sur son champ. La liste est relue après chaque action." }
  - { text: Latest comments, translation: "Derniers commentaires" }
  - { text: Pin, translation: "Épingler" }
  - { text: Already pinned., translation: "Déjà épinglé." }
  - { text: Delete this comment?, translation: "Supprimer ce commentaire ?" }
  - { text: Rewrite this comment?, translation: "Réécrire ce commentaire ?" }
  - { text: More places a success goes, translation: "D'autres destinations d'un succès" }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "La première ajoute une tâche et se rend sur la page des tableaux, une adresse écrite dans le manifeste. La deuxième répond avec l'adresse du manuel, un fichier que le serveur sert sous le point de montage, ce qui est un chargement ordinaire. La troisième répond avec le miroir de l'équipe, une adresse qu'un navigateur lit comme un autre hôte : elle ne mène nulle part, et la réponse le signale." }
  - { text: Add it and open the tables, translation: "L'ajouter et ouvrir les tableaux" }
  - { text: Open the handbook, translation: "Ouvrir le manuel" }
  - { text: Open the mirror, translation: "Ouvrir le miroir" }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "La réponse était {$mirror}, qui n'est pas une adresse où se rendre, donc la page reste." }
  - { text: "Refused, and unanswered", translation: "Refusé, et sans réponse" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "Seul un manager peut mettre un projet en pause. Sans session, la garde répond 401. Connecté sur la page Données en tant que james@northwind.example, qui n'est pas manager, la route répond 403 sans corps ; connecté en tant qu'ada@northwind.example, elle met le projet en pause, et refuse, dans la langue de la page, un projet qui n'est pas en cours. L'arbre d'échec par défaut de l'action dessine chaque refus." }
  - { text: Pause the project, translation: "Mettre le projet en pause" }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "Le projet {$code} n'est pas en cours, il ne peut donc pas être mis en pause." }
  - { text: "{$name} is paused.", translation: "Le projet {$name} est en pause." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "Cette route renvoie chaque requête vers elle-même, donc le navigateur abandonne et aucune réponse n'arrive. L'arbre d'échec le signale : l'erreur ne porte aucun statut." }
  - { text: Call a route that never answers, translation: "Appeler une route qui ne répond jamais" }
  - { text: "The route answered, with the status", translation: "La route a répondu, avec le statut" }
  - { text: "No answer arrived, so there is no status.", translation: "Aucune réponse n'est arrivée, il n'y a donc pas de statut." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: "Actions de ligne qui lisent l'adresse" }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "Le tableau liste les tâches du projet que nomme l'adresse, et Déplacer envoie une tâche vers le statut que nomme l'adresse, lu dans la requête du tableau au moment de la pression. La ligne et l'adresse fixent chaque champ du déplacement, donc sa boîte de dialogue ne demande rien et n'est qu'une simple confirmation. Choisissez un projet et un statut :" }
  - { text: TEL-42 into review, translation: "TEL-42 en revue" }
  - { text: APP-5 to finished, translation: "APP-5 vers terminé" }
  - { text: OPS-7 back to in progress, translation: "OPS-7 de retour en cours" }
  - { text: Neither, translation: "Aucun" }
  - { text: Moved to, translation: "Déplacée vers" }
  - { text: Move this task to the status the address names?, translation: "Déplacer cette tâche vers le statut que nomme l'adresse ?" }
  - { text: Choose a status above first., translation: "Choisissez d'abord un statut ci-dessus." }

  # Components.
  - { text: A component on the page, translation: "Un composant sur la page" }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "Un composant écrit en TSX et livré par une bibliothèque de cet exemple, placé avec des propriétés fixes. Il utilise tout ce que l'hôte lui donne : il montre où se trouve la page, garde dans l'adresse le panneau ouvert, passe à une autre page par navigate et par un lien issu de href, et se voit refuser une adresse https. Il lit l'état de TEL-42 et ajoute une tâche avec fetch, signale que les tâches ont changé avec notifyChanged — si bien que le tableau ci-dessous est relu — et compte chaque changement dont il a connaissance avec onChanged, y compris les modifications et suppressions faites dans le tableau lui-même. Une tâche qu'il ajoute est annoncée dans une couche qui lui est propre, dans le coin de la page." }
  - { text: A component in a cell, translation: "Un composant dans une cellule" }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "La colonne de priorité est dessinée par un composant qui reçoit la priorité de chaque ligne et l'indication que la tâche est bloquée ou non. Le tableau liste les tâches de TEL-42 depuis la collection même où écrit le composant, donc il est relu quand une tâche est ajoutée au-dessus ; ses modifications et suppressions sont perçues par le composant." }
  - { text: Its stylesheet, translation: "Sa feuille de style" }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "Les sources des composants importent leur propre feuille de style, que l'application place dans la couche telo.component : après le thème et la marque, avant la feuille de style propre à l'application. Chaque valeur qu'elle contient lit un jeton de design, donc le pupitre et la jauge prennent l'apparence de chaque point de montage." }

  # CRUD.
  - { text: A generated admin screen, translation: "Un écran d'administration généré" }
  - { text: "One declaration over the tasks collection the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the collection, so the screen offers exactly what the API accepts.", translation: "Une seule déclaration sur le modèle des tâches à partir duquel l'API est servie : une barre de filtres, un tableau triable et paginé, un formulaire pour ajouter une tâche et un autre pour la modifier, et une suppression avec confirmation sur chaque ligne. Les colonnes, les champs et les filtres sont tous dérivés du modèle, donc l'écran propose exactement ce que l'API accepte." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "La barre se place à côté du tableau, au bord de fin, et n'affiche que les filtres que vous choisissez, chacun sous forme de pastille qui ouvre son contrôle. Elle conserve son choix dans ce navigateur sous la clé aside — la clé de la barre à côté du tableau sur la page Filtres, donc un filtre choisi sur l'une des deux pages l'est sur les deux." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "Une nouvelle tâche s'ouvre dans un tiroir depuis le bord de fin, qui reste ouvert, vidé, pour la suivante. Une tâche se modifie dans un panneau à côté de la liste, qui fait partie de l'adresse, et le quitter avec une saisie non enregistrée demande d'abord confirmation." }

  # Related records.
  - { text: "Related records", translation: "Enregistrements liés" }
  - { text: "Posts and their authors", translation: "Les articles et leurs auteurs" }
  - { text: "Each post names its author by key. The author column shows the author's name instead, read in one request for every author on the page, and the bar's author filter offers every author by name. The create and edit forms pick the author from a list of authors, searched by name.", translation: "Chaque article nomme son auteur par sa clé. La colonne auteur affiche à la place le nom de l'auteur, lu en une seule requête pour tous les auteurs de la page, et le filtre d'auteur de la barre propose chaque auteur par son nom. Les formulaires de création et de modification choisissent l'auteur dans une liste d'auteurs, recherchée par nom." }
  - { text: "Only the authors with posts", translation: "Seulement les auteurs ayant des articles" }
  - { text: "These filters offer only the authors and the statuses present among the posts the other filters leave, each with how many posts it has. The posts are drawn as cards, and as a list below the breakpoint, loading more as you reach the end.", translation: "Ces filtres ne proposent que les auteurs et les statuts présents parmi les articles que laissent les autres filtres, chacun avec son nombre d'articles. Les articles sont dessinés en cartes, et en liste sous le point de rupture, qui en charge davantage quand vous atteignez la fin." }
  - { text: "On a board by status", translation: "Sur un tableau par statut" }
  - { text: "One column per status, each read and counted on its own. Drag a card to another column, or move it from its menu, to change its status; every list of posts on the page reads again.", translation: "Une colonne par statut, chacune lue et comptée à part. Faites glisser une carte vers une autre colonne, ou déplacez-la depuis son menu, pour changer son statut ; chaque liste d'articles de la page est relue." }
  - { text: "On a calendar", translation: "Sur un calendrier" }
  - { text: "The posts on the day each is published, a month at a time; the month shown reads every post dated in it. A post with no date is not on the calendar.", translation: "Les articles le jour où chacun est publié, un mois à la fois ; le mois affiché lit chaque article daté dans ce mois. Un article sans date n'apparaît pas dans le calendrier." }
  - { text: "The authors", translation: "Les auteurs" }
  - { text: "The authors' own screen, generated from their collection. It reads the same address the posts' author filter and picker read, so an author added here is offered there at once.", translation: "L'écran propre aux auteurs, généré à partir de leur collection. Il lit la même adresse que le filtre et le sélecteur d'auteur des articles, de sorte qu'un auteur ajouté ici y est proposé aussitôt." }
  - { text: "Reporting lines as a tree", translation: "La hiérarchie en arbre" }
  - { text: "Each person names who they report to, a relation of the people to themselves. The tree reads the people who report to nobody first, and a person's reports when they are opened. The form picks the manager from the same people.", translation: "Chaque personne nomme son responsable, une relation des personnes avec elles-mêmes. L'arbre lit d'abord les personnes qui ne dépendent de personne, puis les collaborateurs d'une personne quand on l'ouvre. Le formulaire choisit le responsable parmi les mêmes personnes." }
  # The labels of the related-records page's models.
  - { text: "Author", translation: "Auteur" }
  - { text: "Draft", translation: "Brouillon" }
  - { text: "Published", translation: "Publié" }
  - { text: "Published on", translation: "Publié le" }
  - { text: "Reports to", translation: "Rattaché à" }
  - { text: "Post", translation: "Article" }

  # Themes.
  - { text: Four mounts of one design, translation: "Quatre points de montage d'un même design" }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "Les mêmes pages sont servies quatre fois, chaque application nommant son propre thème, sa marque et sa navigation. Les pages sont un seul ensemble de vues, placées par référence depuis les quatre, donc seules l'apparence et la navigation diffèrent." }
  - { text: At the root, translation: "À la racine" }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "L'apparence intégrée, la feuille de style propre à cet exemple par-dessus, et une marque choisie à chaque requête : le jeu de jetons Acme tant qu'un cookie le demande, les valeurs propres du thème sinon." }
  - { text: Under /radix, translation: "Sous /radix" }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Le thème Radix : sa feuille de style et ses treize contrôles — listes de choix, boîtes de dialogue, tiroirs, bulles, menus et infobulles — la marque étant laissée au thème." }
  - { text: Under /brand, translation: "Sous /brand" }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "Un thème propre à cet exemple : les contrôles de Radix sous une feuille de style écrite ici, avec ses propres valeurs de jetons. La marque de l'application est un seul jeu de jetons, qui fournit la police Inter que nomme le thème." }
  - { text: Under /sidebar, translation: "Sous /sidebar" }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "L'apparence intégrée avec la navigation dans une barre latérale à côté de la page, qui se réduit en rail et mémorise ses groupes ouverts. Sur un téléphone, elle devient une barre d'onglets le long du bord inférieur." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "Un lien se résout sous le point de montage où il est dessiné, donc les liens entre les points de montage et le sélecteur de marque se trouvent sur la page Thèmes de l'application racine." }
  - { text: Every design token, translation: "Chaque jeton de design" }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "Chaque jeton de l'ensemble fermé tel que le donnent le thème et la marque de cette page, lu dans la propriété personnalisée vers laquelle le moteur de rendu le projette, avec un échantillon dessiné avec lui. Ouvrez un autre point de montage, ou changez de marque à la racine, et les valeurs changent." }
  - { text: Typefaces, translation: "Polices de caractères" }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "Les polices du texte et des titres dans chacune de leurs quatre variantes, et pour chaque variante si cette application la sert. Sous /brand, ce sont les variantes normale, grasse, italique et grasse italique d'Inter, livrées avec l'exemple et servies avec la page ; les deux autres points de montage n'en servent aucune et puisent dans les polices propres du visiteur." }
  - { text: Switch the mount or the brand, translation: "Changer de point de montage ou de marque" }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "Ces liens sont propres à cette application : un lien se résout sous le point de montage où il est dessiné, donc seule l'application à la racine atteint les deux autres. Chacun est un chargement ordinaire d'une autre application." }
  - { text: Open the Radix mount, translation: "Ouvrir le point de montage Radix" }
  - { text: Open the brand mount, translation: "Ouvrir le point de montage de la marque" }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "La marque de cette application est choisie à chaque requête. Le sélecteur définit ou efface un cookie et revient ici, et tant que le cookie est présent, le jeu de jetons Acme est utilisé à la place de celui du thème." }
  - { text: Use the Acme brand, translation: "Utiliser la marque Acme" }
  - { text: "Use the theme's own values", translation: "Utiliser les valeurs propres du thème" }

