# Two stores claiming one name in one table: each is refused.
kind: Telo.Application
metadata:
  name: CoReferrersSameName
  version: 1.0.0
imports:
  Kinds: ./kinds
---
kind: Kinds.Table
metadata:
  name: jobs
---
kind: Kinds.Table
metadata:
  name: archive
---
kind: Kinds.Store
metadata:
  name: first
table: !ref jobs
name: emails
---
kind: Kinds.Store
metadata:
  name: second
table: !ref jobs
name: emails
