kind: Telo.Application
metadata:
  name: TarSmokeTest
  version: 1.0.0
  description: |
    Smoke test for std/tar — a pure telo .tar.gz round-trip, no JavaScript.
    Tar.Pack builds a one-entry archive from literal content → Gzip.Encoder
    compresses → Gzip.Decoder decompresses → Tar.Extract pulls the entry back
    out → PlainText.Decoder collects it, and the text is asserted. A second
    sequence asserts a missing path raises ERR_NOT_FOUND.
imports:
  Gzip: ../../gzip
  Tar: ../
  PlainText: ../../plain-text-codec
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testRoundtrip
  - !ref testNotFound
---
kind: Tar.Pack
metadata: { name: pack }
---
kind: Gzip.Encoder
metadata: { name: compress }
---
kind: Gzip.Decoder
metadata: { name: gunzip }
---
kind: Tar.Extract
metadata: { name: pick }
---
kind: PlainText.Decoder
metadata: { name: toText }
---
kind: Run.Sequence
metadata: { name: testRoundtrip }
steps:
  - name: pack
    inputs:
      entries:
        - path: telo.yaml
          contents: "name: hello"
    invoke: !ref pack
  - name: compress
    inputs:
      input: "${{ steps.pack.result.output }}"
    invoke: !ref compress
  - name: gunzip
    inputs:
      input: "${{ steps.compress.result.output }}"
    invoke: !ref gunzip
  - name: extract
    inputs:
      input: "${{ steps.gunzip.result.output }}"
      path: telo.yaml
    invoke: !ref pick
  - name: toText
    inputs:
      input: "${{ steps.extract.result.output }}"
    invoke: !ref toText
  - name: assert
    inputs:
      text: "${{ steps.toText.result.text }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          text: { const: "name: hello" }
        required: [ text ]
---
kind: Run.Sequence
metadata: { name: testNotFound }
steps:
  - name: pack
    inputs:
      entries:
        - path: telo.yaml
          contents: "name: hello"
    invoke: !ref pack
  - name: tryExtract
    try:
      - name: extract
        inputs:
          input: "${{ steps.pack.result.output }}"
          path: missing.yaml
        invoke: !ref pick
    catch:
      - name: caught
        inputs:
          code: "${{ error.code }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_NOT_FOUND }
            required: [ code ]
