units:
  analyzer: Added
  kernel: Added
body: "A new Telo format, `path-template`, checks a path template where a field declares
  it: an app-relative path, or an `http`, `https` or `mailto` address, whose `{name}`
  variables are whole path segments, each named once, none in an absolute URL's
  authority, query or fragment. `telo check` and the kernel at creation refuse a value
  with the path-template reader's own reason and offset, as in `/path must be a
  path-template: '{id}' appears twice — each variable names one segment at offset 8 of
  \"/x/{id}/{id}\"`."
