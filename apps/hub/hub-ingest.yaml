# Turning one published version into rows, bytes and vectors — durably.
#
# The unit of work is ONE version of one module, and it is a durable run: a crash
# part-way no longer leaves a version row with no kinds, because the relational
# writes commit together and the journal's own record of them commits with them.
# That last property is why this library declares the journal itself, over the
# connection it was handed: a journal is exactly-once only when it writes inside
# the same transaction as the work it records, and handing the library a
# connection AND an unrelated journal would let a composition-root slip produce a
# hub that ingests correctly, passes `telo check`, and silently degrades to
# at-least-once.
#
# Enumeration and digest resolution stay OUTSIDE the run: they are cheap,
# re-runnable, and are the schedule's job rather than the ingest's.
kind: Telo.Library
metadata:
  name: HubIngest
  description: >-
    Ingests one published module version: reads its manifest from the origin,
    caches it to the manifest bucket, writes its metadata, resource kinds,
    exported instances and an application's declared inputs in one transaction,
    and re-embeds the latest version.
requires:
  # `resources:` inputs on a library.
  # 0.128.0: `Telo.Sequence`, which an older analyzer reads as UNDEFINED_KIND.
  telo: ">=0.128.0"
imports:
  Sql: oci://ghcr.io/telorun/sql@0.31.5#sha256-RQrmaix7-he4wzjCTZbaqeULSf7LQFcWwJaRadTIdYU
  Postgres: oci://ghcr.io/telorun/postgres@0.13.1#sha256-PzxNAfiijDmS7LfgFqRdaA0PHwLUrJ6Gw0K6Ftot3Vo
  Run: oci://ghcr.io/telorun/run@0.35.1#sha256-m6oA-tLMj4v0JvzkvRt17CBuWzXSYpumtxyNRb3qVz8
  Console: oci://ghcr.io/telorun/console@0.19.5#sha256-aWnhpC9EodktO29y8zxc5YeFvgMwYD1bP0NkRsK2lic
  Shell: oci://ghcr.io/telorun/shell@0.13.3#sha256-AXRHgGrsKfJpClRdRpdA5KDPtgrBohQeJ1JJmKuJ_xg
  S3: oci://ghcr.io/telorun/s3@0.8.0#sha256-utdJQwmumCl0orYETnVY1oA7ytOZuik8syMIRZ1t_8o
  Embedding: oci://ghcr.io/telorun/embedding@0.12.3#sha256-R068vUQDFYEY3XIQg_SRErb_1MiNGyJ8_WxFjSuucjY
  VectorStore: oci://ghcr.io/telorun/vector-store@0.11.3#sha256-Vt3niMkJuyob3F8_CBO11i9QVA80zVT9AdxmxcdxUJs
  Durable: oci://ghcr.io/telorun/durable-local@0.7.3#sha256-cozgvwT3x_UWSuOM7DRULsDwZvc9IfQ6DSxRVHiYVzY
  Journal: oci://ghcr.io/telorun/durable-journal-postgres@0.15.1#sha256-qvlfJPP7OemLhXmGcSAAnJ33Yzbhiz92114e2qfYYpw
  Schema:
    source: ./hub-schema.yaml
    resources:
      connection: !ref connection
  Origin:
    source: ./hub-origin.yaml
    resources:
      shellHost: !ref shellHost
    variables:
      teloCommand: !cel "variables.teloCommand"
resources:
  connection:
    kind: Postgres.Connection
    description: >-
      The database the rows are written to AND the journal records through —
      one connection, which is what makes a step's record commit with the step.
  bucketPut:
    kind: S3.Put
    description: Writes each version's telo.yaml to the static manifest cache.
  embedPassage:
    kind: Embedding.Passage
    description: Embeds a kind's composed passage for semantic search.
  vectorUpsert:
    kind: VectorStore.Record
    description: Stores a kind's vector against its relational row id.
  vectorRemove:
    kind: VectorStore.Removal
    description: Purges a module's vectors before the latest version is re-embedded.
  shellHost:
    kind: Shell.LocalHost
    description: Forwarded to the origin reader — where the telo CLI runs.
variables:
  # Forwarded to the origin reader: the command its reads run.
  teloCommand:
    type: array
    items: { type: string }
    minItems: 1
    default: [telo]
  # The revision of this ingest pipeline. Raising it makes every tracked version
  # due exactly once, which is the whole-registry re-ingest control — and what
  # replaced the per-column backfill probes, each of which had to be added and
  # read one at a time. 6 records each version's root kind and an application's
  # contract, and stops storing an application's own kinds as exported. 7
  # records what each version imports. 8 indexes need types as kinds, resolves
  # a `Telo.` prefix to `builtinsRef` and a module's own name to the module, and
  # records the built-in vocabulary's root kind. 9 records a need type's runtime
  # reach — the kernels serving need types — where 8 stored it as no kernel.
  # 10 records an application's requiredness: each input's `requiredWhen` and
  # the dimensions it is keyed by, and a `default` only where one is declared.
  # 11 records a member dimension's `member` with its dimension, which a reader
  # no longer splits out of the key. 12 records each version's components and
  # whether its bill of materials is complete.
  ingestRev: { type: integer, default: 12 }
  # The one ref whose `Telo.Builtins` root is indexed — the built-in vocabulary
  # every `Telo.<Kind>` names. Registration is open, so at any other ref such a
  # root is refused: nobody else may publish "built-in" kinds.
  builtinsRef: { type: string, default: oci://ghcr.io/telorun/telo }
exports: { resources: [ingestVersion, scheduleIngest, scheduleDueVersions] }
---
kind: Sql.Query
metadata: { name: query }
connection: !ref connection
---
kind: Sql.Command
metadata: { name: exec }
connection: !ref connection
---
kind: Console.WriteLine
metadata: { name: logLine }
---
# Runs and their step records, in this same database. Sharing the connection the
# ingest writes through is what makes the record of a step land inside the same
# transaction as the step's own writes — so a rollback discards both, and the
# region is journaled per step rather than collapsed.
kind: Journal.Journal
metadata: { name: journal }
connection: !ref connection
---
# ONE version, ingested durably.
#
# The identity is the claim's: `(module, version, attempt)`, where the attempt is
# minted by the claim statement. A fresh attempt is a fresh id, so a retry is
# never blocked by the id of the attempt that failed.
kind: Durable.Workflow
metadata: { name: ingestVersion }
journal: !ref journal
runId: !cel "'ingest:' + inputs.moduleId + ':' + inputs.version + ':' + string(inputs.attempt)"
inputs:
  moduleId: !cel "inputs.moduleId"
  ref: !cel "inputs.ref"
  version: !cel "inputs.version"
  digest: !cel "inputs.digest"
  latestVersion: !cel "inputs.latestVersion"
  attempt: !cel "inputs.attempt"
steps:
  # The whole body is guarded, and the catch does NOT rethrow: a failure is
  # RECORDED on the row and the run completes. Left to throw, the run would end
  # `failed` — a terminal state nothing re-enters — and the row, which is what
  # decides whether this version is ever attempted again, would never learn why.
  - name: guarded
    try:
      # Retried with a growing backoff, and once that backoff passes 30s the run
      # PARKS rather than sleeping: an origin outage then costs nothing while it
      # waits, and the process is free to go away in the meantime.
      - name: manifest
        invoke: !ref Origin.moduleManifest
        inputs:
          ref: !cel "inputs.ref"
          version: !cel "inputs.version"
        retry: { attempts: 6, initialDelay: 2000, maxDelay: 300000 }
      - name: manifestGate
        if: !cel "!steps.manifest.result.ok"
        then:
          - name: fail
            throw:
              code: INGEST_MANIFEST_FAILED
              message: !cel >-
                'telo module manifest ' + inputs.ref + '@' + inputs.version + ' failed: '
                  + steps.manifest.result.error
      # The root kind is recorded from the manifest and nothing else, so a root
      # that is neither module kind is refused rather than recorded as one. The
      # built-in vocabulary is a third root kind, indexed at `builtinsRef` only.
      - name: rootGate
        if: !cel >-
          !(steps.manifest.result.docs[0].kind in ['Telo.Library', 'Telo.Application']
            || (steps.manifest.result.docs[0].kind == 'Telo.Builtins' && inputs.ref == variables.builtinsRef))
        then:
          - name: refuseRoot
            throw:
              code: INGEST_ROOT_KIND_UNSUPPORTED
              message: !cel >-
                'the root document of ' + inputs.ref + '@' + inputs.version + ' is '
                  + steps.manifest.result.docs[0].kind
                  + (steps.manifest.result.docs[0].kind == 'Telo.Builtins'
                      ? ', the built-in vocabulary of a telo release, which is indexed only at '
                          + variables.builtinsRef
                      : '; only a Telo.Library or Telo.Application is indexed')
      # An application is indexed by its declared contract, which the CLI reports
      # as `application`, with the `dimensions` its requiredness is keyed by. A
      # CLI too old to report either would leave the application indexed with an
      # empty contract, which reads as "asks for nothing", or with `required`
      # meaning only "declares no default" — so the version is refused. A refused
      # version never reaches the current `ingest_rev`, so every reconcile pass
      # claims it again, and it is indexed on the first pass after the origin
      # reads run a telo that reports both.
      - name: contractGate
        if: !cel >-
          steps.manifest.result.docs[0].kind == 'Telo.Application'
            && steps.manifest.result.payload.?application.?dimensions.orValue(null) == null
        then:
          - name: refuseContract
            throw:
              code: INGEST_CONTRACT_MISSING
              message: !cel >-
                'telo module manifest ' + inputs.ref + '@' + inputs.version
                  + ' --json reported no `application` contract with its `dimensions` for a '
                  + 'Telo.Application — the telo running the origin reads predates it; point '
                  + 'TELO_COMMAND at the telo that runs this hub'
      # The third-party components the version ships. An artifact with no
      # record is an answer (the version is then never complete); a read that
      # fails is a failure, recorded on the row like any other, so a transient
      # one is retried rather than stored as "ships nothing".
      - name: sbom
        invoke: !ref Origin.moduleSbom
        inputs:
          ref: !cel "inputs.ref"
          version: !cel "inputs.version"
          layers: !cel "steps.manifest.result.docs[0].?layers.orValue([])"
        retry: { attempts: 3, initialDelay: 2000, maxDelay: 60000 }
      - name: sbomGate
        if: !cel "!steps.sbom.result.ok"
        then:
          - name: failSbom
            throw:
              code: INGEST_SBOM_FAILED
              message: !cel >-
                'telo module sbom ' + inputs.ref + '@' + inputs.version + ' failed: '
                  + steps.sbom.result.error
      # The modules nested in the artifact (`oci://<repo>@sha256:<digest>/<path>`),
      # found through the relative imports of the version and of each nested
      # module in turn, each read like the version itself. A nested module whose
      # record cannot be read is a failed ingest, as the version's own is.
      - name: nestedStart
        value: !cel >-
          {'pending': [], 'done': []}
      - name: nestedRoots
        if: !cel "inputs.ref.startsWith('oci://')"
        then:
          - name: found
            invoke: !ref query
            inputs:
              sql: >-
                SELECT COALESCE(jsonb_agg(DISTINCT p), '[]'::jsonb) AS paths
                FROM (SELECT nested_import_path('', r.source) AS p
                      FROM jsonb_to_recordset($1::jsonb) AS r(source text)
                      WHERE r.source ~ '^\.\.?/') x
                WHERE p IS NOT NULL
              bindings:
                - !cel >-
                  json(('imports' in steps.manifest.result.docs[0] ? steps.manifest.result.docs[0].imports : {})
                    .map(a, {'source': (type(steps.manifest.result.docs[0].imports[a]) == type('')
                                          ? steps.manifest.result.docs[0].imports[a]
                                          : steps.manifest.result.docs[0].imports[a].source).split('#')[0]}))
          - name: nestedStart
            value: !cel "{'pending': steps.found.result.rows[0].paths, 'done': []}"
      - name: nestedWalk
        while: !cel "size(steps.nestedStart.result.pending) > 0"
        do:
          - name: current
            value: !cel "steps.nestedStart.result.pending[0]"
          - name: nestedManifest
            invoke: !ref Origin.nestedManifest
            inputs:
              ref: !cel "inputs.ref"
              path: !cel "steps.current.result"
              digest: !cel "inputs.digest"
            retry: { attempts: 3, initialDelay: 2000, maxDelay: 60000 }
          - name: nestedManifestGate
            if: !cel "!steps.nestedManifest.result.ok"
            then:
              - name: failNestedManifest
                throw:
                  code: INGEST_SBOM_FAILED
                  message: !cel >-
                    'reading the module nested at ' + steps.current.result + ' in ' + inputs.ref + '@'
                      + inputs.version + ' failed: ' + steps.nestedManifest.result.error
          - name: nestedSbom
            invoke: !ref Origin.moduleSbom
            inputs:
              ref: !cel "inputs.ref"
              version: !cel "inputs.version"
              layers: !cel "steps.nestedManifest.result.docs[0].?layers.orValue([])"
              path: !cel "steps.current.result"
              digest: !cel "inputs.digest"
            retry: { attempts: 3, initialDelay: 2000, maxDelay: 60000 }
          - name: nestedGate
            if: !cel "!steps.nestedSbom.result.ok"
            then:
              - name: failNested
                throw:
                  code: INGEST_SBOM_FAILED
                  message: !cel >-
                    'reading the module nested at ' + steps.current.result + ' in ' + inputs.ref + '@'
                      + inputs.version + ' failed: ' + steps.nestedSbom.result.error
          - name: nestedImports
            value: !cel >-
              ('imports' in steps.nestedManifest.result.docs[0] ? steps.nestedManifest.result.docs[0].imports : {})
                .map(a, {'alias': a,
                         'source': (type(steps.nestedManifest.result.docs[0].imports[a]) == type('')
                                     ? steps.nestedManifest.result.docs[0].imports[a]
                                     : steps.nestedManifest.result.docs[0].imports[a].source).split('#')[0]})
                .map(i, {'alias': i.alias, 'source': i.source, 'ref': i.source.split('@')[0],
                         'version': size(i.source.split('@')) > 1 ? i.source.split('@')[1] : ''})
          - name: nestedFound
            invoke: !ref query
            inputs:
              sql: >-
                SELECT COALESCE(jsonb_agg(DISTINCT p), '[]'::jsonb) AS paths
                FROM (SELECT nested_import_path($1, r.source) AS p
                      FROM jsonb_to_recordset($2::jsonb) AS r(source text)
                      WHERE r.source ~ '^\.\.?/') x
                WHERE p IS NOT NULL
              bindings:
                - !cel "steps.current.result"
                - !cel "json(steps.nestedImports.result)"
          - name: nestedStart
            value: !cel >-
              {'pending': steps.nestedStart.result.pending.filter(p, p != steps.current.result)
                            + steps.nestedFound.result.rows[0].paths.filter(p,
                                !(p in steps.nestedStart.result.pending)
                                && !(p in steps.nestedStart.result.done.map(d, d.path))),
               'done': steps.nestedStart.result.done + [{
                 'path': steps.current.result,
                 'complete': steps.nestedSbom.result.recorded && steps.nestedSbom.result.complete,
                 'components': steps.nestedSbom.result.components,
                 'imports': steps.nestedImports.result}]}
      # The CLI gives a local module no cache location, since no editor reads
      # one from the public cache; the hub still keeps its manifest so
      # `get_module_manifest` answers for it, under a key of its own that no
      # published ref can produce.
      - name: cacheKey
        value: !cel >-
          inputs.ref.startsWith('./')
            ? 'local/' + inputs.ref.substring(2) + '/' + inputs.version + '/telo.yaml'
            : string(steps.manifest.result.payload.cacheKey)
      # Outside the transaction on purpose: the key is deterministic, so a
      # replayed put is a no-op, while a put journaled INSIDE a transaction that
      # then rolls back would have its record discarded and be repeated anyway.
      - name: cache
        invoke: !ref bucketPut
        inputs:
          key: !cel "steps.cacheKey.result"
          body: !cel "steps.manifest.result.payload.manifest"
          contentType: text/yaml
      - name: rows
        invoke: !ref ingestTransaction
        inputs:
          moduleId: !cel "inputs.moduleId"
          ref: !cel "inputs.ref"
          version: !cel "inputs.version"
          digest: !cel "inputs.digest"
          latestVersion: !cel "inputs.latestVersion"
          cacheKey: !cel "steps.cacheKey.result"
          payload: !cel "steps.manifest.result.payload"
          docs: !cel "steps.manifest.result.docs"
          sbom: !cel "steps.sbom.result"
          nested: !cel "steps.nestedStart.result.done"
      # Embed only the module's latest version, superseding any prior vectors so
      # the vector table holds exactly one vector per (module, resource-kind).
      # Older versions keep their relational rows (pinned reads, history) but no
      # vector, keeping near-identical versions out of the ANN top-K.
      #
      # After the commit, and replayed from there: a resume that finds the rows
      # already recorded re-runs exactly these steps.
      - name: vectors
        if: !cel "inputs.version == inputs.latestVersion"
        then:
          - name: embed
            invoke: !ref embedVersion
            inputs:
              moduleId: !cel "inputs.moduleId"
              version: !cel "inputs.version"
              docs: !cel "steps.manifest.result.docs"
            retry: { attempts: 4, initialDelay: 2000, maxDelay: 120000 }
    catch:
      - name: log
        invoke: !ref logLine
        inputs:
          output: !cel >-
            '{red ingest failed} ' + inputs.ref + '@' + inputs.version + ' — '
              + error.code + ': ' + error.message
      - name: record
        invoke: !ref Schema.failVersion
        inputs:
          moduleId: !cel "inputs.moduleId"
          version: !cel "inputs.version"
          message: !cel "error.code + ': ' + error.message"
          attempt: !cel "inputs.attempt"
---
# Admit the run now, execute it later. The resumer is what picks it up, so the
# caller — a cron tick or an anonymous registration — returns immediately.
#
# Declared here and EXPORTED rather than restated by each caller: the run id is
# derived from the claim, and two derivations of one identity would eventually
# disagree about which attempt a run is.
kind: Durable.Schedule
metadata: { name: scheduleIngest }
workflow: !ref ingestVersion
after: 0s
runId: !cel "'ingest:' + inputs.moduleId + ':' + inputs.version + ':' + string(inputs.attempt)"
inputs:
  moduleId: !cel "inputs.moduleId"
  ref: !cel "inputs.ref"
  version: !cel "inputs.version"
  digest: !cel "inputs.digest"
  latestVersion: !cel "inputs.latestVersion"
  attempt: !cel "inputs.attempt"
---
# Every relational write for one version, all-or-nothing.
#
# On this same connection, so the journal's record of each step commits with the
# step — which is what turns the region from one collapsed record into a
# per-step one, and is the only way exactly-once is reachable at all.
kind: Sql.Transaction
metadata: { name: ingestTransaction }
connection: !ref connection
steps: !ref writeVersionRows
inputs:
  moduleId: !cel "inputs.moduleId"
  ref: !cel "inputs.ref"
  version: !cel "inputs.version"
  digest: !cel "inputs.digest"
  latestVersion: !cel "inputs.latestVersion"
  cacheKey: !cel "inputs.cacheKey"
  payload: !cel "inputs.payload"
  docs: !cel "inputs.docs"
  sbom: !cel "inputs.sbom"
  nested: !cel "inputs.nested"
---
kind: Telo.Sequence
metadata: { name: writeVersionRows }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      # modules.id is a bigint — the driver yields it as a string.
      moduleId: { type: string }
      ref: { type: string }
      version: { type: string }
      digest: { type: string }
      latestVersion: { type: string }
      # Where the manifest was cached — the CLI's key, or the hub's own for a
      # local module.
      cacheKey: { type: string }
      # `telo module manifest --json` verbatim: cache key, integrity, runtime,
      # and an application's declared contract.
      payload: { type: object, additionalProperties: true }
      # The parsed manifest documents.
      docs: { type: array }
      # What `Origin.moduleSbom` read: the version's components and whether its
      # record is complete.
      sbom: { type: object, additionalProperties: true }
      # The modules nested in the artifact, each `{ path, complete, components,
      # imports }`.
      nested: { type: array }
steps:
  # The rows are SHAPED here, once, as pure values — the two inserts below bind
  # them as one JSON parameter each. Several are not plain reads:
  #
  #   categories — the authored display labels, passed through verbatim; the
  #     INSERT derives the match slugs from them. A kind's own list REPLACES its
  #     module's (declaring it on a kind states where that kind belongs), so the
  #     module's list is the fallback.
  #   exported   — mirrors the kernel's gate (module-context `registerImport`): a
  #     missing `exports.kinds` list means no restriction, a declared list gates
  #     to the listed names. Re-exported entries (`Alias.Kind`) name another
  #     module's kind, never a local definition, so they don't mark local rows.
  #     An application exports nothing, so none of its kinds is exported.
  #   extends / replacedBy — BOTH are alias-qualified kinds (`Cache.Store`,
  #     `Self.Migrations`), and an alias is private to the manifest that declares
  #     it, so it means nothing to anyone else. Resolving the prefix through the
  #     module's own `imports:` map turns each into (owning module ref, kind
  #     suffix): the identity that makes every backend of one contract joinable,
  #     and a deprecation replacement a consumer can follow. `Self` and the
  #     module's own `metadata.name` are the declaring module, and `Telo` is the
  #     built-in vocabulary at `builtinsRef` — a prefix that needs no import. One
  #     expression resolves both — index 0 is the extends target, index 1 the
  #     replacement — because they share the grammar exactly, and a second copy
  #     would be a second thing to keep right.
  #   need types — a `Telo.NeedType` declares a kind a module can ask for, so it
  #     is a row like a definition; its capability is the one it declares (none),
  #     and its runtime reach is what the CLI reports for it: the kernels that
  #     host the need-type controller, never portable.
  #   runtimes / languages / portable — the matched `runtime.kinds` entry from
  #     `telo module manifest --json`, derived by the CLI because the mapping
  #     from a `controllers:` PURL to the kernels that can load it is loader
  #     knowledge. Empty when an older CLI reported no entry for this kind: the
  #     row records "no kernel claimed" rather than a guess, and the version's
  #     revision is what schedules the re-ingest that fills it in. Empty for the
  #     built-in vocabulary too (see `runtimeReport`).
  # The runtime report the rows are written from: `telo module manifest --json`'s
  # `runtime`, absent from a CLI too old to report it. Never read for the
  # built-in vocabulary, whose kinds the runtime itself implements: no fact about
  # them is recorded, whatever the CLI reports.
  - name: runtimeReport
    value: !cel >-
      inputs.docs[0].kind != 'Telo.Builtins' && inputs.payload.?runtime.orValue(null) != null
        ? {'reported': true, 'report': inputs.payload.runtime}
        : {'reported': false, 'report': {}}
  - name: kindRows
    value: !cel >-
      inputs.docs.filter(d, d.?kind.orValue('') in ['Telo.Definition', 'Telo.Abstract', 'Telo.NeedType']).map(d, {
        'name': d.metadata.name,
        'capability': d.?capability.orValue(''),
        'abstract': d.?kind.orValue('') == 'Telo.Abstract',
        'description': d.metadata.?description.orValue(''),
        'categories': d.metadata.?categories.orValue(inputs.docs[0].metadata.?categories.orValue([])),
        'exported': inputs.docs[0].kind == 'Telo.Application' ? false
          : ('exports' in inputs.docs[0] && 'kinds' in inputs.docs[0].exports
            ? inputs.docs[0].exports.kinds.exists(k, k == d.metadata.name)
            : true),
        'deprecated_reason': d.metadata.?deprecated.?reason.orValue(''),
        'extends_kind': [d.?extends.orValue(''), d.metadata.?deprecated.?replacedBy.orValue('')]
          .map(v, v == '' ? '' : v.split('.')[1])[0],
        'replaced_by_kind': [d.?extends.orValue(''), d.metadata.?deprecated.?replacedBy.orValue('')]
          .map(v, v == '' ? '' : v.split('.')[1])[1],
        'extends_ref': [d.?extends.orValue(''), d.metadata.?deprecated.?replacedBy.orValue('')]
          .map(v, v == '' ? ''
            : (v.split('.')[0] == 'Telo' ? variables.builtinsRef
              : (v.split('.')[0] in ['Self', inputs.docs[0].metadata.name] ? inputs.ref
                : ('imports' in inputs.docs[0] && v.split('.')[0] in inputs.docs[0].imports
                  ? (type(inputs.docs[0].imports[v.split('.')[0]]) == type('')
                      ? inputs.docs[0].imports[v.split('.')[0]]
                      : inputs.docs[0].imports[v.split('.')[0]].source).split('#')[0].split('@')[0]
                  : ''))))[0],
        'replaced_by_ref': [d.?extends.orValue(''), d.metadata.?deprecated.?replacedBy.orValue('')]
          .map(v, v == '' ? ''
            : (v.split('.')[0] == 'Telo' ? variables.builtinsRef
              : (v.split('.')[0] in ['Self', inputs.docs[0].metadata.name] ? inputs.ref
                : ('imports' in inputs.docs[0] && v.split('.')[0] in inputs.docs[0].imports
                  ? (type(inputs.docs[0].imports[v.split('.')[0]]) == type('')
                      ? inputs.docs[0].imports[v.split('.')[0]]
                      : inputs.docs[0].imports[v.split('.')[0]].source).split('#')[0].split('@')[0]
                  : ''))))[1],
        'runtimes': steps.runtimeReport.result.report.?kinds.orValue([])
          .filter(r, r.name == d.metadata.name).map(r, r.runtimes).size() > 0
          ? steps.runtimeReport.result.report.kinds.filter(r, r.name == d.metadata.name)[0].runtimes : [],
        'languages': steps.runtimeReport.result.report.?kinds.orValue([])
          .filter(r, r.name == d.metadata.name).size() > 0
          ? steps.runtimeReport.result.report.kinds.filter(r, r.name == d.metadata.name)[0].languages : [],
        'portable': steps.runtimeReport.result.report.?kinds.orValue([])
          .filter(r, r.name == d.metadata.name).size() > 0
          && steps.runtimeReport.result.report.kinds.filter(r, r.name == d.metadata.name)[0].portable
      })
  # A library's exported singleton INSTANCES (`exports.resources`) — the other
  # half of its public surface. An importer references one as
  # `!ref <Alias>.<name>`, so the NAME is the identity: a library can export an
  # instance of a kind it deliberately does NOT export (singleton enforcement),
  # and the console module exports only instances, no kinds at all.
  #
  # LIMIT: `docs` is telo.yaml alone. The origin read never fetches an
  # `include:` partial, so an instance declared in a partial matches nothing and
  # records an empty kind/description while `declared` says it is local — which
  # reads like a re-export but is not. Nothing in the standard library hits
  # this, and closing it means fetching partials per version, so the invariant
  # is documented rather than enforced: empty means "not declared in telo.yaml",
  # of which re-export is the usual cause.
  #
  # An instance is a document of a kind a module defines, or a `Telo.Function` —
  # which is as much a public function as an instance of a callable kind the
  # module defines. Every other built-in document (a module, an import, a kind, a
  # named `Telo.JsonSchema` shape) is not something an importer calls or holds.
  #
  # `kindRef` is the module owning the instance's kind, resolved like
  # `extends_ref`: `Self` and the module's own name are this module, an alias is
  # its import source without version or pin, and a `Telo.*` built-in resolves to
  # nothing. With `kind` it names the kind across module boundaries, which is
  # what lets a kind list the modules exporting instances of it.
  - name: resourceRows
    value: !cel >-
      ('exports' in inputs.docs[0] && 'resources' in inputs.docs[0].exports
        ? inputs.docs[0].exports.resources : []).map(e, {
          'declared': string(e),
          'name': string(e).split('.')[size(string(e).split('.')) - 1],
          'kind': inputs.docs.filter(d,
            (!d.?kind.orValue('').startsWith('Telo.') || d.?kind.orValue('') == 'Telo.Function') &&
            d.metadata.?name.orValue('') == string(e).split('.')[size(string(e).split('.')) - 1])
            .map(d, d.?kind.orValue('').contains('.')
              ? d.?kind.orValue('').split('.')[size(d.?kind.orValue('').split('.')) - 1] : '')
            .size() > 0
            ? inputs.docs.filter(d,
                (!d.?kind.orValue('').startsWith('Telo.') || d.?kind.orValue('') == 'Telo.Function') &&
                d.metadata.?name.orValue('') == string(e).split('.')[size(string(e).split('.')) - 1])
                .map(d, d.?kind.orValue('').contains('.')
                  ? d.?kind.orValue('').split('.')[size(d.?kind.orValue('').split('.')) - 1] : '')[0]
            : '',
          'kindIsOwn': inputs.docs.filter(d,
            (!d.?kind.orValue('').startsWith('Telo.') || d.?kind.orValue('') == 'Telo.Function') &&
            d.metadata.?name.orValue('') == string(e).split('.')[size(string(e).split('.')) - 1] &&
            (d.?kind.orValue('').split('.')[0] == 'Self' || d.?kind.orValue('').split('.')[0] == inputs.docs[0].metadata.name))
            .size() > 0,
          'kindRef': inputs.docs.filter(d,
            (!d.?kind.orValue('').startsWith('Telo.') || d.?kind.orValue('') == 'Telo.Function') &&
            d.metadata.?name.orValue('') == string(e).split('.')[size(string(e).split('.')) - 1])
            .map(d, d.?kind.orValue('').split('.')[0])
            .map(p, p == 'Self' || p == inputs.docs[0].metadata.name ? inputs.ref
              : ('imports' in inputs.docs[0] && p in inputs.docs[0].imports
                ? (type(inputs.docs[0].imports[p]) == type('')
                    ? inputs.docs[0].imports[p]
                    : inputs.docs[0].imports[p].source).split('#')[0].split('@')[0]
                : ''))
            .size() > 0
            ? inputs.docs.filter(d,
                (!d.?kind.orValue('').startsWith('Telo.') || d.?kind.orValue('') == 'Telo.Function') &&
                d.metadata.?name.orValue('') == string(e).split('.')[size(string(e).split('.')) - 1])
                .map(d, d.?kind.orValue('').split('.')[0])
                .map(p, p == 'Self' || p == inputs.docs[0].metadata.name ? inputs.ref
                  : ('imports' in inputs.docs[0] && p in inputs.docs[0].imports
                    ? (type(inputs.docs[0].imports[p]) == type('')
                        ? inputs.docs[0].imports[p]
                        : inputs.docs[0].imports[p].source).split('#')[0].split('@')[0]
                    : ''))[0]
            : '',
          'description': inputs.docs.filter(d,
            (!d.?kind.orValue('').startsWith('Telo.') || d.?kind.orValue('') == 'Telo.Function') &&
            d.metadata.?name.orValue('') == string(e).split('.')[size(string(e).split('.')) - 1])
            .size() > 0
            ? inputs.docs.filter(d,
                (!d.?kind.orValue('').startsWith('Telo.') || d.?kind.orValue('') == 'Telo.Function') &&
                d.metadata.?name.orValue('') == string(e).split('.')[size(string(e).split('.')) - 1])[0]
                .metadata.?description.orValue('')
            : ''
        })
  # Kinds re-exported from an import (`exports.kinds` entries of the form
  # `<Alias>.<Kind>`), with the alias resolved to the owning module's ref the
  # same way an instance's kind is. `Self.<Kind>` is the module's own kind and
  # already a `kindRows` entry.
  - name: reexportRows
    value: !cel >-
      ('exports' in inputs.docs[0] && 'kinds' in inputs.docs[0].exports
        ? inputs.docs[0].exports.kinds : [])
        .filter(k, string(k).contains('.') && string(k).split('.')[0] != 'Self')
        .map(k, {
          'declared': string(k),
          'name': string(k).split('.')[1],
          'kindRef': 'imports' in inputs.docs[0] && string(k).split('.')[0] in inputs.docs[0].imports
            ? (type(inputs.docs[0].imports[string(k).split('.')[0]]) == type('')
                ? inputs.docs[0].imports[string(k).split('.')[0]]
                : inputs.docs[0].imports[string(k).split('.')[0]].source).split('#')[0].split('@')[0]
            : ''
        })
  # What the version imports: alias, the source with its pin cut off, and the
  # version the pin names ('' for an unpinned source).
  - name: importRows
    value: !cel >-
      ('imports' in inputs.docs[0] ? inputs.docs[0].imports : {})
        .map(a, {'alias': a,
                 'source': (type(inputs.docs[0].imports[a]) == type('')
                             ? inputs.docs[0].imports[a]
                             : inputs.docs[0].imports[a].source).split('#')[0]})
        .map(i, {'alias': i.alias,
                 'ref': i.source.split('@')[0],
                 'version': size(i.source.split('@')) > 1 ? i.source.split('@')[1] : ''})
  - name: upsertVersion
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO module_versions
          (module_id, version, digest, module_name, description, repository, license, manifest_key,
           categories, category_labels, integrity,
           homepage, deprecated_reason, replaced_by, runtimes, runtimes_full, languages, portable,
           runtimes_asked, root_kind)
        VALUES ($1, $2, $3, $4, $5, $6, $7, $8,
                ARRAY(SELECT category_slug(l) FROM unnest($9::text[]) AS l), $9::text[],
                COALESCE($10, ''),
                $11, $12, $13,
                -- NULL means "no runtime data" (a CLI too old to report it, or
                -- the built-in vocabulary, which has none), as distinct from
                -- '{}' meaning "asked, no kernel runs this".
                -- CEL cannot express a list-or-null ternary, so the nullity is
                -- decided here from $18.
                CASE WHEN $18 THEN $14::text[] END,
                $15::text[], $16::text[], $17,
                TRUE, $19)
        ON CONFLICT (module_id, version) DO UPDATE SET
          digest = EXCLUDED.digest,
          module_name = EXCLUDED.module_name,
          description = EXCLUDED.description,
          repository = EXCLUDED.repository,
          license = EXCLUDED.license,
          manifest_key = EXCLUDED.manifest_key,
          categories = EXCLUDED.categories,
          category_labels = EXCLUDED.category_labels,
          integrity = EXCLUDED.integrity,
          homepage = EXCLUDED.homepage,
          deprecated_reason = EXCLUDED.deprecated_reason,
          replaced_by = EXCLUDED.replaced_by,
          runtimes = EXCLUDED.runtimes,
          runtimes_full = EXCLUDED.runtimes_full,
          languages = EXCLUDED.languages,
          portable = EXCLUDED.portable,
          runtimes_asked = TRUE,
          root_kind = EXCLUDED.root_kind,
          tracked_at = NOW()
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel "inputs.digest"
        - !cel "inputs.docs[0].metadata.name"
        - !cel "inputs.docs[0].metadata.?description.orValue('')"
        - !cel "inputs.docs[0].metadata.?repository.orValue('')"
        - !cel "inputs.docs[0].metadata.?license.orValue('')"
        - !cel "inputs.cacheKey"
        - !cel "inputs.docs[0].metadata.?categories.orValue([])"
        # `telo module manifest --json` emits null where nothing could hash the
        # ref (with the reason on its stderr); COALESCE above stores that as ''
        # — "asked, none available" — so it is never mistaken for the NULL that
        # means "never asked".
        - !cel "inputs.payload.?integrity.orValue('')"
        - !cel "inputs.docs[0].metadata.?homepage.orValue('')"
        - !cel "inputs.docs[0].metadata.?deprecated.?reason.orValue('')"
        - !cel "inputs.docs[0].metadata.?deprecated.?replacedBy.orValue('')"
        - !cel "keys(steps.runtimeReport.result.report.?runtimes.orValue({}))"
        - !cel >-
          keys(steps.runtimeReport.result.report.?runtimes.orValue({}))
            .filter(k, steps.runtimeReport.result.report.runtimes[k] == 'full')
        - !cel "steps.runtimeReport.result.report.?languages.orValue([])"
        - !cel "steps.runtimeReport.result.report.?portable.orValue(false)"
        # Whether there is a runtime report at all — a binary older than the field
        # reports none, and the built-in vocabulary has none. That is a different
        # state from a module no kernel can run ('{}'), and recording '{}' for
        # either would store a false fact.
        - !cel "steps.runtimeReport.result.reported"
        # The root kind, from the manifest: `Library`, `Application` or
        # `Builtins` (admitted at `builtinsRef` alone by the root gate).
        - !cel >-
          inputs.docs[0].kind == 'Telo.Application' ? 'Application'
            : (inputs.docs[0].kind == 'Telo.Builtins' ? 'Builtins' : 'Library')
  - name: clearKinds
    invoke: !ref exec
    inputs:
      sql: DELETE FROM resource_kinds WHERE module_id = $1 AND version = $2
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
  - name: insertKinds
    invoke: !ref exec
    inputs:
      # ONE statement for every kind, not one per kind. Set-based because the
      # rows are already a list by the time they reach here, and because a
      # per-item dispatch inside a durable body is N journal subtrees for work
      # that commits as a single transaction either way.
      sql: >-
        INSERT INTO resource_kinds
          (module_id, version, name, capability, abstract, exported, description,
           categories, category_labels, extends_kind, extends_ref,
           runtimes, languages, portable, deprecated_reason, replaced_by_kind, replaced_by_ref)
        SELECT $1, $2, r.name, r.capability, r.abstract, r.exported, r.description,
               ARRAY(SELECT category_slug(l)
                     FROM jsonb_array_elements_text(r.categories) AS l),
               ARRAY(SELECT l FROM jsonb_array_elements_text(r.categories) AS l),
               r.extends_kind, resolve_import_ref($4, r.extends_ref),
               ARRAY(SELECT x FROM jsonb_array_elements_text(r.runtimes) AS x),
               ARRAY(SELECT x FROM jsonb_array_elements_text(r.languages) AS x),
               r.portable, r.deprecated_reason, r.replaced_by_kind,
               resolve_import_ref($4, r.replaced_by_ref)
        FROM jsonb_to_recordset($3::jsonb) AS r(
          name text, capability text, abstract boolean, exported boolean,
          description text, categories jsonb, extends_kind text, extends_ref text,
          runtimes jsonb, languages jsonb, portable boolean,
          deprecated_reason text, replaced_by_kind text, replaced_by_ref text)
        ON CONFLICT (module_id, version, name) DO UPDATE SET
          capability = EXCLUDED.capability,
          abstract = EXCLUDED.abstract,
          exported = EXCLUDED.exported,
          description = EXCLUDED.description,
          categories = EXCLUDED.categories,
          category_labels = EXCLUDED.category_labels,
          extends_kind = EXCLUDED.extends_kind,
          extends_ref = EXCLUDED.extends_ref,
          runtimes = EXCLUDED.runtimes,
          languages = EXCLUDED.languages,
          portable = EXCLUDED.portable,
          deprecated_reason = EXCLUDED.deprecated_reason,
          replaced_by_kind = EXCLUDED.replaced_by_kind,
          replaced_by_ref = EXCLUDED.replaced_by_ref
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel "json(steps.kindRows.result)"
        - !cel "inputs.ref"
  # An application's declared contract, one row per input, stored as the CLI
  # reports it. The binding's parts are columns; the value schema and default
  # are stored opaque, since the hub interprets neither. A secret keeps no
  # default and a type-only schema, whatever the payload carried.
  - name: clearInputs
    invoke: !ref exec
    inputs:
      sql: DELETE FROM application_inputs WHERE module_id = $1 AND version = $2
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
  - name: insertInputs
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO application_inputs
          (module_id, version, block, name, ordinal, description, required, env,
           arg_form, arg_flag, arg_short, arg_position, protocol, default_value, schema,
           required_when)
        SELECT $1, $2, b.block, e.value->>'name', e.ord::int,
               COALESCE(e.value->>'description', ''), (e.value->>'required')::boolean,
               COALESCE(e.value->>'env', ''),
               e.value->'arg'->>'form', e.value->'arg'->>'flag', e.value->'arg'->>'short',
               (e.value->'arg'->>'position')::int,
               CASE WHEN b.block = 'ports' THEN e.value->>'protocol' END,
               CASE WHEN b.block = 'secrets' THEN NULL ELSE e.value->'default' END,
               CASE WHEN b.block = 'secrets'
                    THEN jsonb_strip_nulls(jsonb_build_object(
                           'type', e.value->'schema'->'type',
                           'x-telo-type', e.value->'schema'->'x-telo-type'))
                    ELSE e.value->'schema' END,
               e.value->'requiredWhen'
        FROM (VALUES ('variables'), ('secrets'), ('ports')) AS b(block)
        CROSS JOIN LATERAL jsonb_array_elements(COALESCE(NULLIF($3, '')::jsonb -> b.block, '[]'::jsonb))
          WITH ORDINALITY AS e(value, ord)
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel >-
          inputs.docs[0].kind == 'Telo.Application' ? json(inputs.payload.application) : ''
  # The dimensions an application's `requiredWhen` is keyed by; NULL for a library.
  - name: recordDimensions
    invoke: !ref exec
    inputs:
      sql: >-
        UPDATE module_versions
        SET application_dimensions = NULLIF($3, '')::jsonb -> 'dimensions'
        WHERE module_id = $1 AND version = $2
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel >-
          inputs.docs[0].kind == 'Telo.Application' ? json(inputs.payload.application) : ''
  - name: clearImports
    invoke: !ref exec
    inputs:
      sql: DELETE FROM module_imports WHERE module_id = $1 AND version = $2
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
  - name: insertImports
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO module_imports (module_id, version, alias, import_ref, pinned_version)
        SELECT $1, $2, r.alias, resolve_import_ref($4, r.ref), r.version
        FROM jsonb_to_recordset($3::jsonb) AS r(alias text, ref text, version text)
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel "json(steps.importRows.result)"
        - !cel "inputs.ref"
  - name: clearReexports
    invoke: !ref exec
    inputs:
      sql: DELETE FROM module_reexported_kinds WHERE module_id = $1 AND version = $2
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
  - name: insertReexports
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO module_reexported_kinds (module_id, version, declared, name, kind_ref)
        SELECT $1, $2, r.declared, r.name, resolve_import_ref($4, r."kindRef")
        FROM jsonb_to_recordset($3::jsonb) AS r(declared text, name text, "kindRef" text)
        ON CONFLICT (module_id, version, declared) DO UPDATE SET
          name = EXCLUDED.name,
          kind_ref = EXCLUDED.kind_ref
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel "json(steps.reexportRows.result)"
        - !cel "inputs.ref"
  - name: clearResources
    invoke: !ref exec
    inputs:
      sql: DELETE FROM module_resources WHERE module_id = $1 AND version = $2
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
  - name: insertResources
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO module_resources
          (module_id, version, name, declared, kind, kind_is_own, kind_ref, description)
        SELECT $1, $2, r.name, r.declared, r.kind, r."kindIsOwn",
               resolve_import_ref($4, r."kindRef"), r.description
        FROM jsonb_to_recordset($3::jsonb) AS r(
          name text, declared text, kind text, "kindIsOwn" boolean, "kindRef" text,
          description text)
        ON CONFLICT (module_id, version, name) DO UPDATE SET
          declared = EXCLUDED.declared,
          kind = EXCLUDED.kind,
          kind_is_own = EXCLUDED.kind_is_own,
          kind_ref = EXCLUDED.kind_ref,
          description = EXCLUDED.description
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel "json(steps.resourceRows.result)"
        - !cel "inputs.ref"
  # The components the version ships and whether its record is complete. The
  # advisories of each are the scheduled pass's, so a version ingested now reads
  # as not yet queried until that pass has answered for them.
  - name: clearComponents
    invoke: !ref exec
    inputs:
      sql: DELETE FROM module_components WHERE module_id = $1 AND version = $2
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
  - name: insertComponents
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO module_components (module_id, version, purl, component_version, cpe, vcs_url, vcs_revision)
        SELECT $1, $2, r.purl, r.version, r.cpe, r."vcsUrl", r."vcsRevision"
        FROM jsonb_to_recordset($3::jsonb) AS r(purl text, version text, cpe text, "vcsUrl" text, "vcsRevision" text)
        ON CONFLICT DO NOTHING
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel "json(inputs.sbom.components)"
  - name: recordSbom
    invoke: !ref exec
    inputs:
      sql: UPDATE module_versions SET sbom_complete = $3 WHERE module_id = $1 AND version = $2
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel "inputs.sbom.complete"
  # The modules nested in the artifact: each one's record and its own imports,
  # which the version's closure follows.
  - name: clearNested
    invoke: !ref exec
    inputs:
      sql: DELETE FROM module_nested WHERE module_id = $1 AND version = $2
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
  - name: insertNested
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO module_nested (module_id, version, path, sbom_complete)
        SELECT $1, $2, r.path, r.complete
        FROM jsonb_to_recordset($3::jsonb) AS r(path text, complete boolean)
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel "json(inputs.nested)"
  - name: insertNestedComponents
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO module_components (module_id, version, nested_path, purl, component_version, cpe, vcs_url, vcs_revision)
        SELECT $1, $2, r.path, c.purl, c.version, c.cpe, c."vcsUrl", c."vcsRevision"
        FROM jsonb_to_recordset($3::jsonb) AS r(path text, components jsonb)
        CROSS JOIN LATERAL jsonb_to_recordset(r.components) AS c(purl text, version text, cpe text, "vcsUrl" text, "vcsRevision" text)
        ON CONFLICT DO NOTHING
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel "json(inputs.nested)"
  - name: insertNestedImports
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO module_nested_imports (module_id, version, path, alias, import_ref, pinned_version)
        SELECT $1, $2, r.path, i.alias, i.ref, i.version
        FROM jsonb_to_recordset($3::jsonb) AS r(path text, imports jsonb)
        CROSS JOIN LATERAL jsonb_to_recordset(r.imports) AS i(alias text, source text, ref text, version text)
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
        - !cel "json(inputs.nested)"
  # The imports above are written, so this version's closure can be read: its
  # own advisories, and those of every version whose closure now contains it.
  - name: refreshAdvisories
    invoke: !ref exec
    inputs:
      sql: SELECT refresh_version_advisories($1::bigint, $2)
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
  # `latest_version` moves WITH the rows it points at. Every search join is
  # `m.latest_version = rk.version`, so advancing it before this version's rows
  # exist would empty the module out of search for as long as the ingest takes —
  # which, now that ingest is asynchronous, is unbounded.
  - name: markLatest
    if: !cel "inputs.version == inputs.latestVersion"
    then:
      - name: set
        invoke: !ref exec
        inputs:
          sql: >-
            UPDATE modules
            SET latest_version = $2, last_tracked_at = NOW(), last_error = NULL
            WHERE id = $1
          bindings:
            - !cel "inputs.moduleId"
            - !cel "inputs.version"
  # Closes the claim, inside the same transaction as the rows it certifies. A
  # version is therefore never recorded as ingested by a transaction that then
  # rolled back.
  - name: complete
    invoke: !ref Schema.completeVersion
    inputs:
      moduleId: !cel "inputs.moduleId"
      version: !cel "inputs.version"
      digest: !cel "inputs.digest"
      rev: !cel "variables.ingestRev"
---
# The vector half, outside the transaction: a different backend, so it cannot
# join one, and a replay after the commit re-runs exactly these steps.
kind: Telo.Sequence
metadata: { name: embedVersion }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties: { moduleId: { type: string }, version: { type: string }, docs: { type: array } }
steps:
  # Read back the just-inserted entries — every exported kind, instance and
  # application, as search ranks them — for their ids: the vector id is the
  # `search_entries` id, the join key the RRF search fuses on. Each vector carries
  # its entry type, which search filters the nearest-neighbour lookup by, so an
  # entry type a caller did not ask for never takes a neighbour's place.
  - name: kindRows
    invoke: !ref query
    inputs:
      sql: >-
        SELECT id, entry, name, kind, capability, description
        FROM search_entries WHERE module_id = $1 AND version = $2 ORDER BY id
      bindings:
        - !cel "inputs.moduleId"
        - !cel "inputs.version"
  # Drop every existing vector for this module first: a re-ingest reassigns
  # entry ids, so superseding by (module, version) is insufficient —
  # purge all, then re-upsert the latest.
  - name: purge
    invoke: !ref vectorRemove
    inputs:
      metadataFilter:
        module_id: !cel "inputs.moduleId"
  - name: embed
    if: !cel "steps.kindRows.result.rows.size() > 0"
    then:
      # Composed passage: the entry's name + capability (an instance also names
      # the kind it is one of) + curated description, framed by the owning
      # module's name + description. The curated line is the primary signal.
      # An application IS its module, so its passage is its name and
      # description alone.
      - name: passages
        invoke: !ref embedPassage
        inputs:
          input: !cel >-
            steps.kindRows.result.rows.map(r, r.entry == 'application'
              ? r.name + '. ' + r.description
              : r.name + (r.entry == 'instance' ? ', a ready-made ' + r.kind : '')
                + (r.capability != '' ? ' (' + r.capability + ')' : '') + '. ' + r.description +
                ' — from module ' + inputs.docs[0].metadata.name + ': ' +
                inputs.docs[0].metadata.?description.orValue(''))
      - name: upsert
        invoke: !ref vectorUpsert
        inputs:
          items: !cel >-
            enumerate(steps.kindRows.result.rows).map(e, {
              'id': string(e.value.id),
              'vector': steps.passages.result.embeddings[e.index],
              'metadata': {'module_id': inputs.moduleId, 'version': inputs.version,
                           'name': e.value.name, 'entry': e.value.entry}
            })
---
# One reconcile pass: every registered module's versions are enumerated, each
# version's digest resolved, and the ones that are due are claimed and scheduled.
#
# None of this is inside a run. It is cheap, idempotent and re-runnable, and a
# tick that dies part-way costs the next tick nothing.
kind: Telo.Sequence
metadata: { name: scheduleDueVersions }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties: { modules: { type: integer } }
    required: [modules]
steps:
  - name: modules
    invoke: !ref query
    inputs: { sql: "SELECT id, ref FROM modules ORDER BY id" }
  - name: each
    invoke: !ref scheduleEachModule
    inputs:
      modules: !cel "steps.modules.result.rows"
outputs:
  modules: !cel "steps.modules.result.rows.size()"
---
kind: Run.Iteration
metadata: { name: scheduleEachModule }
inputType:
  kind: Telo.JsonSchema
  schema: { type: object, properties: { modules: { type: array } } }
collection: !cel "inputs.modules"
concurrency: 2
steps:
  # A module whose origin cannot be read must not abort the pass — the failure
  # is recorded on its row (surfaced via /refs and the module tables), never
  # swallowed.
  - name: guard
    try:
      - name: schedule
        invoke: !ref scheduleModule
        inputs:
          moduleId: !cel "item.id"
          ref: !cel "item.ref"
    catch:
      - name: recordFailure
        invoke: !ref exec
        inputs:
          sql: UPDATE modules SET last_error = $2, last_tracked_at = NOW() WHERE id = $1
          bindings:
            - !cel "item.id"
            - !cel "error.code + ': ' + error.message"
---
kind: Telo.Sequence
metadata: { name: scheduleModule }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties: { moduleId: { type: string }, ref: { type: string } }
steps:
  - name: versions
    invoke: !ref Origin.moduleVersions
    inputs:
      ref: !cel "inputs.ref"
  - name: gate
    if: !cel "!steps.versions.result.ok"
    then:
      - name: fail
        throw:
          code: TRACK_VERSIONS_FAILED
          message: !cel >-
            'telo module versions ' + inputs.ref + ' failed: ' + steps.versions.result.error
  # The enumeration succeeded, so whatever failure the row carried is stale.
  # `latest_version` is NOT touched here: it moves with the rows it points at,
  # inside the ingest transaction.
  - name: touch
    invoke: !ref exec
    inputs:
      sql: UPDATE modules SET last_tracked_at = NOW(), last_error = NULL WHERE id = $1
      bindings:
        - !cel "inputs.moduleId"
  # A prerelease the hub indexed before it stopped tracking them is dropped,
  # with its kinds, resources and ingest record. `latest_version` first moves to
  # the newest final when that is already indexed; a prerelease still named
  # latest stays until a final replaces it, so search never empties meanwhile.
  - name: latestFinal
    if: !cel "steps.versions.result.latest != ''"
    then:
      - name: set
        invoke: !ref exec
        inputs:
          sql: >-
            UPDATE modules SET latest_version = $2
            WHERE id = $1 AND latest_version LIKE '%-%'
              AND EXISTS (SELECT 1 FROM module_versions
                          WHERE module_id = $1 AND version = $2)
          bindings:
            - !cel "inputs.moduleId"
            - !cel "steps.versions.result.latest"
  - name: dropPrereleases
    invoke: !ref exec
    inputs:
      sql: >-
        DELETE FROM module_versions mv
        USING modules m
        WHERE m.id = mv.module_id AND mv.module_id = $1 AND mv.version LIKE '%-%'
          AND mv.version IS DISTINCT FROM m.latest_version
      bindings:
        - !cel "inputs.moduleId"
  # A dropped version leaves every closure that pinned it with an import the hub
  # no longer tracks.
  - name: refreshAfterDrop
    if: !cel "steps.dropPrereleases.result.rowCount > 0"
    then:
      - name: refresh
        invoke: !ref exec
        inputs: { sql: SELECT refresh_version_advisories() }
  - name: dropPrereleaseClaims
    invoke: !ref exec
    inputs:
      sql: >-
        DELETE FROM version_ingest vi
        USING modules m
        WHERE m.id = vi.module_id AND vi.module_id = $1 AND vi.version LIKE '%-%'
          AND vi.version IS DISTINCT FROM m.latest_version
      bindings:
        - !cel "inputs.moduleId"
  - name: each
    invoke: !ref scheduleEachVersion
    inputs:
      moduleId: !cel "inputs.moduleId"
      ref: !cel "inputs.ref"
      versions: !cel "steps.versions.result.versions"
      latestVersion: !cel "steps.versions.result.latest"
---
kind: Run.Iteration
metadata: { name: scheduleEachVersion }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      moduleId: { type: string }
      ref: { type: string }
      versions:
        type: array
        items:
          type: object
          properties: { version: { type: string }, digest: { type: string }, error: { type: string } }
          required: [version, digest, error]
      latestVersion: { type: string }
collection: !cel "inputs.versions"
steps:
  - name: one
    invoke: !ref claimAndSchedule
    inputs:
      moduleId: !cel "inputs.moduleId"
      ref: !cel "inputs.ref"
      version: !cel "item.version"
      digest: !cel "item.digest"
      digestError: !cel "item.error"
      latestVersion: !cel "inputs.latestVersion"
---
# Ask the table whether the version is due at the digest the enumeration read,
# and schedule the attempt the table minted. A steady state is digest-compare
# only: nothing durable is created for a version that has not moved. A version
# whose digest could not be read fails here, after every newer version has been
# claimed, so one unreadable tag never blocks the versions published after it.
kind: Telo.Sequence
metadata: { name: claimAndSchedule }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      moduleId: { type: string }
      ref: { type: string }
      version: { type: string }
      digest: { type: string }
      digestError: { type: string }
      latestVersion: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties: { claimed: { type: boolean }, runId: { type: string } }
    required: [claimed, runId]
steps:
  - name: gate
    if: !cel "inputs.digestError != ''"
    then:
      - name: fail
        throw:
          code: TRACK_DIGEST_FAILED
          message: !cel >-
            'no digest for ' + inputs.ref + ' ' + inputs.version + ': ' + inputs.digestError
  - name: claim
    invoke: !ref Schema.claimVersion
    inputs:
      moduleId: !cel "inputs.moduleId"
      version: !cel "inputs.version"
      digest: !cel "inputs.digest"
      rev: !cel "variables.ingestRev"
  - name: due
    if: !cel "steps.claim.result.claimed"
    then:
      - name: schedule
        invoke: !ref scheduleIngest
        inputs:
          moduleId: !cel "inputs.moduleId"
          ref: !cel "inputs.ref"
          version: !cel "inputs.version"
          digest: !cel "inputs.digest"
          latestVersion: !cel "inputs.latestVersion"
          attempt: !cel "steps.claim.result.attempt"
outputs:
  claimed: !cel "steps.claim.result.claimed"
  runId: !cel "'schedule' in steps ? steps.schedule.result.runId : ''"
