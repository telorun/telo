kind: Telo.Application
metadata:
  name: PasswordThrottleTest
  version: 1.0.0
  description: |
    `Protection.PasswordThrottle` over `Identity.DeclaredUsers` and a
    `RateLimit.Budget` of 2 failures: after two wrong passwords the identifier
    answers `throttled` even for its right password, while another identifier still
    passes; successes settle to nothing and so never spend budget.
imports:
  Protection: ../
  Identity: ../../identity
  Crypto: ../../crypto
  RateLimit: ../../rate-limit
  CacheMemory: ../../cache-memory
  Assert: ../../assert
secrets:
  aliceHash: { env: PROTECTION_TEST_ALICE_HASH, type: string, default: "$2a$04$bWQ5OzYiRTH.LdL6b33ZJuPX1wW1ae1I6UZ2AOsrVwTEZZpEt2lUy" }
  bobHash: { env: PROTECTION_TEST_BOB_HASH, type: string, default: "$2a$04$AM8wyNRLqw7bqDv1kYgQ0.IBj5RIn6yF63NNWUp/hnItF9TKj6Ra2" }
  carolHash: { env: PROTECTION_TEST_CAROL_HASH, type: string, default: "$2a$04$9ITuVVbcPhHpCxBHXmDFPOJ3hMsZLdEscPYDrUzMY2cQRhajt0kMW" }
targets:
  - !ref test
---
kind: CacheMemory.Store
metadata: { name: memory }
---
kind: RateLimit.Budget
metadata: { name: failures }
store: !ref memory
limit: 2
window: 60s
---
kind: Crypto.PasswordHash
metadata: { name: hasher }
algorithm: bcrypt
parameters: { bcrypt: { cost: 4 } }
---
kind: Identity.DeclaredUsers
metadata: { name: users }
hasher: !ref hasher
users:
  alice: { passwordHash: !cel "secrets.aliceHash" }
  bob: { passwordHash: !cel "secrets.bobHash" }
  carol: { passwordHash: !cel "secrets.carolHash" }
---
kind: Protection.PasswordThrottle
metadata: { name: throttle }
passwords: !ref users
budget: !ref failures
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: aliceWrong1
    invoke: !ref throttle
    inputs: { identifier: alice, password: nope }
  - name: aliceWrong2
    invoke: !ref throttle
    inputs: { identifier: alice, password: nope }
  - name: aliceRightWhileThrottled
    invoke: !ref throttle
    inputs: { identifier: alice, password: alice-pass }
  - name: aliceWrongWhileThrottled
    invoke: !ref throttle
    inputs: { identifier: alice, password: nope }
  - name: bobRight
    invoke: !ref throttle
    inputs: { identifier: bob, password: bob-pass }
  # Carol signs in more often than the budget allows failures: successes cost nothing.
  - name: carol1
    invoke: !ref throttle
    inputs: { identifier: carol, password: carol-pass }
  - name: carol2
    invoke: !ref throttle
    inputs: { identifier: carol, password: carol-pass }
  - name: carol3
    invoke: !ref throttle
    inputs: { identifier: carol, password: carol-pass }
  - name: carolWrong
    invoke: !ref throttle
    inputs: { identifier: carol, password: nope }
  - name: carolRightAfterOneFailure
    invoke: !ref throttle
    inputs: { identifier: carol, password: carol-pass }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        aliceWrong1: !cel "steps.aliceWrong1.result"
        aliceWrong2: !cel "steps.aliceWrong2.result"
        aliceRightWhileThrottled: !cel "steps.aliceRightWhileThrottled.result"
        aliceWrongWhileThrottled: !cel "steps.aliceWrongWhileThrottled.result"
        bobSubject: !cel "steps.bobRight.result.principal.subject"
        carolSubjects:
          - !cel "steps.carol1.result.principal.subject"
          - !cel "steps.carol2.result.principal.subject"
          - !cel "steps.carol3.result.principal.subject"
        carolWrong: !cel "steps.carolWrong.result"
        carolAfterFailure: !cel "steps.carolRightAfterOneFailure.result.principal.subject"
      expected:
        aliceWrong1: { refused: true, reason: mismatch }
        aliceWrong2: { refused: true, reason: mismatch }
        aliceRightWhileThrottled: { refused: true, reason: throttled }
        aliceWrongWhileThrottled: { refused: true, reason: throttled }
        bobSubject: bob
        carolSubjects: [carol, carol, carol]
        carolWrong: { refused: true, reason: mismatch }
        carolAfterFailure: carol
