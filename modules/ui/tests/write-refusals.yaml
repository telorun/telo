    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Form/createUndeclared: names a collection that declares no `schemas.update` where `record.key` is written, or no `schemas.create` where it is not"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Form/updateUndeclared: names a collection that declares no `schemas.update` where `record.key` is written, or no `schemas.create` where it is not"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Form/shapeUnknown: has a `model` property the collection's `schemas.create` does not declare, or declares with another type"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Form/shapeType: has a `model` property the collection's `schemas.create` does not declare, or declares with another type"
    - code: REFERRER_RULE_VIOLATED
      message: "Ui.Form/shapeUpdateUnknown at 'record.presentation': required by Ui.CollectionPresentation \u2014 has a `model` property the collection's `schemas.update` does not declare, or declares with another type"
    - code: REFERRER_RULE_VIOLATED
      message: "Ui.Form/shapeUpdateType at 'record.presentation': required by Ui.CollectionPresentation \u2014 has a `model` property the collection's `schemas.update` does not declare, or declares with another type"
  runFails: "Ui.Form 'shapeType': 'model' declares 'count' as integer, which the collection's 'schemas.create' declares as string"
