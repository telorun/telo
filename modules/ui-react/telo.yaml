kind: Telo.Library
metadata:
  name: UiReact
  version: 0.6.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [UI]
  description: >-
    Serves a declarative user interface as a web application: pages with
    navigation, data grids with sorting, paging and inline create, edit and
    delete, validated forms, filter bars, swappable themes that restyle every
    screen and replace its interactive controls, brand tokens, custom fonts and
    custom React components. Mounted on an HTTP server, it turns page
    descriptions into a working admin panel or internal tool with no frontend
    build step.
requires:
  # 0.120.1 refuses this file: it does not know `x-telo-context-eval`, which
  # keeps a page's `request` out of what the browser names and its `query` out
  # of what the server evaluates, nor the `Text` fragment and
  # `x-telo-text-values` an application's titles are typed with. Verified by
  # execution (`check` of this file) against 0.120.1. The `abi` and `external`
  # a control set's `implements` is checked against ship in the same release,
  # and so does the repeated group of a rule's `in:` pointer
  # (`/navigation/items(/*/items)*`), which 0.120.1 reads as a field this kind
  # does not declare (RESOURCE_RULE_INVALID).
  telo: ">=0.121.0"
imports:
  Ui: ../ui
  I18n: ../i18n
  SseCodec: ../sse-codec
exports:
  kinds:
    - App
    - Theme
    - Controls
  resources:
    - defaultTheme
  # The renderer's controls contract as data — the parts, the reserved
  # properties, the controls of `ui_react_controls-2` with their vectors, the
  # scenes drawing every part — and the DOM-only interpreter that runs them:
  # what a module checking a theme against the renderer imports.
  code:
    - specifier: "@telorun/ui-react-contract"
      format: js
      path: ./nodejs/ui-react-contract.mjs
      source: ./nodejs/src/contract/index.ts
  # Six entries, two builds. The four React entries declare no `external`, so
  # they are one build and the page holds one React. The renderer and the host
  # module declare the same `external` list, so they are one build too and
  # share the context `useHost` reads.
  browser:
    - specifier: react
      path: ./browser/react.js
      source: ./nodejs/src/browser/vendor/react.ts
      abi: ui_react-1
      exports:
        [
        Activity, Children, Component, Fragment, Profiler, PureComponent,
        StrictMode, Suspense,
        __CLIENT_INTERNALS_DO_NOT_USE_OR_WARN_USERS_THEY_CANNOT_UPGRADE,
        __COMPILER_RUNTIME, cache, cacheSignal, cloneElement, createContext,
        createElement, createRef, forwardRef, isValidElement, lazy, memo,
        startTransition, unstable_useCacheRefresh, use, useActionState, useCallback,
        useContext, useDebugValue, useDeferredValue, useEffect, useEffectEvent,
        useId, useImperativeHandle, useInsertionEffect, useLayoutEffect, useMemo,
        useOptimistic, useReducer, useRef, useState, useSyncExternalStore,
        useTransition, version,
        ]
    - specifier: react/jsx-runtime
      path: ./browser/react-jsx-runtime.js
      source: ./nodejs/src/browser/vendor/react-jsx-runtime.ts
      abi: ui_react-1
      exports: [Fragment, jsx, jsxs]
    - specifier: react-dom
      path: ./browser/react-dom.js
      source: ./nodejs/src/browser/vendor/react-dom.ts
      abi: ui_react-1
      exports:
        [
        __DOM_INTERNALS_DO_NOT_USE_OR_WARN_USERS_THEY_CANNOT_UPGRADE, createPortal,
        flushSync, preconnect, prefetchDNS, preinit, preinitModule, preload,
        preloadModule, requestFormReset, unstable_batchedUpdates, useFormState,
        useFormStatus, version,
        ]
    - specifier: react-dom/client
      path: ./browser/react-dom-client.js
      source: ./nodejs/src/browser/vendor/react-dom-client.ts
      abi: ui_react-1
      exports: [createRoot, hydrateRoot, version]
    - specifier: "@telorun/ui-react"
      path: ./browser/host.js
      source: ./nodejs/src/browser/host-entry.ts
      abi: ui_react-1
      external: [react, react/jsx-runtime, react-dom, react-dom/client]
      exports: [useHost]
    - specifier: "@telorun/ui-react-renderer"
      path: ./browser/renderer.js
      source: ./nodejs/src/browser/renderer.tsx
      abi: ui_react-1
      external: [react, react/jsx-runtime, react-dom, react-dom/client]
      # The message core it formats every text with, beside `mount`: what the
      # core's conformance vectors are run against in the entry as built.
      exports:
        [
        mount, formatMessage, formatNumber, invalidPluralCategories, lookupLanguage,
        messageIdentity, messageVariables, parsePattern, pluralCategories,
        pluralCategory, pluralCategoryOfDecimal, readMessage, readText,
        serializePattern, textIdentity, truncationChain, unknownVariables,
        ]
---
kind: Telo.Definition
metadata:
  name: App
  description: >-
    A web application assembled from pages, each at its own path, reached
    through a navigation menu with groups, dropdowns and submenus that turns
    into a menu button and drawer on a phone. Serves the page shell, the page
    descriptions, scripts, stylesheets and fonts under one mount, and can vary
    what a page shows per request — by a header such as a role or a tenant.
capability: Telo.Mount
controllers:
  - pkg:telo/local/js?path=./nodejs/ui-react.mjs&local_path=./nodejs/src/index.ts#AppController
schema:
  type: object
  additionalProperties: false
  required: [title, words, theme, pages]
  properties:
    title:
      title: Title
      description: The application's name, shown in its header and as the document title.
      $ref: "telo://manifest#/$defs/Text"
      x-telo-text-values: {}
      x-telo-eval: compile
    lang:
      title: Language
      description: >-
        The language a request asks for, read per request — a negotiator's
        answer over its Accept-Language header — or one fixed tag. The documents
        are in the catalog language it lands on through the translator, else in
        the language the application module's `lang:` declares, else in none.
      type: string
      format: language-tag
      x-telo-context:
        type: object
        properties:
          request:
            type: object
            properties:
              headers:
                type: object
                additionalProperties: { type: string }
              ip: { type: string }
    translator:
      title: Translator
      description: >-
        The catalogs every text of the application is looked up in: its titles,
        its pages' texts, the labels of its data shapes and the renderer's own
        words. A text no catalog translates is shown as written.
      x-telo-ref: { kind: I18n.Translator, use: dependency }
    words:
      title: Words
      description: >-
        The words the renderer shows of its own — loading, empty states,
        buttons, validation messages — `Ui.words` in English, or a set of one's
        own.
      x-telo-ref: { kind: Ui.Words, use: dependency }
    theme:
      title: Theme
      description: >-
        How every screen looks and which controls it is drawn with:
        `UiReact.defaultTheme`, a theme another module publishes, or one of the
        application's own.
      x-telo-ref: { kind: Self.Theme, use: dependency }
    tokens:
      title: Tokens
      description: >-
        The application's brand over its theme: one design token set, or an
        ordered list of sets each with a condition — the first entry whose
        `when` holds for the request is used, and with none the theme's own
        values apply.
      anyOf:
        - x-telo-ref: { kind: Ui.DesignTokens, use: dependency }
        - type: array
          items:
            type: object
            additionalProperties: false
            required: [tokens]
            properties:
              tokens:
                x-telo-ref: { kind: Ui.DesignTokens, use: dependency }
              when:
                type: boolean
                default: true
                x-telo-context:
                  type: object
                  properties:
                    request:
                      type: object
                      properties:
                        headers:
                          type: object
                          additionalProperties: { type: string }
                        ip: { type: string }
    stylesheets:
      title: Stylesheets
      description: Stylesheets of the application's own, applied after everything else.
      type: array
      items:
        x-telo-type: Telo.HostPath
    compactBelow:
      title: Compact below
      description: >-
        The viewport width below which every surface's `compact` replacement
        applies: a CSS length in `px`, `rem` or `em`.
      type: string
      pattern: "^(0|[0-9]+(\\.[0-9]+)?|\\.[0-9]+)(px|rem|em)$"
      default: 40rem
    header:
      title: Header
      description: >-
        Nodes of the application's own in its header, drawn on every page:
        `start` before the title, `end` after the navigation. Each node's
        `when:` and text values may read the request, evaluated per request;
        no browser root is in scope.
      type: object
      additionalProperties: false
      properties:
        start:
          title: Start
          description: Nodes before the application's title, such as a logo.
          type: array
          items: { $ref: "telo://Ui/Node" }
          x-telo-context:
            type: object
            properties:
              request:
                x-telo-context-eval: runtime
                type: object
                properties:
                  headers:
                    type: object
                    additionalProperties: { type: string }
                  ip: { type: string }
        end:
          title: End
          description: Nodes after the navigation, such as language or theme switches.
          type: array
          items: { $ref: "telo://Ui/Node" }
          x-telo-context:
            type: object
            properties:
              request:
                x-telo-context-eval: runtime
                type: object
                properties:
                  headers:
                    type: object
                    additionalProperties: { type: string }
                  ip: { type: string }
    pages:
      title: Pages
      description: >-
        The pages the application routes to, each served at its own path:
        written in place, or named by reference — a library's included. No two
        may share a path.
      type: array
      minItems: 1
      items:
        x-telo-ref: { kind: Ui.Page, use: call }
    navigation:
      title: Navigation
      description: >-
        The navigation tree and how it is drawn. Omitted, one entry per page in
        the order `pages` lists them, in the header and behind a menu button on
        a narrow viewport. Every page an entry names is one `pages` lists.
      $ref: "telo://Ui/Navigation"
  x-telo-resource-rules:
    - resolve: [/pages]
      in: /pages
      condition: !cel "self.pages.exists_one(p, p.path == this.path)"
      code: UI_PAGE_PATH_DUPLICATE
      message: >-
        declares a path another page already has. Give each page a path of its
        own.
    # Every depth of the tree: a group's entries, and theirs.
    - in: /navigation/items(/*/items)*
      condition: !cel >-
        this.type != 'page' || self.pages.exists(p, p.name == this.page.name &&
        p.?alias.orValue('') == this.page.?alias.orValue(''))
      code: UI_NAVIGATION_PAGE_UNROUTED
      message: >-
        names a page the application does not list in its pages, so it leads
        nowhere. Add the page to pages, or remove the entry.
---
# A theme is the look of every part the renderer draws and, optionally, the
# controls it draws with; brand values stay a separate `Ui.DesignTokens` set,
# so switching the theme keeps the brand. The application places the theme's
# tokens, then its stylesheets in order, in the `telo.theme` layer, and each
# control set's own stylesheet in `telo.control`.
kind: Telo.Definition
metadata:
  name: Theme
  description: >-
    A complete look for a web interface: stylesheets styling every element the
    renderer draws, default values for the brand tokens, and optionally its own
    implementation of interactive controls such as selects, menus, dialogs and
    date pickers. Picked by an application with one reference, so swapping it
    restyles every screen while the brand stays.
capability: Telo.Provider
controllers:
  - pkg:telo/local/js?path=./nodejs/ui-react.mjs&local_path=./nodejs/src/index.ts#ThemeController
schema:
  type: object
  additionalProperties: false
  properties:
    tokens:
      title: Tokens
      description: >-
        The theme's own token values and typefaces, under any the application
        sets.
      x-telo-ref: { kind: Ui.DesignTokens, use: dependency }
    stylesheets:
      title: Stylesheets
      description: >-
        The theme's look, in order, written against the styling contract.
      type: array
      items:
        x-telo-type: Telo.HostPath
    controls:
      title: Controls
      description: >-
        Sets of controls drawn in place of the built-in ones. No two entries
        may implement the same control, the same set listed through two
        aliases included; a control no entry implements is the built-in.
      type: array
      uniqueItems: true
      items:
        x-telo-ref: { kind: Self.Controls, use: dependency }
  # Entries are counted, never compared: the same declaration reached twice is
  # two entries, as it is for the theme's controller.
  x-telo-resource-rules:
    - resolve: [/controls]
      in: /controls
      condition: !cel >-
        this.implements.all(n, size(self.controls.filter(c, n in
        c.implements)) == 1)
      code: UI_THEME_CONTROL_DUPLICATE
      message: >-
        implements a control another entry of controls implements too. Give
        each control one implementation.
---
# What a module ships to draw some of the renderer's controls, declared beside
# the code: its browser entry, written against `ui_react_controls-2`, and the
# controls it exports, each under its own name.
kind: Telo.Definition
metadata:
  name: Controls
  description: >-
    A set of interactive controls for a web interface — text boxes, selects,
    multi-selects, checkboxes, dialogs, drawers, menus, navigation menus,
    tabs, tooltips, date pickers and icons — shipped as browser code by a
    module and drawn in place of the built-in ones by any theme listing it.
    Checked against the controls contract before the application starts.
capability: Telo.Provider
controllers:
  - pkg:telo/local/js?path=./nodejs/ui-react.mjs&local_path=./nodejs/src/index.ts#ControlsController
schema:
  type: object
  additionalProperties: false
  required: [entry, implements]
  properties:
    entry:
      title: Entry
      description: >-
        The specifier of one of the declaring module's browser entries,
        written against `ui_react_controls-2`.
      type: string
    implements:
      title: Implements
      description: The controls the entry exports, each under its own name.
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum:
          [
          TextInput, NumberInput, TextArea, DateInput, DateTimeInput, TimeInput, TagsInput,
          DateRangeInput, Checkbox, Switch, Slider, OptionGroup, Select, MultiSelect, Listbox,
          Dialog, Drawer, Popover, Confirmation, Menu, Tooltip, Navigation, Tabs, Icon,
          ]
        x-telo-browser-export:
          entry: /entry
          abi: [ui_react_controls-2]
          external: [react, react/jsx-runtime, react-dom]
  # The nine controls drawing a layer at the end of `<body>` are replaced as
  # one unit, so every layer on a page comes from one implementation: a layer
  # stack cannot be made to cooperate with another library's.
  x-telo-resource-rules:
    - condition: !cel >-
        !self.implements.exists(n, n in ['Select', 'MultiSelect', 'Dialog',
        'Drawer', 'Popover', 'Confirmation', 'Menu', 'Tooltip', 'Navigation']) ||
        ['Select', 'MultiSelect', 'Dialog', 'Drawer', 'Popover', 'Confirmation',
        'Menu', 'Tooltip', 'Navigation'].all(n, n in self.implements)
      code: UI_CONTROLS_LAYERS_PARTIAL
      message: >-
        implements some of the layer controls but not all of them. A set
        implementing any of Select, MultiSelect, Dialog, Drawer, Popover,
        Confirmation, Menu, Tooltip and Navigation implements all nine.
---
# The built-in look: one stylesheet styling every part, with every token's
# default and its dark-scheme value. It replaces no control.
kind: Self.Theme
metadata:
  name: defaultTheme
stylesheets:
  - !module-path ./themes/default/default-theme.css
