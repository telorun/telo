          ]

  # Components: one of the example's own on the page, given fixed properties,
  # and one in a table cell, given the row's; both come from one module, served
  # with the stylesheet its sources import.
  - name: verifyComponents
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        kinds: !cel "steps.nodes.result.components.map(c, c.type)"
        desk: !cel >-
          cel.bind(c, steps.nodes.result.components[2],
            [c.export, c.abi, c.external, c.module.name, c.props, c.stylesheets.map(s, s.name)])
        table: !cel "cel.bind(t, steps.nodes.result.components[5], [t.basePath, t.filters, t.pageSize, 'edit' in t, t.delete])"
        cell: !cel >-
          cel.bind(c, steps.nodes.result.components[5].layout.columns[2], [c.header.message[0], c.cell.export, c.cell.props,
            c.cell.module == steps.nodes.result.components[2].module])
        module: !cel >-
          [steps.componentModule.result.status, steps.componentModule.result.headers['content-type'],
            ['TaskDesk', 'PriorityMeter', 'TokenSheet', 'TypefaceSamples'].all(n, steps.componentModule.result.body.contains('export {') && steps.componentModule.result.body.contains(n))]
        stylesheet: !cel "[steps.componentStylesheet.result.status, steps.componentStylesheet.result.headers['content-type'], steps.componentStylesheet.result.body.contains('.showcase-desk')]"
        polish: !cel "steps.polishComponents.result.body.children[0].children.filter(c, c.type == 'text' && c.style == 'heading').map(c, c.text.message[0])"
      expected:
        kinds: [ text, text, component, text, text, listing, text, text ]
        desk:
          - TaskDesk
          - ui_react-1
          - [ "@telorun/ui-react", react, react-dom, react/jsx-runtime ]
          - components.js
          - { basePath: { value: /api/tasks }, countsPath: { value: /api/task-counts }, project: { value: TEL-42 } }
          - [ components.css ]
        table: [ /api/tasks, { projectCode: { value: TEL-42 } }, 6, true, true ]
        cell:
          - Priority
          - PriorityMeter
          - { priority: { root: row, path: [ priority ] }, blocked: { root: row, path: [ blocked ] } }
          - true
        module: [ 200, text/javascript, true ]
        stylesheet: [ 200, text/css, true ]
        polish: [ Komponent na stronie, Komponent w komórce, Jego arkusz stylów ]

  # The generated admin screen: a bar over the tasks collection with the policy
  # written, keeping its state under the key the Filters page's aside bar keeps
  # its own, a listing with both forms on their surfaces and a confirmed delete.
  - name: verifyCrud
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        kinds: !cel "steps.nodes.result.crud.map(c, c.type)"
        bar: !cel >-
          cel.bind(f, steps.nodes.result.crud[4], [f.show, f.controls, f.apply, f.summary, f.placement, f.state.key, f.state.address,
            f.state.store, size(f.fields)])
        sharedState: !cel "[steps.nodes.result.crud[4].state.key, steps.nodes.result.crud[4].state.store] == [steps.nodes.result.filters[8].state.key, steps.nodes.result.filters[8].state.store]"
        table: !cel >-
          cel.bind(t, steps.nodes.result.crud[4].content, [t.basePath, t.key, t.delete, t.layout.columns.map(c, c.value.path[0]),
            t.create.form.fields.map(f, f.property) == t.edit.form.fields.map(f, f.property)])
        create: !cel "cel.bind(o, steps.nodes.result.crud[4].content.create, [o.surface.type, o.surface.side, o.afterSubmit, o.unsaved])"
        edit: !cel "cel.bind(o, steps.nodes.result.crud[4].content.edit, [o.surface.type, o.surface.address, o.afterSubmit, o.unsaved])"
        polish: !cel "steps.polishCrud.result.body.children[0].children[0].text"
      expected:
        kinds: [ text, text, text, text, filters ]
        bar: [ chosen, chips, commit, chips, { type: aside, side: end, compact: { type: collapsible, open: false } }, aside, false, { type: local }, 15 ]
        sharedState: true
        table:
          - /api/tasks
          - id
          - true
          - [ title, projectCode, assigneeEmail, status, priority, estimate, dueOn, label, blocked ]
          - true
        create: [ drawer, end, again, confirm ]
        edit: [ panel, { name: crudTask }, close, confirm ]
        polish: { lang: pl, message: [ Wygenerowany ekran administracyjny ] }

  # Themes: the four mounts, every design token and the typefaces drawn by
  # components of the example's own; on `/` only, links to the other two mounts
  # and the brand switch, with a badge while the brand cookie is set.
  - name: verifyThemes
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        kinds: !cel "steps.nodes.result.themes.map(c, c.type)"
        mounts: !cel "steps.nodes.result.themes[2].children.map(b, b.children[0].text.message[0])"
        components: !cel "[steps.nodes.result.themes[6], steps.nodes.result.themes[9]].map(c, [c.export, c.props, c.module == steps.nodes.result.components[2].module])"
        rootLinks: !cel "[steps.themes.result.body.children[1].children[2], steps.themes.result.body.children[1].children[4]].map(c, c.children.map(l, l.href))"
        badge: !cel "[steps.themes, steps.acmeThemes].map(p, p.result.body.children[1].children.exists(c, c.type == 'badge'))"
        polish: !cel "[steps.polishThemes.result.body.children[0].children[0].text, steps.polishThemes.result.body.children[1].children[0].text]"
      expected:
        kinds: [ text, text, columns, text, text, text, component, text, text, component ]
        mounts: [ At the root, Under /radix, Under /brand, Under /sidebar ]
        components:
          - [ TokenSheet, {}, true ]
          - [ TypefaceSamples, {}, true ]
        rootLinks:
          - [ /radix/themes, /brand/themes ]
          - [ "/api/brand?set=acme", "/api/brand?set=none" ]
        badge: [ false, true ]
        polish:
          - { lang: pl, message: [ Cztery punkty montowania jednego projektu ] }
          - { lang: pl, message: [ Przełącz punkt montowania lub markę ] }

  # `/radix`, `/brand` and `/sidebar` place the very views `/` does.
  - name: verifySharedPages
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        radix: !cel >-
          [steps.radixOverview, steps.radixConditions, steps.radixData, steps.radixTables, steps.radixFilters, steps.radixForms,
            steps.radixActions, steps.radixComponents, steps.radixCrud, steps.radixThemes].map(p, p.result.body.children)
        brand: !cel >-
          [steps.brandOverview, steps.brandConditions, steps.brandData, steps.brandTables, steps.brandFilters, steps.brandForms,
            steps.brandActions, steps.brandComponents, steps.brandCrud, steps.brandThemes].map(p, p.result.body.children)
        sidebar: !cel "[steps.sidebarOverview.result.body.children, steps.sidebarThemes.result.body.children]"
      expected:
        radix: &shared
          - !cel "[steps.overview.result.body.children[0]]"
          - !cel "[steps.conditions.result.body.children[0]]"
          - !cel "steps.data.result.body.children"
          - !cel "steps.tables.result.body.children"
          - !cel "steps.filters.result.body.children"
          - !cel "steps.forms.result.body.children"
          - !cel "steps.actions.result.body.children"
          - !cel "steps.components.result.body.children"
          - !cel "steps.crud.result.body.children"
          - !cel "[steps.themes.result.body.children[0]]"
        brand: *shared
        sidebar:
          - !cel "[steps.overview.result.body.children[0]]"
          - !cel "[steps.themes.result.body.children[0]]"

  # One page resource at two widths: `/` leaves its pages contained, `/sidebar`
  # declares `pageWidth: full`, and each header follows its application.
  - name: verifyPageWidth
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        root: !cel "steps.data.result.body.width"
        sidebar: !cel "steps.sidebarData.result.body.width"
        headers: !cel "[steps.app, steps.radixApp, steps.brandApp, steps.sidebarApp].map(a, a.result.body.header.width)"
      expected:
        root: contained
        sidebar: full
        headers: [ contained, contained, contained, full ]
