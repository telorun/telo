kind: Telo.Application
metadata:
  name: PgInternalColumnBoots
  version: 1.0.0
  description: Boot 0 — drop the namespace, ledger included, so the boots below start clean.
imports:
  Sql: ../../../../../sql
  Postgres: ../../../../
  Run: ../../../../../run
variables:
  dbHost: { env: DB_HOST, type: string }
  dbPort: { env: DB_PORT, type: integer }
targets:
  - !ref reset
---
kind: Postgres.Connection
metadata: { name: db }
connectionString: !cel >-
  'postgres://postgres:postgres@' + variables.dbHost + ':' +
  string(variables.dbPort) + '/postgres'
---
kind: Run.Sequence
metadata: { name: reset }
steps:
  - name: dropNamespace
    invoke: { kind: Sql.Command, connection: !ref db }
    inputs:
      sql: "DROP SCHEMA IF EXISTS telo_pg_internal_columns CASCADE"
