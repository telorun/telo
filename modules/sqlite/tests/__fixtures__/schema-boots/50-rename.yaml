kind: Telo.Application
metadata:
  name: SchemaBoots
  version: 5.0.0
  description: |
    Boot 5 of 7 — two renames at once, in the two states a rename can be in.

    `displayName` renames a LIVE column: expand-contract, so the pass adds it,
    copies `email` into it and tombstones the source — a native RENAME would
    break version 4, which is still running and still reads `email`.

    `handle` renames `nickname`, which boot 3 reclaimed. There is nothing left to
    copy and nothing left to hold, so the mention is INERT and reported as such —
    that is how the author learns the `renamedFrom:` can be deleted. It must not
    put the vanished column back on the books.
imports:
  Sql: ../../../../sql
  SQLite: ../../../../sqlite
  Run: ../../../../run
  Assert: ../../../../assert
variables:
  dbFile: { env: SCHEMA_BOOTS_DB, type: string, default: ./.telo/schema-boots.db }
targets:
  - !ref appSchema
  - !ref test
---
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.dbFile"
---
kind: SQLite.Table
metadata: { name: users }
table: users
columns:
  id: { type: integer, primaryKey: true }
  displayName: { type: text, renamedFrom: email }
  handle: { type: text, renamedFrom: nickname }
---
# A foreign key carried unchanged from here on. SQLite does not NAME a foreign
# key, so a later boot cannot match one to its declaration by name — which is
# what makes a restart, not a change, the case worth pinning.
kind: SQLite.Table
metadata: { name: sessions }
table: sessions
columns:
  id: { type: integer, primaryKey: true }
  userId: { type: integer, nullable: false }
foreignKeys:
  sessionsUser:
    columns: [userId]
    references:
      table: !ref users
      columns: [id]
    onDelete: cascade
---
# Two structurally IDENTICAL keys apart from their declared names, plus a
# COMPOSITE one. SQLite keeps no name, so these are matched by structure on every
# later boot — and a match has to be CONSUMED: without that both declarations
# claim the same live key, and a key genuinely missing from the database is
# masked by its twin instead of being reported.
kind: SQLite.Table
metadata: { name: memberships }
table: memberships
columns:
  id: { type: integer, primaryKey: true }
  ownerId: { type: integer, nullable: false }
  deputyId: { type: integer, nullable: false }
  userId: { type: integer, nullable: false }
foreignKeys:
  membershipOwner:
    columns: [ownerId]
    references: { table: !ref sessions, columns: [id] }
  membershipDeputy:
    columns: [deputyId]
    references: { table: !ref sessions, columns: [id] }
  membershipUserSession:
    columns: [userId, id]
    references: { table: !ref sessions, columns: [userId, id] }
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
version: !cel "module.version"
tables: [!ref users, !ref sessions, !ref memberships]
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: read
    invoke: !ref readUsers
    inputs:
      sql: "SELECT displayName, handle, email FROM users WHERE id = 1"
  - name: assertCopied
    invoke: !ref assertCopied
    inputs:
      actual: !cel "steps.read.result.rows"
      expected:
        # Copied by the pass; `handle` is empty because its source was reclaimed.
        - displayName: "a@example.com"
          handle: null
          email: "a@example.com"
  - name: assertTombstoned
    invoke: !ref assertTombstoned
    inputs:
      actual: !cel "resources.appSchema.status.tombstoned"
      expected: ["column users.email"]
  - name: assertInert
    invoke: !ref assertInert
    inputs:
      actual: !cel "resources.appSchema.status.inertRenames"
      expected: ["column users.handle (renamedFrom nickname)"]
---
kind: Sql.Query
metadata: { name: readUsers }
connection: !ref db
---
kind: Assert.Equals
metadata: { name: assertCopied }
---
kind: Assert.Equals
metadata: { name: assertTombstoned }
---
kind: Assert.Equals
metadata: { name: assertInert }
