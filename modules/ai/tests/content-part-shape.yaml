kind: Telo.Application
metadata:
  name: ContentPartShapeTest
  version: 1.0.0
  description: |
    The shape of a content part is declared once and held by the contract of
    whatever takes a message: a malformed literal part is refused where it is
    written, with the finding on the key at fault, and the same part as a computed
    value is refused at dispatch — identically through all four operations, none
    of which checks a part by hand.
imports:
  Ai: ../
  AiEcho: ./__fixtures__/ai-echo.yaml
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref literalPartsRefused
  - !ref computedPartRefused
---
kind: Assert.Manifest
metadata: { name: literalPartsRefused }
source: ./__fixtures__/content-part-shape.yaml
expect:
  errors:
    # Neither bytes nor a reference: no key is at fault, so the part is.
    - code: CONTRACT_INPUTS_MISMATCH
      message: "steps[0].inputs.messages[0].content[0]' do not satisfy echo's declared inputType: /messages/0/content/0 must match a schema in anyOf"
    - code: CONTRACT_INPUTS_MISMATCH
      message: "steps[1].inputs.messages[0].content[0].uri' do not satisfy echo's declared inputType: /messages/0/content/0/uri is not allowed here"
    - code: CONTRACT_INPUTS_MISMATCH
      message: "steps[2].inputs.messages[0].content[0]' do not satisfy echo's declared inputType: /messages/0/content/0 is missing required property 'mediaType'"
    - code: CONTRACT_INPUTS_MISMATCH
      message: "steps[3].inputs.messages[0].content[0].uri' do not satisfy echo's declared inputType: /messages/0/content/0/uri must match pattern"
    - code: CONTRACT_INPUTS_MISMATCH
      message: "steps[4].inputs.messages[0].content[0].uri' do not satisfy echo's declared inputType: /messages/0/content/0/uri must match pattern"
    - code: CONTRACT_INPUTS_MISMATCH
      message: "'cacheControl' is not allowed"
---
kind: AiEcho.EchoModel
metadata: { name: echo }
---
kind: AiEcho.EchoModelStream
metadata: { name: echoStream }
---
kind: Ai.Text
metadata: { name: text }
model: !ref echo
---
kind: Ai.TextStream
metadata: { name: textStream }
model: !ref echoStream
---
kind: Ai.Agent
metadata: { name: agent }
model: !ref echo
---
kind: Ai.AgentStream
metadata: { name: agentStream }
model: !ref echoStream
---
# An image part carrying neither bytes nor a reference, built at run time so no
# static check sees it.
kind: Run.Value
metadata: { name: malformedMessages }
value: !cel "[{'role': 'user', 'content': [{'type': 'image', 'mediaType': 'image/png'}]}]"
---
kind: Run.Sequence
metadata: { name: computedPartRefused }
steps:
  - name: messages
    invoke: !ref malformedMessages
  - name: viaText
    try:
      - name: textCall
        invoke: !ref text
        inputs: { messages: !cel "steps.messages.result" }
    catch:
      - name: textCode
        value: !cel "error.code"
  - name: viaTextStream
    try:
      - name: textStreamCall
        invoke: !ref textStream
        inputs: { messages: !cel "steps.messages.result" }
    catch:
      - name: textStreamCode
        value: !cel "error.code"
  - name: viaAgent
    try:
      - name: agentCall
        invoke: !ref agent
        inputs: { messages: !cel "steps.messages.result" }
    catch:
      - name: agentCode
        value: !cel "error.code"
  - name: viaAgentStream
    try:
      - name: agentStreamCall
        invoke: !ref agentStream
        inputs: { messages: !cel "steps.messages.result" }
    catch:
      - name: agentStreamCode
        value: !cel "error.code"
  - name: check
    invoke: !ref Assert.equals
    inputs:
      actual:
        text: !cel "steps.textCode.result"
        textStream: !cel "steps.textStreamCode.result"
        agent: !cel "steps.agentCode.result"
        agentStream: !cel "steps.agentStreamCode.result"
      expected:
        text: ERR_INPUT_INVALID
        textStream: ERR_INPUT_INVALID
        agent: ERR_INPUT_INVALID
        agentStream: ERR_INPUT_INVALID
