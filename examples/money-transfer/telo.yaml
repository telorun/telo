kind: Telo.Application
metadata:
  name: MoneyTransfer
  version: 1.0.0
  categories: [ Storage, Transport, Coordination ]
  description: |
    Moving money between two accounts: the debit and the credit are one
    all-or-nothing unit, and the balance check happens inside it.

    The interesting part is not that `Sql.Transaction` exists — it is that a
    statement declaring `transaction:` becomes *unreachable* except through that
    transaction's body. The requirement is a schema annotation
    (`x-telo-requires-zone`), so `telo check` refuses a manifest that calls the
    debit from anywhere else: a write that escapes the transaction is a static
    error, not a 3am incident. `broken.yaml` in this directory is that mistake,
    kept so you can watch the checker reject it.

    Run, then:
        curl -s localhost:8055/accounts
        curl -s -XPOST localhost:8055/transfers -H 'content-type: application/json' \
          -d '{"from":1,"to":2,"amountCents":2500}'
        curl -s -XPOST localhost:8055/transfers -H 'content-type: application/json' \
          -d '{"from":1,"to":2,"amountCents":999999}'   # 409, and nothing moved
imports:
  Http: oci://ghcr.io/telorun/http-server@0.26.0#sha256-qCiZuU7_9wnxCn2QuA0oKM0H7OyvSd2aFcoXSv3vgFo
  Sql: oci://ghcr.io/telorun/sql@0.21.3#sha256-wPgugWO72ulGwO8Xhu9WUPyUimpO6QS0Owadfrn98hc
  SQLite: oci://ghcr.io/telorun/sql-sqlite@0.7.3#sha256-AdpaRCphd3vnfMVoyMZGpsUZ7y5xAo4w72i1j8_ZCVg
  Run: oci://ghcr.io/telorun/run@0.24.2#sha256-BFRCvbtbCRmj6SAu60wo_qbiQCJj1bGqKaKnhQwPJfw
targets:
  - !ref migrate
  - !ref server
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8055
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Sql.Migrations
metadata: { name: migrate }
connection: !ref db
migrations:
  0001_accounts:
    statements:
      - |
        CREATE TABLE IF NOT EXISTS accounts (
          id            INTEGER PRIMARY KEY,
          owner         TEXT    NOT NULL,
          balance_cents INTEGER NOT NULL CHECK (balance_cents >= 0)
        )
      - "INSERT OR IGNORE INTO accounts (id, owner, balance_cents) VALUES (1, 'ada', 100000)"
      - "INSERT OR IGNORE INTO accounts (id, owner, balance_cents) VALUES (2, 'grace', 5000)"
---
kind: Sql.Transaction
metadata: { name: transferTx }
connection: !ref db
steps: !ref transferWrites
inputs:
  from: !cel "inputs.from"
  to: !cel "inputs.to"
  amountCents: !cel "inputs.amountCents"
---
# Everything in here runs inside the open transaction, including the balance
# read — so no one can spend the same money twice between the check and the
# debit. A throw anywhere rolls the whole thing back.
kind: Run.Sequence
metadata: { name: transferWrites }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [ from, to, amountCents ]
    properties:
      from: { type: integer }
      to: { type: integer }
      amountCents: { type: integer }
steps:
  - name: balance
    invoke: !ref readBalance
    inputs:
      sql: !sql "SELECT balance_cents FROM accounts WHERE id = ${{ inputs.from }}"
  - name: settle
    if: !cel "size(steps.balance.result.rows) > 0 && steps.balance.result.rows[0].balance_cents >= inputs.amountCents"
    then:
      - name: debit
        invoke: !ref moveMoney
        inputs:
          sql: !sql "UPDATE accounts SET balance_cents = balance_cents - ${{ inputs.amountCents }} WHERE id = ${{ inputs.from }}"
      - name: credit
        invoke: !ref moveMoney
        inputs:
          sql: !sql "UPDATE accounts SET balance_cents = balance_cents + ${{ inputs.amountCents }} WHERE id = ${{ inputs.to }}"
outputs:
  declined: !cel "size(steps.balance.result.rows) == 0 || steps.balance.result.rows[0].balance_cents < inputs.amountCents"
  moved: !cel "inputs.amountCents"
---
# `transaction:` instead of `connection:` is the whole trick: this statement
# declares that it must be reached through transferTx's body. Invoking it from
# a plain step is ZONE_REQUIREMENT_UNSATISFIED at check time.
kind: Sql.Command
metadata: { name: moveMoney }
transaction: !ref transferTx
---
kind: Sql.Query
metadata: { name: readBalance }
transaction: !ref transferTx
---
# Reads outside the transfer are ordinary: this one takes `connection:`, so it
# carries no zone requirement and can be called from any route.
kind: Sql.Query
metadata: { name: listAccounts }
connection: !ref db
---
kind: Http.Api
metadata: { name: bankRoutes }
routes:
  - request:
      path: /accounts
      method: GET
    handler: !ref listAccounts
    inputs:
      sql: "SELECT id, owner, balance_cents FROM accounts ORDER BY id"
      bindings: []
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result.rows"

  - request:
      path: /transfers
      method: POST
      schema:
        body:
          type: object
          additionalProperties: false
          required: [ from, to, amountCents ]
          properties:
            from: { type: integer }
            to: { type: integer }
            amountCents: { type: integer, minimum: 1 }
    handler: !ref transferTx
    inputs:
      from: !cel "request.body.from"
      to: !cel "request.body.to"
      amountCents: !cel "request.body.amountCents"
    returns:
      # The balance check ran inside the transaction, so a decline means the
      # transaction committed having written nothing.
      - status: 409
        when: !cel "result.declined"
        content:
          application/json:
            body:
              ok: false
              error: insufficient_funds
      - status: 200
        content:
          application/json:
            body:
              ok: true
              movedCents: !cel "result.moved"
---
kind: Http.Server
metadata: { name: server }
port: !cel "ports.http"
openapi:
  info:
    title: Money transfer
    version: 1.0.0
mounts:
  - path: /
    mount: !ref bankRoutes
