kind: Telo.Application
metadata:
  name: UiStaticRefusalsTest
  version: 1.0.0
  description: |
    What the vocabulary refuses before anything runs, and what each composite
    refuses itself when a manifest reaches it without that check: a source
    filter, a form field or a filter naming a property the model does not
    declare, a filter operator the property's type cannot carry, a filter or a
    source filter the collection does not accept, and a bar showing every
    accepted filter over a model that lacks one of their properties, types it
    so the operator does not fit, or declares no property at all. A
    misspelled node type lists the valid ones, a stray key is named, a link's
    address and a menu item's are held to the same rule, and a
    component's properties are held to what its export declares. A surface
    takes only its own kind's keys, a page surface needs its address, a surface
    slot and a compact slot take only the kinds they name — a navigation's
    compact slot only a compact placement, which takes no compact of its own, and a tab bar at most five tabs —
    an edit cannot ask
    for another record, an opener is not a bare form, and a compact surface
    declares neither an address nor a compact surface of its own. A filter bar
    lists a pair once, declares only defaults and preset values its filters can
    hold, asks only for controls they can be entered with — a switch only over
    a property that says it is a boolean, and never to be off — presets only
    what it shows and labels each preset once; a state keeps something somewhere, a
    filter overlay floats, and a compact placement folds. Pinning a filter
    where nothing folds is a warning, and nowhere else. An action takes only
    its own keys, lists only fields its input model declares and a control can
    enter — as a form does over its model — and enters every property that
    model requires; it draws no `lists`, navigates only to an address, refreshes
    only app-relative paths and clears its answer only on its input model's
    properties; a list of its answer is read by a plain path, and a column
    reads only what its row or the answer declares. A row action — of a table
    or of a list — is given inputs, at least one, that make a record of its own
    action's input model, each a path into the row or a root bound there of a
    fitting type or a fixed value, and asks a question that is text. An action
    that draws an answer is offered in a row with every rule run; the action
    refuses an unknown clearing property, and a table or list refuses row
    inputs that make no record, when it is first read. A field names a property
    its model declares, once; a group is declared once and its fields are
    listed together; kept state keeps only what is shown; a field kind fits its
    property — its control, its options' value type, a date range's shape,
    default and presets — and an option source searches, filters and looks a
    value up only as its collection accepts. Each is refused again when the
    form, the action or the source is first read.
imports:
  Assert: ../../assert
  Probe: ./__fixtures__/probe
  Run: ../../run
targets:
  - !ref rules
  - !ref sourceFilterAtRuntime
  - !ref formFieldAtRuntime
  - !ref formFieldUnsupportedAtRuntime
  - !ref filterPropertyAtRuntime
  - !ref filterOperatorAtRuntime
  - !ref sourceFilterNotAcceptedAtRuntime
  - !ref filterNotAcceptedAtRuntime
  - !ref filterModelIncompleteAtRuntime
  - !ref filterModelMistypedAtRuntime
  - !ref filterModelUntypedAtRuntime
  - !ref shapes
  - !ref surfaces
  - !ref navigationPlacements
  - !ref compactAddressedAtRuntime
  - !ref compactNestedAtRuntime
  - !ref filterDuplicateAtRuntime
  - !ref filterDefaultInvalidAtRuntime
  - !ref filterControlUnsupportedAtRuntime
  - !ref presetUnknownFilterAtRuntime
  - !ref presetValueInvalidAtRuntime
  - !ref presetLabelDuplicateAtRuntime
  - !ref toggleOverTextAtRuntime
  - !ref toggleUntypedAtRuntime
  - !ref toggleDefaultOffAtRuntime
  - !ref togglePresetOffAtRuntime
  - !ref filterPolicy
  - !ref pinned
  - !ref actions
  - !ref actionFieldUnknownAtRuntime
  - !ref actionFieldUnsupportedAtRuntime
  - !ref actionRequiredNotEnteredAtRuntime
  - !ref rowActionAnswers
  - !ref actionClearUnknownAtRuntime
  - !ref rowActionInputsAtRuntime
  - !ref listRowActionInputsAtRuntime
  - !ref conditions
  - !ref texts
  - !ref fieldRules
  - !ref fieldActionInputControlAtRuntime
  - !ref fieldChoiceControlAtRuntime
  - !ref fieldChoiceMismatchAtRuntime
  - !ref fieldDuplicateAtRuntime
  - !ref fieldFiltersStateFieldUnknownAtRuntime
  - !ref fieldGroupDuplicateAtRuntime
  - !ref fieldGroupSplitAtRuntime
  - !ref fieldGroupUnknownAtRuntime
  - !ref fieldInputControlAtRuntime
  - !ref fieldOptionFilterNotAcceptedAtRuntime
  - !ref fieldPickerMismatchAtRuntime
  - !ref fieldRangeDefaultAtRuntime
  - !ref fieldRangeLabelDuplicateAtRuntime
  - !ref fieldRangePresetUnknownAtRuntime
  - !ref fieldRangePropertyAtRuntime
  - !ref fieldRequiredNotEnteredAtRuntime
  - !ref fieldSearchNotAcceptedAtRuntime
  - !ref fieldStateFieldUnknownAtRuntime
  - !ref fieldUnknownAtRuntime
  - !ref fieldValueNotFilterableAtRuntime
