# A library whose texts are written in Polish, with no catalogs: its translator
# formats them as written, choosing plural cases by Polish rules whatever
# language is asked for.
kind: Telo.Library
metadata:
  name: PolishSource
  version: 1.0.0
  description: Fixture library writing its texts in Polish.
lang: pl
imports:
  I18n: ../../../
exports:
  resources: [t, files]
---
kind: I18n.Translator
metadata: { name: t }
---
kind: Telo.Function
metadata: { name: files }
params:
  - name: n
    schema: { type: integer }
  - name: lang
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  Self.t({'plural': 'n', 'cases': {'one': '{$n} plik', 'few': '{$n} pliki', 'many': '{$n} plików', 'other': '{$n} pliku'}}, lang, {'n': n})
