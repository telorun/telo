# Readers whose button writes something `telo check` refuses on the line it was
# written: a required input left unbound, a key the mutation does not take, a
# prompt whose fields leave a required entry out, and a read of a member the
# data does not declare. A consumer's
# own check sees none, so the button is refused when it is first read.
kind: Telo.Library
metadata:
  name: UiInvalidPageActions
  version: 1.0.0
  description: >-
    Test fixture exporting readers whose buttons each read what their data or
    their mutation cannot answer for.
imports: { Ui: ../../../../../ }
exports: { resources: [authorUnprompted, hashMisspelled, revisionTypo] }
---
kind: Telo.JsonSchema
metadata: { name: PlanDetail }
schema:
  type: object
  required: [plan]
  properties:
    plan:
      type: object
      required: [id, title, latestRevision]
      properties:
        id: { type: string }
        title: { type: string }
        latestRevision:
          type: object
          required: [seq, hash]
          properties: { seq: { type: integer }, hash: { type: string } }
---
kind: Ui.Mutation
metadata: { name: decide }
inputModel:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [revision, hash, author]
    properties: { revision: { type: integer }, hash: { type: string }, author: { type: string } }
url: /api/decisions
---
kind: Ui.View
metadata: { name: authorUnprompted }
content:
  type: query
  query:
    kind: Ui.Query
    model: !ref PlanDetail
    url: /api/plan
  content:
    - type: button
      action:
        mutation: !ref decide
        inputs: { revision: !cel "data.plan.latestRevision.seq", hash: !cel "data.plan.latestRevision.hash" }
        label: Decide
---
kind: Ui.View
metadata: { name: hashMisspelled }
content:
  type: query
  query:
    kind: Ui.Query
    model: !ref PlanDetail
    url: /api/plan
  content:
    - type: button
      action:
        mutation: !ref decide
        inputs: { revision: !cel "data.plan.latestRevision.seq", hsh: !cel "data.plan.latestRevision.hash", author: !cel "prompt.author" }
        label: Decide
        prompt: !ref author
---
kind: Ui.Prompt
metadata: { name: author }
model:
  kind: Telo.JsonSchema
  schema: { type: object, required: [author], properties: { author: { type: string } } }
---
# It enters `author` alone, so `note` could never be sent.
kind: Ui.Prompt
metadata: { name: commentIncomplete }
model:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [author, note]
    properties: { author: { type: string }, note: { type: string } }
fields: [author]
---
kind: Ui.View
metadata: { name: revisionTypo }
content:
  type: query
  query:
    kind: Ui.Query
    model: !ref PlanDetail
    url: /api/plan
  content:
    - type: button
      action:
        mutation: !ref decide
        inputs:
          revision: !cel "data.plan.latestRevison.seq"
          hash: !cel "data.plan.latestRevision.hash"
          author: !cel "prompt.author"
        label: Decide
        prompt: !ref author
