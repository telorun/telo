units:
  analyzer: Added
body: "A kind can mark a binding of an `x-telo-context`, or a member beneath one,
  `x-telo-context-partial: true`: the node is then some members of the object type its
  typing annotation (`x-telo-context-from`, `x-telo-context-from-root`,
  `x-telo-context-from-referrer`, …) or its own `properties` give it, every member
  optional and nullable, so `telo check` still refuses an unknown member
  (`CEL_UNKNOWN_FIELD`) and an unguarded read beneath a member (`CEL_NULLABLE_ACCESS`).
  A type a referrer gives already partial is left as it is, and the mark may stand
  beside `x-telo-context-withheld`. Off a binding, on a node nothing types as an object,
  on one declaring another `type` or beside `x-telo-context-collection-from` it is
  `CONTEXT_PARTIAL_INVALID` at the kind; a value other than `true` is
  `SCHEMA_VIOLATION`."
