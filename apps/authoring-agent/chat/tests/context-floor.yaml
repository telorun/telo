kind: Telo.Application
metadata:
  name: ChatContextFloor
  version: 1.0.0
  description: |
    The agent declares `maxContextTokens` at least 8 — the floor that keeps the
    summary call's cap (`maxContextTokens / 8` output tokens) at least 1 — so a
    parent handing it 7 is refused before anything starts, naming the variable.
imports:
  Assert: oci://ghcr.io/telorun/assert@0.22.0#sha256-72ysePrZIFbPDsX6TdpS4vCuzCnGCx_KVDUunxJ_0OU
targets:
  - !ref refusesSmallContext
---
kind: Assert.Manifest
metadata: { name: refusesSmallContext }
source: ./__fixtures__/context-floor/telo.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "/variables/maxContextTokens must be >= 8 — the application at '../../../../telo.yaml' declares it so."
  runFails: "[SCHEMA_VIOLATION] App.Instance/agent: /variables/maxContextTokens must be >= 8"
