modules:
  modules/channel: Added
body: "`Channel.ReadUntil.timeout` is a duration (`30s` when omitted): `1m`, `1h30m` and
  `250ms` are read, an integer is milliseconds, and a malformed literal is refused by
  `telo check`. A computed value must now be a duration (`!cel \"duration('10s')\"`),
  not a string, so a manifest passing a computed string must change. Text with a space
  before the unit (`5 m`) or around the value is now refused. Requires telo >=0.129.0."
