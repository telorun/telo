kind: Telo.Application
metadata:
  name: StandInValueConstraintsTest
  version: 1.0.0
  description: |
    A value written through a tag is checked as a stand-in until it exists, and
    a stand-in is judged only for what its tag guarantees: nothing for `!cel`,
    the produced type for `!interpolate`. A correct value at a slot declaring
    `minLength`, `pattern` or `format` therefore checks and runs, at the entry
    and through an import (where the kernel's create-time validation is the
    judge), while a string tag at an integer slot and a `!literal` violating a
    pattern are still refused.
imports:
  Assert: ../modules/assert
targets:
  - !ref acceptedAtEntry
  - !ref acceptedInLibrary
  - !ref acceptedThroughImport
  - !ref interpolateIntoIntegerArgument
  - !ref interpolateIntoIntegerField
  - !ref literalViolatingPattern
---
kind: Assert.Manifest
metadata:
  name: acceptedAtEntry
source: ./__fixtures__/stand-in-value-constraints/telo.yaml
expect:
  errors: []
  runs: true
---
kind: Assert.Manifest
metadata:
  name: acceptedInLibrary
source: ./__fixtures__/stand-in-value-constraints/lib/telo.yaml
expect:
  errors: []
---
kind: Assert.Manifest
metadata:
  name: acceptedThroughImport
source: ./__fixtures__/stand-in-value-constraints/consumer.yaml
expect:
  errors: []
  runs: true
---
kind: Assert.Manifest
metadata:
  name: interpolateIntoIntegerArgument
source: ./__fixtures__/stand-in-value-constraints/interpolate-integer-call-site.yaml
expect:
  errors:
    - code: CONTRACT_INPUTS_MISMATCH
      message: "/count must be integer"
---
kind: Assert.Manifest
metadata:
  name: interpolateIntoIntegerField
source: ./__fixtures__/stand-in-value-constraints/interpolate-integer-own-field.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "/count must be integer"
---
kind: Assert.Manifest
metadata:
  name: literalViolatingPattern
source: ./__fixtures__/stand-in-value-constraints/literal-pattern.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "/timeout must match pattern"
