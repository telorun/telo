units:
  cli: Added
body: "`telo run` answers `Telo.GeneratedSecretKey` and `Telo.GeneratedPassword` needs
  from `TELO_HOST_SECRET_SEED` and never asks for one at the terminal; with no seed and
  no variable set it refuses with `ERR_NEED_UNMET`, naming `TELO_HOST_SECRET_SEED` and
  the need's variable."
