# What a kind's own `base:` writes resolves in the library that wrote it: its
# `!ref helper` is the library's, though the consumer declares a `helper` too.
# A kind extending a template through `Self.` runs that template's body in the
# library, with a mapping or without.
kind: Telo.Application
metadata: { name: InheritedMappingScope }
imports: { Lib: ./lib, Assert: ../../../../modules/assert }
targets:
  - !ref verify
---
kind: Telo.Sequence
metadata: { name: helper }
steps:
  - { name: who, value: consumer }
---
kind: Lib.CallsHelper
metadata: { name: libraryCall }
---
kind: Lib.MergedGreeter
metadata: { name: merged }
greeting: merged
---
kind: Lib.MappedGreeter
metadata: { name: mapped }
---
kind: Telo.Sequence
metadata: { name: verify }
steps:
  - name: library
    invoke: !ref libraryCall
  - name: merged
    invoke: !ref merged
  - name: mapped
    invoke: !ref mapped
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        mapping: !cel "steps.library.result.call.result.who.result"
        merged: !cel "steps.merged.result.who"
        mapped: !cel "steps.mapped.result.who"
      expected: { mapping: library, merged: library, mapped: library }
