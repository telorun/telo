kind: Telo.Application
metadata:
  name: ChatApp
  version: 1.0.0
  categories: [AI, UI]
  description: |
    A chat over Claude with image and PDF uploads and tools, in a browser. The
    assistant can look up the weather, Wikipedia, exchange rates and the time
    anywhere, and save notes after you approve each one; a small model names each
    new conversation. The page draws its
    upload button from what the model accepts, conversations and the turn journal
    and uploaded files live in one state directory, and a turn keeps running when
    the page is closed: reopening the conversation reads it back and follows the
    turn that is still going.

    Run with the Anthropic key in the environment (or in a sibling `.env.local`
    file, which the CLI loads from the manifest's directory):
        ANTHROPIC_API_KEY=sk-ant-...
    then open http://localhost:8080.
requires: { telo: ">=0.129.0" }
lang: en
imports:
  Http: ../../modules/http-server
  HttpClient: ../../modules/http-client
  Ai: ../../modules/ai
  Anthropic: ../../modules/anthropic
  AiConversationSql: ../../modules/ai-conversation-sql
  # Not `AiChat`: an alias equal to the module's own name makes its private kinds
  # unreachable until that analyzer defect is fixed.
  Chat: ../../modules/ai-chat
  Conversation: ../../modules/conversation
  RecordStream: ../../modules/record-stream
  RecordStreamSql: ../../modules/record-stream-sql
  Scheduler: ../../modules/scheduler
  BlobFs: ../../modules/blob-fs
  MediaType: ../../modules/media-type
  Fs: ../../modules/fs
  SQLite: ../../modules/sqlite
  Ui: ../../modules/ui
  UiLucide: ../../modules/ui-lucide
  UiReact: ../../modules/ui-react
targets: [!ref server, !ref journalExpiry, !ref attachmentExpiry]
ports: { http: { env: PORT, protocol: tcp, default: 8080 } }
variables:
  stateDir:
    env: STATE_DIR
    type: string
    x-telo-type: { name: Telo.HostPath, entry: directory }
    default: .data/chat
  model: { env: MODEL, type: string, default: claude-sonnet-5-5 }
  titleModel: { env: TITLE_MODEL, type: string, default: claude-haiku-5-5 }
  # Anthropic's API, or a gateway in front of it.
  anthropicUrl: { env: ANTHROPIC_BASE_URL, type: string, default: "https://api.anthropic.com/v1" }
secrets: { anthropicApiKey: { env: ANTHROPIC_API_KEY, type: string } }
---
# Anthropic's API with the key, shared by the chat model and the title model.
kind: HttpClient.Request
metadata: { name: anthropicRequest }
client:
  kind: Anthropic.Client
  baseUrl: !cel "variables.anthropicUrl"
  credential: { kind: HttpClient.ApiKeyHeader, header: x-api-key, key: !cel "secrets.anthropicApiKey" }
---
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.stateDir.joinPath('chat.sqlite')"
---
# A finished turn replays for a week and a send is remembered as long, applied by
# the hourly expiry below; a send's marker then lingers for a day.
kind: RecordStream.Journal
metadata: { name: journal }
store: { kind: RecordStreamSql.JournalStore, connection: !ref db, table: chat_journal }
retention: 168h
markerRetention: 24h
---
kind: Scheduler.Interval
metadata: { name: journalExpiry }
every: 1h
invoke: { kind: RecordStream.JournalExpiry, journal: !ref journal }
---
# Removes uploads no message sent within a day, and a deleted conversation's files.
kind: Scheduler.Interval
metadata: { name: attachmentExpiry }
every: 1h
invoke: { kind: Chat.AttachmentExpiry, conversation: !ref conversation }
---
# Read by the page for what it offers and served by the API under /api/chat.
kind: Chat.Conversation
metadata: { name: conversation }
agent:
  kind: Ai.AgentStream
  system: |
    You are Telo Assistant, a friendly and concise helper.
    - Use your tools whenever a question needs live facts: weather, an encyclopedia
      lookup, currency conversion or the current time. Never guess them.
    - Answer from the files the user attaches when there are any.
    - Format answers in Markdown: short paragraphs, bullet lists, and a table when
      comparing values. Cite the Wikipedia link when you used it.
    - Save a note only when the user asks for one.
  maxSteps: 8
  toolProviders:
    - provider:
        kind: Ai.Tools
        tools:
          - name: get_weather
            description: Current weather and a 7-day forecast for a city, in metric units and the city's local time.
            parameters:
              type: object
              additionalProperties: false
              required: [city]
              properties: { city: { type: string, description: "City name, e.g. Tokyo or Kraków." } }
            tool:
              kind: Telo.Sequence
              inputType:
                kind: Telo.JsonSchema
                schema: { type: object, required: [city], properties: { city: { type: string } } }
              steps:
                - name: place
                  invoke: { kind: HttpClient.Request, throwOnHttpError: true }
                  inputs:
                    url: https://geocoding-api.open-meteo.com/v1/search
                    query: { name: !cel "inputs.city", count: "1", language: en, format: json }
                - name: requirePlace
                  if: !cel "!has(steps.place.result.body.results)"
                  then:
                    - name: notFound
                      throw:
                        code: ERR_PLACE_NOT_FOUND
                        message: !interpolate "No place named '${{ inputs.city }}' was found."
                - name: forecast
                  invoke: { kind: HttpClient.Request, throwOnHttpError: true }
                  inputs:
                    url: https://api.open-meteo.com/v1/forecast
                    query:
                      latitude: !cel "string(steps.place.result.body.results[0].latitude)"
                      longitude: !cel "string(steps.place.result.body.results[0].longitude)"
                      current: temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m
                      daily: weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max
                      timezone: auto
                      forecast_days: "7"
              outputs:
                place: !cel "steps.place.result.body.results[0].name + ', ' + steps.place.result.body.results[0].country"
                current: !cel "steps.forecast.result.body.current"
                daily: !cel "steps.forecast.result.body.daily"
                units: !cel "steps.forecast.result.body.current_units"
                weatherCodes: WMO codes — 0 clear, 1-3 partly cloudy, 45/48 fog, 51-57 drizzle, 61-67 rain, 71-77 snow, 80-82 showers, 95-99 thunderstorm
          - name: wikipedia_lookup
            description: Look a topic up on English Wikipedia and return the best matching article's introduction and link.
            parameters:
              type: object
              additionalProperties: false
              required: [topic]
              properties: { topic: { type: string, description: "What to look up, in a few words." } }
            tool:
              kind: HttpClient.Request
              throwOnHttpError: true
              inputs:
                url: https://en.wikipedia.org/w/api.php
                headers: { user-agent: "TeloChatExample/1.0 (https://telo.run)" }
            inputs:
              query:
                action: query
                generator: search
                gsrsearch: !cel "arguments.topic"
                gsrlimit: "1"
                prop: extracts|info
                exintro: "1"
                explaintext: "1"
                exsentences: "6"
                inprop: url
                format: json
                formatversion: "2"
            result: !cel >-
              has(result.body.query)
              ? {'title': result.body.query.pages[0].title, 'url': result.body.query.pages[0].fullurl, 'introduction': result.body.query.pages[0].extract}
              : {'found': false}
          - name: convert_currency
            description: Convert an amount between currencies at the latest European Central Bank reference rate.
            parameters:
              type: object
              additionalProperties: false
              required: [amount, from, to]
              properties:
                amount: { type: number, description: The amount to convert. }
                from: { type: string, pattern: "^[A-Z]{3}$", description: "ISO 4217 code, e.g. EUR." }
                to: { type: string, pattern: "^[A-Z]{3}$", description: "ISO 4217 code, e.g. PLN." }
            tool:
              kind: HttpClient.Request
              throwOnHttpError: true
              inputs: { url: https://api.frankfurter.dev/v1/latest }
            inputs:
              query:
                amount: !cel "string(arguments.amount)"
                base: !cel "arguments.from"
                symbols: !cel "arguments.to"
            result: !cel "result.body"
          - name: current_time
            description: The current date and time in an IANA time zone.
            parameters:
              type: object
              additionalProperties: false
              required: [timezone]
              properties: { timezone: { type: string, description: "IANA time zone, e.g. Europe/Warsaw." } }
            tool:
              kind: Telo.Sequence
              inputType:
                kind: Telo.JsonSchema
                schema: { type: object, required: [timezone], properties: { timezone: { type: string } } }
              steps: []
              outputs:
                timezone: !cel "inputs.timezone"
                now: !cel "nowIso(inputs.timezone)"
          - name: save_note
            description: Save a Markdown note to the notes folder. The user approves every save before it runs.
            approval: true
            parameters:
              type: object
              additionalProperties: false
              required: [filename, content]
              properties:
                filename: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$", description: "Lowercase file name without extension, e.g. weekend-plan." }
                content: { type: string, description: The note, in Markdown. }
            tool: { kind: Fs.FileWrite, cwd: !cel "variables.stateDir.joinPath('notes')" }
            inputs:
              path: !interpolate "${{ arguments.filename }}.md"
              content: !cel "arguments.content"
              createParents: true
              maxBytes: 65536
            result: !cel "'Saved ' + string(result.bytesWritten) + ' bytes.'"
  model:
    kind: Anthropic.MessagesModelStream
    model: !cel "variables.model"
    maxTokens: 4096
    request: !ref anthropicRequest
    # The upload button and the provider's refusal both come from this list.
    accepts:
      - { type: image, mediaTypes: [image/png, image/jpeg, image/gif, image/webp], maxBytes: 5242880 }
      - { type: file, mediaTypes: [application/pdf], maxBytes: 33554432 }
# A small model names each new conversation as its first turn ends.
titles:
  model: { kind: Anthropic.MessagesModel, model: !cel "variables.titleModel", maxTokens: 32, request: !ref anthropicRequest }
store: { kind: AiConversationSql.Store, connection: !ref db }
journal: !ref journal
blobs:
  kind: BlobFs.Store
  root: !cel "variables.stateDir.joinPath('attachments')"
detector: { kind: MediaType.Detector }
attachments: { maxBytes: 10485760, maxPerMessage: 4, pendingRetention: 24h }
---
kind: UiReact.App
metadata: { name: ui }
title: Telo Assistant
theme: !ref UiReact.defaultTheme
# Telo's blue, the colour of the mark in the header.
tokens: { kind: Ui.DesignTokens, color.accent: "#2062ce", color.accent-text: "#ffffff" }
header:
  width: full
  start:
    - type: link
      text: Telo Assistant
      href: { path: !ref assistant }
      style: accent
      button: { kind: Ui.IconButton, icon: { kind: Ui.FileIcon, file: !module-path ./telo-mark.svg } }
  end:
    - { type: link, text: Built with Telo, href: "https://telo.run" }
navigation: { items: [] }
pages: [!ref assistant]
---
# The conversations beside the chat: a link per conversation and a link to start
# a new one, both to this page, the chat reading the conversation its address names.
kind: Ui.Page
metadata: { name: assistant }
path: /
width: full
children:
  - type: composite
    ref:
      kind: Ui.SplitView
      label: Conversations
      size: small
      collapse: { state: { key: conversations, store: { kind: Ui.LocalStore } } }
      aside:
        actions:
          - type: link
            text: New conversation
            href: { path: !ref assistant }
            button: { kind: Ui.IconButton, label: shown, icon: { kind: UiLucide.Icon, name: square-pen } }
        content:
          type: composite
          ref:
            kind: Ui.Listing
            model: !ref Conversation.ConversationSummary
            presentation:
              kind: Ui.CollectionPresentation
              source: { kind: Ui.CollectionSource, collection: !ref Conversation.conversations, basePath: /api/chat/conversations }
            filters: { archived: false }
            paging: scroll
            sort: { by: { property: updatedAt, direction: descending }, choosable: false }
            show: { count: false }
            delete: true
            layout:
              kind: Ui.ListLayout
              frame: flush
              content:
                type: stack
                children:
                  - type: value
                    value: !cel "row.title"
                    href: { path: !ref assistant, queryParams: { conversation: !cel "row.id" } }
                    shown: { at: !cel "row.title", matches: { type: string } }
                  - type: link
                    text: Untitled conversation
                    href: { path: !ref assistant, queryParams: { conversation: !cel "row.id" } }
                    shown: { at: !cel "row.title", matches: { type: "null" } }
                  - { type: badge, text: Replying, shown: { at: !cel "row.running", matches: { const: true } } }
            rowActions:
              - prompt: true
                inputs: { id: !cel "row.id" }
                action:
                  kind: Ui.Action
                  label: Rename
                  inputModel:
                    kind: Telo.JsonSchema
                    schema: { type: object, required: [id], properties: { id: { type: string }, title: { type: string, title: Title, minLength: 1 } } }
                  request:
                    method: PATCH
                    target: { path: "/api/chat/conversations/{id}", pathParams: { id: !cel "input.id" } }
              - inputs: { id: !cel "row.id", archived: true }
                action:
                  kind: Ui.Action
                  label: Archive
                  inputModel:
                    kind: Telo.JsonSchema
                    schema: { type: object, required: [id, archived], properties: { id: { type: string }, archived: { type: boolean } } }
                  request:
                    method: PATCH
                    target: { path: "/api/chat/conversations/{id}", pathParams: { id: !cel "input.id" } }
      content:
        type: composite
        fill: true
        ref:
          kind: Ui.Chat
          source: { kind: Ui.ConversationSource, conversation: !ref conversation, basePath: /api/chat }
          conversation: { parameter: conversation }
          refreshes: [/api/chat/conversations]
          placeholder: Ask about the weather, a topic, money or time — or drop an image or a PDF
          starters:
            - What's the weather in Tokyo this weekend?
            - Convert 250 EUR to PLN and USD
            - Who invented the World Wide Web?
            - Plan my Saturday in Kraków around the weather and save it as a note
            - { prompt: Summarise the attached PDF, onChoose: fill }
          show: { usage: false }
          header:
            - type: bar
              start:
                - { type: value, value: !cel "conversation.title", style: heading, shown: { at: !cel "conversation.title", matches: { type: string } } }
                - { type: text, text: Untitled conversation, style: heading, shown: { at: !cel "conversation.title", matches: { type: "null" } } }
                - { type: text, text: New conversation, style: heading, shown: { at: !cel "conversation", matches: { type: "null" } } }
              end:
                - type: command
                  command: !cel "chat.exportTranscript"
                  text: Export
                  button: { kind: Ui.IconButton, icon: { kind: UiLucide.Icon, name: download } }
---
kind: Http.Server
metadata: { name: server }
listen: { port: !cel "ports.http" }
mounts:
  - path: /api/chat
    mount: { kind: Chat.Api, conversation: !ref conversation }
  - { path: /, mount: !ref ui }
