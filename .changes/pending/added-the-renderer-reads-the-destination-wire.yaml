units:
  modules/ui-react: Added
body: "The renderer reads the destination wire and hosts opened pages. Every place that
  drew a link from `href` — a `link` node, a `menu` item, a `value` node, `list` and
  table columns, a relation, an option source and a navigation `link` entry — and an
  action success that went to `onSuccess.navigate` now reads `to`, a
  `Ui.DestinationSpec` (`navigate` or `openPage`), drawn as a real link to its address,
  so a new tab opens the full page. An unmodified press of an `openPage` destination
  opens the page in the dialog or drawer it names, titled by the page's title, else by
  the text of what opened it; the shell hosts one opened page, which a second opening
  replaces in its history entry, a destination moving somewhere from inside it closes,
  and Escape or close shuts, returning the focus to what opened it. Its address is kept
  under the query key `_telo.page.<name>` where a reload would restore the same surface,
  else in memory, and a cold load reopens it; a key holding no app-relative address, and
  every page key after the one that opens, is dropped. What an opened page's own nodes
  write — `_telo.open.*`, `_telo.f.*`, `_telo.v.*` — is kept in memory with it. A `box`,
  `stack` or `columns` node's `press` is drawn as the new `press` part, an empty link
  named by its label covering the node, its geometry in the base layer. A record part's
  `data-selected`, a navigation entry's and a menu item's current state also hold while
  their destination opens the page open now. An action reads its answer when a `to` in
  its result tree, or `onSuccess.to`, reads `result`. Breaking: a page, layout or
  component document carrying `href` or `onSuccess.navigate` at those places is no
  longer drawn as a link; send `to` instead. The layout contract is
  `ui_react_layouts-2`, hosted alone: a record gains `press`, the element the renderer
  draws for the listing's press (`null` without one), which a component places as the
  first child of the element it covers; `selected` reports whether that press leads to
  where the viewer is, for a component layout too, and the component sets
  `data-selected` from it; `onOpen(key)` runs the press, else the `edit` opener,
  `can.open` holding for either. Every built-in layout draws the record press across the
  whole record — list item, card, board card, calendar and timeline event, tree item —
  and the table across each row's first cell, the row keeping `data-selected`; with a
  press written, a record's edit stays on its edit button. The contract's reserved
  properties gain any part holding a `press` and the interactive content after one
  (`position`), and its vectors the `firstChild` expectation. The default theme rings a
  focused `press`. Breaking: a component layout built for `ui_react_layouts-1` is no
  longer hosted — its listing is replaced by `ERR_UI_COMPONENT_ABI_UNSUPPORTED` naming
  `ui_react_layouts-2` at start; rebuild it against `ui_react_layouts-2`. `readsResult`
  now counts a menu item's `to`, its text values and its `shown`, a `link.to`, a
  `value.to`, a list column's `to` and a container press's `to` and label values reading
  `result`."
