  runFails: "[ERR_DATA_MODEL_FILTER_OPERATOR_UNSUPPORTED] RuntimeError: DataModel.Collection 'collection': 'query.filters[1]' uses an operator the property's type does not support ('absent' on 'title', declared string)"
---
kind: Assert.Manifest
metadata: { name: filterReservedName }
source: ./__fixtures__/refusals/filter-reserved-name/lib/telo.yaml
expect:
