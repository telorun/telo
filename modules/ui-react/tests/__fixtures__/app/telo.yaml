# The fixture application: every node, composite and host capability on a page
# of its own, over a collection held in memory. Start it with
#   pnpm run telo ./modules/ui-react/tests/__fixtures__/app/telo.yaml
# and open http://127.0.0.1:19310/admin/
kind: Telo.Application
metadata:
  name: UiFixtureApp
  version: 1.0.0
# Module `lang:` is read from 0.121.0.
requires:
  telo: ">=0.121.0"
lang: en
imports:
  Http: ../../../../http-server
  Font: ../../../../font
  Ui: ../../../../ui
  DataModel: ../../../../data-model
  UiReact: ../../../
  Widgets: ../components
  Views: ../views
  Api: ../collection-api
ports:
  http: { env: PORT, default: 19310 }
targets:
  - !ref server
---
kind: Telo.JsonSchema
metadata:
  name: Todo
schema:
  type: object
  required: [id, text]
  properties:
    id: { type: integer }
    text: { type: string, title: Task, minLength: 1, maxLength: 80 }
    isDone: { type: boolean, title: Done }
    priority: { type: integer, title: Priority, minimum: 1, maximum: 5 }
    status: { title: Status, enum: [open, blocked, done] }
    dueOn: { type: string, title: Due, format: date }
    notes: { type: string, title: Notes, contentMediaType: text/plain }
---
# What a todo is written as: everything but its key.
kind: Telo.JsonSchema
metadata:
  name: TodoInput
schema:
  type: object
  required: [text]
  properties:
    text: { type: string, title: Task, minLength: 1, maxLength: 80 }
    isDone: { type: boolean, title: Done }
    priority: { type: integer, title: Priority, minimum: 1, maximum: 5 }
    status: { title: Status, enum: [open, blocked, done] }
    dueOn: { type: string, title: Due, format: date }
    notes: { type: string, title: Notes, contentMediaType: text/plain }
---
kind: Telo.JsonSchema
metadata:
  name: Note
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
    text: { type: string, title: Text }
---
kind: Api.Collection
metadata:
  name: todosApi
required: [text]
rows:
  - { id: 1, text: Write the plan, isDone: true, priority: 2, status: done, dueOn: "2026-10-01", notes: "" }
  - { id: 2, text: Review the plan, isDone: false, priority: 1, status: open, dueOn: "2026-10-07", notes: "" }
  - { id: 3, text: Ship the renderer, isDone: false, priority: 3, status: blocked, dueOn: "2026-10-09", notes: "" }
  - { id: 4, text: Write the docs, isDone: false, priority: 2, status: open, dueOn: "2026-10-12", notes: "" }
  - { id: 5, text: Record the demo, isDone: false, priority: 5, status: open, dueOn: "2026-10-15", notes: "" }
---
kind: Api.Collection
metadata:
  name: notesApi
rows:
  - { id: 1, text: A note }
---
kind: Http.Static
metadata:
  name: files
root: !module-path ./public
---
# What the todos collection's list accepts.
kind: DataModel.Collection
metadata:
  name: todoCollection
model: !ref Todo
query:
  filters:
    - { property: text, operator: contains }
    - { property: isDone, operator: eq }
    - { property: status, operator: in }
    - { property: priority, operator: gte }
  sort:
    - { property: text }
    - { property: isDone }
    - { property: priority }
    - { property: status }
    - { property: dueOn }
    - { property: notes }
---
kind: Ui.CollectionPresentation
metadata:
  name: todoPresentation
source: { kind: Ui.CollectionSource, collection: !ref todoCollection, basePath: /api/todos }
---
kind: Ui.Form
metadata:
  name: todoForm
model: !ref TodoInput
presentation: !ref todoPresentation
fields: [text, isDone, priority, status, dueOn, notes]
---
kind: Ui.Listing
metadata:
  name: todos
presentation: !ref todoPresentation
model: !ref Todo
pageSize: 2
rowStyle:
  by: !cel "row.isDone"
  cases: { "true": muted }
layout:
  kind: Ui.TableLayout
  columns:
    - value: !cel "row.text"
    - value: !cel "row.priority"
      style:
        by: !cel "row.priority"
        cases: { "1": danger, "2": warning }
    - value: !cel "row.dueOn"
    - header: State
      cell:
        kind: Ui.Component
        component: !ref Widgets.statusPill
        model: !ref Todo
        props:
          done: !cel "row.isDone"
create: { form: !ref todoForm }
edit: { form: !ref todoForm }
delete: true
---
kind: Ui.Filters
metadata:
  name: todoFilters
presentation: !ref todoPresentation
content:
  type: composite
  ref: !ref todos
---
# The whole row model, with nothing listed.
kind: Ui.Listing
metadata:
  name: allColumns
presentation: !ref todoPresentation
model: !ref Todo
---
# The same table, one column shorter.
kind: Ui.Listing
metadata:
  name: publicColumns
presentation: !ref todoPresentation
model: !ref Todo
layout:
  kind: Ui.TableLayout
  columns:
    - value: !cel "row.text"
    - value: !cel "row.dueOn"
---
kind: Ui.Listing
metadata:
  name: internalColumns
presentation: !ref todoPresentation
model: !ref Todo
layout:
  kind: Ui.TableLayout
  columns:
    - value: !cel "row.text"
    - value: !cel "row.dueOn"
    - value: !cel "row.priority"
---
kind: Font.Family
metadata:
  name: testSans
family: Test Sans
faces:
  normal: !include-bytes ./fonts/TestSans-Regular.ttf
---
kind: Font.Family
metadata:
  name: systemMono
family: Menlo
---
kind: Ui.DesignTokens
metadata:
  name: redBrand
color.accent: "#c4341b"
font.body: !ref testSans
font.mono: !ref systemMono
---
kind: Ui.DesignTokens
metadata:
  name: blueBrand
color.accent: "#1f8fff"
radius.md: 2px
---
kind: UiReact.App
metadata:
  name: admin
title: Fixture Admin
words: !ref Ui.words
theme: !ref UiReact.defaultTheme
tokens:
  - tokens: !ref redBrand
    when: !cel "'x-tenant' in request.headers && request.headers['x-tenant'] == 'red'"
  - tokens: !ref blueBrand
stylesheets:
  - !module-path ./ui.css
compactBelow: 48rem
pageWidth: full
pages:
  - kind: Ui.Page
    path: /
    title: Todos
    children:
      - { type: composite, ref: !ref todoFilters }
  - kind: Ui.Page
    path: /done
    title: Done
    children:
      - { type: text, text: Finished work, style: heading }
      - type: composite
        ref:
          kind: Ui.Listing
          presentation: !ref todoPresentation
          model: !ref Todo
          filters: { isDone: true }
          layout:
            kind: Ui.TableLayout
            columns:
              - value: !cel "row.text"
              - value: !cel "row.dueOn"
  - kind: Ui.Page
    path: /all
    title: All columns
    width: contained
    children:
      - { type: composite, ref: !ref allColumns }
  - kind: Ui.Page
    path: /variants
    title: Variants
    children:
      - type: composite
        ref: !ref internalColumns
        when: !cel "'x-role' in request.headers && request.headers['x-role'] == 'staff'"
      - type: composite
        ref: !ref publicColumns
        when: !cel "!('x-role' in request.headers && request.headers['x-role'] == 'staff')"
  - kind: Ui.Page
    path: /new
    title: New todo
    children:
      - { type: composite, ref: !ref todoForm, style: strong }
  - kind: Ui.Page
    path: /components
    title: Components
    children:
      - type: columns
        children:
          - type: composite
            ref: { kind: Ui.Component, component: !ref Widgets.hostProbe, props: { basePath: /api/notes } }
          - type: composite
            ref: { kind: Ui.Component, component: !ref Widgets.counter, props: { step: 2 } }
      - type: composite
        ref: { kind: Ui.Component, component: !ref Widgets.future }
      - type: composite
        ref: { kind: Ui.Component, component: !ref Widgets.unsupplied }
      - type: composite
        ref:
          kind: Ui.Listing
          presentation:
            kind: Ui.CollectionPresentation
            source:
              kind: Ui.CollectionSource
              basePath: /api/notes
              collection:
                kind: DataModel.Collection
                model: !ref Note
                query: { filters: [], sort: [{ property: text }] }
          model: !ref Note
          layout:
            kind: Ui.TableLayout
            columns:
              - value: !cel "row.text"
  - kind: Ui.Page
    path: /layouts
    title: Layouts
    children:
      - type: composite
        ref: { kind: Ui.Listing, presentation: !ref todoPresentation, model: !ref Todo, layout: { kind: Widgets.RecordStrip, title: Todos } }
      - type: composite
        ref:
          kind: Ui.Listing
          presentation: !ref todoPresentation
          model: !ref Todo
          layout:
            kind: Ui.ComponentLayout
            component: !ref Widgets.recordStrip
            props:
              title: Tasks
              text: !cel "row.text"
      - type: composite
        ref:
          kind: Ui.Listing
          presentation: !ref todoPresentation
          model: !ref Todo
          layout: { kind: Ui.ComponentLayout, component: !ref Widgets.misbuiltStrip }
  - kind: Ui.Page
    path: /gallery
    title: Gallery
    children:
      - type: composite
        ref: { kind: Views.Banner, heading: From a library, caption: Placed as one section }
      - type: stack
        children:
          - { type: text, text: A subheading, style: subheading }
          - type: box
            children:
              - { type: badge, text: !cel "'from ' + request.ip", style: [accent, strong] }
          - { type: link, text: Back to todos, href: / }
          - { type: link, text: Telo, href: "https://telo.run" }
          - { type: image, src: /files/logo.svg, alt: Logo }
          - { type: svg, markup: "<svg xmlns='http://www.w3.org/2000/svg' width='40' height='12'><rect width='40' height='12' fill='#1f8a4c'/></svg>", alt: A green bar }
          - { type: link, text: !cel "'unsafe'", href: !cel "'x-next' in request.headers ? request.headers['x-next'] : '/'" }
---
# An application that sets nothing it does not have to.
kind: UiReact.App
metadata:
  name: plain
title: Plain
words: !ref Ui.words
theme: !ref UiReact.defaultTheme
pages:
  - kind: Ui.Page
    path: /
    title: Home
    children:
      - { type: text, text: Nothing else }
---
# Full-width pages and header nodes, its header's width left to `pageWidth`.
kind: UiReact.App
metadata:
  name: wide
title: Wide
words: !ref Ui.words
theme: !ref UiReact.defaultTheme
pageWidth: full
header:
  start:
    - { type: text, text: Wide }
pages:
  - kind: Ui.Page
    path: /
    title: Home
    children:
      - { type: text, text: Across the screen }
---
# A look of its own: a stylesheet, token defaults and a control set drawing
# the box control in place of the built-in.
kind: UiReact.App
metadata:
  name: themed
title: Themed
words: !ref Ui.words
theme:
  kind: UiReact.Theme
  tokens: { kind: Ui.DesignTokens, color.accent: "#1f8a4c" }
  stylesheets:
    - !module-path ./look.css
  controls:
    - !ref Widgets.controls
header:
  width: full
pages:
  - kind: Ui.Page
    path: /
    title: New todo
    children:
      - { type: composite, ref: !ref todoForm }
---
kind: Http.Server
metadata:
  name: server
listen:
  address: 127.0.0.1
  port: !cel "ports.http"
mounts:
  - path: /api/todos
    mount: !ref todosApi
  - path: /api/notes
    mount: !ref notesApi
  - path: /admin/files
    mount: !ref files
  - path: /admin
    mount: !ref admin
  - path: /plain
    mount: !ref plain
  - path: /wide
    mount: !ref wide
  - path: /themed
    mount: !ref themed
