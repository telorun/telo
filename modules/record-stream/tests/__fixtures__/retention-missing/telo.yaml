# A journal that keeps neither ended keys nor removal markers for any stated
# time: refused by `telo check` at the declaration, and by the controller when
# the resource is created.
kind: Telo.Library
metadata:
  name: RetentionMissing
imports:
  RecordStream: ../../..
exports:
  resources: [journal]
---
kind: RecordStream.Journal
metadata: { name: journal }
store: { kind: RecordStream.MemoryJournalStore }
