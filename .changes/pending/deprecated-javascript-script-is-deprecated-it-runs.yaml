modules:
  modules/javascript: Deprecated
body: >-
  `JavaScript.Script` is deprecated. It runs unchanged and existing manifests keep
  working, but declaring it now reports a `DEPRECATED_KIND` warning at the resource's
  `kind:` line in `telo check` and in the editor.


  A body of JavaScript is opaque to every guarantee the rest of the runtime rests on: it
  cannot be type-checked, and it cannot be rendered in a visual editor.


  No `replacedBy` is declared, because what replaces a script depends on what the script
  does — value shaping and control flow move to the `Run` kinds with CEL, and reaching an
  API nothing else exposes is what a resource kind is for. Naming one successor here
  would be a link a consumer follows to the wrong place.
