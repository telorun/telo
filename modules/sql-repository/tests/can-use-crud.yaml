kind: Telo.Application
metadata:
  name: CanUseCrud
  version: 1.0.0
imports:
  Sql: ../../sql
  SQLite: ../../sqlite
  SqlRepository: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref appSchema
  - !ref TestCrud
---
kind: SQLite.Connection
metadata:
  name: Db
file: ":memory:"
---
kind: SQLite.Table
metadata:
  name: users
table: users
columns:
  id: { type: integer, primaryKey: true, identity: always }
  name: { type: text, nullable: false }
---
kind: SQLite.Schema
metadata:
  name: appSchema
connection: !ref Db
version: !cel "module.version"
tables: [!ref users]
---
kind: SqlRepository.Create
metadata:
  name: InsertUser
connection: !ref Db
table: !ref users
---
kind: SqlRepository.Read
metadata:
  name: GetUsers
connection: !ref Db
table: !ref users
---
kind: SqlRepository.Delete
metadata:
  name: DeleteUser
connection: !ref Db
table: !ref users
---
kind: Run.Sequence
metadata:
  name: TestCrud
steps:
  - name: Insert
    inputs:
      data:
        name: Alice
    invoke: !ref InsertUser

  - name: Read
    inputs:
      filters: {}
    invoke: !ref GetUsers

  - name: AssertRead
    inputs:
      rows: "${{ steps.Read.result.rows }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          rows:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                name:
                  const: Alice

  - name: Delete
    inputs:
      filters:
        name: Alice
    invoke: !ref DeleteUser

  - name: ReadAfterDelete
    inputs:
      filters: {}
    invoke: !ref GetUsers

  - name: AssertEmpty
    inputs:
      rows: "${{ steps.ReadAfterDelete.result.rows }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          rows:
            type: array
            maxItems: 0
