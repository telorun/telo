# A malformed selector passed through a call's `inputs:` is refused by `telo check`
# against the invoked kind's `inputType`…
kind: Telo.Application
metadata:
  name: CssSelectorInputs
imports:
  Run: ../../../modules/run
targets:
  - !ref main
---
kind: Telo.Definition
metadata:
  name: Match
capability: Telo.Invocable
schema:
  type: object
inputType:
  type: object
  properties:
    selector:
      type: string
      format: css-selector
invoke: !ref echo
resources:
  - kind: Run.Value
    metadata:
      name: echo
    value: matched
---
kind: Run.Sequence
metadata:
  name: main
steps:
  - name: match
    invoke:
      kind: Self.Match
    inputs:
      selector: "p::before"
