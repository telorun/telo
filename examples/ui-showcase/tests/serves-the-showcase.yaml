    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/records/1" }
  - name: verifyRecords
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        menu: !cel "steps.records.result.body.children[0].children[27].children[0].items.map(i, i.to)"
        press: !cel "steps.records.result.body.children[0].children[27].children[1].press"
        fullPage: !cel "steps.records.result.body.children[0].children[27].children[1].layout.content.children[1].to"
        boardCreate: !cel "steps.records.result.body.children[0].children.filter(c, c.type == 'filters' || c.type == 'listing').map(c, c.type == 'listing' ? c : c.content).filter(l, l.layout.type == 'board').map(l, l.create.to)"
        page: !cel "[steps.recordPage.result.body.path, steps.recordPage.result.body.title.message[0], steps.recordPage.result.body.children[0].query.url]"
      expected:
        menu:
          - type: openPage
            href: { path: { value: "/records/{id}" }, pathParams: { id: { value: 1 } }, queryParams: {} }
            surface: { type: dialog, modal: true, size: medium, dismiss: { escape: true, outside: true, closeButton: true } }
            keepsSurface: false
        press:
          to:
            type: openPage
            href: { path: { value: "/records/{id}" }, pathParams: { id: { root: row, path: [id] } }, queryParams: {} }
            surface: { type: drawer, side: end, size: medium, modal: true, dismiss: { escape: true, outside: true, closeButton: true }, address: { name: post } }
            keepsSurface: false
          label:
            lang: en
            message: [ "Open ", { placeholder: title } ]
            values: { title: { root: row, path: [ title ] } }
        fullPage:
          type: navigate
          href: { path: { value: "/records/{id}" }, pathParams: { id: { root: row, path: [id] } }, queryParams: {} }
        # A board column's create button opens the new-post page with its status.
        boardCreate:
          - type: openPage
            href: { path: { value: /records/posts/new }, pathParams: {}, queryParams: { status: { root: values, path: [ status ] } } }
            surface: { type: dialog, modal: true, size: medium, dismiss: { escape: true, outside: true, closeButton: true } }
            keepsSurface: true
        page:
          - "/records/{id}"
          - Post
          - path: { value: "/api/posts/{id}" }
            pathParams: { id: { root: params, path: [id] } }
            queryParams: {}
