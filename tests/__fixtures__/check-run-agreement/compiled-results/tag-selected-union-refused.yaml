# An expression under a union its written `type` tag decides: typed as the
# tagged branch's `x`, though the other branch's would take it.
kind: Telo.Application
metadata: { name: TagSelectedUnion, version: 1.0.0 }
imports: { Run: ../../../../modules/run }
targets:
  - invoke: !ref holder
---
kind: Telo.Definition
metadata: { name: Holder }
capability: Telo.Invocable
schema:
  type: object
  properties:
    cfg:
      x-telo-eval: compile
      oneOf:
        - type: object
          required: [type]
          properties: { type: { const: count }, x: { type: integer } }
        - type: object
          required: [type]
          properties: { type: { const: name }, x: { type: string } }
resources:
  - kind: Run.Value
    metadata: { name: out }
    value: !cel "self.cfg"
invoke: !ref out
---
kind: Self.Holder
metadata: { name: holder }
cfg:
  type: count
  x: !cel "'s'"
