  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/sqi.traineddata.gz:
        { upstream: sqi, member: package/4.0.0_best_int/sqi.traineddata.gz, sha256: a84023c64e1c0910f8fddc25d13f2dbe1157ce2f478abb48adc8013de9b108f1, executable: false }
---
kind: TesseractModel.Language
metadata:
