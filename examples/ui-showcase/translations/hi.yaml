# The showcase in Hindi: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads and translated into Hindi's two cases, `one` (0 and 1) and `other`; a
# word told apart by its context is translated once per context.
kind: I18n.Catalog
metadata:
  name: hindi
lang: hi
texts:
  # Applications and pages.
  - { text: UI showcase, translation: "UI शोकेस" }
  - { text: UI showcase — Radix, translation: "UI शोकेस — Radix" }
  - { text: UI showcase — brand, translation: "UI शोकेस — ब्रांड" }
  - { text: UI showcase — sidebar, translation: "UI शोकेस — साइडबार" }
  - { text: Overview, translation: "अवलोकन" }
  - { text: Conditions, translation: "शर्तें" }
  - { text: Data, translation: "डेटा" }
  - { text: Tables, translation: "तालिकाएँ" }
  - { text: Filters, translation: "फ़िल्टर" }
  - { text: Forms, translation: "फ़ॉर्म" }
  - { text: Actions, translation: "कार्रवाइयाँ" }
  - { text: Components, translation: "कॉम्पोनेंट" }
  - { text: CRUD, translation: "CRUD" }
  - { text: Themes, translation: "थीम" }
  # The navigation's groups.
  - { text: Building blocks, translation: "बिल्डिंग ब्लॉक" }
  - { text: Input, translation: "इनपुट" }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: "UI शोकेस लोगो" }
  - { text: Language, translation: "भाषा" }
  - { text: Theme, translation: "थीम" }
  - { text: Default, translation: "डिफ़ॉल्ट" }
  - { text: Radix, translation: "Radix" }
  - { text: Brand, translation: "ब्रांड" }
  - { text: Sidebar, translation: "साइडबार" }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: "हर अनुरोध पर" }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "ये नोड पेज के अपने हैं, इसलिए इनका when और इनका टेक्स्ट हर अनुरोध पर मूल्यांकित होता है।" }
  - { text: Your browser asked for Polish., translation: "आपके ब्राउज़र ने पोलिश भाषा माँगी।" }
  - { text: Your browser did not ask for Polish., translation: "आपके ब्राउज़र ने पोलिश भाषा नहीं माँगी।" }
  - { text: The Acme brand is on., translation: "Acme ब्रांड चालू है।" }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "किसी एक्सप्रेशन से गणना किया गया टेक्स्ट वैसा ही दिखाया जाता है जैसा उसकी गणना हुई, उसका अनुवाद कभी नहीं होता।" }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "जिस लिंक को यह अनुरोध अमान्य बना देता है, उसकी जगह एक त्रुटि नोड आ जाता है, और पेज का बाकी हिस्सा भेजा जाता है।" }
  - { text: Leaves the application, translation: "ऐप्लिकेशन से बाहर ले जाता है" }

  # The overview.
  - { text: Every node type, translation: "हर प्रकार का नोड" }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "बॉक्स, स्टैक और कॉलम दूसरे नोड रखते हैं, और हर एक अपने चाइल्ड नोड अपने तरीके से बनाता है।" }
  - { text: A box, translation: "एक बॉक्स" }
  - { text: Groups its children., translation: "अपने चाइल्ड नोड को समूहित करता है।" }
  - { text: A stack, translation: "एक स्टैक" }
  - { text: Draws its children one under another., translation: "अपने चाइल्ड नोड एक के नीचे एक बनाता है।" }
  - { text: A badge, translation: "एक बैज" }
  - { text: Columns, translation: "कॉलम" }
  - { text: "Draw their children side by side, as these three are.", translation: "अपने चाइल्ड नोड अगल-बगल बनाते हैं, जैसे ये तीन हैं।" }
  - { text: Text in each style, translation: "हर स्टाइल में टेक्स्ट" }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "स्टाइल बताती है कि नोड का अर्थ क्या है; थीम तय करती है कि वह कैसा दिखे। एक नोड में कई स्टाइल हो सकती हैं।" }
  - { text: Heading, translation: "शीर्षक" }
  - { text: Subheading, translation: "उपशीर्षक" }
  - { text: Muted, translation: "धुंधला" }
  - { text: Strong, translation: "प्रमुख" }
  - { text: Accent, translation: "एक्सेंट" }
  - { text: Danger, translation: "खतरा" }
  - { text: Warning, translation: "चेतावनी" }
  - { text: Success, translation: "सफलता" }
  - { text: Strong and accent, translation: "प्रमुख और एक्सेंट" }
  - { text: Links, translation: "लिंक" }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "घोषित पेज का लिंक ऐप्लिकेशन के भीतर ही ले जाता है; माउंट के अंतर्गत सर्व की गई फ़ाइल सामान्य रूप से लोड होती है; https और mailto ऐप्लिकेशन से बाहर ले जाते हैं।" }
  - { text: Go to Conditions, translation: "शर्तों पर जाएँ" }
  - { text: A file the server serves, translation: "सर्वर द्वारा सर्व की गई फ़ाइल" }
  - { text: Write to us, translation: "हमें लिखें" }
  - { text: Images, translation: "चित्र" }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "पते से एक चित्र, वही चित्र खाली alt के साथ सजावट के रूप में, और चित्र के रूप में बनाया गया SVG मार्कअप, जिसे पेज में कभी नहीं डाला जाता।" }
  - { text: The showcase mark, translation: "शोकेस का चिह्न" }
  - { text: Three overlapping circles, translation: "एक-दूसरे पर चढ़े तीन वृत्त" }
  - { text: Values by their schema, translation: "स्कीमा के अनुसार मान" }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "हर मान वैसे बनाया जाता है जैसा उसकी मॉडल प्रॉपर्टी कहती है, और उसे उस टीम रिकॉर्ड से पढ़ा जाता है जिसे पेज लोड करता है।" }
  - { text: Visit the team homepage, translation: "टीम का होमपेज देखें" }
  - { text: "A uri, drawn as a link with a text of its own", translation: "एक uri, जो अपने टेक्स्ट वाले लिंक के रूप में बनाया गया है" }
  - { text: A uri-reference to a declared page, translation: "घोषित पेज का uri-reference" }
  - { text: A uri-reference to a served file, translation: "सर्व की गई फ़ाइल का uri-reference" }
  - { text: A mailto address, translation: "एक mailto पता" }
  - { text: "An address the rule refuses, drawn as plain text", translation: "नियम द्वारा अस्वीकार किया गया पता, सादे टेक्स्ट के रूप में बनाया गया" }
  - { text: A date, translation: "एक तारीख" }
  - { text: A date and time, translation: "तारीख और समय" }
  - { text: A boolean, translation: "एक बूलियन" }
  - { text: An enumeration's label, translation: "एन्यूमरेशन का लेबल" }
  - { text: A list, translation: "एक सूची" }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "एक उत्तर में मौजूद पंक्तियाँ, बिना पेजों में बाँटे। हेडर डिफ़ॉल्ट रूप से प्रॉपर्टी का शीर्षक होता है, और आखिरी कॉलम तभी दिखता है जब टीम भर्ती कर रही हो।" }
  - { text: Projects under way, translation: "चल रहे प्रोजेक्ट" }
  - { text: Project, translation: "प्रोजेक्ट" }
  - { text: Texts, translation: "टेक्स्ट" }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": "अभी तक कोई प्रोजेक्ट नहीं।"
        one: "अब तक {$count} प्रोजेक्ट।"
        other: "अब तक {$count} प्रोजेक्ट।"
  - { text: "{$team} started {$project} most recently.", translation: "{$team} ने सबसे हाल में {$project} शुरू किया।" }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "ब्राउज़र में पढ़ी गई संख्या के लिए चुना गया बहुवचन, और ऐसा टेक्स्ट जिसके मान रिकॉर्ड से आते हैं।" }
  - { text: Open, context: state, translation: "खुला" }
  - { text: Open, context: verb, translation: "खोलें" }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "नोड का अपना टेक्स्ट भी इसी तरह अलग पहचाना जाता है: बैज बताता है कि TEL-42 खुला है, और लिंक उसके कार्य खोलने का विकल्प देता है।" }
  - { text: Style rules, translation: "स्टाइल नियम" }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "पंक्ति और सेल की स्टाइल पंक्ति के किसी मान से चुनी जाती है। विशेष प्रोजेक्ट प्रमुख दिखता है, हर स्थिति का अपना रंग है, और जिस स्थिति का नाम किसी केस में नहीं है उसे डिफ़ॉल्ट स्टाइल मिलती है। दो कॉलम के हेडर में एक ही शब्द है, Open, जिसे हर हेडर के साथ लिखे संदर्भ से अलग पहचाना जाता है।" }
  - { text: Composites, translation: "कंपोज़िट" }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "यह पूरा पेज एक व्यू है जिसे हर ऐप्लिकेशन संदर्भ से रखता है। नीचे, एक व्यू जो वहीं लिखा गया है जहाँ उसे रखा गया है, और इस उदाहरण का अपना एक कंपोज़िट प्रकार, जिसका कोई कंट्रोलर नहीं है।" }
  - { text: A view declared inline at the node that places it., translation: "वह व्यू जो उसे रखने वाले नोड में ही घोषित है।" }
  - { text: A callout, translation: "एक कॉलआउट" }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "एक बार ऐसे प्रकार के रूप में घोषित, जो Ui.Composite को विस्तारित करता है और एक व्यू देता है, और अपने फ़ील्ड के साथ रखा गया।" }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: "टैब" }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "टैब में सामग्री, एक बार में एक टैब। चुना गया टैब पेज के पते का हिस्सा है, इसलिए रीलोड करने या साझा किए गए लिंक से वह फिर खुलता है।" }
  - { text: Summary, translation: "सारांश" }
  - { text: "A tab holds any nodes, as a box does.", translation: "टैब में कोई भी नोड हो सकते हैं, जैसे बॉक्स में।" }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "केवल चुने गए टैब के नोड बनाए जाते हैं।" }
  - { text: Chosen, translation: "चुना गया" }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "हर टैब अपने when के अनुसार भेजा जाता है, किसी भी नोड की तरह।" }
  # The labels of the overview's models.
  - { text: Code, translation: "कोड" }
  - { text: Name, translation: "नाम" }
  - { text: Status, translation: "स्थिति" }
  - { text: Active, translation: "सक्रिय" }
  - { text: Paused, translation: "रुका हुआ" }
  - { text: Finished, translation: "पूरा हुआ" }
  - { text: Budget, translation: "बजट" }
  - { text: Started, translation: "शुरू हुआ" }
  - { text: Free, context: subscription, translation: "निःशुल्क" }
  - { text: Enterprise, context: subscription, translation: "एंटरप्राइज़" }
  - { text: Version, translation: "संस्करण" }
  - { text: Team, context: subscription, translation: "टीम" }

  # Conditions.
  - { text: Delivered and drawn, translation: "भेजा और बनाया गया" }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "नोड का when सर्वर पर तय करता है कि वह भेजा जाए या नहीं; उसका shown ब्राउज़र में तय करता है कि भेजा गया नोड बनाया जाए या नहीं।" }
  - { text: Never delivered — this node is not in the page document., translation: "कभी नहीं भेजा गया — यह नोड पेज दस्तावेज़ में नहीं है।" }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "भेजा गया पर कभी नहीं बनाया गया: स्थिति paused नहीं है, इसलिए ब्राउज़र इसे नज़र से दूर रखता है।" }
  - { text: Delivered by its when and drawn by its shown., translation: "अपने when से भेजा गया और अपने shown से बनाया गया।" }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "जिस कंपोज़िट के नोड की अपनी शर्त है, उसके चारों ओर रखने की शर्त एक बॉक्स में लपेटी जाती है, और दोनों का पूरा होना ज़रूरी है।" }
  - { text: Both conditions hold., translation: "दोनों शर्तें पूरी हैं।" }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "जिस व्यू की सामग्री उसका अपना when बंद कर देता है, वह कोई नोड नहीं देता, इसलिए उसे रखने वाला कंपोज़िट छोड़ दिया जाता है।" }
  - { text: Never provided., translation: "कभी नहीं दिया गया।" }
  - { text: Every keyword of a condition, translation: "शर्त का हर कीवर्ड" }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "नीचे की हर पंक्ति इसलिए बनी है क्योंकि उसकी शर्त इस पेज द्वारा पढ़े गए प्रोजेक्ट TEL-42 के सारांश पर पूरी होती है: स्थिति active, चार सदस्य, वेलोसिटी 2.5, टैग design और web, लीड एक मैनेजर, note null और कोई codename नहीं।" }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: इस पर 1 से 10 लोग काम करते हैं।" }
  - { text: "required: the lead has an e-mail.", translation: "required: लीड का ई-मेल है।" }
  - { text: "properties: the lead is a manager.", translation: "properties: लीड एक मैनेजर है।" }
  - { text: "minimum: at least three people work on it.", translation: "minimum: इस पर कम से कम तीन लोग काम करते हैं।" }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: इस पर अधिकतम नौ लोग काम करते हैं।" }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: वेलोसिटी 2 से अधिक है।" }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: वेलोसिटी 3 से कम है।" }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: वेलोसिटी 0.5 का गुणज है।" }
  - { text: "type: the status is a string.", translation: "type: स्थिति एक स्ट्रिंग है।" }
  - { text: "type, as a list: the note is a string or null.", translation: "type, सूची के रूप में: note एक स्ट्रिंग या null है।" }
  - { text: "const: the status is active.", translation: "const: स्थिति active है।" }
  - { text: "enum: the status is active or paused.", translation: "enum: स्थिति active या paused है।" }
  - { text: "not: the status is not paused.", translation: "not: स्थिति paused नहीं है।" }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code TEL या OPS से शुरू होता है।" }
  - { text: "items: every tag has at least two letters.", translation: "items: हर टैग में कम से कम दो अक्षर हैं।" }
  - { text: "minItems: there are at least two tags.", translation: "minItems: कम से कम दो टैग हैं।" }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: अधिकतम पाँच टैग हैं।" }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: कोई टैग दोहराया नहीं गया है।" }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code में कम से कम तीन वर्ण हैं।" }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code में अधिकतम दस वर्ण हैं।" }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code में अक्षर, एक डैश और अंक हैं।" }
  - { text: Missing and null, translation: "अनुपस्थित और null" }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null एक मौजूद मान है। अनुपस्थित मान कोई शर्त पूरी नहीं करता, not के अंतर्गत वाली भी नहीं, इसलिए अनुपस्थिति की जाँच पैरेंट पर की जाती है।" }
  - { text: The note is present and null., translation: "note मौजूद है और null है।" }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "कभी नहीं बनाया गया: अनुपस्थित codename not को पूरा नहीं करता।" }
  - { text: "The project has no codename, tested on the summary.", translation: "प्रोजेक्ट का कोई codename नहीं है, सारांश पर जाँचा गया।" }
  - { text: Query parameters, translation: "क्वेरी पैरामीटर" }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "यह रीडर mode, tag मानों की एक सूची और एक पैटर्न से बँधा ticket घोषित करता है। पते में छोड़ा गया पैरामीटर, दो बार दिया गया एकल पैरामीटर, या घोषणा द्वारा अस्वीकार किया गया मान अनुपस्थित माना जाता है।" }
  - { text: Mode detailed, translation: "मोड detailed" }
  - { text: Two tags, translation: "दो टैग" }
  - { text: A valid ticket, translation: "मान्य ticket" }
  - { text: A refused ticket, translation: "अस्वीकृत ticket" }
  - { text: Mode given twice, translation: "मोड दो बार दिया गया" }
  - { text: Clear the query, translation: "क्वेरी साफ़ करें" }
  - { text: mode is detailed., translation: "mode detailed है।" }
  - { text: There are two tag values or more., translation: "दो या अधिक tag मान हैं।" }
  - { text: The ticket matches its pattern., translation: "ticket अपने पैटर्न से मेल खाता है।" }
  - { text: "No ticket, or one its pattern refuses.", translation: "कोई ticket नहीं, या ऐसा जिसे उसका पैटर्न अस्वीकार करता है।" }
  - { text: Enablement, translation: "सक्षमता" }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "बटन तभी दबाया जा सकता है जब फ़ॉर्म में मौजूद डेटा पर उसकी शर्त पूरी हो, और जब तक पूरी न हो, वह कारण बताता है। जो टैग प्रोजेक्ट में पहले से है, उसे अस्वीकार किया जाता है, और टैग जुड़ने के बाद ऊपर की पंक्तियाँ सारांश फिर से पढ़ती हैं।" }
  - { text: Tag TEL-42, translation: "TEL-42 को टैग करें" }
  - { text: Tag, translation: "टैग" }
  - { text: Type a tag of three letters or more., translation: "तीन या अधिक अक्षरों का टैग लिखें।" }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation:
      plural: count
      cases:
        one: "{$tag} जोड़ा गया: TEL-42 में अब {$count} टैग है।"
        other: "{$tag} जोड़ा गया: TEL-42 में अब {$count} टैग हैं।"
  - { text: A page's own query, translation: "पेज की अपनी क्वेरी" }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "यह पेज भी mode घोषित करता है, और उसके अपने नोड उसे पढ़ते हैं।" }
  - { text: The page reads mode as detailed., translation: "पेज mode को detailed पढ़ता है।" }

  # Data.
  - { text: A reader and its parameters, translation: "एक रीडर और उसके पैरामीटर" }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "प्रोजेक्ट पेज के पते का project पैरामीटर है, जो पढ़ने के साथ भेजा जाता है; इसके न होने पर पैरामीटर नहीं भेजा जाता और रूट TEL-42 के लिए उत्तर देता है। ऐसा कोड जो किसी प्रोजेक्ट का नहीं है, विफलता ट्री बनाता है।" }
  - { text: A code no project has, translation: "ऐसा कोड जो किसी प्रोजेक्ट का नहीं है" }
  - { text: No project, translation: "कोई प्रोजेक्ट नहीं" }
  - { text: Reading the project…, translation: "प्रोजेक्ट पढ़ा जा रहा है…" }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, नेतृत्व: {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "इसकी सामग्री में नेस्ट किया गया रीडर उसी प्रोजेक्ट पर काम कर रहे लोगों को पढ़ता है।" }
  - { text: Working on it, translation: "इस पर काम कर रहे लोग" }
  - { text: Role, translation: "भूमिका" }
  - { text: E-mail, translation: "ई-मेल" }
  - { text: "No answer · {$code}", translation: "कोई उत्तर नहीं · {$code}" }
  - { text: Readers that fail, translation: "विफल होने वाले रीडर" }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "अपना विफलता ट्री न होने पर रीडर त्रुटि का कोड और संदेश बनाते हैं — ऐसे प्रोजेक्ट के लिए जो मौजूद नहीं है, बिना सेशन के पढ़े गए सुरक्षित रूट के लिए, और ऐसे उत्तर के लिए जिसे रीडर का मॉडल अस्वीकार करता है (प्रोजेक्ट की सूची को एक प्रोजेक्ट के रूप में पढ़ना)।" }
  - { text: "Never drawn: there is no such project.", translation: "कभी नहीं बनाया गया: ऐसा कोई प्रोजेक्ट नहीं है।" }
  - { text: "Signed in, so this reads: {$name}", translation: "साइन इन है, इसलिए यह पढ़ता है: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "कभी नहीं बनाया गया: सूची कोई प्रोजेक्ट नहीं है।" }
  - { text: Read again on focus, translation: "फ़ोकस मिलने पर दोबारा पढ़ना" }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "जब भी विंडो पर फ़ोकस लौटता है, यह रीडर सर्वर का समय फिर से पढ़ता है। किसी दूसरी विंडो पर जाएँ और वापस आएँ।" }
  - { text: Read at, translation: "पढ़ने का समय" }
  - { text: A sign-in gate, translation: "एक साइन-इन गेट" }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "गेट पढ़ता है कि कोई सेशन खुला है या नहीं, और जब भी उसके भीतर का कोई अनुरोध 401 उत्तर पाता है, फिर से पढ़ता है। साइन इन करने से टीम के किसी सदस्य के लिए सेशन खुलता है; ऐसा ई-मेल जो टीम में किसी का नहीं है, अपने फ़ील्ड पर अस्वीकार किया जाता है। भीतर, एक सुरक्षित रूट पर रीडर खाता दिखाता है। सेशन को चुपचाप खत्म करने पर खाता स्क्रीन पर तब तक बना रहता है जब तक अगला सुरक्षित अनुरोध — नीचे की जाँच, या फ़ोकस — अस्वीकार न हो जाए, और तब गेट साइन-आउट व्यू पर बदल जाता है।" }
  - { text: You are signed out., translation: "आप साइन आउट हैं।" }
  - { text: Sign in, translation: "साइन इन करें" }
  - { text: "Signed in as {$name}", translation: "{$name} के रूप में साइन इन है" }
  - { text: "Member since {$since}", translation: "{$since} से सदस्य" }
  - { text: Check the session, translation: "सेशन जाँचें" }
  - { text: End the session quietly, translation: "सेशन चुपचाप खत्म करें" }
  - { text: Sign out, translation: "साइन आउट करें" }

  # The labels of the task models.
  - { text: Task, translation: "कार्य" }
  - { text: Assignee, translation: "असाइनी" }
  - { text: Priority, translation: "प्राथमिकता" }
  - { text: Estimate, translation: "अनुमान" }
  - { text: Due, translation: "नियत तारीख" }
  - { text: Label, translation: "लेबल" }
  - { text: Blocked, translation: "अवरुद्ध" }
  - { text: To do, translation: "करना है" }
  - { text: In progress, translation: "प्रगति में" }
  - { text: In review, translation: "समीक्षा में" }
  - { text: Bug, translation: "बग" }
  - { text: Feature, translation: "फ़ीचर" }
  - { text: Chore, translation: "रखरखाव" }
  - { text: Docs, translation: "दस्तावेज़" }
  - { text: Contact, translation: "संपर्क" }
  - { text: Project name, translation: "प्रोजेक्ट का नाम" }
  - { text: Brief, translation: "संक्षिप्त विवरण" }

  # Tables.
  - { text: Columns from the model, translation: "मॉडल से कॉलम" }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "कोई कॉलम न लिखे होने पर तालिका पंक्ति कुंजी को छोड़कर हर मॉडल प्रॉपर्टी के लिए एक कॉलम दिखाती है, हर कॉलम का हेडर उसका शीर्षक होता है और उसे उसके प्रकार के अनुसार बनाया जाता है। यह डिफ़ॉल्ट रूप से प्रति पेज 25 पंक्तियाँ दिखाती है, और बनाने व संपादित करने वाले फ़ॉर्म एक डायलॉग में खोलती है — वह सतह जिसे तालिका तब उपयोग करती है जब वह कोई सतह नहीं बताती।" }
  - { text: "Written columns, sorting and style rules", translation: "लिखे गए कॉलम, सॉर्टिंग और स्टाइल नियम" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "हाथ से लिखे कॉलम, दिए गए क्रम में, जिनमें से एक का अपना हेडर है। कोई कॉलम तब सॉर्ट होता है जब कलेक्शन उसकी प्रॉपर्टी को सॉर्टिंग के लिए सूचीबद्ध करता है। अवरुद्ध कार्य की पंक्ति प्रमुख और लाल है, हर स्थिति सेल का अपना रंग है, और जिस प्राथमिकता का नाम किसी केस में नहीं है उसे डिफ़ॉल्ट स्टाइल मिलती है। प्रति पेज आठ पंक्तियाँ।" }
  - { text: Where, translation: "कहाँ" }
  - { text: Members behind a reference, translation: "संदर्भ के पीछे के सदस्य" }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "कार्य बोर्ड हर कार्य को उसके असाइनी और प्रोजेक्ट को उसमें नेस्ट करके लौटाता है। नेस्ट किए गए सदस्य पर बना कॉलम उस सदस्य का शीर्षक और प्रस्तुति लेता है — एक नामित आकार से, मॉडल की अपनी परिभाषा से, और ऐसे संदर्भ से जिसका अपना शीर्षक उसके बताए आकार से ऊपर रहता है: संपर्क एक मेल लिंक है और संक्षिप्त विवरण एक पेज का लिंक।" }
  - { text: Filtered by the address, translation: "पते से फ़िल्टर किया गया" }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "यह तालिका एक project पैरामीटर घोषित करती है और उसे हर अनुरोध के साथ समानता के रूप में भेजती है। पते में प्रोजेक्ट न होने पर यह कुछ नहीं पढ़ती।" }
  - { text: Atlas redesign tasks, translation: "Atlas रीडिज़ाइन के कार्य" }
  - { text: Billing migration tasks, translation: "बिलिंग माइग्रेशन के कार्य" }
  - { text: Blocked tasks, translation: "अवरुद्ध कार्य" }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "यह तालिका में लिखे एक निश्चित मान से फ़िल्टर होती है, और केवल अवरुद्ध कार्य सूचीबद्ध करती है।" }
  - { text: Where a form opens, translation: "फ़ॉर्म कहाँ खुलता है" }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "नीचे की हर तालिका अपने बनाने और संपादित करने वाले फ़ॉर्म अलग सतह पर खोलती है। सहेजने पर पेज की कार्यों वाली हर तालिका फिर से लोड होती है।" }
  - { text: Dialogs, translation: "डायलॉग" }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "बनाना एक छोटे डायलॉग में, जो अगले कार्य के लिए खाली होकर खुला रहता है। संपादन एक बड़े डायलॉग में, जो पेज को ब्लॉक नहीं करता और बाहर के क्लिक को अनदेखा करता है; यह सहेजने के बाद अपने मान रखता है, बिना सहेजा इनपुट बिना पूछे छोड़ देता है, और पते का हिस्सा है। हर पंक्ति पुष्टि के साथ हटाने का विकल्प देती है।" }
  - { text: Drawers, translation: "ड्रॉअर" }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "बनाना शुरुआती किनारे से आने वाले छोटे ड्रॉअर में; संपादन अंतिम किनारे से आने वाले बड़े ड्रॉअर में, बिना बंद करने के बटन के। दोनों सहेजने के बाद बंद हो जाते हैं और बिना सहेजा इनपुट छोड़ने से पहले पूछते हैं।" }
  - { text: Sheets, translation: "शीट" }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "बनाना ऊपर से आने वाली शीट में, जो पेज को ब्लॉक नहीं करती; संपादन नीचे से आने वाली पूरी शीट में, जो पते का हिस्सा है।" }
  - { text: Popovers, translation: "पॉपओवर" }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "बनाना ‘नया’ बटन के बगल में, उसी पर केंद्रित एक कार्ड में; ब्रेकपॉइंट से नीचे यह पूरा डायलॉग बन जाता है। संपादन पंक्ति के बटन के नीचे, उसके अंत से संरेखित एक कार्ड में, जो बाहर क्लिक करने से बंद नहीं होता और सहेजने के बाद खुला रहता है।" }
  - { text: In line, translation: "पेज के भीतर" }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "बनाने वाला फ़ॉर्म पंक्तियों के ऊपर खुलता है और संपादन फ़ॉर्म उस पंक्ति के नीचे जिसे वह बदलता है। ब्रेकपॉइंट से नीचे बनाने वाला फ़ॉर्म नीचे से आने वाली शीट में खुलता है।" }
  - { text: Panels, translation: "पैनल" }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "बनाना शुरुआती किनारे पर छोटे पैनल में, जिसे Escape बंद नहीं करता। संपादन अंतिम किनारे पर बड़े पैनल में, जो पते का हिस्सा है, और उसके बगल में पंक्तियाँ उपयोग योग्य रहती हैं; ब्रेकपॉइंट से नीचे यह नीचे से आने वाली शीट बन जाता है।" }
  - { text: A page of its own, translation: "अपना अलग पेज" }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "बनाना और संपादन एक ही पता नाम के तहत पेज की सामग्री बदल देते हैं, इसलिए पता या तो नया कार्य बताता है या इस कुंजी वाला कार्य, और ‘वापस’ फ़ॉर्म बंद कर देता है। सतह एक बार घोषित है और दोनों उसका नाम लेते हैं।" }

  # Filters.
  - { text: Every filter the collection accepts, translation: "कलेक्शन द्वारा स्वीकार किया जाने वाला हर फ़िल्टर" }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "कोई फ़ील्ड न लिखे होने पर बार कलेक्शन द्वारा स्वीकार किए गए हर फ़िल्टर के लिए एक कंट्रोल बनाता है, उसी के क्रम में और मॉडल की प्रॉपर्टी के अनुसार: एन्यूमरेशन या हाँ/नहीं मान के लिए सूची, अन्यथा टाइप करने का बॉक्स, और रेंज की दोनों सीमाओं पर एक लेबल। यह तालिका के ऊपर रहता है, चुनाव तुरंत लागू करता है और टाइप किया गया टेक्स्ट Enter दबाने पर, और विज़िट के बीच कुछ नहीं रखता।" }
  - { text: Every control, translation: "हर कंट्रोल" }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "फ़िल्टर दर्ज करने का हर तरीका: टाइप किया गया टेक्स्ट, अगल-बगल विकल्प, सूची, टाइप किए गए टैग, स्लाइडर, स्विच, और एक लेबल के नीचे दो तारीखें। प्रोजेक्ट फ़िल्टर कहीं नहीं बनाया जाता और उसे केवल प्रीसेट सेट करता है। स्थिति अपने डिफ़ॉल्ट से शुरू होती है, और प्रीसेट उन फ़िल्टर को सेट करता है जिनका नाम प्रीसेट लेते हैं और उनके बताए बाकी फ़िल्टर साफ़ करता है। चिप चुने गए मानों का सारांश देते हैं, और मान पते का हिस्सा हैं। ब्रेकपॉइंट से नीचे बार सिमट जाता है, और पिन किया गया टेक्स्ट फ़िल्टर सिमटे हिस्से से बाहर रहता है।" }
  - { text: Urgent, translation: "अत्यावश्यक" }
  - { text: Atlas only, translation: "केवल Atlas" }
  - { text: Stuck, translation: "अटका हुआ" }
  - { text: "Beside, as chips, while typing", translation: "बगल में, चिप के रूप में, टाइप करते समय" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "कंट्रोल शुरुआती किनारे पर एक कॉलम में रहते हैं। केवल आपके चुने गए फ़िल्टर दिखते हैं: बार की सूची से एक जोड़ें, और उसे हटाने से वह साफ़ हो जाता है। हर फ़िल्टर अपना मान बताने वाली एक चिप है, जो उसका कंट्रोल खोलती है। टाइप किया गया टेक्स्ट थोड़ा रुकने के बाद लागू होता है, और किसी संख्या की दोनों सीमाओं पर ‘के बाद’ और ‘से पहले’ लिखा होता है। चुनाव इस ब्राउज़र में विज़िट के बीच रखा जाता है। ब्रेकपॉइंट से नीचे बार नीचे से आने वाली शीट में खुलता है।" }
  - { text: "Beside at the end, applied by a button", translation: "अंतिम किनारे पर बगल में, बटन से लागू" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "कंट्रोल अंतिम किनारे पर रहते हैं, और बदलाव ‘लागू करें’ का इंतज़ार करता है, जबकि प्रीसेट, ‘रीसेट करें’ और सारांश चिप हटाना तुरंत लागू होते हैं। कई असाइनी अल्पविराम से अलग करके टाइप किए जाते हैं। चुनाव केवल इस टैब के लिए रखा जाता है, और रीलोड के बाद भी बना रहता है।" }
  - { text: Due by October, translation: "अक्टूबर तक नियत" }
  - { text: "Folded, starting open", translation: "सिमटने वाला, शुरू में खुला" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "कंट्रोल एक टॉगल के पीछे सिमटते हैं जो मान वाले फ़िल्टर गिनता है, और शुरू में खुले रहते हैं। पिन किया गया टेक्स्ट फ़िल्टर सिमटे हिस्से से बाहर रहता है, और बाकी बार की सूची से जोड़े जाते हैं। स्थिति ‘प्रगति में’ से शुरू होती है; उसे हटाने से वह डिफ़ॉल्ट भी साफ़ हो जाता है, और ‘रीसेट करें’ उसे वापस लाता है। मान पते और इस ब्राउज़र दोनों में रखे जाते हैं, जिनमें पता प्राथमिक रहता है, और आपका चुना हुआ सिमटाव याद रखा जाता है।" }
  - { text: "Folded, starting closed", translation: "सिमटने वाला, शुरू में बंद" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "शुरू में सिमटा हुआ। पिन किया गया टेक्स्ट फ़िल्टर, ‘लागू करें’ और ‘रीसेट करें’ सिमटे हिस्से से बाहर रहते हैं। लेबल बदले जाने तक अपने डिफ़ॉल्ट, बग, पर रहता है, और ‘रीसेट करें’ डिफ़ॉल्ट वापस लाता है।" }
  - { text: In a dialog, translation: "डायलॉग में" }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "कंट्रोल ऐसे बटन से छोटे डायलॉग में खुलते हैं जो मान वाले फ़िल्टर गिनता है, और ‘हो गया’ से बंद होते हैं। खुला डायलॉग पते का हिस्सा है, इसलिए लिंक उसे खोलता है। पिन किया गया टेक्स्ट फ़िल्टर बटन के बगल में रहता है, और चिप चुने गए मानों का सारांश देते हैं।" }
  - { text: In a drawer, translation: "ड्रॉअर में" }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "कंट्रोल शुरुआती किनारे से आने वाले ड्रॉअर में खुलते हैं, जो बाहर क्लिक करने से बंद नहीं होता। टाइप किए गए मान थोड़ा रुकने के बाद लागू होते हैं।" }
  - { text: In a popover, translation: "पॉपओवर में" }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "कंट्रोल बटन के नीचे, उसके अंत से संरेखित एक कार्ड में खुलते हैं; ब्रेकपॉइंट से नीचे, नीचे से आने वाली शीट में।" }

  # The labels of the forms page's models.
