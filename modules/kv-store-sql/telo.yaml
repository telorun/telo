kind: Telo.Library
metadata:
  name: kv-store-sql
  version: 0.4.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Storage]
  description: |
    Durable key/value storage with atomic conditional writes, kept in a table on a
    database you already run. Every write is a single statement carrying its own
    condition, so the database settles races between processes and hosts with no
    read-then-write window on the client. Speaks PostgreSQL and SQLite.
imports:
  KvStore: ../kv-store
  Sql: ../sql
exports:
  kinds:
    - Store
---
# KvStoreSql.Store — one row per key: value, revision, expiry.
#
# Expiries are stored as epoch milliseconds supplied by the WRITING process, not
# as database `now()`. That keeps the SQL dialect-neutral, at the cost of
# depending on roughly-aligned clocks across instances: a host whose clock runs
# far ahead can consider another writer's record expired early. Keep hosts on
# NTP, and size TTLs well above both the work's duration and any expected skew.
kind: Telo.Definition
metadata:
  name: Store
  description: >-
    Keeps records in a table on an existing database connection, one row per key,
    settling each conditional write in a single guarded statement. Creates its table
    on start-up unless the application's own migrations own it.
capability: Telo.Provider
extends: KvStore.Store
controllers:
  - pkg:telo/local/js?path=./nodejs/store.mjs&local_path=./nodejs/src/store.ts#store
schema:
  type: object
  required: [connection]
  additionalProperties: false
  properties:
    connection:
      title: Connection
      description: Reference to the Sql.Connection this store reads and writes through.
      x-telo-ref: Sql.Connection
    table:
      title: Table
      type: string
      default: telo_kv_store
      x-telo-eval: compile
      description: >-
        Table holding the key/value records. Use distinct tables to isolate
        unrelated key spaces that share a database.
    createTable:
      title: Create Table
      type: boolean
      default: true
      x-telo-eval: compile
      description: >-
        Whether to `CREATE TABLE IF NOT EXISTS` on init. Set false when the table
        is owned by the app's own migrations, or when the runtime user holds no
        DDL grant — where an unconditional CREATE would fail the boot.
