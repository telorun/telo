# A collection `telo check` refuses where it is declared; a consumer's check
# sees nothing, so there the collection refuses itself when it is created.
kind: Telo.Library
metadata:
  name: DataModelSearchUnknownProperty
  version: 1.0.0
  description: Test fixture exporting a collection refused as DATA_MODEL_SEARCH_UNKNOWN_PROPERTY.
imports:
  DataModel: ../../../../../
exports:
  resources: [collection]
---
kind: Telo.JsonSchema
metadata: { name: Post }
schema:
  type: object
  required: [id, title, authorId]
  properties:
    id: { type: integer }
    title: { type: string }
    body: { type: [string, "null"] }
    authorId: { type: integer }
---
kind: DataModel.Collection
metadata: { name: collection }
model: !ref Post
query:
  search: { properties: [title, summary] }
  filters: []
  sort: []
