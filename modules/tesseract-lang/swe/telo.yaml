  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/swe.traineddata.gz:
        { upstream: swe, member: package/4.0.0_best_int/swe.traineddata.gz, sha256: b60d9fea7e570d11d6fdf26c8d0ef1d63b49222313773ce66777ed08fa20dc5a, executable: false }
---
kind: TesseractModel.Language
metadata:
