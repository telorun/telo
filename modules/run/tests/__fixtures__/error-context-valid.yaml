kind: Telo.Library
metadata:
  name: ErrorContextValidFixture
  version: 1.0.0
imports:
  Run: ../..
---
# Every error field accessed inside the catch is valid → zero analyzer errors.
kind: Run.Sequence
metadata:
  name: validSeq
steps:
  - name: outer
    try:
      - name: work
        invoke:
          kind: Run.Value
          value: 1
    catch:
      - name: rethrow
        throw:
          code: !cel "error.code"
          message: !interpolate "${{ error.message }} at ${{ error.step }}"
          data: !cel "error.data"
    finally:
      # error is nullable here — a null-guarded access is valid.
      - name: cleanup
        throw:
          code: !cel "error == null ? 'DONE' : error.code"
          message: "cleanup"
