kind: Telo.Application
metadata:
  name: HttpClientTest
  version: 1.0.0
imports:
  Http: ../modules/http-client
  Run: ../modules/run
  Assert: ../modules/assert
targets:
  - !ref testGetAbsoluteUrl
  - !ref testGetWithClient
  - !ref testPostWithJsonBody
  - !ref testNotFoundDoesNotThrow
---
# Shared Http.Client with baseUrl for tests that exercise client resolution
kind: Http.Client
metadata:
  name: placeholderApi
baseUrl: https://jsonplaceholder.typicode.com
timeout: 10000
---
# Test 1: GET with absolute URL — verifies status + JSON body deserialization
kind: Run.Sequence
metadata:
  name: testGetAbsoluteUrl
steps:
  - name: fetchTodo
    inputs: {}
    invoke:
      kind: Http.Request
      url: https://jsonplaceholder.typicode.com/todos/1
      method: GET

  - name: assertGetResponse
    inputs:
      status: "${{ steps.fetchTodo.result.status }}"
      id: "${{ steps.fetchTodo.result.body.id }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status:
            type: integer
            const: 200
          id:
            type: integer
            const: 1
        required:
          - status
          - id
---
# Test 2: GET with Http.Client (relative URL) — verifies baseUrl merging
kind: Run.Sequence
metadata:
  name: testGetWithClient
steps:
  - name: fetchUser
    inputs: {}
    invoke:
      kind: Http.Request
      client: !ref placeholderApi
      url: /users/1
      method: GET

  - name: assertClientResponse
    inputs:
      status: "${{ steps.fetchUser.result.status }}"
      id: "${{ steps.fetchUser.result.body.id }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status:
            type: integer
            const: 200
          id:
            type: integer
            const: 1
        required:
          - status
          - id
---
# Test 3: POST with JSON body — verifies serialization + 201 response
kind: Run.Sequence
metadata:
  name: testPostWithJsonBody
steps:
  - name: createPost
    inputs: {}
    invoke:
      kind: Http.Request
      url: https://jsonplaceholder.typicode.com/posts
      method: POST
      body:
        title: Hello
        body: World
        userId: 1

  - name: assertPostResponse
    inputs:
      status: "${{ steps.createPost.result.status }}"
      title: "${{ steps.createPost.result.body.title }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status:
            type: integer
            const: 201
          title:
            type: string
            const: Hello
        required:
          - status
          - title
---
# Test 4: 4xx response must NOT throw — returns response object per spec section 3.1
kind: Run.Sequence
metadata:
  name: testNotFoundDoesNotThrow
steps:
  - name: fetchMissing
    inputs: {}
    invoke:
      kind: Http.Request
      url: https://jsonplaceholder.typicode.com/todos/999999
      method: GET

  - name: assertNotFoundGraceful
    inputs:
      status: "${{ steps.fetchMissing.result.status }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status:
            type: integer
            const: 404
        required:
          - status
---
kind: Assert.Events
metadata:
  name: verifyAllInvocations
filter:
  - type: "*"
expect:
  - event: "*.Invoked"
    payload:
      ref: { kind: Http.Request }
      outputs:
        status: 200
  - event: "*.Invoked"
    payload:
      ref: { kind: Http.Request }
      outputs:
        status: 200
  - event: "*.Invoked"
    payload:
      ref: { kind: Http.Request }
      outputs:
        status: 201
  - event: "*.Invoked"
    payload:
      ref: { kind: Http.Request }
      outputs:
        status: 404
