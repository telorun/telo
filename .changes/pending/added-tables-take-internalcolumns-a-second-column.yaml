  modules/postgres: Added
body: "Tables take 'internalColumns': a second column map, in the engine's own column
  vocabulary, for columns outside the row contract. The schema pass creates, compares,
  tombstones and reclaims an internal column exactly as a declared one, and an index or
  foreign key may name columns of either map; no contract typed from the table and no
  seed row sees one. 'columns' is still always written, and may now be the empty map
  beside a non-empty 'internalColumns' - a table with no row contract, which nothing
  typed from it can name a column of; an empty 'columns' alone, and an empty
  'internalColumns', are schema violations. Three rules are the internal map's own, each
  reported by telo check and refused again at creation: SQL_COLUMN_DECLARED_TWICE (one
  name in both maps), SQL_INTERNAL_COLUMN_RENAME_FROM_SELF and
  SQL_INTERNAL_COLUMN_RENAME_SOURCE_STILL_DECLARED (an internal column renamed from
  itself, or from a column either map still declares)."
