modules:
  modules/ui: Added
body: "Records are listed by Ui.Listing, drawn by a layout under the new
  Ui.ListingLayout abstract (Ui.TableLayout, carrying the columns, and the default when
  layout is omitted) with an optional compact layout and paging by pages, more or
  scroll; the page spec gains type: listing, whose layout is a Ui.ListingLayoutSpec
  carrying its read plan. A collection is reached through Ui.CollectionSource (a
  DataModel.Collection and its basePath) and shown through Ui.CollectionPresentation,
  whose relations label related records in listings, offer them in filter bars and enter
  them with a derived picker in forms; filter fields take values: all | present (present
  needs a facet) and their own options, and the absent operator is entered with a
  toggle. New rules UI_RELATION_UNDECLARED, UI_RELATION_TARGET_MISMATCH,
  UI_RELATION_SEARCH_NOT_ACCEPTED, UI_FILTER_VALUES_NOT_FACETED and
  UI_FILTER_OPTION_VALUE_MISMATCH, each with its ERR_ twin. Breaking: Ui.Collection and
  Ui.Table are removed with no alias (the table's columns move to Ui.TableLayout, rowKey
  is the collection's key, source.filters is the listing's filters); Ui.Listing,
  Ui.Filters and Ui.Form take presentation in place of collection and source; Ui.Filters
  no longer takes model, and UI_FILTER_UNKNOWN_PROPERTY, UI_FILTER_OPERATOR_UNSUPPORTED
  and UI_FILTER_MODEL_INCOMPLETE are gone, the collection's own rules guaranteeing the
  same; Ui.CollectionOptions takes source, a Ui.CollectionSource, and top-level
  filters."
