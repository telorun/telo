project: run
kind: Added
body: 'Named CEL bindings and pure steps. Run.Value and Run.Choice take an optional
  `bindings:` map — name → CEL, read by bare name inside the kind''s expressions and
  inside each other. Order is derived from what each expression references rather
  than declared, so reordering rows cannot change behaviour; evaluation is lazy and
  memoised per call, so a binding several decision rows share is computed once and
  one nothing reads is never computed at all — a binding means exactly what inlining
  its expression would. A cycle is BINDING_CYCLE and a name that shadows something
  already in scope is BINDING_NAME_RESERVED, both at `telo check`. Bindings are evaluated
  before any step runs, so they never see `steps.*`: for an intermediate derived from
  a step''s result, a step now carries `value:` instead of `invoke:`. That pure step
  publishes `steps.<name>.result` like any other but dispatches nothing — no resource,
  no span, no topology node — and is part of the shared step grammar, so it works
  in Run.Sequence, Run.Loop, Run.Iteration and Run.Projection alike; a failure inside
  one is reported against the step by name, as every other step form already is.
  Binding names must lex as CEL identifiers, so a name no expression could ever
  read is rejected at `telo check` rather than silently dead.'
