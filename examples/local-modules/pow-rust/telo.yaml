kind: Telo.Library
metadata:
  name: PowRust
  version: 1.0.0
  categories: [ Compute ]
  description: >-
    Proof-of-work mining: finds the nonce that gives a text's SHA-256 hash a
    required number of leading zero bits, and reports how long the search took.
    Written in Rust beside the app that imports it and compiled to optimized
    native code from its crate when the app loads.
exports:
  kinds:
    - Mine
---
# `local_path` is the crate the kernel builds with `cargo build --release` on
# first load; `#mine` is the entry it exports.
kind: Telo.Definition
metadata:
  name: Mine
  description: >-
    Searches nonces from zero upward until SHA-256 of the text followed by the
    nonce in decimal has at least `difficulty` leading zero bits. Returns the
    nonce, the hash in hex and the search time in milliseconds; each extra bit
    doubles the expected work.
capability: Telo.Invocable
controllers:
  - pkg:cargo/local-modules-pow?local_path=./rust#mine
schema:
  type: object
  additionalProperties: false
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [ text, difficulty ]
    properties:
      text: { type: string }
      difficulty: { type: integer, minimum: 1, maximum: 24 }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [ nonce, hash, elapsedMs ]
    properties:
      nonce: { type: integer }
      hash: { type: string }
      elapsedMs: { type: number }
