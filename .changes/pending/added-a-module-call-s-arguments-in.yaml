units:
  templating: Added
body: "A module call's arguments in a CEL site's call list now carry each argument's
  checked type itself as `type` (`ty` in `telo-templating`) and its printed text as
  `typeName` (`type_name`), cut as every printed type is: a consumer that read `type` as
  text reads `typeName` instead. A map-literal argument's entries carry the kind of
  literal each holds as `literalKind` (`literal_kind`), where they carried `type`
  (`type_name`). An analysis now carries the checked type itself beside its text, as
  `checkedType` (`checked_type`), and the types its plain chains read as
  `readCheckedTypes` (`read_checked_types`). An `!interpolate` hole converts to text
  exactly when `string(<hole>)` resolves in the site's environment, so a host type that
  registers `string(Self)` with a type argument, and a union every member of which
  converts, are now accepted."
