name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Static & release checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Wraps `changeset status`: private `-build` packages are versionable, and a
      # module-owned package's version is the MODULE's now (moved by `telo release
      # apply`, never by changesets), so both are filtered out. Only a changed
      # published, non-module package with no changeset fails here.
      - name: Check changeset status
        if: github.event_name == 'pull_request'
        run: node scripts/check-changeset-status.mjs origin/${{ github.base_ref }}

      - name: Disallow major version bumps in changesets
        if: github.event_name == 'pull_request'
        run: |
          failed=0
          for f in .changeset/*.md; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "README.md" ] && continue
            if awk '/^---$/{c++; next} c==1' "$f" | grep -Eq "^['\"]?[^'\":]+['\"]?:[[:space:]]*major[[:space:]]*$"; then
              echo "::error file=$f::Major version bumps are not allowed in changesets."
              failed=1
            fi
          done
          exit $failed

      # The module release gate. It does NOT fail because a payload moved — under a
      # toolchain bump every module's digest moves, and those ship as unattributed
      # patches with nobody writing prose. It fails when no consistent plan can be
      # formed: a fragment naming an unknown module, a major-inducing kind, or a
      # manifest version that disagrees with its ledger entry.
      #
      # Not PR-only: a malformed fragment breaks the release batch whenever it is
      # reached, so it must never sit on main either. It needs no credentials — the
      # committed ledger is what it compares against, which is why a fork's PR runs
      # the identical computation the release job runs.
      # Run through bun on the TS entry, like every other CLI step in this job.
      # `bin/telo.mjs` imports `cli/nodejs/dist/`, and this job deliberately does
      # not build — it is the static-check job, and a full workspace build to run
      # one gate would be minutes of it. `bun` is a workspace devDependency, so
      # `pnpm exec` has it on PATH with no toolchain setup.
      - name: Check the release plan
        run: >
          pnpm exec bun ./cli/nodejs/bin/telo.ts release check
          --base ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}

      # A doc that hardcodes a version for a ref this repo publishes goes stale
      # silently and reads as current to whoever copies it. The `<version>` marker
      # is substituted at site build time; this is what keeps it used.
      - name: Check documentation version pins
        run: pnpm run check:docs

      # A Helm chart's version and appVersion ARE the deployed package's version;
      # the Version PR stamps them. Unchecked, a hand edit desynchronizes them
      # invisibly until an operator installs a chart whose appVersion names an
      # image tag that was never built from it.
      - name: Check chart versions
        run: pnpm run check:charts

      # The controller protocol's spec and its message set are two halves of one
      # contract, and either half can be edited without the other. A wrong
      # inventory row reads as authoritative to whoever implements a second
      # kernel from it, so the two are checked against each other here.
      - name: Check the controller protocol
        run: pnpm run check:controller-protocol

      # Two licenses share this repository, and they stay separable only while
      # nothing MIT depends on anything that is not. A declaration nothing checks
      # drifts the first time a package gains a convenient import.
      - name: Check the license boundary
        run: pnpm run check:licenses

      # `@telorun/cel`'s own suite deliberately runs with no vectors directory
      # reachable, so the conformance replay lives under its own config and is
      # driven only from here. This is the one artifact naming
      # `templating/cel-conformance`, and it holds the engine to every row at both
      # the check and the value level: a row carrying a cel-spec answer must be
      # answered or excused BY NAME, or the gate fails. Unwired, the two
      # completeness invariants it enforces ran only when a human typed the path.
      - name: Check the CEL conformance vectors
        run: pnpm run check:cel-conformance

      # `build` compiles the library config (`src` only), so a type error in the
      # package's own tests or in its conformance drivers was invisible to every
      # gate — and one was live. This covers `src`, `tests` and `conformance`.
      - name: Check the CEL package's types
        run: pnpm --filter @telorun/cel run check:types

      - name: Check module manifests
        run: pnpm run check modules/*/telo.yaml packages/runner-core/workspace-app/telo.yaml

      # Both levels, plus the manifests that are not named `telo.yaml`: an example
      # made of several applications keeps them in subdirectories, so a one-level
      # glob checks the entry and silently skips everything it imports.
      # `money-transfer/broken.yaml` is deliberately invalid and stays out.
      - name: Check example manifests
        run: >-
          pnpm run check examples/*/telo.yaml examples/*/*/telo.yaml
          examples/schema-evolution/v1.yaml examples/templated-api/library.yaml

      # A starter is copied VERBATIM by users, so it is the last thing that
      # should be checked by nothing — and it was: the only invocation lived in
      # package.json's `ci` script, which no workflow runs.
      - name: Check starter and blueprint manifests
        run: pnpm run check starters/apps/*/telo.yaml starters/libs/*/telo.yaml blueprints/*/telo.yaml

      # Packaging is picky in ways a build is not — `@types/vscode` outranking
      # `engines.vscode` fails here while `tsc` and esbuild both pass. Running it
      # per-PR keeps that failure off `vscode-release.yml`, which packages the
      # same way on a version bump and has no PR to fail instead.
      - name: Check the VS Code extension packages
        run: pnpm --filter "./ide/vscode" vsix

  # Decides once which manifest tests every platform job runs. A pull request
  # runs only the test manifests its diff reaches — through each manifest's own
  # file, its `__fixtures__/`, its relative imports and the workspace packages
  # their controllers bundle (`telo changed`). Everything runs on a push to
  # main, and whenever the change is to what EVERY test stands on: the runtime,
  # the test runner, the suites, the dependency set or this workflow.
  #
  # `mode` is `full`, `selected` or `none`; `args` is a JSON array of suite
  # arguments (`--include <path>` pairs), empty for a full run. Consumers read
  # both through `env:`, never by interpolating them into a script: a path is
  # a file name a pull request chose.
  #
  # It decides the same for everything else a job does, so that a job whose
  # subject the diff does not reach starts, reports, and skips its build and
  # its tests (`scripts/select-package-tests.mjs` holds the rules):
  #
  # - `unit_mode` / `unit_build_args` / `unit_test_args`: the workspace
  #   packages whose unit tests run — the changed ones and their dependents —
  #   as pnpm `--filter` pairs, empty for a full run;
  # - `os_build` / `os_build_args`: what the Windows and macOS jobs build,
  #   which is everything as soon as a manifest test or a suite runs there;
  # - `integration_mode` / `integration_args`: the Postgres suite's tests;
  # - `package_integration`, `suites`, `rust`: `true` or `false` for the
  #   package integration tests, the example / starter / blueprint /
  #   plan-approval suites with the cross-platform manifest checks, and cargo.
  #
  # Every job keeps STARTING: a job that never starts never reports, and a
  # required check that never reports blocks the merge it was meant to guard.
  select:
    name: Select manifest tests
    runs-on: ubuntu-latest

    outputs:
      mode: ${{ steps.select.outputs.mode }}
      args: ${{ steps.select.outputs.args }}
      unit_mode: ${{ steps.packages.outputs.unit_mode }}
      unit_build_args: ${{ steps.packages.outputs.unit_build_args }}
      unit_test_args: ${{ steps.packages.outputs.unit_test_args }}
      package_integration: ${{ steps.packages.outputs.package_integration }}
      suites: ${{ steps.packages.outputs.suites }}
      rust: ${{ steps.packages.outputs.rust }}
      os_build: ${{ steps.packages.outputs.os_build }}
      os_build_args: ${{ steps.packages.outputs.os_build_args }}
      integration_mode: ${{ steps.integration.outputs.integration_mode }}
      integration_args: ${{ steps.integration.outputs.integration_args }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # FAIL OPEN at every step: a diff that cannot be taken, or a `telo
      # changed` that fails, runs everything. Only an explicit empty `affected`
      # list runs nothing.
      - name: Select the manifest tests this change reaches
        id: select
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          full() {
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "args=[]" >> "$GITHUB_OUTPUT"
            echo "$1 — running every manifest test." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$EVENT_NAME" = "pull_request" ] || full "Not a pull request"
          git fetch --no-tags origin "$BASE_REF" || true
          base="origin/$BASE_REF"
          changed=$(git diff --name-only "$base...HEAD") || full "Could not diff against $base"
          # Plain paths, deliberately not `telo changed`: a manifest under
          # kernel/ imports modules, so it would report a module change as a
          # runtime change.
          if grep -qE '^(kernel|analyzer|sdk|templating|cli|modules/test)/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|test-suite(-windows)?\.yaml|\.github/workflows/test\.yml)$' <<<"$changed"; then
            full "The runtime, the test runner, a suite, the dependency set or this workflow changed"
          fi
          # The suites apply their own `exclude:` on top, so the glob need not
          # restate them.
          json=$(pnpm run --silent telo changed '**/tests/*.yaml' --base "$base" -o json) \
            || full "telo changed failed"
          count=$(jq '.affected | length' <<<"$json") || full "telo changed returned no answer"
          if [ "$count" = "0" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "args=[]" >> "$GITHUB_OUTPUT"
            echo "No manifest test is reached by this change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "mode=selected" >> "$GITHUB_OUTPUT"
          echo "args=$(jq -c '[.affected[] | "--include", .]' <<<"$json")" >> "$GITHUB_OUTPUT"
          {
            echo "Running the $count manifest tests this change reaches:"
            echo
            jq -r '.affected[] | "- `" + . + "`"' <<<"$json"
          } >> "$GITHUB_STEP_SUMMARY"

      # FAIL OPEN, like the step above: anything but an answer from the script
      # is a full run of everything.
      - name: Select the packages and suites this change reaches
        id: packages
        if: always()
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          MANIFEST_MODE: ${{ steps.select.outputs.mode }}
        run: |
          emit() {
            {
              echo "unit_mode=$(jq -r '.mode' <<<"$1")"
              echo "unit_build_args=$(jq -c '.buildArgs' <<<"$1")"
              echo "unit_test_args=$(jq -c '.testArgs' <<<"$1")"
              echo "package_integration=$(jq -r '.packageIntegration' <<<"$1")"
              echo "suites=$(jq -r '.suites' <<<"$1")"
              echo "rust=$(jq -r '.rust' <<<"$1")"
            } >> "$GITHUB_OUTPUT"
            # Windows and macOS run manifest tests, suites and unit tests off
            # one build, so it is partial only when unit tests are all it serves.
            if [ "$MANIFEST_MODE" != "none" ] || [ "$(jq -r '.suites' <<<"$1")" = "true" ] || [ "$(jq -r '.mode' <<<"$1")" = "full" ]; then
              echo "os_build=full" >> "$GITHUB_OUTPUT"
              echo "os_build_args=[]" >> "$GITHUB_OUTPUT"
            else
              echo "os_build=$(jq -r '.mode' <<<"$1")" >> "$GITHUB_OUTPUT"
              echo "os_build_args=$(jq -c '.buildArgs' <<<"$1")" >> "$GITHUB_OUTPUT"
            fi
            {
              echo
              echo "Package tests: **$(jq -r '.mode' <<<"$1")** — $(jq -r '.reason' <<<"$1")."
              jq -r '.packages[] | "- `" + . + "`"' <<<"$1"
              echo
              echo "Suites: $(jq -r '.suites' <<<"$1"). Cargo: $(jq -r '.rust' <<<"$1"). Package integration tests: $(jq -r '.packageIntegration' <<<"$1")."
            } >> "$GITHUB_STEP_SUMMARY"
          }
          full() {
            emit "$(jq -cn --arg reason "$1" '{mode:"full",reason:$reason,packages:[],testArgs:[],buildArgs:[],packageIntegration:true,suites:true,rust:true}')"
            exit 0
          }
          [ "$EVENT_NAME" = "pull_request" ] || full "Not a pull request"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD") || full "Could not diff against origin/$BASE_REF"
          json=$(node scripts/select-package-tests.mjs <<<"$changed") || full "The selection script failed"
          jq -e '.mode == "full" or .mode == "selected" or .mode == "none"' <<<"$json" >/dev/null \
            || full "The selection script returned no answer"
          emit "$json"

      # The Postgres suite's tests, by the same rule as the root suite's: a
      # full manifest run is a full run here, otherwise only what the diff
      # reaches.
      - name: Select the integration tests this change reaches
        id: integration
        if: always()
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          MANIFEST_MODE: ${{ steps.select.outputs.mode }}
        run: |
          full() {
            echo "integration_mode=full" >> "$GITHUB_OUTPUT"
            echo "integration_args=[]" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$EVENT_NAME" = "pull_request" ] || full
          [ "$MANIFEST_MODE" = "selected" ] || [ "$MANIFEST_MODE" = "none" ] || full
          base="origin/$BASE_REF"
          changed=$(git diff --name-only "$base...HEAD") || full
          if grep -qE '^test-suite-integration\.yaml$' <<<"$changed"; then full; fi
          json=$(pnpm run --silent telo changed '**/tests/integration/*.yaml' --base "$base" -o json) || full
          count=$(jq '.affected | length' <<<"$json") || full
          if [ "$count" = "0" ]; then
            echo "integration_mode=none" >> "$GITHUB_OUTPUT"
            echo "integration_args=[]" >> "$GITHUB_OUTPUT"
            echo "No integration test is reached by this change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "integration_mode=selected" >> "$GITHUB_OUTPUT"
          echo "integration_args=$(jq -c '[.affected[] | "--include", .]' <<<"$json")" >> "$GITHUB_OUTPUT"

  bun:
    name: "Linux: manifest tests (Bun)"
    runs-on: ubuntu-latest
    needs: select

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (bun)
        if: needs.select.outputs.mode != 'none'
        shell: bash
        env:
          SUITE_ARGS: ${{ needs.select.outputs.args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$SUITE_ARGS")
          pnpm test "${args[@]}"

      # `telo check` says an example parses; it says nothing about whether the
      # application still does what its README claims. Each example owns its
      # tests, and these suites run every one of them — standing the example up
      # on a port of the test's own and calling it, which is what catches a route
      # that silently stopped serving.
      #
      # Separate from the module suite, and from each other, because an example
      # and a starter both import PUBLISHED modules: a red run here can mean the
      # release sequence is behind rather than that the code is wrong, and that
      # signal must not make a red module suite ambiguous.
      - name: Run the example test suites (bun)
        if: needs.select.outputs.suites == 'true'
        run: pnpm run telo ./examples/test-suite.yaml

      - name: Run the starter test suites (bun)
        if: needs.select.outputs.suites == 'true'
        run: pnpm run telo ./starters/test-suite.yaml

      - name: Run the blueprint test suites (bun)
        if: needs.select.outputs.suites == 'true'
        run: pnpm run telo ./blueprints/test-suite.yaml

      # The plan-approval apps import the workspace by relative path and run
      # offline, but the root suite excludes `apps/**`, so they run here.
      - name: Run the plan-approval server test suite (bun)
        if: needs.select.outputs.suites == 'true'
        run: pnpm run telo ./apps/plan-approval/test-suite.yaml

      - name: Run the plan-approval runner test suite (bun)
        if: needs.select.outputs.suites == 'true'
        run: pnpm run telo ./apps/plan-approval-runner/test-suite.yaml

  integration:
    name: "Linux: integration tests (Postgres)"
    runs-on: ubuntu-latest
    needs: select

    # The tests the root suite deliberately cannot hold: they need a live
    # database. `test-suite.yaml` must pass on a clean checkout with nothing
    # running, so a red module suite means the code is wrong rather than that
    # something was not up — which is exactly what mixing these in would cost.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        # Pulled as the project's account: anonymous pulls are limited per IP,
        # and a hosted runner shares its IP with everyone else's jobs.
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the job races the server: the first test would connect
        # before Postgres finished its own init and fail on the connection
        # rather than on anything under test.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The same five variables the suite's manifests declare. Spelled out rather
    # than left to their defaults so the connection this job uses is readable
    # here, and so a developer whose 5432 is taken sets DB_PORT locally against
    # the identical contract.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        if: needs.select.outputs.integration_mode != 'none'
        shell: bash
        env:
          SUITE_ARGS: ${{ needs.select.outputs.integration_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$SUITE_ARGS")
          pnpm run test:integration "${args[@]}"

  unit:
    name: "Linux: package unit tests"
    runs-on: ubuntu-latest
    needs: select

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The kernel's napi-loader test and several module tests run a real
      # `cargo build` of fixture crates. Persist the Rust target/ across runs
      # so cold builds don't dominate (and don't flake the 5s-ish tests).
      - name: Setup Rust cache
        if: needs.select.outputs.unit_mode != 'none'
        uses: Swatinem/rust-cache@v2
        with:
          # Controller crates are built into the workspace-anchored `.telo` cache,
          # keyed by SDK backend, which is NOT the workspace `target/` this action
          # caches by default. Without naming it every run rebuilds each napi
          # controller and its dependency tree from cold — minutes on Windows.
          cache-directories: .telo/cargo

      # Package unit tests resolve sibling workspace packages to their built
      # dist/, so the build must run before vitest.
      #
      # This includes modules, and the module half is NOT a no-op even though the
      # kernel builds bundled controllers from source at load. 13 of the 61
      # modules emit dist/: the three `pkg:npm` ones (image, pdf, starlark),
      # whose controller is resolved as a package EXPORT SUBPATH (`#./script`)
      # inside the installed node_modules and so must be staged, plus ten
      # libraries other packages compile against. The other 48 are
      # `tsc --noEmit` and contribute a type-check only. Filtering modules out
      # here breaks every manifest test touching one of the three, with
      # "Controller entry could not be resolved".
      #
      # On a pull request that reaches only some packages, those and what they
      # depend on are built, and their tests alone run.
      - name: Build for Node.js
        if: needs.select.outputs.unit_mode != 'none'
        shell: bash
        env:
          BUILD_ARGS: ${{ needs.select.outputs.unit_build_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$BUILD_ARGS")
          pnpm -r "${args[@]}" run build

      - name: Run package unit tests
        if: needs.select.outputs.unit_mode == 'full' || (needs.select.outputs.unit_mode == 'selected' && needs.select.outputs.unit_test_args != '[]')
        shell: bash
        env:
          TEST_ARGS: ${{ needs.select.outputs.unit_test_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$TEST_ARGS")
          pnpm -r "${args[@]}" test

  node:
    name: "Linux: manifest tests (Node)"
    runs-on: ubuntu-latest
    needs: select

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Node.js
        if: needs.select.outputs.mode != 'none'
        run: pnpm -r run build

      - name: Run tests (node)
        if: needs.select.outputs.mode != 'none'
        shell: bash
        env:
          SUITE_ARGS: ${{ needs.select.outputs.args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$SUITE_ARGS")
          pnpm run test:node "${args[@]}"

      # Smoke-test loading a manifest from an HTTP URL using the branch's
      # just-built CLI. Pulls the example over raw.githubusercontent.com at
      # the workflow's commit SHA, so the test exercises the https-anchored
      # install root path (~/.cache/telo/...) end-to-end. The manifest itself
      # imports the console module from ghcr.io, so this also verifies the OCI
      # round-trip on top of HTTP-rooted controller installs.
      - name: Run remote manifest over raw.githubusercontent.com
        if: needs.select.outputs.mode != 'none'
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/examples/hello-world/telo.yaml"
          # raw.githubusercontent.com's CDN lags behind the pushed commit, so
          # the SHA-pinned URL 404s for a short while. Poll until it serves.
          for attempt in $(seq 1 30); do
            if curl -fsSL "$URL" >/dev/null 2>&1; then
              break
            fi
            echo "URL not available yet (attempt $attempt), sleeping 10s..."
            sleep 10
          done
          set +e
          output=$(pnpm run telo "$URL" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "telo exited with status $status"
            exit "$status"
          fi
          echo "$output" | grep -q "Hello from Telo!"

  docker:
    name: "Linux: manifest tests (Docker)"
    runs-on: ubuntu-latest
    needs: select

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Test setup (not a runtime-image concern): build the module controllers
      # and their compile deps so the mounted suite's local_path controllers
      # resolve to built dist/. The image stays a pure runtime.
      - name: Build module controllers
        if: needs.select.outputs.mode != 'none'
        run: pnpm --filter "{./modules/**}..." run build

      # Anonymous pulls are limited per IP, and a hosted runner shares its IP
      # with everyone else's jobs. A fork's pull request holds no secrets and
      # pulls anonymously, as before.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && needs.select.outputs.mode != 'none'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build docker image
        if: needs.select.outputs.mode != 'none'
        run: docker build -f cli/nodejs/Dockerfile -t telo:ci .

      - name: Run tests (docker image)
        if: needs.select.outputs.mode != 'none'
        shell: bash
        env:
          SUITE_ARGS: ${{ needs.select.outputs.args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$SUITE_ARGS")
          docker run --rm -v "$PWD":/workspace -v /workspace/.telo -w /workspace telo:ci ./test-suite.yaml "${args[@]}"

  # Tests whose subject is several telo installations over ONE workspace cache —
  # a host process and two containers, glibc and musl. They live outside the
  # kernel's default vitest run (which must pass with nothing installed), so
  # nothing else reaches them: `pnpm -r test:integration` is the only caller.
  #
  # Its own job rather than a step on `unit`, because it builds the CLI image
  # from the shipped Dockerfile and runs containers — minutes that every other
  # package's unit tests should not wait behind.
  package-integration:
    name: "Linux: package integration tests (Docker)"
    runs-on: ubuntu-latest
    needs: select

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The HOST runner in these tests is `cli/nodejs/bin/telo.mjs`, which
      # imports `dist/` — the container runners build their own copy inside the
      # image, but this one needs the workspace built first.
      - name: Build for Node.js
        if: needs.select.outputs.package_integration == 'true'
        run: pnpm -r run build

      # Anonymous pulls are limited per IP, and a hosted runner shares its IP
      # with everyone else's jobs. A fork's pull request holds no secrets and
      # pulls anonymously, as before.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && needs.select.outputs.package_integration == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run package integration tests
        if: needs.select.outputs.package_integration == 'true'
        run: pnpm -r test:integration

  # No step is marked `continue-on-error`: a red step fails the job, and a
  # failure logged by a step that still reports success is the one outcome this
  # job must never produce.
  #
  # `pnpm -r --no-bail test` does NOT soften that — `--no-bail` keeps the
  # recursive run going past a failing package so one run reports every one of
  # them, and pnpm still exits non-zero at the end.
  windows:
    name: "Windows: unit & manifest tests"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: select

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # The kernel's napi-loader test and several module tests shell out to a
      # real `cargo build` of fixture crates, so the Rust toolchain is on the
      # unit-test path here exactly as it is on ubuntu.
      - name: Setup Rust cache
        if: needs.select.outputs.os_build != 'none'
        uses: Swatinem/rust-cache@v2
        with:
          # Controller crates are built into the workspace-anchored `.telo` cache,
          # keyed by SDK backend, which is NOT the workspace `target/` this action
          # caches by default. Without naming it every run rebuilds each napi
          # controller and its dependency tree from cold — minutes on Windows.
          cache-directories: .telo/cargo

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Everything below reads from dist/, so a failure here makes the rest of
      # the run meaningless rather than merely red. Modules are included: the
      # three `pkg:npm` ones stage a dist/ their controller entry is resolved
      # from — see the note in the Linux unit job.
      #
      # The excluded packages are browser bundles and the docs site: nothing
      # here reads their output, they have no Windows-specific path, and the
      # Linux unit job builds them.
      - name: Build for Node.js
        if: needs.select.outputs.os_build != 'none'
        shell: bash
        env:
          BUILD_ARGS: ${{ needs.select.outputs.os_build_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$BUILD_ARGS" | tr -d '\r')
          pnpm -r "${args[@]}" --filter "!@telorun/studio" --filter "!telo-vscode" --filter "!@telorun/pages" --filter "!@telorun/hub-web" run build

      - name: Run package unit tests
        if: needs.select.outputs.unit_mode == 'full' || (needs.select.outputs.unit_mode == 'selected' && needs.select.outputs.unit_test_args != '[]')
        shell: bash
        env:
          TEST_ARGS: ${{ needs.select.outputs.unit_test_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$TEST_ARGS" | tr -d '\r')
          pnpm -r "${args[@]}" --no-bail test

      # `telo check` is analyze-only — it installs no controller — so this is the
      # part of the surface expected to work first. Run through bash so the glob
      # is expanded before the CLI sees it: neither cmd.exe nor pwsh expands one
      # for a native command, and `telo check` takes literal positionals.
      - name: Check module manifests
        if: needs.select.outputs.suites == 'true'
        shell: bash
        run: pnpm run check modules/*/telo.yaml packages/runner-core/workspace-app/telo.yaml

      - name: Check example manifests
        if: needs.select.outputs.suites == 'true'
        shell: bash
        run: >-
          pnpm run check examples/*/telo.yaml examples/*/*/telo.yaml
          examples/schema-evolution/v1.yaml examples/templated-api/library.yaml

      - name: Check starter and blueprint manifests
        if: needs.select.outputs.suites == 'true'
        shell: bash
        run: pnpm run check starters/apps/*/telo.yaml starters/libs/*/telo.yaml blueprints/*/telo.yaml

      # The manifest suite on the Node entry point. This is the step that
      # exercises the `pkg:npm` controller installer, which has to reach
      # `npm.cmd` through cmd.exe here — the one part of the loader with a
      # Windows-specific path, and so the one most worth running on every PR.
      #
      # `test-suite-windows.yaml` is `test-suite.yaml` plus three exclusions:
      # the `modules/shell` tests that drive the host shell in POSIX's own
      # language (`printf`, `pwd`, `"$VAR"`), which cmd.exe does not speak. See
      # the note in that file for why they are excluded rather than rewritten.
      #
      # Invoked directly rather than through `pnpm run test:node:windows`: pnpm
      # runs a script through cmd.exe, whose 8191-character command line a
      # selection of a couple of hundred `--include` pairs exceeds.
      - name: Run telo manifest tests (Node)
        if: needs.select.outputs.mode != 'none'
        shell: bash
        env:
          SUITE_ARGS: ${{ needs.select.outputs.args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$SUITE_ARGS" | tr -d '\r')
          node ./cli/nodejs/bin/telo.mjs ./test-suite-windows.yaml "${args[@]}"

  # macOS is POSIX, so unlike the Windows job this is not covering a separate
