# A store the verifier and the operations name but nothing calls: it issues no
# statement, starts no sweep, and the application exits.
kind: Telo.Application
metadata: { name: DeclaredNeverCalled }
imports: { Keys: ../../, SQLite: ../../../sqlite, ApiKey: ../../../api-key }
targets:
  - !ref appSchema
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Keys.Table
metadata: { name: keys }
table: api_keys
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref keys]
---
kind: Keys.Store
metadata: { name: store }
connection: !ref db
schema: !ref appSchema
table: !ref keys
name: main
prefix: tk
scopes: [read]
retention: 1s
---
kind: ApiKey.Verifier
metadata: { name: verifier }
sources: [!ref store]
---
kind: ApiKey.Issue
metadata: { name: issue }
store: !ref store
