# An application that writes each of `CrudUi.Admin`'s presentation keys
# wrongly, one mistake per resource: a key none of them has, a value outside
# the set the listing takes, and a destination that is no destination.
kind: Telo.Application
metadata: { name: CrudUiAdminRefusalsApp, version: 1.0.0 }
imports:
  CrudUi: ../../../
  Crud: ../../../../crud
  SQLite: ../../../../sqlite
  Ui: ../../../../ui
---
kind: SQLite.Table
metadata: { name: tasksTable }
table: tasks
columns:
  id: { type: integer, primaryKey: true, identity: always }
  title: { type: text, nullable: false }
---
kind: Telo.JsonSchema
metadata: { name: Task }
schema:
  type: object
  required: [title]
  additionalProperties: false
  properties: { title: { type: string } }
---
kind: Telo.JsonSchema
metadata: { name: TaskRecord }
extends: Task
schema: { type: object, required: [id], properties: { id: { type: integer } } }
---
kind: Crud.Collection
metadata: { name: tasks }
model: !ref TaskRecord
table: !ref tasksTable
schemas: { list: !ref TaskRecord, create: !ref Task, update: !ref Task }
query: { filters: [{ property: title, operator: contains }], sort: [] }
---
kind: CrudUi.CollectionSource
metadata: { name: tasksSource }
collection: !ref tasks
basePath: /api/tasks
---
kind: CrudUi.Admin
metadata: { name: filtersKey }
source: !ref tasksSource
filters: { sumary: chips }
---
kind: CrudUi.Admin
metadata: { name: createKey }
source: !ref tasksSource
create: { to: { kind: Ui.Navigate, href: /new }, labell: New }
---
kind: CrudUi.Admin
metadata: { name: editKey }
source: !ref tasksSource
edit: { to: { kind: Ui.Navigate, href: /edit }, labell: Change }
---
kind: CrudUi.Admin
metadata: { name: createDestination }
source: !ref tasksSource
create: { to: { kind: Ui.LocalStore } }
---
kind: CrudUi.Admin
metadata: { name: editNoDestination }
source: !ref tasksSource
edit: { label: Change }
---
kind: CrudUi.Admin
metadata: { name: pagingValue }
source: !ref tasksSource
paging: sideways
