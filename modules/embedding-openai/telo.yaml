kind: Telo.Library
metadata:
  name: embedding-openai
  version: 0.7.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Text embeddings from OpenAI and any OpenAI-compatible endpoint — Azure OpenAI,
    gateways, self-hosted servers — over the embeddings HTTP API with no vendor SDK.
    Output dimensionality is configurable where the model supports truncation, and
    the same vectors serve both search queries and indexed passages.
imports:
  Embedding: ../embedding
exports:
  kinds:
    - Model
---
kind: Telo.Definition
metadata:
  name: Model
  description: >-
    An embedding model served by OpenAI or an OpenAI-compatible endpoint: model id,
    API key, an optional base URL for gateways or Azure, and an optional output
    dimensionality.
capability: Telo.Provider
extends: Embedding.Model
controllers:
  - pkg:telo/local/js?path=./nodejs/model-controller.mjs&local_path=./nodejs/src/model-controller.ts
schema:
  type: object
  required: [model, apiKey]
  additionalProperties: false
  properties:
    model:
      title: Model ID
      description: OpenAI embedding model identifier (e.g. text-embedding-3-small).
      type: string
    apiKey:
      title: API Key
      description: Secret reference; typically `${{ secrets.openaiApiKey }}`.
      type: string
      x-telo-eval: compile
    baseUrl:
      title: Base URL
      description: Optional override for the OpenAI API base URL (Azure OpenAI, OpenAI-compatible gateways).
      type: string
      x-telo-eval: compile
    dimensions:
      title: Dimensions
      description: Output dimensionality. v3 models support truncating to fewer dimensions.
      type: integer
      minimum: 1
    options:
      title: Options
      description: Extra request params merged into the /embeddings body; per-call options win.
      type: object
      additionalProperties: true
  examples:
    - model: text-embedding-3-small
      apiKey: "${{ secrets.openaiApiKey }}"
      dimensions: 1536
