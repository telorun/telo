units:
  analyzer: Added
body: "`telo check` holds each import's literal `variables:` / `secrets:` to the named
  shape its library's entry names as that import's own choices decide it: two isolated
  imports of one library taking different options are each judged against their own
  variant, a shape declared behind a whole-document `!if` is judged too, and an entry
  the import supplies, or one declaring a `default:`, whose shape the taken option
  leaves undeclared is `SCHEMA_TYPE_REF_UNRESOLVED` at the import. A choice reading an
  input whose entry reaches a named shape another of the module's choices varies is
  `BRANCH_UNDECIDABLE`, naming the input and the shape. Both refuse manifests `telo
  check` used to pass."
