kind: Telo.Application
metadata:
  name: OpenaiSnapshotCarriesNoSecret
  version: 1.0.0
  description: |
    A model's published reading carries no credential — and now it cannot, which
    is a stronger statement than the one this test used to make.

    It previously booted a model with a sentinel `apiKey` and asserted
    `snapshot()` redacted it. The model kinds carry no key at all: auth is a
    credential on the client the injected `Http.Request` points at, so there is
    nothing on the model to leak. What is asserted is exactly that — the reading
    holds the call shape and nothing else — and that the credential's own
    reading carries its scheme but not its token.

    Offline: the model instance is just config, and no API call is made.
imports:
  OpenAI: ../
  Http: ../../http-client
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
# The sentinel lives on the CREDENTIAL now, the only thing that holds it. If a
# reading were ever to leak, this is the string that would show up.
kind: Http.BearerToken
metadata: { name: openaiKey }
token: "sk-sentinel-DO-NOT-LEAK"
---
kind: Http.Client
metadata: { name: openaiClient }
baseUrl: https://api.openai.com/v1
credential: !ref openaiKey
---
kind: Http.Request
metadata: { name: openaiRequest }
client: !ref openaiClient
---
kind: OpenAI.ChatModel
metadata: { name: probe }
model: gpt-4o-mini
request: !ref openaiRequest
options:
  temperature: 0
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: inspectModel
    inputs:
      probe: !cel resources.probe
    invoke:
      kind: Run.Value
      inputs:
        probe: {}
      value:
        model: !cel "'model' in inputs.probe ? inputs.probe.model : null"
        hasApiKey: !cel "'apiKey' in inputs.probe"
        hasRequest: !cel "'request' in inputs.probe"
  - name: assertModelReading
    inputs:
      model: !cel "steps.inspectModel.result.model"
      hasApiKey: !cel "steps.inspectModel.result.hasApiKey"
      hasRequest: !cel "steps.inspectModel.result.hasRequest"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          # The call shape is readable; that is what a reading is for.
          model: { const: gpt-4o-mini }
          # No key to redact, because the kind has none.
          hasApiKey: { const: false }
          # And a request is a live collaborator, never a published value.
          hasRequest: { const: false }
        required: [model, hasApiKey, hasRequest]

  # The credential's own reading carries the scheme but not the token — a
  # snapshot is published into CEL and onto the debug stream, so the material
  # has no business in one.
  - name: inspectCredential
    inputs:
      probe: !cel resources.openaiKey
    invoke:
      kind: Run.Value
      inputs:
        probe: {}
      value:
        scheme: !cel "'scheme' in inputs.probe ? inputs.probe.scheme : null"
        hasToken: !cel "'token' in inputs.probe"
  - name: assertCredentialReading
    inputs:
      scheme: !cel "steps.inspectCredential.result.scheme"
      hasToken: !cel "steps.inspectCredential.result.hasToken"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          scheme: { const: Bearer }
          hasToken: { const: false }
        required: [scheme, hasToken]
