# Names the rule accepts, on each agent: a tool named by its resource, a bare
# name beside a `prefix`, and any name over a provider that declares no tools.
kind: Telo.Application
metadata:
  name: ApprovalUnknownToolAccepted
  version: 1.0.0
imports:
  Ai: ../../..
  AiEcho: ../ai-echo.yaml
  Run: ../../../../run
---
kind: Run.Value
metadata: { name: wipe }
value: { wiped: true }
---
# `read` is named; the second tool takes its resource's name, `wipe`.
kind: Ai.Tools
metadata: { name: diskTools }
tools:
  - name: read
    tool:
      kind: Run.Value
      value: { read: true }
    parameters: { type: object }
  - tool: !ref wipe
    parameters: { type: object }
---
kind: AiEcho.EchoToolProvider
metadata: { name: discovered }
advertises: [search]
---
kind: Ai.Agent
metadata: { name: agent }
model:
  kind: AiEcho.EchoModel
toolProviders:
  - provider: !ref diskTools
    prefix: disk_
    approval: { include: [read, wipe] }
  - provider: !ref discovered
    approval: { include: [anything] }
---
kind: Ai.AgentStream
metadata: { name: stream }
model:
  kind: AiEcho.EchoModelStream
toolProviders:
  - provider: !ref diskTools
    prefix: disk_
    approval: { include: [read, wipe] }
  - provider: !ref discovered
    approval: { include: [anything] }
