      message: "Ui.OverlayPlacement/overlayInPanel: reference at 'surface' → 'Ui.Panel' does not implement 'Ui.Overlay'"
    - code: REFERENCE_KIND_MISMATCH
      message: "Ui.AsidePlacement/compactAbove: reference at 'compact' → 'Ui.AbovePlacement' does not implement 'Ui.FoldingFilterPlacement'"
---
# Bars pin a filter or the search under every placement; the ones where nothing
# ever folds are told it says nothing. An aside bar folds on a narrow viewport,
# compact named or not, and a bar showing only the chosen filters folds them.
kind: Telo.Sequence
metadata: { name: pinned }
steps:
  - name: check
    invoke: { kind: Probe.Diagnostics, source: ./__fixtures__/pinned/telo.yaml }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.check.result.reported.map(r, r.substring(0, r.indexOf(' pins a field')))"
      expected: ["RESOURCE_RULE_VIOLATED Ui.Filters/omitted:", "RESOURCE_RULE_VIOLATED Ui.Filters/searchOmitted:", "REFERRER_RULE_VIOLATED Ui.Filters/above at 'policy.placement': required by Ui.AbovePlacement —", "REFERRER_RULE_VIOLATED Ui.Filters/searchBox at 'policy.placement': required by Ui.SearchBoxPlacement —"]
