apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-runner.name" . }}
  namespace: {{ .Values.runnerNamespace }}
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
spec:
  # Single replica is REQUIRED — live byte channels and event streams are
  # in-process, and the runner adopts and sweeps session pods at boot; two
  # replicas would double-manage them. `Recreate` also keeps two runners from
  # holding the SQLite session store at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-runner.name" . }}
  template:
    metadata:
      labels:
        {{- include "k8s-runner.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k8s-runner.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # The runner's own state volume is written as this group.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: {{ include "k8s-runner.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The runner holds the cluster API credentials — it is the highest-value
          # target, so it gets the same container hardening as session pods.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.sessionStore.kind "sqlite" }}
            - name: state
              mountPath: /var/lib/telo-runner
            {{- end }}
            {{- if .Values.runner.terms.enabled }}
            - name: terms
              mountPath: /etc/telo/terms
              readOnly: true
            {{- end }}
          ports:
            - containerPort: {{ .Values.runner.port }}
          env:
            - name: PORT
              value: "{{ .Values.runner.port }}"
            - name: LOG_LEVEL
              value: "{{ .Values.runner.logLevel }}"
            {{- if .Values.runner.displayName }}
            - name: RUNNER_DISPLAY_NAME
              value: {{ .Values.runner.displayName | quote }}
            {{- end }}
            {{- if .Values.runner.description }}
            - name: RUNNER_DESCRIPTION
              value: {{ .Values.runner.description | quote }}
            {{- end }}
            {{- if or .Values.agent.image .Values.agent.moduleRef }}
            {{- $env := dict }}
            {{- range $k, $v := .Values.agent.env }}{{- $_ := set $env $k $v }}{{- end }}
            {{- /* Kubernetes expands $(VAR) from env vars defined earlier in this list. */}}
            {{- range $k, $ref := .Values.agent.secretEnv }}
            - name: AGENT_SECRET_{{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName | quote }}
                  key: {{ $ref.key | quote }}
            {{- $_ := set $env $k (printf "$(AGENT_SECRET_%s)" $k) }}
            {{- end }}
            {{- if .Values.agent.image }}
            - name: AGENT_IMAGE
              value: {{ .Values.agent.image | quote }}
            {{- end }}
            {{- if .Values.agent.moduleRef }}
            - name: AGENT_MODULE_REF
              value: {{ .Values.agent.moduleRef | quote }}
            {{- end }}
            - name: AGENT_PORT
              value: {{ .Values.agent.port | quote }}
            {{- if .Values.agent.pullPolicy }}
            - name: AGENT_PULL_POLICY
              value: {{ .Values.agent.pullPolicy | quote }}
            {{- end }}
            {{- if .Values.agent.tokenEnv }}
            - name: AGENT_TOKEN_ENV
              value: {{ .Values.agent.tokenEnv | quote }}
            {{- end }}
            {{- if .Values.agent.title }}
            - name: AGENT_TITLE
              value: {{ .Values.agent.title | quote }}
            {{- end }}
            {{- if .Values.agent.description }}
            - name: AGENT_DESCRIPTION
              value: {{ .Values.agent.description | quote }}
            {{- end }}
            {{- if $env }}
            - name: AGENT_ENV
              value: {{ $env | toJson | quote }}
            {{- end }}
            {{- end }}
            - name: RUNNER_MAX_SESSIONS
              value: "{{ .Values.runner.maxSessions }}"
            - name: RUNNER_SESSION_IDLE_SECONDS
              value: "{{ .Values.sessions.idleSeconds }}"
            - name: RUNNER_SESSION_MAX_RUNNING_SECONDS
              value: "{{ .Values.sessions.maxRunningSeconds }}"
            - name: RUNNER_SESSION_RETENTION_SECONDS
              value: "{{ .Values.sessions.retentionSeconds }}"
            - name: RUNNER_SESSION_RELOAD_LIMIT
              value: "{{ .Values.sessions.reloadLimit }}"
            - name: RUNNER_SUPERVISOR_IMAGE
              value: {{ include "k8s-runner.image" . | quote }}
            - name: RUNNER_SESSION_STORE
              value: {{ .Values.sessionStore.kind | quote }}
            {{- if eq .Values.sessionStore.kind "sqlite" }}
            - name: RUNNER_STATE_DIR
              value: /var/lib/telo-runner
            {{- else if .Values.sessionStore.existingSecret }}
            - name: RUNNER_SESSION_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sessionStore.existingSecret | quote }}
                  key: {{ .Values.sessionStore.existingSecretKey | quote }}
            {{- else }}
            - name: RUNNER_SESSION_STORE_URL
              value: {{ .Values.sessionStore.url | quote }}
            {{- end }}
            - name: RUNNER_SESSION_STORAGE_SIZE
              value: {{ .Values.sessionStorage.size | quote }}
            {{- if .Values.sessionStorage.storageClass }}
            - name: RUNNER_SESSION_STORAGE_CLASS
              value: {{ .Values.sessionStorage.storageClass | quote }}
            {{- end }}
            {{- if .Values.identity.audience }}
            - name: RUNNER_IDENTITY_AUDIENCE
              value: {{ .Values.identity.audience | quote }}
            - name: RUNNER_IDENTITY_ISSUERS
              value: {{ join "," .Values.identity.issuers | quote }}
            {{- end }}
            - name: RUNNER_SESSION_NAMESPACE
              value: {{ .Values.sessionNamespace | quote }}
            {{- if .Values.session.image }}
            - name: RUNNER_IMAGE
              value: {{ .Values.session.image | quote }}
            {{- end }}
            {{- if .Values.session.teloReleasesUrl }}
            - name: RUNNER_TELO_RELEASES_URL
              value: {{ .Values.session.teloReleasesUrl | quote }}
            {{- end }}
            {{- if .Values.session.teloImages.pullPolicy }}
            - name: RUNNER_PULL_POLICY
              value: {{ .Values.session.teloImages.pullPolicy | quote }}
            {{- end }}
            - name: RUNNER_SESSION_CONTAINERS
              value: "{{ .Values.session.containers.enabled }}"
            {{- if .Values.session.containers.enabled }}
            - name: RUNNER_SESSION_CONTAINERS_MAX
              value: "{{ .Values.session.containers.max }}"
            - name: RUNNER_SESSION_CONTAINERS_RESOURCES
              value: {{ toJson .Values.session.containers.resources | quote }}
            # The runner as a session's workload reaches it: its own Service.
            - name: RUNNER_INTERNAL_URL
              value: {{ include "k8s-runner.selfUrl" . | quote }}
            {{- end }}
            - name: RUNNER_BASE_IMAGE_CATALOG_ENABLED
              value: "{{ .Values.session.baseImages.enabled }}"
            {{- if .Values.session.baseImages.enabled }}
            - name: RUNNER_BASE_IMAGE_REPO
              value: {{ .Values.session.baseImages.repository | quote }}
            - name: RUNNER_BASE_IMAGE_PINNED_ONLY
              value: "{{ .Values.session.baseImages.pinnedOnly }}"
            - name: RUNNER_BASE_IMAGE_EXCLUDE_SHA
              value: "{{ .Values.session.baseImages.excludeSha }}"
            - name: RUNNER_BASE_IMAGE_EXCLUDE_PRERELEASE
              value: "{{ .Values.session.baseImages.excludePrerelease }}"
            {{- if .Values.session.baseImages.include }}
            - name: RUNNER_BASE_IMAGE_INCLUDE
              value: {{ .Values.session.baseImages.include | quote }}
            {{- end }}
            {{- if .Values.session.baseImages.exclude }}
            - name: RUNNER_BASE_IMAGE_EXCLUDE
              value: {{ .Values.session.baseImages.exclude | quote }}
            {{- end }}
            - name: RUNNER_BASE_IMAGE_LIMIT
              value: "{{ .Values.session.baseImages.limit }}"
            - name: RUNNER_BASE_IMAGE_REFRESH_SECONDS
              value: "{{ .Values.session.baseImages.refreshSeconds }}"
            {{- end }}
            {{- if .Values.session.imagePullSecret }}
            - name: RUNNER_IMAGE_PULL_SECRET
              value: {{ .Values.session.imagePullSecret | quote }}
            {{- end }}
            {{- if .Values.session.runtimeClass }}
            - name: RUNNER_RUNTIME_CLASS
              value: {{ .Values.session.runtimeClass | quote }}
            {{- end }}
            {{- if .Values.session.keepFailedPods }}
            - name: RUNNER_KEEP_FAILED_PODS
              value: "true"
            {{- end }}
            - name: SESSION_ROUTING_MODE
              value: {{ .Values.sessionRouting.mode | quote }}
            {{- if .Values.sessionRouting.baseDomain }}
            - name: SESSION_ROUTING_BASE_DOMAIN
              value: {{ .Values.sessionRouting.baseDomain | quote }}
            {{- end }}
            - name: SESSION_ROUTE_READY_TIMEOUT_SECONDS
              value: "{{ .Values.sessionRouting.routeReadyTimeoutSeconds }}"
            {{- if .Values.sessionRouting.ingress.className }}
            - name: SESSION_INGRESS_CLASS
              value: {{ .Values.sessionRouting.ingress.className | quote }}
            {{- end }}
            {{- $sessionIngressTls := include "k8s-runner.sessionIngressTlsSecretName" . }}
            {{- if $sessionIngressTls }}
            - name: SESSION_INGRESS_TLS_SECRET
              value: {{ $sessionIngressTls | quote }}
            {{- end }}
            {{- if .Values.sessionRouting.gateway.name }}
            - name: SESSION_GATEWAY_NAME
              value: {{ .Values.sessionRouting.gateway.name | quote }}
            - name: SESSION_GATEWAY_NAMESPACE
              value: {{ default .Values.sessionNamespace .Values.sessionRouting.gateway.namespace | quote }}
            {{- if .Values.sessionRouting.gateway.sectionName }}
            - name: SESSION_GATEWAY_SECTION_NAME
              value: {{ .Values.sessionRouting.gateway.sectionName | quote }}
            {{- end }}
            {{- end }}
            - name: RUNNER_MAX_CPU
              value: {{ .Values.limits.maxCpu | quote }}
            - name: RUNNER_MAX_MEMORY
              value: {{ .Values.limits.maxMemory | quote }}
            - name: RUNNER_MAX_EPHEMERAL_STORAGE
              value: {{ .Values.limits.maxEphemeralStorage | quote }}
            - name: RUNNER_APP_MAX_CPU
              value: {{ .Values.limits.agent.maxCpu | quote }}
            - name: RUNNER_APP_MAX_MEMORY
              value: {{ .Values.limits.agent.maxMemory | quote }}
            - name: RUNNER_APP_MAX_EPHEMERAL_STORAGE
              value: {{ .Values.limits.agent.maxEphemeralStorage | quote }}
            {{- if .Values.runner.terms.enabled }}
            - name: RUNNER_TERMS_FILE
              value: /etc/telo/terms/terms.md
            - name: RUNNER_TERMS_TITLE
              value: {{ .Values.runner.terms.title | quote }}
            {{- if .Values.runner.terms.version }}
            - name: RUNNER_TERMS_VERSION
              value: {{ .Values.runner.terms.version | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/health
              port: {{ .Values.runner.port }}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: {{ .Values.runner.port }}
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        # Writable scratch so readOnlyRootFilesystem doesn't break the runtime.
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.sessionStore.kind "sqlite" }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "k8s-runner.name" . }}-state
        {{- end }}
        {{- if .Values.runner.terms.enabled }}
        - name: terms
          configMap:
            name: {{ include "k8s-runner.name" . }}-terms
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-runner.name" . }}
  namespace: {{ .Values.runnerNamespace }}
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "k8s-runner.name" . }}
  ports:
    - name: http
      port: {{ .Values.runner.port }}
      targetPort: {{ .Values.runner.port }}
