kind: Telo.Application
metadata:
  name: CustomKindDemo
  version: 1.0.0
  categories: [ Transport ]
  description: |
    Telo's kind library is not a closed set. `notify/` is a `Telo.Library` that
    defines two new kinds in YAML alone — `Notify.Webhook`, built from an HTTP
    request, and `Notify.Slack`, which `extends` it and narrows the schema to a
    single `webhookUrl` — and this app imports them and uses them like any
    built-in. No controller code, no npm package, no publish step.

    To keep the demo self-contained, the "Slack" it posts to is a throwaway
    `Http.Server` scoped to the run with `with:`, so it starts before the first
    notification and is torn down after the last one — which is also why the app
    exits on its own instead of hanging on a listening port.
imports:
  Notify: ./notify
  Http: oci://ghcr.io/telorun/http-server@0.26.0#sha256-qCiZuU7_9wnxCn2QuA0oKM0H7OyvSd2aFcoXSv3vgFo
  Run: oci://ghcr.io/telorun/run@0.24.2#sha256-BFRCvbtbCRmj6SAu60wo_qbiQCJj1bGqKaKnhQwPJfw
  Console: oci://ghcr.io/telorun/console@0.17.3#sha256-KaCBcFJ13vtXO6I-N06kpjRFm85AcemNEbdVN4tgDhQ
targets:
  - !ref demo
---
# Instances of the kinds the library defined. `deploys` is the general kind;
# `teamChat` is the specialised one — it takes `webhookUrl` and nothing else,
# because `base:` fills in the rest.
kind: Notify.Webhook
metadata: { name: deploys }
url: http://127.0.0.1:8033/hooks/generic
headers:
  x-source: telo-example
---
kind: Notify.Slack
metadata: { name: teamChat }
webhookUrl: http://127.0.0.1:8033/hooks/slack
---
kind: Run.Sequence
metadata: { name: demo }
with:
  - kind: Http.Server
    metadata: { name: Receiver }
    host: 127.0.0.1
    port: 8033
    openapi:
      info:
        title: Fake webhook receiver
        version: 1.0.0
    mounts:
      - path: /hooks
        mount: !ref inbox
targets:
  - !ref Receiver
steps:
  - name: generic
    invoke: !ref deploys
    inputs:
      payload:
        event: deploy.finished
        service: checkout
        version: "2026.8.1"
  - name: slack
    invoke: !ref teamChat
    inputs:
      text: "checkout 2026.8.1 is live"
  - name: report
    invoke: !ref Console.writeLine
    inputs:
      output: !cel >-
        '{green ✔} webhook -> HTTP ' + string(steps.generic.result.status) +
        ', slack -> HTTP ' + string(steps.slack.result.status)
---
# The stand-in receiver: prints whatever arrives so you can see both payload
# shapes — the generic one verbatim, and Slack's `{text: …}` built by `base:`.
kind: Http.Api
metadata: { name: inbox }
routes:
  - request:
      path: /generic
      method: POST
    handler: !ref echo
    inputs:
      label: generic
      body: !cel "request.body"
    returns:
      - status: 200
        content:
          application/json:
            body: { ok: true }
  - request:
      path: /slack
      method: POST
    handler: !ref echo
    inputs:
      label: slack
      body: !cel "request.body"
    returns:
      - status: 200
        content:
          application/json:
            body: { ok: true }
---
kind: Run.Sequence
metadata: { name: echo }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [ label, body ]
    properties:
      label: { type: string }
      body: { type: object, additionalProperties: true }
steps:
  - name: print
    invoke: !ref Console.writeLine
    inputs:
      output: !cel "'{dim received on /' + inputs.label + ':} ' + json(inputs.body)"
