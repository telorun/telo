kind: Telo.Application
metadata:
  name: InheritedChildFieldsTest
  version: 1.0.0
imports:
  Ph: ./__fixtures__/inherited-client/telo.yaml
  Run: ../modules/run
  Assert: ../modules/assert
# Publication is asserted with no network in the sequence: a merge-form child's
# reading is a function of its config, and gating it behind a live request would
# take this coverage down with any outage.
targets:
  - !ref testInheritedChildFields
---
# A merge-form child of Http.Client. `label` is the child's own field; `baseUrl`
# and `timeout` are the parent's, one set by the author and one left to the
# parent's normalized default.
kind: Ph.TaggedClient
metadata:
  name: tagged
baseUrl: https://example.com
label: demo
---
# A merge-form child of Http.Request, which declares NO snapshot() of its own —
# so own-field publication cannot rely on the parent having one.
kind: Ph.TaggedRequest
metadata:
  name: taggedRequest
url: https://example.com/x
method: GET
plain: literal
timeout: 5000
tag: !cel "'computed'"
---
kind: Run.Sequence
metadata:
  name: testInheritedChildFields
steps:
  # The child's own field publishes beside the parent's reading, and an unset
  # inherited field keeps the parent's default rather than being overwritten.
  - name: ownFieldPublished
    inputs:
      actual: !cel "resources.tagged"
      expected:
        baseUrl: https://example.com
        headers: {}
        timeout: 10000
        followRedirects: true
        label: demo
    invoke:
      kind: Assert.Equals

  # `plain` publishes. `tag` does NOT: a runtime-eval field is still a compiled
  # expression when the reading is taken, and publishing it would put the
  # sentinel object in the CEL scope under a slot declared `type: string`.
  # `timeout` does NOT either: it is a redeclared INHERITED field, and narrowing
  # a schema must not override what the parent controller chose to publish —
  # Http.Request publishes no reading at all, so an overlay keyed on "every name
  # the child mentions" would invent one.
  - name: guardsWithholdNonReadings
    inputs:
      actual: !cel "resources.taggedRequest"
      expected:
        plain: literal
    invoke:
      kind: Assert.Equals
