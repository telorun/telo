kind: Telo.Application
metadata:
  name: ServesTheApiTest
  version: 1.0.0
  description: |
    Integration test: mount the exported route on a server the test itself owns,
    then call it over the network. The server is declared in the sequence's
    `with:` block, so it starts before the first step and is torn down after the
    last one — the port is free again the moment the test ends, and the run
    exits on its own instead of hanging on a listening socket.
imports:
  Api: ../api
  Http: oci://ghcr.io/telorun/http-server@0.44.1#sha256-0eFkBJRNr4r2hyQCBHcmTKEJU24Fy76Zw5ajQMUZyEs
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: Http.Server
    metadata: { name: server }
    listen: { port: 8971, address: 127.0.0.1 }
    openapi: { info: { title: Cart pricing under test, version: 1.0.0 } }
    mounts:
      - path: /cart
        mount: !ref Api.cartApi
targets:
  - !ref server
steps:
  - name: price
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/cart/price
      method: POST
    inputs:
      body:
        items:
          - { sku: jacket, unitCents: 10000, quantity: 1 }
          - { sku: pin, unitCents: 500, quantity: 2 }
  - name: verifyPriced
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.price.result.status"
        body: !cel "steps.price.result.body"
      expected:
        status: 200
        body: { subtotalCents: 11000, discountCents: 1100, totalCents: 9900 }

  # The route declares its request schema, so a malformed body is refused before
  # the handler runs. Asserting the 400 is what keeps that guarantee from being
  # quietly removed later.
  - name: badBody
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/cart/price
      method: POST
    inputs:
      body:
        items:
          - { sku: pin, unitCents: 500 }
  - name: verifyRejected
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.badBody.result.status"
      expected: 400
