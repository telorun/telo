kind: Telo.Library
metadata:
  name: PDF
  version: 0.8.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Data]
  description: |
    Working with PDF documents: render a page to an image at a chosen scale, read the
    text a document renders, and add editable form fields — text boxes, checkboxes,
    signatures — at measured positions. Rendering and field placement share one
    coordinate space, the pixels of the rendered image from the top-left, so what a
    model or a human measures on the image is where the field lands.
exports:
  kinds:
    - Rasterizer
    - Text
    - FormFields
---
# Rasterizer: PDF bytes → one page as a PNG image.
#
# Renders with pdf.js onto a server-side canvas. The reported width/height are
# the rendered pixel dimensions at the configured scale — the coordinate space
# downstream consumers (e.g. Pdf.FormFields, Image.Overlay) measure against.
kind: Telo.Definition
metadata:
  name: Rasterizer
  description: Renders one page of a PDF to an image at a configurable scale, reporting the pixel dimensions.
capability: Telo.Invocable
controllers:
  - pkg:npm/@telorun/pdf@0.8.0?local_path=./nodejs#rasterizer
throws:
  codes:
    ERR_INVALID_INPUT:
      description: >-
        data is not a Uint8Array, is not parseable as a PDF, page is out of
        range, format is not png/jpeg/webp, or quality is not an integer
        between 1 and 100.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      data:
        type: object
        description: Buffered PDF bytes (a Uint8Array, e.g. the `bytes` produced by Octet.Decoder).
      page:
        type: integer
        minimum: 1
        default: 1
        description: 1-based page number to render.
      format:
        type: string
        enum: [ png, jpeg, webp ]
        description: Output image format. Takes precedence over the resource-level format.
      quality:
        type: integer
        minimum: 1
        maximum: 100
        description: Encoder quality for the lossy formats (jpeg/webp); ignored for png.
    required: [ data ]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      image:
        type: object
        description: Rendered page as buffered image bytes (a Uint8Array) in the chosen format.
      width:
        type: integer
        description: Rendered image width in pixels (page width × scale).
      height:
        type: integer
        description: Rendered image height in pixels (page height × scale).
      pageCount:
        type: integer
        description: Total number of pages in the document.
      scale:
        type: number
        description: >-
          The render scale the image was produced at — wire it into a
          Pdf.FormFields invocation's `scale` so the coordinate contract is a
          value, not a convention.
      mediaType:
        type: string
        description: >-
          MIME type of the encoded image (image/png, image/jpeg, or
          image/webp) — wire it into a vision message's image part.
    required: [ image, width, height, pageCount, scale, mediaType ]
    additionalProperties: false
schema:
  type: object
  examples:
    - scale: 2
  properties:
    scale:
      title: Scale
      type: number
      exclusiveMinimum: 0
      maximum: 8
      default: 1
      description: >-
        Render scale over the PDF's native size (1 ≈ 72 DPI). Pin to the same
        value as the Pdf.FormFields consuming the measured coordinates.
    format:
      title: Format
      type: string
      enum: [ png, jpeg, webp ]
      default: png
      description: >-
        Output image format. png keeps text and lines crisp; jpeg/webp shrink
        the payload for a vision model. Runtime inputs.format takes precedence.
    quality:
      title: Quality
      type: integer
      minimum: 1
      maximum: 100
      default: 80
      description: Encoder quality for the lossy formats (jpeg/webp); ignored for png.
  additionalProperties: false
---
# Text: PDF bytes → the text the document renders, per page.
#
# The counterpart to Rasterizer. Rasterizing answers what a page LOOKS LIKE,
# which is a question about pixels and moves with the platform's font
# rasterization; this answers what it SAYS, which is what an assertion about a
# generated document needs.
kind: Telo.Definition
metadata:
  name: Text
  description: >-
    Extracts the text a PDF renders, as one string per page and as the whole document.
    Reading order is the order the producer wrote the content in, with a line break at
    each end-of-line — not a layout reconstruction, so a multi-column page reads column
    by column. Reports the document's page count.
capability: Telo.Invocable
controllers:
  - pkg:npm/@telorun/pdf@0.8.0?local_path=./nodejs#text
throws:
  codes:
    ERR_INVALID_INPUT:
      description: data is not a Uint8Array, is not parseable as a PDF, or page is out of range.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [data]
    additionalProperties: false
    properties:
      data:
        title: Data
        description: Buffered PDF bytes.
        x-telo-type: Telo.Bytes
      page:
        title: Page
        description: Read only this 1-based page. Every page is read when omitted.
        type: integer
        minimum: 1
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [text, pages, pageCount]
    additionalProperties: false
    properties:
      text:
        title: Text
        description: Every page's text, joined with a line break.
        type: string
      pages:
        title: Pages
        description: One entry per page read — the whole document, or just `page`.
        type: array
        items: { type: string }
      pageCount:
        title: Page count
        description: How many pages the document has, whatever `page` selected.
        type: integer
schema:
  type: object
  additionalProperties: false
---
# FormFields: PDF bytes + field placements → PDF bytes with editable AcroForm fields.
#
# Coordinates are pixels of the image Pdf.Rasterizer renders at the same
# `scale`, origin top-left — the conversion to PDF user space (points,
# bottom-left origin) happens inside the controller, so manifests and vision
# models never translate coordinates.
kind: Telo.Definition
metadata:
  name: FormFields
  description: >-
    Adds editable form fields — text boxes and checkboxes — to an existing PDF at
    positions measured in rendered-image pixels, and returns the new document's bytes.
capability: Telo.Invocable
controllers:
  - pkg:npm/@telorun/pdf@0.8.0?local_path=./nodejs#form-fields
throws:
  codes:
    ERR_INVALID_INPUT:
      description: >-
        data is not a Uint8Array or not parseable as a PDF, a field's page is
        out of range, a field name collides (within the input or with an
        existing document field), or a box falls outside the page bounds.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      data:
        type: object
        description: Buffered PDF bytes (a Uint8Array).
      fields:
        type: array
        minItems: 1
        items:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              description: AcroForm field name; must be unique within the document.
            type:
              type: string
              enum: [ text, checkbox ]
              description: Field widget type.
            page:
              type: integer
              minimum: 1
              description: 1-based page number the field sits on.
            x:
              type: number
              minimum: 0
              description: Left edge in rendered-image pixels (top-left origin).
            y:
              type: number
              minimum: 0
              description: Top edge in rendered-image pixels (top-left origin).
            width:
              type: number
              exclusiveMinimum: 0
              description: Box width in rendered-image pixels.
            height:
              type: number
              exclusiveMinimum: 0
              description: Box height in rendered-image pixels.
          required: [ name, type, page, x, y, width, height ]
          additionalProperties: false
      scale:
        type: number
        exclusiveMinimum: 0
        maximum: 8
        description: >-
          The render scale the pixel coordinates were measured at — wire the
          producing render step's `result.scale` here. Takes precedence over
          the resource-level `scale` when set.
    required: [ data, fields ]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      data:
        type: object
        description: New PDF as buffered bytes (a Uint8Array) with the AcroForm fields added.
    required: [ data ]
    additionalProperties: false
schema:
  type: object
  examples:
    - scale: 2
  properties:
    scale:
      title: Scale
      type: number
      exclusiveMinimum: 0
      maximum: 8
      default: 1
      description: >-
        The render scale the incoming pixel coordinates were measured at —
        must match the Pdf.Rasterizer that produced the image. Runtime
        `inputs.scale` takes precedence when set.
  additionalProperties: false
