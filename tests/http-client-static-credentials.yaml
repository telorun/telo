kind: Telo.Application
metadata:
  name: HttpClientStaticCredentials
  version: 1.0.0
  description: |
    The three static credentials, against a server that reports back what it was
    sent — so each assertion is about the bytes on the wire rather than about the
    credential's own return value.

    `Http.Credential` had one implementation before these, which is why every
    module talking to a keyed API grew its own `apiKey` field: a second way to
    say the same thing, and a second place for the 401 retry not to happen.
imports:
  Server: ../modules/http-server
  Http: ../modules/http-client
  Run: ../modules/run
  Assert: ../modules/assert
  JS: ../modules/javascript
targets:
  - !ref Test
---
# Reflects the credential-bearing parts of the request back as data, so the test
# asserts what the server received rather than what the client intended.
kind: JS.Script
metadata: { name: Reflect }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [authorization, apiKey, queryKey]
    properties:
      authorization: { type: string }
      apiKey: { type: string }
      queryKey: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [authorization, apiKey, queryKey]
    properties:
      authorization: { type: string }
      apiKey: { type: string }
      queryKey: { type: string }
code: |
  function main({ authorization, apiKey, queryKey }) {
    return { authorization, apiKey, queryKey };
  }
---
kind: Http.BearerToken
metadata: { name: bearer }
token: t0ken-value
---
# A non-default scheme, so the field is proven to reach the wire rather than
# being accepted and ignored.
kind: Http.BearerToken
metadata: { name: tokenScheme }
token: t0ken-value
scheme: Token
---
kind: Http.ApiKeyHeader
metadata: { name: apiKey }
header: X-Api-Key
key: k3y-value
---
kind: Http.QueryKey
metadata: { name: queryKey }
parameter: key
key: q-value
---
kind: Http.Client
metadata: { name: bearerClient }
baseUrl: http://localhost:8881
credential: !ref bearer
---
kind: Http.Client
metadata: { name: schemeClient }
baseUrl: http://localhost:8881
credential: !ref tokenScheme
---
kind: Http.Client
metadata: { name: apiKeyClient }
baseUrl: http://localhost:8881
credential: !ref apiKey
---
kind: Http.Client
metadata: { name: queryKeyClient }
baseUrl: http://localhost:8881
credential: !ref queryKey
---
kind: Run.Sequence
metadata: { name: Test }
with:
  - kind: Server.Api
    metadata: { name: TestApi }
    routes:
      - request:
          path: /whoami
          method: GET
          schema:
            headers:
              type: object
              properties:
                authorization: { type: string }
                x-api-key: { type: string }
            query:
              type: object
              properties:
                key: { type: string }
        handler: !ref Reflect
        inputs:
          authorization: !cel "'authorization' in request.headers ? request.headers.authorization : ''"
          apiKey: !cel "'x-api-key' in request.headers ? request.headers['x-api-key'] : ''"
          queryKey: !cel "'key' in request.query ? request.query.key : ''"
        returns:
          - status: 200
            content:
              application/json:
                schema:
                  type: object
                  required: [authorization, apiKey, queryKey]
                  properties:
                    authorization: { type: string }
                    apiKey: { type: string }
                    queryKey: { type: string }
                body:
                  authorization: !cel "result.authorization"
                  apiKey: !cel "result.apiKey"
                  queryKey: !cel "result.queryKey"
  - kind: Server.Server
    metadata: { name: TestServer }
    port: 8881
    baseUrl: http://localhost:8881
    openapi:
      info: { title: Static Credentials, version: 1.0.0 }
    mounts:
      - path: /api
        mount: !ref TestApi
targets:
  - !ref TestServer
steps:
  - name: Bearer
    inputs:
      url: /api/whoami
      method: GET
    invoke:
      kind: Http.Request
      client: !ref bearerClient
      throwOnHttpError: true
  - name: AssertBearer
    inputs:
      actual: !cel "steps.Bearer.result.body.authorization"
      expected: "Bearer t0ken-value"
    invoke: !ref Assert.equals

  - name: Scheme
    inputs:
      url: /api/whoami
      method: GET
    invoke:
      kind: Http.Request
      client: !ref schemeClient
      throwOnHttpError: true
  - name: AssertScheme
    inputs:
      actual: !cel "steps.Scheme.result.body.authorization"
      expected: "Token t0ken-value"
    invoke: !ref Assert.equals

  - name: ApiKey
    inputs:
      url: /api/whoami
      method: GET
    invoke:
      kind: Http.Request
      client: !ref apiKeyClient
      throwOnHttpError: true
  - name: AssertApiKey
    inputs:
      actual: !cel "steps.ApiKey.result.body.apiKey"
      expected: k3y-value
    invoke: !ref Assert.equals

  - name: QueryKey
    inputs:
      url: /api/whoami
      method: GET
    invoke:
      kind: Http.Request
      client: !ref queryKeyClient
      throwOnHttpError: true
  - name: AssertQueryKey
    inputs:
      actual: !cel "steps.QueryKey.result.body.queryKey"
      expected: q-value
    invoke: !ref Assert.equals

  # Material that resolved to nothing is refused AT the credential. Sent, it
  # would come back as the server's 401 — a failure reported one indirection
  # away from the manifest line that has to change.
  - name: Blank
    try:
      - name: Call
        inputs:
          url: /api/whoami
          method: GET
        invoke:
          kind: Http.Request
          client: !ref blankClient
          throwOnHttpError: true
    catch:
      - name: AssertBlankRefused
        inputs:
          actual: !cel "error.code"
          expected: ERR_INVALID_CREDENTIAL
        invoke: !ref Assert.equals
---
kind: Http.BearerToken
metadata: { name: blank }
token: ""
---
kind: Http.Client
metadata: { name: blankClient }
baseUrl: http://localhost:8881
credential: !ref blank
