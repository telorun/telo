kind: Run.Sequence
metadata:
  name: testIncludeGlob
steps:
  - name: multiply
    inputs:
      x: 7
      y: 6
    invoke:
      kind: Run.Value
      inputType:
        kind: Telo.JsonSchema
        schema:
          type: object
          properties:
            x: { type: number }
            y: { type: number }
      value:
        product: !cel "inputs.x * inputs.y"
  - name: verifyProduct
    inputs:
      product: "${{ steps.multiply.result.product }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          product:
            type: number
            const: 42
        required:
          - product
