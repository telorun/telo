# One control set for the whole application, however many imports reach it.
kind: Telo.Library
metadata:
  name: UiReactSharedControls
  version: 1.0.0
  description: >-
    Test fixture: a shared library exporting one control set implementing the
    box control.
lifecycle: shared
imports:
  UiReact: ../../../../../
exports:
  resources: [boxes]
  browser:
    - specifier: "@fixture/shared-boxes"
      path: ./browser/checkbox.js
      source: ./checkbox.js
      abi: ui_react_controls-2
      external: [react, react/jsx-runtime, react-dom]
      exports: [Checkbox]
---
kind: UiReact.Controls
metadata:
  name: boxes
entry: "@fixture/shared-boxes"
implements: [Checkbox]
