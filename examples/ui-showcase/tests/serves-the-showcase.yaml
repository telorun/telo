            - [ Contact, [ assignee, contact ], { type: string, format: uri } ]
            - [ Project, [ project, code ], { type: string } ]
            - [ Project name, [ project, name ], { type: string } ]
            - [ Brief, [ project, brief ], { type: string, format: uri-reference } ]
        byQuery:
