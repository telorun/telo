kind: Telo.Library
metadata:
  name: Sessions
  version: 0.0.0
  description: One instance for the whole application, needing a signing key.
lifecycle: shared
imports:
  Fx: ../../../types
needs:
  signingKey:
    kind: Fx.SigningKey
---
# Reads the key, so every application reaching this library needs it.
kind: Fx.SigningKey
metadata: { name: signer }
fields:
  value: !cel "resources.signingKey.value"
