kind: Telo.Application
metadata:
  name: PriceApp
  version: 1.0.0
  description: >-
    An application that calls the library's functions from its own CEL: in a
    route's response, with and without the optional argument.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.43.0#sha256-cmk_CIEwtw9Tpv3LjPVqstfObUL4owHq410ST-nn8fI
  Run: oci://ghcr.io/telorun/run@0.32.0#sha256-4BOwkyKZuEAr-gDIkQWEzA1UszTNrIGHyv9GFnnUkv8
  Pricing: ../..
targets:
  - !ref server
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8204
---
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
mounts:
  - path: /
    mount: !ref routes
---
kind: Http.Api
metadata: { name: routes }
routes:
  - request:
      path: /price
      method: GET
      schema:
        query:
          type: object
          required: [ name, unitNet, quantity ]
          properties:
            name: { type: string }
            unitNet: { type: integer, minimum: 0 }
            quantity: { type: integer, minimum: 1 }
    handler:
      kind: Run.Value
      value: {}
    inputs: {}
    returns:
      - status: 200
        content:
          application/json:
            body:
              slug: !cel "Pricing.slugify(request.query.name)"
              quote: !cel "Pricing.quote(request.query.unitNet, request.query.quantity)"
              label: !cel "Pricing.formatMoney(Pricing.quote(request.query.unitNet, request.query.quantity).gross)"
              reducedRate: !cel "Pricing.withVat(request.query.unitNet, 0.08)"
              dollars: !cel "Pricing.formatMoney(request.query.unitNet, '$')"
