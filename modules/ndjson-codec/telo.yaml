kind: Telo.Library
metadata:
  name: NdjsonCodec
  version: 0.9.3
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Data, Streaming]
  description: |
    Newline-delimited JSON on the wire: a stream of records becomes bytes carrying one
    JSON document per line, the usual shape for line-oriented log and event feeds that
    a consumer can read incrementally. Encoding only for now; decoding is not yet
    implemented.
imports:
  Codec: ../codec
exports:
  kinds:
    - Encoder
---
# Encoder: any JSON-serializable record → NDJSON line bytes. If the upstream
# iterable throws, emits a final `{"type":"error","error":{"message":...}}` line
# and ends — consumers see a well-formed NDJSON stream that terminates with an
# error record.
kind: Telo.Definition
metadata:
  name: Encoder
  description: >-
    Encodes each record of a stream as one line of JSON bytes. If the source fails
    mid-stream it emits a final error record, so consumers always see a well-formed
    line-delimited stream.
capability: Telo.Invocable
extends: Codec.Encoder
controllers:
  - pkg:telo/local/js?path=./nodejs/ndjson-codec.mjs&local_path=./nodejs/src/index.ts#EncoderController
schema:
  type: object
  additionalProperties: false
