modules:
  modules/mcp-client: Added
body: "Mcp.Client carries prompts/list and prompts/get: the method set is now
  tools/call, tools/list, prompts/list and prompts/get, and both Mcp.HttpClient and
  Mcp.StdioClient answer the two prompt methods with the server result payload, returned
  verbatim over both transports and unchecked against any result schema. Any other
  method is still refused by telo check at the call site."
