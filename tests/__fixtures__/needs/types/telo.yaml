kind: Telo.Library
metadata:
  name: NeedFixtures
  version: 0.0.0
  description: Need types the needs tests ask for.
exports:
  kinds: [DatabaseAccess, SigningKey]
---
kind: Telo.NeedType
metadata:
  name: DatabaseAccess
  description: The address and credentials of a database.
fields:
  url: { type: string, x-telo-sensitive: true }
  schema: { type: string }
required: [url]
parameters:
  type: object
  properties:
    extensions: { type: array, items: { type: string } }
  additionalProperties: false
---
kind: Telo.NeedType
metadata:
  name: SigningKey
  description: A key to sign with.
fields:
  value: { type: string, x-telo-sensitive: true }
required: [value]
