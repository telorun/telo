kind: Telo.Library
metadata:
  name: Orders
  version: 0.0.0
  description: Needs a database with an extension.
imports:
  Types: ../types
needs:
  databaseAccess:
    kind: Types.DatabaseAccess
    parameters: { extensions: [pgvector] }
---
# Reads the database, so every configuration of an importer requires it.
kind: Types.SigningKey
metadata: { name: connection }
fields:
  value: !cel "resources.databaseAccess.url"
