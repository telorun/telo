# A node whose type is misspelled, a node carrying a key its type does not
# take, a link and a menu item whose address a browser reads as another host,
# a column giving both a value and a cell, and a component handed a property
# its export does not declare.
kind: Telo.Application
metadata:
  name: UiInvalidShapesApp
  version: 1.0.0
imports:
  Ui: ../../../../
  DataModel: ../../../../../data-model
  Widgets: ../../widgets
---
kind: Ui.View
metadata:
  name: misspelled
content:
  type: stak
  children: []
---
kind: Ui.View
metadata:
  name: strayKey
content:
  type: stack
  children:
    - { type: text, text: Title, gap: 3 }
---
kind: Ui.View
metadata:
  name: offsiteLink
content: { type: link, text: Elsewhere, href: //evil.example/x }
---
kind: Ui.View
metadata:
  name: offsiteItem
content:
  type: menu
  text: Choose
  items:
    - { type: link, text: Here, href: /here }
    - { type: link, text: Elsewhere, href: //evil.example/x }
---
kind: Telo.JsonSchema
metadata:
  name: Todo
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
    text: { type: string }
    isDone: { type: boolean }
---
kind: Ui.Component
metadata:
  name: pill
component: !ref Widgets.statusPill
model: !ref Todo
props:
  done: !cel "row.isDone"
  colour: red
---
kind: Ui.Listing
metadata:
  name: both
model: !ref Todo
presentation:
  kind: Ui.CollectionPresentation
  source:
    kind: Ui.CollectionSource
    basePath: /api/todos
    collection: { kind: DataModel.Collection, model: !ref Todo, query: { filters: [], sort: [] } }
layout:
  kind: Ui.TableLayout
  columns:
    - value: !cel "row.text"
      cell: !ref pill
    - value: !cel "row.txt"
