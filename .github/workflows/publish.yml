name: Publish

# Runs on a release branch only: pushes to main publish nothing. The branch's own
# copy of this file does the work, so a fix to the pipeline is a PR into the branch.
# A branch is frozen once a newer `release/*` branch exists, and every job below
# refuses on it as its first step.

on:
  push:
    branches: ["release/*"]
  # Recovery. Every job here derives its work from what is already published rather
  # than from a previous step's exit code, so a dispatch re-runs them safely: npm
  # publish skips what exists, module publish skips an already-pushed version, and
  # the GitHub Release step skips a tag that already has one.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # npm packages ONLY. `pnpm run release` is `changeset publish` and nothing else;
  # module artifacts and Docker images are published by the jobs below / by
  # publish-docker.yml, so neither can fail this job and none of the three can
  # strand another.
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      # candidate | final | patch | none — what this run released (release-channel.mjs).
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      # `.changeset/pre.json` exists: the branch is in candidates.
      candidates: ${{ steps.release.outputs.candidates }}
      # What main takes back (the tag, or the commit): empty for a candidate.
      merge-ref: ${{ steps.release.outputs.merge-ref }}
    steps:
      # TELO_BOT_TOKEN: the Version PR is pushed with the checkout's credentials, and
      # a push made with the default token starts no checks.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TELO_BOT_TOKEN }}

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r --if-present build

      # The release run's own tag, known before anything publishes: pack links in
      # the published tarballs (and the .vsix) point at it. `v<cli version>` when
      # this commit moves the CLI, else the numbered `packages-<x.y>-<n>`.
      - name: Name the release tag
        id: planned
        run: node scripts/release-channel.mjs pack-tag

      # `createGithubReleases: false` — the action has no per-package filter, and
      # `changeset publish` publishes module-owned packages too (their versions are
      # moved by `telo release apply`, so the action sees a version npm does not
      # have yet). That put a module's release on the npm release page under an npm
      # package's name. Releases are created by the step below instead, which knows
      # which packages a module owns.
      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # The Version PR is `changeset-release/<this branch>`, based on it. The
          # branch's first one enters prerelease mode (`rc`); inside it, changesets
          # publishes under the `rc` dist-tag. A Version PR whose head has no
          # `.changeset/pre.json` (Finish release) is the final, and rebuilds as one.
          # The bot token pushes the PR branch and opens the PR, so the required
          # checks run on it; the changeset gate exempts its head branch.
          version: pnpm run version-release
          publish: pnpm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          # The version step asks for the open Version PR.
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TELO_PACK_LINKS_TAG: ${{ steps.planned.outputs.tag }}

      # Opening or updating the Version PR leaves the checkout on that PR's version
      # commit, which would classify (and tag) a release that never merged.
      - name: Return to the run's commit
        run: git checkout --quiet --detach "$GITHUB_SHA"

      # Read from the commit, not from the action's output, so a re-run of an old
      # publish classifies as the first did.
      - name: Classify the release
        id: release
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/release-channel.mjs classify

      # `changeset publish` tags per package only. The release tag is made here,
      # before the GitHub Release step and the merge-back that names it, with the
      # bot token the rulesets let create `v*` tags.
      - name: Tag the release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
        run: node scripts/release-tag.mjs "${{ steps.release.outputs.tag }}"

      # `rc` follows a final or patch, and only forward. A candidate publishes under
      # `rc` already.
      - name: Move the rc dist-tag
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: node scripts/release-dist-tags.mjs

      # ONE release for the cycle, tagged `v<cli version>`, with the changes grouped
      # by changeset rather than by package — a changeset that moves five packages
      # used to produce five releases carrying the same text. Modules are released as
      # OCI artifacts and discovered through the hub; their changelog lives in the
      # module directory and they get no GitHub Release. A cycle that does not move
      # the CLI has no version to name itself after and falls back to one release per
      # package (only `runner-core` and `k8s-runner` can reach that path).
      # Deliberately NOT gated on `steps.changesets.outputs.published`. Re-running this
      # job re-runs `changeset publish`, which finds everything already on npm and
      # reports `published: false` — so a transient failure here (rate limit, 5xx,
      # token scope) used to make the release permanently missing, with no way to
      # retry it. The script decides for itself: it skips a tag that already has a
      # release, and recovers the package set from this commit's version bumps when
      # the action reports none.
      - name: Create the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The aggregate tag does not exist yet — `changeset publish` creates only
          # the per-package ones — so the release is anchored to this exact commit
          # rather than to wherever the default branch has moved to.
          GITHUB_SHA: ${{ github.sha }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          # A candidate is a pre-release; only a final or patch can be `latest`.
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: node scripts/github-releases.mjs

  # Module ARTIFACTS publish here, not in the npm release script.
  #
  # TWO INDEPENDENT LEDGERS: npm packages (changesets) and module artifacts (`telo
  # release`). The job builds artifacts with the WORKSPACE CLI (`node
  # ./cli/nodejs/bin/telo.mjs`, `--skip-controllers`), so nothing resolves from npm;
  # it runs after the npm `release` job of the same run only so that every floor a
  # module declares names a published telo. No module publishes in candidates.
  #
  # Both gates in the script are idempotent (version moved in this commit, or
  # version absent at the registry), so nothing is republished. A module release
  # from the branch is tagged `modules-<major>.<minor>-<n>` and merged back.
  # `vars.TELO_OCI_REGISTRY` unset skips it entirely.
  publish-modules:
    name: Publish module artifacts
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.candidates != 'true' && vars.TELO_OCI_REGISTRY != '' }}
    permissions:
      contents: read
      packages: write
    outputs:
      modules-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD^ for the version-moved gate, tags for the numbering

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r --if-present build

      # The OCI transport reads the ambient Docker credential chain, so logging in
      # here is what authorizes the push.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A mirror cannot be built up incrementally from empty: `telo publish`
      # hard-fails when a relative sibling does not already resolve at the
      # destination. `scripts/publish-oci-backfill.mjs` repairs a partially-pushed
      # mirror.
      - name: Publish module manifests
        id: publish
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: pnpm run publish-modules

      # Only a release that moved module versions in this commit is tagged.
      - name: Number the module release
        id: number
        if: steps.publish.outputs.moved != '' && steps.publish.outputs.moved != '0'
        run: node scripts/release-channel.mjs modules-tag

      - name: Tag the module release
        id: tag
        if: steps.number.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
        run: |
          node scripts/release-tag.mjs "${{ steps.number.outputs.tag }}"
          echo "tag=${{ steps.number.outputs.tag }}" >> "$GITHUB_OUTPUT"

  # The built-in vocabulary of every telo release, `<registry>/telo@<version>`.
  #
  # Its source is npm, not this checkout: each `@telorun/analyzer` release ships
  # its archive at `src/builtin-vocabulary/`, and `scripts/publish-builtins.mjs`
  # pushes that directory, taken out of the released tarball, for every version
  # whose tag is missing — so the artifact is the release's own bytes, published
  # by the checkout's CLI. Not a step of the npm `release` job, where a failure
  # after `changeset publish` would have nothing to retry: this reconciles on every
  # push of the branch, so a missed version heals on the next one. It runs after `release` (and
  # whatever it did) so the version that job just published is pushed in the same
  # run. `vars.TELO_OCI_REGISTRY` unset skips it, as it does module publishing.
  publish-builtins:
    name: Publish the built-in vocabulary
    runs-on: ubuntu-latest
    needs: release
    if: ${{ always() && vars.TELO_OCI_REGISTRY != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r --if-present build

      # The OCI transport reads the ambient Docker credential chain.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the built-in vocabulary of each release
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node scripts/publish-builtins.mjs

  # Modules are versioned by `telo release`, not by changesets, and they get their
  # OWN Version PR — always, independently of whether npm changesets are pending.
  #
  # They used to ride the changesets PR whenever one existed, which made a single
  # review cover two ledgers: approving a patch to one npm package also approved
  # every module republish in the same commit, and a release routinely republishes
  # sixty of them because a shared library reached their bundles. Splitting them
  # means each PR is reviewable against the ledger it moves, and the module PR can
  # say in its body exactly what merging it will publish.
  # The Module Release PR waits for the final: not while the branch is in
  # candidates (`.changeset/pre.json`), nor while its changesets still plan a
  # release, so every module version publishes after the telo it names a floor of.
  module-gate:
    name: Module Release PR gate
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.result == 'success' }}
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Is the branch ready for module releases
        id: ready
        run: node scripts/release-channel.mjs modules-ready

  module-release:
    name: Module Release PR
    runs-on: ubuntu-latest
    needs: module-gate
    if: ${{ needs.module-gate.outputs.ready == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r --if-present build

      # CAPTURED BEFORE APPLY. `telo release apply` consumes the fragments the
      # changelog entries come from, so a plan read afterwards can say which
      # versions moved but not why — which is the half of the body worth reading.
      - name: Capture the release plan
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node ./cli/nodejs/bin/telo.mjs release status -o json --base HEAD > /tmp/release-plan.json

      # Writes every planned version into each manifest its module owns, appends
      # the changelogs, updates the ledger, and deletes the fragments it consumed.
      # A no-op when nothing drifted, so the PR step below finds no changes and
      # opens nothing.
      - name: Apply the release plan
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node ./cli/nodejs/bin/telo.mjs release apply --base HEAD

      # A chart that deploys a module's image carries that module's version, so
      # it moves in the same PR as the version it names.
      - name: Stamp chart versions
        run: node scripts/stamp-chart-version.mjs

      - name: Render the PR body
        run: node scripts/module-release-pr-body.mjs /tmp/release-plan.json > /tmp/release-body.md

      - name: Open Module Release PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TELO_BOT_TOKEN }}
          branch: module-release/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "chore(release): version modules"
          commit-message: "chore(release): version modules"
          body-path: /tmp/release-body.md

  # Kernel images on every channel but `none`; the hub, runner, k8s-runner, hub-web
  # and authoring-agent images (and their charts) on finals, patches and module
  # releases, never in candidates. `latest`, `<major>` and `<major>.<minor>` move
  # only forward. A module release builds the app images on the branch's last
  # released telo, so this waits for module publishing.
  docker:
    name: Publish release Docker images
    needs: [release, publish-modules]
    if: >-
      ${{ always() && needs.release.result == 'success' &&
      (needs.release.outputs.published == 'true' || needs.release.outputs.channel != 'none' ||
      needs.publish-modules.outputs.modules-tag != '') }}
    # A called workflow's permissions can only be equal to or narrower than the
    # caller job's, so the k8s-runner CHART job's `packages: write` has to be
    # granted here as well — without it the helm push 403s on the release path
    # only, where nothing else exercises it.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      published-packages: ${{ needs.release.outputs.publishedPackages }}
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # The assets of the release `tag` names. Each is a called workflow, so the files
  # that build them are this branch's. The release is a DRAFT until the standalone
  # CLI's job publishes it, once every installer is attached and verified.
  cli-standalone:
    name: Standalone CLI
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.channel != 'none' }}
    permissions:
      contents: write
    uses: ./.github/workflows/cli-standalone-release.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # A candidate's `.vsix` is an asset of the pre-release; a final's or patch's also
  # goes to the Marketplace, which accepts no prerelease version.
  vscode:
    name: VS Code extension
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.channel != 'none' }}
    permissions:
      contents: write
    uses: ./.github/workflows/vscode-release.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # Studio publishes at the final: its desktop builds, web image and chart, and
  # its web build (an asset of the release, and the pages) — a candidate carries an
  # rc version and publishes none of it.
  studio:
    name: Studio
    needs: release
    if: ${{ needs.release.result == 'success' && (needs.release.outputs.channel == 'final' || needs.release.outputs.channel == 'patch') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/studio-release.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  studio-pages:
    name: Studio pages
    needs: release
    if: ${{ needs.release.result == 'success' && (needs.release.outputs.channel == 'final' || needs.release.outputs.channel == 'patch') }}
    permissions:
      contents: write
    uses: ./.github/workflows/studio-pages.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # Builds the docs site from the release's own tag, attaches it to the release,
  # and deploys: the newest final at `/`, and while a candidate is open its build
  # at `/next/`.
  site:
    name: Docs site
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.channel != 'none' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      deploy: true
    secrets: inherit

  # The release goes back to main: a PR from a branch created AT the tag, landing
  # with a merge commit, so main's ledgers hold what shipped. After every final,
  # patch, packages-only and module release, never after a candidate; a second PR for the same tag
  # is never opened. TELO_BOT_TOKEN so the PR starts checks.
  merge-back:
    name: Open merge-back PRs
    runs-on: ubuntu-latest
    needs: [release, publish-modules]
    if: >-
      ${{ always() && (
      (needs.release.result == 'success' && needs.release.outputs.merge-ref != '') ||
      (needs.publish-modules.result == 'success' && needs.publish-modules.outputs.modules-tag != '')) }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Merge the release back
        if: needs.release.result == 'success' && needs.release.outputs.merge-ref != ''
        run: node scripts/release-merge-back.mjs "${{ needs.release.outputs.merge-ref }}"

      - name: Merge the module release back
        if: needs.publish-modules.result == 'success' && needs.publish-modules.outputs.modules-tag != ''
        run: node scripts/release-merge-back.mjs "${{ needs.publish-modules.outputs.modules-tag }}"

  # Keeps the imports of the in-repo consumers — examples, starters, apps and
  # blueprints — pointing at what is published, in one pull request per branch,
  # reaching main through the merge-back. Runs after module publishing, on finals,
  # patches and module releases. `telo upgrade --pin-local` rewrites a relative import only when
  # the release plan says the module's published artifact is the working copy's, and
  # leaves the rest relative with the reason, which the PR body lists. It runs no
  # tests; TELO_BOT_TOKEN opens the PR so the branch's checks run on it.
  sync-imports:
    name: Sync imports
    runs-on: ubuntu-latest
    needs: [release, publish-modules]
    if: >-
      ${{ always() && needs.release.result == 'success' &&
      (needs.release.outputs.channel == 'final' || needs.release.outputs.channel == 'patch' ||
      needs.publish-modules.outputs.modules-tag != '') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release plan `--pin-local` reads is built by the workspace CLI.
      - name: Build workspace
        run: pnpm -r --if-present build

      # A failure here is recorded rather than fatal: the imports that could be
      # decided are still worth a pull request, and the last step fails the job.
      - name: Sync imports
        id: sync
        env:
          TELO_CLI: node ./cli/nodejs/bin/telo.mjs
        run: |
          set +e
          node scripts/upgrade-imports.mjs --pin-local --output=json > /tmp/sync-imports.json
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Render the PR body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/sync-imports-pr-body.mjs /tmp/sync-imports.json > /tmp/sync-imports-body.md

      # Opens nothing when no import moved.
      - name: Open the pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TELO_BOT_TOKEN }}
          branch: imports/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "chore(imports): sync imports with published modules"
          commit-message: "chore(imports): sync imports with published modules"
          body-path: /tmp/sync-imports-body.md

      - name: Fail when an import could not be decided
        if: steps.sync.outputs.status != '0'
        run: |
          echo "::error::telo upgrade exited ${{ steps.sync.outputs.status }} — see the 'Sync imports' step."
          exit 1
