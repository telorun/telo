kind: Telo.Library
metadata:
  name: NotesRepository
  version: 1.0.0
  description: |
    A reusable `Telo.Library` for a `notes` table: it owns the SQLite connection,
    the schema migration, and typed `SqlRepository` create/read resources, and
    exports them as ready-made singletons. Importers add `Migrate` to their
    `targets` and dispatch to `CreateNote` / `ListNotes` from their own routes —
    no hand-written SQL beyond the migration.
imports:
  Sql: oci://ghcr.io/telorun/sql@0.13.0#sha256-ARE0QGUj8CtyNKTgIwiBFnHq1YbH-3B6nK4TLmvg_aE
  SqlSqlite: oci://ghcr.io/telorun/sql-sqlite@0.4.0#sha256-Tx6iWpzDfFNKkmAmlzK74dsP1w4CR9e_jkU_EITvjb4
  SqlRepository: oci://ghcr.io/telorun/sql-repository@0.7.0#sha256-y4BcHm_rVxb-dE6esEYlFsksHmH3d7f2DfCCz7opjzs
exports:
  resources:
    - Migrate
    - CreateNote
    - ListNotes
---
kind: SqlSqlite.Connection
metadata:
  name: Db
file: ./tmp/notes.sqlite
---
kind: Sql.Migrations
metadata:
  name: Migrate
connection: !ref Db
migrations:
  0001_create_notes:
    statement: |
      CREATE TABLE IF NOT EXISTS notes (
        id         INTEGER PRIMARY KEY AUTOINCREMENT,
        title      TEXT    NOT NULL,
        body       TEXT,
        created_at DATETIME DEFAULT CURRENT_TIMESTAMP
      )
---
kind: SqlRepository.Create
metadata:
  name: CreateNote
connection: !ref Db
table: notes
---
kind: SqlRepository.Read
metadata:
  name: ListNotes
connection: !ref Db
table: notes
