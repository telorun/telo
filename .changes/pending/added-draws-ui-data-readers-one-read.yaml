modules:
  modules/ui-react: Added
body: Draws Ui.Data readers (one read in flight, one more for any triggers during it,
  stale answers never drawn, reload on focus and on a 401 inside the content), shown
  conditions over data, query, values and row with hidden content kept mounted and
  requestless, value and list nodes, field shown and Action enabled with disabled-text;
  validation interprets the full Ui.Match profile. Pages declare query parameters, the
  page document carries query, and a page condition cannot read request
  (x-telo-context-eval). New parts value, list, data, disabled-text; data-state on data.
  Requires telo >=0.121.0.
