modules:
  modules/http-server: Added
body: A multipart request body is accepted out of the box, as raw bytes. Fastify ships
  parsers for JSON and urlencoded only, so a route receiving a file upload answered 415
  before any handler ran — naming a media type the author really did send and pointing
  at no fix. Raw rather than text because decoding a multipart body as a string corrupts
  every binary part. A `contentTypeParsers` entry for an exact multipart type still
  works and takes precedence for that type alone — Fastify consults exact-string parsers
  before pattern ones — so customizing form-data leaves related and mixed on the
  default.
