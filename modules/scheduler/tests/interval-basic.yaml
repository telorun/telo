kind: Telo.Application
metadata:
  name: ScheduleIntervalTest
  version: 1.0.0
  description: |
    Brings a Schedule.Interval up as a `with:`-scoped boot target, lets it tick
    for a few periods, and asserts the body actually ran — then asserts a second
    schedule whose `when:` gate is false never fired at all.

    The schedule is torn down with the sequence, which also exercises the
    disarm-then-drain teardown path.
imports:
  Schedule: ../
  Cache: ../../cache
  CacheMemory: ../../cache-memory
  Timer: ../../timer
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref TestTicks
---
kind: CacheMemory.Store
metadata: { name: Counters }
---
kind: Cache.Entry
metadata: { name: Put }
store: !ref Counters
ttl: "60s"
---
kind: Cache.Lookup
metadata: { name: Get }
store: !ref Counters
---
# The scheduled body: bump a counter so ticks are observable.
kind: Run.Sequence
metadata:
  name: Bump
inputs:
  slot: { type: string }
steps:
  - name: read
    invoke: !ref Get
    inputs:
      key: !cel "inputs.slot"
  - name: write
    invoke: !ref Put
    inputs:
      key: !cel "inputs.slot"
      value: !cel "steps.read.result.state == 'miss' ? 1 : steps.read.result.value + 1"
---
kind: Run.Sequence
metadata:
  name: TestTicks
with:
  - kind: Schedule.Interval
    metadata: { name: Ticker }
    every: "80ms"
    invoke: !ref Bump
    inputs:
      slot: ticks
  # Same schedule, gated shut — proves `when: false` skips the dispatch entirely
  # rather than firing and discarding the result.
  - kind: Schedule.Interval
    metadata: { name: GatedTicker }
    every: "80ms"
    when: !cel "false"
    invoke: !ref Bump
    inputs:
      slot: gated
targets:
  - !ref Ticker
  - !ref GatedTicker
steps:
  - name: wait
    invoke: { kind: Timer.Delay }
    inputs:
      duration: "400ms"
      value: {}
  - name: readTicks
    invoke: !ref Get
    inputs: { key: ticks }
  # At 80ms over a 400ms window the body should have run several times; assert
  # "at least twice" so the test isn't a timing race on a loaded machine.
  - name: verifyFired
    inputs:
      actual: !cel "steps.readTicks.result.state != 'miss' && steps.readTicks.result.value >= 2"
      expected: true
    invoke: { kind: Assert.Equals }
  - name: readGated
    invoke: !ref Get
    inputs: { key: gated }
  - name: verifyGated
    inputs:
      actual: !cel "steps.readGated.result.state"
      expected: miss
    invoke: { kind: Assert.Equals }
