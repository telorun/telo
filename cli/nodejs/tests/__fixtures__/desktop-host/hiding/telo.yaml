kind: Telo.Application
metadata:
  name: DesktopHidingFixture
  version: 1.0.0
  description: One window the user closes by hiding it, and no tray icon, so hiding it leaves nothing to reach the app by.
lang: en
imports: { Desktop: ../../../../../../modules/desktop }
ports: { http: { env: DESKTOP_HIDING_PORT } }
needs:
  desktopHost:
    kind: Telo.DesktopHost
    parameters: { identifier: run.telo.tests.desktophiding, productName: Hiding, port: http }
targets:
  - !ref onlyWindow
---
kind: Desktop.Window
metadata: { name: onlyWindow }
host: !ref desktopHost
title: Only
onClose: hide
