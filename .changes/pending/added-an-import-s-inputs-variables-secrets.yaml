units:
  analyzer: Added
body: "An import's inputs — `variables:`, `secrets:`, `resources:`, `needs:`, `runtime:`
  — may now be chosen with `!if` / `!switch` at an `imports:` entry, a top-level
  `Telo.Import` and a scoped import, and every check of them holds each finding where
  its option is taken: host-path inputs, literals against the library's entries, the
  library's own choices read through the binding, which needs are left to the
  environment, the need table's supplies, resource inputs and shared-library agreement.
  An import's alias, `kind`, `source` and `integrity` written behind `!if` / `!switch` /
  `!for-each` or a `...` splice is now refused by the loader before anything is expanded
  — at an `imports:` entry, a top-level `Telo.Import`, a `kind:` choosing `Telo.Import`,
  and a scope member — as `BRANCH_POSITION_INVALID` / `REPEAT_OUTSIDE_TEMPLATE` worded
  `Telo.Import/<alias>: '!<tag>' at '<field>' of the Telo.Import: …`, refused at load (a
  scope member's as `ERR_BRANCH_POSITION_INVALID` / `ERR_REPEAT_OUTSIDE_TEMPLATE`);
  before, a choice at an import's inputs was refused as `BRANCH_POSITION_INVALID`, and
  one at its source or integrity crashed the check or loaded the import unpinned. The
  `imports.<alias>.source` refusal changes its wording."
