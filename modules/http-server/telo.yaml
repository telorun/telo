kind: Telo.Library
metadata:
  name: HttpServer
  version: "0.36.0"
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Transport]
  description: >-
    Serving HTTP: a listener bound to a port with CORS, per-mount request guards for
    authentication and access checks, and a generated OpenAPI document, routers whose
    routes validate the request against a schema, map it into a handler with CEL, and
    render conditional typed responses buffered or streamed, a browsable API reference
    router, and a static file router with SPA fallback for shipping a frontend
    alongside the API.
requires:
  # Controllers return their effects from `init()` / `run()`; a runtime that does
  # not execute a returned chain allocates nothing and undoes nothing.
  #
  # Deliberately NOT raised for the scope-level `catches:` lists: verified by
  # execution, 0.87.0 reads this module with no issues, because both new
  # annotation forms degrade to silence there (`x-telo-catches-for: ""` is falsy,
  # so the list is skipped; `throwsThrough` is an unknown key inside an
  # x-telo-ref). A floor nothing can refute is a claim nothing checks.
  #
  # 0.91.0: a `sources:` entry claimed by an `assets:` pattern, which an older
  # analyzer rejects as SOURCE_ENTRY_UNCLAIMED, and `ctx.resolveControllerFile`,
  # which the Reference controller calls.
  #
  # 0.98.0: `Http.Static.root` is a `Telo.HostPath`, which 0.97.0 rejects as
  # X_TELO_TYPE_UNKNOWN (verified by execution).
  #
  # 0.104.0: the request span continues an inbound `traceparent` through
  # `openSpan`'s W3C carrier, which an older kernel ignores and so roots every
  # trace, and the controllers import `errorTypeOf` from the runtime's SDK, which
  # 0.103.2 does not export (its load fails; verified by execution).
  #
  # 0.108.0: the request binding copies a framework's own bag into a plain
  # object, asking the value domain with `isCelRecord`. `@telorun/sdk` is
  # external and collapsed to the runtime's own copy, so on a runtime whose SDK
  # does not export that name it is undefined and a route dies at creation with
  # a TypeError naming this module. Verified by execution: the published 0.107.0
  # tarball exports no such name.
  telo: ">=0.108.0"
imports:
  # Single source of truth for the returns:/catches: schema. EVERY slot anchors at
  # HttpDispatch.Outcomes/$defs/{Returns,Catches} — Server.notFoundHandler, the
  # two scope-level catch lists, and Api.routes[], which carried its own inline
  # copy of both shapes until they were collapsed here — so the entry shape, the
  # MIME negotiation rules and the buffer/stream oneOf live in exactly one place.
  HttpDispatch: ../http-dispatch
  # The response-encoder contract this module's own encoder slots pin.
  Codec: ../codec
exports:
  kinds:
    - Server
    - Api
    - Reference
    - Static
# Scalar's browser bundle, served by Reference. Lazily fetched: an app that
# declares no Reference never downloads it. `sources.scalar.version` must be the
# @scalar/fastify-api-reference release whose @scalar/core and
# @scalar/openapi-parser versions nodejs/package.json pins — the page HTML and the
# script reading it come from one release; nodejs/tests/scalar-release.test.ts
# checks it.
assets:
  - ./assets/
sources:
  scalar:
    version: 1.44.6
    url: https://registry.npmjs.org/@scalar/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/scalar.LICENSE]
    entries:
      ./assets/scalar/standalone.js:
        { upstream: fastify-api-reference, member: package/dist/js/standalone.js, sha256: 06257160bce05df2dd25eeced830c5e3de2ac82e59bd2861db74fc068a4e429d, executable: false }
      ./notices/scalar.LICENSE:
        { upstream: fastify-api-reference, member: package/LICENSE, sha256: 380cd0a6ad700e1f821f2a509f0dd9ff835041cee2d43daf5dedc1adb2bcc620, executable: false }
---
kind: "Telo.Definition"
metadata:
  name: "Server"
  description: >-
    Listens on a TCP port and serves HTTP through the routers mounted on it, with
    CORS, a per-mount request guard for authentication and access checks, a
    generated OpenAPI document and custom content-type parsers. Request bodies are
    bounded in bytes: a larger one is answered 413, and a body nobody reads to its
    end closes the connection.
capability: Telo.Service
controllers:
  - pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#HttpServerController
schema:
  type: "object"
  properties:
    host:
      title: Host
      description: Host interface for the HTTP server.
      type: "string"
      x-telo-eval: compile
      default: "0.0.0.0"
    port:
      title: Port
      description: TCP port used by the HTTP server.
      type: "integer"
      x-telo-eval: compile
      x-telo-type: Telo.TcpPort
      minimum: 1
      maximum: 65535
    baseUrl:
      title: Base URL
      description: External base URL used in generated links.
      type: "string"
      x-telo-eval: compile
    trustForwardedHeaders:
      title: Trust Forwarded Headers
      description: >-
        Trust the standard X-Forwarded-Proto / X-Forwarded-Host (RFC 7239)
        headers from a fronting proxy. When true, the request protocol/host and
        the OpenAPI `servers` URL reflect the proxy/ingress URL the client used.
        Without it the OpenAPI `servers` is relative and resolves against the
        origin the docs were loaded from. Default false; only enable behind a
        trusted proxy.
      type: "boolean"
      x-telo-eval: compile
      default: false
    trustProxy:
      title: Trust Proxy
      description: >-
        Trust a fronting proxy when deriving the canonical client address
        (`request.ip`) and forwarded protocol/host. `true` trusts any hop;
        an integer trusts that many proxy hops (the rightmost N entries of
        X-Forwarded-For). Supersedes `trustForwardedHeaders` when set. Only
        enable behind a trusted proxy — otherwise clients can spoof their IP.
      type: ["boolean", "integer"]
      x-telo-eval: compile
    maxBodyBytes:
      title: Max Body Bytes
      description: >-
        Most of a request body that is buffered or handed to a handler, in
        bytes, for every mount — buffered, streamed and multipart bodies alike.
        A larger one is answered 413 with
        `Connection: close` and the `{error: {code, message, data}}` envelope,
        code `ERR_REQUEST_BODY_TOO_LARGE`. The answer is the server's own: no
        `catches:` list sees it. A route's `maxBodyBytes` replaces this value
        for that route. There is no way to switch the limit off.
      type: "integer"
      x-telo-eval: compile
      minimum: 1
      default: 1048576
    # No `logger:` field. Request logging is not a per-server flag — it is
    # governed by the structured logging pipeline like everything else. Fastify's
    # per-request access lines are `info`-severity, so they appear whenever this
    # server's scope is at `info` or below (the default), and are suppressed by
    # raising the http-server import to `level: warn`:
    #
    #   imports:
    #     Http:
    #       source: oci://ghcr.io/telorun/http-server@<version>
    #       logging:
    #         level: warn   # server errors only, no per-request access logs
    #
    # See docs/guides/logging.md and kernel/specs/logging.md §13.3.
    openapi:
      title: OpenAPI
      description: >-
        OpenAPI document metadata. Declaring it collects an OpenAPI document from
        every mounted route's schema; mount an `Http.Reference` to serve that
        document and its browsable reference page at a path you choose.
      type: "object"
      x-telo-eval: compile
      properties:
        info:
          title: Info
          description: OpenAPI info block.
          type: "object"
          properties:
            title:
              title: Title
              description: API title shown in OpenAPI documentation.
              type: "string"
            version:
              title: Version
              description: API version shown in OpenAPI documentation.
              type: "string"
          required: [ "title", "version" ]
      required: [ "info" ]
    mounts:
      title: Mounts
      description: Mount points attached to the HTTP server.
      # A list of dispatch entries: `entries` on the array, `matcher` on the
      # field that selects one, `handler` on the reference it dispatches to —
      # the same three tokens `Http.Api.routes` and `Mcp.Tools.entries` carry.
      # It is what lets the editor render mounts as an ordered list rather than
      # as a set of nodes, and mount order is match order, which a picture of
      # nodes cannot carry.
      x-telo-topology-role: entries
      type: "array"
      # Evaluated per field rather than on the whole list: `guard` holds CEL
      # evaluated per request, which a compile mark on an ancestor would expand
      # at startup.
      items:
        title: Mount
        description: Single mount configuration.
        type: "object"
        additionalProperties: false
        required: [ "mount" ]
        properties:
          path:
            title: Path
            description: URL prefix where the mount is attached.
            type: "string"
            x-telo-eval: compile
            x-telo-topology-role: matcher
          mount:
            title: Mount
            description: >-
              Mount resource to attach — a reference to a Telo.Mount (Http.Api,
              Mcp.HttpEndpoint, …). Use a `!ref` to the resource by name; an
              `!ref <Alias>.<name>` reaches a mount exported by an imported
              library.
            x-telo-topology-role: handler
            x-telo-ref:
              kind: Telo.Mount
              use: dependency
              # `dependency` is the honest use: the server holds the mount and
              # calls a convention method on it, and control reaches a route
              # through the MOUNT's own trigger.inbound slot, not through this
              # one. Yet a throw from that route is exactly what this server
              # renders — it arrives at the server's error handler because
              # nothing below claimed it — so the throws closure and the catch
              # scope both cross here, and nowhere else a `dependency` leads.
              throwsThrough: true
          when:
            title: When
            description: >-
              Attach this mount only when the condition holds. Resolved once at
              startup with the rest of the server's configuration, so an excluded
              mount registers no routes at all rather than answering 404 — which
              is what lets an API reference or a debug router be left out of a
              production deployment:

                  when: !cel "variables.env != 'production'"

              The mounted resource itself is still created and initialized; only
              its attachment is skipped.
            type: "boolean"
            x-telo-eval: compile
            default: true
          guard:
            title: Guard
            description: >-
              Inbound check run for every request that matches a route of THIS
              mount, before the request body is read — authentication, an
              origin allowlist, a tenant check. A normal return lets the request
              through to its route (the returned value is discarded); a throw
              refuses it, rendered by the guard's own `catches:`, then the
              server's. A throw no entry claims is a 500, so a failing guard
              never lets a request through.

              CORS preflight is answered by the server's `cors` and never
              reaches a guard; a request matching no route goes to the
              not-found handler unguarded; a sibling mount without a guard is
              unaffected.
            type: object
            additionalProperties: false
            required: [ "invoke" ]
            properties:
              invoke:
                title: Invoke
                description: Resource invoked (or run) for each request; a throw refuses the request.
                x-telo-ref:
                  kind: Telo.Executable
                  use: trigger.inbound
                  inputs: /inputs
              inputs:
                title: Inputs
                type: object
                additionalProperties: true
                description: >-
                  CEL expressions evaluated against the request, before its body
                  is read; the result is the guard's input. Without `inputs:`
                  the guard is called with an empty object.
                x-telo-context:
                  type: object
                  additionalProperties: false
                  properties:
                    request:
                      type: object
                      additionalProperties: false
                      properties:
                        headers: { type: object, additionalProperties: true }
                        query: { type: object, additionalProperties: true }
                        path: { type: string }
                        method: { type: string }
                        ip: { type: string }
              catches:
                title: Catches
                description: >-
                  Rendering rules for the guard's structured throws — a 401 or a
                  403. Tried before the server's `catches:`. Entries see `error`
                  and the request's `headers` / `query` / `path` / `method` /
                  `ip`.
                x-telo-outcome-list: catches
                x-telo-catches-for: invoke
                x-telo-schema-from: "HttpDispatch.Outcomes/$defs/Catches"
                x-telo-context:
                  type: object
                  additionalProperties: false
                  properties:
                    request:
                      type: object
                      additionalProperties: false
                      properties:
                        headers: { type: object, additionalProperties: true }
                        query: { type: object, additionalProperties: true }
                        path: { type: string }
                        method: { type: string }
                        ip: { type: string }
                    error:
                      type: object
                      additionalProperties: false
                      properties:
                        code: { type: string }
                        message: { type: string }
                        data: { type: object, additionalProperties: true }
          logging:
            title: Logging
            description: >-
              Access-log threshold for requests served by THIS mount, overriding
              the level the server resolved from its scope. The import-scoped
              level governs a whole module instance, so it cannot quieten one
              path and not another — this can.

              Access records are `info`, so `level: warn` is how a mount goes
              quiet: a health check polled every second, or a static mount
              serving a built SPA, stops producing a record per hit. A failing
              request still surfaces, because a 5xx response is logged at
              `error` regardless of status.

              It gates only the records the SERVER emits for the mount (the
              request and request-received records). A handler's own records
              follow its own module's level.
            type: object
            x-telo-eval: compile
            additionalProperties: false
            properties:
              level:
                title: Level
                description: Minimum severity for this mount's access records.
                type: string
                enum: [ trace, debug, info, warn, error, fatal ]
    catches:
      title: Catches
      description: >-
        Rendering rules for structured (InvokeError) throws that reach the
        server — from any mount, and from `notFoundHandler`. The outermost rung
        of the catch ladder: a route's own entries are tried first, then its
        router's, then these. A throw no entry claims renders the built-in
        `{error: {code, message, data}}` envelope with status 500.

        Entries see `error` and the request's `path` / `method` / `ip`. There is
        no route here to type `request.query` / `body` / `params` from — those
        belong to a route's own list.
      x-telo-outcome-list: catches
      # The EMPTY pointer: this list covers everything the server drives, not one
      # sibling field's target.
      x-telo-catches-for: ""
      x-telo-schema-from: "HttpDispatch.Outcomes/$defs/Catches"
      x-telo-context:
        type: object
        additionalProperties: false
        properties:
          request:
            type: object
            additionalProperties: false
            properties:
              path: { type: string }
              method: { type: string }
              ip: { type: string }
          error:
            type: object
            additionalProperties: false
            properties:
              code: { type: string }
              message: { type: string }
              data: { type: object, additionalProperties: true }
    contentTypeParsers:
      title: Content Type Parsers
      description: Custom parsers for specific content types.
      type: "array"
      x-telo-eval: compile
      items:
        title: Content Type Parser
        description: Parser mapping for one content type.
        type: "object"
        additionalProperties: false
        properties:
          contentType:
            title: Content Type
            description: HTTP content type matched by this parser.
            type: "string"
          parser:
            title: Parser
            description: Invocable or runnable parser resource for this content type.
            # Accept either capability: a controller may implement `invoke()`
            # (typical) or `run()` (e.g. a Run.Sequence dispatching to a parser
            # pipeline). The kernel calls whichever method exists.
            x-telo-ref:
              kind: Telo.Executable
              use: trigger.inbound
            oneOf:
              - title: Parser Reference
                description: String reference to an invocable parser.
                type: "string"
              - type: "object"
                title: Parser Object
                description: Object reference to an invocable parser.
                properties:
                  kind:
                    title: Kind
                    description: Kind of the parser resource.
                    type: "string"
                required: [ "kind" ]
                additionalProperties: true
          stream:
            title: Stream Body
            description: |
              When true, deliver request bodies of this content type to the
              handler as a raw `Stream<Uint8Array>` — no buffering, no parsing,
              no schema validation. The matching route must declare
              `request.schema.body` with `x-telo-type: Telo.Stream`. The body
              is counted against `maxBodyBytes` as the handler pulls it.
              Mutually exclusive with `parser`: a content type on one server is
              either streamed or parsed, never both.
            type: "boolean"
        required: [ "contentType" ]
        not:
          required: [ "parser", "stream" ]
    cors:
      title: CORS
      description: Cross-origin resource sharing configuration.
      type: "object"
      x-telo-eval: compile
      additionalProperties: false
      properties:
        origin:
          title: Origin
          description: "Access-Control-Allow-Origin. '*', boolean, or array of strings."
          oneOf:
            - type: "string"
            - type: "boolean"
            - type: "array"
              items:
                title: Origin
                description: Allowed origin value.
                type: "string"
        methods:
          title: Methods
          description: "Access-Control-Allow-Methods. Comma-delimited string or array."
          oneOf:
            - type: "string"
            - type: "array"
              items:
                title: Method
                description: Allowed HTTP method.
                type: "string"
        allowedHeaders:
          title: Allowed Headers
          description: "Access-Control-Allow-Headers. Comma-delimited string or array."
          oneOf:
            - type: "string"
            - type: "array"
              items:
                title: Header
                description: Allowed request header name.
                type: "string"
        exposedHeaders:
          title: Exposed Headers
          description: "Access-Control-Expose-Headers. Comma-delimited string or array."
          oneOf:
            - type: "string"
            - type: "array"
              items:
                title: Header
                description: Exposed response header name.
                type: "string"
        credentials:
          title: Credentials
          type: "boolean"
          description: "Access-Control-Allow-Credentials."
        maxAge:
          title: Max Age
          type: "integer"
          description: "Access-Control-Max-Age in seconds."
        cacheControl:
          title: Cache Control
          description: "Cache-Control for preflight responses. Integer (max-age=N) or string."
          oneOf:
            - type: "integer"
            - type: "string"
        preflightContinue:
          title: Preflight Continue
          type: "boolean"
          description: "Pass preflight response to route handler. Default: false."
        optionsSuccessStatus:
          title: Options Success Status
          type: "integer"
          description: "Status code for successful OPTIONS requests. Default: 204."
        preflight:
          title: Preflight
          type: "boolean"
          description: "Enable preflight handling. Default: true."
        strictPreflight:
          title: Strict Preflight
          type: "boolean"
          description: "Enforce strict W3C CORS preflight headers. Default: true."
        hideOptionsRoute:
          title: Hide Options Route
          type: "boolean"
          description: "Hide OPTIONS route from Swagger docs. Default: true."
    notFoundHandler:
      title: Not Found Handler
      description: Fallback handler configuration when no route matches.
      type: "object"
      properties:
        invoke:
          title: Invoke
          description: Resource invoked (or run) to generate not-found response data.
          # Accept either capability so dual-mode kinds like Run.Sequence fit.
          x-telo-ref:
            kind: Telo.Executable
            use: trigger.inbound
            inputs: /inputs
        inputs:
          title: Inputs
          type: "object"
          additionalProperties: true
          description: "CEL expressions evaluated against the request context; result is passed to the fallback handler's invoke()"
          x-telo-context:
            type: object
            additionalProperties: false
            properties:
              request:
                x-telo-context-from: "request/schema"
                type: object
                properties:
                  query: { type: object, additionalProperties: true }
                  # Untyped: no route matched, so nothing declares this body — it is
                  # whatever the client sent.
                  body: {}
                  headers: { type: object, additionalProperties: true }
                  params: { type: object, additionalProperties: true }
                  path: { type: string }
                  method: { type: string }
                  ip: { type: string }
        returns:
          x-telo-outcome-list: returns
          x-telo-schema-from: "HttpDispatch.Outcomes/$defs/Returns"
        catches:
          x-telo-outcome-list: catches
          x-telo-catches-for: invoke
          x-telo-schema-from: "HttpDispatch.Outcomes/$defs/Catches"
  required: [ "port", "mounts" ]
  examples:
    - host: 0.0.0.0
      port: !cel "ports.http"
      openapi:
        info:
          title: Users API
          version: 1.0.0
      cors:
        origin: "*"
        methods: [ GET, POST ]
      mounts:
        - path: /v1
          mount: !ref UsersApi
        - path: /reference
          mount: !ref UsersDocs
          when: !cel "variables.env != 'production'"
---
kind: "Telo.Definition"
metadata:
  name: "Api"
  description: Mountable router whose routes match requests, map inputs via CEL to a handler, and render conditional typed responses.
capability: Telo.Mount
topology: Router
controllers:
  - pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#HttpApiController
schema:
  type: "object"
  properties:
    catches:
      title: Catches
      description: >-
        Rendering rules for structured (InvokeError) throws from any route of
        this router. A route's own `catches:` entries are tried first, then
        these, then the server's; a throw no entry claims renders the built-in
        `{error: {code, message, data}}` envelope with status 500.

        This is what lets one route override the rendering of a single code
        without restating every other. A route entry with no `when:` is a
        deliberate full override — it makes these entries unreachable for that
        route alone.

        Entries see `error` and the request's `path` / `method` / `ip`. There is
        no single route here to type `request.query` / `body` / `params` from —
        those belong to a route's own list.
      x-telo-outcome-list: catches
      # The EMPTY pointer: this list covers every route of this router, not one
      # sibling field's target.
      x-telo-catches-for: ""
      x-telo-schema-from: "HttpDispatch.Outcomes/$defs/Catches"
      x-telo-context:
        type: object
        additionalProperties: false
        properties:
          request:
            type: object
            additionalProperties: false
            properties:
              path: { type: string }
              method: { type: string }
              ip: { type: string }
          error:
            type: object
            additionalProperties: false
            properties:
              code: { type: string }
              message: { type: string }
              data: { type: object, additionalProperties: true }
    routes:
      title: Routes
      description: HTTP route definitions.
      x-telo-topology-role: entries
      type: "array"
      items:
        title: Route
        description: Single route definition.
        type: "object"
        additionalProperties: false
        properties:
          operationId:
            title: Operation ID
            description: OpenAPI operationId for this route — should be unique across the document.
            type: "string"
          summary:
            title: Summary
            description: Short OpenAPI summary for this route.
            type: "string"
          description:
            title: Description
            description: Longer OpenAPI description for this route.
            type: "string"
          tags:
            title: Tags
            description: OpenAPI tags grouping this route in the generated document.
            type: "array"
            items:
              type: "string"
          request:
            title: Request
            description: >-
              Route matcher — `method` and `path` (required). Declare a nested
              `schema:` block ({ params, query, body, headers }, each a JSON
              Schema) to document and validate the request: it types the CEL
              `request.*` context AND is rendered into the generated OpenAPI
              document. Fill the schemas with `type`, `description`, and
              `examples` so the OpenAPI spec is complete.
            x-telo-topology-role: matcher
            x-telo-schema-from: "HttpDispatch.Request/$defs/Matcher"
          maxBodyBytes:
            title: Max Body Bytes
            description: >-
              Largest request body this route accepts, in bytes. Replaces the
              server's `maxBodyBytes` for this route alone, larger or smaller —
              an upload route raises it, a route taking a small document can
              lower it. A larger body is answered 413 by the server; no
              `catches:` entry sees it.
            type: "integer"
            x-telo-eval: compile
            minimum: 1
          inputs:
            title: Inputs
            type: "object"
            additionalProperties: true
            description: "CEL expressions evaluated against the request context; result is passed to handler.invoke()"
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                request:
                  x-telo-context-from: "request/schema"
                  type: object
                  properties:
                    query: { type: object, additionalProperties: true }
                    # Untyped until `request.schema.body` declares it: a body is
                    # whatever the client sent — an array, a string, nothing.
                    body: {}
                    headers: { type: object, additionalProperties: true }
                    params: { type: object, additionalProperties: true }
                    path: { type: string }
                    method: { type: string }
                    ip: { type: string }
          handler:
            title: Handler
            description: Route handler — Invocable or Runnable.
            x-telo-topology-role: handler
            # Accept either capability. Run.Sequence (Telo.Runnable, but
            # whose controller also implements `invoke()`) is a real-world
            # consumer here — its `run()` and `invoke()` both produce the
            # response body, the kernel calls whichever is appropriate.
            x-telo-ref:
              kind: Telo.Executable
              use: trigger.inbound
              # Names the sibling map holding this call's arguments, so the
              # handler's declared inputType types what is written there.
              inputs: /inputs
            x-telo-context:
              type: object
              properties:
                inputs:
                  type: object
                  additionalProperties: true
                result:
                  type: object
                  additionalProperties: true
              additionalProperties: false
          returns:
            title: Returns
            description: Rendering rules for values the handler resolved with.
            type: "array"
            x-telo-outcome-list: returns
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                request:
                  x-telo-context-from: "request/schema"
                  type: object
                  properties:
                    path: { type: string }
                    method: { type: string }
                    ip: { type: string }
                result:
                  x-telo-context-ref-from: "handler/outputType"
                  type: object
                  additionalProperties: true
            x-telo-schema-from: "HttpDispatch.Outcomes/$defs/Returns"
          catches:
            title: Catches
            description: Rendering rules for structured (InvokeError) throws from the handler. Buffer-mode only — by the time a catch fires there is no upstream iterable to feed an encoder.
            type: "array"
            x-telo-outcome-list: catches
            x-telo-catches-for: handler
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                request:
                  x-telo-context-from: "request/schema"
                  type: object
                  properties:
                    path: { type: string }
                    method: { type: string }
                    ip: { type: string }
                error:
                  type: object
                  additionalProperties: false
                  properties:
                    code: { type: string }
                    message: { type: string }
                    data: { type: object, additionalProperties: true }
            x-telo-schema-from: "HttpDispatch.Outcomes/$defs/Catches"
        required: [ "request", "returns" ]
        examples:
          - request:
              method: POST
              path: /users
              schema:
                body:
                  type: object
                  required: [ email ]
                  properties:
                    email:
                      type: string
                      format: email
                      description: New user's email address.
                      examples: [ "ada@example.com" ]
                    age:
                      type: integer
                      description: Age in years.
                      examples: [ 36 ]
            inputs:
              email: !cel "request.body.email"
              age: !cel "request.body.age"
            handler: !ref InsertUser
            returns:
              - status: 201
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Generated user id.
                          examples: [ "8f14e45f" ]
                        email:
                          type: string
                          description: The created user's email.
                          examples: [ "ada@example.com" ]
                    body:
                      id: !cel "result.rows[0].id"
                      email: !cel "result.rows[0].email"
  required: [ "routes" ]
  examples:
    - routes:
        - request:
            method: GET
            path: /users/:id
            schema:
              params:
                type: object
                required: [ id ]
                properties:
                  id:
                    type: string
                    description: User id to fetch.
                    examples: [ "8f14e45f" ]
              query:
                type: object
                properties:
                  expand:
                    type: string
                    description: Comma-separated list of relations to expand.
                    examples: [ "posts" ]
          inputs:
            id: !cel "request.params.id"
            expand: !cel "request.query.expand"
          handler: !ref GetUser
          returns:
            - status: 200
              content:
                application/json:
                  schema:
                    type: object
                    required: [ id, email ]
                    properties:
                      id:
                        type: string
                        description: User id.
                        examples: [ "8f14e45f" ]
                      email:
                        type: string
                        description: User's email address.
                        examples: [ "ada@example.com" ]
                  body:
                    id: !cel "result.rows[0].id"
                    email: !cel "result.rows[0].email"
---
kind: "Telo.Definition"
metadata:
  name: "Reference"
  description: >-
    Browsable API documentation as a mountable router: renders the OpenAPI
    document the server collects from its routes as an interactive reference
    page, and serves the document itself as JSON and YAML under the same prefix.
capability: Telo.Mount
controllers:
  - pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#HttpReferenceController
schema:
  type: "object"
  additionalProperties: false
  description: >-
    Attach it to an Http.Server mount to publish the docs at a path you choose.
    The document itself is the server's — it is collected from every mounted
    route's schema and needs the server's `openapi:` block — so this renders and
    serves it, and a server without that block is an error rather than an empty
    page. Give the mount a `when:` to leave the docs out of a deployment.
  properties:
    title:
      title: Title
      description: >-
        Browser page title. Defaults to the API title from the server's
        `openapi.info`.
      type: "string"
      x-telo-eval: compile
    theme:
      title: Theme
      description: Colour preset for the reference page.
      type: "string"
      x-telo-eval: compile
      enum:
        - default
        - alternate
        - moon
        - purple
        - solarized
        - bluePlanet
        - deepSpace
        - saturn
        - kepler
        - elysiajs
        - fastify
        - mars
        - laserwave
        - none
      default: default
  # The document is the SERVER's — collected from every mounted route's schema —
  # so a reference mounted on a server that declares no `openapi:` block has
  # nothing to render. Neither kind can state that alone, and unstated it fails
  # at boot, after the port is claimed. Declared here rather than on the server
  # because the requirement is this kind's: a server should not have to know
  # which mounts need what.
  x-telo-referrer-rules:
    - referrer: Self.Server
      condition: !cel "has(referrer.openapi)"
      code: HTTP_REFERENCE_WITHOUT_OPENAPI
      message: >-
        mounts an Http.Reference, but declares no `openapi:` block, so no OpenAPI
        document is collected and the reference has nothing to render. Declare
        `openapi.info` on this server.
  examples:
    - {}
    - title: Todo API docs
      theme: deepSpace
---
kind: "Telo.Definition"
metadata:
  name: "Static"
  description: Serves a directory of static files as a mountable router, with SPA fallback and Cache-Control options.
capability: Telo.Mount
controllers:
  - pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#HttpStaticController
schema:
  type: "object"
  description: >-
    Serves a directory of static assets (a built SPA, plain HTML, images, …) as
    a mountable router. Attach it to an Http.Server mount alongside an Http.Api
    so one application delivers both its API and its frontend.
  properties:
    root:
      title: Root
      description: >-
        Directory of files to serve, as an absolute path. Write a directory
        that ships with the module as `!module-path ./public`; serve a
        directory on the host (files the application writes at runtime) from a
        variable declared `x-telo-type: Telo.HostPath`.
      type: "string"
      x-telo-type: Telo.HostPath
      x-telo-eval: compile
    index:
      title: Index
      description: File served for the directory root. Defaults to index.html.
      type: "string"
      x-telo-eval: compile
      default: "index.html"
    spaFallback:
      title: SPA Fallback
      description: >-
        Serve the index file for any path that does not match a file, so a
        single-page app's client-side routing works on deep links / refresh.
      type: "boolean"
      x-telo-eval: compile
      default: false
    maxAge:
      title: Max Age
      description: >-
        Cache-Control max-age in seconds. When set, served assets carry a
        Cache-Control header; omit for no caching directive.
      type: "integer"
      x-telo-eval: compile
      minimum: 0
    immutable:
      title: Immutable
      description: >-
        Add the `immutable` Cache-Control directive (for content-hashed asset
        filenames that never change). Only meaningful together with maxAge.
      type: "boolean"
      x-telo-eval: compile
      default: false
  required: [ "root" ]
  examples:
    - root: ./public
    - root: ./dist
      spaFallback: true
      maxAge: 3600
      immutable: true
