kind: Telo.Application
metadata:
  name: TextPromptShorthandTest
  version: 1.0.0
imports:
  Ai: ../
  AiEcho: ./__fixtures__/ai-echo.yaml
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testPromptShorthand
---
kind: AiEcho.EchoModel
metadata:
  name: echo
---
kind: Ai.Text
metadata:
  name: summarize
model: !ref echo
---
# `inputs.prompt` is shorthand for `messages: [{role: "user", content: prompt}]`.
# Echo returns the content of the last message verbatim → result.text === prompt.
kind: Run.Sequence
metadata:
  name: testPromptShorthand
steps:
  - name: invoke
    inputs:
      prompt: "hello world"
    invoke: !ref summarize
  - name: assertText
    inputs:
      text: "${{ steps.invoke.result.text }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          text:
            type: string
            const: "hello world"
        required: [ text ]
  - name: assertUsage
    inputs:
      usage: "${{ steps.invoke.result.usage }}"
      finishReason: "${{ steps.invoke.result.finishReason }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          usage:
            type: object
            properties:
              promptTokens: { type: integer, const: 0 }
              completionTokens: { type: integer, const: 0 }
              totalTokens: { type: integer, const: 0 }
            required: [ promptTokens, completionTokens, totalTokens ]
          finishReason:
            type: string
            const: stop
        required: [ usage, finishReason ]
