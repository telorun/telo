kind: Telo.Application
metadata:
  name: HelloConsole
  version: 1.0.0
  description: |
    Smallest possible runnable Telo application: imports the console module and
    prints a single line via a flat `targets` invoke step. Useful as a "does my setup work?"
    smoke test and as a starting skeleton for larger script-style manifests.
    Reach for `Telo.Sequence` when a boot entry needs control flow, scopes, or
    a return value.
# 0.128.0: `Telo.Sequence`, which an older analyzer reads as UNDEFINED_KIND.
requires: { telo: ">=0.128.0" }
imports:
  Console: ../../modules/console
targets:
  - invoke: !ref Console.writeLine
    inputs: { output: "Hello from Telo!" }
