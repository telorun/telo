kind: Telo.Application
metadata:
  name: BroadcastMemoryScope
  version: 1.0.0
  description: |
    A memory channel is scoped to one running application. Two child
    applications each declaring the channel `events` with a subscription hear
    only their own publish, and within one application a library's channel and
    the application's own, both named `events`, are one channel.
imports:
  Broadcast: ../
  Shared: ./__fixtures__/shared-channel-library
  App: ../../app
  Channel: ../../channel
  Timer: ../../timer
  Assert: ../../assert
targets:
  - !ref childA
  - !ref childB
  - !ref test
  - !ref expectLibraryDelivery
---
kind: App.Instance
metadata: { name: childA }
source: ./__fixtures__/memory-child/telo.yaml
variables: { label: a }
awaitStart: false
---
kind: App.Instance
metadata: { name: childB }
source: ./__fixtures__/memory-child/telo.yaml
variables: { label: b }
awaitStart: false
---
kind: Channel.ReadUntil
metadata: { name: readA }
channel: !ref childA
timeout: 10s
---
kind: Channel.ReadUntil
metadata: { name: readB }
channel: !ref childB
timeout: 10s
---
kind: Broadcast.MemoryChannel
metadata: { name: bus }
name: events
messageType:
  kind: Telo.JsonSchema
  schema: { type: object, required: [text], properties: { text: { type: string } } }
---
kind: Telo.Sequence
metadata: { name: record }
inputType:
  kind: Telo.JsonSchema
  schema: { type: object, required: [text], properties: { text: { type: string } } }
steps:
  - { name: seen, value: !cel "inputs.text" }
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: Broadcast.Subscription
    metadata: { name: listen }
    channel: !ref bus
    invoke: !ref record
    inputs: { text: !cel "message.text" }
targets:
  - !ref listen
steps:
  - name: heardByA
    invoke: !ref readA
    inputs: { until: "done\n" }
  - name: heardByB
    invoke: !ref readB
    inputs: { until: "done\n" }
  - name: onlyOwnMessages
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "[steps.heardByA.result.text, steps.heardByB.result.text]"
      expected: ["heard a\ndone\n", "heard b\ndone\n"]
  - name: throughTheLibrary
    invoke: { kind: Broadcast.Publish, channel: !ref Shared.events }
    inputs: { message: { text: from-library } }
  - { name: settle, invoke: { kind: Timer.Delay }, inputs: { duration: 500ms } }
---
kind: Assert.Events
metadata: { name: expectLibraryDelivery }
filter:
  - { type: "*.Invoked" }
expect:
  - { event: record.Invoked, times: 1, payload: { inputs: { text: from-library } } }
