kind: Telo.Application
metadata:
  name: RequestLanguageSingleTest
  version: 1.0.0
  description: |
    An application serving one language still has `request.lang` — its own
    language — and sends neither `Content-Language` nor `Vary`, since nothing
    about its responses depends on the request.
lang: en
imports:
  Http: ../
  HttpClient: ../../http-client
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
kind: Http.Api
metadata: { name: api }
routes:
  - request: { path: /lang, method: GET }
    handler: { kind: Run.Value, value: {} }
    returns:
      - status: 200
        content: { application/json: { body: { lang: !cel "request.lang" } } }
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: Http.Server
    metadata: { name: server }
    listen: { address: 127.0.0.1, port: 8963 }
    mounts: [{ mount: !ref api }]
targets:
  - !ref server
steps:
  - name: call
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8963/lang
      method: GET
      headers: { accept-language: pl }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        body: !cel "steps.call.result.body"
        language: !cel "'content-language' in steps.call.result.headers"
        vary: !cel "'vary' in steps.call.result.headers"
      expected: { body: { lang: en }, language: false, vary: false }
