kind: Telo.Application
metadata:
  name: RunSequenceWhen
  version: 1.0.0
imports:
  Run: ../
  Assert: ../../assert
targets:
  - !ref testWhenGuard
---
kind: Run.Sequence
metadata:
  name: testWhenGuard
steps:
  # Step with when:false is skipped. If it ran, its Assert.Schema would fail (const: 0 vs. 999).
  - name: shouldSkip
    when: "${{ false }}"
    inputs:
      x: 999
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          x:
            type: number
            const: 0

  # Step with when:true must run. If skipped, the outer assertion below would have no result.
  - name: shouldRun
    when: "${{ true }}"
    inputs:
      flag: "yes"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          flag:
            type: string
            const: "yes"

  # Data-driven guard: step only runs when a prior result satisfies the condition.
  - name: compute
    invoke:
      kind: Run.Value
      value:
        ready: true

  - name: dataDrivenStep
    when: "${{ steps.compute.result.ready == true }}"
    inputs:
      ready: "${{ steps.compute.result.ready }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          ready:
            const: true

  # Verify ShouldRun actually ran by checking its result.
  - name: verifyRan
    inputs:
      result: "${{ steps.shouldRun.result }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            const: true
