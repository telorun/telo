modules:
  modules/run: Added
body: "Run.Projection's result is typed and validated as an array: the new elementType
  field types one element (outputs is checked against it, and every element is validated
  at dispatch), so passing a projection's result to an input declared type: array no
  longer fails telo check with CEL_TYPE_ERROR. Breaking: outputType now describes the
  whole result array rather than one element, and a catches fallback value must be an
  array; a non-array fallback now fails the call with ERR_OUTPUT_INVALID."
