kind: Telo.Application
metadata:
  name: HttpUnreadRequestBodyTest
  version: 1.0.0
  description: |
    A handler that ignores its request body still answers, whole, when the body
    is larger than the route's limit and was sent with no declared length.

    Nothing is asserted about the connection: whether it is closed afterwards
    depends on the host.
imports:
  Http: ../
  HttpClient: ../../http-client
  Stream: ../../stream
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
kind: Http.Api
metadata: { name: api }
routes:
  - request:
      path: /ignored
      method: POST
      schema:
        body:
          x-telo-type: { name: Telo.Stream, of: Telo.Bytes }
    maxBodyBytes: 64
    handler:
      kind: Run.Value
      value: { handled: true }
    returns:
      - status: 200
        content: { application/json: { body: { ok: true, note: answered without reading the body } } }
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: Http.Server
    metadata: { name: Server }
    host: 127.0.0.1
    port: 8973
    baseUrl: http://127.0.0.1:8973
    contentTypeParsers:
      - contentType: application/octet-stream
        stream: true
    mounts:
      - path: /api
        mount: !ref api
targets:
  - !ref Server
steps:
  # 4,000 bytes in ten chunks: a byte stream has no declared length, so it is
  # sent chunked and nothing refuses it up front.
  - name: chunks
    inputs:
      items: !cel "range(10).map(i, bytes(range(40).map(j, '0123456789').join('')))"
    invoke:
      kind: Stream.Of
  - name: ignored
    inputs:
      url: http://127.0.0.1:8973/api/ignored
      method: POST
      headers: { content-type: application/octet-stream }
      body: !cel "steps.chunks.result.output"
    invoke:
      kind: HttpClient.Request
  - name: assertAnswered
    inputs:
      actual:
        status: !cel "steps.ignored.result.status"
        body: !cel "steps.ignored.result.body"
      expected:
        status: 200
        body: { ok: true, note: answered without reading the body }
    invoke: !ref Assert.equals
