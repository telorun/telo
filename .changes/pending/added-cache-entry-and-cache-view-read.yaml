modules:
  modules/cache: Added
body: "`Cache.Entry` and `Cache.View` read `ttl` and `staleTtl` as durations: `30d`,
  `1w`, `1h30m` and `250ms` are read, an integer is milliseconds, and a malformed
  literal is refused by `telo check` at the line that writes it. Text with a space
  before the unit (`5 m`) or around the value is now refused. Requires telo >=0.130.0."
