# A route over an agent whose approver can fail with a code of its own. What the
# approver throws escapes the agent unchanged, so the code is part of the
# handler's union: a route that names another code and has no catch-all leaves
# it uncovered.
kind: Telo.Application
metadata:
  name: ApproverThrowsUncovered
imports:
  Ai: ../../..
  AiEcho: ../ai-echo.yaml
  Http: ../../../../http-server
  Run: ../../../../run
---
kind: Ai.Agent
metadata: { name: agent }
model:
  kind: AiEcho.EchoModel
approver:
  invoke:
    kind: Run.Sequence
    steps:
      - name: unavailable
        throw:
          code: ERR_REVIEW_UNAVAILABLE
          message: "the reviewer is down"
  inputs: {}
  result:
    decision: approve
---
kind: Http.Api
metadata: { name: api }
routes:
  - request: { path: /ask, method: POST }
    handler: !ref agent
    inputs:
      prompt: "go"
    returns:
      - status: 200
        content: { application/json: { body: { text: !cel "result.text" } } }
    catches:
      - when: !cel "error.code == 'ERR_AGENT_MAX_STEPS'"
        status: 503
        content: { application/json: { body: { error: !cel "error.message" } } }
