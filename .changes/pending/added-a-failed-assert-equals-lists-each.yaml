modules:
  modules/assert: Added
body: A failed Assert.Equals lists each difference on its own line with its path (a
  changed value, a missing or unexpected key, a list's length with only its surplus or
  missing items), up to ten lines with long values cut and keys in sorted order, instead
  of printing both values whole; TELO_TEST_VERBOSE prints them whole as well.
  Assert.Equals, Assert.Contains and Assert.Matches failures also say which of their
  inputs the failure is about.
