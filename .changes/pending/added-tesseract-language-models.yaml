body: "One module per language Tesseract ships a model for, published as
  `oci://ghcr.io/telorun/tesseract-lang/<code>`. Each exports one ready-made language model
  named after its code, for a recognizer's `languages:` list, and imports only the model
  kinds, never the engine, so importing a language opens no second engine and fetches only
  that model. The models are the integer-quantized best models of tesseract-ocr/tessdata,
  pinned by sha256 and shipped under their Apache-2.0 notice."
