kind: Telo.Library
metadata:
  name: DurableLocal
  version: 0.6.3
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Reliability, Coordination]
  description: |
    Runs a body of steps so that a crash and a restart continue where the work stopped,
    with no engine to deploy: progress is recorded to a store you choose, and a poller
    picks up runs the process died in the middle of. Records what each step returned and
    every decision the body reached, so a resume takes the same branches it took before.
requires: { telo: ">=0.133.0" }
restrictions:
  - requires: { telo: ">=0.131.0" }
    reason: "Needs the SDK's `durationMs` (0.129.0), which an older runtime lacks so the controller fails to load, and a `d` / `w` duration literal at a `Telo.Duration` slot (0.130.0); also its controllers return revertible effect chains from `init()` / `run()`, which kernels before 0.82.0 do not unwind."
  - requires: { telo: ">=unreleased" }
    reason: "Compacts a long run through the step engine's durable-body baselines, which an older runtime's engine ignores: it would never compact, and would replay a run another runtime compacted from the top."
imports: { Durable: ../durable }
exports:
  kinds: [Workflow, Journal, Resumer, Deliver, Status, Result, Cancel, Schedule, Resume]
---
# The one kind that holds a body and drives replay; `steps:` is native so no
# second resource can run the body unjournaled (docs/design.md).
kind: Telo.Definition
metadata:
  name: Workflow
  description: >-
    Runs a body of steps durably: records the run before executing it, records what each
    step returned and every decision the body reached, and on a restart replays those
    records instead of re-running the work. Takes a caller-chosen run id, so submitting
    the same operation twice attaches to the live run rather than starting a second one.
capability: Telo.Invocable
extends: Durable.Run
controllers: [pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#workflow]
# No `status:` block: an Invocable cannot report observed state, so a run's
# observations ride the run record (`Result`). The output is a start
# acknowledgement, declared closed so nothing reads an outcome off it.
outputType:
  type: object
  additionalProperties: false
  required: [runId, status]
  properties:
    runId:
      type: string
      description: >-
        This run's identity — what `DurableLocal.Result`, `Status` and `Cancel` are asked
        by. Submitting the same id again attaches to this run rather than starting a
        second one.
    status:
      type: string
      description: >-
        Where the run stood when the start returned. `running` for a run this call
        started or joined; a terminal state only when an existing run had already
        reached one.
    started:
      type: boolean
      description: Present when this call admitted the run rather than finding it already taken.
    attached:
      type: boolean
      description: >-
        Present when the run id was already taken and this call joined the existing run
        instead of starting a second one.
    result:
      type: object
      additionalProperties: true
      description: >-
        What the run produced, present only when attaching to a run that had ALREADY
        completed. A run this call started has produced nothing yet — read its outcome
        with `DurableLocal.Result`.
schema:
  type: object
  required: [journal, steps]
  additionalProperties: false
  properties:
    journal:
      title: Journal
      description: Where this workflow's runs and their progress are recorded.
      x-telo-ref: { kind: Self.Journal, use: dependency }
    runId:
      title: Run id
      description: >-
        CEL over the call's inputs, producing this run's identity; submitting the same id
        again attaches to the existing run. Omitted, one is minted.
      type: string
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
    onConflict:
      title: On conflict
      description: >-
        What to do when the run id is already taken: `attach` returns the existing run's
        id, `reject` fails.
      type: string
      enum: [attach, reject]
      default: attach
    retainFinished:
      title: Retain finished
      description: >-
        How long a completed, failed or cancelled run stays in the journal after it
        finishes; `30d` when omitted. A `DurableLocal.Resumer` of this workflow then deletes
        the run and its records, and `Status` / `Result` read it as `unknown`. Running,
        parked and scheduled runs are never purged.
      x-telo-type: { name: Telo.Duration, minimum: 0s }
      x-telo-eval: compile
    compactAfter:
      title: Compact after
      description: >-
        How many records a run's body may hold before it compacts them into one baseline it
        resumes from; `1000` when omitted. Bounds a long run's journal and the replay a resume
        does.
      type: integer
      minimum: 1
      default: 1000
      x-telo-eval: compile
    steps:
      title: Steps
      description: The body. Every step's outcome is recorded as it completes.
      x-telo-topology-role: steps
      type: array
      items: { $ref: "telo://manifest#/$defs/Step" }
      # `replayed` alone marks this zone durable to the static checks, never a
      # kind name.
      x-telo-provides-zone:
        replayed: >-
          every step's outcome and every decision the body reaches is recorded, and a
          resume returns those records instead of re-executing the work
      x-telo-context: { type: object, properties: { inputs: {} } }
    inputs:
      title: Inputs
      type: object
      additionalProperties: true
      description: Values forwarded into the body, read there as `inputs.<field>`.
      x-telo-context: { type: object, properties: { inputs: {} } }
---
# This backend's storage seam, not a shared one; why it lives here and is not a
# key/value store: docs/design.md.
kind: Telo.Abstract
metadata:
  name: Journal
  description: >-
    Durable storage for runs and their progress: appends a record per completed step and
    per decision, reads a run's records back in order, replaces a long run's records with
    one baseline in a single atomic write, and finds runs that stopped mid-flight so a
    poller can continue them. First writer wins at a given key.
capability: Telo.Provider
---
# Recovery and wake, not scheduling: a start executes in the process that
# received it (README, "The resumer is recovery, not scheduling").
kind: Telo.Definition
metadata:
  name: Resumer
  description: >-
    Polls for runs that stopped mid-flight and continues them, which is what turns a
    recorded run into a recovered one after the process holding it died. Claims each run
    before continuing it, so several pollers against one store do not both take the same
    one.
capability: Telo.Service
controllers: [pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#resumer]
schema:
  type: object
  required: [workflow]
  additionalProperties: false
  properties:
    workflow:
      title: Workflow
      description: The workflow whose interrupted runs this poller continues.
      x-telo-ref: { kind: Self.Workflow, use: [call] }
    interval:
      title: Interval
      description: How often to look for interrupted runs; `5s` when omitted.
      x-telo-type: { name: Telo.Duration, minimum: 0s }
      x-telo-eval: compile
---
# Takes the journal, not the workflow, and does not continue the run — so a
# delivery is another application's operation (README, "Waking work").
kind: Telo.Definition
metadata:
  name: Deliver
  description: >-
    Wakes work that is waiting on a token, handing it the value it was waiting for — an
    approval, a webhook body, a human decision. Reports whether a token matched anything,
    so a token that is stale or already used is an ordinary answer rather than a failure.
    The waiting work continues on whichever process picks it up next.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#deliver]
throws:
  codes:
    ERR_DURABLE_PAYLOAD_INVALID:
      description: >-
        The payload does not match the shape declared by the wait named in `await:`. A
        delivery that names no wait is not validated.
inputType: { type: object, additionalProperties: true }
outputType:
  type: object
  additionalProperties: false
  required: [delivered]
  properties:
    delivered: { type: boolean, description: False when no work is waiting on that token. }
    run: { type: string }
schema:
  type: object
  required: [journal, token]
  additionalProperties: false
  properties:
    journal:
      title: Journal
      description: The store holding the runs this delivers to.
      x-telo-ref: { kind: Self.Journal, use: dependency }
    await:
      title: Await
      description: >-
        The wait this delivers to. Naming it checks `payload:` against the shape it
        declares; omitted, the payload is unchecked.
      x-telo-ref: { kind: Durable.Await, use: schema }
    token:
      title: Token
      description: The address the wait handed out.
      type: string
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
    payload:
      title: Payload
      description: >-
        What to hand the waiting work, checked against the shape the named await declares.
      x-telo-eval: runtime
      x-telo-schema-from: await/outputType
      x-telo-context: { type: object, properties: { inputs: {} } }
---
# Separate from Result: a status is polled, a result may be waited for.
kind: Telo.Definition
metadata:
  name: Status
  description: >-
    Reports what a piece of durable work is doing right now — running, waiting, finished,
    called off — and, when it is waiting, what for. An id that was never started, or has
    been purged, reads as unknown rather than failing.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#status]
inputType:
  type: object
  additionalProperties: true
  properties: { run: { type: string } }
outputType:
  type: object
  additionalProperties: false
  required: [run, status]
  properties:
    run: { type: string }
    status:
      type: string
      enum: [unknown, scheduled, running, parked, completed, failed, cancelled]
    dueAt: { type: integer }
    parked:
      type: object
      additionalProperties: false
      properties: { path: { type: string }, resource: { type: string } }
schema:
  type: object
  required: [journal]
  additionalProperties: false
  properties:
    journal: { title: Journal, x-telo-ref: { kind: Self.Journal, use: dependency } }
    run:
      title: Run
      description: >-
        Which run to report on; omitted, the call's `inputs.run`, so one of these serves
        every run.
      type: string
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
---
# `wait:` is here rather than on the start, which must never block a caller
# across a wait measured in days.
kind: Telo.Definition
metadata:
  name: Result
  description: >-
    Reads what a finished piece of durable work produced, or the error it ended with. Can
    wait a stated length of time for work still in progress, so a caller that wants the
    outcome can ask for it without the work itself having to block anyone.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#result]
# Open: `run:` may be CEL over the call's own inputs (also on `Status`, `Cancel`).
inputType:
  type: object
  additionalProperties: true
  properties: { run: { type: string } }
# Closed: the one contract a run's outcome is read through, so a typo is caught.
outputType:
  type: object
  additionalProperties: false
  required: [run, status]
  properties:
    run: { type: string }
    status:
      type: string
      enum: [unknown, scheduled, running, parked, completed, failed, cancelled]
    result:
      type: object
      additionalProperties: true
      description: >-
        What the run produced, present once it has finished. Open, because its shape is
        the body's rather than this kind's.
    error: { type: object, additionalProperties: true }
    collapsedRegions:
      type: integer
      description: >-
        How many regions of this work re-run whole if it is retried, rather than being
        picked up step by step.
    collapseReasons:
      type: array
      items: { type: string }
      description: The author's own stated reason for each such region.
    replayed:
      type: boolean
      description: >-
        Whether the attempt that finished this work continued an interrupted one. Absent,
        not false, for work settled by a runtime too old to record it.
    replayedSteps:
      type: integer
      description: >-
        How many steps that attempt was handed from the record instead of executing.
schema:
  type: object
  required: [journal]
  additionalProperties: false
  properties:
    journal: { title: Journal, x-telo-ref: { kind: Self.Journal, use: dependency } }
    run:
      title: Run
      type: string
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
    wait:
      title: Wait
      description: >-
        How long to wait for work still in progress. Omit to answer immediately with
        whatever state it is in.
      x-telo-type: { name: Telo.Duration, minimum: 0s }
      x-telo-eval: compile
    poll:
      title: Poll
      description: How often to re-read while waiting; `100ms` when omitted.
      x-telo-type: { name: Telo.Duration, minimum: 0s }
      x-telo-eval: compile
---
# `cancelled` is not `failed`: a failed run earned a verdict, a cancelled one
# was stopped.
kind: Telo.Definition
metadata:
  name: Cancel
  description: >-
    Calls off a piece of durable work so nothing picks it up again, recording that it was
    stopped rather than that it failed. Work already finished is left alone. Work
    executing right now stops at its next wait or restart rather than being interrupted
    mid-step.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#cancel]
inputType:
  type: object
  additionalProperties: true
  properties: { run: { type: string } }
outputType:
  type: object
  additionalProperties: false
  required: [run, cancelled, status]
  properties:
    run: { type: string }
    cancelled: { type: boolean }
    status: { type: string }
schema:
  type: object
  required: [journal]
  additionalProperties: false
  properties:
    journal: { title: Journal, x-telo-ref: { kind: Self.Journal, use: dependency } }
    run:
      title: Run
      type: string
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
    reason:
      title: Reason
      description: Recorded with the cancellation, so the report says why.
      type: string
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
---
# Admits and stops; the resumer starts the run when due, from its stored inputs
# — a durable record a restart still finds, unlike a missed cron firing.
kind: Telo.Definition
metadata:
  name: Schedule
  description: >-
    Records work to be started at a later time, so a restart in between still finds it due
    and runs it. Stores the values it should start with, since there is no caller at the
    moment it begins. Reusing an id that is already taken schedules nothing, so submitting
    the same request twice queues one piece of work.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#schedule]
inputType: { type: object, additionalProperties: true }
outputType:
  type: object
  additionalProperties: false
  required: [runId, scheduled]
  properties:
    runId: { type: string }
    scheduled: { type: boolean }
    dueAt: { type: integer }
    status: { type: string }
schema:
  type: object
  required: [workflow]
  additionalProperties: false
  oneOf:
    - { required: [after] }
    - { required: [at] }
  properties:
    workflow:
      title: Workflow
      description: >-
        The work to start later; this records it, and the resumer starts it.
      x-telo-ref: { kind: Self.Workflow, use: dependency }
    runId:
      title: Run id
      description: >-
        The identity to schedule under; one already taken schedules nothing. Omitted, one
        is minted.
      type: string
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
    after:
      title: After
      description: How long from now. A computed value must be a duration, e.g. `duration(inputs.delay)`.
      x-telo-type: { name: Telo.Duration, minimum: 0s }
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
    at:
      title: At
      description: When, as a timestamp or epoch milliseconds.
      type: string
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
    inputs:
      title: Inputs
      description: The values the work starts with when its time comes.
      type: object
      additionalProperties: true
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
---
# The operator's override for a run held because its code changed, recorded as
# a journal entry so a run that may diverge stays identifiable.
kind: Telo.Definition
metadata:
  name: Resume
  description: >-
    Forces held work to continue against the code that is deployed now, for work that was
    held because the code changed underneath it. Writes a record of the override, so work
    that continued against different code than it started with can be identified later.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#resume]
inputType:
  type: object
  additionalProperties: true
  properties: { run: { type: string } }
outputType:
  type: object
  additionalProperties: false
  required: [run, resumed]
  properties: { run: { type: string }, resumed: { type: boolean }, status: { type: string } }
schema:
  type: object
  required: [workflow]
  additionalProperties: false
  properties:
    workflow:
      title: Workflow
      description: >-
        The work this releases; this clears the hold, and the resumer continues it.
      x-telo-ref: { kind: Self.Workflow, use: dependency }
    run:
      title: Run
      type: string
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
    reason:
      title: Reason
      description: Recorded with the override, in your own words.
      type: string
      x-telo-eval: runtime
      x-telo-context: { type: object, properties: { inputs: {} } }
