plural: employees
collection: !ref employees
---
# The pages' request paths are app-relative, so the API and the files are
# served under each of the four mounts; the brand switch is the root
# application's alone.
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
preferredLanguages: !cel >-
  'cookie' in request.headers ? [Self.cookie(request.headers['cookie'], 'showcase-lang')] : []
mounts:
  - path: /api/private
    mount: !ref privateApi
    guard:
      invoke: !ref sessionGuard
      inputs:
        token: !cel "Self.cookie('cookie' in request.headers ? request.headers['cookie'] : '', 'showcase-session')"
      catches:
        - when: !cel "error.code == 'UNAUTHORIZED'"
          status: 401
  - path: /api/projects
    mount: !ref projectsApi
  - path: /api/tasks
    mount: !ref tasksApi
  - path: /api/people
    mount: !ref peopleApi
  - path: /api/authors
    mount: !ref authorsApi
  - path: /api/posts
    mount: !ref postsApi
  - path: /api/employees
    mount: !ref employeesApi
  - path: /api
    mount: !ref showcaseApi
  - path: /radix/api/private
    mount: !ref privateApi
    guard:
      invoke: !ref sessionGuard
      inputs:
        token: !cel "Self.cookie('cookie' in request.headers ? request.headers['cookie'] : '', 'showcase-session')"
      catches:
        - when: !cel "error.code == 'UNAUTHORIZED'"
          status: 401
  - path: /radix/api/projects
    mount: !ref projectsApi
  - path: /radix/api/tasks
    mount: !ref tasksApi
  - path: /radix/api/people
    mount: !ref peopleApi
  - path: /radix/api/authors
    mount: !ref authorsApi
  - path: /radix/api/posts
    mount: !ref postsApi
  - path: /radix/api/employees
    mount: !ref employeesApi
  - path: /radix/api
    mount: !ref showcaseApi
  - path: /brand/api/private
    mount: !ref privateApi
    guard:
      invoke: !ref sessionGuard
      inputs:
        token: !cel "Self.cookie('cookie' in request.headers ? request.headers['cookie'] : '', 'showcase-session')"
      catches:
        - when: !cel "error.code == 'UNAUTHORIZED'"
          status: 401
  - path: /brand/api/projects
    mount: !ref projectsApi
  - path: /brand/api/tasks
    mount: !ref tasksApi
  - path: /brand/api/people
    mount: !ref peopleApi
  - path: /brand/api/authors
    mount: !ref authorsApi
  - path: /brand/api/posts
    mount: !ref postsApi
  - path: /brand/api/employees
    mount: !ref employeesApi
  - path: /brand/api
    mount: !ref showcaseApi
  - path: /sidebar/api/private
    mount: !ref privateApi
    guard:
      invoke: !ref sessionGuard
      inputs:
        token: !cel "Self.cookie('cookie' in request.headers ? request.headers['cookie'] : '', 'showcase-session')"
      catches:
        - when: !cel "error.code == 'UNAUTHORIZED'"
          status: 401
  - path: /sidebar/api/projects
    mount: !ref projectsApi
  - path: /sidebar/api/tasks
    mount: !ref tasksApi
  - path: /sidebar/api/people
    mount: !ref peopleApi
  - path: /sidebar/api/authors
    mount: !ref authorsApi
  - path: /sidebar/api/posts
    mount: !ref postsApi
  - path: /sidebar/api/employees
    mount: !ref employeesApi
  - path: /sidebar/api
    mount: !ref showcaseApi
  - path: /api
    mount: !ref brandSwitch
  - path: /files
    mount: !ref files
  - path: /radix/files
    mount: !ref files
  - path: /brand/files
    mount: !ref files
  - path: /sidebar/files
    mount: !ref files
  - path: /radix
    mount: !ref radixShowcase
  - path: /brand
    mount: !ref brandShowcase
  - path: /sidebar
