modules:
  modules/ui: Added
body: "The UI vocabulary: page nodes (box, stack, columns, text, badge, link, image,
  svg, composite) with a closed style list, and the composite kinds Ui.View, Ui.Table,
  Ui.Form, Ui.Filters, Ui.Component, Ui.ComponentExport and Ui.Theme over the
  Ui.Composite contract. Tables, forms and filters derive from a row model and are
  checked against it before boot. A link's href, an image's src and a source's basePath
  inside the application are app-relative paths: / followed by anything but / or a
  backslash, with no control character. A renderer's controller reaches the module's
  code entry as @telorun/ui (entryAssets, AssetFile, AssetRef), which turns a built
  browser entry into the files a page loads. Requires telo 0.112.0 or newer (requires:
  telo: \">=0.112.0\")."
