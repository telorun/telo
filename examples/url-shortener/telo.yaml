kind: Telo.Application
metadata:
  name: UrlShortener
  version: 1.0.0
  categories: [ Transport, Performance, Reliability ]
  description: |
    A URL shortener exercising the cache, rate-limit, run (Detach), sql, and
    http-server modules end to end. A thin root that owns the shared schema
    and HTTP server and wires two libraries:

      redirect/  POST /links {code,url}, GET /{code} (cache read-through,
                 rate-limit, detached click recording)
      admin/     GET /admin/links, GET /admin/links/{code}

    Zero external infra: a shared SQLite file + in-process CacheMemory.Store.
requires:
  # 0.98.0: `dbFile` is a `Telo.HostPath`, which an older analyzer rejects as
  # X_TELO_TYPE_UNKNOWN.
  telo: ">=0.98.0"
imports:
  Http: ../../modules/http-server
  Sql: oci://ghcr.io/telorun/sql@0.24.0#sha256-g0Bw5AjrBOGmgGbmsKFb7q833AYlutxV1fDWka47t2I
  SQLite: ../../modules/sqlite
  Database:
    source: ./database
    variables:
      dbFile: !cel "variables.dbFile"
  Redirect:
    source: ./redirect
    variables:
      dbFile: !cel "variables.dbFile"
  Admin:
    source: ./admin
    variables:
      dbFile: !cel "variables.dbFile"
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: Telo.HostPath
    default: ./tmp/url-shortener.db
ports:
  http:
    env: PORT
    default: 8080
targets:
  - !ref setupDb
  - !ref server
---
kind: SQLite.Schema
metadata: { name: setupDb }
connection: !ref Database.connection
tables:
  - !ref Database.links
  - !ref Database.clicks
---
kind: Http.Server
metadata: { name: server }
port: !cel "ports.http"
trustProxy: true
openapi:
  info: { title: URL Shortener, version: 1.0.0 }
mounts:
  - path: /
    mount: !ref Redirect.routes
  - path: /admin
    mount: !ref Admin.routes
