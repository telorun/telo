# A ledger whose keys would expire the moment they are recorded.
kind: Telo.Application
metadata:
  name: ZeroRetention
  version: 1.0.0
imports:
  Idempotency: ../..
  SQLite: ../../../sqlite
targets:
  - !ref appSchema
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Idempotency.Table
metadata: { name: keys }
table: idempotency_keys
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref keys]
---
kind: Idempotency.Ledger
metadata: { name: ledger }
connection: !ref db
schema: !ref appSchema
table: !ref keys
name: orders
retention: 0s
