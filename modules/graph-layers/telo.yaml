kind: Telo.Library
metadata:
  name: GraphLayers
  version: 0.1.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Storage, Data]
  description: >-
    Several knowledge graphs kept as named layers in one database, where a layer
    can be built on one or many others: what a layer states overrides or hides
    what lies beneath. Read, write and traverse a layer as one graph, stage
    changes in a draft, publish them atomically as a numbered revision, resolve
    conflicts when a draft falls behind, follow a layer's revision history, and
    pin a layer to labelled revisions of others so an upgrade is a reviewed merge.
requires:
  # Two floors, the higher of which is declared.
  # 0.105.0: the retract and drafting contracts use the object form of
  # `x-telo-schema-projection-from` (`{ from, pick, omit }`) with pointers that
  # cross references, exactly as `Graph`'s operations do. 0.104.0 checks this
  # file clean but reads none of them: a retract over a node type then runs with
  # its inputs unchecked. Verified by execution (`check` and `run`) against
  # 0.104.0.
  # 0.108.0: the drafting kinds return instants as native timestamps, built
  # through the SDK's value factories (`celTimestampFromMillis`), which a
  # runtime before 0.108.0 does not provide. 0.107.0 checks this file clean and
  # fails to load the module's controllers ("'@telorun/sdk' does not provide an
  # export named 'celTimestampFromMillis'"), so every kind here, the retract
  # ones included, fails at creation. Verified by execution: `run` of the
  # drafting suite fails on 0.105.0, 0.106.0 and 0.107.0 and passes whole on
  # 0.108.0, 0.109.0, 0.111.0 and 0.113.0.
  telo: ">=0.108.0"
imports:
  Graph: ../graph
exports:
  kinds:
    - Store
    - RetractNode
    - RetractRelationship
    - DraftedStore
    - OpenDraft
    - DraftSession
    - Publish
    - DiscardDraft
    - RebaseDraft
    - ListDrafts
    - NodeConflicts
    - RelationshipConflicts
    - ResolveNodeConflict
    - ResolveRelationshipConflict
    - RevisionedStore
    - ListRevisions
    - PinBase
    - UnpinBase
    - ListBases
    - LabelRevision
  resources:
    - Actor
    - PinnedBase
  # The store contract of each level, which a strategy module's store
  # implements, and the guards the lifecycle kinds resolve their `store` slot
  # with.
  code:
    - specifier: "@telorun/graph-layers"
      format: js
      path: ./nodejs/graph-layers.mjs
      source: ./nodejs/src/index.ts
---
# GraphLayers.Store — the base level of the layered contract: a graph store that
# is one named layer. Everything `Graph.Store` promises holds over the layered
# view; a strategy module's store kind extends this and says how layers are kept.
kind: Telo.Abstract
metadata:
  name: Store
  description: >-
    One named layer of a knowledge graph. It reads as a whole graph — its own
    statements over everything the layers beneath it hold — and writes only to
    itself, so the layers it is built on are never changed through it.
capability: Telo.Provider
extends: Graph.Store
schema:
  type: object
  required: [layer]
  properties:
    layer:
      title: Layer
      description: The layer's name. Every value this store returns names the layer it came from.
      type: string
      minLength: 1
---
kind: Telo.Definition
metadata:
  name: RetractNode
  description: >-
    Withdraws what one layer of a knowledge graph says about an entity — whether
    it stated the entity or hid one from beneath — so the layer under it shows
    again. Returns the entity now visible for the key, or nothing when no layer
    beneath holds it. Refuses when the layer says nothing about the key.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#RetractNode
throws:
  codes:
    GRAPH_NODE_NOT_STATED:
      description: >-
        This layer states nothing for the key: it neither holds the node nor
        hides one from beneath.
inputType:
  type: object
  required: [key]
  additionalProperties: false
  properties:
    key:
      title: Key
      description: The key whose statement in this layer is withdrawn.
      x-telo-schema-projection-from: { from: /node, pick: /node/key }
outputType:
  type: object
  additionalProperties: false
  properties:
    node:
      title: Node
      description: >-
        The node now resolved for the key, from a layer beneath. Absent when no
        layer beneath holds it.
      type: object
      required: [key, properties]
      additionalProperties: false
      properties:
        key: { x-telo-schema-projection-from: { from: /node, pick: /node/key } }
        properties: { x-telo-schema-projection-from: { from: /node, omit: [/node/key] } }
        origin:
          title: Origin
          description: The layer the node is resolved from.
          type: string
schema:
  type: object
  required: [store, node]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose statement is withdrawn.
      x-telo-ref:
        kind: Self.Store
        use: dependency
    node:
      title: Node
      description: The node type. The store must list it in 'nodes:'.
      x-telo-ref:
        kind: Graph.Node
        use: dependency
  x-telo-resource-rules:
    - resolve: [/store]
      condition: !cel "self.store.nodes.exists(n, n.name == self.node.name)"
      code: GRAPH_TYPE_NOT_IN_STORE
      message: names a node type its store does not list in 'nodes:'.
---
kind: Telo.Definition
metadata:
  name: RetractRelationship
  description: >-
    Withdraws what one layer of a knowledge graph says about a link between two
    entities — whether it stated the link or hid one from beneath — so the layer
    under it shows again. Returns the link now visible for the pair, or nothing
    when no layer beneath holds it. Refuses when the layer says nothing about it.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#RetractRelationship
throws:
  codes:
    GRAPH_RELATIONSHIP_NOT_STATED:
      description: >-
        This layer states nothing for the pair: it neither holds the
        relationship nor hides one from beneath.
inputType:
  type: object
  required: [source, target]
  additionalProperties: false
  properties:
    source:
      title: Source
      description: The source node's key.
      x-telo-schema-projection-from: { from: /relationship/source, pick: /relationship/source/key }
    target:
      title: Target
      description: The target node's key.
      x-telo-schema-projection-from: { from: /relationship/target, pick: /relationship/target/key }
outputType:
  type: object
  additionalProperties: false
  properties:
    relationship:
      title: Relationship
      description: >-
        The relationship now resolved for the pair, from a layer beneath. Absent
        when no layer beneath holds it.
      type: object
      required: [source, target, properties]
      additionalProperties: false
      properties:
        source: { x-telo-schema-projection-from: { from: /relationship/source, pick: /relationship/source/key } }
        target: { x-telo-schema-projection-from: { from: /relationship/target, pick: /relationship/target/key } }
        properties: { x-telo-schema-projection-from: /relationship }
        origin:
          title: Origin
          description: The layer the relationship is resolved from.
          type: string
schema:
  type: object
  required: [store, relationship]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose statement is withdrawn.
      x-telo-ref:
        kind: Self.Store
        use: dependency
    relationship:
      title: Relationship
      description: The relationship type. The store must list it in 'relationships:'.
      x-telo-ref:
        kind: Graph.Relationship
        use: dependency
  x-telo-resource-rules:
    - resolve: [/store]
      condition: !cel "self.store.?relationships.orValue([]).exists(r, r.name == self.relationship.name)"
      code: GRAPH_TYPE_NOT_IN_STORE
      message: names a relationship type its store does not list in 'relationships:'.
---
# GraphLayers.DraftedStore — the second level of the contract: a layer edited in
# a draft and published atomically. Everything `Store` promises holds; a strategy
# module's store kind extends this when it keeps drafts.
kind: Telo.Abstract
metadata:
  name: DraftedStore
  description: >-
    One named layer of a knowledge graph whose changes are staged in a draft and
    published together as a numbered revision. Outside a draft it reads and
    writes the published state; inside a draft session it reads and writes that
    draft, which stays invisible to everyone else until it is published.
capability: Telo.Provider
extends: Self.Store
---
# GraphLayers.Actor — who did something to a layer: a kind of actor and its id,
# in the application's own vocabulary (`user` / `u_42`, `service` / `importer`).
# One value is the contract's own: what a store does on nobody's behalf is
# recorded as type `store` with the store's declared name as its id.
kind: Telo.JsonSchema
metadata:
  name: Actor
schema:
  type: object
  required: [type, id]
  additionalProperties: false
  properties:
    type:
      title: Type
      description: >-
        The kind of actor, in the application's own vocabulary. `store` is the
        actor of what a store does on nobody's behalf — a write outside a draft
        session, or an operation given no actor — with the store's declared
        name as `id`.
      type: string
      minLength: 1
    id:
      title: Id
      description: The actor's identifier within its type.
      type: string
      minLength: 1
---
kind: Telo.Definition
metadata:
  name: OpenDraft
  description: >-
    Opens a draft on a layer of a knowledge graph — a private workspace where
    changes are staged before being published together — and returns its id and
    the revision it starts from. Where a layer keeps a single draft, an already
    open one is returned instead of a second.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#OpenDraft
inputType:
  type: object
  additionalProperties: false
  properties:
    message:
      title: Message
      description: A note on what the draft is for.
      type: string
    actor:
      title: Actor
      description: Who opens the draft. Omitted, the store resource itself is recorded.
      $ref: "telo://Self/Actor"
outputType:
  type: object
  required: [draft, opened]
  additionalProperties: false
  properties:
    draft:
      title: Draft
      type: object
      required: [id, parentRevision, createdAt]
      additionalProperties: false
      properties:
        id:
          title: Id
          description: The draft's id, passed to every operation that names the draft.
          type: string
        parentRevision:
          title: Parent Revision
          description: The layer revision the draft starts from.
          type: integer
        createdAt:
          title: Created At
          description: When the draft was opened, by the database's clock.
          x-telo-type: Telo.Timestamp
    opened:
      title: Opened
      description: Whether this call opened the draft. False when an open one was returned.
      type: boolean
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer a draft is opened on.
      x-telo-ref:
        kind: Self.DraftedStore
        use: dependency
---
# GraphLayers.DraftSession — the region in which a store's operations read and
# write one draft. A zone on its body, correlated on the store: the conflict
# kinds require it, and the store recognises a call made inside it.
kind: Telo.Definition
metadata:
  name: DraftSession
  description: >-
    Runs a body of steps against one draft of a knowledge-graph layer: every
    read inside sees the draft's staged changes, and every write is staged in it
    rather than published. If the draft is published or discarded while the body
    runs, the session ends at once and nothing further is staged.
capability: Telo.Invocable
topology: Sequence
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#DraftSession
throws:
  inherit: true
  codes:
    GRAPH_DRAFT_NOT_FOUND:
      description: The store's layer has no draft of that id.
    GRAPH_DRAFT_CLOSED:
      description: >-
        The draft is no longer open: it was published or discarded before the
        session began, or while its body ran. `data` carries `draft`, `closedAs`
        (`published` or `discarded`) and, for a published draft, `revision`.
    GRAPH_DRAFT_FOREIGN:
      description: The draft belongs to another layer than this store's.
inputType:
  type: object
  required: [draft]
  additionalProperties: true
  properties:
    draft:
      title: Draft
      description: The id of the draft the body reads and writes.
      type: string
      minLength: 1
outputType:
  type: object
  additionalProperties: true
schema:
  type: object
  required: [store, steps]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose draft the body works in.
      x-telo-ref:
        kind: Self.DraftedStore
        use: dependency
    steps:
      title: Steps
      description: >-
        The body. Every graph or lifecycle operation it reaches on this store
        reads and writes the draft.
      x-telo-topology-role: steps
      type: array
      items:
        $ref: "telo://manifest#/$defs/Step"
      x-telo-provides-zone: /store
      x-telo-context:
        type: object
        properties:
          inputs: {}
    inputs:
      title: Inputs
      type: object
      additionalProperties: true
      description: >-
        Values forwarded into the body, read there as `inputs.<field>`. CEL here
        reads the caller's invocation input the same way.
      x-telo-context:
        type: object
        properties:
          inputs: {}
---
kind: Telo.Definition
metadata:
  name: Publish
  description: >-
    Publishes a draft of a knowledge-graph layer: all of its staged changes
    become visible at once as the layer's next revision, or none do. Refused
    when the layer has moved since the draft was opened or rebased, and while
    any conflict is left undecided. Publishing twice returns the same revision.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#Publish
throws:
  codes:
    GRAPH_DRAFT_NOT_FOUND:
      description: The store's layer has no draft of that id.
    GRAPH_DRAFT_DISCARDED:
      description: The draft was discarded, so it holds nothing to publish.
    GRAPH_DRAFT_STALE:
      description: >-
        The layer is no longer at the revision the draft stands on. Rebase the
        draft and decide its conflicts, then publish again. `data` carries
        `draft`, `parentRevision` and `headRevision`.
    GRAPH_DRAFT_CONFLICTED:
      description: >-
        A conflict is left undecided, or the draft states a relationship whose
        endpoint does not resolve in the view being published.
inputType:
  type: object
  required: [draft]
  additionalProperties: false
  properties:
    draft:
      title: Draft
      description: The id of the draft to publish.
      type: string
      minLength: 1
    message:
      title: Message
      description: A note on what the revision changes. It replaces the draft's own.
      type: string
    actor:
      title: Actor
      description: Who publishes. Omitted, the store resource itself is recorded.
      $ref: "telo://Self/Actor"
outputType:
  type: object
  required: [revision, changed]
  additionalProperties: false
  properties:
    revision:
      title: Revision
      type: object
      required: [number, publishedAt]
      additionalProperties: false
      properties:
        number:
          title: Number
          description: >-
            The layer revision the draft became. For a draft with no change, the
            revision the layer was already at.
          type: integer
        publishedAt:
          title: Published At
          description: When the draft was published, by the database's clock.
          x-telo-type: Telo.Timestamp
    changed:
      title: Changed
      description: >-
        Whether publishing created a revision. False for a draft with no change;
        true for one whose only change is to the layers it is pinned to.
      type: boolean
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose draft is published.
      x-telo-ref:
        kind: Self.DraftedStore
        use: dependency
---
kind: Telo.Definition
metadata:
  name: DiscardDraft
  description: >-
    Discards a draft of a knowledge-graph layer: every change staged in it is
    dropped and the published state is left as it was. Discarding a draft that
    was already discarded is a no-op; a published draft cannot be discarded.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#DiscardDraft
throws:
  codes:
    GRAPH_DRAFT_NOT_FOUND:
      description: The store's layer has no draft of that id.
    GRAPH_DRAFT_PUBLISHED:
      description: The draft was published, so there is nothing left to discard.
inputType:
  type: object
  required: [draft]
  additionalProperties: false
  properties:
    draft:
      title: Draft
      description: The id of the draft to discard.
      type: string
      minLength: 1
    actor:
      title: Actor
      description: Who discards. Omitted, the store resource itself is recorded.
      $ref: "telo://Self/Actor"
outputType:
  type: object
  additionalProperties: false
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose draft is discarded.
      x-telo-ref:
        kind: Self.DraftedStore
        use: dependency
---
kind: Telo.Definition
metadata:
  name: RebaseDraft
  description: >-
    Moves a draft of a knowledge-graph layer onto the layer's current revision
    after others have published: changes that agree are merged without asking,
    and those that collide are left as conflicts to list and decide. Returns the
    new starting revision with how many changes merged and how many conflict.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#RebaseDraft
throws:
  codes:
    GRAPH_DRAFT_NOT_FOUND:
      description: The store's layer has no draft of that id.
    GRAPH_DRAFT_CLOSED:
      description: >-
        The draft was published or discarded. `data` carries `draft`, `closedAs`
        and, for a published draft, `revision`.
    GRAPH_BASE_REVISION_CONFLICT:
      description: >-
        Only where a layer pins the layers it is built on: the draft's own pin
        changes, applied onto the pins the layer now has, would hold one layer
        at two revisions. Nothing was changed; pin again inside the draft and
        rebase. `data` carries `layer` and `revisions`.
    GRAPH_BASE_LIMIT:
      description: >-
        Only where a layer pins the layers it is built on: the draft's own pin
        changes, applied onto the pins the layer now has, would resolve more
        layers than a stack may hold. Nothing was changed. `data` carries
        `limit`.
inputType:
  type: object
  required: [draft]
  additionalProperties: false
  properties:
    draft:
      title: Draft
      description: The id of the draft to rebase.
      type: string
      minLength: 1
outputType:
  type: object
  required: [parentRevision, merged, conflicts]
  additionalProperties: false
  properties:
    parentRevision:
      title: Parent Revision
      description: The layer revision the draft now stands on.
      type: integer
    merged:
      title: Merged
      description: How many of the draft's changes the other side had also made, and were merged.
      type: integer
    conflicts:
      title: Conflicts
      description: How many conflicts are left to decide.
      type: integer
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose draft is rebased.
      x-telo-ref:
        kind: Self.DraftedStore
        use: dependency
---
kind: Telo.Definition
metadata:
  name: ListDrafts
  description: >-
    Lists the open drafts of a knowledge-graph layer a page at a time, each with
    the revision it starts from, who opened it and when, and whether the layer
    has since moved past it so that it must be rebased before publishing.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#ListDrafts
throws:
  codes:
    GRAPH_CURSOR_INVALID:
      description: >-
        The cursor is malformed, or was issued for another listing — another
        operation, or another store.
inputType:
  type: object
  additionalProperties: false
  properties:
    limit:
      title: Limit
      description: The most entries returned in one page.
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
    cursor:
      title: Cursor
      description: >-
        The `next` of an earlier page of this same listing, passed back unchanged
        to read the page after it. Omitted, the listing starts at its beginning.
      type: string
outputType:
  type: object
  required: [drafts]
  additionalProperties: false
  properties:
    drafts:
      title: Drafts
      description: One page of the layer's open drafts.
      type: array
      items:
        type: object
        required: [id, parentRevision, stale, createdAt, createdBy]
        additionalProperties: false
        properties:
          id: { type: string }
          parentRevision: { type: integer }
          stale:
            title: Stale
            description: The layer has moved past the draft's parent revision.
            type: boolean
          message: { type: string }
          createdAt: { x-telo-type: Telo.Timestamp }
          createdBy: { $ref: "telo://Self/Actor" }
    next:
      title: Next
      description: >-
        The cursor of the following page. Present only when more exist; absent on
        the last page.
      type: string
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose drafts are listed.
      x-telo-ref:
        kind: Self.DraftedStore
        use: dependency
---
kind: Telo.Definition
metadata:
  name: NodeConflicts
  description: >-
    Lists the undecided conflicts a draft has on one entity type of a knowledge
    graph, a page at a time: for each key, how the two sides collide, what the
    draft states and what the other side now states — the layer the draft was
    rebased onto, or the layers beneath after a base was upgraded. Used inside a
    draft session to review and resolve conflicts before publishing.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#NodeConflicts
throws:
  codes:
    GRAPH_CURSOR_INVALID:
      description: >-
        The cursor is malformed, was issued for another listing, or was read from
        another draft, outside this session, or before the draft was rebased.
inputType:
  type: object
  additionalProperties: false
  properties:
    limit:
      title: Limit
      description: The most entries returned in one page.
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
    cursor:
      title: Cursor
      description: >-
        The `next` of an earlier page of this same listing, passed back unchanged
        to read the page after it. Omitted, the listing starts at its beginning.
      type: string
outputType:
  type: object
  required: [conflicts]
  additionalProperties: false
  properties:
    conflicts:
      title: Conflicts
      description: One page of the draft's conflicts on the node type, ordered by key.
      type: array
      items:
        type: object
        required: [key, class, token]
        additionalProperties: false
        properties:
          key: { x-telo-schema-projection-from: { from: /node, pick: /node/key } }
          class:
            title: Class
            description: >-
              `changed-both` — both sides changed it; `changed-removed` — the
              draft changed what the other side removed; `removed-changed` — the
              draft hides or retracts what the other side changed; `added-both`
              — the draft added what now exists, with different properties. The
              other side is the layer, for a draft it moved past, or the layers
              beneath, for a statement a pin moved under. The fifth class of
              the vocabulary belongs to relationships and never appears here.
            type: string
            enum: [changed-both, changed-removed, removed-changed, added-both, endpoint-missing]
          properties:
            title: Properties
            description: For `changed-both`, the names of the properties the two sides disagree on.
            type: array
            items: { type: string }
          mine:
            title: Mine
            description: What the draft states. Absent when the draft removes or retracts it.
            x-telo-schema-projection-from: { from: /node, omit: [/node/key] }
          theirs:
            title: Theirs
            description: >-
              What the other side now states: for a draft the layer moved past,
              what the layer now publishes; for a statement a pin moved under,
              what the layers beneath now state. Absent when it states no value.
            x-telo-schema-projection-from: { from: /node, omit: [/node/key] }
          base:
            title: Base
            description: >-
              What both sides started from: what the layer published when the
              draft's statement was written, or — for a moved pin — what the
              layers beneath stated when it was recorded. Present only where
              the store keeps one.
            x-telo-schema-projection-from: { from: /node, omit: [/node/key] }
          token:
            title: Token
            description: >-
              Names this conflict in this state. Passed to the resolve operation,
              it makes the decision apply only while the conflict is still the
              one that was read.
            type: string
    next:
      title: Next
      description: >-
        The cursor of the following page. Present only when more exist; absent on
        the last page.
      type: string
schema:
  type: object
  required: [store, node]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose draft is examined; the operation runs inside a session on it.
      x-telo-ref:
        kind: Self.DraftedStore
        use: dependency
      x-telo-requires-zone:
        zone: Self.DraftSession
        key: /store
        reason: a conflict belongs to one draft, which only a session on this store names
    node:
      title: Node
      description: The node type. The store must list it in 'nodes:'.
      x-telo-ref:
        kind: Graph.Node
        use: dependency
  x-telo-resource-rules:
    - resolve: [/store]
      condition: !cel "self.store.nodes.exists(n, n.name == self.node.name)"
      code: GRAPH_TYPE_NOT_IN_STORE
      message: names a node type its store does not list in 'nodes:'.
---
kind: Telo.Definition
metadata:
  name: RelationshipConflicts
  description: >-
    Lists the undecided conflicts a draft has on one link type of a knowledge
    graph, a page at a time: for each pair, how the two sides collide — or that
    an endpoint no longer exists — with what the draft states and what the other
    side now states: the layer the draft was rebased onto, or the layers beneath
    after a base was upgraded. Used inside a draft session before publishing.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#RelationshipConflicts
throws:
  codes:
    GRAPH_CURSOR_INVALID:
      description: >-
        The cursor is malformed, was issued for another listing, or was read from
        another draft, outside this session, or before the draft was rebased.
inputType:
  type: object
  additionalProperties: false
  properties:
    limit:
      title: Limit
      description: The most entries returned in one page.
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
    cursor:
      title: Cursor
      description: >-
        The `next` of an earlier page of this same listing, passed back unchanged
        to read the page after it. Omitted, the listing starts at its beginning.
      type: string
outputType:
  type: object
  required: [conflicts]
  additionalProperties: false
  properties:
    conflicts:
      title: Conflicts
      description: >-
        One page of the draft's conflicts on the relationship type, ordered by
        source then target.
      type: array
      items:
        type: object
        required: [source, target, class, token]
        additionalProperties: false
        properties:
          source: { x-telo-schema-projection-from: { from: /relationship/source, pick: /relationship/source/key } }
          target: { x-telo-schema-projection-from: { from: /relationship/target, pick: /relationship/target/key } }
          class:
            title: Class
            description: >-
              `changed-both` — both sides changed it; `changed-removed` — the
              draft changed what the other side removed; `removed-changed` — the
              draft hides or retracts what the other side changed; `added-both`
              — the draft added what now exists, with different properties;
              `endpoint-missing` — a relationship the layer states whose
              endpoint does not resolve. The other side is the layer, for a
              draft it moved past, or the layers beneath, for a statement a pin
              moved under.
            type: string
            enum: [changed-both, changed-removed, removed-changed, added-both, endpoint-missing]
          properties:
            title: Properties
            description: For `changed-both`, the names of the properties the two sides disagree on.
            type: array
            items: { type: string }
          mine:
            title: Mine
            description: What the draft states. Absent when the draft removes or retracts it.
            x-telo-schema-projection-from: /relationship
          theirs:
            title: Theirs
            description: >-
              What the other side now states: for a draft the layer moved past,
              what the layer now publishes; for a statement a pin moved under,
              what the layers beneath now state. Absent when it states no value.
            x-telo-schema-projection-from: /relationship
          base:
            title: Base
            description: >-
              What both sides started from: what the layer published when the
              draft's statement was written, or — for a moved pin — what the
              layers beneath stated when it was recorded. Present only where
              the store keeps one.
            x-telo-schema-projection-from: /relationship
          token:
            title: Token
            description: >-
              Names this conflict in this state. Passed to the resolve operation,
              it makes the decision apply only while the conflict is still the
              one that was read.
            type: string
    next:
      title: Next
      description: >-
        The cursor of the following page. Present only when more exist; absent on
        the last page.
      type: string
schema:
  type: object
  required: [store, relationship]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose draft is examined; the operation runs inside a session on it.
      x-telo-ref:
        kind: Self.DraftedStore
        use: dependency
      x-telo-requires-zone:
        zone: Self.DraftSession
        key: /store
        reason: a conflict belongs to one draft, which only a session on this store names
    relationship:
      title: Relationship
      description: The relationship type. The store must list it in 'relationships:'.
      x-telo-ref:
        kind: Graph.Relationship
        use: dependency
  x-telo-resource-rules:
    - resolve: [/store]
      condition: !cel "self.store.?relationships.orValue([]).exists(r, r.name == self.relationship.name)"
      code: GRAPH_TYPE_NOT_IN_STORE
      message: names a relationship type its store does not list in 'relationships:'.
---
kind: Telo.Definition
metadata:
  name: ResolveNodeConflict
  description: >-
    Decides one conflict a draft has on an entity of a knowledge graph: keep the
    draft's version or take the other side's, optionally with property values
    set on top. Of two callers deciding the same conflict exactly one applies.
    Returns the entity as the draft now shows it.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#ResolveNodeConflict
throws:
  codes:
    GRAPH_CONFLICT_NOT_FOUND:
      description: >-
        No conflict stands on the key, or the token names a conflict that has
        since changed — another caller decided it, or either side moved.
    GRAPH_RESOLUTION_INVALID:
      description: >-
        The decision cannot apply and nothing was written: `set` where the
        taken side states no value.
inputType:
  type: object
  required: [key, take]
  additionalProperties: false
  properties:
    key:
      title: Key
      description: The key the conflict stands on.
      x-telo-schema-projection-from: { from: /node, pick: /node/key }
    take:
      title: Take
      description: >-
        The side kept: `mine` keeps the draft's statement, `theirs` drops it for
        what the other side now states — the layer, or the layers beneath.
      type: string
      enum: [mine, theirs]
    set:
      title: Set
      description: >-
        Property values applied on top of the taken side. The side must state a
        value for them to apply to.
      x-telo-schema-projection-from: { from: /node, omit: [/node/key] }
    token:
      title: Token
      description: >-
        The `token` the conflict was listed with. Given, the decision applies
        only while the conflict is still that one.
      type: string
    resolvedBy:
      title: Resolved By
      description: Who decided. Omitted, the store resource itself is recorded.
      $ref: "telo://Self/Actor"
outputType:
  type: object
  additionalProperties: false
  properties:
    node:
      title: Node
      description: >-
        The node the draft now shows for the key. Absent when the decision
        leaves no statement visible.
      type: object
      required: [key, properties]
      additionalProperties: false
      properties:
        key: { x-telo-schema-projection-from: { from: /node, pick: /node/key } }
        properties: { x-telo-schema-projection-from: { from: /node, omit: [/node/key] } }
        origin:
          title: Origin
          description: The layer the node is resolved from.
          type: string
schema:
  type: object
  required: [store, node]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose draft is decided; the operation runs inside a session on it.
      x-telo-ref:
        kind: Self.DraftedStore
        use: dependency
      x-telo-requires-zone:
        zone: Self.DraftSession
        key: /store
        reason: a conflict belongs to one draft, which only a session on this store names
    node:
      title: Node
      description: The node type. The store must list it in 'nodes:'.
      x-telo-ref:
        kind: Graph.Node
        use: dependency
  x-telo-resource-rules:
    - resolve: [/store]
      condition: !cel "self.store.nodes.exists(n, n.name == self.node.name)"
      code: GRAPH_TYPE_NOT_IN_STORE
      message: names a node type its store does not list in 'nodes:'.
---
