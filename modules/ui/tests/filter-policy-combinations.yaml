    - { type: composite, ref: { kind: Ui.Filters, model: !ref Todo, collection: !ref todos, content: { type: text, text: Todos }, policy: { show: chosen, controls: chips, apply: button, summary: chips, placement: { kind: Ui.OverlayPlacement, surface: { kind: Ui.Popover } } } } }
---
kind: Run.Sequence
metadata:
  name: main
steps:
  - name: read
    invoke: { kind: Probe.Read, source: !ref every }
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        bars: !cel "size(steps.read.result.node.children)"
        distinct: !cel "size(steps.read.result.node.children.map(c, c.show + ' ' + c.controls + ' ' + c.apply + ' ' + c.summary + ' ' + c.placement.type).filter(k, steps.read.result.node.children.exists_one(c, c.show + ' ' + c.controls + ' ' + c.apply + ' ' + c.summary + ' ' + c.placement.type == k)))"
      expected:
        bars: 96
