kind: Telo.Application
metadata:
  name: FeedbackApiRepo
  version: 1.0.0
  categories: [ Transport, Storage, UI ]
  description: |
    Feedback REST API with no hand-written SQL past the schema migration:
    `SqlRepository.Create` / `SqlRepository.Read` are the route handlers, and CEL
    maps `request.*` into them and `result.rows` back out.

    Reach for this shape when the routes are yours to design but the queries are
    plain table access; reach for `Crud.Api` (see `todo-app`) when you want
    the whole REST surface generated, and for `Sql.Query` when you need a join.

    A page on `/` takes feedback through a form and lists what came in, drawn
    from the same routes — the form and the list are declared, not coded.

    Run, open http://localhost:8844/, or use the API:
        curl -X POST localhost:8844/v1/feedback \
          -H 'content-type: application/json' \
          -d '{"text":"the docs are great","source":"web","rating":5}'
        curl localhost:8844/v1/feedback
lang: en
requires:
  # A host-path variable declaring `entry:` needs 0.121.0.
  # 0.133.0: `Telo.OpenUrl`.
  telo: ">=0.133.0"
imports:
  Http: oci://ghcr.io/telorun/http-server@0.44.2#sha256-Z3aQs8Q0qiXMrxwC8RFylKFbxqMv4BE1d1wJ_akPtb8
  Sql: oci://ghcr.io/telorun/sql@0.31.4#sha256-N-TiIeZ8rA0e9-RXCrsb1s-oLIJ1ajdAIdHbjt8kMxk
  SQLite: oci://ghcr.io/telorun/sqlite@0.14.4#sha256-iLCP1uoF4CymIEP-0-qkDtfCSEippGAMuzxh0w0nvqI
  SqlRepository: oci://ghcr.io/telorun/sql-repository@0.21.4#sha256-BWUPXZiZG5PdApsuTv87Kt68WvZNX19Xn14cJeFc6X0
  Ui: oci://ghcr.io/telorun/ui@0.12.0#sha256-PmVFuNKEaL--ks4yTJaB41A7GaD_vZSROyE9FvJiDJ8
  UiReact: oci://ghcr.io/telorun/ui-react@0.13.0#sha256-YUbh4dD6sLER8KHV4yFPHjD4B4ez4xdut-bpobAIqrQ
targets:
  - !ref migrate
  - !ref server
  - { name: openUi, invoke: !ref openUi, inputs: { url: !cel "resources.server.status.localUrl" } }
ports: { http: { env: PORT, default: 8844 } }
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: { name: Telo.HostPath, entry: file }
    default: feedback.db
---
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.dbFile"
---
kind: SQLite.Table
metadata: { name: feedback }
table: feedback
columns:
  id: { type: integer, primaryKey: true, identity: always }
  text: { type: text, nullable: false }
  source: { type: text }
  rating: { type: integer, nullable: false }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata: { name: migrate }
connection: !ref db
tables:
  - !ref feedback
---
# One repository resource per operation, not per route: `readFeedback` serves
# both the list and the by-id route — the `filters:` differ at the call site.
kind: SqlRepository.Create
metadata: { name: insertFeedback }
connection: !ref db
table: !ref feedback
---
kind: SqlRepository.Read
metadata: { name: readFeedback }
connection: !ref db
table: !ref feedback
---
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
openapi: { info: { title: Feedback API (Repository), version: 1.0.0 } }
mounts:
  - path: /v1
    mount: !ref feedbackRoutes
  - { path: /docs, mount: { kind: Http.Reference } }
  - { path: /, mount: !ref ui }
---
kind: Http.Api
metadata: { name: feedbackRoutes }
routes:
  # POST /v1/feedback — insert a new entry. The request schema is the validation:
  # a rating outside 1–5 never reaches the database.
  - request:
      path: /feedback
      method: POST
      schema:
        body:
          type: object
          additionalProperties: false
          required: [ text, rating ]
          properties:
            text: { type: string, minLength: 1 }
            source: { type: string }
            rating: { type: integer, minimum: 1, maximum: 5 }
    handler: !ref insertFeedback
    inputs:
      data:
        text: !cel "request.body.text"
        source: !cel "has(request.body.source) ? request.body.source : 'unknown'"
        rating: !cel "request.body.rating"
    returns:
      - status: 201
        content: { application/json: { body: { ok: true, message: Feedback received } } }

  # GET /v1/feedback — list all entries
  - request: { path: /feedback, method: GET }
    handler: !ref readFeedback
    inputs: { filters: {} }
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result.rows"

  # GET /v1/feedback/recent — the list as an object, which is what a screen
  # reads (`Ui.Data` takes a JSON object, never a bare array).
  - request: { path: /feedback/recent, method: GET }
    handler: !ref readFeedback
    inputs: { filters: {} }
    returns:
      - status: 200
        content:
          application/json:
            body:
              entries: !cel "result.rows"

  # GET /v1/feedback/{id} — fetch a single entry by id
  - request:
      path: /feedback/{id}
      method: GET
      schema:
        params: { type: object, properties: { id: { type: integer } }, required: [id] }
    handler: !ref readFeedback
    inputs:
      filters:
        id: !cel "request.params.id"
    returns:
      - status: 200
        when: !cel "size(result.rows) > 0"
        content:
          application/json:
            body: !cel "result.rows[0]"
      - status: 404
        content: { application/json: { body: { ok: false, message: Not found } } }
---
# What the form sends; the POST route's body schema says the same.
kind: Telo.JsonSchema
metadata: { name: NewFeedback }
schema:
  type: object
  required: [text, rating]
  additionalProperties: false
  properties:
    text: { type: string, title: Feedback, minLength: 1 }
    source: { type: string, title: Where from }
    rating: { type: integer, title: Rating (1-5), minimum: 1, maximum: 5 }
---
kind: Telo.JsonSchema
metadata: { name: Received }
schema: { type: object, required: [message], properties: { message: { type: string } } }
---
kind: Telo.JsonSchema
metadata: { name: FeedbackEntries }
schema:
  type: object
  required: [entries]
  properties:
    entries:
      type: array
      items:
        type: object
        required: [id, text, rating]
        properties:
          id: { type: integer }
          text: { type: string, title: Feedback }
          source: { type: string, title: Source }
          rating: { type: integer, title: Rating }
          created_at: { type: string, title: Received }
---
kind: Ui.Action
metadata: { name: sendFeedback }
inputModel: !ref NewFeedback
outputModel: !ref Received
request: { target: /v1/feedback }
label: Send feedback
result: { type: text, text: Thank you — your feedback was received., style: success }
onSuccess: { refreshes: [/v1/feedback/recent] }
---
kind: UiReact.App
metadata: { name: ui }
title: Feedback
theme: !ref UiReact.defaultTheme
pages:
  - kind: Ui.Page
    path: /
    title: Feedback
    width: contained
    children:
      - { type: text, text: Tell us what you think, style: heading }
      - { type: composite, ref: !ref sendFeedback }
      - { type: text, text: What came in, style: subheading }
      - type: composite
        ref:
          kind: Ui.Data
          model: !ref FeedbackEntries
          source: /v1/feedback/recent
          reloadOn: [focus]
          content:
            type: list
            rows: !cel "data.entries"
            columns:
              - { header: Rating, value: !cel "row.rating" }
              - { header: Feedback, value: !cel "row.text" }
              - { header: Source, value: !cel "row.source" }
              - { header: Received, value: !cel "row.created_at" }
---
kind: Telo.OpenUrl
metadata: { name: openUi }
