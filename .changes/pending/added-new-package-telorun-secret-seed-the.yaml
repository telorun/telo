units:
  packages/secret-seed: Added
body: "New package @telorun/secret-seed: the 32-byte secret seed a host derives
  generated secrets from — its unpadded base64url encoding and refusals naming their
  source, generating a seed, the secret-seed file read-or-create, and the child-seed
  derivation (HKDF-SHA256, empty salt, the label as info), with language-neutral
  conformance vectors."
