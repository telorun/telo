# A supervisor hands its child a license key only when it has one: the
# field-value `!if` has no `else:`, so with `LICENSE_KEY` unset the child's
# `secrets:` map has no `licenseKey` entry at all, and the child reads it absent.
kind: Telo.Application
metadata:
  name: Supervisor
imports:
  App: ../../../../modules/app
  Assert: ../../../../modules/assert
  Run: ../../../../modules/run
  Timer: ../../../../modules/timer
secrets:
  licenseKey: { env: LICENSE_KEY, type: string, default: null }
variables:
  licensed: { env: LICENSED, type: boolean, default: false }
targets:
  - !ref worker
  - !ref test
---
kind: App.Instance
metadata: { name: worker }
source: ./worker/telo.yaml
variables:
  licensed: !cel "variables.licensed"
secrets:
  licenseKey: !if
    if: !cel "secrets.licenseKey != null"
    then: !cel "secrets.licenseKey"
---
kind: Run.Loop
metadata: { name: awaitWorkerExit }
condition: !cel "resources.worker.status.exitCode == null"
maxIterations: 200
steps:
  - name: wait
    invoke: { kind: Timer.Delay }
    inputs:
      duration: 20ms
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: awaitExit
    invoke: !ref awaitWorkerExit
  - name: verifyExit
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "resources.worker.status.exitCode"
      expected: 0
