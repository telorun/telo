kind: Telo.Application
metadata:
  name: InternalColumnBoots
  version: 1.0.0
  description: |
    Boot 2 — the same release, restarted. The internal columns and the mixed index
    are read back from the database an earlier process wrote, and nothing changes.
imports:
  Sql: ../../../../sql
  SQLite: ../../../../sqlite
  Run: ../../../../run
  Assert: ../../../../assert
variables:
  dbFile: { env: INTERNAL_COLUMN_BOOTS_DB, type: string, x-telo-type: Telo.HostPath, default: ./.telo/internal-column-boots.db }
targets:
  - !ref appSchema
  - !ref test
---
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.dbFile"
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
version: !cel "module.version"
tables: [!ref documents, !ref control]
---
kind: Sql.Query
metadata: { name: read }
connection: !ref db
---
kind: Assert.Equals
metadata: { name: check }
---
kind: SQLite.Table
metadata: { name: documents }
table: documents
columns:
  slug: { type: text, primaryKey: true }
  note: { type: text }
internalColumns:
  layer: { type: text, nullable: false, default: base }
  revision: { type: integer }
indexes:
  documents_layer_slug: { columns: [layer, slug], unique: true }
---
# No row contract: every column is the table's own.
kind: SQLite.Table
metadata: { name: control }
table: control
columns: {}
internalColumns:
  name: { type: text, primaryKey: true }
  head_revision: { type: integer, nullable: false, default: 0 }
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: assertNothingTombstoned
    invoke: !ref check
    inputs:
      actual: !cel "resources.appSchema.status.tombstoned"
      expected: []
  - name: assertNothingHeld
    invoke: !ref check
    inputs:
      actual: !cel "resources.appSchema.status.pendingReclamation"
      expected: []
  - name: indexes
    invoke: !ref read
    inputs:
      sql: "SELECT name FROM pragma_index_list('documents') WHERE origin = 'c'"
  - name: assertIndexOnce
    invoke: !ref check
    inputs:
      actual: !cel "steps.indexes.result.rows"
      expected: [{ name: documents_layer_slug }]
  - name: control
    invoke: !ref read
    inputs:
      sql: "SELECT name, head_revision FROM control"
  - name: assertControlIntact
    invoke: !ref check
    inputs:
      actual: !cel "steps.control.result.rows"
      expected: [{ name: main, head_revision: 4 }]
  - name: row
    invoke: !ref read
    inputs:
      sql: "SELECT slug, note, layer, revision FROM documents"
  - name: assertRowIntact
    invoke: !ref check
    inputs:
      actual: !cel "steps.row.result.rows"
      expected: [{ slug: intro, note: first, layer: base, revision: 7 }]
