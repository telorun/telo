# The console in Polish: its own texts and its models' titles and descriptions;
# ui's own texts come from `Ui.polishTranslations`. A plural source is matched
# by the text its `other` case reads, and translated into Polish's four cases.
kind: Telo.TextTranslations
metadata: { name: polish }
lang: pl
texts:
  # Pages and the sign-in gate.
  - { text: Reports, translation: Raporty }
  - { text: Projects, translation: Projekty }
  - { text: Monthly reports, translation: Raporty miesięczne }
  - { text: Checking your sign-in…, translation: Sprawdzanie logowania… }
  - { text: Google sign-in was cancelled., translation: Logowanie przez Google zostało anulowane. }
  - { text: Your sign-in expired before it completed. Connect again., translation: Logowanie wygasło przed zakończeniem. Połącz się ponownie. }
  - { text: Connect your Google account to read timesheets., translation: "Połącz konto Google, aby odczytać arkusze czasu pracy." }
  - { text: Connect Google, translation: Połącz z Google }
  - { text: Sign out, translation: Wyloguj }
  - { text: Signed in as, translation: Zalogowano jako }
  # The report form.
  - { text: Generate, translation: Generuj }
  - { text: Source, translation: Źródło }
  - { text: The timesheet the hours are read from., translation: "Arkusz, z którego czytane są godziny." }
  - { text: Period, translation: Okres }
  - { text: Content, translation: Zawartość }
  - { text: Output, translation: Wynik }
  - { text: Timesheet, translation: Arkusz czasu pracy }
  - { text: Upload folder, translation: Folder docelowy }
  - { text: Where Upload puts a report., translation: Tu przycisk Prześlij umieszcza raport. }
  - { text: None chosen means every project of the sheet., translation: Bez wyboru oznacza wszystkie projekty arkusza. }
  - { text: Columns, translation: Kolumny }
  - { text: Always in this order., translation: Zawsze w tej kolejności. }
  - { text: Date, translation: Data }
  - { text: Person, translation: Osoba }
  - { text: Task, translation: Zadanie }
  - { text: Hours, translation: Godziny }
  - { text: Amount, translation: Kwota }
  - { text: Hours as, translation: Godziny jako }
  - { text: Decimal (7.5), translation: "Ułamek dziesiętny (7,5)" }
  - { text: Hours and minutes (7:30), translation: "Godziny i minuty (7:30)" }
  - { text: One file, translation: Jeden plik }
  - { text: Merge every project into one PDF., translation: Połącz wszystkie projekty w jeden plik PDF. }
  - { text: Chart, translation: Wykres }
  - { text: Add a chart of hours per person., translation: Dodaj wykres godzin na osobę. }
  - { text: This month, translation: Ten miesiąc }
  - { text: Last month, translation: Poprzedni miesiąc }
  - { text: Last week, translation: Poprzedni tydzień }
  - { text: This quarter, translation: Ten kwartał }
  - { text: Choose at least one column., translation: Wybierz co najmniej jedną kolumnę. }
  # Drive files and projects.
  - { text: Name, translation: Nazwa }
  - { text: Kind, translation: Rodzaj }
  - { text: Spreadsheet, translation: Arkusz }
  - { text: Folder, translation: Folder }
  - { text: Owner, translation: Właściciel }
  - { text: Open, translation: Otwórz }
  - { text: Closed, translation: Zamknięty }
  - { text: Project, translation: Projekt }
  - { text: Billing e-mail, translation: E-mail do faktur }
  # The answer.
  - text: "{$count} projects with logged time, {$period}"
    translation:
      plural: count
      cases:
        one: "{$count} projekt z zalogowanym czasem, {$period}"
        few: "{$count} projekty z zalogowanym czasem, {$period}"
        many: "{$count} projektów z zalogowanym czasem, {$period}"
        other: "{$count} projektu z zalogowanym czasem, {$period}"
  - text: "{$count} chosen projects have no time in the period and were skipped."
    translation:
      plural: count
      cases:
        one: "{$count} wybrany projekt nie ma czasu w tym okresie i został pominięty."
        few: "{$count} wybrane projekty nie mają czasu w tym okresie i zostały pominięte."
        many: "{$count} wybranych projektów nie ma czasu w tym okresie i zostało pominiętych."
        other: "{$count} wybranego projektu nie ma czasu w tym okresie i zostało pominiętych."
  - { text: No project has logged time in this period., translation: Żaden projekt nie ma zalogowanego czasu w tym okresie. }
  - { text: "Time was logged, but no file was produced.", translation: "Czas został zalogowany, ale nie powstał żaden plik." }
  - { text: Hours without a rate, translation: Godziny bez stawki }
  - { text: Hours on no project, translation: Godziny bez projektu }
  - { text: Projects with no currency, translation: Projekty bez waluty }
  - { text: Download all as one file, translation: Pobierz wszystko jako jeden plik }
  - { text: Download the chart, translation: Pobierz wykres }
  - { text: Files, translation: Pliki }
  - { text: E-mail, translation: E-mail }
  - { text: Currency, translation: Waluta }
  - { text: PDF, translation: PDF }
  - { text: Projects of the sheet, translation: Projekty arkusza }
  - { text: See the sheet's projects, translation: Zobacz projekty arkusza }
  - { text: Draft e-mail, translation: Szkic e-maila }
  - { text: Draft, translation: Szkic }
  - { text: Open the draft, translation: Otwórz szkic }
  - { text: The project has no billing e-mail., translation: Projekt nie ma adresu e-mail do faktur. }
  - { text: Upload, translation: Prześlij }
  - { text: Uploaded file, translation: Przesłany plik }
  - { text: "Uploaded to {$target}", translation: "Przesłano do {$target}" }
  - { text: Choose an upload folder first., translation: Najpierw wybierz folder docelowy. }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: "No answer · {$code}", translation: "Brak odpowiedzi · {$code}" }
  # The projects page.
  - { text: Projects of a timesheet, translation: Projekty arkusza czasu pracy }
  - { text: Sign in on the Reports page first., translation: Najpierw zaloguj się na stronie Raporty. }
  - { text: Remind, translation: Przypomnij }
  - { text: "Reminder sent to {$address}", translation: "Wysłano przypomnienie do {$address}" }
  - { text: Remind the client to log this month's time?, translation: Przypomnieć klientowi o zalogowaniu czasu za ten miesiąc? }

  # The date range's labels, which ui also shows of its own.
  - { text: From, translation: Od }
  - { text: To, translation: Do }
