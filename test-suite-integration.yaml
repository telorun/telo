# Tests that need infrastructure the root suite deliberately does not have.
#
# `test-suite.yaml` must run on a clean checkout with nothing installed — that is
# what makes a red module suite mean "the code is wrong" rather than "something
# was not up". These tests need something outside the checkout, so they are
# discovered from a directory the root suite's `**/tests/*.yaml` glob does not
# reach (its own subdirectory) and are run by their own command.
#
# Two kinds live here. **A container engine**: a test that needs a database
# starts its own — each PostgreSQL test imports
# `modules/postgres/tests/__fixtures__/container`, which runs a disposable server
# for that test alone and removes it when the test ends — so nothing has to be
# running beforehand except the engine. The engine is reached at
# TELO_HOST_CONTAINER_ENGINE_URL (default unix:///var/run/docker.sock), with
# TELO_HOST_CONTAINER_ENGINE_TOKEN when it asks for one; a runner session sets
# both to the engine it serves.
#
# **A live vendor API**: the `openai-live-*` tests. They skip silently with no
# OPENAI_API_KEY, so they satisfied the clean-checkout rule literally while in
# the root suite — but with a key present a vendor 500 turned that suite red for
# a reason that is not the code, which is the same confusion the split exists to
# remove. The CI job running this suite already carries the key.
kind: Telo.Application
metadata:
  name: IntegrationTestSuite
  version: 1.0.0
variables:
  include:
    type: array
    items: { type: string }
    arg: include
    description: Glob pattern selecting the test manifests to run, relative to this file.
    default:
    - "**/tests/integration/*.yaml"
  exclude:
    type: array
    items: { type: string }
    arg: exclude
    description: Glob pattern excluding test manifests, relative to this file.
    default:
    - "**/__fixtures__/**"
    # Agent worktrees are whole checkouts of this repo — same as the root suite.
    - ".claude/**"
    - "apps/**"
  filter:
    type: string
    arg: { position: 0 }
    description: Run only the tests whose path contains this text.
    default: ""
  concurrency:
    type: integer
    minimum: 1
    arg: concurrency
    description: How many tests run at once.
    default: 3
imports:
  Test: ./modules/test
targets:
  - !ref runAll
---
kind: Test.Suite
metadata:
  name: runAll
include: !cel "variables.include"
exclude: !cel "variables.exclude"
filter: !cel "variables.filter"
concurrency: !cel "variables.concurrency"
