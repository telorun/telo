kind: Telo.Application
metadata:
  name: PgEnumBoots
  version: 4.0.0
  description: |
    Boot 4 — a value is REMOVED from the declaration. PostgreSQL cannot drop an
    enum label without rewriting every table that stores it, so the removal is
    recorded and reported, the type is left alone, and the boot succeeds.

    The opposite case to a removed OBJECT, and for the opposite reason: a dropped
    column is deferred because it CAN be executed later, while this one is
    reported because it cannot be executed at all.
imports:
  Sql: ../../../../../sql
  Postgres: ../../../../
  Run: ../../../../../run
  Assert: ../../../../../assert
variables:
  dbHost: { env: DB_HOST, type: string, default: localhost }
  dbPort: { env: DB_PORT, type: integer, default: 5432 }
  dbUser: { env: DB_USER, type: string, default: postgres }
  dbPassword: { env: DB_PASSWORD, type: string, default: postgres }
  dbName: { env: DB_NAME, type: string, default: postgres }
targets:
  - !ref appSchema
  - !ref test
---
kind: Postgres.Connection
metadata: { name: db }
connectionString: !cel >-
  'postgres://' + variables.dbUser + ':' + variables.dbPassword + '@' +
  variables.dbHost + ':' + string(variables.dbPort) + '/' + variables.dbName
---
kind: Postgres.Enum
metadata: { name: messageRole }
typeName: message_role
values: [system, user, assistant]
---
kind: Postgres.Table
metadata: { name: messages }
table: messages
columns:
  id: { type: bigint, primaryKey: true, identity: always }
  role: { type: !ref messageRole, nullable: false }
  body: { type: text }
---
kind: Postgres.Schema
metadata: { name: appSchema }
connection: !ref db
schema: telo_pg_enum_boots
version: !cel "module.version"
enums: [!ref messageRole]
tables: [!ref messages]
reclaim: { afterVersions: 2, afterDuration: 0ms }
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: assertReported
    invoke: !ref assertReported
    inputs:
      actual: !cel "resources.appSchema.status.retainedEnumValues"
      expected: ["message_role.tool"]
  # The label is still in the type — nothing was executed — so the row that used
  # it is untouched and readable.
  - name: readType
    invoke: !ref query
    inputs:
      sql: >-
        SELECT e.enumlabel AS label FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        JOIN pg_enum e ON e.enumtypid = t.oid
        WHERE n.nspname = 'telo_pg_enum_boots' AND t.typname = 'message_role'
        ORDER BY e.enumsortorder
  - name: assertValues
    invoke: !ref assertValues
    inputs:
      actual: !cel "steps.readType.result.rows"
      expected:
        - { label: system }
        - { label: user }
        - { label: assistant }
        - { label: tool }
  - name: readRows
    invoke: !ref query
    inputs:
      sql: "SELECT role FROM telo_pg_enum_boots.messages ORDER BY id"
  - name: assertRows
    invoke: !ref assertRows
    inputs:
      actual: !cel "steps.readRows.result.rows"
      expected:
        - { role: user }
        - { role: tool }
---
kind: Sql.Query
metadata: { name: query }
connection: !ref db
---
kind: Assert.Equals
metadata: { name: assertReported }
---
kind: Assert.Equals
metadata: { name: assertValues }
---
kind: Assert.Equals
metadata: { name: assertRows }
