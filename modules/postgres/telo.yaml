kind: Telo.Library
metadata:
  name: Postgres
  version: 0.3.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Storage]
  description: |
    Connects an application to a PostgreSQL database over a standard `postgres://`
    URL, with TLS modes and a pooled set of connections shared by every query,
    statement, transaction and migration the application runs.
requires:
  # Controllers return their effects from `init()` / `run()`; a runtime that does
  # not execute a returned chain allocates nothing and undoes nothing.
  # 0.82.1: a column's `type:` unions a storage class with a reference to a
  # declared enum. An older analyzer reads a scalar at any slot carrying an
  # `x-telo-ref` as the removed string-reference form, so it rejects every
  # consumer's `type: text` and tells its author to write `!ref text`. Verified
  # by execution against 0.82.0.
  telo: ">=0.82.1"
imports:
  Sql: ../sql
exports:
  kinds:
    - Connection
    - Table
    - Enum
    - Schema
---
kind: Telo.Definition
metadata:
  name: Connection
  description: >-
    A pooled connection to a PostgreSQL database, configured by a `postgres://` URL
    with the usual TLS modes and pool sizing, and shared by every operation that
    references it.
capability: Telo.Provider
extends: Sql.Connection
controllers:
  - pkg:telo/local/js?path=./nodejs/postgres.mjs&local_path=./nodejs/src/index.ts#ConnectionController
schema:
  type: object
  additionalProperties: false
  required:
    - connectionString
  examples:
    - connectionString: postgres://user:password@localhost:5432/mydb?sslmode=require
    - connectionString: postgres://user:password@localhost:5432/mydb
      pool:
        min: 2
        max: 20
  properties:
    connectionString:
      title: Connection String
      type: string
      description: >-
        PostgreSQL connection URL — `postgres://` or `postgresql://`. TLS is
        configured with the standard libpq `?sslmode=` query parameter
        (`disable`, `require`, `verify-ca`, `verify-full`).
    pool:
      title: Pool
      description: Database connection pool configuration.
      type: object
      additionalProperties: false
      properties:
        min:
          title: Min
          description: Minimum number of connections in the pool.
          type: integer
          default: 1
        max:
          title: Max
          description: Maximum number of connections in the pool.
          type: integer
          default: 10
        idleTimeoutMs:
          title: Idle Timeout Ms
          description: Milliseconds before idle connections are closed.
          type: integer
        connectionTimeoutMs:
          title: Connection Timeout Ms
          description: Milliseconds to wait for a new connection.
          type: integer
        maxLifetimeMs:
          title: Max Lifetime Ms
          description: >-
            Milliseconds before a connection is retired and replaced, however
            healthy it looks. Bounds how long any single connection can have been
            broken without anyone noticing. Unset leaves connections unlimited.
          type: integer
          minimum: 0
        healthCheckMs:
          title: Health Check Ms
          description: >-
            Milliseconds between liveness probes of idle connections. A peer that
            disappears without closing the socket — an evicted NAT mapping, a
            blackholed route — reports nothing, so it is only discovered by
            sending something; the probe discards dead connections before a
            request picks one up, and tops the pool back up to `min`. `0`
            disables probing.
          type: integer
          minimum: 0
          default: 60000
---
# Postgres.Table — the full PostgreSQL vocabulary, deliberately not a neutral
# subset. `x-telo-schema-map` on `type` declares the JSON Schema each type
# projects to, so the analyzer performs a lookup and never learns that `citext`
# exists. The projection is lossy on purpose: length, precision, collation and
# check constraints do not reach it, because CEL needs the type, nullability and
# repetition and the database enforces the rest.
kind: Telo.Definition
metadata:
  name: Enum
  description: >-
    One PostgreSQL enum type — a named set of permitted string values, created by
    the schema that lists it and referenced from the columns that use it. Adding a
    value alters the type in place; removing one is recorded and left standing,
    because PostgreSQL cannot drop an enum label without rewriting every table
    that stores it.
capability: Telo.Provider
extends: Sql.Enum
controllers:
  - pkg:telo/local/js?path=./nodejs/postgres.mjs&local_path=./nodejs/src/index.ts#EnumController
schema:
  type: object
  additionalProperties: false
  required: [typeName, values]
  examples:
    - typeName: message_role
      values: [system, user, assistant]
  properties:
    typeName:
      title: Type Name
      description: >-
        The physical type name, and this declaration's durable identity — the
        ledger keys on it, never on the resource name, so renaming the resource
        costs nothing and renaming this is a schema change.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    values:
      title: Values
      description: >-
        The permitted values, in declaration order — which is the order the type
        sorts in, unlike a CHECK constraint over text.
      type: array
      minItems: 1
      items: { type: string, minLength: 1 }
    renamedFrom:
      title: Renamed From
      description: >-
        The physical type name this declaration supersedes, rendering
        `ALTER TYPE … RENAME TO`. The marker is not optional sugar: the reconciler
        cannot tell a rename from a drop-and-create, and guessing wrong here
        creates the new type, alters every column that uses it — a table rewrite
        each — and tombstones the old one.

        Advisory, so it may be left in place indefinitely: neither name present is
        a fresh database and the type is simply created. Both present is refused,
        naming both, because that is either a half-finished earlier run or a type
        created independently and those want opposite repairs.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
---
kind: Telo.Definition
metadata:
  name: Table
  description: >-
    One PostgreSQL table stated as what it is — named columns in the engine's own
    type vocabulary, named indexes, named foreign keys. Reconciled by the Schema
    resource that lists it: absent tables and columns are created, widening changes
    are applied, and a removal is recorded rather than executed.
capability: Telo.Provider
extends: Sql.Table
controllers:
  - pkg:telo/local/js?path=./nodejs/postgres.mjs&local_path=./nodejs/src/index.ts#TableController
x-telo-schema-projection:
  entries: /columns
  key: type
  nullable: nullable
  array: array
  # A `type:` holding a REFERENCE is not a key, so it falls through to this path.
  # A PostgreSQL enum IS its own base type, so the base is written literally; what
  # crosses is the enum itself, because it is the type at the granularity a
  # consumer acts on — the enum in a CRUD model's OpenAPI operation, a completion
  # list in the editor, a filter a repository can reject before the query.
  reference:
    from: values
    keyword: enum
    base: { type: string }
schema:
  type: object
  additionalProperties: false
  required: [table, columns]
  # The cross-field rules are inherited from `Sql.Table`: they check relationships
  # the shared reconciler enforces at boot for EVERY backend, so a copy here would
  # be a second one to keep in step — and a backend that forgot to make it would
  # ship with no static check at all. Anything genuinely PostgreSQL-specific would
  # be declared here beside them. The controller keeps its runtime guards either
  # way: a library caller reaching `runSchemaPass` directly never passed through
  # `telo check`.
  examples:
    - table: users
      columns:
        id: { type: uuid, primaryKey: true, defaultExpression: "gen_random_uuid()" }
        email: { type: citext, nullable: false, unique: true }
        displayName: { type: varchar, length: 64, nullable: false }
  properties:
    table:
      title: Table
      description: The physical table name.
      type: string
      minLength: 1
    renamedFrom:
      title: Renamed From
      description: >-
        The physical table this declaration supersedes, rendered as
        `ALTER TABLE … RENAME TO` and applied BEFORE the reconciliation pass.

        Unlike a column's rename this is NATIVE, and the difference is not an
        oversight: a column rename is expand-contract because both names can
        coexist while the previous version of the app is still running, and a
        table has no cheap equivalent — copying every row is unbounded work, and
        writes during the overlap would land in one table and not the other. So
        the rename is immediate, and the cost is stated here: between the rename
        and the new deployment, an instance still running the previous version
        does not find the table.

        Advisory. Neither name present is a fresh database and the table is simply
        created, so a marker left in the manifest indefinitely is harmless; both
        names present is refused, naming both; and a predecessor the ledger does
        not record as owned is refused.
      type: string
    columns:
      title: Columns
      description: >-
        Columns keyed by name. The key is durable identity — tombstones key on it
        and a rename is expand-contract, never a native RENAME — so column order
        carries no meaning and a duplicate name is structurally unrepresentable.
      type: object
      minProperties: 1
      propertyNames:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      additionalProperties:
        type: object
        additionalProperties: false
        required: [type]
        # A typed literal and a backend SQL expression are separate fields
        # because nothing can tell a function call from a string by looking at
        # it — so exactly one may be set, and saying so here means `telo check`
        # reports it instead of the boot.
        not:
          required: [default, defaultExpression]
        # A primary key cannot hold NULL, and the engine enforces that whether
        # or not the declaration says so. Declaring the opposite is a
        # contradiction, and left standing it would make every boot after the
        # first plan a DROP NOT NULL on the key.
        allOf:
          - if:
              required: [primaryKey, nullable]
              properties:
                primaryKey: { const: true }
                nullable: { const: true }
            then: false
        properties:
          type:
            title: Type
            # A named domain goes HERE, because in PostgreSQL it IS the column's
            # type. A second field beside `type:` would state in two places what
            # the engine states in one, and leave the two free to disagree.
            #
            # `type: object` on the reference branch is not decoration: a branch
            # with no keywords is an empty schema matching everything, so a valid
            # storage class would match both branches and the union would fail.
            description: >-
              PostgreSQL type — a storage class, or a reference to an enum this
              schema declares. Parameters are structured fields (`length`,
              `precision`, `scale`), never spelled into this value, so nothing has
              to parse a type back apart.
            oneOf:
            - title: Storage class
              type: string
              enum:
                [text, varchar, char, citext, uuid, json, jsonb, boolean, smallint,
                 integer, bigint, numeric, real, doublePrecision, date, time,
                 timestamp, timestamptz, interval, bytea, inet, cidr, macaddr,
                 tsvector]
              x-telo-schema-map:
                text: { type: string }
                varchar: { type: string }
                char: { type: string }
                citext: { type: string }
                uuid: { type: string }
                # A JSON column holds any JSON value — an array or a scalar as
                # readily as an object — so `{type: object}` would make a valid
                # row a static type error. Unconstrained is the honest projection.
                json: {}
                jsonb: {}
                boolean: { type: boolean }
                smallint: { type: integer }
                integer: { type: integer }
                bigint: { type: integer }
                numeric: { type: number }
                real: { type: number }
                doublePrecision: { type: number }
                date: { type: string }
                time: { type: string }
                timestamp: { type: string }
                timestamptz: { type: string }
                interval: { type: string }
                bytea: { x-telo-type: Telo.Bytes }
                inet: { type: string }
                cidr: { type: string }
                macaddr: { type: string }
                tsvector: { type: string }
            - title: Enum type
              description: >-
                A `!ref` to an enum this schema declares. `use: schema` for the
                reason a foreign key's target table takes it: what the reconciler
                needs is the physical name, which the declaration carries, so
                nothing here requires the type to be constructed first.
              type: object
              x-telo-ref:
                kind: Self.Enum
                use: schema
          length:
            title: Length
            description: Character length for `varchar` / `char`.
            type: integer
            minimum: 1
          precision:
            title: Precision
            description: Total digits for `numeric`.
            type: integer
            minimum: 1
          scale:
            title: Scale
            description: Fractional digits for `numeric`.
            type: integer
            minimum: 0
          array:
            title: Array
            description: >-
              Declares the column as a one-dimensional array of `type`.
              Multi-dimensional arrays project as one level.
            type: boolean
            default: false
          nullable:
            title: Nullable
            type: boolean
            default: true
          primaryKey:
            title: Primary Key
            type: boolean
            default: false
          unique:
            title: Unique
            type: boolean
            default: false
          identity:
            title: Identity
            description: >-
              Makes the column `GENERATED … AS IDENTITY`. `always` refuses a
              caller-supplied value; `by default` allows one.
            type: string
            enum: [always, "by default"]
          default:
            title: Default
            description: >-
              A typed literal, checkable against the column's own type. Mutually
              exclusive with `defaultExpression`: nothing can tell
              `gen_random_uuid` the function from the string by looking at it.
          defaultExpression:
            title: Default Expression
            description: >-
              Raw PostgreSQL expression evaluated by the database
              (`gen_random_uuid()`, `now()`).
            type: string
            contentMediaType: application/sql
            x-telo-widget: code
          renamedFrom:
            title: Renamed From
            description: >-
              The column this one supersedes. The pass adds this column, copies the
              old one into it and tombstones the old one — a native rename would take
              effect immediately and break the version still running. During the
              window writes land only in the new column, so a rollback reads stale
              data.
            type: string
    indexes:
      title: Indexes
      description: Indexes keyed by name, which is their durable identity.
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        required: [columns]
        properties:
          columns:
            title: Columns
            type: array
            minItems: 1
            items: { type: string }
          unique:
            title: Unique
            type: boolean
            default: false
          method:
            title: Method
            description: Index method (`btree`, `gin`, `gist`, `hash`, `brin`).
            type: string
            enum: [btree, gin, gist, hash, brin, spgist]
          where:
            title: Where
            description: Partial-index predicate.
            type: string
            contentMediaType: application/sql
            x-telo-widget: code
    seeds:
      title: Seeds
      description: >-
        Reference data this table is declared to hold. Desired state, not
        history, which is why it is declared beside the shape it must satisfy
        rather than written as an insert migration: the rows are typed against
        this table's own columns at `telo check`, and a row deleted by hand comes
        back on the next boot.

        Applied after the reconciliation pass, since the table has to exist, and
        before `migrations:`, since a one-time backfill may reasonably read the
        reference data while nothing declared can depend on a migration that has
        already run once.
      type: object
      additionalProperties: false
      required: [key, rows]
      properties:
        key:
          title: Key
          description: >-
            The columns that decide whether a row is the same row — durable
            identity, the same principle as `table:` and an index name, and what
            the upsert conflicts on.
          type: array
          minItems: 1
          items: { type: string }
        when:
          title: When
          description: >-
            Declares the rows only when this holds. A `when:` that turns FALSE is
            a declaration withdrawn, so those rows tombstone on the next boot of
            a database that had them — the correct reading of the rule and the
            surprising one.
          type: boolean
          x-telo-eval: compile
        rows:
          title: Rows
          description: >-
            A row asserts the columns it STATES and no others: one it omits takes
            the column default on insert and keeps whatever is there on update.
            That is the answer to a seeded row edited in place — a column the seed
            declares is restored, one it does not is the operator's.
          type: array
          items:
            # The projection pointed at its OWN resource: the rows are typed
            # against this table's `columns:`, so a misspelled column or a value
            # of the wrong type is an error on the row's own line. Rows stay
            # partial by design — the projection emits no `required`, and the key
            # columns are insisted on by the controller.
            x-telo-schema-projection-from: ""
    checks:
      title: Checks
      description: >-
        Named table-level predicates, keyed by constraint name — which is their
        durable identity, so editing an expression in place is a change to that
        constraint while renaming the key is a drop and an add.

        The expression is raw PostgreSQL, not a neutral predicate vocabulary: a
        lowest-common-denominator predicate language is the position this design
        already rejected for column types, and it would fail on the predicates
        people actually write, which correlate columns. The precedent is
        `defaultExpression`, already raw engine SQL beside a typed `default`.

        Nothing reads the expression statically, so a check naming a column the
        table does not declare is reported by the engine rather than by
        `telo check`. Removing one is IMMEDIATE — a dropped constraint loses no
        data, so recording it would put a grace window on a free removal.
      type: object
      propertyNames:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      additionalProperties:
        type: object
        additionalProperties: false
        required: [expression]
        properties:
          expression:
            title: Expression
            description: The predicate, in PostgreSQL's own SQL.
            type: string
            minLength: 1
          validate:
            title: Validate
            description: >-
              `deferred` adds the constraint `NOT VALID`, so it is enforced for
              new rows immediately and the existing ones are scanned on a later
              pass — which is what keeps adding a constraint to a large table
              from holding a lock while every row is read.
            type: string
            enum: [immediate, deferred]
            default: immediate
    foreignKeys:
      title: Foreign Keys
      description: >-
        Foreign keys keyed by name. Table-level rather than a column-level clause:
        composite keys are table-level in SQL regardless, so a column-level form
        would be a second spelling of a subset — two shapes to normalize before
        diffing — and a name is the durable identity reconciliation diffs and
        tombstones on.
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        required: [columns, references]
        properties:
          columns:
            title: Columns
            type: array
            minItems: 1
            items: { type: string }
          references:
            title: References
            type: object
            additionalProperties: false
            required: [table, columns]
            properties:
              table:
                title: Table
                # Deliberately `schema` — it names a shape and registers no
                # ordering edge. What a foreign key needs from its target is the
                # physical name, which the DECLARATION carries, so nothing here
                # requires the referenced table to be constructed first. An edge
                # would also make the two most ordinary foreign keys there are
                # unbootable: a tree table references itself, and a mutual pair
                # references each other, and both are cycles.
                x-telo-ref:
                  kind: Self.Table
                  use: schema
              columns:
                title: Columns
                type: array
                minItems: 1
                items: { type: string }
          onDelete:
            title: On Delete
            type: string
            enum: [cascade, restrict, "set null", "set default", "no action"]
          onUpdate:
            title: On Update
            type: string
            enum: [cascade, restrict, "set null", "set default", "no action"]
---
# Postgres.Schema — the single schema-change kind, and exactly one namespace.
kind: Telo.Definition
metadata:
  name: Schema
  description: >-
    Brings one PostgreSQL namespace to the declared schema at start-up: creates the
    namespace and what is absent in it, applies imperative migrations before and
    after the reconciliation pass, and records what has been removed instead of
    dropping it. A removal is reclaimed only once the declared number of released
    versions and the declared time have passed.
capability: Telo.Runnable
extends: Sql.Schema
controllers:
  - pkg:telo/local/js?path=./nodejs/postgres.mjs&local_path=./nodejs/src/index.ts#SchemaController
schema:
  type: object
  additionalProperties: false
  required: [connection]
  # The version is the reclamation clock and nothing else reads it, so it is
  # required exactly when a policy is declared — an app that only runs
  # migrations writes neither.
  dependencies:
    reclaim: [version]
  examples:
    - connection: !ref Db
      schema: app
      version: !cel "module.version"
      tables: [!ref users, !ref orders]
      reclaim: { afterVersions: 3, afterDuration: 30d }
  properties:
    connection:
      title: Connection
      description: Reference to the PostgreSQL connection this schema lives in.
      x-telo-ref:
        kind: Self.Connection
        use: dependency
    schema:
      title: Schema
      description: >-
        The namespace this resource owns, created if absent. Every statement is
        schema-qualified: relying on `search_path` would let a role or session
        default decide where DDL lands, with no error when it lands wrong.
      type: string
      default: public
    # Restated from Sql.Schema so the field is a CEL slot here: eval paths are
    # read from a kind's own schema, not from the abstract it extends, and the
    # conventional value is an expression.
    version:
      title: Version
      description: >-
        The released version this deployment is running, conventionally
        `!cel "module.version"`. The clock reclamation is gated on: the number of
        distinct versions observed since an object went missing is the primary
        eligibility signal. Required when `reclaim:` is declared and pointless
        without it. Checked for emptiness by the pass rather than here: this is a
        CEL slot, and an expression reaches validation as a placeholder.
      type: string
      x-telo-eval: compile
    tables:
      title: Tables
      description: >-
        The tables this schema declares. Reconciled in one pass, so declaration
        order is never load-bearing: cross-table constraints are deferred until
        every table exists, and foreign-key ordering is never the author's problem.
      type: array
      items:
        x-telo-ref:
          kind: Self.Table
          use: dependency
    extensions:
      title: Extensions
      description: >-
        PostgreSQL extensions this schema needs, installed into its namespace
        ahead of everything else — a storage class like `citext` is unavailable
        until its extension exists, so a column naming one needs it created first.

        Provisioning is a DECLARATION, not a bucket. `CREATE EXTENSION IF NOT
        EXISTS` smuggled into `migrations:` is desired state wearing a migration's
        clothes: there is no release it belongs to, and its migration key is a lie
        the first time the entry is deleted.

        Removing one is recorded, never executed. An extension is database-wide,
        so something outside this schema may be using it and `DROP EXTENSION`
        would take every dependent object with it — the drop stays a person's
        decision, and the record says one is owed.
      type: array
      items:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    enums:
      title: Enums
      description: >-
        The enum types this schema declares and owns, listed exactly as tables
        are. Created ahead of the tables in the same pass, so a column can name a
        type this same boot creates.

        A type this list stops naming is tombstoned and reclaimed under the
        ordinary policy; one a table outside this schema still uses stays held and
        is reported as held rather than attempted.
      type: array
      items:
        x-telo-ref:
          kind: Self.Enum
          use: dependency
    ledger:
      title: Ledger
      description: >-
        Names this schema's history, kept as `telo_schema_<ledger>_*` tables in
        the namespace (`telo_schema_*` when omitted). Two schema resources over
        one namespace must name different ledgers. Durable identity: changing it
        abandons the history under the old name.
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    prepare:
      title: Prepare
      description: >-
        Data preparation for a narrowing the reconciliation pass is about to
        attempt — backfilling a column that is about to become NOT NULL, making
        values fit one that is about to narrow, converting before a non-widening
        type change. Runs in key order, after any rename and before the pass.

        This is what every refusal already tells the author to write, which is why
        the field is named for what it is FOR rather than for where it runs
        relative to the other bucket. Formerly `beforeMigrations:`; the old
        spelling is rewritten at load, and nothing re-runs, because the ledger
        stores the migration key alone.
      type: object
      x-telo-eval: compile
      propertyNames:
        pattern: "^[A-Za-z0-9_.-]+$"
      additionalProperties:
        $ref: "#/$defs/migration"
    migrations:
      title: Migrations
      description: >-
        Migrations that run AFTER the reconciliation pass, in key order — backfills
        and cleanups. The common case: an app with no declared tables writes this
        field alone and looks exactly like an imperative migration set.
      type: object
      x-telo-eval: compile
      propertyNames:
        pattern: "^[A-Za-z0-9_.-]+$"
      additionalProperties:
        $ref: "#/$defs/migration"
  $defs:
    migration:
      title: Migration
      description: >-
        Either a single `statement` or an ordered list of `statements` — exactly
        one. All statements in an entry run together.
      type: object
      oneOf:
        - required: [statement]
        - required: [statements]
      properties:
        statement:
          title: Statement
          type: string
          contentMediaType: application/sql
          x-telo-widget: code
        statements:
          title: Statements
          type: array
          minItems: 1
          items:
            type: string
            contentMediaType: application/sql
            x-telo-widget: code
