  recordRefused:
    message: The record was refused.
    description: A form's record refused with no issue naming a field.
  answerNotJson:
    message: The answer is not JSON.
    description: An answer whose body is not JSON.
  answerNotObject:
    message: The answer is not a JSON object.
    description: An answer whose body is not a JSON object.
  answerNotModel:
    message: "The answer does not fit its model: {$detail}"
    values: { detail: { type: string } }
    description: An answer its model refuses, with what was refused.
  invalid:
    message: Is not valid
    description: Under a field whose value is refused for a reason no other text names.
  required:
    message: Is required
    description: Under a field whose value fails `required`.
  type:
    message: Must be {$types}
    values: { types: { type: string } }
    description: Under a field whose value fails `type`.
  enum:
    message: "Must be one of: {$allowed}"
    values: { allowed: { type: string } }
    description: Under a field whose value fails `enum`.
  const:
    message: Must be {$value}
    values: { value: { type: string } }
    description: Under a field whose value fails `const`.
  not: { message: Is not allowed, description: Under a field whose value fails `not`. }
  anyOf:
