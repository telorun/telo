units:
  analyzer: Added
body: "A library `variables:` or `secrets:` entry typed `Text` or `Message` (or a union
  of either with `TextRecord`) is a text parameter: the value an import supplies is the
  importer's text, judged in the importer's `lang:` and counted among the texts its
  application must translate; the entry's `default:` is judged in the library's `lang:`;
  any expression there but a forwarded text record is `TEXT_ARGUMENT_COMPUTED`; inside
  the library `variables.<name>` is typed `TextRecord`; and two imports of a shared
  library supplying one text from modules of different languages are
  `SHARED_LIBRARY_CONFLICT`. This breaks a library that read such an input as a plain
  text: `variables.<name>` is now a record, read as `variables.<name>.text`."
