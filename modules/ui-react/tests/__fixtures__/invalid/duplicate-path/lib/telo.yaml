# Two pages at one path.
kind: Telo.Library
metadata:
  name: UiReactDuplicatePath
  version: 1.0.0
  description: >-
    Test fixture exporting an application that declares two pages at the same
    path.
imports:
  UiReact: ../../../../../
  Ui: ../../../../../../ui
exports:
  resources: [twice]
---
kind: UiReact.App
metadata:
  name: twice
title: Twice
words: !ref Ui.words
theme: !ref UiReact.defaultTheme
pages:
  - path: /reports
    title: Reports
    children: []
  - path: /reports
    title: Reports again
    children: []
