# THE AGREEMENT SUITE: a manifest the kernel refuses is a manifest `telo check`
# refuses.
#
# Every shape below passed `telo check` with a clean exit and then failed at
# run — four of them on the very thing the checker was silent about. The common
# factor was that each kernel guard lived in a controller with no analyzer twin,
# and nothing anywhere asserted the two agree. So each defect is pinned TWICE:
# once at the library that declares it, where `telo check` now reports it, and
# once at a CONSUMER of that library, whose entry-scoped analysis is silent by
# design and where the kernel's own guard is therefore the only thing left
# (`runFails`). A guard that gains a kernel half and no static half fails the
# first assertion; one that gains a static half and no kernel half fails the
# second.
kind: Telo.Application
metadata:
  name: CheckRunAgreementTest
  version: 1.0.0
imports:
  Assert: ../modules/assert
targets:
  - !ref dispatchObjectForm
  - !ref dispatchObjectFormAtRuntime
  - !ref dispatchRef
  - !ref baseWithBody
  - !ref baseWithBodyAtRuntime
  - !ref templateTargets
  - !ref templateTargetsAtRuntime
  - !ref templateTargetsCapability
  - !ref templateTargetsCapabilityAtRuntime
  - !ref templateEntrySchema
  - !ref templateEntrySchemaAtRuntime
  - !ref templateDuplicateEntry
  - !ref templateDuplicateEntryAtRuntime
  - !ref badExports
  - !ref childAliasScope
  - !ref moduleNameAlias
  - !ref duplicateName
  - !ref duplicateNameAtRuntime
  - !ref ownNamePrefix
  - !ref bodyOutwardRef
  - !ref inheritedRequiredHint
  - !ref inlineStepNestedInline
  - !ref inlineStepExactUnion
  - !ref scopedNameOutOfReach
  - !ref scopedNameOutOfReachAtRuntime
  - !ref forwardedInlineStep
  - !ref inlineSequenceTarget
  - !ref readsForwardedNames
  - !ref readsGeneratedNameAtRuntime
  - !ref unpinnedStagedFile
  - !ref unpinnedStagedFileAtRuntime
  - !ref unreadableSources
  - !ref unreadableSourcesAtRuntime
  - !ref pinnedStagedFile
  - !ref pinnedStagedFileRuns
  - !ref unpinnedStagedAssetAtRuntime
  - !ref pinnedStagedAssetRuns
  - !ref dependencyCycle
  - !ref dependencyCycleAtRuntime
  - !ref moduleCallNotCallable
  - !ref moduleCallNotCallableAtRuntime
  - !ref moduleCallMissing
  - !ref moduleCallMissingAtRuntime
  - !ref moduleCallNotExported
  - !ref moduleCallNotExportedAtRuntime
  - !ref moduleCallReExport
  - !ref moduleCallReExportRuns
  - !ref callableSlotStructural
  - !ref callableSlotStructuralRuns
  - !ref callableSlotMismatch
  - !ref callableSlotMismatchAtRuntime
  - !ref callableSlotOptionalRequiredAtRuntime
  - !ref callableNativeExtends
  - !ref callableNativeExtendsRuns
  - !ref callableCrossModuleChain
  - !ref callableCrossModuleChainRuns
  - !ref moduleCallCycle
  - !ref moduleCallCycleAtRuntime
  - !ref moduleCallUnboundRule
  - !ref moduleCallUnboundRuleAtRuntime
  - !ref hostPathRelative
  - !ref hostPathRelativeAtRuntime
  - !ref hostPathLiteralPrefix
  - !ref hostPathComputedAtRuntime
  - !ref modulePathMissingAtRuntime
  - !ref hostPathUntypedSource
  - !ref hostPathUntypedSourceAtRuntime
  - !ref hostPathKindDefault
  - !ref hostPathKindDefaultAtRuntime
  - !ref hostPathImportLiteral
  - !ref hostPathImportLiteralAtRuntime
  - !ref moduleCallUnboundLogging
  - !ref callableInstances
  - !ref callableInstanceSignatureAtRuntime
  - !ref callableInstanceTypeNameAtRuntime
  - !ref callableInstanceClaimAtRuntime
  - !ref callableInstanceMacroNameAtRuntime
  - !ref functionDeterministicAtRuntime
  - !ref callableKinds
  - !ref callableDefinitionsAtRuntime
  - !ref callableChildDeterministicAtRuntime
  - !ref callableChildReturnsAtRuntime
  - !ref callableClaimerAtRuntime
  - !ref callableFromFunctionAtRuntime
  - !ref callableTemplatedAtRuntime
  - !ref callableNotCallableSignatureAtRuntime
  - !ref callableNotCallableDeterministicAtRuntime
  - !ref callableAbstractsAtRuntime
  - !ref callableSignaturelessSlotAtRuntime
  - !ref callableUnresolvedShapeAtRuntime
  - !ref callableStepInvoke
  - !ref callableStepInvokeAtRuntime
  - !ref abstractExtendsUnresolved
  - !ref abstractExtendsWithCapabilityAtRuntime
  - !ref abstractExtendsInheritingCapabilityAtRuntime
  - !ref kindContractRefUnresolved
  - !ref kindContractRefUnresolvedAtRuntime
  - !ref kindContractRefRuns
  - !ref contractShapeScopeKindRuns
  - !ref contractShapeScopeInstanceRuns
  - !ref exportedInstanceShape
  - !ref exportedInstanceShapeAtRuntime
  - !ref exportedInstanceScope
  - !ref exportedInstanceScopeRuns
  - !ref templateInputsShapeRootRuns
  - !ref templateInputsShapeNestedRuns
  - !ref templateRefComputed
  - !ref templateRefComputedAtRuntime
  - !ref templateForwardInvalid
  - !ref templateForwardInvalidAtRuntime
---
# The two legacy spellings a published artifact may carry. DEPRECATIONS, not
# errors: the kernel still reads them, so refusing them statically would be the
# check/run disagreement pointed the other way.
kind: Assert.Manifest
metadata:
  name: dispatchObjectForm
source: ./__fixtures__/check-run-agreement/dispatch-object-form.yaml
expect:
  warnings:
    - code: DEPRECATED_TEMPLATE_ENTRY_NAME
      message: "is deprecated"
    - code: DEPRECATED_TEMPLATE_DISPATCH_FORM
      message: "write '!ref <entry>'"
---
# A dispatch target that names no entry is still a runtime miss — the legacy
# spelling buys compatibility, not decidability, and the kernel's message is
# what an author gets.
kind: Assert.Manifest
metadata:
  name: dispatchObjectFormAtRuntime
source: ./__fixtures__/check-run-agreement/dispatch-object-form-lib/telo.yaml
expect:
  runFails: "no entry in 'resources:' has that metadata.name"
---
# The repaired twin, which must check clean AND run clean — the agreement holds
# in both directions, or the suite would pass by refusing everything. `runs: true`
# is what makes the second half an assertion: `expect: {}` runs nothing.
kind: Assert.Manifest
metadata:
  name: dispatchRef
source: ./__fixtures__/check-run-agreement/dispatch-ref.yaml
expect:
  runs: true
---
# `base:` beside a template body. The kind silently became an empty template and
# the failure surfaced in the CONSUMER's resource as `Got: {}`.
kind: Assert.Manifest
metadata:
  name: baseWithBody
source: ./__fixtures__/check-run-agreement/base-with-body/lib/telo.yaml
expect:
  errors:
    - code: BASE_WITH_TEMPLATE_BODY
      message: "'base:' maps this kind's config onto the inherited controller"
---
kind: Assert.Manifest
metadata:
  name: baseWithBodyAtRuntime
source: ./__fixtures__/check-run-agreement/base-with-body/telo.yaml
expect:
  runFails: "ERR_BASE_WITH_TEMPLATE_BODY"
---
# A template's `targets:` beside `run:`, and naming no entry. The consumer's
# entry-scoped check is silent, so the kernel refuses the definition itself.
kind: Assert.Manifest
metadata:
  name: templateTargets
source: ./__fixtures__/check-run-agreement/template-targets/lib/telo.yaml
expect:
  errors:
    - code: TEMPLATE_TARGETS_WITH_RUN
      message: "'targets:' and 'run:' both say what running this kind does"
    - code: TEMPLATE_TARGET_UNKNOWN
      message: "'targets[0]: !ref frist' names no entry in 'resources:'"
---
kind: Assert.Manifest
metadata:
  name: templateTargetsAtRuntime
source: ./__fixtures__/check-run-agreement/template-targets/telo.yaml
expect:
  runFails: "ERR_TEMPLATE_TARGETS_WITH_RUN"
---
# `targets:` on an invocable kind: nothing runs it, so nothing would start them.
kind: Assert.Manifest
metadata:
  name: templateTargetsCapability
source: ./__fixtures__/check-run-agreement/template-targets-capability/lib/telo.yaml
expect:
  errors:
    - code: TEMPLATE_TARGETS_CAPABILITY
      message: "only valid on a 'Telo.Service' or 'Telo.Runnable' definition"
---
kind: Assert.Manifest
metadata:
  name: templateEntrySchema
source: ./__fixtures__/check-run-agreement/template-entry-schema/lib/telo.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "the Run.Sequence entry 'body': / is missing required property 'steps'"
---
kind: Assert.Manifest
metadata:
  name: templateDuplicateEntry
source: ./__fixtures__/check-run-agreement/template-duplicate-entry/lib/telo.yaml
expect:
  errors:
    - code: DUPLICATE_RESOURCE_NAME
      message: "two 'resources:' entries are named 'body'"
---
kind: Assert.Manifest
metadata:
  name: templateDuplicateEntryAtRuntime
source: ./__fixtures__/check-run-agreement/template-duplicate-entry/telo.yaml
expect:
  runFails: "ERR_DUPLICATE_RESOURCE"
---
kind: Assert.Manifest
metadata:
  name: templateEntrySchemaAtRuntime
source: ./__fixtures__/check-run-agreement/template-entry-schema/telo.yaml
expect:
  runFails: "ERR_RESOURCE_SCHEMA_VALIDATION_FAILED"
---
kind: Assert.Manifest
metadata:
  name: templateTargetsCapabilityAtRuntime
source: ./__fixtures__/check-run-agreement/template-targets-capability/telo.yaml
expect:
  runFails: "ERR_TEMPLATE_TARGETS_CAPABILITY"
---
# A library's export list, resolved where it is written rather than in whichever
# consumer first tries to use it.
kind: Assert.Manifest
metadata:
  name: badExports
source: ./__fixtures__/check-run-agreement/bad-exports/lib/telo.yaml
expect:
  errors:
    - code: EXPORT_KIND_UNKNOWN
      message: "names no Telo.Definition or Telo.Abstract of this library"
    - code: EXPORT_KIND_UNKNOWN
      message: "an imported kind"
      fix: "Http.Client"
    - code: EXPORT_RESOURCE_UNKNOWN
      message: "names no resource declared in this library"
---
# A template body whose kinds are written through the DEFINING library's alias:
# the consumer declares no `Http`, so the children resolve only if injection is
# scoped to the module that declared them. Checks clean and runs clean.
kind: Assert.Manifest
metadata:
  name: childAliasScope
source: ./__fixtures__/check-run-agreement/child-alias-scope/telo.yaml
expect:
  runs: true
---
# One name registered twice, which the kernel has always refused and the
# analyzer modelled a narrower namespace than: an import alias and a kind
# definition were both excluded from the duplicate check, the alias on the
# stated grounds that it "lives in a separate namespace from resources".
#
# The reported shape — an application named after one of its own imports.
kind: Assert.Manifest
metadata:
  name: moduleNameAlias
source: ./__fixtures__/check-run-agreement/module-name-alias.yaml
expect:
  errors:
    - code: DUPLICATE_RESOURCE_NAME
      message: "import alias 'Scheduler' collides with this module's own name"
---
# A kind definition and an instance sharing a name, reported at the library
# that declares both.
kind: Assert.Manifest
metadata:
  name: duplicateName
source: ./__fixtures__/check-run-agreement/duplicate-name/lib/telo.yaml
expect:
  errors:
    - code: DUPLICATE_RESOURCE_NAME
      message: "collides with resource Telo.Definition/Job"
---
# The same library from a CONSUMER, whose entry-scoped analysis does not reach
# a dependency's internals — so the kernel's own guard is what refuses it, and
# asserting its code is what pins the two halves together.
kind: Assert.Manifest
metadata:
  name: duplicateNameAtRuntime
source: ./__fixtures__/check-run-agreement/duplicate-name/telo.yaml
expect:
  runFails: "ERR_DUPLICATE_RESOURCE"
---
# A module naming its own kinds by its own name — the canonical `<module>.<Kind>`
# every diagnostic prints, which the analyzer resolved and the kernel refused.
# Asserted BOTH ways: clean check and a clean run, since the fix is that the
# spelling works rather than that it is reported.
kind: Assert.Manifest
metadata:
  name: ownNamePrefix
source: ./__fixtures__/check-run-agreement/own-name-prefix.yaml
expect:
  runs: true
---
# A template body reaching outward to a resource of its declaring module. The
# reference slot resolved and the step dispatch died at boot on the same name;
# both sites are in this fixture, so repairing one cannot regress the other.
kind: Assert.Manifest
metadata:
  name: bodyOutwardRef
source: ./__fixtures__/check-run-agreement/body-outward-ref.yaml
expect:
  runs: true
---
# The signpost, not a new rule: a kind that extends without `base:` keeps its
# parent's required fields on its own surface, and "missing required property"
# alone sent an author down a three-step dead end.
kind: Assert.Manifest
metadata:
  name: inheritedRequiredHint
source: ./__fixtures__/check-run-agreement/inherited-required/telo.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "extends without a 'base:' mapping"
---
# Inline declarations nested INSIDE a step's inline target — a stream handler, a
# command host — and the same inside a `with:`-scoped sequence. Each checked clean
# and failed at run: the composer registered its step's own target at init(),
# and nothing ever registered what that target declared inline.
kind: Assert.Manifest
metadata:
  name: inlineStepNestedInline
source: ./__fixtures__/check-run-agreement/inline-step-nested-inline.yaml
expect:
  runs: true
---
# An `inherit` kind written inline in a step has an exact union once its
# declaration can be found by name, so a route names the code its handler
# documents without a catch-all. `errors: []` is the assertion: a non-empty list
# would still pass on a manifest that also reported the union unbounded.
kind: Assert.Manifest
metadata:
  name: inlineStepExactUnion
source: ./__fixtures__/check-run-agreement/inline-step-exact-union.yaml
expect:
  errors: []
---
# The shape that stays unsupported: an inline declaration referencing a name the
# `with:` beside it declares. It is created where its sequence is, outside that
# scope, so the name never reaches it — reported at the library that writes it…
kind: Assert.Manifest
metadata:
  name: scopedNameOutOfReach
source: ./__fixtures__/check-run-agreement/scoped-name-out-of-reach/lib/telo.yaml
expect:
  errors:
    - code: SCOPED_NAME_OUT_OF_REACH
      message: "'scopedValue' is declared in 'with:'"
---
# …and, from a consumer whose entry-scoped check is silent about a dependency's
# internals, refused by the kernel.
kind: Assert.Manifest
metadata:
  name: scopedNameOutOfReachAtRuntime
source: ./__fixtures__/check-run-agreement/scoped-name-out-of-reach/telo.yaml
expect:
  runFails: "scopedValue"
---
# A CLEAN library whose exported sequence has inline step targets naming the
# library's own resources. What extraction pulls out of an export is the
# library's code, so a consumer checks and boots exactly as before — the
# out-of-reach consumer above expects a failure and could not catch this.
kind: Assert.Manifest
metadata:
  name: forwardedInlineStep
source: ./__fixtures__/check-run-agreement/forwarded-inline-step/telo.yaml
expect:
  errors: []
  runs: true
---
# An inline entry in a sequence's `targets:` is created in the scope that runs it.
kind: Assert.Manifest
metadata:
  name: inlineSequenceTarget
source: ./__fixtures__/check-run-agreement/inline-sequence-target.yaml
expect:
  runs: true
---
# A consumer's CEL `resources` holds its own resources and its import aliases.
# A name extraction generated inside a library's export is the library's code
# and reachable under no name at all, and an export is read as
# `resources.<Alias>.<name>` — so both reads are unknown fields where written…
kind: Assert.Manifest
metadata:
  name: readsForwardedNames
source: ./__fixtures__/check-run-agreement/forwarded-inline-step/reader/telo.yaml
expect:
  errors:
    - code: CEL_UNKNOWN_FIELD
      message: "'resources.SequenceProbeSteps0Command' is not defined"
    - code: CEL_UNKNOWN_FIELD
      message: "'resources.probe' is not defined"
---
# …and a key the kernel does not have, from a consumer whose entry-scoped check is
# silent about the reader's internals.
kind: Assert.Manifest
metadata:
  name: readsGeneratedNameAtRuntime
source: ./__fixtures__/check-run-agreement/forwarded-inline-step/reads-generated-name.yaml
expect:
  runFails: "SequenceProbeSteps0Command"
---
# A staged file with no pin, which a kernel will not read because nothing can
# verify it — reported where the block is written, with the publish-time rules
# beside it (a build with no recorded inputs, a native path running through
# another)…
kind: Assert.Manifest
metadata:
  name: unpinnedStagedFile
source: ./__fixtures__/check-run-agreement/staged-native/lib/unpinned.yaml
expect:
  errors:
    - code: SOURCE_ENTRY_UNPINNED
      message: "carries no pin"
    - code: SOURCE_BUILD_UNPINNED
      message: "records no build inputs"
    - code: NATIVE_PATH_NESTED
      message: "runs through 'native/linux-amd64/greeting.txt' as a directory"
---
# …and refused by the kernel when a consumer reads it.
kind: Assert.Manifest
metadata:
  name: unpinnedStagedFileAtRuntime
source: ./__fixtures__/check-run-agreement/staged-native/unpinned-app.yaml
expect:
  runFails: "carries no pin to verify it against"
---
# A sources: block that does not read, reported rule by rule…
kind: Assert.Manifest
metadata:
  name: unreadableSources
source: ./__fixtures__/check-run-agreement/staged-native/lib/unreadable.yaml
expect:
  errors:
    - code: SOURCE_URL_INSECURE
      message: "fetched over http"
    - code: SOURCE_LINK_CYCLE
      message: "never reaches a file"
    - code: SOURCE_ENTRY_NESTED
      message: "cannot be both a file and a directory"
---
# …and a kernel reads no native file of the module, since the unreadable block
# may be the one staging it.
kind: Assert.Manifest
metadata:
  name: unreadableSourcesAtRuntime
source: ./__fixtures__/check-run-agreement/staged-native/unreadable-app.yaml
expect:
  runFails: "sources: block cannot be read"
---
# The repaired twin checks clean…
kind: Assert.Manifest
metadata:
  name: pinnedStagedFile
source: ./__fixtures__/check-run-agreement/staged-native/lib/pinned.yaml
expect:
  errors: []
---
# …and runs: the staged file matches its pin, so the kernel reads it.
kind: Assert.Manifest
metadata:
  name: pinnedStagedFileRuns
source: ./__fixtures__/check-run-agreement/staged-native/pinned-app.yaml
expect:
  runs: true
---
# A staged asset with no pin is refused by the kernel when the library's
# controller resolves it; `telo check` reports the library's block as it does a
# native file's (unpinnedStagedFile).
kind: Assert.Manifest
metadata:
  name: unpinnedStagedAssetAtRuntime
source: ./__fixtures__/check-run-agreement/staged-asset/unpinned-app.yaml
expect:
  runFails: "carries no pin to verify it against"
---
# A pinned staged asset runs, read from the library that declares the kind.
kind: Assert.Manifest
metadata:
  name: pinnedStagedAssetRuns
source: ./__fixtures__/check-run-agreement/staged-asset/pinned-app.yaml
expect:
  runs: true
---
# Resources that depend on each other in a loop, which no boot order can
# construct — reported where the loop is written, in the kernel's wording…
kind: Assert.Manifest
metadata:
  name: dependencyCycle
source: ./__fixtures__/check-run-agreement/dependency-cycle/lib/telo.yaml
expect:
  errors:
    - code: DEPENDENCY_CYCLE
      message: "Circular dependency detected:\n  Self.Link \"first\"\n    → Self.Link \"second\"\n    → Self.Link \"first\""
---
# …and refused by the kernel from a consumer whose entry-scoped check is silent.
kind: Assert.Manifest
metadata:
  name: dependencyCycleAtRuntime
source: ./__fixtures__/check-run-agreement/dependency-cycle/telo.yaml
expect:
  runFails: "ERR_CIRCULAR_DEPENDENCY"
---
# A CEL call through an import alias to an exported resource that is not a
# function. Reported where the expression is written…
kind: Assert.Manifest
metadata:
  name: moduleCallNotCallable
source: ./__fixtures__/check-run-agreement/module-call-unresolved/lib/telo.yaml
expect:
  errors:
    - code: FUNCTION_NOT_CALLABLE
      message: "calls 'Console.writeLine', which names the Console.WriteLine resource 'writeLine'"
---
# …and refused by the kernel when it binds the calls of the resource making it,
# from a consumer whose entry-scoped check is silent. Without the static half
# this pair is the shape the suite exists for: a clean `telo check` and a
# manifest that cannot run.
kind: Assert.Manifest
metadata:
  name: moduleCallNotCallableAtRuntime
source: ./__fixtures__/check-run-agreement/module-call-unresolved/telo.yaml
expect:
  runFails: "CEL calls 'Console.writeLine', which names the Console.WriteLine resource 'writeLine'"
---
# A call to a function the calling module does not declare…
kind: Assert.Manifest
metadata:
  name: moduleCallMissing
source: ./__fixtures__/check-run-agreement/module-call-missing/lib/telo.yaml
expect:
  errors:
    - code: FUNCTION_UNRESOLVED
      message: "calls 'Self.missing', which names no function this module can reach"
---
# …refused when the resource making it is created, before any step runs.
kind: Assert.Manifest
metadata:
  name: moduleCallMissingAtRuntime
source: ./__fixtures__/check-run-agreement/module-call-missing/telo.yaml
expect:
  runFails: "this module declares no resource named 'missing'"
---
# A call to a function the imported library declares and keeps private…
kind: Assert.Manifest
metadata:
  name: moduleCallNotExported
source: ./__fixtures__/check-run-agreement/module-call-not-exported/lib/telo.yaml
expect:
  errors:
    - code: FUNCTION_NOT_EXPORTED
      message: "does not list 'hidden' in its 'exports.resources'"
---
# …refused by the kernel through the import's export gate.
kind: Assert.Manifest
metadata:
  name: moduleCallNotExportedAtRuntime
source: ./__fixtures__/check-run-agreement/module-call-not-exported/telo.yaml
expect:
  runFails: "does not list 'hidden' in its 'exports.resources'"
---
# A call to a function an import RE-EXPORTS reaches it through the export table,
# as `!ref Outer.twice` does — checked clean where the call is written…
kind: Assert.Manifest
metadata:
  name: moduleCallReExport
source: ./__fixtures__/check-run-agreement/module-call-re-export/lib/telo.yaml
expect: {}
---
# …and run by the kernel, from a consumer.
kind: Assert.Manifest
metadata:
  name: moduleCallReExportRuns
source: ./__fixtures__/check-run-agreement/module-call-re-export/telo.yaml
expect:
  runs: true
---
# A CEL function held through a slot typed by a callable abstract it does not
# extend, whose signature stands in for the abstract's — accepted where it is
# wired…
kind: Assert.Manifest
metadata:
  name: callableSlotStructural
source: ./__fixtures__/check-run-agreement/callable-slot/lib/telo.yaml
expect: {}
---
# …and called by the kernel with the abstract's parameter names.
kind: Assert.Manifest
metadata:
  name: callableSlotStructuralRuns
source: ./__fixtures__/check-run-agreement/callable-slot/telo.yaml
expect:
  runs: true
---
# Functions that cannot stand in for their slot's abstract: one names a parameter
# differently from the abstract its holder calls it through, one reaches `now()`
# where the abstract requires determinism, one requires an argument the abstract
# leaves optional. Refused where they are wired…
kind: Assert.Manifest
metadata:
  name: callableSlotMismatch
source: ./__fixtures__/check-run-agreement/callable-slot-mismatch/lib/telo.yaml
expect:
  errors:
    - code: REFERENCE_KIND_MISMATCH
      message: "parameter 'text' is named 'message' by 'CallableSlotLib.Signer'"
    - code: REFERENCE_KIND_MISMATCH
      message: "'CallableSlotLib.StableSigner' requires a deterministic function, and 'clocked' is not (clocked → now())"
    - code: REFERENCE_KIND_MISMATCH
      message: "`params` requires 3 argument(s) while 'CallableSlotLib.NoncedSigner' requires only 2"
---
# …and the renamed parameter fails the first call from a consumer, whose
# entry-scoped check is silent: the function's call is bound to its signature,
# so the argument it never received is refused before its body runs.
# Determinism has no runtime twin: a function that reads the clock runs, and only
# its verdicts differ.
kind: Assert.Manifest
metadata:
  name: callableSlotMismatchAtRuntime
source: ./__fixtures__/check-run-agreement/callable-slot-mismatch/telo.yaml
expect:
  runFails: "Function 'Telo.Function/renamed': the arguments do not satisfy its declared params: Invalid value passed: {\"key\":\"k\",\"message\":\"m\"}. Error: / is missing required property 'text'"
---
kind: Assert.Manifest
metadata:
  name: callableSlotOptionalRequiredAtRuntime
source: ./__fixtures__/check-run-agreement/callable-slot-mismatch/nonce.yaml
expect:
  runFails: "Function 'Telo.Function/nonceRequired': the arguments do not satisfy its declared params: Invalid value passed: {\"key\":\"k\",\"message\":\"m\"}. Error: / is missing required property 'nonce'"
---
# Native callable kinds inheriting a native controller, by `base:` and by merge —
# clean where they are written…
kind: Assert.Manifest
metadata:
  name: callableNativeExtends
source: ./__fixtures__/check-run-agreement/callable-native-extends/telo.yaml
expect: {}
---
# …and called by the kernel through the ancestor's controller.
kind: Assert.Manifest
metadata:
  name: callableNativeExtendsRuns
source: ./__fixtures__/check-run-agreement/callable-native-extends/telo.yaml
expect:
  runs: true
---
# A callable kind whose capability is two libraries away, each hop written
# through an alias only its own file declares — clean where it is written…
kind: Assert.Manifest
metadata:
  name: callableCrossModuleChain
source: ./__fixtures__/check-run-agreement/callable-cross-module/hmac/telo.yaml
expect: {}
---
# …and registered and called by the kernel, which resolves each hop in the
# library that declared it.
kind: Assert.Manifest
metadata:
  name: callableCrossModuleChainRuns
source: ./__fixtures__/check-run-agreement/callable-cross-module/telo.yaml
expect:
  runs: true
---
# Functions whose bodies call each other. A call is bound when its caller is
# created, so recursion is a dependency cycle — reported where it is written…
kind: Assert.Manifest
metadata:
  name: moduleCallCycle
source: ./__fixtures__/check-run-agreement/module-call-cycle/lib/telo.yaml
expect:
  errors:
    - code: DEPENDENCY_CYCLE
      message: "Circular dependency detected:\n  Telo.Function \"ping\"\n    → Telo.Function \"pong\"\n    → Telo.Function \"ping\""
---
# …and refused by the kernel before either function is created.
kind: Assert.Manifest
metadata:
  name: moduleCallCycleAtRuntime
source: ./__fixtures__/check-run-agreement/module-call-cycle/telo.yaml
expect:
  runFails: "ERR_CIRCULAR_DEPENDENCY"
---
# A module call in a type rule's condition, which is evaluated against the value
# alone wherever the shape is checked — no module's functions are bound there…
kind: Assert.Manifest
metadata:
  name: moduleCallUnboundRule
source: ./__fixtures__/check-run-agreement/module-call-unbound/lib/telo.yaml
expect:
  errors:
    - code: FUNCTION_CALL_UNBOUND
      message: "calls 'Self.positive', but a type rule's condition is evaluated against the value alone"
---
# …so the first value checked against the shape fails, from a consumer whose
# entry-scoped check is silent.
kind: Assert.Manifest
metadata:
  name: moduleCallUnboundRuleAtRuntime
source: ./__fixtures__/check-run-agreement/module-call-unbound/telo.yaml
expect:
  runFails: "Type \"telo:UnboundRuleLib/Money\" rule evaluation failed: unbound function 'Self.positive'"
---
# A module call in the Application's `logging:` block, resolved while the
# application loads, before any function exists. A `logging:` block belongs to
# the entry Application alone, so no consumer can hide it from the entry-scoped
# check: the run is refused by the kernel's load-time analysis before the block is
# expanded, and the kernel's own `unbound function` guard stands behind that.
kind: Assert.Manifest
metadata:
  name: moduleCallUnboundLogging
source: ./__fixtures__/check-run-agreement/module-call-unbound/logging.yaml
expect:
  errors:
    - code: FUNCTION_CALL_UNBOUND
      message: "calls 'Self.level', but the Application's logging: block is resolved when the application is loaded"
  runFails: "Manifest validation failed"
---
# Function RESOURCES declaring what an instance cannot: a signature no call can
# be bound against, and a determinism claim. Reported where they are written…
kind: Assert.Manifest
metadata:
  name: callableInstances
source: ./__fixtures__/check-run-agreement/callable-instances/lib/telo.yaml
expect:
  errors:
    - code: FUNCTION_OPTIONAL_NOT_TRAILING
      message: "Parameter 'head' is required but follows the optional parameter 'tail'"
    - code: FUNCTION_TYPE_NAME_FORM
      message: "names the shape 'Money' as a bare string"
    - code: CALLABLE_DEFINITION_INVALID
      message: "declares `deterministic` on an instance of a function kind"
    - code: SCHEMA_VIOLATION
      message: "'deterministic' is not allowed"
    - code: FUNCTION_NAME_RESERVED
      message: "Telo.Function/filter: a function cannot be named 'filter'"
---
# …and refused by the kernel as it creates each one, from a consumer whose
# entry-scoped check is silent.
kind: Assert.Manifest
metadata:
  name: callableInstanceSignatureAtRuntime
source: ./__fixtures__/check-run-agreement/callable-instances/telo.yaml
expect:
  runFails: "FUNCTION_OPTIONAL_NOT_TRAILING at params[1]"
---
kind: Assert.Manifest
metadata:
  name: callableInstanceTypeNameAtRuntime
source: ./__fixtures__/check-run-agreement/callable-instances/telo.yaml
expect:
  runFails: "FUNCTION_TYPE_NAME_FORM at params[0].schema"
---
kind: Assert.Manifest
metadata:
  name: callableInstanceClaimAtRuntime
source: ./__fixtures__/check-run-agreement/callable-instances/telo.yaml
expect:
  runFails: "CALLABLE_DEFINITION_INVALID at deterministic"
---
kind: Assert.Manifest
metadata:
  name: callableInstanceMacroNameAtRuntime
source: ./__fixtures__/check-run-agreement/callable-instances/telo.yaml
expect:
  runFails: "FUNCTION_NAME_RESERVED at metadata.name: Telo.Function/filter: a function cannot be named 'filter'"
---
kind: Assert.Manifest
metadata:
  name: functionDeterministicAtRuntime
source: ./__fixtures__/check-run-agreement/callable-instances/telo.yaml
expect:
  runFails: "Resource does not match schema for kind Telo.Function"
---
# Callable kinds carrying what a function cannot honour, one clause each —
# reported where the kinds are written…
kind: Assert.Manifest
metadata:
  name: callableKinds
source: ./__fixtures__/check-run-agreement/callable-kinds/lib/telo.yaml
expect:
  errors:
    - code: CALLABLE_DEFINITION_INVALID
      message: "holds 'Telo.LogSink' at 'schema.properties.sink'"
    - code: CALLABLE_DEFINITION_INVALID
      message: "declares `x-telo-eval: runtime`"
    - code: CALLABLE_DEFINITION_INVALID
      message: "declares `status:`"
    - code: CALLABLE_DEFINITION_INVALID
      message: "declares `x-telo-provides-zone`"
    - code: CALLABLE_DEFINITION_INVALID
      message: "declares `x-telo-scope`"
    - code: CALLABLE_DEFINITION_INVALID
      message: "declares a step body"
    - code: CALLABLE_DEFINITION_INVALID
      message: "declares a template body (`resources:`)"
    - code: CALLABLE_DEFINITION_INVALID
      message: "extends 'Telo.Function', which cannot be specialized"
    - code: CALLABLE_DEFINITION_INVALID
      message: "`deterministic: \"yes\"` is not a boolean"
    - code: CALLABLE_DEFINITION_INVALID
      message: "Child: declares `deterministic` but supplies no implementation of its own"
    - code: CALLABLE_DEFINITION_INVALID
      message: "claims `deterministic: true` while holding a function at 'schema.properties.signer'"
    - code: CALLABLE_DEFINITION_INVALID
      message: "declares `returns:` but inherits the controller of 'CallableKindsLib.Parent'"
    - code: CALLABLE_DEFINITION_INVALID
      message: "NotCallable: declares a signature"
    - code: CALLABLE_DEFINITION_INVALID
      message: "NotCallable: declares `deterministic` but its capability resolves to 'Telo.Invocable'"
    - code: X_TELO_REF_CALLABLE_UNTYPED
      message: "x-telo-ref at 'schema.properties.anyFn' constrains to bare 'Telo.Callable'"
    - code: X_TELO_REF_CALLABLE_UNTYPED
      message: "x-telo-ref at 'schema.properties.fn' constrains to bare 'Telo.Callable'"
    - code: X_TELO_REF_CALLABLE_UNTYPED
      message: "x-telo-ref at 'schema.properties.function' constrains to 'Telo.Function', a function kind that declares no signature of its own"
    - code: CONTRACT_TYPE_NOT_FOUND
      message: "'params[0].schema' names the shape 'NoSuchShape' with `!ref`"
    - code: CONTRACT_TYPE_NOT_FOUND
      message: "'returns.schema.items' names the shape 'AlsoMissing' with `!ref`"
    - code: FUNCTION_OPTIONAL_NOT_TRAILING
      message: "Parameter 'amount' is required but follows the optional parameter 'tail'"
    - code: FUNCTION_TYPE_NAME_FORM
      message: "names the shape 'Money' as a bare string"
      fix: "Money"
---
# …and refused by the kernel as it registers them, from a consumer whose
