kind: Telo.Application
metadata:
  name: DurableJournalPostgresRetentionTest
  version: 1.0.0
  description: |
    A finished run is deleted with all of its entries once `retainFinished` has passed,
    and the delete is one statement against both tables: after the resumer's sweep the
    runs table and the entries table hold no row for it, while a parked run of a workflow
    that keeps finished runs for a millisecond is untouched.

    NEEDS A CONTAINER ENGINE: it starts its own PostgreSQL. Kept out of `tests/` proper for exactly that reason.
imports:
  Pg:
    source: ../../../postgres/tests/__fixtures__/container
    variables: { engineUrl: !cel "variables.engineUrl" }
    secrets: { engineToken: !cel "secrets.engineToken" }
  Durable: ../../../durable
  Local: ../../../durable-local
  Journal: ../../
  Postgres: ../../../postgres
  Sql: ../../../sql
  Run: ../../../run
  Timer: ../../../timer
  Assert: ../../../assert
variables:
  engineUrl: { env: TELO_HOST_CONTAINER_ENGINE_URL, type: string, default: "unix:///var/run/docker.sock" }
secrets:
  engineToken: { env: TELO_HOST_CONTAINER_ENGINE_TOKEN, type: string, default: "" }
targets:
  - !ref test
---
kind: Postgres.Connection
metadata: { name: db }
access: !ref Pg.databaseAccess
---
kind: Sql.Query
metadata: { name: query }
connection: !ref db
---
# Its OWN tables: this test runs a resumer, which would continue another test's runs.
kind: Journal.Journal
metadata: { name: journal }
connection: !ref db
table: !cel "'telo_durable_retention_test'"
---
kind: Run.Value
metadata: { name: work }
value: { done: true }
---
kind: Durable.Await
metadata: { name: approval }
token: !cel "'pgretain:' + inputs.ticket"
timeout: 30d
outputType: { kind: Telo.JsonSchema, schema: { type: object, additionalProperties: true } }
---
kind: Local.Workflow
metadata: { name: quick }
journal: !ref journal
retainFinished: 1s
runId: !cel "'pgquick:' + inputs.ticket"
inputs:
  ticket: !cel "inputs.ticket"
steps:
  - { name: did, invoke: !ref work }
---
kind: Local.Workflow
metadata: { name: waiting }
journal: !ref journal
retainFinished: 1ms
runId: !cel "'pgwaiting:' + inputs.ticket"
inputs:
  ticket: !cel "inputs.ticket"
steps:
  - name: hold
    invoke: !ref approval
    inputs:
      ticket: !cel "inputs.ticket"
---
kind: Local.Status
metadata: { name: status }
journal: !ref journal
---
kind: Local.Result
metadata: { name: outcome }
journal: !ref journal
wait: 20s
---
kind: Run.Sequence
metadata: { name: test }
with:
  # Only the quick workflow's resumer: it lists and purges runs recorded under its own
  # workflow's name, so the waiting run is not its business, and a second resumer would
  # execute this workflow's due runs as the other's.
  - kind: Local.Resumer
    metadata: { name: resumer }
    workflow: !ref quick
    interval: 100ms
targets:
  - !ref resumer
steps:
  - name: ticket
    value: !cel "'t' + string(nowMillis())"
  - name: startQuick
    invoke: !ref quick
    inputs:
      ticket: !cel "steps.ticket.result"
  - name: startWaiting
    invoke: !ref waiting
    inputs:
      ticket: !cel "steps.ticket.result"
  - name: completed
    invoke: !ref outcome
    inputs:
      run: !cel "steps.startQuick.result.runId"
  - name: assertCompleted
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.completed.result.status"
      expected: completed

  - name: reading
    invoke: !ref status
    inputs:
      run: !cel "steps.startQuick.result.runId"
  - name: untilPurged
    while: !cel "steps.reading.result.status != 'unknown'"
    maxIterations: 100
    do:
      - { name: pause, invoke: { kind: Timer.Delay }, inputs: { duration: 200ms } }
      - name: reading
        invoke: !ref status
        inputs:
          run: !cel "steps.startQuick.result.runId"
  - name: runRows
    invoke: !ref query
    inputs:
      sql: !sql "SELECT count(*) AS n FROM telo_durable_retention_test_runs WHERE run = ${{ steps.startQuick.result.runId }}"
  - name: entryRows
    invoke: !ref query
    inputs:
      sql: !sql "SELECT count(*) AS n FROM telo_durable_retention_test_entries WHERE run = ${{ steps.startQuick.result.runId }}"
  - name: waitingStatus
    invoke: !ref status
    inputs:
      run: !cel "steps.startWaiting.result.runId"
  - name: assertPurged
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.reading.result.status"
        runRows: !cel "int(steps.runRows.result.rows[0].n)"
        entryRows: !cel "int(steps.entryRows.result.rows[0].n)"
        waiting: !cel "steps.waitingStatus.result.status"
      expected: { status: unknown, runRows: 0, entryRows: 0, waiting: parked }
