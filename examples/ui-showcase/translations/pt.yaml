  # Forms.
  - { text: Every control from the model, translation: Todos os controles do modelo }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "Sem campos escritos, o formulário desenha um controle por propriedade, escolhido a partir do seu esquema: uma caixa de texto, uma lista para uma enumeração, caixas numéricas, uma data, uma data e hora, uma hora, uma caixa de várias linhas para um documento, uma caixa de seleção, opções lado a lado para uma lista de uma enumeração e tags digitadas para uma lista de palavras. Uma descrição é uma dica abaixo do seu campo, e um padrão, o valor inicial." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "Cada campo é verificado em relação ao modelo assim que é tocado: o tamanho do título, o número de pessoas, o orçamento em passos de 50, a grafia das palavras-chave. O servidor recusa um título que outra solicitação já tem, e a resposta dele vai para o título. O que é digitado fica guardado no endereço e neste navegador — tudo menos o código de acesso, que o modelo marca como somente escrita." }
  - { text: Each control chosen by hand, translation: Cada controle escolhido à mão }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "A mesma solicitação com um controle escrito para cada campo: o título com seu controle derivado, o tipo como opções lado a lado, os canais como uma lista de múltipla escolha, o número de pessoas em um controle deslizante, urgente como um interruptor e as palavras-chave como tags. O que é digitado fica guardado só para esta aba." }
  - { text: Requests received, translation: Solicitações recebidas }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "As solicitações mais recentes enviadas pelos dois formulários, lidas de novo depois de cada salvamento." }
  - { text: "Choices, pickers and dates", translation: "Escolhas, seletores e datas" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "Reserva de pessoas para um projeto. O projeto é escolhido em uma lista lida da coleção de projetos, cada opção com seu código como dica. O líder é escolhido em uma caixa de diálogo, com busca por nome, entre os membros ativos da função escolhida acima dele; escolher outra função lê as opções de novo e mantém o líder só se ele ainda se encaixar. Os revisores são escolhidos em uma gaveta, vários de uma vez, e o patrocinador em um balão; o patrocinador começa com um e-mail padrão, exibido como o nome da pessoa por meio de uma única consulta. Os ajudantes são oferecidos lado a lado, três por vez, com Mais para o restante. Uma pessoa escolhida tem um link para o seu e-mail." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "O período são duas datas com predefinições, com semanas começando no domingo, começando no próximo mês e com aviso acima de três meses. O servidor recusa um período que termina antes de começar ou passa de um ano, e a resposta dele vai para o período. As pessoas em torno do líder são exibidas assim que um líder é escolhido, e o endereço do local só para trabalho presencial." }
  - { text: The project, translation: O projeto }
  - { text: "Which project, and who leads the work.", translation: "Qual projeto e quem lidera o trabalho." }
  - { text: Around the lead, translation: Em torno do líder }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "Quem revisa o trabalho, quem o patrocina e quem ajuda." }
  - { text: When and where, translation: Quando e onde }
  - { text: Tomorrow, translation: Amanhã }
  - { text: Next week, translation: Próxima semana }
  - { text: This month, translation: Este mês }
  - { text: Next month, translation: Próximo mês }
  - { text: Next quarter, translation: Próximo trimestre }
  - { text: Next year, translation: Próximo ano }
  - { text: Bookings, translation: Reservas }
  - { text: "The latest bookings, read again after every save.", translation: "As reservas mais recentes, lidas de novo depois de cada salvamento." }

