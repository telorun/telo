# A trace sink's `when` that produces a string, not a boolean. The value is `dyn`, so only the runtime can refuse it.
kind: Telo.Application
metadata:
  name: SinkWhenTracingDyn
  version: 1.0.0
variables:
  settings:
    env: SETTINGS
    type: object
    default: { flag: "false" }
tracing:
  sinks:
    - sink: { kind: Telo.LogTraceSink }
      when: !cel "variables.settings.flag"
