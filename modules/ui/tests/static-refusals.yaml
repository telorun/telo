# Ten bars pin a filter under every placement; three are told it says nothing.
kind: Run.Sequence
metadata:
  name: pinned
steps:
  - name: check
    invoke: { kind: Probe.Diagnostics, source: ./__fixtures__/pinned/telo.yaml }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.check.result.reported.map(r, r.substring(0, r.indexOf(' pins a field')))"
      expected:
        - "RESOURCE_RULE_VIOLATED Ui.Filters/omitted:"
        - "REFERRER_RULE_VIOLATED Ui.Filters/above at 'policy.placement': required by Ui.AbovePlacement —"
        - "REFERRER_RULE_VIOLATED Ui.Filters/aside at 'policy.placement': required by Ui.AsidePlacement —"
---
# `eachItsOwn`, two row actions over different models, reports nothing.
kind: Assert.Manifest
metadata:
  name: actions
source: ./__fixtures__/invalid/actions/telo.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "Ui.Action/strayKey: / must NOT have additional properties ('method' is not allowed)"
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.Action/rowTypo: !cel: 'row.nmae' is not defined (available: name)"
    - code: CEL_TYPE_ERROR
      message: "Ui.Action/rowsNotAList: CEL at 'lists[0].rows' reads 'result.kind', whose declared shape does not fit what the field expects: /: type mismatch — source is 'string', target expects 'array'"
    - code: ACCESSOR_NOT_PLAIN_CHAIN
      message: "Ui.Action/rowsComputed: 'lists[0].rows: !cel \"size(result.files)\"' is not a plain chain"
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.Action/noAnswerModel: !cel: 'result.files' is not defined"
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.Table/rowMemberUnknown: !cel: 'row.missing' is not defined (available: id, name)"
    - code: CEL_TYPE_ERROR
      message: "Ui.Table/chainMistyped: CEL at 'rowActions[0].inputs.id' reads 'row.name', whose declared shape does not fit what archive's declared inputType expects: /: type mismatch — source is 'string', target expects 'integer'"
    - code: ACCESSOR_NOT_PLAIN_CHAIN
      message: "Ui.Table/inputComputed: 'rowActions[0].inputs.id: !cel \"row.id + 1\"' is not a plain chain"
    - code: SCHEMA_VIOLATION
      message: "Ui.Table/inputsAbsent: /rowActions/0 is missing required property 'inputs'"
    - code: SCHEMA_VIOLATION
      message: "Ui.Table/inputsEmpty: /rowActions/0/inputs must NOT have fewer than 1 properties"
    - code: CONTRACT_INPUTS_MISMATCH
      message: "Ui.Table/inputsEmpty: inputs at 'rowActions[0].inputs' do not satisfy rename's declared inputType: / is missing required property 'name'"
    - code: SCHEMA_VIOLATION
      message: "Ui.Table/confirmFlag: /rowActions/0/confirm must be string"
    - code: SCHEMA_VIOLATION
      message: "Ui.Table/confirmEmpty: /rowActions/0/confirm must NOT have fewer than 1 characters"
