# What `telo check` refuses about declared keys and a verifier's sources, at the
# author's own line, and the same three refusals from the controllers when a
# consumer's entry-scoped check is silent (`runFails:`).
kind: Telo.Application
metadata:
  name: ApiKeyRefusalsTest
  version: 1.0.0
  description: A scope outside a source's vocabulary, a repeated key id and a repeated prefix are refused at check and at start.
imports: { Assert: ../../assert }
targets:
  - !ref scopeUnknown
  - !ref scopeUnknownAtStart
  - !ref idDuplicate
  - !ref idDuplicateAtStart
  - !ref prefixDuplicate
  - !ref prefixDuplicateAtStart
---
kind: Assert.Manifest
metadata: { name: scopeUnknown }
source: ./__fixtures__/scope-unknown/telo.yaml
expect:
  errors:
    - { code: RESOURCE_RULE_VIOLATED, message: "ApiKey.DeclaredKeys/keys at 'keys[0]': grants a scope outside this source's `scopes`." }
---
kind: Assert.Manifest
metadata: { name: scopeUnknownAtStart }
source: ./__fixtures__/scope-unknown-app.yaml
expect:
  errors: []
  runFails: "ApiKey.DeclaredKeys \"keys\": keys[0]: scope \"admin\" is outside the source's 'scopes'. [ERR_API_KEY_SCOPE_UNKNOWN]"
---
kind: Assert.Manifest
metadata: { name: idDuplicate }
source: ./__fixtures__/id-duplicate/telo.yaml
expect:
  errors:
    - { code: RESOURCE_RULE_VIOLATED, message: "ApiKey.DeclaredKeys/keys at 'keys[0]': declares a key id that another entry declares too." }
    - { code: RESOURCE_RULE_VIOLATED, message: "ApiKey.DeclaredKeys/keys at 'keys[1]': declares a key id that another entry declares too." }
---
kind: Assert.Manifest
metadata: { name: idDuplicateAtStart }
source: ./__fixtures__/id-duplicate-app.yaml
expect:
  errors: []
  runFails: "ApiKey.DeclaredKeys \"keys\": keys[1]: the id \"apk_01tRy6czI6jAOLpZvq3hw1\" is declared twice. [ERR_API_KEY_ID_DUPLICATE]"
---
kind: Assert.Manifest
metadata: { name: prefixDuplicate }
source: ./__fixtures__/prefix-duplicate/telo.yaml
expect:
  errors:
    - { code: RESOURCE_RULE_VIOLATED, message: "ApiKey.Verifier/keys at 'sources[1]': has the same prefix as another source, so a key could not be routed to one." }
---
kind: Assert.Manifest
metadata: { name: prefixDuplicateAtStart }
source: ./__fixtures__/prefix-duplicate-app.yaml
expect:
  errors: []
  runFails: "ApiKey.Verifier \"keys\": 'sources[1]' has the prefix \"tk\", which an earlier source already has; a key is routed to its source by prefix. [ERR_API_KEY_PREFIX_DUPLICATE]"
