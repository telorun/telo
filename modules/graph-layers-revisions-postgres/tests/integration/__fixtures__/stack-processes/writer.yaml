# Writes `top` once outside any draft, from its own process: one person named
# after this process.
kind: Telo.Application
metadata:
  name: StackProcessWriter
  version: 1.0.0
include:
  - ./model.yaml
imports:
  Postgres: ../../../../../postgres
  Layers: ../../../..
  Graph: ../../../../../graph
  Run: ../../../../../run
variables:
  dbHost: { env: DB_HOST, type: string, default: localhost }
  dbPort: { env: DB_PORT, type: integer, default: 5432 }
  dbUser: { env: DB_USER, type: string, default: postgres }
  dbPassword: { env: DB_PASSWORD, type: string, default: postgres }
  dbName: { env: DB_NAME, type: string, default: postgres }
  name: { env: ACTOR_NAME, type: string }
targets:
  - !ref work
---
kind: Run.Sequence
metadata: { name: work }
steps:
  - name: write
    invoke: { kind: Graph.CreateNode, store: !ref top, node: !ref person }
    inputs: { key: !cel "variables.name", properties: { name: Written } }
