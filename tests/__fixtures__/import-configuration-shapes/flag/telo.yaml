# A library input typed by a named shape the library declares only where
# `flag` holds.
kind: Telo.Library
metadata: { name: FlagShape }
variables: { flag: { type: boolean }, config: { $ref: "telo://Self/Config" } }
exports: { resources: [config, next] }
--- !if
metadata: { name: Config }
if: !cel "variables.flag"
then: { kind: Telo.JsonSchema, schema: { type: object, required: [n], properties: { n: { type: integer } } } }
---
kind: Telo.Value
metadata: { name: config }
value: !cel "variables.config"
---
kind: Telo.Value
metadata: { name: next }
value: !cel "variables.config.n + 1"
