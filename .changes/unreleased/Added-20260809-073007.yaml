project: ai
kind: Added
body: 'Ai.ImageModel and Ai.Image: turn a prompt into picture bytes, or rework pictures
  you supply, through any image provider. The provider contract is declared in the
  manifest and its method is invoke, so the kernel contract-checks both directions
  at dispatch and a provider in any language has a shape to implement — Ai.Image validates
  nothing by hand. Reference-image work names an intent whose accepted values come
  from the model''s own $defs/Intent, so a mode a backend cannot serve fails telo
  check instead of throwing. Refusals come back as a result (finishReason: content-filter
  with a short or empty list), not an error. Ai.Text and Ai.Agent gain optional unit/total
  fields on usage, filled from totalTokens, so one consumer can total spend across
  text and image calls; the token triple is unchanged and providers need no update.'
