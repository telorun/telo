kind: Telo.Application
metadata:
  name: ImageOverlaySmokeTest
  version: 1.0.0
  description: |
    Smoke test for Image.Overlay — draws a labelled box and an off-canvas box
    (clipped, not rejected) onto a 120×80 Image.Blank canvas and asserts the
    output is a PNG with unchanged dimensions. Further sequences assert that
    a zero-width shape and undecodable bytes raise ERR_INVALID_INPUT, and
    that an `image` that is not bytes is refused with ERR_INPUT_INVALID. A PNG
    cut short after its header is an ERR_INVALID_INPUT decode failure too.
imports:
  Image: ../
  JS: ../../javascript
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testOverlay
  - !ref testZeroWidthShape
  - !ref testUndecodableBytes
  - !ref testNonBytesImage
  - !ref testTruncatedImage
---
kind: Image.Blank
metadata: { name: canvas }
---
kind: Image.Overlay
metadata: { name: draw }
stroke: { color: "#FF3B30", width: 3 }
label: { color: "#FFFFFF", placement: top-left }
---
kind: JS.Script
metadata: { name: checkPngMagic }
code: |
  async function main(input) {
    const img = input.image;
    return {
      isPng:
        img instanceof Uint8Array &&
        img[0] === 0x89 && img[1] === 0x50 && img[2] === 0x4e && img[3] === 0x47,
    };
  }
---
kind: Run.Sequence
metadata: { name: testOverlay }
steps:
  - name: fixture
    inputs: { width: 120, height: 80 }
    invoke: !ref canvas
  - name: draw
    inputs:
      image: !cel "steps.fixture.result.image"
      shapes:
        - { x: 20, y: 20, width: 60, height: 40, label: "firstName (text)" }
        - { x: 100, y: 60, width: 40, height: 40, color: "#0000FF" }
    invoke: !ref draw
  - name: assertDimensions
    inputs:
      width: !cel "steps.draw.result.width"
      height: !cel "steps.draw.result.height"
      mediaType: !cel "steps.draw.result.mediaType"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          width: { const: 120 }
          height: { const: 80 }
          mediaType: { const: image/png }
        required: [ width, height, mediaType ]
  - name: checkPng
    inputs:
      image: !cel "steps.draw.result.image"
    invoke: !ref checkPngMagic
  - name: assertPng
    inputs:
      isPng: !cel "steps.checkPng.result.isPng"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          isPng: { const: true }
        required: [ isPng ]
  - name: drawWebp
    inputs:
      image: !cel "steps.fixture.result.image"
      shapes:
        - { x: 20, y: 20, width: 60, height: 40, label: "firstName (text)" }
      format: webp
    invoke: !ref draw
  - name: assertWebp
    inputs:
      mediaType: !cel "steps.drawWebp.result.mediaType"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          mediaType: { const: image/webp }
        required: [ mediaType ]
---
kind: Run.Sequence
metadata: { name: testZeroWidthShape }
steps:
  - name: fixture
    inputs: { width: 120, height: 80 }
    invoke: !ref canvas
  - name: tryDraw
    try:
      - name: draw
        inputs:
          image: !cel "steps.fixture.result.image"
          shapes:
            # Deliberately invalid, routed through CEL: a literal is rejected
            # by `telo check`; this test is about the RUNTIME boundary.
            - { x: 10, y: 10, width: !cel "0", height: 10 }
        invoke: !ref draw
    catch:
      - name: caught
        inputs:
          code: !cel "error.code"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_INPUT_INVALID }
            required: [ code ]
---
kind: Run.Sequence
metadata: { name: testUndecodableBytes }
steps:
  - name: notAnImage
    invoke:
      kind: JS.Script
      code: |
        async function main() {
          return { image: new Uint8Array([1, 2, 3, 4]) };
        }
  - name: tryDraw
    try:
      - name: draw
        inputs:
          image: !cel "steps.notAnImage.result.image"
          shapes:
            - { x: 0, y: 0, width: 5, height: 5 }
        invoke: !ref draw
    catch:
      - name: caught
        inputs:
          code: !cel "error.code"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_INVALID_INPUT }
            required: [ code ]
---
# A value that is not bytes is refused by the input contract, before the
# controller runs. `dyn(...)` hides its type from `telo check`, which refuses a
# map at a byte slot.
kind: Run.Sequence
metadata: { name: testNonBytesImage }
steps:
  - name: tryNonBytes
    try:
      - name: nonBytes
        inputs:
          image: !cel "dyn({'not': 'bytes'})"
          shapes:
            - { x: 0, y: 0, width: 5, height: 5 }
        invoke: !ref draw
    catch:
      - name: caught
        inputs:
          actual: !cel "error.code"
          expected: ERR_INPUT_INVALID
        invoke: { kind: Assert.Equals }
  - name: refused
    inputs:
      actual: !cel "has(steps.caught)"
      expected: true
    invoke: { kind: Assert.Equals }
---
# A real PNG header with most of its body missing: the decoder is reached and
# rejects it.
kind: Run.Sequence
metadata: { name: testTruncatedImage }
steps:
  - name: tryTruncated
    try:
      - name: truncated
        inputs:
          image: !include-bytes ./__fixtures__/truncated.png
          shapes:
            - { x: 0, y: 0, width: 5, height: 5 }
        invoke: !ref draw
      - name: truncatedAccepted
        throw: { code: NOT_REFUSED, message: the call was expected to fail }
    catch:
      - name: assertTruncated
        inputs:
          actual: !cel "error.code"
          expected: ERR_INVALID_INPUT
        invoke: { kind: Assert.Equals }
