kind: Telo.Library
metadata:
  name: AI
  version: 0.17.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Language and image models over any provider: buffered text, token-by-token
    streaming, prompt-to-picture generation and editing, and a tool-use agent loop
    that calls the model, runs the tools it asks for, and replays their results until
    it settles. Tools wrap ordinary resources, exposed as a static list or discovered
    at runtime.
imports:
  Run: ../run
  Stream: ../stream
exports:
  kinds:
    - Model
    - ModelStream
    - Buffered
    - Text
    - TextStream
    - ToolProvider
    - Tools
    - Agent
    - AgentStream
    - ImageModel
    - Image
  # The entry point a dependent module's controller bundle resolves
  # `@telorun/ai` to, so this module's code is one module scope across every
  # consumer instead of a copy inlined into each of their bundles.
  code:
    - specifier: "@telorun/ai"
      format: js
      path: ./nodejs/ai.mjs
      source: ./nodejs/src/index.ts
---
# Ai.Message — one turn of a conversation.
#
# Declared once and referenced everywhere rather than restated per kind: it was
# copied verbatim into four consumers' inputTypes, which is four places for a
# new role or content type to be added in three of them.
kind: Telo.JsonSchema
metadata:
  name: Message
  description: One conversation turn — a role, its content as text or parts, and the tool-call bookkeeping that links an assistant's request to the result fed back to it.
schema:
  type: object
  additionalProperties: false
  required: [role, content]
  properties:
    role:
      type: string
      enum: [system, user, assistant, tool]
    content:
      description: >-
        The turn's content: a plain string, or parts when it carries anything other
        than text.
      anyOf:
        - type: string
        - type: array
          minItems: 1
          items:
            $ref: "telo://Self/ContentPart"
    toolCalls:
      description: On an assistant turn, the calls the model asked for.
      type: array
      items:
        $ref: "telo://Self/ToolCall"
    toolCallId:
      description: On a tool turn, which requested call this is the result of.
      type: string
---
kind: Telo.JsonSchema
metadata:
  name: ToolCall
  description: One tool invocation a model asked for — its id, the tool's name, and the arguments to call it with.
schema:
  type: object
  additionalProperties: false
  required: [id, name, arguments]
  properties:
    id:
      type: string
      description: The provider's id for this call, echoed back on the tool turn carrying its result.
    name: { type: string }
    arguments:
      description: The call's arguments, as the model produced them.
      type: object
      additionalProperties: true
---
# Ai.ContentPart — what a turn can be made of, in one vocabulary.
#
# MODALITY LIVES HERE, not in kind names. A model returning a picture is an
# image part in an ordinary completion; it is not a different kind of model.
# That is what stops the abstract multiplying per modality as providers add
# audio, video and documents.
#
# A flat shape with a `type` discriminator rather than a union of branches: the
# media parts carry bytes, `data` is deliberately untyped so it accepts both raw
# bytes and the base64 a manifest can author, and a union with an instance
# branch is exactly the shape a reader that does not know the value-type
# vocabulary mis-reads.
kind: Telo.JsonSchema
metadata:
  name: ContentPart
  description: One piece of a conversation turn — text, an image, audio, video, a document, a tool call, reasoning, a citation or a refusal. Media parts carry bytes or a URI plus a media type, so a document is a matter of value rather than of a separate kind.
schema:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type:
      type: string
      enum:
        - text
        - image
        - audio
        - video
        - file
        # Output-only from here down: a model produces these, a caller does not
        # send them.
        - tool-call
        - reasoning
        - citation
        - refusal
    text:
      type: string
      description: The text of a `text`, `reasoning` or `refusal` part.
    data:
      description: >-
        A media part's bytes — raw bytes at runtime, or base64 when a manifest
        authored them. Both spellings are legitimate and the distinction is the
        producer's, so the slot is a union rather than either one.
      # `anyOf`, not `oneOf`: a reader that does not know `x-telo-type` sees the
      # byte branch as an empty schema, which MATCHES — so under `oneOf` a plain
      # base64 string would match both branches and fail, while under `anyOf` it
      # degrades to accepting. That is the documented rule, and it is why leaving
      # this untyped bought nothing.
      anyOf:
        - x-telo-type: Telo.Bytes
        - type: string
    uri:
      type: string
      description: Where a media part's bytes live, when they are referenced rather than carried.
    mediaType:
      type: string
      description: The media part's IANA media type, e.g. `image/png`.
    toolCall:
      description: The call a `tool-call` part carries.
      $ref: "telo://Self/ToolCall"
    citation:
      description: What a `citation` part points at.
      type: object
      additionalProperties: true
    cacheControl:
      description: >-
        Provider-specific caching directives for this part, passed through untouched.
        Opaque here — what a provider does with it is the provider's.
      type: object
      additionalProperties: true
---
# Ai.StreamPart — the same content, arriving in pieces.
#
# `finish` is the ONLY terminal part. A failure mid-stream rejects the iteration
# with a structured error rather than yielding one, because an error part must
# be remembered by every drainer and one that forgets truncates silently. A
# thrown error also reaches machinery a data part cannot: `catches:`, a throws
# union, a `try:` step.
#
# The field names here are load-bearing beyond this repo: an editor reading a
# forwarded stream keys on `text-delta.delta`, `tool-call.toolCall` and
# `finish.usage`. Renaming one of those is a breaking change to every consumer
# of a forwarded stream, with nothing in this repo to catch it.
kind: Telo.JsonSchema
metadata:
  name: StreamPart
  description: One piece of a streamed completion — a text or reasoning delta, a completed content part, a tool call, opaque provider state, or the single terminal record carrying usage and the finish reason.
schema:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type:
      type: string
      enum: [text-delta, reasoning-delta, content-part, tool-call, provider-state, finish]
    delta:
      type: string
      description: The text a `text-delta` or `reasoning-delta` adds.
    part:
      description: The completed part a `content-part` carries.
      $ref: "telo://Self/ContentPart"
    toolCall:
      description: The call a `tool-call` part carries, once its arguments are complete.
      $ref: "telo://Self/ToolCall"
    providerState:
      description: >-
        Opaque provider state, carried so a following request can replay it. See
        Ai.Model's `providerState`.
    usage:
      description: Token accounting, on the terminal `finish` part.
      $ref: "telo://Self/TokenUsage"
    finishReason:
      description: Why generation ended, on the terminal `finish` part.
      $ref: "telo://Self/FinishReason"
---
# Why generation ended. Declared once: it was restated in five places with four
# different value sets, so a value one kind produced was rejected by the next —
# `Ai.Text` admitted `error`, which no model can produce, and omitted
# `tool-calls`, which one can, making a tool-calling finish through it a bare
# ERR_OUTPUT_INVALID.
#
# `error` is deliberately absent. A failure REJECTS; a reason code saying "the
# answer failed" competes with the mechanism that already reports failure.
#
# Image generation keeps its own vocabulary — `Ai.ImageResult.finishReason` is a
# different set of outcomes, not a narrowing of this one.
kind: Telo.JsonSchema
metadata:
  name: FinishReason
  description: Why a model stopped generating — it finished, hit a length limit, was filtered, or asked for tools.
schema:
  type: string
  enum: [stop, length, content-filter, tool-calls, other]
---
# Two usage shapes, and the difference is WHO fills them.
#
# A PROVIDER reports the token triple, which is all its endpoint tells it. The
# provider-neutral half — `unit` and `total`, the pair that lets one consumer
# sum spend across modalities — is stamped by the OPERATION, since the triple
# already carries the answer and deriving it centrally is what keeps every
# existing provider unchanged. So a model's declared output requires three
# fields and an operation's requires five; collapsing them would either make
# every provider report a figure it does not have, or drop the guarantee
# exactly where a consumer reads it.
kind: Telo.JsonSchema
metadata:
  name: TokenUsage
  description: What a request consumed in tokens, as a provider reports it — the prompt, completion and total counts, optionally already carrying the provider-neutral unit and total.
schema:
  type: object
  additionalProperties: false
  required: [promptTokens, completionTokens, totalTokens]
  properties:
    promptTokens: { type: integer, minimum: 0 }
    completionTokens: { type: integer, minimum: 0 }
    totalTokens: { type: integer, minimum: 0 }
    unit:
      type: string
      description: What `total` counts. Stamped by the operation when a provider reports none.
    total: { type: number, minimum: 0 }
---
kind: Telo.JsonSchema
metadata:
  name: Usage
  description: What a request consumed, as an operation reports it — the prompt/completion token triple, plus a provider-neutral unit and total so spend can be summed across modalities.
schema:
  type: object
  additionalProperties: false
  required: [promptTokens, completionTokens, totalTokens, unit, total]
  properties:
    promptTokens: { type: integer, minimum: 0 }
    completionTokens: { type: integer, minimum: 0 }
    totalTokens: { type: integer, minimum: 0 }
    unit:
      type: string
      description: What `total` counts, so a consumer can sum across modalities.
    total: { type: number, minimum: 0 }
---
# Ai.Model — the buffered model contract every provider implements.
#
# DECLARED, not a convention. It used to be a Telo.Provider with no schema and
# no types, whose `invoke` and `stream` were duck-typed JavaScript methods
# checked at the call site with a `typeof`. That made a provider necessarily
# TypeScript: nothing was statically checked, no non-Node kernel could host one,
# and every new endpoint shape was controller work.
#
# `Telo.Invocable` rather than `Telo.Provider` because a provider template is
# reached through `provide:`, which is parameterless — so per-call messages and
# tools have nowhere to enter, and a model could not be written as a manifest at
# all. Cancellation rides the InvokeContext the kernel passes as the second
# argument, never a `signal` inside the input: an AbortSignal is not declarable
# data.
#
# Buffered and streaming are TWO abstracts, not one. A live output is exempt
# from validation, so a single always-streaming contract would take the check
# away from the buffered path too — the one Ai.Text and Ai.Agent use, and the
# majority of calls. It also makes "this endpoint does not stream" expressible
# rather than faked as a one-element stream.
kind: Telo.Abstract
metadata:
  name: Model
  description: >-
    A language model called for a complete answer: messages and optional tools go in,
    the finished content, token usage and a finish reason come back. Providers
    implement it for their own endpoint; consumers hold one and call it.
capability: Telo.Invocable
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [messages]
    properties:
      messages:
        type: array
        minItems: 1
        items:
          $ref: "telo://Self/Message"
      options:
        type: object
        additionalProperties: true
        description: Request options, already merged by the operation from its own and the caller's.
      tools:
        type: array
        description: The tools this call may ask for. Absent when the caller offers none.
        items:
          type: object
          additionalProperties: false
          required: [name, parameters]
          properties:
            name: { type: string }
            description: { type: string }
            parameters:
              type: object
              additionalProperties: true
              description: JSON Schema for the tool's arguments, as the model is told them.
      providerState:
        description: >-
          Opaque state a previous turn produced, replayed verbatim. This is what lets
          reasoning survive a tool loop: a provider that keeps its reasoning
          server-side hands back a token here, and it must go out again unchanged on
          the next request or the chain is broken. `ai` never inspects it.
      responseFormat:
        type: object
        additionalProperties: true
        description: The shape the answer must take, e.g. a JSON schema the provider enforces.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [content, text, usage, finishReason]
    properties:
      content:
        type: array
        description: >-
          What the model produced, as parts. The whole answer including any images or
          reasoning it returned.
        items:
          $ref: "telo://Self/ContentPart"
      text:
        type: string
        description: >-
          The text parts of `content`, concatenated. Carried beside the parts because
          the overwhelmingly common consumer wants exactly this and should not have to
          fold the list to get it.
      usage:
        $ref: "telo://Self/TokenUsage"
      finishReason:
        $ref: "telo://Self/FinishReason"
      toolCalls:
        type: array
        description: The calls the model asked for, when it asked for any.
        items:
          $ref: "telo://Self/ToolCall"
      providerState:
        description: Opaque state to replay on the next request. See the input of the same name.
      alternatives:
        type: array
        description: >-
          Further candidates, when the request asked for more than one. The first
          candidate is always the one reported in `content` / `text`.
        items:
          type: object
          additionalProperties: true
---
# Ai.ModelStream — the same contract, delivered as it is generated.
#
# A separate abstract rather than a mode of Ai.Model: see the note there. What
# differs beyond the output is the RELATION a consumer has to it — the response,
# the transform chain and every error happen while the consumer drains, after
# this invocation has already returned.
kind: Telo.Abstract
metadata:
  name: ModelStream
  description: >-
    A language model called for a stream: the same messages and tools go in, and the
    answer arrives as parts — text deltas, tool calls, a terminal record with usage —
    as it is generated. A failure mid-stream rejects the iteration rather than
    yielding an error part.
capability: Telo.Invocable
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [messages]
    properties:
      messages:
        type: array
        minItems: 1
        items:
          $ref: "telo://Self/Message"
      options:
        type: object
        additionalProperties: true
      tools:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, parameters]
          properties:
            name: { type: string }
            description: { type: string }
            parameters:
              type: object
              additionalProperties: true
      providerState: {}
      responseFormat:
        type: object
        additionalProperties: true
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        description: >-
          The answer's parts, in order, ending with exactly one `finish`. A mid-stream
          failure rejects the iteration; parts already yielded still reach the
          consumer, so a forwarder can flush what it has and encode an error frame
          from the catch.
        x-telo-type:
          name: Telo.Stream
          of:
            $ref: "telo://Self/StreamPart"
---
kind: Telo.Definition
metadata:
  name: Text
  description: >-
    Generates a buffered text completion from a prompt or a message list, returning
    the completed text with token usage and a finish reason. Takes a default system
    prompt and per-call option overrides.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiTextController
throws:
  codes:
    ERR_INVALID_INPUT:
      description: >-
        The call's messages or options were malformed — both `prompt` and `messages`,
        neither, an empty message list, or a content part that is not text or a
        recognized media part.
    ERR_INVALID_REFERENCE:
      description: >-
        `model` did not resolve to a live model instance. A wiring failure, not a
        request failure.
    ERR_CONTRACT_VIOLATION:
      description: A provider reported a token count that is not a representable integer.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      prompt: { type: string }
      messages:
        type: array
        items:
          $ref: "telo://Self/Message"
      system: { type: string }
      options: { type: object, additionalProperties: true }
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      text: { type: string }
      usage:
        $ref: "telo://Self/Usage"
      finishReason:
        $ref: "telo://Self/FinishReason"
    required: [text, usage, finishReason]
    additionalProperties: false
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.Model implementation (Ai.OpenaiModel, Ai.AnthropicModel, Ai.OllamaModel, or a third-party provider).
      x-telo-ref:
        kind: Self.Model
        use: call
    system:
      title: System prompt
      description: Default system message. Runtime inputs.system takes precedence when set.
      type: string
      contentMediaType: text/markdown
      x-telo-widget: code
    options:
      title: Options
      description: Completion-level option overrides. Shallow-merged between the model's options and runtime inputs.options; downstream wins.
      type: object
      additionalProperties: true
  required: [model]
  additionalProperties: false
  examples:
    - model: !ref Gpt4oMini
      system: |
        You are a concise assistant. Answer in one sentence.
      options:
        temperature: 0.2
        maxTokens: 256
---
# Streaming consumer. Drives Ai.Model.stream() and forwards the StreamPart
# iterable on `result.output` per the streaming-Invocable convention. Encoding
# (NDJSON / SSE / plain text / raw bytes) is the consumer's responsibility —
# pipe through a format-codec encoder (Ndjson.Encoder from @telorun/ndjson-codec,
# Sse.Encoder from @telorun/sse-codec, PlainText.Encoder from @telorun/plain-text-codec,
# Octet.Encoder from @telorun/octet-codec), or iterate `result.output` directly
# in a JS.Script step.
kind: Telo.Definition
metadata:
  name: TextStream
  description: >-
    Streams a text completion token by token as an async iterable of text-delta,
    finish and error parts. Same prompt, system and option inputs as a buffered
    completion; encoding the stream is the consumer's job.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiTextStreamController
throws:
  codes:
    ERR_INVALID_INPUT:
      description: >-
        The call's messages or options were malformed — both `prompt` and `messages`,
        neither, an empty message list, or a content part that is not text or a
        recognized media part.
    ERR_INVALID_REFERENCE:
      description: >-
        `model` did not resolve to a live model instance. A wiring failure, not a
        request failure.
    ERR_CONTRACT_VIOLATION:
      description: A provider reported a token count that is not a representable integer.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      prompt: { type: string }
      messages:
        type: array
        items:
          $ref: "telo://Self/Message"
      system: { type: string }
      options: { type: object, additionalProperties: true }
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type: Telo.Stream
        description: >-
          Async iterable of StreamPart records, ending with exactly one `finish`. A
          mid-stream failure rejects the iteration rather than yielding a part.
    required: [output]
    additionalProperties: false
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.ModelStream implementation.
      x-telo-ref:
        kind: Self.ModelStream
        # Both, and the pair is the honest reading: the invocation is a real
        # dispatch that returns a handle, and then the response, the transform
        # chain and every error happen while the CONSUMER drains — after this
        # call has already returned. So a zone's lifetime stops at the streaming
        # boundary rather than falsely extending over work that outlives it.
        use: [call, trigger.consumer]
    system:
      title: System prompt
      description: Default system message. Runtime inputs.system takes precedence when set.
      type: string
      contentMediaType: text/markdown
      x-telo-widget: code
    options:
      title: Options
      description: Per-resource option overrides. Shallow-merged with the model's options and runtime inputs.options; downstream wins.
      type: object
      additionalProperties: true
  required: [model]
  additionalProperties: false
  examples:
    - model: !ref Gpt4oMini
      system: |
        You are a concise assistant. Answer in one sentence.
      options:
        temperature: 0.7
---
# Ai.ToolProvider — abstract source of callable tools, mounted into an Ai.Agent the
# same way an Http.Api mounts into an Http.Server. Implementations expose a runtime
# instance with two methods (documented convention, like Ai.Model's invoke/stream):
#   listTools(): ToolDescriptor[]   — what to advertise to the model
#   callTool(name, arguments): any  — dispatch a model-requested call
# `Ai.Tools` (static list, here) and `AiMcp.ToolProvider` (MCP discovery, in
# @telorun/ai-mcp) both implement it; the agent never learns which.
kind: Telo.Abstract
metadata:
  name: ToolProvider
  description: >-
    A source of callable tools mounted into an agent: it advertises the tools a model
    may request and dispatches a requested call by name. Backed by a fixed list or by
    tools discovered from a remote server at runtime.
capability: Telo.Mount
---
# Ai.Tools — a static list of tools, each wrapping any Telo.Invocable. The built-in
# Ai.ToolProvider implementation.
kind: Telo.Definition
metadata:
  name: Tools
  description: >-
    Exposes a fixed list of resources as tools an agent can call, each declaring the
    JSON Schema of the arguments the model must produce. Optional CEL maps those
    arguments into the call and shapes its result back into the model's context.
capability: Telo.Mount
extends: Self.ToolProvider
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiToolsController
schema:
  type: object
  properties:
    tools:
      title: Tools
      description: The tools this provider exposes.
      type: array
      items:
        type: object
        properties:
          tool:
            title: Tool
            description: |
              Reference to any Telo.Invocable or Telo.Runnable to expose as a tool.
              A Run.Sequence (a Runnable with callable inputs/outputs) can wrap a
              multi-step pipeline as a single tool.
            x-telo-ref:
              kind: Telo.Executable
              use: call
          name:
            title: Name
            description: Tool name the model sees. Defaults to the referenced resource name.
            type: string
          description:
            title: Description
            description: Human/model-facing description of what the tool does.
            type: string
          parameters:
            title: Parameters
            description: JSON Schema for the arguments the model must produce. Required.
            type: object
            additionalProperties: true
          inputs:
            title: Inputs mapping
            description: |
              Optional CEL mapping from the model's `arguments` into the invocable's
              input. Omit to forward `arguments` verbatim.
            type: object
            additionalProperties: true
            x-telo-context:
              type: object
              properties:
                arguments:
                  x-telo-context-from: "parameters/properties"
          result:
            title: Result mapping
            description: |
              Optional CEL expression shaping the invocable's `result` into what is
              fed back to the model: a string, or a content part / list of content
              parts (`{type: image, data, mediaType}`) for a multimodal result.
              Omit to JSON-stringify the output.
            # Not `type: string`: the runtime has always accepted content parts
            # (see `agent-tools.ts`), so constraining the evaluated CEL to a
            # string rejected a shipped feature — visible only once the value is
            # written in `!cel` form, which is type-checked against this schema.
            anyOf:
              - type: string
              - type: object
              - type: array
            x-telo-context:
              type: object
              properties:
                result:
                  x-telo-context-ref-from: "tool/outputType"
        required: [tool, parameters]
        additionalProperties: false
  required: [tools]
  additionalProperties: false
  examples:
    - tools:
        - tool: !ref GetWeather
          name: get_weather
          description: Get the current weather at a latitude/longitude (open-meteo).
          parameters:
            type: object
            additionalProperties: false
            required: [latitude, longitude]
            properties:
              latitude: { type: number, description: "Latitude in decimal degrees." }
              longitude: { type: number, description: "Longitude in decimal degrees." }
          inputs:
            url: /v1/forecast
            method: GET
            query:
              latitude: "${{ arguments.latitude }}"
              longitude: "${{ arguments.longitude }}"
              current_weather: "true"
          result: "${{ result.body }}"
---
# Ai.Agent — a tool-use loop. Invoked like Ai.Text (prompt xor messages, plus
# system/options); calls the model with the merged tool set, executes any requested
# tools via their providers, replays results, and loops until the model finishes or
# maxSteps is hit. Buffered only (no streaming agent in v1).
kind: Telo.Definition
metadata:
  name: Agent
  description: >-
    Runs a tool-use loop: calls the model, executes the tools it requests, replays the
    results, and repeats until the model finishes or a step bound is reached. Returns
    the final text with accumulated usage and a per-step trace.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiAgentController
throws:
  codes:
    ERR_INVALID_INPUT:
      description: >-
        The call's messages or options were malformed — both `prompt` and `messages`,
        neither, an empty message list, or a content part that is not text or a
        recognized media part.
    ERR_INVALID_REFERENCE:
      description: >-
        `model` did not resolve to a live model instance. A wiring failure, not a
        request failure.
    ERR_CONTRACT_VIOLATION:
      description: A provider reported a token count that is not a representable integer.
    ERR_AGENT_MAX_STEPS:
      description: >-
        The loop did not converge within `maxSteps` and `onMaxSteps` is `throw`. Raised
        rather than returned so it reaches a `catch:` and a route's `catches:`.
    ERR_AGENT_UNKNOWN_TOOL:
      description: The model asked for a tool no mounted provider advertises.
    ERR_AGENT_TOOL_COLLISION:
      description: Two mounted providers advertise the same tool name.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      prompt: { type: string }
      messages:
        type: array
        items:
          $ref: "telo://Self/Message"
      system: { type: string }
      options: { type: object, additionalProperties: true }
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      text: { type: string }
      # Accumulated across the loop's turns.
      usage:
        $ref: "telo://Self/Usage"
      finishReason:
        $ref: "telo://Self/FinishReason"
      steps:
        type: array
        items:
          type: object
          additionalProperties: true
    required: [text, usage, finishReason, steps]
    additionalProperties: false
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.Model implementation.
      x-telo-ref:
        kind: Self.Model
        use: call
    system:
      title: System prompt
      description: Default system message. Runtime inputs.system takes precedence when set.
      type: string
      contentMediaType: text/markdown
      x-telo-widget: code
    options:
      title: Options
      description: Completion-level option overrides passed to the model each turn.
      type: object
      additionalProperties: true
    maxSteps:
      title: Max steps
      description: Maximum model turns before the loop is bounded.
      type: integer
      minimum: 1
      default: 8
    onMaxSteps:
      title: On max steps
      description: throw → raise ERR_AGENT_MAX_STEPS; return → hand back the last turn's text.
      type: string
      enum: [throw, return]
      default: throw
    onToolError:
      title: On tool error
      description: feedback → record the error and return it to the model; throw → abort the invoke.
      type: string
      enum: [feedback, throw]
      default: feedback
    toolProviders:
      title: Tool providers
      description: Tool sources mounted into the agent — static lists (Ai.Tools) or runtime discovery (e.g. AiMcp.ToolProvider).
      type: array
      items:
        type: object
        properties:
          provider:
            title: Provider
            description: Reference to any Ai.ToolProvider implementation.
            x-telo-ref:
              kind: Self.ToolProvider
              # listTools/callTool are convention methods on a held provider,
              # not bound entry points (invoke/provide/run) — the tool ITSELF
              # is dispatched (Ai.Tools' tool slot carries the call edge).
              use: dependency
          prefix:
            title: Prefix
            description: Namespaces this provider's tool names to avoid collisions.
            type: string
          include:
            title: Include
            description: Optional allowlist matched against the provider's bare tool names (before any prefix is applied).
            type: array
            items: { type: string }
          exclude:
            title: Exclude
            description: Optional denylist matched against the provider's bare tool names (before any prefix is applied).
            type: array
            items: { type: string }
        required: [provider]
        additionalProperties: false
  required: [model]
  additionalProperties: false
  examples:
    - model: !ref Gpt4oMini
      system: |
        You are a helpful CLI assistant. Use the available tools when they help
        answer; don't guess at facts you can look up. Keep replies brief.
      maxSteps: 6
      toolProviders:
        - provider: !ref WeatherTools
        - provider: !ref RegistryTools
          prefix: "registry_"
---
# Ai.AgentStream — the streaming tool-use agent. Same loop and config as Ai.Agent,
# but it forwards the run as a Stream on `result.output` (per the streaming-Invocable
# convention) instead of a buffered object: the assistant's text streams token-by-token
# and every tool call surfaces the moment it happens. Pipe `result.output` through a
# format-codec encoder (Sse.Encoder / Ndjson.Encoder) in an Http.Api `mode: stream`
# route to serve it over SSE. The stream carries a discriminated union of records:
# `text-delta` | `tool-call` | `tool-result` | `finish` | `error`.
kind: Telo.Definition
metadata:
  name: AgentStream
  description: >-
    Runs a tool-use loop and emits it as it happens: assistant text deltas, every tool
    call and its result, then a terminal finish. A failure rejects the iteration.
    Same configuration as the
    buffered loop, shaped for serving live output.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiAgentStreamController
throws:
  codes:
    ERR_INVALID_INPUT:
      description: >-
        The call's messages or options were malformed — both `prompt` and `messages`,
        neither, an empty message list, or a content part that is not text or a
        recognized media part.
    ERR_INVALID_REFERENCE:
      description: >-
        `model` did not resolve to a live model instance. A wiring failure, not a
        request failure.
    ERR_CONTRACT_VIOLATION:
      description: A provider reported a token count that is not a representable integer.
    ERR_AGENT_MAX_STEPS:
      description: >-
        The loop did not converge within `maxSteps` and `onMaxSteps` is `throw`. Raised
        rather than returned so it reaches a `catch:` and a route's `catches:`.
    ERR_AGENT_UNKNOWN_TOOL:
      description: The model asked for a tool no mounted provider advertises.
    ERR_AGENT_TOOL_COLLISION:
      description: Two mounted providers advertise the same tool name.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      prompt: { type: string }
      messages:
        type: array
        items:
          $ref: "telo://Self/Message"
      system: { type: string }
      options: { type: object, additionalProperties: true }
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type: Telo.Stream
        description: >-
          Async iterable of AgentStreamPart records: `text-delta` (assistant text),
          `tool-call` (a tool the model requested), `tool-result` (its execution
          result: `{toolCallId, name, content, error?}`), then a terminal `finish`
          (accumulated usage + finishReason) or `error`.
    required: [output]
    additionalProperties: false
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.ModelStream implementation.
      x-telo-ref:
        kind: Self.ModelStream
        # Both, and the pair is the honest reading: the invocation is a real
        # dispatch that returns a handle, and then the response, the transform
        # chain and every error happen while the CONSUMER drains — after this
        # call has already returned. So a zone's lifetime stops at the streaming
        # boundary rather than falsely extending over work that outlives it.
        use: [call, trigger.consumer]
    system:
      title: System prompt
      description: Default system message. Runtime inputs.system takes precedence when set.
      type: string
      contentMediaType: text/markdown
      x-telo-widget: code
    options:
      title: Options
      description: Completion-level option overrides passed to the model each turn.
      type: object
      additionalProperties: true
    maxSteps:
      title: Max steps
      description: Maximum model turns before the loop is bounded.
      type: integer
      minimum: 1
      default: 8
    onMaxSteps:
      title: On max steps
      description: >-
        throw → raise ERR_AGENT_MAX_STEPS, rejecting the iteration so a `catch:` or a
        route's `catches:` can name it; return → emit a terminal finish with the last
        turn's finishReason.
      type: string
      enum: [throw, return]
      default: throw
    onToolError:
      title: On tool error
      description: >-
        feedback → emit a tool-result with error:true and continue; throw → raise the
        tool's error, rejecting the iteration. Parts already emitted still reach the
        consumer, and an encoder frames the rejection for the wire.
      type: string
      enum: [feedback, throw]
      default: feedback
    toolProviders:
      title: Tool providers
      description: Tool sources mounted into the agent — static lists (Ai.Tools) or runtime discovery (e.g. AiMcp.ToolProvider).
      type: array
      items:
        type: object
        properties:
          provider:
            title: Provider
            description: Reference to any Ai.ToolProvider implementation.
            x-telo-ref:
              kind: Self.ToolProvider
              # listTools/callTool are convention methods on a held provider,
              # not bound entry points (invoke/provide/run) — the tool ITSELF
              # is dispatched (Ai.Tools' tool slot carries the call edge).
              use: dependency
          prefix:
            title: Prefix
            description: Namespaces this provider's tool names to avoid collisions.
            type: string
          include:
            title: Include
            description: Optional allowlist matched against the provider's bare tool names (before any prefix is applied).
            type: array
            items: { type: string }
          exclude:
            title: Exclude
            description: Optional denylist matched against the provider's bare tool names (before any prefix is applied).
            type: array
            items: { type: string }
        required: [provider]
        additionalProperties: false
  required: [model]
  additionalProperties: false
  examples:
    - model: !ref Gpt4oMini
      system: |
        You author Telo manifests. Use the tools to edit files and validate with
        `telo check`. Keep replies brief.
      maxSteps: 12
      toolProviders:
        - provider: !ref WorkspaceTools
---
# The result of an image generation, declared once and referenced by BOTH
# Ai.ImageModel's outputType and Ai.Image's, so the provider contract and the
# operation's cannot drift apart. The request shapes are deliberately not shared:
# `intent` and the merged `options` are configuration on the operation and per-call
# input on the model.
#
# `images` holds what was produced; `finishReason` says why there may be fewer than
# asked for. A refusal carries no bytes, so it is reported here rather than as a
# per-image reason — that would make `data` nullable and put a null guard on every
# happy path. All-filtered is an empty array; some-filtered is a short one.
kind: Telo.JsonSchema
metadata:
  name: ImageResult
  description: >-
    The images a generation produced, each with its bytes and media type, plus why
    the run ended, what it cost, and any text the model returned alongside. Fewer
    images than requested means the rest were refused.
schema:
  type: object
  required: [images, finishReason]
  additionalProperties: false
  properties:
    images:
      description: One entry per produced image, in provider order. Empty when every image was refused.
      type: array
      items:
        type: object
        required: [data, mediaType]
        additionalProperties: false
        properties:
          data:
            description: Encoded image bytes, ready to write, overlay, or send back to a model.
            x-telo-type: Telo.Bytes
          mediaType:
            description: MIME type of the encoded bytes (image/png, image/jpeg, image/webp).
            type: string
          width:
            description: Pixel width, when the provider reports it. Not derived from the bytes here — decode them if you need it guaranteed.
            type: integer
            minimum: 1
          height:
            description: Pixel height, when the provider reports it.
            type: integer
            minimum: 1
          details:
            description: Provider-specific extras for this image (seed, safety flags, …).
            type: object
            additionalProperties: true
    finishReason:
      description: >-
        Why the run ended. `content-filter` means some or all images were refused —
        compare the array length against what was requested to tell which.
      type: string
      enum: [stop, content-filter, error, other]
    usage:
      description: What the run cost, when the provider reports it at all. Omitted entirely when it does not.
      type: object
      required: [unit, total]
      additionalProperties: false
      properties:
        unit:
          description: What `total` counts — tokens, credits, seconds, images. Open vocabulary; providers name their own.
          type: string
        total:
          description: The quantity billed, in `unit`. The one number a spend aggregator can total across providers.
          type: number
          minimum: 0
        details:
          description: The provider's own breakdown (input/output token split, per-image cost, …).
          type: object
          additionalProperties: true
    text:
      description: Text the model returned alongside the images — a rewritten prompt, or commentary from a chat-native image model.
      type: string
---
# Ai.ImageModel — the abstract image generator every provider implements. Like
# Ai.Model it is a Telo.Provider: a configured handle (model id, API key, default
# options), not an operation you invoke directly.
#
# Unlike Ai.Model, its call shape is DECLARED here rather than being a documented
# convention, and the method is `invoke` — the kernel's bound entry point. That is
# what makes the contract enforceable: the kernel binds `invoke` at its single
# instance-production site and AJV-checks both directions at dispatch, so Ai.Image
# validates nothing by hand, `telo check` sees the shape, and a provider written in
# any language implements a manifest-declared contract instead of a TypeScript
# interface. Cancellation rides the InvokeContext passed as the second argument
# (the kernel forwards every argument through the bound entry point), never a
# `signal` inside the input — an AbortSignal is not declarable data.
#
# A provider narrows the reference-image modes it serves by declaring `$defs/Intent`
# in its own schema; Ai.Image derives its `intent` field from that, so an intent a
# backend cannot serve is a static error rather than a runtime one.
kind: Telo.Abstract
metadata:
  name: ImageModel
  description: >-
    A configured handle to an image model — credentials, model id and default options
    — that generation operations drive to turn a prompt, and optionally reference
    pictures, into image bytes.
capability: Telo.Provider
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      prompt:
        description: What to draw. Required unless the intent generates from the reference alone.
        type: string
      intent:
        description: >-
          What the reference images are for, resolved from the operation's config.
          Absent means plain text-to-image. Each provider declares the values it
          serves in its own `$defs/Intent`.
        type: string
      images:
        description: Reference images the intent operates on.
        type: array
        minItems: 1
        items:
          type: object
          required: [data, mediaType]
          additionalProperties: false
          properties:
            data:
              description: Encoded image bytes.
              x-telo-type: Telo.Bytes
            mediaType: { type: string }
      mask:
        description: Which region to repaint, as an image whose transparent area marks the target. Required under an inpainting intent.
        type: object
        required: [data, mediaType]
        additionalProperties: false
        properties:
          data:
            description: Encoded mask bytes.
            x-telo-type: Telo.Bytes
          mediaType: { type: string }
      options:
        description: Request options, already merged by the operation from its own and the caller's.
        type: object
        additionalProperties: true
outputType:
  kind: Telo.JsonSchema
  schema:
    $ref: "telo://Self/ImageResult"
---
# Ai.Image — the buffered generation operation, symmetric to Ai.Text. It merges
# options, forwards cancellation, and hands the call to the model; the kernel
# contract-checks what comes back, so there is no hand-rolled result validation here.
#
# `intent` is CONFIG, not a per-call input: its acceptable values come from the
# referenced provider's `$defs/Intent` (x-telo-schema-from), which is what turns an
# unsupported mode into a `telo check` error. The cost is that intent is fixed per
# resource — generating and editing with one model means two Ai.Image resources,
# which also reads better declaratively.
kind: Telo.Definition
metadata:
  name: Image
  description: >-
    Generates pictures from a prompt, or reworks pictures you supply, returning the
    encoded bytes with their media type plus why the run ended and what it cost.
    Refused images come back as a short list rather than an error.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiImageController
throws:
  codes:
    ERR_INVALID_INPUT:
      description: >-
        `prompt` is missing with no intent configured, or `images` / `mask` are
        supplied with no intent to say what they are for, or an intent is configured
        and no `images` were supplied. Mode-specific requirements — which intents
        need a mask, which can run without a prompt — are the provider's, and surface
        with the same code from there. A malformed `inputs` shape is the kernel's
        `ERR_INPUT_INVALID`, not this.
    ERR_INVALID_REFERENCE:
      description: >-
        The referenced `model` is not a live Ai.ImageModel instance — check that the
        resource exists and that its controller loaded.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      prompt:
        description: What to draw. Required unless the configured intent generates from the reference alone.
        type: string
      images:
        description: Reference images the configured intent operates on. Only meaningful when `intent` is set.
        type: array
        minItems: 1
        items:
          type: object
          required: [data, mediaType]
          additionalProperties: false
          properties:
            data:
              description: Encoded image bytes.
              x-telo-type: Telo.Bytes
            mediaType: { type: string }
      mask:
        description: Which region to repaint, as an image whose transparent area marks the target. Required under an inpainting intent.
        type: object
        required: [data, mediaType]
        additionalProperties: false
        properties:
          data:
            description: Encoded mask bytes.
            x-telo-type: Telo.Bytes
          mediaType: { type: string }
      options:
        description: Per-call option overrides. Shallow-merged over this resource's `options`; the call wins.
        type: object
        additionalProperties: true
outputType:
  kind: Telo.JsonSchema
  schema:
    $ref: "telo://Self/ImageResult"
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.ImageModel implementation.
      x-telo-ref:
        kind: Self.ImageModel
        # invoke() is the kernel's bound entry point, dispatched and contract-checked
        # during this resource's own invocation — the Ai.Text treatment, not the
        # Embedding.Query one, whose embed() is a plain method on a held instance.
        use: call
    intent:
      title: Intent
      description: >-
        What the reference images passed to this resource are for. Omit for plain
        text-to-image. The accepted values come from the referenced model, so a mode
        it cannot serve fails `telo check`.
      # The base type is declared as well as derived: the derived schema is what
      # narrows the values, but stating `string` keeps the kernel's own config
      # validation and the editor's field rendering honest without either having to
      # resolve the sibling ref first.
      type: string
      x-telo-schema-from: "model/$defs/Intent"
    options:
      title: Options
      description: Request-level option defaults (size, quality, count, …). Per-call inputs.options wins.
      type: object
      additionalProperties: true
  required: [model]
  additionalProperties: false
  examples:
    - model: !ref Painter
      options:
        size: 1024x1024
        quality: low
    - model: !ref Painter
      intent: inpaint
---
# Ai.Buffered — a buffered model built out of a streaming one.
#
# It exists for a provider that only streams, and for third parties: without it,
# such a provider is unusable by `Ai.Text` and `Ai.Agent`, which is most of the
# calls anyone makes. Not for OpenAI, whose buffered kind sends a genuinely
# non-streaming request and is the better thing to use when the endpoint offers
# it — collecting a stream to hand back one answer pays a stream's latency for a
# buffer's result.
#
# Written as a MANIFEST rather than a controller, which is the point: the
# declared contract is what makes an adapter like this expressible at all. The
# fold is a `Run.Sequence` whose steps drive the streaming model and drain it.
kind: Telo.Definition
metadata:
  name: Buffered
  description: >-
    Presents a streaming model as a buffered one: it drives the stream, collects every
    part and folds them into a single completed answer with its usage and finish
    reason. For a provider that only streams, and for consumers that want one answer
    rather than a sequence.
capability: Telo.Invocable
extends: Self.Model
schema:
  type: object
  additionalProperties: false
  required: [model]
  properties:
    model:
      title: Model
      description: The streaming model to drive and collect.
      x-telo-ref:
        kind: Self.ModelStream
        use: [call, trigger.consumer]
resources:
  - kind: Run.Sequence
    # A literal name: the body's children live in this instance's own child
    # context, so it is unique there, and a literal is what lets
    # `validate-template-dispatch` check that `invoke:` names a sibling at all.
    metadata:
      name: fold
    steps:
      - name: start
        # The WHOLE input, passed through. Enumerating the fields here would be
        # a second copy of the contract that silently drops whatever the
        # abstract gains next — and it already dropped `tools`, which turned an
        # agent's first turn into a plain answer with nothing to report it.
        inputs: !cel "inputs"
        invoke: !cel "self.model"
      - name: parts
        inputs:
          input: !cel "steps.start.result.output"
        invoke:
          kind: Stream.Collect
      # One traversal per bucket, rather than recomputing the same
      # filter/map/join chain inside several output expressions.
      - name: buckets
        value:
          texts: !cel "steps.parts.result.items.filter(p, p.type == 'text-delta').map(p, p.delta)"
          reasoning: !cel "steps.parts.result.items.filter(p, p.type == 'reasoning-delta').map(p, p.delta)"
          finishes: !cel "steps.parts.result.items.filter(p, p.type == 'finish')"
          states: !cel "steps.parts.result.items.filter(p, p.type == 'provider-state')"
          contentParts: !cel "steps.parts.result.items.filter(p, p.type == 'content-part').map(p, p.part)"
          toolCalls: !cel "steps.parts.result.items.filter(p, p.type == 'tool-call').map(p, p.toolCall)"
      # `finish` is the only terminator and a failure rejects rather than
      # yielding, so exactly one exists by contract — but a provider that ends
      # without one would make `[0]` a raw CEL index error, so the count is
      # tested rather than assumed.
      - name: folded
        value:
          text: !cel "steps.buckets.result.texts.join('')"
          content: !cel >-
            (size(steps.buckets.result.texts) == 0 ? [] : [{'type': 'text', 'text': steps.buckets.result.texts.join('')}]) +
            (size(steps.buckets.result.reasoning) == 0 ? [] : [{'type': 'reasoning', 'text': steps.buckets.result.reasoning.join('')}]) +
            steps.buckets.result.contentParts
          usage: !cel >-
            size(steps.buckets.result.finishes) == 1 ? steps.buckets.result.finishes[0].usage :
            {'promptTokens': 0, 'completionTokens': 0, 'totalTokens': 0}
          finishReason: !cel >-
            size(steps.buckets.result.finishes) == 1 ? steps.buckets.result.finishes[0].finishReason : 'other'
          toolCalls: !cel "steps.buckets.result.toolCalls"
          providerState: !cel >-
            size(steps.buckets.result.states) == 0 ? null :
            steps.buckets.result.states[size(steps.buckets.result.states) - 1].providerState
    # The fold, in two pure steps: bucket the parts once each, then assemble.
    # Every part type the vocabulary carries is folded, not just text. Dropping
    # `provider-state` was the serious one — it is what lets reasoning survive a
    # tool loop, so an agent over a Buffered-wrapped provider lost the chain
    # silently, `providerState` being optional on the output.
    outputs: !cel "steps.folded.result"
invoke: !ref fold
inputs: !cel "inputs"
