kind: Telo.Library
metadata:
  name: tar
  version: 0.7.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Data]
  description: |
    Reading and writing tar archives as byte streams: build one from a list of paths
    and contents, or pull a single named file out of an existing archive. Combined
    with gzip compression this reads and writes `.tar.gz` payloads — the packaging
    format registries and container images ship in.
exports:
  kinds:
    - Extract
    - Pack
---
# Build a tar archive from an ordered list of `{ path, contents }` entries and
# emit it as a byte stream. Contents are UTF-8 text. Pipe through `Gzip.Encoder`
# for a `.tar.gz`.
kind: Telo.Definition
metadata:
  name: Pack
  description: >-
    Builds a tar archive from an ordered list of files, each a path inside the archive
    and its text contents, and emits it as a byte stream ready to compress or write.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/pack-controller.mjs&local_path=./nodejs/src/pack-controller.ts
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      entries:
        type: array
        description: Files to write into the archive, in order.
        items:
          type: object
          properties:
            path:
              type: string
              description: Entry path inside the archive.
            contents:
              type: string
              description: UTF-8 text content of the entry.
          required: [ path, contents ]
          additionalProperties: false
    required: [ entries ]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-stream: true
        description: Tar archive byte stream.
    required: [ output ]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
---
# Extract one named entry from a tar byte stream.
#
# The archive is scanned to completion; the matched entry's bytes are buffered
# (entries selected this way are small — e.g. a manifest) and re-emitted as a
# single-chunk `Stream<Uint8Array>` so the result composes with any downstream
# decoder (`PlainText.Decoder`, etc.). A missing `path` raises `ERR_NOT_FOUND`.
kind: Telo.Definition
metadata:
  name: Extract
  description: >-
    Pulls one named file out of a tar archive and emits its contents as a byte stream
    that pipes into any decoder. A path the archive does not contain raises.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/extract-controller.mjs&local_path=./nodejs/src/extract-controller.ts
throws:
  codes:
    ERR_NOT_FOUND:
      description: No entry at the requested path exists in the archive.
    ERR_INVALID_INPUT:
      description: input is not a byte stream, or path is missing/empty.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-stream: true
        description: Tar archive byte stream.
      path:
        type: string
        description: Entry path to extract from the archive (leading "./" is ignored).
    required: [ input, path ]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-stream: true
        description: Byte stream of the extracted entry's contents.
    required: [ output ]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
