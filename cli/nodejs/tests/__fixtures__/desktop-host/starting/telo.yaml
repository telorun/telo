kind: Telo.Application
metadata:
  name: DesktopStartingFixture
  version: 1.0.0
  description: A page served and a hidden window loading it while startup still waits, so the startup window stays open beside it.
lang: en
imports:
  Desktop: ../../../../../../modules/desktop
  Http: ../../../../../../modules/http-server
  Timer: ../../../../../../modules/timer
ports: { http: { env: DESKTOP_STARTING_PORT } }
needs:
  desktopHost:
    kind: Telo.DesktopHost
    parameters: { identifier: run.telo.tests.desktopstarting, productName: Starting, port: http }
targets:
  - !ref server
  - !ref hiddenWindow
  - { invoke: !ref wait, inputs: { duration: 60s } }
---
kind: Http.Server
metadata: { name: server }
listen: { port: !cel "ports.http" }
mounts:
  - { path: /, mount: !ref pages }
---
kind: Http.Api
metadata: { name: pages }
routes:
  - request: { path: /, method: GET }
    handler: { kind: Telo.Value, value: {} }
    returns:
      - { status: 200, content: { text/html: { body: "<h1>Starting</h1>" } } }
---
kind: Timer.Delay
metadata: { name: wait }
---
kind: Desktop.Window
metadata: { name: hiddenWindow }
host: !ref desktopHost
title: Hidden
visible: false
onClose: hide
