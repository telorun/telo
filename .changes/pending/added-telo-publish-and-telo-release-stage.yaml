units:
  cli: Added
body: "telo publish and telo release stage read the history of every repository a
  sources: vcs names, over git's smart HTTP protocol with no local git, and refuse a
  revision no branch or tag of it reaches (SOURCE_REVISION_UNREACHABLE, publish failure
  code manifest_invalid) or a host that gives no history (SOURCE_REPOSITORY_UNREADABLE,
  publish failure code source_repository_unreadable), at its vcs.revision line, pushing
  nothing. The read follows TELO_EGRESS, takes only https redirects of info/refs and
  none of its commands, and is bounded: 16 MiB per refs answer, 1 GiB per pack, 16 MiB
  per object and 10 minutes per repository. telo audit checks embedded code by its
  commit once OSV records its repository, proves a local module's revisions itself, says
  'Fixed by commit <sha> of <repository>' for an advisory only the commit matched, and
  words COMPONENT_UNCHECKED for a repository OSV records nothing about, for a revision
  not proven in its repository's history, or with where to declare vcs: for a local
  module's component."
