kind: Telo.Application
metadata:
  name: CryptoRandomDigestTest
  version: 1.0.0
  description: |
    Crypto.Random honours its length and encoding, and Crypto.Digest matches the
    NIST SHA-256/384/512 vectors for "abc", from text and from bytes.
imports: { Crypto: ../, Assert: ../../assert }
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - { name: defaults, invoke: { kind: Crypto.Random }, inputs: {} }
  - name: hex
    invoke: { kind: Crypto.Random }
    inputs: { bytes: 16, encoding: hex }
  - name: base64
    invoke: { kind: Crypto.Random }
    inputs: { bytes: 3, encoding: base64 }
  - { name: sha256, invoke: { kind: Crypto.Digest }, inputs: { input: abc } }
  - name: sha384
    invoke: { kind: Crypto.Digest }
    inputs: { algorithm: sha384, input: abc }
  - name: sha512
    invoke: { kind: Crypto.Digest }
    inputs: { algorithm: sha512, input: abc }
  - name: fromBytes
    invoke: { kind: Crypto.Digest }
    inputs: { input: !cel "bytes('abc')", encoding: base64 }
  - name: verdicts
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        defaultLength: !cel "size(steps.defaults.result.value)"
        defaultIsBase64url: !cel "steps.defaults.result.value.matches('^[A-Za-z0-9_-]{43}$')"
        hexIsHex: !cel "steps.hex.result.value.matches('^[0-9a-f]{32}$')"
        base64Length: !cel "size(steps.base64.result.value)"
        sha256: !cel "steps.sha256.result.value"
        sha384: !cel "steps.sha384.result.value"
        sha512: !cel "steps.sha512.result.value"
        fromBytes: !cel "steps.fromBytes.result.value"
      expected:
        defaultLength: 43
        defaultIsBase64url: true
        hexIsHex: true
        base64Length: 4
        sha256: ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
        sha384: cb00753f45a35e8bb5a03d699ac65007272c32ab0eded1631a8b605a43ff5bed8086072ba1e7cc2358baeca134c825a7
        sha512: ddaf35a193617abacc417349ae20413112e6fa4e89a97ea20a9eeee64b55d39a2192992a274fc1a836ba3c23a3feebbd454d4423643ce80e2a9ac94fa54ca49f
        fromBytes: ungWv48Bz+pBQUDeXa4iI7ADYaOWF3qctBD/YfIAFa0=
