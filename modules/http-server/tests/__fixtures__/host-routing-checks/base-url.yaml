kind: Telo.Application
metadata: { name: BaseUrl, version: 1.0.0, description: The removed baseUrl. }
imports:
  Http: ../../../
targets: [ !ref server ]
---
kind: Http.Server
metadata: { name: server }
listen: { port: 8942 }
baseUrl: https://shop.example
mounts:
  - path: /
    mount: !ref api
---
kind: Http.Api
metadata: { name: api }
routes:
  - request: { path: /, method: GET }
    returns:
      - status: 200
        content: { application/json: { body: { ok: true } } }
