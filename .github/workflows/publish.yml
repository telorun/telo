name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # npm packages ONLY. `pnpm run release` is `changeset publish` and nothing else;
  # module artifacts and Docker images are published by the jobs below / by
  # publish-docker.yml, so neither can fail this job and none of the three can
  # strand another.
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r --if-present build

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Module ARTIFACTS publish here, not in the npm release script.
  #
  # TWO INDEPENDENT LEDGERS, and the split is what keeps either from stranding the
  # other. There is deliberately no `needs: release` and no ordering claim: this
  # job builds artifacts with the WORKSPACE CLI (`node ./cli/nodejs/bin/telo.mjs`,
  # `--skip-controllers`), so nothing here resolves from npm and nothing has to
  # ship first. When this was the tail of `publish-packages.mjs` it also ran a
  # module payload-drift gate, which demanded module versions be moved BEFORE npm
  # published and then failed the release after the packages and git tags were
  # already out.
  #
  # Runs on every push to main, not only on a release commit: both gates in the
  # script are idempotent (version moved in this commit, or version absent at the
  # registry), so nothing is republished and a failed push heals on the next push.
  # `vars.TELO_OCI_REGISTRY` unset skips it entirely.
  publish-modules:
    name: Publish module artifacts
    runs-on: ubuntu-latest
    if: vars.TELO_OCI_REGISTRY != ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD^ needed by the version-moved gate

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r --if-present build

      # The OCI transport reads the ambient Docker credential chain, so logging in
      # here is what authorizes the push.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A mirror cannot be built up incrementally from empty: `telo publish`
      # hard-fails when a relative sibling does not already resolve at the
      # destination. `scripts/publish-oci-backfill.mjs` repairs a partially-pushed
      # mirror.
      - name: Publish module manifests
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: pnpm run publish-modules

  # Modules are versioned by `telo release`, not by changesets, and they get their
  # OWN Version PR — always, independently of whether npm changesets are pending.
  #
  # They used to ride the changesets PR whenever one existed, which made a single
  # review cover two ledgers: approving a patch to one npm package also approved
  # every module republish in the same commit, and a release routinely republishes
  # sixty of them because a shared library reached their bundles. Splitting them
  # means each PR is reviewable against the ledger it moves, and the module PR can
  # say in its body exactly what merging it will publish.
  module-release:
    name: Module Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r --if-present build

      # CAPTURED BEFORE APPLY. `telo release apply` consumes the fragments the
      # changelog entries come from, so a plan read afterwards can say which
      # versions moved but not why — which is the half of the body worth reading.
      - name: Capture the release plan
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node ./cli/nodejs/bin/telo.mjs release status -o json --base HEAD > /tmp/release-plan.json

      # Writes every planned version into each manifest its module owns, appends
      # the changelogs, updates the ledger, and deletes the fragments it consumed.
      # A no-op when nothing drifted, so the PR step below finds no changes and
      # opens nothing.
      - name: Apply the release plan
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node ./cli/nodejs/bin/telo.mjs release apply --base HEAD

      - name: Render the PR body
        run: node scripts/module-release-pr-body.mjs /tmp/release-plan.json > /tmp/release-body.md

      - name: Open Module Release PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: module-release/main
          base: main
          title: "chore(release): version modules"
          commit-message: "chore(release): version modules"
          body-path: /tmp/release-body.md

  docker:
    name: Publish release Docker images
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/publish-docker.yml
    with:
      release: true
      published-packages: ${{ needs.release.outputs.publishedPackages }}
    secrets: inherit
