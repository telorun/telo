kind: Telo.Application
metadata:
  name: DurableSleepForNotADuration
  version: 1.0.0
  description: A sleep's `for` that is not a duration is refused by `telo check` at the line that writes it.
imports: { Assert: ../../assert }
targets: [!ref refusedAtCheck]
---
kind: Assert.Manifest
metadata: { name: refusedAtCheck }
source: ./__fixtures__/sleep-for-not-a-duration.yaml
expect:
  errors:
    - { code: SCHEMA_VIOLATION, message: "/for must be a Telo.Duration" }
