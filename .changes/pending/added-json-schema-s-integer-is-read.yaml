units:
  cel: Added
body: "JSON Schema's `integer` is read as a `number` wherever a schema meets the two:
  `allOf` of `type: number` and `type: integer`, a member two `patternProperties`
  entries type so, a list's `items` met so, and an `enum` of integers beside `type:
  number` are typed `int` (an `int` or `uint` met with a `double` is the integer), where
  the meet used to be reported `intersection-empty` and the whole schema typed `dyn`. A
  field whose `number` set meets `integer` keeps its integral values as ints, and is
  absent where it holds none. A reading that was `dyn` may now refuse an expression
  treating the value as a double."
