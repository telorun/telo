modules:
  modules/graph-layers-sql: Added
body: "New module: the SQL family's shared half of a layered knowledge graph, written
  against the Sql contracts and never an engine. The Node and Relationship abstracts and
  the three store abstracts - CurrentStore, DraftedStore and RevisionedStore - with the
  structural rules a layered type and store require of their declared tables, each
  reported by telo check and refused again at creation (GRAPH_NODE_KEY_UNKNOWN_COLUMN,
  GRAPH_NODE_KEY_MISMATCH, GRAPH_NODE_KEY_NOT_LAYERABLE, GRAPH_TABLE_UNIQUE_DECLARED,
  GRAPH_ENDPOINT_UNKNOWN_COLUMN, GRAPH_ENDPOINT_MISMATCH, GRAPH_ENDPOINT_NULLABLE,
  GRAPH_TABLE_NOT_IN_SCHEMA, GRAPH_SCHEMA_CONNECTION_MISMATCH, GRAPH_TABLE_SHARED,
  GRAPH_BASE_STORE_MISMATCH, GRAPH_BASE_LAYER_DUPLICATE). The engine-neutral
  implementation covers all three strategies: overlay by precedence as one index probe
  per higher layer, relationships kept in a view only while both endpoints resolve,
  keyset paging that resumes after a key of any type, cross-layer traversal as one
  statement; on the current strategy every write as a conditional statement on the
  layer's unique index - one, or two for a merge of a key the view does not show, which
  is stated with the declared default of every column not given - so concurrent writers
  of one key never fail; drafts as a draft row beside a published one with a two-way
  conflict comparison; and revisions as one row per version with pinned stacks, labels
  and a three-way merge per property. The code library @telorun/graph-layers-sql exports
  the five controllers a strategy module re-exports - Node, Relationship, CurrentStore,
  DraftedStore, RevisionedStore - and nothing else. A drafted write whose source a
  concurrent delete removed answers as after that delete, value equality is by the
  value's own type, and on the revisions strategy a layer's row is created only by a
  call that changes the layer."
