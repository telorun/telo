modules:
  modules/ui-react-conformance: Added
body: "`CheckTheme` counts a token the renderer itself reads (the contract's
  `rendererTokens`) as read, still asking the theme for its default, and treats
  `padding`, `padding-left`, `padding-right`, `padding-inline-start` / `-end` as setting
  a reserved `padding-inline`, `margin`, `margin-left`, `margin-right`,
  `margin-inline-start` / `-end` as setting a reserved `margin-inline`, `grid-area` and
  `grid-column-start` / `-end` as setting a reserved `grid-column`, and
  `max-inline-size` as setting a reserved `max-width`."
