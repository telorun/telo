project: http-dispatch
kind: Added
body: >-
  Reference slots name their target as an alias-qualified kind
  (`<Alias>.<Kind>`, `Self.<Kind>`, `Telo.<Kind>`) instead of the
  `<namespace>/<module>#<Kind>` identity string, so a constraint resolves
  through this module's own `imports:` map and stays pinned to the version
  it imports. `metadata.namespace` is dropped — a module's location is the
  ref it is published under, never anything it declares about itself.
