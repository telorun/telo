project: fs
kind: Added
body: 'Filesystem operations log what they touched: writes at debug with path and size, Fs.FileRemoval
  at info with the path, and Fs.TreeSync with one info carrying the number of paths deleted
  (each path individually at debug, since a routine delta legitimately carries hundreds).
  A deletion is the one operation with nothing left behind to inspect afterwards — TreeSync''s
  is recursive and force:true, so a mistyped path takes a tree and a path that never existed
  reports success either way. File contents are never logged.'
