units:
  analyzer: Added
body: A kind's `x-telo-context-ref-from` takes a path that starts with data segments
  before its first reference slot (`onSubmit/write/answer`) or a list of paths read as
  ordered alternatives, the first that names something typing the binding. Where the
  path holds nothing, the binding keeps the JSON Schema keywords it declares instead of
  going open. Beside `x-telo-context-withheld`, now allowed with the keywords of the
  binding's own reading, the binding is typed where a path names something and refused,
  with its reason, wherever none does. A path the schema of the object holding the
  region cannot follow to its first slot, or one crossing no slot, is
  `CONTEXT_REF_FROM_INVALID` at the kind, and a malformed value is `SCHEMA_VIOLATION`.
