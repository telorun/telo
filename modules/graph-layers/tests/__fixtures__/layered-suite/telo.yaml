# The layered graph's behaviour, once, for every strategy and engine: overlay by
# precedence, writes that only ever state in the store's own layer, hiding and
# retraction, links and traversals that cross layers, a relationship being in a
# view only while both its endpoints are, and keyset paging over the resolved
# view, and a new value taking its columns' defaults. A run supplies seven
# stores over the same types and runs these in order, starting empty; each
# sequence keeps to keys of its own prefix.
#
# The stacks the stores must form:
#   top  → [middle → [base], side]         `top` resolves top, middle, base, side
#   apex → [left → [base], right → [base]]  `apex` resolves apex, left, right, base
# A layer two bases share has one place, the lowest: `base` is beneath `right`.
#
# The base level of the contract does not say WHEN a stack takes a change made
# beneath it, only that it is visible above once the stack has taken it. So the
# run also supplies `refreshStacks`, which brings every stack up to date, and
# every sequence invokes it after each maximal run of writes through one store
# that has a store above it (`base`, `middle`, `side`, `left`, `right`), before
# the next step. A strategy whose stacks are read live supplies a sequence that
# does nothing; what only a live stack promises is in `live-stack-suite`, and
# what only a pinned one promises in `stacking-suite`.
kind: Telo.Library
metadata:
  name: LayeredGraphSuite
  version: 1.0.0
  description: >-
    Test fixture: the layered graph suite over seven stores holding people who
    know people and author documents.
imports:
  Graph: ../../../../graph
  GraphLayers: ../../..
  Run: ../../../../run
  Assert: ../../../../assert
resources:
  base:
    kind: GraphLayers.Store
    description: Layer `base`, built on nothing.
  middle:
    kind: GraphLayers.Store
    description: Layer `middle`, built on `base`.
  side:
    kind: GraphLayers.Store
    description: Layer `side`, built on nothing.
  top:
    kind: GraphLayers.Store
    description: Layer `top`, built on `middle` then `side`.
  left:
    kind: GraphLayers.Store
    description: Layer `left`, built on `base`.
  right:
    kind: GraphLayers.Store
    description: Layer `right`, built on `base`.
  apex:
    kind: GraphLayers.Store
    description: Layer `apex`, built on `left` then `right`.
  person:
    kind: Graph.Node
    description: People keyed by a text `id`, with a non-null text `name` and an integer `age`.
  document:
    kind: Graph.Node
    description: >-
      Documents keyed by a text `id`, with a text `title`, a non-null text
      `status` defaulting to `draft` and an integer `pages` defaulting to 1.
  knows:
    kind: Graph.Relationship
    description: person → person, with an integer `since`.
  authored:
    kind: Graph.Relationship
    description: person → document, with a text `role` and an integer `share` defaulting to 100.
  refreshStacks:
    kind: Run.Sequence
    description: >-
      Brings every store's stack up to date with what the stores beneath it now
      hold. Takes no input.
exports:
  resources:
    - overlay
    - writes
    - relationships
    - traversals
    - deletions
    - retractions
    - diamond
    - paging
    - defaults
---
kind: Assert.Equals
metadata: { name: check }
---
# What a drain has gathered so far.
kind: Run.Value
metadata: { name: gathered }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [items]
    properties:
      items: { type: array }
value:
  items: !cel "inputs.items"
---
# Two single hops along `knows`.
kind: Graph.Traverse
metadata: { name: topFriendsOfFriends }
store: !ref top
from: !ref person
to: !ref person
hops:
  - relationship: !ref knows
  - relationship: !ref knows
---
# One hop along `knows`.
kind: Graph.Traverse
metadata: { name: topFriends }
store: !ref top
from: !ref person
to: !ref person
hops:
  - relationship: !ref knows
---
# Everyone reachable in one to three `knows` hops — through a cycle.
kind: Graph.Traverse
metadata: { name: topReachable }
store: !ref top
from: !ref person
to: !ref person
hops:
  - relationship: !ref knows
    minHops: 1
    maxHops: 3
