# The showcase in Portuguese, worded as in Brazil: the applications' and
# pages' titles, every text the pages write, the labels of the models they
# draw, and the words the renderer draws on its own. A plural source is matched
# by the text its `other` case reads and translated into Portuguese's cases —
# `one` (0 and 1) and `other`, with `=0` where a sentence of its own reads
# better; a word told apart by its context is translated once per context.
kind: I18n.Catalog
metadata:
  name: portuguese
lang: pt
texts:
  # Applications and pages.
  - { text: UI showcase, translation: Vitrine de interface }
  - { text: UI showcase — Radix, translation: Vitrine de interface — Radix }
  - { text: UI showcase — brand, translation: Vitrine de interface — marca }
  - { text: UI showcase — sidebar, translation: Vitrine de interface — barra lateral }
  - { text: Overview, translation: Visão geral }
  - { text: Conditions, translation: Condições }
  - { text: Data, translation: Dados }
  - { text: Tables, translation: Tabelas }
  - { text: Filters, translation: Filtros }
  - { text: Forms, translation: Formulários }
  - { text: Actions, translation: Ações }
  - { text: Components, translation: Componentes }
  - { text: CRUD, translation: CRUD }
  - { text: Themes, translation: Temas }
  # The navigation's groups.
  - { text: Building blocks, translation: Blocos de construção }
  - { text: Input, translation: Entrada }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: Logotipo da vitrine de interface }
  - { text: Language, translation: Idioma }
  - { text: Theme, translation: Tema }
  - { text: Default, translation: Padrão }
  - { text: Radix, translation: Radix }
  - { text: Brand, translation: Marca }
  - { text: Sidebar, translation: Barra lateral }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: A cada requisição }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "Estes nós pertencem à própria página, então o when e o texto deles são avaliados a cada requisição." }
  - { text: Your browser asked for Polish., translation: Seu navegador pediu polonês. }
  - { text: Your browser did not ask for Polish., translation: Seu navegador não pediu polonês. }
  - { text: The Acme brand is on., translation: A marca Acme está ativada. }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "Um texto calculado por uma expressão é exibido como foi calculado, nunca traduzido." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "Um link que esta requisição torna inválido é substituído por um nó de erro, e o restante da página é servido." }
  - { text: Leaves the application, translation: Sai do aplicativo }

  # The overview.
  - { text: Every node type, translation: Todos os tipos de nó }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "Uma caixa, uma pilha e colunas contêm outros nós, e cada uma desenha seus filhos do seu jeito." }
  - { text: A box, translation: Uma caixa }
  - { text: Groups its children., translation: Agrupa seus filhos. }
  - { text: A stack, translation: Uma pilha }
  - { text: Draws its children one under another., translation: Desenha seus filhos um abaixo do outro. }
  - { text: A badge, translation: Um selo }
  - { text: Columns, translation: Colunas }
  - { text: "Draw their children side by side, as these three are.", translation: "Desenham seus filhos lado a lado, como estas três." }
  - { text: Text in each style, translation: Texto em cada estilo }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "Um estilo diz o que um nó significa; o tema decide a aparência disso. Um nó pode ter vários." }
  - { text: Heading, translation: Título }
  - { text: Subheading, translation: Subtítulo }
  - { text: Muted, translation: Atenuado }
  - { text: Strong, translation: Forte }
  - { text: Accent, translation: Destaque }
  - { text: Danger, translation: Perigo }
  - { text: Warning, translation: Aviso }
  - { text: Success, translation: Sucesso }
  - { text: Strong and accent, translation: Forte e destaque }
  - { text: Links, translation: Links }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "Um link para uma página declarada navega dentro do aplicativo; um arquivo servido sob o ponto de montagem é um carregamento comum; https e mailto saem dele." }
  - { text: Go to Conditions, translation: Ir para Condições }
  - { text: A file the server serves, translation: Um arquivo servido pelo servidor }
  - { text: Write to us, translation: Escreva para nós }
  - { text: Images, translation: Imagens }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "Uma imagem por endereço, a mesma imagem como decoração com alt vazio e marcação SVG desenhada como imagem, nunca inserida na página." }
  - { text: The showcase mark, translation: O símbolo da vitrine }
  - { text: Three overlapping circles, translation: Três círculos sobrepostos }
  - { text: Values by their schema, translation: Valores pelo seu esquema }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "Cada valor é desenhado como diz sua propriedade no modelo, lido do registro da equipe que a página carrega." }
  - { text: Visit the team homepage, translation: Visite a página inicial da equipe }
  - { text: "A uri, drawn as a link with a text of its own", translation: "Uma uri, desenhada como link com texto próprio" }
  - { text: A uri-reference to a declared page, translation: Uma uri-reference para uma página declarada }
  - { text: A uri-reference to a served file, translation: Uma uri-reference para um arquivo servido }
  - { text: A mailto address, translation: Um endereço mailto }
  - { text: "An address the rule refuses, drawn as plain text", translation: "Um endereço que a regra recusa, desenhado como texto simples" }
  - { text: A date, translation: Uma data }
  - { text: A date and time, translation: Uma data e hora }
  - { text: A boolean, translation: Um booleano }
  - { text: An enumeration's label, translation: O rótulo de uma enumeração }
  - { text: A list, translation: Uma lista }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "As linhas de uma única resposta, nunca paginadas. Um cabeçalho usa por padrão o título da propriedade, e a última coluna só é exibida enquanto a equipe está contratando." }
  - { text: Projects under way, translation: Projetos em andamento }
  - { text: Project, translation: Projeto }
  - { text: Texts, translation: Textos }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": Nenhum projeto até agora.
        one: "{$count} projeto até agora."
        other: "{$count} projetos até agora."
  - { text: "{$team} started {$project} most recently.", translation: "{$team} iniciou {$project} mais recentemente." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "Um plural escolhido no navegador para o número que ele lê e um texto cujos valores vêm do registro." }
  - { text: Open, context: state, translation: Aberto }
  - { text: Open, context: verb, translation: Abrir }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "O texto próprio de um nó é diferenciado do mesmo jeito: o selo diz que TEL-42 está aberto, e o link oferece abrir suas tarefas." }
  - { text: Style rules, translation: Regras de estilo }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "O estilo de uma linha e o de uma célula são escolhidos por um valor da linha. O projeto em destaque fica em negrito, cada status tem sua cor, e um status que nenhum caso nomeia recebe o padrão. Duas colunas têm como cabeçalho a mesma palavra, Open, diferenciada pelo contexto com que cada cabeçalho é escrito." }
  - { text: Composites, translation: Compostos }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "Esta página inteira é uma visão que cada aplicativo posiciona por referência. Abaixo, uma visão escrita no próprio lugar onde é posicionada e um tipo composto próprio deste exemplo, que não tem controlador." }
  - { text: A view declared inline at the node that places it., translation: Uma visão declarada no próprio nó que a posiciona. }
  - { text: A callout, translation: Uma nota em destaque }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Declarada uma vez como um tipo que estende Ui.Composite e fornece uma visão, e posicionada com campos próprios." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: Abas }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "Conteúdo em abas, uma aba por vez. A aba escolhida faz parte do endereço da página, então recarregar ou abrir um link compartilhado a abre de novo." }
  - { text: Summary, translation: Resumo }
  - { text: "A tab holds any nodes, as a box does.", translation: "Uma aba contém quaisquer nós, como uma caixa." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "Só os nós da aba escolhida são desenhados." }
  - { text: Chosen, translation: Escolhida }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "Cada aba é entregue pelo seu próprio when, como qualquer nó." }
  # The labels of the overview's models.
  - { text: Code, translation: Código }
  - { text: Name, translation: Nome }
  - { text: Status, translation: Status }
  - { text: Active, translation: Ativo }
  - { text: Paused, translation: Pausado }
  - { text: Finished, translation: Concluído }
  - { text: Budget, translation: Orçamento }
  - { text: Started, translation: Iniciado em }
  - { text: Free, context: subscription, translation: Gratuito }
  - { text: Enterprise, context: subscription, translation: Empresarial }
  - { text: Version, translation: Versão }
  - { text: Team, context: subscription, translation: Equipe }

  # Conditions.
  - { text: Delivered and drawn, translation: Entregue e desenhado }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "O when de um nó decide no servidor se ele é entregue; o shown dele decide no navegador se um nó entregue é desenhado." }
  - { text: Never delivered — this node is not in the page document., translation: Nunca entregue — este nó não está no documento da página. }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "Entregue e nunca desenhado: o status não é paused, então o navegador mantém isto fora de vista." }
  - { text: Delivered by its when and drawn by its shown., translation: Entregue pelo seu when e desenhado pelo seu shown. }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "A condição de um posicionamento em torno de um composto cujo nó tem sua própria condição é envolvida em uma caixa, e as duas precisam ser atendidas." }
  - { text: Both conditions hold., translation: As duas condições são atendidas. }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "Uma visão cujo conteúdo é desligado pelo seu próprio when não fornece nenhum nó, então o composto que a posiciona é omitido." }
  - { text: Never provided., translation: Nunca fornecido. }
  - { text: Every keyword of a condition, translation: Todas as palavras-chave de uma condição }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "Cada linha abaixo é desenhada porque sua condição é atendida pelo resumo do projeto TEL-42 que esta página leu: status active, quatro membros, velocidade 2.5, tags design e web, um gerente como líder, note null e nenhum codename." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: de 1 a 10 pessoas trabalham nele." }
  - { text: "required: the lead has an e-mail.", translation: "required: o líder tem e-mail." }
  - { text: "properties: the lead is a manager.", translation: "properties: o líder é gerente." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: pelo menos três pessoas trabalham nele." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: no máximo nove pessoas trabalham nele." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: a velocidade é maior que 2." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: a velocidade é menor que 3." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: a velocidade é múltipla de 0.5." }
  - { text: "type: the status is a string.", translation: "type: o status é uma string." }
  - { text: "type, as a list: the note is a string or null.", translation: "type, como lista: note é uma string ou null." }
  - { text: "const: the status is active.", translation: "const: o status é active." }
  - { text: "enum: the status is active or paused.", translation: "enum: o status é active ou paused." }
  - { text: "not: the status is not paused.", translation: "not: o status não é paused." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code começa com TEL ou OPS." }
  - { text: "items: every tag has at least two letters.", translation: "items: toda tag tem pelo menos duas letras." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: há pelo menos duas tags." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: há no máximo cinco tags." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: nenhuma tag se repete." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code tem pelo menos três caracteres." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code tem no máximo dez caracteres." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code é formado por letras, um hífen e dígitos." }
  - { text: Missing and null, translation: Ausente e null }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null é um valor presente. Um valor ausente não atende a nenhuma condição, nem mesmo a uma sob not, então a ausência é testada no pai." }
  - { text: The note is present and null., translation: note está presente e é null. }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "Nunca desenhado: um codename ausente não atende a not." }
  - { text: "The project has no codename, tested on the summary.", translation: "O projeto não tem codename, testado no resumo." }
  - { text: Query parameters, translation: Parâmetros de consulta }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "Este leitor declara mode, uma lista de valores de tag e um ticket sujeito a um padrão. Um parâmetro que o endereço omite, um parâmetro único informado duas vezes ou um valor que sua declaração recusa conta como ausente." }
  - { text: Mode detailed, translation: Modo detailed }
  - { text: Two tags, translation: Duas tags }
  - { text: A valid ticket, translation: Um ticket válido }
  - { text: A refused ticket, translation: Um ticket recusado }
  - { text: Mode given twice, translation: Modo informado duas vezes }
  - { text: Clear the query, translation: Limpar a consulta }
  - { text: mode is detailed., translation: mode é detailed. }
  - { text: There are two tag values or more., translation: Há dois ou mais valores de tag. }
  - { text: The ticket matches its pattern., translation: ticket corresponde ao seu padrão. }
  - { text: "No ticket, or one its pattern refuses.", translation: "Nenhum ticket, ou um que o padrão recusa." }
  - { text: Enablement, translation: Habilitação }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "O botão só pode ser pressionado enquanto sua condição sobre o conteúdo do formulário é atendida, e diz por quê enquanto não é. Uma tag que o projeto já tem é recusada, e as linhas acima leem o resumo de novo depois que uma tag é adicionada." }
  - { text: Tag TEL-42, translation: Adicionar tag a TEL-42 }
  - { text: Tag, translation: Tag }
  - { text: Type a tag of three letters or more., translation: Digite uma tag de três letras ou mais. }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation:
      plural: count
      cases:
        one: "Tag {$tag} adicionada: TEL-42 agora tem {$count} tag."
        other: "Tag {$tag} adicionada: TEL-42 agora tem {$count} tags."
  - { text: A page's own query, translation: A consulta própria de uma página }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "Esta página também declara mode, e os nós dela o leem." }
  - { text: The page reads mode as detailed., translation: A página lê mode como detailed. }

  # Data.
  - { text: A reader and its parameters, translation: Um leitor e seus parâmetros }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "O projeto é o parâmetro project do endereço da página, enviado com a leitura; sem ele, o parâmetro não é enviado e a rota responde por TEL-42. Um código que nenhum projeto tem desenha a árvore de falha." }
  - { text: A code no project has, translation: Um código que nenhum projeto tem }
  - { text: No project, translation: Sem projeto }
  - { text: Reading the project…, translation: Lendo o projeto… }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, liderado por {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "Um leitor aninhado no conteúdo deste lê as pessoas que trabalham no mesmo projeto." }
  - { text: Working on it, translation: Trabalhando nele }
  - { text: Role, translation: Função }
  - { text: E-mail, translation: E-mail }
  - { text: "No answer · {$code}", translation: "Sem resposta · {$code}" }
  - { text: Readers that fail, translation: Leitores que falham }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "Sem árvore de falha própria, os leitores desenham o código e a mensagem do erro — para um projeto que não existe, para uma rota protegida lida sem sessão e para uma resposta que o modelo do leitor recusa (a lista de projetos lida como um único projeto)." }
  - { text: "Never drawn: there is no such project.", translation: "Nunca desenhado: esse projeto não existe." }
  - { text: "Signed in, so this reads: {$name}", translation: "Conectado, então isto lê: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "Nunca desenhado: uma lista não é um projeto." }
  - { text: Read again on focus, translation: Ler de novo ao focar }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "Este leitor lê de novo a hora do servidor sempre que a janela recupera o foco. Mude para outra janela e volte." }
  - { text: Read at, translation: Lido às }
  - { text: A sign-in gate, translation: Uma barreira de login }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "A barreira lê se há uma sessão aberta e lê de novo sempre que uma requisição dentro dela responde 401. Entrar abre uma sessão para um membro da equipe; um e-mail que ninguém da equipe tem é recusado no seu campo. Dentro dela, um leitor sobre uma rota protegida mostra a conta. Encerrar a sessão silenciosamente deixa a conta na tela até que a próxima requisição protegida — a verificação abaixo, ou um foco — seja recusada, e então a barreira passa para a visão desconectada." }
  - { text: You are signed out., translation: Você está desconectado. }
  - { text: Sign in, translation: Entrar }
  - { text: "Signed in as {$name}", translation: "Conectado como {$name}" }
  - { text: "Member since {$since}", translation: "Membro desde {$since}" }
  - { text: Check the session, translation: Verificar a sessão }
  - { text: End the session quietly, translation: Encerrar a sessão silenciosamente }
  - { text: Sign out, translation: Sair }

  # The labels of the task models.
  - { text: Task, translation: Tarefa }
  - { text: Assignee, translation: Responsável }
  - { text: Priority, translation: Prioridade }
  - { text: Estimate, translation: Estimativa }
  - { text: Due, translation: Prazo }
  - { text: Label, translation: Rótulo }
  - { text: Blocked, translation: Bloqueado }
  - { text: To do, translation: A fazer }
  - { text: In progress, translation: Em andamento }
  - { text: In review, translation: Em revisão }
  - { text: Bug, translation: Bug }
  - { text: Feature, translation: Funcionalidade }
  - { text: Chore, translation: Manutenção }
  - { text: Docs, translation: Documentação }
  - { text: Contact, translation: Contato }
  - { text: Project name, translation: Nome do projeto }
  - { text: Brief, translation: Descrição }

  # Tables.
  - { text: Columns from the model, translation: Colunas do modelo }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "Sem colunas escritas, uma tabela mostra uma por propriedade do modelo, exceto a chave da linha, cada uma com o título como cabeçalho e desenhada conforme seu tipo. Mostra 25 linhas por página, o padrão, e abre os formulários de criação e edição em uma caixa de diálogo, a superfície que uma tabela usa quando não nomeia nenhuma." }
  - { text: "Written columns, sorting and style rules", translation: "Colunas escritas, ordenação e regras de estilo" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "Colunas escritas à mão, na ordem dada, uma com cabeçalho próprio. Uma coluna ordena quando a coleção lista sua propriedade para ordenação. A linha de uma tarefa bloqueada fica em negrito e vermelha, cada célula de status tem sua cor, e uma prioridade que nenhum caso nomeia recebe o padrão. Oito linhas por página." }
  - { text: Where, translation: Onde }
  - { text: Members behind a reference, translation: Membros por trás de uma referência }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "O quadro de tarefas responde cada tarefa com o responsável e o projeto aninhados nela. Uma coluna sobre um membro aninhado recebe o título e a apresentação desse membro por meio de uma forma nomeada, de uma definição do próprio modelo e de uma referência cujo título próprio prevalece sobre a forma que ela nomeia: o contato é um link de e-mail e a descrição, um link para uma página." }
  - { text: Filtered by the address, translation: Filtrado pelo endereço }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "Esta tabela declara um parâmetro project e o envia como igualdade em cada requisição. Sem projeto no endereço, ela não lê nada." }
  - { text: Atlas redesign tasks, translation: Tarefas do redesenho do Atlas }
  - { text: Billing migration tasks, translation: Tarefas da migração do faturamento }
  - { text: Blocked tasks, translation: Tarefas bloqueadas }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "Esta é filtrada por um valor fixo escrito na tabela e lista só as tarefas bloqueadas." }
  - { text: Where a form opens, translation: Onde um formulário abre }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "Cada tabela abaixo abre seus formulários de criação e edição em uma superfície diferente. Salvar recarrega todas as tabelas de tarefas da página." }
  - { text: Dialogs, translation: Caixas de diálogo }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "Criação em uma caixa de diálogo pequena que fica aberta, esvaziada, para outra tarefa. Edição em uma caixa de diálogo grande que não bloqueia a página e ignora um clique fora; ela mantém os valores depois de salvar, descarta dados não salvos sem perguntar e faz parte do endereço. Cada linha oferece uma exclusão com confirmação." }
  - { text: Drawers, translation: Gavetas }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "Criação em uma gaveta pequena a partir da borda inicial; edição em uma gaveta grande a partir da borda final, sem botão de fechar. As duas fecham depois de salvar e perguntam antes de descartar dados não salvos." }
  - { text: Sheets, translation: Folhas }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "Criação em uma folha que vem do topo e não bloqueia a página; edição em uma folha inteira que vem de baixo e faz parte do endereço." }
  - { text: Popovers, translation: Balões }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "Criação em um cartão ao lado do botão Novo, centralizado nele; abaixo do ponto de quebra, vira uma caixa de diálogo inteira. Edição em um cartão abaixo do botão da linha, alinhado ao seu final, que um clique fora não fecha e que fica aberto depois de salvar." }
  - { text: In line, translation: Em linha }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "O formulário de criação abre acima das linhas, e o de edição abaixo da linha que ele altera. Abaixo do ponto de quebra, o formulário de criação abre em uma folha que vem de baixo." }
  - { text: Panels, translation: Painéis }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "Criação em um painel pequeno na borda inicial, que Escape não fecha. Edição em um painel grande na borda final, que faz parte do endereço, com as linhas ainda utilizáveis ao lado; abaixo do ponto de quebra, vira uma folha que vem de baixo." }
  - { text: A page of its own, translation: Uma página própria }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "Criação e edição substituem o conteúdo da página sob um único nome de endereço, então o endereço indica uma nova tarefa ou a tarefa com esta chave, e Voltar fecha o formulário. A superfície é declarada uma vez e nomeada pelas duas." }

  # Filters.
  - { text: Every filter the collection accepts, translation: Todos os filtros que a coleção aceita }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "Sem campos escritos, a barra desenha um controle por filtro que a coleção aceita, na ordem dela e a partir da propriedade do modelo: uma lista para uma enumeração ou um valor sim/não, uma caixa de digitação nos demais casos e um único rótulo sobre os dois limites de um intervalo. Ela fica acima da tabela, aplica uma escolha na hora e o texto digitado ao pressionar Enter, e não guarda nada entre visitas." }
  - { text: Every control, translation: Todos os controles }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "Cada forma de informar um filtro: texto digitado, opções lado a lado, uma lista, tags digitadas, um controle deslizante, um interruptor e duas datas sob um único rótulo. O filtro de projeto não é desenhado em lugar nenhum, e só uma predefinição o define. Status começa no seu padrão, e uma predefinição define os filtros que nomeia e limpa os outros que as predefinições nomeiam. Chips resumem o que foi escolhido, e os valores fazem parte do endereço. Abaixo do ponto de quebra, a barra se recolhe, e o filtro de texto fixado fica fora da parte recolhida." }
  - { text: Urgent, translation: Urgente }
  - { text: Atlas only, translation: Só Atlas }
  - { text: Stuck, translation: Travado }
  - { text: "Beside, as chips, while typing", translation: "Ao lado, como chips, durante a digitação" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "Os controles ficam em uma coluna na borda inicial. Só os filtros que você escolhe aparecem: adicione um pela lista da barra, e removê-lo o limpa. Cada filtro é um chip que nomeia seu valor e abre seu controle. O texto digitado é aplicado após uma pausa, e os dois limites de um número têm as legendas “depois de” e “antes de”. A escolha fica guardada neste navegador entre visitas. Abaixo do ponto de quebra, a barra abre em uma folha que vem de baixo." }
  - { text: "Beside at the end, applied by a button", translation: "Ao lado, no final, aplicado por um botão" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "Os controles ficam na borda final, e uma alteração espera por Aplicar, enquanto uma predefinição, Redefinir e a remoção de um chip de resumo são aplicados na hora. Vários responsáveis são digitados separados por vírgulas. A escolha fica guardada só para esta aba e sobrevive a um recarregamento." }
  - { text: Due by October, translation: Prazo até outubro }
  - { text: "Folded, starting open", translation: "Recolhível, começando aberto" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "Os controles se recolhem atrás de um botão que conta os filtros com valor, e começam expandidos. O filtro de texto fixado fica fora da parte recolhida, e os outros são adicionados pela lista da barra. Status começa em Em andamento; removê-lo limpa também esse padrão, e Redefinir o traz de volta. Os valores ficam guardados tanto no endereço quanto neste navegador, com o endereço prevalecendo, e o recolhimento que você escolhe é lembrado." }
  - { text: "Folded, starting closed", translation: "Recolhível, começando fechado" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "Recolhido de início. O filtro de texto fixado, Aplicar e Redefinir ficam fora da parte recolhida. O rótulo começa no seu padrão, bugs, até ser alterado, e Redefinir traz o padrão de volta." }
  - { text: In a dialog, translation: Em uma caixa de diálogo }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "Os controles abrem em uma caixa de diálogo pequena a partir de um botão que conta os filtros com valor, e fecham com Concluído. A caixa de diálogo aberta faz parte do endereço, então um link a abre. O filtro de texto fixado fica ao lado do botão, e chips resumem o que foi escolhido." }
  - { text: In a drawer, translation: Em uma gaveta }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "Os controles abrem em uma gaveta a partir da borda inicial, que um clique fora não fecha. Valores digitados são aplicados após uma pausa." }
  - { text: In a popover, translation: Em um balão }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "Os controles abrem em um cartão abaixo do botão, alinhado ao seu final; abaixo do ponto de quebra, em uma folha que vem de baixo." }

