kind: Telo.Application
metadata:
  name: ParentSourceChild
  version: 1.0.0
  description: >-
    Runs the application in its parent directory, named by the bare source `..`, and
    exits non-zero unless that application ran and exited cleanly.
imports:
  App: ../../../../
  Run: ../../../../../run
  Timer: ../../../../../timer
  Assert: ../../../../../assert
targets:
  - !ref parent
  - !ref verify
---
kind: App.Instance
metadata: { name: parent }
source: ..
---
kind: Run.Loop
metadata: { name: awaitParentExit }
condition: !cel "resources.parent.status.exitCode == null"
maxIterations: 200
steps:
  - { name: wait, invoke: { kind: Timer.Delay }, inputs: { duration: 20ms } }
---
kind: Telo.Sequence
metadata: { name: verify }
steps:
  - name: awaitExit
    invoke: !ref awaitParentExit
  - name: verifyExit
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "resources.parent.status.exitCode"
      expected: 0
