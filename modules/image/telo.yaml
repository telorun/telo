kind: Telo.Library
metadata:
  name: Image
  version: 0.11.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Data]
  description: >-
    Image processing for uploads and vision pipelines: resize a picture to fit a
    box before storing it or sending it to a model, with file-size and pixel
    limits enforced before decoding; make a solid-colour canvas; and draw
    labelled rectangles onto an image. Reads PNG, JPEG, WebP and GIF, and
    returns encoded PNG, JPEG or WebP bytes.
requires: { telo: ">=0.90.0" }
exports: { kinds: [Blank, Overlay, Fit] }
# Skia, through `@napi-rs/canvas`, for every platform its upstream release
# publishes. Its JavaScript inlines into the bundle; only the addon is staged and
# handed to the wrapper by path. The same release `pdf` stages.
native:
  - { name: canvas, format: napi, os: darwin, arch: amd64, path: ./native/darwin-amd64/skia.node }
  - { name: canvas, format: napi, os: darwin, arch: arm64, path: ./native/darwin-arm64/skia.node }
  - { name: canvas, format: napi, os: linux, arch: amd64, libc: gnu, path: ./native/linux-amd64-gnu/skia.node }
  - { name: canvas, format: napi, os: linux, arch: amd64, libc: musl, path: ./native/linux-amd64-musl/skia.node }
  - { name: canvas, format: napi, os: linux, arch: arm64, libc: gnu, path: ./native/linux-arm64-gnu/skia.node }
  - { name: canvas, format: napi, os: linux, arch: arm64, libc: musl, path: ./native/linux-arm64-musl/skia.node }
  - { name: canvas, format: napi, os: windows, arch: amd64, path: ./native/windows-amd64/skia.node }
  - { name: canvas, format: napi, os: windows, arch: arm64, path: ./native/windows-arm64/skia.node }
  - { name: canvas-icu, format: napi, os: windows, arch: amd64, path: ./native/windows-amd64/icudtl.dat }
  - { name: canvas-icu, format: napi, os: windows, arch: arm64, path: ./native/windows-arm64/icudtl.dat }
sources:
  canvas:
    version: 1.0.10
    url: https://registry.npmjs.org/@napi-rs/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/napi-rs-canvas.LICENSE]
    entries:
      ./notices/napi-rs-canvas.LICENSE:
        { upstream: canvas, member: package/LICENSE, sha256: 8802fecf9da4367bc23bcf20b21cc143785fc6c92b152f3fa7fbe6ce08d344d6, executable: false }
      ./native/darwin-amd64/skia.node:
        { upstream: canvas-darwin-x64, member: package/skia.darwin-x64.node, sha256: a1995c62e422e45b17bb3a64ce246112776c12f96bb6563be2697de5c66b3a61, executable: false }
      ./native/darwin-arm64/skia.node:
        { upstream: canvas-darwin-arm64, member: package/skia.darwin-arm64.node, sha256: 207921c48ce2f93b85548ffc1a1226d50d3e1c2cece96a711844828a62fdbabe, executable: false }
      ./native/linux-amd64-gnu/skia.node:
        { upstream: canvas-linux-x64-gnu, member: package/skia.linux-x64-gnu.node, sha256: eff464d8c283ad1e73e36c636d9ec9a6469ae34c3c04b298794735c89f9c863a, executable: false }
      ./native/linux-amd64-musl/skia.node:
        { upstream: canvas-linux-x64-musl, member: package/skia.linux-x64-musl.node, sha256: dd7ce0e30c270ef8f5fe7ca1905efb35ebeca52124631956a1e1da76a2972298, executable: false }
      ./native/linux-arm64-gnu/skia.node:
        { upstream: canvas-linux-arm64-gnu, member: package/skia.linux-arm64-gnu.node, sha256: 5baabaf23dfe6559b75db5661e91b476f8fc5291a6855d7292a3e24a545654e9, executable: false }
      ./native/linux-arm64-musl/skia.node:
        { upstream: canvas-linux-arm64-musl, member: package/skia.linux-arm64-musl.node, sha256: 7787bf4bff18a279dfdba877e8af113eddc57da10f14ef2fb2e5a9ab4d9bed01, executable: false }
      ./native/windows-amd64/skia.node:
        { upstream: canvas-win32-x64-msvc, member: package/skia.win32-x64-msvc.node, sha256: c067e5d5df2abd36789c4d371efc60ce0a29d204575f316345b57dcd2f4b74e7, executable: false }
      ./native/windows-amd64/icudtl.dat:
        { upstream: canvas-win32-x64-msvc, member: package/icudtl.dat, sha256: 9f48c7f9c7c94d516a14870707e910ab94d75ae640ff6842c4af53276cd26ebe, executable: false }
      ./native/windows-arm64/skia.node:
        { upstream: canvas-win32-arm64-msvc, member: package/skia.win32-arm64-msvc.node, sha256: 8d931edf8d0933abae7609c584cbda240a12211bb3fa7149f04badfe7dbd98e8, executable: false }
      ./native/windows-arm64/icudtl.dat:
        { upstream: canvas-win32-arm64-msvc, member: package/icudtl.dat, sha256: 9f48c7f9c7c94d516a14870707e910ab94d75ae640ff6842c4af53276cd26ebe, executable: false }
---
# Blank: a solid-color canvas → encoded image bytes. The seed of an image
# pipeline — compose diagrams with Image.Overlay, or use it as a hermetic test
# fixture instead of embedding base64 images.
kind: Telo.Definition
metadata:
  name: Blank
  description: Produces a solid-color image canvas of the given size, encoded as PNG/JPEG/WebP bytes.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/image.mjs&local_path=./nodejs/src/index.ts#blank]
throws:
  codes:
    ERR_INVALID_INPUT:
      description: >-
        width/height is not an integer between 1 and 16384, color is not a
        recognized CSS color, format is not png/jpeg/webp, or quality is not
        an integer between 1 and 100.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    examples:
      - { width: 120, height: 80 }
    properties:
      width:
        type: integer
        minimum: 1
        maximum: 16384
        description: Canvas width in pixels.
      height:
        type: integer
        minimum: 1
        maximum: 16384
        description: Canvas height in pixels.
      color:
        type: string
        description: CSS fill color. Takes precedence over the resource-level color.
      format:
        type: string
        enum: [ png, jpeg, webp ]
        description: Output image format. Takes precedence over the resource-level format.
      quality:
        type: integer
        minimum: 1
        maximum: 100
        description: Encoder quality for the lossy formats (jpeg/webp); ignored for png.
    required: [ width, height ]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      image:
        x-telo-type: Telo.Bytes
        description: The solid-color canvas, as image bytes in the chosen format.
      width: { type: integer, description: Canvas width in pixels (echoed back). }
      height: { type: integer, description: Canvas height in pixels (echoed back). }
      mediaType:
        type: string
        description: MIME type of the encoded image (image/png, image/jpeg, or image/webp).
    required: [ image, width, height, mediaType ]
    additionalProperties: false
schema:
  type: object
  properties:
    color:
      title: Color
      type: string
      default: "#FFFFFF"
      description: CSS fill color. Runtime inputs.color takes precedence when set.
    format:
      title: Format
      type: string
      enum: [ png, jpeg, webp ]
      default: png
      description: Output image format. Runtime inputs.format takes precedence when set.
    quality:
      title: Quality
      type: integer
      minimum: 1
      maximum: 100
      default: 80
      description: Encoder quality for the lossy formats (jpeg/webp); ignored for png.
  additionalProperties: false
---
# Overlay: image bytes + labelled rectangles → annotated image bytes. Shapes are
# drawn as given and clipped at the image edges (docs/overlay.md).
kind: Telo.Definition
metadata:
  name: Overlay
  description: Draws labelled rectangles onto an image and returns the annotated image as encoded bytes.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/image.mjs&local_path=./nodejs/src/index.ts#overlay]
throws:
  codes:
    ERR_INVALID_INPUT:
      description: >-
        image is not decodable as an image, a shape has non-finite coordinates
        or non-positive width/height, format is not png/jpeg/webp, or quality is
        not an integer between 1 and 100.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      image:
        x-telo-type: Telo.Bytes
        description: The image to draw on, as bytes (PNG, JPEG, or WebP — anything the canvas decoder reads).
      shapes:
        type: array
        minItems: 1
        items:
          type: object
          properties:
            x:
              type: number
              description: Left edge in pixels (top-left origin). May exceed the image bounds; the drawing is clipped.
            y:
              type: number
              description: Top edge in pixels (top-left origin). May exceed the image bounds; the drawing is clipped.
            width: { type: number, exclusiveMinimum: 0, description: Box width in pixels. }
            height: { type: number, exclusiveMinimum: 0, description: Box height in pixels. }
            label: { type: string, description: Optional tag drawn at the box's anchor corner. }
            color:
              type: string
              description: Optional per-shape override of the stroke (and label background) color.
          required: [ x, y, width, height ]
          additionalProperties: false
      format:
        type: string
        enum: [ png, jpeg, webp ]
        description: Output image format. Takes precedence over the resource-level format.
      quality:
        type: integer
        minimum: 1
        maximum: 100
        description: Encoder quality for the lossy formats (jpeg/webp); ignored for png.
    required: [ image, shapes ]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      image:
        x-telo-type: Telo.Bytes
        description: The annotated image, as image bytes in the chosen format.
      width:
        type: integer
        description: Image width in pixels (unchanged from the input).
      height:
        type: integer
        description: Image height in pixels (unchanged from the input).
      mediaType:
        type: string
        description: MIME type of the encoded image (image/png, image/jpeg, or image/webp).
    required: [ image, width, height, mediaType ]
    additionalProperties: false
schema:
  type: object
  examples:
    - stroke: { color: "#FF3B30", width: 3 }
      label: { color: "#FFFFFF", placement: top-left }
  properties:
    stroke:
      title: Stroke
      type: object
      properties:
        color:
          title: Color
          type: string
          default: "#FF3B30"
          description: CSS color of the rectangle outline (per-shape `color` overrides it).
        width:
          title: Width
          type: number
          exclusiveMinimum: 0
          default: 3
          description: Outline thickness in pixels.
      additionalProperties: false
    label:
      title: Label
      type: object
      properties:
        color:
          title: Color
          type: string
          default: "#FFFFFF"
          description: CSS color of the label text.
        background:
          title: Background
          type: string
          description: CSS color behind the label text. Defaults to the shape's stroke color.
        size:
          title: Size
          type: number
          exclusiveMinimum: 0
          default: 14
          description: Label font size in pixels.
        placement:
          title: Placement
          type: string
          enum: [ top-left, top-right, bottom-left, bottom-right ]
          default: top-left
          description: Which corner of the rectangle the label tab anchors to (drawn outside the box, clamped into the image).
      additionalProperties: false
    format:
      title: Format
      type: string
      enum: [ png, jpeg, webp ]
      default: png
      description: Output image format. Runtime inputs.format takes precedence when set.
    quality:
      title: Quality
      type: integer
      minimum: 1
      maximum: 100
      default: 80
      description: Encoder quality for the lossy formats (jpeg/webp); ignored for png.
  additionalProperties: false
---
# Fit: image bytes + a box → the image scaled down to fit it, re-encoded. Both
# limits are judged from the header before decoding (docs/fit.md).
kind: Telo.Definition
metadata:
  name: Fit
  description: >-
    Scales an image down to fit within a maximum width and height, keeping its
    aspect ratio and never enlarging it, then re-encodes it as PNG, JPEG or WebP
    with metadata stripped and its EXIF orientation applied. Oversized files and
    pixel counts are refused from the header before decoding. Returns the bytes,
    the final dimensions and the media type.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/image.mjs&local_path=./nodejs/src/index.ts#fit]
throws:
  codes:
    ERR_IMAGE_TOO_LARGE:
      description: >-
        The input is longer than `maxBytes`, or its header declares more pixels
        than `maxPixels`. Raised before anything is decoded.
      data:
        type: object
        additionalProperties: false
        required: [limit, max]
        properties:
          limit:
            type: string
            enum: [ maxBytes, maxPixels ]
            description: The limit that was exceeded.
          max: { type: integer, description: That limit's value on the resource. }
    ERR_UNSUPPORTED_IMAGE:
      description: >-
        The bytes are not a PNG, JPEG, WebP or GIF image that can be read: the
        signature is another format's, the header is truncated or malformed, or
        the body is corrupt or cut short and the decoder rejects it. A signature
        or header failure is raised before anything is decoded.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    examples:
      - image: !cel "steps.upload.result.bytes"
        maxWidth: 1568
        maxHeight: 1568
    properties:
      image:
        x-telo-type: Telo.Bytes
        description: The image to fit, as bytes — PNG, JPEG, WebP or GIF.
      maxWidth:
        type: integer
        minimum: 1
        maximum: 16384
        description: The widest the result may be, in pixels.
      maxHeight:
        type: integer
        minimum: 1
        maximum: 16384
        description: The tallest the result may be, in pixels.
      format:
        type: string
        enum: [ png, jpeg, webp ]
        description: Output image format. Takes precedence over the resource-level format.
      quality:
        type: integer
        minimum: 1
        maximum: 100
        description: Encoder quality for the lossy formats (jpeg/webp); ignored for png.
    required: [ image, maxWidth, maxHeight ]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      image:
        x-telo-type: Telo.Bytes
        description: The fitted image, as image bytes in the chosen format.
      width:
        type: integer
        description: Width of the result in pixels — at most `maxWidth`, and never more than the input's.
      height:
        type: integer
        description: Height of the result in pixels — at most `maxHeight`, and never more than the input's.
      mediaType:
        type: string
        description: MIME type of the encoded image (image/png, image/jpeg, or image/webp).
    required: [ image, width, height, mediaType ]
    additionalProperties: false
schema:
  type: object
  examples:
    - { format: jpeg, quality: 85, maxBytes: 10485760 }
  properties:
    format:
      title: Format
      type: string
      enum: [ png, jpeg, webp ]
      default: png
      description: Output image format. Runtime inputs.format takes precedence when set.
    quality:
      title: Quality
      type: integer
      minimum: 1
      maximum: 100
      default: 80
      description: Encoder quality for the lossy formats (jpeg/webp); ignored for png. Runtime inputs.quality takes precedence when set.
    maxBytes:
      title: Max bytes
      type: integer
      minimum: 1
      default: 26214400
      description: The longest input accepted, in bytes. A longer one fails with ERR_IMAGE_TOO_LARGE before its header is read.
    maxPixels:
      title: Max pixels
      type: integer
      minimum: 1
      default: 40000000
      description: The most pixels (width × height) an input's header may declare. More fails with ERR_IMAGE_TOO_LARGE before anything is decoded.
  additionalProperties: false
