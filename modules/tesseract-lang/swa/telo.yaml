kind: Telo.Library
metadata:
  name: TesseractLangSwa
  version: 0.5.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [AI]
  description: |
    Recognize Swahili text in images, offline: the trained model for reading
    printed Swahili (Latin script) with Tesseract optical character recognition, ready to
    hand to a recognizer beside any other languages a page mixes. Packaged from the
    integer-quantized best models of the tesseract-ocr project.
requires: { telo: ">=0.133.0" }
restrictions:
  - requires: { telo: ">=0.100.0" }
    reason: "`!module-path` naming a `sources:`-staged model counts as present in `telo check` and in release planning from pins only from 0.100.0."
imports: { TesseractModel: ../../tesseract-model }
exports: { resources: [swa] }
assets: [./tessdata/]
sources:
