  # Forms.
  - { text: Every control from the model, translation: Każda kontrolka z modelu }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "Bez zapisanych pól formularz rysuje jedną kontrolkę na właściwość, wybraną według jej schematu: pole tekstowe, listę dla wyliczenia, pola liczbowe, datę, datę z godziną, godzinę, wielowierszowe pole dla dokumentu, pole wyboru, opcje obok siebie dla listy z wyliczenia i wpisywane tagi dla listy słów. Opis jest podpowiedzią pod polem, a wartość domyślna wartością początkową." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "Każde pole jest sprawdzane względem modelu, gdy tylko zostanie dotknięte: długość tytułu, liczba osób, budżet w krokach po 50, pisownia słów kluczowych. Serwer odrzuca tytuł, który ma już inna prośba, a jego odpowiedź trafia na pole tytułu. To, co wpisano, jest zachowane w adresie i w tej przeglądarce — wszystko oprócz kodu wejścia, który model oznacza jako tylko do zapisu." }
  - { text: Each control chosen by hand, translation: Każda kontrolka wybrana ręcznie }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "Ta sama prośba z kontrolką zapisaną dla każdego pola: tytuł z kontrolką wyprowadzoną, rodzaj jako opcje obok siebie, kanały jako lista wielokrotnego wyboru, liczba osób na suwaku, pilność jako przełącznik, a słowa kluczowe jako tagi. To, co wpisano, jest zachowane tylko dla tej karty." }
  - { text: Requests received, translation: Otrzymane prośby }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "Ostatnie prośby wysłane przez oba formularze, odczytywane ponownie po każdym zapisie." }
  - { text: "Choices, pickers and dates", translation: "Wybory, selektory i daty" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "Rezerwacja osób do projektu. Projekt wybiera się z listy odczytanej z kolekcji projektów, każda opcja z kodem jako podpowiedzią. Prowadzącego wybiera się w oknie, wyszukując po nazwisku, spośród aktywnych osób o roli wybranej wyżej; wybór innej roli odczytuje opcje ponownie i zostawia prowadzącego tylko, jeśli wciąż pasuje. Recenzentów wybiera się w szufladzie, kilku naraz, a sponsora w dymku; sponsor zaczyna od domyślnego e-maila, pokazanego jako imię i nazwisko osoby dzięki jednemu zapytaniu. Pomocnicy są oferowani obok siebie, po trzech, z przyciskiem Więcej dla reszty. Wybrana osoba prowadzi do swojego e-maila." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "Okres to dwie daty z gotowymi zakresami, z tygodniami zaczynającymi się w niedzielę, na początku ustawiony na przyszły miesiąc i z ostrzeżeniem powyżej trzech miesięcy. Serwer odrzuca okres, który kończy się przed początkiem albo trwa dłużej niż rok, a jego odpowiedź trafia na pole okresu. Osoby wokół prowadzącego są pokazywane, gdy prowadzący zostanie wybrany, a adres miejsca tylko przy pracy na miejscu." }
  - { text: The project, translation: Projekt }
  - { text: "Which project, and who leads the work.", translation: "Który projekt i kto prowadzi pracę." }
  - { text: Around the lead, translation: Wokół prowadzącego }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "Kto recenzuje pracę, kto ją sponsoruje i kto pomaga." }
  - { text: When and where, translation: Kiedy i gdzie }
  - { text: Tomorrow, translation: Jutro }
  - { text: Next week, translation: Przyszły tydzień }
  - { text: This month, translation: Ten miesiąc }
  - { text: Next month, translation: Przyszły miesiąc }
  - { text: Next quarter, translation: Przyszły kwartał }
  - { text: Next year, translation: Przyszły rok }
  - { text: Bookings, translation: Rezerwacje }
  - { text: "The latest bookings, read again after every save.", translation: "Ostatnie rezerwacje, odczytywane ponownie po każdym zapisie." }

