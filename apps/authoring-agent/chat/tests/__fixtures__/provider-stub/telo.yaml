kind: Telo.Application
metadata:
  name: ProviderStub
  version: 1.0.0
  description: |
    Test fixture: a local stand-in for the OpenAI responses endpoint, so the
    agent's tests run whole turns offline and key-free. POST /v1/responses
    answers with a streamed response chosen by the request's text:
      - a naming call (instructions starting `You name conversations`)
        answers `"Stub title."` and a second line, and a summary call
        (`You summarize conversations`) answers `stub summary`; neither
        heeds the directives below, only its own: STUB_TITLE_FAIL /
        STUB_SUMMARY_FAIL refuse it with 400, STUB_SUMMARY_EMPTY completes
        it with no text, STUB_TITLE_CUT / STUB_SUMMARY_CUT end it
        `response.incomplete` (reason `max_output_tokens`) after part of its
        text — each with usage, and each with an `_ONCE` form that applies
        only to the first call of its kind carrying that marker —, and
        STUB_TITLE_SLOW holds a naming call like STUB_SLOW, and
        STUB_TITLE_LONG answers it with a 94-character line whose 80th
        character is the astral `😀`, and `STUB_TITLE_REPLY:<base64 of a
        UTF-8 text>` answers it with exactly that text;
      - a message containing STUB_FAIL is refused with 400 — with
        STUB_FAIL_ONCE, only until a request carries a continued turn's note
        (`TURN CONTINUED: the previous attempt`; the system prompt names the
        marker alone), so a continued turn completes; a message containing
        STUB_BREAK is refused with 400 once the request carries a tool result,
        likewise until a request carries a continued turn's note — a turn that
        fails after its tools ran;
      - a message containing STUB_SLOW is held until a test calls POST
        /release (which releases every request received so far) or the agent
        abandons the request, so a test can act while a turn is running — and
        so is a later request carrying that message as history;
      - a message containing STUB_TOOL asks for one `list_dir` call, and the
        request that carries its result gets a text reply;
      - a message containing `STUB_CALLS:<base64 of a JSON list of
        {name, arguments}>` asks for exactly those tool calls, and the request
        that carries their results gets a text reply;
      - a message containing STUB_LOOP asks for one `list_dir` call on every
        request, until one forbids tools (`tool_choice: "none"`), which gets
        the text reply `stub wrap-up`;
      - anything else gets a text reply.
    Every reply carries a reasoning item, so the agent records provider state.
    Every request body is kept, in order, and GET /requests returns them — what
    a test reads to see what the agent sent.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.34.0#sha256-tEXC4neT1MDjYn_AXb_9i-7glgeW6ACSImBVmNzNuQk
  PlainText: oci://ghcr.io/telorun/plain-text-codec@0.10.4#sha256-Z1My-TDPdE13s63NSi5rT0Qg0CZf-7tAXbJBRcBGCOQ
  Stream: oci://ghcr.io/telorun/stream@0.13.0#sha256-OAOZ21USu_5mBQ1IrThy73jG7gkqsWQ21s8Wh0FTaQc
  Sql: oci://ghcr.io/telorun/sql@0.25.0#sha256-x8UXPZbNmoCuldq7EAcotw6KfwZr9baCKrRX_8TKaYc
  SQLite: oci://ghcr.io/telorun/sqlite@0.7.0#sha256-iAGE4n-r6dEjTPbJQkAV65pRjILsJI47aderaurBVvs
  Timer: oci://ghcr.io/telorun/timer@0.8.3#sha256-OlGVb6Q4aFilkXVAiB9ZK6V0aF6l-Th1jHxzUuGnYZw
  Run: oci://ghcr.io/telorun/run@0.27.1#sha256-O1CdVvYs_O7Zj-PNQxMS3NdgWL6e8M2A0J9Wu0rTnIU
ports:
  http:
    env: PORT
    default: 18440
targets:
  - !ref schema
  - !ref server
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: SQLite.Schema
metadata: { name: schema }
connection: !ref db
migrations:
  create_requests:
    statement: "CREATE TABLE requests (id INTEGER PRIMARY KEY AUTOINCREMENT, body TEXT NOT NULL)"
  # Each POST /release: every request up to `through_id` is let go.
  create_releases:
    statement: "CREATE TABLE releases (through_id INTEGER NOT NULL)"
---
kind: Run.Sequence
metadata: { name: respond }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [body]
    properties:
      body: { type: object, additionalProperties: true }
steps:
  - name: record
    invoke: { kind: Sql.Query, connection: !ref db }
    inputs:
      sql: "INSERT INTO requests (body) VALUES (?) RETURNING id"
      bindings: [ !cel "json(inputs.body)" ]
  - name: request
    value: !cel "json(inputs.body)"
  # A naming or summary call is told apart by its instructions; the agent's
  # own directives never apply to it, only its own.
  - name: kind
    value: !cel >-
      has(inputs.body.instructions) && string(inputs.body.instructions).startsWith('You name conversations') ? 'title'
        : has(inputs.body.instructions) && string(inputs.body.instructions).startsWith('You summarize conversations') ? 'summary'
        : 'agent'
  # A naming or summary call's own directives; empty where its kind has none.
  - name: markers
    value: !cel >-
      steps.kind.result == 'title' ? {'fail': 'STUB_TITLE_FAIL', 'empty': '', 'cut': 'STUB_TITLE_CUT'}
        : {'fail': 'STUB_SUMMARY_FAIL', 'empty': 'STUB_SUMMARY_EMPTY', 'cut': 'STUB_SUMMARY_CUT'}
  # Earlier calls of this kind that carried each directive's `_ONCE` marker too.
  - name: earlier
    invoke: { kind: Sql.Query, connection: !ref db }
    inputs:
      sql: |
        SELECT COALESCE(SUM(body LIKE ?), 0) AS fail, COALESCE(SUM(body LIKE ?), 0) AS empty,
               COALESCE(SUM(body LIKE ?), 0) AS cut
        FROM requests WHERE id < ? AND body LIKE ?
      bindings:
        - !cel "'%' + steps.markers.result.fail + '_ONCE%'"
        - !cel "'%' + steps.markers.result.empty + '_ONCE%'"
        - !cel "'%' + steps.markers.result.cut + '_ONCE%'"
        - !cel "steps.record.result.rows[0].id"
        - !cel "steps.kind.result == 'title' ? '%You name conversations%' : '%You summarize conversations%'"
  # Which directives this call obeys: its marker is present, and its `_ONCE`
  # form is not, or no earlier call of this kind carried that.
  - name: obeys
    value: !cel >-
      cel.bind(req, steps.request.result, cel.bind(m, steps.markers.result, cel.bind(prior, steps.earlier.result.rows[0], {
        'fail': steps.kind.result != 'agent' && req.contains(m.fail)
          && !(req.contains(m.fail + '_ONCE') && int(prior.fail) > 0),
        'empty': steps.kind.result != 'agent' && m.empty != '' && req.contains(m.empty)
          && !(req.contains(m.empty + '_ONCE') && int(prior.empty) > 0),
        'cut': steps.kind.result != 'agent' && req.contains(m.cut)
          && !(req.contains(m.cut + '_ONCE') && int(prior.cut) > 0)
      })))
  - name: refused
    if: !cel >-
      steps.kind.result == 'agent'
        ? (steps.request.result.contains('STUB_FAIL')
            && !(steps.request.result.contains('STUB_FAIL_ONCE') && steps.request.result.contains('TURN CONTINUED: the previous attempt')))
          || (steps.request.result.contains('STUB_BREAK') && steps.request.result.contains('function_call_output')
            && !steps.request.result.contains('TURN CONTINUED: the previous attempt'))
        : steps.obeys.result.fail
    then:
      - name: refuse
        throw:
          code: ERR_STUB_REFUSED
          message: The stub refuses this request.
  # Held until released. An agent that abandons the request (an aborted turn)
  # disconnects, which cancels this handler and ends the hold with it.
  - name: slow
    if: !cel >-
      steps.kind.result == 'agent' ? steps.request.result.contains('STUB_SLOW')
        : steps.kind.result == 'title' && steps.request.result.contains('STUB_TITLE_SLOW')
    then:
      - name: released
        invoke: !ref releasedCount
        inputs:
          sql: "SELECT COUNT(*) AS n FROM releases WHERE through_id >= ?"
          bindings: [ !cel "steps.record.result.rows[0].id" ]
      - name: hold
        while: !cel "steps.released.result.rows[0].n == 0"
        do:
          - name: poll
            invoke: { kind: Timer.Delay }
            inputs: { duration: "50ms" }
          - name: released
            invoke: !ref releasedCount
            inputs:
              sql: "SELECT COUNT(*) AS n FROM releases WHERE through_id >= ?"
              bindings: [ !cel "steps.record.result.rows[0].id" ]
  - name: scripted
    value: !cel >-
      cel.bind(directive, regexExtract(steps.request.result, 'STUB_CALLS:[A-Za-z0-9+/=]+'),
        steps.kind.result != 'agent' || directive == '' || steps.request.result.contains('function_call_output') ? []
          : parseJson(base64Decode(directive.substring(11))))
  - name: titleReply
    value: !cel >-
      cel.bind(directive, regexExtract(steps.request.result, 'STUB_TITLE_REPLY:[A-Za-z0-9+/=]+'),
        directive == '' ? '' : base64Decode(directive.substring(17)))
  - name: events
    value: !cel >-
      [{'type': 'response.output_item.done',
        'item': {'type': 'reasoning', 'id': 'rs_stub', 'encrypted_content': 'stub-reasoning', 'summary': []}}]
      + (steps.kind.result == 'title'
          ? [{'type': 'response.output_text.delta', 'delta': steps.obeys.result.cut ? '"Stub ti'
              : steps.titleReply.result != '' ? steps.titleReply.result
              : steps.request.result.contains('STUB_TITLE_LONG') ? join(range(79).map(i, 'a'), '') + '😀' + ' and then more'
              : '"Stub title."\nA second line'}]
      : steps.kind.result == 'summary'
          ? (steps.obeys.result.empty ? []
              : [{'type': 'response.output_text.delta', 'delta': steps.obeys.result.cut ? 'stub sum' : 'stub summary'}])
      : size(steps.scripted.result) > 0
          ? steps.scripted.result.map(c, {'type': 'response.output_item.done',
              'item': {'type': 'function_call', 'id': 'fc_' + uuidv4(), 'call_id': 'call_' + uuidv4(),
                       'name': c.name, 'arguments': json(c.arguments)}})
      : steps.request.result.contains('STUB_LOOP')
          ? ('tool_choice' in inputs.body && inputs.body.tool_choice == 'none'
              ? [{'type': 'response.output_text.delta', 'delta': 'stub wrap-up'}]
              : [{'type': 'response.output_item.done',
                  'item': {'type': 'function_call', 'id': 'fc_' + uuidv4(), 'call_id': 'call_' + uuidv4(),
                           'name': 'list_dir', 'arguments': '{}'}}])
      : steps.request.result.contains('STUB_TOOL') && !steps.request.result.contains('function_call_output')
          ? [{'type': 'response.output_item.done',
              'item': {'type': 'function_call', 'id': 'fc_stub', 'call_id': 'call_' + uuidv4(),
                       'name': 'list_dir', 'arguments': '{}'}}]
          : [{'type': 'response.output_text.delta', 'delta': 'stub '},
             {'type': 'response.output_text.delta', 'delta': 'reply'}])
      + [steps.obeys.result.cut
          ? {'type': 'response.incomplete',
             'response': {'status': 'incomplete', 'incomplete_details': {'reason': 'max_output_tokens'}, 'output': [],
                          'usage': {'input_tokens': 10, 'output_tokens': 5, 'total_tokens': 15}}}
          : {'type': 'response.completed',
             'response': {'status': 'completed', 'output': [],
                          'usage': {'input_tokens': 10, 'output_tokens': 5, 'total_tokens': 15}}}]
  - name: frames
    invoke: { kind: Stream.Of }
    inputs:
      items: !cel "steps.events.result.map(e, 'data: ' + json(e) + '\\n\\n')"
outputs:
  output: !cel "steps.frames.result.output"
---
kind: Sql.Query
metadata: { name: releasedCount }
connection: !ref db
---
kind: Http.Api
metadata: { name: api }
routes:
  - request:
      path: /v1/responses
      method: POST
      schema:
        body: { type: object, additionalProperties: true }
    handler: !ref respond
    inputs:
      body: !cel "request.body"
    returns:
      - status: 200
        mode: stream
        content:
          text/event-stream:
            encoder: { kind: PlainText.Encoder }
    catches:
      - when: !cel "error.code == 'ERR_STUB_REFUSED'"
        status: 400
        content:
          application/json:
            body:
              error:
                message: !cel "error.message"
  # Lets go of every STUB_SLOW request received so far.
  - request:
      path: /release
      method: POST
    handler:
      kind: Sql.Command
      connection: !ref db
    inputs:
      sql: "INSERT INTO releases (through_id) SELECT COALESCE(MAX(id), 0) FROM requests"
    returns:
      - status: 200
        content:
          application/json:
            body:
              released: true
  - request:
      path: /requests
      method: GET
    handler:
      kind: Sql.Query
      connection: !ref db
    inputs:
      sql: "SELECT body FROM requests ORDER BY id"
    returns:
      - status: 200
        content:
          application/json:
            body:
              requests: !cel "result.rows.map(r, parseJson(r.body))"
---
kind: Http.Server
metadata: { name: server }
host: 127.0.0.1
port: !cel "ports.http"
mounts:
  - path: /
    mount: !ref api
