kind: Telo.Application
metadata:
  name: StarlarkDemo
  version: 1.0.0
  description: A demo showcasing a Starlark script run from flat `targets`.
imports:
  Starlark: oci://ghcr.io/telorun/starlark@0.13.3#sha256-wwKlLrktsd_3WTn92X2yyp1iHb_4r0qDMvsCfucdbQo
  Console: oci://ghcr.io/telorun/console@0.19.2#sha256-ZjIsY5rYTAJV3aoJuRkesOvHEjZV900PIgzQZq_91Tg
targets:
  - name: step1
    invoke: !ref exampleStarlarkScript
    inputs:
      value: 42
  - name: step2
    invoke: !ref Console.writeLine
    inputs:
      output: !interpolate |
        Evaluated starlark code.
        Result is: ${{ steps.step1.result.result }}
---
kind: Starlark.Script
metadata:
  name: exampleStarlarkScript
code: |
  def run(input):
    result = input["value"] * 2
    return {"result": result}
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      value: { type: number }
    required: [ value ]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      result: { type: number }
    required: [ result ]
