kind: Telo.Library
metadata:
  name: TesseractLangChr
  version: 0.2.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Recognize Cherokee text in images, offline: the trained model for reading
    printed Cherokee (Cherokee script) with Tesseract optical character recognition.
