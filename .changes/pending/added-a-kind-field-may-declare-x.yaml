units:
  analyzer: Added
body: "A kind field may declare `x-telo-eval: accessor-template`: an accessor whose
  value may also be a map or a list of accessor values at any depth, each leaf a plain
  chain or a literal. The controller receives a structure holding a chain as `{ map: {
  <key>: <binding> } }` / `{ list: [<binding>…] }` of its entries' bindings and one
  holding none as `{ value }`; each leaf is checked as an accessor at its own path, and
  a value that is not a plain chain is refused by `telo check` and at creation. Beside
  `x-telo-value-schema-from` the structure is judged against the type it names, a chain
  that may hold nothing admitted at a required member."
