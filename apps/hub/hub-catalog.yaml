# The keyed read side: "tell me about this module", as opposed to search's
# "which module should I use".
#
# Everything here is addressed by ref rather than ranked, serves a specific
# version rather than only the latest, and carries the full per-kind detail a
# search card has no room for — which is why it is its own library rather than a
# projection of the search queries.
kind: Telo.Library
metadata:
  name: HubCatalog
  description: >-
    Keyed reads over the discovery index: one module's metadata, kinds, an
    application's declared inputs and versions, the cached manifest text for a version, the
    definitions of named kinds with everything they reference — the built-in
    vocabulary included, at a chosen telo version — a one-line-per-module
    index of a publisher's libraries, the kinds implementing a contract, the ready-made instances of a kind, the modules importing a module, ref autocomplete, and how far a
    registration has got.
requires:
  # 0.83.0: `resources:` inputs on a library.
  # 0.87.0: a `resources:` entry constrained by an ABSTRACT kind satisfies the
  # slots that require it. An older runtime reports `!ref connection` as a kind
  # mismatch against `Sql.Connection` itself.
  # 0.123.0: a `throw` step's `displayMessage`, which 0.122.0 drops at dispatch.
  telo: ">=0.123.0"
imports:
  Sql: oci://ghcr.io/telorun/sql@0.28.1#sha256-ZlxQTTYQtAhK2aAyLRYMwBN-U4b8ww4ulu0SVnIxFu8
  Run: oci://ghcr.io/telorun/run@0.30.0#sha256-xce3zcKQZYXAuMPQqUW4R0avisqZWYowLDLeaP7wXkc
  S3: oci://ghcr.io/telorun/s3@0.8.0#sha256-utdJQwmumCl0orYETnVY1oA7ytOZuik8syMIRZ1t_8o
  PlainText: oci://ghcr.io/telorun/plain-text-codec@0.11.0#sha256-V8zjIxeI89VhzVcKOrOTqLq7AdsNh2n51k2avdcOh-k
  Yaml: oci://ghcr.io/telorun/yaml@0.11.0#sha256-KSC6vlR1yOvXgCUZzj6g4p0r_T-6SfMqQPLR_HQnktk
resources:
  connection:
    kind: Sql.Connection
    description: The database holding the indexed rows.
  bucketGet:
    kind: S3.Get
    description: Reads a cached `telo.yaml` back out of the manifest bucket.
variables:
  # The built-in vocabulary the hub tracks: the module every `Telo.<Kind>` names,
  # one version per telo release.
  builtinsRef:
    type: string
    default: oci://ghcr.io/telorun/telo
exports:
  resources:
    - moduleManifestText
    - kindDefinitions
    - libraryIndex
    - trackedModules
    - moduleDetail
    - moduleVersionList
    - implementations
    - instances
    - dependents
    - refSuggestions
    - registrationStatus
---
kind: Sql.Query
metadata:
  name: query
connection: !ref connection
---
kind: Yaml.Parse
metadata:
  name: parseYaml
---
# The names of the built-in vocabulary each JSON text may reach: every
# `telo://manifest#/$defs/<Name>` reference, every string that is exactly
# `Telo.<Name>` (a value type, among others), every `format:` value, and every
# zone attribute a zone annotation provides, requires or violates. A superset —
# a name that is no entry of the archive is dropped where the closure is taken.
# Read off the JSON rather than the YAML so a zone annotation's attributes are
# found by structure, whatever YAML style declared them.
kind: Run.Value
metadata:
  name: vocabularyNames
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      texts: { type: array, items: { type: string } }
    required: [texts]
value: !cel >-
  inputs.texts.map(j, distinct(
    regexExtractAll(j, 'telo://manifest#/\\$defs/[A-Za-z0-9_]+').map(x, regexReplace(x, '^.*/', ''))
    + regexExtractAll(j, '"Telo\\.[A-Za-z0-9_]+"').map(x, replace(x, '"', ''))
    + regexExtractAll(j, '"format":"[^"\\\\]*"').map(x, regexReplace(x, '^"format":"|"$', ''))
    + flatten(regexExtractAll(j, '"x-telo-(?:provides|violates)-zone":\\{(?:[^{}"]|"(?:[^"\\\\]|\\\\.)*")*\\}')
        .map(z, regexExtractAll(z, '[{,]"[^"\\\\]*":')
          .map(k, regexReplace(k, '^[{,]"|":$', '')).filter(k, k != 'key')))
    + flatten(regexExtractAll(j, '"x-telo-requires-zone":\\{(?:[^{}"]|"(?:[^"\\\\]|\\\\.)*")*\\}')
        .map(z, regexExtractAll(regexExtract(z, '"attributes":\\[[^\\]]*\\]'), '"[^"\\\\]*"')
          .filter(a, a != '"attributes"').map(a, replace(a, '"', ''))))))
---
# The built-in vocabulary a set of names reaches, at one telo version: each
# fragment, value type, zone attribute and format of that version's archive the
# names select, and — transitively — every one those name in turn (a fragment's
# `$ref`s, a zone attribute's `requires`). Each piece is cut out of the cached
# archive exactly as `telo builtins <name>` prints it — the section line, then
# the entry's block — relying on the renderer's fixed layout
# (`kernel/specs/builtin-vocabulary.md`): the sections at column 0 of the root
# document, each entry at column 2 with its body indented further.
kind: Run.Sequence
metadata:
  name: builtinVocabulary
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      # A version of the built-in vocabulary the hub tracks.
      version: { type: string }
      names: { type: array, items: { type: string } }
    required: [version, names]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      pieces: { type: array, items: { type: string } }
    required: [pieces]
steps:
  - name: meta
    invoke: !ref query
    inputs:
      sql: >-
        SELECT mv.manifest_key FROM module_versions mv
        JOIN modules m ON m.id = mv.module_id
        WHERE m.ref = $1 AND mv.version = $2
      bindings:
        - !cel "variables.builtinsRef"
        - !cel "inputs.version"
  - name: fetch
    invoke: !ref bucketGet
    inputs:
      key: !cel "steps.meta.result.rows.size() > 0 ? steps.meta.result.rows[0].manifest_key : '__not_found__'"
  - name: decode
    invoke: { kind: PlainText.Decoder }
    inputs:
      input: !cel "steps.fetch.result.output"
  - name: root
    value: !cel "split(steps.decode.result.text, '\\n---\\n')[0] + '\\n'"
  - name: parsedRoot
    invoke: !ref parseYaml
    inputs:
      text: !cel "steps.root.result"
  - name: pieces
    value: !cel >-
      flatten(regexExtractAll(steps.root.result,
          '^"?(?:\\$defs|valueTypes|zoneAttributes|formats)"?:\\n(?: [^\\n]*\\n)*', 'm')
        .map(s, cel.bind(header, regexGroups(s, '^([^\\n]*)\\n')[0],
          regexExtractAll(s, '^  \\S[^\\n]*:\\n(?:   [^\\n]*\\n)*', 'm').map(e,
            cel.bind(key, regexGroups(e, '^  (\\S[^\\n]*):\\n')[0],
              {'section': replace(trimSuffix(header, ':'), '"', ''),
               'name': key.startsWith('"') ? string(parseJson(key)) : key,
               'text': header + '\n' + e})))))
  - name: reaches
    invoke: !ref vocabularyNames
    inputs:
      texts: !cel >-
        steps.pieces.result.map(p, json(steps.parsedRoot.result.docs[0][p.section][p.name]))
  # The transitive closure of a graph: CEL has no recursion, so the walk is a
  # recursive query over the graph handed to it as one JSON parameter.
  - name: closure
    invoke: !ref query
    inputs:
      sql: >-
        WITH RECURSIVE graph AS (
          SELECT g->>'name' AS name, g->'reaches' AS reaches
          FROM jsonb_array_elements($1::jsonb) AS g
        ), reached(name) AS (
          SELECT n FROM jsonb_array_elements_text($2::jsonb) AS n
          UNION
          SELECT r FROM reached c
          JOIN graph g ON g.name = c.name
          CROSS JOIN LATERAL jsonb_array_elements_text(g.reaches) AS r
        )
        SELECT name FROM reached
      bindings:
        - !cel >-
          json(enumerate(steps.pieces.result).map(e, {'name': e.value.name,
            'reaches': steps.reaches.result[e.index]
              + (e.value.section == 'zoneAttributes'
                  ? steps.parsedRoot.result.docs[0].zoneAttributes[e.value.name].?requires.orValue([])
                  : [])}))
        - !cel "json(inputs.names)"
outputs:
  # In archive order.
  pieces: !cel >-
    steps.pieces.result
      .filter(p, steps.closure.result.rows.exists(r, r.name == p.name))
      .map(p, p.text)
---
# The cached telo.yaml for one version. A missing row falls back to a sentinel
# key, so the bucket's own 404 is what surfaces — one not-found path rather than
# two that can disagree.
kind: Run.Sequence
metadata:
  name: moduleManifestText
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      ref: { type: string }
      version: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      text: { type: string }
    required: [text]
steps:
  - name: resolve
    invoke: !ref query
    inputs:
      sql: >-
        SELECT mv.manifest_key FROM module_versions mv
        JOIN modules m ON m.id = mv.module_id
        WHERE m.ref = $1
          AND (($2 = 'latest' AND mv.version = m.latest_version) OR mv.version = $2)
        LIMIT 1
      bindings:
        - !cel "inputs.ref"
        - !cel "inputs.version"
  - name: fetch
    invoke: !ref bucketGet
    inputs:
      key: !cel "steps.resolve.result.rows.size() > 0 ? steps.resolve.result.rows[0].manifest_key : '__not_found__'"
  - name: decode
    invoke: { kind: PlainText.Decoder }
    inputs:
      input: !cel "steps.fetch.result.output"
outputs:
  text: !cel "steps.decode.result.text"
---
# The definitions of named kinds of ONE module version, as the manifest wrote
# them: each asked kind's document, every named shape and local parent kind it
# reaches (three levels deep), and nothing else — no controller of another kind,
# no sibling the caller did not ask about. Documents are cut out of the cached
# manifest text rather than parsed and written back, so a tag, a comment and a
# key order arrive exactly as the author left them.
#
# `parents` names the kinds in OTHER modules that an included kind extends and
# takes fields from: a kind with no `base:` is authored against its parent's
# schema merged with its own, so the parent's definition is part of the answer
# and the caller of this sequence fetches it next. A `Telo.<Kind>` parent is
# one of them, owned by the built-in vocabulary.
#
# `vocabulary` names what the selected documents may reach of the built-in
# vocabulary — its fragments, value types, zone attributes and formats — which
# the caller resolves at the telo version it was asked for, since a built-in
# reference means the telo that runs the manifest, not this module's floor.
kind: Run.Sequence
metadata:
  name: moduleKindDefinitions
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      ref: { type: string }
      version: { type: string }
      names: { type: array, items: { type: string } }
      # Read the latest version when `version` is not tracked: a parent kind is
      # asked for at the version its child pins, which the hub may never have
      # ingested, and the latest definition is then the nearest one it holds.
      orLatest: { type: boolean, default: false }
      # Keep what says how a kind is implemented, and follow a `base:` kind's
      # parent too: what debugging an inherited kind needs to read.
      implementation: { type: boolean, default: false }
      # Follow every named shape and parent three levels deep, rather than
      # answering the asked kinds and their direct local parents and listing the
      # rest in `notIncluded`.
      closure: { type: boolean, default: false }
    required: [ref, version, names]
steps:
  - name: meta
    invoke: !ref query
    inputs:
      sql: >-
        SELECT mv.version, mv.manifest_key, COALESCE(mv.integrity, '') AS integrity,
               mv.module_name, m.transport,
               COALESCE(mv.root_kind, '') AS root_kind,
               (SELECT COALESCE(json_agg(rk.name ORDER BY rk.name), '[]'::json)
                FROM resource_kinds rk
                WHERE rk.module_id = mv.module_id AND rk.version = mv.version AND rk.exported)
                 AS exported,
               (SELECT COALESCE(json_agg(json_build_object(
                         'name', rk.name, 'ref', rk.extends_ref, 'kind', rk.extends_kind)), '[]'::json)
                FROM resource_kinds rk
                WHERE rk.module_id = mv.module_id AND rk.version = mv.version
                  AND rk.extends_kind <> '')
                 AS parents
        FROM module_versions mv
        JOIN modules m ON m.id = mv.module_id
        WHERE m.ref = $1
          AND (mv.version = $2 OR (($2 = 'latest' OR $3) AND mv.version = m.latest_version))
        ORDER BY (mv.version = $2) DESC
        LIMIT 1
      bindings:
        - !cel "inputs.ref"
        - !cel "inputs.version"
        - !cel "inputs.orLatest"
  - name: tracked
    if: !cel "steps.meta.result.rows.size() > 0"
    then:
      - name: fetch
        invoke: !ref bucketGet
        inputs:
          key: !cel "steps.meta.result.rows[0].manifest_key"
      - name: decode
        invoke: { kind: PlainText.Decoder }
        inputs:
          input: !cel "steps.fetch.result.output"
      # One entry per type document: a kind, an abstract, a need type or a
      # named shape. What says how a kind is IMPLEMENTED — its controllers, its
      # template body, its `base:` mapping — is cut from the text: a caller
      # declaring a resource of the kind writes none of it. A published manifest
      # separates documents with repeated `---` lines, so a leading run of them
      # is dropped too.
      - name: docs
        value: !cel >-
          split('\n' + steps.decode.result.text, '\n---\n')
            .map(c, {'text': c,
                     'kind': regexGroups(c, '^kind:[ \t]*["\']?([^\\s"\']+)', 'm'),
                     'name': regexGroups(c, '^metadata:[ \t]*(?:\\{[ \t]*|\n[ \t]+)name:[ \t]*["\']?([A-Za-z0-9_]+)', 'm')})
            .filter(d, size(d.kind) > 0 && size(d.name) > 0
                       && d.kind[0] in ['Telo.Definition', 'Telo.Abstract', 'Telo.NeedType', 'Telo.JsonSchema'])
            .map(d, {'text': cel.bind(body, regexReplace(trim(d.text), '^(?:---[ \t]*\n\\s*)+', '') + '\n',
                       trim(inputs.implementation ? body : regexReplace(body,
                         '^(?:controllers|resources|invoke|run|provide|targets|base):.*\n(?:(?:[ \t]+.*|[ \t]*-.*|[ \t]*)\n)*',
                         '', 'm'))),
                     'name': d.name[0],
                     'based': size(regexGroups(d.text, '^(base):', 'm')) > 0,
                     'reaches': distinct(
                       regexExtractAll(d.text, '(?:!ref[ \t]+|telo://Self/|telo:[A-Za-z0-9_]+/|Self\\.)[A-Z][A-Za-z0-9_]*')
                         .map(x, regexReplace(x, '^.*[ \t/.]', ''))
                       + steps.meta.result.rows[0].parents
                           .filter(p, p.name == d.name[0] && p.ref == inputs.ref).map(p, p.kind))})
      - name: wanted1
        value: !cel >-
          distinct(inputs.names + flatten(steps.docs.result.filter(d, d.name in inputs.names).map(d, d.reaches)))
      - name: wanted2
        value: !cel >-
          distinct(steps.wanted1.result
            + flatten(steps.docs.result.filter(d, d.name in steps.wanted1.result).map(d, d.reaches)))
      - name: wanted3
        value: !cel >-
          distinct(steps.wanted2.result
            + flatten(steps.docs.result.filter(d, d.name in steps.wanted2.result).map(d, d.reaches)))
      # The asked kinds lead, then what they reach in manifest order: a reader
      # that cuts the answer short loses the shapes, never the kinds it asked for.
      - name: localParents
        value: !cel >-
          distinct(steps.meta.result.rows[0].parents
            .filter(p, p.name in inputs.names && p.ref == inputs.ref).map(p, p.kind))
      - name: selected
        value: !cel >-
          steps.docs.result.filter(d, d.name in inputs.names)
            + steps.docs.result.filter(d, !(d.name in inputs.names)
                && d.name in (inputs.closure ? steps.wanted3.result : steps.localParents.result))
      # What the included documents reach and the answer leaves out, with the
      # size of each, so a caller names exactly the ones it needs next.
      - name: notIncluded
        value: !cel >-
          cel.bind(reachedNames, distinct(flatten(steps.selected.result.map(d, d.reaches))),
            steps.docs.result
              .filter(d, d.name in reachedNames && !steps.selected.result.exists(s, s.name == d.name))
              .map(d, {'name': d.name, 'bytes': size(d.text)}))
      - name: reaching
        if: !cel "size(steps.selected.result) > 0"
        then:
          - name: parsed
            invoke: !ref parseYaml
            inputs:
              text: !cel "join(steps.selected.result.map(d, d.text), '\\n---\\n')"
          - name: names
            invoke: !ref vocabularyNames
            inputs:
              texts: !cel "[json(steps.parsed.result.docs)]"
  # Not at that version: whether the hub tracks the module at all, so the answer
  # can tell an unknown ref from an unknown version of a known one.
  - name: untracked
    if: !cel "steps.meta.result.rows.size() == 0"
    then:
      - name: versions
        invoke: !ref query
        inputs:
          sql: >-
            SELECT mv.version
            FROM module_versions mv
            JOIN modules m ON m.id = mv.module_id
            WHERE m.ref = $1
            ORDER BY version_sort_key(mv.version) DESC NULLS LAST, mv.version ASC
          bindings:
            - !cel "inputs.ref"
outputs:
  ref: !cel "inputs.ref"
  found: !cel "'selected' in steps"
  asked: !cel "inputs.names"
  askedVersion: !cel "inputs.version"
  # Newest first; empty unless the module is tracked but not at the asked version.
  trackedVersions: !cel "'versions' in steps ? steps.versions.result.rows.map(r, r.version) : []"
  version: !cel "'selected' in steps ? steps.meta.result.rows[0].version : ''"
  name: !cel "'selected' in steps ? steps.meta.result.rows[0].module_name : ''"
  application: !cel "'selected' in steps && steps.meta.result.rows[0].root_kind == 'Application'"
  # The built-in vocabulary itself: no import names it.
  builtin: !cel "'selected' in steps && steps.meta.result.rows[0].root_kind == 'Builtins'"
  vocabulary: !cel "'names' in steps ? steps.names.result[0] : []"
  # What an `imports:` entry holds for exactly this version: an OCI ref pins by
  # version and, when the hub knows it, by integrity; any other transport is one
  # fixed location and takes neither.
  importRef: !cel >-
    !('selected' in steps) ? ''
      : steps.meta.result.rows[0].transport != 'oci' ? inputs.ref
      : inputs.ref + '@' + steps.meta.result.rows[0].version
          + (steps.meta.result.rows[0].integrity == '' ? '' : '#' + steps.meta.result.rows[0].integrity)
  exported: !cel "'selected' in steps ? steps.meta.result.rows[0].exported : []"
  definitions: !cel "'selected' in steps ? steps.selected.result.map(d, d.text) : []"
  notIncluded: !cel "'selected' in steps ? steps.notIncluded.result : []"
  # Each parent is named at the version this module's own `imports:` pins it
  # at — the definition the child was written against — or `latest` where the
  # import carries no version.
  #
  # Asked for, and no type document of this version carries the name.
  missing: !cel >-
    'selected' in steps
      ? inputs.names.filter(n, !steps.docs.result.exists(d, d.name == n))
      : inputs.names
  parents: !cel >-
    'selected' in steps
      ? steps.meta.result.rows[0].parents
          .filter(p, p.ref != '' && p.ref != inputs.ref
                     && steps.selected.result.exists(d, d.name == p.name
                                                        && (inputs.implementation || !d.based)))
          .map(p, {'ref': p.ref, 'kind': p.kind,
                   'version': cel.bind(pin, regexGroups(steps.decode.result.text,
                       replace(replace(p.ref, '.', '[.]'), '+', '[+]') + '@([0-9][0-9A-Za-z.+-]*)'),
                     size(pin) > 0 ? pin[0] : 'latest')})
      : []
---
kind: Run.Projection
metadata:
  name: definitionsByModule
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      requests:
        type: array
        items:
          type: object
          properties:
            ref: { type: string }
            version: { type: string }
            names: { type: array, items: { type: string } }
            orLatest: { type: boolean }
            implementation: { type: boolean }
            closure: { type: boolean }
          required: [ref, version, names]
    required: [requests]
collection: !cel "inputs.requests"
steps:
  - name: module
    invoke: !ref moduleKindDefinitions
    inputs:
      ref: !cel "item.ref"
      version: !cel "item.version"
      names: !cel "item.names"
      orLatest: !cel "item.?orLatest.orValue(false)"
      implementation: !cel "item.?implementation.orValue(false)"
      closure: !cel "item.?closure.orValue(false)"
outputs:
  ref: !cel "steps.module.result.ref"
  found: !cel "steps.module.result.found"
  asked: !cel "steps.module.result.asked"
  askedVersion: !cel "steps.module.result.askedVersion"
  trackedVersions: !cel "steps.module.result.trackedVersions"
  version: !cel "steps.module.result.version"
  name: !cel "steps.module.result.name"
  application: !cel "steps.module.result.application"
  builtin: !cel "steps.module.result.builtin"
  vocabulary: !cel "steps.module.result.vocabulary"
  importRef: !cel "steps.module.result.importRef"
  exported: !cel "steps.module.result.exported"
  definitions: !cel "steps.module.result.definitions"
  notIncluded: !cel "steps.module.result.notIncluded"
  missing: !cel "steps.module.result.missing"
  parents: !cel "steps.module.result.parents"
---
# The definitions a caller needs to WRITE resources of the kinds it names, in
# one call across modules: per module the exact `imports:` value, the asked
# kinds' documents with the shapes they reach, and — in `inherited` — the kinds
# of other modules those kinds extend, two levels up. A kind is named by its
# owning module's ref and its suffix; an alias-qualified name is read by its
# suffix, since an alias is the caller's own choice.
#
# Everything built in is read at ONE telo version — `telo`, else a version asked
# for on the built-in vocabulary's own ref, else the latest tracked: a built-in
# reference means the telo that runs the manifest, not the declaring module's
# floor. That covers the vocabulary's own kinds asked for or reached as a
# `Telo.<Kind>` parent, and `builtins`, every fragment, value type, zone
# attribute and format a returned document names, transitively. A version the
# hub does not track is refused, naming the ones it does.
#
# `text` is the whole answer as the `get_kinds` tool prints it.
kind: Run.Sequence
metadata:
  name: kindDefinitions
throws:
  - code: ERR_UNKNOWN_TELO_VERSION
    description: The telo version asked for is not a version of the built-in vocabulary the hub tracks.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      kinds:
        type: array
        items:
          type: object
          properties:
            ref: { type: string }
            kind: { type: string }
            version: { type: string }
          required: [ref, kind]
      # A telo version, or '' for the latest the hub tracks.
      telo: { type: string, default: "" }
      implementation: { type: boolean, default: false }
      closure: { type: boolean, default: false }
    required: [kinds]
steps:
  - name: teloVersions
    invoke: !ref query
    inputs:
      sql: >-
        SELECT mv.version, mv.version = m.latest_version AS latest
        FROM module_versions mv
        JOIN modules m ON m.id = mv.module_id
        WHERE m.ref = $1
        ORDER BY version_sort_key(mv.version) DESC NULLS LAST, mv.version ASC
      bindings:
        - !cel "variables.builtinsRef"
  - name: teloAsked
    value: !cel >-
      inputs.telo != '' ? inputs.telo
        : cel.bind(v, inputs.kinds.exists(k, k.ref == variables.builtinsRef)
                        ? inputs.kinds.filter(k, k.ref == variables.builtinsRef)[0].?version.orValue('')
                        : '',
            v == 'latest' ? '' : v)
  - name: teloGate
    if: !cel >-
      steps.teloAsked.result != ''
        && !steps.teloVersions.result.rows.exists(r, r.version == steps.teloAsked.result)
    then:
      - name: refuseTelo
        if: !cel "steps.teloVersions.result.rows.size() == 0"
        then:
          - name: refuseUntracked
            throw:
              code: ERR_UNKNOWN_TELO_VERSION
              displayMessage: "telo {$telo} is not a version of the built-in vocabulary ({$builtinsRef}) this hub tracks; it tracks none yet"
              data:
                telo: !cel "steps.teloAsked.result"
                builtinsRef: !cel "variables.builtinsRef"
        else:
          - name: refuseUnknown
            throw:
              code: ERR_UNKNOWN_TELO_VERSION
              displayMessage: "telo {$telo} is not a version of the built-in vocabulary ({$builtinsRef}) this hub tracks; it tracks {$tracked}"
              data:
                telo: !cel "steps.teloAsked.result"
                builtinsRef: !cel "variables.builtinsRef"
                tracked: !cel "join(steps.teloVersions.result.rows.map(r, r.version), ', ')"
  - name: telo
    value: !cel >-
      steps.teloAsked.result != '' ? steps.teloAsked.result
        : (steps.teloVersions.result.rows.exists(r, r.latest)
            ? steps.teloVersions.result.rows.filter(r, r.latest)[0].version : '')
  - name: asked
    invoke: !ref definitionsByModule
    inputs:
      requests: !cel >-
        distinct(inputs.kinds.map(k, k.ref)).map(ref, {
          'ref': ref,
          'version': ref == variables.builtinsRef
            ? (steps.telo.result != '' ? steps.telo.result : 'latest')
            : cel.bind(v, inputs.kinds.filter(k, k.ref == ref)[0].?version.orValue(''),
                v == '' ? 'latest' : v),
          'implementation': inputs.implementation, 'closure': inputs.closure,
          'names': distinct(inputs.kinds.filter(k, k.ref == ref)
                              .map(k, regexReplace(k.kind, '^.*\\.', '')))})
  - name: parents
    invoke: !ref definitionsByModule
    inputs:
      requests: !cel >-
        distinct(flatten(steps.asked.result.map(m, m.parents)).map(p, p.ref)).map(ref, {
          'ref': ref, 'orLatest': true, 'implementation': inputs.implementation, 'closure': inputs.closure,
          'version': ref == variables.builtinsRef
            ? (steps.telo.result != '' ? steps.telo.result : 'latest')
            : flatten(steps.asked.result.map(m, m.parents)).filter(p, p.ref == ref)[0].version,
          'names': distinct(flatten(steps.asked.result.map(m, m.parents))
                              .filter(p, p.ref == ref).map(p, p.kind))})
  - name: grandparents
    invoke: !ref definitionsByModule
    inputs:
      requests: !cel >-
        distinct(flatten(steps.parents.result.map(m, m.parents)).map(p, p.ref)).map(ref, {
          'ref': ref, 'orLatest': true, 'implementation': inputs.implementation, 'closure': inputs.closure,
          'version': ref == variables.builtinsRef
            ? (steps.telo.result != '' ? steps.telo.result : 'latest')
            : flatten(steps.parents.result.map(m, m.parents)).filter(p, p.ref == ref)[0].version,
          'names': distinct(flatten(steps.parents.result.map(m, m.parents))
                              .filter(p, p.ref == ref).map(p, p.kind))})
  - name: reached
    value: !cel >-
      distinct(flatten((steps.asked.result + steps.parents.result + steps.grandparents.result)
        .filter(m, m.found).map(m, m.vocabulary)))
  - name: vocabulary
    if: !cel "steps.telo.result != '' && size(steps.reached.result) > 0"
    then:
      - name: pieces
        invoke: !ref builtinVocabulary
        inputs:
          version: !cel "steps.telo.result"
          names: !cel "steps.reached.result"
  - name: builtins
    value: !cel "'pieces' in steps ? steps.pieces.result.pieces : []"
outputs:
  modules: !cel "steps.asked.result"
  inherited: !cel "steps.parents.result + steps.grandparents.result"
  # The telo version every built-in in this answer was read at; '' when the hub
  # tracks no built-in vocabulary.
  telo: !cel "steps.telo.result"
  builtins: !cel "steps.builtins.result"
  isError: !cel "steps.asked.result.all(m, !m.found)"
  # Per module, the line its `imports:` entry takes, or — for the built-in
  # vocabulary, which nothing imports — the telo it was read at; then the
  # documents. The vocabulary's fragments, value types, zone attributes and
  # formats close the answer, under the telo version they were read at.
  text: !cel >-
    size(steps.asked.result) == 0
      ? 'pass `kinds`: a list of { ref, kind } naming at least one kind'
      : join((steps.asked.result.map(m, {'m': m, 'inherited': false})
            + (steps.parents.result + steps.grandparents.result).map(m, {'m': m, 'inherited': true})).map(e,
          !e.m.found
            ? (e.m.ref == variables.builtinsRef
                ? '# The built-in vocabulary (' + e.m.ref + ') is not tracked by this hub yet (asked for: '
                    + join(e.m.asked, ', ') + ').\n'
                : size(e.m.trackedVersions) > 0
                ? '# ' + e.m.ref + ' is tracked by the hub, but not at version ' + e.m.askedVersion
                    + ' (asked for: ' + join(e.m.asked, ', ') + '). Its latest version is '
                    + e.m.trackedVersions[0] + '; omit `version` to read the latest, or pass one of: '
                    + join(e.m.trackedVersions, ', ') + '.\n'
                : '# ' + e.m.ref + ' is not tracked by the hub (asked for: ' + join(e.m.asked, ', ')
                    + '). Resolve the ref with suggest_module_refs.\n')
          : e.m.application
            ? '# ' + e.m.ref + ' is an application: it is run by pinned ref, never imported.\n'
          : (e.m.builtin
              ? '# Telo — built in to telo ' + e.m.version
                  + ': write no import; name these kinds `Telo.<Kind>` (the prefix is fixed, not an alias).\n'
                  + (e.inherited ? '# Reached through `extends`: a kind above takes these fields too.\n' : '')
              : '# ' + e.m.name
                  + (e.inherited ? ' — reached through `extends`: a kind above takes these fields too\n' : '\n')
                  + '# imports:\n#   ' + e.m.name + ': ' + e.m.importRef + '\n')
              + (size(e.m.missing) > 0
                  ? '# NOT DEFINED by this module: ' + join(e.m.missing, ', ')
                      + '. It exports: ' + join(e.m.exported, ', ') + '\n'
                  : '')
              + join(e.m.definitions.map(d, '---\n' + d + '\n'), '')
              + (size(e.m.notIncluded) > 0
                  ? '# Reached, not included: '
                      + join(e.m.notIncluded.map(n, n.name + ' (' + string(n.bytes) + ' B)'), ', ')
                      + '. Fetch only the ones you need by naming them in `kinds`.\n'
                  : ''))
        + (size(steps.builtins.result) > 0
            ? ['# Telo — built in to telo ' + steps.telo.result
                + ': the schema fragments, value types, zone attributes and formats the definitions above name; write no import.\n'
                + join(steps.builtins.result.map(p, '---\n' + p), '')]
            : [])
        + (steps.telo.result == '' && size(steps.reached.result) > 0
            ? ['# The built-in vocabulary (' + variables.builtinsRef + ') is not tracked by this hub yet, so no '
                + 'schema fragment, value type, zone attribute or format the definitions above may name is included.\n']
            : []), '\n')
---
# One line per library a publisher ships, at its latest version: what it is
# called, what it is for (the first sentence of its description, cut at 160
# characters), and the kinds and ready-made instances it exports. The
# whole of a standard library in a few kilobytes — what a caller reads ONCE to
# know what exists, so that naming a need costs no search. Applications are left
# out: nothing here is imported from one. The built-in vocabulary is listed with
# `builtin: true`, since its kinds are written `Telo.<Kind>` with no import.
kind: Run.Sequence
metadata:
  name: libraryIndex
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      # The publisher as the hub derives it (`ghcr.io/telorun`), or '' for every
      # tracked library.
      publisher: { type: string }
steps:
  - name: rows
    invoke: !ref query
    inputs:
      sql: >-
        SELECT m.ref, COALESCE(mv.module_name, '') AS name,
               (SELECT CASE WHEN length(s) > 160 THEN left(s, 159) || '…' ELSE s END
                FROM (SELECT split_part(regexp_replace(COALESCE(mv.description, ''), '\s+', ' ', 'g'),
                                        '. ', 1) AS s) first_sentence) AS summary,
               (SELECT COALESCE(json_agg(rk.name ORDER BY rk.name), '[]'::json)
                FROM resource_kinds rk
                WHERE rk.module_id = mv.module_id AND rk.version = mv.version AND rk.exported)
                 AS kinds,
               (SELECT COALESCE(json_agg(mr.name ORDER BY mr.name), '[]'::json)
                FROM module_resources mr
                WHERE mr.module_id = mv.module_id AND mr.version = mv.version)
                 AS instances,
               mv.root_kind IS NOT DISTINCT FROM 'Builtins' AS builtin
        FROM modules m
        JOIN module_versions mv ON mv.module_id = m.id AND mv.version = m.latest_version
        WHERE mv.root_kind IS DISTINCT FROM 'Application'
          AND COALESCE(mv.deprecated_reason, '') = ''
          AND ($1 = '' OR module_publisher(m.ref, m.transport) = $1)
        ORDER BY m.ref
      bindings:
        - !cel "inputs.publisher"
outputs:
  libraries: !cel >-
    steps.rows.result.rows
      .filter(r, size(r.kinds) > 0 || size(r.instances) > 0)
      .map(r, compact({'ref': r.ref, 'name': r.name, 'summary': r.summary,
                       'builtin': r.builtin ? dyn(true) : dyn(null),
                       'kinds': size(r.kinds) == 0 ? dyn(null) : dyn(r.kinds),
                       'instances': size(r.instances) == 0 ? dyn(null) : dyn(r.instances)}))
---
# THE definition of a module the catalog answers for: one whose latest version's
# row exists. `/module` and `/modules` both read it, so the listing and the keyed
# read can never disagree about which refs exist. `seq` is the row id — assigned
# once and never reused — so paging by it is stable while rows are added.
kind: Run.Sequence
metadata:
  name: trackedModules
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      # '' means every ref.
      ref: { type: string }
      after: { type: integer, minimum: 0 }
      limit: { type: integer, minimum: 1 }
    required: [ref, after, limit]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      modules:
        type: array
        items:
          type: object
          properties:
            ref: { type: string }
            latestVersion: { type: string }
            seq: { type: integer }
          required: [ref, latestVersion, seq]
      next: { type: [integer, "null"] }
    required: [modules, next]
steps:
  - name: rows
    invoke: !ref query
    inputs:
      sql: >-
        SELECT m.ref, m.latest_version AS "latestVersion", m.id::int AS seq
        FROM modules m
        JOIN module_versions lv ON lv.module_id = m.id AND lv.version = m.latest_version
        WHERE ($1 = '' OR m.ref = $1) AND m.id > $2
        ORDER BY m.id
        LIMIT $3
      bindings:
        - !cel "inputs.ref"
        - !cel "inputs.after"
        - !cel "inputs.limit"
outputs:
  modules: !cel "steps.rows.result.rows"
  next: !cel >-
    steps.rows.result.rows.size() == inputs.limit
      ? steps.rows.result.rows[steps.rows.result.rows.size() - 1].seq
      : null
---
# Everything a module page renders, in one call. Without it a page needs three
# round trips (search by ref, versions, implementations) and still cannot address
# a non-latest version.
kind: Run.Sequence
metadata:
  name: moduleDetail
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      ref: { type: string }
      # '' means the latest tracked version.
      version: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      found: { type: boolean }
      module: { type: object, additionalProperties: true }
      kinds: { type: array }
      exportedResources: { type: array }
      versions: { type: array }
      # An application's declared contract; null for a library.
      application: { type: [object, "null"], additionalProperties: true }
      # What this version imports: `{ alias, ref, version }` per entry.
      imports: { type: array }
      # How many other modules import this one at their latest version.
      dependents: { type: integer }
    required: [found, module, kinds, exportedResources, versions, application, imports, dependents]
steps:
  - name: tracked
    invoke: !ref trackedModules
    inputs:
      ref: !cel "inputs.ref"
      after: 0
      limit: 1
  - name: row
    invoke: !ref query
    inputs:
      sql: >-
        SELECT m.ref, mv.version, m.latest_version AS "latestVersion",
               mv.module_name AS name, mv.description, mv.repository, mv.license,
               mv.homepage, module_publisher(m.ref, m.transport) AS publisher, m.transport,
               COALESCE(mv.integrity, '') AS integrity,
               mv.deprecated_reason, mv.replaced_by,
               /* No runtime reach for an application: the hub does not index the
                  reach of a whole import closure. */
               CASE WHEN mv.root_kind = 'Application' THEN NULL
                    ELSE json_build_object('runtimes', COALESCE(mv.runtimes, '{}'),
                                           'full', mv.runtimes_full,
                                           'languages', mv.languages,
                                           'portable', mv.portable) END AS runtime,
               /* The declared contract of an application version, NULL for any
                  other — including one whose root kind is not recorded. */
               application_contract(mv.module_id, mv.version) AS application,
               (SELECT COALESCE(json_agg(json_build_object('slug', s, 'label', l) ORDER BY s), '[]'::json)
                FROM unnest(mv.categories, mv.category_labels) AS t(s, l)) AS categories,
               /* The module's own kinds, then the kinds it re-exports from an
                  import, each described by its owner's latest version. `ref`
                  is the owning module either way, which with `kind` is what
                  `/instances` and `/implementations` are keyed by. A
                  re-export whose owner the hub does not track keeps its name
                  and ref with empty detail. */
               (SELECT COALESCE(json_agg(k.entry ORDER BY k.name), '[]'::json) FROM (
                SELECT rk.name, json_build_object(
                         'kind', rk.name, 'ref', m.ref, 'reexported', FALSE,
                         'capability', rk.capability,
                         'abstract', rk.abstract, 'description', rk.description,
                         'extends', json_build_object('kind', rk.extends_kind, 'ref', rk.extends_ref),
                         'runtime', json_build_object('runtimes', rk.runtimes,
                                                      'languages', rk.languages,
                                                      'portable', rk.portable),
                         'deprecated', json_build_object(
                           'reason', rk.deprecated_reason,
                           'replacedBy', json_build_object('kind', rk.replaced_by_kind,
                                                           'ref', rk.replaced_by_ref)),
                         'instances', kind_instance_count(m.ref, rk.name)) AS entry
                FROM resource_kinds rk
                WHERE rk.module_id = mv.module_id AND rk.version = mv.version AND rk.exported
                UNION ALL
                SELECT rx.name, json_build_object(
                         'kind', rx.name, 'ref', rx.kind_ref, 'reexported', TRUE,
                         'capability', COALESCE(ok.capability, ''),
                         'abstract', COALESCE(ok.abstract, FALSE),
                         'description', COALESCE(ok.description, ''),
                         'extends', json_build_object('kind', COALESCE(ok.extends_kind, ''),
                                                      'ref', COALESCE(ok.extends_ref, '')),
                         'runtime', json_build_object('runtimes', COALESCE(ok.runtimes, '{}'),
                                                      'languages', COALESCE(ok.languages, '{}'),
                                                      'portable', COALESCE(ok.portable, FALSE)),
                         'deprecated', json_build_object(
                           'reason', COALESCE(ok.deprecated_reason, ''),
                           'replacedBy', json_build_object('kind', COALESCE(ok.replaced_by_kind, ''),
                                                           'ref', COALESCE(ok.replaced_by_ref, ''))),
                         'instances', kind_instance_count(rx.kind_ref, rx.name))
                FROM module_reexported_kinds rx
                LEFT JOIN modules om ON om.ref = rx.kind_ref
                LEFT JOIN resource_kinds ok
                  ON ok.module_id = om.id AND ok.version = om.latest_version AND ok.name = rx.name
                WHERE rx.module_id = mv.module_id AND rx.version = mv.version
               ) k) AS kinds,
               (SELECT COALESCE(json_agg(json_build_object(
                         'name', mr.name, 'kind', mr.kind,
                         'description', mr.description, 'declared', mr.declared)
                       ORDER BY mr.name), '[]'::json)
                FROM module_resources mr
                WHERE mr.module_id = mv.module_id AND mr.version = mv.version) AS "exportedResources",
               (SELECT COALESCE(json_agg(json_build_object(
                         'alias', mi.alias, 'ref', mi.import_ref, 'version', mi.pinned_version)
                       ORDER BY mi.alias), '[]'::json)
                FROM module_imports mi
                WHERE mi.module_id = mv.module_id AND mi.version = mv.version) AS imports,
               /* Counted at each importer's LATEST version, the one `/dependents`
                  lists: a module that imported this once and no longer does is
                  not a dependent. */
               (SELECT COUNT(DISTINCT dm.id)::int
                FROM module_imports di
                JOIN modules dm ON dm.id = di.module_id AND dm.latest_version = di.version
                WHERE di.import_ref = m.ref AND dm.id <> m.id) AS dependents,
               /* Newest-first, the same ordering `/module/versions` and the CLI
                  verb use, so a version picker built off either agrees. */
               (SELECT COALESCE(json_agg(v.version ORDER BY
                         version_sort_key(v.version) DESC NULLS LAST, v.version ASC), '[]'::json)
                FROM module_versions v WHERE v.module_id = mv.module_id) AS versions
        FROM modules m
        JOIN module_versions mv
          ON mv.module_id = m.id AND mv.version = COALESCE(NULLIF($2, ''), m.latest_version)
        WHERE m.ref = $1
      bindings:
        - !cel "inputs.ref"
        - !cel "inputs.version"
outputs:
  found: !cel "steps.tracked.result.modules.size() > 0 && steps.row.result.rows.size() > 0"
  # Same nesting as a `/search/*` hit's `module`, so a page reached from a search
  # result and one reached by URL render off one shape.
  module: !cel >-
    steps.row.result.rows.size() == 0 ? {} :
    {'ref': steps.row.result.rows[0].ref, 'version': steps.row.result.rows[0].version,
     'latestVersion': steps.row.result.rows[0].latestVersion, 'name': steps.row.result.rows[0].name,
     'transport': steps.row.result.rows[0].transport, 'integrity': steps.row.result.rows[0].integrity,
     'description': steps.row.result.rows[0].description, 'repository': steps.row.result.rows[0].repository,
     'license': steps.row.result.rows[0].license, 'homepage': steps.row.result.rows[0].homepage,
     'publisher': steps.row.result.rows[0].publisher, 'categories': steps.row.result.rows[0].categories,
     'deprecated': {'reason': steps.row.result.rows[0].deprecated_reason,
                    'replacedBy': steps.row.result.rows[0].replaced_by},
     'runtime': steps.row.result.rows[0].runtime}
  kinds: !cel "steps.row.result.rows.size() > 0 ? steps.row.result.rows[0].kinds : []"
  exportedResources: !cel "steps.row.result.rows.size() > 0 ? steps.row.result.rows[0].exportedResources : []"
  versions: !cel "steps.row.result.rows.size() > 0 ? steps.row.result.rows[0].versions : []"
  # An application exports nothing, so its `kinds` and `exportedResources` are
  # empty and its `module.runtime` is null — the hub does not index the reach of
  # a whole import closure.
  application: !cel "steps.row.result.rows.size() > 0 ? steps.row.result.rows[0].application : null"
  imports: !cel "steps.row.result.rows.size() > 0 ? steps.row.result.rows[0].imports : []"
  dependents: !cel "steps.row.result.rows.size() > 0 ? steps.row.result.rows[0].dependents : 0"
---
# Newest-first, matching the `telo module versions` CLI verb this mirrors (one
# contract, three front-ends): valid dotted-numeric versions sort by numeric
# precedence descending, then any non-numeric tags (digests, `latest`) fall to
# the end in lexical order. Consumers (IDE version completion) rely on index 0
# being the latest version.
kind: Run.Sequence
metadata:
  name: moduleVersionList
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      ref: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      found: { type: boolean }
      versions: { type: array }
    required: [found, versions]
steps:
  - name: rows
    invoke: !ref query
    inputs:
      sql: >-
        SELECT mv.version, COALESCE(mv.integrity, '') AS integrity
        FROM module_versions mv
        JOIN modules m ON m.id = mv.module_id
        WHERE m.ref = $1
        ORDER BY version_sort_key(mv.version) DESC NULLS LAST, mv.version ASC
      bindings:
        - !cel "inputs.ref"
outputs:
  found: !cel "steps.rows.result.rows.size() > 0"
  # `{version, integrity}` per entry, not bare strings: the pin an editor writes
  # when it upgrades an import belongs to exactly one version, and a parallel
  # array or a keyed side-map could disagree with the list it annotates.
  # `integrity` is omitted for a version ingested before the column existed or
  # one nothing can hash — a consumer treats its absence as "no pin available",
  # never as an error.
  versions: !cel >-
    steps.rows.result.rows.map(r,
      r.integrity == '' ? {'version': r.version} : {'version': r.version, 'integrity': r.integrity})
---
# Every kind that implements a given contract, across module boundaries — the
# derived grouping axis. A backend is discoverable from the abstract it extends
# without the abstract's module knowing it exists.
kind: Run.Sequence
metadata:
  name: implementations
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      ref: { type: string }
      kind: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      implementations: { type: array }
    required: [implementations]
steps:
  - name: rows
    invoke: !ref query
    inputs:
      sql: >-
        SELECT m.ref, rk.version, rk.name AS kind, rk.capability, rk.description,
               (SELECT COALESCE(json_agg(json_build_object('slug', s, 'label', l) ORDER BY s), '[]'::json)
                FROM unnest(rk.categories, rk.category_labels) AS t(s, l)) AS categories
        FROM resource_kinds rk
        JOIN modules m ON m.id = rk.module_id AND m.latest_version = rk.version
        WHERE rk.extends_ref = $1 AND rk.extends_kind = $2 AND rk.exported
        ORDER BY m.ref, rk.name
      bindings:
        - !cel "inputs.ref"
        - !cel "inputs.kind"
outputs:
  implementations: !cel "steps.rows.result.rows"
---
# Every module that imports a given module — the reverse of `imports:`. An
# importer is listed once, at its latest version: what it imported in an older
# one says nothing about who depends on the module now.
#
# Paged, because a widely imported module is imported by most of the catalogue.
# `total` is the count before the page is cut, and is read from a row of its own
# so a page past the end still reports it. Each row carries `description` whole
# and `summary` — its first sentence, cut at 160 characters, as `libraryIndex`
# cuts one — so a caller that is re-sent every result takes the short form.
kind: Run.Sequence
metadata:
  name: dependents
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      ref: { type: string }
      limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
      offset: { type: integer, minimum: 0, default: 0 }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      dependents: { type: array }
      total: { type: integer }
    required: [dependents, total]
steps:
  - name: rows
    invoke: !ref query
    inputs:
      sql: >-
        WITH d AS (
          SELECT DISTINCT m.ref, mv.version, COALESCE(mv.module_name, '') AS name,
                 COALESCE(mv.description, '') AS description,
                 (SELECT CASE WHEN length(s) > 160 THEN left(s, 159) || '…' ELSE s END
                  FROM (SELECT split_part(regexp_replace(COALESCE(mv.description, ''), '\s+', ' ', 'g'),
                                          '. ', 1) AS s) first_sentence) AS summary,
                 COALESCE(mv.root_kind, '') = 'Application' AS application
          FROM module_imports mi
          JOIN modules m ON m.id = mi.module_id AND m.latest_version = mi.version
          JOIN module_versions mv ON mv.module_id = mi.module_id AND mv.version = mi.version
          WHERE mi.import_ref = $1 AND m.ref <> $1
        )
        SELECT (SELECT COUNT(*) FROM d)::int AS total,
               (SELECT COALESCE(json_agg(row_to_json(p) ORDER BY p.ref), '[]'::json)
                FROM (SELECT * FROM d ORDER BY ref LIMIT $2 OFFSET $3) p) AS page
      bindings:
        - !cel "inputs.ref"
        - !cel "inputs.limit"
        - !cel "inputs.offset"
outputs:
  dependents: !cel "steps.rows.result.rows[0].page"
  total: !cel "steps.rows.result.rows[0].total"
---
# Every exported instance of a given kind, across module boundaries — the
# instance axis. A module that only packages ready-made instances of another
# module's kind (a language model pack) is reached from that kind rather than
# ranked as a search result of its own, and the kind's module never lists it.
kind: Run.Sequence
metadata:
  name: instances
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      ref: { type: string }
      kind: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      instances: { type: array }
    required: [instances]
steps:
  - name: rows
    invoke: !ref query
    inputs:
      sql: >-
        SELECT mr.name, mr.description,
               json_build_object('ref', m.ref, 'version', mr.version,
                                 'name', COALESCE(mv.module_name, ''),
                                 'description', COALESCE(mv.description, '')) AS module
        FROM module_resources mr
        JOIN modules m ON m.id = mr.module_id AND m.latest_version = mr.version
        LEFT JOIN module_versions mv ON mv.module_id = mr.module_id AND mv.version = mr.version
        WHERE mr.kind_ref = $1 AND mr.kind = $2
        ORDER BY m.ref, mr.name
      bindings:
        - !cel "inputs.ref"
        - !cel "inputs.kind"
outputs:
  instances: !cel "steps.rows.result.rows"
---
# Lexical ref typeahead (pg_trgm): completes a ref whose name the author already
# knows — the memorable token at an OCI path's tail matches without the
# scheme/host boilerplate, and a typo still hits. Not the semantic search — no
# embedder in this path, ever.
#
# It completes a ref to IMPORT, so a module whose latest version is recorded as
# an application is left out. One with no ingested version, or whose root kind
# is not recorded, stays listed.
kind: Run.Sequence
metadata:
  name: refSuggestions
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      q: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      refs: { type: array }
    required: [refs]
steps:
  - name: rows
    invoke: !ref query
    inputs:
      sql: >-
        SELECT m.ref,
               COALESCE(m.latest_version, '') AS "latestVersion",
               COALESCE(mv.description, '') AS description,
               COALESCE(mv.repository, '') AS repository,
               COALESCE(mv.license, '') AS license
        FROM modules m
        LEFT JOIN module_versions mv
          ON mv.module_id = m.id AND mv.version = m.latest_version
        WHERE (m.ref % $1 OR m.ref ILIKE '%' || $1 || '%')
          AND mv.root_kind IS DISTINCT FROM 'Application'
        ORDER BY (CASE WHEN regexp_replace(m.ref, '.*/', '') ILIKE '%' || $1 || '%' THEN 1 ELSE 0 END) DESC,
                 similarity(m.ref, $1) DESC, m.ref
        LIMIT 20
      bindings:
        - !cel "inputs.q"
outputs:
  refs: !cel "steps.rows.result.rows"
---
# How far a registration has got — the answer a client polls for after a 202.
#
# Read off the ROWS, not off a durable run: the run id carries the version, the
# digest and the attempt, none of which a registering client holds, and a ref
# spans many versions with a run each. The rows are the authoritative record of
# what has been ingested, so they are what this reports.
#
# `pending` and `ingesting` are kept apart because they call for different
# patience: nothing of this module is searchable yet, versus some of it is and
# more is arriving.
kind: Run.Sequence
metadata:
  name: registrationStatus
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      ref: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      status:
        type: string
        enum: [unknown, pending, ingesting, ready, failed]
      ref: { type: string }
      latestVersion: { type: string }
      versionsKnown: { type: integer }
      versionsIngested: { type: integer }
      error: { type: string }
      nextAttemptAt: { type: string }
    required:
      - status
      - ref
      - latestVersion
      - versionsKnown
      - versionsIngested
      - error
      - nextAttemptAt
steps:
  - name: rows
    invoke: !ref query
    inputs:
      sql: >-
        SELECT COALESCE(m.latest_version, '') AS "latestVersion",
               (SELECT COUNT(*)::int FROM version_ingest vi WHERE vi.module_id = m.id)
                 AS "versionsKnown",
               (SELECT COUNT(*)::int FROM module_versions mv WHERE mv.module_id = m.id)
                 AS "versionsIngested",
               (SELECT COUNT(*)::int FROM version_ingest vi
                WHERE vi.module_id = m.id AND vi.claimed_at IS NOT NULL
                  AND vi.completed_at IS NULL) AS "inFlight",
               COALESCE((SELECT vi.last_error FROM version_ingest vi
                         WHERE vi.module_id = m.id AND vi.last_error <> ''
                         ORDER BY vi.completed_at DESC LIMIT 1), '') AS error,
               COALESCE((SELECT to_char(vi.next_attempt_at, 'YYYY-MM-DD"T"HH24:MI:SSOF')
                         FROM version_ingest vi
                         WHERE vi.module_id = m.id AND vi.next_attempt_at IS NOT NULL
                         ORDER BY vi.next_attempt_at LIMIT 1), '') AS "nextAttemptAt"
        FROM modules m
        WHERE m.ref = $1
      bindings:
        - !cel "inputs.ref"
outputs:
  ref: !cel "inputs.ref"
  # Order matters: an in-flight claim reads as progress even when an earlier
  # version failed, because the failure may be the one this attempt is fixing.
  status: !cel >-
    steps.rows.result.rows.size() == 0
      ? 'unknown'
      : (steps.rows.result.rows[0].inFlight > 0
          ? (steps.rows.result.rows[0].versionsIngested > 0 ? 'ingesting' : 'pending')
          : (steps.rows.result.rows[0].versionsIngested > 0
              ? 'ready'
              : (steps.rows.result.rows[0].error != '' ? 'failed' : 'pending')))
  latestVersion: !cel "steps.rows.result.rows.size() > 0 ? steps.rows.result.rows[0].latestVersion : ''"
  versionsKnown: !cel "steps.rows.result.rows.size() > 0 ? steps.rows.result.rows[0].versionsKnown : 0"
  versionsIngested: !cel "steps.rows.result.rows.size() > 0 ? steps.rows.result.rows[0].versionsIngested : 0"
  error: !cel "steps.rows.result.rows.size() > 0 ? steps.rows.result.rows[0].error : ''"
  nextAttemptAt: !cel "steps.rows.result.rows.size() > 0 ? steps.rows.result.rows[0].nextAttemptAt : ''"
