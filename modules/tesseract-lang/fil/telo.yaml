    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/fil.traineddata.gz:
        { upstream: fil, member: package/4.0.0_best_int/fil.traineddata.gz, sha256: 73e2af0cad8544a533581f6a036ca312ca3c45bc9d51451b19979ae4313da003, executable: false }
