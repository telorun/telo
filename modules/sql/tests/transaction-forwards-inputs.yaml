# Sql.Transaction's declared `inputs:` map is CEL-expanded against the caller's
# invocation input (readable as `inputs.<field>`) and forwarded to the `steps`
# resource — the feature the field exists for, previously unusable because the
# schema spelled the slot `bindings:` while the controller read `inputs`.
kind: Telo.Application
metadata:
  name: TransactionForwardsInputs
  version: 1.0.0
imports:
  Sql: ../
  SQLite: ../../sqlite
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testTransactionForwardsInputs
---
kind: SQLite.Connection
metadata:
  name: db
file: ":memory:"
---
kind: Sql.Transaction
metadata:
  name: insertTx
connection: !ref db
steps: !ref insertUser
inputs:
  sql: "INSERT INTO users (id, name) VALUES (?, ?)"
  bindings:
    - !cel "inputs.id"
    - !cel "inputs.name"
---
# No `transaction:` ref — the command joins the ambient transaction it is
# invoked inside (a bound ref here would also cycle init order with the
# transaction's own `steps:` ref back to this command).
kind: Sql.Command
metadata:
  name: insertUser
connection: !ref db
---
kind: Run.Sequence
metadata:
  name: testTransactionForwardsInputs
steps:
  - name: createTable
    inputs:
      sql: "CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT NOT NULL)"
    invoke:
      kind: Sql.Command
      connection: !ref db

  # The transaction is invoked with {id, name}; its inputs map turns them into
  # the command's positional bindings inside the open transaction.
  - name: insertViaTx
    inputs:
      id: !cel "7"
      name: Ada
    invoke: !ref insertTx

  - name: selectBack
    inputs:
      sql: "SELECT name FROM users WHERE id = ?"
      bindings:
        - !cel "7"
    invoke:
      kind: Sql.Query
      connection: !ref db

  - name: assertRow
    inputs:
      actual: !cel "steps.selectBack.result.rows"
      expected:
        - name: Ada
    invoke:
      kind: Assert.Equals
