kind: Telo.Application
metadata:
  name: CelChainThroughUnionTest
  version: 1.0.0
  description: |
    A plain chain that continues past a union in its producer's declared schema
    is held to what the union's alternatives declare for the member it reads:
    a member every alternative declares a string checks and runs into a string
    slot, and is refused into an integer one with the member's own type named.
imports:
  Assert: ../modules/assert
targets:
  - !ref memberFitsItsSlot
  - !ref memberRefusedByItsOwnType
---
kind: Assert.Manifest
metadata:
  name: memberFitsItsSlot
source: ./__fixtures__/cel-chain-through-union/telo.yaml
expect:
  errors: []
  runs: true
---
kind: Assert.Manifest
metadata:
  name: memberRefusedByItsOwnType
source: ./__fixtures__/cel-chain-through-union/into-integer.yaml
expect:
  errors:
    - code: CEL_TYPE_ERROR
      message: "source is 'string', target expects 'integer'"
