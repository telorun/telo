modules:
  modules/ocr: Added
  modules/tesseract-model: Added
  modules/tesseract: Added
body: "Text recognition in images. `modules/ocr` is the engine-neutral contract: a
  recognizer reads the printed text in one image, optionally inside a pixel rectangle,
  and returns the text, a 0–1 confidence, the image size, and flat lists of blocks,
  lines and words linked by index, each with a box and polygon measured on the whole
  image. Its failure codes (ERR_INVALID_INPUT, ERR_UNSUPPORTED_IMAGE,
  ERR_IMAGE_TOO_LARGE, ERR_OCR_OVERLOADED, ERR_OCR_ENGINE_FAILED,
  ERR_OCR_LIMIT_EXCEEDED) are a ceiling every engine stays within, so a library
  holding any recognizer is checked against exactly that list, and a call is bounded
  by the step's `timeout:`. `modules/tesseract-model`
  declares Tesseract's trained models as resources — a language model named by its code
  and the orientation and script detection model — each located by a `.traineddata`
  file, gzip-compressed or raw, so a custom or fine-tuned model is one declaration.
  `modules/tesseract` implements the contract offline with the Tesseract engine
  compiled to WebAssembly, bundling the English and orientation models: it reads PNG,
  JPEG, WebP, BMP and PNM images, reports the page rotation and script with an
  orientation model, returns hOCR or TSV on request, and runs recognitions on a pool
  of worker threads with a queue limit, size limits read from the image header, and a
  per-recognition time limit (ERR_OCR_LIMIT_EXCEEDED); a cancelled call stops its
  engine."
