  # Forms: one deriving a control per property with a write-only one never
  # kept, one choosing each control, and a booking form over option sources —
  # a select and options side by side, pickers on three surfaces, a source
  # narrowed by the form's values — with a date range, groups and a field
  # shown on a condition. A list under each reads what they wrote.
  - name: verifyForms
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        kinds: !cel "steps.nodes.result.forms.map(c, c.type)"
        derived:
          basePath: !cel "steps.nodes.result.forms[3].basePath"
          fields: !cel "steps.nodes.result.forms[3].fields.map(f, [f.type, f.property, f.control, f.label.message[0], f.description == null ? '-' : f.description.message[0]])"
          kindLabels: !cel "steps.nodes.result.forms[3].fields[1].labels.map(l, [l.value, l.label.message[0]])"
          # What the renderer derives each control from.
          schema: !cel >-
            cel.bind(p, steps.nodes.result.forms[3].schema.properties,
              [p.kind.default, p.seats.default, p.startOn.format, p.kickoffAt.format, p.callAt.format, p.details.contentMediaType,
               p.channels.items.enum, p.keywords.items.type, p.accessCode.writeOnly])
          state: !cel "steps.nodes.result.forms[3].state"
        byHand:
          fields: !cel "steps.nodes.result.forms[6].fields.map(f, [f.property, f.control])"
          state: !cel "steps.nodes.result.forms[6].state"
        requests: !cel "[steps.nodes.result.forms[9].source, steps.nodes.result.forms[9].content.columns.map(c, c.header.message[0])]"
        booking:
          basePath: !cel "steps.nodes.result.forms[13].basePath"
          groups: !cel "steps.nodes.result.forms[13].groups.map(g, [g.name, g.label.message[0], has(g.description) ? g.description.message[0] : '-', has(g.shown) ? g.shown : null])"
          fields: !cel >-
            steps.nodes.result.forms[13].fields.map(f, [f.type, f.property, f.group,
              f.type == 'picker' ? f.surface.type : (f.type == 'dateRange' ? '-' : f.control),
              has(f.shown) ? f.shown : null])
          projectSource: !cel >-
            cel.bind(o, steps.nodes.result.forms[13].fields[0].options,
              [o.basePath, o.filters, o.pageSize, o.value, o.label, o.hint, 'href' in o, 'search' in o])
          lead: !cel >-
            cel.bind(o, steps.nodes.result.forms[13].fields[2].options,
              [o.basePath, o.filters, o.pageSize, o.value, o.label, o.hint, o.href, o.search])
          surfaces: !cel "[steps.nodes.result.forms[13].fields[2].surface, steps.nodes.result.forms[13].fields[3].surface, steps.nodes.result.forms[13].fields[4].surface]"
          team: !cel "steps.nodes.result.forms[13].fields[3].options == steps.nodes.result.forms[13].fields[4].options && steps.nodes.result.forms[13].fields[3].options.filters == {'active': {'value': true}}"
          helpers: !cel "[steps.nodes.result.forms[13].fields[5].options.pageSize, steps.nodes.result.forms[13].fields[5].options.filters]"
          dateRange: !cel >-
            cel.bind(f, steps.nodes.result.forms[13].fields[6],
              [f.presets.map(x, [x.label.message[0], x.unit, x.offset]), f.weekStart, f.initialPreset, f.warnLongerThan, f.label.message[0], f.description.message[0]])
          state: !cel "steps.nodes.result.forms[13].state"
        bookings: !cel "[steps.nodes.result.forms[16].source, steps.nodes.result.forms[16].content.columns.map(c, c.header.message[0])]"
        polish: !cel >-
          cel.bind(f, steps.polishForms.result.body.children[0].children, [
            f[0].text.message[0], f[3].fields[0].label.message[0], f[3].fields[1].labels[1].label.message[0],
            f[13].groups[1].label.message[0], f[13].fields[6].presets[3].label.message[0], f[16].content.columns[3].header.message[0]])
      expected:
