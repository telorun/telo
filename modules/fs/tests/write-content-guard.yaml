kind: Telo.Application
metadata:
  name: FsWriteContentGuard
  version: 1.0.0
  description: |
    `content` accepts text or raw bytes (`x-telo-binary`). A literal at that slot is
    caught statically — see write-content-rejects-literal.yaml. What reaches the
    runtime is a CEL expression, whose value the analyzer cannot know: this covers
    the contract rejecting a non-byte value there, and both string forms still
    working after the slot was widened.
imports:
  Fs: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref TestContentGuard
---
kind: Fs.FileWrite
metadata: { name: Write }
cwd: ./modules/fs/tests/__fixtures__/scratch-guard
---
kind: Fs.FileRemoval
metadata: { name: Remove }
cwd: ./modules/fs/tests/__fixtures__
---
kind: Run.Sequence
metadata: { name: TestContentGuard }
steps:
  # The analyzer substitutes a byte placeholder for a CEL leaf at a byte slot — it
  # cannot know what the expression evaluates to — so this passes `telo check` and
  # the input contract is what must catch it at dispatch.
  - name: RejectsNonBytesFromCel
    try:
      - name: Invoke
        inputs:
          path: bad.bin
          content: !cel "{'foo': 'bar'}"
          createParents: true
        invoke: !ref Write
    catch:
      - name: Assert
        inputs:
          # Rejected by the input CONTRACT, not the controller: the annotation makes
          # the byte slot checkable, so the dispatch never reaches fs code.
          actual: !cel "error.code"
          expected: ERR_INPUT_INVALID
        invoke: !ref Assert.equals

  # Text still works unchanged, including the base64 decode path — widening the slot
  # must not have disturbed either string form.
  - name: WritesUtf8
    inputs:
      path: plain.txt
      content: "alpha\n"
      createParents: true
    invoke: !ref Write

  - name: WritesBase64
    inputs:
      path: decoded.txt
      content: YWxwaGEK
      encoding: base64
      createParents: true
    invoke: !ref Write

  - name: Assert
    inputs:
      actual:
        utf8Bytes: !cel "steps.WritesUtf8.result.bytesWritten"
        base64Bytes: !cel "steps.WritesBase64.result.bytesWritten"
      expected:
        utf8Bytes: 6
        base64Bytes: 6
    invoke: !ref Assert.equals

  - name: Cleanup
    inputs: { path: scratch-guard, recursive: true }
    invoke: !ref Remove
