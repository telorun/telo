kind: Telo.Application
metadata:
  name: BlobFsStaticChecks
  version: 1.0.0
  description: |
    What `telo check` says about a blob operation before anything runs: a
    literal key or media type outside its grammar is refused against the
    operation's input contract, and a `store` slot takes only a store.
imports:
  Assert: ../../assert
targets:
  - !ref malformedLiterals
  - !ref nonStore
---
kind: Assert.Manifest
metadata: { name: malformedLiterals }
source: ./__fixtures__/malformed-key.yaml
expect:
  errors:
    - code: CONTRACT_INPUTS_MISMATCH
      message: steps[0].inputs.key
    - code: CONTRACT_INPUTS_MISMATCH
      message: steps[1].inputs.key
    - code: CONTRACT_INPUTS_MISMATCH
      message: steps[2].inputs.key
    - code: CONTRACT_INPUTS_MISMATCH
      message: steps[3].inputs.contentType
    - code: CONTRACT_INPUTS_MISMATCH
      message: steps[4].inputs.contentType
---
kind: Assert.Manifest
metadata: { name: nonStore }
source: ./__fixtures__/non-store.yaml
expect:
  errors:
    - code: REFERENCE_KIND_MISMATCH
