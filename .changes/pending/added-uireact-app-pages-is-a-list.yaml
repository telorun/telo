modules:
  modules/ui-react: Added
body: "UiReact.App.pages is a list of Ui.Page, written in place or named by reference, a
  library's included, and UiReact.App.navigation is a Ui.Navigation tree naming pages by
  reference, never by path. The header draws the tree through the Navigation control in
  a row — a group a dropdown, a nested group a submenu, what does not fit under More —
  and below compactBelow a menu button (the nav-menu part, first in the header, or last
  for a drawer opening from the end edge) opening the whole tree in a column in its
  surface; the shown page's entry and every group on the way to it are marked current.
  An entry naming a page pages does not list, at any depth, is refused by telo check
  (RESOURCE_RULE_VIOLATED, data.rule UI_NAVIGATION_PAGE_UNROUTED) and at creation
  (ERR_UI_NAVIGATION_PAGE_UNROUTED). The application document carries navigation.
  Breaking: a page is a Ui.Page, so a pages entry gains kind: Ui.Page or becomes a
  reference; the nav-link part is gone, the nav part holds the Navigation control, and a
  theme styles the new nav-menu part. Requires telo 0.121.0, whose rule pointers repeat
  a group."
