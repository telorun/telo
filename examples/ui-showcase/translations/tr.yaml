# The showcase in Turkish: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads; Turkish keeps a noun after a number singular, so a plural is one form,
# with an `=0` case where nothing reads better; a word told apart by its
# context is translated once per context.
kind: I18n.Catalog
metadata:
  name: turkish
lang: tr
texts:
  # Applications and pages.
  - { text: UI showcase, translation: Arayüz vitrini }
  - { text: UI showcase — Radix, translation: Arayüz vitrini — Radix }
  - { text: UI showcase — brand, translation: Arayüz vitrini — marka }
  - { text: UI showcase — sidebar, translation: Arayüz vitrini — kenar çubuğu }
  - { text: Overview, translation: Genel bakış }
  - { text: Conditions, translation: Koşullar }
  - { text: Data, translation: Veri }
  - { text: Tables, translation: Tablolar }
  - { text: Filters, translation: Filtreler }
  - { text: Forms, translation: Formlar }
  - { text: Actions, translation: Eylemler }
  - { text: Components, translation: Bileşenler }
  - { text: CRUD, translation: CRUD }
  - { text: Themes, translation: Temalar }
  # The navigation's groups.
  - { text: Building blocks, translation: Yapı taşları }
  - { text: Input, translation: Girdi }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: Arayüz vitrini logosu }
  - { text: Language, translation: Dil }
  - { text: Theme, translation: Tema }
  - { text: Default, translation: Varsayılan }
  - { text: Radix, translation: Radix }
  - { text: Brand, translation: Marka }
  - { text: Sidebar, translation: Kenar çubuğu }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: Her istekte }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "Bu düğümler sayfanın kendisine aittir, bu yüzden when koşulları ve metinleri her istekte değerlendirilir." }
  - { text: Your browser asked for Polish., translation: Tarayıcınız Lehçe istedi. }
  - { text: Your browser did not ask for Polish., translation: Tarayıcınız Lehçe istemedi. }
  - { text: The Acme brand is on., translation: Acme markası etkin. }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "Bir ifadenin hesapladığı metin hesaplandığı gibi gösterilir, asla çevrilmez." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "Bu isteğin geçersiz kıldığı bir bağlantının yerini bir hata düğümü alır ve sayfanın geri kalanı sunulur." }
  - { text: Leaves the application, translation: Uygulamadan çıkar }

  # The overview.
  - { text: Every node type, translation: Her düğüm türü }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "Kutu, yığın ve sütunlar başka düğümleri barındırır; her biri alt öğelerini kendi yöntemiyle çizer." }
  - { text: A box, translation: Bir kutu }
  - { text: Groups its children., translation: Alt öğelerini gruplar. }
  - { text: A stack, translation: Bir yığın }
  - { text: Draws its children one under another., translation: Alt öğelerini alt alta çizer. }
  - { text: A badge, translation: Bir rozet }
  - { text: Columns, translation: Sütunlar }
  - { text: "Draw their children side by side, as these three are.", translation: "Alt öğelerini, bu üçü gibi, yan yana çizer." }
  - { text: Text in each style, translation: Her stilde metin }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "Stil, bir düğümün ne anlama geldiğini söyler; bunun nasıl görüneceğine tema karar verir. Bir düğüm birden fazla stil taşıyabilir." }
  - { text: Heading, translation: Ana başlık }
  - { text: Subheading, translation: Alt başlık }
  - { text: Muted, translation: Soluk }
  - { text: Strong, translation: Belirgin }
  - { text: Accent, translation: Vurgu }
  - { text: Danger, translation: Tehlike }
  - { text: Warning, translation: Uyarı }
  - { text: Success, translation: Başarı }
  - { text: Strong and accent, translation: Belirgin ve vurgu }
  - { text: Links, translation: Bağlantılar }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "Bildirilmiş bir sayfaya giden bağlantı uygulama içinde gezinir; bağlama noktası altında sunulan bir dosya sıradan bir yüklemedir; https ve mailto uygulamadan çıkar." }
  - { text: Go to Conditions, translation: Koşullar sayfasına git }
  - { text: A file the server serves, translation: Sunucunun sunduğu bir dosya }
  - { text: Write to us, translation: Bize yazın }
  - { text: Images, translation: Görseller }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "Adresiyle verilen bir görsel, aynı görselin boş alt ile süs olarak kullanımı ve sayfaya asla eklenmeyen, görsel olarak çizilen SVG işaretlemesi." }
  - { text: The showcase mark, translation: Vitrinin amblemi }
  - { text: Three overlapping circles, translation: Üst üste binen üç daire }
  - { text: Values by their schema, translation: Şemalarına göre değerler }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "Her değer, sayfanın yüklediği ekip kaydından okunur ve model özelliğinin söylediği şekilde çizilir." }
  - { text: Visit the team homepage, translation: Ekibin ana sayfasını ziyaret edin }
  - { text: "A uri, drawn as a link with a text of its own", translation: "Kendi metniyle bağlantı olarak çizilen bir uri" }
  - { text: A uri-reference to a declared page, translation: Bildirilmiş bir sayfaya uri-reference }
  - { text: A uri-reference to a served file, translation: Sunulan bir dosyaya uri-reference }
  - { text: A mailto address, translation: Bir mailto adresi }
  - { text: "An address the rule refuses, drawn as plain text", translation: "Kuralın reddettiği, düz metin olarak çizilen bir adres" }
  - { text: A date, translation: Bir tarih }
  - { text: A date and time, translation: Bir tarih ve saat }
  - { text: A boolean, translation: Bir mantıksal değer }
  - { text: An enumeration's label, translation: Bir numaralandırma değerinin etiketi }
  - { text: A list, translation: Bir liste }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "Tek bir yanıtın içerdiği satırlar, asla sayfalanmaz. Sütun başlığı varsayılan olarak özelliğin başlığıdır ve son sütun yalnızca ekip işe alım yaparken gösterilir." }
  - { text: Projects under way, translation: Süren projeler }
  - { text: Project, translation: Proje }
  - { text: Texts, translation: Metinler }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": Henüz proje yok.
        other: "Şu ana kadar {$count} proje."
  - { text: "{$team} started {$project} most recently.", translation: "En son {$project} projesini {$team} başlattı." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "Tarayıcıda, okuduğu sayıya göre seçilen bir çoğul biçim ve değerleri kayıttan gelen bir metin." }
  - { text: Open, context: state, translation: Açık }
  - { text: Open, context: verb, translation: Aç }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "Bir düğümün kendi metni de aynı şekilde ayırt edilir: rozet TEL-42'nin açık olduğunu söyler, bağlantı ise görevlerini açmayı önerir." }
  - { text: Style rules, translation: Stil kuralları }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "Bir satırın ve bir hücrenin stilini satırın bir değeri seçer. Öne çıkan proje belirgindir, her durumun kendi rengi vardır ve hiçbir kuralın adlandırmadığı bir durum varsayılan stili alır. İki sütunun başlığında aynı sözcük, Open, yer alır; her başlığın yazıldığı bağlam onları ayırt eder." }
  - { text: Composites, translation: Bileşikler }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "Bu sayfanın tamamı, her uygulamanın referansla yerleştirdiği bir görünümdür. Aşağıda, yerleştirildiği yerde satır içi yazılmış bir görünüm ve bu örneğe özgü, denetleyicisi olmayan bir bileşik türü yer alır." }
  - { text: A view declared inline at the node that places it., translation: "Onu yerleştiren düğümde satır içi bildirilmiş bir görünüm." }
  - { text: A callout, translation: Vurgulu not }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Ui.Composite türünü genişleten ve bir görünüm sağlayan bir tür olarak bir kez bildirilir ve kendi alanlarıyla yerleştirilir." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: Sekmeler }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "Sekmeler altında içerik, her seferinde bir sekme. Seçilen sekme sayfa adresinin parçasıdır, bu yüzden yenileme ya da paylaşılan bir bağlantı onu yeniden açar." }
  - { text: Summary, translation: Özet }
  - { text: "A tab holds any nodes, as a box does.", translation: "Bir sekme, tıpkı bir kutu gibi, her türlü düğümü barındırır." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "Yalnızca seçilen sekmenin düğümleri çizilir." }
  - { text: Chosen, translation: Seçili }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "Her sekme, her düğüm gibi, kendi when koşuluna göre teslim edilir." }
  # The labels of the overview's models.
  - { text: Code, translation: Kod }
  - { text: Name, translation: Ad }
  - { text: Status, translation: Durum }
  - { text: Active, translation: Aktif }
  - { text: Paused, translation: Duraklatıldı }
  - { text: Finished, translation: Tamamlandı }
  - { text: Budget, translation: Bütçe }
  - { text: Started, translation: Başladı }
  - { text: Free, context: subscription, translation: Ücretsiz }
  - { text: Enterprise, context: subscription, translation: Kurumsal }
  - { text: Version, translation: Sürüm }
  - { text: Team, context: subscription, translation: Ekip }

  # Conditions.
  - { text: Delivered and drawn, translation: Teslim edilen ve çizilen }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "Bir düğümün when koşulu, düğümün teslim edilip edilmeyeceğine sunucuda karar verir; shown koşulu ise teslim edilen düğümün çizilip çizilmeyeceğine tarayıcıda karar verir." }
  - { text: Never delivered — this node is not in the page document., translation: Asla teslim edilmez — bu düğüm sayfa belgesinde yok. }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "Teslim edilir ama asla çizilmez: durum paused değil, bu yüzden tarayıcı bunu gözden uzak tutar." }
  - { text: Delivered by its when and drawn by its shown., translation: Kendi when koşuluyla teslim edilir ve kendi shown koşuluyla çizilir. }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "Düğümünün kendi koşulu olan bir bileşiği saran yerleştirme koşulu bir kutuya sarılır ve ikisinin de sağlanması gerekir." }
  - { text: Both conditions hold., translation: İki koşul da sağlanıyor. }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "İçeriği kendi when koşuluyla kapatılan bir görünüm hiçbir düğüm sağlamaz, bu yüzden onu yerleştiren bileşik dışarıda bırakılır." }
  - { text: Never provided., translation: Asla sağlanmaz. }
  - { text: Every keyword of a condition, translation: Bir koşulun her anahtar sözcüğü }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "Aşağıdaki her satır, koşulu bu sayfanın okuduğu TEL-42 projesinin özeti için sağlandığından çizilir: durum active, dört üye, hız 2.5, design ve web etiketleri, yönetici olan bir sorumlu, null bir note ve codename yok." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: üzerinde 1 ile 10 arası kişi çalışıyor." }
  - { text: "required: the lead has an e-mail.", translation: "required: sorumlunun bir e-postası var." }
  - { text: "properties: the lead is a manager.", translation: "properties: sorumlu bir yönetici." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: üzerinde en az üç kişi çalışıyor." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: üzerinde en fazla dokuz kişi çalışıyor." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: hız 2 değerinden büyük." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: hız 3 değerinden küçük." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: hız 0.5 değerinin katı." }
  - { text: "type: the status is a string.", translation: "type: durum bir dize." }
  - { text: "type, as a list: the note is a string or null.", translation: "type, liste olarak: note bir dize ya da null." }
  - { text: "const: the status is active.", translation: "const: durum active." }
  - { text: "enum: the status is active or paused.", translation: "enum: durum active ya da paused." }
  - { text: "not: the status is not paused.", translation: "not: durum paused değil." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code, TEL ya da OPS ile başlıyor." }
  - { text: "items: every tag has at least two letters.", translation: "items: her etiket en az iki harfli." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: en az iki etiket var." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: en fazla beş etiket var." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: hiçbir etiket tekrarlanmıyor." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code en az üç karakterli." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code en fazla on karakterli." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code harflerden, bir tireden ve rakamlardan oluşuyor." }
  - { text: Missing and null, translation: Eksik ve null }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null, var olan bir değerdir. Eksik bir değer hiçbir koşulu sağlamaz, not altındaki bir koşulu bile; bu yüzden yokluk üst öğe üzerinde sınanır." }
  - { text: The note is present and null., translation: "note var ve değeri null." }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "Asla çizilmez: eksik bir codename not koşulunu sağlamaz." }
  - { text: "The project has no codename, tested on the summary.", translation: "Projenin codename değeri yok; özet üzerinde sınandı." }
  - { text: Query parameters, translation: Sorgu parametreleri }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "Bu okuyucu mode, tag değerlerinden oluşan bir liste ve bir desene bağlı bir ticket bildirir. Adresin dışarıda bıraktığı bir parametre, iki kez verilen tekil bir parametre ya da bildiriminin reddettiği bir değer eksik sayılır." }
  - { text: Mode detailed, translation: detailed modu }
  - { text: Two tags, translation: İki etiket }
  - { text: A valid ticket, translation: Geçerli bir ticket }
  - { text: A refused ticket, translation: Reddedilen bir ticket }
  - { text: Mode given twice, translation: İki kez verilen mod }
  - { text: Clear the query, translation: Sorguyu temizle }
  - { text: mode is detailed., translation: mode değeri detailed. }
  - { text: There are two tag values or more., translation: İki ya da daha fazla tag değeri var. }
  - { text: The ticket matches its pattern., translation: ticket kendi desenine uyuyor. }
  - { text: "No ticket, or one its pattern refuses.", translation: "ticket yok ya da deseninin reddettiği bir ticket var." }
  - { text: Enablement, translation: Etkinleştirme }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "Düğmeye yalnızca formun içeriğine ilişkin koşulu sağlandığında basılabilir; koşul sağlanmadığı sürece düğme nedenini söyler. Projede zaten bulunan bir etiket reddedilir ve bir etiket eklendikten sonra yukarıdaki satırlar özeti yeniden okur." }
  - { text: Tag TEL-42, translation: "TEL-42'yi etiketle" }
  - { text: Tag, translation: Etiket }
  - { text: Type a tag of three letters or more., translation: En az üç harfli bir etiket yazın. }
  - { text: "Tagged {$tag}: TEL-42 has {$count} tags now.", translation: "{$tag} etiketi eklendi: TEL-42'nin artık {$count} etiketi var." }
  - { text: A page's own query, translation: Sayfanın kendi sorgusu }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "Bu sayfa da mode bildirir ve kendi düğümleri onu okur." }
  - { text: The page reads mode as detailed., translation: Sayfa mode değerini detailed olarak okuyor. }

  # Data.
  - { text: A reader and its parameters, translation: Bir okuyucu ve parametreleri }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "Proje, sayfa adresindeki project parametresidir ve okumayla birlikte gönderilir; parametre yoksa gönderilmez ve rota TEL-42 için yanıt verir. Hiçbir projeye ait olmayan bir kod hata ağacını çizer." }
  - { text: A code no project has, translation: Hiçbir projeye ait olmayan kod }
  - { text: No project, translation: Proje yok }
  - { text: Reading the project…, translation: Proje okunuyor… }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, sorumlu: {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "Bunun içeriğine yerleştirilmiş bir okuyucu, aynı proje üzerinde çalışan kişileri okur." }
  - { text: Working on it, translation: Üzerinde çalışanlar }
  - { text: Role, translation: Rol }
  - { text: E-mail, translation: E-posta }
  - { text: "No answer · {$code}", translation: "Yanıt yok · {$code}" }
  - { text: Readers that fail, translation: Başarısız olan okuyucular }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "Kendi hata ağacı olmayan okuyucular hatanın kodunu ve iletisini çizer — var olmayan bir proje, oturum olmadan okunan korumalı bir rota ve okuyucunun modelinin reddettiği bir yanıt (tek bir proje olarak okunan proje listesi) için." }
  - { text: "Never drawn: there is no such project.", translation: "Asla çizilmez: böyle bir proje yok." }
  - { text: "Signed in, so this reads: {$name}", translation: "Oturum açık, bu yüzden okunan: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "Asla çizilmez: bir liste proje değildir." }
  - { text: Read again on focus, translation: Odaklanınca yeniden okuma }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "Bu okuyucu, pencere odağı her yeniden kazandığında sunucunun saatini yeniden okur. Başka bir pencereye geçip geri dönün." }
  - { text: Read at, translation: Okunma zamanı }
  - { text: A sign-in gate, translation: Bir oturum açma geçidi }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "Geçit bir oturumun açık olup olmadığını okur ve içindeki bir istek 401 yanıtı aldığında bunu yeniden okur. Oturum açmak, ekipten bir üye için oturum başlatır; ekipte kimsenin sahip olmadığı bir e-posta kendi alanında reddedilir. İçeride, korumalı bir rotayı okuyan bir okuyucu hesabı gösterir. Oturumu sessizce sonlandırmak, bir sonraki korumalı istek — aşağıdaki denetim ya da bir odaklanma — reddedilene kadar hesabı ekranda bırakır; geçit ardından oturum kapalı görünümüne geçer." }
  - { text: You are signed out., translation: Oturumunuz kapalı. }
  - { text: Sign in, translation: Oturum aç }
  - { text: "Signed in as {$name}", translation: "Oturum açan: {$name}" }
  - { text: "Member since {$since}", translation: "Üyelik başlangıcı: {$since}" }
  - { text: Check the session, translation: Oturumu denetle }
  - { text: End the session quietly, translation: Oturumu sessizce sonlandır }
  - { text: Sign out, translation: Oturumu kapat }

  # The labels of the task models.
  - { text: Task, translation: Görev }
  - { text: Assignee, translation: Atanan kişi }
  - { text: Priority, translation: Öncelik }
  - { text: Estimate, translation: Tahmin }
  - { text: Due, translation: Son tarih }
  - { text: Label, translation: Kategori }
  - { text: Blocked, translation: Engellendi }
  - { text: To do, translation: Yapılacak }
  - { text: In progress, translation: Devam ediyor }
  - { text: In review, translation: İncelemede }
  - { text: Bug, translation: Hata }
  - { text: Feature, translation: Özellik }
  - { text: Chore, translation: Bakım işi }
  - { text: Docs, translation: Belgeler }
  - { text: Contact, translation: İletişim }
  - { text: Project name, translation: Proje adı }
  - { text: Brief, translation: Kısa açıklama }

  # Tables.
  - { text: Columns from the model, translation: Modelden sütunlar }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "Sütun yazılmadığında tablo, satır anahtarı dışındaki her model özelliği için bir sütun gösterir; her sütunun başlığı özelliğin başlığıdır ve türüne göre çizilir. Varsayılan olarak sayfa başına 25 satır gösterir ve oluşturma ile düzenleme formlarını bir iletişim kutusunda açar — tablo bir yüzey belirtmediğinde kullandığı yüzey budur." }
  - { text: "Written columns, sorting and style rules", translation: "Yazılmış sütunlar, sıralama ve stil kuralları" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "Verilen sırayla elle yazılmış sütunlar; birinin kendi başlığı var. Koleksiyon bir sütunun özelliğini sıralama için listelediğinde o sütun sıralanabilir. Engellenmiş bir görevin satırı belirgin ve kırmızıdır, her durum hücresinin kendi rengi vardır ve hiçbir kuralın adlandırmadığı bir öncelik varsayılan stili alır. Sayfa başına sekiz satır." }
  - { text: Where, translation: Nerede }
  - { text: Members behind a reference, translation: Bir referansın ardındaki alanlar }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "Görev panosu her görevi, içine yerleştirilmiş atanan kişisi ve projesiyle birlikte döndürür. İç içe bir alan üzerindeki sütun, o alanın başlığını ve sunumunu adlandırılmış bir şekil, modelin kendi tanımı ve kendi başlığı adlandırdığı şeklinkine üstün gelen bir referans aracılığıyla alır: iletişim bir e-posta bağlantısı, kısa açıklama ise bir sayfaya giden bağlantıdır." }
  - { text: Filtered by the address, translation: Adrese göre filtrelenmiş }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "Bu tablo bir project parametresi bildirir ve onu her istekle bir eşitlik olarak gönderir. Adreste proje yoksa hiçbir şey okumaz." }
  - { text: Atlas redesign tasks, translation: Atlas yeniden tasarım görevleri }
  - { text: Billing migration tasks, translation: Faturalama taşıma görevleri }
  - { text: Blocked tasks, translation: Engellenen görevler }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "Bu tablo, içine yazılmış sabit bir değerle filtrelenir ve yalnızca engellenen görevleri listeler." }
  - { text: Where a form opens, translation: Formun açıldığı yer }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "Aşağıdaki her tablo, oluşturma ve düzenleme formlarını farklı bir yüzeyde açar. Her kayıt, sayfadaki tüm görev tablolarını yeniden yükler." }
  - { text: Dialogs, translation: İletişim kutuları }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "Oluşturma, başka bir görev için boşaltılıp açık kalan küçük bir iletişim kutusunda. Düzenleme, sayfayı engellemeyen ve dışarıya tıklamayı yok sayan büyük bir iletişim kutusunda; kaydettikten sonra değerlerini korur, kaydedilmemiş girdiyi sormadan atar ve adresin parçasıdır. Her satır onaylı bir silme sunar." }
  - { text: Drawers, translation: Çekmeceler }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "Oluşturma, başlangıç kenarından açılan küçük bir çekmecede; düzenleme, bitiş kenarından açılan, kapatma düğmesi olmayan büyük bir çekmecede. İkisi de kaydettikten sonra kapanır ve kaydedilmemiş girdi atılmadan önce sorar." }
  - { text: Sheets, translation: Kayan sayfalar }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "Oluşturma, üstten açılan ve sayfayı engellemeyen bir kayan sayfada; düzenleme, alttan açılan, adresin parçası olan tam boy bir kayan sayfada." }
  - { text: Popovers, translation: Açılır balonlar }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "Oluşturma, Yeni düğmesinin yanında, ona ortalanmış bir kartta; kırılma noktasının altında tam bir iletişim kutusuna dönüşür. Düzenleme, satırın düğmesinin altında, düğmenin sonuna hizalanmış, dışarıya tıklamayla kapanmayan ve kaydettikten sonra açık kalan bir kartta." }
  - { text: In line, translation: Satır içinde }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "Oluşturma formu satırların üstünde, düzenleme formu ise değiştirdiği satırın altında açılır. Kırılma noktasının altında oluşturma formu alttan açılan bir kayan sayfada açılır." }
  - { text: Panels, translation: Paneller }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "Oluşturma, başlangıç kenarında, Escape ile kapanmayan küçük bir panelde. Düzenleme, bitiş kenarında, adresin parçası olan ve yanında satırların kullanılabilir kaldığı büyük bir panelde; kırılma noktasının altında alttan açılan bir kayan sayfaya dönüşür." }
  - { text: A page of its own, translation: Ayrı bir sayfa }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "Oluşturma ve düzenleme, sayfanın içeriğini tek bir adres adı altında değiştirir; böylece adres ya yeni bir görevi ya da bu anahtara sahip görevi belirtir ve Geri formu kapatır. Yüzey bir kez bildirilir ve ikisi tarafından da adlandırılır." }

  # Filters.
  - { text: Every filter the collection accepts, translation: Koleksiyonun kabul ettiği her filtre }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "Alan yazılmadığında çubuk, koleksiyonun kabul ettiği her filtre için, koleksiyonun sırasıyla ve modelin özelliğine göre bir denetim çizer: numaralandırma ya da evet/hayır değeri için bir liste, aksi halde türüne uygun bir giriş kutusu ve bir aralığın iki sınırı üzerinde tek bir etiket. Tablonun üstünde durur, bir seçimi hemen, yazılan metni ise Enter ile uygular ve ziyaretler arasında hiçbir şey saklamaz." }
  - { text: Every control, translation: Her denetim }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "Bir filtreyi girmenin her yolu: yazılan metin, yan yana seçenekler, bir liste, yazılan etiketler, bir kaydırıcı, bir geçiş düğmesi ve tek bir etiket altında iki tarih. Proje filtresi hiçbir yerde çizilmez ve onu yalnızca bir hazır ayar belirler. Durum varsayılan değeriyle başlar; bir hazır ayar kendi adlandırdığı filtreleri ayarlar ve hazır ayarların adlandırdığı diğer filtreleri temizler. Çipler seçilenleri özetler ve değerler adresin parçasıdır. Kırılma noktasının altında çubuk katlanır ve sabitlenmiş metin filtresi katlanan bölümün dışında kalır." }
  - { text: Urgent, translation: Acil }
  - { text: Atlas only, translation: Yalnızca Atlas }
  - { text: Stuck, translation: Takılanlar }
  - { text: "Beside, as chips, while typing", translation: "Yanda, çip olarak, yazarken" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "Denetimler başlangıç kenarında bir sütunda durur. Yalnızca seçtiğiniz filtreler görünür: çubuğun listesinden bir filtre ekleyin; kaldırmak onu temizler. Her filtre, değerini gösteren ve denetimini açan bir çiptir. Yazılan metin kısa bir duraksamadan sonra uygulanır ve bir sayının iki sınırı > ve < işaretleriyle etiketlenir. Seçim bu tarayıcıda ziyaretler boyunca saklanır. Kırılma noktasının altında çubuk alttan açılan bir kayan sayfada açılır." }
  - { text: "Beside at the end, applied by a button", translation: "Bitiş kenarında yanda, düğmeyle uygulanan" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "Denetimler bitiş kenarında durur ve bir değişiklik Uygula düğmesini bekler; bir hazır ayar, Sıfırla ve bir özet çipini kaldırmak ise hemen uygulanır. Birden fazla atanan kişi virgülle ayrılarak yazılır. Seçim yalnızca bu sekme için saklanır ve yeniden yüklemeden sonra da korunur." }
  - { text: Due by October, translation: Ekime kadar teslim }
  - { text: "Folded, starting open", translation: "Katlanır, açık başlar" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "Denetimler, değer taşıyan filtreleri sayan bir açma/kapama düğmesinin arkasına katlanır ve açık başlar. Sabitlenmiş metin filtresi katlanan bölümün dışında kalır, diğerleri çubuğun listesinden eklenir. Durum, devam ediyor değeriyle başlar; kaldırmak bu varsayılanı da temizler, Sıfırla ise geri getirir. Değerler hem adreste hem bu tarayıcıda saklanır, öncelik adrestedir; seçtiğiniz katlama durumu da hatırlanır." }
  - { text: "Folded, starting closed", translation: "Katlanır, kapalı başlar" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "Başlangıçta katlıdır. Sabitlenmiş metin filtresi, Uygula ve Sıfırla katlanan bölümün dışında kalır. Kategori, değiştirilene kadar varsayılan değeri olan hatalarla başlar; Sıfırla varsayılanı geri getirir." }
  - { text: In a dialog, translation: Bir iletişim kutusunda }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "Denetimler, değer taşıyan filtreleri sayan bir düğmeyle küçük bir iletişim kutusunda açılır ve Tamam ile kapanır. Açık iletişim kutusu adresin parçasıdır, bu yüzden bir bağlantı onu açar. Sabitlenmiş metin filtresi düğmenin yanında kalır ve çipler seçilenleri özetler." }
  - { text: In a drawer, translation: Bir çekmecede }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "Denetimler, başlangıç kenarından açılan ve dışarıya tıklamayla kapanmayan bir çekmecede açılır. Yazılan değerler kısa bir duraksamadan sonra uygulanır." }
  - { text: In a popover, translation: Bir açılır balonda }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "Denetimler, düğmenin altında, sonuna hizalanmış bir kartta açılır; kırılma noktasının altında ise alttan açılan bir kayan sayfada." }

