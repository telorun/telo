# A collection its own declarations contradict. `telo check` reports it here; a
# consumer's check sees nothing, so there the collection refuses itself when
# it is created.
kind: Telo.Library
metadata:
  name: CrudCollectionPropertyUnknownColumn
  version: 1.0.0
  description: Test fixture exporting a collection refused as CRUD_COLLECTION_PROPERTY_UNKNOWN_COLUMN.
imports:
  Crud: ../../../../../
  SQLite: ../../../../../../sqlite
exports:
  resources: [collection]
---
kind: Telo.JsonSchema
metadata: { name: Draft }
schema:
  type: object
  required: [text]
  additionalProperties: false
  properties:
    text: { type: string }
---
kind: Telo.JsonSchema
metadata: { name: Record }
extends: Draft
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
    dueOn: { type: string }
---
# The column is named as the property is, not as its snake_case.
kind: SQLite.Table
metadata: { name: notesTable }
table: notes
columns:
  id: { type: integer, primaryKey: true }
  text: { type: text }
  dueOn: { type: text }
---
kind: Crud.Collection
metadata: { name: collection }
model: !ref Record
table: !ref notesTable
schemas: { list: !ref Record, create: !ref Draft, update: !ref Draft }
query: { filters: [], sort: [] }
