kind: Telo.Library
metadata:
  name: NotesRepository
  version: 1.0.0
  description: |
    A reusable `Telo.Library` for a `notes` table: it owns the SQLite connection,
    the schema migration, and typed `SqlRepository` create/read resources, and
    exports them as ready-made singletons. Importers add `Migrate` to their
    `targets` and dispatch to `CreateNote` / `ListNotes` from their own routes —
    no hand-written SQL beyond the migration.
imports:
  Sql: oci://ghcr.io/telorun/sql@0.21.3#sha256-wPgugWO72ulGwO8Xhu9WUPyUimpO6QS0Owadfrn98hc
  SQLite: oci://ghcr.io/telorun/sql-sqlite@0.7.3#sha256-AdpaRCphd3vnfMVoyMZGpsUZ7y5xAo4w72i1j8_ZCVg
  SqlRepository: oci://ghcr.io/telorun/sql-repository@0.10.3#sha256-EAkSFjd_ULYi_99svU4J6DD4tjBp49zNdeYfB9WeHG0
exports:
  resources:
    - migrate
    - createNote
    - listNotes
---
kind: SQLite.Connection
metadata:
  name: db
file: ./tmp/notes.sqlite
---
kind: Sql.Migrations
metadata:
  name: migrate
connection: !ref db
migrations:
  0001_create_notes:
    statement: |
      CREATE TABLE IF NOT EXISTS notes (
        id         INTEGER PRIMARY KEY AUTOINCREMENT,
        title      TEXT    NOT NULL,
        body       TEXT,
        created_at DATETIME DEFAULT CURRENT_TIMESTAMP
      )
---
kind: SqlRepository.Create
metadata:
  name: createNote
connection: !ref db
table: notes
---
kind: SqlRepository.Read
metadata:
  name: listNotes
connection: !ref db
table: notes
