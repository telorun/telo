modules:
  modules/ai: Added
body: "Typed caller context for an agent's tools, a step budget that can end in an
  answer, and tool choice on model calls. Ai.Tools gains contextType, the shape of the
  caller data its tools' inputs: mappings read as context; without it context is empty,
  so reading a field of it is refused by telo check. Ai.Agent and Ai.AgentStream gain a
  context input (default {}) that must satisfy the contextType of every mounted provider
  and is handed to each tool dispatch, never to the model. onMaxSteps gains conclude,
  with conclusionPrompt: at maxSteps the agent makes one more model call that declares
  the tools, may not use one, and ends with the prompt; a tool call it returns is
  neither run nor emitted. conclusionPrompt without onMaxSteps: conclude is refused by
  telo check and at creation (AI_CONCLUSION_PROMPT_UNUSED). Ai.Agent's output and the
  terminal finish part of Ai.AgentStreamPart gain limit (max-steps), set whenever the
  step budget ended the run, whether by return or by conclude. maxSteps may be a CEL
  expression. The call input of Ai.Model and Ai.ModelStream gains toolChoice (auto or
  none), legal only beside tools. Ai.ToolProvider implementations receive the caller
  context as a fourth argument of callTool and callToolWithOutput. Breaking: telo check
  and load-time analysis now check the arguments of every call to an ai kind, so a call
  that passed check and failed at dispatch with ERR_INPUT_INVALID is now refused with
  CONTRACT_INPUTS_MISMATCH before the application starts. The module now requires telo
  >=0.107.0, the first runtime that derives the context contract."
