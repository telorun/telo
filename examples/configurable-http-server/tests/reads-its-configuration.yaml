kind: Telo.Application
metadata:
  name: ConfigurableHttpServerExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/configurable-http-server` with configuration this test supplies
    and checks that the values reached the handler. The example is about
    configuration arriving from outside the manifest, so the assertion is that what
    was handed in is what comes back — with the secret still hinted rather than
    echoed.
imports:
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    ports: { http: 4444 }
    variables: { apiBaseUrl: https://api.example.test }
    secrets: { stripeSecretKey: sk_test_0000000000001234 }
targets:
  - !ref app
steps:
  - name: charge
    invoke: { kind: HttpClient.Request, url: http://127.0.0.1:4444/v1/charge, method: POST }
    inputs: { body: {} }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.charge.result.status"
        body: !cel "steps.charge.result.body"
      expected:
        status: 200
        body: { ok: true, upstream: https://api.example.test, keyHint: "sk_t…1234" }
