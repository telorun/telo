# Reads the declared member through both wrappers.
kind: Telo.Application
metadata:
  name: ValueSchemaFromDeclared
  version: 1.0.0
imports:
  Kinds: ./kinds.yaml
  Run: ../../../modules/run
  Assert: ../../../modules/assert
targets:
  - !ref main
---
kind: Kinds.Body
metadata: { name: body }
---
kind: Kinds.ChildBody
metadata: { name: childBody }
---
kind: Kinds.Once
metadata: { name: once }
invoke: !ref body
---
kind: Kinds.Once
metadata: { name: onceChild }
invoke: !ref childBody
---
kind: Run.Sequence
metadata: { name: main }
steps:
  - name: call
    invoke: !ref once
  - name: callChild
    invoke: !ref onceChild
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual: [!cel "steps.call.result.result.total", !cel "steps.callChild.result.result.total"]
      expected: [3, 3]
