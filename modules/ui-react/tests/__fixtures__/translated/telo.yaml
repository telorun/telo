# Translated into Polish: its own texts by a catalog, ui's by the shipped
# `Ui.polishTranslations`. One server negotiates by Accept-Language and the
# `lang` query, the second by a cookie as well. Open http://127.0.0.1:8130/.
kind: Telo.Application
metadata: { name: UiTranslatedFixtureApp, version: 1.0.0 }
requires: { telo: ">=0.129.0" }
lang: en
imports:
  Http: ../../../../http-server
  Ui: ../../../../ui
  DataModel: ../../../../data-model
  UiReact: ../../../
ports:
  http: { env: PORT, default: 8130 }
  cookie: { env: COOKIE_PORT, default: 8131 }
translations:
  catalogs:
    - !ref Ui.polishTranslations
    - !ref polish
targets:
  - !ref server
  - !ref cookieServer
---
kind: Telo.JsonSchema
metadata: { name: Invoice }
schema:
  type: object
  required: [number]
  properties:
    number: { type: string, title: Number, minLength: 3 }
    state:
      title: State
      type: string
      oneOf:
        - { const: open, title: Open }
        - { const: paid, title: Paid }
---
kind: Telo.TextTranslations
metadata: { name: polish }
lang: pl
texts:
  - { text: Invoices, translation: Faktury }
  - { text: Unpaid invoices, translation: Nieopłacone faktury }
  - text: { plural: n, cases: { one: "{$n} unpaid item", other: "{$n} unpaid items" } }
    translation: { plural: n, cases: { one: "{$n} nieopłacona pozycja", few: "{$n} nieopłacone pozycje", other: "{$n} nieopłaconych pozycji" } }
  - { text: Number, translation: Numer }
  - { text: Open, translation: Otwarta }
  - { text: Open, context: state, translation: Otwarte }
  - { text: Paid, translation: Opłacona }
  - { text: Help, translation: Pomoc }
  - { text: Staff, translation: Personel }
---
kind: Ui.Form
metadata: { name: invoiceForm }
model: !ref Invoice
presentation:
  kind: Ui.CollectionPresentation
  source:
    kind: Ui.CollectionSource
    basePath: /api/invoices
    collection: { kind: DataModel.Collection, model: !ref Invoice, key: number, query: { filters: [], sort: [] } }
---
kind: Ui.View
metadata: { name: helpLink }
content: { type: link, text: Help, href: /help }
---
# Its header holds a logo, a composite, a menu with an item delivered per
# request, and a badge delivered per request.
kind: UiReact.App
metadata: { name: app }
title: Invoices
theme: !ref UiReact.defaultTheme
header:
  start:
    - { type: image, src: /logo.svg, alt: Invoices }
  end:
    - { type: composite, ref: !ref helpLink }
    - type: menu
      text: Help
      items:
        - { type: link, text: Help, href: /help, style: strong }
        - type: link
          text: Staff
          href: /staff
          when: !cel "'x-role' in request.headers && request.headers['x-role'] == 'staff'"
    - type: badge
      text: Staff
      when: !cel "'x-role' in request.headers && request.headers['x-role'] == 'staff'"
pages:
  - kind: Ui.Page
    path: /
    title: Invoices
    children:
      - { type: text, text: Unpaid invoices, style: heading }
      - type: text
        text:
          text: { plural: n, cases: { one: "{$n} unpaid item", other: "{$n} unpaid items" } }
          values: { n: 3 }
      - { type: composite, ref: !ref invoiceForm }
      - { type: badge, text: { text: Open, context: state } }
---
kind: Http.Server
metadata: { name: server }
listen:
  address: 127.0.0.1
  port: !cel "ports.http"
preferredLanguages: !cel "'lang' in request.query ? [request.query.lang] : []"
mounts:
  - path: /
    mount: !ref app
---
kind: Http.Server
metadata: { name: cookieServer }
listen:
  address: 127.0.0.1
  port: !cel "ports.cookie"
preferredLanguages: !cel "'cookie' in request.headers && request.headers.cookie.contains('lang=pl') ? ['pl'] : []"
mounts:
  - path: /
    mount: !ref app
