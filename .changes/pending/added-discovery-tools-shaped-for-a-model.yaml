modules:
  apps/hub: Added
body: "Discovery tools shaped for a model's context. The search_resources tool takes
  several queries in one call (queries, each answered under results) and a limit per
  query (default 8), groups hits under the module that owns them so a module's ref,
  version and description are stated once, and leaves out members that say nothing. New
  get_kinds tool returns the definitions of exactly the kinds named, across modules,
  with each module's imports line (ref, version and integrity pin), the shapes and
  parent kinds a definition references, and no controllers. New list_libraries tool
  lists every tracked library in one line each, optionally for one publisher. Search
  ranking gains an identity arm: a query spelling a module and kind name (http server)
  leads with that module's kinds. Breaking: the search_resources tool no longer answers
  a flat hits list with the categories facet on every response; read
  results[].modules[].hits, and list_categories for the facet. The HTTP search routes
  are unchanged."
