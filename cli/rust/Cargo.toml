[package]
name = "telo-cli"
version = "0.0.0"
edition = "2021"
publish = false
description = "Command-line entry point for the Rust Telo kernel."

[[bin]]
name = "telo-rs"
path = "src/main.rs"

[dependencies]
telo-kernel = { path = "../../kernel/rust" }

# For the loopback registry support the kernel's integration tests share.
[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
telo-analyzer = { path = "../../analyzer/rust" }
tempfile = "3"
