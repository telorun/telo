kind: Telo.Library
metadata:
  name: DurableLocal
  version: 0.2.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Reliability, Coordination]
  description: |
    Runs a body of steps so that a crash and a restart continue where the work stopped,
    with no engine to deploy: progress is recorded to a store you choose, and a poller
    picks up runs the process died in the middle of. Records what each step returned and
    every decision the body reached, so a resume takes the same branches it took before.
requires:
  # 0.82.0: controllers return their effects from `init()` / `run()`; a runtime
  # that does not execute a returned chain allocates nothing and undoes nothing.
  telo: ">=0.82.0"
imports:
  Durable: ../durable
exports:
  kinds:
    - Workflow
    - Journal
    - Resumer
    - Deliver
    - Status
    - Result
    - Cancel
    - Schedule
    - Resume
---
# DurableLocal.Workflow — the single body-dispatch site of this backend.
#
# Whatever the engine, exactly one kind holds the body, carries the providing
# annotation, installs the run handle and drives replay. Everything else in a
# backend's module addresses runs from OUTSIDE: start, status, result, cancel.
#
# It carries `steps:` natively rather than pointing an `invoke:` at a separate
# sequence, and that is a SAFETY property rather than a convenience. A named body
# is a body anything can invoke directly — running journal-free steps up to its
# first parking point, through an edge no static check can see. With the grammar
# built in there is no second resource to misuse: the shape is unreachable rather
# than merely diagnosed.
kind: Telo.Definition
metadata:
  name: Workflow
  description: >-
    Runs a body of steps durably: records the run before executing it, records what each
    step returned and every decision the body reached, and on a restart replays those
    records instead of re-running the work. Takes a caller-chosen run id, so submitting
    the same operation twice attaches to the live run rather than starting a second one.
capability: Telo.Invocable
extends: Durable.Run
controllers:
  - pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#workflow
# NO `status:` block, and the reason is a kernel limitation rather than a
# choice. Observed state is illegal before a resource has started, and the kernel
# marks a Telo.Invocable started only when it is a pure Runnable reached through
# an invoke slot — so an Invocable cannot report observed state at all today.
# The run's own observations therefore ride its RESULT for now:
#
#   { runId, replayed, collapsedRegions, collapseReasons, result }
#
# `collapsedRegions` is the one that matters to an operator, because whether a
# deployment got exactly-once or at-least-once turns on whether the journal's
# writes land inside the transaction's atomicity — a runtime coincidence the
# manifest cannot show. It belongs in observed state, which is where it goes once
# an invocable can report; the answer is constant (always collapsed) until a
# journal that shares a transaction exists, so nothing is lost by waiting.
schema:
  type: object
  required: [journal, steps]
  additionalProperties: false
  properties:
    journal:
      title: Journal
      description: Where this workflow's runs and their progress are recorded.
      x-telo-ref:
        kind: Self.Journal
        use: dependency
    runId:
      title: Run id
      description: >-
        CEL over the call's inputs, producing this run's identity. Submitting the same id
        again attaches to the live or completed run instead of starting a second one —
        which is how an idempotent start is expressed. Omit it and one is minted.
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
    onConflict:
      title: On conflict
      description: >-
        What to do when the run id is already taken. `attach` returns the existing run's
        id; `reject` fails. Spelled in this backend's own words — each engine's policy
        has its own states, and a shared three-value enum was a lossy translation of all
        of them.
      type: string
      enum: [attach, reject]
      default: attach
    steps:
      title: Steps
      description: The body. Every step's outcome is recorded as it completes.
      x-telo-topology-role: steps
      type: array
      items:
        $ref: "telo://manifest#/$defs/Step"
      # `replayed` — and nothing else — is what marks this zone durable to the
      # static checks. Keying them on the bare providing annotation would apply
      # them inside every transaction in the ecosystem; keying them on a KIND
      # would put this module into the analyzer's surface.
      x-telo-provides-zone:
        replayed: >-
          every step's outcome and every decision the body reaches is recorded, and a
          resume returns those records instead of re-executing the work
      x-telo-context:
        type: object
        properties:
          inputs: {}
    inputs:
      title: Inputs
      type: object
      additionalProperties: true
      description: Values forwarded into the body, read there as `inputs.<field>`.
      x-telo-context:
        type: object
        properties:
          inputs: {}
---
# DurableLocal.Journal — this backend's storage seam, and NOT everyone's.
#
# It sits inside this module rather than standing alone for two reasons. A
# standalone `journal` module would collide with `record-stream`'s existing
# `Journal` kinds on name, alias and hub search. And more importantly it is one
# backend's mechanism: a hosted engine has no journal to configure, so an abstract
# at the shared level would be a contract two of three backends implement by
# leaving it empty.
#
# The operations that matter are NOT "a table with rows in it": they are claiming
# due runs without two resumers taking the same one, and waking promptly. That is
# why a backend implements this rather than a generic key/value store being reused
# — `KvStore.Store` is deliberately point-access only, and widening it to answer a
# range query would weaken a contract four modules already depend on.
kind: Telo.Abstract
metadata:
  name: Journal
  description: >-
    Durable storage for runs and their progress: appends a record per completed step and
    per decision, reads a run's records back in order, and finds runs that stopped
    mid-flight so a poller can continue them. First writer wins at a given key, so two
    processes racing on the same step cannot both record it.
capability: Telo.Provider
---
# DurableLocal.Resumer — the recovery and wake path, and NOT the scheduler.
#
# A start does its own first execution in the process that received it (see the
# workflow's `admit before executing`), so this does not balance starts across
# workers; it picks up runs whose process died. The trade is recorded rather than
# hidden: routing every start through this poll interval would put seconds of
# latency on a request-triggered run for no gain in recovery, since admitting
# before dispatch already makes an in-between crash recoverable.
kind: Telo.Definition
metadata:
  name: Resumer
  description: >-
    Polls for runs that stopped mid-flight and continues them, which is what turns a
    recorded run into a recovered one after the process holding it died. Claims each run
    before continuing it, so several pollers against one store do not both take the same
    one.
capability: Telo.Service
controllers:
  - pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#resumer
schema:
  type: object
  required: [workflow]
  additionalProperties: false
  properties:
    workflow:
      title: Workflow
      description: The workflow whose interrupted runs this poller continues.
      x-telo-ref:
        kind: Self.Workflow
        use: [call]
    interval:
      title: Interval
      description: How often to look for interrupted runs.
      type: string
      x-telo-eval: compile
      default: 5s
---
# DurableLocal.Deliver — the wake side of Durable.Await, in this backend's words.
#
# It takes the JOURNAL rather than the workflow, and that is what makes a
# delivery a separate application's operation: a webhook receiver has the store
# and nothing else, and requiring it to declare the workflow would make it depend
# on the body it is waking and on every resource that body reaches.
#
# It does not continue the run — the resumer does, on its next pass. That is what
# lets a delivery arrive in a different process from the one that will execute
# the rest of the body, days later.
kind: Telo.Definition
metadata:
  name: Deliver
  description: >-
    Wakes work that is waiting on a token, handing it the value it was waiting for — an
    approval, a webhook body, a human decision. Reports whether a token matched anything,
    so a token that is stale or already used is an ordinary answer rather than a failure.
    The waiting work continues on whichever process picks it up next.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#deliver
throws:
  codes:
    ERR_DURABLE_PAYLOAD_INVALID:
      description: >-
        The payload does not match the shape declared by the wait named in `await:`.
        Raised here because a delivered value enters the record without being dispatched
        — a replay hands it back as the wait's result rather than re-entering the wait —
        so this is the only moment anything looks at it. A delivery that names no wait
        has nothing to check against and is not validated.
inputType:
  type: object
  additionalProperties: true
outputType:
  type: object
  additionalProperties: false
  required: [delivered]
  properties:
    delivered:
      type: boolean
      description: False when no work is waiting on that token.
    run:
      type: string
schema:
  type: object
  required: [journal, token]
  additionalProperties: false
  properties:
    journal:
      title: Journal
      description: The store holding the runs this delivers to.
      x-telo-ref:
        kind: Self.Journal
        use: dependency
    await:
      title: Await
      description: >-
        The wait this delivers to. Optional: naming it is what checks `payload:` against
        the shape that await declares — statically where the payload is a literal, and at
        runtime for the value actually sent. A delivery addressed by a token from outside
        the manifest names nothing, has no declaration to check against, and is unchecked.
      x-telo-ref:
        kind: Durable.Await
        use: schema
    token:
      title: Token
      description: The address the wait handed out.
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
    payload:
      title: Payload
      description: >-
        What to hand the waiting work. Checked against the shape the named await declares
        — statically where it is written as a literal, and at runtime for the value
        actually sent.
      x-telo-eval: runtime
      x-telo-schema-from: await/outputType
      x-telo-context:
        type: object
        properties:
          inputs: {}
---
# DurableLocal.Status — a live reading, kept separate from Result.
#
# Two kinds rather than one because the questions differ in cost as well as in
# answer: a status is polled, a result may be worth waiting for. One kind
# answering both would have to decide which it was on every call.
kind: Telo.Definition
metadata:
  name: Status
  description: >-
    Reports what a piece of durable work is doing right now — running, waiting, finished,
    called off — and, when it is waiting, what for. An id that was never started, or has
    been purged, reads as unknown rather than failing.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#status
inputType:
  type: object
  additionalProperties: true
  properties:
    run:
      type: string
outputType:
  type: object
  additionalProperties: false
  required: [run, status]
  properties:
    run: { type: string }
    status:
      type: string
      enum: [unknown, scheduled, running, parked, completed, failed, cancelled]
    dueAt: { type: integer }
    parked:
      type: object
      additionalProperties: false
      properties:
        path: { type: string }
        resource: { type: string }
schema:
  type: object
  required: [journal]
  additionalProperties: false
  properties:
    journal:
      title: Journal
      x-telo-ref:
        kind: Self.Journal
        use: dependency
    run:
      title: Run
      description: >-
        Which run to report on. Omit it to take the id from the call's `inputs.run`, which
        is what lets ONE of these serve every run rather than one per id.
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
---
# DurableLocal.Result — the terminal value, optionally waited for.
#
# `wait:` is what makes a detached start usable from a caller that genuinely
# wants the outcome — a test, a script, a request that can afford to block —
# without putting that choice on the START, where it would have to hold a
# connection open across a wait measured in days.
kind: Telo.Definition
metadata:
  name: Result
  description: >-
    Reads what a finished piece of durable work produced, or the error it ended with. Can
    wait a stated length of time for work still in progress, so a caller that wants the
    outcome can ask for it without the work itself having to block anyone.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#result
inputType:
  type: object
  additionalProperties: true
  properties:
    run:
      type: string
outputType:
  type: object
  additionalProperties: true
  required: [run, status]
  properties:
    run: { type: string }
    status:
      type: string
      enum: [unknown, scheduled, running, parked, completed, failed, cancelled]
    error:
      type: object
      additionalProperties: true
    collapsedRegions:
      type: integer
      description: >-
        How many regions of this work re-run whole if it is retried, rather than being
        picked up step by step.
    collapseReasons:
      type: array
      items: { type: string }
      description: The author's own stated reason for each such region.
schema:
  type: object
  required: [journal]
  additionalProperties: false
  properties:
    journal:
      title: Journal
      x-telo-ref:
        kind: Self.Journal
        use: dependency
    run:
      title: Run
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
    wait:
      title: Wait
      description: >-
        How long to wait for work still in progress. Omit to answer immediately with
        whatever state it is in.
      type: string
      x-telo-eval: compile
    poll:
      title: Poll
      description: How often to re-read while waiting.
      type: string
      x-telo-eval: compile
      default: 100ms
---
# DurableLocal.Cancel — call a run off.
#
# `cancelled` is a state of its own and not a synonym for `failed`: a failed run
# earned a verdict, a cancelled one was stopped. Collapsing them would make every
# cancelled run indistinguishable from a broken one in the report an operator
# reads to find out which happened.
kind: Telo.Definition
metadata:
  name: Cancel
  description: >-
    Calls off a piece of durable work so nothing picks it up again, recording that it was
    stopped rather than that it failed. Work already finished is left alone. Work
    executing right now stops at its next wait or restart rather than being interrupted
    mid-step.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#cancel
inputType:
  type: object
  additionalProperties: true
  properties:
    run:
      type: string
outputType:
  type: object
  additionalProperties: false
  required: [run, cancelled, status]
  properties:
    run: { type: string }
    cancelled: { type: boolean }
    status: { type: string }
schema:
  type: object
  required: [journal]
  additionalProperties: false
  properties:
    journal:
      title: Journal
      x-telo-ref:
        kind: Self.Journal
        use: dependency
    run:
      title: Run
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
    reason:
      title: Reason
      description: Recorded with the cancellation, so the report says why.
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
---
# DurableLocal.Schedule — admit now, execute later.
#
# The one operation that must NOT dispatch. A start admits and executes here; a
# schedule admits and stops, leaving the resumer to pick the run up when its time
# comes — which is why a scheduled run stores its inputs, there being no caller
# at the moment it starts.
#
# Distinct from `Scheduler.Cron`, and the difference is the point: a cron firing
# missed while the process is down is simply missed, while this is a durable
# record a restart still finds due.
kind: Telo.Definition
metadata:
  name: Schedule
  description: >-
    Records work to be started at a later time, so a restart in between still finds it due
    and runs it. Stores the values it should start with, since there is no caller at the
    moment it begins. Reusing an id that is already taken schedules nothing, so submitting
    the same request twice queues one piece of work.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#schedule
inputType:
  type: object
  additionalProperties: true
outputType:
  type: object
  additionalProperties: false
  required: [runId, scheduled]
  properties:
    runId: { type: string }
    scheduled: { type: boolean }
    dueAt: { type: integer }
    status: { type: string }
schema:
  type: object
  required: [workflow]
  additionalProperties: false
  oneOf:
    - required: [after]
    - required: [at]
  properties:
    workflow:
      title: Workflow
      description: >-
        The work to start later. A dependency rather than a call: this kind records and
        returns, and the resumer is what eventually transfers control.
      x-telo-ref:
        kind: Self.Workflow
        use: dependency
    runId:
      title: Run id
      description: >-
        The identity to schedule under. Reusing one that is taken schedules nothing, which
        is how "do this once" is expressed. Omit it and one is minted.
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
    after:
      title: After
      description: How long from now, as a duration.
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
    at:
      title: At
      description: When, as a timestamp or epoch milliseconds.
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
    inputs:
      title: Inputs
      description: The values the work starts with when its time comes.
      type: object
      additionalProperties: true
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
---
# DurableLocal.Resume — the operator's override, and it is RECORDED.
#
# For one situation: a run held because the code moved under it, where the
# alternatives are to strand it or abandon it. Parking is a hold, not a grave.
#
# The override is written as an ordinary journal entry, which is what makes it
# usable at all — a run continued against changed code may diverge, and a
# divergent run has to be identifiable afterwards rather than indistinguishable
# from a clean one.
kind: Telo.Definition
metadata:
  name: Resume
  description: >-
    Forces held work to continue against the code that is deployed now, for work that was
    held because the code changed underneath it. Writes a record of the override, so work
    that continued against different code than it started with can be identified later.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/durable-local.mjs&local_path=./nodejs/src/index.ts#resume
inputType:
  type: object
  additionalProperties: true
  properties:
    run:
      type: string
outputType:
  type: object
  additionalProperties: false
  required: [run, resumed]
  properties:
    run: { type: string }
    resumed: { type: boolean }
    status: { type: string }
schema:
  type: object
  required: [workflow]
  additionalProperties: false
  properties:
    workflow:
      title: Workflow
      description: >-
        The work this releases. A dependency: this clears the hold and the resumer is what
        transfers control, so that every wake follows one path.
      x-telo-ref:
        kind: Self.Workflow
        use: dependency
    run:
      title: Run
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
    reason:
      title: Reason
      description: Recorded with the override, in your own words.
      type: string
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
