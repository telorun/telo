kind: Telo.Library
metadata:
  name: Chat
  version: 0.0.0
  description: |
    The authoring agent's chat backend: an OpenAI-backed Ai.AgentStream with
    workspace-rooted fs tools (write_file / edit_file / read_file / list_dir /
    delete_file) plus telo_check and a general `telo` CLI tool. `telo check` runs
    automatically after every write/edit, so the agent always validates. Every
    subprocess is execed without a shell as a keyless one (OPENAI_API_KEY unset),
    and the `telo` tool may only name a subcommand listed in `teloVerbs` —
    inspection verbs by default, with `run` / `publish` / `install` / `upgrade`
    absent, so an anonymous prompt can neither execute a manifest on this host nor
    reach the operator's key or registry credentials. Plus live Telo hub discovery tools (an
    AiMcp.ToolProvider over the hub's MCP endpoint — search_resources /
    get_module_manifest), and the turn machinery that ties them together: admit a
    turn at most once per idempotency key, claim its journal key before answering,
    record every part of it — the user's message first — in a durable journal in
    `agent.sqlite`, project the journal into the model's full-fidelity history,
    serve the event stream and the conversation's records from the journal, abort
    a running turn, continue an interrupted one inside the same turn, and delete
    whole conversations idle past the retention window.
    Exported so the app and its tests drive the same handler. Parameterized by the
    OpenAI key, the model endpoint, the workspace directory and the agent's state
    directory, which holds `agent.sqlite`.
imports:
  Ai: oci://ghcr.io/telorun/ai@0.23.0#sha256-IJSI5EEBoOjvHI-vKQ2LnjaKlmM1C83si4gVYiNNR_U
  OpenAI: oci://ghcr.io/telorun/openai@0.8.0#sha256-IiH0b38hJUdj6Np-Z37M-jF1X9a8xJshtrr41OE56lw
  HttpClient: oci://ghcr.io/telorun/http-client@0.22.3#sha256-OtxM1NSmRcDovSy6N_tkX-pIwtty4MMwj-RPDO0QH1s
  AiMcp: oci://ghcr.io/telorun/ai-mcp@0.18.0#sha256-5d9idTyIsXSS7nLkSaXI3_iXOLYOUUiT4u1gVO5woo0
  Mcp: oci://ghcr.io/telorun/mcp-client@0.15.2#sha256-wicFctlATYrfVNE-E0yzAEVdUhj7rHb_omPubvzyLbU
  Fs: oci://ghcr.io/telorun/fs@0.11.0#sha256-P7Z6jMuBPjPpHOgwcZXYpjuDsrXlORUMG1X79g00gfE
  Shell: oci://ghcr.io/telorun/shell@0.11.4#sha256-modXQfwktXBMR5nkigZU4nqYCm8KJgUjFfzJjr-Cc4g
  Sql: oci://ghcr.io/telorun/sql@0.25.0#sha256-x8UXPZbNmoCuldq7EAcotw6KfwZr9baCKrRX_8TKaYc
  SQLite: oci://ghcr.io/telorun/sqlite@0.7.0#sha256-iAGE4n-r6dEjTPbJQkAV65pRjILsJI47aderaurBVvs
  RecordStream: oci://ghcr.io/telorun/record-stream@0.18.0#sha256-lA9kmx0POJtB2MQabT5D8tdW46Bz9vx1UnOPXRcpiHI
  RecordStreamSql: oci://ghcr.io/telorun/record-stream-sql@0.4.0#sha256-LP5BOEFkOUJUKCkxW7-nbnBB4UIqvzCUpeOu-riERXQ
  Stream: oci://ghcr.io/telorun/stream@0.13.0#sha256-OAOZ21USu_5mBQ1IrThy73jG7gkqsWQ21s8Wh0FTaQc
  Run: oci://ghcr.io/telorun/run@0.27.1#sha256-O1CdVvYs_O7Zj-PNQxMS3NdgWL6e8M2A0J9Wu0rTnIU
  Lease: oci://ghcr.io/telorun/lease@0.13.0#sha256-HTQ8Fds5O9h15_gsOlVNSgVpGl7Ma3uKJRldfw-lfyI
  KvStoreMemory: oci://ghcr.io/telorun/kv-store-memory@0.7.0#sha256-i1Nen64mCl25XONkoBGRqiTptxBSBA8zBcW6om9autg
  CacheMemory: oci://ghcr.io/telorun/cache-memory@0.9.0#sha256-xf5Sl63MYbMSM4GzzRPVNrqbtrxQ27x9cwFKrDCjCEM
  RateLimit: oci://ghcr.io/telorun/rate-limit@0.12.4#sha256-_E2AqSEEsTotJXiSmk9GBqlnlwW8JRXNJXZWbx-olxY
  Idempotency: oci://ghcr.io/telorun/idempotency@0.10.0#sha256-PE0WF0dQRTcQvi8UbUNcvEoqBmwgH8xP_l661wTyt70
  KvStoreSql: oci://ghcr.io/telorun/kv-store-sql@0.11.0#sha256-uL3TNWg-Pn3W3VIgrGhbdVUIE5U-mamF3h0LglLKGaM
  SecretScan: oci://ghcr.io/telorun/secret-scan@0.2.0#sha256-yyQryveEwAPeuimLzQWZZcRy_8RsnFsZI60S4_yqnBE
  Log: oci://ghcr.io/telorun/log@0.2.0#sha256-tw2JEt1nLGFT0Y5eynRc-iTPp1aUQ-PE6LZIjQmNYNY
secrets:
  openaiApiKey:
    type: string
variables:
  # Directory every file tool and every spawned command is rooted at. Configurable
  # because a co-resident agent edits the SESSION's shared workspace volume, which
  # the runner mounts at a path of its choosing — the agent is one writer on that
  # volume beside the application containers, not the owner of a directory inside
  # its own container. A host path the importer supplies absolute: the standalone
  # default lives on the Application, which is where a relative path is anchored.
  workspaceDir:
    type: string
    x-telo-type: Telo.HostPath
  # The agent's own state — `agent.sqlite` (conversation history and the
  # admission record `Idempotency-Key` replays from). The Application defaults it
  # to `.telo-agent` inside the workspace, so a co-resident agent keeps its
  # conversations on the session volume, which outlives the container. The
  # directory is excluded from every listing the agent and its clients see.
  stateDir:
    type: string
    x-telo-type: Telo.HostPath
  model:
    type: string
    # THE model this agent runs on — declared once, here, and inherited by every
    # importer including the tests, so a test exercises what the app ships. It
    # used to be restated as a literal at the root and in four tests, which made
    # this line dead config: changing it looked like an upgrade and did nothing.
    default: gpt-5.2
  reasoningEffort:
    type: string
    enum: [ minimal, low, medium, high ]
    # How hard the model thinks before each turn. A variable rather than a
    # literal for the same reason `model` is one: it is the knob an operator
    # tunes per deployment, and it trades answer quality against latency and
    # spend on every turn of every tool loop.
    #
    # `medium` because this agent's work is structural — deciding what resources
    # an application needs and how they wire together — which is where thinking
    # pays for itself; `minimal` exists for a deployment that wants the old
    # behaviour back without editing the manifest.
    default: medium
  budgetLimit:
    type: integer
    # Max total tokens spent across all turns per window (operator spend cap).
    default: 4000000
  budgetWindow:
    type: string
    default: "1h"
  reservePerTurn:
    type: integer
    # Worst-case tokens debited at turn start; settled to actual on completion.
    default: 40000
  ipLimit:
    type: integer
    # Max turns started per client IP per window (coarse per-abuser throttle).
    default: 20
  ipWindow:
    type: string
    default: "1m"
  teloProgram:
    type: array
    items: { type: string }
    # How to invoke the `telo` CLI: the program, plus any leading arguments it
    # needs (a test points this at this checkout's entry point, so the agent
    # validates against the very checker that will judge its output).
    #
    # ONE variable rather than a separate argv per call site: the check loop and
    # the `telo` tool must never end up driving different CLI builds, and two
    # variables is exactly how that happens — an override updates one and the
    # other silently keeps the globally-installed binary.
    #
    # Every call site appends its own subcommand and args, and the whole list is
    # execed WITHOUT a shell, so an agent-chosen path is one argument and can
    # inject nothing.
    default: [telo]
  teloVerbs:
    type: array
    items: { type: string }
    # Which `telo` subcommands the `telo` tool may invoke. The agent supplies
    # the whole argv, so this list — not the agent — decides what the CLI is
    # allowed to do.
    #
    # The default is every verb that INSPECTS. The rest are deliberately absent:
    # `run` executes a manifest, which is arbitrary code execution on this host
    # driven by an anonymous prompt; `publish` pushes to a registry with the
    # operator's credentials; `install` and `upgrade` fetch and write; `migrate`
    # rewrites the author's YAML in place, which is the agent's own edit tools'
    # job here. Add them here only for a deployment where the caller is trusted.
    #
    # The check is on argv[0] against this list, which also closes the CLI's
    # default-command hole: `telo ./x.yaml` with no verb means `run ./x.yaml`,
    # and a bare path matches no entry here, so it is rejected rather than
    # silently executed.
    default: [check, cel, module, search]
  allowManifestRuns:
    type: boolean
    # Whether the agent may EXECUTE a manifest, through the `run_manifest` tool.
    #
    # Off by default, and the default is the security boundary rather than a
    # preference. A manifest the agent wrote is arbitrary code: it can declare a
    # Shell.Command, read any file this container can, and reach the network.
    # `Shell.LocalHost.env` is an OVERLAY, so a child inherits every operator
    # variable except the ones named there — OPENAI_API_KEY is scrubbed, and
    # whatever else the operator set is not, because a module cannot enumerate
    # it. So this must not be on where an anonymous prompt reaches the agent.
    #
    # Turn it on where the caller is the person whose container this is: a
    # per-session or co-resident agent in the user's own workspace, which is
    # already where their own `telo run --watch` executes the same manifests.
    default: false
  modelEndpoint:
    type: string
    # The OpenAI-compatible endpoint the model is called through. A test points
    # it at a local stub, so whole turns run offline and key-free.
    default: https://api.openai.com/v1
  retentionDays:
    type: integer
    minimum: 1
    # How long a conversation may sit idle before `retentionSweep` deletes it
    # whole, and how long its removed turns then keep answering 410 rather than
    # 404 — the journal's removal-marker retention.
    default: 30
  runTimeoutMs:
    type: integer
    # A test suite terminates; an application with a server in it does not, and
    # a wrong path is an easy mistake to make. Without a bound, one of them
    # holds the turn open until the model's step budget runs out.
    default: 120000
exports:
  resources:
    - ensureWorkspace
    - initSchema
    - chatStart
    - abortTurn
    - continueTurn
    - journalSource
    - turnEvents
    - conversationRecords
    - rebuildProjection
    - retentionSweep
    - author
    - readWorkspaceFile
    - runTelo
    - runManifest
    - treeSnapshot
    - syncWorkspace
    - readiness
    - promptIdentity
    - CheckReport
---
kind: SQLite.Connection
metadata: { name: chatDb }
file: !cel "variables.stateDir.joinPath('agent.sqlite')"
---
kind: SQLite.Schema
metadata: { name: initSchema }
connection: !ref chatDb
# Imperative, not a declared `Table`: the role domain is a CHECK constraint and
# the keys are composite, which the column vocabulary cannot state. Applied in
# key order, so `create_messages` (the first shape of `messages`) always runs
# before `projection_*` replaces it, and `projection_*` run in their number's
# order.
migrations:
  create_messages:
    statement: |
      CREATE TABLE IF NOT EXISTS messages (
        id TEXT PRIMARY KEY,
        conversation_id TEXT NOT NULL,
        role TEXT NOT NULL CHECK (role IN ('system', 'user', 'assistant')),
        content TEXT NOT NULL,
        created_at TEXT NOT NULL DEFAULT (datetime('now'))
      )
  # Which turns belong to which conversation, in order. Metadata about journal
  # keys, never a copy of a record: a turn's status is read from its key.
  projection_1_turns:
    statements:
      - |
        CREATE TABLE turns (
          turn_id TEXT PRIMARY KEY,
          conversation_id TEXT NOT NULL,
          started_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%fZ', 'now')),
          active_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%fZ', 'now'))
        )
      - CREATE INDEX turns_by_conversation ON turns (conversation_id, turn_id)
  # `messages` becomes the projection of the journal: the model's history in
  # full — content as JSON, an assistant row's tool calls, `tool` rows with the
  # call they answer — one row per message, keyed by its turn and position.
  # The old table held only joined text and cannot be rebuilt into this one, so
  # it is replaced; its turns were never journaled durably.
  projection_2_messages:
    statements:
      - DROP TABLE messages
      - |
        CREATE TABLE messages (
          turn_id TEXT NOT NULL,
          seq INTEGER NOT NULL,
          conversation_id TEXT NOT NULL,
          role TEXT NOT NULL CHECK (role IN ('system', 'user', 'assistant', 'tool')),
          content TEXT NOT NULL,
          tool_calls TEXT,
          tool_call_id TEXT,
          PRIMARY KEY (turn_id, seq)
        )
      - CREATE INDEX messages_by_conversation ON messages (conversation_id, turn_id, seq)
  # How far each turn was projected, and the provider state it ended with.
  projection_3_turn_projections:
    statement: |
      CREATE TABLE turn_projections (
        turn_id TEXT PRIMARY KEY,
        conversation_id TEXT NOT NULL,
        through_id INTEGER NOT NULL,
        provider_state TEXT,
        provider_model TEXT
      )
  # When a user's abort cancelled the turn. What tells an aborted turn from one a
  # shutdown cancelled: both fail with ERR_INVOKE_CANCELLED, and only the first
  # is a deliberate ending that cannot be continued.
  projection_4_aborted_at:
    statement: ALTER TABLE turns ADD COLUMN aborted_at TEXT
---
# The account, declared once: base URL and credential on the client, so the model
# kinds carry no key and the 401 re-acquire-and-retry is inherited from
# `http-client` rather than re-implemented per provider.
kind: HttpClient.BearerToken
metadata: { name: openaiKey }
token: !cel "secrets.openaiApiKey"
---
kind: HttpClient.Client
metadata: { name: openaiClient }
baseUrl: !cel "variables.modelEndpoint"
credential: !ref openaiKey
# A provider edge fails transiently — a 503 whose body is the proxy's own
# "upstream connect error … Connection refused", arriving BEFORE any headers, so
# the request never started streaming and re-sending it is sound. Without a
# budget nothing re-sends: `retryOn` defaults to 408/429/500/502/503/504 only
# once `attempts` is non-zero, so a single edge blip took down a whole turn.
#
# Three attempts, not more: an agent turn already costs seconds and tokens, and
# a provider that is still refusing after ~4s of backoff is having an outage
# rather than a blip. `honorRetryAfter` is what makes the 429 case cooperative
# instead of additive.
retry:
  attempts: 3
  initialDelay: 500
  maxDelay: 4000
  honorRetryAfter: true
---
kind: HttpClient.Request
metadata: { name: openaiRequest }
client: !ref openaiClient
---
# The responses API, not chat completions: this agent is nothing but tools, and
# `/v1/chat/completions` refuses a non-`none` reasoning effort alongside function
# tools outright. The encrypted reasoning comes back as the contract's
# `providerState` and `Ai.AgentStream` replays it, so thinking survives each tool
# loop rather than restarting on every turn.
kind: OpenAI.ResponsesModelStream
metadata: { name: model }
model: !cel "variables.model"
request: !ref openaiRequest
reasoning:
  effort: !cel "variables.reasoningEffort"
  # What the thinking a client can SHOW is: the reasoning itself comes back
  # encrypted and is only ever replayed, so without this a turn emits no
  # readable reasoning at all — which is why Studio's transcript had none. A
  # summary is a précis the endpoint writes, delivered as `reasoning-delta`
  # parts beside the text. Not a variable: it costs a handful of tokens and
  # there is no `off` value to switch to — the key's ABSENCE is off, so hiding
  # thinking is a decision for the client that renders it, not for the model.
  summary: auto
---
kind: AiMcp.ToolProvider
metadata: { name: hubTools }
client:
  kind: Mcp.HttpClient
  url: https://telo.sh/mcp
  clientInfo:
    name: authoring-agent
    version: 0.0.0
---
kind: Fs.FileWrite
metadata: { name: writeFile }
cwd: !cel "variables.workspaceDir"
---
kind: Fs.FileEdit
metadata: { name: editFile }
cwd: !cel "variables.workspaceDir"
---
kind: Fs.File
metadata: { name: readFile }
cwd: !cel "variables.workspaceDir"
---
kind: Fs.DirectoryListing
metadata: { name: listDir }
cwd: !cel "variables.workspaceDir"
---
kind: Fs.FileRemoval
metadata: { name: removeFile }
cwd: !cel "variables.workspaceDir"
---
# Path confinement, one rule for every tool and route that takes a path. LEXICAL:
# the Fs kinds resolve a relative path against the workspace and use an absolute
# one as-is, and nothing below them refuses `../`, so the decision is made on the
# text before any of them is reached. Outside when absolute, when it holds a
# backslash (a Windows separator the rule cannot reason about), when its first
# segment is a drive letter, or when any segment is `..`. The empty path is the
# workspace root.
kind: Telo.Function
metadata:
  name: outsideWorkspace
  description: Whether a path the agent or a client supplied would leave the workspace root.
params:
  - name: path
    schema: { type: string }
returns:
  schema: { type: boolean }
body: !cel >-
  path.startsWith('/') || path.contains('\\') || path.split('/')[0].matches('^[A-Za-z]:')
    || path.split('/').exists(segment, segment == '..')
---
kind: Telo.Function
metadata:
  name: outsideWorkspaceMessage
  description: The refusal for a path outside the workspace, naming the path and restating the rule.
params:
  - name: path
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  'ERR_PATH_OUTSIDE_WORKSPACE: the path "' + path + '" is outside the workspace. A path is relative to the workspace root: '
    + 'never absolute, no backslash, no drive letter, and no ".." segment.'
---
# What `telo check -o json` prints on stdout: the verdict, the counts and one
# entry per diagnostic. Entries stay open, so a field a newer CLI adds is kept.
kind: Telo.JsonSchema
metadata: { name: CheckReport }
schema:
  type: object
  required: [ok, errorCount, warnCount, diagnostics]
  properties:
    ok: { type: boolean }
    errorCount: { type: integer }
    warnCount: { type: integer }
    diagnostics:
      type: array
      items:
        type: object
        required: [file, line, column, severity, message]
        properties:
          file: { type: string }
          line: { type: integer }
          column: { type: integer }
          severity: { type: string }
          code: { type: string }
          message: { type: string }
---
# The check part of a write, edit or check result as the model reads it: one
# `file:line:col CODE message` line per diagnostic, or `check: clean`, then the
# checker's own prose under `notes:` when it wrote any. Text rather than the
# JSON document: the model reads it, and an escaped JSON string is what it was
# reading before.
kind: Telo.Function
metadata:
  name: renderCheck
  description: Renders a check report and the checker's stderr as the lines a tool result carries.
params:
  - name: exitCode
    schema: { type: integer }
  - name: report
    schema: !ref CheckReport
    nullable: true
  - name: messages
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  (report != null && size(report.diagnostics) > 0
    ? join(report.diagnostics.map(d,
        d.file + ':' + string(d.line) + ':' + string(d.column) + ' '
          + (has(d.code) ? d.code + ' ' : '') + d.message), '\n')
    : exitCode == 0 ? 'check: clean' : 'check: failed with exit ' + string(exitCode))
  + (messages.trim() == '' ? '' : '\nnotes:\n' + messages.trim())
---
# A command's result as the model reads it: stdout verbatim, an `exit N` line
# only when it failed, and stderr under `stderr:` only when there is any.
kind: Telo.Function
metadata:
  name: renderRun
  description: Renders a command's exit code, stdout and stderr as the text a tool result carries.
params:
  - name: exitCode
    schema: { type: integer }
  - name: output
    schema: { type: string }
  - name: messages
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  output
    + (exitCode == 0 ? '' : (output == '' || output.endsWith('\n') ? '' : '\n') + 'exit ' + string(exitCode))
    + (messages.trim() == '' ? '' : '\nstderr:\n' + messages.trim())
---
# The refusal for content carrying a credential: every finding by line and rule
# (never the matched text, which the detector does not return), then the repair.
# Both refusals lead with their code: a tool error reaches the model as its
# message alone.
kind: Telo.Function
metadata:
  name: secretMessage
  description: The refusal for a write whose content carries a credential, naming each line and rule and the repair.
params:
  - name: path
    schema: { type: string }
  - name: findings
    schema:
      type: array
      items:
        type: object
        required: [rule, line, column]
        properties:
          rule: { type: string }
          line: { type: integer }
          column: { type: integer }
returns:
  schema: { type: string }
body: !cel >-
  'ERR_SECRET_IN_MANIFEST: refused to write "' + path + '": it would contain a credential at '
    + join(findings.map(f, 'line ' + string(f.line) + ' (' + f.rule + ')'), ', ')
    + '. Never write a secret into a file. Declare it under `secrets:` with an `env:` binding '
    + 'and read it with !cel "secrets.<name>", then write the file again.'
---
# read_file, and GET /workspace/file: the file's contents, confined.
kind: Run.Sequence
metadata: { name: readWorkspaceFile }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [content, size]
    properties:
      content: { type: string }
      size: { type: integer }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path)"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: read
    invoke: !ref readFile
    inputs:
      path: !cel "inputs.path"
outputs:
  content: !cel "steps.read.result.content"
  size: !cel "steps.read.result.size"
---
# list_dir: a directory's entries, confined. The exclude set is fixed here rather
# than offered as a parameter: a recursive listing of a workspace is otherwise
# mostly `.telo` cache paths, and a set the model can pass is a set it can drop.
kind: Run.Sequence
metadata: { name: listWorkspaceDir }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, recursive]
    properties:
      path: { type: string }
      recursive: { type: boolean }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [entries]
    properties:
      entries:
        type: array
        items:
          type: object
          required: [path, type]
          properties:
            path: { type: string }
            type: { type: string }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path)"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: list
    invoke: !ref listDir
    inputs:
      path: !cel "inputs.path"
      recursive: !cel "inputs.recursive"
      exclude: [".telo", "node_modules", ".git", "dist", ".probes", ".telo-agent"]
outputs:
  entries: !cel "steps.list.result.entries"
---
# delete_file, confined.
kind: Run.Sequence
metadata: { name: deleteWorkspaceFile }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, recursive]
    properties:
      path: { type: string }
      recursive: { type: boolean }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: { type: string }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path)"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: remove
    invoke: !ref removeFile
    inputs:
      path: !cel "inputs.path"
      recursive: !cel "inputs.recursive"
outputs:
  path: !cel "inputs.path"
---
# Whole-workspace sync primitives, exported so the app's /workspace routes can
# snapshot (content-hash tree) and apply an explicit write/delete change set.
kind: Fs.TreeSnapshot
metadata: { name: treeSnapshot }
cwd: !cel "variables.workspaceDir"
---
kind: Fs.TreeSync
metadata: { name: treeSync }
cwd: !cel "variables.workspaceDir"
---
# POST /workspace. Every path of the change set is judged BEFORE anything is
# applied, so a refused set leaves the workspace as it was. Not scanned for
# secrets: this is the user's own editor writing the user's own files.
kind: Run.Sequence
metadata: { name: syncWorkspace }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [write, delete]
    properties:
      write:
        type: array
        items:
          type: object
          required: [path, content]
          properties:
            path: { type: string }
            content: { type: string }
            encoding: { type: string, enum: [utf8, base64] }
      delete:
        type: array
        items: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [written, deleted]
    properties:
      written: { type: integer }
      deleted: { type: integer }
steps:
  - name: outside
    value: !cel >-
      inputs.write.map(w, w.path).filter(p, Self.outsideWorkspace(p))
        + inputs.delete.filter(p, Self.outsideWorkspace(p))
  - name: confine
    if: !cel "size(steps.outside.result) > 0"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(steps.outside.result[0]) + ' Nothing was applied.'"
          data:
            paths: !cel "steps.outside.result"
  - name: apply
    invoke: !ref treeSync
    inputs:
      write: !cel "inputs.write"
      delete: !cel "inputs.delete"
outputs:
  written: !cel "steps.apply.result.written"
  deleted: !cel "steps.apply.result.deleted"
---
# GET /ready. Each reason is one dependency a turn needs, probed for real: the
# conversation database read, the operator's model key present, the workspace
# writable (a probe file written and removed under the agent's own state
# directory, which no listing or sync shows). An empty list is ready. Each
# message is fixed — the route is unguarded, so a failure's own text (a database
# error, an absolute path) goes to the log instead.
kind: Run.Sequence
metadata: { name: readiness }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [reasons]
    properties:
      reasons:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [SCHEMA_UNAVAILABLE, MODEL_CREDENTIAL_MISSING, WORKSPACE_NOT_WRITABLE] }
            message: { type: string }
steps:
  - name: schema
    try:
      - name: schemaRead
        invoke: !ref historyRows
        inputs:
          sql: "SELECT COUNT(*) AS n FROM turns"
          bindings: []
    # The cause goes to the operator's log; the unguarded route says only
    # which check failed.
    catch:
      - name: schemaFailure
        invoke: !ref Log.emit
        inputs:
          level: warn
          message: The readiness check could not read the conversation database.
          attributes:
            error: !cel "error.message"
  - name: workspace
    try:
      - name: probeWrite
        invoke: !ref writeFile
        inputs:
          path: .telo-agent/ready-probe
          content: ready
          createParents: true
      - name: probeRemove
        invoke: !ref removeFile
        inputs:
          path: .telo-agent/ready-probe
    catch:
      - name: workspaceFailure
        invoke: !ref Log.emit
        inputs:
          level: warn
          message: The readiness check could not write and remove a file in the workspace.
          attributes:
            error: !cel "error.message"
outputs:
  reasons: !cel >-
    (has(steps.schemaFailure) ? [{'code': 'SCHEMA_UNAVAILABLE',
        'message': 'The conversation database cannot be read.'}] : [])
    + (secrets.openaiApiKey == '' ? [{'code': 'MODEL_CREDENTIAL_MISSING',
        'message': 'No model API key is configured (OPENAI_API_KEY is empty).'}] : [])
    + (has(steps.workspaceFailure) ? [{'code': 'WORKSPACE_NOT_WRITABLE',
        'message': 'The workspace is not writable.'}] : [])
---
# The agent's prompt identity: the lowercase hex SHA-256 of the primer it runs
# with, read from the same file `author` embeds, so the two cannot disagree.
kind: Run.Sequence
metadata: { name: promptIdentity }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id: { type: string }
steps:
  - name: primer
    value: !include-text ./primer.md
outputs:
  id: !cel "sha256(steps.primer.result)"
---
# The turn journal: every record of every turn, under the turn's id, in the
# agent's own database. It is the one source of truth — the event stream, the
# records route and the model's history (the `messages` projection) are all read
# from it. No `retention:`: turns are removed only with their whole conversation
# (`retentionSweep`), so expiry never takes one turn's records alone; a removed
# turn keeps answering "removed" (410) for `retentionDays`.
kind: RecordStream.Journal
metadata: { name: turnJournal }
store:
  kind: RecordStreamSql.JournalStore
  connection: !ref chatDb
  table: turn_journal
# `int(...)`: an integer variable forwarded through an import arrives here as a
# double at runtime, though it is typed int statically.
markerRetention: !cel "duration(string(int(variables.retentionDays) * 24) + 'h')"
writerTimeout: 30s
---
# Exported so a test reads a turn exactly as the events route does.
kind: RecordStream.JournalSource
metadata: { name: journalSource }
journal: !ref turnJournal
---
kind: RecordStream.JournalRead
metadata: { name: journalRead }
journal: !ref turnJournal
---
# GET /chat/{turnId}/events. A turn nobody started is 404, a removed one 410 —
# both decided from one snapshot before any stream exists, so a route can map
# them. Otherwise the journal's own replay-then-tail: a running turn tails, a
# finished one ends, a failed one raises its recorded error (the encoder turns
# that into an `event: error` frame), and a turn removed mid-read raises
# ERR_JOURNAL_KEY_REMOVED the same way.
kind: Run.Sequence
metadata: { name: turnEvents }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId, fromId]
    properties:
      turnId: { type: string }
      fromId: { type: integer, minimum: 0 }
steps:
  - name: header
    invoke: !ref journalRead
    inputs:
      key: !cel "inputs.turnId"
      limit: 0
  - name: unknown
    if: !cel "steps.header.result.state == 'unknown'"
    then:
      - name: refuseUnknown
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'No turn ' + inputs.turnId + ' was started on this agent.'"
  - name: removed
    if: !cel "steps.header.result.state == 'removed'"
    then:
      - name: refuseRemoved
        throw:
          code: ERR_JOURNAL_KEY_REMOVED
          message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
  - name: read
    invoke: !ref journalSource
    inputs:
      key: !cel "inputs.turnId"
      fromId: !cel "inputs.fromId"
outputs:
  output: !cel "steps.read.result.output"
---
# GET /conversations/{id}/records — the display transcript, server-side: the
# conversation's turns in order, each with its status and its records, paged by
# (turn, record id). The page is planned from one snapshot of each turn's
# header first, so `limit` bounds the records read, not only the records
# returned, and each turn's status and error are that snapshot's.
kind: Run.Sequence
metadata: { name: conversationRecords }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, fromTurn, fromId, limit]
    properties:
      conversationId: { type: string }
      # Empty for the first page.
      fromTurn: { type: string }
      fromId: { type: integer, minimum: 0 }
      limit: { type: integer, minimum: 1, maximum: 10000 }
steps:
  - name: turns
    invoke: !ref historyRows
    inputs:
      sql: "SELECT turn_id, started_at, aborted_at FROM turns WHERE conversation_id = ? AND turn_id >= ? ORDER BY turn_id"
      bindings:
        - !cel "inputs.conversationId"
        - !cel "inputs.fromTurn"
  - name: unknownCursor
    if: !cel "inputs.fromTurn != '' && (size(steps.turns.result.rows) == 0 || steps.turns.result.rows[0].turn_id != inputs.fromTurn)"
    then:
      - name: refuseCursor
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'Turn ' + inputs.fromTurn + ' is not part of this conversation.'"
  - name: headers
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.turns"
      steps:
        - name: header
          invoke: !ref journalRead
          inputs:
            key: !cel "item.turn_id"
            limit: 0
      outputs:
        lastId: !cel "steps.header.result.lastId"
        state: !cel "steps.header.result.state"
        error: !cel "steps.header.result.error"
    inputs:
      turns: !cel "steps.turns.result.rows"
  # Where each turn's page starts, how many of its records fit, and the cursor
  # of the next page — from the last ids alone, before a single record is read.
  - name: plan
    value: !cel >-
      cel.bind(from, range(size(steps.headers.result)).map(i,
          i == 0 && inputs.fromTurn != '' ? inputs.fromId : 0),
        cel.bind(avail, range(size(steps.headers.result)).map(i,
            steps.headers.result[i].lastId > from[i] ? steps.headers.result[i].lastId - from[i] : 0),
          cel.bind(before, range(size(avail)).map(i, int(sum(slice(avail, 0, i)))),
            cel.bind(included, range(size(avail)).filter(i, before[i] < inputs.limit),
              cel.bind(take, included.map(i,
                  avail[i] < inputs.limit - before[i] ? avail[i] : inputs.limit - before[i]),
                {
                  'pages': included.map(i, {
                    'turnId': steps.turns.result.rows[i].turn_id,
                    'startedAt': steps.turns.result.rows[i].started_at,
                    'abortedAt': steps.turns.result.rows[i].aborted_at,
                    'state': steps.headers.result[i].state,
                    'error': steps.headers.result[i].error,
                    'fromId': from[i],
                    'limit': take[i]
                  }),
                  'next': size(included) > 0 && take[size(included) - 1] < avail[size(included) - 1]
                    ? dyn({'fromTurn': steps.turns.result.rows[size(included) - 1].turn_id,
                       'fromId': from[size(included) - 1] + take[size(included) - 1]})
                    : size(included) < size(avail)
                      ? dyn({'fromTurn': steps.turns.result.rows[size(included)].turn_id, 'fromId': 0})
                      : null
                })))))
  - name: pages
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.pages"
      steps:
        - name: page
          invoke: !ref journalRead
          inputs:
            key: !cel "item.turnId"
            fromId: !cel "item.fromId"
            limit: !cel "item.limit"
      outputs:
        turnId: !cel "item.turnId"
        startedAt: !cel "item.startedAt"
        # The state that planned this page, not the page read's own: a turn
        # that ended between the two reads is reported `running` with the
        # records up to where it was planned, and a client attaching from its
        # last id receives the rest — never `finished` with records missing.
        # Only a removal in between wins, since the page then carries none.
        status: !cel >-
          cel.bind(state, steps.page.result.state == 'removed' ? 'removed' : item.state,
            cel.bind(status, Self.turnStatus(state, state == 'removed' ? null : item.error, item.abortedAt),
              status == 'removed' || status == 'unknown' ? 'failed' : status))
        error: !cel >-
          steps.page.result.state == 'removed' || item.state == 'removed'
            ? {'code': 'ERR_JOURNAL_KEY_REMOVED', 'message': 'This turn was removed.'}
            : item.state == 'unknown'
              ? {'code': 'ERR_TURN_NOT_FOUND', 'message': 'This turn has no records.'}
              : item.error
        records: !cel "steps.page.result.entries"
    inputs:
      pages: !cel "steps.plan.result.pages"
outputs:
  turns: !cel "steps.pages.result"
  next: !cel "steps.plan.result.next"
---
# Reads over the agent's own database.
kind: Sql.Query
metadata: { name: historyRows }
connection: !ref chatDb
---
# The model's view of one turn, folded from its journal records: the user's
# message, then per model call an assistant row (its text, and the tool calls
# that got a result) followed by the tool rows answering the previous call. A
# `turn-continued` record closes the interrupted call the same way a
# `step-finish` does and adds its note as a user message, so a continued turn
# replays every attempt in order. A tool call with no recorded result is left
# out — the provider refuses a call with no answer, and the note names it.
# Reasoning deltas are display-only (the reasoning itself rides providerState),
# and a call cut off mid-stream keeps the text it had streamed.
kind: Telo.Function
metadata:
  name: turnMessages
  description: Folds one turn's journal records into the model messages that replay it.
params:
  - name: records
    schema: { type: array }
returns:
  schema: { type: array }
body: !cel >-
  cel.bind(ends, enumerate(records).filter(e, e.value.type in ['step-finish', 'turn-continued']).map(e, e.index),
    cel.bind(answered, records.filter(r, r.type == 'tool-result').map(r, r.toolResult.toolCallId),
      records.filter(r, r.type == 'user-message').map(r, {'role': 'user', 'content': r.content})
      + flatten(range(size(ends) + 1).map(k,
          cel.bind(segment, slice(records, k == 0 ? 0 : ends[k - 1] + 1, k < size(ends) ? ends[k] : size(records)),
            segment.filter(r, r.type == 'tool-result').map(r, {
              'role': 'tool',
              'content': r.toolResult.content,
              'toolCallId': r.toolResult.toolCallId
            })
            + cel.bind(text, join(segment.filter(r, r.type == 'text-delta').map(r, r.delta), ''),
                cel.bind(calls, segment.filter(r, r.type == 'tool-call' && r.toolCall.id in answered).map(r, r.toolCall),
                  size(calls) > 0
                    ? [{'role': 'assistant', 'content': text, 'toolCalls': calls}]
                    : text != '' ? [{'role': 'assistant', 'content': text}] : []))
            + (k < size(ends) && records[ends[k]].type == 'turn-continued'
                ? [{'role': 'user', 'content': records[ends[k]].note}]
                : []))))))
---
# What a turn IS, from one snapshot of its key and its `aborted_at`: `aborted` is
# a failure with ERR_INVOKE_CANCELLED that a user's abort caused — a shutdown's
# cancellation fails the same way and stays `failed`, continuable.
kind: Telo.Function
metadata:
  name: turnStatus
  description: A turn's status from its journal key's state, its recorded error and when a user aborted it.
params:
  - name: state
    schema: { type: string }
  - name: failure
    schema: { type: [object, "null"] }
  - name: abortedAt
    schema: { type: [string, "null"] }
returns:
  schema: { type: string, enum: [unknown, removed, running, finished, failed, aborted] }
body: !cel >-
  state == 'open' ? 'running'
    : state == 'finished' ? 'finished'
    : state == 'failed'
      ? (abortedAt != null && failure != null && has(failure.code) && failure.code == 'ERR_INVOKE_CANCELLED'
          ? 'aborted' : 'failed')
    : state
---
# The note a continued turn's model reads after everything the interrupted
# attempt recorded: what ended that attempt, and every tool call it started with
# no recorded result — named with its path, as an effect nobody observed, so the
# model checks before repeating it rather than assuming either outcome.
kind: Telo.Function
metadata:
  name: interruptionNote
  description: Tells the model how the previous attempt of a turn ended and which of its tool calls have no recorded result.
params:
  - name: records
    schema: { type: array }
  - name: failure
    schema: { type: [object, "null"] }
returns:
  schema: { type: string }
body: !cel >-
  cel.bind(leads, enumerate(records).filter(e, e.value.type in ['user-message', 'turn-continued']).map(e, e.index),
    cel.bind(attempt, size(leads) == 0 ? records : slice(records, leads[size(leads) - 1] + 1, size(records)),
      cel.bind(answered, attempt.filter(r, r.type == 'tool-result').map(r, r.toolResult.toolCallId),
        cel.bind(unresolved, attempt.filter(r, r.type == 'tool-call' && !(r.toolCall.id in answered)).map(r, r.toolCall),
          'TURN CONTINUED: the previous attempt at this turn was interrupted'
          + (failure == null ? '' : ' by ' + (has(failure.code) ? failure.code + ': ' : '') + failure.message)
          + '. Everything above it happened, and every tool result above is real. '
          + (size(unresolved) == 0 ? ''
              : 'These tool calls were started but no result was recorded, so their effect is unknown — check before repeating them: '
                + join(unresolved.map(c, c.name
                    + (type(c.arguments) == type({}) && 'path' in c.arguments ? ' ' + string(c.arguments.path) : '')), ', ')
                + '. ')
          + 'Continue the request from where it stopped; do not redo work that already has a result.'))))
---
# Project one turn: read its whole key, fold it, and replace its rows — the
# `messages` rows and its `turn_projections` row (how far it was projected, the
# last provider state it recorded and the model that produced it) — in one
# transaction. The projection is never written by anything else, so it can be
# dropped and rebuilt from the journal at any time.
kind: Run.Sequence
metadata: { name: projectTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, turnId]
    properties:
      conversationId: { type: string }
      turnId: { type: string }
steps:
  - name: read
    invoke: !ref journalRead
    inputs:
      key: !cel "inputs.turnId"
  - name: records
    value: !cel "steps.read.result.entries.map(e, e.data)"
  - name: write
    invoke:
      kind: Sql.Transaction
      connection: !ref chatDb
      steps:
        kind: Run.Sequence
        inputType:
          kind: Telo.JsonSchema
          schema:
            type: object
            additionalProperties: false
            required: [conversationId, turnId, messages, throughId, providerState, providerModel]
            properties:
              conversationId: { type: string }
              turnId: { type: string }
              messages: { type: string }
              throughId: { type: integer }
              providerState: { type: [string, "null"] }
              providerModel: { type: [string, "null"] }
        steps:
          - name: clear
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: "DELETE FROM messages WHERE turn_id = ?"
              bindings: [ !cel "inputs.turnId" ]
          # One statement for every row: the folded list crosses as one JSON
          # document and SQLite takes it apart.
          - name: insert
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: |
                INSERT INTO messages (turn_id, seq, conversation_id, role, content, tool_calls, tool_call_id)
                SELECT ?, CAST(m.key AS INTEGER), ?, m.value ->> '$.role', m.value -> '$.content',
                       m.value -> '$.toolCalls', m.value ->> '$.toolCallId'
                FROM json_each(?) AS m
              bindings:
                - !cel "inputs.turnId"
                - !cel "inputs.conversationId"
                - !cel "inputs.messages"
          - name: projection
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: |
                INSERT INTO turn_projections (turn_id, conversation_id, through_id, provider_state, provider_model)
                VALUES (?, ?, ?, ?, ?)
                ON CONFLICT (turn_id) DO UPDATE SET
                  through_id = excluded.through_id,
                  provider_state = excluded.provider_state,
                  provider_model = excluded.provider_model
              bindings:
                - !cel "inputs.turnId"
                - !cel "inputs.conversationId"
                - !cel "inputs.throughId"
                - !cel "inputs.providerState"
                - !cel "inputs.providerModel"
      inputs:
        conversationId: !cel "inputs.conversationId"
        turnId: !cel "inputs.turnId"
        messages: !cel "inputs.messages"
        throughId: !cel "inputs.throughId"
        providerState: !cel "inputs.providerState"
        providerModel: !cel "inputs.providerModel"
    inputs:
      conversationId: !cel "inputs.conversationId"
      turnId: !cel "inputs.turnId"
      messages: !cel "json(Self.turnMessages(steps.records.result))"
      throughId: !cel "steps.read.result.lastId"
      providerState: !cel >-
        cel.bind(states, steps.records.result.filter(r, r.type == 'provider-state'),
          size(states) > 0 ? dyn(json(states[size(states) - 1].providerState)) : null)
      # The model of the attempt that recorded that state: the last lead record
      # (`user-message` or `turn-continued`) before it.
      providerModel: !cel >-
        cel.bind(states, enumerate(steps.records.result).filter(e, e.value.type == 'provider-state').map(e, e.index),
          size(states) == 0 ? null
            : cel.bind(leads, enumerate(steps.records.result).filter(e,
                  e.index < states[size(states) - 1] && e.value.type in ['user-message', 'turn-continued']),
                size(leads) > 0 ? dyn(leads[size(leads) - 1].value.model) : null))
---
# Bring the projection up to date for every turn of a conversation whose journal
# holds records the projection has not seen — the step every history read goes
# through first, so a turn that ended without its own projection (a process that
# died mid-turn) is caught up before the model sees its history.
kind: Run.Sequence
metadata: { name: catchUpProjection }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: turns
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT t.turn_id, COALESCE(p.through_id, -1) AS through_id
        FROM turns t LEFT JOIN turn_projections p ON p.turn_id = t.turn_id
        WHERE t.conversation_id = ?
        ORDER BY t.turn_id
      bindings: [ !cel "inputs.conversationId" ]
  - name: each
    invoke:
      kind: Run.Iteration
      collection: !cel "inputs.turns"
      steps:
        - name: header
          invoke: !ref journalRead
          inputs:
            key: !cel "item.turn_id"
            limit: 0
        - name: behind
          if: !cel "steps.header.result.lastId > int(item.through_id)"
          then:
            - name: project
              invoke: !ref projectTurn
              inputs:
                conversationId: !cel "inputs.conversationId"
                turnId: !cel "item.turn_id"
    inputs:
      turns: !cel "steps.turns.result.rows"
      conversationId: !cel "inputs.conversationId"
---
# Rebuild a conversation's whole projection from the journal: every turn is
# projected again, whatever its rows say. What an operation that changes
# history runs afterwards, and what proves the projection is disposable.
kind: Run.Sequence
metadata: { name: rebuildProjection }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: turns
    invoke: !ref historyRows
    inputs:
      sql: "SELECT turn_id FROM turns WHERE conversation_id = ? ORDER BY turn_id"
      bindings: [ !cel "inputs.conversationId" ]
  - name: each
    invoke:
      kind: Run.Iteration
      collection: !cel "inputs.turns"
      steps:
        - name: project
          invoke: !ref projectTurn
          inputs:
            conversationId: !cel "inputs.conversationId"
            turnId: !cel "item.turn_id"
    inputs:
      turns: !cel "steps.turns.result.rows"
      conversationId: !cel "inputs.conversationId"
---
# Spend-budget state. A CacheMemory.Store for a single instance; swap to a
# CacheRedis.Store to bound spend across instances — the Cache.Store seam makes
# it a one-line change.
kind: CacheMemory.Store
metadata: { name: stateStore }
---
# Lease state. Separate from stateStore because a lease needs durability and
# atomic compare-and-set, which Cache.Store does not promise — an evicted claim
# would hand out a second concurrent turn. Process-local, like stateStore; swap
# to a KvStoreRedis.Store to serialize turns across instances.
kind: KvStoreMemory.Store
metadata: { name: leaseStore }
---
# One in-flight turn per conversation, held in memory. detach mode: admission
# acquires and learns { acquired } synchronously (ERR_TURN_IN_PROGRESS when not),
# while the turn runs detached and the lease frees on its terminal. ttl
# self-heals a conversation if a turn dies.
kind: Lease.Critical
metadata: { name: turnLock }
store: !ref leaseStore
ttl: 10m
detach: true
invoke: !ref turnRunner
---
# Operator spend cap over the shared store. Reserved worst-case at turn start
# (429 when over ceiling), settled to actual token usage on the turn's terminal.
kind: RateLimit.Budget
metadata: { name: budget }
store: !ref stateStore
limit: !cel "variables.budgetLimit"
window: !cel "variables.budgetWindow"
---
# Coarse per-client-IP throttle. Only slows an individual abuser (a rotated IP
# dodges it); the global budget is the hard operator-cost bound.
kind: RateLimit.Guard
metadata: { name: ipGuard }
store: !ref stateStore
limit: !cel "variables.ipLimit"
window: !cel "variables.ipWindow"
---
# Every command runs from ./workspace, so that directory must EXIST before the
# first one spawns: `spawn` with a missing cwd fails ENOENT, which the shell
# host reports as `interpreter not found: <program>` — a message that sends the
# reader after the program name rather than the directory. The workspace is
# runtime scratch and is gitignored, so a fresh checkout or a fresh deployment
# has none until something makes it. `ensureWorkspace` is a boot target for
# exactly that; `createParents` makes it idempotent.
kind: Fs.DirectoryCreation
metadata: { name: createDirectory }
---
kind: Run.Sequence
metadata: { name: ensureWorkspace }
steps:
  - name: create
    invoke: !ref createDirectory
    inputs:
      path: !cel "string(variables.workspaceDir)"
      createParents: true
---
kind: Shell.LocalHost
metadata: { name: localHost }
cwd: !cel "variables.workspaceDir"
# Scrub the operator's OpenAI key from every subprocess spawned on this host
# (the auto-`telo check`). The key is read only in-process by OpenaiModel; no
# exposed tool executes agent content in-process, so unsetting it here means no
# anonymous prompt can reach it through the one keyless subprocess we spawn.
env:
  OPENAI_API_KEY: null
---
kind: Shell.Command
metadata: { name: runCommand }
host: !ref localHost
---
# The check's result shape, shared by the write, edit and check sequences:
# `checkReport` is the JSON document `telo check -o json` prints (null when it
# printed nothing), `checkMessages` its stderr prose. `checkExitCode` is the
# span attribute a trace reads a failing check from.
#
# Standalone `telo check` exposed as a tool. Same fixed argv as the write/edit
# loops — the agent supplies only the path, appended to the fixed check argv
# and execed WITHOUT a shell — so this grants validation, not command access.
kind: Run.Sequence
metadata: { name: checkFile }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, checkExitCode, checkReport, checkMessages]
    properties:
      path: { type: string }
      checkExitCode: { type: integer, x-telo-span-attribute: telo.check.exit_code }
      checkReport:
        anyOf:
          - $ref: "telo://Self/CheckReport"
          - type: "null"
      checkMessages: { type: string }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path)"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: check
    invoke: !ref runCommand
    inputs:
      args: !cel "variables.teloProgram + ['check', '-o', 'json', inputs.path]"
outputs:
  path: !cel "inputs.path"
  checkExitCode: !cel "steps.check.result.exitCode"
  checkReport: !cel "steps.check.result.stdout.trim() == '' ? null : parseJson(steps.check.result.stdout)"
  checkMessages: !cel "steps.check.result.stderr"
---
# The general `telo` CLI, exposed as one tool. The agent supplies the argv after
# the program name; `variables.teloVerbs` decides which subcommands it may name.
#
# The program comes from `variables.teloProgram`, the same one the write/edit
# check loop uses, so the two can never drive different CLI builds.
#
# Argv is passed as a LIST and execed without a shell, so nothing the agent
# writes is interpreted: an argument containing `;` or `$(…)` is one argument.
# What the guards below add is the verb decision and path confinement, which
# argv shape alone cannot make. Every argument is judged as a path — a flag's
# value after its first `=` — because the CLI cannot say which ones it reads as
# paths; the verb itself is on the allow-list and never trips the rule.
kind: Run.Sequence
metadata: { name: runTelo }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [args]
    properties:
      args:
        type: array
        items: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [exitCode, output, messages]
    properties:
      exitCode: { type: integer }
      output: { type: string }
      messages: { type: string }
steps:
  - name: guard
    if: !cel "size(inputs.args) == 0 || !(inputs.args[0] in variables.teloVerbs)"
    then:
      - name: reject
        throw:
          code: ERR_TELO_VERB_NOT_ALLOWED
          message: !cel >-
            'telo ' + (size(inputs.args) == 0 ? '' : inputs.args[0]) +
            ' is not available here. Allowed subcommands: ' +
            join(variables.teloVerbs, ', ') +
            '. Note a bare path means `run`, which is not allowed.'
  - name: outside
    value: !cel >-
      inputs.args
        .map(a, a.startsWith('-') && a.contains('=') ? a.substring(a.indexOf('=') + 1) : a)
        .filter(p, Self.outsideWorkspace(p))
  - name: confine
    if: !cel "size(steps.outside.result) > 0"
    then:
      - name: rejectPath
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(steps.outside.result[0])"
  - name: run
    invoke: !ref runCommand
    inputs:
      args: !cel "variables.teloProgram + inputs.args"
outputs:
  exitCode: !cel "steps.run.result.exitCode"
  # Kept apart for the same reason as the check loop: under `-o json` stdout is
  # a parseable document and stderr is human prose, and concatenating them
  # splices one into the other.
  output: !cel "steps.run.result.stdout"
  messages: !cel "steps.run.result.stderr"
---
# `telo run` on ONE path, exposed as the test runner.
#
# Kept apart from the general `telo` tool rather than added to `teloVerbs`,
# because it is a different decision by a different person: that list says which
# INSPECTION verbs are available, while this is the one switch that turns
# arbitrary code execution on. Folding `run` into the verb list would hide a
# security decision inside a list read as a convenience.
#
# The verb is fixed here — the agent supplies only a path, appended to a fixed
# argv and execed WITHOUT a shell — so this grants running a manifest, not
# command access. `timeoutMs` bounds a manifest that never exits.
kind: Run.Sequence
metadata: { name: runManifest }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [exitCode, output, messages]
    properties:
      exitCode: { type: integer }
      output: { type: string }
      messages: { type: string }
steps:
  - name: guard
    if: !cel "!variables.allowManifestRuns"
    then:
      - name: reject
        throw:
          code: ERR_MANIFEST_RUNS_NOT_ALLOWED
          message: >-
            Running manifests is not enabled in this deployment. Validate the
            tests with telo_check instead, and say they are ready to run.
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path)"
    then:
      - name: rejectPath
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: run
    invoke: !ref runCommand
    inputs:
      args: !cel "variables.teloProgram + ['run', inputs.path]"
      timeoutMs: !cel "variables.runTimeoutMs"
outputs:
  exitCode: !cel "steps.run.result.exitCode"
  # Kept apart for the same reason as the check loop: the suite writes its
  # per-test verdicts to stdout and the kernel's own diagnostics to stderr, and
  # concatenating them splices one into the other.
  output: !cel "steps.run.result.stdout"
  messages: !cel "steps.run.result.stderr"
---
# write_file / edit_file are exposed to the agent through these sequences: the
# path is confined, the resulting content is scanned for credentials BEFORE
# anything is written, and every mutation is immediately followed by
# `telo check` on the same file, whose report is returned in the tool result.
# The agent therefore always sees diagnostics after touching a file — it cannot
# "forget" to validate — and cannot write a key into a file at all.
kind: Run.Sequence
metadata: { name: writeFileChecked }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, content]
    properties:
      path: { type: string }
      content: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, bytesWritten, checkExitCode, checkReport, checkMessages]
    properties:
      path: { type: string }
      bytesWritten: { type: integer }
      checkExitCode: { type: integer, x-telo-span-attribute: telo.check.exit_code }
      checkReport:
        anyOf:
          - $ref: "telo://Self/CheckReport"
          - type: "null"
      checkMessages: { type: string }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path)"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: findings
    value: !cel "SecretScan.credentialFindings(inputs.content)"
  - name: secret
    if: !cel "size(steps.findings.result) > 0"
    then:
      - name: refuseSecret
        throw:
          code: ERR_SECRET_IN_MANIFEST
          message: !cel "Self.secretMessage(inputs.path, steps.findings.result)"
          data:
            path: !cel "inputs.path"
            findings: !cel "steps.findings.result"
  - name: write
    invoke: !ref writeFile
    inputs:
      path: !cel "inputs.path"
      content: !cel "inputs.content"
      createParents: true
  - name: check
    invoke: !ref runCommand
    inputs:
      args: !cel "variables.teloProgram + ['check', '-o', 'json', inputs.path]"
outputs:
  path: !cel "inputs.path"
  bytesWritten: !cel "steps.write.result.bytesWritten"
  checkExitCode: !cel "steps.check.result.exitCode"
  checkReport: !cel "steps.check.result.stdout.trim() == '' ? null : parseJson(steps.check.result.stdout)"
  checkMessages: !cel "steps.check.result.stderr"
---
# The edit is scanned as the file it would leave: read through the confined
# read, the one occurrence replaced, the result scanned. When `oldString` does
# not occur exactly once there is no result to scan — the edit itself refuses.
kind: Run.Sequence
metadata: { name: editFileChecked }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, oldString, newString]
    properties:
      path: { type: string }
      oldString: { type: string }
      newString: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, replacements, checkExitCode, checkReport, checkMessages]
    properties:
      path: { type: string }
      replacements: { type: integer }
      checkExitCode: { type: integer, x-telo-span-attribute: telo.check.exit_code }
      checkReport:
        anyOf:
          - $ref: "telo://Self/CheckReport"
          - type: "null"
      checkMessages: { type: string }
steps:
  - name: current
    invoke: !ref readWorkspaceFile
    inputs:
      path: !cel "inputs.path"
  - name: unique
    if: !cel "inputs.oldString != '' && size(steps.current.result.content.split(inputs.oldString)) == 2"
    then:
      - name: findings
        value: !cel "SecretScan.credentialFindings(replace(steps.current.result.content, inputs.oldString, inputs.newString))"
      - name: secret
        if: !cel "size(steps.findings.result) > 0"
        then:
          - name: refuseSecret
            throw:
              code: ERR_SECRET_IN_MANIFEST
              message: !cel "Self.secretMessage(inputs.path, steps.findings.result)"
              data:
                path: !cel "inputs.path"
                findings: !cel "steps.findings.result"
  - name: edit
    invoke: !ref editFile
    inputs:
      path: !cel "inputs.path"
      oldString: !cel "inputs.oldString"
      newString: !cel "inputs.newString"
  - name: check
    invoke: !ref runCommand
    inputs:
      args: !cel "variables.teloProgram + ['check', '-o', 'json', inputs.path]"
outputs:
  path: !cel "inputs.path"
  replacements: !cel "steps.edit.result.replacements"
  checkExitCode: !cel "steps.check.result.exitCode"
  checkReport: !cel "steps.check.result.stdout.trim() == '' ? null : parseJson(steps.check.result.stdout)"
  checkMessages: !cel "steps.check.result.stderr"
---
# Every result is TEXT the model reads — a `result:` rendering per tool, never
# the output serialized as JSON. The structured output still rides the tool
# result record (`output`) for clients.
kind: Ai.Tools
metadata: { name: workspaceTools }
tools:
  - tool: !ref writeFileChecked
    name: write_file
    description: >-
      Write a file whole, relative to the workspace root (creates parent dirs),
      then automatically run `telo check` on it. The result is text: `wrote
      <path>`, then `check: clean` or one `file:line:col CODE message` line per
      diagnostic, then any notes the checker wrote. Read the CODE to decide
      what to fix; keep fixing until the check is clean. A path outside the
      workspace fails with ERR_PATH_OUTSIDE_WORKSPACE, and content holding a
      credential is refused with ERR_SECRET_IN_MANIFEST before anything is
      written.
    parameters:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
    result: !cel "'wrote ' + result.path + '\\n' + Self.renderCheck(result.checkExitCode, result.checkReport, result.checkMessages)"
  - tool: !ref editFileChecked
    name: edit_file
    description: >-
      Replace an exact substring in an existing file (fails if absent or not
      unique), then automatically run `telo check` on it. The result is text:
      `wrote <path>`, then `check: clean` or one `file:line:col CODE message`
      line per diagnostic, then any notes the checker wrote. Keep fixing until
      the check is clean. An edit whose result would hold a credential is
      refused with ERR_SECRET_IN_MANIFEST before anything is written.
    parameters:
      type: object
      additionalProperties: false
      required: [path, oldString, newString]
      properties:
        path: { type: string }
        oldString: { type: string }
        newString: { type: string }
    result: !cel "'wrote ' + result.path + '\\n' + Self.renderCheck(result.checkExitCode, result.checkReport, result.checkMessages)"
  - tool: !ref readWorkspaceFile
    name: read_file
    description: >-
      Read a file, relative to the workspace root. The result is the file's
      contents exactly as they are on disk.
    parameters:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string }
    result: !cel "result.content"
  - tool: !ref listWorkspaceDir
    name: list_dir
    description: >-
      List a directory relative to the workspace root; recursive optional, and
      the whole root when `path` is omitted. The result is one path per line,
      relative to the workspace root, a directory with a trailing `/`. Caches,
      vendor directories and the agent's own state (`.telo`, `node_modules`,
      `.git`, `dist`, `.telo-agent`) are filtered out at any depth — their
      absence from a listing is not evidence that files are missing.
    parameters:
      type: object
      additionalProperties: false
      properties:
        path: { type: string }
        recursive: { type: boolean }
    inputs:
      path: !cel "'path' in arguments ? arguments.path : ''"
      recursive: !cel "'recursive' in arguments ? arguments.recursive : false"
    result: !cel "join(result.entries.map(e, e.path + (e.type == 'directory' ? '/' : '')), '\\n')"
  - tool: !ref deleteWorkspaceFile
    name: delete_file
    description: >-
      Delete a file, relative to the workspace root (or a directory tree with
      recursive: true). Fails if the path does not exist. The result is
      `deleted <path>`. After deleting a file other manifests reference, run
      telo_check on them to catch dangling imports or refs.
    parameters:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string }
        recursive: { type: boolean }
    inputs:
      path: !cel "arguments.path"
      recursive: !cel "'recursive' in arguments ? arguments.recursive : false"
    result: !cel "'deleted ' + result.path"
  - tool: !ref runTelo
    name: telo
    description: >-
      Run the `telo` CLI. `args` is the argv after the program name, as a list
      of separate strings — ["module", "manifest", "oci://ghcr.io/telorun/sql"],
      never one joined string. Available subcommands: `check` (validate
      manifests), `cel` (`cel functions` lists every CEL function with its
      signature and CALL FORM; `cel eval "<expr>"` evaluates one), `module`
      (`versions` / `manifest` / `kinds` / `resources` / `digest` for a module
      ref — read a kind's exact schema before writing against it), and `search`
      (find kinds across published modules). Pass `-o json` for a parseable
      document. Running a manifest is not available here. The result is the
      command's stdout as printed, an `exit N` line only when it failed, and its
      stderr under `stderr:` only when it wrote any. Every argument is judged as
      a workspace path: one outside it fails with ERR_PATH_OUTSIDE_WORKSPACE.
    parameters:
      type: object
      additionalProperties: false
      required: [args]
      properties:
        args:
          type: array
          items: { type: string }
    result: !cel "Self.renderRun(result.exitCode, result.output, result.messages)"
  - tool: !ref runManifest
    name: run_manifest
    description: >-
      Run a manifest, relative to the workspace root: a test suite
      (`apps/<slug>/tests/telo.yaml`), a single test file, or a throwaway probe
      that reads something and prints it. The result is its stdout as printed
      — the per-test PASS/FAIL lines, or whatever a probe printed — an `exit N`
      line only when it failed, and its stderr under `stderr:` only when it
      wrote any. Never point it at an application: it starts a server that
      never exits, so the call just times out. A probe must only READ. An
      ERR_MANIFEST_RUNS_NOT_ALLOWED error means this deployment does not permit
      executing manifests — validate with telo_check instead and say the tests
      are ready to run.
    parameters:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string }
    result: !cel "Self.renderRun(result.exitCode, result.output, result.messages)"
  - tool: !ref checkFile
    name: telo_check
    description: >-
      Run `telo check` on a manifest file, relative to the workspace root. Use
      it to re-validate a file you did not just write — e.g. after deleting or
      renaming something it references. The result is `check: clean` or one
      `file:line:col CODE message` line per diagnostic, then any notes the
      checker wrote.
    parameters:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string }
    result: !cel "Self.renderCheck(result.checkExitCode, result.checkReport, result.checkMessages)"
---
kind: Ai.AgentStream
metadata: { name: author }
model: !ref model
# The primer is a file of its own: it is prose, it is hashed as the agent's
# prompt identity (`promptIdentity`), and a literal block this size made the
# library unreadable.
system: !include-text ./primer.md
# Model responses one request may take — each carries any number of tool calls,
# which is why the primer tells the agent to batch independent ones. Building an
# application is several files — a feature library per domain, a test per
# behaviour, the suite, the wiring — each with its own check-and-fix, plus
# discovery and a test-and-fix loop. At 16 a build ran out mid-way and lost the
# reply with the work half-written, which is the one outcome this workflow must
# not produce. A literal because `maxSteps` is not a CEL slot on this kind; the
# turn's real ceiling is the token budget, which settles to what was actually
# spent.
maxSteps: 40
toolProviders:
  - provider: !ref workspaceTools
  - provider: !ref hubTools
---
# How a turn ends, whichever way it ends: settle its budget reservation, then
# bring its projection up to date. A turn that completed is charged what its
# `finish` record reports; any other ending is charged at least its reservation,
# and more when the model calls it completed already cost more.
kind: RecordStream.EndHandler
metadata: { name: turnEnd }
handler: !ref endTurn
inputs:
  conversationId: !cel "context.conversationId"
  turnId: !cel "context.turnId"
  reserved: !cel "context.reserved"
  # What the turn consumed, as the model reported it: the terminal `finish`
  # record's sum when the turn completed, else the sum over the model calls
  # that finished.
  inputTokens: !cel >-
    cel.bind(finishes, records.filter(r, r.type == 'finish'),
      outcome.state == 'completed' && size(finishes) > 0
        ? int(finishes[0].usage.promptTokens)
        : int(sum(records.filter(r, r.type == 'step-finish').map(r, r.usage.promptTokens))))
  outputTokens: !cel >-
    cel.bind(finishes, records.filter(r, r.type == 'finish'),
      outcome.state == 'completed' && size(finishes) > 0
        ? int(finishes[0].usage.completionTokens)
        : int(sum(records.filter(r, r.type == 'step-finish').map(r, r.usage.completionTokens))))
  amount: !cel >-
    cel.bind(finishes, records.filter(r, r.type == 'finish'),
      outcome.state == 'completed' && size(finishes) > 0
        ? int(finishes[0].usage.totalTokens)
        : cel.bind(spent, int(sum(records.filter(r, r.type == 'step-finish').map(r, r.usage.totalTokens))),
            spent > context.reserved ? spent : context.reserved))
---
kind: Run.Sequence
metadata: { name: endTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, turnId, reserved, amount, inputTokens, outputTokens]
    properties:
      conversationId: { type: string }
      turnId: { type: string }
      reserved: { type: integer }
      amount: { type: integer }
      # The turn's token usage, on the span that settles it.
      inputTokens: { type: integer, x-telo-span-attribute: gen_ai.usage.input_tokens }
      outputTokens: { type: integer, x-telo-span-attribute: gen_ai.usage.output_tokens }
steps:
  # Settled first: a projection that fails still ends the turn with its error,
  # but must not leave the reservation held — the projection is caught up from
  # the journal by the next history read, the reservation by nothing.
  - name: settle
    invoke: !ref budget
    inputs:
      op: settle
      key: "global"
      amount: !cel "inputs.amount"
      reserved: !cel "inputs.reserved"
  - name: project
    invoke: !ref projectTurn
    inputs:
      conversationId: !cel "inputs.conversationId"
      turnId: !cel "inputs.turnId"
---
# POST /chat entry. Admits a turn — per-IP throttle, spend reservation, the
# one-turn-per-conversation lease — and returns { turnId } immediately, the turn
# itself running DETACHED into the journal under that id. The client then
# consumes GET /chat/{turnId}/events to stream the reply, so a reload can
# re-attach and resume the pending turn.
#
# With an Idempotency-Key the admission runs at most once per
# `<conversationId>:<key>`: a repeat replays the original { turnId } instead of
# starting a second turn, which is what makes a client's blind retry of a POST
# that did land safe. The record lives on `agent.sqlite`, so it survives a
# restart. A refused admission throws, which releases the key — a retry after a
# 429 is a new attempt, not a replay of the refusal.
kind: Run.Sequence
metadata: { name: chatStart }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [conversationId, message, clientIp, idempotencyKey]
    properties:
      conversationId: { type: string }
      message: { type: string }
      clientIp: { type: string }
      # Empty when the request carried no Idempotency-Key header.
      idempotencyKey: { type: string, maxLength: 255 }
steps:
  # Minted outside the idempotent region: the id a fresh admission uses, and
  # unused when a repeat replays the one the first admission settled.
  - name: turn
    value:
      id: !cel "uuidv7()"
      # The token only this turn's journal sink drains under.
      writer: !cel "uuidv4()"
  - name: admission
    if: !cel "inputs.idempotencyKey == ''"
    then:
      - name: direct
        invoke: !ref admitTurn
        inputs:
          conversationId: !cel "inputs.conversationId"
          turnId: !cel "steps.turn.result.id"
          writer: !cel "steps.turn.result.writer"
          message: !cel "inputs.message"
          clientIp: !cel "inputs.clientIp"
    else:
      - name: once
        invoke:
          kind: Idempotency.Once
          store:
            kind: KvStoreSql.Store
            connection: !ref chatDb
            table: turn_admissions
          # Admission is milliseconds of work; the claim only has to outlive a
          # holder that died mid-admission.
          claimTtl: 30s
          ttl: 24h
          invoke: !ref admitTurn
        inputs:
          key: !cel "inputs.conversationId + ':' + inputs.idempotencyKey"
          inputs:
            conversationId: !cel "inputs.conversationId"
            turnId: !cel "steps.turn.result.id"
            writer: !cel "steps.turn.result.writer"
            message: !cel "inputs.message"
            clientIp: !cel "inputs.clientIp"
      - name: inFlight
        if: !cel "steps.once.result.state == 'in-flight'"
        then:
          - name: refuseInFlight
            throw:
              code: ERR_IDEMPOTENCY_KEY_IN_FLIGHT
              message: >-
                A request with this Idempotency-Key is still being admitted.
                Retry it with the same key.
      # The same key names the same request: a different message under it is a
      # client bug, never a second turn and never the first turn's id.
      - name: reused
        if: !cel "steps.once.result.state == 'replayed' && steps.once.result.result.fingerprint != sha256(inputs.message)"
        then:
          - name: refuseReused
            throw:
              code: ERR_IDEMPOTENCY_KEY_REUSED
              message: >-
                This Idempotency-Key was already used for a different message in
                this conversation. Send a new key for a new message.
outputs:
  turnId: !cel "inputs.idempotencyKey == '' ? steps.direct.result.turnId : steps.once.result.result.turnId"
---
# One admission attempt. Every refusal is a coded error the route maps to its
# status. The throttle and the budget refuse before anything is written; after
# the reservation, a refused lease or any failure — of the claim, the `turns`
# row or the lease — refunds it and removes whatever of the key and the row was
# written, so a start that did not happen leaves nothing behind. A failure is
# raised as it was.
#
# The key is claimed HERE, before POST /chat answers, under a writer token only
# this turn's sink knows — so a client that opens the event stream the moment it
# has the id finds a turn that exists and tails it, and a turn that fails before
# its first record still ends with a readable error instead of a key nobody
# ever wrote.
kind: Run.Sequence
metadata: { name: admitTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [conversationId, turnId, writer, message, clientIp]
    properties:
      conversationId: { type: string }
      turnId: { type: string }
      # Minted by the caller, outside the idempotent region: a repeat must not
      # mint a second one.
      writer: { type: string }
      message: { type: string }
      clientIp: { type: string }
steps:
  # Per-IP throttle first — a rate-limited client doesn't touch the budget.
  - name: guard
    invoke: !ref ipGuard
    inputs:
      key: !cel "inputs.clientIp"
  - name: throttled
    if: !cel "!steps.guard.result.allowed"
    then:
      - name: refuseThrottled
        throw:
          code: ERR_RATE_LIMITED
          message: Too many turns started from this address. Retry after `retryAfter` seconds.
          data:
            retryAfter: !cel "steps.guard.result.retryAfter"
  # Reserve worst-case spend up front. A denied reserve refunds itself, so an
  # over-ceiling request is a clean refusal with no turn started.
  - name: reserve
    invoke: !ref budget
    inputs:
      op: reserve
      key: "global"
      amount: !cel "variables.reservePerTurn"
  - name: overBudget
    if: !cel "!steps.reserve.result.allowed"
    then:
      - name: refuseAtCapacity
        throw:
          code: ERR_AT_CAPACITY
          message: The agent's spend ceiling is reached. Retry after `retryAfter` seconds.
          data:
            retryAfter: !cel "steps.reserve.result.retryAfter"
  # Everything after the reservation takes it back when it fails — the claim,
  # the `turns` row, the lease — and, once the key is claimed, removes the key
  # and the row again, then raises the original error.
  - name: admit
    try:
      - name: claim
        invoke:
          kind: RecordStream.JournalClaim
          journal: !ref turnJournal
        inputs:
          key: !cel "inputs.turnId"
          writer: !cel "inputs.writer"
      - name: claimed
        try:
          - name: recordTurn
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: "INSERT INTO turns (turn_id, conversation_id) VALUES (?, ?)"
              bindings:
                - !cel "inputs.turnId"
                - !cel "inputs.conversationId"
          - name: startTurn
            invoke: !ref turnLock
            inputs:
              key: !cel "inputs.conversationId"
              holder: !cel "inputs.turnId"
              inputs:
                conversationId: !cel "inputs.conversationId"
                turnId: !cel "inputs.turnId"
                lead: !cel "{'type': 'user-message', 'content': inputs.message, 'model': variables.model}"
                resume: false
                reserved: !cel "steps.reserve.result.reserved"
                writer: !cel "inputs.writer"
        catch:
          - name: forgetFailedTurn
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: "DELETE FROM turns WHERE turn_id = ?"
              bindings: [ !cel "inputs.turnId" ]
          - name: releaseFailedKey
            invoke:
              kind: RecordStream.JournalRemoval
              journal: !ref turnJournal
            inputs:
              key: !cel "inputs.turnId"
          - name: raiseStartFailure
            throw:
              code: !cel "error.code"
              message: !cel "error.message"
              data: !cel "has(error.data) ? error.data : null"
    catch:
      - name: refundFailed
        invoke: !ref budget
        inputs:
          op: settle
          key: "global"
          amount: 0
          reserved: !cel "steps.reserve.result.reserved"
      - name: raiseAdmissionFailure
        throw:
          code: !cel "error.code"
          message: !cel "error.message"
          data: !cel "has(error.data) ? error.data : null"
  # A turn is already in flight for this conversation — refuse the overlap so two
  # turns never write the shared workspace at once, and take back everything this
  # attempt wrote: the reservation, the `turns` row and the claimed key.
  - name: overlap
    if: !cel "!steps.startTurn.result.acquired"
    then:
      - name: refund
        invoke: !ref budget
        inputs:
          op: settle
          key: "global"
          amount: 0
          reserved: !cel "steps.reserve.result.reserved"
      - name: forgetTurn
        invoke: { kind: Sql.Command, connection: !ref chatDb }
        inputs:
          sql: "DELETE FROM turns WHERE turn_id = ?"
          bindings: [ !cel "inputs.turnId" ]
      - name: releaseKey
        invoke:
          kind: RecordStream.JournalRemoval
          journal: !ref turnJournal
        inputs:
          key: !cel "inputs.turnId"
      - name: refuseOverlap
        throw:
          code: ERR_TURN_IN_PROGRESS
          message: A turn is already running for this conversation.
          data:
            activeTurnId: !cel "steps.startTurn.result.holder"
outputs:
  turnId: !cel "inputs.turnId"
  # What a replay under the same key is compared against.
  fingerprint: !cel "sha256(inputs.message)"
---
# POST /chat/{turnId}/abort. Cancels the turn's running attempt through the
# conversation's lease — its model call and its running tool see the
# cancellation, the journal fails the key with ERR_INVOKE_CANCELLED (the event
# stream's last frame), the end handler settles the reservation to what the
# completed calls cost, and the lease frees. `aborted_at` is what tells this
# ending apart from a shutdown's cancellation: an aborted turn is not continued.
# A turn nothing is running for answers `cancelled: false`.
kind: Run.Sequence
metadata: { name: abortTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId]
    properties:
      turnId: { type: string }
steps:
  - name: header
    invoke: !ref journalRead
    inputs:
      key: !cel "inputs.turnId"
      limit: 0
  - name: removed
    if: !cel "steps.header.result.state == 'removed'"
    then:
      - name: refuseRemoved
        throw:
          code: ERR_JOURNAL_KEY_REMOVED
          message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
  - name: row
    invoke: !ref historyRows
    inputs:
      sql: "SELECT conversation_id FROM turns WHERE turn_id = ?"
      bindings: [ !cel "inputs.turnId" ]
  - name: unknown
    if: !cel "steps.header.result.state == 'unknown' || size(steps.row.result.rows) == 0"
    then:
      - name: refuseUnknown
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'No turn ' + inputs.turnId + ' was started on this agent.'"
  # Stamped BEFORE the cancel, so no read between the turn failing with
  # ERR_INVOKE_CANCELLED and the stamp reports it `failed`. Only an unstamped
  # turn is stamped, and only a stamp this request wrote is cleared again when
  # nothing was running — an earlier abort's stays.
  - name: stamp
    invoke: { kind: Sql.Command, connection: !ref chatDb }
    inputs:
      sql: "UPDATE turns SET aborted_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now') WHERE turn_id = ? AND aborted_at IS NULL"
      bindings: [ !cel "inputs.turnId" ]
  # The holder guard makes this cancel THIS turn only, never a later one the
  # conversation has started since.
  - name: cancel
    invoke: !ref turnLock
    inputs:
      op: cancel
      key: !cel "steps.row.result.rows[0].conversation_id"
      holder: !cel "inputs.turnId"
  - name: cancelled
    value: !cel "has(steps.cancel.result.cancelled) && steps.cancel.result.cancelled"
  - name: notRunning
    if: !cel "!steps.cancelled.result && steps.stamp.result.rowCount > 0"
    then:
      - name: unstamp
        invoke: { kind: Sql.Command, connection: !ref chatDb }
        inputs:
          sql: "UPDATE turns SET aborted_at = NULL WHERE turn_id = ?"
          bindings: [ !cel "inputs.turnId" ]
outputs:
  cancelled: !cel "steps.cancelled.result"
---
# POST /chat/{turnId}/continue. Re-enters an interrupted turn — failed, or cut
# off by a process that died — as another attempt at the SAME turn: its id, its
# records and its event stream stay, and the model is given the turn's recorded
# history in full plus a note naming what interrupted it and which tool calls
# have no recorded result. Refused, in order: removed (410), unknown (404), a
# turn of this conversation still running (409 ERR_TURN_IN_PROGRESS), a turn
# that finished, was aborted or has a later turn after it (409
# ERR_TURN_NOT_CONTINUABLE with the reason), then the throttle and the budget
# (429). The attempt reserves and settles on its own. Returns the id of the last
# record before the attempt: the next one is its `turn-continued` record.
kind: Run.Sequence
metadata: { name: continueTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId, clientIp]
    properties:
      turnId: { type: string }
      clientIp: { type: string }
steps:
  - name: attempt
    value:
      # The token only this attempt's journal sink drains under.
      writer: !cel "uuidv4()"
  - name: snapshot
    invoke: !ref journalRead
    inputs:
      key: !cel "inputs.turnId"
  - name: removed
    if: !cel "steps.snapshot.result.state == 'removed'"
    then:
      - name: refuseRemoved
        throw:
          code: ERR_JOURNAL_KEY_REMOVED
          message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
  - name: row
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT t.conversation_id, t.aborted_at,
               (SELECT MAX(l.turn_id) FROM turns l WHERE l.conversation_id = t.conversation_id) AS last_turn_id
        FROM turns t WHERE t.turn_id = ?
      bindings: [ !cel "inputs.turnId" ]
  - name: unknown
    if: !cel "steps.snapshot.result.state == 'unknown' || size(steps.row.result.rows) == 0"
    then:
      - name: refuseUnknown
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'No turn ' + inputs.turnId + ' was started on this agent.'"
  - name: turn
    value:
      conversationId: !cel "steps.row.result.rows[0].conversation_id"
      lastTurnId: !cel "steps.row.result.rows[0].last_turn_id"
      status: !cel >-
        Self.turnStatus(steps.snapshot.result.state, steps.snapshot.result.error,
          steps.row.result.rows[0].aborted_at)
  # Only the conversation's last turn can be running: this one with a live
  # writer, or a later one.
  - name: last
    invoke: !ref journalRead
    inputs:
      key: !cel "steps.turn.result.lastTurnId"
      limit: 0
  - name: inProgress
    if: !cel "steps.last.result.state == 'open'"
    then:
      - name: refuseInProgress
        throw:
          code: ERR_TURN_IN_PROGRESS
          message: A turn is already running for this conversation.
          data:
            activeTurnId: !cel "steps.turn.result.lastTurnId"
  - name: notContinuable
    if: !cel >-
      steps.turn.result.status in ['finished', 'aborted'] || steps.turn.result.lastTurnId != inputs.turnId
    then:
      - name: refuseNotContinuable
        throw:
          code: ERR_TURN_NOT_CONTINUABLE
          message: !cel >-
            steps.turn.result.status == 'finished' ? 'This turn finished; there is nothing to continue.'
              : steps.turn.result.status == 'aborted' ? 'This turn was aborted; send a new message instead.'
              : 'A later turn follows this one; only the last turn of a conversation can be continued.'
          data:
            reason: !cel >-
              steps.turn.result.status == 'finished' ? 'finished'
                : steps.turn.result.status == 'aborted' ? 'aborted' : 'superseded'
  - name: guard
    invoke: !ref ipGuard
    inputs:
      key: !cel "inputs.clientIp"
  - name: throttled
    if: !cel "!steps.guard.result.allowed"
    then:
      - name: refuseThrottled
        throw:
          code: ERR_RATE_LIMITED
          message: Too many turns started from this address. Retry after `retryAfter` seconds.
          data:
            retryAfter: !cel "steps.guard.result.retryAfter"
  - name: reserve
    invoke: !ref budget
    inputs:
      op: reserve
      key: "global"
      amount: !cel "variables.reservePerTurn"
  - name: overBudget
    if: !cel "!steps.reserve.result.allowed"
    then:
      - name: refuseAtCapacity
        throw:
          code: ERR_AT_CAPACITY
          message: The agent's spend ceiling is reached. Retry after `retryAfter` seconds.
          data:
            retryAfter: !cel "steps.reserve.result.retryAfter"
  # Until the attempt is started, nothing else settles this reservation: any
  # failure gives it back and is raised as it was. Once started, the attempt's
  # own ending settles it.
  - name: start
    try:
      # A new attempt drops any abort mark: an abort stamps before it cancels,
      # and an attempt that then ended another way leaves the mark behind, which
      # must not make a later cancellation of THIS attempt read as `aborted`.
      - name: touch
        invoke: { kind: Sql.Command, connection: !ref chatDb }
        inputs:
          sql: "UPDATE turns SET active_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), aborted_at = NULL WHERE turn_id = ?"
          bindings: [ !cel "inputs.turnId" ]
      - name: startAttempt
        invoke: !ref turnLock
        inputs:
          key: !cel "steps.turn.result.conversationId"
          holder: !cel "inputs.turnId"
          inputs:
            conversationId: !cel "steps.turn.result.conversationId"
            turnId: !cel "inputs.turnId"
            lead: !cel >-
              {'type': 'turn-continued',
               'note': Self.interruptionNote(steps.snapshot.result.entries.map(e, e.data), steps.snapshot.result.error),
               'model': variables.model}
            resume: true
            reserved: !cel "steps.reserve.result.reserved"
            writer: !cel "steps.attempt.result.writer"
    catch:
      - name: refundFailed
        invoke: !ref budget
        inputs:
          op: settle
          key: "global"
          amount: 0
          reserved: !cel "steps.reserve.result.reserved"
      - name: raiseStartFailure
        throw:
          code: !cel "error.code"
          message: !cel "error.message"
          data: !cel "has(error.data) ? error.data : null"
  - name: overlap
    if: !cel "!steps.startAttempt.result.acquired"
    then:
      - name: refund
        invoke: !ref budget
        inputs:
          op: settle
          key: "global"
          amount: 0
          reserved: !cel "steps.reserve.result.reserved"
      - name: refuseOverlap
        throw:
          code: ERR_TURN_IN_PROGRESS
          message: A turn is already running for this conversation.
          data:
            activeTurnId: !cel "steps.startAttempt.result.holder"
  # Taken over before this answers, so a reader attaching now tails the attempt
  # instead of reading the previous attempt's failure. The attempt's own sink
  # drains under the same writer and may get there first — even end the attempt
  # first, and then the claim leaves that ending as it is. The records before
  # the attempt are the snapshot's.
  - name: claim
    try:
      - name: takeOver
        invoke:
          kind: RecordStream.JournalClaim
          journal: !ref turnJournal
        inputs:
          key: !cel "inputs.turnId"
          writer: !cel "steps.attempt.result.writer"
          resume: true
    catch:
      # Removed since the snapshot: the attempt's sink is refused the same key
      # before it pulls a record, so nothing else settles this reservation.
      - name: removedSince
        if: !cel "error.code == 'ERR_JOURNAL_KEY_REMOVED'"
        then:
          - name: refundRemoved
            invoke: !ref budget
            inputs:
              op: settle
              key: "global"
              amount: 0
              reserved: !cel "steps.reserve.result.reserved"
      # Held under another writer: a second continue of this turn started its
      # own attempt after this one's had already ended, so this attempt's
      # reservation was settled by its own ending and the turn is running now.
      - name: runningSince
        if: !cel "error.code == 'ERR_JOURNAL_KEY_BUSY'"
        then:
          - name: refuseRunning
            throw:
              code: ERR_TURN_IN_PROGRESS
              message: A turn is already running for this conversation.
              data:
                activeTurnId: !cel "inputs.turnId"
      - name: reraise
        throw:
          code: !cel "error.code"
          message: !cel "error.message"
          data: !cel "has(error.data) ? error.data : null"
outputs:
  turnId: !cel "inputs.turnId"
  fromId: !cel "steps.snapshot.result.lastId"
---
# Retention: every conversation with no activity since `idleBefore` is deleted
# whole — each of its turns' journal keys removed (a removed turn answers 410
# for `retentionDays`), then its `messages`, `turn_projections` and `turns` rows
# in one transaction — and then one expiry pass forgets removal markers past
# their retention. A conversation is active when any of its turns was started or
# continued in the window. Every step is safe to repeat, so a sweep a crash cut
# short is finished by the next one.
kind: Run.Sequence
metadata: { name: retentionSweep }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [idleBefore]
    properties:
      idleBefore:
        x-telo-type: Telo.Timestamp
steps:
  - name: idle
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT conversation_id, json_group_array(turn_id) AS turn_ids FROM turns
        GROUP BY conversation_id
        HAVING julianday(MAX(active_at)) < julianday(?)
        ORDER BY conversation_id
      bindings: [ !cel "string(inputs.idleBefore)" ]
  - name: each
    invoke:
      kind: Run.Iteration
      collection: !cel "inputs.conversations"
      steps:
        - name: removeKeys
          invoke:
            kind: Run.Iteration
            collection: !cel "inputs.turnIds"
            steps:
              - name: remove
                invoke:
                  kind: RecordStream.JournalRemoval
                  journal: !ref turnJournal
                inputs:
                  key: !cel "item"
          inputs:
            turnIds: !cel "parseJson(item.turn_ids)"
        # Only the turns whose keys were removed: a turn a message admitted
        # during the sweep keeps its rows.
        - name: deleteRows
          invoke:
            kind: Sql.Transaction
            connection: !ref chatDb
            steps:
              kind: Run.Sequence
              inputType:
                kind: Telo.JsonSchema
                schema:
                  type: object
                  additionalProperties: false
                  required: [turnIds]
                  properties:
                    turnIds: { type: string }
              steps:
                - name: messages
                  invoke: { kind: Sql.Command, connection: !ref chatDb }
                  inputs:
                    sql: "DELETE FROM messages WHERE turn_id IN (SELECT value FROM json_each(?))"
                    bindings: [ !cel "inputs.turnIds" ]
                - name: projections
                  invoke: { kind: Sql.Command, connection: !ref chatDb }
                  inputs:
                    sql: "DELETE FROM turn_projections WHERE turn_id IN (SELECT value FROM json_each(?))"
                    bindings: [ !cel "inputs.turnIds" ]
                - name: turns
                  invoke: { kind: Sql.Command, connection: !ref chatDb }
                  inputs:
                    sql: "DELETE FROM turns WHERE turn_id IN (SELECT value FROM json_each(?))"
                    bindings: [ !cel "inputs.turnIds" ]
            inputs:
              turnIds: !cel "inputs.turnIds"
          inputs:
            turnIds: !cel "item.turn_ids"
    inputs:
      conversations: !cel "steps.idle.result.rows"
  - name: expire
    invoke:
      kind: RecordStream.JournalExpiry
      journal: !ref turnJournal
outputs:
  conversations: !cel "size(steps.idle.result.rows)"
---
# The detached turn body — one attempt at a turn, run once admission or a
# continue succeeded. Its whole output is one recorded stream: the attempt's
# lead record first, then the preparation and the agent's own parts — so
# everything that can fail is inside the journal, and an attempt that fails
# before the model is reached still ends with its error recorded. The end
# handler projects the turn and settles this attempt's reservation, and the sink
# drains all of it into the journal under the key the caller claimed — a new
# key for a new turn, the same key taken over (`resume`) for a continued one.
kind: Run.Sequence
metadata: { name: turnRunner }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, turnId, lead, resume, reserved, writer]
    properties:
      # The turn body is a trace root — detached from the request that admitted
      # it — so the ids that name the turn ride its span.
      conversationId: { type: string, x-telo-span-attribute: gen_ai.conversation.id }
      turnId: { type: string, x-telo-span-attribute: telo.agent.turn.id }
      # `user-message { content, model }` for a new turn, `turn-continued
      # { note, model }` for a continued one — the model is what decides whether
      # the attempt's provider state may be replayed.
      lead:
        type: object
        required: [type, model]
        properties:
          type: { type: string, enum: [user-message, turn-continued] }
          model: { type: string }
      resume: { type: boolean }
      reserved: { type: integer }
      writer: { type: string }
steps:
  - name: turn
    invoke:
      kind: Stream.Concat
      sources:
        - invoke: { kind: Stream.Of }
          inputs:
            items: !cel "[context.lead]"
        - invoke: !ref agentTurn
          inputs:
            conversationId: !cel "context.conversationId"
            turnId: !cel "context.turnId"
    inputs:
      context:
        conversationId: !cel "inputs.conversationId"
        turnId: !cel "inputs.turnId"
        lead: !cel "inputs.lead"
  - name: ending
    invoke: !ref turnEnd
    inputs:
      input: !cel "steps.turn.result.output"
      context:
        conversationId: !cel "inputs.conversationId"
        turnId: !cel "inputs.turnId"
        reserved: !cel "inputs.reserved"
  - name: sink
    invoke:
      kind: RecordStream.JournalSink
      journal: !ref turnJournal
    inputs:
      key: !cel "inputs.turnId"
      input: !cel "steps.ending.result.output"
      writer: !cel "inputs.writer"
      resume: !cel "inputs.resume"
---
# The agent's part of a turn, invoked only once the lead record is journaled:
# catch the projection up (the lead record included), replay it as the model's
# history, and stream the agent. Returns the agent's stream.
kind: Run.Sequence
metadata: { name: agentTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, turnId]
    properties:
      conversationId: { type: string }
      turnId: { type: string }
steps:
  - name: catchUp
    invoke: !ref catchUpProjection
    inputs:
      conversationId: !cel "inputs.conversationId"
  - name: readHistory
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT CASE
                 WHEN tool_calls IS NOT NULL
                   THEN json_object('role', role, 'content', json(content), 'toolCalls', json(tool_calls))
                 WHEN tool_call_id IS NOT NULL
                   THEN json_object('role', role, 'content', json(content), 'toolCallId', tool_call_id)
                 ELSE json_object('role', role, 'content', json(content))
               END AS message
        FROM messages WHERE conversation_id = ? ORDER BY turn_id, seq
      bindings: [ !cel "inputs.conversationId" ]
  # The reasoning the conversation last recorded, replayed only to the model
  # that produced it: another model cannot read it. This turn's own counts — a
  # continued turn's interrupted attempt recorded the latest.
  - name: previous
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT provider_state, provider_model FROM turn_projections
        WHERE conversation_id = ? AND turn_id <= ? AND provider_state IS NOT NULL
        ORDER BY turn_id DESC LIMIT 1
      bindings:
        - !cel "inputs.conversationId"
        - !cel "inputs.turnId"
  # What is already in the workspace, handed to the agent rather than left for it
  # to remember to look up. It asked "new app, or change an existing one?" against
  # an EMPTY workspace — a question the runtime can answer for free and exactly,
  # and one that reads as not having looked. A tool the model must remember to
  # call is a tool it sometimes will not; a message in the turn is not.
  #
  # The same exclude set the `list_dir` tool fixes, so the two agree about what
  # the workspace contains.
  - name: listWorkspace
    invoke: !ref listDir
    inputs:
      path: ""
      recursive: true
      exclude: [".telo", "node_modules", ".git", "dist", ".probes", ".telo-agent"]
  - name: ask
    invoke: !ref author
    inputs:
      providerState: !cel >-
        size(steps.previous.result.rows) > 0
          && steps.previous.result.rows[0].provider_state != null
          && steps.previous.result.rows[0].provider_model == variables.model
          ? parseJson(steps.previous.result.rows[0].provider_state)
          : null
      # Both blocks are per-turn READINGS: the workspace listing moves whenever
      # the agent writes, and the clock moves always. Neither can ride the
      # `system:` block, which is a literal resolved once at load — a date
      # stamped there would be the BOOT date for the life of the process.
      #
      # APPENDED as a user turn, not prepended as a system one, and that is a
      # cost decision rather than a stylistic one. The provider hoists EVERY
      # system message into the request's `instructions` string wherever it sits,
      # so a per-turn system message puts a moving value at the head of the
      # prompt — and the head is the cacheable prefix. One clock tick there
      # re-prices the whole system prompt, uncached, on every turn of every
      # conversation, including a pure question that writes nothing. At the tail
      # they are ordinary input: `instructions` stays byte-identical across
      # turns, and the history in front of them caches too.
      #
      # They read at least as well here — this is the state as of now, stated
      # after the request it applies to. UTC, stated as UTC: a report's
      # boundaries may well want the user's own zone, and that is a question to
      # ask rather than a guess to bury in an offset.
      messages: !cel >-
        steps.readHistory.result.rows.map(r, parseJson(r.message)) + [{
          'role': 'user',
          'content': 'CURRENT TIME: ' + nowIso() + ' (UTC). Resolve every relative period the user names — "last week", "this month", "since Friday" — against this, and say which absolute range you resolved it to. Never guess a date, and where the boundaries depend on the user timezone, ask.'
        }, {
          'role': 'user',
          'content': size(steps.listWorkspace.result.entries) == 0
            ? 'WORKSPACE STATE: the workspace is EMPTY — it contains no files at all. Anything you build is therefore new; do not ask whether to create something new or extend something existing.'
            : 'WORKSPACE STATE: the workspace contains these paths (caches and vendor directories omitted). Read them before asking anything they already answer.\n' +
              join(steps.listWorkspace.result.entries.map(e, '- ' + e.path + (e.type == 'directory' ? '/' : '')), '\n')
        }]
outputs:
  output: !cel "steps.ask.result.output"
