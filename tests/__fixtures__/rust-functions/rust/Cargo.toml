[package]
name = "rust-functions"
version = "0.0.0"
edition = "2021"
publish = false
description = "Test fixture: native functions written on the Rust SDK, loaded by the Node kernel over napi and by the SDK's own ABI test over the C ABI. Not a real module."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
telorun-sdk = { path = "../../../../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
