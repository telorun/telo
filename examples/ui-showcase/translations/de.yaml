  # Forms.
  - { text: Every control from the model, translation: Jedes Steuerelement aus dem Modell }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "Ohne geschriebene Felder zeichnet das Formular ein Steuerelement pro Eigenschaft, gewählt nach ihrem Schema: ein Textfeld, eine Liste für eine Aufzählung, Zahlenfelder, ein Datum, Datum und Uhrzeit, eine Uhrzeit, ein mehrzeiliges Feld für ein Dokument, ein Kontrollkästchen, Optionen nebeneinander für eine Liste aus einer Aufzählung und eingegebene Tags für eine Liste von Wörtern. Eine Beschreibung ist ein Hinweis unter ihrem Feld und ein Standardwert der Anfangswert." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "Jedes Feld wird gegen das Modell geprüft, sobald es berührt wurde: die Länge des Titels, die Anzahl der Personen, das Budget in Schritten von 50, die Schreibweise der Schlagwörter. Der Server lehnt einen Titel ab, den eine andere Anfrage bereits hat, und seine Antwort landet am Titel. Die Eingaben bleiben in der Adresse und in diesem Browser erhalten — alle außer dem Zugangscode, den das Modell als nur schreibbar kennzeichnet." }
  - { text: Each control chosen by hand, translation: Jedes Steuerelement von Hand gewählt }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "Dieselbe Anfrage mit einem für jedes Feld geschriebenen Steuerelement: der Titel mit seinem abgeleiteten Steuerelement, die Art als Optionen nebeneinander, die Kanäle als Liste mit Mehrfachauswahl, die Anzahl der Personen auf einem Schieberegler, dringend als Schalter und die Schlagwörter als Tags. Die Eingaben bleiben nur für diesen Tab erhalten." }
  - { text: Requests received, translation: Eingegangene Anfragen }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "Die neuesten Anfragen der beiden Formulare, nach jedem Speichern erneut gelesen." }
  - { text: "Choices, pickers and dates", translation: "Auswahlen, Picker und Daten" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "Personen für ein Projekt buchen. Das Projekt wird aus einer Liste gewählt, die aus der Projektsammlung gelesen wird, jede Option mit ihrem Code als Hinweis. Die Leitung wird in einem Dialog ausgewählt, per Namenssuche, unter den aktiven Mitgliedern der darüber gewählten Rolle; die Wahl einer anderen Rolle liest die Optionen erneut und behält die Leitung nur, wenn sie noch passt. Prüfer werden in einer Schublade gewählt, mehrere auf einmal, und der Sponsor in einem Popover; der Sponsor beginnt mit einer Standard-E-Mail-Adresse, die durch eine einzige Abfrage als Name der Person angezeigt wird. Helfer werden nebeneinander angeboten, jeweils drei, mit Mehr für den Rest. Eine gewählte Person verlinkt auf ihre E-Mail-Adresse." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "Der Zeitraum besteht aus zwei Daten mit Voreinstellungen, mit Wochen ab Sonntag, anfangs auf den nächsten Monat gesetzt und mit einer Warnung ab drei Monaten. Der Server lehnt einen Zeitraum ab, der vor seinem Beginn endet oder länger als ein Jahr dauert, und seine Antwort landet am Zeitraum. Die Personen rund um die Leitung werden angezeigt, sobald eine Leitung gewählt ist, und die Adresse vor Ort nur bei Arbeit vor Ort." }
  - { text: The project, translation: Das Projekt }
  - { text: "Which project, and who leads the work.", translation: "Welches Projekt und wer die Arbeit leitet." }
  - { text: Around the lead, translation: Rund um die Leitung }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "Wer die Arbeit prüft, wer sie fördert und wer hilft." }
  - { text: When and where, translation: Wann und wo }
  - { text: Tomorrow, translation: Morgen }
  - { text: Next week, translation: Nächste Woche }
  - { text: This month, translation: Dieser Monat }
  - { text: Next month, translation: Nächster Monat }
  - { text: Next quarter, translation: Nächstes Quartal }
  - { text: Next year, translation: Nächstes Jahr }
  - { text: Bookings, translation: Buchungen }
  - { text: "The latest bookings, read again after every save.", translation: "Die neuesten Buchungen, nach jedem Speichern erneut gelesen." }

