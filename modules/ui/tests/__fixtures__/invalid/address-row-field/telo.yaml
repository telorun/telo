# A list column's link reads a field the row does not have.
kind: Telo.Application
metadata: { name: UiInvalidAddressRowFieldApp, version: 1.0.0 }
imports: { Ui: ../../../../ }
---
kind: Telo.JsonSchema
metadata: { name: Rows }
schema:
  type: object
  properties:
    items:
      type: array
      items: { type: object, properties: { id: { type: integer }, name: { type: string } } }
---
kind: Ui.View
metadata: { name: misspelledField }
content:
  type: query
  query:
    kind: Ui.Query
    model: !ref Rows
    url: /api/rows
  content:
    - type: list
      rows: !cel "data.items"
      columns:
        - value: !cel "row.name"
          to: { kind: Ui.Navigate, href: { path: "/items/{id}", pathParams: { id: !cel "row.nmae" } } }
