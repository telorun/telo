kind: Telo.Application
metadata:
  name: ChatToolResultBound
  version: 1.0.0
  description: |
    A tool result the agent feeds its model is bounded by `maxToolResultBytes`
    (32768 by default), offline against the provider stub. The stub asks for a
    100 000-byte file to be read: the tool-result record's `content` — what the
    model received — keeps its first 32768 bytes and ends with the truncation
    marker, and its `output` still holds the file whole.
imports:
  Mcp: oci://ghcr.io/telorun/mcp-client@0.18.1#sha256-7IT8wpOmbgqWG9IUz_d4yYPwF0IzcuuH-SkF16UALKo
  Chat:
    source: ../
    resources:
      hub: !ref hub
    secrets: { anthropicApiKey: stub-key }
    needs:
      agentState: { path: !cel "variables.scratch.joinPath('state')" }
    variables:
      workspaceDir: !cel "variables.scratch.joinPath('workspace')"
      modelEndpoint: http://127.0.0.1:18533/v1
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  Stream: oci://ghcr.io/telorun/stream@0.15.1#sha256-0tmjLgpnFJ4TfG0UxOdOxr_vUK2lMPmMPdb3Gsu5Ag0
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
variables:
  scratch:
    env: CHAT_TEST_TOOL_RESULT_BOUND_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/tool-result-bound
targets:
  - !ref Chat.ensureWorkspace
  - !ref Chat.initSchema
  - !ref test
---
# The hub the chat library discovers modules through.
kind: Mcp.HttpClient
metadata: { name: hub }
url: https://telo.sh/mcp
clientInfo: { name: authoring-agent-test, version: 0.0.0 }
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: stub }
    source: ./__fixtures__/provider-stub/telo.yaml
    ports: { http: 18533 }
targets: [ !ref stub ]
steps:
  # 1000 lines of 100 bytes.
  - name: large
    value: !cel "join(range(1000).map(i, '012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678\\n'), '')"
  - name: seed
    invoke: !ref Chat.syncWorkspace
    inputs:
      write: [ { path: large.txt, content: !cel "steps.large.result" } ]
      delete: []
  - name: conversation
    invoke: !ref Chat.createConversation
  - name: start
    invoke: !ref Chat.chatStart
    inputs:
      conversationId: !cel "steps.conversation.result.conversation.id"
      idempotencyKey: ""
      clientIp: test-runner
      message: !cel "'read it STUB_CALLS:' + base64Encode(json([{'name': 'read_file', 'arguments': {'path': 'large.txt'}}]))"
  - name: read
    invoke: !ref Chat.journalSource
    inputs:
      key: !cel "steps.start.result.turnId"
      fromId: 0
  - name: drain
    timeout: 30000
    invoke: { kind: Stream.Collect }
    inputs:
      input: !cel "steps.read.result.output"
  - name: result
    value: !cel "steps.drain.result.items.filter(r, r.data.type == 'tool-result')[0].data.toolResult"
  - name: bounded
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        kept: !cel "steps.result.result.content == steps.large.result.substring(0, 32768) + '\\n' + '[truncated: 67232 of 100000 bytes cut; a tool result passes at most 32768 bytes to the model]'"
        outputWhole: !cel "steps.result.result.output.text == steps.large.result"
      expected: { kept: true, outputWhole: true }
