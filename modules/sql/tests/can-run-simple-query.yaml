kind: Telo.Application
metadata:
  name: CanRunSimpleQuery
  version: 1.0.0
imports:
  Sql: ../
  SQLite: ../../sqlite
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testSimpleQuery
---
kind: SQLite.Connection
metadata:
  name: db
file: ":memory:"
---
kind: Run.Sequence
metadata:
  name: testSimpleQuery
steps:
  - name: runQuery
    inputs:
      sql: "SELECT 1 as result"
    invoke:
      kind: Sql.Query
      connection: !ref db

  - name: assertResult
    inputs:
      rows: "${{ steps.runQuery.result.rows }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          rows:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                result:
                  const: 1
