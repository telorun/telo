kind: Telo.Application
metadata:
  name: UiDestinationRefusalsTest
  version: 1.0.0
  description: |
    What a destination refuses where it is written, by `telo check` and again
    when the application loads: a page variable left unfilled, a `page` that is
    no page, a `to` holding no destination, a destination to open a page in, the
    removed `href` and `onSuccess.navigate`, and a root its place does not
    bind. A destination reads the roots bound where it is written — `data` and
    `row` in a reader's list column, `row` in a listing's records, for a
    destination kind of another module too.
imports: { Assert: ../../assert }
targets:
  - !ref refused
  - !ref roots
---
kind: Assert.Manifest
metadata: { name: refused }
source: ./__fixtures__/invalid/destinations/telo.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "Ui.Page/homePage: /children/7 is missing required property 'to'"
    - code: SCHEMA_VIOLATION
      message: "Ui.Page/homePage: /children/7 must NOT have additional properties ('href' is not allowed)"
    - code: SCHEMA_VIOLATION
      message: "Ui.Page/homePage: /children/6/content/0 must NOT have additional properties ('href' is not allowed)"
    - code: SCHEMA_VIOLATION
      message: "Ui.Page/homePage: /children/8/ref/onSuccess must be array"
    - code: PATH_PARAMETER_UNBOUND
      message: "Ui.Page/homePage: the template 'path: /authors/{id}' of 'authorPage' (named at 'page') reads '{id}', which 'pathParams' does not bind. Add 'id' to 'pathParams'."
    - code: UNDEFINED_KIND
      message: "No Telo.Definition found for kind 'Ui.Close': module 'Ui' declares no kind 'Close'."
    - code: CEL_UNKNOWN_IDENTIFIER
      message: "Ui.Page/homePage: !cel: 'row' is not available here — Ui.Page/homePage withholds it: a destination reads only the roots bound where it is written"
    - code: REFERENCE_KIND_MISMATCH
      message: "Ui.Page/homePage: reference at 'children[3].to' → 'Ui.Dialog' does not implement 'Ui.Destination'"
    - code: REFERENCE_KIND_MISMATCH
      message: "Ui.Page/homePage: reference at 'children[1].to.page' → 'Telo.JsonSchema' (resolved: 'Telo.JsonSchema') does not match required 'Ui.Page'"
    - code: REFERENCE_KIND_MISMATCH
      message: "Ui.Page/homePage: reference at 'children[4].to.surface' → 'Ui.Navigate' does not implement 'Ui.Surface'"
  runFails: "'row' is not available here — Ui.Page/homePage withholds it: a destination reads only the roots bound where it is written"
---
kind: Assert.Manifest
metadata: { name: roots }
source: ./__fixtures__/invalid/destination-roots/telo.yaml
expect:
  errors:
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.View/team: !cel: 'row.idd' is not defined (available: id)"
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.View/team: !cel: 'data.ownr' is not defined (available: owner, members)"
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.Listing/people: !cel: 'row.idd' is not defined (available: id, name)"
    - code: CEL_UNKNOWN_IDENTIFIER
      message: "Ui.Page/home: !cel: 'row' is not available here — Ui.Page/home withholds it: a destination reads only the roots bound where it is written"
  runFails: "'row.idd' is not defined (available: id)"
