kind: Telo.Application
metadata:
  name: SseCodecSmokeTest
  version: 1.0.0
  description: |
    Frames through Sse.Encoder, compared byte for byte: each member writes its
    line only when present, in the order id, event, retry, data; an id may be a
    string or an integer, whether written in YAML or computed in CEL; a value
    that is not a frame, or a field holding a line break, ends the stream with
    the error frame.
imports:
  Sse: ../
  PlainText: ../../plain-text-codec
  Stream: ../../stream
  Assert: ../../assert
targets:
  - !ref test
---
kind: Sse.Encoder
metadata: { name: encoder }
---
# The wire text the encoder writes for `items`.
kind: Telo.Sequence
metadata: { name: encode }
inputType:
  kind: Telo.JsonSchema
  schema: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array } } }
steps:
  - { name: source, invoke: { kind: Stream.Of }, inputs: { items: !cel "inputs.items" } }
  - { name: frames, invoke: !ref encoder, inputs: { input: !cel "steps.source.result.output" } }
  - { name: text, invoke: { kind: PlainText.Decoder }, inputs: { input: !cel "steps.frames.result.output" } }
outputs:
  text: !cel "steps.text.result.text"
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  # Written in YAML, an id is a number; every member present.
  - name: literal
    invoke: !ref encode
    inputs:
      items:
        - { id: 1, event: "text-delta", retry: 3000, data: { delta: h } }
        - { id: abc, data: "plain text" }
        - { data: [1, true, null] }
  - name: assertLiteral
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.literal.result.text"
      expected: "id: 1\nevent: text-delta\nretry: 3000\ndata: {\"delta\":\"h\"}\n\nid: abc\ndata: \"plain text\"\n\ndata: [1,true,null]\n\n"

  # Computed in CEL, an integer id and retry are int64.
  - name: computed
    invoke: !ref encode
    inputs:
      items: !cel "[{'id': 9007199254740993, 'event': 'tick', 'retry': 0, 'data': {'at': 2}}]"
  - name: assertComputed
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.computed.result.text"
      expected: "id: 9007199254740993\nevent: tick\nretry: 0\ndata: {\"at\":2}\n\n"

  # What came before a refused frame is delivered; the refusal is the last frame.
  - name: eventBreak
    invoke: !ref encode
    inputs:
      items:
        - { data: 1 }
        - { event: "a\nb", data: 2 }
        - { data: 3 }
  - name: assertEventBreak
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.eventBreak.result.text"
      expected: "data: 1\n\nevent: error\ndata: {\"message\":\"Sse.Encoder \\\"encoder\\\": 'event' must not contain a line break.\",\"code\":\"ERR_INVALID_INPUT\"}\n\n"

  - name: idBreak
    invoke: !ref encode
    inputs:
      items:
        - { id: "1\r2", data: 1 }
  - name: assertIdBreak
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.idBreak.result.text"
      expected: "event: error\ndata: {\"message\":\"Sse.Encoder \\\"encoder\\\": 'id' must not contain a line break.\",\"code\":\"ERR_INVALID_INPUT\"}\n\n"

  # The record shape the encoder took before frames: refused, not guessed at.
  - name: notAFrame
    invoke: !ref encode
    inputs:
      items:
        - { type: "text-delta", delta: h }
  - name: assertNotAFrame
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.notAFrame.result.text"
      expected: "event: error\ndata: {\"message\":\"Sse.Encoder \\\"encoder\\\": a frame holds only data, event, id and retry; got 'type', 'delta'.\",\"code\":\"ERR_INVALID_INPUT\"}\n\n"
