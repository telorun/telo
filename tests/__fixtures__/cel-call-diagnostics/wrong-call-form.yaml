kind: Telo.Application
metadata:
  name: WrongCallFormFixture
  version: 1.0.0
imports:
  Run: ../../../modules/run
targets:
  - !ref badCalls
---
# Two independent mistakes in ONE expression. `check()` reports only its first,
# so before the call audit the second was invisible until the first was fixed
# and the manifest re-checked. Both must be reported in a single pass.
#
# `startsWith` is registered only as `string.startsWith(string)`, so calling it
# globally is a CALL FORM error, not a type error — no cast repairs it. `no`
# is registered under no form at all.
kind: Run.Sequence
metadata:
  name: badCalls
steps:
  - name: both
    inputs:
      flag: !cel "startsWith(inputs.key, 'uploads/') && no() > 5"
    invoke:
      kind: Run.Value
      inputType:
        kind: Telo.JsonSchema
        schema:
          type: object
          properties:
            flag: { type: boolean }
      value: !cel "inputs.flag"
