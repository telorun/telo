kind: Telo.Application
metadata:
  name: ScheduledJob
  version: 1.0.0
  categories: [ Scheduling, Coordination, Storage ]
  description: |
    A recurring job with two triggers onto one declaration: `Schedule.Cron`
    fires it on `JOB_CRON` (03:00 daily by default), and `POST /api/run` fires
    the same resource on demand. Swap `runJob`'s steps for whatever the job is — a
    rollup, a prune, a sync — and everything around it follows:

      - one run at a time: `Lease.Critical` wraps the job, so a manual run during
        a scheduled one is told who holds it (409) instead of running beside it
      - a history: every run is a row in `job_runs` with its outcome, read back
        at `GET /api/runs`
      - failures are recorded, not lost: a `try` / `catch` stores the error and
        rethrows it, so the schedule logs it and the route answers 500
      - a page at `/` with a "Run now" button and the run history — declared in
        this manifest, with no frontend code
      - a liveness probe at `GET /api/healthz`

    The schedule keeps the application alive by itself; the server is what a
    job in production ends up wanting anyway.

    Run, then open http://localhost:8046, or:
        curl -s -XPOST localhost:8046/api/run
        curl -s localhost:8046/api/runs
    To watch it tick without waiting for 03:00:
        JOB_CRON='*/10 * * * * *' telo .
# Module `lang:` — the language this application's texts are written in — and
# `UiReact.App.words` are read from 0.121.0.
requires:
  telo: ">=0.121.0"
lang: en
# `ui` and `ui-react` come from this repository while their changes are
# unreleased; `telo upgrade --pin-local` pins them again once they ship.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.38.0#sha256-QUCZmb_cvTor4YhWUAj3YdRj-kacNkmkXLnycjXLBtA
  Ui: ../../../modules/ui
  UiReact: ../../../modules/ui-react
  Schedule: oci://ghcr.io/telorun/scheduler@0.10.0#sha256-HgE-9dLBcBonFo-b81QWoKfFjgjo13P6uKKsuNnzMpQ
  Lease: oci://ghcr.io/telorun/lease@0.14.0#sha256-Q9fVDAE4m7amXF8k9NolFtxjjoHH84LRpv11j5q6r1k
  KvStore: oci://ghcr.io/telorun/kv-store-memory@0.8.0#sha256-GmMDeJ2eYatJ0_ewaUI6A6bnfkqlphjd4YKWtqZ5d2Y
  Sql: oci://ghcr.io/telorun/sql@0.28.1#sha256-ZlxQTTYQtAhK2aAyLRYMwBN-U4b8ww4ulu0SVnIxFu8
  SQLite: oci://ghcr.io/telorun/sqlite@0.10.1#sha256-1WEaTSJ_-AD9dVAa9JTdqtD94jzkkBvoGLdm2jrlroM
  Fs: oci://ghcr.io/telorun/fs@0.14.0#sha256-N5xTrQgDJ91sb_XrS6mPLsH_g0_70yj1S3xBB_hLDdA
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  Console: oci://ghcr.io/telorun/console@0.19.0#sha256-RC9Wlj4a8ysp1g3WS3z3CbmQuAsahNj4PdsJMaNfPZw
targets:
  - !ref migrate
  - !ref server
  - !ref nightly
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8046
variables:
  jobCron:
    env: JOB_CRON
    arg: cron
    type: string
    default: "0 3 * * *"
  scheduleEnabled:
    env: JOB_SCHEDULE_ENABLED
    type: boolean
    default: true
    description: >-
      Turn the calendar trigger off without removing it — a maintenance window,
      a replica that should only serve on-demand runs.
  scanPath:
    env: SCAN_PATH
    arg: scan-path
    type: string
    x-telo-type: { name: Telo.HostPath, entry: directory }
    default: "."
  dbFile:
    env: DB_FILE
    arg: db-file
    type: string
    x-telo-type: { name: Telo.HostPath, entry: file }
    default: job-runs.db
  maxRunTime:
    env: MAX_RUN_TIME
    type: string
    default: "10m"
    description: >-
      How long one run may hold the lease. Set it above the job's worst case: a
      holder that dies frees the lease after this long.
---
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.dbFile"
---
kind: SQLite.Table
metadata: { name: jobRuns }
table: job_runs
columns:
  id: { type: integer, primaryKey: true, identity: always }
  started_at: { type: text, nullable: false }
  finished_at: { type: text, nullable: false }
  outcome: { type: text, nullable: false }
  detail: { type: text, nullable: false }
---
kind: SQLite.Schema
metadata: { name: migrate }
connection: !ref db
tables:
  - !ref jobRuns
---
kind: Sql.Command
metadata: { name: exec }
connection: !ref db
---
# The job itself: nothing in it knows which trigger started it, that it is
# leased, or that it is recorded. Replace the steps; leave the shape.
kind: Run.Sequence
metadata: { name: runJob }
steps:
  - name: list
    invoke:
      kind: Fs.DirectoryListing
      cwd: !cel "variables.scanPath"
    inputs:
      exclude: [ node_modules, .git, .telo ]
outputs:
  files: !cel "size(steps.list.result.entries.filter(e, e.type == 'file'))"
  bytes: !cel "int(sum(steps.list.result.entries.map(e, e.size)))"
---
# One run, recorded whichever way it ends.
kind: Run.Sequence
metadata: { name: recordedRun }
steps:
  - name: started
    value: !cel "nowIso()"
  - name: attempt
    try:
      - name: work
        invoke: !ref runJob
      - name: recordSuccess
        invoke: !ref exec
        inputs:
          sql: "INSERT INTO job_runs (started_at, finished_at, outcome, detail) VALUES (?, ?, 'ok', ?)"
          bindings:
            - !cel "steps.started.result"
            - !cel "nowIso()"
            - !cel "json(steps.work.result)"
      - name: say
        invoke: !ref Console.writeLine
        inputs:
          output: !cel >-
            '{green ✔} scanned ' + string(variables.scanPath) + ' — ' +
            string(steps.work.result.files) + ' files, ' + string(steps.work.result.bytes) + ' bytes'
    catch:
      - name: recordFailure
        invoke: !ref exec
        inputs:
          sql: "INSERT INTO job_runs (started_at, finished_at, outcome, detail) VALUES (?, ?, 'failed', ?)"
          bindings:
            - !cel "steps.started.result"
            - !cel "nowIso()"
            - !cel "error.code + ': ' + error.message"
      - name: rethrow
        throw:
          code: ERR_JOB_FAILED
          message: !cel "error.code + ': ' + error.message"
outputs:
  files: !cel "steps.work.result.files"
  bytes: !cel "steps.work.result.bytes"
---
# Claims live in the process, which is enough to keep the two triggers apart.
# Swap this one resource for kv-store-sql or kv-store-redis and the same lease
# keeps every replica apart too.
kind: KvStore.Store
metadata: { name: claims }
---
kind: Lease.Critical
metadata: { name: runExclusively }
store: !ref claims
ttl: !cel "variables.maxRunTime"
invoke: !ref recordedRun
---
# The calendar trigger. `timezone` is explicit so the schedule means the same
# thing on every host it is deployed to. A tick that finds the lease held
# returns `acquired: false` and that is all — skipping is not an error.
kind: Schedule.Cron
metadata: { name: nightly }
cron: !cel "variables.jobCron"
timezone: UTC
when: !cel "variables.scheduleEnabled"
invoke: !ref runExclusively
inputs:
  key: scheduled-job
  holder: schedule
  inputs: {}
---
kind: Sql.Query
metadata: { name: recentRuns }
connection: !ref db
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [ rows ]
    properties:
      rows:
        type: array
        items:
          type: object
          required: [ id, startedAt, finishedAt, outcome, detail ]
          properties:
            id: { type: integer }
            startedAt: { type: string }
            finishedAt: { type: string }
            outcome: { type: string }
            detail: { type: string }
---
# What the on-demand trigger answers with: the run it made — or who is already
# running — and the history including it.
kind: Run.Sequence
metadata: { name: runOnDemand }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [ holder ]
    properties:
      holder: { type: string }
steps:
  - name: attempt
    invoke: !ref runExclusively
    inputs:
      key: scheduled-job
      holder: !cel "inputs.holder"
      inputs: {}
  - name: history
    invoke: !ref recentRuns
    inputs:
      sql: >-
        SELECT id, started_at AS "startedAt", finished_at AS "finishedAt", outcome, detail
        FROM job_runs ORDER BY id DESC LIMIT 20
      bindings: []
outputs:
  acquired: !cel "steps.attempt.result.acquired"
  holder: !cel "steps.attempt.result.acquired ? '' : string(steps.attempt.result.holder)"
  files: !cel "steps.attempt.result.acquired ? steps.attempt.result.result.files : 0"
  bytes: !cel "steps.attempt.result.acquired ? steps.attempt.result.result.bytes : 0"
  runs: !cel "steps.history.result.rows"
---
# The shape both buttons draw their table from, and both routes answer with.
kind: Telo.JsonSchema
metadata: { name: RunHistory }
schema:
  type: object
  required: [ runs ]
  properties:
    runs:
      type: array
      items:
        type: object
        required: [ id, startedAt, finishedAt, outcome, detail ]
        properties:
          id: { type: integer, title: Run }
          startedAt: { type: string, title: Started }
          finishedAt: { type: string, title: Finished }
          outcome: { type: string, title: Outcome }
          detail: { type: string, title: Detail }
---
kind: Http.Api
metadata: { name: jobRoutes }
routes:
  # The on-demand trigger: the same leased resource the schedule fires.
  - request:
      path: /run
      method: POST
    handler: !ref runOnDemand
    inputs:
      holder: !cel "'manual-' + request.ip"
    returns:
      - status: 409
        when: !cel "!result.acquired"
        content:
          application/json:
            body:
              error: already_running
              holder: !cel "result.holder"
      - status: 200
        content:
          application/json:
            body:
              files: !cel "result.files"
              bytes: !cel "result.bytes"
              runs: !cel "result.runs"
    catches:
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.code"
              message: !cel "error.message"

  - request:
      path: /runs
      method: GET
    handler: !ref recentRuns
    inputs: &recentRunsQuery
      sql: >-
        SELECT id, started_at AS "startedAt", finished_at AS "finishedAt", outcome, detail
        FROM job_runs ORDER BY id DESC LIMIT 20
      bindings: []
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result.rows"

  # The same history as an operation a page can run: a button sends a POST.
  - request:
      path: /runs/recent
      method: POST
    handler: !ref recentRuns
    inputs: *recentRunsQuery
    returns:
      - status: 200
        content:
          application/json:
            body:
              runs: !cel "result.rows"

  - request:
      path: /healthz
      method: GET
    handler:
      kind: Run.Value
      value:
        status: ok
    inputs: {}
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result"
---
# The whole frontend: two buttons, each a form with nothing to fill in, and the
# table each draws from what its route answers.
kind: UiReact.App
metadata: { name: ui }
title: Scheduled job
words: !ref Ui.words
pages:
  - path: /
    title: Job
    children:
      - { type: text, text: "Run the job", style: heading }
      - { type: text, text: "Fires the same run the schedule fires. One run at a time: a second one is refused while the first is going.", style: muted }
      - type: composite
        ref:
          kind: Ui.Action
          inputModel: &nothing
            kind: Telo.JsonSchema
            schema: { type: object, additionalProperties: false, properties: {} }
          outputModel: !ref RunHistory
          source: { path: /api/run }
          label: Run now
          result:
            type: list
            heading: Runs
            rows: !cel "result.runs"
            columns: &runColumns
              - value: !cel "row.id"
              - value: !cel "row.startedAt"
              - value: !cel "row.finishedAt"
              - value: !cel "row.outcome"
              - value: !cel "row.detail"
      - { type: text, text: "History", style: heading }
      - type: composite
        ref:
          kind: Ui.Action
          inputModel: *nothing
          outputModel: !ref RunHistory
          source: { path: /api/runs/recent }
          label: Show history
          result:
            type: list
            rows: !cel "result.runs"
            columns: *runColumns
---
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
openapi:
  info:
    title: Scheduled job
    version: 1.0.0
mounts:
  - path: /api
    mount: !ref jobRoutes
  - path: /
    mount: !ref ui
