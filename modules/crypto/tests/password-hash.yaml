kind: Telo.Application
metadata:
  name: CryptoPasswordHashTest
  version: 1.0.0
  description: |
    Crypto.PasswordHash hashes and verifies with each algorithm, rejects a wrong
    password, verifies an imported bcrypt hash and reports it for re-hashing under
    the argon2id default, refuses a bcrypt password over 72 bytes, and a peppered
    hash does not verify without its pepper.
imports: { Crypto: ../, Assert: ../../assert }
targets:
  - !ref test
---
kind: Crypto.PasswordHash
metadata: { name: argon }
parameters: { argon2id: { memoryKiB: 64, iterations: 1 } }
---
kind: Crypto.PasswordHash
metadata: { name: bcryptLow }
algorithm: bcrypt
parameters: { bcrypt: { cost: 4 } }
---
kind: Crypto.PasswordHash
metadata: { name: scryptLow }
algorithm: scrypt
parameters: { scrypt: { cost: 1024 } }
---
kind: Crypto.PasswordHash
metadata: { name: pbkdf2Low }
algorithm: pbkdf2
parameters: { pbkdf2: { iterations: 1000 } }
---
# The configured defaults: argon2id at the OWASP parameters.
kind: Crypto.PasswordHash
metadata: { name: defaults }
---
kind: Crypto.PasswordHash
metadata: { name: peppered }
parameters: { argon2id: { memoryKiB: 64, iterations: 1 } }
pepper: pepper-one
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: argonHash
    invoke: !ref argon
    inputs: { op: hash, password: correct horse }
  - name: argonRight
    invoke: !ref argon
    inputs: { op: verify, password: correct horse, hash: !cel "steps.argonHash.result.hash" }
  - name: argonWrong
    invoke: !ref argon
    inputs: { op: verify, password: wrong horse, hash: !cel "steps.argonHash.result.hash" }
  - name: bcryptHash
    invoke: !ref bcryptLow
    inputs: { op: hash, password: correct horse }
  - name: bcryptRight
    invoke: !ref bcryptLow
    inputs: { op: verify, password: correct horse, hash: !cel "steps.bcryptHash.result.hash" }
  - name: bcryptWrong
    invoke: !ref bcryptLow
    inputs: { op: verify, password: wrong horse, hash: !cel "steps.bcryptHash.result.hash" }
  - name: scryptHash
    invoke: !ref scryptLow
    inputs: { op: hash, password: correct horse }
  - name: scryptRight
    invoke: !ref scryptLow
    inputs: { op: verify, password: correct horse, hash: !cel "steps.scryptHash.result.hash" }
  - name: scryptWrong
    invoke: !ref scryptLow
    inputs: { op: verify, password: wrong horse, hash: !cel "steps.scryptHash.result.hash" }
  - name: pbkdf2Hash
    invoke: !ref pbkdf2Low
    inputs: { op: hash, password: correct horse }
  - name: pbkdf2Right
    invoke: !ref pbkdf2Low
    inputs: { op: verify, password: correct horse, hash: !cel "steps.pbkdf2Hash.result.hash" }
  - name: pbkdf2Wrong
    invoke: !ref pbkdf2Low
    inputs: { op: verify, password: wrong horse, hash: !cel "steps.pbkdf2Hash.result.hash" }
  # A bcrypt hash from the crypt_blowfish test vectors (password `U*U`).
  - name: imported
    invoke: !ref defaults
    inputs:
      op: verify
      password: U*U
      hash: $2a$05$CCCCCCCCCCCCCCCCCCCCC.E5YPO9kmyuRGyh0XouQYb4YMJKvyOeW
  - name: sameConfigured
    invoke: !ref argon
    inputs: { op: verify, password: correct horse, hash: !cel "steps.argonHash.result.hash" }
  - name: weakerThanDefault
    invoke: !ref defaults
    inputs: { op: verify, password: correct horse, hash: !cel "steps.argonHash.result.hash" }
  - name: pepperedHash
    invoke: !ref peppered
    inputs: { op: hash, password: correct horse }
  - name: pepperedRight
    invoke: !ref peppered
    inputs: { op: verify, password: correct horse, hash: !cel "steps.pepperedHash.result.hash" }
  - name: withoutPepper
    invoke: !ref argon
    inputs: { op: verify, password: correct horse, hash: !cel "steps.pepperedHash.result.hash" }
  - name: tooLong
    try:
      - name: hash73
        invoke: !ref bcryptLow
        inputs: { op: hash, password: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa }
    catch:
      - name: refused
        invoke: !ref Assert.equals
        inputs: { actual: !cel "error.code", expected: ERR_PASSWORD_TOO_LONG }
  - name: unknownFormat
    try:
      - name: verifyUnknown
        invoke: !ref argon
        inputs: { op: verify, password: x, hash: "{SSHA}abcdef" }
    catch:
      - name: refusedFormat
        invoke: !ref Assert.equals
        inputs: { actual: !cel "error.code", expected: ERR_CRYPTO_UNSUPPORTED_HASH }
  # Known prefixes with broken bodies are a wrong hash, not an error.
  - name: malformedArgon
    invoke: !ref argon
    inputs: { op: verify, password: x, hash: "$argon2id$garbage" }
  - name: malformedArgonI
    invoke: !ref argon
    inputs: { op: verify, password: x, hash: "$argon2i$garbage" }
  - name: malformedScrypt
    invoke: !ref scryptLow
    inputs: { op: verify, password: x, hash: "$scrypt$ln=10,p=1$BwcHBwcHBwcHBwcHBwcHBw$CvFuPdY8kHQ0rlIyOIoe2hNua3u+Qdw0KUpa0400/y9e0k1l9e2rmMcyncidTI9VosxTnJaLNu9QzIKltwUqvQ" }
  - name: malformedPbkdf2Count
    invoke: !ref pbkdf2Low
    inputs: { op: verify, password: x, hash: "$pbkdf2-sha256$i=abc$BwcHBwcHBwcHBwcHBwcHBw$CvFuPdY8kHQ0rlIyOIoe2hNua3u" }
  - name: malformedPbkdf2Key
    invoke: !ref pbkdf2Low
    inputs: { op: verify, password: x, hash: "$pbkdf2-sha256$i=1000$BwcHBwcHBwcHBwcHBwcHBw$" }
  # An imported scrypt hash with a 64-byte key (password `pw`).
  - name: longScryptKey
    invoke: !ref scryptLow
    inputs:
      op: verify
      password: pw
      hash: "$scrypt$ln=10,r=8,p=1$BwcHBwcHBwcHBwcHBwcHBw$CvFuPdY8kHQ0rlIyOIoe2hNua3u+Qdw0KUpa0400/y9e0k1l9e2rmMcyncidTI9VosxTnJaLNu9QzIKltwUqvQ"
  - name: verdicts
    invoke: !ref Assert.equals
    inputs:
      actual:
        argon: [!cel "steps.argonRight.result.valid", !cel "steps.argonWrong.result.valid"]
        bcrypt: [!cel "steps.bcryptRight.result.valid", !cel "steps.bcryptWrong.result.valid"]
        scrypt: [!cel "steps.scryptRight.result.valid", !cel "steps.scryptWrong.result.valid"]
        pbkdf2: [!cel "steps.pbkdf2Right.result.valid", !cel "steps.pbkdf2Wrong.result.valid"]
        prefixes:
          - !cel "steps.argonHash.result.hash.startsWith('$argon2id$')"
          - !cel "steps.bcryptHash.result.hash.startsWith('$2a$04$')"
          - !cel "steps.scryptHash.result.hash.startsWith('$scrypt$ln=10,r=8,p=1$')"
          - !cel "steps.pbkdf2Hash.result.hash.startsWith('$pbkdf2-sha256$i=1000$')"
        imported: !cel "steps.imported.result"
        sameConfigured: !cel "steps.sameConfigured.result"
        weakerThanDefault: !cel "steps.weakerThanDefault.result"
        pepper:
          - !cel "steps.pepperedRight.result"
          - !cel "steps.withoutPepper.result.valid"
        malformed:
          - !cel "steps.malformedArgon.result"
          - !cel "steps.malformedArgonI.result"
          - !cel "steps.malformedScrypt.result"
          - !cel "steps.malformedPbkdf2Count.result"
          - !cel "steps.malformedPbkdf2Key.result"
        longScryptKey: !cel "steps.longScryptKey.result"
      expected:
        argon: [true, false]
        bcrypt: [true, false]
        scrypt: [true, false]
        pbkdf2: [true, false]
        prefixes: [true, true, true, true]
        imported: { valid: true, rehash: true }
        sameConfigured: { valid: true, rehash: false }
        weakerThanDefault: { valid: true, rehash: true }
        pepper: [{ valid: true, rehash: false }, false]
        malformed:
          - { valid: false, rehash: false }
          - { valid: false, rehash: false }
          - { valid: false, rehash: false }
          - { valid: false, rehash: false }
          - { valid: false, rehash: false }
        longScryptKey: { valid: true, rehash: false }
