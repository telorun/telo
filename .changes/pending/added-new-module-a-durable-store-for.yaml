modules:
  modules/record-stream-sql: Added
body: "New module: a durable store for RecordStream.Journal.
  RecordStreamSql.JournalStore keeps a replay journal in two tables on any
  Sql.Connection whose backend renders the database clock (the SQL dialect's
  renderCurrentTimeMillis) and accepts INSERT … ON CONFLICT … DO NOTHING — connection,
  table (default record_stream_journal, plus <table>_keys and an age index),
  createTable, and pollInterval (250ms when omitted) — so a reader resumes a detached
  stream after a restart or from another process. Conditional writes are version-guarded
  statements and transactions, ages use the database clock, names are quoted through the
  dialect, a connection whose backend predates the clock member is refused at start-up
  with ERR_INVALID_VALUE, and readers in other processes are woken by polling."
