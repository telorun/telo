# `conclusionPrompt` without `onMaxSteps: conclude` is refused twice, on each
# agent kind: by `telo check` at the library declaring it (the kind's resource
# rule), and by the controller at creation from a consumer whose entry-scoped
# check is silent (`runFails:`).
kind: Telo.Application
metadata:
  name: AgentConclusionPromptTest
  version: 1.0.0
  description: The conclusion-prompt resource rule and its controller twin refuse the same agent.
imports:
  Assert: ../../assert
targets:
  - !ref conclusionPromptUnused
  - !ref conclusionPromptUnusedAtRuntime
  - !ref streamConclusionPromptUnused
  - !ref streamConclusionPromptUnusedAtRuntime
---
kind: Assert.Manifest
metadata: { name: conclusionPromptUnused }
source: ./__fixtures__/conclusion-prompt-unused/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "sets `conclusionPrompt` without `onMaxSteps: conclude`"
---
kind: Assert.Manifest
metadata: { name: conclusionPromptUnusedAtRuntime }
source: ./__fixtures__/conclusion-prompt-unused-app.yaml
expect:
  errors: []
  runFails: "AI_CONCLUSION_PROMPT_UNUSED: Ai.Agent \"agent\" sets 'conclusionPrompt' without 'onMaxSteps: conclude'"
---
kind: Assert.Manifest
metadata: { name: streamConclusionPromptUnused }
source: ./__fixtures__/conclusion-prompt-unused-stream/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "sets `conclusionPrompt` without `onMaxSteps: conclude`"
---
kind: Assert.Manifest
metadata: { name: streamConclusionPromptUnusedAtRuntime }
source: ./__fixtures__/conclusion-prompt-unused-stream-app.yaml
expect:
  errors: []
  runFails: "AI_CONCLUSION_PROMPT_UNUSED: Ai.AgentStream \"agent\" sets 'conclusionPrompt' without 'onMaxSteps: conclude'"
