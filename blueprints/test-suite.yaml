kind: Telo.Application
metadata:
  name: BlueprintsTestSuite
  version: 1.0.0
  description: |
    Runs every blueprint's own tests, each in its own kernel. A blueprint imports
    the modules it builds on as published versions, so it runs apart from the
    module suite.

        telo ./blueprints/test-suite.yaml
variables:
  include:
    type: array
    items: { type: string }
    arg: include
    description: Glob pattern selecting the test manifests to run, relative to this file.
    default:
    - "*/tests/*.yaml"
  exclude:
    type: array
    items: { type: string }
    arg: exclude
    description: Glob pattern excluding test manifests, relative to this file.
    default:
    - "**/__fixtures__/**"
  filter:
    type: string
    arg: { position: 0 }
    description: Run only the tests whose path contains this text.
    default: ""
  concurrency:
    type: integer
    minimum: 1
    arg: concurrency
    description: How many tests run at once.
    default: 3
imports:
  Test: ../modules/test
targets:
  - !ref runAll
---
kind: Test.Suite
metadata: { name: runAll }
include: !cel "variables.include"
exclude: !cel "variables.exclude"
filter: !cel "variables.filter"
concurrency: !cel "variables.concurrency"
