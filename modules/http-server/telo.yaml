kind: Telo.Library
metadata:
  name: HttpServer
  version: "0.45.0"
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Transport]
  description: >-
    Serve HTTP on a port with CORS, per-mount authentication (bearer tokens, API
    keys, cookies, client certificates, webhook and HTTP message signatures),
    authorization, request guards and a generated OpenAPI document. Routes
    validate requests against a schema, map them into handlers with CEL and render
    typed responses, buffered or streamed. Also serves a browsable API reference
    and static files with SPA fallback.
requires:
  # Measured floor; what raised it is in docs/design-notes.md.
  telo: ">=0.133.0"
restrictions:
  - requires: { telo: ">=0.133.0" }
    reason: "The server reports `status.localUrl` from `run()`, which an older kernel refuses when a templated kind's `run:` starts the server, so that start fails."
  - requires: { telo: ">=0.133.0" }
    reason: Http.Server serves a socket the host process supplies through ctx.claimListener, which kernels before this release lack.
lang: en
imports:
  # Every returns:/catches: slot anchors at HttpDispatch.Outcomes/$defs/{Returns,Catches}.
  HttpDispatch: ../http-dispatch
  # The response-encoder contract this module's own encoder slots pin.
  Codec: ../codec
  # The caller, credential and verifier contracts mount authentication speaks.
  Auth: ../auth
  # The signature grammar the two signature sources read requests with.
  HttpSignature: ../http-signature
  # The budget `authentication.throttle` counts refused credentials on.
  RateLimit: ../rate-limit
exports:
  kinds: [Server, Api, Reference, Static, CredentialSource, FromAuthorization, FromBasic, FromHeader, FromQuery, FromCookie, FromClientCertificate, FromForwardedIdentity, FromMessageSignature, FromBodySignature]
  resources: [Authentication, Authorization, AuthScheme, CredentialRequest]
# Scalar's browser bundle, fetched lazily; its version is tied to the pins in
# nodejs/package.json (docs/design-notes.md).
assets: [./assets/]
sources:
  scalar:
    version: 1.80.0
    purl: pkg:npm/%40scalar/fastify-api-reference
    contains:
      - { purl: pkg:npm/%40scalar/api-reference, version: 1.80.0 }
    url: https://registry.npmjs.org/@scalar/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/scalar.LICENSE]
    entries:
      ./assets/scalar/standalone.js:
        { upstream: api-reference, member: package/dist/browser/standalone.js, sha256: 9ddcc35592b1943605a8a8bd0a637d5173cdb31311d61c0c96b75212a6841acf, executable: false }
      ./notices/scalar.LICENSE:
        { upstream: fastify-api-reference, member: package/LICENSE, sha256: 380cd0a6ad700e1f821f2a509f0dd9ff835041cee2d43daf5dedc1adb2bcc620, executable: false }
---
kind: "Telo.Definition"
metadata:
  name: "Server"
  description: >-
    Listens on a TCP port and serves HTTP through the routers mounted on it, with
    CORS, per-mount authentication and authorization, request guards, a generated
    OpenAPI document and custom content-type parsers. Request bodies are bounded in
    bytes: a larger one is answered 413.
capability: Telo.Service
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#HttpServerController]
# Refusals the server answers itself, which no `catches:` list sees; each is a
# problem whose `detail` is the code's display message.
throws:
  codes:
    ERR_REQUEST_BODY_TOO_LARGE:
      description: >-
        The request body is larger than `maxBodyBytes` (the route's, else the
        server's). Answered 413 with `Connection: close`.
      displayMessage: "The request body is larger than the {$maxBodyBytes} bytes this server accepts."
      data:
        type: object
        additionalProperties: false
        required: [maxBodyBytes]
        properties:
          maxBodyBytes: { type: integer, description: The limit the body exceeded, in bytes. }
          contentLength: { type: integer, description: The length the request declared, when it declared one. }
    ERR_HOST_NOT_SERVED:
      description: >-
        Under `unknownHosts: reject`, the request's host is one no mount's
        `hostnames` names. Answered 421 Misdirected Request.
      displayMessage: "This server does not serve the host {$host}."
      data:
        type: object
        additionalProperties: false
        required: [host]
        properties: { host: { type: string, description: The host the request was sent to. } }
    ERR_HTTP_UNAUTHENTICATED:
      description: >-
        A mount's authentication refused the request: no credential where anonymous
        callers are denied, or a credential that is malformed or refused. Answered
        401 with every challenge in one `WWW-Authenticate`.
      displayMessage: "Authentication is required to access this resource."
      data:
        type: object
        additionalProperties: false
        required: [reason]
        properties:
          reason: { type: string, enum: [absent, malformed, refused], description: Why the request is not authenticated. }
    ERR_HTTP_AUTHENTICATION_THROTTLED:
      description: >-
        The client's `authentication.throttle` budget is spent, so no body was read
        and no verifier ran. Answered 429 with `Retry-After`.
      displayMessage: "Too many sign-in attempts. Try again in {$retryAfter} seconds."
      data:
        type: object
        additionalProperties: false
        required: [retryAfter]
        properties:
          retryAfter: { type: integer, description: Seconds until the budget's window frees. }
    ERR_HTTP_FORBIDDEN:
      description: >-
        The authorization policy denied the action. Answered 403, with
        `WWW-Authenticate: <scheme> error="insufficient_scope"` when the policy
        names the scopes the caller lacks.
      displayMessage: "You are not allowed to perform this action."
      data:
        type: object
        additionalProperties: false
        properties:
          requiredScopes: { type: array, items: { type: string }, description: The scopes that would allow the action. }
    ERR_HTTP_CROSS_ORIGIN_REFUSED:
      description: >-
        A request that changes state, authenticated by a credential the browser
        sends on its own (a cookie), came from another site. Answered 403.
      displayMessage: "This request came from another site and was refused."
    ERR_HTTP_ACCESS_CHECK_UNAVAILABLE:
      description: >-
        A credential source, verifier, policy or authentication throttle could not
        decide — its keys, endpoint or budget store unreachable. Answered 503; the failure is the cause in the trace
        and the log, never in the response.
      displayMessage: "The access check could not be completed. Try again later."
      data:
        type: object
        additionalProperties: false
        required: [stage]
        properties:
          stage: { type: string, enum: [source, verifier, policy, throttle], description: The step that failed. }
schema:
  type: "object"
  properties:
    listen:
      title: Listen
      description: >-
        The interface and TCP port this server binds; when the host supplies the
        port's socket, the server serves that one and binds nothing. The address it
        is reached at is a public address need a mount names in `hostnames`.
      type: "object"
      additionalProperties: false
      required: [ "port" ]
      properties:
        address:
          title: Address
          description: >-
            Network interface to listen on. The default `0.0.0.0` accepts other
            machines, as a container or proxy requires; `127.0.0.1` accepts the same
            machine only, for a mock server in a test.
          type: "string"
          x-telo-eval: compile
          default: "0.0.0.0"
        port:
          title: Port
          description: TCP port the server listens on — `!cel "ports.http"` in an application.
          type: "integer"
          x-telo-eval: compile
          x-telo-type: Telo.TcpPort
          minimum: 1
          maximum: 65535
    # Kept only so a manifest still writing the old spelling is told where it
    # moved (HTTP_SERVER_LISTEN_MOVED) rather than that the key is unknown.
    host:
      title: Host (moved)
      description: Moved to `listen.address`.
      deprecated: true
      x-telo-eval: compile
    port:
      title: Port (moved)
      description: Moved to `listen.port`.
      deprecated: true
      x-telo-eval: compile
    unknownHosts:
      title: Unknown Hosts
      description: >-
        `serve` (the default) hands a request whose host no mount's `hostnames` names to the mounts
        without `hostnames`; `reject` answers it 421 with the problem `ERR_HOST_NOT_SERVED`, except
        an IP-literal host. See docs/host-routing.md.
      type: "string"
      enum: [ "serve", "reject" ]
      default: "serve"
      x-telo-eval: compile
    tls:
      title: TLS
      description: >-
        Serve HTTPS with the certificate and private key, and optionally client
        certificates for mutual TLS. Unreadable or mismatched material fails creation;
        omitted, the server speaks plain HTTP, as behind a TLS-terminating proxy.
      type: object
      additionalProperties: false
      required: [cert, key]
      x-telo-eval: compile
      if:
        required: [clientCertificate]
        properties: { clientCertificate: { enum: [optional, required] } }
      then: { required: [clientCa], properties: { clientCa: { minItems: 1 } } }
      else: { not: { required: [clientCa] } }
      properties:
        cert:
          title: Certificate
          $ref: "#/$defs/PemSource"
          description: Server certificate chain, PEM.
        key:
          title: Private key
          $ref: "#/$defs/PemSource"
          description: >-
            Private key of `cert`. The TLS checks never log or echo it; use a
            secret or a file.
        passphrase:
          title: Key passphrase
          type: string
          description: Passphrase of an encrypted `key`.
        clientCa:
          title: Client CA certificates
          type: array
          items: { $ref: "#/$defs/PemSource" }
          description: >-
            Authorities that sign accepted client certificates. Required with
            `clientCertificate` `optional` or `required`, refused with `none`.
        clientCertificate:
          title: Client certificate
          type: string
          enum: [none, optional, required]
          default: none
          description: >-
            Mutual TLS. `required` rejects a connection that presents no
            certificate signed by `clientCa`; `optional` asks, completes the
            handshake whatever is presented and records it in
            `request.clientCertificate`; `none` does not ask.
        minVersion:
          title: Minimum TLS version
          type: string
          enum: [TLSv1.2, TLSv1.3]
          default: TLSv1.2
          description: The oldest protocol version the server negotiates.
    trustForwardedHeaders:
      title: Trust Forwarded Headers
      description: >-
        Trust the X-Forwarded-Proto / X-Forwarded-Host headers of a fronting proxy, so
        the request protocol, host and OpenAPI `servers` URL reflect the URL the client
        used; otherwise `servers` is relative. Enable only behind a trusted proxy.
      type: "boolean"
      x-telo-eval: compile
      default: false
    trustProxy:
      title: Trust Proxy
      description: >-
        Trust a fronting proxy for the client address (`request.ip`) and forwarded
        protocol and host: `true` trusts any hop, an integer that many hops from the
        right of X-Forwarded-For. Supersedes `trustForwardedHeaders`; enable only
        behind a trusted proxy, or clients can spoof their IP.
      type: ["boolean", "integer"]
      x-telo-eval: compile
    forwardedClientCertificate:
      title: Forwarded Client Certificate
      description: >-
        Reads the client certificate a TLS-terminating proxy forwards in a header into
        `request.clientCertificate` (`verified: false, via: proxy`). Needs
        `trustProxy`; an unreadable header yields null and a certificate this listener
        verified itself wins.
      type: object
      additionalProperties: false
      required: [header, format]
      x-telo-eval: compile
      properties:
        header:
          title: Header
          type: string
          minLength: 1
          description: The request header holding the certificate, e.g. `x-forwarded-client-cert`.
        format:
          title: Format
          type: string
          enum: [xfcc, pem, base64-der]
          description: >-
            `xfcc` — Envoy's `x-forwarded-client-cert`, its last element's `Cert`;
            `pem` — URL-escaped PEM (nginx); `base64-der` — base64 DER, optionally
            URL-escaped, the first of a comma-separated chain (Traefik).
    preferredLanguages:
      title: Preferred Languages
      description: >-
        CEL over the request (`headers`, `cookies`, `query`, `path`, `host`, `method`,
        `ip`, `tls`, `clientCertificate`) returning language tags in preference order,
        tried before `Accept-Language`; a malformed or unserved tag is skipped. The
        headers it reads are added to the response's `Vary`.
      type: array
      items: { type: string }
      x-telo-context:
        type: object
        additionalProperties: false
        properties:
          request:
            type: object
            additionalProperties: false
            properties:
              headers: { type: object, additionalProperties: true }
              query: { type: object, additionalProperties: true }
              path: { type: string }
              host: { type: string, description: "The request's host, lowercased and without its port — from X-Forwarded-Host only behind a trusted proxy." }
              cookies: { type: object, additionalProperties: { type: string }, description: "The request's cookies by name, the first of a repeated name, each value as sent." }
              tls:
                description: "The TLS session of the socket the request arrived on: `{ protocol }`, null on a plain socket."
                type: [object, "null"]
                additionalProperties: false
                properties: { protocol: { type: string } }
              clientCertificate:
                description: "The client certificate the listener received or a trusted proxy forwarded; null when there is none."
                type: [object, "null"]
                additionalProperties: false
                properties:
                  subject: { type: object, additionalProperties: { type: string } }
                  issuer: { type: object, additionalProperties: { type: string } }
                  serialNumber: { type: string }
                  fingerprint256: { type: string }
                  validFrom: { x-telo-type: Telo.Timestamp }
                  validTo: { x-telo-type: Telo.Timestamp }
                  subjectAltNames: { type: array, items: { type: string } }
                  pem: { type: string }
                  verified: { type: boolean }
                  via: { type: string, enum: [listener, proxy] }
              method: { type: string }
              ip: { type: string }
    maxBodyBytes:
      title: Max Body Bytes
      description: >-
        Most of a request body buffered or handed to a handler, in bytes, for every mount; a larger
        one is answered 413 (`ERR_REQUEST_BODY_TOO_LARGE`), which no `catches:` list sees. A
        route's `maxBodyBytes` replaces it.
      type: "integer"
      x-telo-eval: compile
      minimum: 1
      default: 1048576
    # No `logger:` field: request logging follows the logging pipeline (docs/log-events.md).
    openapi:
      title: OpenAPI
      description: >-
        OpenAPI document metadata. Declaring it collects an OpenAPI document from
        every mounted route's schema; mount an `Http.Reference` to serve that
        document and its browsable reference page at a path you choose.
      type: "object"
      x-telo-eval: compile
      properties:
        info:
          title: Info
          description: OpenAPI info block.
          type: "object"
          properties:
            title:
              title: Title
              description: API title shown in OpenAPI documentation.
              type: "string"
            version:
              title: Version
              description: API version shown in OpenAPI documentation.
              type: "string"
          required: [ "title", "version" ]
      required: [ "info" ]
    mounts:
      title: Mounts
      description: Mount points attached to the HTTP server.
      # Dispatch entries, so the editor renders mounts as an ordered list: mount
      # order is match order.
      x-telo-topology-role: entries
      type: "array"
      # Evaluated per field rather than on the whole list: `guard` holds CEL
      # evaluated per request, which a compile mark on an ancestor would expand
      # at startup.
      items:
        title: Mount
        description: Single mount configuration.
        type: "object"
        additionalProperties: false
        required: [ "mount" ]
        # What a request on this mount reads once it is authenticated: the
        # `authorization` CEL, and — through the `mount` slot — the routes of
        # the router mounted here, which type `request.principal` from it.
        x-telo-context:
          type: object
          properties:
            request:
              type: object
              x-telo-context-eval: runtime
              additionalProperties: false
              properties:
                headers: { type: object, additionalProperties: true }
                query: { type: object, additionalProperties: true }
                path: { type: string }
                host: { type: string, description: "The request's host, lowercased and without its port — from X-Forwarded-Host only behind a trusted proxy." }
                cookies: { type: object, additionalProperties: { type: string }, description: "The request's cookies by name, the first of a repeated name, each value as sent." }
                lang: { type: string, description: "The language negotiated for the request: a served language tag, always present." }
                method: { type: string }
                ip: { type: string }
                principal:
                  $ref: "telo://Auth/Principal"
                  description: The authenticated caller; null where the mount allows anonymous callers or declares no authentication.
                  x-telo-context-nullable-when: { at: "0/authentication/anonymous", equals: [allow], absent: true }
        properties:
          path:
            title: Path
            description: URL prefix where the mount is attached.
            type: "string"
            x-telo-eval: compile
            x-telo-topology-role: matcher
          hostnames:
            title: Hostnames
            description: >-
              The hosts this mount answers: references to the application's public
              address needs, never domain names, each naming the port this server
              listens on. Omitted, the mount answers every host.
            type: "array"
            minItems: 1
            x-telo-topology-role: matcher
            items: { x-telo-schema-from: "HttpDispatch.Request/$defs/Hostname" }
          mount:
            title: Mount
            description: >-
              The mount to attach: a `!ref` to a `Telo.Mount` resource, or
              `!ref <Alias>.<name>` for one an imported library exports.
            x-telo-topology-role: handler
            x-telo-ref:
              kind: Telo.Mount
              use: dependency
              # A `dependency`: control reaches a route through the mount's own
              # trigger.inbound slot, but the server renders its unclaimed throws.
              throwsThrough: true
          authentication:
            title: Authentication
            description: >-
              Who may call this mount's routes: the verifiers tried in order, and whether
              a request presenting no credential is served anonymously. A presented
              credential that fails is a 401, never falling through.
            $ref: "telo://Self/Authentication"
            x-telo-raises: [ERR_HTTP_UNAUTHENTICATED, ERR_HTTP_AUTHENTICATION_THROTTLED, ERR_HTTP_CROSS_ORIGIN_REFUSED, ERR_HTTP_ACCESS_CHECK_UNAVAILABLE]
          authorization:
            title: Authorization
            description: >-
              The policy deciding, after authentication, whether the request may
              perform `action` on `resource`; a denial is a 403. A route's own
              `authorization` replaces this one.
            $ref: "telo://Self/Authorization"
            x-telo-raises: [ERR_HTTP_FORBIDDEN, ERR_HTTP_ACCESS_CHECK_UNAVAILABLE]
          protectedResource:
            title: Protected resource
            description: >-
              Publishes this mount's OAuth 2.0 protected-resource metadata (RFC 9728) at
              `/.well-known/oauth-protected-resource<path>`, unauthenticated, on the mount's
              hostnames, and names it in every 401. The resource, authorization servers and bearer
              methods are derived from the mount's address, verifiers and sources.
            type: object
            additionalProperties: false
            properties:
              scopesSupported:
                title: Scopes supported
                description: The scopes the resource documents as supported.
                type: array
                items: { type: string, minLength: 1 }
              resourceName:
                title: Resource name
                description: A human-readable name for the resource.
                type: string
              resourceDocumentation:
                title: Resource documentation
                description: URL of documentation for developers using the resource.
                type: string
                format: uri
              resourcePolicyUri:
                title: Resource policy URI
                description: URL of the resource's data-use policy.
                type: string
                format: uri
              resourceTosUri:
                title: Resource terms of service URI
                description: URL of the resource's terms of service.
                type: string
                format: uri
          when:
            title: When
            description: >-
              Attach this mount only when the condition holds, resolved once at startup. An
              excluded mount registers no routes; the mounted resource is still created.
            type: "boolean"
            x-telo-eval: compile
            default: true
          guard:
            title: Guard
            description: >-
              An invocable run for every request matching a route of this mount, after
              authentication and authorization and before the body is parsed; a throw refuses the
              request through `guard.catches`, then the server's. See docs/mount-guard.md.
            type: object
            additionalProperties: false
            required: [ "invoke" ]
            properties:
              invoke:
                title: Invoke
                description: Resource invoked (or run) for each request; a throw refuses the request.
                x-telo-ref: { kind: Telo.Executable, use: trigger.inbound, inputs: /inputs }
              inputs:
                title: Inputs
                type: object
                additionalProperties: true
                default: {}
                description: >-
                  CEL expressions evaluated against the request, before its body
                  is read; the result is the guard's input. Without `inputs:`
                  the guard is called with an empty object.
                x-telo-context:
                  type: object
                  additionalProperties: false
                  properties:
                    request:
                      type: object
                      additionalProperties: false
                      properties:
                        headers: { type: object, additionalProperties: true }
                        query: { type: object, additionalProperties: true }
                        path: { type: string }
                        host: { type: string, description: "The request's host, lowercased and without its port — from X-Forwarded-Host only behind a trusted proxy." }
                        cookies: { type: object, additionalProperties: { type: string }, description: "The request's cookies by name, the first of a repeated name, each value as sent." }
                        tls:
                          description: "The TLS session of the socket the request arrived on: `{ protocol }`, null on a plain socket."
                          type: [object, "null"]
                          additionalProperties: false
                          properties: { protocol: { type: string } }
                        clientCertificate:
                          description: "The client certificate the listener received or a trusted proxy forwarded; null when there is none."
                          type: [object, "null"]
                          additionalProperties: false
                          properties:
                            subject: { type: object, additionalProperties: { type: string } }
                            issuer: { type: object, additionalProperties: { type: string } }
                            serialNumber: { type: string }
                            fingerprint256: { type: string }
                            validFrom: { x-telo-type: Telo.Timestamp }
                            validTo: { x-telo-type: Telo.Timestamp }
                            subjectAltNames: { type: array, items: { type: string } }
                            pem: { type: string }
                            verified: { type: boolean }
                            via: { type: string, enum: [listener, proxy] }
                        lang: { type: string, description: "The language negotiated for the request: a served language tag, always present." }
                        method: { type: string }
                        ip: { type: string }
                        principal: { $ref: "telo://Auth/Principal", description: "The authenticated caller; null where the mount allows anonymous callers.", x-telo-context-nullable-when: { at: "1/authentication/anonymous", equals: [allow], absent: true } }
              catches:
                title: Catches
                description: >-
                  Rendering rules for the guard's structured throws (a 401 or 403), tried
                  before the server's `catches:`. Entries see `error`, `problem` and
                  the request's `headers`, `cookies`, `query`, `path`, `method`, `ip`.
                x-telo-outcome-list: catches
                x-telo-catches-for: invoke
                x-telo-schema-from: "HttpDispatch.Outcomes/$defs/Catches"
                x-telo-context:
                  type: object
                  additionalProperties: false
                  properties:
                    request:
                      type: object
                      additionalProperties: false
                      properties:
                        headers: { type: object, additionalProperties: true }
                        query: { type: object, additionalProperties: true }
                        path: { type: string }
                        host: { type: string, description: "The request's host, lowercased and without its port — from X-Forwarded-Host only behind a trusted proxy." }
                        cookies: { type: object, additionalProperties: { type: string }, description: "The request's cookies by name, the first of a repeated name, each value as sent." }
                        tls:
                          description: "The TLS session of the socket the request arrived on: `{ protocol }`, null on a plain socket."
                          type: [object, "null"]
                          additionalProperties: false
                          properties: { protocol: { type: string } }
                        clientCertificate:
                          description: "The client certificate the listener received or a trusted proxy forwarded; null when there is none."
                          type: [object, "null"]
                          additionalProperties: false
                          properties:
                            subject: { type: object, additionalProperties: { type: string } }
                            issuer: { type: object, additionalProperties: { type: string } }
                            serialNumber: { type: string }
                            fingerprint256: { type: string }
                            validFrom: { x-telo-type: Telo.Timestamp }
                            validTo: { x-telo-type: Telo.Timestamp }
                            subjectAltNames: { type: array, items: { type: string } }
                            pem: { type: string }
                            verified: { type: boolean }
                            via: { type: string, enum: [listener, proxy] }
                        lang: { type: string, description: "The language negotiated for the request: a served language tag, always present." }
                        method: { type: string }
                        ip: { type: string }
                        principal: { $ref: "telo://Auth/Principal", description: "The authenticated caller; null where the mount allows anonymous callers.", x-telo-context-nullable-when: { at: "1/authentication/anonymous", equals: [allow], absent: true } }
                    error:
                      type: object
                      additionalProperties: false
                      properties:
                        code: { type: string, x-telo-caught-member: code }
                        message: { type: string }
                        displayMessage:
                          description: The text a person is shown for the failure, as its record; null when it carries none.
                          anyOf: [{ $ref: "telo://manifest#/$defs/TextRecord" }, { type: "null" }]
                        data: { type: object, additionalProperties: true, x-telo-caught-member: data }
                    problem:
                      type: object
                      additionalProperties: false
                      description: The default problem (RFC 9457) this entry would render.
                      properties:
                        type: { type: string }
                        title: { type: [string, "null"] }
                        status: { type: integer }
                        detail: { type: [string, "null"] }
                        code: { type: string, x-telo-caught-member: code }
                        data: { type: [object, "null"], additionalProperties: true, x-telo-caught-member: data }
          logging:
            title: Logging
            description: >-
              Access-log threshold for requests this mount serves, overriding the server's level; a
