# A re-attempt over a value that is NOT live. Replaying it is exactly what retry
# is for, so nothing is reported.
kind: Telo.Application
metadata:
  name: RetriedValueOk
  version: 1.0.0
imports:
  Run: ../../
  Stream: ../../../stream
targets:
  - !ref seq
---
kind: Run.Sequence
metadata: { name: seq }
steps:
  - name: source
    inputs:
      items: [a, b]
    invoke:
      kind: Stream.Of
  - name: collect
    inputs:
      input: !cel "steps.source.result.output"
    invoke:
      kind: Stream.Collect
  - name: replay
    inputs:
      items: !cel "steps.collect.result.items"
    retry:
      attempts: 3
    invoke:
      kind: Stream.Of
