kind: Telo.Application
metadata:
  name: FeedbackApiRepo
  version: 1.0.0
  categories: [ Transport, Storage ]
  description: |
    Feedback REST API with no hand-written SQL past the schema migration:
    `SqlRepository.Create` / `SqlRepository.Read` are the route handlers, and CEL
    maps `request.*` into them and `result.rows` back out.

    Reach for this shape when the routes are yours to design but the queries are
    plain table access; reach for `Crud.Resource` (see `todo-app`) when you want
    the whole REST surface generated, and for `Sql.Query` when you need a join.

    Run, then:
        curl -X POST localhost:8844/v1/feedback \
          -H 'content-type: application/json' \
          -d '{"text":"the docs are great","source":"web","rating":5}'
        curl localhost:8844/v1/feedback
imports:
  Http: oci://ghcr.io/telorun/http-server@0.29.0#sha256-6OIi1b-_cF4uMZ3O20EWRWAJn6JbgomkE4amBBMofqM
  Sql: oci://ghcr.io/telorun/sql@0.24.0#sha256-g0Bw5AjrBOGmgGbmsKFb7q833AYlutxV1fDWka47t2I
  SQLite: oci://ghcr.io/telorun/sqlite@0.4.0#sha256-G8qidbhcpiVLiCbrI8TSZZWDO95R4JM9kNX_oVenLmY
  SqlRepository: oci://ghcr.io/telorun/sql-repository@0.13.0#sha256-P4DK2k7DQoJtJOOiags02cjA4N36WCOuDe20o0TV4ek
targets:
  - !ref migrate
  - !ref server
ports:
  http:
    env: PORT
    default: 8844
---
kind: SQLite.Connection
metadata:
  name: db
file: ./feedback.db
---
kind: SQLite.Table
metadata:
  name: feedback
table: feedback
columns:
  id: { type: integer, primaryKey: true, identity: always }
  text: { type: text, nullable: false }
  source: { type: text }
  rating: { type: integer, nullable: false }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
tables:
  - !ref feedback
---
# One repository resource per operation, not per route: `readFeedback` serves
# both the list and the by-id route — the `filters:` differ at the call site.
kind: SqlRepository.Create
metadata:
  name: insertFeedback
connection: !ref db
table: !ref feedback
---
kind: SqlRepository.Read
metadata:
  name: readFeedback
connection: !ref db
table: !ref feedback
---
kind: Http.Server
metadata:
  name: server
port: !cel "ports.http"
openapi:
  info:
    title: Feedback API (Repository)
    version: 1.0.0
mounts:
  - path: /v1
    mount: !ref feedbackRoutes
---
kind: Http.Api
metadata:
  name: feedbackRoutes
routes:
  # POST /v1/feedback — insert a new entry. The request schema is the validation:
  # a rating outside 1–5 never reaches the database.
  - request:
      path: /feedback
      method: POST
      schema:
        body:
          type: object
          additionalProperties: false
          required: [ text, rating ]
          properties:
            text:
              type: string
              minLength: 1
            source:
              type: string
            rating:
              type: integer
              minimum: 1
              maximum: 5
    handler: !ref insertFeedback
    inputs:
      data:
        text: !cel "request.body.text"
        source: !cel "has(request.body.source) ? request.body.source : 'unknown'"
        rating: !cel "request.body.rating"
    returns:
      - status: 201
        content:
          application/json:
            body:
              ok: true
              message: Feedback received

  # GET /v1/feedback — list all entries
  - request:
      path: /feedback
      method: GET
    handler: !ref readFeedback
    inputs:
      filters: {}
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result.rows"

  # GET /v1/feedback/{id} — fetch a single entry by id
  - request:
      path: /feedback/{id}
      method: GET
      schema:
        params:
          type: object
          properties:
            id:
              type: integer
          required: [ id ]
    handler: !ref readFeedback
    inputs:
      filters:
        id: !cel "request.params.id"
    returns:
      - status: 200
        when: !cel "size(result.rows) > 0"
        content:
          application/json:
            body: !cel "result.rows[0]"
      - status: 404
        content:
          application/json:
            body:
              ok: false
              message: Not found
