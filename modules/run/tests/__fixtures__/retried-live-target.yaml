# The re-attempt is declared on the TARGET rather than on the step. A live value
# is equally doomed by either, so the check consults both sites.
kind: Telo.Application
metadata:
  name: RetriedLiveTarget
  version: 1.0.0
imports:
  Run: ../../
  Stream: ../../../stream
  Http: ../../../http-client
targets:
  - !ref seq
---
kind: Http.Request
metadata: { name: upload }
retry:
  attempts: 2
---
kind: Run.Sequence
metadata: { name: seq }
steps:
  - name: source
    inputs:
      items: [a, b]
    invoke:
      kind: Stream.Of
  - name: post
    inputs:
      url: http://example.test/upload
      method: POST
      body: !cel "steps.source.result.output"
    invoke: !ref upload
