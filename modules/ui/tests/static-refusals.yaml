kind: Telo.Application
metadata:
  name: UiStaticRefusalsTest
  version: 1.0.0
  description: |
    What the vocabulary refuses before anything runs, and what each composite
    refuses itself when a manifest reaches it without that check: a source
    filter, a form field or a filter naming a property the model does not
    declare, a filter operator the property's type cannot carry, a filter or a
    source filter the collection does not accept, and a bar showing every
    accepted filter over a model that lacks one of their properties, types it
    so the operator does not fit, or declares no property at all. A
    misspelled node type lists the valid ones, a stray key is named, and a
    component's properties are held to what its export declares. A surface
    takes only its own kind's keys, a page surface needs its address, a surface
    slot and a compact slot take only the kinds they name, an edit cannot ask
    for another record, an opener is not a bare form, and a compact surface
    declares neither an address nor a compact surface of its own. A filter bar
    lists a pair once, declares only defaults and preset values its filters can
    hold, asks only for controls they can be entered with — a switch only over
    a property that says it is a boolean, and never to be off — presets only
    what it shows and labels each preset once; a state keeps something somewhere, a
    filter overlay floats, and a compact placement folds. Pinning a filter
    where nothing folds is a warning, and nowhere else.
imports:
  Assert: ../../assert
  Probe: ./__fixtures__/probe
  Run: ../../run
targets:
  - !ref rules
  - !ref sourceFilterAtRuntime
  - !ref formFieldAtRuntime
  - !ref filterPropertyAtRuntime
  - !ref filterOperatorAtRuntime
  - !ref sourceFilterNotAcceptedAtRuntime
  - !ref filterNotAcceptedAtRuntime
  - !ref filterModelIncompleteAtRuntime
  - !ref filterModelMistypedAtRuntime
  - !ref filterModelUntypedAtRuntime
  - !ref shapes
  - !ref surfaces
  - !ref compactAddressedAtRuntime
  - !ref compactNestedAtRuntime
  - !ref filterDuplicateAtRuntime
  - !ref filterDefaultInvalidAtRuntime
  - !ref filterControlUnsupportedAtRuntime
  - !ref presetUnknownFilterAtRuntime
  - !ref presetValueInvalidAtRuntime
  - !ref presetLabelDuplicateAtRuntime
  - !ref toggleOverTextAtRuntime
  - !ref toggleUntypedAtRuntime
  - !ref toggleDefaultOffAtRuntime
  - !ref togglePresetOffAtRuntime
  - !ref filterPolicy
  - !ref pinned
---
kind: Assert.Manifest
metadata:
  name: rules
source: ./__fixtures__/invalid/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Table/sourceFilter at 'source.filters.done': filters its source by a property the row model does not declare"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Form/formField at 'fields[1]': lists a field for a property the model does not declare"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/filterProperty at 'fields[0]': filters by a property the model does not declare"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/filterOperator at 'fields[0]': uses an operator the property's type does not support"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Table/sourceFilterNotAccepted at 'source.filters.isDone': filters its source by a property the collection does not accept an equality on"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/filterNotAccepted at 'fields[1]': filters by a property and operator the collection does not accept"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/filterModelIncomplete: shows every filter the collection accepts, and the model cannot answer for one of them"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/filterModelMistyped: shows every filter the collection accepts, and the model cannot answer for one of them"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/filterModelUntyped: shows every filter the collection accepts, and the model cannot answer for one of them"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Panel/compactAddressed: names a compact surface that declares an address"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Dialog/compactNested: names a compact surface that declares a compact surface of its own"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/filterDuplicate at 'fields[1]': lists a property and operator another field already has"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/filterDefaultInvalid at 'fields[0]': declares a default its filter cannot hold"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/filterControlUnsupported at 'fields[0]': asks for a control its filter cannot be entered with"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/presetUnknownFilter at 'presets[0]': sets a property and operator the bar does not show"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/presetValueInvalid at 'presets[0]': sets a value its filter cannot hold"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/presetLabelDuplicate at 'presets[1]': has the label of another preset"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/toggleOverText at 'fields[0]': asks for a control its filter cannot be entered with"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/toggleUntyped at 'fields[0]': asks for a control its filter cannot be entered with"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/toggleDefaultOff at 'fields[0]': declares a default its filter cannot hold"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Filters/togglePresetOff at 'presets[0]': sets a value its filter cannot hold"
