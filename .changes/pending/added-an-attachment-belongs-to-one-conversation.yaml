modules:
  modules/conversation: Added
body: "An attachment belongs to one conversation: POST /attachments answers { id,
  mediaType, size } and the upload is pending, with no address, until the first admitted
  turn naming it binds it to that turn's conversation; a turn naming one that is
  unknown, expired, deleted or another conversation's is refused at
  /body/attachments/<i>, and TurnRequest.attachments holds each id once. A bound file is
  read at GET /conversations/<id>/attachments/<attachment id> and nowhere else, its url
  the relative reference conversations/<id>/attachments/<attachment id>; any other read
  is a 404 ERR_CONVERSATION_ATTACHMENT_NOT_FOUND. The Attachment shape loses url."
