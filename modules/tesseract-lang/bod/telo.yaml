    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/bod.traineddata.gz:
        { upstream: bod, member: package/4.0.0_best_int/bod.traineddata.gz, sha256: e43a8e96ff77d90c25bf401b5282bde758d9d1475d7017c8c6f7bfa4039adb1c, executable: false }
