units:
  analyzer: Fixed
body: "telo check judges a Telo.Import declared in a scope (with:) as it judges an
  imports: entry: the expressions in its variables: and secrets: are type-checked
  against the importing module's configuration, its literals are held to the library's
  inputs, and a library host-path input fed a plain string or a relative path is refused
  at the member. A scoped import whose scope is written under !if no longer stops the
  check with an internal error, and a $ref naming no shape in an Application variable or
  a named shape of a module that writes a choice is reported as an unresolved reference
  instead of an internal error."
