# The showcase in Ukrainian: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads and translated into Ukrainian's four cases (`other` holding fractions);
# a word told apart by its context is translated once per context.
kind: I18n.Catalog
metadata:
  name: ukrainian
lang: uk
texts:
  # Applications and pages.
  - { text: UI showcase, translation: Вітрина інтерфейсу }
  - { text: UI showcase — Radix, translation: Вітрина інтерфейсу — Radix }
  - { text: UI showcase — brand, translation: Вітрина інтерфейсу — бренд }
  - { text: UI showcase — sidebar, translation: Вітрина інтерфейсу — бічна панель }
  - { text: Overview, translation: Огляд }
  - { text: Conditions, translation: Умови }
  - { text: Data, translation: Дані }
  - { text: Tables, translation: Таблиці }
  - { text: Filters, translation: Фільтри }
  - { text: Forms, translation: Форми }
  - { text: Actions, translation: Дії }
  - { text: Components, translation: Компоненти }
  - { text: CRUD, translation: CRUD }
  - { text: Themes, translation: Теми }
  # The navigation's groups.
  - { text: Building blocks, translation: Елементи }
  - { text: Input, translation: Введення }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: Логотип вітрини інтерфейсу }
  - { text: Language, translation: Мова }
  - { text: Theme, translation: Тема }
  - { text: Default, translation: Типова }
  - { text: Radix, translation: Radix }
  - { text: Brand, translation: Бренд }
  - { text: Sidebar, translation: Бічна панель }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: На кожен запит }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "Ці вузли належать самій сторінці, тому їхні when і текст обчислюються для кожного запиту." }
  - { text: Your browser asked for Polish., translation: Ваш браузер запросив польську мову. }
  - { text: Your browser did not ask for Polish., translation: Ваш браузер не запросив польську мову. }
  - { text: The Acme brand is on., translation: Бренд Acme увімкнено. }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "Текст, обчислений виразом, показується так, як його обчислено, і ніколи не перекладається." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "Посилання, яке цей запит робить недійсним, замінюється вузлом помилки, а решта сторінки надсилається." }
  - { text: Leaves the application, translation: Виходить із застосунку }

  # The overview.
  - { text: Every node type, translation: Кожен тип вузла }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "Блок, стек і колонки містять інші вузли, і кожен малює свої дочірні вузли по-своєму." }
  - { text: A box, translation: Блок }
  - { text: Groups its children., translation: Групує свої дочірні вузли. }
  - { text: A stack, translation: Стек }
  - { text: Draws its children one under another., translation: Малює свої дочірні вузли один під одним. }
  - { text: A badge, translation: Значок }
  - { text: Columns, translation: Колонки }
  - { text: "Draw their children side by side, as these three are.", translation: "Малюють свої дочірні вузли поруч, як ці три." }
  - { text: Text in each style, translation: Текст у кожному стилі }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "Стиль каже, що означає вузол; тема вирішує, як це виглядає. Вузол може мати кілька стилів." }
  - { text: Heading, translation: Заголовок }
  - { text: Subheading, translation: Підзаголовок }
  - { text: Muted, translation: Приглушений }
  - { text: Strong, translation: Виділений }
  - { text: Accent, translation: Акцент }
  - { text: Danger, translation: Небезпека }
  - { text: Warning, translation: Попередження }
  - { text: Success, translation: Успіх }
  - { text: Strong and accent, translation: Виділений і акцент }
  - { text: Links, translation: Посилання }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "Посилання на оголошену сторінку переходить у межах застосунку; файл, що подається в точці монтування, завантажується звичайним способом; https і mailto виходять із застосунку." }
  - { text: Go to Conditions, translation: Перейти до умов }
  - { text: A file the server serves, translation: "Файл, який подає сервер" }
  - { text: Write to us, translation: Напишіть нам }
  - { text: Images, translation: Зображення }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "Зображення за адресою, те саме зображення як оздоба з порожнім alt і розмітка SVG, намальована як зображення, але ніколи не вставлена в сторінку." }
  - { text: The showcase mark, translation: Знак вітрини }
  - { text: Three overlapping circles, translation: "Три кола, що перекриваються" }
  - { text: Values by their schema, translation: Значення за їхньою схемою }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "Кожне значення малюється так, як визначає його властивість моделі, і зчитується із запису команди, який завантажує сторінка." }
  - { text: Visit the team homepage, translation: Відвідати домашню сторінку команди }
  - { text: "A uri, drawn as a link with a text of its own", translation: "Адреса uri, намальована як посилання з власним текстом" }
  - { text: A uri-reference to a declared page, translation: Посилання uri-reference на оголошену сторінку }
  - { text: A uri-reference to a served file, translation: "Посилання uri-reference на файл, що подається" }
  - { text: A mailto address, translation: Адреса mailto }
  - { text: "An address the rule refuses, drawn as plain text", translation: "Адреса, яку відхиляє правило, намальована як звичайний текст" }
  - { text: A date, translation: Дата }
  - { text: A date and time, translation: Дата й час }
  - { text: A boolean, translation: Логічне значення }
  - { text: An enumeration's label, translation: Мітка переліку }
  - { text: A list, translation: Список }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "Рядки однієї відповіді, без поділу на сторінки. Заголовок типово береться з назви властивості, а останню колонку показано, лише поки команда наймає людей." }
  - { text: Projects under way, translation: Поточні проєкти }
  - { text: Project, translation: Проєкт }
  - { text: Texts, translation: Тексти }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": Проєктів поки немає.
        one: "Наразі {$count} проєкт."
        few: "Наразі {$count} проєкти."
        many: "Наразі {$count} проєктів."
        other: "Наразі {$count} проєкту."
  - { text: "{$team} started {$project} most recently.", translation: "Останнім команда {$team} розпочала проєкт {$project}." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "Форма множини, обрана в браузері для зчитаного числа, і текст зі значеннями із запису." }
  - { text: Open, context: state, translation: Відкрито }
  - { text: Open, context: verb, translation: Відкрити }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "Власний текст вузла розрізняється так само: значок каже, що TEL-42 відкрито, а посилання пропонує відкрити його завдання." }
  - { text: Style rules, translation: Правила стилю }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "Стиль рядка й комірки обирає значення рядка. Обраний проєкт виділено, кожен статус має свій колір, а статус, якого не називає жоден випадок, отримує типовий стиль. Дві колонки мають заголовком те саме слово, Open, яке розрізняє контекст, із яким записано кожен заголовок." }
  - { text: Composites, translation: Композити }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "Уся ця сторінка — подання, яке кожен застосунок розміщує за посиланням. Нижче — подання, записане просто там, де його розміщено, і власний тип композита цього прикладу, який не має контролера." }
  - { text: A view declared inline at the node that places it., translation: "Подання, оголошене просто у вузлі, який його розміщує." }
  - { text: A callout, translation: Виноска }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Оголошена один раз як тип, що розширює Ui.Composite і надає подання, та розміщена з власними полями." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: Вкладки }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "Вміст у вкладках, по одній вкладці за раз. Вибрана вкладка є частиною адреси сторінки, тож перезавантаження або надіслане посилання відкриває її знову." }
  - { text: Summary, translation: Підсумок }
  - { text: "A tab holds any nodes, as a box does.", translation: "Вкладка містить будь-які вузли, як і блок." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "Малюються лише вузли вибраної вкладки." }
  - { text: Chosen, translation: Вибрана }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "Кожна вкладка доставляється за власним when, як і будь-який вузол." }
  # The labels of the overview's models.
  - { text: Code, translation: Код }
  - { text: Name, translation: Назва }
  - { text: Status, translation: Статус }
  - { text: Active, translation: Активний }
  - { text: Paused, translation: Призупинений }
  - { text: Finished, translation: Завершений }
  - { text: Budget, translation: Бюджет }
  - { text: Started, translation: Розпочато }
  - { text: Free, context: subscription, translation: Безкоштовний }
  - { text: Enterprise, context: subscription, translation: Корпоративний }
  - { text: Version, translation: Версія }
  - { text: Team, context: subscription, translation: Командний }

  # Conditions.
  - { text: Delivered and drawn, translation: Доставлено й намальовано }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "when вузла вирішує на сервері, чи його доставляти; його shown вирішує в браузері, чи малювати доставлений вузол." }
  - { text: Never delivered — this node is not in the page document., translation: Ніколи не доставляється — цього вузла немає в документі сторінки. }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "Доставлено, але ніколи не малюється: статус не paused, тому браузер тримає цей текст поза полем зору." }
  - { text: Delivered by its when and drawn by its shown., translation: Доставлено за своїм when і намальовано за своїм shown. }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "Умова розміщення навколо композита, вузол якого має власну умову, обгортається в блок, і обидві мають виконуватися." }
  - { text: Both conditions hold., translation: Обидві умови виконуються. }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "Подання, вміст якого вимикає його власне when, не надає вузла, тому композит, що його розміщує, пропускається." }
  - { text: Never provided., translation: Ніколи не надається. }
  - { text: Every keyword of a condition, translation: Кожне ключове слово умови }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "Кожен рядок нижче намальовано, бо його умова виконується для підсумку проєкту TEL-42, який зчитала сторінка: status active, четверо учасників, швидкість 2.5, теги design і web, керівник — менеджер, note null і жодного codename." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: над ним працює від 1 до 10 людей." }
  - { text: "required: the lead has an e-mail.", translation: "required: керівник має e-mail." }
  - { text: "properties: the lead is a manager.", translation: "properties: керівник — менеджер." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: над ним працюють щонайменше три людини." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: над ним працює щонайбільше девʼять людей." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: швидкість більша за 2." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: швидкість менша за 3." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: швидкість кратна 0.5." }
  - { text: "type: the status is a string.", translation: "type: статус — рядок." }
  - { text: "type, as a list: the note is a string or null.", translation: "type як список: note — рядок або null." }
  - { text: "const: the status is active.", translation: "const: статус — active." }
  - { text: "enum: the status is active or paused.", translation: "enum: статус — active або paused." }
  - { text: "not: the status is not paused.", translation: "not: статус не paused." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code починається з TEL або OPS." }
  - { text: "items: every tag has at least two letters.", translation: "items: кожен тег має щонайменше дві літери." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: тегів щонайменше два." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: тегів щонайбільше пʼять." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: жоден тег не повторюється." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code має щонайменше три символи." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code має щонайбільше десять символів." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code — це літери, дефіс і цифри." }
  - { text: Missing and null, translation: Відсутність і null }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null — це наявне значення. Відсутнє значення не задовольняє жодної умови, навіть під not, тому відсутність перевіряють на батьківському обʼєкті." }
  - { text: The note is present and null., translation: note наявне й має значення null. }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "Ніколи не малюється: відсутнє codename не задовольняє not." }
  - { text: "The project has no codename, tested on the summary.", translation: "Проєкт не має codename — перевірено на підсумку." }
  - { text: Query parameters, translation: Параметри запиту }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "Цей читач оголошує mode, список значень tag і ticket, що має відповідати шаблону. Параметр, пропущений в адресі, одиничний параметр, переданий двічі, або значення, яке відхиляє його оголошення, вважається відсутнім." }
  - { text: Mode detailed, translation: Режим detailed }
  - { text: Two tags, translation: Два теги }
  - { text: A valid ticket, translation: Коректний ticket }
  - { text: A refused ticket, translation: Відхилений ticket }
  - { text: Mode given twice, translation: "Режим, переданий двічі" }
  - { text: Clear the query, translation: Очистити запит }
  - { text: mode is detailed., translation: mode — detailed. }
  - { text: There are two tag values or more., translation: Значень tag щонайменше два. }
  - { text: The ticket matches its pattern., translation: ticket відповідає своєму шаблону. }
  - { text: "No ticket, or one its pattern refuses.", translation: "Немає ticket або є такий, який відхиляє шаблон." }
  - { text: Enablement, translation: Доступність }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "Кнопку можна натиснути, лише поки виконано її умову щодо вмісту форми, а доки ні, вона пояснює чому. Тег, який проєкт уже має, відхиляється, а рядки вище знову зчитують підсумок після додавання тегу." }
  - { text: Tag TEL-42, translation: Додати тег до TEL-42 }
  - { text: Tag, translation: Тег }
  - { text: Type a tag of three letters or more., translation: Введіть тег щонайменше з трьох літер. }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation:
      plural: count
      cases:
        one: "Додано {$tag}: тепер TEL-42 має {$count} тег."
        few: "Додано {$tag}: тепер TEL-42 має {$count} теги."
        many: "Додано {$tag}: тепер TEL-42 має {$count} тегів."
        other: "Додано {$tag}: тепер TEL-42 має {$count} тегу."
  - { text: A page's own query, translation: Власний запит сторінки }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "Ця сторінка теж оголошує mode, і її власні вузли його зчитують." }
  - { text: The page reads mode as detailed., translation: Сторінка зчитує mode як detailed. }

  # Data.
  - { text: A reader and its parameters, translation: Читач і його параметри }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "Проєкт — це параметр project адреси сторінки, що надсилається разом зі зчитуванням; без нього параметр не надсилається, і маршрут відповідає для TEL-42. Код, якого не має жоден проєкт, малює дерево помилки." }
  - { text: A code no project has, translation: "Код, якого не має жоден проєкт" }
  - { text: No project, translation: Без проєкту }
  - { text: Reading the project…, translation: Зчитування проєкту… }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, керівник — {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "Читач, вкладений у вміст цього, зчитує людей, які працюють над тим самим проєктом." }
  - { text: Working on it, translation: Працюють над ним }
  - { text: Role, translation: Роль }
  - { text: E-mail, translation: E-mail }
  - { text: "No answer · {$code}", translation: "Немає відповіді · {$code}" }
  - { text: Readers that fail, translation: "Читачі, що зазнають невдачі" }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "Без власного дерева помилки читачі малюють код і повідомлення помилки — для проєкту, якого не існує, для захищеного маршруту, зчитаного без сеансу, і для відповіді, яку відхиляє модель читача (список проєктів, зчитаний як один проєкт)." }
  - { text: "Never drawn: there is no such project.", translation: "Ніколи не малюється: такого проєкту немає." }
  - { text: "Signed in, so this reads: {$name}", translation: "Ви ввійшли, тому зчитано: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "Ніколи не малюється: список — не проєкт." }
  - { text: Read again on focus, translation: Повторне зчитування після повернення до вікна }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "Цей читач знову зчитує час сервера щоразу, коли вікно повертає фокус. Перейдіть до іншого вікна й назад." }
  - { text: Read at, translation: Зчитано }
  - { text: A sign-in gate, translation: Шлюз входу }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "Шлюз зчитує, чи відкрито сеанс, і зчитує це знову щоразу, коли запит усередині нього отримує відповідь 401. Вхід відкриває сеанс для учасника команди; e-mail, якого немає ні в кого з команди, відхиляється біля свого поля. Усередині читач захищеного маршруту показує обліковий запис. Тихе завершення сеансу залишає обліковий запис на екрані, доки наступний захищений запит — перевірку нижче або повернення до вікна — не буде відхилено; тоді шлюз перемикається на подання для того, хто вийшов." }
  - { text: You are signed out., translation: Ви вийшли. }
  - { text: Sign in, translation: Увійти }
  - { text: "Signed in as {$name}", translation: "Ви ввійшли як {$name}" }
  - { text: "Member since {$since}", translation: "Учасник із {$since}" }
  - { text: Check the session, translation: Перевірити сеанс }
  - { text: End the session quietly, translation: Тихо завершити сеанс }
  - { text: Sign out, translation: Вийти }

  # The labels of the task models.
  - { text: Task, translation: Завдання }
  - { text: Assignee, translation: Виконавець }
  - { text: Priority, translation: Пріоритет }
  - { text: Estimate, translation: Оцінка }
  - { text: Due, translation: Термін }
  - { text: Label, translation: Мітка }
  - { text: Blocked, translation: Заблоковано }
  - { text: To do, translation: До виконання }
  - { text: In progress, translation: У роботі }
  - { text: In review, translation: На перевірці }
  - { text: Bug, translation: Помилка }
  - { text: Feature, translation: Функція }
  - { text: Chore, translation: Рутинна робота }
  - { text: Docs, translation: Документація }
  - { text: Contact, translation: Контакт }
  - { text: Project name, translation: Назва проєкту }
  - { text: Brief, translation: Опис }

  # Tables.
  - { text: Columns from the model, translation: Колонки з моделі }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "Без записаних колонок таблиця показує по одній на кожну властивість моделі, крім ключа рядка, кожну із заголовком з її назви й намальовану за її типом. Вона типово показує 25 рядків на сторінку, а форми створення й редагування відкриває в діалоговому вікні — поверхні, якою таблиця користується, коли не називає жодної." }
  - { text: "Written columns, sorting and style rules", translation: "Записані колонки, сортування й правила стилю" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "Колонки, записані вручну, у заданому порядку, одна з власним заголовком. Колонка сортується, якщо колекція вказує її властивість для сортування. Рядок заблокованого завдання виділено червоним, кожна комірка статусу має свій колір, а пріоритет, якого не називає жоден випадок, отримує типовий стиль. Вісім рядків на сторінку." }
  - { text: Where, translation: Де }
  - { text: Members behind a reference, translation: Поля за посиланням }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "Дошка завдань повертає кожне завдання з вкладеними виконавцем і проєктом. Колонка над вкладеним полем бере його назву й спосіб показу через іменовану структуру, через власне визначення моделі та через посилання, чия власна назва переважає структуру, яку воно називає: контакт — це поштове посилання, а опис — посилання на сторінку." }
  - { text: Filtered by the address, translation: Відфільтровано за адресою }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "Ця таблиця оголошує параметр project і надсилає його як рівність із кожним запитом. Без проєкту в адресі вона нічого не зчитує." }
  - { text: Atlas redesign tasks, translation: Завдання редизайну Atlas }
  - { text: Billing migration tasks, translation: Завдання міграції білінгу }
  - { text: Blocked tasks, translation: Заблоковані завдання }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "Цю таблицю відфільтровано фіксованим значенням, записаним у неї, і вона показує лише заблоковані завдання." }
  - { text: Where a form opens, translation: Де відкривається форма }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "Кожна таблиця нижче відкриває форми створення й редагування на іншій поверхні. Збереження перезавантажує кожну таблицю завдань на сторінці." }
  - { text: Dialogs, translation: Діалогові вікна }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "Створення в малому діалоговому вікні, яке лишається відкритим і очищеним для наступного завдання. Редагування у великому вікні, яке не блокує сторінку й ігнорує клацання поза ним; після збереження воно зберігає значення, незбережене введення відкидає без запитання і є частиною адреси. Кожен рядок пропонує видалення з підтвердженням." }
  - { text: Drawers, translation: Шухляди }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "Створення в малій шухляді від початкового краю; редагування у великій шухляді від кінцевого краю, без кнопки закриття. Обидві закриваються після збереження і питають, перш ніж відкинути незбережене введення." }
  - { text: Sheets, translation: Аркуші }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "Створення в аркуші згори, який не блокує сторінку; редагування в повному аркуші знизу, що є частиною адреси." }
  - { text: Popovers, translation: Спливні картки }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "Створення в картці біля кнопки «Створити», вирівняній по її центру; нижче порогу вона стає повним діалоговим вікном. Редагування в картці під кнопкою рядка, вирівняній по її кінцю, яку не закриває клацання поза нею і яка лишається відкритою після збереження." }
  - { text: In line, translation: Вбудовано }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "Форма створення відкривається над рядками, а форма редагування — під рядком, який вона змінює. Нижче порогу форма створення відкривається в аркуші знизу." }
  - { text: Panels, translation: Панелі }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "Створення в малій панелі біля початкового краю, яку не закриває Escape. Редагування у великій панелі біля кінцевого краю, що є частиною адреси, а рядки поруч лишаються доступними; нижче порогу вона стає аркушем знизу." }
  - { text: A page of its own, translation: Окрема сторінка }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "Створення й редагування замінюють вміст сторінки під однією назвою в адресі, тож адреса вказує або на нове завдання, або на завдання з цим ключем, а «Назад» закриває форму. Поверхню оголошено один раз, і обидві дії її називають." }

  # Filters.
  - { text: Every filter the collection accepts, translation: "Кожен фільтр, який приймає колекція" }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "Без записаних полів панель фільтрів малює по одному елементу керування на кожен фільтр, який приймає колекція, у її порядку та за властивістю моделі: список для переліку або значення так/ні, в інших випадках поле введення, і одну мітку над двома межами діапазону. Вона стоїть над таблицею, вибір застосовує одразу, а введений текст — після Enter, і нічого не зберігає між відвідинами." }
  - { text: Every control, translation: Кожен елемент керування }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "Кожен спосіб введення фільтра: введений текст, варіанти поруч, список, введені теги, повзунок, перемикач і дві дати під однією міткою. Фільтр проєкту ніде не малюється, і задає його лише готовий набір. Статус починається з типового значення, а готовий набір задає фільтри, які він називає, і очищає інші, названі наборами. Чипи підсумовують вибране, а значення є частиною адреси. Нижче порогу панель згортається, а закріплений текстовий фільтр лишається поза згорнутою частиною." }
  - { text: Urgent, translation: Терміново }
  - { text: Atlas only, translation: Лише Atlas }
  - { text: Stuck, translation: Застрягло }
  - { text: "Beside, as chips, while typing", translation: "Поруч, як чипи, під час введення" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "Елементи керування стоять у колонці біля початкового краю. Видно лише вибрані вами фільтри: додайте фільтр зі списку панелі, а його вилучення його очищає. Кожен фільтр — це чип із назвою значення, який відкриває свій елемент керування. Введений текст застосовується після паузи, а дві межі числа мають підписи «після» і «раніше за». Вибір зберігається в цьому браузері між відвідинами. Нижче порогу панель відкривається в аркуші знизу." }
  - { text: "Beside at the end, applied by a button", translation: "Поруч у кінці, із застосуванням кнопкою" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "Елементи керування стоять біля кінцевого краю, і зміна чекає на «Застосувати», тоді як готовий набір, «Скинути» та вилучення чипа підсумку діють одразу. Кількох виконавців вводять через кому. Вибір зберігається лише для цієї вкладки й переживає перезавантаження." }
  - { text: Due by October, translation: Термін до жовтня }
  - { text: "Folded, starting open", translation: "Згортається, спершу розгорнуто" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "Елементи керування згортаються за перемикачем, який рахує фільтри зі значенням, і спершу розгорнуті. Закріплений текстовий фільтр лишається поза згорнутою частиною, а інші додаються зі списку панелі. Статус починається зі значення «У роботі»; його вилучення очищає й це типове значення, а «Скинути» його повертає. Значення зберігаються і в адресі, і в цьому браузері, причому перевагу має адреса, а вибраний вами стан згортання запамʼятовується." }
  - { text: "Folded, starting closed", translation: "Згортається, спершу згорнуто" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "Спершу згорнуто. Закріплений текстовий фільтр, «Застосувати» і «Скинути» лишаються поза згорнутою частиною. Мітка має типове значення «Помилка», доки її не змінять, а «Скинути» повертає типове значення." }
  - { text: In a dialog, translation: У діалоговому вікні }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "Елементи керування відкриваються в малому діалоговому вікні з кнопки, яка рахує фільтри зі значенням, і закриваються кнопкою «Готово». Відкрите вікно є частиною адреси, тож його відкриває посилання. Закріплений текстовий фільтр лишається біля кнопки, а чипи підсумовують вибране." }
  - { text: In a drawer, translation: У шухляді }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "Елементи керування відкриваються в шухляді від початкового краю, яку не закриває клацання поза нею. Введені значення застосовуються після паузи." }
  - { text: In a popover, translation: У спливній картці }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "Елементи керування відкриваються в картці під кнопкою, вирівняній по її кінцю; нижче порогу — в аркуші знизу." }

