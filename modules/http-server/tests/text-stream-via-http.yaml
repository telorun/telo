kind: Telo.Application
metadata:
  name: TextStreamViaHttpTest
  version: 1.0.0
  description: |
    End-to-end test for Http.Api `mode: stream` + format-codec encoders, using
    Ai.TextStream as the upstream source. Three single-format routes verify
    byte-exact wire output for NDJSON, SSE, and plain text. A fourth route
    declares all three formats under one `content:` map and is hit with three
    different `Accept` headers to verify the negotiation algorithm.
imports:
  Ai: ../../ai
  AiEcho: ../../ai/tests/__fixtures__/ai-echo.yaml
  Http: ../
  Ndjson: ../../ndjson-codec
  Sse: ../../sse-codec
  PlainText: ../../plain-text-codec
  JS: ../../javascript
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testAllFormats
---
kind: AiEcho.EchoModelStream
metadata: { name: echo }
---
# One source — wire format is decided by the route's encoder, not by the source.
kind: Ai.TextStream
metadata: { name: chatStream }
model: !ref echo
---
kind: Ndjson.Encoder
metadata: { name: ndjsonEnc }
---
kind: Sse.Encoder
metadata: { name: sseEnc }
---
kind: PlainText.Encoder
metadata: { name: plainEnc }
---
# Helper: POST to a URL with {prompt}, drain the body, return {status, contentType, body}.
kind: JS.Script
metadata: { name: fetchAndDrain }
code: |
  async function main({ url, prompt, accept }) {
    const headers = { "Content-Type": "application/json" };
    if (accept) headers["Accept"] = accept;
    const r = await fetch(url, {
      method: "POST",
      headers,
      body: JSON.stringify({ prompt }),
    });
    const chunks = [];
    for await (const chunk of r.body) chunks.push(Buffer.from(chunk));
    return {
      status: r.status,
      contentType: r.headers.get("content-type") || "",
      body: Buffer.concat(chunks).toString("utf8"),
    };
  }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      url: { type: string }
      prompt: { type: string }
      accept: { type: string }
    required: [ url, prompt ]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      status: { type: integer }
      contentType: { type: string }
      body: { type: string }
    required: [ status, contentType, body ]
---
kind: Http.Api
metadata: { name: api }
routes:
  # Single-format routes — byte-exact wire output.
  - request:
      path: /ndjson
      method: POST
      schema:
        body:
          type: object
          properties:
            prompt: { type: string }
          required: [ prompt ]
    handler: !ref chatStream
    inputs:
      prompt: "${{ request.body.prompt }}"
    returns:
      - status: 200
        mode: stream
        content:
          application/x-ndjson:
            encoder: !ref ndjsonEnc
    # The handler's throw union is declared now, so a route mounting it covers
    # its codes or ends with a catch-all. This fires BEFORE streaming starts.
    catches:
      - status: 500
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error: { type: string }
            body:
              error: !cel "error.code"
  - request:
      path: /sse
      method: POST
      schema:
        body:
          type: object
          properties:
            prompt: { type: string }
          required: [ prompt ]
    handler: !ref chatStream
    inputs:
      prompt: "${{ request.body.prompt }}"
    returns:
      - status: 200
        mode: stream
        content:
          text/event-stream:
            encoder: !ref sseEnc
    # The handler's throw union is declared now, so a route mounting it covers
    # its codes or ends with a catch-all. This fires BEFORE streaming starts.
    catches:
      - status: 500
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error: { type: string }
            body:
              error: !cel "error.code"
  - request:
      path: /plain
      method: POST
      schema:
        body:
          type: object
          properties:
            prompt: { type: string }
          required: [ prompt ]
    handler: !ref chatStream
    inputs:
      prompt: "${{ request.body.prompt }}"
    returns:
      - status: 200
        mode: stream
        content:
          text/plain; charset=utf-8:
            encoder: !ref plainEnc
    # The handler's throw union is declared now, so a route mounting it covers
    # its codes or ends with a catch-all. This fires BEFORE streaming starts.
    catches:
      - status: 500
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error: { type: string }
            body:
              error: !cel "error.code"

  # Negotiated route — three formats on one entry, Accept-header picks one.
  - request:
      path: /chat
      method: POST
      schema:
        body:
          type: object
          properties:
            prompt: { type: string }
          required: [ prompt ]
    handler: !ref chatStream
    inputs:
      prompt: "${{ request.body.prompt }}"
    returns:
      - status: 200
        mode: stream
        content:
          application/x-ndjson:
            encoder: !ref ndjsonEnc
          text/event-stream:
            encoder: !ref sseEnc
          text/plain; charset=utf-8:
            encoder: !ref plainEnc
    # The handler's throw union is declared now, so a route mounting it covers
    # its codes or ends with a catch-all. This fires BEFORE streaming starts.
    catches:
      - status: 500
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error: { type: string }
            body:
              error: !cel "error.code"
---
kind: Run.Sequence
metadata: { name: testAllFormats }
with:
  - kind: Http.Server
    metadata: { name: Server }
    host: 127.0.0.1
    port: 8946
    baseUrl: http://127.0.0.1:8946
    openapi:
      info:
        title: TextStream via HTTP test
        version: 1.0.0
    mounts:
      - path: /
        mount: !ref api
targets:
  - !ref Server
steps:
  - name: hitNdjson
    inputs:
      url: http://127.0.0.1:8946/ndjson
      prompt: "hi"
    invoke: !ref fetchAndDrain
  - name: assertNdjson
    inputs:
      status: "${{ steps.hitNdjson.result.status }}"
      contentType: "${{ steps.hitNdjson.result.contentType }}"
      body: "${{ steps.hitNdjson.result.body }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status: { const: 200 }
          contentType: { const: "application/x-ndjson" }
          body:
            const: |
              {"type":"text-delta","delta":"h"}
              {"type":"text-delta","delta":"i"}
              {"type":"finish","usage":{"promptTokens":0,"completionTokens":0,"totalTokens":0,"unit":"tokens","total":0},"finishReason":"stop"}
        required: [ status, contentType, body ]

  - name: hitSse
    inputs:
      url: http://127.0.0.1:8946/sse
      prompt: "hi"
    invoke: !ref fetchAndDrain
  - name: assertSse
    inputs:
      status: "${{ steps.hitSse.result.status }}"
      contentType: "${{ steps.hitSse.result.contentType }}"
      body: "${{ steps.hitSse.result.body }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status: { const: 200 }
          contentType: { const: "text/event-stream" }
          body:
            const: "event: text-delta\ndata: {\"delta\":\"h\"}\n\nevent: text-delta\ndata: {\"delta\":\"i\"}\n\nevent: finish\ndata: {\"usage\":{\"promptTokens\":0,\"completionTokens\":0,\"totalTokens\":0,\"unit\":\"tokens\",\"total\":0},\"finishReason\":\"stop\"}\n\n"
        required: [ status, contentType, body ]

  - name: hitPlain
    inputs:
      url: http://127.0.0.1:8946/plain
      prompt: "hi"
    invoke: !ref fetchAndDrain
  - name: assertPlain
    inputs:
      status: "${{ steps.hitPlain.result.status }}"
      contentType: "${{ steps.hitPlain.result.contentType }}"
      body: "${{ steps.hitPlain.result.body }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status: { const: 200 }
          contentType: { const: "text/plain; charset=utf-8" }
          body: { const: "hi" }
        required: [ status, contentType, body ]

  # Negotiation — Accept: application/x-ndjson picks NDJSON.
  - name: negotiateNdjson
    inputs:
      url: http://127.0.0.1:8946/chat
      prompt: "hi"
      accept: "application/x-ndjson"
    invoke: !ref fetchAndDrain
  - name: assertNegotiateNdjson
    inputs:
      contentType: "${{ steps.negotiateNdjson.result.contentType }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          contentType: { const: "application/x-ndjson" }
        required: [ contentType ]

  # Accept: text/event-stream picks SSE.
  - name: negotiateSse
    inputs:
      url: http://127.0.0.1:8946/chat
      prompt: "hi"
      accept: "text/event-stream"
    invoke: !ref fetchAndDrain
  - name: assertNegotiateSse
    inputs:
      contentType: "${{ steps.negotiateSse.result.contentType }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          contentType: { const: "text/event-stream" }
        required: [ contentType ]

  # No Accept (or */*) — first declared key wins (NDJSON, by declaration order).
  - name: negotiateDefault
    inputs:
      url: http://127.0.0.1:8946/chat
      prompt: "hi"
      accept: "*/*"
    invoke: !ref fetchAndDrain
  - name: assertNegotiateDefault
    inputs:
      contentType: "${{ steps.negotiateDefault.result.contentType }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          contentType: { const: "application/x-ndjson" }
        required: [ contentType ]

  # No matching Accept → 406.
  - name: notAcceptable
    inputs:
      url: http://127.0.0.1:8946/chat
      prompt: "hi"
      accept: "image/png"
    invoke: !ref fetchAndDrain
  - name: assert406
    inputs:
      status: "${{ steps.notAcceptable.result.status }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status: { const: 406 }
        required: [ status ]
