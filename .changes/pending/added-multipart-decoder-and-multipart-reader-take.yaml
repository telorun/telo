modules:
  modules/multipart: Added
body: "Multipart.Decoder and Multipart.Reader take three limits, each an integer of at
  least 1: maxPartBytes (one part's content; decoder default 8388608, reader none),
  maxParts (default 1000 on both) and maxTotalBytes (every byte read, framing and
  headers included; decoder default 16777216, reader none). Both declare two codes with
  typed data: ERR_MULTIPART_MALFORMED with data.reason boundary-missing, truncated,
  header-malformed or header-too-large, and ERR_MULTIPART_LIMIT_EXCEEDED with data
  limit, max and, where a part is concerned, part and name. A limit stops the read as
  soon as the bytes read show it is crossed, a source failure is rethrown as raised, and
  on the reader a failure found while draining fails the read in progress and the parts
  stream and releases the source. Breaking: failures were uncoded errors rendered as 500
  and are now coded, so a route whose handler is a decoder or a reader must cover both
  codes in catches or telo check reports UNCOVERED_THROW_CODE. Breaking: maxPartBytes no
  longer caps the whole payload; that cap is maxTotalBytes, 16 MiB by default on the
  decoder. Breaking: a payload of more than 1000 parts is refused unless maxParts is
  raised. Breaking: a part header line that is neither name: value nor a folded
  continuation is refused as header-malformed where it used to be skipped, and a
  boundary that never occurs is reported as truncated."
