kind: Telo.Library
metadata:
  name: VectorStore
  version: 0.10.3
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Storage, AI]
  description: |
    Semantic search over an index of vectors: store embeddings with ids and metadata,
    query for the nearest neighbours of a vector with scores, and delete by id or by a
    metadata filter. The retrieval half of a RAG pipeline — the embedding itself
    happens upstream.
exports:
  kinds:
    - Store
    - Record
    - Match
    - Removal
  # The entry point a dependent module's controller bundle resolves
  # `@telorun/vector-store` to, so this module's code is one module scope across every
  # consumer instead of a copy inlined into each of their bundles.
  code:
    - specifier: "@telorun/vector-store"
      format: js
      path: ./nodejs/vector-store.mjs
      source: ./nodejs/src/index.ts
---
# MetadataFilter — the MongoDB-style filter grammar shared by Match and Removal,
# declared once and referenced via `$ref: "telo://Self/MetadataFilter"`. Top-level
# keys are ANDed; a bare scalar is `$eq`; `$and`/`$or` take filter arrays, `$not`
# negates a filter (recursion via `$ref: "#"`). No operator outside this set is
# allowed, so an unsupported filter is a static error rather than per-backend drift.
kind: Telo.JsonSchema
metadata:
  name: MetadataFilter
  description: >-
    The filter grammar for constraining candidates by their metadata: equality,
    comparison, set membership, and and/or/not combinations. Shared by querying and
    deletion, so an unsupported operator fails statically instead of drifting per
    backend.
schema:
  type: object
  minProperties: 1
  $defs:
    Scalar:
      type: [string, number, boolean, "null"]
    Condition:
      oneOf:
        - $ref: "#/$defs/Scalar"
        - type: object
          minProperties: 1
          additionalProperties: false
          properties:
            $eq: { $ref: "#/$defs/Scalar" }
            $ne: { $ref: "#/$defs/Scalar" }
            $gt: { type: number }
            $gte: { type: number }
            $lt: { type: number }
            $lte: { type: number }
            $in: { type: array, items: { $ref: "#/$defs/Scalar" } }
            $nin: { type: array, items: { $ref: "#/$defs/Scalar" } }
  properties:
    $and: { type: array, minItems: 1, items: { $ref: "#" } }
    $or: { type: array, minItems: 1, items: { $ref: "#" } }
    $not: { $ref: "#" }
  additionalProperties: { $ref: "#/$defs/Condition" }
---
# VectorStore.Store — the abstract index every backend implements. A
# Telo.Provider: a configured index, NOT an operation you invoke. Consumers
# (VectorStore.Record / .Match / .Removal) reference it via
# `x-telo-ref: Self.Store`; a concrete implementation
# (VectorStoreMemory.Store, …) satisfies the ref. The store owns its config
# (metric, dimensions) and is authoritative for dimension enforcement.
kind: Telo.Abstract
metadata:
  name: Store
  description: >-
    A configured vector index that holds embeddings with their ids and metadata. It
    owns the similarity metric and the vector dimension, and enforces that every
    written vector matches, so writes and queries agree on one geometry.
capability: Telo.Provider
---
# VectorStore.Record — upsert vectors with ids + metadata. Batch-first; the
# same kind handles one or many.
kind: Telo.Definition
metadata:
  name: Record
  description: >-
    Writes a batch of vectors into the index, each with an id and optional metadata,
    replacing any entry that already has that id. Returns the ids written, in order.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/vector-store.mjs&local_path=./nodejs/src/index.ts#Record
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [items]
    additionalProperties: false
    properties:
      items:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, vector]
          additionalProperties: false
          properties:
            id: { type: string }
            vector: { type: array, items: { type: number } }
            metadata: { type: object, additionalProperties: true }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [ids]
    additionalProperties: false
    properties:
      ids:
        description: Ids written, in input order.
        type: array
        items: { type: string }
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: Reference to the backing vector store.
      x-telo-ref:
        kind: Self.Store
        use: dependency
  examples:
    - store: !ref knowledgeBase
---
# VectorStore.Match — nearest-neighbour query. Vector-only: the caller embeds
# the query text first (e.g. Embedding.Query), keeping this op
# single-responsibility and free of an embedder dependency. `metadataFilter`
# constrains candidates by metadata, orthogonal to vector similarity.
kind: Telo.Definition
metadata:
  name: Match
  description: >-
    Finds the entries nearest to a query vector and returns them with similarity
    scores and metadata, limited to a chosen number and optionally narrowed by a
    metadata filter first.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/vector-store.mjs&local_path=./nodejs/src/index.ts#Match
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [vector]
    additionalProperties: false
    properties:
      vector: { type: array, items: { type: number } }
      metadataFilter:
        description: MongoDB-style metadata filter.
        $ref: "telo://Self/MetadataFilter"
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [matches]
    additionalProperties: false
    properties:
      matches:
        type: array
        items:
          type: object
          required: [id, score]
          additionalProperties: false
          properties:
            id: { type: string }
            score: { type: number }
            metadata: { type: object, additionalProperties: true }
            vector: { type: array, items: { type: number } }
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: Reference to the backing vector store.
      x-telo-ref:
        kind: Self.Store
        use: dependency
    topK:
      title: Top K
      description: Maximum matches to return.
      type: integer
      minimum: 1
      default: 10
    includeVectors:
      title: Include vectors
      description: Return the stored vector on each match.
      type: boolean
      default: false
  examples:
    - store: !ref knowledgeBase
      topK: 5
---
# VectorStore.Removal — delete by id list and/or metadata filter.
kind: Telo.Definition
metadata:
  name: Removal
  description: >-
    Deletes entries from the index by id, by a metadata filter, or both, and reports
    how many were removed.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/vector-store.mjs&local_path=./nodejs/src/index.ts#Removal
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      ids:
        type: array
        minItems: 1
        items: { type: string }
      metadataFilter:
        description: MongoDB-style metadata filter.
        $ref: "telo://Self/MetadataFilter"
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [removed]
    additionalProperties: false
    properties:
      removed:
        description: Count of entries deleted.
        type: integer
        minimum: 0
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: Reference to the backing vector store.
      x-telo-ref:
        kind: Self.Store
        use: dependency
  examples:
    - store: !ref knowledgeBase
