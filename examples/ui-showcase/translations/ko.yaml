# The showcase in Korean: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads; Korean has a single plural form, so a plural is translated as one
# text, or with an explicit `=0` case where that reads better. A word told
# apart by its context is translated once per context.
kind: I18n.Catalog
metadata:
  name: korean
lang: ko
texts:
  # Applications and pages.
  - { text: UI showcase, translation: "UI 쇼케이스" }
  - { text: UI showcase — Radix, translation: "UI 쇼케이스 — Radix" }
  - { text: UI showcase — brand, translation: "UI 쇼케이스 — 브랜드" }
  - { text: UI showcase — sidebar, translation: "UI 쇼케이스 — 사이드바" }
  - { text: Overview, translation: "개요" }
  - { text: Conditions, translation: "조건" }
  - { text: Data, translation: "데이터" }
  - { text: Tables, translation: "테이블" }
  - { text: Filters, translation: "필터" }
  - { text: Forms, translation: "폼" }
  - { text: Actions, translation: "액션" }
  - { text: Components, translation: "컴포넌트" }
  - { text: CRUD, translation: "CRUD" }
  - { text: Themes, translation: "테마" }
  # The navigation's groups.
  - { text: Building blocks, translation: "구성 요소" }
  - { text: Input, translation: "입력" }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: "UI 쇼케이스 로고" }
  - { text: Language, translation: "언어" }
  - { text: Theme, translation: "테마" }
  - { text: Default, translation: "기본" }
  - { text: Radix, translation: "Radix" }
  - { text: Brand, translation: "브랜드" }
  - { text: Sidebar, translation: "사이드바" }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: "요청마다" }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "이 노드들은 페이지 자체의 노드이므로 when과 텍스트가 요청마다 평가됩니다." }
  - { text: Your browser asked for Polish., translation: "브라우저가 폴란드어를 요청했습니다." }
  - { text: Your browser did not ask for Polish., translation: "브라우저가 폴란드어를 요청하지 않았습니다." }
  - { text: The Acme brand is on., translation: "Acme 브랜드가 켜져 있습니다." }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "표현식이 계산한 텍스트는 계산된 그대로 표시되며 번역되지 않습니다." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "이 요청으로 유효하지 않게 된 링크는 오류 노드로 대체되고, 페이지의 나머지 부분은 그대로 제공됩니다." }
  - { text: Leaves the application, translation: "애플리케이션을 벗어납니다" }

  # The overview.
  - { text: Every node type, translation: "모든 노드 유형" }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "박스, 스택, 열은 다른 노드를 담으며, 각각 자신만의 방식으로 자식을 그립니다." }
  - { text: A box, translation: "박스" }
  - { text: Groups its children., translation: "자식을 묶습니다." }
  - { text: A stack, translation: "스택" }
  - { text: Draws its children one under another., translation: "자식을 위아래로 차례로 그립니다." }
  - { text: A badge, translation: "배지" }
  - { text: Columns, translation: "열" }
  - { text: "Draw their children side by side, as these three are.", translation: "이 세 항목처럼 자식을 나란히 그립니다." }
  - { text: Text in each style, translation: "스타일별 텍스트" }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "스타일은 노드가 무엇을 의미하는지 나타내고, 그것이 어떻게 보일지는 테마가 결정합니다. 노드 하나에 여러 스타일을 지정할 수 있습니다." }
  - { text: Heading, translation: "제목" }
  - { text: Subheading, translation: "부제목" }
  - { text: Muted, translation: "흐리게" }
  - { text: Strong, translation: "강조" }
  - { text: Accent, translation: "액센트" }
  - { text: Danger, translation: "위험" }
  - { text: Warning, translation: "경고" }
  - { text: Success, translation: "성공" }
  - { text: Strong and accent, translation: "강조 및 액센트" }
  - { text: Links, translation: "링크" }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "선언된 페이지로 가는 링크는 애플리케이션 안에서 이동하고, 마운트 아래에서 제공되는 파일은 일반적인 방식으로 로드되며, https와 mailto는 애플리케이션을 벗어납니다." }
  - { text: Go to Conditions, translation: "조건으로 이동" }
  - { text: A file the server serves, translation: "서버가 제공하는 파일" }
  - { text: Write to us, translation: "문의하기" }
  - { text: Images, translation: "이미지" }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "주소로 지정한 이미지, 빈 alt를 가진 장식용 같은 이미지, 그리고 페이지에 삽입되지 않고 이미지로 그려지는 SVG 마크업입니다." }
  - { text: The showcase mark, translation: "쇼케이스 마크" }
  - { text: Three overlapping circles, translation: "겹쳐진 세 개의 원" }
  - { text: Values by their schema, translation: "스키마에 따른 값" }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "각 값은 페이지가 불러오는 팀 레코드에서 읽어, 해당 모델 속성이 정한 대로 그려집니다." }
  - { text: Visit the team homepage, translation: "팀 홈페이지 방문" }
  - { text: "A uri, drawn as a link with a text of its own", translation: "자체 텍스트가 있는 링크로 그려지는 uri" }
  - { text: A uri-reference to a declared page, translation: "선언된 페이지를 가리키는 uri-reference" }
  - { text: A uri-reference to a served file, translation: "제공되는 파일을 가리키는 uri-reference" }
  - { text: A mailto address, translation: "mailto 주소" }
  - { text: "An address the rule refuses, drawn as plain text", translation: "규칙이 거부하여 일반 텍스트로 그려지는 주소" }
  - { text: A date, translation: "날짜" }
  - { text: A date and time, translation: "날짜와 시간" }
  - { text: A boolean, translation: "불리언" }
  - { text: An enumeration's label, translation: "열거형의 레이블" }
  - { text: A list, translation: "목록" }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "한 응답에 담긴 행으로, 페이지로 나뉘지 않습니다. 헤더는 기본적으로 속성의 제목이며, 마지막 열은 팀이 채용 중일 때만 표시됩니다." }
  - { text: Projects under way, translation: "진행 중인 프로젝트" }
  - { text: Project, translation: "프로젝트" }
  - { text: Texts, translation: "텍스트" }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": "아직 프로젝트가 없습니다."
        other: "지금까지 프로젝트 {$count}개."
  - { text: "{$team} started {$project} most recently.", translation: "{$team} 팀이 가장 최근에 시작한 프로젝트: {$project}." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "브라우저가 읽은 숫자에 맞게 고른 복수형과, 값이 레코드에서 오는 텍스트입니다." }
  - { text: Open, context: state, translation: "열림" }
  - { text: Open, context: verb, translation: "열기" }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "노드 자체의 텍스트도 같은 방식으로 구분됩니다. 배지는 TEL-42가 열려 있음을 알리고, 링크는 그 작업을 열도록 제안합니다." }
  - { text: Style rules, translation: "스타일 규칙" }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "행과 셀의 스타일은 행의 값으로 선택됩니다. 주요 프로젝트는 강조되고, 각 상태에는 고유한 색이 있으며, 어떤 경우에도 해당하지 않는 상태는 기본 스타일을 받습니다. 두 열의 헤더는 같은 단어 Open이며, 각 헤더에 함께 작성된 컨텍스트로 구분됩니다." }
  - { text: Composites, translation: "컴포지트" }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "이 페이지 전체는 각 애플리케이션이 참조로 배치하는 뷰입니다. 아래에는 배치되는 위치에 인라인으로 작성된 뷰와, 컨트롤러가 없는 이 예제 고유의 컴포지트 종류가 있습니다." }
  - { text: A view declared inline at the node that places it., translation: "자신을 배치하는 노드에 인라인으로 선언된 뷰입니다." }
  - { text: A callout, translation: "콜아웃" }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Ui.Composite를 확장하고 뷰를 제공하는 종류로 한 번 선언되며, 자체 필드와 함께 배치됩니다." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: "탭" }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "탭 아래의 콘텐츠로, 한 번에 한 탭씩 표시됩니다. 선택한 탭은 페이지 주소의 일부이므로 새로 고침하거나 공유한 링크로 열면 그 탭이 다시 열립니다." }
  - { text: Summary, translation: "요약" }
  - { text: "A tab holds any nodes, as a box does.", translation: "탭은 박스처럼 어떤 노드든 담을 수 있습니다." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "선택한 탭의 노드만 그려집니다." }
  - { text: Chosen, translation: "선택됨" }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "각 탭은 다른 노드와 마찬가지로 자체 when에 따라 전달됩니다." }
  # The labels of the overview's models.
  - { text: Code, translation: "코드" }
  - { text: Name, translation: "이름" }
  - { text: Status, translation: "상태" }
  - { text: Active, translation: "활성" }
  - { text: Paused, translation: "일시 중지됨" }
  - { text: Finished, translation: "완료됨" }
  - { text: Budget, translation: "예산" }
  - { text: Started, translation: "시작일" }
  - { text: Free, context: subscription, translation: "무료" }
  - { text: Enterprise, context: subscription, translation: "엔터프라이즈" }
  - { text: Version, translation: "버전" }
  - { text: Team, context: subscription, translation: "팀" }

  # Conditions.
  - { text: Delivered and drawn, translation: "전달과 그리기" }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "노드의 when은 서버에서 노드의 전달 여부를 결정하고, shown은 브라우저에서 전달된 노드를 그릴지 결정합니다." }
  - { text: Never delivered — this node is not in the page document., translation: "전달되지 않음 — 이 노드는 페이지 문서에 없습니다." }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "전달되지만 그려지지 않음: 상태가 paused가 아니므로 브라우저가 이 텍스트를 보이지 않게 둡니다." }
  - { text: Delivered by its when and drawn by its shown., translation: "when으로 전달되고 shown으로 그려집니다." }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "자체 조건이 있는 노드를 가진 컴포지트에 배치 조건을 걸면 박스로 감싸지며, 두 조건이 모두 충족되어야 합니다." }
  - { text: Both conditions hold., translation: "두 조건이 모두 충족됩니다." }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "자체 when으로 콘텐츠가 꺼진 뷰는 노드를 제공하지 않으므로, 이를 배치하는 컴포지트는 생략됩니다." }
  - { text: Never provided., translation: "제공되지 않음." }
  - { text: Every keyword of a condition, translation: "조건의 모든 키워드" }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "아래 각 줄은 이 페이지가 읽은 프로젝트 TEL-42의 요약에 대해 조건이 충족되기 때문에 그려집니다. 상태는 active, 구성원은 네 명, 속도는 2.5, 태그는 design과 web, 책임자는 매니저, note는 null이며 codename은 없습니다." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: 1명에서 10명 사이가 작업합니다." }
  - { text: "required: the lead has an e-mail.", translation: "required: 책임자에게 이메일이 있습니다." }
  - { text: "properties: the lead is a manager.", translation: "properties: 책임자가 매니저입니다." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: 최소 세 명이 작업합니다." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: 최대 아홉 명이 작업합니다." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: 속도가 2보다 큽니다." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: 속도가 3보다 작습니다." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: 속도가 0.5의 배수입니다." }
  - { text: "type: the status is a string.", translation: "type: 상태가 문자열입니다." }
  - { text: "type, as a list: the note is a string or null.", translation: "type(목록 형태): note가 문자열 또는 null입니다." }
  - { text: "const: the status is active.", translation: "const: 상태가 active입니다." }
  - { text: "enum: the status is active or paused.", translation: "enum: 상태가 active 또는 paused입니다." }
  - { text: "not: the status is not paused.", translation: "not: 상태가 paused가 아닙니다." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code가 TEL 또는 OPS로 시작합니다." }
  - { text: "items: every tag has at least two letters.", translation: "items: 모든 태그가 두 글자 이상입니다." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: 태그가 두 개 이상입니다." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: 태그가 다섯 개 이하입니다." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: 중복된 태그가 없습니다." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code가 세 글자 이상입니다." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code가 열 글자 이하입니다." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code가 문자, 대시, 숫자로 이루어져 있습니다." }
  - { text: Missing and null, translation: "누락과 null" }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "null은 존재하는 값입니다. 누락된 값은 not 아래의 조건을 포함해 어떤 조건도 충족하지 않으므로, 값이 없는지는 부모에서 검사합니다." }
  - { text: The note is present and null., translation: "note가 존재하며 값은 null입니다." }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "그려지지 않음: 누락된 codename은 not을 충족하지 않습니다." }
  - { text: "The project has no codename, tested on the summary.", translation: "프로젝트에 codename이 없습니다(요약에서 검사)." }
  - { text: Query parameters, translation: "쿼리 매개변수" }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "이 리더는 mode, tag 값 목록, 패턴을 따르는 ticket을 선언합니다. 주소에서 빠진 매개변수, 두 번 주어진 단일 매개변수, 선언이 거부하는 값은 누락된 것으로 간주됩니다." }
  - { text: Mode detailed, translation: "detailed 모드" }
  - { text: Two tags, translation: "태그 두 개" }
  - { text: A valid ticket, translation: "유효한 ticket" }
  - { text: A refused ticket, translation: "거부되는 ticket" }
  - { text: Mode given twice, translation: "두 번 지정한 모드" }
  - { text: Clear the query, translation: "쿼리 지우기" }
  - { text: mode is detailed., translation: "mode가 detailed입니다." }
  - { text: There are two tag values or more., translation: "tag 값이 두 개 이상입니다." }
  - { text: The ticket matches its pattern., translation: "ticket이 패턴과 일치합니다." }
  - { text: "No ticket, or one its pattern refuses.", translation: "ticket이 없거나 패턴이 거부하는 값입니다." }
  - { text: Enablement, translation: "활성화 조건" }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "버튼은 폼에 입력된 내용에 대한 조건이 충족될 때만 누를 수 있으며, 충족되지 않는 동안에는 그 이유를 알려 줍니다. 프로젝트에 이미 있는 태그는 거부되며, 태그를 추가하면 위의 줄들이 요약을 다시 읽습니다." }
  - { text: Tag TEL-42, translation: "TEL-42에 태그 추가" }
  - { text: Tag, translation: "태그" }
  - { text: Type a tag of three letters or more., translation: "세 글자 이상의 태그를 입력하세요." }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation: "{$tag} 태그 추가됨: 이제 TEL-42의 태그는 {$count}개입니다."
  - { text: A page's own query, translation: "페이지 자체의 쿼리" }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "이 페이지도 mode를 선언하며, 페이지 자체의 노드가 이를 읽습니다." }
  - { text: The page reads mode as detailed., translation: "페이지가 mode를 detailed로 읽습니다." }

  # Data.
  - { text: A reader and its parameters, translation: "리더와 매개변수" }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "프로젝트는 페이지 주소의 project 매개변수이며, 읽기 요청과 함께 전송됩니다. 매개변수가 없으면 전송되지 않고 라우트는 TEL-42에 대해 응답합니다. 어떤 프로젝트에도 없는 코드를 지정하면 실패 트리가 그려집니다." }
  - { text: A code no project has, translation: "어떤 프로젝트에도 없는 코드" }
  - { text: No project, translation: "프로젝트 없음" }
  - { text: Reading the project…, translation: "프로젝트를 읽는 중…" }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, 책임자: {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "이 리더의 콘텐츠 안에 중첩된 리더가 같은 프로젝트에서 일하는 사람들을 읽습니다." }
  - { text: Working on it, translation: "참여자" }
  - { text: Role, translation: "역할" }
  - { text: E-mail, translation: "이메일" }
  - { text: "No answer · {$code}", translation: "응답 없음 · {$code}" }
  - { text: Readers that fail, translation: "실패하는 리더" }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "자체 실패 트리가 없으면 리더는 오류의 코드와 메시지를 그립니다. 존재하지 않는 프로젝트, 세션 없이 읽은 보호된 라우트, 리더의 모델이 거부하는 응답(하나의 프로젝트로 읽은 프로젝트 목록)이 그 예입니다." }
  - { text: "Never drawn: there is no such project.", translation: "그려지지 않음: 그런 프로젝트가 없습니다." }
  - { text: "Signed in, so this reads: {$name}", translation: "로그인되어 있어 읽은 결과: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "그려지지 않음: 목록은 프로젝트가 아닙니다." }
  - { text: Read again on focus, translation: "포커스 시 다시 읽기" }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "이 리더는 창이 포커스를 되찾을 때마다 서버 시간을 다시 읽습니다. 다른 창으로 전환했다가 돌아와 보세요." }
  - { text: Read at, translation: "읽은 시각" }
  - { text: A sign-in gate, translation: "로그인 게이트" }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "게이트는 세션이 열려 있는지 읽고, 그 안의 요청이 401로 응답할 때마다 다시 읽습니다. 로그인하면 팀 구성원의 세션이 열리며, 팀의 누구에게도 없는 이메일은 해당 필드에서 거부됩니다. 안에서는 보호된 라우트를 읽는 리더가 계정을 보여 줍니다. 세션을 조용히 종료하면 다음 보호된 요청(아래의 확인 또는 포커스)이 거부될 때까지 계정이 화면에 남아 있다가, 그때 게이트가 로그아웃 화면으로 바뀝니다." }
  - { text: You are signed out., translation: "로그아웃되었습니다." }
  - { text: Sign in, translation: "로그인" }
  - { text: "Signed in as {$name}", translation: "로그인한 사용자: {$name}" }
  - { text: "Member since {$since}", translation: "가입일: {$since}" }
  - { text: Check the session, translation: "세션 확인" }
  - { text: End the session quietly, translation: "세션 조용히 종료" }
  - { text: Sign out, translation: "로그아웃" }

  # The labels of the task models.
  - { text: Task, translation: "작업" }
  - { text: Assignee, translation: "담당자" }
  - { text: Priority, translation: "우선순위" }
  - { text: Estimate, translation: "추정치" }
  - { text: Due, translation: "마감일" }
  - { text: Label, translation: "레이블" }
  - { text: Blocked, translation: "차단됨" }
  - { text: To do, translation: "할 일" }
  - { text: In progress, translation: "진행 중" }
  - { text: In review, translation: "검토 중" }
  - { text: Bug, translation: "버그" }
  - { text: Feature, translation: "기능" }
  - { text: Chore, translation: "잡무" }
  - { text: Docs, translation: "문서" }
  - { text: Contact, translation: "연락처" }
  - { text: Project name, translation: "프로젝트 이름" }
  - { text: Brief, translation: "설명" }

  # Tables.
  - { text: Columns from the model, translation: "모델에서 가져온 열" }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "열을 작성하지 않으면 테이블은 행 키를 제외한 모델 속성마다 열을 하나씩 보여 주며, 각 열의 헤더는 속성의 제목이고 유형에 따라 그려집니다. 기본값인 페이지당 25행을 보여 주고, 생성 및 편집 폼은 대화 상자에서 엽니다. 대화 상자는 테이블이 표시 영역을 지정하지 않을 때 사용하는 표시 영역입니다." }
  - { text: "Written columns, sorting and style rules", translation: "작성한 열, 정렬, 스타일 규칙" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "직접 작성한 열이 주어진 순서대로 표시되며, 그중 하나에는 자체 헤더가 있습니다. 컬렉션이 정렬용으로 해당 속성을 나열하는 열은 정렬할 수 있습니다. 차단된 작업의 행은 강조된 빨간색이고, 각 상태 셀에는 고유한 색이 있으며, 어떤 경우에도 해당하지 않는 우선순위는 기본 스타일을 받습니다. 페이지당 8행입니다." }
  - { text: Where, translation: "위치" }
  - { text: Members behind a reference, translation: "참조 너머의 멤버" }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "작업 보드는 각 작업에 담당자와 프로젝트를 중첩하여 응답합니다. 중첩된 멤버의 열은 그 멤버의 제목과 표시 방식을 가져오는데, 이름 있는 형태를 통해, 모델 자체의 정의를 통해, 그리고 가리키는 형태보다 자체 제목이 우선하는 참조를 통해 가져옵니다. 연락처는 메일 링크이고 설명은 페이지 링크입니다." }
  - { text: Filtered by the address, translation: "주소로 필터링" }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "이 테이블은 project 매개변수를 선언하고 모든 요청에 등호 조건으로 보냅니다. 주소에 프로젝트가 없으면 아무것도 읽지 않습니다." }
  - { text: Atlas redesign tasks, translation: "Atlas 리디자인 작업" }
  - { text: Billing migration tasks, translation: "결제 마이그레이션 작업" }
  - { text: Blocked tasks, translation: "차단된 작업" }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "이 테이블은 테이블에 작성된 고정 값으로 필터링되며, 차단된 작업만 나열합니다." }
  - { text: Where a form opens, translation: "폼이 열리는 곳" }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "아래의 각 테이블은 생성 및 편집 폼을 서로 다른 표시 영역에서 엽니다. 저장하면 페이지의 모든 작업 테이블을 다시 읽습니다." }
  - { text: Dialogs, translation: "대화 상자" }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "생성은 비워진 채로 열려 있어 다음 작업을 받는 작은 대화 상자에서 합니다. 편집은 페이지를 막지 않고 바깥 클릭을 무시하는 큰 대화 상자에서 합니다. 저장 후에도 값을 유지하고, 저장하지 않은 입력은 묻지 않고 버리며, 주소의 일부입니다. 각 행은 확인을 거치는 삭제를 제공합니다." }
  - { text: Drawers, translation: "드로어" }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "생성은 시작 가장자리에서 나오는 작은 드로어에서, 편집은 끝 가장자리에서 나오는 닫기 버튼 없는 큰 드로어에서 합니다. 둘 다 저장 후 닫히며, 저장하지 않은 입력을 버리기 전에 묻습니다." }
  - { text: Sheets, translation: "시트" }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "생성은 위에서 나오며 페이지를 막지 않는 시트에서, 편집은 아래에서 나오는 전체 시트에서 하며, 편집 시트는 주소의 일부입니다." }
  - { text: Popovers, translation: "팝오버" }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "생성은 새로 만들기 버튼 옆에 버튼을 중심으로 정렬된 카드에서 하며, 브레이크포인트보다 좁으면 전체 대화 상자가 됩니다. 편집은 행 버튼 아래에 버튼 끝에 맞춰 정렬된 카드에서 하며, 바깥을 클릭해도 닫히지 않고 저장 후에도 열려 있습니다." }
  - { text: In line, translation: "인라인" }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "생성 폼은 행 위에, 편집 폼은 변경하는 행 아래에 열립니다. 브레이크포인트보다 좁으면 생성 폼이 아래에서 나오는 시트에 열립니다." }
  - { text: Panels, translation: "패널" }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "생성은 시작 가장자리의 작은 패널에서 하며, Escape로 닫히지 않습니다. 편집은 끝 가장자리의 큰 패널에서 하며, 주소의 일부이고 옆의 행을 계속 사용할 수 있습니다. 브레이크포인트보다 좁으면 아래에서 나오는 시트가 됩니다." }
  - { text: A page of its own, translation: "별도 페이지" }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "생성과 편집은 하나의 주소 이름 아래에서 페이지 콘텐츠를 대체하므로, 주소는 새 작업 또는 이 키를 가진 작업을 가리키며, 뒤로 가기를 누르면 폼이 닫힙니다. 표시 영역은 한 번 선언되고 둘 다 이를 이름으로 지정합니다." }

  # Filters.
  - { text: Every filter the collection accepts, translation: "컬렉션이 받는 모든 필터" }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "필드를 작성하지 않으면 필터 바는 컬렉션이 받는 필터마다 컨트롤을 하나씩, 그 순서대로 모델 속성에 따라 그립니다. 열거형이나 예/아니요 값에는 목록을, 그 밖에는 입력 상자를 그리며, 범위의 두 경계 위에는 레이블 하나를 둡니다. 테이블 위에 놓이고, 선택은 즉시, 입력한 텍스트는 Enter를 누르면 적용하며, 방문 사이에 아무것도 유지하지 않습니다." }
  - { text: Every control, translation: "모든 컨트롤" }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "필터를 입력하는 모든 방식: 입력 텍스트, 나란히 놓인 옵션, 목록, 입력하는 태그, 슬라이더, 스위치, 하나의 레이블 아래 두 날짜. 프로젝트 필터는 어디에도 그려지지 않으며 프리셋만 이를 설정합니다. 상태는 기본값으로 시작하고, 프리셋은 프리셋들이 지정하는 필터를 설정하고 그 밖에 프리셋들이 지정하는 필터는 지웁니다. 칩이 선택 내용을 요약하며, 값은 주소의 일부입니다. 브레이크포인트보다 좁으면 필터 바가 접히고, 고정된 텍스트 필터는 접힌 영역 밖에 남습니다." }
  - { text: Urgent, translation: "긴급" }
  - { text: Atlas only, translation: "Atlas만" }
  - { text: Stuck, translation: "막힘" }
  - { text: "Beside, as chips, while typing", translation: "옆에, 칩으로, 입력하는 동안" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "컨트롤은 시작 가장자리의 열에 놓입니다. 선택한 필터만 표시됩니다. 필터 바의 목록에서 필터를 추가하고, 제거하면 그 필터가 지워집니다. 각 필터는 값을 보여 주는 칩이며, 칩을 누르면 컨트롤이 열립니다. 입력한 텍스트는 잠시 멈춘 뒤 적용되고, 숫자의 두 경계에는 각각 이후와 이전이라는 캡션이 붙습니다. 선택은 이 브라우저에 방문 간에 유지됩니다. 브레이크포인트보다 좁으면 필터 바가 아래에서 나오는 시트로 열립니다." }
  - { text: "Beside at the end, applied by a button", translation: "끝 쪽 옆에, 버튼으로 적용" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "컨트롤은 끝 가장자리에 놓이고, 변경 사항은 적용을 누를 때까지 기다리지만, 프리셋, 초기화, 요약 칩 제거는 즉시 적용됩니다. 담당자 여러 명은 쉼표로 구분해 입력합니다. 선택은 이 탭에서만 유지되며 새로 고침 후에도 남습니다." }
  - { text: Due by October, translation: "10월까지 마감" }
  - { text: "Folded, starting open", translation: "접기, 펼친 상태로 시작" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "컨트롤은 값이 있는 필터 수를 세는 토글 뒤에 접히며, 펼쳐진 상태로 시작합니다. 고정된 텍스트 필터는 접힌 영역 밖에 남고, 나머지는 필터 바의 목록에서 추가합니다. 상태는 진행 중으로 시작합니다. 제거하면 이 기본값도 지워지고, 초기화하면 다시 돌아옵니다. 값은 주소와 이 브라우저 모두에 유지되며 주소가 우선하고, 선택한 접힘 상태도 기억됩니다." }
  - { text: "Folded, starting closed", translation: "접기, 접힌 상태로 시작" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "처음에는 접혀 있습니다. 고정된 텍스트 필터, 적용, 초기화는 접힌 영역 밖에 남습니다. 레이블은 변경하기 전까지 기본값인 버그로 시작하며, 초기화하면 기본값이 돌아옵니다." }
  - { text: In a dialog, translation: "대화 상자에서" }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "컨트롤은 값이 있는 필터 수를 세는 버튼에서 작은 대화 상자로 열리고, 완료를 누르면 닫힙니다. 열린 대화 상자는 주소의 일부이므로 링크로 열 수 있습니다. 고정된 텍스트 필터는 버튼 옆에 남고, 칩이 선택 내용을 요약합니다." }
  - { text: In a drawer, translation: "드로어에서" }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "컨트롤은 시작 가장자리에서 나오는 드로어에 열리며, 바깥을 클릭해도 닫히지 않습니다. 입력한 값은 잠시 멈춘 뒤 적용됩니다." }
  - { text: In a popover, translation: "팝오버에서" }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "컨트롤은 버튼 아래에 버튼 끝에 맞춰 정렬된 카드에 열리며, 브레이크포인트보다 좁으면 아래에서 나오는 시트에 열립니다." }

