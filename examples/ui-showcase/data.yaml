  lead_role: { type: text, nullable: false }
  lead_email: { type: text, nullable: false }
  reviewer_emails: { type: text }
  sponsor_email: { type: text, nullable: false }
  helper_emails: { type: text }
  period_from: { type: text, nullable: false }
  period_to: { type: text, nullable: false }
  on_site: { type: integer, nullable: false, default: 0 }
  site: { type: text }
  notes: { type: text }
seeds:
  key: [ seed_key ]
  rows:
    - { seed_key: B01, project_code: OPS-7, lead_role: engineer, lead_email: liam@northwind.example, reviewer_emails: '["ada@northwind.example"]', sponsor_email: ada@northwind.example, period_from: "2026-11-01", period_to: "2026-11-30" }
