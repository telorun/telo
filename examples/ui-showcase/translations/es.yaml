  # Forms.
  - { text: Every control from the model, translation: Cada control del modelo }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "Sin campos escritos, el formulario dibuja un control por propiedad, elegido según su esquema: un cuadro de texto, una lista para una enumeración, cuadros numéricos, una fecha, una fecha y hora, una hora, un cuadro de varias líneas para un documento, una casilla de verificación, opciones una al lado de otra para una lista de una enumeración y tags escritos para una lista de palabras. Una descripción es una indicación bajo su campo, y un valor predeterminado, el valor inicial." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "Cada campo se comprueba con el modelo en cuanto se ha tocado: la longitud del título, el número de personas, el presupuesto en pasos de 50, la ortografía de las palabras clave. El servidor rechaza un título que ya tiene otra solicitud, y su respuesta aparece en el título. Lo que se escribe se guarda en la dirección y en este navegador — todo salvo el código de acceso, que el modelo marca como de solo escritura." }
  - { text: Each control chosen by hand, translation: Cada control elegido a mano }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "La misma solicitud con un control escrito para cada campo: el título con su control derivado, el tipo como opciones una al lado de otra, los canales como una lista de selección múltiple, el número de personas en un control deslizante, la urgencia como interruptor y las palabras clave como tags. Lo que se escribe se guarda solo para esta pestaña." }
  - { text: Requests received, translation: Solicitudes recibidas }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "Las últimas solicitudes que enviaron los dos formularios, releídas tras cada guardado." }
  - { text: "Choices, pickers and dates", translation: "Opciones, selectores y fechas" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "Reserva de personas para un proyecto. El proyecto se elige de una lista leída de la colección de proyectos, cada opción con su código como indicación. El responsable se elige en un cuadro de diálogo, buscando por nombre, entre los miembros activos del rol elegido encima; elegir otro rol vuelve a leer las opciones y conserva al responsable solo si sigue encajando. Los revisores se eligen en un cajón, varios a la vez, y el patrocinador en una ventana emergente; el patrocinador empieza con un correo electrónico predeterminado, mostrado como el nombre de la persona mediante una consulta. Los colaboradores se ofrecen uno al lado de otro, de tres en tres, con Más para el resto. Una persona elegida enlaza a su correo electrónico." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "El periodo son dos fechas con rangos predefinidos, con semanas que empiezan el domingo, que empieza en el mes que viene y avisa si pasa de tres meses. El servidor rechaza un periodo que termina antes de empezar o que supera un año, y su respuesta aparece en el periodo. Las personas en torno al responsable se muestran una vez elegido un responsable, y la dirección del lugar solo para trabajo presencial." }
  - { text: The project, translation: El proyecto }
  - { text: "Which project, and who leads the work.", translation: "Qué proyecto y quién dirige el trabajo." }
  - { text: Around the lead, translation: En torno al responsable }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "Quién revisa el trabajo, quién lo patrocina y quién ayuda." }
  - { text: When and where, translation: Cuándo y dónde }
  - { text: Tomorrow, translation: Mañana }
  - { text: Next week, translation: La semana que viene }
  - { text: This month, translation: Este mes }
  - { text: Next month, translation: El mes que viene }
  - { text: Next quarter, translation: El trimestre que viene }
  - { text: Next year, translation: El año que viene }
  - { text: Bookings, translation: Reservas }
  - { text: "The latest bookings, read again after every save.", translation: "Las últimas reservas, releídas tras cada guardado." }

  # The labels of the actions page's models.
  - { text: Only these labels, translation: Solo estas etiquetas }
  - { text: Count blocked tasks, translation: Contar tareas bloqueadas }
  - { text: Hours a week, translation: Horas por semana }
  - { text: Done by, translation: Terminado para }
