units:
  modules/one-time: Added
body: "New module: single-use links and typed codes over a durable key/value store.
  OneTime.Links and OneTime.Codes hold a set of tokens with an expiry and a waiting
  period before the same subject is issued another; OneTime.Issue, RedeemLink,
  RedeemCode and Revoke issue, open once, check a typed code with a bounded number of
  wrong guesses, and withdraw a token. A token can be bound to a holder, carries typed
  data to its redemption, and a refused issue or redemption is an outcome rather than an
  error. A failing store is ERR_ONE_TIME_STORE_UNAVAILABLE, a write that keeps losing
  the race is ERR_ONE_TIME_CONTENDED, and two sets claiming one name on one store are
  ONE_TIME_NAME_DUPLICATE at check and ERR_ONE_TIME_NAME_DUPLICATE at start."
