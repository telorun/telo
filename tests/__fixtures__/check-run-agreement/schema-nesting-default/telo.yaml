# An application variable whose schema refers to itself without descending into
# the value, so validating its default never finishes.
kind: Telo.Application
metadata: { name: SchemaNestingDefault, version: 1.0.0 }
variables:
  tree: { env: TREE, type: object, $ref: "#", default: { leaf: 1 } }
imports:
  Worker:
    source: ./worker
    variables:
      tree: !cel "variables.tree"
