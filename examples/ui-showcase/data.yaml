---
# Work asked of the studio, sent by the forms page. A list it holds is kept as
# JSON text; the site access code is stored and never read back.
kind: SQLite.Table
metadata: { name: requestsTable }
table: requests
columns:
  id: { type: integer, primaryKey: true, identity: always }
  title: { type: text, nullable: false, unique: true }
  kind: { type: text, nullable: false, default: design }
  seats: { type: integer }
  budget: { type: real }
  start_on: { type: text }
  kickoff_at: { type: text }
  call_at: { type: text }
  details: { type: text }
  urgent: { type: integer, nullable: false, default: 0 }
  channels: { type: text }
  keywords: { type: text }
  access_code: { type: text }
  received_at: { type: text, nullable: false, defaultExpression: "strftime('%Y-%m-%dT%H:%M:%SZ', 'now')" }
seeds:
  key: [ title ]
  rows:
    - { title: Refresh the logo, kind: design, seats: 1, budget: 1500, start_on: "2026-11-02", channels: '["email"]', keywords: '["brand","logo"]', received_at: "2026-10-19T08:30:00Z" }
    - { title: Write the API guide, kind: write, seats: 2, start_on: "2026-11-16", urgent: 1, channels: '["email","chat"]', received_at: "2026-10-20T14:05:00Z" }
