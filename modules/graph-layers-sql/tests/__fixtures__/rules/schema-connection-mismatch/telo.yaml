# A store on one connection naming a schema on another.
kind: Telo.Library
metadata:
  name: SchemaConnectionMismatch
include:
  - ../../layered-model.yaml
imports:
  Layers: ../../../../../graph-layers-current-sqlite
  SQLite: ../../../../../sqlite
exports:
  resources: [bad]
---
kind: SQLite.Connection
metadata: { name: other }
file: ":memory:"
---
kind: Layers.Store
metadata: { name: bad }
connection: !ref other
schema: !ref appSchema
layer: lost
nodes: [!ref person]
