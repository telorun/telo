  errors: []
  runFails: "[ERR_DATA_MODEL_FACET_UNKNOWN_PROPERTY] RuntimeError: DataModel.Collection 'collection': 'query.facets[1]' facets by 'status', which 'model' does not declare"
---
kind: Assert.Manifest
metadata: { name: facetUnsupported }
source: ./__fixtures__/refusals/facet-unsupported/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "DataModel.Collection/collection at 'query.facets[1]': facets a property that holds an object or a list"
