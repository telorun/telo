    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/chr.traineddata.gz:
        { upstream: chr, member: package/4.0.0_best_int/chr.traineddata.gz, sha256: bdaabd80b88c141382b51e50463825d50afe02b5cd727412cf2a62e9af3fc36f, executable: false }
