kind: Telo.Library
metadata:
  name: UrlShortenerDatabase
  version: 1.0.0
  categories: [ Storage ]
  description: |
    Owns the shared SQLite connection and exports it as a singleton. Every
    consumer (the app's migrations, the redirect library, the admin library)
    references the one `connection` instance, so they all read and write the
    same database.
requires:
  # 0.98.0: `dbFile` is a `Telo.HostPath`, which an older analyzer rejects as
  # X_TELO_TYPE_UNKNOWN.
  telo: ">=0.98.0"
variables:
  dbFile:
    type: string
    x-telo-type: Telo.HostPath
    description: Path to the SQLite database file.
imports:
  SQLite: ../../../modules/sqlite
exports:
  resources:
    - connection
    - links
    - clicks
---
kind: SQLite.Connection
metadata: { name: connection }
file: !cel "variables.dbFile"
---
kind: SQLite.Table
metadata: { name: links }
table: links
columns:
  code: { type: text, primaryKey: true }
  target: { type: text, nullable: false }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Table
metadata: { name: clicks }
table: clicks
columns:
  id: { type: integer, primaryKey: true, identity: always }
  code: { type: text, nullable: false }
  ip: { type: text }
  clicked_at: { type: text, defaultExpression: "datetime('now')" }
