kind: Telo.Application
metadata:
  name: RunScopeOpeningInputs
  version: 1.0.0
  description: |
    A `with:` member's creation-time fields read the inputs of the call that
    opened the scope: two concurrent calls each send their own key upstream, a
    sensitive one is redacted in the member's configuration, its dispatches and
    the opening dispatch's own result, and a boot run reads its contract's
    defaults in its steps and its scope alike.
imports:
  Run: ../
  Http: ../../http-client
  Server: ../../http-server
  Assert: ../../assert
targets:
  - !ref concurrentKeys
  - !ref bootDefaults
  - !ref expectRedacted
---
kind: Server.Api
metadata: { name: upstreamApi }
routes:
  - request:
      path: /echo
      method: GET
      schema: { headers: { type: object, properties: { x-api-key: { type: string } } } }
    returns:
      - status: 200
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            body: { key: !cel "request.headers['x-api-key']" }
---
kind: Telo.Sequence
metadata: { name: byok }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [apiKey, prompt]
    properties: { apiKey: { type: string, x-telo-sensitive: true }, prompt: { type: string } }
with:
  - kind: Http.ApiKeyHeader
    metadata: { name: credential }
    header: x-api-key
    key: !cel "inputs.apiKey"
  - kind: Http.Client
    metadata: { name: upstream }
    baseUrl: http://127.0.0.1:8961
    credential: !ref credential
  - kind: Http.Request
    metadata: { name: model }
    client: !ref upstream
    url: /echo
steps:
  - name: call
    invoke: !ref model
  - name: forwarded
    invoke: !ref forward
    inputs:
      text: !interpolate "Bearer ${{ inputs.apiKey }}"
outputs:
  sent: !cel "steps.call.result.body.key"
  prompt: !cel "inputs.prompt"
---
# A module-level resource the sequence hands the key to: its dispatch is issued
# inside the run, so its trace payload is redacted by the run's set.
kind: Run.Value
metadata: { name: forward }
inputType:
  kind: Telo.JsonSchema
  schema: { type: object, required: [text], properties: { text: { type: string } } }
value: !cel "inputs.text"
---
kind: Telo.Sequence
metadata: { name: concurrentKeys }
with:
  - kind: Server.Server
    metadata: { name: srv }
    listen: { port: 8961 }
    mounts:
      - { path: /, mount: !ref upstreamApi }
targets:
  - !ref srv
steps:
  - name: both
    invoke:
      kind: Run.Projection
      collection: !cel "['key-alpha', 'key-bravo']"
      concurrency: 2
      steps:
        - name: chat
          invoke: !ref byok
          inputs: { apiKey: !cel "item", prompt: !cel "'hello ' + item" }
      outputs:
        sent: !cel "steps.chat.result.sent"
        prompt: !cel "steps.chat.result.prompt"
  - name: eachSentItsOwn
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.both.result"
      expected:
        - { sent: key-alpha, prompt: hello key-alpha }
        - { sent: key-bravo, prompt: hello key-bravo }
---
kind: Telo.Sequence
metadata: { name: bootDefaults }
inputType:
  kind: Telo.JsonSchema
  schema: { type: object, properties: { greeting: { type: string, default: hi } } }
with:
  - kind: Server.Server
    metadata: { name: echoSrv }
    listen: { port: 8962 }
    mounts:
      - { path: /, mount: !ref upstreamApi }
  - kind: Http.ApiKeyHeader
    metadata: { name: greetingCredential }
    header: x-api-key
    key: !cel "inputs.greeting"
  - kind: Http.Client
    metadata: { name: greetingClient }
    baseUrl: http://127.0.0.1:8962
    credential: !ref greetingCredential
  - kind: Http.Request
    metadata: { name: greetingRequest }
    client: !ref greetingClient
    url: /echo
targets:
  - !ref echoSrv
steps:
  - name: call
    invoke: !ref greetingRequest
  - name: readsDefaults
    invoke: { kind: Assert.Equals }
    inputs:
      actual: { step: !cel "inputs.greeting", scope: !cel "steps.call.result.body.key" }
      expected: { step: hi, scope: hi }
---
kind: Assert.Events
metadata: { name: expectRedacted }
filter:
  - { type: "*" }
expect:
  - event: Http.ApiKeyHeader.credential.Created
    payload: { properties: { header: x-api-key, key: "[redacted]" } }
  - { event: model.Invoked, payload: { outputs: { body: { key: "[redacted]" } } } }
  - event: forward.Invoked
    payload: { inputs: { text: "Bearer [redacted]" }, outputs: "Bearer [redacted]" }
  - event: byok.Invoked
    payload: { inputs: { apiKey: "[redacted]" }, outputs: { sent: "[redacted]" } }
  - event: Http.ApiKeyHeader.credential.Created
    payload: { properties: { key: key-alpha } }
    times: 0
  - event: model.Invoked
    payload: { outputs: { body: { key: key-bravo } } }
    times: 0
  - event: forward.Invoked
    payload: { inputs: { text: Bearer key-alpha } }
    times: 0
  - { event: byok.Invoked, payload: { outputs: { sent: key-bravo } }, times: 0 }
