name: Deploy GitHub Pages

# The docs site, built from a release tag and served by the branch's Publish run.
#
#   candidate   builds `site-next.tar.gz` (base URL `/next/`, with a banner naming
#               the release it previews) and attaches it to the pre-release.
#   final/patch builds `site-root.tar.gz` (base URL `/`) and attaches it to the
#               release.
#
# The base URL is fixed at build, so a tarball is the site as it is served. The
# deploy then composes the newest published final's `site-root.tar.gz` at `/` and,
# while a candidate of a later release is open, that candidate's build at
# `/next/` (`scripts/release-site.mjs`); a final or patch deploys `/` alone, which
# is how `/next/` goes away. Nothing deploys on a push to main: a docs fix reaches
# `/next/` with the next candidate and `/` with the next final or patch.
#
# BOOTSTRAP. `workflow_dispatch` with a `tag` builds that release's site from the
# tag's checkout with THIS file's steps (run it from main) and attaches the
# tarball, deploying nothing unless `deploy` is set, which composes and deploys it
# as a release's own run would (the recovery for a release whose deploy failed).
# It exists for the first cut: v0.84.2 predates these
# workflows and carries no `site-root.tar.gz`, so one dispatch at `v0.84.2` gives
# the first candidate's deploy a `/` to compose. The tag's tree may predate the
# `TELO_SITE_*` variables, so `BASE_URL` is set as well.

on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag to build the site from (v0.85.0-rc.1, v0.85.0).'
        type: string
        required: true
      deploy:
        description: 'Deploy the composed site after attaching the build.'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the site of (bootstrap: v0.84.2).'
        type: string
        required: true
      deploy:
        description: 'Deploy the composed site after attaching the build (recovers a release whose deploy failed).'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: write # zizmor: ignore[excessive-permissions] attaches the site build to the release
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      asset: ${{ steps.plan.outputs.asset }}
    steps:
      # The tooling comes from the workflow's own commit; the source from the tag.
      # They are one commit when Publish calls this.
      - name: Checkout the tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tooling
          persist-credentials: false

      - name: Install the release scripts' dependencies
        working-directory: tooling
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      - name: Plan the build
        id: plan
        working-directory: tooling
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/release-site.mjs build --tag "$TAG"

      - name: Checkout ${{ inputs.tag }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          path: source
          # Full history: the sitemap derives each page's <lastmod> from the
          # file's git log, which a shallow clone does not carry.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: source/package.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: source
        run: pnpm --filter "@telorun/pages..." build
        env:
          TELO_SITE_TAG: ${{ inputs.tag }}
          TELO_SITE_BASE_URL: ${{ steps.plan.outputs.base-url }}
          TELO_SITE_PREVIEW: ${{ steps.plan.outputs.preview }}
          # Read by a tree older than the variables above (the bootstrap build).
          BASE_URL: ${{ steps.plan.outputs.base-url }}
          # Set only here: this is the build that becomes telo.run, so no local
          # or preview build can report into the production Plausible site.
          PLAUSIBLE_DOMAIN: telo.run

      - name: Pack the site
        env:
          ASSET: ${{ steps.plan.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          tar -czf "$RUNNER_TEMP/site/$ASSET" -C source/pages/build .

      - name: Attach the site to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ steps.plan.outputs.asset }}
        run: node tooling/scripts/release-assets.mjs "$TAG" "$RUNNER_TEMP/site/$ASSET"

      - name: Keep the build for the deploy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: ${{ runner.temp }}/site/${{ steps.plan.outputs.asset }}
          if-no-files-found: error

  deploy:
    name: Deploy the site
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # zizmor: ignore[excessive-permissions] Pages deployment
      id-token: write # zizmor: ignore[excessive-permissions] Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download this run's build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: own

      - name: Install the release scripts' dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      - name: Compose / and /next/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          VERSION: ${{ needs.build.outputs.version }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -euo pipefail
          own_flag=--own-root
          [ "$CHANNEL" = "candidate" ] && own_flag=--own-next
          node scripts/release-site.mjs compose --channel "$CHANNEL" --version "$VERSION" --out site "$own_flag" "own/$ASSET"
          rm -rf site/.download

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
