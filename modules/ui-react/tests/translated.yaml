kind: Telo.Application
metadata:
  name: UiReactTranslatedTest
  version: 1.0.0
  description: |
    An application with translations serves each request in the language the
    server negotiated for it (Accept-Language, a cookie or a query): the
    documents carry the translated message and its tag, a text
    with context is translated by its context, an enumeration's labels are
    translated while its values stay as written, ui's own texts arrive as
    the keyed set the App names, in the language served, and the response
    says `Content-Language` and `Vary: Accept-Language` plus the headers the
    negotiation reads. An application serving English only sends neither and
    still shows ui's English texts. A catalog of ui's own texts overrides
    them key by key, in English as in Polish, leaving a text the author
    wrote with the same words untouched. A thousand different Accept-Language
    values produce no more documents than the application serves languages. The layout's header
    nodes travel in the layout document, translated like the rest of it,
    with a composite provided, a menu's text and items translated, and a node
    and a menu item delivered per request; the layout document varies by the
    whole request.
imports: { App: ../../app, HttpClient: ../../http-client, Assert: ../../assert }
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: fixture }
    source: ./__fixtures__/translated/telo.yaml
    ports: { http: 8132, cookie: 8133 }
  - kind: App.Instance
    metadata: { name: english }
    source: ./__fixtures__/english-only/telo.yaml
    ports: { http: 8134 }
  - kind: App.Instance
    metadata: { name: keyed }
    source: ./__fixtures__/keyed-texts/telo.yaml
    ports: { http: 8135 }
targets:
  - !ref fixture
  - !ref english
  - !ref keyed
steps:
  - name: polishApp
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8132/_telo/ui/app
      headers: { accept-language: "pl-PL, en;q=0.5" }
  - name: englishApp
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8132/_telo/ui/app
      headers: { accept-language: en-GB }
  - name: staffApp
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8132/_telo/ui/app
      headers: { accept-language: en-GB, x-role: staff }
  - name: polishLayout
    invoke: { kind: HttpClient.Request, headers: { accept-language: "pl-PL, en;q=0.5" } }
    inputs:
      url: !cel "'http://127.0.0.1:8132/_telo/ui/layout?id=' + steps.polishApp.result.body.layout"
  - name: englishLayout
    invoke: { kind: HttpClient.Request, headers: { accept-language: en-GB } }
    inputs:
      url: !cel "'http://127.0.0.1:8132/_telo/ui/layout?id=' + steps.englishApp.result.body.layout"
  - name: staffLayout
    invoke: { kind: HttpClient.Request, headers: { accept-language: en-GB, x-role: staff } }
    inputs:
      url: !cel "'http://127.0.0.1:8132/_telo/ui/layout?id=' + steps.staffApp.result.body.layout"
  - name: polishPage
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8132/_telo/ui/page?path=/
      headers: { accept-language: pl }
  - name: germanApp
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8132/_telo/ui/app
      headers: { accept-language: de }
  - name: queryApp
    invoke: { kind: HttpClient.Request, url: "http://127.0.0.1:8132/_telo/ui/app?lang=pl" }
  - name: polishShell
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8132/
      headers: { accept-language: pl }
      responseType: text
  - name: cookieApp
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8133/_telo/ui/app
      headers: { cookie: lang=pl }
  - name: englishOnlyApp
    invoke: { kind: HttpClient.Request, url: "http://127.0.0.1:8134/_telo/ui/app" }
  - name: englishOnlyShell
    invoke: { kind: HttpClient.Request, url: "http://127.0.0.1:8134/", responseType: text }
  - name: keyedPolishApp
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8135/_telo/ui/app
      headers: { accept-language: pl }
  - name: keyedGermanApp
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8135/_telo/ui/app
      headers: { accept-language: de }
  - name: keyedPolishPage
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8135/_telo/ui/page?path=/
      headers: { accept-language: pl }
  - name: keyedGermanPage
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8135/_telo/ui/page?path=/
      headers: { accept-language: de }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        polish:
          lang: !cel "steps.polishApp.result.body.lang"
          title: !cel "steps.polishApp.result.body.title"
          vary: !cel "steps.polishApp.result.headers['vary']"
          contentLanguage: !cel "steps.polishApp.result.headers['content-language']"
          own: !cel "steps.polishApp.result.body.texts.own"
          save: !cel "steps.polishApp.result.body.texts.sets['Ui.Translations'].save"
          header: !cel "steps.polishLayout.result.body.header"
          layoutVary: !cel "steps.polishLayout.result.headers['vary']"
        english:
          lang: !cel "steps.englishApp.result.body.lang"
          title: !cel "steps.englishApp.result.body.title"
          save: !cel "steps.englishApp.result.body.texts.sets['Ui.Translations'].save"
          header: !cel "steps.englishLayout.result.body.header"
        staffHeader: !cel "steps.staffLayout.result.body.header"
        etagsDiffer: !cel "steps.polishApp.result.headers['etag'] != steps.englishApp.result.headers['etag']"
        page:
          lang: !cel "steps.polishPage.result.body.lang"
          heading: !cel "steps.polishPage.result.body.children[0].text"
          bound: !cel "steps.polishPage.result.body.children[1].text"
          label: !cel "steps.polishPage.result.body.children[2].fields[0].label"
          states: !cel "steps.polishPage.result.body.children[2].fields[1].labels"
          badge: !cel "steps.polishPage.result.body.children[3].text"
        german:
          lang: !cel "steps.germanApp.result.body.lang"
          title: !cel "steps.germanApp.result.body.title"
          contentLanguage: !cel "steps.germanApp.result.headers['content-language']"
        query:
          lang: !cel "steps.queryApp.result.body.lang"
          vary: !cel "steps.queryApp.result.headers['vary']"
          contentLanguage: !cel "steps.queryApp.result.headers['content-language']"
        shell:
          lang: !cel "steps.polishShell.result.body.contains('<html lang=\"pl\">')"
          contentLanguage: !cel "steps.polishShell.result.headers['content-language']"
        cookie:
          lang: !cel "steps.cookieApp.result.body.lang"
          vary: !cel "steps.cookieApp.result.headers['vary']"
        englishOnly:
          lang: !cel "steps.englishOnlyApp.result.body.lang"
          save: !cel "steps.englishOnlyApp.result.body.texts.sets['Ui.Translations'].save"
          varies: !cel "'vary' in steps.englishOnlyApp.result.headers"
          contentLanguage: !cel "'content-language' in steps.englishOnlyApp.result.headers"
          shellVaries: !cel "'vary' in steps.englishOnlyShell.result.headers"
        keyed:
          polishSave: !cel "steps.keyedPolishApp.result.body.texts.sets['Ui.Translations'].save"
          polishCancel: !cel "steps.keyedPolishApp.result.body.texts.sets['Ui.Translations'].cancel"
          germanLang: !cel "steps.keyedGermanApp.result.body.lang"
          germanSave: !cel "steps.keyedGermanApp.result.body.texts.sets['Ui.Translations'].save"
          polishAuthorSave: !cel "steps.keyedPolishPage.result.body.children[0].text"
          germanAuthorSave: !cel "steps.keyedGermanPage.result.body.children[0].text"
      expected:
        polish:
          lang: pl
          title: { lang: pl, message: [Faktury] }
          vary: Accept-Language
          contentLanguage: pl
          own: Ui.Translations
          save: { lang: pl, message: [Zapisz] }
          layoutVary: "*"
          header:
            - { type: image, fill: false, src: /logo.svg, alt: { lang: pl, message: [Faktury] } }
            - { type: link, fill: false, text: { lang: pl, message: [Pomoc] }, href: { path: { value: /help }, pathParams: {}, queryParams: {} }, button: null }
            - type: menu
              fill: false
              text: { lang: pl, message: [Pomoc] }
              items: [ { type: link, fill: false, text: { lang: pl, message: [Pomoc] }, href: { path: { value: /help }, pathParams: {}, queryParams: {} }, button: null, style: strong } ]
        english:
          lang: en
          title: { lang: en, message: [Invoices] }
          save: { lang: en, message: [Save] }
          header:
            - { type: image, fill: false, src: /logo.svg, alt: { lang: en, message: [Invoices] } }
            - { type: link, fill: false, text: { lang: en, message: [Help] }, href: { path: { value: /help }, pathParams: {}, queryParams: {} }, button: null }
            - type: menu
              fill: false
              text: { lang: en, message: [Help] }
              items: [ { type: link, fill: false, text: { lang: en, message: [Help] }, href: { path: { value: /help }, pathParams: {}, queryParams: {} }, button: null, style: strong } ]
        staffHeader:
          - { type: image, fill: false, src: /logo.svg, alt: { lang: en, message: [Invoices] } }
          - { type: link, fill: false, text: { lang: en, message: [Help] }, href: { path: { value: /help }, pathParams: {}, queryParams: {} }, button: null }
          - type: menu
            fill: false
            text: { lang: en, message: [Help] }
            items:
              - { type: link, fill: false, text: { lang: en, message: [Help] }, href: { path: { value: /help }, pathParams: {}, queryParams: {} }, button: null, style: strong }
              - { type: link, fill: false, text: { lang: en, message: [Staff] }, href: { path: { value: /staff }, pathParams: {}, queryParams: {} }, button: null }
          - { type: badge, fill: false, text: { lang: en, message: [Staff] } }
        etagsDiffer: true
        page:
          lang: pl
          heading: { lang: pl, message: [Nieopłacone faktury] }
          bound:
            lang: pl
            message:
              plural: n
              cases:
                one: [{ placeholder: n }, " nieopłacona pozycja"]
                few: [{ placeholder: n }, " nieopłacone pozycje"]
                other: [{ placeholder: n }, " nieopłaconych pozycji"]
            values: { n: { value: 3 } }
          label: { lang: pl, message: [Numer] }
          states:
            - { value: open, label: { lang: pl, message: [Otwarta] } }
            - { value: paid, label: { lang: pl, message: [Opłacona] } }
          badge: { lang: pl, message: [Otwarte] }
        german: { lang: en, title: { lang: en, message: [Invoices] }, contentLanguage: en }
        query: { lang: pl, vary: "Accept-Language", contentLanguage: pl }
        shell: { lang: true, contentLanguage: pl }
        cookie: { lang: pl, vary: "Accept-Language, Cookie" }
        englishOnly:
          lang: en
          save: { lang: en, message: [Save] }
          varies: false
          contentLanguage: false
          shellVaries: false
        keyed:
          polishSave: { lang: pl, message: [Zachowaj] }
          polishCancel: { lang: pl, message: [Anuluj] }
          germanLang: en
          germanSave: { lang: en, message: [Submit] }
          polishAuthorSave: { lang: en, message: [Save] }
          germanAuthorSave: { lang: en, message: [Save] }
  # A thousand different Accept-Language values, half asking for Polish and
  # half for a language the application lacks: two documents between them.
  - name: seen
    value: { n: !cel "0", etags: [] }
  - name: ask
    while: !cel "steps.seen.result.n < 1000"
    do:
      - name: asked
        invoke: { kind: HttpClient.Request, url: http://127.0.0.1:8132/_telo/ui/app }
        inputs:
          headers:
            accept-language: !cel "(steps.seen.result.n % 2 == 0 ? 'pl-x-v' : 'de-x-v') + string(steps.seen.result.n)"
      - name: seen
        value:
          n: !cel "steps.seen.result.n + 1"
          etags: !cel "steps.asked.result.headers['etag'] in steps.seen.result.etags ? steps.seen.result.etags : steps.seen.result.etags + [steps.asked.result.headers['etag']]"
  - name: verifyDistinct
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "size(steps.seen.result.etags)"
      expected: 2
