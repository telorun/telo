kind: Telo.Application
metadata:
  name: ContextFloorAgent
  version: 1.0.0
  description: |
    Test fixture: stands the agent up with `maxContextTokens: 7` and calls its
    health route; the agent's declared floor refuses the value before anything
    starts.
imports:
  App: ../../../../../../modules/app
  HttpClient: oci://ghcr.io/telorun/http-client@0.23.1#sha256-WXBltAPrw5QZ98n7u5uFP7Romdhk4ACQTZkhzNNmFOY
  Run: oci://ghcr.io/telorun/run@0.30.0#sha256-xce3zcKQZYXAuMPQqUW4R0avisqZWYowLDLeaP7wXkc
variables:
  scratch:
    env: CHAT_TEST_CONTEXT_FLOOR_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/context-floor
targets:
  - !ref test
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: agent }
    source: ../../../../telo.yaml
    ports: { http: 18599 }
    needs:
      agentState: { path: !cel "variables.scratch.joinPath('agent-state')" }
    variables:
      workspaceDir: !cel "variables.scratch.joinPath('workspace')"
      modelEndpoint: http://127.0.0.1:18598/v1
      maxContextTokens: 7
    secrets:
      anthropicApiKey: stub-key
targets: [ !ref agent ]
steps:
  - name: health
    invoke:
      kind: HttpClient.Request
      client: { kind: HttpClient.Client }
      url: http://127.0.0.1:18599/health
      method: GET
