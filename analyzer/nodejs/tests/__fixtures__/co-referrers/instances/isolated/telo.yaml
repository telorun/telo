# Announces its own topic; each import of it is an instance of its own.
kind: Telo.Library
metadata: { name: IsolatedAnnouncer }
imports: { Co: ../../kinds }
exports: { resources: [Joined, announce] }
---
kind: Co.Topic
metadata: { name: Joined }
schema: { type: object, required: [userId], properties: { userId: { type: string } } }
---
kind: Co.Announce
metadata: { name: announce }
topic: !ref Joined
