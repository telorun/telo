modules:
  modules/ai: Added
body: "Tool calls of one model response now run concurrently, up to `maxParallelTools`
  (default 4). Results are reported as they complete; the model still receives them in
  call order. An agent whose tools depend on each other's side effects within one
  response sets `maxParallelTools: 1`. Under `onToolError: throw` the first failure
  cancels the calls still running. A streaming model may report a tool call's arguments
  as they are written: the new `tool-call-delta` part on `Ai.StreamPart` and
  `Ai.AgentStreamPart` carries `toolCallId`, `toolName` and `delta`, ahead of the whole
  `tool-call`. The model implementation assigns the id; a delta naming none is
  `ERR_CONTRACT_VIOLATION`."
