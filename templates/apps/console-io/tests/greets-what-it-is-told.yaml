kind: Telo.Application
metadata:
  name: ConsoleIoTemplateTest
  version: 1.0.0
  description: >-
    Answers the template's question and checks the greeting it builds. A template is
    copied verbatim, so the one thing it does is the one thing worth running.
imports:
  App: ../../../../modules/app
  Channel: ../../../../modules/channel
  Run: ../../../../modules/run
  Assert: ../../../../modules/assert
targets:
  - !ref app
  - !ref test
---
kind: App.Instance
metadata: { name: app }
source: ../telo.yaml
# It blocks on its first prompt, so its targets never all finish dispatching.
awaitStart: false
---
kind: Channel.ReadUntil
metadata: { name: read }
channel: !ref app
timeout: "10s"
---
kind: Channel.SendLine
metadata: { name: send }
channel: !ref app
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: question
    invoke: !ref read
    inputs: { until: "What's your name? " }
  - name: answer
    invoke: !ref send
    inputs: { text: Ada }
  - name: greeting
    invoke: !ref read
    inputs: { until: "\n" }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.greeting.result.text"
      expected: "Hello, Ada! Welcome to Telo.\n"
