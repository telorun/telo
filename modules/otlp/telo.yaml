kind: Telo.Library
metadata:
  name: otlp
  version: 0.3.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Observability]
  description: >-
    Ships an application's structured log records to an OpenTelemetry collector over
    OTLP, batched and flushed on an interval, with resource attributes such as the
    service name attached to every batch. The route from local logging to any
    OTel-compatible observability backend.
exports:
  kinds:
    - Sink
---
kind: Telo.Definition
metadata:
  name: Sink
  description: >-
    A destination for log records that batches them and sends them to an
    OpenTelemetry collector, filtered by minimum severity and bounded by a buffer with
    a drop policy. Delivery is a network round-trip, so a flush cannot be awaited
    synchronously and records held only here may be lost if the process dies at once.
capability: Telo.Sink
extends: Telo.LogSink
controllers:
  - pkg:telo/local/js?path=./nodejs/otlp-sink-controller.mjs&local_path=./nodejs/src/otlp-sink-controller.ts
schema:
  type: object
  properties:
    endpoint:
      title: Collector endpoint
      description: Full URL of the collector's OTLP/JSON logs endpoint.
      type: string
      x-telo-eval: compile
    headers:
      title: Headers
      description: >-
        Extra request headers, typically carrying credentials. Read these from
        `secrets:` so their values are redacted from Telo's own log records.
      type: object
      additionalProperties:
        type: string
      x-telo-eval: compile
    resourceAttributes:
      title: Resource attributes
      description: >-
        OTel resource-level attributes attached to every exported batch.
        `service.name` is required by OTLP; when unset it falls back to
        `unknown_service:<executable>`.
      type: object
      x-telo-eval: compile
    timeout:
      title: Request timeout
      description: How long a single export request may take before it is aborted.
      type: string
      pattern: "^\\s*\\d+(\\.\\d+)?\\s*(ms|s|m|h)\\s*$"
      x-telo-eval: compile
    level:
      title: Level
      description: Minimum severity this sink accepts, filtered at fan-out.
      type: string
      enum: [trace, debug, info, warn, error, fatal]
      x-telo-eval: compile
    buffer:
      title: Buffer size
      description: Maximum records held before the drop policy applies.
      type: integer
      minimum: 1
      x-telo-eval: compile
    on_full:
      title: On full
      description: >-
        What to do when the buffer saturates. `block` is rejected at load on a
        single-threaded runtime rather than silently degraded.
      type: string
      enum: [block, drop_new, drop_old]
      x-telo-eval: compile
    flush_interval:
      title: Flush interval
      description: Maximum time a record may sit buffered before an export.
      type: string
      pattern: "^\\s*\\d+(\\.\\d+)?\\s*(ms|s|m|h)\\s*$"
      x-telo-eval: compile
  required: [endpoint]
  additionalProperties: false
