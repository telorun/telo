name: Publish Docker Images

# Release images only: a push to main publishes nothing, and nothing here moves
# `:latest` on a development commit. Two triggers:
#  * workflow_call    → called by the branch's Publish workflow after its `release`
#                       job. `channel` / `version` say what was released:
#                         candidate  kernel images `telorun/node:<v>` (and the slim
#                                    and rust variants) only — no `latest`, no
#                                    `<major>` / `<major>.<minor>`, no app image.
#                         final / patch  the kernel tag set, and the hub, runner,
#                                    k8s-runner, hub-web and authoring-agent images
#                                    with their charts.
#                       A pointer (`latest`, `<major>`, `<major>.<minor>`) moves only
#                       forward: `scripts/release-pointers.mjs` refuses it when a
#                       final tag names a higher version in its scope.
#                       An app image's own `latest` moves by its own version, not the
#                       CLI's: only when no release tag holds a higher one.
#                       A run that released no CLI (`none`) still builds the app
#                       images when published packages or a module release call for
#                       them, on the branch's last released telo.
#  * workflow_dispatch → rebuild the release tag set of an already-published CLI
#                       version by hand, from the ref the dispatch runs at (a branch
#                       or the release tag). The recovery path for a Publish run
#                       that failed after npm publish.
#
# Published images are those of the Publish run that produced the commit, built
# from that commit: the image build resolves `@telorun/*` from npm, so it follows
# the `release` job that published them.

on:
  workflow_dispatch:
    inputs:
      cli-version:
        description: 'Published @telorun/cli version to build the release tag set for (e.g. 0.76.0). Empty → the version in this ref''s cli/nodejs/package.json, if it is published.'
        type: string
        default: ''
  workflow_call:
    inputs:
      published-packages:
        description: 'JSON array of {name, version} from changesets/action publishedPackages output'
        type: string
        default: '[]'
      channel:
        description: 'What the calling Publish run released: candidate (0.85.0-rc.N), final (0.85.0), patch (0.85.1) or none. Empty outside a Publish run.'
        type: string
        default: ''
      version:
        description: 'The CLI version the run released (0.85.0-rc.1, 0.85.0, 0.85.1); empty when channel is none.'
        type: string
        default: ''
      tag:
        description: 'The git tag naming that release (v0.85.0-rc.1); empty when channel is none. The tag exists before this workflow is called.'
        type: string
        default: ''

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    name: Determine build context
    runs-on: ubuntu-latest
    outputs:
      # The CLI version whose kernel tag set this run builds; empty when none.
      cli-version: ${{ steps.compute.outputs.cli-version }}
      # The telo the app images are based on: cli-version, else the branch's last
      # released CLI.
      base-version: ${{ steps.compute.outputs.base-version }}
      rust-version: ${{ steps.compute.outputs.rust-version }}
      short-sha: ${{ steps.compute.outputs.short-sha }}
      release-cli: ${{ steps.compute.outputs.release-cli }}
      # App images build outside candidates only.
      apps: ${{ steps.compute.outputs.apps }}
      # Which shared pointers this release may move (release-pointers.mjs).
      latest: ${{ steps.pointers.outputs.latest }}
      major: ${{ steps.pointers.outputs.major }}
      minor: ${{ steps.pointers.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are what the pointers are compared against.
          fetch-depth: 0
          fetch-tags: true

      - id: compute
        env:
          PUBLISHED: ${{ inputs.published-packages }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          DISPATCH_CLI_VERSION: ${{ inputs.cli-version }}
        run: |
          PUBLISHED="${PUBLISHED:-[]}"
          RUST_VERSION=$(grep -E '^ARG RUST_VERSION=' cli/nodejs/Dockerfile | head -1 | cut -d= -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          WORKSPACE_VERSION=$(jq -r .version cli/nodejs/package.json)

          # The release tag set is built for exactly one CLI version, from the most
          # specific source available: what the calling Publish run released, then
          # what it published, then an explicit dispatch input. A dispatch with
          # none names this ref's own CLI version, which must be live on npm
          # (the image build resolves `@telorun/*` from there).
          CLI_VERSION="$INPUT_VERSION"
          if [ -z "$CLI_VERSION" ]; then
            CLI_VERSION=$(echo "$PUBLISHED" | jq -r '[.[] | select(.name=="@telorun/cli")][0].version // ""')
          fi
          if [ -z "$CLI_VERSION" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLI_VERSION="${DISPATCH_CLI_VERSION:-$WORKSPACE_VERSION}"
            npm view "@telorun/cli@$CLI_VERSION" version >/dev/null ||
              { echo "::error::@telorun/cli@$CLI_VERSION is not published; there is nothing to build images for."; exit 1; }
          fi

          # A run that released no CLI builds its app images on the branch's last
          # release, whose kernel image an earlier run published.
          BASE_VERSION="${CLI_VERSION:-$WORKSPACE_VERSION}"

          # Candidates build kernel images only; so does a branch still in
          # candidates whatever it published.
          APPS=true
          case "$BASE_VERSION" in *-*) APPS=false ;; esac
          [ "$INPUT_CHANNEL" = "candidate" ] && APPS=false
          [ -f .changeset/pre.json ] && APPS=false

          {
            echo "cli-version=$CLI_VERSION"
            echo "base-version=$BASE_VERSION"
            echo "rust-version=$RUST_VERSION"
            echo "short-sha=$SHORT_SHA"
            echo "apps=$APPS"
            [ -n "$CLI_VERSION" ] && echo "release-cli=true" || echo "release-cli=false"
          } >> "$GITHUB_OUTPUT"

      # Forward-only: a pointer moves only when no final tag names a higher version
      # in its scope, so re-running an old publish moves nothing.
      - id: pointers
        env:
          CHANNEL: ${{ inputs.channel }}
        run: node scripts/release-pointers.mjs --version "${{ steps.compute.outputs.base-version }}" --channel "${CHANNEL/none/}"

  kernel-release:
    name: Build telorun/node release tags
    if: needs.context.outputs.release-cli == 'true'
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tag matrix
        id: tags
        env:
          V: ${{ needs.context.outputs.cli-version }}
          RV: ${{ needs.context.outputs.rust-version }}
          MOVE_LATEST: ${{ needs.context.outputs.latest }}
          MOVE_MAJOR: ${{ needs.context.outputs.major }}
          MOVE_MINOR: ${{ needs.context.outputs.minor }}
        run: |
          MAJOR=$(echo "$V" | cut -d. -f1)
          MAJOR_MINOR=$(echo "$V" | cut -d. -f1-2)

          # The exact version always; each shared pointer only when it moves
          # forward (a candidate moves none).
          tagset() {
            local suffix="$1"
            echo "telorun/node:${V}${suffix}"
            [ "$MOVE_MINOR" = "true" ] && echo "telorun/node:${MAJOR_MINOR}${suffix}"
            [ "$MOVE_MAJOR" = "true" ] && echo "telorun/node:${MAJOR}${suffix}"
            [ "$MOVE_LATEST" = "true" ] && echo "telorun/node:latest${suffix}"
            true
          }

          {
            echo 'lean<<EOF'
            tagset ""
            echo EOF
            echo 'lean-slim<<EOF'
            tagset "-slim"
            echo EOF
            echo 'rust<<EOF'
            tagset "-rust-${RV}"
            echo EOF
            echo 'rust-slim<<EOF'
            tagset "-rust-${RV}-slim"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build & push lean
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: lean
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.lean }}
          cache-from: type=gha,scope=kernel-lean
          cache-to: type=gha,mode=max,scope=kernel-lean

      - name: Build & push lean-slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: lean-slim
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.lean-slim }}
          cache-from: type=gha,scope=kernel-lean-slim
          cache-to: type=gha,mode=max,scope=kernel-lean-slim

      # One build, both tag sets. There is no non-slim rust image: the toolchain
      # needs nothing from the fat base, so `-rust-<ver>` is the slim one under
      # its historical name rather than a second ~990 MB-heavier build.
      - name: Build & push rust-slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: rust-slim
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUST_VERSION=${{ needs.context.outputs.rust-version }}
          tags: |
            ${{ steps.tags.outputs.rust }}
            ${{ steps.tags.outputs.rust-slim }}
          cache-from: |
            type=gha,scope=kernel-rust-slim
            type=gha,scope=kernel-lean-slim
          cache-to: type=gha,mode=max,scope=kernel-rust-slim

  hub:
    name: Build telorun/hub
    # Outside candidates, on the telo this run released (or the branch's last
    # release when it released no CLI): FROM telorun/node:<version>-slim. `always()`
    # lets it run when the kernel job was skipped.
    if: |
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.apps == 'true' &&
      (needs.kernel-release.result == 'success' || needs.kernel-release.result == 'skipped')
    needs: [context, kernel-release]
    runs-on: ubuntu-latest
    outputs:
      # The version this run released, or empty — consumed by the chart job, as
      # the k8s-runner job's is.
      released-version: ${{ steps.imgtags.outputs.released-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD^ for the version bump, tags for the forward-only `latest`
          fetch-tags: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve TELO_NODE_VERSION
        id: telo
        env:
          BASE_VERSION: ${{ needs.context.outputs.base-version }}
        run: echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Does hub latest move forward
        id: latest
        run: node scripts/release-pointers.mjs image --file apps/hub/telo.yaml

      - name: Compute hub image tags
        id: imgtags
        env:
          SHORT_SHA: ${{ needs.context.outputs.short-sha }}
          MOVE_LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          # The per-commit :sha-*; :latest only when it moves forward; an immutable
          # :<version> tag only when apps/hub's release-owned metadata.version
          # actually moved in this commit (the release commit), mirroring how
          # publish-modules.mjs gates module-manifest pushes on HEAD^..HEAD.
          ver() { sed -n 's/^  version: ["'\'']\?\([0-9][0-9.]*\).*/\1/p' | head -1; }
          NOW=$(ver < apps/hub/telo.yaml)
          PREV=$(git show HEAD^:apps/hub/telo.yaml 2>/dev/null | ver || true)
          {
            echo 'tags<<EOF'
            [ "$MOVE_LATEST" = "true" ] && echo "telorun/hub:latest"
            echo "telorun/hub:sha-${SHORT_SHA}"
            if [ -n "$NOW" ] && [ "$NOW" != "$PREV" ]; then
              echo "telorun/hub:${NOW}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

          if [ -n "$NOW" ] && [ "$NOW" != "$PREV" ]; then
            echo "released-version=$NOW" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push hub
        uses: docker/build-push-action@v6
        with:
          context: apps/hub
          file: apps/hub/Dockerfile
          target: production
          push: true
          build-args: |
            TELO_NODE_VERSION=${{ steps.telo.outputs.version }}
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub

  hub-chart:
    name: Publish the hub Helm chart
    # Gated on the image job's OWN answer to "did this commit release the hub",
    # as the k8s-runner chart is, and ordered after it by `needs`: the chart's
    # appVersion is that image's tag. The hub's version is a module's, moved by
    # the Module Release PR, whose publish run calls this workflow with no CLI
    # release. `always()` is load-bearing: a skipped kernel job up the chain would
    # otherwise skip this one.
    if: |
      always() &&
      needs.hub.result == 'success' &&
      needs.hub.outputs.released-version != ''
    needs: [context, hub]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Verify the chart carries the released version
        run: node scripts/stamp-chart-version.mjs --check

      - name: Package and push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package apps/hub/chart --destination /tmp/charts
          helm push /tmp/charts/*.tgz oci://ghcr.io/telorun/charts

  runner:
    name: Build telorun/docker-runner
    # `pnpm deploy --prod` resolves the workspace's `@telorun/sdk` peer from npm,
    # which the calling Publish run has published by now. Not in candidates.
    if: needs.context.outputs.apps == 'true'
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD^ for the version bump, tags for the forward-only `latest`
          fetch-tags: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Does docker-runner latest move forward
        id: latest
        run: node scripts/release-pointers.mjs image --file apps/docker-runner/package.json

      - name: Compute runner image tags
        id: imgtags
        env:
          SHORT_SHA: ${{ needs.context.outputs.short-sha }}
          MOVE_LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          # The per-commit :sha-*; :latest only when it moves forward. Add an immutable
          # :<version> tag only when apps/docker-runner's package.json version
          # actually moved in this commit (the release commit), mirroring how
          # publish-modules.mjs gates module-manifest pushes on HEAD^..HEAD.
          NOW=$(jq -r .version apps/docker-runner/package.json)
          PREV=$(git show HEAD^:apps/docker-runner/package.json 2>/dev/null | jq -r .version 2>/dev/null || true)
          {
            echo 'tags<<EOF'
            [ "$MOVE_LATEST" = "true" ] && echo "telorun/docker-runner:latest"
            echo "telorun/docker-runner:sha-${SHORT_SHA}"
            if [ -n "$NOW" ] && [ "$NOW" != "null" ] && [ "$NOW" != "$PREV" ]; then
              echo "telorun/docker-runner:${NOW}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build & push runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker-runner/Dockerfile
          target: production
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  hub-web:
    name: Build telorun/hub-web
    # Same gating as docker-runner: outside candidates, the :sha-* tag always and
    # :latest when it moves forward.
    if: needs.context.outputs.apps == 'true'
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD^ for the version bump, tags for the forward-only `latest`
          fetch-tags: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Does hub-web latest move forward
        id: latest
        run: node scripts/release-pointers.mjs image --file apps/hub-web/package.json

      - name: Compute hub-web image tags
        id: imgtags
        env:
          SHORT_SHA: ${{ needs.context.outputs.short-sha }}
          MOVE_LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          # The per-commit :sha-*; :latest only when it moves forward. Add an immutable
          # :<version> tag only when apps/hub-web's package.json version actually
          # moved in this commit, as the hub job does for its metadata.version.
          NOW=$(jq -r .version apps/hub-web/package.json)
          PREV=$(git show HEAD^:apps/hub-web/package.json 2>/dev/null | jq -r .version 2>/dev/null || true)
          {
            echo 'tags<<EOF'
            [ "$MOVE_LATEST" = "true" ] && echo "telorun/hub-web:latest"
            echo "telorun/hub-web:sha-${SHORT_SHA}"
            if [ -n "$NOW" ] && [ "$NOW" != "null" ] && [ "$NOW" != "$PREV" ]; then
              echo "telorun/hub-web:${NOW}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build & push hub-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hub-web/Dockerfile
          target: production
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=hub-web
          cache-to: type=gha,mode=max,scope=hub-web

  k8s-runner:
    name: Build telorun/k8s-runner
    # Same gating as docker-runner. It also WAITS ON THE KERNEL JOB, because it
    # bakes one of its tags as its session default: run concurrently, a failed
    # `kernel-release` would ship `k8s-runner:latest` and `:<version>` with a
    # default pointing at a `telorun/node:<v>-slim` that never gets built.
    # `always()` plus the result test lets a legitimately SKIPPED kernel job (a
    # run that released no CLI) not block this one.
    if: |
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.apps == 'true' &&
      (needs.kernel-release.result == 'success' || needs.kernel-release.result == 'skipped')
    needs: [context, kernel-release]
    runs-on: ubuntu-latest
    outputs:
      # The version this run released, or empty. Published so the chart job
      # consumes the answer instead of re-deriving it from the same two files —
      # which also makes "the chart is never published ahead of its image" a
      # data dependency rather than a convention.
      released-version: ${{ steps.imgtags.outputs.released-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD^ for the version bump, tags for the forward-only `latest`
          fetch-tags: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Does k8s-runner latest move forward
        id: latest
        run: node scripts/release-pointers.mjs image --file apps/k8s-runner/package.json

      - name: Compute k8s-runner image tags
        id: imgtags
        env:
          SHORT_SHA: ${{ needs.context.outputs.short-sha }}
          CLI_VERSION: ${{ needs.context.outputs.cli-version }}
          MOVE_LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          # per-commit sha always, latest when it moves forward; immutable :<version> only when
          # apps/k8s-runner's package.json version moved this commit (release).
          NOW=$(jq -r .version apps/k8s-runner/package.json)
          PREV=$(git show HEAD^:apps/k8s-runner/package.json 2>/dev/null | jq -r .version 2>/dev/null || true)
          {
            echo 'tags<<EOF'
            [ "$MOVE_LATEST" = "true" ] && echo "telorun/k8s-runner:latest"
            echo "telorun/k8s-runner:sha-${SHORT_SHA}"
            if [ -n "$NOW" ] && [ "$NOW" != "null" ] && [ "$NOW" != "$PREV" ]; then
              echo "telorun/k8s-runner:${NOW}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

          if [ -n "$NOW" ] && [ "$NOW" != "null" ] && [ "$NOW" != "$PREV" ]; then
            echo "released-version=$NOW" >> "$GITHUB_OUTPUT"
          fi

          # The kernel image spawned for each session, baked into this build so a
          # RELEASED runner's tested kernel and its runtime kernel are the same
          # artifact. It is a default an operator can override, not a FROM, so it
          # need not exist yet when this builds.
          #
          # Set only when this run released a CLI. Otherwise it stays empty and the
          # Dockerfile's own multi-arch `ARG TELO_SESSION_IMAGE=telorun/node:latest-slim`
          # stands.
          if [ -n "$CLI_VERSION" ]; then
            echo "session-image=telorun/node:${CLI_VERSION}-slim" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push k8s-runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/k8s-runner/Dockerfile
          target: production
          push: true
          # Empty when no CLI was released, and an empty `build-args` line is
          # ignored by buildx — so the Dockerfile's default applies.
          build-args: |
            ${{ steps.imgtags.outputs.session-image && format('TELO_SESSION_IMAGE={0}', steps.imgtags.outputs.session-image) || '' }}
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=k8s-runner
          cache-to: type=gha,mode=max,scope=k8s-runner

  k8s-runner-chart:
    name: Publish the k8s-runner Helm chart
    # Gated on the image job's OWN answer to "did this commit
    # release the runner" — the chart's appVersion IS that image's tag, so the
    # two must never disagree, and consuming the output rather than re-deriving
    # it is what makes that structural. `needs` then also orders them: the chart
    # is published after the image it points at exists, never beside it. There is
    # deliberately no dev/sha chart — an OCI chart tag is its semver version, and
    # nothing consumes a chart for an unreleased runner.
    #
    # `always()` is load-bearing: without a status function GitHub prepends an
    # implicit `success()`, which is false when ANY job up the `needs` chain was
    # skipped — and `kernel-release` is skipped when no CLI was released. The
    # explicit `k8s-runner` result test below is the real gate.
    if: |
      always() &&
      needs.k8s-runner.result == 'success' &&
      needs.k8s-runner.outputs.released-version != ''
    needs: [context, k8s-runner]
    runs-on: ubuntu-latest
    # GHCR is written with GITHUB_TOKEN, so this job needs `packages: write` —
    # and, being a called workflow, it can only get it if the caller's job grants
    # it too (see the `docker` job in publish.yml).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # The same gate every PR runs, not a second reading of Chart.yaml: a chart
      # whose appVersion disagrees with the package names an image tag nothing
      # built, and the check that decides that already exists.
      - name: Verify the chart carries the released version
        run: node scripts/stamp-chart-version.mjs --check

      - name: Package and push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package apps/k8s-runner/chart --destination /tmp/charts
          # The tarball is named for the chart, not for anything chosen here, and
          # it pushes to ghcr.io/telorun/charts/<chart name>:<version> for the
          # same reason — so the file is found rather than reconstructed.
          helm push /tmp/charts/*.tgz oci://ghcr.io/telorun/charts

  authoring-agent:
    name: Build telorun/authoring-agent
    # Outside candidates: the immutable :<version>-slim when the agent's
    # release-owned metadata.version moved this commit, :sha-<short>-slim always,
    # and :latest-slim when it moves forward. Its base is
    # telorun/node:<base-version>-slim — the telo this run released, else the
    # branch's last release; both exist, which a development version would not.
    # `always()` lets this job run when the kernel job was skipped.
    if: |
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.apps == 'true' &&
      (needs.kernel-release.result == 'success' || needs.kernel-release.result == 'skipped')
    needs: [context, kernel-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD^ for the version bump, tags for the forward-only `latest`
          fetch-tags: true
      - uses: docker/setup-buildx-action@v3

      - name: Does authoring-agent latest move forward
        id: latest
        run: node scripts/release-pointers.mjs image --file apps/authoring-agent/telo.yaml

      - name: Compute authoring-agent image tags
        id: decide
        env:
          BASE_VERSION: ${{ needs.context.outputs.base-version }}
          SHORT_SHA: ${{ needs.context.outputs.short-sha }}
          MOVE_LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          ver() { sed -n 's/^  version: ["'\'']\?\([0-9][0-9.]*\).*/\1/p' | head -1; }
          AGENT_NOW=$(ver < apps/authoring-agent/telo.yaml)
          AGENT_PREV=$(git show HEAD^:apps/authoring-agent/telo.yaml 2>/dev/null | ver || true)
          if [ -z "$AGENT_NOW" ]; then
            echo "Could not read metadata.version from apps/authoring-agent/telo.yaml" >&2
            exit 1
          fi

          TELO_V="$BASE_VERSION"

          # per-commit sha always, latest when it moves forward; immutable :<version>-slim only when
          # the release-owned metadata.version moved this commit.
          {
            echo "telo-version=$TELO_V"
            echo 'tags<<EOF'
            [ "$MOVE_LATEST" = "true" ] && echo "telorun/authoring-agent:latest-slim"
            echo "telorun/authoring-agent:sha-${SHORT_SHA}-slim"
            if [ "$AGENT_NOW" != "$AGENT_PREV" ]; then
              echo "telorun/authoring-agent:${AGENT_NOW}-slim"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push authoring-agent
        uses: docker/build-push-action@v6
        with:
          context: apps/authoring-agent
          file: apps/authoring-agent/Dockerfile
          target: production
          push: true
          build-args: |
            TELO_NODE_VERSION=${{ steps.decide.outputs.telo-version }}
          tags: ${{ steps.decide.outputs.tags }}
          cache-from: type=gha,scope=authoring-agent
          cache-to: type=gha,mode=max,scope=authoring-agent
