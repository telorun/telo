kind: Telo.Application
metadata:
  name: CanInsertAndSelect
  version: 1.0.0
imports:
  Sql: ../
  SQLite: ../../sqlite
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testInsertAndSelect
---
kind: SQLite.Connection
metadata:
  name: db
file: ":memory:"
---
kind: Run.Sequence
metadata:
  name: testInsertAndSelect
steps:
  - name: createTable
    inputs:
      sql: "CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT NOT NULL, age INTEGER NOT NULL)"
    invoke:
      kind: Sql.Command
      connection: !ref db

  - name: insertRow
    inputs:
      sql: "INSERT INTO users (id, name, age) VALUES (1, 'Alice', 30)"
    invoke:
      kind: Sql.Command
      connection: !ref db

  - name: selectRow
    inputs:
      sql: "SELECT id, name, age FROM users WHERE id = 1"
    invoke:
      kind: Sql.Query
      connection: !ref db

  - name: assertResult
    inputs:
      rows: "${{ steps.selectRow.result.rows }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          rows:
            type: array
            minItems: 1
            maxItems: 1
            items:
              type: object
              properties:
                id:
                  const: 1
                name:
                  const: Alice
                age:
                  const: 30
