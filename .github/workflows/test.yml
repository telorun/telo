      # to `\tmp` on the workspace's drive. Nothing creates that directory on a
      # Windows runner; before this job was split from the unit tests, a unit
      # test that ran first did.
      - name: Create the temp directory manifest tests write to
        if: needs.select.outputs.platform_mode != 'none'
        shell: bash
        run: |
          node -e "require('node:fs').mkdirSync('/tmp', { recursive: true })"

      - name: Run telo manifest tests (Node)
        if: needs.select.outputs.platform_mode != 'none'
        shell: bash
        env:
          SUITE_ARGS: ${{ needs.select.outputs.args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$SUITE_ARGS" | tr -d '\r')
          node ./cli/nodejs/bin/telo.mjs ./test-suite-windows.yaml "${args[@]}"

      - name: Save staged module files
        if: always() && steps.staged.outputs.key != '' && steps.staged.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-staged-files
        with:
          key: ${{ steps.staged.outputs.key }}
          paths: ${{ steps.staged.outputs.paths }}

