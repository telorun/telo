kind: Telo.Library
metadata:
  name: NotesRepository
  version: 1.0.0
  description: |
    A reusable `Telo.Library` for a `notes` table: it owns the SQLite connection,
    the schema migration, and typed `SqlRepository` create/read resources, and
    exports them as ready-made singletons. Importers add `Migrate` to their
    `targets` and dispatch to `CreateNote` / `ListNotes` from their own routes —
    no hand-written SQL beyond the migration.
imports:
  Sql: oci://ghcr.io/telorun/sql@0.21.0#sha256-aasWNQP3KaWbJaFZVg_Zzp0efD4k7rc0FaImt6aHE-k
  SQLite: oci://ghcr.io/telorun/sql-sqlite@0.7.0#sha256-0Yg6NzMGDXyPRnbRLMrEwsF10MKHMZyO1mirH3frvRI
  SqlRepository: oci://ghcr.io/telorun/sql-repository@0.10.0#sha256-kLSJ6yaEYzV4ji9hxmWGURIPx1--l7_TOJCavrXdZys
exports:
  resources:
    - migrate
    - createNote
    - listNotes
---
kind: SQLite.Connection
metadata:
  name: db
file: ./tmp/notes.sqlite
---
kind: Sql.Migrations
metadata:
  name: migrate
connection: !ref db
migrations:
  0001_create_notes:
    statement: |
      CREATE TABLE IF NOT EXISTS notes (
        id         INTEGER PRIMARY KEY AUTOINCREMENT,
        title      TEXT    NOT NULL,
        body       TEXT,
        created_at DATETIME DEFAULT CURRENT_TIMESTAMP
      )
---
kind: SqlRepository.Create
metadata:
  name: createNote
connection: !ref db
table: notes
---
kind: SqlRepository.Read
metadata:
  name: listNotes
connection: !ref db
table: notes
