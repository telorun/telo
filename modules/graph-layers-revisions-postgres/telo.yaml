            x-telo-widget: code
          renamedFrom:
            title: Renamed From
            description: The column this one supersedes. The pass adds this column, copies the old
              one into it and tombstones the old one — a native rename would take effect
              immediately and break the version still running. During the window writes land
              only in the new column, so a rollback reads stale data.
            type: string
    indexes:
      title: Indexes
      description: >-
        Further indexes keyed by name — for a property a filter reads. None may be
        unique, and none may be named `graph_…`, the prefix of the table's own
        indexes; an index may name the table's bookkeeping columns.
      type: object
      propertyNames:
        not:
          pattern: "^graph_"
      additionalProperties:
        type: object
        additionalProperties: false
        required:
          - columns
        properties:
          columns:
            title: Columns
            type: array
            minItems: 1
            items:
              type: string
          unique:
            title: Unique
            type: boolean
            default: false
          method:
            title: Method
            description: Index method (`btree`, `gin`, `gist`, `hash`, `brin`).
            type: string
            enum:
              - btree
              - gin
              - gist
              - hash
              - brin
              - spgist
          where:
            title: Where
            description: Partial-index predicate.
            type: string
            contentMediaType: application/sql
            x-telo-widget: code
    checks:
      title: Checks
      description: >-
        Named table-level predicates in PostgreSQL's own SQL, keyed by constraint
        name. A predicate holds for every row, whichever layer states it.
      type: object
      propertyNames:
        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
      additionalProperties:
        type: object
        additionalProperties: false
        required:
          - expression
        properties:
          expression:
            title: Expression
            description: The predicate, in PostgreSQL's own SQL.
            type: string
            minLength: 1
          validate:
            title: Validate
            description: "`deferred` adds the constraint `NOT VALID`, so it is enforced for new rows
              immediately and the existing ones are scanned on a later pass — which is what
              keeps adding a constraint to a large table from holding a lock while every row
              is read."
            type: string
            enum:
              - immediate
              - deferred
            default: immediate
    renamedFrom:
      title: Renamed From
      description: The physical table this declaration supersedes, renamed in place.
      type: string
  # The engine table's own rules, restated on this kind's fields under the
  # engine's codes. A kind that maps onto its parent with `base:` has a schema of
  # its own and inherits no rule, so without these a mistake the engine table
  # judges only at creation would pass `telo check`. The module's unit test fails when the
  # engine table gains a rule that is neither restated here nor on its written
  # exclusion list. The bookkeeping columns `base:` adds are named literally: an
  # index may name them, and a rename may not take one as its source.
  x-telo-resource-rules:
    - condition: !cel >-
        self.sourceColumn in self.columns && self.targetColumn in self.columns
          && self.sourceColumn != self.targetColumn
          && (!has(self.indexes) || self.indexes.all(i, self.indexes[i].columns.all(c,
            c in self.columns || c in ['graph_row', 'graph_layer', 'graph_changeset', 'graph_from_revision', 'graph_to_revision', 'graph_effect', 'graph_over', 'graph_beneath', 'graph_resolution', 'graph_resolved_by_type', 'graph_resolved_by_id'])))
      code: SQL_INDEX_UNKNOWN_COLUMN
      message: >-
        names a column this table does not declare — as its 'sourceColumn' or
        'targetColumn', or in an index — or names one column for both endpoints.
        The index cannot be created — the table's own indexes are built on the
        two endpoint columns.
    - in: /columns
      condition: !cel "this.?renamedFrom.orValue('') != key"
      code: SQL_RENAME_FROM_SELF
      message: declares renamedFrom itself, which describes no rename.
    - in: /columns
      condition: !cel >-
        !(this.?renamedFrom.orValue('') in self.columns
          || this.?renamedFrom.orValue('') in ['graph_row', 'graph_layer', 'graph_changeset', 'graph_from_revision', 'graph_to_revision', 'graph_effect', 'graph_over', 'graph_beneath', 'graph_resolution', 'graph_resolved_by_type', 'graph_resolved_by_id'])
      code: SQL_RENAME_SOURCE_STILL_DECLARED
      message: >-
        renames from a column this table also declares. A rename's source is the
        column being retired, so declaring both would copy one live column into
        another and retire neither.
    # The table's own row id is its primary key, so one column marked here is
    # already a second.
    - condition: !cel >-
        size(self.columns.filter(c, self.columns[c].?primaryKey.orValue(false))) == 0
      code: SQL_COMPOSITE_PRIMARY_KEY
      message: >-
        marks a column as primaryKey. The table's own row id is its primary key,
        and a composite primary key is not expressible as a per-column flag.
    - condition: !cel "!has(self.renamedFrom) || self.renamedFrom != self.table"
      code: SQL_TABLE_RENAME_FROM_SELF
      message: declares renamedFrom itself, which describes no rename.
  x-telo-referrer-rules:
    - referrer: Postgres.Schema
      peers: /enums
      condition: !cel >-
        self.columns.all(c, self.columns[c].type.?name.orValue('') == ''
          || peers.exists(e, e.metadata.name == self.columns[c].type.name))
      code: SQL_ENUM_NOT_DECLARED
      message: >-
        has a column whose type references an enum this schema does not list in
        'enums:'. The list is what the ledger records as owned, so an unlisted
        type is one nothing creates, reclaims or renames — add it to 'enums:'.
    - referrer: Postgres.Schema
      peers: /tables
      condition: !cel >-
        !has(self.renamedFrom) || !peers.exists(p, p.table == self.renamedFrom)
      code: SQL_TABLE_RENAME_SOURCE_STILL_DECLARED
      message: >-
        renames from a table this schema also declares. A rename's source is the
        table being retired, so declaring both would rename one live table onto
        another and retire neither.
    - referrer: Postgres.Schema
      peers: /tables
      condition: !cel >-
        !has(self.renamedFrom)
          || !peers.exists(p, p.?renamedFrom.orValue('') == self.renamedFrom)
      code: SQL_TABLE_RENAME_SOURCE_CLAIMED_TWICE
      message: >-
        renames from a table another declaration in this schema also claims. One
        retired table has one successor, or neither rename can be told from a
        drop-and-create.
base:
  table: !cel "self.table"
  renamedFrom: !cel "self.renamedFrom"
  columns: !cel "self.columns"
  internalColumns:
    graph_row: { type: uuid, nullable: false, primaryKey: true }
    graph_layer: { type: uuid, nullable: false }
    graph_changeset: { type: uuid, nullable: false }
    graph_from_revision: { type: bigint }
    graph_to_revision: { type: bigint }
    graph_effect: { type: text, nullable: false }
    graph_over: { type: uuid }
    graph_beneath: { type: uuid }
    graph_resolution: { type: text }
    graph_resolved_by_type: { type: text }
    graph_resolved_by_id: { type: text }
  # As on a node table, over the ordered pair — and each range a second time
  # leading on the target, so a hop followed backwards is as cheap as one
  # followed forwards, inside a draft and outside one.
  indexes: !cel >-
    merge(has(self.indexes) ? self.indexes : {},
      { 'graph_' + self.table + '_changeset_pair':
          { 'columns': ['graph_changeset', self.sourceColumn, self.targetColumn], 'unique': true },
        'graph_' + self.table + '_changeset_target':
          { 'columns': ['graph_changeset', self.targetColumn, self.sourceColumn] },
        'graph_' + self.table + '_layer_current':
          { 'columns': ['graph_layer', self.sourceColumn, self.targetColumn], 'unique': true,
            'where': 'graph_from_revision IS NOT NULL AND graph_to_revision IS NULL' },
        'graph_' + self.table + '_layer_pair':
          { 'columns': ['graph_layer', self.sourceColumn, self.targetColumn, 'graph_from_revision'],
            'where': 'graph_from_revision IS NOT NULL' },
        'graph_' + self.table + '_layer_target':
          { 'columns': ['graph_layer', self.targetColumn, self.sourceColumn, 'graph_from_revision'],
            'where': 'graph_from_revision IS NOT NULL' } })
  checks: !cel "self.checks"
---
kind: Telo.Definition
metadata:
  name: Node
  description: >-
    One type of graph entity kept in a versioned PostgreSQL table: one column carries
    the identifying key, every other declared column is a property, and every
    version a layer ever published of an entity is retained.
capability: Telo.Provider
extends: GraphLayersSql.Node
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers-revisions-postgres.mjs&local_path=./nodejs/src/index.ts#Node
x-telo-schema-projection-from: /table
schema:
  type: object
  required: [table, key]
  additionalProperties: false
  examples:
    - table: !ref people
      key: id
  properties:
    table:
      title: Table
      description: The layered table holding the nodes, listed in the PostgreSQL schema.
      x-telo-ref:
        kind: Self.NodeTable
        use: dependency
    key:
      title: Key
      description: The table's own key column.
      type: string
      minLength: 1
---
kind: Telo.Definition
metadata:
  name: Relationship
  description: >-
    One type of graph link kept in a versioned PostgreSQL table: two columns carry the
    source and target entities' keys, every other declared column is a property
    of the link, and every version a layer ever published of a link is retained.
capability: Telo.Provider
extends: GraphLayersSql.Relationship
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers-revisions-postgres.mjs&local_path=./nodejs/src/index.ts#Relationship
x-telo-schema-projection-from: { from: /table, omit: [/sourceColumn, /targetColumn] }
schema:
  type: object
  required: [table, source, target, sourceColumn, targetColumn]
  additionalProperties: false
  examples:
    - table: !ref knowsTable
      source: !ref person
      target: !ref person
      sourceColumn: source
      targetColumn: target
  properties:
    table:
      title: Table
      description: The layered table holding the relationships, listed in the PostgreSQL schema.
      x-telo-ref:
        kind: Self.RelationshipTable
        use: dependency
    source:
      title: Source
      description: The node type a relationship starts at.
      x-telo-ref:
        kind: Self.Node
        use: dependency
    target:
      title: Target
      description: The node type a relationship ends at. May be the source's type.
      x-telo-ref:
        kind: Self.Node
        use: dependency
    sourceColumn:
      title: Source Column
      description: The table's own source column.
      type: string
      minLength: 1
    targetColumn:
      title: Target Column
      description: The table's own target column.
      type: string
      minLength: 1
---
# GraphLayersRevisionsPostgres.Store — one revisioned layer over one PostgreSQL connection. It issues
# no DDL: every table it names is listed by the `schema` it names, whose own
# pass creates and migrates them. What it is built on is data, not a
# declaration: pins set with `GraphLayers.PinBase`, kept in `changesetBases`.
kind: Telo.Definition
metadata:
  name: Store
  description: >-
    One named layer of a knowledge graph kept in PostgreSQL tables shared with other
    layers, with its whole history retained. Changes are staged in parallel
    drafts, each isolated at the revision it began from, and published
    atomically as numbered revisions. It is built on other layers by pinning
    their revisions or labels, and upgraded by moving a pin.
capability: Telo.Provider
extends: GraphLayersSql.RevisionedStore
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers-revisions-postgres.mjs&local_path=./nodejs/src/index.ts#Store
schema:
  type: object
  required: [connection, schema, layer, nodes, layers, changesets, changesetBases]
  additionalProperties: false
  examples:
    - connection: !ref db
      schema: !ref appSchema
      layer: team
      nodes: [!ref person]
      relationships: [!ref knows]
      layers: !ref graphLayers
      changesets: !ref graphChangesets
      changesetBases: !ref graphChangesetBases
  properties:
    connection:
      title: Connection
      description: The connection every statement runs on.
      x-telo-ref:
        kind: Postgres.Connection
        use: dependency
    schema:
      title: Schema
      description: >-
        The schema that declares every table this graph uses, on the same
        connection. It creates and migrates them; the graph issues no DDL.
      x-telo-ref:
        kind: Postgres.Schema
        use: dependency
    layer:
      title: Layer
      description: >-
        The layer's name. Stores naming the same layer over the same tables are
        the same layer.
      type: string
      minLength: 1
    nodes:
      title: Nodes
      description: The node types this graph holds.
      type: array
      minItems: 1
      items:
        x-telo-ref:
          kind: Self.Node
          use: dependency
    relationships:
      title: Relationships
      description: The relationship types this graph holds.
      type: array
      items:
        x-telo-ref:
          kind: Self.Relationship
          use: dependency
    layers:
      title: Layers
      description: >-
        The table registering every layer with its head revision, listed in the
        schema.
      x-telo-ref:
        kind: Self.LayersTable
        use: dependency
    changesets:
      title: Changesets
      description: >-
        The table recording every changeset — a draft while open, a revision once
        published — listed in the schema.
      x-telo-ref:
        kind: Self.ChangesetsTable
        use: dependency
    changesetBases:
      title: Changeset Bases
      description: >-
        The table holding every base list — the layers a layer is built on,
        each at the revision it is pinned to — listed in the schema.
      x-telo-ref:
        kind: Self.ChangesetBasesTable
        use: dependency
---
# GraphLayersRevisionsPostgres.LayersTable — the register of layers: each layer's
# internal id, its name and its head revision. The author names the physical table
# and nothing else; every column is internal, so the table has no row contract
# and nothing outside the store can name one of its columns.
kind: Telo.Definition
metadata:
  name: LayersTable
  description: >-
    The PostgreSQL table registering every layer of a versioned knowledge graph: its
    name, an internal id and the head revision each publish advances. The
    application names the table; its columns belong to the graph store and are
    in no contract.
extends: Postgres.Table
schema:
  type: object
  additionalProperties: false
  required: [table]
  examples:
    - table: graph_layers
  properties:
    table:
      title: Table
      description: The physical table name.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
base:
  table: !cel "self.table"
  columns: {}
  internalColumns:
    id: { type: uuid, nullable: false, primaryKey: true }
    name: { type: text, nullable: false, unique: true }
    head_revision: { type: bigint, nullable: false }
    created_at: { type: timestamptz, nullable: false }
    created_by_type: { type: text, nullable: false }
    created_by_id: { type: text, nullable: false }
---
# GraphLayersRevisionsPostgres.ChangesetsTable — one row per changeset: a draft while
# open, a numbered revision of its layer once published. There is no state
# column: open, published and discarded are read from its timestamps. A write
# made outside any draft is a changeset opened and published at once. A
# published one may carry a label, and each names — in `bases_changeset` — the
# changeset whose rows in the bases table are its base list.
kind: Telo.Definition
metadata:
  name: ChangesetsTable
  description: >-
    The PostgreSQL table recording every changeset of a versioned knowledge graph — an
    open draft, or a published revision: the layer and revision it was opened
    on, who opened, published or discarded it and when, and the revision number
    it became. It is the layer's history and its audit trail.
extends: Postgres.Table
schema:
  type: object
  additionalProperties: false
  required: [table]
  examples:
    - table: graph_changesets
  properties:
    table:
      title: Table
      description: The physical table name.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
base:
  table: !cel "self.table"
  columns: {}
  internalColumns:
    id: { type: uuid, nullable: false, primaryKey: true }
    public_id: { type: text, nullable: false, unique: true }
    layer_id: { type: uuid, nullable: false }
    parent_revision: { type: bigint, nullable: false }
    message: { type: text }
    created_at: { type: timestamptz, nullable: false }
    created_by_type: { type: text, nullable: false }
    created_by_id: { type: text, nullable: false }
    published_at: { type: timestamptz }
    published_by_type: { type: text }
    published_by_id: { type: text }
    discarded_at: { type: timestamptz }
    discarded_by_type: { type: text }
    discarded_by_id: { type: text }
    revision: { type: bigint }
    label: { type: text }
    labelled_at: { type: timestamptz }
    labelled_by_type: { type: text }
    labelled_by_id: { type: text }
    bases_changeset: { type: uuid }
  # A layer's revisions are numbered without a gap and each is one changeset;
  # the second index is the layer's open drafts, in the order they are listed;
  # the third keeps a label to one revision of its layer — two columns wide, so
  # no schema pass reads it back as a column flag.
  indexes: !cel >-
    { 'graph_' + self.table + '_layer_revision':
        { 'columns': ['layer_id', 'revision'], 'unique': true },
      'graph_' + self.table + '_open':
        { 'columns': ['layer_id', 'public_id'],
          'where': 'published_at IS NULL AND discarded_at IS NULL' },
      'graph_' + self.table + '_layer_label':
        { 'columns': ['layer_id', 'label'], 'unique': true,
          'where': 'label IS NOT NULL' } }
---
# GraphLayersRevisionsPostgres.ChangesetBasesTable — every base list: one row per
# direct pin, under the changeset that made the change. A changeset that did not
# change its layer's pins stores none and names the changeset that last did, so
# a write outside a draft costs no row here.
kind: Telo.Definition
metadata:
  name: ChangesetBasesTable
  description: >-
    The PostgreSQL table recording what each layer of a versioned knowledge graph is
    built on: for every change of a layer's pins, the layers beneath it in
    order of precedence and the revision each is pinned to. The application
    names the table; its columns belong to the graph store and are in no
    contract.
extends: Postgres.Table
schema:
  type: object
  additionalProperties: false
  required: [table]
  examples:
    - table: graph_changeset_bases
  properties:
    table:
      title: Table
      description: The physical table name.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
base:
  table: !cel "self.table"
  columns: {}
  internalColumns:
    id: { type: uuid, nullable: false, primaryKey: true }
    changeset_id: { type: uuid, nullable: false }
    position: { type: integer, nullable: false }
    base_layer_id: { type: uuid, nullable: false }
    base_revision: { type: bigint, nullable: false }
  # A base list is read whole, in position order, and holds a layer once.
  indexes: !cel >-
    { 'graph_' + self.table + '_position':
        { 'columns': ['changeset_id', 'position'], 'unique': true },
      'graph_' + self.table + '_layer':
        { 'columns': ['changeset_id', 'base_layer_id'], 'unique': true } }
