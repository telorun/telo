# Two tables bind a row action from the row, over an action with no lists and
# one whose list of lists is empty: nothing is reported, and no rule is skipped.
kind: Run.Sequence
metadata:
  name: rowActionLists
steps:
  - name: check
    invoke: { kind: Probe.Diagnostics, source: ./__fixtures__/row-actions/telo.yaml }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        reported: !cel "steps.check.result.reported"
        skipped: !cel "(steps.check.result.reported + steps.check.result.noted).filter(n, n.contains('_RULE_SKIPPED'))"
      expected:
        reported: []
        skipped: []
---
