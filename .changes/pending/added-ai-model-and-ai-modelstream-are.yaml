modules:
  modules/ai: Added
body: '`Ai.Model` and `Ai.ModelStream` are DECLARED contracts. `Ai.Model` was a
  `Telo.Provider` with no schema and no types, whose `invoke` and `stream` were
  duck-typed JavaScript methods checked at the call site with a `typeof` — so a provider
  could only be TypeScript: nothing was statically checked, no non-Node kernel could
  host one, and every new endpoint shape was controller work. Both are now
  `Telo.Invocable` with one bound entry point, declaring messages, options, tools,
  providerState and responseFormat in, and content parts, text, usage and a finish
  reason out. Cancellation rides the InvokeContext rather than a `signal` smuggled
  through the input, which is not declarable data. Two abstracts rather than one: a live
  output is exempt from validation, so a single streaming contract would take the check
  away from the buffered path too — the one most calls use — and it makes "this endpoint
  does not stream" expressible instead of faked as a one-element stream.'
