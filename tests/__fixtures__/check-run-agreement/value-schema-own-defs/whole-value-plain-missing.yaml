# A whole `context` computed by one expression, which lacks the member the type
# requires, against a type requiring a member: this application's check cannot
# judge it, and the contract the kernel binds refuses the call when it is
# dispatched.
kind: Telo.Application
metadata:
  name: ValueSchemaWholeValuePlainMissing
  version: 1.0.0
imports:
  Kinds: ./kinds
  Run: ../../../../modules/run
targets:
  - !ref calls
---
# A reader whose declared type requires a member, with no definitions of its own.
kind: Kinds.Reader
metadata:
  name: plainReader
contextType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [turnId]
    properties:
      turnId: { type: string }
---
kind: Kinds.Caller
metadata:
  name: plainCaller
readers:
  - !ref plainReader
---
kind: Run.Sequence
metadata:
  name: calls
steps:
  - name: call
    invoke: !ref plainCaller
    inputs:
      context: !cel "dyn({})"
