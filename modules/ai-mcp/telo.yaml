kind: Telo.Library
metadata:
  name: AiMcp
  version: 0.11.1
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI, Transport]
  description: >-
    Brings the tools a connected MCP server advertises into an AI agent, so a model
    can call them like any other tool. The catalogue and its argument schemas are
    discovered at run time over whichever MCP transport the connection uses.
imports:
  # Import @telorun/ai for the Ai.ToolProvider abstract this definition implements.
  Ai: ../ai
  # Import @telorun/mcp-client for the Mcp.Client transport this definition wraps.
  # These two imports are the entire reason ai-mcp exists as a separate package: it is
  # the only module coupling the agnostic `ai` contract to the MCP transport.
  Mcp: ../mcp-client
exports:
  kinds:
    - ToolProvider
---
# AiMcp.ToolProvider — wraps any Mcp.Client as an Ai.ToolProvider. listTools() maps to
# `tools/list`, callTool() to `tools/call`. The discovered tool set and schemas are
# known only at run time (statically opaque), validated at the MCP server boundary.
kind: Telo.Definition
metadata:
  name: ToolProvider
  description: >-
    Turns a connected MCP server into a tool source for an agent: lists the tools the
    server advertises and dispatches a model-requested call over the same connection.
    The tool set and its schemas are resolved at run time, not statically.
capability: Telo.Mount
extends: Ai.ToolProvider
controllers:
  - pkg:telo/local/js?path=./nodejs/mcp-tool-provider-controller.mjs&local_path=./nodejs/src/mcp-tool-provider-controller.ts
schema:
  type: object
  properties:
    client:
      title: Client
      description: Reference to any Mcp.Client implementation (Mcp.HttpClient, Mcp.StdioClient, …).
      x-telo-ref:
        kind: Mcp.Client
        use: dependency
  required: [ client ]
  additionalProperties: false
