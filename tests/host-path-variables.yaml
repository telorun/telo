# A `Telo.HostPath` variable is the one place a relative path is read: its env
# value — or the `default:` standing in for an unset one — resolves against the
# working directory, so the manifest holds an absolute path everywhere after.
kind: Telo.Application
metadata:
  name: HostPathVariables
  version: 1.0.0
imports:
  Run: ../modules/run
  Assert: ../modules/assert
variables:
  dataDir:
    env: TELO_TEST_HOST_PATH_DATA_DIR
    type: string
    x-telo-type: Telo.HostPath
    default: reports/out
targets:
  - !ref test
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: anchored
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        resolved: !cel "string(variables.dataDir) != 'reports/out'"
        # Separator-neutral: a Windows path joins with `\`.
        keepsTheRelativePart: !cel "string(variables.dataDir).contains('reports') && string(variables.dataDir).endsWith('out')"
        # `.joinPath` extends it with the host's separator and keeps it a host path.
        joined: !cel "string(variables.dataDir.joinPath('daily/today')).endsWith('today') && string(variables.dataDir.joinPath('daily/today')).startsWith(string(variables.dataDir))"
      expected:
        resolved: true
        keepsTheRelativePart: true
        joined: true
