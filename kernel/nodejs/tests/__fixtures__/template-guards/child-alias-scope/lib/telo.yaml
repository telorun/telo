kind: Telo.Library
metadata:
  name: ChildAliasScopeLib
  version: 1.0.0
  description: >-
    Test fixture: a template whose body declares a credentialed Http.Client and
    an Http.Request holding it. The body's kinds are written through THIS
    library's `Http` alias, which the consuming application never declares —
    injection has to resolve the children in the defining module's scope.
exports:
  kinds:
    - Op
imports:
  Http: ../../../../../../../modules/http-client
---
kind: Telo.Definition
metadata:
  name: Op
capability: Telo.Invocable
schema:
  type: object
  properties:
    name: { type: string }
resources:
  - kind: Http.BearerToken
    metadata:
      name: cred
    token: tok
  - kind: Http.Client
    metadata:
      name: client
    baseUrl: https://example.invalid
    credential: !ref cred
  - kind: Http.Request
    metadata:
      name: req
    client: !ref client
invoke: !ref req
inputs:
  url: /x
