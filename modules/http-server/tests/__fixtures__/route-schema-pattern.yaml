kind: Telo.Application
metadata: { name: RouteSchemaPatternFixture, version: 1.0.0 }
imports: { Http: ../.. }
targets:
  - !ref server
---
# A route's request schema holds a pattern RE2 cannot read (a lookahead): judged
# before the app runs, so the server never starts.
kind: Http.Api
metadata: { name: api }
routes:
  - request:
      path: /codes
      method: POST
      schema:
        body:
          type: object
          properties: { code: { type: string, pattern: "^(?!tmp$)[a-z]+$" } }
    handler: { kind: Telo.Value, value: { ok: true } }
    returns:
      - { status: 200, content: { application/json: { body: { ok: true } } } }
---
kind: Http.Server
metadata: { name: server }
listen: { port: 8080 }
mounts:
  - path: /
    mount: !ref api
