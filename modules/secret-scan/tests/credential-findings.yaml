kind: Telo.Application
metadata:
  name: CredentialFindingsTest
  version: 1.0.0
  description: |
    Every rule of the standard set flags its sample at the line and column where
    the match starts, and ordinary manifest text — an OCI integrity pin, a content
    digest, a UUID, kind names, URLs, CEL and long identifiers — yields nothing.
    The pin and the digest are high-entropy runs; their `sha256-` / `sha512:`
    prefixes are what exempt them.
    The whole result is compared, so a finding carrying the matched text would
    fail it.

    The samples are assembled by concatenation so that no credential-shaped
    literal sits in the repository for a secret scanner to trip on; their bodies
    are repetitive, so only the rule a sample is for reports it.
imports:
  SecretScan: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: credentials
    value:
      - "# credentials that must never be written"
      - !cel "'openai: sk-' + 'aaaaaaaaaaaaaaaaaaaa'"
      - !cel "'aws: AKIA' + 'AAAAAAAAAAAAAAAA'"
      - !cel "'  session: ASIA' + '7777777777777777'"
      - !cel "'github: ghp_' + 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'"
      - !cel "'fine: github_pat_' + 'cccccccccccccccccccccc' + '_dddddddddd'"
      - !cel "'google: AIza' + 'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee'"
      - !cel "'slack: xoxb-' + '1111111111'"
      - !cel "'stripe: sk_live_' + 'ffffffffffffffffffffffff'"
      - !cel "'-----BEGIN RSA ' + 'PRIVATE KEY-----'"
      - !cel "'token: ' + 'Zx8Qp2Lm9Vt4Rk7Nw1Hy6Bc3Jd5Fs0Ga'"
  - name: ordinary
    value:
      - "imports:"
      - "  Http: oci://ghcr.io/telorun/http-server@0.33.0#sha256-KuqDkp68S_hOl7nZ4WJLOyNAn2M3kmPSMwEaeBJbgSw"
      - "  Run: oci://ghcr.io/telorun/run@0.27.1#sha256-O1CdVvYs_O7Zj-PNQxMS3NdgWL6e8M2A0J9Wu0rTnIU"
      - "digest: sha512:z4gqONJJP8kuZFqYP8Olthy4G7fl5bCB29UjdUj5EWlaElQKCtPluCtQ"
      - "kind: Http.Api"
      - "metadata: { name: ScopeCatchAllCoversUnboundedFixture }"
      - "requestId: 3b7b5ad6-fe69-401a-80d4-75a748ec2f19"
      - "homepage: https://hub.telo.run/modules/http-server?version=0.33.0"
      - "x-telo-context-collection-from: items"
      - "body: !cel \"steps.read.result.content.split('\\n').filter(line, line != '')\""
      - "task-management-service-authoring-agent: enabled"
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        credentials: !cel "SecretScan.credentialFindings(steps.credentials.result.join('\\n'))"
        ordinary: !cel "SecretScan.credentialFindings(steps.ordinary.result.join('\\n'))"
      expected:
        credentials:
          - { rule: openaiKey, line: 2, column: 9 }
          - { rule: awsAccessKeyId, line: 3, column: 6 }
          - { rule: awsAccessKeyId, line: 4, column: 12 }
          - { rule: githubToken, line: 5, column: 9 }
          - { rule: githubFineGrainedToken, line: 6, column: 7 }
          - { rule: googleApiKey, line: 7, column: 9 }
          - { rule: slackToken, line: 8, column: 8 }
          - { rule: stripeKey, line: 9, column: 9 }
          - { rule: privateKey, line: 10, column: 16 }
          - { rule: highEntropyToken, line: 11, column: 8 }
        ordinary: []
