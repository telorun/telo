project: authoring-agent
kind: Fixed
body: The primer said nothing about the hub's `category` filter, so the agent
  passed a guessed slug on every search and read the empty results as missing
  capabilities — it asked for Run.Loop by name under `coordination` (the module
  is `Compute`), concluded Telo had no loop, and produced nothing. It is now told
  to search unfiltered, that an empty result is a reason to broaden rather than a
  conclusion, and that `run` is composition itself rather than a capability to go
  hunting for.
