kind: Telo.Application
metadata:
  name: StarlarkDemo
  version: 1.0.0
  description: A demo showcasing a Starlark script run from flat `targets`.
imports:
  Starlark: oci://ghcr.io/telorun/starlark@0.12.0#sha256-Q9ZwjRws5ZDyFc_9PxoBtUcFOn6rM69GVG_Ugln5A7U
  Console: oci://ghcr.io/telorun/console@0.17.0#sha256-KqtPsRldzuy143cbP7H-z0jWgbju-NuP59ItFjkWUg4
targets:
  - name: Step1
    invoke: !ref ExampleStarlarkScript
    inputs:
      value: 42
  - name: Step2
    invoke: !ref Console.writeLine
    inputs:
      output: |
        Evaluated starlark code.
        Result is: ${{ steps.Step1.result.result }}
---
kind: Starlark.Script
metadata:
  name: ExampleStarlarkScript
code: |
  def run(input):
    result = input["value"] * 2
    return {"result": result}
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      value: { type: number }
    required: [ value ]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      result: { type: number }
    required: [ result ]
