kind: Telo.Application
metadata:
  name: StreamTransformsSmokeTest
  version: 1.0.0
  description: |
    Map, Scan and FlatMap, wired as the stages of one pipeline — which is how
    they are actually used, and the only arrangement that shows each one's
    output really is a stream the next can pull from.

    The shape mirrors a token stream: wire records in, reshaped (Map),
    accumulated into running text (Scan), and re-fanned so one record can carry
    several parts or none (FlatMap).
imports:
  Stream: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
# Deliberately includes a record carrying no delta — the keep-alive case, which
# is what FlatMap's empty list is for.
kind: Stream.Of
metadata: { name: source }
items:
  - { kind: delta, text: "Hel" }
  - { kind: delta, text: "lo " }
  - { kind: ping }
  - { kind: delta, text: "wor" }
  - { kind: delta, text: "ld" }
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: src
    invoke: !ref source

  # MAP: one in, one out. Reshapes each wire record into the pipeline's own
  # vocabulary, and proves `index` is in scope.
  - name: mapped
    inputs:
      input: !cel "steps.src.result.output"
    invoke:
      kind: Stream.Map
      value:
        type: !cel "item.kind"
        delta: !cel "'text' in item ? item.text : ''"
        at: !cel "index"
  - name: collectMapped
    inputs:
      input: !cel "steps.mapped.result.output"
    invoke:
      kind: Stream.Collect
  - name: assertMapped
    inputs:
      actual: !cel "steps.collectMapped.result.items"
      expected:
        - { type: delta, delta: "Hel", at: 0 }
        - { type: delta, delta: "lo ", at: 1 }
        - { type: ping, delta: "", at: 2 }
        - { type: delta, delta: "wor", at: 3 }
        - { type: delta, delta: "ld", at: 4 }
    invoke: !ref Assert.equals

  # SCAN: emits the running state after every value, which is what a terminal
  # fold cannot do and what reassembling a token stream needs.
  - name: src2
    invoke: !ref source
  - name: accumulated
    inputs:
      input: !cel "steps.src2.result.output"
    invoke:
      kind: Stream.Scan
      initial: ""
      accumulate: !cel "'text' in item ? acc + item.text : acc"
  - name: collectAccumulated
    inputs:
      input: !cel "steps.accumulated.result.output"
    invoke:
      kind: Stream.Collect
  - name: assertAccumulated
    inputs:
      actual: !cel "steps.collectAccumulated.result.items"
      expected: ["Hel", "Hello ", "Hello ", "Hello wor", "Hello world"]
    invoke: !ref Assert.equals

  # `emit` differing from `accumulate` — the parser shape, where the state and
  # the value worth publishing are not the same thing.
  - name: src3
    invoke: !ref source
  - name: emitted
    inputs:
      input: !cel "steps.src3.result.output"
    invoke:
      kind: Stream.Scan
      initial: ""
      accumulate: !cel "'text' in item ? acc + item.text : acc"
      emit: !cel "size(acc)"
  - name: collectEmitted
    inputs:
      input: !cel "steps.emitted.result.output"
    invoke:
      kind: Stream.Collect
  - name: assertEmitted
    inputs:
      actual: !cel "steps.collectEmitted.result.items"
      expected: [3, 6, 6, 9, 11]
    invoke: !ref Assert.equals

  # FLATMAP: changes cardinality in BOTH directions — a keep-alive produces
  # nothing, and a delta produces one part per character.
  - name: src4
    invoke: !ref source
  - name: expanded
    inputs:
      input: !cel "steps.src4.result.output"
    invoke:
      kind: Stream.FlatMap
      values: !cel "'text' in item ? item.text.split('') : []"
  - name: collectExpanded
    inputs:
      input: !cel "steps.expanded.result.output"
    invoke:
      kind: Stream.Collect
  - name: assertExpanded
    inputs:
      actual: !cel "steps.collectExpanded.result.items.join('')"
      expected: "Hello world"
    invoke: !ref Assert.equals
  - name: assertExpandedCount
    inputs:
      actual: !cel "size(steps.collectExpanded.result.items)"
      expected: 11
    invoke: !ref Assert.equals

  # A stage handed something that is not a stream says so, rather than yielding
  # an empty result that reads as "the source was empty".
  - name: notAStream
    try:
      - name: call
        inputs:
          input: "not a stream"
        invoke:
          kind: Stream.Map
          value: !cel "item"
    catch:
      - name: assertRefused
        inputs:
          actual: !cel "error.code"
          expected: ERR_INVALID_INPUT
        invoke: !ref Assert.equals

  # FlatMap refuses a non-array rather than wrapping it: wrapping would make
  # `values` mean two things, kept apart only by what an expression returned.
  - name: notAnArray
    try:
      - name: src5
        invoke: !ref source
      - name: call
        inputs:
          input: !cel "steps.src5.result.output"
        invoke:
          kind: Stream.FlatMap
          values: !cel "item.kind"
      - name: drain
        inputs:
          input: !cel "steps.call.result.output"
        invoke:
          kind: Stream.Collect
    catch:
      - name: assertNonArrayRefused
        inputs:
          actual: !cel "error.code"
          expected: ERR_INVALID_VALUE
        invoke: !ref Assert.equals
