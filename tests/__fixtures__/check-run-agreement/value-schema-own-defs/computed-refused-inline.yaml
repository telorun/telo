# A computed argument this application's check cannot judge, which an inline type's own definition refuses:
# the contract the kernel binds refuses the call when it is dispatched.
kind: Telo.Application
metadata:
  name: ValueSchemaOwnDefsComputedRefusedInline
  version: 1.0.0
imports:
  Kinds: ./kinds
  Run: ../../../../modules/run
targets:
  - !ref calls
---
kind: Run.Sequence
metadata:
  name: calls
steps:
  - name: call
    invoke: !ref Kinds.inlineCaller
    inputs:
      context:
        turnId: !cel "dyn(42)"
