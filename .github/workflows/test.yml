        shell: bash
        env:
          BUILD_ARGS: ${{ needs.select.outputs.unit_build_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$BUILD_ARGS")
          pnpm -r "${args[@]}" run build

      - name: Run package unit tests
        if: needs.select.outputs.unit_mode == 'full' || (needs.select.outputs.unit_mode == 'selected' && needs.select.outputs.unit_test_args != '[]')
        shell: bash
        env:
          TEST_ARGS: ${{ needs.select.outputs.unit_test_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$TEST_ARGS")
          pnpm -r "${args[@]}" test

      - name: Save staged module files
        if: always() && steps.staged.outputs.key != '' && steps.staged.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-staged-files
        with:
          key: ${{ steps.staged.outputs.key }}
          paths: ${{ steps.staged.outputs.paths }}

  node:
    name: "Linux: manifest tests (Node)"
    runs-on: ubuntu-latest
    needs: select
    if: needs.select.outputs.mode != 'none' || needs.select.outputs.suites == 'true'

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

