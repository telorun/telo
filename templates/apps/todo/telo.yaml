kind: Telo.Application
metadata:
  name: TodoApp
  version: 1.0.0
  categories: [ Transport, Storage ]
  description: |
    A complete app served as one unit: the REST todo API and the vanilla HTML/JS
    frontend that consumes it (`Http.Static`), on a single port. The whole REST
    surface is one declarative `Crud.Resource` — list / read / create / update /
    delete over the `todos` table — mounted alongside the static frontend.

    Run, then open http://localhost:8077.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.29.1#sha256-pE3rCn5FDwOXz2Joi2RnSS1Hcoa69CBl1meW-TVgK70
  Sql: oci://ghcr.io/telorun/sql@0.24.0#sha256-g0Bw5AjrBOGmgGbmsKFb7q833AYlutxV1fDWka47t2I
  SQLite: oci://ghcr.io/telorun/sqlite@0.4.0#sha256-G8qidbhcpiVLiCbrI8TSZZWDO95R4JM9kNX_oVenLmY
  Crud: oci://ghcr.io/telorun/crud@0.14.1#sha256-MXVA6RVrtvymf_2GBPBmXINuAHZ_vdxzbD4u7JdbuTA
targets:
  - !ref migrate
  - !ref server
files:
  - public/app.js
  - public/index.html
  - public/style.css
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8077
---
kind: SQLite.Connection
metadata:
  name: db
file: ./todo.db
---
kind: SQLite.Table
metadata:
  name: todos
table: todos
columns:
  id: { type: integer, primaryKey: true, identity: always }
  text: { type: text, nullable: false }
  is_done: { type: integer, nullable: false, default: 0 }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
tables:
  - !ref todos
---
kind: Http.Server
metadata:
  name: server
port: !cel "ports.http"
openapi:
  info:
    title: Todo API
    version: 1.0.0
mounts:
  - path: /api/todos
    mount:
      kind: Crud.Resource
      connection: !ref db
      plural: todos
      singular: todo
      model:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [ text ]
          additionalProperties: false
          properties:
            text: { type: string, minLength: 1 }
            isDone: { type: boolean }

  - path: /
    mount: !ref ui
---
kind: Http.Static
metadata:
  name: ui
root: ./public
