kind: Telo.Library
metadata:
  name: AiEcho
  version: 1.0.0
  description: Internal Ai.Model test fixture. Echoes the last message back, optionally with a suffix.
imports:
  # Importing the parent @telorun/ai so `Ai` is an alias in scope for `extends: Ai.Model`
  # below. This mirrors exactly how external provider packages (ai-openai, ai-anthropic,
  # ai-ollama) import @telorun/ai — the echo fixture exercises the same code path.
  # Path resolves relative to THIS file (ai-echo.yaml), which lives at
  # modules/ai/tests/__fixtures__/. Two levels up = modules/ai/, the @telorun/ai library.
  Ai: ../../
exports:
  kinds:
    - EchoModel
    - EchoModelStream
    - EchoImageModel
    - StreamCollector
---
kind: Telo.Definition
metadata:
  name: EchoModel
capability: Telo.Invocable
extends: Ai.Model
controllers:
  - pkg:telo/local/js?path=./ai-fixtures.mjs&local_path=./src/index.ts#AiEchoController
schema:
  type: object
  properties:
    suffix:
      title: Suffix
      description: Appended to the echoed content. Default empty.
      type: string
    failOn:
      title: Fail-on rule
      description: |
        Test-only marker: when the last message's content equals `message`,
        invoke()/stream() throw InvokeError(code, reason) instead of echoing.
        Used to exercise provider-error passthrough.
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        reason: { type: string }
      required: [ message, code, reason ]
      additionalProperties: false
    emitToolCall:
      title: Emit tool call
      description: |
        Test-only marker: when `tools` are present and the conversation has no tool
        result yet, invoke() emits this tool call (finishReason "tool-calls") instead
        of echoing. Lets Ai.Agent loop tests run without a live model.
      type: object
      properties:
        name: { type: string }
        arguments: { type: object, additionalProperties: true }
      required: [ name ]
      additionalProperties: false
  additionalProperties: false
---
# The streaming half of the same fixture. Two kinds because Ai.Model and
# Ai.ModelStream are two abstracts with one entry point each — which is the
# whole point of the split, and what a provider that only streams would
# implement alone.
kind: Telo.Definition
metadata:
  name: EchoModelStream
capability: Telo.Invocable
extends: Ai.ModelStream
controllers:
  - pkg:telo/local/js?path=./ai-fixtures.mjs&local_path=./src/index.ts#AiEchoStreamController
schema:
  type: object
  properties:
    suffix:
      title: Suffix
      description: Appended to the echoed content. Default empty.
      type: string
    failOn:
      title: Fail-on rule
      description: |
        Test-only marker: when the last message's content equals `message`,
        invoke()/stream() throw InvokeError(code, reason) instead of echoing.
        Used to exercise provider-error passthrough.
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        reason: { type: string }
      required: [ message, code, reason ]
      additionalProperties: false
    emitProviderState:
      title: Emit provider state
      description: |
        Test-only marker: emit this value as a `provider-state` part, the way a
        provider that keeps its reasoning server-side does.
      type: string
    failAfterDeltas:
      title: Fail after deltas
      description: |
        Test-only marker: reject the iteration after this many text deltas, which
        is how a mid-stream provider failure presents now that a stream fails by
        rejecting rather than by yielding an error part.
      type: integer
      minimum: 0
    emitToolCall:
      title: Emit tool call
      description: |
        Test-only marker: when `tools` are present and the conversation has no tool
        result yet, invoke() emits this tool call (finishReason "tool-calls") instead
        of echoing. Lets Ai.Agent loop tests run without a live model.
      type: object
      properties:
        name: { type: string }
        arguments: { type: object, additionalProperties: true }
      required: [ name ]
      additionalProperties: false
  additionalProperties: false
---
# Internal Ai.ImageModel fixture. Produces deterministic bytes describing the request
# it received, so tests can assert what reached the provider without a live model or
# a real encoder — the bytes are not a valid image, and nothing in the contract
# decodes them.
#
# `$defs/Intent` is narrower than the OpenAI provider's on purpose: Ai.Image derives
# its `intent` field from it, so a manifest naming `variation` against THIS model is
# a static error, which is what tests/image-rejects-unsupported-intent.yaml asserts.
kind: Telo.Definition
metadata:
  name: EchoImageModel
capability: Telo.Provider
extends: Ai.ImageModel
controllers:
  - pkg:telo/local/js?path=./ai-fixtures.mjs&local_path=./src/index.ts#AiEchoImageController
schema:
  type: object
  properties:
    mediaType:
      title: Media type
      description: Media type reported for every produced image. Default image/png.
      type: string
    count:
      title: Count
      description: How many images to produce per call. Default 1.
      type: integer
      minimum: 0
    width:
      title: Width
      description: Pixel width to report. Omitted from the result when unset, exercising the optional-dimension path.
      type: integer
      minimum: 1
    height:
      title: Height
      description: Pixel height to report.
      type: integer
      minimum: 1
    refuseOn:
      title: Refuse-on rule
      description: |
        Test-only marker: when the prompt equals `prompt`, the run reports
        content-filter and yields only `keep` images. `keep: 0` is total refusal,
        a smaller-than-count value is partial.
      type: object
      properties:
        prompt: { type: string }
        keep: { type: integer, minimum: 0 }
      required: [ prompt ]
      additionalProperties: false
    reportUsage:
      title: Report usage
      description: Whether to report a usage quantity, exercising both the present and absent paths.
      type: boolean
  additionalProperties: false
  $defs:
    Intent:
      type: string
      enum: [ edit, inpaint ]
---
# Test-support Invocable: takes an Ai.ModelStream reference, drives it, collects
# the parts, and returns them. Lets stream-contract tests exercise the streaming
# path without a dedicated consumer kind.
kind: Telo.Definition
metadata:
  name: StreamCollector
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./ai-fixtures.mjs&local_path=./src/index.ts#StreamCollectorController
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.ModelStream implementation whose parts will be collected.
      x-telo-ref:
        kind: Ai.ModelStream
        use: [call, trigger.consumer]
  required: [ model ]
  additionalProperties: false
