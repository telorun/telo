  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/jav.traineddata.gz:
        { upstream: jav, member: package/4.0.0_best_int/jav.traineddata.gz, sha256: 2a4f959dd02bc2013f958297c1c897b259f8c3b104659265d457c849b268a2bc, executable: false }
---
kind: TesseractModel.Language
metadata:
  name: jav
  description: Javanese, Latin script
code: jav
data: !module-path ./tessdata/jav.traineddata.gz
