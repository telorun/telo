modules:
  modules/http-server: Added
body: "Breaking: Http.Static root is a Telo.HostPath: an absolute directory. Write a directory
  that ships with the module as `root: !module-path ./public` — publish and packaging
  carry it with no files: entry — and one on the host from a variable declared
  x-telo-type: Telo.HostPath. A relative literal is refused (HOST_PATH_RELATIVE); it
  used to be resolved against the declaring manifest, which pointed a packaged
  application at its unpack cache. Requires telo >=0.98.0."
