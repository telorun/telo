kind: Telo.Application
metadata:
  name: UiShowcase
  version: 1.0.0
  categories: [ UI ]
  description: |
    A tour of everything a declarative screen can do, with no hand-written
    frontend, in fifteen languages: every node type and text form, conditions
    and query parameters, data readers with loading and failure states and a
    sign-in gate, data grids, filter bars, forms, actions, custom components,
    a generated admin screen, related records drawn as a table, cards, a board,
    a calendar and a tree, tabs and themes. The same pages are served four
    times — under the built-in look with a brand chosen per request, under a
    Radix theme, under a theme of the example's own with a bundled typeface,
    and with a sidebar that collapses to a rail and becomes a bottom tab bar
    on a phone. The data is a small studio's team, people, projects, tasks,
    requests, bookings, comments, blog posts and reporting lines in SQLite,
    with real sessions behind a sign-in gate.
# Module `lang:`, `UiReact.App.words` and every key of the data-driven screen
# vocabulary are read from 0.121.0.
requires:
  telo: ">=0.121.0"
lang: en
# The UI modules, `data-model`, `crud` and `crud-ui` come from this repository
# while their changes are unreleased, with every module they reach in it:
# `http-server`, `sql`, `sqlite`, `font` and `i18n`; `telo upgrade --pin-local`
# pins them again once they ship.
imports:
  Http: ../../modules/http-server
  Run: oci://ghcr.io/telorun/run@0.30.0#sha256-xce3zcKQZYXAuMPQqUW4R0avisqZWYowLDLeaP7wXkc
  Sql: ../../modules/sql
  SQLite: ../../modules/sqlite
  Crud: ../../modules/crud
  CrudUi: ../../modules/crud-ui
  DataModel: ../../modules/data-model
  Font: ../../modules/font
  I18n: ../../modules/i18n
  Ui: ../../modules/ui
  UiReact: ../../modules/ui-react
  Radix: ../../modules/ui-react-radix
  UiLucide: ../../modules/ui-lucide
  # Two libraries of the example's own: its browser components, and the theme
  # the `/brand` mount draws with.
  Components: ./components
  Brand: ./brand
# The database, the routes crud does not give, the translator with one catalog
# file per language, and one file per page holding the view every application
# places there.
include:
  - ./data.yaml
  - ./api.yaml
  - ./translator.yaml
  - ./translations/de.yaml
  - ./translations/es.yaml
  - ./translations/fr.yaml
  - ./translations/hi.yaml
  - ./translations/it.yaml
  - ./translations/ja.yaml
  - ./translations/ko.yaml
  - ./translations/nl.yaml
  - ./translations/pl.yaml
  - ./translations/pt.yaml
  - ./translations/ru.yaml
  - ./translations/tr.yaml
  - ./translations/uk.yaml
  - ./translations/zh.yaml
  - ./pages-overview.yaml
  - ./pages-conditions.yaml
  - ./pages-data.yaml
  - ./pages-tables.yaml
  - ./pages-filters.yaml
  - ./pages-forms.yaml
  - ./pages-actions.yaml
  - ./pages-components.yaml
  - ./pages-crud.yaml
  - ./pages-records.yaml
  - ./pages-themes.yaml
targets:
  - !ref migrate
  - !ref server
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8150
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: Telo.HostPath
    default: ./showcase.db
---
# A composite kind of the example's own, with no controller: a heading and a
# line under it, in one of the styles that carry a colour. It provides through
# a view, as any composite with no code of its own does.
kind: Telo.Definition
metadata:
  name: Callout
  description: >-
    A highlighted note for a page: a heading and one line under it, drawn in an
    accent, warning, success or danger colour.
capability: Telo.Provider
extends: Ui.Composite
schema:
  type: object
  additionalProperties: false
  required: [ heading, body, tone ]
  properties:
    heading: { $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
    body: { $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
    tone: { type: string, enum: [ accent, warning, success, danger ] }
resources:
  - kind: Ui.View
    metadata: { name: view }
    content:
      type: box
      style: !cel "self.tone"
      children:
        - { type: text, text: !cel "self.heading", style: subheading }
        - { type: text, text: !cel "self.body" }
provide: !ref view
---
# The showcase's mark, placed before the title of all four applications. An
# image's `src` resolves under the mount it is drawn in, and the files are
# served under each mount, so one view serves all four.
kind: Ui.View
metadata: { name: logo }
content: { type: image, src: /files/mark.svg, alt: UI showcase logo }
---
# The language a request is answered in, chosen from the translator's catalogs.
kind: I18n.Negotiator
metadata: { name: language }
translator: !ref t
default: en
---
# The showcase under the built-in look. Its brand follows the request: with the
# `showcase-brand=acme` cookie (set by `/api/brand?set=acme`) the Acme tokens
# apply, and with none the theme's own values do. Two pages carry nodes of
# their own beside the shared view — the per-request nodes and the page's
# query — because a view is resolved once at start and reads neither.
#
# Each of the four applications is answered in the language
# `Self.chosenLanguage` picks — the `showcase-lang` cookie (set by
# `/api/lang?set=pl` under its mount), else the Accept-Language header — and
# draws the same header: the mark, then two menus, Language with the language
# in effect marked, and Theme with the four mounts' home pages — another
# mount's by an absolute address built from the request's `Self.origin`, since an app-relative
# link resolves under the mount it is drawn in — and this mount marked. This
# one adds the brand switch to its Theme menu, each item delivered only while
# it changes something.
kind: UiReact.App
metadata: { name: showcase }
title: UI showcase
words: !ref Ui.words
translator: !ref t
lang: !cel >-
  Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
  'accept-language' in request.headers ? request.headers['accept-language'] : '')
theme: !ref UiReact.defaultTheme
tokens:
  - when: !cel "'cookie' in request.headers && Self.cookie(request.headers['cookie'], 'showcase-brand') == 'acme'"
    tokens:
      kind: Ui.DesignTokens
      color.accent: "#b4232a"
      color.accent-text: "#fff8f0"
      color.background: "#fff8f0"
      radius.sm: "2px"
      radius.md: "2px"
      radius.lg: "4px"
stylesheets:
  - !module-path ./showcase.css
compactBelow: 48rem
header:
  start:
    - { type: composite, ref: !ref logo }
  end:
    - type: menu
      text: Language
      items:
        - type: link
          text: English
          href: "/api/lang?set=en"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'en' ? ['strong'] : []
        - type: link
          text: Deutsch
          href: "/api/lang?set=de"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'de' ? ['strong'] : []
        - type: link
          text: Español
          href: "/api/lang?set=es"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'es' ? ['strong'] : []
        - type: link
          text: Français
          href: "/api/lang?set=fr"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'fr' ? ['strong'] : []
        - type: link
          text: Italiano
          href: "/api/lang?set=it"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'it' ? ['strong'] : []
        - type: link
          text: Nederlands
          href: "/api/lang?set=nl"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'nl' ? ['strong'] : []
        - type: link
          text: Polski
          href: "/api/lang?set=pl"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'pl' ? ['strong'] : []
        - type: link
          text: Português
          href: "/api/lang?set=pt"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'pt' ? ['strong'] : []
        - type: link
          text: Türkçe
          href: "/api/lang?set=tr"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'tr' ? ['strong'] : []
        - type: link
          text: Русский
          href: "/api/lang?set=ru"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'ru' ? ['strong'] : []
        - type: link
          text: Українська
          href: "/api/lang?set=uk"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'uk' ? ['strong'] : []
        - type: link
          text: हिन्दी
          href: "/api/lang?set=hi"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'hi' ? ['strong'] : []
        - type: link
          text: 日本語
          href: "/api/lang?set=ja"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'ja' ? ['strong'] : []
        - type: link
          text: 한국어
          href: "/api/lang?set=ko"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'ko' ? ['strong'] : []
        - type: link
          text: 中文
          href: "/api/lang?set=zh"
          style: !cel >-
            Self.chosenLanguage('cookie' in request.headers ? request.headers['cookie'] : '',
            'accept-language' in request.headers ? request.headers['accept-language'] : '') == 'zh' ? ['strong'] : []
    - type: menu
      text: Theme
      items:
        - { type: link, text: Default, href: /, style: strong }
        - type: link
          text: Radix
          href: !cel >-
            Self.origin('host' in request.headers ? request.headers['host'] : '', 'x-forwarded-proto' in request.headers ? request.headers['x-forwarded-proto'] : '') + '/radix/'
        - type: link
          text: Brand
          href: !cel >-
            Self.origin('host' in request.headers ? request.headers['host'] : '', 'x-forwarded-proto' in request.headers ? request.headers['x-forwarded-proto'] : '') + '/brand/'
        - type: link
          text: Sidebar
          href: !cel >-
            Self.origin('host' in request.headers ? request.headers['host'] : '', 'x-forwarded-proto' in request.headers ? request.headers['x-forwarded-proto'] : '') + '/sidebar/'
        - type: link
          text: Use the Acme brand
          href: "/api/brand?set=acme"
          when: !cel "!('cookie' in request.headers && Self.cookie(request.headers['cookie'], 'showcase-brand') == 'acme')"
        - type: link
          text: "Use the theme's own values"
          href: "/api/brand?set=none"
          when: !cel "'cookie' in request.headers && Self.cookie(request.headers['cookie'], 'showcase-brand') == 'acme'"
pages:
  - !ref rootOverview
  - !ref rootConditions
  - !ref dataScreen
  - !ref tablesScreen
  - !ref filtersScreen
  - !ref formsScreen
  - !ref actionsScreen
  - !ref componentsScreen
  - !ref crudScreen
  - !ref recordsScreen
  - !ref rootThemes
# The pages as a tree: the screens built from nodes in one group, the ones
# entering data in a group inside it.
navigation:
  items:
    - { type: page, page: !ref rootOverview, icon: !ref overviewIcon }
    - type: group
      text: Building blocks
      icon: !ref buildingBlocksIcon
      items:
        - { type: page, page: !ref rootConditions, icon: !ref conditionsIcon }
        - { type: page, page: !ref dataScreen, icon: !ref dataIcon }
        - { type: page, page: !ref tablesScreen, icon: !ref tablesIcon }
        - { type: page, page: !ref filtersScreen, icon: !ref filtersIcon }
        - type: group
          text: Input
          icon: !ref inputIcon
          items:
            - { type: page, page: !ref formsScreen, icon: !ref formsIcon }
            - { type: page, page: !ref actionsScreen, icon: !ref actionsIcon }
    - { type: page, page: !ref componentsScreen, icon: !ref componentsIcon }
    - { type: page, page: !ref crudScreen, icon: !ref crudIcon }
    - { type: page, page: !ref recordsScreen, icon: !ref recordsIcon }
    - { type: page, page: !ref rootThemes, icon: !ref themesIcon }
---
# The overview at the root: the view every application places, and nodes of
# this application's own evaluated per request.
kind: Ui.Page
metadata: { name: rootOverview }
path: /
title: Overview
children:
  - { type: composite, ref: !ref overviewPage }
  - type: stack
    children:
      - { type: text, text: Per request, style: heading }
      - type: text
        style: muted
        text: These nodes are the page's own, so their when and their text are evaluated for every request.
      - type: text
        style: accent
        text: Your browser asked for Polish.
        when: !cel "'accept-language' in request.headers && Self.language(request.headers['accept-language']) == 'pl'"
      - type: text
        text: Your browser did not ask for Polish.
        when: !cel "!('accept-language' in request.headers) || Self.language(request.headers['accept-language']) != 'pl'"
      - type: badge
        style: accent
        text: The Acme brand is on.
        when: !cel "'cookie' in request.headers && Self.cookie(request.headers['cookie'], 'showcase-brand') == 'acme'"
      - type: text
        style: muted
        text: A text an expression computes is shown as computed, never translated.
      - type: text
        text: !cel "'user-agent' in request.headers ? 'User-Agent: ' + request.headers['user-agent'] : 'No User-Agent header was sent.'"
      - type: text
        style: muted
        text: A link this request makes invalid is replaced by an error node, and the rest of the page is served.
      - type: link
        text: Leaves the application
        href: !cel "'//' + ('host' in request.headers ? request.headers['host'] : 'elsewhere.example')"
---
# The conditions at the root, with a node of the page's own reading its query.
kind: Ui.Page
metadata: { name: rootConditions }
path: /conditions
title: Conditions
query:
  mode: { type: string, enum: [ compact, detailed ] }
children:
  - { type: composite, ref: !ref conditionsPage }
  - type: stack
    children:
      - { type: text, text: A page's own query, style: heading }
      - type: text
        style: muted
        text: This page declares mode as well, and its own nodes read it.
      - type: text
        style: success
        text: The page reads mode as detailed.
        shown: { at: !cel "query.mode", matches: { const: detailed } }
      - type: value
        value: !cel "query.mode"
---
# The themes at the root, with links to the other two mounts and the brand switch.
kind: Ui.Page
metadata: { name: rootThemes }
path: /themes
title: Themes
children:
  - { type: composite, ref: !ref themesPage }
  - type: stack
    children:
      - { type: text, text: Switch the mount or the brand, style: heading }
      - type: text
        style: muted
        text: >-
          These links are this application's own: a link resolves under the mount it is drawn in, so only the
          application at the root reaches the other two. Each is an ordinary load of another application.
      - type: columns
        children:
          - { type: link, text: Open the Radix mount, href: /radix/themes }
          - { type: link, text: Open the brand mount, href: /brand/themes }
      - type: text
        style: muted
        text: >-
          This application's brand is chosen for every request. The switch sets or clears a cookie and comes
          back here, and while the cookie is there the Acme token set is used instead of the theme's own.
      - type: columns
        children:
          - { type: link, text: Use the Acme brand, href: "/api/brand?set=acme" }
          - { type: link, text: "Use the theme's own values", href: "/api/brand?set=none" }
      - type: badge
        style: accent
        text: The Acme brand is on.
        when: !cel "'cookie' in request.headers && Self.cookie(request.headers['cookie'], 'showcase-brand') == 'acme'"
---
