  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/msa.traineddata.gz:
        { upstream: msa, member: package/4.0.0_best_int/msa.traineddata.gz, sha256: 35ae490b99462d04cf4e2a7985d98f0ba5e10ca62adb13aeda070c6f1783f097, executable: false }
---
kind: TesseractModel.Language
metadata:
