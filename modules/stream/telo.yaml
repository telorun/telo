kind: Telo.Library
metadata:
  name: Stream
  version: 0.11.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Streaming]
  description: |
    The ends and the middle of a stream pipeline: turn a list of values into a stream,
    in order, drain a stream back into a list once it finishes, and re-frame a byte
    stream into fixed-size chunks carrying their own offset. Values may be anything the
    downstream consumer expects — text, records, numbers — so the same set serves any
    streaming pipeline.
exports:
  kinds:
    - Of
    - Collect
    - Chunk
    - Map
    - Scan
    - FlatMap
---
# Emit a list of items as a stream, in order — declared statically or supplied
# at invoke time.
#
# `items` may be declared as a static resource field (fixed data, no JS) or
# passed as invoke inputs to emit values computed at request time (e.g. a
# read-through cache hit streaming a stored value). Runtime inputs take
# precedence over the declared list; when neither is present the stream is empty.
#
# Value-agnostic: `items` may hold strings, objects, numbers — whatever the
# downstream consumer expects (e.g. strings into PlainText.Encoder, AI-shape
# records into RecordStream.ExtractText). The output is an opaque stream today;
# the eventual `x-telo-stream: { items }` form will let it carry a static
# element type.
kind: Telo.Definition
metadata:
  name: Of
  description: >-
    Emits a list of values as a stream, in order. The list can be fixed in the
    declaration or supplied at the call site, which lets a stored or computed value be
    replayed into a streaming consumer.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#OfController
schema:
  type: object
  properties:
    items:
      title: Items
      description: Literal values to emit as a stream, in order. Optional — a static default overridden by runtime invoke inputs.
      type: array
  additionalProperties: false
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      items:
        title: Items
        description: Runtime values to emit as a stream, in order. When provided, overrides the statically-declared items.
        type: array
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Stream of the declared items, in order.
    required: [ output ]
    additionalProperties: false
---
# Terminal stream sink — the inverse of Stream.Of. Consumes `input` fully and
# returns every item as `items`, in order. Draining drives the producer's side
# effects (so it runs an upstream agent / pipeline); `items` materializes the finite
# stream so a caller can inspect, assert, or aggregate it in CEL (e.g.
# `items.exists(r, r.type == 'tool-call')`). Value-agnostic and buffered — bounded by
# the stream's length. For an unbounded stream, drain incrementally instead.
kind: Telo.Definition
metadata:
  name: Collect
  description: >-
    Drains a stream to completion and returns every value as a list, in order. Running
    it drives whatever produces the stream, and the collected list can then be
    inspected or aggregated. Buffered, so it needs a finite stream.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#CollectController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-type: Telo.Stream
        description: Async iterable to consume to completion.
    required: [ input ]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      items:
        type: array
        description: Every item observed on `input`, in order.
    required: [ items ]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
---
# Stream.Chunk — re-frames a byte stream into fixed-size pieces.
#
# The boundaries a byte stream arrives with are an artifact of the transport (a
# socket read, a file read-ahead) and are never the ones a consumer wants. A
# resumable upload needs the size the far end mandates; a framed protocol needs
# its frame size. So this coalesces and splits rather than merely regrouping.
#
# Each record carries its OFFSET and whether it is `last`, so positional framing
# — a `Content-Range` header, a sequence number — is expressible in CEL at the
# use site. Deriving the offset downstream would mean accumulating state across
# iterations of a body that has nowhere to keep it.
kind: Telo.Definition
metadata:
  name: Chunk
  description: >-
    Re-frames a stream of bytes into consecutive pieces of a fixed size, buffering
    across the boundaries the bytes happened to arrive on and splitting any piece that
    is too large. Every piece reports where it starts, how long it is, its position in
    the sequence and whether it is the final one, so range headers and sequence
    numbers can be built at the point of use. Only the last piece is short, an empty
    source yields nothing, and one piece is held in memory at a time.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#ChunkController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-type:
          name: Telo.Stream
          of: Telo.Bytes
        description: Byte stream to re-frame.
      size:
        type: integer
        minimum: 1
        description: >-
          Bytes per piece, overriding the declared `size`. Supplied per call for a
          size the far end dictates (a resumable upload negotiates one).
    required: [input]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type:
          name: Telo.Stream
          of:
            type: object
            additionalProperties: false
            required: [bytes, offset, length, index, last]
            properties:
              bytes:
                x-telo-type: Telo.Bytes
                description: This piece's bytes.
              offset:
                type: integer
                description: Byte offset of this piece from the start of the stream.
              length:
                type: integer
                description: Number of bytes in this piece.
              index:
                type: integer
                description: Zero-based position of this piece in the sequence.
              last:
                type: boolean
                description: True for the final piece, so a consumer can close its framing.
        description: Stream of fixed-size pieces, in order.
    required: [output]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
  properties:
    size:
      title: Size
      type: integer
      minimum: 1
      description: >-
        Default bytes per piece, used when a call supplies none. Declared here when
        the size is a property of the destination rather than of the call.
---
# The three element-wise transforms every streaming protocol is assembled from.
#
# They exist so a manifest can produce a token stream at all: an SSE decoder
# hands over wire frames, and turning those into a provider's parts is mapping,
# accumulating and re-fanning them — work that was previously only expressible
# in a controller, which is why every provider shipped one.
#
# All three are LAZY. The work happens as the consumer pulls, so a stage never
# drains its source to build a result, and abandonment costs nothing to support:
# a consumer that stops draining causes `for await` to call `return()` on the
# stage, which propagates to its own source and so on to the transport.
kind: Telo.Definition
metadata:
  name: Map
  description: >-
    Transforms every value of a stream with a CEL expression, one in and one out, as
    the consumer pulls. The expression sees each value and its position, so a wire
    record can be reshaped into whatever the next stage expects without buffering the
    stream.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#MapController
throws:
  codes:
    ERR_INVALID_INPUT:
      description: "`input` did not resolve to an async iterable."
    ERR_INVALID_VALUE:
      description: >-
        `value` was written blank. Raised per call rather than at load — a key with no
        value parses to null, which the schema cannot tell from a CEL node.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input]
    properties:
      input:
        x-telo-type: Telo.Stream
        description: Stream whose values are transformed.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Stream of transformed values, in order.
schema:
  type: object
  additionalProperties: false
  required: [value]
  properties:
    elementType:
      title: Element Type
      description: >-
        The contract each produced value satisfies — a named type reference or an inline
        type definition. Declaring it holds `value` to that shape at analysis time, so a
        stage that drops a field the next one reads is an error before it runs.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    value:
      title: Value
      description: >-
        Each output value, evaluated once per element — a CEL expression, a structure
        with `!cel` leaves, or a literal. Sees item, index and inputs.
      x-telo-context:
        type: object
        properties:
          inputs: {}
          item: {}
          index: { type: integer }
      x-telo-value-schema-from: elementType
---
kind: Telo.Definition
metadata:
  name: Scan
  description: >-
    Accumulates a stream and emits the running state after every value, so a consumer
    sees each intermediate result rather than only the total. Reassembling text from
    deltas is the usual case: the accumulated value is what a reader wants, and it has
    to arrive per value rather than at the end.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#ScanController
throws:
  codes:
    ERR_INVALID_INPUT:
      description: "`input` did not resolve to an async iterable."
    ERR_INVALID_VALUE:
      description: "`accumulate` was written blank."
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input]
    properties:
      input:
        x-telo-type: Telo.Stream
        description: Stream to accumulate over.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Stream of emitted values, one per input value, in order.
schema:
  type: object
  additionalProperties: false
  required: [initial, accumulate]
  properties:
    accType:
      title: Accumulator Type
      description: >-
        The running state's contract — a named type reference or an inline type
        definition. Declaring it types `acc` inside `accumulate` and `emit`, and holds
        both the seed and the step to that shape at analysis time.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    initial:
      title: Initial
      description: The starting accumulator, evaluated once before the first value. Sees inputs.
      x-telo-context:
        type: object
        properties:
          inputs: {}
      x-telo-value-schema-from: accType
    accumulate:
      title: Accumulate
      description: >-
        The accumulator's next value, evaluated once per element. Sees acc, item, index
        and inputs. It REPLACES the accumulator rather than merging into it.
      x-telo-context:
        type: object
        properties:
          inputs: {}
          acc: { x-telo-context-from-root: "accType" }
          item: {}
          index: { type: integer }
      x-telo-value-schema-from: accType
    emit:
      title: Emit
      description: >-
        What to emit for this element, evaluated after `accumulate` against the NEW
        accumulator. Omitted, the accumulator itself is emitted. Declared separately
        because the state and the value worth publishing are routinely different — a
        parser accumulates a buffer and emits only the frames it completed.
      x-telo-context:
        type: object
        properties:
          inputs: {}
          acc: { x-telo-context-from-root: "accType" }
          item: {}
          index: { type: integer }
---
kind: Telo.Definition
metadata:
  name: FlatMap
  description: >-
    Expands every value of a stream into any number of values, flattened into one
    stream. One wire frame routinely carries several logical records, and a keep-alive
    carries none, so emitting a list — empty to drop the value — is what lets a stage
    change how many values flow through it.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#FlatMapController
throws:
  codes:
    ERR_INVALID_INPUT:
      description: "`input` did not resolve to an async iterable."
    ERR_INVALID_VALUE:
      description: >-
        `values` was written blank, or evaluated to something other than an array. A
        non-array is refused rather than emitted as one value: that would make `values`
        mean two things kept apart only by what an expression happened to return.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input]
    properties:
      input:
        x-telo-type: Telo.Stream
        description: Stream whose values are expanded.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Stream of the produced values, in order, flattened.
schema:
  type: object
  additionalProperties: false
  required: [values]
  properties:
    elementType:
      title: Element Type
      description: >-
        The contract each produced value satisfies — a named type reference or an inline
        type definition. Declaring it holds every element of `values` to that shape at
        analysis time.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    values:
      title: Values
      description: >-
        The values this element expands to, evaluated once per element. Must be an
        array; emit [] to drop the element. Sees item, index and inputs.
      type: array
      x-telo-context:
        type: object
        properties:
          inputs: {}
          item: {}
          index: { type: integer }
