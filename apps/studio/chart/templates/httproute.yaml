{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs is required when httpRoute.enabled is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "studio-web.name" . }}
  labels:
    {{- include "studio-web.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    # Everything on the Studio host but /api, which the Cloud API's route
    # matches (the longer prefix wins).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "studio-web.name" . }}
          port: {{ .Values.service.port }}
{{- end }}
