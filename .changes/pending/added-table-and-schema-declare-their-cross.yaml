modules:
  modules/postgres: Added
  modules/sql: Added
body: "Table and Schema declare their cross-field invariants as resource rules, so an
  index naming a column the table does not declare, a foreign key whose two sides differ
  in length, a renamedFrom still declared, and a composite primaryKey are reported by
  `telo check` instead of at boot — several of them previously failed only after
  `beforeMigrations:` had already changed the database. `reclaim.afterDuration: 0ms` is
  now a warning rather than passing silently. The controllers keep every guard: a
  library caller reaching `runSchemaPass` directly never passed through `telo check`."
