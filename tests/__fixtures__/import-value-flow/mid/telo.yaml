kind: Telo.Library
metadata:
  name: ImportValueFlowMid
  version: 1.0.0
imports:
  Data:
    source: ../data
    variables:
      dbFile: "${{ variables.dbFile }}"
variables:
  dbFile:
    anyOf:
      - const: ":memory:"
      - type: string
        x-telo-type: Telo.HostPath
exports:
  resources: [ Data.db, Data.migrate ]
