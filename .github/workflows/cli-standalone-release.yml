name: Release standalone CLI

# Builds the single-file `telo` executable for every target that has an official
# Node runtime, wraps each one in a native installer, and publishes the set as a
# GitHub Release.
#
# Called by the branch's Publish workflow on every channel that released a CLI
# (a candidate included), with the release's `version` and `tag`; it builds the
# tag's tree — a candidate's names the commit Publish ran on, a final's or patch's
# its publication commit, which differs only in import lines — so the binaries are
# the ones the npm CLI was published from.
#
# THE BINARIES ARE ASSETS OF THE PRODUCT'S RELEASE, NOT A RELEASE OF THEIR OWN.
# `scripts/github-releases.mjs` creates `v<cli version>` in the Publish run (a
# candidate's in its `release` job, a final's or patch's in `publication`) and owns
# its name and body; this workflow attaches files to that
# tag and sets neither. A second release for the same version of the same product
# would split one changelog across two pages, and make "which one is the release?"
# a question with two answers.
#
# **NO PUBLISHED RELEASE WITHOUT INSTALLERS.** That release is created as a
# DRAFT, and the last job here promotes it — after every target has built and
# after the packages have been installed in containers that have no Node.js. A
# published `v<version>` carrying no installers is one nobody can install from,
# and it is what this repo shipped twice before the promotion gate existed.
# `releases/latest`, which the install scripts read, skips drafts, so a failed
# build leaves the previous release standing instead of pointing users at an
# empty one. Promotion publishes a candidate as a pre-release that is not latest,
# and a final or patch as latest unless a higher release already is
# (`scripts/release-promote.mjs`).
#
# The webview helper `telo run` drives as the desktop host (`cli/rust/desktop-host`)
# is published beside the CLI as `telo-desktop-host-<version>-<os>-<arch>[-<libc>]`,
# one asset per target, and listed in the same `checksums.txt`. The CLI does not
# carry it: `telo run` downloads it on first use and checks it against that file.
#
# A build runs on the runner its target needs: macOS signing needs macOS, and a
# Windows installer needs Windows. Everything else cross-builds, because nothing
# here compiles native code — the Node runtime and esbuild's executable are
# downloaded prebuilt for the target, and the blob injected into the runtime is
# platform-independent.

on:
  workflow_call:
    inputs:
      channel:
        description: 'candidate, final or patch (never none: Publish does not call this then).'
        type: string
        required: true
      version:
        description: 'The CLI version released (0.85.0-rc.1, 0.85.0, 0.85.1).'
        type: string
        required: true
      tag:
        description: 'The release tag (v<version>), checked out; it exists, with a draft release, before this runs.'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smoke` is how the built binary can be executed HERE: `native` when
          # the runner is that target, `alpine` for the musl build, which needs
          # a musl userland, and absent for a cross-built target no runner can
          # load — `verify` and the install scripts cover those.
          - target: linux-amd64-gnu
            os: ubuntu-22.04
            smoke: native
          - target: linux-amd64-musl
            os: ubuntu-22.04
            smoke: alpine
          - target: linux-arm64-gnu
            os: ubuntu-22.04
          - target: darwin-amd64
            os: macos-latest
          - target: darwin-arm64
            os: macos-latest
            smoke: native
          - target: windows-amd64
            os: windows-latest
            smoke: native
          - target: windows-arm64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Pinned, not read from the repo's package.json: that file declares no
      # `engines.node`, so `node-version-file` silently leaves the runner's
      # default in place — and which Node builds the binary decides which Node
      # archives the cross-targets can fetch.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm --filter "@telorun/cli..." build

      - name: Build standalone binary
        env:
          # This binary IS the release, and says so: `telo package` lets only a
          # released telo stand a downloaded carrier around an application.
          TELO_RELEASE_BUILD: "1"
        run: pnpm --filter @telorun/cli exec node scripts/build-standalone.mjs --target ${{ matrix.target }} --out ../../dist-standalone

      # The binary is the deliverable; the installers wrap it. Each one only has
      # to put `telo` on PATH, so they are built from the same file rather than
      # from per-format staging trees, and a format whose tool is missing fails
      # the build rather than leaving the release short of a package nobody
      # notices until they cannot install it.
      # rpmbuild is not on a stock Ubuntu runner, and the packaging script now
      # fails rather than skipping a format — a release quietly missing its
      # `.rpm` is what that policy exists to prevent.
      - name: Install Linux packaging tools
        if: startsWith(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Linux packages
        if: startsWith(matrix.target, 'linux')
        run: node .github/scripts/package-standalone.mjs --target ${{ matrix.target }} --version ${{ inputs.version }} --dir dist-standalone

      - name: Build macOS package
        if: startsWith(matrix.target, 'darwin')
        run: node .github/scripts/package-standalone.mjs --target ${{ matrix.target }} --version ${{ inputs.version }} --dir dist-standalone

      # WiX builds the `.msi`; without it the packaging step fails rather than
      # publishing a Windows release with only a `.zip`.
      #
      # Pinned to the last 5.x on purpose. From v6 the toolset refuses to run
      # until the Open Source Maintenance Fee EULA is accepted (`error
      # WIX7015`), and accepting a licence on the project's behalf is not a CI
      # decision — an unpinned `dotnet tool install` made the release's fate a
      # function of what NuGet served that morning.
      - name: Install WiX
        if: startsWith(matrix.target, 'windows')
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build Windows package
        if: startsWith(matrix.target, 'windows')
        run: node .github/scripts/package-standalone.mjs --target ${{ matrix.target }} --version ${{ inputs.version }} --dir dist-standalone

      # Proof the artifact runs at all, from a shell that cannot see the runner's
      # Node. It is not the full verification — that is the container check below
      # — but it catches a binary that was built wrong before anything is
      # published.
      - name: Smoke test
        if: matrix.smoke == 'native'
        shell: bash
        run: |
          set -euo pipefail
          BIN=dist-standalone/telo
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          PATH=/usr/bin:/bin "$BIN" --version

      # The musl binary names `/lib/ld-musl-x86_64.so.1` as its interpreter, so
      # a glibc runner cannot load it at all: the kernel refuses the exec and
      # the shell reports the BINARY as `No such file or directory`, which reads
      # as a build that produced no file. Alpine is the shell that can see it,
      # and it carries no Node either. `libstdc++` because the official musl
      # runtime is linked against it and a bare Alpine has neither it nor
      # `libgcc_s` — the install scripts say so too.
      - name: Smoke test (musl)
        if: matrix.smoke == 'alpine'
        run: |
          docker run --rm -v "$PWD/dist-standalone:/telo" alpine:3.20 \
            sh -c 'apk add --no-cache libstdc++ >/dev/null && /telo/telo --version'

      # The packaged formats, and only those. A release asset is named by its
      # BASENAME, and the bare `telo` / `telo.exe` are named for no target — so
      # all seven jobs wrote one asset called `telo`, each deleting and
      # re-uploading the last one's, which is what the concurrent `error
      # updating release asset metadata ... Not Found` was. Whichever job
      # finished last decided which platform's binary a visitor downloaded.
      # Nothing reads them: the install scripts fetch the archives, and every
      # archive holds the same binary.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telo-${{ matrix.target }}
          path: |
            dist-standalone/*.tar.gz
            dist-standalone/*.zip
            dist-standalone/*.deb
            dist-standalone/*.rpm
            dist-standalone/*.pkg
            dist-standalone/*.msi
          if-no-files-found: error

  # The desktop host's webview helper. Unlike the CLI it IS native code against a
  # toolkit (WebKitGTK, WKWebView, WebView2), so each target builds on a runner of
  # its own OS. Its artifacts are named `telo-desktop-host-*` so the `release`
  # job's `telo-*` pattern collects them into the one `checksums.txt`.
  desktop-host:
    name: Desktop host helper (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smoke` marks a runner that can execute what it built.
          - target: linux-amd64-gnu
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            smoke: true
          - target: linux-arm64-gnu
            os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            smoke: true
          - target: darwin-amd64
            os: macos-latest
            triple: x86_64-apple-darwin
          - target: darwin-arm64
            os: macos-latest
            triple: aarch64-apple-darwin
            smoke: true
          - target: windows-amd64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            smoke: true
          - target: windows-arm64
            os: windows-latest
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # WKWebView's per-application data store, which the helper relies on so that
      # two apps never share cookies, exists from macOS 14.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_PROFILE_RELEASE_STRIP: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install the WebKitGTK development libraries
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config

      # The helper is checked against the CLI that downloads it by version, so the
      # crate must carry the release's.
      - name: The crate carries the release's version
        shell: bash
        run: |
          set -euo pipefail
          crate=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' cli/rust/desktop-host/Cargo.toml)
          [ "$crate" = "${{ inputs.version }}" ] || { echo "cli/rust/desktop-host is $crate, the release is ${{ inputs.version }}" >&2; exit 1; }

      - name: Build the helper
        run: cargo build --release --locked -p telo-desktop-host --features gui --target ${{ matrix.triple }}

      - name: Stage the asset
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in windows-*) ext=".exe" ;; esac
          mkdir -p desktop-host-dist
          cp "target/${{ matrix.triple }}/release/telo-desktop-host$ext" \
            "desktop-host-dist/telo-desktop-host-${{ inputs.version }}-${{ matrix.target }}$ext"

      # A GUI-subsystem binary on Windows prints only into a pipe, which this
      # step's stdout is.
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          bin=$(ls desktop-host-dist/telo-desktop-host-*)
          out=$("$bin" --version | cat)
          [ "$out" = "telo-desktop-host ${{ inputs.version }}" ] || { echo "unexpected: $out" >&2; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telo-desktop-host-${{ matrix.target }}
          path: desktop-host-dist/*
          if-no-files-found: error

  # The only place "no Node.js installed" is a fact rather than an assumption:
  # images that have never had it. macOS and Windows have no such image, so their
  # equivalent is the PATH-stripped smoke test in the build job.
  verify:
    name: Verify install (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie-slim
            target: linux-amd64-gnu
            install: dpkg -i /artifacts/*.deb
          - image: rockylinux:9
            target: linux-amd64-gnu
            install: rpm -i --nodeps /artifacts/*.rpm
          # `libstdc++` is what the musl runtime is linked against, and a bare
          # Alpine carries neither it nor `libgcc_s`; without it the binary
          # fails to relocate. Installing it is not installing Node — the check
          # below still refuses an image that has one.
          - image: alpine:3.20
            target: linux-amd64-musl
            install: apk add --no-cache libstdc++ && tar xzf /artifacts/*.tar.gz -C /usr/local/bin --strip-components=1
    steps:
      - name: Download ${{ matrix.target }}
        uses: actions/download-artifact@v4
        with:
          name: telo-${{ matrix.target }}
          path: artifacts

      - name: Install and run with no Node.js present
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/artifacts:/artifacts" ${{ matrix.image }} sh -c '
            set -eu
            ! command -v node >/dev/null || { echo "image unexpectedly carries node"; exit 1; }
            ${{ matrix.install }}
            telo --version
          '

  # A packaged APPLICATION is the second thing this binary is for, and its two
  # halves only meet here: `telo package` runs from the binary (which is the
  # carrier — a released version is what an unreleased one cannot download), and
  # what it produces has to run where nothing is installed. Anything short of
  # this passes with a binary that packages an app nobody can start.
  package-app:
    name: Package an application and run it with no Node.js
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download linux-amd64-gnu
        uses: actions/download-artifact@v4
        with:
          name: telo-linux-amd64-gnu
          path: artifacts

      - name: Package an example with the built binary
        run: |
          set -euo pipefail
          mkdir -p bin dist
          tar xzf artifacts/telo-${{ inputs.version }}-linux-amd64-gnu.tar.gz \
            -C bin --strip-components=1
          # The binary IS the carrier here, so nothing is downloaded and the
          # packaged app carries exactly the telo this run built.
          ./bin/telo package examples/hello-world --out dist/hello
          ./bin/telo package inspect dist/hello

      - name: Run the packaged application where nothing is installed
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist" debian:trixie-slim sh -c '
            set -eu
            ! command -v node >/dev/null || { echo "image unexpectedly carries node"; exit 1; }
            # A packaged app unpacks into the user cache, so it needs a writable
            # HOME — the refusal names TELO_APP_DIR when it has neither.
            export HOME=/tmp
            /dist/hello | grep "Hello from Telo!"
            TELO_APP_CLI=1 /dist/hello package inspect /dist/hello | grep HelloConsole
          '

  release:
    name: Attach binaries and publish the release
    needs: [build, desktop-host, verify, package-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # By pattern: inside the Publish run the Docker jobs' build records are
      # artifacts too, and they cannot be downloaded.
      - name: Download every binary
        uses: actions/download-artifact@v4
        with:
          pattern: telo-*
          path: artifacts

      # Every asset in one directory, checksummed into one `checksums.txt` in
      # `sha256sum -c` format — not a `.sha256` beside each file, which is what
      # made half the release page checksums. The digests are taken here rather
      # than carried from the build jobs because this is the directory the
      # release is attached from: what is hashed is what is uploaded.
      #
      # Flattening is also the collision check. Release assets are keyed by
      # basename, so two jobs producing one name means an asset silently
      # overwritten — refused here instead, while it is still a build failure.
      - name: Collect the assets and checksum them
        run: |
          set -euo pipefail
          mkdir -p release
          for file in $(find artifacts -type f | sort); do
            name=$(basename "$file")
            [ -e "release/$name" ] && { echo "two jobs produced an asset named $name" >&2; exit 1; }
            mv "$file" "release/$name"
          done
          (cd release && sha256sum * > ../checksums.txt)
          mv checksums.txt release/
          cat release/checksums.txt

      # Attach only. `name` and `body` are deliberately unset: the Publish run
      # writes them, and passing either here would overwrite the changelog with a
      # sentence about binaries. `draft: true` keeps the release unpublished until
      # the step below promotes it.
      - name: Attach binaries to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
          draft: true

      # The scripts come from the tag, after the downloads: a checkout cleans
      # the workspace, and nothing downloaded is needed past the attach above.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install the release scripts' dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      # The gate this whole workflow exists to hold: the release becomes visible
      # only now, with every archive and installer attached and verified. Until
      # this step runs it is a draft, which `releases/latest` does not serve.
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-promote.mjs "${{ inputs.tag }}"

  # `telo.sh/install.sh` and `/install.ps1` are Cloudflare redirect rules to the
  # scripts at a release tag; this moves them to the tag just published. Rules
  # are found by their current target, not a stored id, so recreating one in
  # the dashboard does not break the release. Running after `release` means the
  # redirect never names a draft, and a failure here leaves the previous tag's
  # installers in place. Only a final or patch moves it, and only forward: a
  # candidate's installers are for whoever installs the pre-release by hand.
  redirect:
    name: Point telo.sh at this release's installers
    needs: release
    if: inputs.channel != 'candidate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install the release scripts' dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      - name: Does the redirect move forward
        id: pointers
        run: node scripts/release-pointers.mjs --version "${{ inputs.version }}" --channel "${{ inputs.channel }}"

      - name: Update the redirect rules
        if: steps.pointers.outputs.latest == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] && [ -n "$CF_ZONE" ] ||
            { echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID secrets are required" >&2; exit 1; }

          api="https://api.cloudflare.com/client/v4/zones/$CF_ZONE/rulesets"
          auth="Authorization: Bearer $CF_TOKEN"
          ruleset=$(curl -sS --fail-with-body -H "$auth" "$api/phases/http_request_dynamic_redirect/entrypoint")
          ruleset_id=$(jq -r .result.id <<<"$ruleset")

          # Both rules are resolved before either is changed, so a missing one
          # never leaves the two installers on different tags.
          scripts="install.sh install.ps1"
          declare -A rules
          for script in $scripts; do
            matches=$(jq -c --arg repo "$REPO" --arg script "$script" '
              def esc: gsub("\\."; "\\.");
              [.result.rules[]
                | select(.action == "redirect")
                | select((.action_parameters.from_value.target_url.value // "")
                    | test("^https://raw\\.githubusercontent\\.com/" + ($repo | esc) + "/[^/]+/" + ($script | esc) + "$"))]
            ' <<<"$ruleset")
            count=$(jq length <<<"$matches")
            [ "$count" = 1 ] ||
              { echo "expected one redirect rule targeting $script at a tag of $REPO, found $count" >&2; exit 1; }
            rules[$script]=$(jq -c '.[0]' <<<"$matches")
          done

          for script in $scripts; do
            url="https://raw.githubusercontent.com/$REPO/$TAG/$script"
            rule_id=$(jq -r .id <<<"${rules[$script]}")
            body=$(jq -c --arg url "$url" '
              {action, expression, action_parameters, description, enabled, ref}
              | .action_parameters.from_value.target_url.value = $url
              | with_entries(select(.value != null))' <<<"${rules[$script]}")

            curl -sS --fail-with-body -X PATCH -H "$auth" -H "Content-Type: application/json" \
              -d "$body" "$api/$ruleset_id/rules/$rule_id" > /dev/null
            echo "telo.sh/$script -> $url"
          done
