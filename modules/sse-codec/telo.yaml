kind: Telo.Library
metadata:
  name: SseCodec
  version: 0.14.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Data, Streaming]
  description: |
    Server-Sent Events on the wire: a stream of frames — each a payload with an
    optional event name, resume id and reconnection delay — becomes the bytes a
    browser's EventSource reads. The usual way to push live updates — model tokens,
    progress, notifications — to a web client over plain HTTP, and the reader that
    parses those frames back into records as they arrive.
imports: { Codec: ../codec }
exports:
  kinds: [Decoder, Encoder]
  resources: [Frame]
  # The entry point a dependent module's controller bundle resolves
  # `@telorun/sse-codec` to: the frame and comment writers, so a transport that
  # writes its own event stream formats a frame exactly as the encoder does, and
  # the frame reader, so a controller reading one parses it exactly as the
  # decoder does.
  code:
    - specifier: "@telorun/sse-codec"
      format: js
      path: ./nodejs/sse-codec.mjs
      source: ./nodejs/src/index.ts
---
# One frame as the encoder writes it: `id`, `event`, `retry`, then `data` and a
# blank line. Keep-alive comments are not frames; they are transport timing.
kind: Telo.JsonSchema
metadata: { name: Frame }
schema:
  type: object
  additionalProperties: false
  required: [data]
  properties:
    data: { description: "The payload, written on one `data:` line as its plain JSON encoding." }
    event:
      description: "The event name. Omitted writes no `event:` line, which a reader takes as `message`."
      type: string
      minLength: 1
      pattern: "^[^\\r\\n]*$"
    id:
      description: The resume position a client sends back as `Last-Event-ID`.
      anyOf:
        - { type: string, pattern: "^[^\\r\\n]*$" }
        - { type: integer }
    retry: { description: The reconnection delay a client should use, in milliseconds., type: integer, minimum: 0 }
---
# A stream failing mid-way ends with `event: error\ndata: {"message":…,"code":…}`
# (code only for a coded failure) and is logged: by then the response is
# committed, so the frame is all a client gets.
kind: Telo.Definition
metadata:
  name: Encoder
  description: >-
    Writes each frame of a stream as Server-Sent Events bytes: its payload as JSON,
    with the event name, resume id and reconnection delay it carries. A value that
    is not a frame, or a failure mid-stream, ends the stream with a final error
    event.
capability: Telo.Invocable
extends: Codec.Encoder
controllers: [pkg:telo/local/js?path=./nodejs/sse-codec.mjs&local_path=./nodejs/src/index.ts#EncoderController]
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input]
    properties:
      input:
        description: The frames to write, in order.
        x-telo-type: { name: Telo.Stream, of: !ref Frame }
schema: { type: object, additionalProperties: false }
---
# Streams rather than collects, and hands `data` over as text: a JSON stream routinely
# ends with a sentinel that is not JSON (`data: [DONE]`).
kind: Telo.Definition
metadata:
  name: Decoder
  description: >-
    Parses a byte stream of Server-Sent Events into one record per frame — event name,
    payload text and optional id — emitted as each frame arrives rather than collected
    at the end. Comments and keep-alives are skipped, and multi-line payloads are joined.
capability: Telo.Invocable
extends: Codec.Decoder
controllers: [pkg:telo/local/js?path=./nodejs/sse-codec.mjs&local_path=./nodejs/src/index.ts#DecoderController]
throws:
  codes:
    ERR_INVALID_INPUT:
      description: "`input` did not resolve to an async iterable, or yielded something other than bytes."
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [records]
    properties:
      records:
        description: One record per dispatched frame, in order.
        x-telo-type:
          name: Telo.Stream
          of:
            type: object
            additionalProperties: false
            required: [event, data]
            properties:
              event:
                type: string
                description: The frame's event name, `message` when it declared none.
              data:
                type: string
                description: >-
                  The frame's payload as text, with multiple `data:` lines joined by
                  newlines. Never parsed — a stream of JSON frames routinely ends with a
                  sentinel that is not JSON.
              id:
                type: string
                description: >-
                  The stream cursor, if one has been seen. Persists across frames until
                  replaced, as the format specifies.
              retry:
                type: integer
                description: The reconnection delay in milliseconds, when the server sent one.
schema: { type: object, additionalProperties: false }
