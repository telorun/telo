# The provider-neutral half of the swap proof: an agent, the request its model
# goes through, and a route whose `catches:` names only the codes `Ai.Model`
# and `Ai.Agent` declare — no catch-all, and no vendor's name anywhere. The
# application that includes this declares `model` and `modelClient`.
kind: HttpClient.Request
metadata: { name: modelRequest }
client: !ref modelClient
---
kind: Ai.Agent
metadata: { name: assistant }
model: !ref model
system: You are terse.
---
kind: Http.Api
metadata: { name: api }
routes:
  - request:
      path: /ask
      method: POST
      schema:
        body:
          type: object
          required: [question]
          properties:
            question: { type: string }
    handler: !ref assistant
    inputs:
      messages:
        - role: user
          content: !cel "request.body.question"
    returns:
      - status: 200
        content: { application/json: { body: { answer: !cel "result.text" } } }
    catches:
      # Worth another try, and when.
      - when: !cel "error.code == 'ERR_MODEL_RATE_LIMITED' || error.code == 'ERR_MODEL_UNAVAILABLE'"
        status: 503
        content:
          application/json:
            body:
              code: !cel "error.code"
              retryAfterSeconds: !cel "has(error.data.retryAfterSeconds) ? error.data.retryAfterSeconds : 0"
      - when: !cel "error.code in ['ERR_MODEL_TIMEOUT', 'ERR_MODEL_UNREACHABLE', 'ERR_MODEL_TOOL_ARGUMENTS_INVALID', 'ERR_MODEL_RESPONSE_INVALID']"
        status: 502
        content: { application/json: { body: { code: !cel "error.code" } } }
      - when: !cel "error.code == 'ERR_MODEL_CONTENT_UNSUPPORTED'"
        status: 422
        content:
          application/json:
            body:
              code: !cel "error.code"
              partType: !cel "error.data.partType"
      # The same request fails the same way.
      - when: !cel "error.code in ['ERR_MODEL_ACCESS_DENIED', 'ERR_MODEL_QUOTA_EXCEEDED', 'ERR_MODEL_CONTEXT_TOO_LONG', 'ERR_MODEL_CONTENT_REFUSED', 'ERR_MODEL_REQUEST_REJECTED', 'ERR_INVALID_REFERENCE']"
        status: 500
        content: { application/json: { body: { code: !cel "error.code" } } }
      # The agent's own.
      - when: !cel "error.code in ['ERR_INVALID_INPUT', 'ERR_CONTRACT_VIOLATION', 'ERR_AGENT_MAX_STEPS', 'ERR_AGENT_UNKNOWN_TOOL', 'ERR_AGENT_TOOL_COLLISION', 'ERR_AGENT_APPROVAL_UNKNOWN_TOOL', 'ERR_AGENT_APPROVAL_DECISION_INVALID']"
        status: 500
        content: { application/json: { body: { code: !cel "error.code" } } }
---
kind: Http.Server
metadata: { name: server }
host: 127.0.0.1
port: !cel "ports.http"
mounts:
  - mount: !ref api
