# Writes `top` fifty times outside any draft, from its own process: fifty
# people named after this process.
kind: Telo.Application
metadata:
  name: CrossProcessWriter
  version: 1.0.0
include:
  - ./model.yaml
imports:
  Postgres: ../../../../../postgres
  Layers: ../../../..
  Graph: ../../../../../graph
  Run: ../../../../../run
variables:
  dbHost: { env: DB_HOST, type: string, default: localhost }
  dbPort: { env: DB_PORT, type: integer, default: 5432 }
  dbUser: { env: DB_USER, type: string, default: postgres }
  dbPassword: { env: DB_PASSWORD, type: string, default: postgres }
  dbName: { env: DB_NAME, type: string, default: postgres }
  name: { env: WRITER_NAME, type: string }
targets:
  - !ref work
---
kind: Run.Sequence
metadata: { name: work }
steps:
  - name: n
    value: !cel "0"
  - name: writes
    while: !cel "steps.n.result < 50"
    do:
      - name: write
        invoke: { kind: Graph.CreateNode, store: !ref top, node: !ref person }
        inputs:
          key: !cel "variables.name + '-' + string(steps.n.result)"
          properties: { name: !cel "variables.name" }
      - name: n
        value: !cel "steps.n.result + 1"
