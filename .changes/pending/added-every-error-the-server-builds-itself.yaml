modules:
  modules/http-server: Added
body: "Every error the server builds itself is now an RFC 9457 problem sent as
  application/problem+json — members type (about:blank), title, status, detail (the
  error's display message, formatted with its data), code and data — and the developer
  message never reaches the client. This replaces the {error: {code, message, data}}
  envelope (a throw no catches entry claims, a catches entry with no body, 413
  ERR_REQUEST_BODY_TOO_LARGE, 421 ERR_HOST_NOT_SERVED), the 400 {error: ValidationError,
  details} body, now code ERR_INPUT_INVALID with data.issues of { pointer, keyword,
  params } where pointer is a JSON Pointer into the request (/body/month, /query/sort),
  and Fastify's own body for a crash, a malformed request and the default 404, now the
  bare { type, title, status }. A catches entry with no body renders its default problem
  as application/problem+json whatever its key, and an error is never refused for
  Accept: an entry whose keys match nothing renders its first. Every catches entry's
  CEL, its when: included, reads the problem binding at run time. Http.Server declares
  ERR_REQUEST_BODY_TOO_LARGE and ERR_HOST_NOT_SERVED with their display messages; the
  module now writes in lang en and requires telo >=0.123.0."
