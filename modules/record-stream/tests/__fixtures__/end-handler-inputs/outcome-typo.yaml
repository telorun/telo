# A misspelled field of the `outcome` binding.
kind: Telo.Application
metadata:
  name: EndHandlerInputsOutcomeTypo
  version: 1.0.0
imports:
  RecordStream: ../../../
  Run: ../../../../run
---
kind: RecordStream.EndHandler
metadata: { name: ending }
inputs:
  code: !cel "outcome.stat"
handler:
  kind: Run.Sequence
  inputType:
    kind: Telo.JsonSchema
    schema:
      type: object
      required: [code]
      properties:
        code: { type: string }
  steps:
    - name: code
      value: !cel "inputs.code"
