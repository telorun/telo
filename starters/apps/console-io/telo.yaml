kind: Telo.Application
metadata:
  name: ConsoleIo
  version: 1.0.0
  categories: [ Configuration ]
  description: |
    An interactive command-line program written as a manifest: it greets you,
    then reads commands until you leave.

      - the name comes from the command line when given, from a prompt when not
      - a `while` loop reads a line per turn; a `switch` picks the command
      - an unknown command is answered rather than crashing the loop
      - `{green …}` markup is colour on a terminal and plain text when piped

    Run it, then try `shout hello`, `count hello world`, `help` and `quit`:
        telo .
        telo . Ada --greeting Welcome
        telo . --help
imports:
  Console: oci://ghcr.io/telorun/console@0.19.0#sha256-RC9Wlj4a8ysp1g3WS3z3CbmQuAsahNj4PdsJMaNfPZw
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
variables:
  name:
    type: string
    description: Who to greet. Asked for when left out.
    arg: { position: 0 }
    env: GREET_NAME
    default: ""
  greeting:
    type: string
    minLength: 1
    description: The word to greet with.
    arg: { flag: greeting, short: g }
    env: GREETING
    default: Hello
targets:
  - !ref session
---
kind: Run.Sequence
metadata: { name: session }
steps:
  - name: askName
    if: !cel "variables.name == ''"
    then:
      - name: asked
        invoke: !ref Console.readLine
        inputs:
          prompt: "What's your name? "
  - name: who
    value: !cel "variables.name == '' ? trim(steps.asked.result.value) : variables.name"
  - name: greet
    invoke: !ref Console.writeLine
    inputs:
      output: !cel "'{green ' + variables.greeting + ', ' + steps.who.result + '!} Type {bold help} for commands.'"

  - name: read
    invoke: !ref Console.readLine
    inputs:
      prompt: "> "
  - name: turns
    while: !cel "trim(steps.read.result.value) != 'quit'"
    do:
      # The first word is the command; everything after it is its argument.
      - name: line
        value:
          command: !cel "split(trim(steps.read.result.value), ' ')[0]"
          text: !cel "trim(trimPrefix(trim(steps.read.result.value), split(trim(steps.read.result.value), ' ')[0]))"
      - name: run
        switch: !cel "steps.line.result.command"
        cases:
          shout:
            - name: shouted
              invoke: !ref Console.writeLine
              inputs:
                output: !cel "upper(steps.line.result.text) + '!'"
          count:
            - name: counted
              invoke: !ref Console.writeLine
              inputs:
                output: !cel >-
                  string(size(split(steps.line.result.text, ' ').filter(w, w != ''))) + ' words, ' +
                  string(size(steps.line.result.text)) + ' characters'
          help:
            - name: helped
              invoke: !ref Console.writeLine
              inputs:
                output: "shout <text> | count <text> | help | quit"
        default:
          - name: unknown
            invoke: !ref Console.writeLine
            inputs:
              output: !cel "'{red unknown command:} ' + steps.line.result.command + ' — try help'"
      - name: read
        invoke: !ref Console.readLine
        inputs:
          prompt: "> "

  - name: bye
    invoke: !ref Console.writeLine
    inputs:
      output: !cel "'Goodbye, ' + steps.who.result + '.'"
