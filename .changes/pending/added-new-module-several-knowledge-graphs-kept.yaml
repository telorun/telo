modules:
  modules/graph-layers: Added
body: "New module: several knowledge graphs kept as named layers in one database, a
  layer built on one or many others, with the contract every versioning strategy
  implements. Three levels, each extending the one beneath. Store is a graph store that
  is one named layer: it reads its own statements over everything beneath, writes only
  to itself, sets origin on every value, and keeps a relationship in a view only while
  both endpoints resolve; RetractNode and RetractRelationship withdraw exactly one
  statement of a layer's own. DraftedStore is a layer edited in a draft and published
  atomically as a numbered revision: OpenDraft, DraftSession (a body of steps in which
  every operation on the store reads and writes one draft), Publish, DiscardDraft,
  RebaseDraft, ListDrafts, NodeConflicts, RelationshipConflicts, ResolveNodeConflict and
  ResolveRelationshipConflict, with the Actor shape; a rebase merges what both sides did
  alike and lists the rest in five classes, and a draft closed under a running session
  ends it with GRAPH_DRAFT_CLOSED. RevisionedStore keeps every published revision and is
  built on pinned revisions of other layers: ListRevisions is a layer's change feed,
  PinBase pins by number, label or newest revision and upgrades by moving a pin,
  UnpinBase and ListBases manage the pins, and LabelRevision gives a revision a
  permanent label. A write that changes nothing a layer states is no revision - equal
  meaning the same value of the same type, so the text 7 is not the integer 7. A merge
  or create of a key a store's view does not show - never stated, or hidden by the
  layer's own removal - stores the given properties plus the declared default of every
  other one, taking nothing from what the removal hid. Concurrent writes to one key each
  take effect in some order. A read never writes, and a layer is registered only by a
  call that changes it: a write, an opened draft or a pin move that changes its base
  list, never a refused call or one that changes nothing. The code library
  @telorun/graph-layers exports the store interface of each level, their guards and
  resolvers, and storeActor, the actor recorded for what a store does on nobody's behalf
  (type store, the store's declared name)."
