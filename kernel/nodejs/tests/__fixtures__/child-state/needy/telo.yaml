kind: Telo.Application
metadata: { name: Needy, version: 1.0.0 }
imports:
  Console: ../../../../../../modules/console
  Run: ../../../../../../modules/run
variables:
  greeting: { env: NEEDY_GREETING, type: string }
targets:
  - !ref say
---
kind: Run.Sequence
metadata: { name: say }
steps:
  - name: say
    invoke: { kind: Console.WriteLine }
    inputs: { output: !cel "variables.greeting" }
