kind: Telo.Application
metadata:
  name: SqliteImperativeMigrations
  version: 1.0.0
imports:
  Sql: ../../sql
  SQLite: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref migrate
  - !ref verifyMigrations
---
kind: SQLite.Connection
metadata:
  name: db
file: ":memory:"
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
# No `version:` and no `reclaim:` — this app only runs migrations, so it looks
# exactly like the imperative kind it replaced. The version is the reclamation
# clock and nothing else reads it.
migrations:
  20260401_create_users:
    statements:
      - "CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT NOT NULL)"
      - "CREATE UNIQUE INDEX users_name ON users(name)"
      - "INSERT INTO users (id, name) VALUES (1, 'Alice')"
  20260402_seed_more:
    statement: "INSERT INTO users (id, name) VALUES (2, 'Bob')"
  20260403_noop:
    statement: "UPDATE users SET name = name"
---
kind: Run.Sequence
metadata:
  name: verifyMigrations
steps:
  - name: selectSeeded
    inputs:
      sql: "SELECT name FROM users WHERE id = 1"
    invoke:
      kind: Sql.Query
      connection: !ref db

  - name: assertSeeded
    inputs:
      rows: "${{ steps.selectSeeded.result.rows }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          rows:
            type: array
            minItems: 1
            maxItems: 1
            items:
              type: object
              properties:
                name:
                  const: Alice

  - name: selectLedger
    inputs:
      sql: "SELECT key FROM telo_schema_migrations ORDER BY key"
    invoke:
      kind: Sql.Query
      connection: !ref db

  - name: assertLedger
    inputs:
      rows: "${{ steps.selectLedger.result.rows }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          rows:
            type: array
            minItems: 3
            maxItems: 3
