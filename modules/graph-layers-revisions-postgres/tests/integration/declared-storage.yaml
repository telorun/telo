kind: Telo.Application
metadata:
  name: GraphLayersRevisionsPostgresDeclaredStorage
  version: 1.0.0
  description: |
    Revisioned storage is declared, across real boots against one PostgreSQL
    namespace. The first boot leaves the namespace as the release before pinned
    stacks left it; this release's kinds then take it over by expansion alone —
    a column on each typed table, five on the changesets table, one index and
    one table — with no manual step. The database holds the author's columns
    plus the bookkeeping columns and indexes the table kinds add and the three
    bookkeeping tables, and a second boot of the same release changes nothing.

    Ordering is the point, so the fixtures are numbered and the suite runs one at
    a time. NEEDS A CONTAINER ENGINE: it starts its own PostgreSQL, which is why it is under `tests/integration/`.
imports:
  Pg:
    source: ../../../postgres/tests/__fixtures__/container
    variables: { engineUrl: !cel "variables.engineUrl" }
    secrets: { engineToken: !cel "secrets.engineToken" }
  Test: ../../../test
variables:
  engineUrl: { env: TELO_HOST_CONTAINER_ENGINE_URL, type: string, default: "unix:///var/run/docker.sock" }
secrets:
  engineToken: { env: TELO_HOST_CONTAINER_ENGINE_TOKEN, type: string, default: "" }
targets:
  - !ref boots
---
kind: Test.Suite
metadata: { name: boots }
include: ["__fixtures__/storage-boots/*.yaml"]
exclude: []
concurrency: 1
# Every boot connects to the one server this test started.
env:
  DB_HOST: !cel "resources.Pg.endpoint.status.host"
  DB_PORT: !cel "string(resources.Pg.endpoint.status.port)"
