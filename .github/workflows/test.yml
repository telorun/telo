  rust:
    name: "Linux: Rust tests"
    runs-on: ubuntu-latest
    needs: select
    if: needs.select.outputs.rust == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Controller crates are built into the workspace-anchored `.telo` cache,
          # keyed by SDK backend, which is NOT the workspace `target/` this action
          # caches by default. Without naming it every run rebuilds each napi
          # controller and its dependency tree from cold — minutes on Windows.
          cache-directories: .telo/cargo

      # The Rust CLI embeds the built-in vocabulary archive, which is rendered,
      # never tracked, and its build refuses to run without it. The workspace is
      # installed first, since the root `prepare` renders it.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render the built-in vocabulary
        run: node scripts/generate-telo-version.mjs && node scripts/render-builtin-vocabulary.mjs

      # Both SDK backends are compiled explicitly. `telorun-sdk` declares no
      # default backend, so a bare `cargo test` would exercise neither bridge
      # and let one of them bit-rot unnoticed.
      #
      # `--locked` on every invocation, because without it cargo silently
      # REPAIRS a `Cargo.lock` that disagrees with a workspace member's version
      # and the job stays green — while the kernel's napi fixture test builds
      # with `--locked` and fails on whichever platform reaches it first. This
      # is the cheapest job to read that failure on, and it reads as what it is.
      - name: Check the napi backend
        run: cargo check --workspace --locked --features telorun-sdk/napi

      - name: Check the native backend
        run: cargo check --workspace --locked --features telorun-sdk/native

      # The kernel's integration tests build the console controller crate as a
      # subprocess, so this covers the native backend end to end.
      - name: Run tests
        run: cargo test --workspace --locked
