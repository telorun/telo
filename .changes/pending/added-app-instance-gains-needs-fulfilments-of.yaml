modules:
  modules/app: Added
body: "App.Instance gains needs: — fulfilments of the child's own needs, keyed by the
  child's need name, each a !ref to a need or fulfilment of this module handed over
  whole or a map of the need type's fields. The child answers a need supplied there
  before its own environment and host values, so a test gives each application it starts
  a durable directory of its own. Requires telo 0.123.0."
