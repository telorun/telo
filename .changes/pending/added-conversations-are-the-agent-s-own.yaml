modules:
  apps/authoring-agent: Added
body: "Conversations are the agent's own: POST /conversations mints one, and GET
  /conversations (paged, searchable with q, archived filter), GET/PATCH/DELETE
  /conversations/{id}, DELETE /conversations/{id}/turns (truncation against a revision)
  and POST /conversations/{id}/branch manage them; POST /chat refuses an unknown (404
  ERR_CONVERSATION_NOT_FOUND), deleted (410 ERR_CONVERSATION_REMOVED) or archived (409
  ERR_CONVERSATION_ARCHIVED) conversation, so clients must create a conversation before
  their first message. A branch is titled '<title> (branch)', or the title's first 190
  characters plus '… (branch)' when that would pass 200. A conversation is named after
  its first message (conversation-title record: { title, model, usage }; { model, usage
  } when the conversation was named meanwhile; or an error, ERR_TITLE_INCOMPLETE and
  ERR_TITLE_EMPTY among them), and its older turns are summarized once its context
  reaches MAX_CONTEXT_TOKENS (context-summary record); a summary is accepted only when
  the reply ended with stop, and an unusable one fails the turn with
  ERR_CONTEXT_COMPACTION_FAILED (cause ERR_SUMMARY_INCOMPLETE or ERR_SUMMARY_EMPTY)
  after a context-summary carrying the error and the call's usage. The naming and
  summary calls run on the agent's model at low reasoning effort, capped at 1024 and
  MAX_CONTEXT_TOKENS / 8 output tokens. Tool results are bounded by
  MAX_TOOL_RESULT_BYTES, every model call of a turn is charged to it, a continue takes
  its turn's key over before it changes the conversation, and GET /capabilities reports
  features and manifestRuns. Existing conversations are migrated and keep their ids."
