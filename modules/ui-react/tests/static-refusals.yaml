kind: Telo.Application
metadata:
  name: UiReactStaticRefusalsTest
  version: 1.0.0
  description: |
    What an application is refused for before it serves anything, by `telo
    check` where it is declared and by the application itself where a consumer's
    check cannot see: a page whose list of nodes is computed, and two pages at
    one path or at paths differing only in the names of their variables. An
    application whose pages hold per-request expressions is
    checked for duplicate paths all the same — the rule is not skipped. A page
    path and a link address written `//…` are refused as written: a browser
    reads either as another host. A condition the browser draws cannot read
    the request, and a node's delivery cannot read the query; a not-found node
    has no query to read at all. A theme two of
    whose `controls` entries implement one control is refused where it is
    declared and by the theme itself — two different sets, two equal
    declarations through two imports, and one shared set through two aliases
    alike — and so is a control set replacing some of the ten layer controls
    but not all of them, as the nine of the third generation are, and a set
    written against the previous controls generation. A
    page reference reachable from the application — in a navbar, a link, a
    navigation column in the aside, another module's pane or a library's
    navbar — naming a page `pages` does not list is refused where it is
    written, whatever alias `ui` is imported under: an entry module's own
    reference fails the load's analysis (`telo run` exits 1), and no check at
    run time repeats it, so only a dependency's reference reaches a running
    application, where its link opens the not-found page.
imports: { Probe: ./__fixtures__/probe, Run: ../../run, Assert: ../../assert }
targets:
  - !ref computedChildren
  - !ref computedChildrenAtRuntime
  - !ref duplicatePath
  - !ref duplicatePathAtRuntime
  - !ref duplicateRoute
  - !ref duplicateRouteAtRuntime
  - !ref variableNamesPath
  - !ref variableNamesPathAtRuntime
  - !ref offsiteReferences
  - !ref ruleRuns
  - !ref pageRoots
  - !ref notFoundRoots
  - !ref themeControlDuplicate
  - !ref themeControlDuplicateAtRuntime
  - !ref themeControlEqual
  - !ref themeControlEqualAtRuntime
  - !ref themeControlShared
  - !ref themeControlSharedAtRuntime
  - !ref themeControlDisjoint
  - !ref themeControlDisjointAtRuntime
  - !ref controlsLayersPartial
  - !ref controlsLayersPartialAtRuntime
  - !ref controlsPreviousGeneration
  - !ref controlsPreviousGenerationImported
  - !ref unroutedPage
  - !ref unroutedPageCount
  - !ref unroutedPageAlias
  - !ref unroutedPageAliasCount
---
kind: Assert.Manifest
metadata: { name: computedChildren }
source: ./__fixtures__/invalid/computed-children/lib/telo.yaml
expect:
  errors:
    - code: REF_SLOT_COMPUTED
      message: "'children: !cel \"[]\"' computes a value that holds the reference slot"
---
kind: Assert.Manifest
metadata: { name: computedChildrenAtRuntime }
source: ./__fixtures__/invalid/computed-children/telo.yaml
expect: { errors: [{ code: REF_SLOT_COMPUTED, message: "UiReact.App/computed: 'children: !cel \"[]\"' computes a value that holds the reference slot 'children[].button'. CEL values are data, so the reference cannot survive the expression. Write the slot itself as '!ref'." }], runFails: "ERR_REF_SLOT_COMPUTED" }
---
kind: Assert.Manifest
metadata: { name: duplicatePath }
source: ./__fixtures__/invalid/duplicate-path/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/twice at 'pages[0]': declares a path another page already has"
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/twice at 'pages[1]': declares a path another page already has"
---
kind: Assert.Manifest
metadata: { name: duplicatePathAtRuntime }
source: ./__fixtures__/invalid/duplicate-path/telo.yaml
expect:
  errors: [{ code: RESOURCE_RULE_VIOLATED, message: "UiReact.App/twice at 'pages[0]': declares a path another page already has, or one differing from it only in the names of its variables, so both route the same addresses. Give each page a path of its own." }, { code: RESOURCE_RULE_VIOLATED, message: "UiReact.App/twice at 'pages[1]': declares a path another page already has, or one differing from it only in the names of its variables, so both route the same addresses. Give each page a path of its own." }]
  runFails: "UiReact.App 'twice': 'pages[1]' declares a path another page already has ('/reports')"
---
# A page and a `Ui.PageRoute` routing one path are two pages at it.
kind: Assert.Manifest
metadata: { name: duplicateRoute }
source: ./__fixtures__/invalid/duplicate-route/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/twice at 'pages[0]': declares a path another page already has"
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/twice at 'pages[1]': declares a path another page already has"
---
kind: Assert.Manifest
metadata: { name: duplicateRouteAtRuntime }
source: ./__fixtures__/invalid/duplicate-route/telo.yaml
expect:
  errors: [{ code: RESOURCE_RULE_VIOLATED, message: "UiReact.App/twice at 'pages[0]': declares a path another page already has, or one differing from it only in the names of its variables, so both route the same addresses. Give each page a path of its own." }, { code: RESOURCE_RULE_VIOLATED, message: "UiReact.App/twice at 'pages[1]': declares a path another page already has, or one differing from it only in the names of its variables, so both route the same addresses. Give each page a path of its own." }]
  runFails: "UiReact.App 'twice': 'pages[1]' declares a path another page already has ('/reports')"
---
# A literal segment beside a variable routes apart; two variables named apart do not.
kind: Assert.Manifest
metadata: { name: variableNamesPath }
source: ./__fixtures__/invalid/variable-names-path/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/renamed at 'pages[1]': declares a path another page already has, or one differing from it only in the names of its variables"
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/renamed at 'pages[2]': declares a path another page already has, or one differing from it only in the names of its variables"
---
kind: Assert.Manifest
metadata: { name: variableNamesPathAtRuntime }
source: ./__fixtures__/invalid/variable-names-path/telo.yaml
expect:
  errors: [{ code: RESOURCE_RULE_VIOLATED, message: "UiReact.App/renamed at 'pages[1]': declares a path another page already has, or one differing from it only in the names of its variables, so both route the same addresses. Give each page a path of its own." }, { code: RESOURCE_RULE_VIOLATED, message: "UiReact.App/renamed at 'pages[2]': declares a path another page already has, or one differing from it only in the names of its variables, so both route the same addresses. Give each page a path of its own." }]
  runFails: "UiReact.App 'renamed': 'pages[2]' (/plans/{key}) routes the same addresses as /plans/{id} ('pages[1]')"
---
kind: Assert.Manifest
metadata: { name: offsiteReferences }
source: ./__fixtures__/invalid/app-relative/telo.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "UiReact.App/offsitePath: /pages/0/path must match pattern"
    - code: SCHEMA_VIOLATION
      message: "UiReact.App/offsiteLink: /pages/0/children/0/href must match a schema in anyOf"
---
kind: Telo.Sequence
metadata: { name: ruleRuns }
steps:
  - name: check
    invoke: { kind: Probe.Diagnostics, source: ./__fixtures__/app/telo.yaml }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.check.result"
      expected: { loadError: null, codes: [] }
---
kind: Assert.Manifest
metadata: { name: pageRoots }
source: ./__fixtures__/invalid/page-roots/telo.yaml
expect:
  errors:
    - code: CEL_UNKNOWN_IDENTIFIER
      message: "UiReact.App/mixed: !cel: unknown identifier 'request'"
    - code: CEL_UNKNOWN_IDENTIFIER
      message: "UiReact.App/mixed: !cel: unknown identifier 'query'"
---
kind: Assert.Manifest
metadata: { name: notFoundRoots }
source: ./__fixtures__/invalid/notfound-roots/telo.yaml
expect:
  errors:
    - code: CEL_UNKNOWN_IDENTIFIER
      message: "UiReact.App/headed: !cel: 'query' is not available here: a layout region is drawn on pages with different path variables and query parameters, so it reads none."
---
kind: Assert.Manifest
metadata: { name: themeControlDuplicate }
source: ./__fixtures__/invalid/theme-control-duplicate/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.Theme/doubled at 'controls[0]': implements a control another entry of controls implements too"
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.Theme/doubled at 'controls[1]': implements a control another entry of controls implements too"
---
kind: Assert.Manifest
metadata: { name: themeControlDuplicateAtRuntime }
source: ./__fixtures__/invalid/theme-control-duplicate/telo.yaml
expect:
  errors: [{ code: RESOURCE_RULE_VIOLATED, message: "UiReact.Theme/doubled at 'controls[0]': implements a control another entry of controls implements too. Give each control one implementation." }, { code: RESOURCE_RULE_VIOLATED, message: "UiReact.Theme/doubled at 'controls[1]': implements a control another entry of controls implements too. Give each control one implementation." }]
  runFails: "UiReact.Theme 'doubled': 'controls[1]' (UiReact.Controls 'checkboxes') implements 'Checkbox', which 'controls[0]' (UiReact.Controls 'controls') already implements"
---
kind: Assert.Manifest
metadata: { name: themeControlEqual }
source: ./__fixtures__/invalid/theme-control-equal/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.Theme/equal at 'controls[0]': implements a control another entry of controls implements too"
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.Theme/equal at 'controls[1]': implements a control another entry of controls implements too"
---
kind: Assert.Manifest
metadata: { name: themeControlEqualAtRuntime }
source: ./__fixtures__/invalid/theme-control-equal/telo.yaml
expect:
  errors: [{ code: RESOURCE_RULE_VIOLATED, message: "UiReact.Theme/equal at 'controls[0]': implements a control another entry of controls implements too. Give each control one implementation." }, { code: RESOURCE_RULE_VIOLATED, message: "UiReact.Theme/equal at 'controls[1]': implements a control another entry of controls implements too. Give each control one implementation." }]
  runFails: "UiReact.Theme 'equal': 'controls[1]' (UiReact.Controls 'controls') implements 'Checkbox', which 'controls[0]' (UiReact.Controls 'controls') already implements"
---
kind: Assert.Manifest
metadata: { name: themeControlShared }
source: ./__fixtures__/invalid/theme-control-shared/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.Theme/aliased at 'controls[0]': implements a control another entry of controls implements too"
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.Theme/aliased at 'controls[1]': implements a control another entry of controls implements too"
---
kind: Assert.Manifest
metadata: { name: themeControlSharedAtRuntime }
source: ./__fixtures__/invalid/theme-control-shared/telo.yaml
expect:
  errors: [{ code: RESOURCE_RULE_VIOLATED, message: "UiReact.Theme/aliased at 'controls[0]': implements a control another entry of controls implements too. Give each control one implementation." }, { code: RESOURCE_RULE_VIOLATED, message: "UiReact.Theme/aliased at 'controls[1]': implements a control another entry of controls implements too. Give each control one implementation." }]
  runFails: "UiReact.Theme 'aliased': 'controls[1]' (UiReact.Controls 'boxes') implements 'Checkbox', which 'controls[0]' (UiReact.Controls 'boxes') already implements"
---
kind: Assert.Manifest
metadata: { name: controlsLayersPartial }
source: ./__fixtures__/invalid/controls-layers-partial/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.Controls/nineLayers: implements some of the layer controls but not all of them"
---
kind: Assert.Manifest
metadata: { name: controlsLayersPartialAtRuntime }
source: ./__fixtures__/invalid/controls-layers-partial/telo.yaml
expect:
  errors: [{ code: RESOURCE_RULE_VIOLATED, message: "UiReact.Controls/nineLayers: implements some of the layer controls but not all of them. A set implementing any of Select, MultiSelect, Combobox, Dialog, Drawer, Popover, Confirmation, Menu, Tooltip and Navigation implements all ten." }]
  runFails: "UiReact.Controls 'nineLayers': implements the layer controls Select, MultiSelect, Dialog, Drawer, Popover, Confirmation, Menu, Tooltip, Navigation but not Combobox"
---
# A set written against the previous generation is refused, not drawn.
kind: Assert.Manifest
metadata: { name: controlsPreviousGeneration }
source: ./__fixtures__/invalid/controls-previous-generation/lib/telo.yaml
expect:
  errors:
    - code: BROWSER_ENTRY_ABI_UNSUPPORTED
      message: "UiReact.Controls/previousControls: 'entry: @fixture/previous-controls' names a browser entry written against 'ui_react_controls-3', and this field accepts 'ui_react_controls-4'"
---
kind: Assert.Manifest
metadata: { name: controlsPreviousGenerationImported }
source: ./__fixtures__/invalid/controls-previous-generation/telo.yaml
expect:
  errors:
    - code: BROWSER_ENTRY_ABI_UNSUPPORTED
      message: "UiReact.Controls/previousControls: 'entry: @fixture/previous-controls' names a browser entry written against 'ui_react_controls-3', and this field accepts 'ui_react_controls-4'"
---
# Two entries implementing different controls are one theme: nothing refuses it.
kind: Assert.Manifest
metadata: { name: themeControlDisjoint }
source: ./__fixtures__/theme-control-disjoint/lib/telo.yaml
expect: { errors: [] }
---
kind: Assert.Manifest
metadata: { name: themeControlDisjointAtRuntime }
source: ./__fixtures__/theme-control-disjoint/telo.yaml
expect: { errors: [], runs: true }
---
# A page reference reachable from the application, written in a navbar, a link,
# a navigation column in the aside, another module's pane and a library's
# navbar. The library's page the application lists through its alias is never
# reported. There is no runtime twin: the running application answers such a
# link with the not-found page.
kind: Assert.Manifest
metadata: { name: unroutedPage }
source: ./__fixtures__/invalid/unrouted-page/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/draft: names a page the application does not list in its pages, so it leads nowhere"
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/draft: names a page the application does not list in its pages, so it leads nowhere"
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/draft: names a page the application does not list in its pages, so it leads nowhere"
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/draft: names a page the application does not list in its pages, so it leads nowhere"
    - code: RESOURCE_RULE_VIOLATED
      message: "(the Ui.Page UiReactUnroutedDocs.guide, reached through Docs.nav)"
---
# One finding for each of the five references: the count is what a message
# alone, identical for four of them, cannot pin.
kind: Telo.Sequence
metadata: { name: unroutedPageCount }
steps:
  - name: check
    invoke: { kind: Probe.Diagnostics, source: ./__fixtures__/invalid/unrouted-page/lib/telo.yaml }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.check.result.codes"
      expected: [RESOURCE_RULE_VIOLATED, RESOURCE_RULE_VIOLATED, RESOURCE_RULE_VIOLATED, RESOURCE_RULE_VIOLATED, RESOURCE_RULE_VIOLATED]
---
# `ui` imported as `Kit`: the navigation rules a navbar inherits and the page
# check reach every entry all the same.
kind: Assert.Manifest
metadata: { name: unroutedPageAlias }
source: ./__fixtures__/invalid/unrouted-page-alias/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "UiReact.App/aliased: names a page the application does not list in its pages, so it leads nowhere"
    - code: RESOURCE_RULE_VIOLATED
      message: "Kit.Navbar/aliased_layout_header_0_ref at 'layout.header[0].ref.navigation.items[1]': names a page with no title"
---
# The navbar's and the column's unlisted page, and the untitled one.
kind: Telo.Sequence
metadata: { name: unroutedPageAliasCount }
steps:
  - name: check
    invoke: { kind: Probe.Diagnostics, source: ./__fixtures__/invalid/unrouted-page-alias/telo.yaml }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.check.result.codes"
      expected: [RESOURCE_RULE_VIOLATED, RESOURCE_RULE_VIOLATED, RESOURCE_RULE_VIOLATED]
