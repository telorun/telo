kind: Telo.Application
metadata:
  name: AgentStreamToolErrorTest
  version: 1.0.0
  description: |
    A stream fails by REJECTING, and both consequences are asserted here because
    they pull in opposite directions.

    From a MANIFEST the rejection is an ordinary error: catchable by name in a
    `catch:`, which a data part never was — that is the whole gain of the
    change, and `ERR_AGENT_UNKNOWN_TOOL` is reachable from a manifest for the
    first time.

    On the WIRE the one-terminal-frame contract still holds, because the encoder
    catches the rejection and frames it. That is what keeps a streaming client
    working: without it the client sees 200, some frames, and then silence.
imports:
  Ai: ../
  AiEcho: ./__fixtures__/ai-echo.yaml
  Http: ../../http-server
  Ndjson: ../../ndjson-codec
  JS: ../../javascript
  Run: ../../run
  Stream: ../../stream
  Assert: ../../assert
targets:
  - !ref TestToolError
---
kind: AiEcho.EchoModelStream
metadata: { name: Echo }
emitToolCall:
  name: ghost
  arguments: {}
---
kind: Run.Value
metadata: { name: Multiplier }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      a: { type: number }
      b: { type: number }
value:
  product: !cel "inputs.a * inputs.b"
---
kind: Ai.Tools
metadata: { name: LocalTools }
tools:
  - tool: !ref Multiplier
    name: multiply
    description: Multiply two numbers.
    parameters:
      type: object
      additionalProperties: false
      required: [ a, b ]
      properties:
        a: { type: number }
        b: { type: number }
---
kind: Ai.AgentStream
metadata: { name: Assistant }
model: !ref Echo
system: "Use tools when needed."
onToolError: throw
toolProviders:
  - provider: !ref LocalTools
---
kind: Ndjson.Encoder
metadata: { name: NdjsonEnc }
---
kind: Http.Api
metadata: { name: Api }
routes:
  - request:
      path: /chat
      method: POST
      schema:
        body:
          type: object
          required: [ prompt ]
          properties:
            prompt: { type: string }
    handler: !ref Assistant
    inputs:
      prompt: !cel "request.body.prompt"
    returns:
      - status: 200
        mode: stream
        content:
          application/x-ndjson:
            encoder: !ref NdjsonEnc
    # A catch-all. The handler's throw union is declared now, so the analyzer
    # requires every code to be covered or a final entry with no `when:`. It
    # fires BEFORE streaming starts — once frames are on the wire the encoder's
    # own terminal error frame is what a client sees.
    catches:
      - status: 500
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error: { type: string }
            body:
              error: !cel "error.code"
---
kind: JS.Script
metadata: { name: FetchAndSummarize }
code: |
  async function main({ url, prompt }) {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });
    const chunks = [];
    for await (const chunk of r.body) chunks.push(Buffer.from(chunk));
    const body = Buffer.concat(chunks).toString("utf8");
    const events = body.split("\n").filter((l) => l.trim() !== "").map((l) => JSON.parse(l));
    const last = events[events.length - 1];
    return {
      lastType: last.type,
      lastCode: last.error && last.error.code,
      finishCount: events.filter((e) => e.type === "finish").length,
      errorCount: events.filter((e) => e.type === "error").length,
    };
  }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      url: { type: string }
      prompt: { type: string }
    required: [ url, prompt ]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: true
---
kind: Run.Sequence
metadata: { name: TestToolError }
with:
  - kind: Http.Server
    metadata: { name: Server }
    host: 127.0.0.1
    port: 8952
    baseUrl: http://127.0.0.1:8952
    openapi:
      info:
        title: AgentStream tool-error test
        version: 1.0.0
    mounts:
      - path: /
        mount: !ref Api
targets:
  - !ref Server
steps:
  - name: Hit
    inputs:
      url: http://127.0.0.1:8952/chat
      prompt: "call the ghost"
    invoke: !ref FetchAndSummarize
  - name: AssertTerminalError
    inputs:
      lastType: !cel "steps.Hit.result.lastType"
      lastCode: !cel "steps.Hit.result.lastCode"
      finishCount: !cel "steps.Hit.result.finishCount"
      errorCount: !cel "steps.Hit.result.errorCount"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          lastType: { const: "error" }
          lastCode: { const: "ERR_AGENT_UNKNOWN_TOOL" }
          finishCount: { const: 0 }
          errorCount: { const: 1 }
        required: [ lastType, lastCode, finishCount, errorCount ]

  # The same failure reached directly rather than over the wire. Draining the
  # agent's own stream rejects, and the rejection is catchable BY NAME — which
  # is what a terminal data part could never be.
  - name: Direct
    try:
      - name: Start
        inputs:
          prompt: "call the ghost"
        invoke: !ref Assistant
      - name: Drain
        inputs:
          input: !cel "steps.Start.result.output"
        invoke:
          kind: Stream.Collect
    catch:
      - name: AssertCatchableByName
        inputs:
          actual: !cel "error.code"
          expected: ERR_AGENT_UNKNOWN_TOOL
        invoke: !ref Assert.equals
