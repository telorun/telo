kind: Telo.Application
metadata:
  name: AnthropicLiveToolLoop
  version: 1.0.0
  description: |
    Live Messages API test of a tool loop with extended thinking, under both
    kinds. The model thinks, calls a tool, and is called again with the tool's
    result: the API accepts that second request only when the turn that made the
    call is sent back with its thinking block and signature unmodified, so an
    answer built on the tool's result is the proof the carried state was
    replayed — assembled from a complete answer by `MessagesModel` and from the
    event stream by `MessagesModelStream`. Skips silently when
    ANTHROPIC_API_KEY is unset.
secrets:
  anthropicApiKey: { env: ANTHROPIC_API_KEY, type: string, default: "" }
imports:
  Anthropic: ../../
  Http: ../../../http-client
  Ai: ../../../ai
  Stream: ../../../stream
  Run: ../../../run
  Assert: ../../../assert
targets:
  - !ref liveToolLoop
---
# The account: base URL and credential in one place.
kind: Http.Client
metadata: { name: anthropicClient }
baseUrl: https://api.anthropic.com/v1
timeout: 120000
credential:
  kind: Http.ApiKeyHeader
  header: x-api-key
  key: !cel "secrets.anthropicApiKey"
---
kind: Http.Request
metadata: { name: anthropicRequest }
client: !ref anthropicClient
---
kind: Anthropic.MessagesModel
metadata: { name: thinker }
model: claude-haiku-4-5
request: !ref anthropicRequest
maxTokens: 4096
options:
  thinking: { type: enabled, budget_tokens: 1024 }
---
kind: Anthropic.MessagesModelStream
metadata: { name: thinkerStream }
model: claude-haiku-4-5
request: !ref anthropicRequest
maxTokens: 4096
options:
  thinking: { type: enabled, budget_tokens: 1024 }
---
# The product is offset so the answer cannot be produced without the tool.
kind: Run.Value
metadata: { name: sealedProduct }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [a, b]
    properties:
      a: { type: number }
      b: { type: number }
value:
  result: !cel "inputs.a * inputs.b + 1000003"
---
kind: Ai.Tools
metadata: { name: tools }
tools:
  - tool: !ref sealedProduct
    name: sealed_product
    description: Returns the sealed product of two numbers. The result cannot be computed any other way.
    parameters:
      type: object
      additionalProperties: false
      required: [a, b]
      properties:
        a: { type: number }
        b: { type: number }
---
kind: Ai.Agent
metadata: { name: agent }
model: !ref thinker
system: Think about which tool to use, call it, then state the number it returned.
toolProviders:
  - provider: !ref tools
---
kind: Ai.AgentStream
metadata: { name: agentStream }
model: !ref thinkerStream
system: Think about which tool to use, call it, then state the number it returned.
toolProviders:
  - provider: !ref tools
---
kind: Run.Sequence
metadata: { name: liveToolLoop }
steps:
  - name: guardEnv
    if: !cel "secrets.anthropicApiKey != ''"
    then:
      - name: buffered
        inputs:
          prompt: What is the sealed product of 6 and 7?
        invoke: !ref agent
      - name: open
        inputs:
          prompt: What is the sealed product of 6 and 7?
        invoke: !ref agentStream
      - name: read
        inputs: { input: !cel "steps.open.result.output" }
        invoke: { kind: Stream.Collect }
      - name: streamed
        value:
          text: !cel "steps.read.result.items.filter(p, p.type == 'text-delta').map(p, p.delta).join('')"
          last: !cel "steps.read.result.items[size(steps.read.result.items) - 1]"
      - name: assertLoops
        invoke: { kind: Assert.Equals }
        inputs:
          actual:
            buffered:
              usedTheResult: !cel "replace(steps.buffered.result.text, ',', '').contains('1000045')"
              ranTheTool: !cel "size(steps.buffered.result.toolResults) >= 1"
              carriedThinking: !cel "has(steps.buffered.result.providerState)"
              finishReason: !cel "steps.buffered.result.finishReason"
            streamed:
              usedTheResult: !cel "replace(steps.streamed.result.text, ',', '').contains('1000045')"
              ranTheTool: !cel "steps.read.result.items.exists(p, p.type == 'tool-result')"
              namedItsDeltas: !cel "steps.read.result.items.filter(p, p.type == 'tool-call-delta').all(d, steps.read.result.items.exists(c, c.type == 'tool-call' && c.toolCall.id == d.toolCallId && c.toolCall.name == d.toolName))"
              thought: !cel "steps.read.result.items.exists(p, p.type == 'reasoning-delta')"
              carriedThinking: !cel "steps.read.result.items.exists(p, p.type == 'provider-state')"
              endsOn: !cel "steps.streamed.result.last.type"
              finishReason: !cel "steps.streamed.result.last.finishReason"
          expected:
            buffered:
              usedTheResult: true
              ranTheTool: true
              carriedThinking: true
              finishReason: stop
            streamed:
              usedTheResult: true
              ranTheTool: true
              namedItsDeltas: true
              thought: true
              carriedThinking: true
              endsOn: finish
              finishReason: stop
