kind: Telo.Application
metadata:
  name: NotesWeb
  version: 1.0.0
  categories: [Transport, UI]
  description: |
    A web app that signs users in through an OIDC-style provider (authorization code
    flow): `/auth/login` sends the browser to the provider, `/auth/callback` checks
    the returned `state`, exchanges the `code` at the provider's token endpoint and
    starts a session, and `/`, a declared UI page, shows who is signed in or offers the sign-in. The provider answers either in
    the redirect's query or with a form POST (`responseMode`).

    It brings its own provider, `identity-provider/`, a stand-in that signs `alice` in
    at once, so there is nothing to register or start:
        telo run ./examples/notes-web
    To sign in through a real provider, set `PROVIDER_URL` and `CLIENT_ID` and register
    the redirect address http://127.0.0.1:8080/auth/callback with it.
lang: en
requires: { telo: ">=0.133.0" }
imports:
  App: ../../modules/app
  Http: ../../modules/http-server
  HttpDispatch: ../../modules/http-dispatch
  HttpClient: ../../modules/http-client
  Session: ../../modules/session
  KvStoreMemory: ../../modules/kv-store-memory
  Ui: ../../modules/ui
  UiReact: ../../modules/ui-react
variables:
  providerUrl:
    env: PROVIDER_URL
    type: string
    default: ""
    description: Origin of the identity provider, serving `/authorize` and `/token`. Empty means the bundled stand-in.
  clientId:
    env: CLIENT_ID
    type: string
    default: notes-example
    description: The client id registered with the provider.
  responseMode:
    env: RESPONSE_MODE
    type: string
    enum: [query, form_post]
    default: query
    description: How the provider returns the code, in the redirect's query or as a form POST.
  standInUser:
    env: STAND_IN_USER
    type: string
    default: alice
    description: The user the bundled stand-in provider signs in.
ports:
  http: { env: PORT, default: 8080 }
  provider: { env: PROVIDER_PORT, default: 8081 }
targets:
  - !ref identityProvider
  - !ref server
  - { name: openUi, invoke: !ref openUi, inputs: { url: !cel "resources.server.status.localUrl" } }
---
# The provider the sign-in goes through when `PROVIDER_URL` names none.
kind: App.Instance
metadata: { name: identityProvider }
source: ./identity-provider
ports: { http: !cel "ports.provider" }
variables: { subject: !cel "variables.standInUser" }
---
kind: Http.Server
metadata: { name: server }
listen: { port: !cel "ports.http" }
contentTypeParsers:
  - { contentType: application/x-www-form-urlencoded }
mounts:
  - path: /auth
    mount: !ref auth
    authentication: { anonymous: allow }
  - path: /api
    mount: !ref api
    authentication:
      anonymous: allow
      verifiers:
        - verifier: { kind: Session.Verifier, sessions: !ref sessions }
          from: { kind: Http.FromCookie, cookie: !ref sessionCookie, scheme: Session }
  - { path: /, mount: !ref ui, authentication: { anonymous: allow } }
---
kind: Session.Sessions
metadata: { name: sessions }
store: { kind: KvStoreMemory.Store }
name: notes
idleTimeout: 1800s
absoluteLifetime: 43200s
---
kind: HttpDispatch.UnprefixedCookie
metadata: { name: sessionCookie }
name: notes-session
secure: false
---
kind: HttpDispatch.UnprefixedCookie
metadata: { name: stateCookie }
name: notes-state
secure: false
---
# Checks the returned state against the one this browser was sent away with, then
# trades the code for the user and starts a session.
kind: Telo.Sequence
metadata: { name: completeSignIn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [code, state, expectedState]
    properties: { code: { type: string }, state: { type: string }, expectedState: { type: string } }
steps:
  - name: stateMatches
    value: !cel "inputs.code != '' && inputs.state != '' && inputs.state == inputs.expectedState"
  - name: exchange
    if: !cel "steps.stateMatches.result"
    then:
      - name: token
        invoke:
          kind: HttpClient.Request
          client:
            kind: HttpClient.Client
            baseUrl: !cel "variables.providerUrl != '' ? variables.providerUrl : 'http://127.0.0.1:' + string(ports.provider)"
            throwOnHttpError: false
          method: POST
          url: /token
        inputs:
          headers: { content-type: application/x-www-form-urlencoded }
          body:
            grant_type: authorization_code
            code: !cel "inputs.code"
            client_id: !cel "variables.clientId"
            redirect_uri: !interpolate "http://127.0.0.1:${{ ports.http }}/auth/callback"
      - name: user
        value: !cel "steps.token.result.status == 200 ? string(steps.token.result.body.sub) : ''"
    else:
      - { name: user, value: "" }
  - name: signedIn
    if: !cel "steps.user.result != ''"
    then:
      - name: started
        invoke: { kind: Session.Start, sessions: !ref sessions }
        inputs:
          principal:
            subject: !cel "steps.user.result"
            issuer: null
            kind: user
            claims: {}
            scopes: []
            roles: []
            permissions: []
            org: null
            amr: [oidc]
            acr: null
            sessionId: null
            authenticatedAt: null
            via: login
      - name: outcome
        value: !cel "{'accepted': true, 'token': steps.started.result.token}"
    else:
      - { name: outcome, value: { accepted: false, token: "" } }
outputs:
  accepted: !cel "steps.outcome.result.accepted"
  token: !cel "steps.outcome.result.token"
---
kind: Http.Api
metadata: { name: auth }
catches:
  - status: 503
    content: { text/html: { body: "<p>Sign-in is unavailable; try again</p>" } }
routes:
  - request: { path: /login, method: GET }
    handler: { kind: Telo.Value, value: !cel "{'state': uuidv4()}" }
    returns:
      - status: 302
        headers:
          Location: !interpolate "${{ variables.providerUrl != '' ? variables.providerUrl : 'http://127.0.0.1:' + string(ports.provider) }}/authorize?response_type=code&client_id=${{ urlEncode(variables.clientId) }}&redirect_uri=${{ urlEncode('http://127.0.0.1:' + string(ports.http) + '/auth/callback') }}&state=${{ result.state }}&response_mode=${{ variables.responseMode }}"
        cookies: [{ cookie: !ref stateCookie, value: !cel "result.state" }]
        content: { text/html: { body: "<p>Redirecting to the provider</p>" } }
  - request: { path: /callback, method: GET }
    handler: !ref completeSignIn
    inputs:
      code: !cel "'code' in request.query ? request.query.code : ''"
      state: !cel "'state' in request.query ? request.query.state : ''"
      expectedState: !cel "'cookie' in request.headers ? request.headers.cookie.split('; ').filter(p, p.startsWith('notes-state=')).map(p, p.substring(12)).join('') : ''"
    returns: &signInReturns
      - status: 302
        when: !cel "result.accepted"
        headers: { Location: / }
        cookies:
          - { cookie: !ref stateCookie, maxAge: 0s }
          - { cookie: !ref sessionCookie, value: !cel "result.token" }
        content: { text/html: { body: "<p>Signed in</p>" } }
      - status: 400
        cookies: [{ cookie: !ref stateCookie, maxAge: 0s }]
        content: { text/html: { body: "<p>Sign-in was refused</p>" } }
  - request: { path: /callback, method: POST }
    handler: !ref completeSignIn
    inputs:
      code: !cel "request.body.split('&').filter(p, p.startsWith('code=')).map(p, urlDecode(p.substring(5))).join('')"
      state: !cel "request.body.split('&').filter(p, p.startsWith('state=')).map(p, urlDecode(p.substring(6))).join('')"
      expectedState: !cel "'cookie' in request.headers ? request.headers.cookie.split('; ').filter(p, p.startsWith('notes-state=')).map(p, p.substring(12)).join('') : ''"
    returns: *signInReturns
---
# Who is signed in, for the page to read; an empty `user` means nobody.
kind: Http.Api
metadata: { name: api }
routes:
  - request: { path: /session, method: GET }
    inputs: { user: !cel "request.principal != null ? request.principal.subject : ''" }
    handler:
      kind: Telo.Value
      inputType: { kind: Telo.JsonSchema, schema: { type: object, properties: { user: { type: string } } } }
      value: !cel "{'user': inputs.user}"
    returns:
      - status: 200
        content:
          application/json:
            schema: { type: object, required: [user], properties: { user: { type: string } } }
            body: !cel "{'user': result.user}"
---
kind: Telo.JsonSchema
metadata: { name: Whoami }
schema: { type: object, required: [user], properties: { user: { type: string, title: User } } }
---
# The home page reads the session and shows either the user or the way in. The
# user's name is drawn as text, whatever it holds.
kind: UiReact.App
metadata: { name: ui }
title: Notes
theme: !ref UiReact.defaultTheme
pages:
  - kind: Ui.Page
    path: /
    title: Notes
    width: contained
    children:
      - { type: text, text: Notes, style: heading }
      - type: composite
        ref:
          kind: Ui.Data
          model: !ref Whoami
          source: /api/session
          reloadOn: [focus]
          content:
            type: stack
            children:
              - type: stack
                shown: { at: !cel "data.user", matches: { minLength: 1 } }
                children:
                  - { type: text, text: Signed in as, style: muted }
                  - { type: value, value: !cel "data.user", style: strong }
              - type: stack
                shown: { at: !cel "data.user", matches: { maxLength: 0 } }
                children:
                  - { type: text, text: Sign in to see your notes., style: muted }
                  - { type: link, text: Sign in, href: /auth/login, button: { kind: Ui.TextButton }, style: accent }
---
kind: Telo.OpenUrl
metadata: { name: openUi }
