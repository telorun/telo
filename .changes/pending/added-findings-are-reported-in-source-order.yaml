body: Findings are reported in source order — by file, then where each is written, then
  path, code and message — by `telo check`, `telo run`'s refusals, the editor and
  `ctx.runtime.check`, never by which check found them; the first failure of a referrer
  rule on a resource and the earlier of two declarations of one name are read in that
  order.
