# A model declaring a filter by a property named as a query parameter the list
# route owns. `telo check` reports it here; a consumer's check sees nothing, so
# there the model refuses itself when it is created.
kind: Telo.Library
metadata:
  name: CrudModelFilterReservedName
  version: 1.0.0
  description: Test fixture exporting a data model refused as CRUD_MODEL_FILTER_RESERVED_NAME.
imports:
  Crud: ../../../../../
exports:
  resources: [model]
---
kind: Telo.JsonSchema
metadata: { name: Draft }
schema:
  type: object
  required: [text]
  additionalProperties: false
  properties:
    text: { type: string }
    limit: { type: integer }
---
kind: Telo.JsonSchema
metadata: { name: Record }
extends: Draft
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
---
kind: Crud.Model
metadata: { name: model }
schemas:
  read: !ref Record
  list: !ref Record
  create: !ref Draft
  update: !ref Draft
query:
  filters:
    - { property: text, operator: contains }
    - { property: limit, operator: eq }
  sort: []
