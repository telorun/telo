# A kind whose accessor field is typed as text directly, and one whose accessor
# field names a shape typing it as text only where a choice writes it: the first
# is refused whatever the configuration, the second only where the choice holds.
kind: Telo.Application
metadata: { name: KindAnnotationShapeChoice }
variables: { flag1: { env: FLAG_1, type: boolean, default: false } }
---
kind: Telo.JsonSchema
metadata: { name: Caption }
schema:
  type: object
  properties:
    text: !if
      if: !cel "variables.flag1"
      then: { $ref: "telo://manifest#/$defs/Text" }
      else: { type: string }
---
kind: Telo.Definition
metadata: { name: Column }
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./probe.mjs#Column]
schema:
  type: object
  properties:
    label:
      $ref: "telo://manifest#/$defs/Text"
      x-telo-eval: accessor
      x-telo-context: { type: object, properties: { row: {} } }
---
kind: Telo.Definition
metadata: { name: Tile }
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./probe.mjs#Tile]
schema:
  type: object
  properties:
    caption:
      $ref: "telo://Self/Caption"
      x-telo-eval: accessor
      x-telo-context: { type: object, properties: { row: {} } }
