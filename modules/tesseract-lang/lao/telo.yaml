    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/lao.traineddata.gz:
        { upstream: lao, member: package/4.0.0_best_int/lao.traineddata.gz, sha256: 660306d4a42941426256c723a7d6d3b65f81e6c428e5f83d5f25180a486d0011, executable: false }
