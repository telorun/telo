kind: Telo.Application
metadata:
  name: OpenaiLiveText
  version: 1.0.0
  description: |
    Live OpenAI integration test. Skips silently when OPENAI_API_KEY is unset
    (locally: drop a .env.local in this directory; CI: secret on the workflow).
secrets:
  openaiApiKey: { env: OPENAI_API_KEY, type: string, default: "" }
imports:
  OpenAI: ../
  Http: ../../http-client
  Ai: ../../ai
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref LiveText
---
# The account: base URL and credential in one place, so the key is declared once
# and the 401 re-acquire-and-retry is inherited rather than re-implemented.
kind: Http.BearerToken
metadata: { name: openaiKey }
token: !cel "secrets.openaiApiKey"
---
kind: Http.Client
metadata: { name: openaiClient }
baseUrl: https://api.openai.com/v1
credential: !ref openaiKey
---
kind: Http.Request
metadata: { name: openaiRequest }
client: !ref openaiClient
---
kind: OpenAI.Model
metadata: { name: Live }
model: gpt-4o-mini
request: !ref openaiRequest
options:
  temperature: 0
  maxTokens: 32
---
kind: Ai.Text
metadata: { name: C }
model: !ref Live
---
kind: Run.Sequence
metadata:
  name: LiveText
steps:
  - name: GuardEnv
    if: !cel "secrets.openaiApiKey != ''"
    then:
      - name: Invoke
        inputs:
          prompt: "Say the single word: pong."
        invoke: !ref C
      - name: Assert
        inputs:
          text: "${{ steps.Invoke.result.text }}"
          promptTokens: "${{ steps.Invoke.result.usage.promptTokens }}"
          completionTokens: "${{ steps.Invoke.result.usage.completionTokens }}"
          finishReason: "${{ steps.Invoke.result.finishReason }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              text: { type: string, minLength: 1 }
              promptTokens: { type: integer, minimum: 1 }
              completionTokens: { type: integer, minimum: 1 }
              finishReason: { type: string, enum: [ stop, length, content-filter, error, other ] }
            required: [ text, promptTokens, completionTokens, finishReason ]
