kind: Telo.Application
metadata:
  name: ChatConversationBranch
  version: 1.0.0
  description: |
    Branching a conversation, offline against the provider stub. A branch
    through a conversation's third turn — one finished, one aborted, one the
    provider refused — is a new conversation titled `<title> (branch)`
    whose turns read exactly as the source's: the same statuses, the same
    errors, the same records. Ten turns copy in the source's order. A title
    stays within the 200 characters PATCH accepts, counted as PATCH counts them
    (code points): a 191-character source title is branched as `<title>
    (branch)`, and a 200-character one as its first 190 characters followed by
    `… (branch)`, which PATCH takes back as it is. The source is left as it was. Branching while a copied turn runs is 409
    ERR_TURN_IN_PROGRESS and leaves nothing of the partial copy — no hidden
    conversation, no copied turn row or live key; through a turn of another
    conversation it is 404 ERR_TURN_NOT_FOUND. Through the chat library, a
    ten-turn branch completes whole while the retention sweep runs over and
    over beside it.
imports:
  Chat:
    source: ../
    secrets:
      openaiApiKey: stub-key
    variables:
      workspaceDir: !cel "variables.libraryScratch.joinPath('workspace')"
      stateDir: !cel "variables.libraryScratch.joinPath('state')"
      modelEndpoint: http://127.0.0.1:18526/v1
  Sql: oci://ghcr.io/telorun/sql@0.25.0#sha256-x8UXPZbNmoCuldq7EAcotw6KfwZr9baCKrRX_8TKaYc
  SQLite: oci://ghcr.io/telorun/sqlite@0.7.0#sha256-iAGE4n-r6dEjTPbJQkAV65pRjILsJI47aderaurBVvs
  App: oci://ghcr.io/telorun/app@0.2.0#sha256-vCNxysnNWaauCz5xcqXg2SfrotM1xhZ3VwlEzumpO2o
  Fs: oci://ghcr.io/telorun/fs@0.11.0#sha256-P7Z6jMuBPjPpHOgwcZXYpjuDsrXlORUMG1X79g00gfE
  HttpClient: oci://ghcr.io/telorun/http-client@0.22.3#sha256-OtxM1NSmRcDovSy6N_tkX-pIwtty4MMwj-RPDO0QH1s
  Sse: oci://ghcr.io/telorun/sse-codec@0.11.1#sha256-8iOMs2cEGmAxiVQLiioiUgB5owyPmzBSTE3DEMksbvA
  Stream: oci://ghcr.io/telorun/stream@0.13.0#sha256-OAOZ21USu_5mBQ1IrThy73jG7gkqsWQ21s8Wh0FTaQc
  Run: oci://ghcr.io/telorun/run@0.27.1#sha256-O1CdVvYs_O7Zj-PNQxMS3NdgWL6e8M2A0J9Wu0rTnIU
  Assert: oci://ghcr.io/telorun/assert@0.20.1#sha256-mnAbFggBHChh_rXaSbeEjj8y1PHyY-y42YGO2TgAClQ
variables:
  scratch:
    env: CHAT_TEST_CONVERSATION_BRANCH_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/conversation-branch
  # The chat library's own state, opened at boot and so never emptied: each run
  # works in conversations of its own.
  libraryScratch:
    env: CHAT_TEST_CONVERSATION_BRANCH_LIBRARY_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/conversation-branch-library
targets:
  - !ref Chat.ensureWorkspace
  - !ref Chat.initSchema
  - !ref test
---
kind: HttpClient.Client
metadata: { name: client }
throwOnHttpError: false
---
kind: HttpClient.Request
metadata: { name: call }
client: !ref client
---
kind: Run.Sequence
metadata: { name: create }
steps:
  - name: post
    invoke: !ref call
    inputs:
      url: http://127.0.0.1:18527/conversations
      method: POST
outputs:
  id: !cel "steps.post.result.body.id"
---
kind: Run.Sequence
metadata: { name: startTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, message]
    properties:
      conversationId: { type: string }
      message: { type: string }
steps:
  - name: post
    invoke: !ref call
    inputs:
      url: http://127.0.0.1:18527/chat
      method: POST
      body:
        conversationId: !cel "inputs.conversationId"
        message: !cel "inputs.message"
outputs:
  turnId: !cel "steps.post.result.body.turnId"
---
kind: Run.Sequence
metadata: { name: drain }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId]
    properties:
      turnId: { type: string }
steps:
  - name: get
    timeout: 30000
    invoke: !ref call
    inputs:
      url: !interpolate "http://127.0.0.1:18527/chat/${{ inputs.turnId }}/events"
      responseType: stream
  - name: frames
    invoke: { kind: Sse.Decoder }
    inputs:
      input: !cel "steps.get.result.body"
  - name: all
    timeout: 30000
    invoke: { kind: Stream.Collect }
    inputs:
      input: !cel "steps.frames.result.records"
outputs:
  count: !cel "size(steps.all.result.items)"
---
# One turn to its end.
kind: Run.Sequence
metadata: { name: turn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, message]
    properties:
      conversationId: { type: string }
      message: { type: string }
steps:
  - name: start
    invoke: !ref startTurn
    inputs:
      conversationId: !cel "inputs.conversationId"
      message: !cel "inputs.message"
  - name: drained
    invoke: !ref drain
    inputs: { turnId: !cel "steps.start.result.turnId" }
outputs:
  turnId: !cel "steps.start.result.turnId"
---
kind: Run.Sequence
metadata: { name: read }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: { type: string }
steps:
  - name: get
    invoke: !ref call
    inputs:
      url: !interpolate "http://127.0.0.1:18527${{ inputs.path }}"
outputs:
  status: !cel "steps.get.result.status"
  body: !cel "steps.get.result.body"
---
# Fails until the stub holds an agent call (not a naming call) carrying `text`.
kind: Run.Sequence
metadata: { name: stubHolds }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      text: { type: string }
steps:
  - name: sent
    invoke: !ref call
    inputs:
      url: http://127.0.0.1:18526/requests
  - name: notYet
    if: !cel >-
      !steps.sent.result.body.requests.exists(r, json(r).contains(inputs.text)
        && !json(r).contains('You name conversations'))
    then:
      - name: waiting
        throw:
          code: ERR_TEST_NOT_RECEIVED_YET
          message: !cel "'The stub holds no agent call carrying ' + inputs.text + ' yet.'"
---
kind: Run.Sequence
metadata: { name: branch }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, throughTurnId]
    properties:
      conversationId: { type: string }
      throughTurnId: { type: string }
steps:
  - name: send
    invoke: !ref call
    inputs:
      url: !interpolate "http://127.0.0.1:18527/conversations/${{ inputs.conversationId }}/branch"
      method: POST
      body: { throughTurnId: !cel "inputs.throughTurnId" }
outputs:
  status: !cel "steps.send.result.status"
  body: !cel "steps.send.result.body"
---
# What a refused branch left: hidden conversations still live, turn rows of any
# conversation but the source, and every key without a turn row as the events
# route answers it (410 once removed).
kind: Run.Sequence
metadata: { name: partialCopy }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [sourceId]
    properties:
      sourceId: { type: string }
with:
  - kind: SQLite.Connection
    metadata: { name: agentDb }
    file: !cel "variables.scratch.joinPath('.telo-agent').joinPath('agent.sqlite')"
  - kind: Sql.Query
    metadata: { name: agentQuery }
    connection: !ref agentDb
steps:
  - name: counts
    invoke: !ref agentQuery
    inputs:
      sql: |
        SELECT (SELECT COUNT(*) FROM conversations WHERE assembling = 1 AND removed_at IS NULL) AS hidden,
               (SELECT COUNT(*) FROM turns WHERE conversation_id <> ?) AS copied
      bindings: [ !cel "inputs.sourceId" ]
  - name: keys
    invoke: !ref agentQuery
    inputs:
      sql: |
        SELECT k.journal_key FROM turn_journal_keys k
        WHERE NOT EXISTS (SELECT 1 FROM turns t WHERE t.turn_id = k.journal_key)
  - name: answers
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.keys"
      steps:
        - name: events
          timeout: 5000
          invoke: !ref read
          inputs: { path: !interpolate "/chat/${{ item.journal_key }}/events" }
      outputs:
        status: !cel "steps.events.result.status"
    inputs:
      keys: !cel "steps.keys.result.rows"
outputs:
  hidden: !cel "int(steps.counts.result.rows[0].hidden)"
  copiedTurns: !cel "int(steps.counts.result.rows[0].copied)"
  keysWithoutTurns: !cel "distinct(steps.answers.result.map(a, a.status))"
---
# One turn through the chat library, to its end.
kind: Run.Sequence
metadata: { name: libraryTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, message]
    properties:
      conversationId: { type: string }
      message: { type: string }
steps:
  - name: start
    invoke: !ref Chat.chatStart
    inputs:
      conversationId: !cel "inputs.conversationId"
      idempotencyKey: ""
      clientIp: test-runner
      message: !cel "inputs.message"
  - name: read
    invoke: !ref Chat.journalSource
    inputs:
      key: !cel "steps.start.result.turnId"
      fromId: 0
  - name: drain
    timeout: 30000
    invoke: { kind: Stream.Collect }
    inputs:
      input: !cel "steps.read.result.output"
---
# A ten-turn branch beside a retention sweep run forty times over, every run
# with a window that ended a minute ago: the branch being assembled is not
# idle, and nothing of it is taken.
kind: Run.Sequence
metadata: { name: branchBesideSweeps }
steps:
  - name: source
    invoke: !ref Chat.createConversation
  - name: ten
    invoke:
      kind: Run.Projection
      collection: !cel "range(10)"
      concurrency: 1
      steps:
        - name: one
          invoke: !ref libraryTurn
          inputs:
            conversationId: !cel "inputs.conversationId"
            message: !cel "'turn ' + string(item)"
      outputs:
        index: !cel "item"
    inputs:
      conversationId: !cel "steps.source.result.conversation.id"
  - name: lastTurn
    invoke: !ref Chat.conversationRecords
    inputs:
      conversationId: !cel "steps.source.result.conversation.id"
      fromTurn: ""
      fromId: 0
      limit: 10000
  - name: race
    invoke:
      kind: Run.Projection
      collection: [ branch, sweep ]
      concurrency: 2
      steps:
        - name: side
          if: !cel "item == 'branch'"
          then:
            - name: branched
              invoke: !ref Chat.branchConversation
              inputs:
                conversationId: !cel "inputs.sourceId"
                throughTurnId: !cel "inputs.throughTurnId"
          else:
            - name: sweeps
              invoke:
                kind: Run.Iteration
                collection: !cel "range(40)"
                steps:
                  - name: sweep
                    invoke: !ref Chat.retentionSweep
                    inputs:
                      idleBefore: !cel "now() - duration('1m')"
      outputs:
        conversationId: !cel "has(steps.branched) ? dyn(steps.branched.result.conversation.id) : null"
        messageCount: !cel "has(steps.branched) ? dyn(steps.branched.result.conversation.messageCount) : null"
    inputs:
      sourceId: !cel "steps.source.result.conversation.id"
      throughTurnId: !cel "steps.lastTurn.result.turns[9].turnId"
  - name: branchRecords
    invoke: !ref Chat.conversationRecords
    inputs:
      conversationId: !cel "steps.race.result[0].conversationId"
      fromTurn: ""
      fromId: 0
      limit: 10000
outputs:
  messageCount: !cel "steps.race.result[0].messageCount"
  turns: !cel "steps.branchRecords.result.turns.map(t, [t.status, t.records[0].data.content])"
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: stub }
    source: ./__fixtures__/provider-stub/telo.yaml
    ports: { http: 18526 }
targets: [ !ref stub ]
steps:
  - name: prepare
    invoke: { kind: Fs.DirectoryCreation }
    inputs:
      path: !cel "string(variables.scratch)"
      createParents: true
  - name: reset
    invoke: { kind: Fs.FileRemoval }
    inputs:
      path: !cel "string(variables.scratch)"
      recursive: true
  - name: agent
    invoke:
      kind: Run.Sequence
      with:
        - kind: App.Instance
          metadata: { name: agent }
          source: ../../telo.yaml
          ports: { http: 18527 }
          variables:
            workspaceDir: !cel "variables.scratch"
            modelEndpoint: http://127.0.0.1:18526/v1
          secrets:
            openaiApiKey: stub-key
      targets: [ !ref agent ]
      steps:
        # ── finished, failed and aborted ────────────────────────────────────
        - name: source
          invoke: !ref create
        - name: finished
          invoke: !ref turn
          inputs: { conversationId: !cel "steps.source.result.id", message: hello }
        - name: slow
          invoke: !ref startTurn
          inputs: { conversationId: !cel "steps.source.result.id", message: STUB_SLOW hold on }
        - name: slowHeld
          retry: { attempts: 100, initialDelay: 100, factor: 1, jitter: none }
          invoke: !ref stubHolds
          inputs: { text: STUB_SLOW hold on }
        - name: whileRunning
          invoke: !ref branch
          inputs:
            conversationId: !cel "steps.source.result.id"
            throughTurnId: !cel "steps.slow.result.turnId"
        - name: partial
          invoke: !ref partialCopy
          inputs: { sourceId: !cel "steps.source.result.id" }
        - name: partialRemoved
          invoke: { kind: Assert.Equals }
          inputs:
            actual: !cel "steps.partial.result"
            expected: { hidden: 0, copiedTurns: 0, keysWithoutTurns: [ 410 ] }
        - name: abort
          invoke: !ref call
          inputs:
            url: !interpolate "http://127.0.0.1:18527/chat/${{ steps.slow.result.turnId }}/abort"
            method: POST
        - name: aborted
          invoke: !ref drain
          inputs: { turnId: !cel "steps.slow.result.turnId" }
        # Refused by the stub, which reads a refusal before a hold.
        - name: failed
          invoke: !ref turn
          inputs: { conversationId: !cel "steps.source.result.id", message: STUB_FAIL please }
        - name: sourceBefore
          invoke: !ref read
          inputs: { path: !interpolate "/conversations/${{ steps.source.result.id }}" }
        - name: branched
          invoke: !ref branch
          inputs:
            conversationId: !cel "steps.source.result.id"
            throughTurnId: !cel "steps.failed.result.turnId"
        - name: sourceRecords
          invoke: !ref read
          inputs: { path: !interpolate "/conversations/${{ steps.source.result.id }}/records" }
        - name: branchRecords
          invoke: !ref read
          inputs: { path: !interpolate "/conversations/${{ steps.branched.result.body.id }}/records" }
        - name: sourceAfter
          invoke: !ref read
          inputs: { path: !interpolate "/conversations/${{ steps.source.result.id }}" }
        - name: foreign
          invoke: !ref branch
          inputs:
            conversationId: !cel "steps.branched.result.body.id"
            throughTurnId: !cel "steps.failed.result.turnId"
        - name: copiedExactly
          invoke: { kind: Assert.Equals }
          inputs:
            actual:
              whileRunning: [ !cel "steps.whileRunning.result.status", !cel "steps.whileRunning.result.body.code" ]
              branched: !cel >-
                cel.bind(c, steps.branched.result.body,
                  [steps.branched.result.status, c.title, c.messageCount, c.revision, c.archived, c.id != steps.source.result.id])
              statuses: !cel "steps.branchRecords.result.body.turns.map(t, t.status)"
              sameTurns: !cel >-
                steps.branchRecords.result.body.turns.map(t, [t.status, t.error, t.records])
                  == steps.sourceRecords.result.body.turns.map(t, [t.status, t.error, t.records])
              newIds: !cel >-
                !steps.branchRecords.result.body.turns.exists(t,
                  steps.sourceRecords.result.body.turns.exists(s, s.turnId == t.turnId))
              sourceUnchanged: !cel "steps.sourceAfter.result.body == steps.sourceBefore.result.body"
              foreign: [ !cel "steps.foreign.result.status", !cel "steps.foreign.result.body.code" ]
            expected:
              whileRunning: [ 409, ERR_TURN_IN_PROGRESS ]
              branched: [ 201, Stub title (branch), 6, 0, false, true ]
              statuses: [ finished, aborted, failed ]
              sameTurns: true
              newIds: true
              sourceUnchanged: true
              foreign: [ 404, ERR_TURN_NOT_FOUND ]
        # ── ten turns, in order ─────────────────────────────────────────────
        - name: long
          invoke: !ref create
        - name: ten
          invoke:
            kind: Run.Projection
            collection: !cel "range(10)"
            concurrency: 1
            steps:
              - name: one
                invoke: !ref turn
                inputs:
                  conversationId: !cel "inputs.conversationId"
                  message: !cel "'turn ' + string(item)"
            outputs:
              turnId: !cel "steps.one.result.turnId"
          inputs:
            conversationId: !cel "steps.long.result.id"
        - name: longBranch
          invoke: !ref branch
          inputs:
            conversationId: !cel "steps.long.result.id"
            throughTurnId: !cel "steps.ten.result[9].turnId"
        - name: longRecords
          invoke: !ref read
          inputs: { path: !interpolate "/conversations/${{ steps.longBranch.result.body.id }}/records" }
        - name: inOrder
          invoke: { kind: Assert.Equals }
          inputs:
            actual: !cel "steps.longRecords.result.body.turns.map(t, t.records[0].data.content)"
            expected: [ turn 0, turn 1, turn 2, turn 3, turn 4, turn 5, turn 6, turn 7, turn 8, turn 9 ]
        # ── a long title stays within PATCH's bound ─────────────────────────
        # Emoji, so a count in UTF-16 units would come out wrong.
        - name: longTitles
          value:
            full: !cel "join(range(200).map(i, '😀'), '')"
            fits: !cel "join(range(191).map(i, '😀'), '')"
            cut: !cel "join(range(190).map(i, '😀'), '')"
        - name: renameFull
          invoke: !ref call
          inputs:
            url: !interpolate "http://127.0.0.1:18527/conversations/${{ steps.long.result.id }}"
            method: PATCH
            body: { title: !cel "steps.longTitles.result.full" }
        - name: fullBranch
          invoke: !ref branch
          inputs:
            conversationId: !cel "steps.long.result.id"
            throughTurnId: !cel "steps.ten.result[9].turnId"
        - name: fullPatched
          invoke: !ref call
          inputs:
            url: !interpolate "http://127.0.0.1:18527/conversations/${{ steps.fullBranch.result.body.id }}"
            method: PATCH
            body: { title: !cel "steps.fullBranch.result.body.title" }
        - name: renameFits
          invoke: !ref call
          inputs:
            url: !interpolate "http://127.0.0.1:18527/conversations/${{ steps.long.result.id }}"
            method: PATCH
            body: { title: !cel "steps.longTitles.result.fits" }
        - name: fitsBranch
          invoke: !ref branch
          inputs:
            conversationId: !cel "steps.long.result.id"
            throughTurnId: !cel "steps.ten.result[9].turnId"
        - name: boundedTitles
          invoke: { kind: Assert.Equals }
          inputs:
            actual:
              full: !cel >-
                [steps.renameFull.result.status, size(steps.fullBranch.result.body.title),
                 steps.fullBranch.result.body.title == steps.longTitles.result.cut + '… (branch)',
                 steps.fullPatched.result.status, steps.fullPatched.result.body.title == steps.fullBranch.result.body.title]
              fits: !cel >-
                [steps.renameFits.result.status,
                 steps.fitsBranch.result.body.title == steps.longTitles.result.fits + ' (branch)']
            expected:
              full: [ 200, 200, true, 200, true ]
              fits: [ 200, true ]
  - name: besideSweeps
    invoke: !ref branchBesideSweeps
  - name: wholeDespiteSweeps
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.besideSweeps.result"
      expected:
        messageCount: 20
        turns:
          - [ finished, turn 0 ]
          - [ finished, turn 1 ]
          - [ finished, turn 2 ]
          - [ finished, turn 3 ]
          - [ finished, turn 4 ]
          - [ finished, turn 5 ]
          - [ finished, turn 6 ]
          - [ finished, turn 7 ]
          - [ finished, turn 8 ]
          - [ finished, turn 9 ]
