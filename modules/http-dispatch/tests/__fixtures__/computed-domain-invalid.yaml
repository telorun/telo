kind: Telo.Application
metadata: { name: ComputedDomainInvalid, version: 1.0.0 }
imports: { HttpDispatch: ../.. }
variables: { domain: { env: COOKIE_DOMAIN, type: string, default: "a.test; Path=/x" } }
