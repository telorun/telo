  runFails: "[ERR_DATA_MODEL_FILTER_UNKNOWN_PROPERTY] RuntimeError: Crud.Collection 'collection': 'query.filters[0]' filters by 'status', which 'model' does not declare"
---
kind: Assert.Manifest
metadata: { name: relationForeignKeyComposite }
source: ./__fixtures__/collection-refusals/relation-foreign-key-composite/lib/telo.yaml
expect: { errors: [] }
---
kind: Assert.Manifest
metadata: { name: relationForeignKeyCompositeAtRuntime }
source: ./__fixtures__/collection-refusals/relation-foreign-key-composite/telo.yaml
expect: { errors: [], runs: true }
