kind: Telo.Application
metadata:
  name: CrudUiAdminRefusalsTest
  version: 1.0.0
  description: |
    `CrudUi.Admin`'s presentation keys are checked where the application writes
    them: a key `filters`, `create` or `edit` does not have, an opener with no
    `to`, a `to` that is no destination, and a `paging` the listing does not
    take are each reported against the application's own `CrudUi.Admin`.
imports: { Assert: ../../assert }
targets:
  - !ref refused
---
kind: Assert.Manifest
metadata: { name: refused }
source: ./__fixtures__/admin-refusals/telo.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "CrudUi.Admin/filtersKey: /filters must NOT have additional properties ('sumary' is not allowed)"
    - code: SCHEMA_VIOLATION
      message: "CrudUi.Admin/createKey: /create must NOT have additional properties ('labell' is not allowed)"
    - code: SCHEMA_VIOLATION
      message: "CrudUi.Admin/editKey: /edit must NOT have additional properties ('labell' is not allowed)"
    - code: REFERENCE_KIND_MISMATCH
      message: "CrudUi.Admin/createDestination: reference at 'create.to' → 'Ui.LocalStore' does not implement 'Ui.Destination' (known implementations: Ui.Navigate, Ui.OpenPage)"
    - code: SCHEMA_VIOLATION
      message: "CrudUi.Admin/editNoDestination: /edit is missing required property 'to'"
    - code: SCHEMA_VIOLATION
      message: "CrudUi.Admin/pagingValue: /paging must be equal to one of the allowed values (pages | more | scroll)"
