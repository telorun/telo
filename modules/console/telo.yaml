kind: Telo.Library
metadata:
  name: console
  version: 0.15.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Observability]
  description: >-
    Terminal input and output: print lines with inline colour and style markup,
    prompt the user and read a line back, drain a stream to standard output chunk by
    chunk, and show a spinner while a slow stream produces its first item. Styling
    renders as ANSI on a terminal and strips to plain text when piped.
exports:
  kinds:
    - WriteLine
    - ReadLine
    - WriteStream
    - StreamWait
  resources:
    - writeLine
    - readLine
---
kind: Telo.Definition
metadata:
  name: WriteLine
  description: >-
    Prints a line of text to standard output. Inline `{style content}` markup renders
    as ANSI colour on a terminal and is stripped to plain text when the output is
    piped or captured. Takes no configuration.
capability: Telo.Invocable
# The JS controller is listed first so the Node.js kernel's default `auto`
# policy keeps resolving to it; the Rust kernel's native type is `pkg:cargo`,
# so it prefers the second entry from the same declaration.
controllers:
  - pkg:telo/local/js?path=./nodejs/writeline-controller.mjs&local_path=./nodejs/src/writeline-controller.ts
  - pkg:cargo/telorun-console?local_path=./rust#writeline_controller
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    examples:
      - output: "Hello {green world}"
    properties:
      output:
        title: Output
        description: |
          Text content written to standard output. Markup tags `{style content}`
          are rendered to ANSI on a TTY and stripped to plain text otherwise.
        type: string
    required: [output]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
---
kind: Telo.Definition
metadata:
  name: ReadLine
  description: >-
    Prompts the user and reads one line of interactive input, returning the text they
    entered. The prompt is written exactly as given, with no suffix added, and its
    `{style content}` markup renders as ANSI on a terminal. Takes no configuration.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/readline-controller.mjs&local_path=./nodejs/src/readline-controller.ts
  - pkg:cargo/telorun-console?local_path=./rust#readline_controller
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    examples:
      - prompt: "Name: "
    properties:
      prompt:
        title: Prompt
        description: |
          Prompt text written to stdout before reading input. Rendered
          character-for-character — no auto-appended `: ` suffix. Markup
          tags `{style content}` are rendered to ANSI on a TTY and stripped
          to plain text otherwise.
        type: string
    required: [prompt]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
---
# Drain a `Stream<string | Uint8Array>` to stdout. Strings use Node's native
# UTF-8 path; Uint8Array chunks pass through unchanged. No newline policy —
# producers control framing.
kind: Telo.Definition
metadata:
  name: WriteStream
  description: >-
    Drains a stream of text or byte chunks to standard output, writing each chunk as
    it arrives instead of buffering the whole value — the terminal end of a streaming
    pipeline. Bytes pass through unchanged and no newlines are added, so the producer
    controls framing.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/writestream-controller.mjs&local_path=./nodejs/src/writestream-controller.ts
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-stream: true
        description: Async iterable of strings or Uint8Array chunks to write to stdout.
    required: [input]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
---
# Animate a single-cell frame sequence on stdout while waiting for the
# first item from an input stream, then clear the cell and forward every
# item unchanged. Bytes flow through the output stream — the only resource
# that writes to stdout is the downstream sink (typically Console.WriteStream).
kind: Telo.Definition
metadata:
  name: StreamWait
  description: >-
    Shows a spinner or loading indicator while a slow stream works towards its first
    item, then clears it and forwards every item unchanged. Sits between a producer
    and a sink: the prefix, animation frames and clear sequence ride in the head of
    the forwarded stream, so the sink does the writing.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/streamwait-controller.mjs&local_path=./nodejs/src/streamwait-controller.ts
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-stream: true
        description: Async iterable to forward; the animation runs until the first item arrives.
    required: [input]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-stream: true
        description: |
          Forwarded stream. The head of the stream carries the prefix, the
          reserved-cell setup, animation frames, and a clear sequence; after
          the first input item is observed, every input item is forwarded
          verbatim.
    required: [output]
    additionalProperties: false
schema:
  type: object
  properties:
    prefix:
      title: Prefix
      description: |
        Text written once at the start, before the animation cell. Markup
        tags `{style content}` render to ANSI on a TTY and strip to plain
        text otherwise. Must not contain `\n`, `\r`, `\b`, or `\x1b`.
      type: string
      default: ""
    frames:
      title: Frames
      description: |
        Animation frames cycled at `intervalMs`. Each frame must be a
        single-character string (`length === 1`). Default: braille
        spinner cycle.
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
        maxLength: 1
      default: ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]
    intervalMs:
      title: Interval (ms)
      description: Tick period in milliseconds. Minimum 16.
      type: integer
      minimum: 16
      default: 80
  additionalProperties: false
---
# Ready-made singleton instances exported via `exports.resources`. Consumers reference
# them directly (`!ref Console.writeLine`) instead of declaring their own — `WriteLine`
# and `ReadLine` are config-free, so a single shared instance per import is all that's
# needed. Declared with `Self.<Kind>` (the library's own module alias).
kind: Self.WriteLine
metadata:
  name: writeLine
  description: >-
    Ready-made shared instance for printing lines to standard output, referenced
    directly instead of declaring one — printing takes no configuration, so a single
    shared instance is all a consumer needs.
---
kind: Self.ReadLine
metadata:
  name: readLine
  description: >-
    Ready-made shared instance for prompting and reading a line of user input,
    referenced directly instead of declaring one — prompting takes no configuration,
    so a single shared instance suffices.
