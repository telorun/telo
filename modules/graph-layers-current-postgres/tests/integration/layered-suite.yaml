kind: Telo.Application
metadata:
  name: GraphLayersCurrentPostgresSuite
  version: 1.0.0
  description: |
    The layered graph suite against a real PostgreSQL: the same sequences the
    SQLite run executes, over seven current stores sharing one set of layered
    PostgreSQL tables, so both engines are held to one behaviour.

    The tables live in their own namespace, which the connection's `search_path`
    excludes, so every statement reaches them only through the schema's
    qualified names.

    NEEDS A LIVE POSTGRES, which is why it is under `tests/integration/`.
imports:
  Suite:
    source: ../../../graph-layers/tests/__fixtures__/layered-suite
    resources:
      base: !ref base
      middle: !ref middle
      side: !ref side
      top: !ref top
      left: !ref left
      right: !ref right
      apex: !ref apex
      person: !ref person
      document: !ref document
      knows: !ref knows
      authored: !ref authored
      refreshStacks: !ref refreshStacks
  Sql: ../../../sql
  Postgres: ../../../postgres
  Layers: ../..
  Run: ../../../run
variables:
  dbHost: { env: DB_HOST, type: string, default: localhost }
  dbPort: { env: DB_PORT, type: integer, default: 5432 }
  dbUser: { env: DB_USER, type: string, default: postgres }
  dbPassword: { env: DB_PASSWORD, type: string, default: postgres }
  dbName: { env: DB_NAME, type: string, default: postgres }
targets:
  - !ref reset
  - !ref appSchema
  - !ref Suite.overlay
  - !ref Suite.writes
  - !ref Suite.relationships
  - !ref Suite.traversals
  - !ref Suite.deletions
  - !ref Suite.retractions
  - !ref Suite.diamond
  - !ref Suite.paging
  - !ref Suite.defaults
---
kind: Postgres.Connection
metadata: { name: db }
connectionString: !cel >-
  'postgres://' + variables.dbUser + ':' + variables.dbPassword + '@' +
  variables.dbHost + ':' + string(variables.dbPort) + '/' + variables.dbName +
  '?options=-c%20search_path%3Dpublic'
---
# The suite must start empty — the ledger included, which lives in the same
# namespace, or a previous run's declaration would decide what this one plans.
kind: Run.Sequence
metadata: { name: reset }
steps:
  - name: drop
    invoke:
      kind: Sql.Command
      connection: !ref db
    inputs:
      sql: DROP SCHEMA IF EXISTS graph_layers_suite CASCADE
---
kind: Layers.NodeTable
metadata: { name: people }
table: layers_suite_people
key: id
columns:
  id: { type: text, nullable: false }
  name: { type: text, nullable: false }
  age: { type: integer }
---
kind: Layers.NodeTable
metadata: { name: documents }
table: layers_suite_documents
key: id
columns:
  id: { type: text, nullable: false }
  title: { type: text }
  status: { type: text, nullable: false, default: draft }
  pages: { type: integer, default: 1 }
---
kind: Layers.RelationshipTable
metadata: { name: knowsTable }
table: layers_suite_knows
sourceColumn: source
targetColumn: target
columns:
  source: { type: text, nullable: false }
  target: { type: text, nullable: false }
  since: { type: integer }
---
kind: Layers.RelationshipTable
metadata: { name: authoredTable }
table: layers_suite_authored
sourceColumn: author
targetColumn: document
columns:
  author: { type: text, nullable: false }
  document: { type: text, nullable: false }
  role: { type: text }
  share: { type: integer, default: 100 }
---
kind: Postgres.Schema
metadata: { name: appSchema }
connection: !ref db
schema: graph_layers_suite
ledger: graph_layers_suite
tables: [!ref people, !ref documents, !ref knowsTable, !ref authoredTable]
---
kind: Layers.Node
metadata: { name: person }
table: !ref people
key: id
---
kind: Layers.Node
metadata: { name: document }
table: !ref documents
key: id
---
kind: Layers.Relationship
metadata: { name: knows }
table: !ref knowsTable
source: !ref person
target: !ref person
sourceColumn: source
targetColumn: target
---
kind: Layers.Relationship
metadata: { name: authored }
table: !ref authoredTable
source: !ref person
target: !ref document
sourceColumn: author
targetColumn: document
---
kind: Layers.Store
metadata: { name: base }
connection: !ref db
schema: !ref appSchema
layer: base
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
---
kind: Layers.Store
metadata: { name: middle }
connection: !ref db
schema: !ref appSchema
layer: middle
bases: [!ref base]
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
---
kind: Layers.Store
metadata: { name: side }
connection: !ref db
schema: !ref appSchema
layer: side
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
---
kind: Layers.Store
metadata: { name: top }
connection: !ref db
schema: !ref appSchema
layer: top
bases: [!ref middle, !ref side]
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
---
kind: Layers.Store
metadata: { name: left }
connection: !ref db
schema: !ref appSchema
layer: left
bases: [!ref base]
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
---
kind: Layers.Store
metadata: { name: right }
connection: !ref db
schema: !ref appSchema
layer: right
bases: [!ref base]
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
---
kind: Layers.Store
metadata: { name: apex }
connection: !ref db
schema: !ref appSchema
layer: apex
bases: [!ref left, !ref right]
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
---
# A current store reads its bases live, so there is nothing to bring up to date.
kind: Run.Sequence
metadata: { name: refreshStacks }
steps:
  - name: nothing
    value: !cel "true"
