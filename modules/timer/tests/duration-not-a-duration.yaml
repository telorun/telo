kind: Telo.Application
metadata:
  name: TimerDurationNotADuration
  version: 1.0.0
  description: |
    A `duration` input that is not a duration is refused by `telo check` at the
    line that writes it.
imports: { Assert: ../../assert }
targets: [!ref refusedAtCheck]
---
kind: Assert.Manifest
metadata: { name: refusedAtCheck }
source: ./__fixtures__/duration-not-a-duration.yaml
expect:
  errors:
    - { code: CONTRACT_INPUTS_MISMATCH, message: "/duration must be a Telo.Duration" }
