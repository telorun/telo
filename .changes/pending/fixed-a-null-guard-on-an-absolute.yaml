units:
  cel: Fixed
body: 'A null guard on an absolute name no longer proves a comprehension variable
  spelled the same: `v.map(x, .x.a != null ? x.a.b : "")` is now `CEL_NULLABLE_ACCESS`,
  and so is the reverse, a guard on the bound `x.a` reading `.x.a`. A guard on a
  declared name still proves its absolute spelling inside a comprehension that rebinds
  the name (`x.a != null ? [1].map(x, .x.a.b) : []` checks), and so does a host
  assumption. An `allOf` whose union meet would build more than `UNION_EXPANSION_LIMIT`
  (64) members, such as seven parts that are each a union of two shapes, no longer takes
  time and type text that double with every part: it is read as the one type joining
  every member of its parts and reported `shape-not-read` at its node.'
