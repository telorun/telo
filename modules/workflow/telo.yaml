kind: Telo.Library
metadata:
  name: Workflow
  version: 0.5.1
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Coordination]
  description: >-
    Durable workflow orchestration: a named graph of steps, each calling a resource,
    executed by a workflow engine that owns retries, state and recovery so a run
    survives crashes and restarts. The engine is configurable, and each step can carry
    engine-specific execution options.
exports:
  kinds:
    - Backend
    - Graph
---
kind: Telo.Abstract
metadata:
  name: Backend
  description: >-
    A configured connection to the engine that executes workflows and owns their
    durable state, retries and recovery. It also declares the per-step execution
    options it accepts, so a graph's options are checked against the engine actually
    running it.
capability: Telo.Provider
---
kind: Telo.Definition
metadata:
  name: Graph
  description: >-
    Runs a named graph of steps on a workflow engine, each step calling a resource and
    carrying its own engine-specific execution options such as retries and timeouts.
capability: Telo.Runnable
schema:
  type: object
  properties:
    backend:
      title: Backend
      description: Reference to the workflow backend provider.
      x-telo-ref:
        kind: Self.Backend
        use: dependency
    nodes:
      title: Nodes
      description: Workflow nodes to execute.
      type: array
      items:
        type: object
        properties:
          name:
            title: Name
            description: Unique node name.
            type: string
          invoke:
            title: Invoke
            description: Resource invoked by this node.
            x-telo-ref:
              kind: Telo.Invocable
              use: call
          options:
            title: Options
            description: Backend-specific execution options for this node.
            x-telo-schema-from: "backend/$defs/NodeOptions"
        required:
          - name
          - invoke
  required:
    - backend
    - nodes
