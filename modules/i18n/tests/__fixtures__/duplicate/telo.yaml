# One text translated twice in one list of translations.
kind: Telo.Application
metadata: { name: TranslationsDuplicate, version: 1.0.0 }
lang: en
translations:
  catalogs:
    - kind: Telo.TextTranslations
      lang: pl
      texts:
        - { text: Open, translation: Otwórz }
        - { text: Open, translation: Otwórzcie }
