# Pins `top` to the head of the layer this process is given, outside any
# draft and from its own process, and records how that went as a node of the
# `notes` layer: `pinned`, or the code it was refused with.
kind: Telo.Application
metadata:
  name: StackProcessPinner
  version: 1.0.0
include:
  - ./model.yaml
imports:
  Postgres: ../../../../../postgres
  Layers: ../../../..
  Graph: ../../../../../graph
  GraphLayers: ../../../../../graph-layers
  Run: ../../../../../run
variables:
  dbHost: { env: DB_HOST, type: string }
  dbPort: { env: DB_PORT, type: integer }
  name: { env: ACTOR_NAME, type: string }
  base: { env: BASE_LAYER, type: string }
targets:
  - !ref work
---
kind: Postgres.Connection
metadata: { name: db }
access:
  kind: Postgres.DatabaseAccess
  fields:
    url:
      scheme: postgres
      host: !cel "variables.dbHost"
      port: !cel "variables.dbPort"
      user: postgres
      password: postgres
      path: /postgres
      query: { options: "-c search_path=public" }
---
kind: Run.Sequence
metadata: { name: work }
steps:
  - name: pin
    try:
      - name: attempt
        invoke: { kind: GraphLayers.PinBase, store: !ref top }
        inputs: { bases: [{ layer: !cel "variables.base" }] }
      - name: pinned
        invoke: { kind: Graph.CreateNode, store: !ref notes, node: !ref person }
        inputs: { key: !cel "variables.name", properties: { name: pinned } }
    catch:
      - name: refused
        invoke: { kind: Graph.CreateNode, store: !ref notes, node: !ref person }
        inputs: { key: !cel "variables.name", properties: { name: !cel "error.code" } }
