apiVersion: v2
name: k8s-runner
description: Telo Kubernetes Runner — runs Telo Applications as sandboxed Pods behind the /v1 session contract.
type: application
# BOTH are the `apps/k8s-runner` unit's version, written by `telo release apply`
# (the unit's `helm` anchor). The chart deploys exactly one image built from the
# same unit, so a second number to move would only ever be a way for the two to
# disagree — and a chart-only edit releases the unit, because its digest covers
# the chart.
version: 0.25.3
appVersion: "0.25.3"
keywords:
  - telo
  - kubernetes
  - runner
home: https://telo.run
sources:
  - https://github.com/telorun/telo
