# A policy keeping an element whose content is raw text: refused by `telo check`
# at the declaration, and when the resource is created.
kind: Telo.Library
metadata:
  name: SanitizeRawTextNoscript
imports:
  Html: ../../../..
exports:
  resources: [policy]
---
kind: Html.SafeTree
metadata: { name: policy }
elements: [p, noscript]
