kind: Telo.Application
metadata:
  name: ImportRejectsNonLibraryTargetTest
  version: 1.0.0
imports:
  Assert: ../modules/assert
targets:
  - !ref testImportNonLibraryRejected
---
kind: Assert.Manifest
metadata:
  name: testImportNonLibraryRejected
source: ./__fixtures__/imports-a-non-library.yaml
expect:
  errors:
    - code: INVALID_IMPORT_TARGET
      message: "Cannot use import 'NonLibrary' → './non-library-import-target.yaml': Telo.Import target './non-library-import-target.yaml' did not resolve to a Telo.Library."
  runFails: "[INVALID_IMPORT_TARGET] Cannot use import 'NonLibrary' → './non-library-import-target.yaml': Telo.Import target './non-library-import-target.yaml' did not resolve to a Telo.Library."
