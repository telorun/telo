kind: Telo.Application
metadata: { name: PipelineWithServer, version: 1.0.0 }
imports:
  Run: ../modules/run
  Http: ../modules/http-server
  HttpClient: ../modules/http-client
  Assert: ../modules/assert
---
kind: Telo.Sequence
metadata: { name: testServerWithLifecycle }
with:
  - kind: Run.Value
    metadata: { name: greetingHandler }
    inputType:
      kind: Telo.JsonSchema
      schema: { type: object, properties: { name: { type: string } } }
    value:
      greeting: !cel "'Hello ' + inputs.name + '!'"
  - kind: Http.Api
    metadata: { name: testApi }
    routes:
      - request:
          path: /hello
          method: GET
          schema:
            query: { type: object, properties: { name: { type: string } }, required: ["name"] }
        inputs:
          name: !cel "request.query.name"
        handler: !ref greetingHandler
        returns:
          - status: 200
            content:
              application/json:
                schema: { type: object, properties: { message: { type: string } }, required: [message] }
                body:
                  message: !cel "result.greeting"
  - kind: Http.Server
    metadata: { name: testServer }
    listen: { port: 8845 }
    openapi: { info: { title: Test Server, version: 1.0.0 } }
    mounts:
      - path: /api
        mount: !ref testApi
steps:
  - name: fetchGreeting
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8845/api/hello?name=World
      method: GET

  - name: verifyResponse
    inputs:
      message: !cel "steps.fetchGreeting.result.body.message"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties: { message: { type: string, const: "Hello World!" } }
        required: [message]
