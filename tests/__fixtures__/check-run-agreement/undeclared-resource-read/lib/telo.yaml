# Reads a resource it does not declare in a startup field no CEL context covers.
# This library's own `telo check` reports `CEL_UNKNOWN_FIELD`, and the kernel
# fails creating the server, where the expression finds no such key.
kind: Telo.Library
metadata:
  name: UndeclaredResourceReadLib
  version: 1.0.0
  description: Fixture library reading a resource it never declares at startup.
imports:
  Http: ../../../../../modules/http-server
---
kind: Http.Server
metadata:
  name: server
listen:
  port: !cel "resources.listenPort"
mounts: []
