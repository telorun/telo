  # Forms.
  - { text: Every control from the model, translation: "मॉडल से हर कंट्रोल" }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "कोई फ़ील्ड न लिखे होने पर फ़ॉर्म हर प्रॉपर्टी के लिए एक कंट्रोल बनाता है, जो उसकी स्कीमा से चुना जाता है: टेक्स्ट बॉक्स, एन्यूमरेशन के लिए सूची, संख्या बॉक्स, तारीख, तारीख और समय, समय, दस्तावेज़ के लिए बहु-पंक्ति बॉक्स, चेकबॉक्स, एन्यूमरेशन की सूची के लिए अगल-बगल विकल्प, और शब्दों की सूची के लिए टाइप किए गए टैग। विवरण अपने फ़ील्ड के नीचे संकेत होता है, और डिफ़ॉल्ट शुरुआती मान।" }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "हर फ़ील्ड को छुए जाने के बाद मॉडल से जाँचा जाता है: शीर्षक की लंबाई, लोगों की संख्या, 50 के चरणों में बजट, कीवर्ड की वर्तनी। सर्वर वह शीर्षक अस्वीकार करता है जो किसी दूसरे अनुरोध का है, और उसका उत्तर शीर्षक पर दिखता है। जो टाइप किया गया है वह पते और इस ब्राउज़र में रखा जाता है — प्रवेश कोड को छोड़कर, जिसे मॉडल केवल-लेखन चिह्नित करता है।" }
  - { text: Each control chosen by hand, translation: "हाथ से चुना गया हर कंट्रोल" }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "वही अनुरोध, हर फ़ील्ड के लिए लिखे कंट्रोल के साथ: शीर्षक अपने व्युत्पन्न कंट्रोल पर छोड़ा गया, प्रकार अगल-बगल विकल्पों के रूप में, चैनल कई चुनने वाली सूची के रूप में, लोगों की संख्या स्लाइडर पर, अत्यावश्यक स्विच के रूप में और कीवर्ड टैग के रूप में। जो टाइप किया गया है वह केवल इस टैब के लिए रखा जाता है।" }
  - { text: Requests received, translation: "प्राप्त अनुरोध" }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "दोनों फ़ॉर्म द्वारा भेजे गए नवीनतम अनुरोध, हर बार सहेजने के बाद फिर से पढ़े जाते हैं।" }
  - { text: "Choices, pickers and dates", translation: "विकल्प, पिकर और तारीखें" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "किसी प्रोजेक्ट पर लोगों की बुकिंग। प्रोजेक्ट, प्रोजेक्ट कलेक्शन से पढ़ी गई सूची से चुना जाता है, हर विकल्प के साथ संकेत के रूप में उसका कोड। लीड को एक डायलॉग में, नाम से खोजकर, ऊपर चुनी गई भूमिका के सक्रिय सदस्यों में से चुना जाता है; दूसरी भूमिका चुनने पर विकल्प फिर से पढ़े जाते हैं और लीड तभी बना रहता है जब वह अब भी उपयुक्त हो। समीक्षक एक ड्रॉअर में, एक साथ कई, चुने जाते हैं, और प्रायोजक एक पॉपओवर में; प्रायोजक एक डिफ़ॉल्ट ई-मेल से शुरू होता है, जो एक लुकअप से व्यक्ति के नाम के रूप में दिखता है। सहायक अगल-बगल, एक बार में तीन, दिखाए जाते हैं, और बाकी के लिए ‘और’ है। चुना गया व्यक्ति अपने ई-मेल से लिंक होता है।" }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "अवधि प्रीसेट वाली दो तारीखों से बनती है: इसके सप्ताह रविवार से शुरू होते हैं, यह अगले महीने से शुरू होती है और तीन महीने से अधिक होने पर चेतावनी देती है। सर्वर ऐसी अवधि अस्वीकार करता है जो शुरू होने से पहले खत्म हो या एक साल से अधिक चले, और उसका उत्तर अवधि पर दिखता है। लीड के आसपास के लोग लीड चुने जाने के बाद दिखाए जाते हैं, और साइट का पता केवल साइट पर होने वाले काम के लिए।" }
  - { text: The project, translation: "प्रोजेक्ट" }
  - { text: "Which project, and who leads the work.", translation: "कौन-सा प्रोजेक्ट, और काम का नेतृत्व कौन करता है।" }
  - { text: Around the lead, translation: "लीड के आसपास" }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "काम की समीक्षा कौन करता है, उसे प्रायोजित कौन करता है और मदद कौन करता है।" }
  - { text: When and where, translation: "कब और कहाँ" }
  - { text: Tomorrow, translation: "कल" }
  - { text: Next week, translation: "अगला सप्ताह" }
  - { text: This month, translation: "यह महीना" }
  - { text: Next month, translation: "अगला महीना" }
  - { text: Next quarter, translation: "अगली तिमाही" }
  - { text: Next year, translation: "अगला साल" }
  - { text: Bookings, translation: "बुकिंग" }
  - { text: "The latest bookings, read again after every save.", translation: "नवीनतम बुकिंग, हर बार सहेजने के बाद फिर से पढ़ी जाती हैं।" }

  # The labels of the actions page's models.
  - { text: Only these labels, translation: "केवल ये लेबल" }
  - { text: Count blocked tasks, translation: "अवरुद्ध कार्य गिनें" }
  - { text: Hours a week, translation: "प्रति सप्ताह घंटे" }
  - { text: Done by, translation: "पूरा होने की तारीख" }
  - { text: No label, translation: "कोई लेबल नहीं" }
  - { text: Tasks, translation: "कार्य" }
  - { text: Hours, translation: "घंटे" }
  - { text: Days, translation: "दिन" }
  - { text: Task number, translation: "कार्य संख्या" }
  - { text: "Assignee's e-mail", translation: "असाइनी का ई-मेल" }
  - { text: Comment, translation: "टिप्पणी" }
  - { text: Comment number, translation: "टिप्पणी संख्या" }
  - { text: Pinned, translation: "पिन किया गया" }
  - { text: Written, translation: "लिखा गया" }
  - { text: New text, translation: "नया टेक्स्ट" }

  # Actions.
  - { text: A bare button, translation: "केवल बटन" }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "बिना प्रॉपर्टी वाला इनपुट मॉडल केवल बटन बनाता है। यह TEL-42 के हर अवरुद्ध कार्य को अनब्लॉक करता है, और कार्यों की गिनती और आगे नीचे की TEL-42 तालिका फिर से पढ़ी जाती हैं।" }
  - { text: Unblock TEL-42, translation: "TEL-42 अनब्लॉक करें" }
  - { text: An answer drawn from the result, translation: "परिणाम से बनाया गया उत्तर" }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "रूट किसी प्रोजेक्ट के खुले कार्यों के अनुमान जोड़ता है। इसके फ़ील्ड इनपुट मॉडल के हैं, दो सेक्शन में: प्रोजेक्ट, जो प्रोजेक्ट कलेक्शन से चुना जाता है, और गति, स्लाइडर पर; जो दर्ज किया गया है वह पते में रखा जाता है। उत्तर बटन के नीचे बनाया जाता है: परिणाम और भेजे गए रिकॉर्ड पर आधारित वाक्य, वह तारीख जब तक काम पूरा होगा, और लेबल के अनुसार घंटों की सूची।" }
  - { text: What to count, translation: "क्या गिनें" }
  - { text: How fast, translation: "कितनी तेज़ी से" }
  - { text: Estimate, context: verb, translation: "अनुमान लगाएँ" }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} में कोई खुला काम नहीं है।"
        one: "{$project} के {$tasks} खुले कार्य में {$hours} घंटे"
        other: "{$project} के {$tasks} खुले कार्यों में {$hours} घंटे"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation:
      plural: weeks
      cases:
        one: "प्रति सप्ताह {$pace} घंटे की दर से लगभग {$weeks} सप्ताह, पूरा होने की तारीख"
        other: "प्रति सप्ताह {$pace} घंटे की दर से लगभग {$weeks} सप्ताह, पूरा होने की तारीख"
  - { text: By label, translation: "लेबल के अनुसार" }
  - { text: When it fails, translation: "जब यह विफल हो" }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "कार्रवाई का अपना विफलता ट्री, जो त्रुटि और भेजे गए रिकॉर्ड पर बनाया जाता है। कार्य 4 को james@northwind.example को दें और यह सफल होता है। ई-मेल छोड़ दें, या टीम से बाहर किसी का नाम दें, और अस्वीकृति फ़ील्ड पर दिखती है; कार्य 999 का उत्तर 404 है, और tomas@northwind.example का, जो टीम छोड़ चुके हैं, 409।" }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "यह कार्रवाई अनुमान रूट के उत्तर को दिनों की संख्या के रूप में पढ़ती है, जो रूट नहीं देता: कार्रवाई का आउटपुट मॉडल उत्तर अस्वीकार करता है, और उसका विफलता ट्री यही बताता है।" }
  - { text: Estimate in days, translation: "दिनों में अनुमान लगाएँ" }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: यह वह उत्तर नहीं है जिसे यह बटन पढ़ता है।" }
  - { text: Where a success goes, translation: "सफलता कहाँ ले जाती है" }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "पहली कार्रवाई किसी प्रोजेक्ट के कार्यों की सूची वाले पेज से उत्तर देती है, और ऐप्लिकेशन वहाँ चला जाता है। दूसरी टीम के होमपेज से उत्तर देती है, एक https पता जो पेज की जगह ले लेता है।" }
  - { text: Open its tasks, translation: "इसके कार्य खोलें" }
  - { text: Visit the homepage, translation: "होमपेज देखें" }
  - { text: Reading again after a success, translation: "सफलता के बाद फिर से पढ़ना" }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "कार्य को स्थानांतरित करने पर नीचे की गिनतियाँ, जो एक रीडर हैं, और आगे नीचे की TEL-42 तालिका, दोनों फिर से पढ़ी जाती हैं। उत्तर कार्य और उसकी नई स्थिति बताता है।" }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: करना है {$todo}, प्रगति में {$doing}, समीक्षा में {$review}, पूरे हुए {$done}, अवरुद्ध {$blocked}।" }
  - { text: Move, translation: "स्थानांतरित करें" }
  - { text: "Task {$id}, {$title}, is now", translation: "कार्य {$id}, {$title}, अब इस स्थिति में है:" }
  - { text: One press after another, translation: "एक के बाद एक क्लिक" }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "टिप्पणियाँ एक के बाद एक भेजी जाती हैं, उसी क्रम में जिसमें बटन दबाया गया, चाहे कितनी भी तेज़ी से। बटन तीन वर्णों का इंतज़ार करता है और कारण बताता है; दूसरा कार्य चुनने पर पिछला उत्तर साफ़ हो जाता है। नीचे सूचीबद्ध टिप्पणियाँ हर टिप्पणी के बाद फिर से पढ़ी जाती हैं।" }
  - { text: Add the comment, translation: "टिप्पणी जोड़ें" }
  - { text: Write three characters or more., translation: "तीन या अधिक वर्ण लिखें।" }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        one: "टिप्पणी {$id} {$title} में जोड़ी गई, जिसमें अब {$count} टिप्पणी है।"
        other: "टिप्पणी {$id} {$title} में जोड़ी गई, जिसमें अब {$count} टिप्पणियाँ हैं।"
  - { text: Row actions on a table, translation: "तालिका पर पंक्ति कार्रवाइयाँ" }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "TEL-42 का हर कार्य तीन बटन देता है, और हर बटन दबाने के बाद अपने उत्तर से बदल जाता है। ‘शुरू करें’ तुरंत चलता है, केवल उस कार्य पर जो अभी करना है। ‘बंद करें’ पहले पूछता है, और पूरे हुए कार्य पर नहीं मिलता। ‘असाइन करें’ ई-मेल के लिए डायलॉग खोलता है, जो पंक्ति में नहीं है, और सर्वर की अस्वीकृति उसके फ़ील्ड पर दिखाता है।" }
  - { text: Number, translation: "संख्या" }
  - { text: Start, context: verb, translation: "शुरू करें" }
  - { text: Closed, translation: "बंद किया गया" }
  - { text: Close this task?, translation: "यह कार्य बंद करें?" }
  - { text: Already started., translation: "पहले ही शुरू हो चुका है।" }
  - { text: Already finished., translation: "पहले ही पूरा हो चुका है।" }
  - { text: Assign, translation: "असाइन करें" }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} {$assignee} को असाइन किया गया।" }
  - { text: "Task {$id} is unchanged.", translation: "कार्य {$id} में कोई बदलाव नहीं हुआ।" }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: "सूची पर पंक्ति कार्रवाइयाँ" }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "नवीनतम टिप्पणियाँ, एक रीडर द्वारा बनाई गई सूची, जिसमें पिन की गई टिप्पणियाँ पहले हैं। ‘पिन करें’ उस टिप्पणी पर तुरंत चलता है जो अभी पिन नहीं है, ‘हटाएँ’ पहले पूछता है, और ‘संपादित करें’ डायलॉग में नया टेक्स्ट माँगता है; उसे खाली छोड़ना उसके फ़ील्ड पर अस्वीकार किया जाता है। हर कार्रवाई के बाद सूची फिर से पढ़ी जाती है।" }
  - { text: Latest comments, translation: "नवीनतम टिप्पणियाँ" }
  - { text: Pin, translation: "पिन करें" }
  - { text: Already pinned., translation: "पहले ही पिन है।" }
  - { text: Delete this comment?, translation: "यह टिप्पणी हटाएँ?" }
  - { text: Rewrite this comment?, translation: "यह टिप्पणी दोबारा लिखें?" }
  - { text: More places a success goes, translation: "सफलता के बाद जाने की और जगहें" }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "पहली कार्रवाई एक कार्य जोड़ती है और तालिकाओं वाले पेज पर ले जाती है, जो मेनिफ़ेस्ट में लिखा पता है। दूसरी हैंडबुक के पते से उत्तर देती है, जो माउंट के अंतर्गत सर्वर द्वारा सर्व की गई फ़ाइल है और सामान्य रूप से लोड होती है। तीसरी टीम के मिरर से उत्तर देती है, ऐसा पता जिसे ब्राउज़र दूसरा होस्ट मानता है: यह कहीं नहीं ले जाती, और उत्तर यही बताता है।" }
  - { text: Add it and open the tables, translation: "जोड़ें और तालिकाएँ खोलें" }
  - { text: Open the handbook, translation: "हैंडबुक खोलें" }
  - { text: Open the mirror, translation: "मिरर खोलें" }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "उत्तर {$mirror} था, जो जाने लायक पता नहीं है, इसलिए पेज वहीं रहता है।" }
  - { text: "Refused, and unanswered", translation: "अस्वीकृत, और अनुत्तरित" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "प्रोजेक्ट को केवल मैनेजर ही रोक सकता है। बिना सेशन के गार्ड 401 उत्तर देता है। डेटा पेज पर james@northwind.example के रूप में साइन इन होने पर, जो मैनेजर नहीं हैं, रूट बिना बॉडी के 403 उत्तर देता है; ada@northwind.example के रूप में साइन इन होने पर यह प्रोजेक्ट रोक देता है, और जो प्रोजेक्ट चल नहीं रहा उसे पेज की भाषा में अस्वीकार करता है। कार्रवाई का डिफ़ॉल्ट विफलता ट्री हर अस्वीकृति बनाता है।" }
  - { text: Pause the project, translation: "प्रोजेक्ट रोकें" }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "{$code} चल नहीं रहा है, इसलिए उसे रोका नहीं जा सकता।" }
  - { text: "{$name} is paused.", translation: "{$name} रोक दिया गया है।" }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "यह रूट हर अनुरोध को वापस अपने पास भेजता है, इसलिए ब्राउज़र हार मान लेता है और कोई उत्तर आता ही नहीं। विफलता ट्री यही बताता है: त्रुटि में कोई स्टेटस नहीं है।" }
  - { text: Call a route that never answers, translation: "ऐसा रूट कॉल करें जो कभी उत्तर नहीं देता" }
  - { text: "The route answered, with the status", translation: "रूट ने उत्तर दिया, इस स्टेटस के साथ" }
  - { text: "No answer arrived, so there is no status.", translation: "कोई उत्तर नहीं आया, इसलिए कोई स्टेटस नहीं है।" }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: "पता पढ़ने वाली पंक्ति कार्रवाइयाँ" }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "तालिका उस प्रोजेक्ट के कार्य सूचीबद्ध करती है जिसे पता बताता है, और ‘स्थानांतरित करें’ कार्य को उस स्थिति में ले जाता है जिसे पता बताता है, जो दबाने के समय तालिका की क्वेरी से पढ़ी जाती है। पंक्ति और पता स्थानांतरण के हर फ़ील्ड को तय करते हैं, इसलिए इसका डायलॉग कुछ नहीं पूछता और केवल एक पुष्टि है। एक प्रोजेक्ट और एक स्थिति चुनें:" }
  - { text: TEL-42 into review, translation: "TEL-42 समीक्षा में" }
  - { text: APP-5 to finished, translation: "APP-5 पूरा हुआ में" }
  - { text: OPS-7 back to in progress, translation: "OPS-7 वापस प्रगति में" }
  - { text: Neither, translation: "कोई नहीं" }
  - { text: Moved to, translation: "इसमें स्थानांतरित" }
  - { text: Move this task to the status the address names?, translation: "यह कार्य पते में बताई गई स्थिति में स्थानांतरित करें?" }
  - { text: Choose a status above first., translation: "पहले ऊपर एक स्थिति चुनें।" }

  # Components.
  - { text: A component on the page, translation: "पेज पर एक कॉम्पोनेंट" }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "TSX में लिखा और इस उदाहरण की एक लाइब्रेरी द्वारा दिया गया कॉम्पोनेंट, निश्चित प्रॉपर्टी के साथ रखा गया। यह होस्ट द्वारा दी गई हर चीज़ का उपयोग करता है: यह दिखाता है कि पेज कहाँ है, कौन-सा पैनल खुला है यह पते में रखता है, navigate से और href वाले लिंक से दूसरे पेज पर जाता है, और https पता इसके लिए अस्वीकार किया जाता है। यह fetch से TEL-42 की स्थिति पढ़ता है और एक कार्य जोड़ता है, notifyChanged से बताता है कि कार्य बदल गए — ताकि नीचे की तालिका फिर से पढ़ी जाए — और onChanged से सुने गए हर बदलाव को गिनता है, जिसमें तालिका के अपने संपादन और हटाना भी शामिल हैं। इसके जोड़े गए कार्य की घोषणा पेज के कोने में उसकी अपनी परत में होती है।" }
  - { text: A component in a cell, translation: "सेल में एक कॉम्पोनेंट" }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "प्राथमिकता कॉलम एक कॉम्पोनेंट बनाता है, जिसे हर पंक्ति की प्राथमिकता और यह जानकारी मिलती है कि कार्य अवरुद्ध है या नहीं। तालिका TEL-42 के कार्य उसी कलेक्शन से सूचीबद्ध करती है जिसमें कॉम्पोनेंट लिखता है, इसलिए ऊपर कार्य जुड़ने पर यह फिर से पढ़ी जाती है; इसके संपादन और हटाने को कॉम्पोनेंट सुनता है।" }
  - { text: Its stylesheet, translation: "इसकी स्टाइलशीट" }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "कॉम्पोनेंट के स्रोत अपनी स्टाइलशीट इम्पोर्ट करते हैं, जिसे ऐप्लिकेशन telo.component परत में रखता है: थीम और ब्रांड के बाद, ऐप्लिकेशन की अपनी स्टाइलशीट से पहले। इसका हर मान एक डिज़ाइन टोकन पढ़ता है, इसलिए डेस्क और मीटर हर माउंट का रूप ले लेते हैं।" }

  # CRUD.
  - { text: A generated admin screen, translation: "जनरेट की गई एडमिन स्क्रीन" }
  - { text: "One declaration over the tasks collection the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the collection, so the screen offers exactly what the API accepts.", translation: "कार्य मॉडल पर एक घोषणा, जिससे API सर्व होता है: एक फ़िल्टर बार, सॉर्ट होने वाली और पेजों में बँटी तालिका, कार्य जोड़ने का एक फ़ॉर्म और उसे बदलने का एक फ़ॉर्म, और हर पंक्ति पर पुष्टि के साथ हटाना। कॉलम, फ़ील्ड और फ़िल्टर सभी मॉडल से निकाले जाते हैं, इसलिए स्क्रीन ठीक वही देती है जो API स्वीकार करता है।" }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "बार अंतिम किनारे पर तालिका के बगल में रहता है और केवल आपके चुने फ़िल्टर दिखाता है, हर एक ऐसी चिप के रूप में जो उसका कंट्रोल खोलती है। यह अपना चुनाव इस ब्राउज़र में aside कुंजी के तहत रखता है — फ़िल्टर पेज पर तालिका के बगल वाले बार की कुंजी, इसलिए किसी भी पेज पर चुना गया फ़िल्टर दोनों पर चुना रहता है।" }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "नया कार्य अंतिम किनारे से आने वाले ड्रॉअर में खुलता है और अगले कार्य के लिए खाली होकर खुला रहता है। कार्य सूची के बगल वाले पैनल में बदला जाता है, जो पते का हिस्सा है, और बिना सहेजे इनपुट के साथ उसे छोड़ने पर पहले पूछा जाता है।" }

  # Related records.
  - { text: "Related records", translation: "संबंधित रिकॉर्ड" }
  - { text: "Posts and their authors", translation: "पोस्ट और उनके लेखक" }
  - { text: "Each post names its author by key. The author column shows the author's name instead, read in one request for every author on the page, and the bar's author filter offers every author by name. The create and edit forms pick the author from a list of authors, searched by name.", translation: "हर पोस्ट अपने लेखक को उसकी कुंजी से बताती है। लेखक स्तंभ इसके बजाय लेखक का नाम दिखाता है, जो पेज के सभी लेखकों के लिए एक ही अनुरोध में पढ़ा जाता है, और बार का लेखक फ़िल्टर हर लेखक को नाम से पेश करता है। बनाने और बदलने के फ़ॉर्म लेखक को लेखकों की एक सूची से चुनते हैं, जिसे नाम से खोजा जाता है।" }
  - { text: "Only the authors with posts", translation: "केवल पोस्ट वाले लेखक" }
  - { text: "These filters offer only the authors and the statuses present among the posts the other filters leave, each with how many posts it has. The posts are drawn as cards, and as a list below the breakpoint, loading more as you reach the end.", translation: "ये फ़िल्टर केवल वे लेखक और स्थितियाँ पेश करते हैं जो बाकी फ़िल्टरों के बाद बची पोस्टों में मौजूद हैं, हर एक के साथ उसकी पोस्टों की संख्या। पोस्ट कार्ड के रूप में बनती हैं, और ब्रेकपॉइंट से नीचे एक सूची के रूप में, जो अंत तक पहुँचने पर और लोड करती है।" }
  - { text: "On a board by status", translation: "स्थिति के अनुसार एक बोर्ड पर" }
  - { text: "One column per status, each read and counted on its own. Drag a card to another column, or move it from its menu, to change its status; every list of posts on the page reads again.", translation: "हर स्थिति के लिए एक स्तंभ, हर एक अलग से पढ़ा और गिना जाता है। स्थिति बदलने के लिए किसी कार्ड को दूसरे स्तंभ में खींचें, या उसके मेनू से ले जाएँ; पेज की पोस्टों की हर सूची फिर से पढ़ी जाती है।" }
  - { text: "On a calendar", translation: "एक कैलेंडर पर" }
  - { text: "The posts on the day each is published, a month at a time; the month shown reads every post dated in it. A post with no date is not on the calendar.", translation: "पोस्ट उस दिन पर जिस दिन हर एक प्रकाशित होती है, एक बार में एक महीना; दिखाया गया महीना उसमें तारीख वाली हर पोस्ट पढ़ता है। बिना तारीख की पोस्ट कैलेंडर पर नहीं होती।" }
  - { text: "The authors", translation: "लेखक" }
  - { text: "The authors' own screen, generated from their collection. It reads the same address the posts' author filter and picker read, so an author added here is offered there at once.", translation: "लेखकों की अपनी स्क्रीन, उनके संग्रह से बनी। यह वही पता पढ़ती है जो पोस्टों का लेखक फ़िल्टर और चयनकर्ता पढ़ते हैं, इसलिए यहाँ जोड़ा गया लेखक वहाँ तुरंत पेश होता है।" }
  - { text: "Reporting lines as a tree", translation: "रिपोर्टिंग रेखाएँ एक पेड़ के रूप में" }
  - { text: "Each person names who they report to, a relation of the people to themselves. The tree reads the people who report to nobody first, and a person's reports when they are opened. The form picks the manager from the same people.", translation: "हर व्यक्ति बताता है कि वह किसे रिपोर्ट करता है, लोगों का खुद से संबंध। पेड़ पहले उन लोगों को पढ़ता है जो किसी को रिपोर्ट नहीं करते, और किसी व्यक्ति को खोलने पर उसके अधीनस्थों को। फ़ॉर्म प्रबंधक को उन्हीं लोगों में से चुनता है।" }
  # The labels of the related-records page's models.
  - { text: "Author", translation: "लेखक" }
  - { text: "Draft", translation: "मसौदा" }
  - { text: "Published", translation: "प्रकाशित" }
  - { text: "Published on", translation: "प्रकाशन तिथि" }
  - { text: "Reports to", translation: "किसे रिपोर्ट करता है" }
  - { text: "Post", translation: "पोस्ट" }

  # Themes.
  - { text: Four mounts of one design, translation: "एक डिज़ाइन के चार माउंट" }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "वही पेज चार बार सर्व किए जाते हैं, और हर ऐप्लिकेशन अपनी थीम, ब्रांड और नेविगेशन बताता है। पेज व्यू का एक ही सेट हैं, जिन्हें चारों संदर्भ से रखते हैं, इसलिए केवल रूप और नेविगेशन अलग होते हैं।" }
  - { text: At the root, translation: "रूट पर" }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "बिल्ट-इन रूप, उसके ऊपर इस उदाहरण की अपनी स्टाइलशीट, और हर अनुरोध के लिए चुना गया ब्रांड: जब कोई कुकी माँगे तब Acme टोकन सेट, अन्यथा थीम के अपने मान।" }
  - { text: Under /radix, translation: "/radix के अंतर्गत" }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Radix थीम: उसकी स्टाइलशीट और उसके तेरह कंट्रोल — चयन सूचियाँ, डायलॉग, ड्रॉअर, पॉपओवर, मेनू और टूलटिप — और ब्रांड थीम पर छोड़ा गया।" }
  - { text: Under /brand, translation: "/brand के अंतर्गत" }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "इस उदाहरण की अपनी थीम: यहाँ लिखी स्टाइलशीट के नीचे Radix के कंट्रोल, अपने टोकन मानों के साथ। ऐप्लिकेशन का ब्रांड एक टोकन सेट है, जो थीम द्वारा बताया गया Inter टाइपफ़ेस देता है।" }
  - { text: Under /sidebar, translation: "/sidebar के अंतर्गत" }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "बिल्ट-इन रूप, जिसमें नेविगेशन पेज के बगल में एक साइडबार में है, जो पतली पट्टी में सिमट जाता है और अपने खुले समूह याद रखता है। फ़ोन पर यह नीचे के किनारे पर टैब बार बन जाता है।" }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "लिंक उस माउंट के अंतर्गत हल होता है जिसमें वह बनाया गया है, इसलिए माउंट के बीच के लिंक और ब्रांड स्विच रूट ऐप्लिकेशन के थीम पेज पर हैं।" }
  - { text: Every design token, translation: "हर डिज़ाइन टोकन" }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "बंद सेट का हर टोकन, जैसा इस पेज की थीम और ब्रांड उसे देते हैं, उस कस्टम प्रॉपर्टी से पढ़ा गया जिसमें रेंडरर उसे प्रोजेक्ट करता है, और उसमें बना एक नमूना। कोई दूसरा माउंट खोलें, या रूट पर ब्रांड बदलें, और मान बदल जाते हैं।" }
  - { text: Typefaces, translation: "टाइपफ़ेस" }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "बॉडी और शीर्षक टाइपफ़ेस अपने चारों रूपों में, और हर रूप के लिए यह कि क्या यह ऐप्लिकेशन उसे सर्व करता है। /brand के अंतर्गत ये Inter के रेगुलर, बोल्ड, इटैलिक और बोल्ड इटैलिक रूप हैं, जो उदाहरण के साथ आते हैं और पेज के साथ सर्व होते हैं; बाकी दो माउंट कोई सर्व नहीं करते और देखने वाले के अपने फ़ॉन्ट से बनाते हैं।" }
  - { text: Switch the mount or the brand, translation: "माउंट या ब्रांड बदलें" }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "ये लिंक इस ऐप्लिकेशन के अपने हैं: लिंक उस माउंट के अंतर्गत हल होता है जिसमें वह बनाया गया है, इसलिए केवल रूट पर स्थित ऐप्लिकेशन ही बाकी दो तक पहुँचता है। हर लिंक किसी दूसरे ऐप्लिकेशन को सामान्य रूप से लोड करता है।" }
  - { text: Open the Radix mount, translation: "Radix माउंट खोलें" }
  - { text: Open the brand mount, translation: "ब्रांड माउंट खोलें" }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "इस ऐप्लिकेशन का ब्रांड हर अनुरोध के लिए चुना जाता है। स्विच एक कुकी सेट करता है या हटाता है और यहीं लौट आता है, और जब तक कुकी मौजूद है, थीम के अपने मानों की जगह Acme टोकन सेट उपयोग होता है।" }
  - { text: Use the Acme brand, translation: "Acme ब्रांड उपयोग करें" }
  - { text: "Use the theme's own values", translation: "थीम के अपने मान उपयोग करें" }

