kind: Telo.Application
metadata:
  name: AiImageConsole
  categories: [ AI ]
  version: 1.0.0
  description: |
    Prompts for a phrase on the console, generates a picture for it with OpenAI,
    and saves the bytes to ./image.png next to wherever you ran it.

    Ai.Image hands back raw bytes on `images[].data`, so they go straight into
    Fs.FileWrite — no base64 hop and no JS.Script in between. A refusal is a
    result, not an error: the model returns `finishReason: content-filter` with
    an empty `images` array, so the save is gated on there being an image and
    the run reports the refusal instead of failing.

    Run with the OpenAI key in a sibling `.env.local` file:
        OPENAI_API_KEY=sk-...
    The CLI loads `.env.local` from the manifest's directory automatically.

    The modules of this workspace are imported by relative path; a release tag
    pins them to `oci://` refs.
imports:
  Ai: oci://ghcr.io/telorun/ai@0.36.0#sha256-leXbczQNRjfmhvdhWBvMa6w3cPk36izqBJSDN_2zQqU
  OpenAI: oci://ghcr.io/telorun/openai@0.22.0#sha256-rVz1c0B43uzk466plwxYsEG3LH4QJqrZFDIqF8suOmA
  Http: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  Fs: oci://ghcr.io/telorun/fs@0.16.0#sha256-P24XqQm6tVmqb4ixO6ulAEeOUfAlmtiuiLBqrUo_g48
  Console: oci://ghcr.io/telorun/console@0.19.4#sha256-MvM9cXMpqGm7PEORPdqrs-fUoD0jmrudthsmfXY3ATk
secrets: { openaiApiKey: { env: OPENAI_API_KEY, type: string } }
targets:
  - name: ask
    invoke: !ref Console.readLine
    inputs: { prompt: "{cyan.bold describe an image} › " }

  - name: generate
    invoke: !ref draw
    inputs:
      prompt: !cel "steps.ask.result.value"

  - name: save
    when: !cel "size(steps.generate.result.images) > 0"
    invoke: !ref saveImage
    inputs:
      path: ./image.png
      content: !cel "steps.generate.result.images[0].data"

  - name: report
    when: !cel "size(steps.generate.result.images) > 0"
    invoke: !ref Console.writeLine
    inputs:
      output: !cel "'{green ✔} wrote ' + string(steps.save.result.bytesWritten) + ' bytes to ./image.png'"

  # An empty `images` array with finishReason `content-filter` is the model
  # declining the prompt — a normal outcome to report, not a failure to raise.
  - name: refused
    when: !cel "size(steps.generate.result.images) == 0"
    invoke: !ref Console.writeLine
    inputs:
      output: !cel "'{red ✖} no image produced (' + steps.generate.result.finishReason + ')'"
---
# The account: the key lives on the client's credential, and every OpenAI kind
# in the app shares it through one request.
kind: Http.BearerToken
metadata: { name: openaiKey }
token: !cel "secrets.openaiApiKey"
---
kind: Http.Client
metadata: { name: openaiClient }
baseUrl: https://api.openai.com/v1
timeout: 120000
credential: !ref openaiKey
---
kind: Http.Request
metadata: { name: openaiRequest }
client: !ref openaiClient
---
kind: OpenAI.ImageModel
metadata: { name: painter }
model: gpt-image-1
request: !ref openaiRequest
options: { size: 1024x1024, quality: low }
---
kind: Ai.Image
metadata: { name: draw }
model: !ref painter
---
# No `cwd`, so the path resolves against the process working directory —
# ./image.png is where you ran the app from.
kind: Fs.FileWrite
metadata: { name: saveImage }
