# Tests that need infrastructure the root suite deliberately does not have.
#
# `test-suite.yaml` must run on a clean checkout with nothing installed — that is
# what makes a red module suite mean "the code is wrong" rather than "something
# was not up". These tests need something outside the checkout, so they are
# discovered from a directory the root suite's `**/tests/*.yaml` glob does not
# reach (its own subdirectory) and are run by their own command.
#
# Two kinds live here. **A live PostgreSQL**: connection details come from the
# environment, with defaults for a plain local server: DB_HOST, DB_PORT, DB_USER,
# DB_PASSWORD, DB_NAME. The repo's docker-compose `db` service publishes on
# `${DB_PORT:-5432}`, so a checkout whose 5432 is taken sets DB_PORT once in
# `.env.local` and both compose and these tests follow it.
#
# **A live vendor API**: the `openai-live-*` tests. They skip silently with no
# OPENAI_API_KEY, so they satisfied the clean-checkout rule literally while in
# the root suite — but with a key present a vendor 500 turned that suite red for
# a reason that is not the code, which is the same confusion the split exists to
# remove. The CI job running this suite already carries the key.
kind: Telo.Application
metadata:
  name: IntegrationTestSuite
  version: 1.0.0
imports:
  Test: ./modules/test
targets:
  - !ref runAll
---
kind: Test.Suite
metadata:
  name: runAll
include:
  - "**/tests/integration/*.yaml"
exclude:
  - "**/__fixtures__/**"
  - "apps/**"
