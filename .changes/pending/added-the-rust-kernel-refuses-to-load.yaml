units:
  kernel: Added
body: "The Rust kernel refuses to load a manifest whose module, or a library it imports,
  declares a requires: or restrictions: range this telo is outside of, or whose own
  module declares a malformed one, as the Node kernel does: one
  ERR_MANIFEST_VALIDATION_FAILED carrying the same findings. A module whose telo bound
  is met but which states a host.node bound, which this kernel has no Node.js version to
  judge, loads with the bound unjudged unless it holds errors that apply only where the
  bound is met; that load is refused as ERR_UNSUPPORTED_MANIFEST_FEATURE naming the
  bound."
