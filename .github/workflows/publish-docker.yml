name: Publish Docker Images

# Three triggers:
#  * push:main        → dev images. The kernel image publishes sha-tagged
#                       slim variants only (amd64-only). Application artifacts
#                       (docker-runner) are not npm-gated, so they publish both
#                       `:latest` and `:sha-<short>` on every push.
#                       authoring-agent publishes an immutable `:<version>-slim`
#                       per agent release (release-owned metadata.version) plus
#                       a mutable `:latest-slim`. No sha tags; the embedded telo
#                       runtime is the newest published CLI at build time.
#                       A push ALSO builds the release tag set when the workspace
#                       CLI version is live on npm and has no image yet — see
#                       `Determine build context` below.
#  * workflow_call    → release images (semver-tagged, all variants, multi-arch).
#                       Caller passes `published-packages` (the
#                       changesets/action `publishedPackages` JSON output) so
#                       per-image jobs can gate on the package they ship.
#  * workflow_dispatch → build the release tag set for an already-published CLI
#                       version by hand. The recovery path: when the release run
#                       failed after npm publish, there was previously NO way to
#                       ship the images for a live version short of another
#                       release.

on:
  push:
    branches: [main]
    paths:
      - "apps/docker-runner/**"
      - "apps/k8s-runner/**"
      - "packages/runner-core/**"
      - "apps/hub/**"
      - "apps/authoring-agent/**"
      - "modules/**"
      - "cli/**"
      - "kernel/**"
      - "sdk/**"
      - "analyzer/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-docker.yml"
  workflow_dispatch:
    inputs:
      cli-version:
        description: 'Published @telorun/cli version to build the release tag set for (e.g. 0.76.0). Empty → derive from the workspace version, if it is published and has no image.'
        type: string
        default: ''
  workflow_call:
    inputs:
      release:
        description: 'True when invoked from publish.yml post-publish release path. github.event_name is inherited from the caller (push), so it cannot distinguish the call path — this input does.'
        type: boolean
        default: false
      published-packages:
        description: 'JSON array of {name, version} from changesets/action publishedPackages output'
        type: string
        default: '[]'

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    name: Determine build context
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.compute.outputs.mode }}
      cli-version: ${{ steps.compute.outputs.cli-version }}
      rust-version: ${{ steps.compute.outputs.rust-version }}
      short-sha: ${{ steps.compute.outputs.short-sha }}
      release-cli: ${{ steps.compute.outputs.release-cli }}
      # Ref the kernel RELEASE tag set is built from. Empty on every ordinary
      # path (= this commit); set only when the self-healing gate is rebuilding a
      # version already on npm, where the code must come from that version's tag.
      build-ref: ${{ steps.compute.outputs.build-ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are what the self-healing gate resolves a published version to;
          # `ls-remote` is the fallback, but a local check is cheaper.
          fetch-depth: 0
          fetch-tags: true

      - id: compute
        env:
          PUBLISHED: ${{ inputs.published-packages }}
          DISPATCH_CLI_VERSION: ${{ inputs.cli-version }}
        run: |
          # Does telorun/node:<version>-slim exist? Anonymous pull token, so this
          # needs no docker login. A probe that cannot ANSWER (network, rate limit,
          # auth) reports "present": a missed build heals on the next push, while a
          # false "missing" would re-tag `latest` from an arbitrary commit.
          kernel_image_missing() {
            # `pipefail` inside the function, so the `|| return 1` below is a real
            # guard rather than a decorative one. The default runner shell is
            # `bash -e` WITHOUT pipefail, and `jq` exits 0 on empty input — so a
            # failed token fetch produced an empty token, exit status 0, and the
            # guard never fired. The probe then reported "present" via the
            # subsequent 401, which is the safe answer, so the intent held purely
            # by accident. The whole point of this probe is that its failure mode
            # is decided rather than incidental.
            local tag="$1-slim" token code
            set -o pipefail
            token=$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:telorun/node:pull" | jq -r .token) || return 1
            [ -n "$token" ] && [ "$token" != "null" ] || return 1
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://registry-1.docker.io/v2/telorun/node/manifests/$tag") || return 1
            [ "$code" = "404" ]
          }

          PUBLISHED="${PUBLISHED:-[]}"

          if [ "${{ inputs.release }}" = "true" ]; then
            MODE=release
          else
            MODE=dev
          fi

          RUST_VERSION=$(grep -E '^ARG RUST_VERSION=' cli/nodejs/Dockerfile | head -1 | cut -d= -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)

          # The release tag set is built for exactly one CLI version, from the most
          # specific source available: what the release run just published, then an
          # explicit workflow_dispatch input, then the self-healing gate below.
          CLI_VERSION=$(echo "$PUBLISHED" | jq -r '[.[] | select(.name=="@telorun/cli")][0].version // ""')
          if [ -z "$CLI_VERSION" ]; then
            CLI_VERSION="${DISPATCH_CLI_VERSION:-}"
          fi

          # SELF-HEALING GATE. `latest*` used to move only when the release run
          # reported @telorun/cli in `publishedPackages`, so ANY later failure in
          # that run — including one about modules rather than the CLI — left every
          # deployment pulling a kernel image releases behind, with nothing
          # reporting it. Image existence is now a function of what is on npm: a
          # published CLI version with no image gets one, whatever happened in the
          # run that published it.
          #
          # @telorun/sdk is checked too because the Dockerfile's `--prod deploy`
          # resolves it from npm. cli and sdk publish in one `changeset publish`
          # pass with no ordering guarantee between them, so a live cli alone is not
          # proof the build can resolve its peer — which is the race the kernel-dev
          # job skips the "version packages" commit for.
          # BUILD_REF is what the kernel jobs check out. Empty means "this
          # commit", which is right for every path except the self-healing gate
          # below.
          BUILD_REF=""

          if [ -z "$CLI_VERSION" ]; then
            V=$(jq -r .version cli/nodejs/package.json)
            SDK=$(jq -r .version sdk/nodejs/package.json)
            if npm view "@telorun/cli@$V" version >/dev/null 2>&1 \
               && npm view "@telorun/sdk@$SDK" version >/dev/null 2>&1; then
              if kernel_image_missing "$V"; then
                # The image is built from the WORKSPACE TREE (`COPY . /build`),
                # not from npm — so healing at whatever commit happens to be HEAD
                # would tag `telorun/node:<V>`, `:latest` and the rest with code
                # that is not what `@telorun/cli@<V>` contains. Release at commit
                # A publishes 0.77.0 and its image build fails; five feature
                # commits land; the next push would ship F's kernel as 0.77.0 and
                # move `latest` to an arbitrary commit — the exact outcome the
                # probe's own comment claims to prevent, and the same class of bug
                # (an artifact whose identity does not match its contents) the
                # rest of this change exists to fix.
                #
                # So the build is pinned to the tag changesets pushed for that
                # version. No tag, no heal: an operator can still select any ref
                # via workflow_dispatch, which is the deliberate path for a
                # version whose tag is missing or renamed.
                TAG="@telorun/cli@$V"
                if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1 \
                   || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                  echo "@telorun/cli@$V is live on npm but telorun/node:$V-slim is missing — building the release tag set from tag $TAG."
                  CLI_VERSION="$V"
                  BUILD_REF="refs/tags/$TAG"
                else
                  echo "@telorun/cli@$V is live on npm and telorun/node:$V-slim is missing, but tag '$TAG' does not exist — refusing to heal from HEAD, which would tag the release with a different commit's code. Use workflow_dispatch with the intended ref."
                fi
              fi
            fi
          fi

          {
            echo "mode=$MODE"
            echo "cli-version=$CLI_VERSION"
            echo "rust-version=$RUST_VERSION"
            echo "short-sha=$SHORT_SHA"
            echo "build-ref=$BUILD_REF"
            [ -n "$CLI_VERSION" ] && echo "release-cli=true" || echo "release-cli=false"
          } >> "$GITHUB_OUTPUT"

  kernel-dev:
    name: Build telorun/node dev tags
    # Same gating as runner/k8s-runner: the Dockerfile's `--prod deploy` resolves
    # the workspace's `@telorun/sdk` peer from npm. On the "chore(release): version
    # packages" commit the workspace is already bumped to a version that publish.yml
    # is still publishing concurrently, so a direct-push build here races the publish
    # and 404s. Skip that commit on the push path; the post-publish release path
    # (workflow_call → kernel-release, gated by `needs: release`) ships the same
    # commit's images once the versions are guaranteed live.
    if: |
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'chore(release): version packages')
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push lean-slim (sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: lean-slim
          push: true
          platforms: linux/amd64
          tags: telorun/node:sha-${{ needs.context.outputs.short-sha }}-slim
          cache-from: type=gha,scope=kernel-lean-slim
          cache-to: type=gha,mode=max,scope=kernel-lean-slim

      - name: Build & push rust-slim (sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: rust-slim
          push: true
          platforms: linux/amd64
          build-args: |
            RUST_VERSION=${{ needs.context.outputs.rust-version }}
          tags: telorun/node:sha-${{ needs.context.outputs.short-sha }}-rust-${{ needs.context.outputs.rust-version }}-slim
          cache-from: |
            type=gha,scope=kernel-rust-slim
            type=gha,scope=kernel-lean-slim
          cache-to: type=gha,mode=max,scope=kernel-rust-slim

  kernel-release:
    name: Build telorun/node release tags
    if: needs.context.outputs.release-cli == 'true'
    needs: context
    runs-on: ubuntu-latest
    steps:
      # `build-ref` is set ONLY by the self-healing gate, to the tag changesets
      # pushed for the version being rebuilt. The image is built from the
      # workspace tree, so building at HEAD would tag `:<version>` and `:latest`
      # with code that is not what that npm version contains. Empty on every other
      # path, where the default checkout (this commit) is correct.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.build-ref || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tag matrix
        id: tags
        env:
          V: ${{ needs.context.outputs.cli-version }}
          RV: ${{ needs.context.outputs.rust-version }}
        run: |
          MAJOR=$(echo "$V" | cut -d. -f1)
          MAJOR_MINOR=$(echo "$V" | cut -d. -f1-2)

          tagset() {
            local suffix="$1"
            echo "telorun/node:${V}${suffix}"
            echo "telorun/node:${MAJOR_MINOR}${suffix}"
            echo "telorun/node:${MAJOR}${suffix}"
            echo "telorun/node:latest${suffix}"
          }

          {
            echo 'lean<<EOF'
            tagset ""
            echo EOF
            echo 'lean-slim<<EOF'
            tagset "-slim"
            echo EOF
            echo 'rust<<EOF'
            tagset "-rust-${RV}"
            echo EOF
            echo 'rust-slim<<EOF'
            tagset "-rust-${RV}-slim"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build & push lean
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: lean
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.lean }}
          cache-from: type=gha,scope=kernel-lean
          cache-to: type=gha,mode=max,scope=kernel-lean

      - name: Build & push lean-slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: lean-slim
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.lean-slim }}
          cache-from: type=gha,scope=kernel-lean-slim
          cache-to: type=gha,mode=max,scope=kernel-lean-slim

      - name: Build & push rust
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: rust
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUST_VERSION=${{ needs.context.outputs.rust-version }}
          tags: ${{ steps.tags.outputs.rust }}
          cache-from: |
            type=gha,scope=kernel-rust
            type=gha,scope=kernel-lean
          cache-to: type=gha,mode=max,scope=kernel-rust

      - name: Build & push rust-slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: rust-slim
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUST_VERSION=${{ needs.context.outputs.rust-version }}
          tags: ${{ steps.tags.outputs.rust-slim }}
          cache-from: |
            type=gha,scope=kernel-rust-slim
            type=gha,scope=kernel-lean-slim
          cache-to: type=gha,mode=max,scope=kernel-rust-slim

  hub:
    name: Build telorun/hub
    # Build on every push (latest + sha) and on a CLI release. On push, FROM
    # telorun/node:sha-<short>-slim pins to the same-commit kernel image; on
    # release, FROM telorun/node:<cli-version>-slim pins the just-published CLI.
    # The "chore(release): version packages" commit is skipped on the push path
    # (its sha kernel base is not built there for the publish race) and rides the
    # post-publish release path instead. `always()` lets hub run when an upstream
    # kernel job was skipped.
    if: |
      always() &&
      ((github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore(release): version packages'))
        || needs.context.outputs.release-cli == 'true') &&
      needs.context.result == 'success' &&
      (needs.kernel-dev.result == 'success' || needs.kernel-dev.result == 'skipped') &&
      (needs.kernel-release.result == 'success' || needs.kernel-release.result == 'skipped')
    needs: [context, kernel-dev, kernel-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD^ needed to detect a metadata.version bump
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve TELO_NODE_VERSION
        id: telo
        env:
          CLI_VERSION: ${{ needs.context.outputs.cli-version }}
          SHORT_SHA: ${{ needs.context.outputs.short-sha }}
        run: |
          # On a CLI release commit, pin to the just-published version.
          # On a plain push, pin to the same-commit dev kernel tag so the
          # sha-scoped hub image is reproducible and exercises kernel
          # changes from the current commit.
          if [ -n "$CLI_VERSION" ]; then
            echo "version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute hub image tags
        id: imgtags
        env:
          SHORT_SHA: ${{ needs.context.outputs.short-sha }}
        run: |
          # Always publish :latest and the per-commit :sha-*. Add an immutable
          # :<version> tag only when apps/hub's release-owned metadata.version
          # actually moved in this commit (the release commit), mirroring how
          # publish-modules.mjs gates module-manifest pushes on HEAD^..HEAD.
          ver() { sed -n 's/^  version: ["'\'']\?\([0-9][0-9.]*\).*/\1/p' | head -1; }
          NOW=$(ver < apps/hub/telo.yaml)
          PREV=$(git show HEAD^:apps/hub/telo.yaml 2>/dev/null | ver || true)
          {
            echo 'tags<<EOF'
            echo "telorun/hub:latest"
            echo "telorun/hub:sha-${SHORT_SHA}"
            if [ -n "$NOW" ] && [ "$NOW" != "$PREV" ]; then
              echo "telorun/hub:${NOW}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build & push hub
        uses: docker/build-push-action@v6
        with:
          context: apps/hub
          file: apps/hub/Dockerfile
          target: production
          push: true
          build-args: |
            TELO_NODE_VERSION=${{ steps.telo.outputs.version }}
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub

  runner:
    name: Build telorun/docker-runner
    # `pnpm deploy --prod` resolves the workspace's `@telorun/sdk` peer from npm.
    # On the "chore(release): version packages" commit the workspace is already
    # bumped to a version that `publish.yml` is still publishing concurrently, so
    # a direct-push build here races the publish and 404s. Skip that commit on
    # the push path and build the runner on the post-publish release path
    # (`workflow_call` with `release: true`, gated by `needs: release` in
    # publish.yml) instead, where the bumped versions are guaranteed live.
    # Gate on `inputs.release`, NOT `github.event_name == 'workflow_call'`:
    # inside a called workflow github.event_name is inherited from the caller
    # (push), so that comparison is never true and would skip the release build.
    if: |
      inputs.release ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, 'chore(release): version packages'))
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD^ needed to detect a package.json version bump
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute runner image tags
        id: imgtags
        env:
          SHORT_SHA: ${{ needs.context.outputs.short-sha }}
        run: |
          # Always publish :latest and the per-commit :sha-*. Add an immutable
          # :<version> tag only when apps/docker-runner's package.json version
          # actually moved in this commit (the release commit), mirroring how
          # publish-modules.mjs gates module-manifest pushes on HEAD^..HEAD.
          NOW=$(jq -r .version apps/docker-runner/package.json)
          PREV=$(git show HEAD^:apps/docker-runner/package.json 2>/dev/null | jq -r .version 2>/dev/null || true)
          {
            echo 'tags<<EOF'
            echo "telorun/docker-runner:latest"
            echo "telorun/docker-runner:sha-${SHORT_SHA}"
            if [ -n "$NOW" ] && [ "$NOW" != "null" ] && [ "$NOW" != "$PREV" ]; then
              echo "telorun/docker-runner:${NOW}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build & push runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker-runner/Dockerfile
          target: production
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  k8s-runner:
    name: Build telorun/k8s-runner
    # Same gating as docker-runner: skip the version-packages release commit on
    # the push path (workspace bumped but not yet published); build on the
    # post-publish workflow_call (`release: true`) path instead. Gate on
    # `inputs.release` — github.event_name is the caller's event inside a called
    # workflow, never 'workflow_call'.
    #
    # It also WAITS ON THE KERNEL JOBS, because it bakes one of their tags as its
    # session default. Run concurrently, a failed `kernel-release` would ship
    # `k8s-runner:latest` and `:<version>` with a default pointing at a
    # `telorun/node:<v>-slim` that never gets built — a default that cannot
    # resolve, where the old `latest-slim` always could. `always()` plus the
    # per-job result test is the shape `hub` and `authoring-agent` already use, so
    # a legitimately SKIPPED kernel job still does not block this one.
    if: |
      always() &&
      (inputs.release ||
       (github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore(release): version packages'))) &&
      needs.context.result == 'success' &&
      (needs.kernel-dev.result == 'success' || needs.kernel-dev.result == 'skipped') &&
      (needs.kernel-release.result == 'success' || needs.kernel-release.result == 'skipped')
    needs: [context, kernel-dev, kernel-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD^ needed to detect a package.json version bump
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute k8s-runner image tags
        id: imgtags
        env:
          SHORT_SHA: ${{ needs.context.outputs.short-sha }}
          CLI_VERSION: ${{ needs.context.outputs.cli-version }}
        run: |
          # latest + per-commit sha always; immutable :<version> only when
          # apps/k8s-runner's package.json version moved this commit (release).
          NOW=$(jq -r .version apps/k8s-runner/package.json)
          PREV=$(git show HEAD^:apps/k8s-runner/package.json 2>/dev/null | jq -r .version 2>/dev/null || true)
          {
            echo 'tags<<EOF'
            echo "telorun/k8s-runner:latest"
            echo "telorun/k8s-runner:sha-${SHORT_SHA}"
            if [ -n "$NOW" ] && [ "$NOW" != "null" ] && [ "$NOW" != "$PREV" ]; then
              echo "telorun/k8s-runner:${NOW}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

          # The kernel image spawned for each session, baked into this build so a
          # RELEASED runner's tested kernel and its runtime kernel are the same
          # artifact. It is a default an operator can override, not a FROM, so it
          # need not exist yet when this builds.
          #
          # Set ONLY on the release path. A dev build leaves it empty so the
          # Dockerfile's own `ARG TELO_SESSION_IMAGE=telorun/node:latest-slim`
          # stands, and that is not a detail: `kernel-dev` builds its sha tags
          # `linux/amd64` only, so baking `telorun/node:sha-<sha>-slim` — which is
          # what every ordinary push to main produces — put an amd64-only kernel
          # behind `k8s-runner:latest`, the chart's default with `pullPolicy:
          # Always`. Sessions on arm64 nodes could not pull it. `latest-slim` is
          # multi-arch. Lockstep is only meaningful for an immutable runner tag
          # anyway: for `:latest` both sides are mutable, so pinning a sha bought
          # nothing and cost a platform.
          if [ -n "$CLI_VERSION" ]; then
            echo "session-image=telorun/node:${CLI_VERSION}-slim" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push k8s-runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/k8s-runner/Dockerfile
          target: production
          push: true
          # Empty on a dev build, and an empty `build-args` line is ignored by
          # buildx — so the Dockerfile's multi-arch default applies rather than a
          # blank override.
          build-args: |
            ${{ steps.imgtags.outputs.session-image && format('TELO_SESSION_IMAGE={0}', steps.imgtags.outputs.session-image) || '' }}
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=k8s-runner
          cache-to: type=gha,mode=max,scope=k8s-runner

  authoring-agent:
    name: Build telorun/authoring-agent
    # Publishes :latest-slim + :sha-<short>-slim on EVERY push, and adds the
    # immutable :<version>-slim only when the agent's release-owned
    # metadata.version moved this commit — the same policy hub, runner and
    # k8s-runner use.
    #
    # It previously published ONLY on a version move, which made the deployed
    # image silently age: `apps/**` needed no release fragment, so the version
    # never moved, so nothing rebuilt. The agent's system prompt AND its
    # embedded CLI are both baked in here, so a stale image serves a stale
    # primer against a stale runtime. The fragment gate now covers `apps/`, but
    # that still depends on someone writing one; publishing every push is what
    # makes staleness structurally impossible rather than merely discouraged.
    #
    # The base image is resolved exactly as hub resolves it, and the two halves
    # are coupled: on a CLI release, FROM telorun/node:<cli-version>-slim pins
    # the just-published CLI; on a plain push, FROM telorun/node:sha-<short>-slim
    # pins the same-commit kernel image that kernel-dev builds in this very run.
    #
    # It must NOT fall back to cli/nodejs/package.json. That file holds the
    # IN-DEVELOPMENT version, whose telorun/node image is not published until a
    # release runs — so the base tag would not exist. That fallback was
    # previously safe only because this job ran solely on version-move commits,
    # where a CLI release had just published it; publishing on every push made
    # it reachable on ordinary commits and broke the build.
    #
    # The "version packages" commit is skipped on the push path (its base may
    # still be publishing concurrently); it rides the workflow_call release path
    # like the other app images.
    # `always()` lets this job run when either kernel job was skipped.
    if: |
      always() &&
      (inputs.release ||
       (github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore(release): version packages'))) &&
      needs.context.result == 'success' &&
      (needs.kernel-dev.result == 'success' || needs.kernel-dev.result == 'skipped') &&
      (needs.kernel-release.result == 'success' || needs.kernel-release.result == 'skipped')
    needs: [context, kernel-dev, kernel-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD^ needed to detect a metadata.version bump
      - uses: docker/setup-buildx-action@v3

      - name: Compute authoring-agent image tags
        id: decide
        env:
          CLI_VERSION: ${{ needs.context.outputs.cli-version }}
          SHORT_SHA: ${{ needs.context.outputs.short-sha }}
        run: |
          ver() { sed -n 's/^  version: ["'\'']\?\([0-9][0-9.]*\).*/\1/p' | head -1; }
          AGENT_NOW=$(ver < apps/authoring-agent/telo.yaml)
          AGENT_PREV=$(git show HEAD^:apps/authoring-agent/telo.yaml 2>/dev/null | ver || true)
          if [ -z "$AGENT_NOW" ]; then
            echo "Could not read metadata.version from apps/authoring-agent/telo.yaml" >&2
            exit 1
          fi

          # On a CLI release commit, pin to the just-published version. On a
          # plain push, pin to the same-commit dev kernel tag that kernel-dev
          # built in this run — never cli/nodejs/package.json, which names an
          # unpublished in-development version.
          if [ -n "$CLI_VERSION" ]; then
            TELO_V="$CLI_VERSION"
          else
            TELO_V="sha-$SHORT_SHA"
          fi

          # latest + per-commit sha always; immutable :<version>-slim only when
          # the release-owned metadata.version moved this commit.
          {
            echo "telo-version=$TELO_V"
            echo 'tags<<EOF'
            echo "telorun/authoring-agent:latest-slim"
            echo "telorun/authoring-agent:sha-${SHORT_SHA}-slim"
            if [ "$AGENT_NOW" != "$AGENT_PREV" ]; then
              echo "telorun/authoring-agent:${AGENT_NOW}-slim"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push authoring-agent
        uses: docker/build-push-action@v6
        with:
          context: apps/authoring-agent
          file: apps/authoring-agent/Dockerfile
          target: production
          push: true
          build-args: |
            TELO_NODE_VERSION=${{ steps.decide.outputs.telo-version }}
          tags: ${{ steps.decide.outputs.tags }}
          cache-from: type=gha,scope=authoring-agent
          cache-to: type=gha,mode=max,scope=authoring-agent
