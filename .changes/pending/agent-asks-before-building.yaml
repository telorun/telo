modules:
  apps/authoring-agent: Added
body: "The agent now gathers requirements before it builds. A request to create
  something new that leaves something material unsaid — what it exposes, where its
  data lives, auth, tests — is answered with questions rather than guesses, and no
  files are written until they are settled. Questions come in ROUNDS that narrow:
  round one settles the shape in at most four questions, each later round asks only
  what the previous answers made relevant, and three rounds is the ceiling. Asking
  everything at once produced compound questions (\"provide: (1) the id, (2) the tab,
  (3) the headers\") that cannot be answered in a text box, and it asks for a
  spreadsheet tab's headers only once it knows which tab. Options carry a
  recommended one where real alternatives exist. A request that
  already specifies everything is still built immediately, and so is any edit, fix
  or follow-up in a thread that settled the questions once. The questions ride in the
  reply as a fenced `telo-questions` JSON block rather than a tool call, because a
  tool result feeds the model loop into another step and so cannot end a turn:
  Telo Studio renders the block as clickable options, and a client that does not
  parse it shows the same questions as text. Every question also takes an answer in
  the user's own words — the options are guesses at the useful answers, not the set
  of legal ones — and such an answer is built as written rather than snapped to the
  nearest option offered. A question may carry no options at all, for a fact only
  the user has: a spreadsheet's columns, a tracker's field names, the key two
  sources are joined on. The agent already reads module fields from the hub rather
  than guessing, and the same rule now covers the user's own systems, which no tool
  can describe — a request naming YouTrack, a Google Sheet and a PDF reads as a
  specification while saying nothing about any of them, and an invented column name
  yields a manifest that checks clean, runs, and is wrong. Every turn now also opens
  with a `WORKSPACE STATE:` message listing what the workspace holds, so the agent
  is told rather than having to remember to look: it had been asking whether to
  create a new application or extend an existing one against an empty workspace."
