units:
  modules/http-server: Added
body: "Mounts can verify signed requests. `Http.FromBodySignature` reads a webhook
  provider's signature over the body (Stripe, GitHub, Slack, Shopify and Standard
  Webhooks are recipes of its `signature`, `timestamp` and `base` fields) and
  `Http.FromMessageSignature` reads an RFC 9421 message signature (`label`,
  `components`), each handing `AuthSignature.Verifier` the signed bytes. A mount or
  route listing a source that reads the body has the whole body read first, within the
  route's `maxBodyBytes` (a longer one is the usual 413 before any verifier runs), and
  every parser, stream and mount then receives exactly the verified bytes.
  `Http.CredentialRequest` gains `targetUri` and, for such a source, the sensitive
  `body`; a source's reading may publish `readsBody`. A mount reads the body only
  through the server. `authentication` on a mount and a route also gains `throttle: {
  budget, key? }`, which bounds refused credentials per client (the key defaults to
  `request.ip`) before any verifier runs or body is read: a spent `RateLimit.Budget`
  answers 429 with `Retry-After` and the new `ERR_HTTP_AUTHENTICATION_THROTTLED`,
  accepted credentials and requests with none spend nothing, and a budget store that
  fails is a 503 with `stage: throttle`. `http-server` now imports `rate-limit`."
