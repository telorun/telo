---
# Creation only: a rule reads one reference deep, and comparing an endpoint
# column with the endpoint node's key needs the node's table, two away.
kind: Assert.Manifest
metadata: { name: endpointTypeMismatch }
source: ./__fixtures__/rules/endpoint-type-mismatch/telo.yaml
expect:
  errors: []
---
kind: Assert.Manifest
metadata: { name: endpointTypeMismatchAtRuntime }
source: ./__fixtures__/rules/endpoint-type-mismatch-app.yaml
expect:
  errors: []
  runFails: "GRAPH_ENDPOINT_TYPE_MISMATCH"
---
# The analyzer's own refusal, which the `bases:` slot leans on: a base is a
# dependency, so two stores built on each other are a cycle.
kind: Assert.Manifest
metadata: { name: baseCycle }
source: ./__fixtures__/rules/base-cycle/telo.yaml
expect:
  errors:
    - code: DEPENDENCY_CYCLE
      message: "second"
