kind: Telo.Application
metadata:
  name: HubSearchIdentityRankingTest
  version: 1.0.0
  description: |
    `searchResources` leads with the kinds whose qualified name the query
    spells. A query naming a module and a kind (`http server`) is answered with
    that module's kinds first — the kind the query names, then its siblings —
    ahead of kinds whose DESCRIPTIONS merely use the same words; a described
    need matches no name and is ranked as before. The grouped form states each
    module once, in the order of its best hit, and `limit` bounds the hits.

    NEEDS A LIVE POSTGRES WITH PGVECTOR — a database `pnpm run test:e2e:hub`
    supplies from its own stack through DB_HOST, DB_PORT, DB_USER, DB_PASSWORD
    and DB_NAME, never a developer's database. Run only by the hub's own suite
    through that command. The embedder is a local stand-in, and no vector is
    seeded, so the semantic arm contributes nothing here.
imports:
  Http: ../../../../modules/http-server
  Sql: oci://ghcr.io/telorun/sql@0.28.1#sha256-ZlxQTTYQtAhK2aAyLRYMwBN-U4b8ww4ulu0SVnIxFu8
  Postgres: oci://ghcr.io/telorun/postgres@0.9.2#sha256-Qy-tUrCBV_ar51vfQHDBPP8oytowO4lyWwAfeyb92Pc
  Run: oci://ghcr.io/telorun/run@0.29.1#sha256-EMlCpjQJfCDI8XUNNqx6z5q02zinb6Gd_yMgJ4_mcqQ
  Embedding: oci://ghcr.io/telorun/embedding@0.12.0#sha256-lQqgopkTtGP1RyYmoryM-mr1fv_Ey_xbMZsj3vlLEeM
  OpenAI: oci://ghcr.io/telorun/openai@0.15.0#sha256-RG60ZY-3o_xsDIbjW_wg7mjEBe4DNmXN8OcOlpRa3ro
  HttpClient: oci://ghcr.io/telorun/http-client@0.23.0#sha256-6WAIh0ajnTlkWNuP-59e1qNVUXVSJDWZxvPVACQg1AM
  VectorStore: oci://ghcr.io/telorun/vector-store@0.11.0#sha256-lmCK8i7SQuTRupTSY-s5l89wUwQuikXpjJOxI5vbNwI
  VectorStorePgvector: oci://ghcr.io/telorun/vector-store-pgvector@0.17.2#sha256-nuory71klEQiFrxZZ422STCpkOY6qF9Q_aeeZ4wucSE
  Assert: ../../../../modules/assert
  Schema:
    source: ../../hub-schema.yaml
    resources:
      connection: !ref db
  Search:
    source: ../../hub-search.yaml
    resources:
      connection: !ref db
      embedQuery: !ref embedQuery
      vectorMatch: !ref vectorMatch
variables:
  dbHost:
    env: DB_HOST
    type: string
    default: localhost
  dbPort:
    env: DB_PORT
    type: integer
    default: 5432
  dbUser:
    env: DB_USER
    type: string
    default: postgres
  dbPassword:
    env: DB_PASSWORD
    type: string
    default: postgres
  dbName:
    env: DB_NAME
    type: string
    default: postgres
targets:
  - !ref Schema.migrations
  - !ref test
---
kind: Postgres.Connection
metadata:
  name: db
access:
  kind: Postgres.DatabaseAccess
  fields:
    url:
      scheme: postgres
      host: !cel "variables.dbHost"
      port: !cel "variables.dbPort"
      user: !cel "variables.dbUser"
      password: !cel "variables.dbPassword"
      path: !cel "'/' + variables.dbName"
---
kind: Embedding.Query
metadata:
  name: embedQuery
model:
  kind: OpenAI.EmbeddingModel
  model: stand-in
  request:
    kind: HttpClient.Request
    client:
      kind: HttpClient.Client
      baseUrl: http://127.0.0.1:8990
---
kind: VectorStore.Match
metadata:
  name: vectorMatch
store:
  kind: VectorStorePgvector.Store
  connection: !ref db
  dimensions: 3
  metric: cosine
  table: resource_vectors
topK: 5
---
kind: Http.Api
metadata:
  name: embedderApi
routes:
  - request: { path: /embeddings, method: POST }
    handler:
      kind: Run.Value
      value:
        data:
          - embedding: [1.0, 0.0, 0.0]
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result"
---
kind: Sql.Command
metadata:
  name: exec
connection: !ref db
---
kind: Run.Sequence
metadata:
  name: test
with:
  - kind: Http.Server
    metadata: { name: Embedder }
    listen:
      address: 127.0.0.1
      port: 8990
    mounts:
      - path: /
        mount: !ref embedderApi
targets:
  - !ref Embedder
steps:
  - name: seedModules
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO modules (id, ref, transport, latest_version)
        VALUES (9411, 'oci://rank.test/http-server', 'oci', '1.0.0'),
               (9412, 'oci://rank.test/mcp-server', 'oci', '1.0.0'),
               (9413, 'oci://rank.test/mcp-client', 'oci', '1.0.0')
        ON CONFLICT DO NOTHING
  - name: seedVersions
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO module_versions
          (module_id, version, digest, module_name, description, manifest_key)
        VALUES (9411, '1.0.0', 'sha256:test', 'HttpServer', 'Serving HTTP.', 'test'),
               (9412, '1.0.0', 'sha256:test', 'McpServer',
                'Exposes an application to rankprobe clients over HTTP, as a server.', 'test'),
               (9413, '1.0.0', 'sha256:test', 'McpClient',
                'Talks to rankprobe servers over HTTP: a server is reached by its URL.', 'test')
        ON CONFLICT DO NOTHING
  # The other modules' descriptions use the query's words more often than the
  # module the query names does.
  - name: seedKinds
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO resource_kinds (module_id, version, name, capability, exported, description, portable)
        VALUES (9411, '1.0.0', 'Server', 'Telo.Service', TRUE, 'Listens on a port.', FALSE),
               (9411, '1.0.0', 'Api', 'Telo.Mount', TRUE, 'A router of routes.', FALSE),
               (9412, '1.0.0', 'HttpEndpoint', 'Telo.Mount', TRUE,
                'Serves tools over HTTP to a rankprobe client; an HTTP server mounts it. HTTP server.', FALSE),
               (9413, '1.0.0', 'HttpClient', 'Telo.Invocable', TRUE,
                'Connects to an HTTP server over HTTP; the HTTP server issues a session. HTTP server.', FALSE)
        ON CONFLICT DO NOTHING
  - name: named
    invoke: !ref Search.searchResources
    inputs:
      q: http server
      category: ""
      runtime: ""
  - name: described
    invoke: !ref Search.searchResources
    inputs:
      q: rankprobe client
      category: ""
      runtime: ""
  - name: bounded
    invoke: !ref Search.searchResources
    inputs:
      q: http server
      category: ""
      runtime: ""
      limit: 1
  - name: many
    invoke: !ref Search.searchMany
    inputs:
      queries: [http server, rankprobe client]
      category: ""
      runtime: ""
      limit: 3
  - name: assertRanking
    inputs:
      actual:
        # The seeded rows only: the database may hold other tests' modules.
        named: !cel >-
          steps.named.result.hits.filter(h, h.module.ref.startsWith('oci://rank.test/'))
            .map(h, h.module.name + '.' + h.name)
        namedGrouped: !cel >-
          steps.named.result.modules.filter(m, m.ref.startsWith('oci://rank.test/'))
            .map(m, [m.name, m.hits.map(h, h.name)])
        describedLeads: !cel >-
          steps.described.result.hits.filter(h, h.module.ref.startsWith('oci://rank.test/'))
            .map(h, h.module.name)[0]
        bounded: !cel "size(steps.bounded.result.hits)"
        many: !cel "steps.many.result.map(r, [r.query, sum(r.modules.map(m, size(m.hits))) <= 3])"
        # A kind hit says nothing it has nothing to say about.
        hitKeys: !cel >-
          sort(keys(steps.named.result.modules.filter(m, m.ref == 'oci://rank.test/http-server')[0].hits[0]))
      expected:
        named: [HttpServer.Server, HttpServer.Api, McpServer.HttpEndpoint, McpClient.HttpClient]
        namedGrouped:
          - [HttpServer, [Server, Api]]
          - [McpServer, [HttpEndpoint]]
          - [McpClient, [HttpClient]]
        describedLeads: McpServer
        bounded: 1
        many:
          - [http server, true]
          - [rankprobe client, true]
        hitKeys: [capability, description, name, runtimes]
    invoke:
      kind: Assert.Equals
