modules:
  modules/ui-react: Added
body: "The chat draws an approval as one line: a toggle folding the call's arguments
  (unfolded while the call waits for a decision, folded once decided), and at its end
  what was decided and a glyph for the state — an alert while waiting, a check once
  approved, a cross once rejected — with the new parts chat-approval-header,
  chat-approval-toggle and chat-approval-state. The default theme condenses tool calls
  and approvals to rows of small text, marks a tool call with a stripe at its start edge
  (the danger colour once it failed), colours a decided approval by its decision, wraps
  a tool's long arguments and result in a box of bounded height, raises the message box
  slightly, draws text waiting for the Markdown formatter in the body font, gives scroll
  areas a thin quiet scrollbar, draws a link button before the application's title as a
  square mark, bare unless accented, and keeps secondary text on a tinted fill at a
  4.5:1 contrast."
