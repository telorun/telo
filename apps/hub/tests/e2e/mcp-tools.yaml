kind: Telo.Application
metadata:
  name: HubE2EMcpTools
  version: 1.0.0
  description: |
    End-to-end tests for the hub's MCP endpoint at /mcp, run against a live
    hub at http://localhost:8040 that has tracked the seeded refs. Locks in
    the discovery loop: `search_resources` returns kind hits grouped under the
    module location ref that owns them, for one query or several; `get_kinds`
    returns the definitions of the named kinds with their import line;
    `list_libraries` lists a publisher's libraries; `get_kinds` refuses a telo
    version the hub tracks no built-in vocabulary at; `get_module_manifest(ref)`
    returns the tracker-cached telo.yaml for that ref, and `get_module` / `list_module_versions` /
    `find_implementations` / `find_instances` / `list_categories` / `suggest_module_refs` mirror
    the hub's keyed-read HTTP routes as tools.
imports:
  McpClient: oci://ghcr.io/telorun/mcp-client@0.17.0#sha256-wMlnrVxgeWHAX6_f1pr7v059KzgjYHuICg5Ui68v2zc
  Run: oci://ghcr.io/telorun/run@0.29.1#sha256-EMlCpjQJfCDI8XUNNqx6z5q02zinb6Gd_yMgJ4_mcqQ
  Assert: oci://ghcr.io/telorun/assert@0.21.1#sha256-9CCELeaW54ph9v7qtM1zBRq9-gqXK4fwF0NubWAhsN4
  Yaml: oci://ghcr.io/telorun/yaml@0.11.0#sha256-KSC6vlR1yOvXgCUZzj6g4p0r_T-6SfMqQPLR_HQnktk
targets:
  - !ref searchResources_ReturnsKindHits
  - !ref searchResources_OmitsWhatSaysNothing
  - !ref searchResources_AnswersSeveralQueries
  - !ref searchResources_LeadsWithTheNamedKind
  - !ref searchResources_RefusesNoQuery
  - !ref getKinds_ReturnsDefinitionsAndImportLine
  - !ref getKinds_NamesWhatIsNotDefined
  - !ref getKinds_ReadsQuotedScalars
  - !ref getKinds_KeepsTheImplementationWhenAsked
  - !ref getKinds_ReportsAnUntrackedRef
  - !ref getKinds_ReadsTheParentTheChildPins
  - !ref getKinds_RefusesNoKinds
  - !ref getKinds_RefusesAnUntrackedTeloVersion
  - !ref searchResources_RefusesLimitOutOfRange
  - !ref listLibraries_ListsAPublishersLibraries
  - !ref searchResources_RefusesRuntimeForApplications
  - !ref searchResources_RefusesUnknownEntryType
  - !ref getModule_ReturnsTrackedModuleFacts
  - !ref listModuleVersions_ReturnsPinnedVersions
  - !ref findImplementations_ListsKvStoreBackends
  - !ref findInstances_ListsSeededLanguagePacks
  - !ref findDependents_ListsImportersInOneLine
  - !ref searchResources_StaysWithinAPublisher
  - !ref listCategories_CarriesSchedulingSlug
  - !ref suggestModuleRefs_ResolvesPartialToken
  - !ref getModuleManifest_ReturnsCachedYaml
---
kind: McpClient.HttpClient
metadata: { name: hubMcp }
url: http://localhost:8040/mcp
clientInfo: { name: telo-test, version: 1.0.0 }
---
kind: McpClient.ToolsCall
metadata: { name: mcpToolCall }
client: !ref hubMcp
---
kind: Yaml.Parse
metadata: { name: parsePayload }
---
kind: Run.Sequence
metadata: { name: searchResources_ReturnsKindHits }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: search_resources
      arguments:
        query: delay a task
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  # The hit list itself is not assertable as a literal — scores and the rest of
  # the corpus move — so the claim is stated directly: the query echoes back,
  # and the seeded timer's Delay is a hit under its own module, which states the
  # ref and version to import once.
  - name: assert
    inputs:
      actual:
        queries: !cel "steps.parse.result.docs[0].results.map(r, r.query)"
        foundTimerDelay: !cel >-
          steps.parse.result.docs[0].results[0].modules.exists(m,
            m.ref == 'oci://ghcr.io/telorun/timer' && m.version != ''
              && m.hits.exists(h, h.name == 'Delay' && h.capability == 'Telo.Invocable'))
      expected:
        queries: [delay a task]
        foundTimerDelay: true
    invoke:
      kind: Assert.Equals
---
# A hit carries only what says something: a kind hit has no `entry`, a hit that
# extends nothing no `extends`, and the response no category facet — each of
# which a caller that pays per byte would otherwise be sent on every hit.
kind: Run.Sequence
metadata: { name: searchResources_OmitsWhatSaysNothing }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: search_resources
      arguments:
        query: repeat a step while a condition holds
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: loopHit
    value: !cel >-
      steps.parse.result.docs[0].results[0].modules
        .filter(m, m.ref == 'oci://ghcr.io/telorun/run')[0].hits.filter(h, h.name == 'Loop')[0]
  - name: assert
    inputs:
      actual:
        topLevel: !cel "keys(steps.parse.result.docs[0])"
        resultKeys: !cel "sort(keys(steps.parse.result.docs[0].results[0]))"
        loopKeys: !cel "sort(keys(steps.loopHit.result))"
      expected:
        topLevel: [results]
        resultKeys: [modules, query]
        loopKeys: [capability, description, name, runtimes]
    invoke:
      kind: Assert.Equals
---
# Several needs in one call: each query is answered on its own, in the order
# asked, and `limit` bounds each answer's hits.
kind: Run.Sequence
metadata: { name: searchResources_AnswersSeveralQueries }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: search_resources
      arguments:
        queries: [delay a task, repeat a step while a condition holds]
        limit: 2
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        queries: !cel "steps.parse.result.docs[0].results.map(r, r.query)"
        withinLimit: !cel >-
          steps.parse.result.docs[0].results.all(r,
            sum(r.modules.map(m, size(m.hits))) <= 2)
      expected:
        queries: [delay a task, repeat a step while a condition holds]
        withinLimit: true
    invoke:
      kind: Assert.Equals
---
# A query that spells a module and one of its kinds leads with that kind, the
# rest of the module's matching kinds beside it — the name is a vote of its own
# rather than one term among a description's many.
kind: Run.Sequence
metadata: { name: searchResources_LeadsWithTheNamedKind }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: search_resources
      arguments:
        queries: [scheduler cron, run loop]
        limit: 3
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual: !cel >-
        steps.parse.result.docs[0].results.map(r,
          [r.modules[0].ref, r.modules[0].hits[0].name])
      expected:
        - ["oci://ghcr.io/telorun/scheduler", Cron]
        - ["oci://ghcr.io/telorun/run", Loop]
    invoke:
      kind: Assert.Equals
---
# Neither `query` nor `queries` is an error result, not an empty answer. The
# call must fail — reaching the step after it is itself the failure.
kind: Run.Sequence
metadata: { name: searchResources_RefusesNoQuery }
steps:
  - name: refused
    try:
      - name: call
        invoke: !ref mcpToolCall
        inputs:
          name: search_resources
          arguments: {}
      - name: answered
        throw:
          code: ERR_TEST_EXPECTED_REFUSAL
          message: search_resources answered a call naming no query
    catch:
      - name: assert
        inputs:
          actual: !cel "error.code"
          expected: ERR_MCP_TOOL_ERROR
        invoke:
          kind: Assert.Equals
---
# get_kinds answers with exactly what a caller writes against: the `imports:`
# line for the version read, the asked kind's own document without its
# controllers, and the parent a kind takes fields from — in another module.
kind: Run.Sequence
metadata: { name: getKinds_ReturnsDefinitionsAndImportLine }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: get_kinds
      arguments:
        kinds:
          - { ref: "oci://ghcr.io/telorun/timer", kind: Delay }
          - { ref: "oci://ghcr.io/telorun/kv-store-redis", kind: Store }
  - name: text
    value: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        timerImport: !cel >-
          size(regexExtract(steps.text.result,
            '#   Timer: oci://ghcr\\.io/telorun/timer@[0-9.]+#sha256-[A-Za-z0-9_-]+')) > 0
        delayDefinition: !cel "steps.text.result.contains('\\n  name: Delay\\n')"
        delayInput: !cel "steps.text.result.contains('duration:')"
        noControllers: !cel "!steps.text.result.contains('controllers:')"
        redisStore: !cel "steps.text.result.contains('extends: KvStore.Store')"
        inheritedParent: !cel >-
          size(regexExtract(steps.text.result,
            'reached through `extends`[^\\n]*\\n# imports:\\n#   [A-Za-z]+: oci://ghcr\\.io/telorun/kv-store@')) > 0
      expected:
        timerImport: true
        delayDefinition: true
        delayInput: true
        noControllers: true
        redisStore: true
        inheritedParent: true
    invoke:
      kind: Assert.Equals
---
# A name the module does not define is said so, beside what it does export — and
# an alias-qualified name is read by its suffix, an alias being the caller's own.
kind: Run.Sequence
metadata: { name: getKinds_NamesWhatIsNotDefined }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: get_kinds
      arguments:
        kinds:
          - { ref: "oci://ghcr.io/telorun/run", kind: Run.Loop }
          - { ref: "oci://ghcr.io/telorun/run", kind: Nope }
  - name: text
    value: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        loopDefinition: !cel "steps.text.result.contains('\\n  name: Loop\\n')"
        notDefined: !cel >-
          size(regexExtract(steps.text.result,
            '# NOT DEFINED by this module: Nope\\. It exports: [A-Za-z, ]*Loop')) > 0
      expected:
        loopDefinition: true
        notDefined: true
    invoke:
      kind: Assert.Equals
---
# A definition whose `kind:` and `name:` are quoted YAML scalars is found, not
# reported as undefined beside an export list naming it.
kind: Run.Sequence
metadata: { name: getKinds_ReadsQuotedScalars }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: get_kinds
      arguments:
        kinds:
          - { ref: "./apps/hub/tests/e2e/__fixtures__/quoted-kinds", kind: Quoted }
  - name: text
    value: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        definition: !cel "steps.text.result.contains('\\n  name: \"Quoted\"\\n')"
        notDefined: !cel "steps.text.result.contains('NOT DEFINED')"
      expected:
        definition: true
        notDefined: false
    invoke:
      kind: Assert.Equals
---
# `implementation: true` keeps what the default answer cuts — here a kind's
# `controllers:` — for a caller tracing a runtime error into a kind.
kind: Run.Sequence
metadata: { name: getKinds_KeepsTheImplementationWhenAsked }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: get_kinds
      arguments:
        kinds:
          - { ref: "oci://ghcr.io/telorun/kv-store-redis", kind: Store }
        implementation: true
  - name: text
    value: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        controllers: !cel "steps.text.result.contains('\\ncontrollers:')"
      expected:
        controllers: true
    invoke:
      kind: Assert.Equals
---
# A call naming only refs the hub does not track is an error result.
kind: Run.Sequence
metadata: { name: getKinds_ReportsAnUntrackedRef }
steps:
  - name: refused
    try:
      - name: call
        invoke: !ref mcpToolCall
        inputs:
          name: get_kinds
          arguments:
            kinds:
              - { ref: "oci://example.test/absent", kind: Thing }
      - name: answered
        throw:
          code: ERR_TEST_EXPECTED_REFUSAL
          message: get_kinds answered for a ref the hub does not track
    catch:
      - name: assert
        inputs:
          actual: !cel "error.code"
          expected: ERR_MCP_TOOL_ERROR
        invoke:
          kind: Assert.Equals
---
# A parent kind is read at the version the CHILD pins it at, not at whatever is
# latest: an older child was written against an older parent.
kind: Run.Sequence
metadata: { name: getKinds_ReadsTheParentTheChildPins }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: get_kinds
      arguments:
        kinds:
          - { ref: "oci://ghcr.io/telorun/kv-store-redis", kind: Store, version: 0.6.0 }
  - name: text
    value: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        child: !cel "steps.text.result.contains('oci://ghcr.io/telorun/kv-store-redis@0.6.0')"
        parent: !cel "regexGroups(steps.text.result, 'oci://ghcr[.]io/telorun/kv-store@([0-9.]+)')"
      expected:
        child: true
        parent: [0.4.0]
    invoke:
      kind: Assert.Equals
---
# An empty `kinds` list is an error result saying what to pass.
kind: Run.Sequence
metadata: { name: getKinds_RefusesNoKinds }
steps:
  - name: refused
    try:
      - name: call
        invoke: !ref mcpToolCall
        inputs:
          name: get_kinds
          arguments: { kinds: [] }
      - name: answered
        throw:
          code: ERR_TEST_EXPECTED_REFUSAL
          message: get_kinds answered a call naming no kind
    catch:
      - name: assert
        inputs:
          actual: !cel "error.code"
          expected: ERR_MCP_TOOL_ERROR
        invoke:
          kind: Assert.Equals
---
# A `telo` version the hub tracks no built-in vocabulary at is a bad argument,
# answered with the versions it does track. 0.0.1 predates the vocabulary.
kind: Run.Sequence
metadata: { name: getKinds_RefusesAnUntrackedTeloVersion }
steps:
  - name: refused
    try:
      - name: call
        invoke: !ref mcpToolCall
        inputs:
          name: get_kinds
          arguments:
            kinds:
              - { ref: "oci://ghcr.io/telorun/timer", kind: Delay }
            telo: 0.0.1
      - name: answered
        throw:
          code: ERR_TEST_EXPECTED_REFUSAL
          message: get_kinds answered for a telo version the hub does not track
    catch:
      - name: assert
        inputs:
          actual:
            rpcCode: !cel "error.data.code"
            teloCode: !cel "error.data.data.code"
          expected:
            rpcCode: -32602
            teloCode: ERR_UNKNOWN_TELO_VERSION
        invoke:
          kind: Assert.Equals
---
# A `limit` outside 1–50 is a bad argument, not an internal failure.
kind: Run.Sequence
metadata: { name: searchResources_RefusesLimitOutOfRange }
steps:
  - name: refused
    try:
      - name: call
        invoke: !ref mcpToolCall
        inputs:
          name: search_resources
          arguments:
            query: delay
            limit: 500
      - name: answered
        throw:
          code: ERR_TEST_EXPECTED_REFUSAL
          message: search_resources answered a limit of 500
    catch:
      - name: assert
        inputs:
          actual:
            code: !cel "error.code"
            rpcCode: !cel "error.data.code"
          expected:
            code: ERR_MCP_JSON_RPC_ERROR
            rpcCode: -32602
        invoke:
          kind: Assert.Equals
---
# list_libraries is the whole of a publisher's library in one answer: a summary
# no longer than a line, and the kinds each library exports.
kind: Run.Sequence
metadata: { name: listLibraries_ListsAPublishersLibraries }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: list_libraries
      arguments:
        publisher: ghcr.io/telorun
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        timerKinds: !cel >-
          steps.parse.result.docs[0].libraries
            .filter(l, l.ref == 'oci://ghcr.io/telorun/timer')[0].kinds
        onlyThePublisher: !cel >-
          steps.parse.result.docs[0].libraries.all(l, l.ref.startsWith('oci://ghcr.io/telorun/'))
        oneLine: !cel "steps.parse.result.docs[0].libraries.all(l, size(l.summary) <= 160)"
      expected:
        timerKinds: [Delay]
        onlyThePublisher: true
        oneLine: true
    invoke:
      kind: Assert.Equals
---
kind: Run.Sequence
metadata: { name: getModuleManifest_ReturnsCachedYaml }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: get_module_manifest
      arguments:
        ref: oci://ghcr.io/telorun/timer
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  # Projected to the two facts this route owes a caller — the whole owner doc
  # carries a description, version and exports that move with every release.
  # The keys are `docKind` / `moduleName`, not `kind` / `name`: a literal object
  # carrying a `kind` key reads as an inline resource definition.
  - name: assert
    inputs:
      actual:
        docKind: !cel "steps.parse.result.docs[0].kind"
        moduleName: !cel "steps.parse.result.docs[0].metadata.name"
      expected:
        docKind: Telo.Library
        moduleName: Timer
    invoke:
      kind: Assert.Equals
---
# Same refusal as the HTTP route: an application's runtime reach is not indexed.
# The call must fail — reaching the step after it is itself the failure.
kind: Run.Sequence
metadata: { name: searchResources_RefusesRuntimeForApplications }
steps:
  - name: refused
    try:
      - name: call
        invoke: !ref mcpToolCall
        inputs:
          name: search_resources
          arguments:
            query: agent
            runtime: rust
            entry: [application]
      - name: answered
        throw:
          code: ERR_TEST_EXPECTED_REFUSAL
          message: search_resources answered a runtime filter over applications
    catch:
      - name: assert
        inputs:
          actual:
            code: !cel "error.code"
            rpcCode: !cel "error.data.code"
            teloCode: !cel "error.data.data.code"
          expected:
            code: ERR_MCP_JSON_RPC_ERROR
            rpcCode: -32602
            teloCode: ERR_RUNTIME_FILTER_UNSUPPORTED
        invoke:
          kind: Assert.Equals
---
# A tool's arguments are not validated against its `argumentsSchema`, so an
# unknown entry type reaches the search — which refuses it rather than answering
# with the empty set it would otherwise select.
kind: Run.Sequence
metadata: { name: searchResources_RefusesUnknownEntryType }
steps:
  - name: refused
    try:
      - name: call
        invoke: !ref mcpToolCall
        inputs:
          name: search_resources
          arguments:
            query: delay
            entry: [kinds]
      - name: answered
        throw:
          code: ERR_TEST_EXPECTED_REFUSAL
          message: search_resources answered an unknown entry type
    catch:
      - name: assert
        inputs:
          actual:
            rpcCode: !cel "error.data.code"
            teloCode: !cel "error.data.data.code"
          expected:
            rpcCode: -32602
            teloCode: ERR_UNKNOWN_ENTRY_TYPE
        invoke:
          kind: Assert.Equals
---
# get_module mirrors GET /module: keyed facts about the seeded timer module,
# not ranked hits — the kind list carries its Delay kind either way.
kind: Run.Sequence
metadata: { name: getModule_ReturnsTrackedModuleFacts }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: get_module
      arguments:
        ref: oci://ghcr.io/telorun/timer
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        moduleRef: !cel "steps.parse.result.docs[0].module.ref"
        foundDelayKind: !cel "steps.parse.result.docs[0].kinds.exists(k, k.kind == 'Delay')"
      expected:
        moduleRef: oci://ghcr.io/telorun/timer
        foundDelayKind: true
    invoke:
      kind: Assert.Equals
---
# list_module_versions mirrors GET /module/versions: the pin an agent needs to
# write a reproducible `imports:` entry.
kind: Run.Sequence
metadata: { name: listModuleVersions_ReturnsPinnedVersions }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: list_module_versions
      arguments:
        ref: oci://ghcr.io/telorun/timer
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        ref: !cel "steps.parse.result.docs[0].ref"
        hasVersions: !cel "steps.parse.result.docs[0].versions.size() > 0"
        firstHasVersionField: !cel "'version' in steps.parse.result.docs[0].versions[0]"
      expected:
        ref: oci://ghcr.io/telorun/timer
        hasVersions: true
        firstHasVersionField: true
    invoke:
      kind: Assert.Equals
---
# find_implementations mirrors GET /implementations: the seeded redis and
# memory backends both extend kv-store's Store abstract from their own module.
kind: Run.Sequence
metadata: { name: findImplementations_ListsKvStoreBackends }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: find_implementations
      arguments:
        ref: oci://ghcr.io/telorun/kv-store
        kind: Store
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        foundRedis: !cel >-
          steps.parse.result.docs[0].implementations.exists(i,
            i.ref == 'oci://ghcr.io/telorun/kv-store-redis')
        foundMemory: !cel >-
          steps.parse.result.docs[0].implementations.exists(i,
            i.ref == 'oci://ghcr.io/telorun/kv-store-memory')
      expected:
        foundRedis: true
        foundMemory: true
    invoke:
      kind: Assert.Equals
---
# find_instances mirrors GET /instances: the seeded language packs each export
# one model of tesseract-model's `Language` kind and define no kind of their own.
# They are seeded from the checkout, so the kind's owner is the local ref their
# relative import resolves to.
kind: Run.Sequence
metadata: { name: findInstances_ListsSeededLanguagePacks }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: find_instances
      arguments:
        ref: ./modules/tesseract-model
        kind: Language
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual: !cel >-
        ['pol', 'deu', 'fra'].map(code,
          steps.parse.result.docs[0].instances.exists(i,
            i.name == code && i.module.ref == './modules/tesseract-lang/' + code))
      expected: [true, true, true]
    invoke:
      kind: Assert.Equals
---
# list_categories mirrors GET /categories: browsable without a search query.
kind: Run.Sequence
metadata: { name: listCategories_CarriesSchedulingSlug }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: list_categories
      arguments: {}
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        knowsScheduling: !cel "steps.parse.result.docs[0].categories.exists(c, c.category == 'scheduling')"
      expected:
        knowsScheduling: true
    invoke:
      kind: Assert.Equals
---
# suggest_module_refs mirrors GET /refs: lexical typeahead, not semantic search.
kind: Run.Sequence
metadata: { name: suggestModuleRefs_ResolvesPartialToken }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: suggest_module_refs
      arguments:
        query: consol
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        foundConsole: !cel >-
          steps.parse.result.docs[0].refs.exists(r, r.ref == 'oci://ghcr.io/telorun/console')
      expected:
        foundConsole: true
    invoke:
      kind: Assert.Equals
---
# find_dependents answers in the short form a model is re-sent: ref, name and a
# one-sentence summary, never the whole description, with the total and paging.
kind: Run.Sequence
metadata: { name: findDependents_ListsImportersInOneLine }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: find_dependents
      arguments:
        ref: oci://ghcr.io/telorun/kv-store
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: one
    invoke: !ref mcpToolCall
    inputs:
      name: find_dependents
      arguments:
        ref: oci://ghcr.io/telorun/kv-store
        limit: 1
  - name: parseOne
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.one.result.content[0].text"
  - name: assert
    inputs:
      actual: !cel >-
        {'of': steps.parse.result.docs[0].of.ref,
         'memory': steps.parse.result.docs[0].dependents.exists(d, d.ref == 'oci://ghcr.io/telorun/kv-store-memory'),
         'countsAll': steps.parse.result.docs[0].total == size(steps.parse.result.docs[0].dependents),
         'summarised': steps.parse.result.docs[0].dependents.all(d,
           has(d.summary) && size(d.summary) <= 160 && !has(d.description)),
         'paged': size(steps.parseOne.result.docs[0].dependents),
         'pagedTotal': steps.parseOne.result.docs[0].total == steps.parse.result.docs[0].total}
      expected:
        of: oci://ghcr.io/telorun/kv-store
        memory: true
        countsAll: true
        summarised: true
        paged: 1
        pagedTotal: true
    invoke:
      kind: Assert.Equals
---
# `publisher` keeps a search inside one host and org; one with no module selects
# nothing rather than being refused.
kind: Run.Sequence
metadata: { name: searchResources_StaysWithinAPublisher }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: search_resources
      arguments:
        query: key value store
        publisher: ghcr.io/telorun
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: none
    invoke: !ref mcpToolCall
    inputs:
      name: search_resources
      arguments:
        query: key value store
        publisher: example.invalid/nobody
  - name: parseNone
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.none.result.content[0].text"
  - name: assert
    inputs:
      actual: !cel >-
        {'some': size(steps.parse.result.docs[0].results[0].modules) > 0,
         'onlyTheirs': steps.parse.result.docs[0].results[0].modules.all(m,
           m.ref.startsWith('oci://ghcr.io/telorun/')),
         'unknownSelectsNothing': size(steps.parseNone.result.docs[0].results[0].modules)}
      expected: { some: true, onlyTheirs: true, unknownSelectsNothing: 0 }
    invoke:
      kind: Assert.Equals
