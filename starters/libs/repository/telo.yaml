kind: Telo.Library
metadata:
  name: NotesRepository
  version: 1.0.0
  description: |
    A reusable `Telo.Library` for a `notes` table: it owns the SQLite connection,
    the schema migration, and typed `SqlRepository` create/read resources, and
    exports them as ready-made singletons. Importers add `Migrate` to their
    `targets` and dispatch to `CreateNote` / `ListNotes` from their own routes —
    no hand-written SQL beyond the migration.
# Where the database lives is the importing application's decision: it passes
# an absolute path, typically from its own `Telo.HostPath` variable.
variables:
  dbFile:
    type: string
    x-telo-type: Telo.HostPath
imports:
  Sql: oci://ghcr.io/telorun/sql@0.25.0#sha256-x8UXPZbNmoCuldq7EAcotw6KfwZr9baCKrRX_8TKaYc
  SQLite: oci://ghcr.io/telorun/sqlite@0.7.0#sha256-iAGE4n-r6dEjTPbJQkAV65pRjILsJI47aderaurBVvs
  SqlRepository: oci://ghcr.io/telorun/sql-repository@0.15.0#sha256-dIsPqsbVC_e3Iv-rjtg29yL_ijW_vYIov8dCq9zLGqk
exports:
  resources:
    - migrate
    - createNote
    - listNotes
---
kind: SQLite.Connection
metadata:
  name: db
file: !cel "variables.dbFile"
---
kind: SQLite.Table
metadata:
  name: notes
table: notes
columns:
  id: { type: integer, primaryKey: true, identity: always }
  title: { type: text, nullable: false }
  body: { type: text }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
tables:
  - !ref notes
---
kind: SqlRepository.Create
metadata:
  name: createNote
connection: !ref db
table: !ref notes
---
kind: SqlRepository.Read
metadata:
  name: listNotes
connection: !ref db
table: !ref notes
