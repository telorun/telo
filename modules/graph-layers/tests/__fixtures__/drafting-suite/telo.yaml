# What drafting promises, once, for every strategy and engine that keeps drafts: a
# session's writes are visible only inside it; a draft is published at once,
# conditionally and idempotently, or discarded whole; a draft the layer moved
# under is refused, rebased, and its conflicts listed in five classes and
# decided by a side, by a side with values set on top, or by an ordinary write;
# deciding can be automated with ordinary steps and any invocable; and a draft
# closed under a running session ends that session.
#
# A run supplies two drafted stores over the same types — `base`, built on
# nothing, and `top`, built on `base` — and runs the sequences in order, starting
# empty. Each sequence keeps to keys of its own prefix and leaves no draft open.
# Nothing here assumes how a strategy stores a draft, how many it lets a layer
# open at once, or which changes it can merge on its own: every conflict is
# built from both sides writing the SAME property.
kind: Telo.Library
metadata:
  name: DraftingGraphSuite
  version: 1.0.0
  description: >-
    Test fixture: the drafting suite over two drafted stores holding people who
    know people.
imports:
  Graph: ../../../../graph
  GraphLayers: ../../..
  Run: ../../../../run
  Assert: ../../../../assert
resources:
  base:
    kind: GraphLayers.DraftedStore
    description: Layer `base`, built on nothing.
  top:
    kind: GraphLayers.DraftedStore
    description: Layer `top`, built on `base`.
  person:
    kind: Graph.Node
    description: People keyed by a text `id`, with a non-null text `name` and an integer `age`.
  knows:
    kind: Graph.Relationship
    description: person → person, with an integer `since`.
exports:
  resources:
    - isolation
    - stale
    - conflicts
    - automation
    - closedDraft
    - cursors
---
kind: Assert.Equals
metadata: { name: check }
---
# What a drain has gathered so far.
kind: Run.Value
metadata: { name: gathered }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [items]
    properties:
      items: { type: array }
value:
  items: !cel "inputs.items"
---
# The scripted decider of the automation sequence: an ordinary invocable that
# answers a conflict with a side. A real one would ask a person, a rules table
# or a model; the graph modules know nothing of which.
kind: Run.Value
metadata: { name: decider }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [class]
    properties:
      class: { type: string }
value:
  take: !cel "inputs.class == 'changed-both' ? 'mine' : 'theirs'"
---
# A decider that is down.
kind: Run.Sequence
metadata: { name: deciderDown }
steps:
  - name: refuse
    throw: { code: ERR_DECIDER_DOWN, message: "the decider is not answering" }
---
kind: Graph.CreateNode
metadata: { name: topCreatePerson }
store: !ref top
node: !ref person
---
kind: Graph.GetNode
metadata: { name: topGetPerson }
store: !ref top
node: !ref person
---
kind: Graph.MergeNode
