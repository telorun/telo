modules:
  apps/authoring-agent: Added
body: "The agent finds and reads large files without reading them whole: read_file takes
  offset and limit and answers those lines under a [lines A-B of N of <path>] header,
  and the new search_files tool answers every line under a directory matching an RE2
  pattern as path:line: text (files past maxSearchFileBytes named, not read; at most
  maxSearchMatches lines). The system prompt gains a procedure for a pasted runtime
  error: locate where the failing expression is written (get_kinds with implementation:
  true for a published kind), read only that range, reproduce it in a probe, and say
  when the defect is a published module's or the runtime's rather than moving import
  pins on a guess."
