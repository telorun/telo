kind: Telo.Application
metadata:
  name: ShellCommandBasics
  version: 1.0.0
  description: |
    Shell.Command runs commands on a Shell.LocalHost: captures stdout, returns a
    non-zero exit code (rather than throwing), honors shell features (pipes),
    merges the host's base env with the per-call overlay, and takes a `timeoutMs`
    an expression computes.
imports: { Shell: ../, Run: ../../run, Assert: ../../assert }
targets:
  - !ref test
---
kind: Shell.LocalHost
metadata: { name: local }
env: { GREETING: hi }
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: echo
    inputs: { command: "printf hello" }
    invoke:
      kind: Shell.Command
      host: !ref local

  - name: fail
    inputs: { command: "exit 3" }
    invoke:
      kind: Shell.Command
      host: !ref local

  - name: pipe
    inputs: { command: "printf X | cat" }
    invoke:
      kind: Shell.Command
      host: !ref local

  - name: env
    inputs: { command: 'printf %s "$GREETING-$NAME"', env: { NAME: world } }
    invoke:
      kind: Shell.Command
      host: !ref local

  # A `!cel` integer is a 64-bit integer, not the number a YAML literal is.
  - name: timed
    inputs:
      command: "printf timed"
      timeoutMs: !cel "5000"
    invoke:
      kind: Shell.Command
      host: !ref local

  - name: assert
    inputs:
      actual:
        echoOut: !cel "steps.echo.result.stdout"
        echoCode: !cel "steps.echo.result.exitCode"
        failCode: !cel "steps.fail.result.exitCode"
        pipeOut: !cel "steps.pipe.result.stdout"
        envOut: !cel "steps.env.result.stdout"
        timedOut: !cel "steps.timed.result.stdout"
      expected:
        echoOut: hello
        echoCode: 0
        failCode: 3
        pipeOut: X
        envOut: hi-world
        timedOut: timed
    invoke: { kind: Assert.Equals }
