        to, reloaded and left with the browser's back button.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          title: Name
          description: The name the open surface is addressed under, letters and digits.
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9]*$"
---
# Where a filter bar's controls sit relative to what they filter. Each way of
# sitting is a kind of its own.
kind: Telo.Abstract
metadata:
  name: FilterPlacement
  description: >-
    Where the controls of a filter bar sit relative to the content they filter:
    in a row above it, in a sidebar beside it, folded behind a toggle, or in an
    overlay opened from a button. Provides the layout a renderer draws the
    filters with, including what replaces it on a narrow viewport.
capability: Telo.Provider
outputType: !ref FilterPlacementSpec
---
# A placement that folds the controls away until the viewer asks for them: what
# a placement's `compact` names.
kind: Telo.Abstract
metadata:
  name: FoldingFilterPlacement
  description: >-
    Filter controls folded away until the viewer asks for them: behind a
    toggle showing how many filters are active, or in an overlay opened from
    a button. Keeps a narrow screen for the content, so it is what replaces a
    filter bar's placement on a narrow viewport.
capability: Telo.Provider
extends: Self.FilterPlacement
---
kind: Telo.Definition
metadata:
  name: AbovePlacement
  description: >-
    Filter controls in a row above the content they filter: the classic
    filter bar over a data grid, wrapping onto further lines as filters are
    added. Can name a folding replacement for narrow viewports, where a row of
    controls would push the content off the screen.
capability: Telo.Provider
extends: Self.FilterPlacement
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#AbovePlacementController]
schema:
  type: object
  additionalProperties: false
  properties:
    compact:
      title: Compact
      description: >-
        The placement used instead on a narrow viewport: a
        `Ui.FoldingFilterPlacement`, one that folds the controls away.
      x-telo-ref: { kind: Self.FoldingFilterPlacement, use: dependency }
  x-telo-referrer-rules:
    - referrer: Self.Filters
      severity: warning
      condition: !cel >-
        has(self.compact)
        || (has(referrer.policy) && has(referrer.policy.show) && referrer.policy.show == 'chosen')
        || !has(referrer.fields)
        || !referrer.fields.exists(f, 'pinned' in f && f.pinned)
      code: UI_FILTER_PINNED_UNUSED
      message: >-
        pins a field, but nothing folds: every filter is on show whatever is
        pinned. Give the placement a `compact`, use a placement that folds, show
        only the `chosen` filters, or remove `pinned`.
---
kind: Telo.Definition
metadata:
  name: AsidePlacement
  description: >-
    Filter controls in a sidebar beside the content they filter: faceted
    search with the filters stacked in a column at the start or end edge and
    the results next to them. On a narrow viewport, where there is no room for
    a second column, the controls fold behind a toggle, or into the folding
    placement it names.
capability: Telo.Provider
extends: Self.FilterPlacement
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#AsidePlacementController]
schema:
  type: object
  additionalProperties: false
  properties:
    side:
      title: Side
      description: The edge of the content the controls sit at.
      enum: [start, end]
      default: start
    compact:
      title: Compact
      description: >-
        The placement used instead on a narrow viewport: a
        `Ui.FoldingFilterPlacement`, one that folds the controls away.
        Omitted, a `Ui.CollapsiblePlacement` with its defaults.
      x-telo-ref: { kind: Self.FoldingFilterPlacement, use: dependency }
---
kind: Telo.Definition
metadata:
  name: CollapsiblePlacement
  description: >-
    Filter controls folded behind a toggle that shows how many filters are
    active: a collapsible filter section the viewer expands when needed, so
    the content keeps the space. Opens folded or unfolded, and remembers what
    the viewer last chose where the bar keeps its state.
capability: Telo.Provider
extends: Self.FoldingFilterPlacement
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#CollapsiblePlacementController]
schema:
  type: object
  additionalProperties: false
  properties:
    open:
      title: Open
      description: Whether the controls are unfolded to begin with. A stored fold state overrides it.
      type: boolean
      default: false
---
kind: Telo.Definition
metadata:
  name: OverlayPlacement
  description: >-
    Filter controls in an overlay opened from a button that shows how many
    filters are active: a filter dialog, a filter drawer sliding in from an
    edge, or a popover under the button, closed with Done. Suits narrow
    viewports and screens with many filters.
capability: Telo.Provider
extends: Self.FoldingFilterPlacement
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#OverlayPlacementController]
schema:
  type: object
  additionalProperties: false
  required: [surface]
  properties:
    surface:
      title: Surface
      description: The overlay the controls open in.
      x-telo-ref: { kind: Self.Overlay, use: dependency }
---
# Where a piece of interface keeps its state between visits. A store is a
# kind, so another place to keep it is another kind and nothing that names one
# changes.
kind: Telo.Abstract
metadata:
  name: StateStore
  description: >-
    Where a piece of interface keeps its state between visits, so a viewer
    finds a screen as they left it: the filters they chose, the sections they
    unfolded. Provides the place a renderer persists that state to.
capability: Telo.Provider
outputType: !ref StateStoreSpec
---
kind: Telo.Definition
metadata:
  name: LocalStore
  description: >-
    Keeps interface state in the browser's local storage: chosen filters and
    unfolded sections survive closing the tab and the browser, and are shared
    by every tab of the same application on that device. Nothing is sent to the
    server.
capability: Telo.Provider
extends: Self.StateStore
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#LocalStoreController]
schema: { type: object, additionalProperties: false }
---
kind: Telo.Definition
metadata:
  name: SessionStore
  description: >-
    Keeps interface state in the browser's session storage: chosen filters and
    unfolded sections survive a reload, belong to one tab only, and are gone
    when the tab is closed. Nothing is sent to the server.
capability: Telo.Provider
extends: Self.StateStore
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#SessionStoreController]
schema: { type: object, additionalProperties: false }
---
# How an application's navigation tree is drawn. Each way of drawing it is a
# kind of its own.
kind: Telo.Abstract
metadata:
  name: NavigationPlacement
  description: >-
    How an application's site navigation is drawn: a menu bar in the header
    with dropdowns and submenus, a sidebar collapsing to a narrow rail, the
    whole tree behind a menu button in a drawer, or a bottom tab bar. Provides
    the layout a renderer draws the navigation with, including what replaces
    it on a narrow viewport.
capability: Telo.Provider
outputType: !ref NavigationPlacementSpec
---
# A way of drawing the navigation that suits a narrow viewport: what a
# placement's `compact` names.
kind: Telo.Abstract
metadata:
  name: CompactNavigationPlacement
  description: >-
    A way of drawing site navigation that fits a phone screen, such as a menu
    button opening the whole tree in a drawer or a bottom tab bar. Used in
    place of a wider navigation layout below the application's breakpoint.
capability: Telo.Provider
extends: Self.NavigationPlacement
---
kind: Telo.Definition
metadata:
  name: HeaderNavigation
  description: >-
    Site navigation as a menu bar in the application header: pages and links
    in a row, groups opening as dropdowns, nested groups as submenus, and what
    does not fit moved under More. Replaced on a narrow viewport by a compact
    navigation, a menu button with a drawer unless another is named.
capability: Telo.Provider
extends: Self.NavigationPlacement
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#HeaderNavigationController]
schema:
  type: object
  additionalProperties: false
  properties:
    compact:
      title: Compact
      description: >-
        The navigation used instead on a narrow viewport. Omitted, a
        `Ui.OverlayNavigation` with its defaults.
      x-telo-ref: { kind: Self.CompactNavigationPlacement, use: dependency }
---
kind: Telo.Definition
metadata:
  name: SidebarNavigation
  description: >-
    Site navigation as a sidebar beside the page: pages and links in a column,
    groups expanding in place, several open at once. Can collapse to a narrow
    rail whose groups open as flyouts, and remembers the open groups and
    the collapsed rail between visits. Replaced on a narrow viewport by a
    compact navigation, a drawer from the same side unless another is named.
capability: Telo.Provider
extends: Self.NavigationPlacement
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#SidebarNavigationController]
schema:
  type: object
  additionalProperties: false
  properties:
    side:
      title: Side
      description: The edge of the page the sidebar sits at.
      enum: [start, end]
      default: start
    rail:
      title: Rail
      description: >-
        Lets the viewer collapse the sidebar to a rail of each top-level
        entry's icon, or its first letter when it has none, its groups opening
        beside it. Omitted, the sidebar does not collapse.
      type: object
      additionalProperties: false
      properties:
        collapsed:
          title: Collapsed
          description: Whether the sidebar starts collapsed. A stored choice overrides it.
          type: boolean
          default: false
    store:
      title: Store
      description: >-
        Where the open groups and whether the rail is collapsed are kept
        between visits. Omitted, in memory only.
      x-telo-ref: { kind: Self.StateStore, use: dependency }
    compact:
      title: Compact
      description: >-
        The navigation used instead on a narrow viewport. Omitted, a
        `Ui.OverlayNavigation` whose drawer slides in from the sidebar's side,
        with its other defaults.
      x-telo-ref: { kind: Self.CompactNavigationPlacement, use: dependency }
---
kind: Telo.Definition
metadata:
  name: OverlayNavigation
  description: >-
    Site navigation behind a menu button: the whole tree, groups expanding in
    place, in a drawer, dialog or popover the button opens. Suits phones and
    applications with many pages; a drawer sliding in from the start edge
    unless another surface is named.
capability: Telo.Provider
extends: Self.CompactNavigationPlacement
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#OverlayNavigationController]
schema:
  type: object
  additionalProperties: false
  properties:
    surface:
      title: Surface
      description: >-
        The overlay the tree opens in. Omitted, a `Ui.Drawer` sliding in from
        the start edge, with its other defaults.
      x-telo-ref: { kind: Self.Overlay, use: dependency }
---
kind: Telo.Definition
metadata:
  name: TabBarNavigation
  description: >-
    Site navigation as a bottom tab bar, as phone apps have: the top-level
    pages and links as tabs along the bottom edge, a group opening its entries
    in a bottom sheet, and what does not fit under More. Suits phones, and
    applications with a few main sections on any screen.
capability: Telo.Provider
extends: Self.CompactNavigationPlacement
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#TabBarNavigationController]
schema:
  type: object
  additionalProperties: false
  properties:
    visible:
      title: Visible
      description: >-
        How many tabs the bar shows at most. With more top-level entries, the
        last tab is More, holding the rest.
      type: integer
      minimum: 2
      maximum: 5
      default: 5
    surface:
      title: Surface
      description: >-
        The overlay a group's or More's entries open in, in a column. Omitted,
        a `Ui.Drawer` sliding in from the bottom edge, with its other
        defaults.
      x-telo-ref: { kind: Self.Overlay, use: dependency }
---
# A glyph drawn beside text. Each source of glyphs is a kind of its own — a
# file of the application's, an icon set's named glyph — and every one provides
# the one image file the glyph is.
kind: Telo.Abstract
metadata:
  name: Icon
  description: >-
    A single-colour glyph shown beside text, such as the icon of a menu entry
    or a sidebar link. Provides the one image file it is drawn from; a renderer
    serves the file by its content digest and paints its shape in the colour
    of the text around it, so a theme colours an icon as it colours text.
capability: Telo.Provider
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [file]
    properties:
      file:
        title: File
        description: >-
          The image the glyph is drawn from: an SVG, PNG or WebP file whose
          opaque pixels are the glyph's shape.
        x-telo-type: { name: Telo.HostPath, entry: file }
---
kind: Telo.Definition
metadata:
  name: FileIcon
  description: >-
    An icon drawn from an image file of your own, such as a brand mark or a
    symbol no icon set has: an SVG, PNG or WebP image whose shape is painted in
    the colour of the text beside it.
capability: Telo.Provider
extends: Self.Icon
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#FileIconController]
schema:
  type: object
  additionalProperties: false
  required: [file]
  properties:
    file:
      title: File
      description: >-
        The image the glyph is drawn from: an SVG, PNG or WebP file whose
        opaque pixels are the glyph's shape. Write `!module-path` for a file
        that ships with the module.
      x-telo-type: { name: Telo.HostPath, entry: file }
---
# How one button is drawn, as a renderer receives it: by its text alone, or by a
# glyph. `icon` is the glyph's file, addressed like every file a node carries;
# null means the look's own glyph for the button's meaning.
kind: Telo.JsonSchema
metadata: { name: ButtonDisplaySpec }
schema:
  oneOf:
    - additionalProperties: false
      required: [type]
      properties: { type: { const: text } }
    - additionalProperties: false
      required: [type, icon, label]
      properties:
        type: { const: icon }
        icon:
          anyOf:
            - { $ref: "telo:Ui/SpecNode#/$defs/AssetRef" }
            - { type: "null" }
        label: { enum: [shown, hidden] }
---
# How a button is drawn. Each way is a kind of its own, so a key that only
# means something for one (a glyph) cannot be written on the other.
kind: Telo.Abstract
metadata:
  name: ButtonDisplay
  description: >-
    How one button of an interface is drawn: as its text, or as a glyph with
    the text as its accessible name and tooltip. Provides what a renderer draws
    the button from, so a button can be an icon without changing what it does
    or says.
capability: Telo.Provider
outputType:
  kind: Telo.JsonSchema
  schema:
    oneOf:
      - additionalProperties: false
        required: [type]
        properties: { type: { const: text } }
      - additionalProperties: false
        required: [type, icon, label]
        properties:
          type: { const: icon }
          icon:
            anyOf:
              - type: object
                additionalProperties: false
                required: [file]
                properties: { file: { x-telo-type: Telo.HostPath } }
              - { type: "null" }
          label: { enum: [shown, hidden] }
---
kind: Telo.Definition
metadata:
  name: TextButton
  description: >-
    A button drawn as its text alone, the way buttons are drawn unless said
    otherwise.
capability: Telo.Provider
extends: Self.ButtonDisplay
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#TextButtonController]
schema: { type: object, additionalProperties: false }
---
kind: Telo.Definition
metadata:
  name: IconButton
  description: >-
    A button drawn as a glyph: an icon of your own, or the look's glyph for what
    the button does. The button's text is its accessible name and tooltip, and
    can also be shown beside the glyph.
capability: Telo.Provider
extends: Self.ButtonDisplay
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#IconButtonController]
schema:
  type: object
  additionalProperties: false
  properties:
    icon:
      title: Icon
      description: >-
        The glyph. Omitted, the look draws its own glyph for what the button
        does.
      x-telo-ref: { kind: Self.Icon, use: dependency }
    label:
      title: Label
      description: >-
        Whether the text is drawn beside the glyph or only named to assistive
        technology and shown as a tooltip.
      enum: [shown, hidden]
      default: hidden
---
# How wide a page's content is drawn: within the look's measure, or across all
# the room it has. The one definition of the values; every place an author
# writes a width names it.
kind: Telo.JsonSchema
metadata: { name: PageWidth }
schema:
  title: Page width
  description: >-
    `contained` draws the page's content no wider than the look's page measure
    (the `width.page` design token), centred; `full` lets it take all the room
    it has.
  enum: [contained, full]
---
# How a split view's aside and a list layout's records are set against their
# surroundings. The one definition of the values; every place an author writes
# one names it.
kind: Telo.JsonSchema
metadata: { name: Frame }
schema:
  title: Frame
  description: >-
    `framed` draws the element as a bordered, rounded panel of its own on the
    surface background, spaced from its neighbours by the gap. `flush` draws it
    with no frame and no gap, set against its neighbour by a divider line.
  enum: [framed, flush]
---
# How a record's row actions are drawn. The one definition of the values;
# `Ui.Listing` and the `list` node name it.
kind: Telo.JsonSchema
metadata: { name: RowActionsDisplay }
schema:
  title: Row actions display
  description: >-
    `inline` draws each action as a button on its record; `menu` folds them,
    with edit and delete, into one menu button; `auto` draws them inline while
    they fit the room the layout gives them and as a menu when they do not.
  enum: [auto, inline, menu]
---
# One page of an application: its address, its title and its nodes. Its
# composites are resolved once, when it is created; the application invokes it
# per request with the request, and it answers the page as delivered for it.
kind: Telo.Definition
metadata:
  name: Page
  description: >-
    One screen of a web application at its own address: a title and a tree of
    layout, text, data grids, forms and custom components, whose parts can be
    shown per request by a header such as a role or a tenant. Listed by an
    application to route to it and named in its navigation menu.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#PageController]
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [request]
    properties:
      request:
        type: object
        additionalProperties: false
        required: [headers]
        properties:
          headers: { type: object, additionalProperties: { type: string } }
          ip: { type: string }
          lang: { type: string, description: The language negotiated for the request. }
      # The application's width, used when the page declares none.
      pageWidth: { $ref: "telo://Self/PageWidth" }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, title, query, width, children]
    properties:
      path: { type: string }
      title: { $ref: "telo://manifest#/$defs/TextRecord" }
      query: { type: object }
      # The page's own width, else the one it was invoked with, else `contained`.
      width: { $ref: "telo://Self/PageWidth" }
      # Each a `Ui.SpecNode`, judged by the page: one that is not valid is
      # replaced by an error node.
      children: { type: array, items: { type: object, required: [type] } }
schema:
  type: object
  additionalProperties: false
  required: [path, title, children]
  properties:
    path:
      title: Path
      description: >-
        The page's address under the application's mount: `/` followed by
        anything but `/` or `\`, holding no control character, and not under
        `/_telo`.
      $ref: "telo://Self/AppRelativeReference"
      not: { pattern: "^/_telo(/|$)" }
    title:
      title: Title
      description: Shown above the page, and in the navigation unless an entry says otherwise.
      $ref: "telo://manifest#/$defs/Text"
      x-telo-text-values: {}
    query:
      title: Query
      description: >-
        The query parameters the page's nodes read, each a string or a list of
        strings for a key given more than once. Read as `query` by a condition
        or a value the browser draws.
      $ref: "telo://Self/QueryParameters"
    width:
      title: Width
      description: >-
        How wide the page's content is drawn: `contained` within the look's
        page measure, centred, or `full` across all the room it has. Omitted,
        the application's width applies.
      $ref: "telo://Self/PageWidth"
    children:
      title: Children
      description: >-
        The page's nodes, top to bottom. Each node's `when:` and text values
        may read the request, evaluated per request; a `shown` condition and a
        `value` or `list` node read `query` in the browser.
      type: array
      items: { $ref: "telo://Self/Node" }
      x-telo-context:
        type: object
        properties:
          request:
            x-telo-context-eval: runtime
            type: object
            properties:
              headers: { type: object, additionalProperties: { type: string } }
              ip: { type: string }
              lang: { type: string, description: The language negotiated for the request. }
          query:
            x-telo-context-eval: accessor
            x-telo-context-from: query
            type: object
            properties: {}
            additionalProperties: false
---
kind: Telo.Definition
metadata:
  name: View
  description: >-
    A fragment of a page declared once and placed wherever it is needed: a
    header, a summary panel, a section combining text, layout and data grids.
    Holds one node tree and provides it resolved, so a library can ship ready
    interface sections that an application drops into its own pages.
capability: Telo.Provider
extends: Self.Composite
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ViewController]
schema:
  type: object
  additionalProperties: false
  required: [content]
  properties:
    content:
      title: Content
      description: The node this view stands for.
      $ref: "telo://Self/Node"
---
kind: Telo.Definition
metadata:
  name: Data
  description: >-
    Loads a record when a page is drawn and shows content built from it: an
    account panel, a sign-in gate, a context card over one API answer. Draws a
    loading state before the first answer and a failure state for a refused
    read, reloads on window focus or when a request inside answers 401, and
    passes declared page query parameters to the read.
capability: Telo.Provider
extends: Self.Composite
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#DataController]
schema:
  type: object
  x-telo-text-keys: [Self.Translations]
  additionalProperties: false
  required: [model, source, content]
  examples:
    - model:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [authorized]
          properties: { authorized: { type: boolean }, email: { type: string } }
      source: { path: /api/auth }
      reloadOn: [focus, unauthorized]
      content:
        type: stack
        children:
          - type: value
            value: !cel "data.email"
            shown:
              at: !cel "data.authorized"
              matches: { const: true }
  properties:
    model:
      title: Model
      description: The shape of the record the read answers with.
      x-telo-ref: { kind: Telo.Type, use: schema }
    query:
      title: Query
      description: >-
        The page query parameters this reader reads, each a string or a list of
        strings for a key given more than once. Read as `query`.
      $ref: "telo://Self/QueryParameters"
    source:
      title: Source
      description: >-
        Where the record is read from with `GET`: an app-relative path, or a
        path template filled from `query` with query parameters appended. A
        value that holds nothing leaves the read unsent.
      $ref: "telo://Self/RequestTarget"
      x-telo-context:
        type: object
        properties:
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
    content:
      title: Content
      description: What is drawn once an answer is in, over `data` and `query`.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          data: { x-telo-context-from-root: "model", x-telo-context-eval: accessor }
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
    loading:
      title: Loading
      description: What is drawn before the first answer. Omitted, the muted text `loading`.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
    failure:
      title: Failure
      description: >-
        What is drawn when the read does not succeed, over `error` and `query`.
        Omitted, the error's code and message.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          error: { x-telo-context-eval: accessor, $ref: "telo://Self/RequestError" }
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
    reloadOn:
      title: Reload on
      description: >-
        What reads the record again: `focus` — the window regains focus or the
        page returns from the back/forward cache — and `unauthorized` — a
        request made inside the content answers 401.
      type: array
      uniqueItems: true
      items: { enum: [focus, unauthorized] }
---
# A collection as the browser reaches it: what it is and where its list
# endpoint is. It carries no relations, so an option source reading it can
# never form a cycle; a kind narrowing `collection` extends this one.
kind: Telo.Definition
metadata:
  name: CollectionSource
  description: >-
    Where a browser reads a collection of records from: the declared
    collection — its record shape, key, accepted filters, sort orders and
    facets — and the app-relative URL of its list endpoint. Written once and
    used by every screen, filter and picker reading those records.
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#CollectionSourceController]
schema:
  type: object
  additionalProperties: false
  required: [collection, basePath]
  properties:
    collection:
      title: Collection
      description: >-
        The collection read: what a record is and what its list request
        accepts.
      x-telo-ref: { kind: DataModel.Collection, use: dependency }
    basePath:
      title: Base path
      description: >-
        App-relative URL of the collection: `/` followed by anything but `/`
        or `\`, holding no control character.
      $ref: "telo://Self/AppRelativeReference"
---
kind: Telo.Definition
metadata:
  name: ConversationSource
  description: >-
    Where a browser talks to a chat endpoint: the conversation — the
    attachments it accepts and the operations it supports — and the
    app-relative URL its routes are served under. Written once and used by every
    chat over that endpoint.
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ConversationSourceController]
schema:
  type: object
  additionalProperties: false
  required: [conversation, basePath]
  properties:
    conversation:
      title: Conversation
      description: The conversation endpoint, read for what it offers before any message.
      x-telo-ref: { kind: Conversation.Conversation, use: dependency }
    basePath:
      title: Base path
      description: >-
        App-relative URL the conversation's routes are served under: `/`
        followed by anything but `/` or `\`, holding no control character.
      $ref: "telo://Self/AppRelativeReference"
---
kind: Telo.Definition
metadata:
  name: Chat
  description: >-
    A full AI chat on a page: streamed replies with formatted text, reasoning,
    tool calls and approvals, attachments and edit-and-resend branches. The
    conversation shown follows a query parameter of the page, so a link opens
    one and a new one is written back; a header of any nodes over the open
    conversation and the chat's own commands (export, copy, stop, new), an
    input placeholder, starter prompts, switches hiding reasoning, tool detail,
    usage or copy, buttons drawn as icons and the composer's layout set how it
    is presented.
capability: Telo.Provider
extends: Self.Composite
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ChatController]
schema:
  type: object
  x-telo-text-keys: [Self.Translations]
  additionalProperties: false
  required: [source]
  properties:
    source:
      title: Source
      description: The conversation endpoint the chat talks to and where it is served.
      x-telo-ref: { kind: Self.ConversationSource, use: dependency }
    header:
      title: Header
      description: >-
        Nodes drawn top to bottom above the transcript, over `conversation`
        (the open conversation's summary, null for a new one) and `chat` (its
        commands). Omitted, a bar holding the export command; `[]` draws no header.
      type: array
      items: { $ref: "telo://Self/Node" }
      x-telo-context:
        type: object
        properties:
          conversation:
            x-telo-context-eval: accessor
            anyOf: [{ $ref: "telo:Conversations/ConversationSummary" }, { type: "null" }]
          chat:
            x-telo-context-eval: accessor
            type: object
            additionalProperties: false
            required: [exportTranscript, copyTranscript, stop, newConversation]
            properties:
              exportTranscript: { description: Downloads the transcript as Markdown; runs once it holds a message., $ref: "telo://Self/Command" }
              copyTranscript: { description: Copies the transcript as Markdown; runs once it holds a message., $ref: "telo://Self/Command" }
              stop: { description: Stops the reply being written; offered where the endpoint can cancel., $ref: "telo://Self/Command" }
              newConversation: { description: Opens a new conversation; runs while one is open or a message is drafted., $ref: "telo://Self/Command" }
    placeholder:
      title: Placeholder
      description: >-
        Shown in the empty message box. Omitted, none is drawn; the box's
        accessible name does not depend on it.
      $ref: "telo://manifest#/$defs/Text"
      x-telo-text-values: {}
    starters:
      title: Starters
      description: >-
        Prompts offered on an empty conversation. A bare text, or `{ prompt, onChoose }`
        where `onChoose` is `send` (default; choosing sends the prompt) or `fill` (puts the
        prompt in the message box, sending nothing).
      type: array
      items:
        anyOf:
          - { $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
          - type: object
            additionalProperties: false
            required: [prompt]
            properties:
              prompt: { $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
              onChoose: { enum: [send, fill], default: send }
    show:
      title: Show
      description: >-
        Switches hiding what the chat draws. A switch only hides a surface; none
        shows one the conversation does not offer.
      type: object
      additionalProperties: false
      properties:
        reasoning: { title: Reasoning, description: The model's reasoning., type: boolean, default: true }
        toolDetail:
          title: Tool detail
          description: The arguments and result of each tool call.
          type: boolean
          default: true
        usage: { title: Usage, description: Token usage under each reply., type: boolean, default: true }
        copy:
          title: Copy
          description: The button copying a message's text; a code block's own copy button is unaffected.
          type: boolean
          default: true
    buttons:
      title: Buttons
      description: >-
        How each button is drawn, a `Ui.TextButton` or a `Ui.IconButton`. The
        buttons on a message (`copy`, `edit`, `regenerate`) are icons unless
        named here; every other button is drawn by its text.
      type: object
      additionalProperties: false
      properties:
        copy: { title: Copy, description: Copies a message's text., x-telo-ref: { kind: Self.ButtonDisplay, use: dependency } }
        edit: { title: Edit, description: Opens a sent message for editing., x-telo-ref: { kind: Self.ButtonDisplay, use: dependency } }
        regenerate: { title: Regenerate, description: Writes a reply again., x-telo-ref: { kind: Self.ButtonDisplay, use: dependency } }
        attach: { title: Attach, description: Opens the file picker., x-telo-ref: { kind: Self.ButtonDisplay, use: dependency } }
        send: { title: Send, description: Sends the message., x-telo-ref: { kind: Self.ButtonDisplay, use: dependency } }
        stop: { title: Stop, description: Stops the reply being written., x-telo-ref: { kind: Self.ButtonDisplay, use: dependency } }
    composer:
      title: Composer
      description: How the message box and its buttons are laid out.
      type: object
      additionalProperties: false
      properties:
        actions:
          title: Actions
          description: >-
            Where the attach and send (or stop) buttons sit: `inside` the message
            box's frame, after the text, or `outside` it, in a row under the box.
          enum: [inside, outside]
          default: inside
    conversation:
      title: Conversation
      description: >-
        Ties the conversation shown to a query parameter of the page: absent or
        empty is a new conversation, an id opens that conversation, and the one
        the chat creates is written back by replacing the current history entry.
        Omitted, the selection lives in memory and a reload starts a new one.
      type: object
      additionalProperties: false
      required: [parameter]
      properties:
        parameter:
          title: Parameter
          description: The query parameter holding the conversation id.
          type: string
          pattern: "^(?!_telo)(?!(as|break|const|continue|else|false|for|function|if|import|in|let|loop|namespace|null|package|return|true|var|void|while)$)[A-Za-z_][A-Za-z0-9_]*$"
    refreshes:
      title: Refreshes
      description: >-
        Requests read again, over `conversation.id`, when a send is admitted and
        when a turn the chat started or followed ends: every reader whose path
        resolves to one of theirs, a listing of conversations among them.
      type: array
      items: { $ref: "telo://Self/RefreshTarget" }
      x-telo-context:
        type: object
        properties:
          conversation:
            x-telo-context-eval: accessor
            type: object
            required: [id]
            properties: { id: { type: string } }
            additionalProperties: false
---
kind: Telo.Definition
metadata:
  name: SplitView
  description: >-
    A fold-out side panel beside the main content of a page: a list of
    conversations, a navigation tree or a set of filters next to the screen
    they steer. Sits at the start or end edge in one of three widths, folds
    away on request and remembers the choice between visits, and on a narrow
    viewport becomes a sheet or window opened from a button.
capability: Telo.Provider
extends: Self.Composite
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#SplitViewController]
schema:
  type: object
  additionalProperties: false
  required: [label, aside, content]
  properties:
    side:
      title: Side
      description: The edge of the content the aside sits at.
      enum: [start, end]
      default: start
    size:
      title: Size
      description: How wide the aside is.
      enum: [small, medium, large]
      default: medium
    frame:
      title: Frame
      description: >-
        `flush` sets the aside against the content, separated by a divider and
        no gap; `framed` draws it as a bordered panel of its own, spaced from
        the content. Applies while the aside is drawn beside the content.
      $ref: "telo://Self/Frame"
      default: flush
    toggle:
      title: Toggle
      description: >-
        How the button folding the aside away and showing it again is drawn.
        Omitted, a glyph of the look's own with the text as its name and tooltip.
      x-telo-ref: { kind: Self.ButtonDisplay, use: dependency }
    label:
      title: Label
      description: >-
        Names the aside for assistive technology and is the value of the
        button showing and hiding it.
      $ref: "telo://manifest#/$defs/Text"
      x-telo-text-values: {}
    aside:
      title: Aside
      description: >-
        What is drawn beside the content. It stays mounted while folded away.
      type: object
      additionalProperties: false
      required: [content]
      properties:
        actions:
          title: Actions
          description: >-
            Link nodes drawn as buttons under the aside's top bar; folded
            away, they stand under it as glyphs.
          type: array
          items:
            allOf:
              - { $ref: "telo://Self/Node" }
              - { required: [type, button], properties: { type: { const: link } } }
        content:
          title: Content
          description: The nodes the aside holds.
          $ref: "telo://Self/Node"
    content:
      title: Content
      description: What the aside sits beside.
      $ref: "telo://Self/Node"
    collapse:
      title: Collapse
      description: Lets the viewer fold the aside away. Omitted, it never folds on a wide viewport.
      type: object
      additionalProperties: false
      properties:
        collapsed:
          title: Collapsed
          description: Whether the aside starts folded away. A stored choice overrides it.
          type: boolean
          default: false
        state:
          title: State
          description: >-
            Keeps the choice between visits under `key` in `store`; split views
            naming one key share it. Omitted, it is kept in memory only.
          type: object
          additionalProperties: false
          required: [key, store]
          properties:
            key:
              title: Key
              description: The name the choice is kept under, letters and digits.
              type: string
              pattern: "^[A-Za-z][A-Za-z0-9]*$"
            store:
              title: Store
              description: Where the choice is stored between visits.
              x-telo-ref: { kind: Self.StateStore, use: dependency }
    compact:
      title: Compact
      description: >-
        The surface the aside becomes below the application's breakpoint: a
        `Ui.ViewportOverlay` holding it, with neither an address nor a compact
        surface of its own. Omitted, a drawer from the aside's side.
      x-telo-ref: { kind: Self.ViewportOverlay, use: dependency }
  x-telo-resource-rules:
    - resolve: [/compact]
      condition: !cel "!has(self.compact) || !has(self.compact.address)"
      code: UI_SURFACE_COMPACT_ADDRESSED
      message: >-
        names a compact surface that declares an address. The split view has no
        address of its own to stand in for: remove `address` from it.
    - resolve: [/compact]
      condition: !cel "!has(self.compact) || !has(self.compact.compact)"
      code: UI_SURFACE_COMPACT_NESTED
      message: >-
        names a compact surface that declares a compact surface of its own.
        Only one level applies: remove `compact` from it.
---
# How one set of screens shows a collection: its source, and how each related
# record is read and labelled. Listings, filter bars and forms over the same
# records share one.
kind: Telo.Definition
metadata:
  name: CollectionPresentation
  description: >-
    How screens show one collection of records: where they are read from, and
    for each property pointing at another collection's records, where those
    are read, how one is labelled, hinted, linked and searched. Listings show
    the related record's name, filters and forms offer related records to pick.
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#CollectionPresentationController]
schema:
  type: object
  additionalProperties: false
  required: [source]
  properties:
    source:
      title: Source
      description: Where the collection's records are read from.
      x-telo-ref: { kind: Self.CollectionSource, use: dependency }
    relations:
      title: Relations
      description: >-
        How each related record is shown, keyed by a property the collection
        declares a relation for. Omitted, related records are shown by key.
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        required: [source, label]
        properties:
          source:
            title: Source
            description: Where the related records are read from. Its collection is the relation's target.
            x-telo-ref: { kind: Self.CollectionSource, use: dependency }
          label:
            title: Label
            description: How a related record is shown, as a path into it or a fixed text.
            type: string
            x-telo-eval: accessor
            x-telo-context:
              type: object
              properties:
                row: { x-telo-context-eval: accessor, x-telo-context-ref-from: source/collection/model }
          hint:
            title: Hint
            description: Text shown beside the label.
            type: string
            x-telo-eval: accessor
            x-telo-context:
              type: object
              properties:
                row: { x-telo-context-eval: accessor, x-telo-context-ref-from: source/collection/model }
          href:
            title: Link
            description: Where a related record links to, an address over the related `row`.
            $ref: "telo:Ui/Address"
            x-telo-context:
              type: object
              properties:
                row: { x-telo-context-eval: accessor, x-telo-context-ref-from: source/collection/model }
          search:
            title: Search
            description: >-
              The filter what the viewer types is sent as when choosing a related
              record. Omitted, the choices are not searched.
            type: object
            additionalProperties: false
            required: [property, operator]
            properties:
              property: { title: Property, type: string }
              operator: { title: Operator, enum: [eq, contains, gt, gte, lt, lte, in] }
          pageSize:
            title: Page size
            description: >-
              Related records per request, sent as `limit`: a page of choices, and
              at most this many keys per label lookup.
            type: integer
            minimum: 1
            maximum: 100
            default: 25
  x-telo-resource-rules:
    - resolve: [/source/collection]
      in: /relations
      condition: !cel >-
        has(self.source.collection.relations) && key in self.source.collection.relations
      code: UI_RELATION_UNDECLARED
      message: >-
        presents a relation the collection does not declare. Declare it under
        the collection's `relations`, or remove this entry.
    - resolve: [/source/collection, /source/collection/relations/*/collection, /relations/*/source/collection]
      in: /relations
      condition: !cel >-
        !has(self.source.collection.relations) || !(key in self.source.collection.relations)
        || cel.bind(target, self.source.collection.relations[key].collection,
             target.metadata.name == this.source.collection.metadata.name
             && target.metadata.module == this.source.collection.metadata.module)
      code: UI_RELATION_TARGET_MISMATCH
      message: >-
        reads related records from a source whose collection is not the
        relation's target. Point `source` at a source of the collection the
        relation names.
    - resolve: [/relations/*/source/collection]
      in: /relations
      condition: !cel >-
        !('search' in this)
        || this.source.collection.query.filters.exists(f,
             f.property == this.search.property && f.operator == this.search.operator)
      code: UI_RELATION_SEARCH_NOT_ACCEPTED
      message: >-
        searches related records with a property and operator their collection
        does not accept. Declare the pair under that collection's
        `query.filters`, or change `search`.
---
kind: Telo.Definition
metadata:
  name: Listing
  description: >-
    Records of a REST collection read page by page with a cursor — a pager,
    "load more" or infinite scroll — sortable by the viewer, with related
    records shown by name, create, edit and delete forms, row actions,
    conditional row styling and an empty state. Drawn by a layout, a table
    unless another is chosen, with another below a breakpoint.
capability: Telo.Provider
extends: Self.Composite
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ListingController]
schema:
  type: object
  x-telo-text-keys: [Self.Translations]
  additionalProperties: false
  required: [presentation, model]
  properties:
    presentation:
      title: Presentation
      description: >-
        The collection shown and how its related records are labelled. The
        viewer sorts by what its collection lists under `query.sort`.
      x-telo-ref: { kind: Self.CollectionPresentation, use: dependency }
    model:
      title: Model
      description: The shape of one record.
      x-telo-ref: { kind: Telo.Type, use: schema }
    filters:
      title: Filters
      description: >-
        Equalities applied to every request, keyed by model property: a fixed
        value, or a path into `query`. Each is a filter the collection accepts
        with `eq`. While one holds nothing, the listing reads nothing.
      type: object
      x-telo-context:
        type: object
        properties:
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
      additionalProperties:
        type: [string, number, integer, boolean]
        x-telo-eval: accessor
        x-telo-value-schema-from: { from: /model, member: "0#" }
    query:
      title: Query
      description: >-
        The page query parameters its filters and row actions read, each a
        string or a list of strings for a key given more than once. Read as
        `query`.
      $ref: "telo://Self/QueryParameters"
    pageSize:
      title: Page size
      description: >-
        Records per read, sent as `limit`: each page, and each group, period or
        tree level of a layout reading several.
      type: integer
      minimum: 1
      maximum: 100
      default: 25
    paging:
      title: Paging
      description: >-
        How further pages are reached: a pager that replays the pages already
        read (`pages`), a "Load more" control appending the next (`more`), or
        the next loaded as the end comes into view, the control kept at the
        end (`scroll`). Both layouts follow it.
      enum: [pages, more, scroll]
      default: pages
    sort:
      title: Sort
      description: >-
        The order of the records. `by` is the order they start in, a
        `query.sort` property of the collection; `choosable: false` draws no
        sort control and no sortable header, and without `by` keeps the
        collection's own order.
      type: object
      additionalProperties: false
      properties:
        by:
          title: By
          type: object
          additionalProperties: false
          required: [property]
          properties:
            property: { title: Property, description: The record property to order by., type: string }
            direction: { title: Direction, enum: [ascending, descending], default: ascending }
        choosable:
          title: Choosable
          description: Whether the viewer may choose another order.
          type: boolean
          default: true
    show:
      title: Show
      description: What the listing shows besides its records.
      type: object
      additionalProperties: false
      properties:
        count:
          title: Count
          description: >-
            Whether the number of records is shown, in the pager and in each
            group's heading.
          type: boolean
          default: true
    rowStyle:
      title: Style rule
      description: Styles chosen by a value of the record, on its element in every layout.
      type: object
      additionalProperties: false
      required: [by, cases]
      properties:
        by:
          title: By
          x-telo-eval: accessor
          x-telo-context:
            type: object
            properties: { row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor } }
        cases:
          title: Cases
          description: Styles keyed by the plain text of the value.
          type: object
          additionalProperties: { $ref: "#/$defs/Style" }
        default: { $ref: "#/$defs/Style" }
    create:
      title: Create
      description: The form that adds a record, and where and how it opens.
      type: object
      additionalProperties: false
      required: [form]
      properties:
        form:
          title: Form
          description: The form opened.
          x-telo-ref: { kind: Self.Form, use: dependency }
        surface:
          title: Surface
          description: Where the form appears. Omitted, a dialog with its defaults.
          x-telo-ref: { kind: Self.Surface, use: dependency }
        afterSubmit:
          title: After submit
          description: >-
            What the form does once the record is saved: `close`, `again` — stay
            open, back at the values a new record starts from, for another — or
            `keep` its values.
          $ref: "telo://Self/AfterCreate"
        unsaved:
          title: Unsaved input
          description: >-
            Whether leaving the form with unsaved input asks first (`confirm`)
            or drops it (`discard`).
          $ref: "telo://Self/UnsavedInput"
    edit:
      title: Edit
      description: The form that changes a record, prefilled from it, and where and how it opens.
      type: object
      additionalProperties: false
      required: [form]
      properties:
        form:
          title: Form
          description: The form opened.
          x-telo-ref: { kind: Self.Form, use: dependency }
        surface:
          title: Surface
          description: Where the form appears. Omitted, a dialog with its defaults.
          x-telo-ref: { kind: Self.Surface, use: dependency }
        afterSubmit:
          title: After submit
          description: >-
            What the form does once the record is saved: `close`, or `keep` it
            open.
          $ref: "telo://Self/AfterEdit"
        unsaved:
          title: Unsaved input
          description: >-
            Whether leaving the form with unsaved input asks first (`confirm`)
            or drops it (`discard`).
          $ref: "telo://Self/UnsavedInput"
    delete:
      title: Delete
      description: Whether each record offers a confirmed delete.
      type: boolean
      default: false
    rowActions:
      title: Row actions
      description: >-
        Operations each record offers, in order, drawn before edit and delete,
        over `row` and `query`. A pressed one draws its action's answer in
        place of its button, kept while that record is shown.
      type: array
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor }
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
      items: { $ref: "telo://Self/RowAction" }
    rowActionsDisplay:
      title: Row actions display
      description: >-
        How each record's actions, with edit and delete, are drawn in every
        layout. `auto` measures the listing's room and folds them into a menu
        when they do not fit.
      $ref: "telo://Self/RowActionsDisplay"
      default: auto
    empty:
      title: Empty
      description: >-
        Drawn where the records would be when the reads answer none. Omitted,
        the text `noRows`.
      $ref: "telo://Self/Node"
    layout:
      title: Layout
      description: >-
        How the records are drawn. Omitted, a table with one column per model
        property but the key.
      x-telo-ref: { kind: Self.ListingLayout, use: call }
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor }
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
    compact:
      title: Compact
      description: >-
        How the records are drawn below the application's breakpoint, keeping
        the listing's state. Omitted, `layout` is drawn at every width.
      x-telo-ref: { kind: Self.ListingLayout, use: call }
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor }
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
  $defs:
    StyleName: { enum: [heading, subheading, muted, strong, accent, danger, warning, success] }
    Style:
      anyOf:
        - { $ref: "#/$defs/StyleName" }
        - { type: array, items: { $ref: "#/$defs/StyleName" } }
  x-telo-resource-rules:
    - resolve: [/model]
      in: /filters
      condition: !cel "has((has(self.model.schema) ? self.model.schema : self.model).properties) && key in (has(self.model.schema) ? self.model.schema : self.model).properties"
      code: UI_SOURCE_FILTER_UNKNOWN_PROPERTY
      message: >-
        filters its source by a property the row model does not declare. Use a
        property of `model`, or add this one to it.
    - resolve: [/presentation/source/collection]
      in: /filters
      condition: !cel >-
        !has(self.presentation.source.collection.query) || !has(self.presentation.source.collection.query.filters)
        || self.presentation.source.collection.query.filters.exists(f, f.property == key && f.operator == 'eq')
      code: UI_SOURCE_FILTER_NOT_ACCEPTED
      message: >-
        filters its source by a property the collection does not accept an
        equality on. Declare it with operator `eq` under the collection's
        `query.filters`, or remove this filter.
    - resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.sort) || !has(self.sort.by)
        || self.presentation.source.collection.query.sort.exists(s, s.property == self.sort.by.property)
      code: UI_LISTING_SORT_NOT_ACCEPTED
      message: >-
        starts sorted by a property the collection does not accept a sort on.
        Declare it under the collection's `query.sort`, or change `sort.by`.
---
# How a listing's records are drawn. The listing calls its layout with its row
# model, its collection and its relations; the layout answers the spec it draws
# them with, or why it cannot. A layout's fit to a listing is a referrer rule on
# the listing, so `telo check` reports what the call refuses.
kind: Telo.Abstract
metadata:
  name: ListingLayout
  description: >-
    How a listing draws its records — table, list, cards, board, calendar,
    timeline, tree or a custom component — and the reads it needs: one per
    group, per shown period or per tree level. Answers, for the listing using
    it, whether it can draw that collection and the renderer-neutral spec.
capability: Telo.Invocable
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [model, collection, relations]
    properties:
      model:
        title: Model
        description: The schema of one record of the listing.
        type: object
      collection:
        title: Collection
        description: The listing's collection — its record shape, key and accepted query.
        type: object
      relations:
        title: Relations
        description: The related records the listing labels, by property.
        type: object
outputType: !ref ListingLayoutAnswer
schema: { type: object }
---
kind: Telo.Definition
metadata:
  name: TableLayout
  description: >-
    Draws records as a data grid: a column per value, one-click sorting on
    the columns the collection can be ordered by, per-cell conditional
    styling and custom cell components. Columns come from the record model
    unless listed, so a property added to the model appears without an edit
    and a renamed one is caught before deploy.
capability: Telo.Invocable
extends: Self.ListingLayout
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#TableLayoutController]
schema:
  type: object
  additionalProperties: false
  properties:
    columns:
      title: Columns
      description: >-
        The columns, left to right. Omitted, there is one per model property
        but the collection's key, in declaration order.
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          header: { title: Header, $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
          value:
            title: Value
            description: >-
              The value shown, as a path into the record or a fixed value. A
              property with a relation shows its related record's label.
            x-telo-eval: accessor
            x-telo-context:
              type: object
              properties: { row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor } }
          href:
            title: Link
            description: Draws the value as the text of a link, an address over `row`.
            $ref: "telo://Self/Address"
            x-telo-context:
              type: object
              properties: { row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor } }
          cell:
            title: Cell
            description: A component drawn in place of a value.
            x-telo-ref: { kind: Self.Component, use: dependency }
          style:
            title: Style rule
            description: Styles chosen by a value of the record.
            type: object
            additionalProperties: false
            required: [by, cases]
            properties:
              by:
                title: By
                x-telo-eval: accessor
                x-telo-context:
                  type: object
                  properties: { row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor } }
              cases:
                title: Cases
                description: Styles keyed by the plain text of the value.
                type: object
                additionalProperties: { $ref: "#/$defs/Style" }
              default: { $ref: "#/$defs/Style" }
        # Exactly one of the two.
        oneOf:
          - { required: [value] }
          - { required: [cell] }
        dependencies: { href: [value] }
  $defs:
    StyleName: { enum: [heading, subheading, muted, strong, accent, danger, warning, success] }
    Style:
      anyOf:
        - { $ref: "#/$defs/StyleName" }
        - { type: array, items: { $ref: "#/$defs/StyleName" } }
---
kind: Telo.Definition
metadata:
  name: ListLayout
  description: >-
    Draws records as a vertical list or feed, each record drawn with the
    same content built from its values — a title, a summary, a badge, an
    image — paged with a pager, a "load more" control or infinite scroll.
capability: Telo.Invocable
extends: Self.ListingLayout
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ListLayoutController]
schema:
  type: object
  additionalProperties: false
  properties:
    frame:
      title: Frame
      description: >-
        `framed` draws the list as a bordered, rounded panel; `flush` draws
        no border, radius or background, the records separated by dividers.
      $ref: "telo://Self/Frame"
      default: framed
    content:
      title: Content
      description: >-
        What is drawn for each record, over `row` and `query`. Omitted, the
        record's values, one per model property but the key.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
---
kind: Telo.Definition
metadata:
  name: CardLayout
  description: >-
    Draws records as a grid of cards or a gallery, each record's content —
    its title, image, badges and values — on a card of a small, medium or
    large size, paged with a pager, a "load more" control or infinite scroll.
capability: Telo.Invocable
extends: Self.ListingLayout
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#CardLayoutController]
schema:
  type: object
  additionalProperties: false
  properties:
    content:
      title: Content
      description: >-
        What is drawn for each record, over `row` and `query`. Omitted, the
        record's values, one per model property but the key.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
    size:
      title: Size
      description: How wide each card is drawn.
      enum: [small, medium, large]
      default: medium
---
kind: Telo.Definition
metadata:
  name: BoardLayout
  description: >-
    Draws records as a kanban board: a column per value of a property —
    every value it can hold, or only those present with their counts — each
    column paged on its own, and a record dragged to another column or moved
    from the keyboard. A grouping the API cannot filter by is caught before
    deploy.
capability: Telo.Invocable
extends: Self.ListingLayout
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#BoardLayoutController]
schema:
  type: object
  additionalProperties: false
  required: [groups]
  properties:
    groups:
      title: Groups
      description: >-
        The property records are grouped by: a column per value, each
        read and paged on its own.
      $ref: "telo://Self/Grouping"
    content:
      title: Content
      description: >-
        What is drawn for each record, over `row` and `query`. Omitted, the
        record's values, one per model property but the key.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
    move:
      title: Move
      description: >-
        The operation a record is moved by — dragged to another column, or chosen from its "Move
        to" menu — over `row`, the record as read, and `to`, the record as the
        move leaves it. A success reloads the collection. Omitted, records stay
        where they are.
      $ref: "telo://Self/RowAction"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          to: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
  x-telo-referrer-rules:
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          ([self.groups.property]).all(n, has(m.properties) && n in m.properties))
      code: UI_LAYOUT_PROPERTY_UNKNOWN
      message: >-
        names a property the listing's model does not declare in `groups.property`.
        Use a property of the listing's `model`, or add this one to it.
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        !has(self.groups) || cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          !has(m.properties) || !(self.groups.property in m.properties)
          || cel.bind(p, m.properties[self.groups.property],
             cel.bind(types, ('type' in p ? (type(p.type) == string ? [p.type] : p.type).filter(t, t != 'null')
                       : ('enum' in p ? p.enum.filter(v, type(v) == string || type(v) == bool || type(v) == int || type(v) == double)
                           .map(v, type(v) == string ? 'string' : (type(v) == bool ? 'boolean' : 'number')) : [])),
               size(types) == 0 || types.exists(t, t in ['string', 'number', 'integer', 'boolean']))))
      code: UI_LAYOUT_GROUP_UNSUPPORTED
      message: >-
        groups records by a property that does not hold one plain value — a
        string, a number or a boolean — so no group can be read by equality. Group
        by a property holding one.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.groups)
        || (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.filters) ? referrer.presentation.source.collection.query.filters : []).exists(f, f.property == self.groups.property && f.operator == 'eq')
      code: UI_LAYOUT_GROUP_NOT_FILTERABLE
      message: >-
        groups records by a property the collection does not accept an equality
        on, so no group can be read. Declare it with operator `eq` under the
        collection's `query.filters`, or group by another property.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.groups) || !has(self.groups.values) || self.groups.values != 'present'
        || (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.facets)
            && referrer.presentation.source.collection.query.facets.exists(f, f.property == self.groups.property))
      code: UI_LAYOUT_GROUPS_NOT_FACETED
      message: >-
        draws only the groups present for a property the collection does not
        facet, so their values cannot be read. List it under the collection's
        `query.facets`, or draw `values: all`.
    - referrer: Self.Listing
      resolve: [/model, /presentation/source/collection]
      condition: !cel >-
        !has(self.groups) || (has(self.groups.values) && self.groups.values == 'present')
        || cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          !has(m.properties) || !(self.groups.property in m.properties)
          || cel.bind(p, m.properties[self.groups.property],
             ('enum' in p && type(p.enum) == list)
             || ('type' in p && (type(p.type) == string ? [p.type] : p.type).filter(t, t != 'null') == ['boolean'])
             || (has(referrer.presentation.relations) && self.groups.property in referrer.presentation.relations)))
      code: UI_LAYOUT_GROUPS_NOT_ENUMERABLE
      message: >-
        draws every group of a property whose values cannot be listed: it
        declares no `enum`, is not a boolean, and the presentation presents no
        relation for it. Declare its values, present its relation, or draw
        `values: present`.
---
kind: Telo.Definition
metadata:
  name: CalendarLayout
  description: >-
    Draws records on a month, week or day calendar by a date or date-time
    property, or from a start to an end, reading every record of the shown
    period; an event is rescheduled or resized by dragging or from the
    keyboard. Dates the API cannot filter by are caught before deploy.
capability: Telo.Invocable
extends: Self.ListingLayout
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#CalendarLayoutController]
schema:
  type: object
  additionalProperties: false
  required: [span]
  properties:
    span:
      title: Span
      description: The date properties a record starts and ends at; each shown period reads the records it overlaps.
      $ref: "telo://Self/Span"
    period:
      title: Period
      description: The period shown first; the viewer moves between periods and changes it.
      enum: [month, week, day]
      default: month
    content:
      title: Content
      description: >-
        What is drawn for each record, over `row` and `query`. Omitted, the
        record's values, one per model property but the key.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
    move:
      title: Move
      description: >-
        The operation a record is moved by — rescheduled or resized by dragging, or chosen from its "Move
        to" menu — over `row`, the record as read, and `to`, the record as the
        move leaves it. A success reloads the collection. Omitted, records stay
        where they are.
      $ref: "telo://Self/RowAction"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          to: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
  x-telo-referrer-rules:
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          ([self.span.start] + (has(self.span.end) ? [self.span.end] : [])).all(n, has(m.properties) && n in m.properties))
      code: UI_LAYOUT_PROPERTY_UNKNOWN
      message: >-
        names a property the listing's model does not declare in `span.start` or `span.end`.
        Use a property of the listing's `model`, or add this one to it.
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        !has(self.span) || cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          cel.bind(names, [self.span.start] + (has(self.span.end) ? [self.span.end] : []),
          !has(m.properties) || names.exists(n, !(n in m.properties))
          || cel.bind(formats, names.map(n, cel.bind(p, m.properties[n],
               'type' in p && (type(p.type) == string ? [p.type] : p.type).filter(t, t != 'null') == ['string']
               && 'format' in p && p.format in ['date', 'date-time'] ? p.format : '')),
             formats.all(f, f != '' && f == formats[0]))))
      code: UI_LAYOUT_SPAN_NOT_DATE
      message: >-
        spans records by a property that is not a `date` or `date-time` string,
        or by a start and an end of different formats, so no period bounds it.
        Span by date properties of one format.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.span) || cel.bind(fs, (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.filters) ? referrer.presentation.source.collection.query.filters : []),
          has(self.span.end)
          ? fs.exists(f, f.property == self.span.start && f.operator == 'lte')
            && fs.exists(f, f.property == self.span.end && f.operator == 'gte')
          : fs.exists(f, f.property == self.span.start && f.operator == 'gte')
            && fs.exists(f, f.property == self.span.start && f.operator == 'lte'))
      code: UI_LAYOUT_SPAN_NOT_FILTERABLE
      message: >-
        spans records by bounds the collection does not accept, so no period
        can be read. Without `end` it needs `start` with `gte` and `lte`; with
        `end`, `start` with `lte` and `end` with `gte`, under the collection's
        `query.filters`.
---
kind: Telo.Definition
metadata:
  name: TimelineLayout
  description: >-
    Draws records as bars along time — a Gantt chart or schedule — from a
    start to an end date, at a day, week, month or quarter scale, optionally
    in a lane per value of a property, reading every record of the shown
    period; a bar is moved or resized by dragging or from the keyboard.
capability: Telo.Invocable
extends: Self.ListingLayout
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#TimelineLayoutController]
schema:
  type: object
  additionalProperties: false
  required: [span]
  properties:
    span:
      title: Span
      description: The date properties a record starts and ends at; each shown period reads the records it overlaps.
      $ref: "telo://Self/Span"
    groups:
      title: Groups
      description: >-
        The property records are laid in lanes by: a lane per value,
        each read on its own. Omitted, one lane.
      $ref: "telo://Self/Grouping"
    scale:
      title: Scale
      description: The unit of time a column of the timeline spans; the viewer changes it.
      enum: [day, week, month, quarter]
      default: month
    content:
      title: Content
      description: >-
        What is drawn for each record, over `row` and `query`. Omitted, the
        record's values, one per model property but the key.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
    move:
      title: Move
      description: >-
        The operation a record is moved by — moved or resized by dragging, or chosen from its "Move
        to" menu — over `row`, the record as read, and `to`, the record as the
        move leaves it. A success reloads the collection. Omitted, records stay
        where they are.
      $ref: "telo://Self/RowAction"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          to: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
  x-telo-referrer-rules:
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          ([self.span.start] + (has(self.span.end) ? [self.span.end] : []) + (has(self.groups) ? [self.groups.property] : [])).all(n, has(m.properties) && n in m.properties))
      code: UI_LAYOUT_PROPERTY_UNKNOWN
      message: >-
        names a property the listing's model does not declare in `span.start`, `span.end` or `groups.property`.
        Use a property of the listing's `model`, or add this one to it.
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        !has(self.span) || cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          cel.bind(names, [self.span.start] + (has(self.span.end) ? [self.span.end] : []),
          !has(m.properties) || names.exists(n, !(n in m.properties))
          || cel.bind(formats, names.map(n, cel.bind(p, m.properties[n],
               'type' in p && (type(p.type) == string ? [p.type] : p.type).filter(t, t != 'null') == ['string']
               && 'format' in p && p.format in ['date', 'date-time'] ? p.format : '')),
             formats.all(f, f != '' && f == formats[0]))))
      code: UI_LAYOUT_SPAN_NOT_DATE
      message: >-
        spans records by a property that is not a `date` or `date-time` string,
        or by a start and an end of different formats, so no period bounds it.
        Span by date properties of one format.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.span) || cel.bind(fs, (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.filters) ? referrer.presentation.source.collection.query.filters : []),
          has(self.span.end)
          ? fs.exists(f, f.property == self.span.start && f.operator == 'lte')
            && fs.exists(f, f.property == self.span.end && f.operator == 'gte')
          : fs.exists(f, f.property == self.span.start && f.operator == 'gte')
            && fs.exists(f, f.property == self.span.start && f.operator == 'lte'))
      code: UI_LAYOUT_SPAN_NOT_FILTERABLE
      message: >-
        spans records by bounds the collection does not accept, so no period
        can be read. Without `end` it needs `start` with `gte` and `lte`; with
        `end`, `start` with `lte` and `end` with `gte`, under the collection's
        `query.filters`.
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        !has(self.groups) || cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          !has(m.properties) || !(self.groups.property in m.properties)
          || cel.bind(p, m.properties[self.groups.property],
             cel.bind(types, ('type' in p ? (type(p.type) == string ? [p.type] : p.type).filter(t, t != 'null')
                       : ('enum' in p ? p.enum.filter(v, type(v) == string || type(v) == bool || type(v) == int || type(v) == double)
                           .map(v, type(v) == string ? 'string' : (type(v) == bool ? 'boolean' : 'number')) : [])),
               size(types) == 0 || types.exists(t, t in ['string', 'number', 'integer', 'boolean']))))
      code: UI_LAYOUT_GROUP_UNSUPPORTED
      message: >-
        groups records by a property that does not hold one plain value — a
        string, a number or a boolean — so no group can be read by equality. Group
        by a property holding one.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.groups)
        || (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.filters) ? referrer.presentation.source.collection.query.filters : []).exists(f, f.property == self.groups.property && f.operator == 'eq')
      code: UI_LAYOUT_GROUP_NOT_FILTERABLE
      message: >-
        groups records by a property the collection does not accept an equality
        on, so no group can be read. Declare it with operator `eq` under the
        collection's `query.filters`, or group by another property.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.groups) || !has(self.groups.values) || self.groups.values != 'present'
        || (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.facets)
            && referrer.presentation.source.collection.query.facets.exists(f, f.property == self.groups.property))
      code: UI_LAYOUT_GROUPS_NOT_FACETED
      message: >-
        draws only the groups present for a property the collection does not
        facet, so their values cannot be read. List it under the collection's
        `query.facets`, or draw `values: all`.
    - referrer: Self.Listing
      resolve: [/model, /presentation/source/collection]
      condition: !cel >-
        !has(self.groups) || (has(self.groups.values) && self.groups.values == 'present')
        || cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          !has(m.properties) || !(self.groups.property in m.properties)
          || cel.bind(p, m.properties[self.groups.property],
             ('enum' in p && type(p.enum) == list)
             || ('type' in p && (type(p.type) == string ? [p.type] : p.type).filter(t, t != 'null') == ['boolean'])
             || (has(referrer.presentation.relations) && self.groups.property in referrer.presentation.relations)))
      code: UI_LAYOUT_GROUPS_NOT_ENUMERABLE
      message: >-
        draws every group of a property whose values cannot be listed: it
        declares no `enum`, is not a boolean, and the presentation presents no
        relation for it. Declare its values, present its relation, or draw
        `values: present`.
---
kind: Telo.Definition
metadata:
  name: TreeLayout
  description: >-
    Draws records as a tree or hierarchy by a property holding each
    record's parent — an org chart, folders, nested categories — reading the
    roots, then a record's children when it is expanded, and reparenting a
    record by dragging or from the keyboard.
capability: Telo.Invocable
extends: Self.ListingLayout
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#TreeLayoutController]
schema:
  type: object
  additionalProperties: false
  required: [parent]
  properties:
    parent:
      title: Parent
      description: >-
        The property holding the key of a record's parent, a relation of the
        collection to itself. Records holding none are the roots.
      type: string
    content:
      title: Content
      description: >-
        What is drawn for each record, over `row` and `query`. Omitted, the
        record's values, one per model property but the key.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
    move:
      title: Move
      description: >-
        The operation a record is moved by — dragged under another record, or chosen from its "Move
        to" menu — over `row`, the record as read, and `to`, the record as the
        move leaves it. A success reloads the collection. Omitted, records stay
        where they are.
      $ref: "telo://Self/RowAction"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          to: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
  x-telo-referrer-rules:
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          ([self.parent]).all(n, has(m.properties) && n in m.properties))
      code: UI_LAYOUT_PROPERTY_UNKNOWN
      message: >-
        names a property the listing's model does not declare in `parent`.
        Use a property of the listing's `model`, or add this one to it.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection, /presentation/source/collection/relations/*/collection]
      condition: !cel >-
        !has(self.parent) || cel.bind(c, referrer.presentation.source.collection,
          has(c.relations) && self.parent in c.relations
          && cel.bind(t, c.relations[self.parent].collection,
             t.metadata.name == c.metadata.name
             && (has(t.metadata.module) ? t.metadata.module : '') == (has(c.metadata.module) ? c.metadata.module : '')))
      code: UI_LAYOUT_PARENT_NOT_SELF_RELATION
      message: >-
        nests records under a property with no relation to the listing's own
        collection, so a parent cannot be one of its records. Declare a relation
        from the property to this collection under its `relations`, or nest by
        another property.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.parent) || cel.bind(fs, (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.filters) ? referrer.presentation.source.collection.query.filters : []),
          fs.exists(f, f.property == self.parent && f.operator == 'eq')
          && fs.exists(f, f.property == self.parent && f.operator == 'absent'))
      code: UI_LAYOUT_PARENT_NOT_FILTERABLE
      message: >-
        nests records under a property the collection cannot read roots and
        children by. Declare it with operators `eq` and `absent` under the
        collection's `query.filters`.
---
kind: Telo.Definition
metadata:
  name: ComponentLayout
  description: >-
    Draws records with a custom browser component — a map, a timeline of
    your own, a seat plan — given the records the declared reads return,
    grouped, by period or as a tree, with fixed or per-record properties. The
    renderer runs paging, filters, labels, openers and moves.
capability: Telo.Invocable
extends: Self.ListingLayout
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ComponentLayoutController]
schema:
  type: object
  additionalProperties: false
  required: [component]
  properties:
    component:
      title: Component
      description: The component drawing the records, written against the renderer's layout component contract.
      x-telo-ref: { kind: Self.ComponentExport, use: dependency }
    props:
      title: Properties
      description: >-
        What the component receives, by name: a fixed value, given once, or a
        path into `row`, given per record.
      type: object
      x-telo-value-schema-from: "/component/props"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
      additionalProperties: { x-telo-eval: accessor }
    groups:
      title: Groups
      description: >-
        The property records are grouped by, each group read on its own.
        Omitted, the records are not grouped.
      $ref: "telo://Self/Grouping"
    span:
      title: Span
      description: The date properties a record starts and ends at; each shown period reads the records it overlaps. Omitted, records are not read by period.
      $ref: "telo://Self/Span"
    parent:
      title: Parent
      description: >-
        The property holding the key of a record's parent, a relation of the
        collection to itself: roots are read, then a record's children when it
        is expanded. Omitted, records are not nested.
      type: string
    move:
      title: Move
      description: >-
        The operation a record is moved by — as the component reports it, or chosen from its "Move
        to" menu — over `row`, the record as read, and `to`, the record as the
        move leaves it. A success reloads the collection. Omitted, records stay
        where they are.
      $ref: "telo://Self/RowAction"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          to: { x-telo-context-from-referrer: row, x-telo-context-eval: accessor }
          query: { x-telo-context-from-referrer: query, x-telo-context-eval: accessor }
  x-telo-referrer-rules:
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          ((has(self.groups) ? [self.groups.property] : []) + (has(self.span) ? [self.span.start] + (has(self.span.end) ? [self.span.end] : []) : []) + (has(self.parent) ? [self.parent] : [])).all(n, has(m.properties) && n in m.properties))
      code: UI_LAYOUT_PROPERTY_UNKNOWN
      message: >-
        names a property the listing's model does not declare in `groups.property`, `span.start`, `span.end` or `parent`.
        Use a property of the listing's `model`, or add this one to it.
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        !has(self.groups) || cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          !has(m.properties) || !(self.groups.property in m.properties)
          || cel.bind(p, m.properties[self.groups.property],
             cel.bind(types, ('type' in p ? (type(p.type) == string ? [p.type] : p.type).filter(t, t != 'null')
                       : ('enum' in p ? p.enum.filter(v, type(v) == string || type(v) == bool || type(v) == int || type(v) == double)
                           .map(v, type(v) == string ? 'string' : (type(v) == bool ? 'boolean' : 'number')) : [])),
               size(types) == 0 || types.exists(t, t in ['string', 'number', 'integer', 'boolean']))))
      code: UI_LAYOUT_GROUP_UNSUPPORTED
      message: >-
        groups records by a property that does not hold one plain value — a
        string, a number or a boolean — so no group can be read by equality. Group
        by a property holding one.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.groups)
        || (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.filters) ? referrer.presentation.source.collection.query.filters : []).exists(f, f.property == self.groups.property && f.operator == 'eq')
      code: UI_LAYOUT_GROUP_NOT_FILTERABLE
      message: >-
        groups records by a property the collection does not accept an equality
        on, so no group can be read. Declare it with operator `eq` under the
        collection's `query.filters`, or group by another property.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.groups) || !has(self.groups.values) || self.groups.values != 'present'
        || (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.facets)
            && referrer.presentation.source.collection.query.facets.exists(f, f.property == self.groups.property))
      code: UI_LAYOUT_GROUPS_NOT_FACETED
      message: >-
        draws only the groups present for a property the collection does not
        facet, so their values cannot be read. List it under the collection's
        `query.facets`, or draw `values: all`.
    - referrer: Self.Listing
      resolve: [/model, /presentation/source/collection]
      condition: !cel >-
        !has(self.groups) || (has(self.groups.values) && self.groups.values == 'present')
        || cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          !has(m.properties) || !(self.groups.property in m.properties)
          || cel.bind(p, m.properties[self.groups.property],
             ('enum' in p && type(p.enum) == list)
             || ('type' in p && (type(p.type) == string ? [p.type] : p.type).filter(t, t != 'null') == ['boolean'])
             || (has(referrer.presentation.relations) && self.groups.property in referrer.presentation.relations)))
      code: UI_LAYOUT_GROUPS_NOT_ENUMERABLE
      message: >-
        draws every group of a property whose values cannot be listed: it
        declares no `enum`, is not a boolean, and the presentation presents no
        relation for it. Declare its values, present its relation, or draw
        `values: present`.
    - referrer: Self.Listing
      resolve: [/model]
      condition: !cel >-
        !has(self.span) || cel.bind(m, has(referrer.model.schema) ? referrer.model.schema : referrer.model,
          cel.bind(names, [self.span.start] + (has(self.span.end) ? [self.span.end] : []),
          !has(m.properties) || names.exists(n, !(n in m.properties))
          || cel.bind(formats, names.map(n, cel.bind(p, m.properties[n],
               'type' in p && (type(p.type) == string ? [p.type] : p.type).filter(t, t != 'null') == ['string']
               && 'format' in p && p.format in ['date', 'date-time'] ? p.format : '')),
             formats.all(f, f != '' && f == formats[0]))))
      code: UI_LAYOUT_SPAN_NOT_DATE
      message: >-
        spans records by a property that is not a `date` or `date-time` string,
        or by a start and an end of different formats, so no period bounds it.
        Span by date properties of one format.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.span) || cel.bind(fs, (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.filters) ? referrer.presentation.source.collection.query.filters : []),
          has(self.span.end)
          ? fs.exists(f, f.property == self.span.start && f.operator == 'lte')
            && fs.exists(f, f.property == self.span.end && f.operator == 'gte')
          : fs.exists(f, f.property == self.span.start && f.operator == 'gte')
            && fs.exists(f, f.property == self.span.start && f.operator == 'lte'))
      code: UI_LAYOUT_SPAN_NOT_FILTERABLE
      message: >-
        spans records by bounds the collection does not accept, so no period
        can be read. Without `end` it needs `start` with `gte` and `lte`; with
        `end`, `start` with `lte` and `end` with `gte`, under the collection's
        `query.filters`.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection, /presentation/source/collection/relations/*/collection]
      condition: !cel >-
        !has(self.parent) || cel.bind(c, referrer.presentation.source.collection,
          has(c.relations) && self.parent in c.relations
          && cel.bind(t, c.relations[self.parent].collection,
             t.metadata.name == c.metadata.name
             && (has(t.metadata.module) ? t.metadata.module : '') == (has(c.metadata.module) ? c.metadata.module : '')))
      code: UI_LAYOUT_PARENT_NOT_SELF_RELATION
      message: >-
        nests records under a property with no relation to the listing's own
        collection, so a parent cannot be one of its records. Declare a relation
        from the property to this collection under its `relations`, or nest by
        another property.
    - referrer: Self.Listing
      resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.parent) || cel.bind(fs, (has(referrer.presentation.source.collection.query) && has(referrer.presentation.source.collection.query.filters) ? referrer.presentation.source.collection.query.filters : []),
          fs.exists(f, f.property == self.parent && f.operator == 'eq')
          && fs.exists(f, f.property == self.parent && f.operator == 'absent'))
      code: UI_LAYOUT_PARENT_NOT_FILTERABLE
      message: >-
        nests records under a property the collection cannot read roots and
        children by. Declare it with operators `eq` and `absent` under the
        collection's `query.filters`.
---
kind: Telo.Definition
metadata:
  name: Form
  description: >-
    An input form generated from a data model: a labelled control per property,
    chosen from its type — checkbox, select, number, date, text, a tag list,
    and a searchable picker for a related record — validated in the browser
    against the model's own rules before anything is sent, with the server's
    field errors shown beside the fields they name. Creates a record, or edits
    one a listing opens.
capability: Telo.Provider
extends: Self.Composite
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#FormController]
schema:
  type: object
  additionalProperties: false
  required: [model, presentation]
  properties:
    model:
      title: Model
      description: The shape of the record the form sends.
      x-telo-ref: { kind: Telo.Type, use: schema }
    presentation:
      title: Presentation
      description: >-
        The collection written to, and how its related records are offered.
      x-telo-ref: { kind: Self.CollectionPresentation, use: dependency }
    fields:
      title: Fields
      description: >-
        The fields, top to bottom: a property name, entered as the model says
        — with a picker of related records where the presentation presents the
        property's relation — or a field kind. Omitted, every model property a
        control can enter: a scalar, or a list of scalars.
      type: array
      x-telo-context:
        type: object
        properties:
          values:
            x-telo-context-from-root: "model"
            x-telo-context-eval: accessor
            x-telo-context-item-fills: ["", "/property"]
      items:
        anyOf:
          - title: Property
            description: A property, entered with the control its schema calls for.
            type: string
          - title: Field
            description: A field kind entering one property.
            x-telo-ref: { kind: Self.Field, use: call }
    groups:
      title: Groups
      description: >-
        Labelled sections the fields name by `group`. A group's fields are
        listed one after another, so the list's order is the order they are
        drawn in.
      type: array
      x-telo-context:
        type: object
        properties: { values: { x-telo-context-from-root: "model", x-telo-context-eval: accessor } }
      items: { $ref: "telo://Self/FieldGroup" }
    state:
      title: State
      description: >-
        Where the values entered are kept between visits. Omitted, they are
        not kept.
      $ref: "telo://Self/StateRecord"
  x-telo-resource-rules:
    - resolve: [/model, /fields]
      in: /fields
      condition: !cel >-
        !has(self.model) ||
        cel.bind(m, has(self.model.schema) ? self.model.schema : self.model,
          has(m.properties) && (type(this) == string ? this : this.property) in m.properties)
      code: UI_FIELD_UNKNOWN_PROPERTY
      message: >-
        lists a field for a property the model does not declare. Use a property
        of `model`, or add this one to it.
    - resolve: [/model]
      in: /fields
      condition: !cel >-
        !has(self.model) ||
        cel.bind(m, has(self.model.schema) ? self.model.schema : self.model,
          type(this) != string || !has(m.properties) || !(this in m.properties)
          || Self.controlFits('auto', m.properties[this], null))
      code: UI_FIELD_UNSUPPORTED
      message: >-
        lists a property no control can enter. A property name enters a
        string, a number, a boolean, one of an `enum`, or a list of those:
        remove it, give `model` a property of such a type, or name a field
        kind that enters it.
    - resolve: [/model, /fields]
      condition: !cel >-
        !has(self.model) ||
        cel.bind(m, has(self.model.schema) ? self.model.schema : self.model,
          !has(m.required) || m.required.all(r,
            has(self.fields)
              ? self.fields.exists(e, (type(e) == string ? e : e.property) == r)
              : has(m.properties) && r in m.properties && Self.controlFits('auto', m.properties[r], null)))
      code: UI_FIELD_REQUIRED_NOT_ENTERED
      message: >-
        leaves a property the model requires with no field, so a valid record
        could never be sent. List a field for every required property, or leave
        `fields` out where each one is a scalar or a list of scalars.
    - resolve: [/fields]
      in: /fields
      condition: !cel >-
        cel.bind(p, type(this) == string ? this : this.property,
          self.fields.filter(e, (type(e) == string ? e : e.property) == p).size() == 1)
      code: UI_FIELD_DUPLICATE
      message: >-
        enters a property another field enters too. Each property is entered by
        one field: remove one of the two.
    - resolve: [/fields]
      in: /fields
      condition: !cel >-
        type(this) == string || !('group' in this)
        || (has(self.groups) && self.groups.exists(g, g.name == this.group))
      code: UI_FIELD_GROUP_UNKNOWN
      message: >-
        names a group `groups` does not declare. Declare it under `groups`, or
        correct the name.
    - in: /groups
      condition: !cel "self.groups.exists_one(g, g.name == this.name)"
      code: UI_FIELD_GROUP_DUPLICATE
      message: >-
        has the name of another group. A field names its group: give each its
        own.
    - resolve: [/fields]
      in: /groups
      condition: !cel >-
        !has(self.fields) || cel.bind(gs, self.fields.map(e, type(e) != string && 'group' in e ? e.group : ''),
          enumerate(gs).filter(p, p.value == this.name && (p.index == 0 || gs[p.index - 1] != this.name)).size() <= 1)
      code: UI_FIELD_GROUP_SPLIT
      message: >-
        is named by fields that are not listed one after another. A group is
        drawn where its fields are: list them together.
    # Anchored at the resource: `in:` cannot reach into a named shape.
    - resolve: [/model, /fields]
      condition: !cel >-
        !has(self.model) ||
        cel.bind(m, has(self.model.schema) ? self.model.schema : self.model,
          !has(self.state) || !has(self.state.fields) || self.state.fields.all(k,
            has(self.fields)
              ? self.fields.exists(e, (type(e) == string ? e : e.property) == k)
              : has(m.properties) && k in m.properties && Self.controlFits('auto', m.properties[k], null)))
      code: UI_STATE_FIELD_UNKNOWN
      message: >-
        keeps a property under `state.fields` no field shows. Name only
        properties the fields enter, or leave `state.fields` out to keep every
        one.
---
kind: Telo.Definition
metadata:
  name: Action
  description: >-
    A button that runs a server operation from a page with a POST, PUT, PATCH
    or DELETE request, with an optional input form generated from the
    request's data model and validated before anything is sent. Input
    properties can fill the request path or query instead of the body. Draws the answer as content — generated files, report links,
    search hits — and a refusal as an error, then navigates or refreshes data
    on success; presses run in parallel or one at a time. Data grids and lists
    offer one on every row.
capability: Telo.Provider
extends: Self.Composite
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ActionController]
# What a call site naming an action hands it: a record of its input model.
inputType: { type: object, x-telo-value-schema-from: inputModel }
schema:
  type: object
  additionalProperties: false
  required: [inputModel, request, label]
  examples:
    - inputModel:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [month]
          properties:
            month: { type: string, title: Month, pattern: "^[0-9]{4}-[0-9]{2}$" }
            formats: { type: array, title: Formats, items: { enum: [pdf, csv] } }
      outputModel:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [files]
          properties:
            files:
              type: array
              items:
                type: object
                properties:
                  name: { type: string, title: File }
                  url: { type: string, title: Download, format: uri-reference }
      request: { target: /api/reports }
      label: Generate
      result:
        type: list
        heading: Files
        rows: !cel "result.files"
        columns:
          - value: !cel "row.name"
          - value: !cel "row.url"
      onSuccess: { refreshes: [/api/reports] }
  properties:
    inputModel:
      title: Input model
      description: The shape of the record sent as the request body.
      x-telo-ref: { kind: Telo.Type, use: schema }
    outputModel:
      title: Output model
      description: >-
        The shape of the answer, read as `result`. A success's body is held to
        it before anything is drawn from it.
      x-telo-ref: { kind: Telo.Type, use: schema }
    request:
      title: Request
      description: >-
        The request a press sends: the HTTP `method` and the `target` it goes
        to. A `target` parameter reads the record sent as `input`; an input
        property read whole (`input.<property>`) travels in the target and
        stays out of the body.
      type: object
      additionalProperties: false
      required: [target]
      properties:
        method:
          title: Method
          description: >-
            `POST`, `PUT` and `PATCH` send the input's remaining properties as a
            JSON body; `DELETE` sends none and must read every input property in
            its target.
          enum: [POST, PUT, PATCH, DELETE]
          default: POST
        target:
          title: Target
          description: Where the request goes, over `input`. A value that holds nothing leaves the press unsent.
          $ref: "telo://Self/RequestTarget"
          x-telo-context:
            type: object
            properties:
              input: { x-telo-context-from-root: "inputModel", x-telo-context-eval: accessor }
    label:
      title: Label
      description: The text of the button that runs the operation.
      $ref: "telo://manifest#/$defs/Text"
      x-telo-text-values: {}
    fields:
      title: Fields
      description: >-
        The fields, top to bottom: a property name, entered as the input model
        says, or a field kind. Omitted, every input model property a control
        can enter: a scalar, or a list of scalars.
      type: array
      x-telo-context:
        type: object
        properties:
          values:
            x-telo-context-from-root: "inputModel"
            x-telo-context-eval: accessor
            x-telo-context-item-fills: ["", "/property"]
      items:
        anyOf:
          - title: Property
            description: A property, entered with the control its schema calls for.
            type: string
          - title: Field
            description: A field kind entering one property.
            x-telo-ref: { kind: Self.Field, use: call }
    groups:
      title: Groups
      description: >-
        Labelled sections the fields name by `group`. A group's fields are
        listed one after another, so the list's order is the order they are
        drawn in.
      type: array
      x-telo-context:
        type: object
        properties:
          values: { x-telo-context-from-root: "inputModel", x-telo-context-eval: accessor }
      items: { $ref: "telo://Self/FieldGroup" }
    state:
      title: State
      description: >-
        Where the values entered are kept between visits. Omitted, they are
        not kept.
      $ref: "telo://Self/StateRecord"
    enabled:
      title: Enabled
      description: >-
        When the button can be pressed, over the form's current `values`, and
        the reason shown while it cannot. Omitted, it always can.
      $ref: "telo://Self/Enablement"
      x-telo-context:
        type: object
        properties:
          values: { x-telo-context-from-root: "inputModel", x-telo-context-eval: accessor }
    result:
      title: Result
      description: >-
        What is drawn from a success, over `result` (the answer), `input` (the
        record sent) and `values` (the form's current values). Omitted, a
        success draws nothing.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          result:
            x-telo-context-from-root: "outputModel"
            x-telo-context-eval: accessor
            type: object
            properties: {}
            additionalProperties: false
          input: { x-telo-context-from-root: "inputModel", x-telo-context-eval: accessor }
          values: { x-telo-context-from-root: "inputModel", x-telo-context-eval: accessor }
    failure:
      title: Failure
      description: >-
        What is drawn when the operation does not succeed — any answer but a
        2xx, no answer at all, or a 2xx body the output model refuses — over
        `error`, `input` and `values`. Omitted, the error's code and message.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          error: { x-telo-context-eval: accessor, $ref: "telo://Self/RequestError" }
          input: { x-telo-context-from-root: "inputModel", x-telo-context-eval: accessor }
          values: { x-telo-context-from-root: "inputModel", x-telo-context-eval: accessor }
    onSuccess:
      title: On success
      description: What happens once the operation succeeds, besides drawing `result`.
      type: object
      additionalProperties: false
      properties:
        navigate:
          title: Navigate
          description: >-
            Where the page goes, over `result` and `input`. An app-relative
            address of a declared page moves within the application, any other
            loads it; an `https://` or `http://` address replaces the page. An
            address that does not resolve navigates nowhere.
          $ref: "telo://Self/Address"
          x-telo-context:
            type: object
            properties:
              result:
                x-telo-context-from-root: "outputModel"
                x-telo-context-eval: accessor
                type: object
                properties: {}
                additionalProperties: false
              input: { x-telo-context-from-root: "inputModel", x-telo-context-eval: accessor }
        refreshes:
          title: Refreshes
          description: >-
            Requests read again, over `input` and `result`: every reader whose
            `source` and every listing whose collection source's `basePath`
            resolves to one of their paths.
          type: array
          items: { $ref: "telo://Self/RefreshTarget" }
          x-telo-context:
            type: object
            properties:
              result:
                x-telo-context-from-root: "outputModel"
                x-telo-context-eval: accessor
                type: object
                properties: {}
                additionalProperties: false
              input: { x-telo-context-from-root: "inputModel", x-telo-context-eval: accessor }
    concurrency:
      title: Concurrency
      description: >-
        Whether presses of this action run at once (`parallel`) or one after
        another in the order they were made on this page (`serial`). Either
        way the form, or one row, takes no press while its last is pending.
      enum: [parallel, serial]
      default: parallel
    clearAnswerOn:
      title: Clear answer on
      description: >-
        Input properties whose change clears what was drawn from the last
        answer. A new submission always clears it.
      type: array
      uniqueItems: true
      items: { type: string }
  x-telo-resource-rules:
    - resolve: [/inputModel]
      condition: !cel >-
        !has(self.request.method) || self.request.method != 'DELETE'
        || cel.bind(m, has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel,
          !has(m.properties) || m.properties.all(k,
            type(self.request.target) != string && (
              (has(self.request.target.pathParams) && self.request.target.pathParams.exists(n,
                'root' in self.request.target.pathParams[n] && self.request.target.pathParams[n].root == 'input'
                && self.request.target.pathParams[n].path == [k]))
              || (has(self.request.target.queryParams) && self.request.target.queryParams.exists(n,
                'root' in self.request.target.queryParams[n] && self.request.target.queryParams[n].root == 'input'
                && self.request.target.queryParams[n].path == [k])))))
      code: UI_ACTION_INPUT_UNSENT
      message: >-
        is a `DELETE`, which sends no body, yet leaves an input property out of
        its target. Read every property of `inputModel` in a `pathParams` or
        `queryParams` entry as exactly `input.<property>`, or remove it from
        `inputModel`.
    - resolve: [/inputModel]
      in: /clearAnswerOn
      condition: !cel "has((has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel).properties) && this in (has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel).properties"
      code: UI_ACTION_CLEAR_UNKNOWN_PROPERTY
      message: >-
        clears its answer on a property the input model does not declare, which
        never changes. Use a property of `inputModel`, or remove this entry.
    - resolve: [/inputModel, /fields]
      in: /fields
      condition: !cel >-
        cel.bind(m, has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel,
          has(m.properties) && (type(this) == string ? this : this.property) in m.properties)
      code: UI_FIELD_UNKNOWN_PROPERTY
      message: >-
        lists a field for a property the input model does not declare. Use a property
        of `inputModel`, or add this one to it.
    - resolve: [/inputModel]
      in: /fields
      condition: !cel >-
        cel.bind(m, has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel,
          type(this) != string || !has(m.properties) || !(this in m.properties)
          || Self.controlFits('auto', m.properties[this], null))
      code: UI_FIELD_UNSUPPORTED
      message: >-
        lists a property no control can enter. A property name enters a
        string, a number, a boolean, one of an `enum`, or a list of those:
        remove it, give `inputModel` a property of such a type, or name a field
        kind that enters it.
    - resolve: [/inputModel, /fields]
      condition: !cel >-
        cel.bind(m, has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel,
          !has(m.required) || m.required.all(r,
            has(self.fields)
              ? self.fields.exists(e, (type(e) == string ? e : e.property) == r)
              : has(m.properties) && r in m.properties && Self.controlFits('auto', m.properties[r], null)))
      code: UI_FIELD_REQUIRED_NOT_ENTERED
      message: >-
        leaves a property the input model requires with no field, so a valid record
        could never be sent. List a field for every required property, or leave
        `fields` out where each one is a scalar or a list of scalars.
    - resolve: [/fields]
      in: /fields
      condition: !cel >-
        cel.bind(p, type(this) == string ? this : this.property,
          self.fields.filter(e, (type(e) == string ? e : e.property) == p).size() == 1)
      code: UI_FIELD_DUPLICATE
      message: >-
        enters a property another field enters too. Each property is entered by
        one field: remove one of the two.
    - resolve: [/fields]
      in: /fields
      condition: !cel >-
        type(this) == string || !('group' in this)
        || (has(self.groups) && self.groups.exists(g, g.name == this.group))
      code: UI_FIELD_GROUP_UNKNOWN
      message: >-
        names a group `groups` does not declare. Declare it under `groups`, or
        correct the name.
    - in: /groups
      condition: !cel "self.groups.exists_one(g, g.name == this.name)"
      code: UI_FIELD_GROUP_DUPLICATE
      message: >-
        has the name of another group. A field names its group: give each its
        own.
    - resolve: [/fields]
      in: /groups
      condition: !cel >-
        !has(self.fields) || cel.bind(gs, self.fields.map(e, type(e) != string && 'group' in e ? e.group : ''),
          enumerate(gs).filter(p, p.value == this.name && (p.index == 0 || gs[p.index - 1] != this.name)).size() <= 1)
      code: UI_FIELD_GROUP_SPLIT
      message: >-
        is named by fields that are not listed one after another. A group is
        drawn where its fields are: list them together.
    # Anchored at the resource: `in:` cannot reach into a named shape.
    - resolve: [/inputModel, /fields]
      condition: !cel >-
        cel.bind(m, has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel,
          !has(self.state) || !has(self.state.fields) || self.state.fields.all(k,
            has(self.fields)
              ? self.fields.exists(e, (type(e) == string ? e : e.property) == k)
              : has(m.properties) && k in m.properties && Self.controlFits('auto', m.properties[k], null)))
      code: UI_STATE_FIELD_UNKNOWN
      message: >-
        keeps a property under `state.fields` no field shows. Name only
        properties the fields enter, or leave `state.fields` out to keep every
        one.
---
kind: Telo.Definition
metadata:
  name: Filters
  description: >-
    A filter bar over the record listings it contains: one control per filter
    the collection accepts, related records offered by name, optionally only
    the values present with their counts, named presets, summary chips and a
    reset. The controls can fold behind a button or open in an overlay.
    Chosen values are kept between visits and shareable in the page address.
capability: Telo.Provider
extends: Self.Composite
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#FiltersController]
schema:
  type: object
  additionalProperties: false
  required: [presentation, content]
  properties:
    presentation:
      title: Presentation
      description: >-
        The collection filtered and how its related records are offered. The
        bar offers only filters its collection lists under `query.filters`,
        over its `model`.
      x-telo-ref: { kind: Self.CollectionPresentation, use: dependency }
    fields:
      title: Fields
      description: >-
        The filters, in order. Omitted, one per filter the collection accepts,
        in the order it declares them.
      type: array
      items:
        type: object
        additionalProperties: false
        required: [property, operator]
        properties:
          property: { title: Property, type: string }
          operator: { title: Operator, enum: [eq, contains, gt, gte, lt, lte, in, absent] }
          pinned:
            title: Pinned
            description: >-
              Kept outside whatever the bar folds into, always on show, and
              never removable.
            type: boolean
            default: false
          control:
            title: Control
            description: >-
              How the value is entered: derived from the property (`auto`), a
              `select` list, `options` side by side, a `toggle`, a `slider`,
              typed `tags`, or `none` — drawn nowhere, set by a preset or a
              default only. `absent` is entered with a toggle.
            anyOf:
              - { $ref: "telo://Self/Control" }
              - { const: none }
            default: auto
          values:
            title: Values
            description: >-
              Which choices are offered: `all` the property can hold, or only
              those `present` in the records the bar's other filters leave,
              each with its count. `present` needs the property listed under
              the collection's `query.facets`.
            enum: [all, present]
            default: all
          options:
            title: Options
            description: >-
              Where the choices and their labels come from, in place of the
              property's relation or its `enum`.
            x-telo-ref: { kind: Self.OptionSource, use: dependency }
          default:
            title: Default
            description: >-
              What the filter holds until the viewer changes it: one value, or a
              list of them under `in`.
            anyOf:
              - { type: [string, number, boolean] }
              - { type: array, items: { type: [string, number, boolean] } }
    presets:
      title: Presets
      description: >-
        Named sets of filter values, drawn as one exclusive choice. Choosing one
        sets the filters the presets name between them and leaves the rest.
      type: array
      items:
        type: object
        additionalProperties: false
        required: [label, values]
        properties:
          label: { title: Label, $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
          values:
            title: Values
            type: array
            items:
              type: object
              additionalProperties: false
              required: [property, operator, value]
              properties:
                property: { title: Property, type: string }
                operator: { title: Operator, enum: [eq, contains, gt, gte, lt, lte, in, absent] }
                value:
                  title: Value
                  anyOf:
                    - { type: [string, number, boolean] }
                    - { type: array, items: { type: [string, number, boolean] } }
    policy:
      title: Policy
      description: >-
        Which filters are on show, where the controls sit, how they are drawn,
        when a change applies, what summarises the bar and where its state is
        kept.
      $ref: "telo://Self/FilterPolicy"
    content:
      title: Content
      description: The node the filters apply to.
      $ref: "telo://Self/Node"
  x-telo-resource-rules:
    - resolve: [/presentation/source/collection]
      in: /fields
      condition: !cel >-
        !has(self.presentation.source.collection.query) || !has(self.presentation.source.collection.query.filters)
        || self.presentation.source.collection.query.filters.exists(f, f.property == this.property && f.operator == this.operator)
      code: UI_FILTER_NOT_ACCEPTED
      message: >-
        filters by a property and operator the collection does not accept.
        Declare the pair under the collection's `query.filters`, or remove this
        field.
    - resolve: [/presentation/source/collection]
      in: /fields
      condition: !cel >-
        !('values' in this) || this.values != 'present'
        || (has(self.presentation.source.collection.query.facets) && self.presentation.source.collection.query.facets.exists(f, f.property == this.property))
      code: UI_FILTER_VALUES_NOT_FACETED
      message: >-
        offers only the values present for a property the collection does not
        facet. Add the property to the collection's `query.facets`, or offer
        `all` values.
    # Judged where the source yields one property of the record, as a field's
    # option value is.
    - resolve: [/presentation/source/collection, /presentation/source/collection/model, /fields/*/options/model]
      in: /fields
      condition: !cel >-
        !('options' in this) ||
        cel.bind(m, (has(self.presentation.source.collection.model.schema) ? self.presentation.source.collection.model.schema : self.presentation.source.collection.model),
        cel.bind(o, has(this.options.model.schema) ? this.options.model.schema : this.options.model,
          !has(m.properties) || !(this.property in m.properties)
          || !('root' in this.options.value) || size(this.options.value.path) != 1
          || !has(o.properties) || !(this.options.value.path[0] in o.properties)
          || cel.bind(want, (!('type' in m.properties[this.property]) ? [] : (type(m.properties[this.property].type) == list ? m.properties[this.property].type : [m.properties[this.property].type]).filter(t, t != 'null')),
             cel.bind(v, o.properties[this.options.value.path[0]],
             cel.bind(have, (!('type' in v) ? [] : (type(v.type) == list ? v.type : [v.type]).filter(t, t != 'null')),
               want.size() == 0 || have.size() == 0
               || have.all(t, t in want || (t == 'integer' && 'number' in want)))))))
      code: UI_FILTER_OPTION_VALUE_MISMATCH
      message: >-
        offers options whose value is of another type than the property holds.
        Make the source's `value` read a property of the property's type, or
        filter another property.
    # State, defaults and presets are keyed by the pair, so it names one filter.
    - in: /fields
      condition: !cel "self.fields.exists_one(f, f.property == this.property && f.operator == this.operator)"
      code: UI_FILTER_DUPLICATE
      message: >-
        lists a property and operator another field already has. A filter is
        one property with one operator: remove one of the two.
    - resolve: [/presentation/source/collection, /presentation/source/collection/model]
      in: /fields
      condition: !cel >-
        !('default' in this)
        || ((!(('control' in this && this.control == 'toggle') || this.operator == 'absent') || type(this.default) != bool || this.default != false)
        && (this.operator == 'absent' ? type(this.default) == bool
        : cel.bind(m, (has(self.presentation.source.collection.model.schema) ? self.presentation.source.collection.model.schema : self.presentation.source.collection.model),
          !has(m.properties) || !(this.property in m.properties)
          || ((type(this.default) == list) == (this.operator == 'in')
              && [m.properties[this.property]].all(p,
                 (type(this.default) == list ? this.default : [this.default]).all(v,
                 (!('enum' in p) || v in p.enum)
                 && (!('type' in p) || type(p.type) != string
                     || !(p.type in ['string', 'boolean', 'integer', 'number'])
                     || (p.type == 'string' && type(v) == string)
                     || (p.type == 'boolean' && type(v) == bool)
                     || (p.type == 'integer' && (type(v) == int || (type(v) == double && double(int(v)) == v)))
                     || (p.type == 'number' && (type(v) == int || type(v) == double)))))))))
      code: UI_FILTER_DEFAULT_INVALID
      message: >-
        declares a default its filter cannot hold: a value that is not of the
        property's type or not one of its `enum`, a list without the `in`
        operator, a single value with it, anything but `true` under `absent`,
        or `false` for a filter entered with a `toggle`, which holds true or
        nothing.
    # The one fit predicate every control rule reads, over the filter's operator.
    - resolve: [/presentation/source/collection, /presentation/source/collection/model]
      in: /fields
      condition: !cel >-
        !('control' in this) || this.control in ['auto', 'none']
        || cel.bind(m, (has(self.presentation.source.collection.model.schema) ? self.presentation.source.collection.model.schema : self.presentation.source.collection.model),
             !has(m.properties) || !(this.property in m.properties)
             || Self.controlFits(this.control, m.properties[this.property], this.operator))
      code: UI_FILTER_CONTROL_UNSUPPORTED
      message: >-
        asks for a control its filter cannot be entered with: `select` and
        `options` need an `enum` or a boolean, `toggle` a boolean with `eq` or
        any property under `absent`, `slider` a number or integer declaring
        `minimum` and `maximum` with `eq` or a comparison, and `tags` the `in`
        operator.
    - resolve: [/presentation/source/collection]
      in: /presets
      condition: !cel >-
        this.values.all(v, has(self.fields)
          ? self.fields.exists(f, f.property == v.property && f.operator == v.operator)
          : (!has(self.presentation.source.collection.query) || !has(self.presentation.source.collection.query.filters)
             || self.presentation.source.collection.query.filters.exists(f, f.property == v.property && f.operator == v.operator)))
      code: UI_FILTER_PRESET_UNKNOWN_FILTER
      message: >-
        sets a property and operator the bar does not show. Name a pair listed
        under `fields`, or one the collection accepts when `fields` is left out.
    - resolve: [/presentation/source/collection, /presentation/source/collection/model]
      in: /presets
      condition: !cel >-
        cel.bind(m, (has(self.presentation.source.collection.model.schema) ? self.presentation.source.collection.model.schema : self.presentation.source.collection.model),
        this.values.all(e,
          (type(e.value) != bool || e.value != false || (e.operator != 'absent' && (!has(self.fields)
           || !self.fields.exists(f, f.property == e.property && f.operator == e.operator && 'control' in f && f.control == 'toggle'))))
          && (e.operator == 'absent' ? type(e.value) == bool
          : (!has(m.properties) || !(e.property in m.properties)
          || ((type(e.value) == list) == (e.operator == 'in')
              && [m.properties[e.property]].all(p,
                 (type(e.value) == list ? e.value : [e.value]).all(v,
                 (!('enum' in p) || v in p.enum)
                 && (!('type' in p) || type(p.type) != string
                     || !(p.type in ['string', 'boolean', 'integer', 'number'])
                     || (p.type == 'string' && type(v) == string)
                     || (p.type == 'boolean' && type(v) == bool)
                     || (p.type == 'integer' && (type(v) == int || (type(v) == double && double(int(v)) == v)))
                     || (p.type == 'number' && (type(v) == int || type(v) == double))))))))))
      code: UI_FILTER_PRESET_VALUE_INVALID
      message: >-
        sets a value its filter cannot hold: one that is not of the property's
        type or not one of its `enum`, a list without the `in` operator, a
        single value with it, anything but `true` under `absent`, or `false`
        for a filter entered with a `toggle`, which holds true or nothing.
    - in: /presets
      condition: !cel "self.presets.exists_one(p, p.label == this.label)"
      code: UI_FILTER_PRESET_LABEL_DUPLICATE
      message: >-
        has the label of another preset. A preset is chosen by its label: give
        each its own.
    - resolve: [/presentation/source/collection]
      condition: !cel >-
        !has(self.policy) || !has(self.policy.state) || !has(self.policy.state.fields)
        || self.policy.state.fields.all(k, has(self.fields)
          ? self.fields.exists(f, f.property == k)
          : !has(self.presentation.source.collection.query) || !has(self.presentation.source.collection.query.filters)
            || self.presentation.source.collection.query.filters.exists(f, f.property == k))
      code: UI_STATE_FIELD_UNKNOWN
      message: >-
        keeps a property under `policy.state.fields` no filter of the bar
        shows. Name only properties its filters enter, or leave
        `state.fields` out to keep every one.
    # With a placement written, the placement's own rule answers this.
    - severity: warning
      condition: !cel >-
        (has(self.policy) && (has(self.policy.placement)
          || (has(self.policy.show) && self.policy.show == 'chosen')))
        || !has(self.fields)
        || !self.fields.exists(f, 'pinned' in f && f.pinned)
      code: UI_FILTER_PINNED_UNUSED
      message: >-
        pins a field, but nothing folds: every filter is on show whatever is
        pinned. Use a placement that folds, show only the `chosen` filters, or
        remove `pinned`.
---
# One entry of a form or an action. Its kind judges whether it can enter its
# property in the model of whoever places it: a rule on the referrer for
# `telo check`, the same answer from `invoke` at creation.
kind: Telo.Abstract
metadata:
  name: Field
  description: >-
    One entry of a data-entry form: the property it enters, the labelled
    section it is drawn in and when it is shown. Answers, for the data model
    of the form placing it, whether it can enter that property there and what
    a renderer draws for it, so a field from any module is checked against the
    model it is placed in.
capability: Telo.Invocable
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [model]
    properties:
      model:
        title: Model
        description: The schema of the record the form or action enters.
        type: object
outputType: !ref FieldAnswer
schema:
  type: object
  required: [property]
  properties:
    property:
      title: Property
      description: The model property the field enters.
      type: string
    group:
      title: Group
      description: The name of the section of `groups` the field is drawn in.
      type: string
    shown:
      title: Shown
      description: >-
        Whether the field is drawn, over the form's current `values`. A hidden
        field keeps what it holds and is neither sent nor checked, while the
        record is still held to the model.
      $ref: "telo://Self/Condition"
      x-telo-context:
        type: object
        properties:
          values: { x-telo-context-from-referrer: values, x-telo-context-eval: accessor }
---
kind: Telo.Definition
metadata:
  name: InputField
  description: >-
    A form field entering one property with a control: chosen from the
    property's type, or a select list, options side by side, an on/off switch,
    a slider or typed tags. A control the property cannot be entered with is
    caught before the page is ever served.
capability: Telo.Invocable
extends: Self.Field
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#InputFieldController]
schema:
  type: object
  additionalProperties: false
  properties:
    control:
      title: Control
      description: >-
        How the value is entered: derived from the property (`auto`), a
        `select` list, `options` side by side, a `toggle`, a `slider`, or
        typed `tags`.
      $ref: "telo://Self/Control"
      default: auto
  x-telo-referrer-rules:
    - referrer: Self.Form
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, (has(referrer.model.schema) ? referrer.model.schema : referrer.model),
          !has(m.properties) || !(self.property in m.properties)
          || Self.controlFits(has(self.control) ? self.control : 'auto', m.properties[self.property], null))
      code: UI_FIELD_CONTROL_UNSUPPORTED
      message: >-
        asks for a control its property cannot be entered with. Every control
        needs one plain value or a list of them; `select` and `options` need an
        `enum` or a boolean, `toggle` a boolean, `slider` a number declaring
        `minimum` and `maximum`, and `tags` a list.
    - referrer: Self.Action
      resolve: [/inputModel]
      condition: !cel >-
        cel.bind(m, (has(referrer.inputModel.schema) ? referrer.inputModel.schema : referrer.inputModel),
          !has(m.properties) || !(self.property in m.properties)
          || Self.controlFits(has(self.control) ? self.control : 'auto', m.properties[self.property], null))
      code: UI_FIELD_CONTROL_UNSUPPORTED
      message: >-
        asks for a control its property cannot be entered with. Every control
        needs one plain value or a list of them; `select` and `options` need an
        `enum` or a boolean, `toggle` a boolean, `slider` a number declaring
        `minimum` and `maximum`, and `tags` a list.
---
kind: Telo.Definition
metadata:
  name: ChoiceField
  description: >-
    A form field choosing one value, or several for a list, from options read
    from an API: drawn as a select list or as options side by side, narrowed
    by other values of the form. An option value of another type than the
    property is caught before deploy.
capability: Telo.Invocable
extends: Self.Field
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ChoiceFieldController]
schema:
  type: object
  additionalProperties: false
  required: [options]
  properties:
    options:
      title: Options
      description: Where the options come from, over the form's current `values`.
      x-telo-ref: { kind: Self.OptionSource, use: dependency }
      x-telo-context:
        type: object
        properties:
          values: { x-telo-context-from-referrer: values, x-telo-context-eval: accessor }
    control:
      title: Control
      description: >-
        How the options are drawn: a `select` list (`auto`), or `options` side
        by side.
      $ref: "telo://Self/Control"
      default: auto
  x-telo-referrer-rules:
    - referrer: Self.Form
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, (has(referrer.model.schema) ? referrer.model.schema : referrer.model),
          !has(m.properties) || !(self.property in m.properties)
          || ((!has(self.control) || self.control in ['auto', 'select', 'options'])
              && Self.controlFits('auto', m.properties[self.property], null)))
      code: UI_FIELD_CONTROL_UNSUPPORTED
      message: >-
        asks for a control a choice cannot be drawn with, or for a property no
        choice can enter. A choice is a `select` list or `options` side by side,
        over a string, a number, a boolean, or a list of those.
    - referrer: Self.Action
      resolve: [/inputModel]
      condition: !cel >-
        cel.bind(m, (has(referrer.inputModel.schema) ? referrer.inputModel.schema : referrer.inputModel),
          !has(m.properties) || !(self.property in m.properties)
          || ((!has(self.control) || self.control in ['auto', 'select', 'options'])
              && Self.controlFits('auto', m.properties[self.property], null)))
      code: UI_FIELD_CONTROL_UNSUPPORTED
      message: >-
        asks for a control a choice cannot be drawn with, or for a property no
        choice can enter. A choice is a `select` list or `options` side by side,
        over a string, a number, a boolean, or a list of those.
    - referrer: Self.Form
      resolve: [/model]
      resolveSelf: [/options/model]
      condition: !cel >-
        cel.bind(m, (has(referrer.model.schema) ? referrer.model.schema : referrer.model),
        cel.bind(o, has(self.options.model.schema) ? self.options.model.schema : self.options.model,
          !has(m.properties) || !(self.property in m.properties)
          || !('root' in self.options.value) || size(self.options.value.path) != 1
          || !has(o.properties) || !(self.options.value.path[0] in o.properties)
          || cel.bind(p, m.properties[self.property],
             cel.bind(e, (!('type' in p) ? [] : (type(p.type) == list ? p.type : [p.type]).filter(t, t != 'null')) == ['array'] ? ('items' in p && type(p.items) == map ? p.items : {}) : p,
             cel.bind(want, (!('type' in e) ? [] : (type(e.type) == list ? e.type : [e.type]).filter(t, t != 'null')),
             cel.bind(v, o.properties[self.options.value.path[0]],
             cel.bind(have, (!('type' in v) ? [] : (type(v.type) == list ? v.type : [v.type]).filter(t, t != 'null')),
               want.size() == 0 || have.size() == 0
               || have.all(t, t in want || (t == 'integer' && 'number' in want)))))))))
      code: UI_FIELD_OPTION_VALUE_MISMATCH
      message: >-
        offers options whose value is of another type than the property holds,
        or than its items hold for a list. Make the source's `value` read a
        property of the property's type, or enter another property.
    - referrer: Self.Action
      resolve: [/inputModel]
      resolveSelf: [/options/model]
      condition: !cel >-
        cel.bind(m, (has(referrer.inputModel.schema) ? referrer.inputModel.schema : referrer.inputModel),
        cel.bind(o, has(self.options.model.schema) ? self.options.model.schema : self.options.model,
          !has(m.properties) || !(self.property in m.properties)
          || !('root' in self.options.value) || size(self.options.value.path) != 1
          || !has(o.properties) || !(self.options.value.path[0] in o.properties)
          || cel.bind(p, m.properties[self.property],
             cel.bind(e, (!('type' in p) ? [] : (type(p.type) == list ? p.type : [p.type]).filter(t, t != 'null')) == ['array'] ? ('items' in p && type(p.items) == map ? p.items : {}) : p,
             cel.bind(want, (!('type' in e) ? [] : (type(e.type) == list ? e.type : [e.type]).filter(t, t != 'null')),
             cel.bind(v, o.properties[self.options.value.path[0]],
             cel.bind(have, (!('type' in v) ? [] : (type(v.type) == list ? v.type : [v.type]).filter(t, t != 'null')),
               want.size() == 0 || have.size() == 0
               || have.all(t, t in want || (t == 'integer' && 'number' in want)))))))))
      code: UI_FIELD_OPTION_VALUE_MISMATCH
      message: >-
        offers options whose value is of another type than the property holds,
        or than its items hold for a list. Make the source's `value` read a
        property of the property's type, or enter another property.
