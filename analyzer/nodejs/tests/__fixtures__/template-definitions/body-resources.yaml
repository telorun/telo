# What a template body's CEL `resources` holds: the body's own entries over the
# module's readings, a family as a map by element key.
kind: Telo.Library
metadata:
  name: BodyResources
imports:
  Run: ../../../../../modules/run
  Config: ../../../../../modules/config
  Kinds: ../../../../../tests/__fixtures__/check-run-agreement/scope-members/kinds
exports:
  kinds: [Pipeline]
---
kind: Telo.Definition
metadata: { name: Pipeline }
capability: Telo.Invocable
schema:
  type: object
  required: [jobs]
  properties:
    jobs:
      type: object
      additionalProperties: { type: object }
resources:
  - !for-each
    metadata: { name: counters }
    in: !cel "self.jobs"
    emit:
      kind: Kinds.Counter
  - kind: Kinds.Counter
    metadata: { name: tally }
  - kind: Config.Variables
    metadata: { name: startup }
    storeRef: { name: nothing }
    keys:
      runs: !cel "string(resources.tally.status.runs)"
  - kind: Run.Sequence
    metadata: { name: pipeline }
    steps:
      - !for-each
        name: seen
        in: !cel "self.jobs"
        emit:
          value: !cel "resources.counters[each.key].status.runs + resources.counters[each.key].status.runz"
      - name: sibling
        value: !cel "resources.tally.status.runs"
      - name: typo
        value: !cel "resources.tally.status.runz"
      - name: gone
        value: !cel "resources.nothing"
  - kind: Config.Variables
    metadata: { name: startupFamily }
    storeRef: { name: nothing }
    keys:
      runs: !cel "string(resources.counters['a'].status.runs)"
  - !for-each
    metadata: { name: shadows }
    in: !cel "resources.tally"
    emit:
      kind: Kinds.Counter
  - !for-each
    metadata: { name: viaFamily }
    in: !cel "resources.counters"
    emit:
      kind: Kinds.Counter
invoke: !ref pipeline
---
kind: Run.Sequence
metadata: { name: outside }
steps:
  - name: read
    value: !cel "resources.counters"
