  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/mal.traineddata.gz:
        { upstream: mal, member: package/4.0.0_best_int/mal.traineddata.gz, sha256: a4a5b24474889dbbe9943bb3cb7b24819c1cd594f2f371340bba83c30fd81bf0, executable: false }
---
kind: TesseractModel.Language
metadata:
