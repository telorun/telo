kind: Telo.Application
metadata:
  name: HelloWebExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/hello-web` unmodified on a port of this test's own and reads both
    of its pages.
imports:
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    ports: { http: 8851 }
targets:
  - !ref app
steps:
  - name: home
    invoke: { kind: HttpClient.Request, url: "http://127.0.0.1:8851/", method: GET, responseType: text }
  - name: settings
    invoke: { kind: HttpClient.Request, url: "http://127.0.0.1:8851/settings", method: GET, responseType: text }
  - name: verifyPages
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        home: { status: !cel "steps.home.result.status", body: !cel "steps.home.result.body" }
        settings: { status: !cel "steps.settings.result.status", body: !cel "steps.settings.result.body" }
      expected:
        home: { status: 200, body: "<h1>Hello, world!</h1>" }
        settings: { status: 200, body: "<h1>Settings</h1>" }
