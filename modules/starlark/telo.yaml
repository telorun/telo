kind: Telo.Library
metadata:
  version: 0.11.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Compute]
  name: starlark
  description: >-
    Runs embedded Starlark — the sandboxed, Python-like configuration language — as a
    callable resource with typed inputs and outputs. Deterministic, with no I/O and no
    access to the host, so it suits pure data transformation and policy decisions
    rather than side effects.
exports:
  kinds:
    - Script
---
kind: Telo.Definition
metadata:
  name: Script
  description: >-
    Evaluates embedded Starlark source: the code defines a `run(input)` function whose
    return value becomes the result, checked against optional input and output types.
    Sandboxed and deterministic — no I/O, no host access — for data transformation and
    policy logic.
capability: Telo.Invocable
controllers:
  - pkg:npm/@telorun/starlark@0.5.0?local_path=./nodejs#script
  - pkg:cargo/telorun-starlark?local_path=./rust
schema:
  type: object
  properties:
    metadata:
      type: object
      properties:
        name:
          type: string
      required: [name]
    code:
      title: Code
      description: Starlark source code to execute.
      type: string
      x-telo-widget: code
    inputType:
      title: Input Type
      description: Named type reference or inline type definition for script inputs.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    outputType:
      title: Output Type
      description: Named type reference or inline type definition for script outputs.
      x-telo-ref:
        kind: Telo.Type
        use: schema
  required: [metadata, code]
