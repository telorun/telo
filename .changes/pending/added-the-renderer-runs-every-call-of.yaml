units:
  modules/ui-react: Added
body: "The renderer runs every call of a declared mutation where a bound action ran: a
  listing's and a list's row actions, a markdown annotation, a button node and a
  layout's move. A call's prompt opens a dialog of its own fields and sends only once
  they fit its schema; its success announces the mutation's invalidates and runs its
  onSuccess effects in order, each once the one before has happened, by the page shell,
  so they still run after the surface that made the call has closed; a serial mutation
  is one queue across every place it is run from. The record a call makes is judged
  against the mutation's input model before it is sent. A form draws with no collection:
  with neither a record nor onSubmit it has no submit button. Its onSubmit judges the
  record against the mutation, waits for what autosave has to save, draws its result,
  applies afterSubmit and then runs the form's onSuccess over values and result; its
  autosave sends the record as it settles (a choice at once, typed text after debounce,
  a hidden page what waits), never aborts or reorders a write, holds changes made while
  one is pending as one write of the newest values, draws saving while awaited (the
  answer region aria-busy) and a failure with a retry button, and keeps the form unsaved
  until a write is acknowledged. Each write's findings land on the field its input names
  as values.<property>, the rest in its answer region; clearAnswerOn clears both writes'
  answers. A query or listing naming a form reads its settled, valid record as form:
  nothing is read or drawn until the form, placed on the page, first holds one, and two
  placements of a form share one record. A call's answers are drawn in the
  mutation-result and mutation-failure parts wherever it runs, and saving and retry are
  new parts; the action node and the parts action, action-result, action-failure,
  row-answer and row-failure are gone, and a chat's refreshes is invalidates."
