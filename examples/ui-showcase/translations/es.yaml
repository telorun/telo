  # Actions.
  - { text: A bare button, translation: Un botón solo }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "Un modelo de entrada sin propiedades dibuja solo el botón. Este desbloquea todas las tareas bloqueadas de TEL-42, y los recuentos de tareas y la tabla de TEL-42 más abajo se vuelven a leer." }
  - { text: Unblock TEL-42, translation: Desbloquear TEL-42 }
  - { text: An answer drawn from the result, translation: Una respuesta dibujada a partir del resultado }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "La ruta suma las estimaciones de las tareas abiertas de un proyecto. Sus campos son los del modelo de entrada, en dos secciones, con el proyecto elegido de la colección de proyectos y el ritmo en un control deslizante; lo que se introduce se guarda en la dirección. La respuesta se dibuja bajo el botón: frases sobre el resultado y el registro enviado, la fecha en que el trabajo estaría terminado y una lista de las horas por etiqueta." }
  - { text: What to count, translation: Qué contar }
  - { text: How fast, translation: A qué ritmo }
  - { text: Estimate, context: verb, translation: Estimar }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} no tiene trabajo abierto."
        one: "{$hours} h en {$tasks} tarea abierta de {$project}"
        other: "{$hours} h en {$tasks} tareas abiertas de {$project}"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation:
      plural: weeks
      cases:
        one: "Alrededor de {$weeks} semana a {$pace} h por semana, listo el"
        other: "Alrededor de {$weeks} semanas a {$pace} h por semana, listo el"
  - { text: By label, translation: Por etiqueta }
  - { text: When it fails, translation: Cuando falla }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "Un árbol de error propio de la acción, dibujado sobre el error y el registro enviado. Asigna la tarea 4 a james@northwind.example y funciona. Omite el correo electrónico, o nombra a alguien que no está en el equipo, y el rechazo aparece en el campo; la tarea 999 responde 404, y tomas@northwind.example, que se ha ido, 409." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "Esta acción lee la respuesta de la ruta de estimación como un número de días, que la ruta no da: el modelo de salida de la acción rechaza la respuesta, y su árbol de error lo dice." }
  - { text: Estimate in days, translation: Estimar en días }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: la respuesta no es la que lee este botón." }
  - { text: Where a success goes, translation: Adónde lleva un éxito }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "La primera responde con la página que lista las tareas de un proyecto, y la aplicación navega allí. La segunda responde con la página principal del equipo, una dirección https que sustituye la página." }
  - { text: Open its tasks, translation: Abrir sus tareas }
  - { text: Visit the homepage, translation: Visitar la página principal }
  - { text: Reading again after a success, translation: Relectura tras un éxito }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "Mover una tarea vuelve a leer tanto los recuentos de abajo, un lector, como la tabla de TEL-42 más abajo. La respuesta nombra la tarea y su nuevo estado." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: {$todo} por hacer, {$doing} en curso, {$review} en revisión, {$done} terminadas, {$blocked} bloqueadas." }
  - { text: Move, translation: Mover }
  - { text: "Task {$id}, {$title}, is now", translation: "La tarea {$id}, {$title}, tiene ahora el estado" }
  - { text: One press after another, translation: Una pulsación tras otra }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "Los comentarios se envían uno tras otro, en el orden en que se pulsa el botón, por rápido que sea. El botón espera tres caracteres y dice por qué; elegir otra tarea borra la última respuesta. Los comentarios listados abajo se vuelven a leer después de cada uno." }
  - { text: Add the comment, translation: Añadir el comentario }
  - { text: Write three characters or more., translation: Escribe tres caracteres o más. }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        one: "El comentario {$id} es el primero de {$title}."
        other: "Comentario {$id} añadido a {$title}, que ahora tiene {$count} comentarios."
  - { text: Row actions on a table, translation: Acciones de fila en una tabla }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "Cada tarea de TEL-42 ofrece tres botones, cada uno sustituido por su respuesta al pulsarlo. Iniciar se ejecuta al instante, solo en una tarea aún por hacer. Cerrar pregunta antes y no se ofrece en una tarea terminada. Asignar abre un cuadro de diálogo para el correo electrónico, que la fila no da, y muestra el rechazo del servidor en su campo." }
  - { text: Number, translation: Número }
  - { text: Start, context: verb, translation: Iniciar }
  - { text: Closed, translation: Cerrada }
  - { text: Close this task?, translation: "¿Cerrar esta tarea?" }
  - { text: Already started., translation: Ya iniciada. }
  - { text: Already finished., translation: Ya terminada. }
  - { text: Assign, translation: Asignar }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} se ha asignado a {$assignee}." }
  - { text: "Task {$id} is unchanged.", translation: "La tarea {$id} no ha cambiado." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: Acciones de fila en una lista }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "Los últimos comentarios, una lista que dibuja un lector, con los fijados primero. Fijar se ejecuta al instante en un comentario aún no fijado, Eliminar pregunta antes, y Editar pide el nuevo texto en un cuadro de diálogo; dejarlo vacío se rechaza en su campo. La lista se vuelve a leer después de cada acción." }
  - { text: Latest comments, translation: Últimos comentarios }
  - { text: Pin, translation: Fijar }
  - { text: Already pinned., translation: Ya fijado. }
  - { text: Delete this comment?, translation: "¿Eliminar este comentario?" }
  - { text: Rewrite this comment?, translation: "¿Reescribir este comentario?" }
  - { text: More places a success goes, translation: Otros lugares adonde lleva un éxito }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "La primera añade una tarea y navega a la página de tablas, una dirección escrita en el manifiesto. La segunda responde con la dirección del manual, un archivo que el servidor sirve bajo el punto de montaje, que es una carga normal. La tercera responde con el espejo del equipo, una dirección que el navegador lee como otro host: no navega a ninguna parte, y la respuesta lo dice." }
  - { text: Add it and open the tables, translation: Añadir y abrir las tablas }
  - { text: Open the handbook, translation: Abrir el manual }
  - { text: Open the mirror, translation: Abrir el espejo }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "La respuesta fue {$mirror}, que no es una dirección a la que ir, así que la página se queda." }
  - { text: "Refused, and unanswered", translation: "Rechazado y sin respuesta" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "Pausar un proyecto es solo para un gerente. Sin sesión, la protección responde 401. Con la sesión iniciada en la página Datos como james@northwind.example, que no es gerente, la ruta responde 403 sin cuerpo; con la sesión iniciada como ada@northwind.example, pausa el proyecto, y rechaza uno que no está en marcha en el idioma de la página. El árbol de error predeterminado de la acción dibuja cada rechazo." }
  - { text: Pause the project, translation: Pausar el proyecto }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "{$code} no está en marcha, así que no se puede pausar." }
  - { text: "{$name} is paused.", translation: "{$name} está en pausa." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "Esta ruta reenvía cada solicitud a sí misma, así que el navegador se rinde y no llega ninguna respuesta. El árbol de error lo dice: el error no lleva estado." }
  - { text: Call a route that never answers, translation: Llamar a una ruta que nunca responde }
  - { text: "The route answered, with the status", translation: "La ruta respondió, con el estado" }
  - { text: "No answer arrived, so there is no status.", translation: "No llegó ninguna respuesta, así que no hay estado." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: Acciones de fila que leen la dirección }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "La tabla lista las tareas del proyecto que nombra la dirección, y Mover envía una tarea al estado que nombra la dirección, leído de la consulta de la tabla al pulsarlo. La fila y la dirección fijan cada campo del movimiento, así que su cuadro de diálogo no pregunta nada y es una simple confirmación. Elige un proyecto y un estado:" }
  - { text: TEL-42 into review, translation: TEL-42 a revisión }
  - { text: APP-5 to finished, translation: APP-5 a terminado }
  - { text: OPS-7 back to in progress, translation: OPS-7 de vuelta a en curso }
  - { text: Neither, translation: Ninguno }
  - { text: Moved to, translation: Movida a }
  - { text: Move this task to the status the address names?, translation: "¿Mover esta tarea al estado que nombra la dirección?" }
  - { text: Choose a status above first., translation: Elige primero un estado arriba. }

  # Components.
  - { text: A component on the page, translation: Un componente en la página }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "Un componente escrito en TSX y distribuido por una biblioteca de este ejemplo, colocado con propiedades fijas. Usa todo lo que le da el anfitrión: muestra dónde está la página, guarda en la dirección qué panel está abierto, navega a otra página con navigate y con un enlace desde href, y se le rechaza una dirección https. Lee cómo está TEL-42 y añade una tarea con fetch, avisa de que las tareas cambiaron con notifyChanged — así la tabla de abajo se vuelve a leer — y cuenta cada cambio del que se entera con onChanged, incluidas las ediciones y eliminaciones de la propia tabla. Una tarea que añade se anuncia en una capa propia en la esquina de la página." }
  - { text: A component in a cell, translation: Un componente en una celda }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "La columna de prioridad la dibuja un componente que recibe la prioridad de cada fila y si la tarea está bloqueada. La tabla lista las tareas de TEL-42 sobre la misma colección en la que escribe el componente, así que se vuelve a leer cuando se añade una tarea arriba; el componente se entera de sus ediciones y eliminaciones." }
  - { text: Its stylesheet, translation: Su hoja de estilos }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "Las fuentes de los componentes importan una hoja de estilos propia, que la aplicación coloca en la capa telo.component: después del tema y la marca, antes de la hoja de estilos propia de la aplicación. Cada valor en ella lee un token de diseño, así que el escritorio y el medidor adoptan el aspecto de cada punto de montaje." }

  # CRUD.
  - { text: A generated admin screen, translation: Una pantalla de administración generada }
  - { text: "One declaration over the tasks collection the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the collection, so the screen offers exactly what the API accepts.", translation: "Una única declaración sobre el modelo de tareas desde el que se sirve la API: una barra de filtros, una tabla ordenable y paginada, un formulario para añadir una tarea y otro para cambiarla, y eliminar con confirmación en cada fila. Las columnas, los campos y los filtros se derivan todos del modelo, así que la pantalla ofrece exactamente lo que acepta la API." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "La barra se sitúa junto a la tabla en el borde final y muestra solo los filtros que eliges, cada uno como un chip que abre su control. Guarda su elección en este navegador bajo la clave aside — la clave de la barra junto a la tabla en la página Filtros, así que un filtro elegido en cualquiera de las dos páginas queda elegido en ambas." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "Una tarea nueva se abre en un cajón desde el borde final, que sigue abierto, vacío, para la siguiente. Una tarea se cambia en un panel junto a la lista, que forma parte de la dirección, y salir de él con datos sin guardar pregunta antes." }

  # Related records.
  - { text: "Related records", translation: "Registros relacionados" }
  - { text: "Posts and their authors", translation: "Entradas y sus autores" }
  - { text: "Each post names its author by key. The author column shows the author's name instead, read in one request for every author on the page, and the bar's author filter offers every author by name. The create and edit forms pick the author from a list of authors, searched by name.", translation: "Cada entrada nombra a su autor por su clave. La columna de autor muestra en su lugar el nombre del autor, leído en una sola petición para todos los autores de la página, y el filtro de autor de la barra ofrece cada autor por su nombre. Los formularios de creación y edición eligen el autor de una lista de autores, buscada por nombre." }
  - { text: "Only the authors with posts", translation: "Solo los autores con entradas" }
  - { text: "These filters offer only the authors and the statuses present among the posts the other filters leave, each with how many posts it has. The posts are drawn as cards, and as a list below the breakpoint, loading more as you reach the end.", translation: "Estos filtros ofrecen solo los autores y los estados presentes entre las entradas que dejan los demás filtros, cada uno con cuántas entradas tiene. Las entradas se dibujan como tarjetas, y como una lista por debajo del punto de corte, que carga más al llegar al final." }
  - { text: "On a board by status", translation: "En un tablero por estado" }
  - { text: "One column per status, each read and counted on its own. Drag a card to another column, or move it from its menu, to change its status; every list of posts on the page reads again.", translation: "Una columna por estado, cada una leída y contada por su cuenta. Arrastra una tarjeta a otra columna, o muévela desde su menú, para cambiar su estado; todas las listas de entradas de la página se vuelven a leer." }
  - { text: "On a calendar", translation: "En un calendario" }
  - { text: "The posts on the day each is published, a month at a time; the month shown reads every post dated in it. A post with no date is not on the calendar.", translation: "Las entradas en el día en que se publica cada una, un mes cada vez; el mes mostrado lee todas las entradas fechadas en él. Una entrada sin fecha no está en el calendario." }
  - { text: "The authors", translation: "Los autores" }
  - { text: "The authors' own screen, generated from their collection. It reads the same address the posts' author filter and picker read, so an author added here is offered there at once.", translation: "La pantalla propia de los autores, generada a partir de su colección. Lee la misma dirección que leen el filtro y el selector de autor de las entradas, así que un autor añadido aquí se ofrece allí al instante." }
  - { text: "Reporting lines as a tree", translation: "Líneas de dependencia como árbol" }
  - { text: "Each person names who they report to, a relation of the people to themselves. The tree reads the people who report to nobody first, and a person's reports when they are opened. The form picks the manager from the same people.", translation: "Cada persona nombra a quién reporta, una relación de las personas consigo mismas. El árbol lee primero a las personas que no reportan a nadie, y los subordinados de una persona cuando se abre. El formulario elige al responsable entre las mismas personas." }
  # The labels of the related-records page's models.
  - { text: "Author", translation: "Autor" }
  - { text: "Draft", translation: "Borrador" }
  - { text: "Published", translation: "Publicado" }
  - { text: "Published on", translation: "Publicado el" }
  - { text: "Reports to", translation: "Reporta a" }
  - { text: "Post", translation: "Entrada" }

  # Themes.
  - { text: Four mounts of one design, translation: Cuatro puntos de montaje de un mismo diseño }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "Las mismas páginas se sirven cuatro veces, y cada aplicación nombra su propio tema, marca y navegación. Las páginas son un único conjunto de vistas, colocadas por referencia desde las cuatro, así que solo difieren el aspecto y la navegación." }
  - { text: At the root, translation: En la raíz }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "El aspecto integrado, la hoja de estilos propia de este ejemplo encima y una marca elegida en cada solicitud: el conjunto de tokens Acme mientras una cookie lo pida, y los valores propios del tema en otro caso." }
  - { text: Under /radix, translation: Bajo /radix }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "El tema Radix: su hoja de estilos y sus trece controles — las listas de selección, los cuadros de diálogo, los cajones, las ventanas emergentes, los menús y las descripciones emergentes — con la marca a cargo del tema." }
  - { text: Under /brand, translation: Bajo /brand }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "Un tema propio de este ejemplo: los controles de Radix bajo una hoja de estilos escrita aquí, con valores de tokens propios. La marca de la aplicación es un conjunto de tokens, que incluye el tipo de letra Inter que nombra el tema." }
  - { text: Under /sidebar, translation: Bajo /sidebar }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "El aspecto integrado con la navegación en una barra lateral junto a la página, que se contrae a un riel y recuerda sus grupos abiertos. En un teléfono se convierte en una barra de pestañas a lo largo del borde inferior." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "Un enlace se resuelve bajo el punto de montaje en el que se dibuja, así que los enlaces entre los puntos de montaje y el cambio de marca están en la página Temas de la aplicación raíz." }
  - { text: Every design token, translation: Cada token de diseño }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "Cada token del conjunto cerrado tal como lo dan el tema y la marca de esta página, leído de la propiedad personalizada a la que lo proyecta el renderizador, con una muestra dibujada con él. Abre otro punto de montaje, o cambia la marca en la raíz, y los valores cambian." }
  - { text: Typefaces, translation: Tipos de letra }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "Los tipos de letra del cuerpo y de los encabezados en cada una de sus cuatro variantes, y para cada variante si esta aplicación la sirve. Bajo /brand son las variantes normal, negrita, cursiva y negrita cursiva de Inter, que se incluyen con el ejemplo y se sirven con la página; los otros dos puntos de montaje no sirven ninguna y usan las fuentes propias del usuario." }
  - { text: Switch the mount or the brand, translation: Cambiar el punto de montaje o la marca }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "Estos enlaces son propios de esta aplicación: un enlace se resuelve bajo el punto de montaje en el que se dibuja, así que solo la aplicación de la raíz llega a los otros dos. Cada uno es una carga normal de otra aplicación." }
  - { text: Open the Radix mount, translation: Abrir el punto de montaje Radix }
  - { text: Open the brand mount, translation: Abrir el punto de montaje de marca }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "La marca de esta aplicación se elige en cada solicitud. El interruptor establece o borra una cookie y vuelve aquí, y mientras la cookie está presente se usa el conjunto de tokens Acme en lugar de los valores propios del tema." }
  - { text: Use the Acme brand, translation: Usar la marca Acme }
  - { text: "Use the theme's own values", translation: Usar los valores propios del tema }

