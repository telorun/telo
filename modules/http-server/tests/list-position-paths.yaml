kind: Telo.Application
metadata:
  name: ListPositionPathsTest
  version: 1.0.0
  description: |
    One route, two producers of the validation 400: the validator refuses text
    the schema does not accept, and a plain-encoded slot refuses text its
    encoding does not read. Both answer the same problem, each finding a JSON
    Pointer into the request as CEL reads it (`/body/items/0/name`,
    `/body/items/0/at`) with its keyword and params and no prose.
imports:
  Http: ../
  HttpClient: ../../http-client
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
kind: Http.Api
metadata: { name: api }
routes:
  - request:
      path: /events
      method: POST
      schema:
        body:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  name: { type: string, maxLength: 3 }
                  at: { x-telo-type: Telo.Timestamp }
    handler:
      kind: Run.Value
      value: {}
    returns:
      - status: 200
        content:
          application/json:
            body: { ok: true }
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: Http.Server
    metadata: { name: Server }
    listen:
      address: 127.0.0.1
      port: 8997
    mounts:
      - path: /
        mount: !ref api
targets:
  - !ref Server
steps:
  - name: tooLong
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8997/events
      method: POST
      body: { items: [{ name: "too long" }] }
  - name: undecodable
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8997/events
      method: POST
      body: { items: [{ name: "a", at: "0000-01-01T00:00:00Z" }] }
  - name: assertOneShape
    inputs:
      actual:
        tooLong:
          status: !cel "steps.tooLong.result.status"
          contentType: !cel "steps.tooLong.result.headers['content-type']"
          body: !cel "steps.tooLong.result.body"
        undecodable:
          status: !cel "steps.undecodable.result.status"
          contentType: !cel "steps.undecodable.result.headers['content-type']"
          body: !cel "steps.undecodable.result.body"
      expected:
        tooLong:
          status: 400
          contentType: application/problem+json; charset=utf-8
          body:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The request is not valid.
            code: ERR_INPUT_INVALID
            data:
              issues:
                - { pointer: /body/items/0/name, keyword: maxLength, params: { limit: 3 } }
        undecodable:
          status: 400
          contentType: application/problem+json; charset=utf-8
          body:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The request is not valid.
            code: ERR_INPUT_INVALID
            data:
              issues:
                - { pointer: /body/items/0/at, keyword: format, params: { format: Telo.Timestamp } }
    invoke:
      kind: Assert.Equals
