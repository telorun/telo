  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/guj.traineddata.gz:
        { upstream: guj, member: package/4.0.0_best_int/guj.traineddata.gz, sha256: f23bec3f02feca371fb37fe1733fca94881af376dc06ede6168ca54068f20efc, executable: false }
---
kind: TesseractModel.Language
metadata:
  name: guj
  description: Gujarati, Gujarati script
code: guj
data: !module-path ./tessdata/guj.traineddata.gz
