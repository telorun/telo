# A store listing a node type whose table its schema does not list.
kind: Telo.Library
metadata:
  name: TableNotInSchema
include:
  - ../../layered-model.yaml
imports:
  Layers: ../../../../../graph-layers-current-sqlite
  SQLite: ../../../../../sqlite
exports:
  resources: [bad]
---
kind: Layers.NodeTable
metadata: { name: orphans }
table: orphans
key: id
columns:
  id: { type: text, nullable: false }
---
kind: Layers.Node
metadata: { name: orphan }
table: !ref orphans
key: id
---
kind: Layers.Store
metadata: { name: bad }
connection: !ref db
schema: !ref appSchema
layer: lost
nodes: [!ref person, !ref orphan]
