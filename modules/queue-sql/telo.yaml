kind: Telo.Library
metadata:
  name: QueueSql
  version: 0.3.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Reliability, Coordination]
  description: >-
    Durable work queues kept in a table of the application's own database, so a
    message can be enqueued in the same transaction as the data it describes —
    a transactional outbox: a rollback discards both, a commit keeps both.
    Workers claim messages concurrently without blocking each other, with
    leases, retries, delays, deduplication by id and per-group ordering.
requires:
  # The controllers ask for the enqueue kinds' schema-root zone with the
  # field-less `ctx.requireZone`, and need the engine Schema's
  # `currentInstantPlus` / `instantParameter` / `skipLockedClause` members — all
  # first in 0.129.0. This file alone reads clean on 0.128.0; the floor is the
  # controllers' runtime surface. Forward-declared: 0.129.0 is the release that
  # carries them.
  telo: ">=0.129.0"
imports:
  Sql: ../sql
  # Aliased by the module's own name rather than the usual `Queue`: one name
  # space holds the aliases and the kinds, and this module's queue kind is
  # `Queue`.
  Queues: ../queue
exports:
  kinds:
    - Queue
    - Enqueue
    - EnqueueMany
  # The controllers every engine module re-exports under its own kinds, so the
  # implementation is one module scope across engines.
  code:
    - specifier: "@telorun/queue-sql"
      format: js
      path: ./nodejs/queue-sql.mjs
      source: ./nodejs/src/index.ts
---
# QueueSql.Queue — one named queue in a table. An engine module's Queue narrows
# `connection`, `schema` and `table` to its own kinds; the table is listed in the
# engine Schema, which creates and migrates it, so the queue issues no DDL.
# There is no engine-neutral table kind: an engine table kind must extend its
# engine's Table with `base:` to be listed in that engine's Schema, and a kind
# has one parent, so it cannot also extend a table kind declared here.
kind: Telo.Abstract
metadata:
  name: Queue
  description: >-
    A durable queue of typed messages kept in a table of the application's own
    database, beside the data it is about. Messages can be enqueued inside the
    same transaction as other writes, are claimed by competing workers that
    pass over each other's rows, and are deduplicated by id within a retention
    window.
extends: Queues.AddressableQueue
schema:
  type: object
  required: [connection, schema, table, name]
  properties:
    connection:
      title: Connection
      description: >-
        The connection the queue's table lives on, and the one a transactional
        enqueue must run inside a transaction of.
      x-telo-ref:
        kind: Sql.Connection
        use: dependency
    schema:
      title: Schema
      description: >-
        The engine schema that lists the queue's table. It creates and migrates
        the table and renders its name; the queue issues no DDL.
      x-telo-ref:
        kind: Sql.Schema
        use: dependency
    table:
      title: Table
      description: The queue's table, declared with the engine module's own queue table kind.
      x-telo-ref:
        kind: Sql.Table
        use: dependency
    name:
      title: Name
      description: >-
        The queue's durable identity inside its table, written into every row it
        stores. Several queues may share one table under different names. Never
        derived from the resource's name, so renaming the resource keeps its
        messages.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    groupBy:
      $ref: "telo://Queues/GroupBy"
---
kind: Telo.Definition
metadata:
  name: Enqueue
  description: >-
    Adds a message to a database-backed queue inside the transaction the caller
    has open on the queue's connection, so the message is stored if and only if
    the transaction's other writes commit — the transactional outbox. Returns
    the message id and whether it was stored; a repeated id with the same
    message stores nothing.
capability: Telo.Invocable
extends: Queues.Enqueue
controllers:
  - pkg:telo/local/js?path=./nodejs/queue-sql.mjs&local_path=./nodejs/src/index.ts#Enqueue
schema:
  type: object
  additionalProperties: false
  required: [queue]
  # Unconditional: a message stored outside the caller's transaction could be
  # delivered for data that rolled back, or lost for data that committed.
  x-telo-requires-zone:
    zone: Sql.Transaction
    key: /queue/connection
    reason: the message would be stored apart from the data written in the same transaction
  properties:
    queue:
      title: Queue
      description: The database-backed queue the message is added to.
      x-telo-ref:
        kind: Self.Queue
        use: dependency
---
kind: Telo.Definition
metadata:
  name: EnqueueMany
  description: >-
    Adds up to a thousand messages to a database-backed queue in one statement,
    inside the transaction the caller has open on the queue's connection, so
    they are stored if and only if that transaction commits. Returns each
    message's id and whether it was stored, in input order.
capability: Telo.Invocable
extends: Queues.EnqueueMany
controllers:
  - pkg:telo/local/js?path=./nodejs/queue-sql.mjs&local_path=./nodejs/src/index.ts#EnqueueMany
schema:
  type: object
  additionalProperties: false
  required: [queue]
  x-telo-requires-zone:
    zone: Sql.Transaction
    key: /queue/connection
    reason: the message would be stored apart from the data written in the same transaction
  properties:
    queue:
      title: Queue
      description: The database-backed queue the messages are added to.
      x-telo-ref:
        kind: Self.Queue
        use: dependency
