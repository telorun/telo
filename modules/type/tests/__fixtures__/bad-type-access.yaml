kind: Telo.Application
metadata:
  name: BadTypeAccess
  version: 1.0.0
imports:
  Type: ../..
  Run: ../../../run
  JavaScript: ../../../javascript
targets:
  - !ref testBadAccess
---
kind: Type.JsonSchema
metadata:
  name: SumOutput
schema:
  type: object
  required: [ sum ]
  properties:
    sum: { type: number }
  additionalProperties: false
---
kind: JavaScript.Script
metadata:
  name: addNumbers
outputType: !ref SumOutput
code: |
  function main({ a, b }) {
    return { sum: a + b }
  }
---
kind: Run.Sequence
metadata:
  name: testBadAccess
steps:
  - name: add
    inputs:
      a: 1
      b: 2
    invoke: !ref addNumbers
  - name: bad
    inputs:
      value: "${{ steps.add.result.nonExistent }}"
    invoke:
      kind: JavaScript.Script
      code: |
        function main(input) { return input }
