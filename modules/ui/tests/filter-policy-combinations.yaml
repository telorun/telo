---
kind: Run.Sequence
metadata: { name: main }
steps:
  - name: read
    invoke: { kind: Probe.Read, source: !ref every }
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        bars: !cel "size(steps.read.result.node.children)"
        distinct: !cel "size(steps.read.result.node.children.map(c, c.placement.show + ' ' + c.placement.controls + ' ' + c.apply + ' ' + c.placement.summary + ' ' + c.placement.type).filter(k, steps.read.result.node.children.exists_one(c, c.placement.show + ' ' + c.placement.controls + ' ' + c.apply + ' ' + c.placement.summary + ' ' + c.placement.type == k)))"
      expected: { bars: 96, distinct: 96 }
