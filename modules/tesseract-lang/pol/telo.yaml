      ./tessdata/pol.traineddata.gz:
        { upstream: pol, member: package/4.0.0_best_int/pol.traineddata.gz, sha256: a20fdec4ff99d8f8e84c708da3e42a4e935c26863055a0ed88aef5c66a59b91b, executable: false }
