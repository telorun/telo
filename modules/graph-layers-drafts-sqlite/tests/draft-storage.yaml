kind: GraphLayers.OpenDraft
metadata: { name: teamOpenDraft }
store: !ref team
---
kind: GraphLayers.OpenDraft
metadata: { name: sharedOpenDraft }
store: !ref shared
---
kind: GraphLayers.Publish
metadata: { name: teamPublish }
store: !ref team
---
kind: GraphLayers.DiscardDraft
metadata: { name: teamDiscard }
store: !ref team
---
kind: GraphLayers.DiscardDraft
metadata: { name: sharedDiscard }
store: !ref shared
