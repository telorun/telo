  description: >-
    A sheet sliding in from an edge of the viewport for a create or edit form:
    a side drawer or a top or bottom sheet in one of four sizes, modal or not,
    closed by Escape, a click outside or a close button. Can be given an
    address so an open form is linkable, and a replacement for narrow
    viewports.
capability: Telo.Provider
extends: Self.ViewportOverlay
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#DrawerController
schema:
  type: object
  additionalProperties: false
  properties:
    side:
      title: Side
      description: The edge of the viewport it slides in from.
      enum: [start, end, top, bottom]
      default: end
    size:
      title: Size
      description: How much of the viewport it takes.
      enum: [small, medium, large, full]
      default: medium
    modal:
      title: Modal
      description: Whether the page behind it is blocked while it is open.
      type: boolean
      default: true
    dismiss:
      title: Dismiss
      description: The ways it can be closed besides the form's own buttons.
      type: object
      additionalProperties: false
      properties:
        escape: { title: Escape, description: The Escape key closes it., type: boolean, default: true }
        outside: { title: Outside, description: A click outside it closes it., type: boolean, default: true }
        closeButton: { title: Close button, description: It shows a close button., type: boolean, default: true }
    address:
