modules:
  modules/crud: Added
body: "Crud.Model: a record's shape for each operation, as four named shapes -
  schemas.read, schemas.list, schemas.create and schemas.update - shared by
  Crud.Resource and Crud.Ui. A create body is validated against create and an update
  body against update; read-one and both writes answer in the read shape, and each list
  row holds the list shape, while a list is filtered and sorted by what the model's
  query declares, typed by read. POST and PUT answer with the stored record, taken from
  the write itself: the id the table assigned and every value it filled in. PUT replaces
  the columns the update shape declares and leaves every other column as it was. The
  create route is rendered through the connection's dialect and names only the columns
  its shape declares. The generated OpenAPI document states each operation's shape, and
  the id path parameter takes the type read declares. Six rules relate the shapes, each
  reported by telo check as RESOURCE_RULE_VIOLATED and refused when the model is created
  as the same name prefixed ERR_: CRUD_MODEL_KEY_UNDECLARED, CRUD_MODEL_KEY_WRITABLE,
  CRUD_MODEL_WRITE_SHAPE_OPEN, CRUD_MODEL_PROPERTY_NOT_READABLE,
  CRUD_MODEL_PROPERTY_TYPE_DIFFERS and CRUD_MODEL_UPDATE_REQUIRES_OPTIONAL. A seventh,
  CRUD_MODEL_FILTER_RESERVED_NAME, refuses a declared filter by a property named limit,
  cursor or sort, or beginning _telo: a filter is sent under its property's name, and
  those are the list route's own parameters. Crud.Ui draws the table from list and the
  filter bar from read, the create form from create and a separate edit form from
  update. BREAKING: model on Crud.Resource and Crud.Ui takes a Crud.Model, no longer a
  Telo.JsonSchema - declare the four shapes and name the model. BREAKING: id is
  declared, required in the read and list shapes and absent from the write shapes; it
  was implicit. BREAKING: POST and PUT answer with the stored record instead of echoing
  the request body. BREAKING: a write needs INSERT / UPDATE ... RETURNING (SQLite 3.35
  or later, PostgreSQL). BREAKING: a response is validated against its shape, so a
  stored row the shape refuses is a 500 naming the property; a column holding NULL whose
  property declares listed values without null is read as a typed property is - left out
  where optional, the empty value of its listed type where required - instead of null."
