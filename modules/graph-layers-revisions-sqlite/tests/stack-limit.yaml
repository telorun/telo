        pinned: !cel "size(steps.thirtyOne.result.bases)"
        refused: !cel "steps.thirtyThirdCode.result"
        unchanged: !cel "steps.listed.result.bases == steps.thirtyOne.result.bases"
      expected:
        pinned: 31
        refused: [GRAPH_BASE_LIMIT, "32"]
        unchanged: true
