# Names only a hand-built tree can hold, written as literal nodes: an uppercase
# HTML tag the parser would lowercase, and an `svg` element with no namespace,
# which the parser always puts in the SVG one. Refused by `telo check` against
# the node shape.
kind: Telo.Application
metadata:
  name: HtmlNodeNameCase
imports:
  Html: ../../
  Run: ../../../run
targets:
  - !ref main
---
kind: Run.Sequence
metadata: { name: main }
steps:
  - name: render
    invoke: { kind: Html.Markup }
    inputs:
      document:
        nodes:
          - type: element
            tag: TITLE
            attrs: {}
            children: [{ type: comment, text: "</TITLE><img src=x onerror=alert(1)>" }]
          - type: element
            tag: Style
            attrs: {}
            children: [{ type: comment, text: "</Style><img src=x onerror=alert(2)>" }]
          - type: element
            tag: svg
            attrs: {}
            children: [{ type: element, tag: p, attrs: {}, children: [{ type: text, text: x }] }]
