modules:
  modules/http-server: Added
body: "Cookies on Http.Server and Http.Api: every request context — route inputs,
  returns and catches, scope-level catches, a guard's inputs and catches, the not-found
  handler and preferredLanguages — carries request.cookies, the Cookie header read per
  RFC 6265 with the first of a repeated name winning and each value as sent; a route's
  request.schema.cookies types request.cookies.<name>, is validated as text the way a
  query is (a refused cookie is answered 400 ERR_INPUT_INVALID at /cookies/<name>) and
  is documented as in: cookie parameters; a returns or catches entry's cookies are
  written as Set-Cookie lines and documented as a Set-Cookie response header;
  preferredLanguages reading a cookie adds Cookie to the response's Vary; and Set-Cookie
  in a route's headers, like Content-Type, is refused at creation as well as by telo
  check."
