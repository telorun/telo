      # just-built CLI. Pulls a fixture over raw.githubusercontent.com at
      # the workflow's commit SHA, so the test exercises the https-anchored
      # install root path (~/.cache/telo/...) end-to-end. The fixture imports
      # the console module from ghcr.io by pin, so this also verifies the OCI
      # round-trip on top of HTTP-rooted controller installs. An example cannot
      # stand in: it imports the working copy by relative path, which a raw URL
      # reaches only as source with no built controller.
      - name: Run remote manifest over raw.githubusercontent.com
        if: needs.select.outputs.mode != 'none'
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/__fixtures__/remote-open/telo.yaml"
