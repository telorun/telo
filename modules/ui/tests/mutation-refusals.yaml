ind that enters it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/submitRequiredNotEntered: leaves a property the model requires with no field, so a valid record could never be sent. List a field for every required property, or leave `fields` out where each one is a scalar or a list of scalars." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/submitRequiredNotEnterable: leaves a property the model requires with no field, so a valid record could never be sent. List a field for every required property, or leave `fields` out where each one is a scalar or a list of scalars." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/submitClearUnknown at 'clearAnswerOn[1]': clears its answers on a property the model does not declare, which never changes. Use a property of `model`, or remove this entry." }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Listing/rowActionInputs: inputs at 'rowActions[0].inputs' do not satisfy remove's declared inputType: / is missing required property 'count'" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Listing/rowActionInputs: inputs at 'rowActions[0].inputs' do not satisfy remove's declared inputType: / must NOT have additional properties ('total' is not allowed)" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Listing/rowActionInputs: inputs at 'rowActions[0].inputs.note' do not satisfy remove's declared inputType: /note must be string" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.View/listRowActionInputs: inputs at 'content.content[0].rowActions[0].inputs' do not satisfy remove's declared inputType: / is missing required property 'count'" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.View/listRowActionInputs: inputs at 'content.content[0].rowActions[0].inputs' do not satisfy remove's declared inputType: / must NOT have additional properties ('total' is not allowed)" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.View/listRowActionInputs: inputs at 'content.content[0].rowActions[0].inputs.note' do not satisfy