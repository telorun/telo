kind: Telo.Application
metadata:
  name: OrderWebhookExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/order-webhook` and sends signed deliveries: the first is fresh,
    a redelivery of it is replayed and writes nothing, and a delivery with a wrong
    signature is refused with 401, since the signature check is the other half of
    the contract.
imports:
  App: oci://ghcr.io/telorun/app@0.7.2#sha256-29SmNhB_A4l2fGjs5eiV0pYRetQ8-ylNBnPHY_iqgOs
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.1#sha256-yODGL4HqbynR4aaPrcN1I2RIsmNBDn3ciL1uobA8nqA
  Crypto: oci://ghcr.io/telorun/crypto@0.2.3#sha256-pijV9uQW2Dhg3XjbhERdeC2ejNCfJPqNGMy_gMgl8rY
  Assert: oci://ghcr.io/telorun/assert@0.23.0#sha256-CT1vdPTra9haCPntji5sJG0qG_acnTaeYxg0roNgZGI
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    ports: { http: 8099 }
targets:
  - !ref app
steps:
  # The example keeps its claims in a database file that outlives the test, so
  # the delivery is identified freshly on every run: a fixed id would be
  # "replayed" the second time this test is run on the same machine.
  - name: delivery
    value:
      id: !cel "'delivery-' + uuidv4()"
      orderId: !cel "'order-' + uuidv4()"
  # The signature covers the exact bytes sent, so the body is a string.
  - name: payload
    value:
      body: !interpolate '{"deliveryId":"${{ steps.delivery.result.id }}","orderId":"${{ steps.delivery.result.orderId }}","amountCents":2500,"currency":"EUR"}'
  - name: signature
    invoke: { kind: Crypto.Hmac }
    inputs:
      op: sign
      key: local-dev-secret
      input: !cel "steps.payload.result.body"

  - name: first
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8099/webhooks/orders
      method: POST
    inputs:
      headers:
        content-type: application/json
        x-signature: !interpolate "sha256=${{ steps.signature.result.value }}"
      body: !cel "steps.payload.result.body"
  - name: verifyFresh
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.first.result.status"
        body: !cel "steps.first.result.body"
      expected:
        status: 202
        body:
          orderId: !cel "steps.delivery.result.orderId"
          state: fresh

  - name: redelivery
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8099/webhooks/orders
      method: POST
    inputs:
      headers:
        content-type: application/json
        x-signature: !interpolate "sha256=${{ steps.signature.result.value }}"
      body: !cel "steps.payload.result.body"
  - name: verifyReplayed
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.redelivery.result.status"
        body: !cel "steps.redelivery.result.body"
      expected:
        status: 202
        body:
          orderId: !cel "steps.delivery.result.orderId"
          state: replayed

  - name: forged
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8099/webhooks/orders
      method: POST
      throwOnHttpError: false
    inputs:
      headers: { content-type: application/json, x-signature: sha256=00 }
      body: !cel "steps.payload.result.body"
  - name: verifyForged
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.forged.result.status"
      expected: 401
