# Draw-shapes agent — an HTTP API where an AI vision agent draws shapes on an image.
#
#   POST /v1/drawings  { "prompt": "a red square top-left and a blue circle box centered" }
#   → 201 { "url": "/drawings/<id>.png", "summary": "..." }
#
# The same route backs a page on `/`: a prompt box, and the summary with a link to the
# drawing once the agent has converged.
#
# How it works: the handler mints a document id, then invokes one Ai.Agent. The agent
# has a single tool, `draw`, that renders rectangles onto a blank 1024×768 canvas,
# saves the PNG under the document id in the drawings directory, and returns the
# rendered image straight back to the model as an image tool result. The model looks
# at what it drew, adjusts, and redraws until the layout matches the request — the
# visual feedback loop that the multimodal tool-result support makes possible. The
# drawings directory is also served at `/drawings`, so once the agent converges the
# handler returns that link. The model only ever passes the document id and the shape
# list; the bytes never ride through it.
#
# Run it (needs a vision-capable OpenAI model and nothing else):
#   OPENAI_API_KEY=sk-...  pnpm run telo ./examples/draw-shapes-agent
kind: Telo.Application
metadata:
  name: DrawShapesAgent
  categories: [ AI, Transport, UI ]
  version: 1.0.0
  description: HTTP API and a web page where an AI vision agent draws shapes on a canvas and returns a link to the saved picture.
lang: en
# 0.128.0: `Telo.Sequence`, which an older analyzer reads as UNDEFINED_KIND.
requires: { telo: ">=0.133.0" }
imports:
  Http: ../../modules/http-server
  Ai: ../../modules/ai
  OpenAI: ../../modules/openai
  HttpClient: ../../modules/http-client
  Image: ../../modules/image
  Fs: ../../modules/fs
  Run: ../../modules/run
  Ui: ../../modules/ui
  UiReact: ../../modules/ui-react
targets:
  - !ref server
  - { name: openUi, invoke: !ref openUi, inputs: { url: !cel "resources.server.status.localUrl" } }
ports: { http: { env: PORT, default: 8080 } }
variables:
  modelId: { env: MODEL, type: string, default: gpt-5.2 }
  drawingsDir:
    env: DRAWINGS_DIR
    type: string
    x-telo-type: { name: Telo.HostPath, entry: directory }
    default: ./drawings
    description: Where the drawings are saved and served from, resolved against the working directory.
secrets: { openaiApiKey: { env: OPENAI_API_KEY, type: string } }
---
# The account: base URL and credential on the client, so the model kind carries
# no key and inherits the 401 re-acquire-and-retry from `http-client`.
kind: HttpClient.BearerToken
metadata: { name: openaiKey }
token: !cel "secrets.openaiApiKey"
---
kind: HttpClient.Client
metadata: { name: openaiClient }
baseUrl: https://api.openai.com/v1
credential: !ref openaiKey
---
kind: HttpClient.Request
metadata: { name: openaiRequest }
client: !ref openaiClient
---
kind: OpenAI.ChatModel
metadata: { name: visionModel }
model: !cel "variables.modelId"
request: !ref openaiRequest
options: { temperature: 0.2 }
---
# Blank canvas seed — regenerated deterministically on every draw, so the field set
# (the shapes) is the only state that changes between turns.
kind: Image.Blank
metadata: { name: canvas }
color: "#FFFFFF"
---
kind: Image.Overlay
metadata: { name: drawBoxes }
stroke: { color: "#1D4ED8", width: 3 }
label: { color: "#FFFFFF", background: "#1D4ED8", placement: top-left }
---
kind: Fs.FileWrite
metadata: { name: saveDrawing }
cwd: !cel "variables.drawingsDir"
---
# The unique object key for one request. uuidv4() (a CEL function) supplies the
# randomness; the value only shapes it into a file name, captured as a step result so
# the handler can hand the SAME id to the agent and later link to it.
kind: Run.Value
metadata: { name: makeId }
inputType:
  kind: Telo.JsonSchema
  schema: { type: object, properties: { seed: { type: string } } }
value:
  documentId: !cel "inputs.seed + '.png'"
---
# The composite tool the agent calls: render shapes → save → return the image. A
# Telo.Sequence (a Telo.Runnable) wrapped as a single tool — the widened Ai.Tools slot.
kind: Telo.Sequence
metadata: { name: drawTool }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      documentId: { type: string }
      shapes:
        type: array
        items:
          type: object
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }
            label: { type: string }
            color: { type: string }
          required: [x, y, width, height]
steps:
  - name: blank
    invoke: !ref canvas
    inputs: { width: 1024, height: 768 }
  - name: mark
    invoke: !ref drawBoxes
    inputs:
      image: !cel "steps.blank.result.image"
      shapes: !cel "inputs.shapes"
  - name: store
    invoke: !ref saveDrawing
    inputs:
      path: !cel "inputs.documentId"
      content: !cel "steps.mark.result.image"
      createParents: true
outputs:
  image: !cel "steps.mark.result.image"
  mediaType: !cel "steps.mark.result.mediaType"
---
# Independent reviewer for the validation loop. A vision Ai.Text that is shown the
# rendered image (in a multimodal user message) and the original request, and judges
# whether they match — a second opinion the drawing agent must satisfy before finishing.
kind: Ai.Text
metadata: { name: critic }
model: !ref visionModel
system: |
  You are a strict visual QA reviewer. You are given a drawing request and the
  rendered image. If the image satisfies the request, reply with exactly: PASS
  Otherwise reply with: FAIL — followed by a short, concrete list of what to change
  (box positions, sizes, missing or extra boxes, labels, colors).
options: { temperature: 0 }
---
# The `validate` tool: re-render the current shapes and have the `critic` review the
# image against the request. Re-rendering from the same shapes is deterministic, so
# the reviewed image is identical to what `draw` stored.
kind: Telo.Sequence
metadata: { name: validateTool }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      request: { type: string }
      shapes:
        type: array
        items:
          type: object
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }
            label: { type: string }
            color: { type: string }
          required: [x, y, width, height]
steps:
  - name: blank
    invoke: !ref canvas
    inputs: { width: 1024, height: 768 }
  - name: mark
    invoke: !ref drawBoxes
    inputs:
      image: !cel "steps.blank.result.image"
      shapes: !cel "inputs.shapes"
  - name: review
    invoke: !ref critic
    inputs:
      messages:
        - role: user
          content:
            - type: text
              text: !cel "'Drawing request: ' + inputs.request + '. Does the rendered image satisfy it? Reply PASS, or FAIL with concrete fixes.'"
            - type: image
              data: !cel "steps.mark.result.image"
              mediaType: !cel "steps.mark.result.mediaType"
outputs:
  verdict: !cel "steps.review.result.text"
---
kind: Ai.Tools
metadata: { name: drawTools }
tools:
  - tool: !ref drawTool
    name: draw
    description: >-
      Render the given rectangles onto a blank 1024×768 canvas and save it. Returns
      the rendered image so you can check placement. Call it repeatedly with the FULL
      shape list until the drawing matches the request; the last call is what is saved.
    parameters:
      type: object
      additionalProperties: false
      required: [documentId, shapes]
      properties:
        documentId:
          type: string
          description: The document id from your task. Pass it unchanged on every call.
        shapes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [x, y, width, height]
            properties:
              x: { type: number, description: "Left edge in pixels (0–1024)." }
              y: { type: number, description: "Top edge in pixels (0–768)." }
              width: { type: number, description: "Box width in pixels." }
              height: { type: number, description: "Box height in pixels." }
              label: { type: string, description: "Optional caption drawn at the box corner." }
              color: { type: string, description: "Optional CSS color for this box." }
    # Hand the rendered PNG back to the model as an image content part. Written
    # in the inline form because `Ai.Tools.result` is declared `type: string` in
    # ai@0.13.0 while the runtime has always accepted content parts; the `!cel`
    # form is type-checked against that schema and would be rejected. The schema
    # is fixed in `modules/ai` — switch this to `!cel` once ai republishes.
    result: !cel "{'type': 'image', 'data': result.image, 'mediaType': result.mediaType}"
  - tool: !ref validateTool
    name: validate
    description: >-
      Independently check whether the current shapes produce an image that satisfies
      the request. Pass the original request text and the FULL shape list. Returns
      PASS, or FAIL with concrete fixes. Call this after draw; only finish on PASS.
    parameters:
      type: object
      additionalProperties: false
      required: [request, shapes]
      properties:
        request: { type: string, description: "The original drawing request, verbatim." }
        shapes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [x, y, width, height]
            properties:
              x: { type: number }
              y: { type: number }
              width: { type: number }
              height: { type: number }
              label: { type: string }
              color: { type: string }
    result: !cel "result.verdict"
---
kind: Ai.Agent
metadata: { name: shapeArtist }
model: !ref visionModel
system: |
  You place rectangles on a 1024×768 canvas to satisfy a drawing request.
  Coordinates are pixels, with the origin at the top-left.

  For each request:
  1. Decide the rectangles — position, size, and an optional label and color each.
  2. Call `draw` with the FULL list of rectangles plus the documentId you were given.
  3. Look at the returned image, then call `validate` with the original request and
     the same shape list to get an independent review.
  4. If `validate` returns FAIL, apply its fixes, call `draw` again with the corrected
     full list, and validate again. Repeat until it passes.
  5. Only once `validate` returns PASS, stop and briefly describe what you drew.

  Always pass the documentId unchanged. The last `draw` call is the one that is saved.
maxSteps: 16
toolProviders:
  - provider: !ref drawTools
---
# HTTP handler: mint an id → run the agent (id carried in the prompt) → link to the file.
kind: Telo.Sequence
metadata: { name: handleDraw }
inputType:
  kind: Telo.JsonSchema
  schema: { type: object, properties: { prompt: { type: string } } }
steps:
  - name: genId
    invoke: !ref makeId
    inputs:
      seed: !cel "uuidv4()"
  - name: draw
    invoke: !ref shapeArtist
    inputs:
      prompt: !cel "'Document id: ' + steps.genId.result.documentId + '. Drawing request: ' + inputs.prompt"
outputs:
  url: !cel "'/drawings/' + steps.genId.result.documentId"
  summary: !cel "steps.draw.result.text"
---
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
openapi: { info: { title: Draw Shapes Agent, version: 1.0.0 } }
mounts:
  - path: /v1
    mount: !ref drawRoutes
  - { path: /docs, mount: { kind: Http.Reference } }
  - { path: /drawings, mount: !ref drawingFiles }
  - { path: /, mount: !ref ui }
---
kind: Http.Static
metadata: { name: drawingFiles }
root: !cel "variables.drawingsDir"
---
kind: Http.Api
metadata: { name: drawRoutes }
routes:
  - request:
      path: /drawings
      method: POST
      schema:
        body:
          type: object
          properties: { prompt: { type: string, minLength: 1 } }
          required: [prompt]
    handler: !ref handleDraw
    inputs:
      prompt: !cel "request.body.prompt"
    returns:
      - status: 201
        content:
          application/json:
            body:
              url: !cel "result.url"
              summary: !cel "result.summary"
    catches:
      # Catch-all: covers the handler's declared throws and the agent's runtime
      # failures (e.g. ERR_AGENT_MAX_STEPS when it can't converge within maxSteps).
      - status: 502
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
---
# What the form sends and what comes back; the route says the same.
kind: Telo.JsonSchema
metadata: { name: DrawingRequest }
schema:
  type: object
  required: [prompt]
  additionalProperties: false
  properties: { prompt: { type: string, title: What should be drawn, minLength: 1 } }
---
kind: Telo.JsonSchema
metadata: { name: Drawing }
schema:
  type: object
  required: [url, summary]
  properties:
    url: { type: string, format: uri, title: Drawing }
    summary: { type: string, title: What was drawn }
---
# The agent converges over several model calls, so a press takes a while.
kind: Ui.Action
metadata: { name: drawAction }
inputModel: !ref DrawingRequest
outputModel: !ref Drawing
request: { target: /v1/drawings }
label: Draw
concurrency: serial
result:
  type: stack
  children:
    - { type: value, value: !cel "result.summary" }
    - { type: value, value: !cel "result.url", text: Open the drawing }
---
kind: UiReact.App
metadata: { name: ui }
title: Draw shapes
theme: !ref UiReact.defaultTheme
pages:
  - kind: Ui.Page
    path: /
    title: Draw
    width: contained
    children:
      - { type: text, text: Describe a layout, style: heading }
      - { type: text, text: "For example: a red square top-left and a blue circle centered. The agent draws, reviews its own picture and redraws until it matches.", style: muted }
      - { type: composite, ref: !ref drawAction }
---
kind: Telo.OpenUrl
metadata: { name: openUi }
