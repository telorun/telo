modules:
  modules/session: Added
body: "Two session sets claiming one `name` on one store are refused:
  `SESSION_NAME_DUPLICATE` at `telo check` on each set, and `ERR_SESSION_NAME_DUPLICATE`
  (`data: { name }`, naming both sets) when the second is created. Their records would
  otherwise collide, and each set's tokens would be accepted by the other's verifier.
  The module now requires telo 0.130.0 or later."
