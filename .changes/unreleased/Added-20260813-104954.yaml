project: authoring-agent
kind: Added
body: 'Boot creates the ./workspace directory the shell host runs commands from, so a fresh checkout or deployment no longer fails the first command with `interpreter not found` (spawn reports a missing cwd as ENOENT, which the shell host attributes to the program). The agent gains a general ''telo'' tool: it supplies the CLI argv and a new
  ''teloVerbs'' variable decides which subcommands may run, defaulting to the inspection
  verbs (check, cel, module, search). ''run'', ''publish'', ''install'' and ''upgrade''
  are absent by default, so an anonymous prompt can neither execute a manifest on
  the host nor reach the operator''s registry credentials; a bare path, which the
  CLI would treat as ''run'', is rejected for the same reason. ''checkArgv'' is replaced
  by ''teloProgram'' so the check loop and the new tool cannot drive different CLI
  builds.'
