modules:
  modules/ai-conversation-sql: Added
body: A file registered with a binding is inserted already bound, in one transaction
  with the turn fence an append takes, so a superseded turn registers nothing;
  registering an id that already exists answers the stored row only when it is
  unreleased and pending (no binding) or bound to the binding's conversation, and is
  ERR_CONVERSATION_ATTACHMENT_NOT_FOUND otherwise, so an id never answers another
  conversation's file.
