      # real `cargo build` of fixture crates, so the Rust toolchain is on the
      # unit-test path here exactly as it is on ubuntu.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Controller crates are built into the workspace-anchored `.telo` cache,
          # keyed by SDK backend, which is NOT the workspace `target/` this action
          # caches by default. Without naming it every run rebuilds each napi
          # controller and its dependency tree from cold — minutes on Windows.
