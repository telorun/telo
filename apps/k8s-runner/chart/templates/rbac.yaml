apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-runner.name" . }}
  namespace: {{ .Values.runnerNamespace }}
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
---
# Scoped to the session namespace only — minimal blast radius if compromised.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-runner.name" . }}
  namespace: {{ .Values.sessionNamespace }}
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
rules:
  # `update` on services/ingresses is what lets a watch session re-patch its
  # routing when a reload changes an app's declared port set. Without it the app
  # binds the new port inside the pod and is simply unreachable: no ingress, no
  # error, no event.
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/attach"]
    verbs: ["get", "create"]
  # The workspace application's manifest, delivered to a watch session's pod as
  # a content-addressed ConfigMap the runner reconciles at start. `list`/`delete`
  # are for the boot-time sweep: the name is content-addressed, so every release
  # that changes the manifest would otherwise leave one behind permanently. Reconciled by
  # the runner rather than shipped by this chart so the manifest and the code
  # that depends on it version as one artifact — a chart-only upgrade cannot
  # leave them skewed.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Gateway API is the other current routing layer, and the runner supports both.
  # `list` + `delete` are load-bearing rather than symmetric with Ingress: Gateway
  # API scopes `hostnames` to the whole HTTPRoute, so a session needs ONE ROUTE PER
  # PORT, and a reload that drops a port must delete that port's object — where an
  # Ingress simply loses a rule on replace. Granted unconditionally: the CRDs may
  # not exist, and RBAC on an unserved group is inert rather than an error.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-runner.name" . }}
  namespace: {{ .Values.sessionNamespace }}
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-runner.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-runner.name" . }}
    namespace: {{ .Values.runnerNamespace }}
---
# Read-only namespace check used by /v1/probe, plus the cluster-scoped reads that
# let `sessionRouting.mode: auto` tell an installed routing layer from a usable
# one. IngressClasses are the usable signal for Ingress — `networking.k8s.io` is
# always served, so the API's presence proves nothing, while a registered class
# means a controller installed itself. Both reads fail soft in the runner, so a
# cluster that withholds them falls through to explicit configuration.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-runner.name" . }}-{{ .Release.Namespace }}-probe
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-runner.name" . }}-{{ .Release.Namespace }}-probe
  labels:
    {{- include "k8s-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-runner.name" . }}-{{ .Release.Namespace }}-probe
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-runner.name" . }}
    namespace: {{ .Values.runnerNamespace }}
