kind: Telo.Application
metadata:
  name: TemplatedApiUsage
  version: 1.0.0
  description: |
    Imports `library.yaml` as a `Telo.Library` and mounts its
    `helloApi` twice on the same `Http.Server` — under `/v1` and `/v2`.
    Shows that a single library-defined kind can be reused across multiple
    mount points without duplicating the route definition.

    Run, then:
        curl 'http://localhost:8845/v1/hello?name=World'
        curl 'http://localhost:8845/v2/hello?name=World'
requires: { telo: ">=0.133.0" }
imports: { Http: oci://ghcr.io/telorun/http-server@0.44.1#sha256-0eFkBJRNr4r2hyQCBHcmTKEJU24Fy76Zw5ajQMUZyEs, Templated: ./library.yaml }
ports: { http: { env: PORT, protocol: tcp, default: 8845 } }
targets:
  - !ref templatedApiServer
  - { name: openDocs, invoke: !ref openDocs, inputs: { url: !interpolate "http://localhost:${{ ports.http }}/docs/" } }
---
kind: Http.Server
metadata: { name: templatedApiServer }
listen:
  port: !cel "ports.http"
openapi: { info: { title: "Templated API Example", version: "1.0.0" } }
mounts:
  - path: /v1
    mount: !ref Templated.helloApi
  - path: /v2
    mount: !ref Templated.helloApi
  - { path: /docs, mount: { kind: Http.Reference } }
---
kind: Telo.OpenUrl
metadata: { name: openDocs }
