body: "Controllers return their effects from `init()` / `run()` instead of implementing
  `teardown()`: each allocation is written beside the inverse that undoes it, and the
  runtime unwinds them last-in-first-out. A failure part-way through startup now
  recovers what it already allocated — a bound port releases the kernel hold and
  unregisters the routes, a connection that fails its health check destroys its pool —
  and the retry starts from a freshly constructed resource. Declares `requires: telo:
  '>=0.82.0'`, since an older runtime discards what a controller returns and would
  allocate nothing."
