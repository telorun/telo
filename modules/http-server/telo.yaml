                    cookies: { type: object, additionalProperties: { type: string }, description: "The request's cookies by name, the first of a repeated name, each value as sent." }
                    tls:
                      description: "The TLS session of the socket the request arrived on: `{ protocol }`, null on a plain socket."
                      type: [object, "null"]
                      additionalProperties: false
                      properties: { protocol: { type: string } }
                    clientCertificate:
                      description: "The client certificate the listener received or a trusted proxy forwarded; null when there is none."
                      type: [object, "null"]
                      additionalProperties: false
                      properties:
                        subject: { type: object, additionalProperties: { type: string } }
                        issuer: { type: object, additionalProperties: { type: string } }
                        serialNumber: { type: string }
                        fingerprint256: { type: string }
                        validFrom: { x-telo-type: Telo.Timestamp }
                        validTo: { x-telo-type: Telo.Timestamp }
                        subjectAltNames: { type: array, items: { type: string } }
                        pem: { type: string }
                        verified: { type: boolean }
                        via: { type: string, enum: [listener, proxy] }
                    lang: { type: string, description: "The language negotiated for the request: a served language tag, always present." }
                    method: { type: string }
                    ip: { type: string }
                    principal: { description: "The authenticated caller; null when the request was refused before authenticating, or is anonymous.", anyOf: [{ $ref: "telo://Auth/Principal" }, { type: "null" }] }
                error:
                  type: object
                  additionalProperties: false
                  properties:
                    code: { type: string, x-telo-caught-member: code }
                    message: { type: string }
                    displayMessage:
                      description: The text a person is shown for the failure, as its record; null when it carries none.
                      anyOf: [{ $ref: "telo://manifest#/$defs/TextRecord" }, { type: "null" }]
                    data: { type: object, additionalProperties: true, x-telo-caught-member: data }
                problem:
                  type: object
                  additionalProperties: false
                  description: The default problem (RFC 9457) this entry would render.
                  properties:
                    type: { type: string }
                    title: { type: [string, "null"] }
                    status: { type: integer }
                    detail: { type: [string, "null"] }
                    code: { type: string, x-telo-caught-member: code }
                    data: { type: [object, "null"], additionalProperties: true, x-telo-caught-member: data }
            x-telo-schema-from: "HttpDispatch.Outcomes/$defs/Catches"
        required: [ "request", "returns" ]
        examples:
          - request:
              method: POST
              path: /users
              schema:
                body:
                  type: object
                  required: [ email ]
                  properties:
                    email:
                      type: string
                      format: email
                      description: New user's email address.
                      examples: [ "ada@example.com" ]
                    age: { type: integer, description: Age in years., examples: [36] }
            inputs:
              email: !cel "request.body.email"
              age: !cel "request.body.age"
            handler: !ref InsertUser
            returns:
              - status: 201
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        id: { type: string, description: Generated user id., examples: ["8f14e45f"] }
                        email:
                          type: string
                          description: The created user's email.
                          examples: [ "ada@example.com" ]
                    body:
                      id: !cel "result.rows[0].id"
                      email: !cel "result.rows[0].email"
  required: [ "routes" ]
  x-telo-referrer-rules:
    - referrer: Self.Server
      peers: /mounts
      condition: !cel >-
        !has(self.routes) || self.routes.all(r, !has(r.authentication) || has(r.authentication.verifiers)
        || (has(entry.authentication) && has(entry.authentication.verifiers))
        || (has(r.authentication.anonymous) ? r.authentication.anonymous == 'allow'
