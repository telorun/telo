  # Forms.
  - { text: Every control from the model, translation: Кожен елемент керування з моделі }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "Без записаних полів форма малює по одному елементу керування на кожну властивість, обраному за її схемою: текстове поле, список для переліку, числові поля, дату, дату й час, час, багаторядкове поле для документа, прапорець, варіанти поруч для списку з переліку і введені теги для списку слів. Опис стає підказкою під полем, а типове значення — початковим значенням." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "Кожне поле перевіряється за моделлю, щойно його торкнулися: довжина назви, кількість людей, бюджет із кроком 50, написання ключових слів. Сервер відхиляє назву, яку вже має інша заявка, і його відповідь потрапляє на поле назви. Введене зберігається в адресі та в цьому браузері — усе, крім коду доступу, який модель позначає як лише для запису." }
  - { text: Each control chosen by hand, translation: "Кожен елемент керування, обраний вручну" }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "Та сама заявка з елементом керування, записаним для кожного поля: назва з виведеним елементом керування, вид роботи як варіанти поруч, канали як список із кількома варіантами вибору, кількість людей на повзунку, терміновість як перемикач, а ключові слова як теги. Введене зберігається лише для цієї вкладки." }
  - { text: Requests received, translation: Отримані заявки }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "Останні заявки, надіслані обома формами, що зчитуються знову після кожного збереження." }
  - { text: "Choices, pickers and dates", translation: "Варіанти, засоби вибору й дати" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "Бронювання людей на проєкт. Проєкт обирають зі списку, зчитаного з колекції проєктів, кожен варіант — із кодом як підказкою. Керівника обирають у діалоговому вікні, шукаючи за імʼям, серед активних учасників ролі, обраної вище; вибір іншої ролі знову зчитує варіанти й залишає керівника, лише якщо він досі підходить. Рецензентів обирають у шухляді, кількох одразу, а спонсора — у спливній картці; спонсор спершу має типовий e-mail, показаний як імʼя людини завдяки одному запиту. Помічників пропонують поруч, по троє, з кнопкою «Більше» для решти. Обрана людина має посилання на свій e-mail." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "Період — це дві дати з готовими наборами, тижні в ньому починаються з неділі, спершу встановлено наступний місяць, а понад три місяці показується попередження. Сервер відхиляє період, що закінчується раніше, ніж починається, або триває довше за рік, і його відповідь потрапляє на поле періоду. Людей навколо керівника показано, щойно керівника обрано, а адресу обʼєкта — лише для роботи на місці." }
  - { text: The project, translation: Проєкт }
  - { text: "Which project, and who leads the work.", translation: "Який проєкт і хто керує роботою." }
  - { text: Around the lead, translation: Навколо керівника }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "Хто рецензує роботу, хто її спонсорує і хто допомагає." }
  - { text: When and where, translation: Коли й де }
  - { text: Tomorrow, translation: Завтра }
  - { text: Next week, translation: Наступний тиждень }
  - { text: This month, translation: Цей місяць }
  - { text: Next month, translation: Наступний місяць }
  - { text: Next quarter, translation: Наступний квартал }
  - { text: Next year, translation: Наступний рік }
  - { text: Bookings, translation: Бронювання }
  - { text: "The latest bookings, read again after every save.", translation: "Останні бронювання, що зчитуються знову після кожного збереження." }

  # The labels of the actions page's models.
  - { text: Only these labels, translation: Лише ці мітки }
  - { text: Count blocked tasks, translation: Враховувати заблоковані завдання }
  - { text: Hours a week, translation: Годин на тиждень }
  - { text: Done by, translation: Готово до }
  - { text: No label, translation: Без мітки }
  - { text: Tasks, translation: Завдання }
  - { text: Hours, translation: Години }
  - { text: Days, translation: Дні }
  - { text: Task number, translation: Номер завдання }
  - { text: "Assignee's e-mail", translation: E-mail виконавця }
  - { text: Comment, translation: Коментар }
  - { text: Comment number, translation: Номер коментаря }
  - { text: Pinned, translation: Закріплено }
  - { text: Written, translation: Написано }
  - { text: New text, translation: Новий текст }

  # Actions.
  - { text: A bare button, translation: Сама кнопка }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "Модель введення без властивостей малює саму кнопку. Ця розблоковує кожне заблоковане завдання TEL-42, а лічильники завдань і таблиця TEL-42 нижче зчитуються знову." }
  - { text: Unblock TEL-42, translation: Розблокувати TEL-42 }
  - { text: An answer drawn from the result, translation: "Відповідь, намальована з результату" }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "Маршрут підсумовує оцінки відкритих завдань проєкту. Його поля — це поля моделі введення у двох розділах: проєкт обирають із колекції проєктів, а темп — на повзунку; введене зберігається в адресі. Відповідь малюється під кнопкою: речення з результату й надісланого запису, дата, до якої роботу було б завершено, і список годин за мітками." }
  - { text: What to count, translation: Що рахувати }
  - { text: How fast, translation: Як швидко }
  - { text: Estimate, context: verb, translation: Оцінити }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "У проєкті {$project} немає відкритої роботи."
        one: "{$hours} год у {$tasks} відкритому завданні проєкту {$project}"
        few: "{$hours} год у {$tasks} відкритих завданнях проєкту {$project}"
        many: "{$hours} год у {$tasks} відкритих завданнях проєкту {$project}"
        other: "{$hours} год у {$tasks} відкритого завдання проєкту {$project}"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation:
      plural: weeks
      cases:
        one: "Приблизно {$weeks} тиждень при {$pace} год на тиждень, готово до"
        few: "Приблизно {$weeks} тижні при {$pace} год на тиждень, готово до"
        many: "Приблизно {$weeks} тижнів при {$pace} год на тиждень, готово до"
        other: "Приблизно {$weeks} тижня при {$pace} год на тиждень, готово до"
  - { text: By label, translation: За мітками }
  - { text: When it fails, translation: Коли не вдається }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "Власне дерево помилки дії, намальоване з помилки й надісланого запису. Призначте завдання 4 на james@northwind.example, і все вдасться. Пропустіть e-mail або вкажіть когось не з команди, і відмова зʼявиться біля поля; завдання 999 дає 404, а tomas@northwind.example, який пішов із команди, — 409." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "Ця дія зчитує відповідь маршруту оцінки як кількість днів, якої маршрут не надає: модель виведення дії відхиляє відповідь, і її дерево помилки про це повідомляє." }
  - { text: Estimate in days, translation: Оцінити в днях }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: це не та відповідь, яку зчитує ця кнопка." }
  - { text: Where a success goes, translation: Куди веде успіх }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "Перша відповідає сторінкою із завданнями проєкту, і застосунок переходить туди. Друга відповідає домашньою сторінкою команди — адресою https, яка замінює сторінку." }
  - { text: Open its tasks, translation: Відкрити його завдання }
  - { text: Visit the homepage, translation: Відвідати домашню сторінку }
  - { text: Reading again after a success, translation: Повторне зчитування після успіху }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "Переміщення завдання знову зчитує і лічильники нижче — читач, — і таблицю TEL-42 ще нижче. Відповідь називає завдання і його новий статус." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: до виконання {$todo}, у роботі {$doing}, на перевірці {$review}, завершено {$done}, заблоковано {$blocked}." }
  - { text: Move, translation: Перемістити }
  - { text: "Task {$id}, {$title}, is now", translation: "Завдання {$id}, {$title}, тепер має статус" }
  - { text: One press after another, translation: Одне натискання за іншим }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "Коментарі надсилаються один за одним, у порядку натискань кнопки, хоч би як швидко її натискали. Кнопка чекає на три символи й пояснює чому; вибір іншого завдання очищає останню відповідь. Коментарі, перелічені внизу, зчитуються знову після кожного." }
  - { text: Add the comment, translation: Додати коментар }
  - { text: Write three characters or more., translation: Напишіть щонайменше три символи. }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        "=1": "Коментар {$id} — перший у завданні {$title}."
        one: "Додано коментар {$id} до завдання {$title}, яке тепер має {$count} коментар."
        few: "Додано коментар {$id} до завдання {$title}, яке тепер має {$count} коментарі."
        many: "Додано коментар {$id} до завдання {$title}, яке тепер має {$count} коментарів."
        other: "Додано коментар {$id} до завдання {$title}, яке тепер має {$count} коментаря."
  - { text: Row actions on a table, translation: Дії рядків у таблиці }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "Кожне завдання TEL-42 має три кнопки, і кожна після натискання замінюється своєю відповіддю. «Розпочати» діє одразу, лише для завдання, яке ще до виконання. «Закрити» спершу питає і недоступна для завершеного завдання. «Призначити» відкриває діалогове вікно для e-mail, якого рядок не надає, і показує відмову сервера біля його поля." }
  - { text: Number, translation: Номер }
  - { text: Start, context: verb, translation: Розпочати }
  - { text: Closed, translation: Закрито }
  - { text: Close this task?, translation: Закрити це завдання? }
  - { text: Already started., translation: Уже розпочато. }
  - { text: Already finished., translation: Уже завершено. }
  - { text: Assign, translation: Призначити }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} призначено виконавцю {$assignee}." }
  - { text: "Task {$id} is unchanged.", translation: "Завдання {$id} не змінилося." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: Дії рядків у списку }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "Останні коментарі — список, який малює читач, закріплені спершу. «Закріпити» діє одразу для ще не закріпленого коментаря, «Видалити» спершу питає, а «Редагувати» просить новий текст у діалоговому вікні; порожній текст відхиляється біля свого поля. Список зчитується знову після кожної дії." }
  - { text: Latest comments, translation: Останні коментарі }
  - { text: Pin, translation: Закріпити }
  - { text: Already pinned., translation: Уже закріплено. }
  - { text: Delete this comment?, translation: Видалити цей коментар? }
  - { text: Rewrite this comment?, translation: Переписати цей коментар? }
  - { text: More places a success goes, translation: "Інші місця, куди веде успіх" }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "Перша додає завдання й переходить на сторінку таблиць — за адресою, записаною в маніфесті. Друга відповідає адресою довідника — файлу, який сервер подає в точці монтування і який завантажується звичайним способом. Третя відповідає адресою дзеркала команди, яку браузер читає як інший хост: вона нікуди не веде, і відповідь про це повідомляє." }
  - { text: Add it and open the tables, translation: Додати й відкрити таблиці }
  - { text: Open the handbook, translation: Відкрити довідник }
  - { text: Open the mirror, translation: Відкрити дзеркало }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "Відповіддю була адреса {$mirror}, на яку не можна перейти, тому сторінка лишається." }
  - { text: "Refused, and unanswered", translation: "Відмова й відсутність відповіді" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "Призупинити проєкт може лише менеджер. Без сеансу перевірка доступу відповідає 401. Після входу на сторінці «Дані» як james@northwind.example, який не є менеджером, маршрут відповідає 403 без тіла; після входу як ada@northwind.example він призупиняє проєкт, а проєкт, що не виконується, відхиляє мовою сторінки. Типове дерево помилки дії малює кожну відмову." }
  - { text: Pause the project, translation: Призупинити проєкт }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "Проєкт {$code} не виконується, тому його не можна призупинити." }
  - { text: "{$name} is paused.", translation: "Проєкт {$name} призупинено." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "Цей маршрут перенаправляє кожен запит на самого себе, тож браузер здається й жодна відповідь не надходить. Дерево помилки про це повідомляє: помилка не має статусу." }
  - { text: Call a route that never answers, translation: "Викликати маршрут, який ніколи не відповідає" }
  - { text: "The route answered, with the status", translation: "Маршрут відповів зі статусом" }
  - { text: "No answer arrived, so there is no status.", translation: "Відповідь не надійшла, тому статусу немає." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: "Дії рядків, що зчитують адресу" }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "Таблиця показує завдання проєкту, названого в адресі, а «Перемістити» переносить завдання до статусу, названого в адресі, який зчитується із запиту таблиці в момент натискання. Рядок і адреса задають кожне поле переміщення, тому його діалогове вікно ні про що не питає і є простим підтвердженням. Оберіть проєкт і статус:" }
  - { text: TEL-42 into review, translation: TEL-42 на перевірку }
  - { text: APP-5 to finished, translation: APP-5 до завершених }
  - { text: OPS-7 back to in progress, translation: OPS-7 знову в роботу }
  - { text: Neither, translation: Жоден }
  - { text: Moved to, translation: Переміщено до }
  - { text: Move this task to the status the address names?, translation: "Перемістити це завдання до статусу, названого в адресі?" }
  - { text: Choose a status above first., translation: Спершу оберіть статус вище. }

  # Components.
  - { text: A component on the page, translation: Компонент на сторінці }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "Компонент, написаний на TSX і поставлений бібліотекою цього прикладу, розміщений із фіксованими властивостями. Він використовує все, що дає йому хост: показує, де перебуває сторінка, зберігає в адресі, яку панель відкрито, переходить на іншу сторінку через navigate і через посилання з href, а адресу https йому відхиляють. Він зчитує стан TEL-42 і додає завдання через fetch, повідомляє про зміну завдань через notifyChanged — тож таблиця нижче зчитується знову — і рахує кожну зміну, про яку дізнається через onChanged, зокрема власні редагування й видалення таблиці. Додане завдання він оголошує у власному шарі в куті сторінки." }
  - { text: A component in a cell, translation: Компонент у комірці }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "Колонку пріоритету малює компонент, який отримує пріоритет кожного рядка й те, чи завдання заблоковано. Таблиця показує завдання TEL-42 з тієї самої колекції, у яку пише компонент, тож вона зчитується знову, коли вище додають завдання; про її редагування й видалення дізнається компонент." }
  - { text: Its stylesheet, translation: Його таблиця стилів }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "Джерела компонентів імпортують власну таблицю стилів, яку застосунок розміщує в шарі telo.component: після теми й бренду, перед власною таблицею стилів застосунку. Кожне значення в ній зчитує токен дизайну, тож робоча панель та індикатор набувають вигляду кожної точки монтування." }

  # CRUD.
  - { text: A generated admin screen, translation: Згенерований адміністративний екран }
  - { text: "One declaration over the tasks model the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the model, so the screen offers exactly what the API accepts.", translation: "Одне оголошення над моделлю завдань, на якій працює API: панель фільтрів, сортована таблиця з поділом на сторінки, форма додавання завдання й форма його зміни, а також видалення з підтвердженням у кожному рядку. Колонки, поля й фільтри виводяться з моделі, тож екран пропонує саме те, що приймає API." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "Панель фільтрів стоїть поруч із таблицею біля кінцевого краю й показує лише вибрані вами фільтри, кожен як чип, що відкриває свій елемент керування. Свій вибір вона зберігає в цьому браузері під ключем aside — ключем панелі поруч із таблицею на сторінці «Фільтри», тож фільтр, вибраний на одній сторінці, вибрано на обох." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "Нове завдання відкривається в шухляді від кінцевого краю, яка лишається відкритою й очищеною для наступного. Завдання змінюють у панелі поруч зі списком, яка є частиною адреси, а вихід із неї з незбереженим введенням спершу просить підтвердження." }

  # Themes.
  - { text: Four mounts of one design, translation: Чотири точки монтування одного дизайну }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "Ті самі сторінки подаються чотири рази, і кожен застосунок називає власну тему, бренд і навігацію. Сторінки — це один набір подань, розміщених за посиланням в усіх чотирьох, тож відрізняються лише вигляд і навігація." }
  - { text: At the root, translation: У корені }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "Вбудований вигляд, над ним власна таблиця стилів цього прикладу і бренд, що обирається для кожного запиту: набір токенів Acme, поки про нього просить cookie, а інакше — власні значення теми." }
  - { text: Under /radix, translation: За адресою /radix }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Тема Radix: її таблиця стилів і тринадцять елементів керування — списки вибору, діалогові вікна, шухляди, спливні картки, меню й підказки, — а бренд залишено темі." }
  - { text: Under /brand, translation: За адресою /brand }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "Власна тема цього прикладу: елементи керування Radix під написаною тут таблицею стилів, із власними значеннями токенів. Бренд застосунку — це один набір токенів, який постачає шрифт Inter, названий темою." }
  - { text: Under /sidebar, translation: За адресою /sidebar }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "Вбудований вигляд із навігацією в бічній панелі поруч зі сторінкою, яка згортається до вузької смуги й запамʼятовує відкриті групи. На телефоні вона стає панеллю вкладок уздовж нижнього краю." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "Посилання розвʼязується в точці монтування, у якій його намальовано, тож посилання між точками монтування й перемикач бренду розташовані на сторінці «Теми» кореневого застосунку." }
  - { text: Every design token, translation: Кожен токен дизайну }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "Кожен токен закритого набору таким, яким його задають тема й бренд цієї сторінки, зчитаний із CSS-властивості, у яку його проєктує рендерер, і зі зразком, намальованим із ним. Відкрийте іншу точку монтування або перемкніть бренд у корені, і значення зміняться." }
  - { text: Typefaces, translation: Шрифти }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "Шрифти тексту й заголовків у кожному з чотирьох накреслень і, для кожного накреслення, чи подає його цей застосунок. За адресою /brand це звичайне, жирне, курсивне й жирне курсивне накреслення Inter, які постачаються з прикладом і подаються разом зі сторінкою; дві інші точки монтування не подають жодного й використовують власні шрифти користувача." }
  - { text: Switch the mount or the brand, translation: Перемкнути точку монтування або бренд }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "Ці посилання належать цьому застосунку: посилання розвʼязується в точці монтування, у якій його намальовано, тож лише кореневий застосунок досягає двох інших. Кожне з них — звичайне завантаження іншого застосунку." }
  - { text: Open the Radix mount, translation: Відкрити точку монтування Radix }
  - { text: Open the brand mount, translation: Відкрити точку монтування бренду }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "Бренд цього застосунку обирається для кожного запиту. Перемикач встановлює або видаляє cookie й повертається сюди, і поки cookie є, замість власних значень теми використовується набір токенів Acme." }
  - { text: Use the Acme brand, translation: Використати бренд Acme }
  - { text: "Use the theme's own values", translation: Використати власні значення теми }

