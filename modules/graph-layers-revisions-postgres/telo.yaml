      title: Table
      description: The physical table name.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    sourceColumn:
      title: Source Column
      description: The column holding the source node's key, declared not nullable.
      type: string
      minLength: 1
    targetColumn:
