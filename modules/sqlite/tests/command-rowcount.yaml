kind: Telo.Application
metadata:
  name: SqliteCommandRowCount
  version: 1.0.0
  description: |
    Regression: Sql.Command must report the number of affected rows for plain
    INSERT/UPDATE/DELETE (no RETURNING). The bun:sqlite driver previously
    hardcoded statements as readers, so Kysely never collected numAffectedRows
    and rowCount was always 0 even though the mutation ran.
imports:
  Sql: ../../sql
  SQLite: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
kind: SQLite.Connection
metadata:
  name: db
file: ":memory:"
---
kind: Run.Sequence
metadata:
  name: test
steps:
  - name: create
    inputs:
      sql: "CREATE TABLE t (id INTEGER PRIMARY KEY, v TEXT)"
    invoke:
      kind: Sql.Command
      connection: !ref db

  - name: insert
    inputs:
      sql: "INSERT INTO t (id, v) VALUES (?, ?)"
      bindings: [ !cel "1", !cel "'a'" ]
    invoke:
      kind: Sql.Command
      connection: !ref db

  - name: insert2
    inputs:
      sql: "INSERT INTO t (id, v) VALUES (?, ?)"
      bindings: [ !cel "2", !cel "'b'" ]
    invoke:
      kind: Sql.Command
      connection: !ref db

  - name: updateAll
    inputs:
      sql: "UPDATE t SET v = 'x'"
    invoke:
      kind: Sql.Command
      connection: !ref db

  - name: deleteOne
    inputs:
      sql: "DELETE FROM t WHERE id = ?"
      bindings: [ !cel "2" ]
    invoke:
      kind: Sql.Command
      connection: !ref db

  - name: deleteMissing
    inputs:
      sql: "DELETE FROM t WHERE id = ?"
      bindings: [ !cel "999" ]
    invoke:
      kind: Sql.Command
      connection: !ref db

  - name: assert
    inputs:
      insert: "${{ steps.insert.result.rowCount }}"
      updateAll: "${{ steps.updateAll.result.rowCount }}"
      deleteOne: "${{ steps.deleteOne.result.rowCount }}"
      deleteMissing: "${{ steps.deleteMissing.result.rowCount }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          insert: { const: 1 }
          updateAll: { const: 2 }
          deleteOne: { const: 1 }
          deleteMissing: { const: 0 }
        required: [ insert, updateAll, deleteOne, deleteMissing ]
