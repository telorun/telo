modules:
  modules/sql: Added
  modules/lease: Added
  modules/idempotency: Added
body: "Body slots that establish an execution zone now declare what the region
  guarantees about its contents, in the new closed zone-attribute vocabulary:
  Sql.Transaction.steps declares atomic and noSuspend, Idempotency.Once.invoke declares
  idempotent and noSuspend, and Lease.Critical.invoke declares noSuspend. Lease.Critical
  and Idempotency.Once become zone providers, opening their zone around the dispatched
  body. Each attribute's value is the author's reason, which whatever enforces it quotes
  verbatim."
