kind: Telo.Library
metadata:
  name: VectorStorePgvector
  version: 0.9.2
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Storage, AI]
  description: |
    A durable vector index kept in PostgreSQL with pgvector, ranked by cosine,
    dot-product or euclidean distance. It lives in its own table inside a database the
    application already uses and provisions the extension, table and approximate
    nearest-neighbour index on start-up.
imports:
  VectorStore: ../vector-store
  Sql: ../sql
exports:
  kinds:
    - Store
---
kind: Telo.Definition
metadata:
  name: Store
  description: >-
    Stores vectors in a PostgreSQL table it owns, ranked by a chosen similarity metric
    and fixed to one vector length, with the extension, table and search index created
    on start-up. Shares the database the rest of the application already uses.
capability: Telo.Provider
extends: VectorStore.Store
controllers:
  - pkg:telo/local/js?path=./nodejs/vector-store-pgvector.mjs&local_path=./nodejs/src/index.ts#Store
schema:
  type: object
  required: [connection, dimensions]
  additionalProperties: false
  properties:
    connection:
      title: Connection
      description: Reference to the Postgres Sql.Connection the vectors table lives in.
      x-telo-ref:
        kind: Sql.Connection
        use: dependency
    dimensions:
      title: Dimensions
      type: integer
      minimum: 1
      description: >-
        Vector length; the backing column is `vector(dimensions)`. Fixed at
        provisioning — inserts / queries of other lengths are rejected. Changing
        it requires dropping the table (a re-embed), never an in-place edit.
    metric:
      title: Metric
      type: string
      enum: [cosine, dot, euclidean]
      default: cosine
      description: >-
        Similarity metric used to rank matches — maps to the pgvector `<=>`
        (cosine), `<#>` (inner product), and `<->` (L2) operators and their
        matching ANN index opclass. Higher `score` is always better.
    table:
      title: Table
      type: string
      default: vectors
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      description: >-
        Table name the backend owns for storing vectors; created on init if
        absent. Lives in the same database as the connection's other tables.
  examples:
    - connection: !ref Db
      dimensions: 768
      metric: cosine
      table: resource_vectors
