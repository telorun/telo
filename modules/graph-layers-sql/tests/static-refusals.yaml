---
# Creation only, and the known gap: the store's own layer reached beneath a
# base of a base is a cycle among layer NAMES through two store resources, and
# a rule reads one reference deep — the reason `GRAPH_ENDPOINT_TYPE_MISMATCH`
# is creation only. Clean at check, refused when the store is created.
kind: Assert.Manifest
metadata: { name: baseOwnLayerBeneath }
source: ./__fixtures__/rules/base-own-layer-beneath/telo.yaml
expect:
  errors: []
---
kind: Assert.Manifest
metadata: { name: baseOwnLayerBeneathAtRuntime }
source: ./__fixtures__/rules/base-own-layer-beneath-app.yaml
expect:
  errors: []
  runFails: "GRAPH_BASE_LAYER_DUPLICATE"
