kind: Telo.Application
metadata:
  name: GraphLayersDraftsPostgresLiveStackSuite
  version: 1.0.0
  description: |
    The live-stack suite against a real PostgreSQL, over drafted stores used
    outside any draft: a drafted store reads the published state of the layers
    beneath it as it is now, so what a base writes or deletes is in the view
    above on the next read, with nothing brought up to date.

    NEEDS A CONTAINER ENGINE: it starts its own PostgreSQL, which is why it is under `tests/integration/`.
include: [./__fixtures__/suite-model.yaml]
imports:
  Pg:
    source: ../../../postgres/tests/__fixtures__/container
    variables: { engineUrl: !cel "variables.engineUrl" }
    secrets: { engineToken: !cel "secrets.engineToken" }
  Suite:
    source: ../../../graph-layers/tests/__fixtures__/live-stack-suite
    resources:
      base: !ref base
      top: !ref top
      person: !ref person
      knows: !ref knows
  Sql: ../../../sql
  Postgres: ../../../postgres
  Layers: ../..
  Run: ../../../run
variables:
  engineUrl: { env: TELO_HOST_CONTAINER_ENGINE_URL, type: string, default: "unix:///var/run/docker.sock" }
secrets:
  engineToken: { env: TELO_HOST_CONTAINER_ENGINE_TOKEN, type: string, default: "" }
targets:
  - !ref reset
  - !ref appSchema
  - !ref Suite.liveBases
---
# The suite must start empty — the ledger included, which lives in the same
# namespace, or a previous run's declaration would decide what this one plans.
kind: Run.Sequence
metadata: { name: reset }
steps:
  - name: drop
    invoke:
      kind: Sql.Command
      connection: !ref db
    inputs: { sql: DROP SCHEMA IF EXISTS graph_drafts_live_suite CASCADE }
---
kind: Postgres.Schema
metadata: { name: appSchema }
connection: !ref db
schema: graph_drafts_live_suite
ledger: graph_drafts_live_suite
tables:
  - !ref people
  - !ref documents
  - !ref knowsTable
  - !ref authoredTable
  - !ref graphLayers
  - !ref graphDrafts
