      ./tessdata/nor.traineddata.gz:
        { upstream: nor, member: package/4.0.0_best_int/nor.traineddata.gz, sha256: 6c5d91a5b684da387bfcf16b38bae8d94771812dc9ef706b413c728ca1d37c93, executable: false }
