      - { text: Must not start after it ends, translation: Nie może zaczynać się po swoim końcu }
      - text: "Longer than {$count} days"
        translation: { plural: count, cases: { one: "Dłużej niż {$count} dzień", few: "Dłużej niż {$count} dni", many: "Dłużej niż {$count} dni", other: "Dłużej niż {$count} dnia" } }
      - text: "Longer than {$count} weeks"
        translation: { plural: count, cases: { one: "Dłużej niż {$count} tydzień", few: "Dłużej niż {$count} tygodnie", many: "Dłużej niż {$count} tygodni", other: "Dłużej niż {$count} tygodnia" } }
      - text: "Longer than {$count} months"
        translation: { plural: count, cases: { one: "Dłużej niż {$count} miesiąc", few: "Dłużej niż {$count} miesiące", many: "Dłużej niż {$count} miesięcy", other: "Dłużej niż {$count} miesiąca" } }
      - text: "Longer than {$count} quarters"
        translation: { plural: count, cases: { one: "Dłużej niż {$count} kwartał", few: "Dłużej niż {$count} kwartały", many: "Dłużej niż {$count} kwartałów", other: "Dłużej niż {$count} kwartału" } }
