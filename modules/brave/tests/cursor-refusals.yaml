# A cursor the engine cannot honour is ERR_INVALID_INPUT, raised before any
# request, with a message naming the cause: another engine's cursor, one issued
# for different inputs, and a position that is not numeric or names an offset
# or skip beyond the bounds Brave serves.
kind: Telo.Application
metadata:
  name: BraveCursorRefusalsTest
  version: 1.0.0
imports:
  Brave: ..
  WebSearch: ../../web-search
  Http: ../../http-client
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref cursorRefusals
---
# Nothing listens here: a refusal must come before any request is sent.
kind: Brave.WebSearchEngine
metadata: { name: engine }
request:
  kind: Http.Request
  client: { kind: Http.Client, baseUrl: "http://localhost:18849" }
---
kind: Run.Sequence
metadata: { name: cursorRefusals }
steps:
  - name: refusals
    invoke:
      kind: Run.Projection
      collection: !cel >-
        [
          WebSearch.sealCursor('searxng', {'query': 'q'}, '1-0'),
          WebSearch.sealCursor('brave', {'query': 'q', 'country': 'FI'}, '1-0'),
          WebSearch.sealCursor('brave', {'query': 'q'}, 'one-0'),
          WebSearch.sealCursor('brave', {'query': 'q'}, '10-0'),
          WebSearch.sealCursor('brave', {'query': 'q'}, '0-20')
        ]
      steps:
        - name: attempt
          try:
            - name: search
              invoke: !ref engine
              inputs: { query: q, cursor: !cel "item" }
          catch:
            - name: caught
              value: { code: !cel "error.code", message: !cel "error.message" }
      outputs: !cel "steps.caught.result"
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.refusals.result"
      expected:
        - code: ERR_INVALID_INPUT
          message: The cursor was not issued by the brave engine.
        - code: ERR_INVALID_INPUT
          message: The cursor was issued for a different query, language, country or freshness; it is valid only with the inputs it was issued for.
        - code: ERR_INVALID_INPUT
          message: The cursor holds a position the brave engine cannot read.
        - code: ERR_INVALID_INPUT
          message: The cursor holds a position the brave engine cannot read.
        - code: ERR_INVALID_INPUT
          message: The cursor holds a position the brave engine cannot read.
