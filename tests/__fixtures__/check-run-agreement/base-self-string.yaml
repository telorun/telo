# A `base:` mapping doing arithmetic on a string field two levels
# deep: `self.a.x` is a string at check and at run, so `self.a.x + 1` is refused
# by both.
kind: Telo.Application
metadata: { name: BaseSelfString }
imports:
  Run: ../../../modules/run
  Assert: ../../../modules/assert
targets: [!ref verify]
---
kind: Telo.Definition
metadata: { name: Bump }
extends: Run.Value
schema:
  type: object
  properties:
    a:
      type: object
      properties: { x: { type: string } }
      required: [x]
  required: [a]
base:
  value:
    bumped: !cel "self.a.x + 1"
---
kind: Telo.Sequence
metadata: { name: verify }
steps:
  - { name: bump, invoke: { kind: Self.Bump, a: { x: "4" } } }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.bump.result"
      expected: { bumped: 5 }
