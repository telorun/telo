  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/urd.traineddata.gz:
        { upstream: urd, member: package/4.0.0_best_int/urd.traineddata.gz, sha256: 9e1860440339543c935fca7cee2ce5ac742b1d1249c4ba5982385ce19d23096f, executable: false }
---
kind: TesseractModel.Language
metadata:
  name: urd
  description: Urdu, Arabic script
code: urd
data: !module-path ./tessdata/urd.traineddata.gz
