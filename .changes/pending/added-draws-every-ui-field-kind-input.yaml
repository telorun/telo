modules:
  modules/ui-react: Added
body: "Draws every ui field kind: input fields with the control they name (select,
  options, switch, slider, tags), choices and pickers over option sources (paged as the
  list scrolls, searched after the typing pause or on Enter with stale answers
  discarded, chosen values labelled by in lookups in batches of pageSize and held to the
  source's current filters), and date ranges with presets computed in the viewer's time
  zone, a start after the end blocking and a too-long range warned of. Groups are drawn
  as labelled sections; form and action values are kept in the address
  (_telo.v.<key>.<property>) and in browser storage (telo.ui:<mount>:v:<key>); fields
  are validated as values are entered once touched, and a 400 detail lands on the field
  its path's first segment names. A table's source filters are read as bindings, reading
  nothing while one holds nothing. New styling-contract parts for groups, warnings,
  switches, sliders, pickers and date ranges. Breaking: reads the new ui wire shapes
  (type-tagged fields, groups, state with fields, table filter bindings), so it needs
  this ui."
