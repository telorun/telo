units:
  apps/studio: Fixed
body: Backspace or Delete with a field of a box selected no longer deletes the whole
  resource, a failed delete now shows an error instead of the node silently reappearing,
  and the Boot list offers Call for every resource an invoke step accepts however the
  module's schema spells it. The new module dialog opens at once from the last known
  starter catalog and refreshes it in the background, the Add runner dialog has a
  description, a runner keeps one name — the one stored for it — everywhere, with the
  name it advertises shown beside its description in Settings, and declining a runner's
  terms, or switching to another runner, no longer brings that runner's terms back or
  reads a workspace from a session that is not running.
