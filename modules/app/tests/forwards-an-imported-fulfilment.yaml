kind: Telo.Application
metadata:
  name: ForwardsAnImportedFulfilmentTest
  version: 1.0.0
  description: >-
    A child's own durable directory is supplied by name as a `!ref` to a
    fulfilment an imported library exports: the child receives that fulfilment's
    fields and writes into the directory the library names.
imports:
  App: ../
  Fs: ../../fs
  Run: ../../run
  Timer: ../../timer
  Assert: ../../assert
  Storage:
    source: ./__fixtures__/storage
    variables:
      directory: !cel "variables.fixturesDir.joinPath('scratch-imported')"
variables:
  fixturesDir:
    env: APP_FORWARDS_AN_IMPORTED_FULFILMENT_FIXTURES
    type: string
    x-telo-type: Telo.HostPath
    default: modules/app/tests/__fixtures__
targets:
  - !ref stateful
  - !ref test
---
kind: App.Instance
metadata: { name: stateful }
source: ./__fixtures__/stateful/telo.yaml
needs:
  state: !ref Storage.directory
---
kind: Run.Loop
metadata: { name: awaitExit }
condition: !cel "resources.stateful.status.exitCode == null"
maxIterations: 200
steps:
  - name: wait
    invoke: { kind: Timer.Delay }
    inputs:
      duration: 20ms
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: awaitExit
    invoke: !ref awaitExit
  - name: verifyExit
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "resources.stateful.status.exitCode"
      expected: 0
  - name: read
    invoke:
      kind: Fs.File
      cwd: !cel "variables.fixturesDir"
    inputs:
      path: scratch-imported/marker.txt
  - name: verifyMarker
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.read.result.content"
      expected: written by the child
  - name: clean
    invoke:
      kind: Fs.FileRemoval
      cwd: !cel "variables.fixturesDir"
    inputs:
      path: scratch-imported
      recursive: true
