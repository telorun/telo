# An object at a reference slot nesting 101 levels deep — itself and 100
# arrays — one past the 100 a validation follows.
kind: Telo.Application
metadata: { name: NestingSlotApp, version: 1.0.0 }
---
kind: Telo.Definition
metadata: { name: Router }
capability: Telo.Invocable
schema:
  type: object
  properties:
    handler:
      anyOf:
        - { x-telo-ref: { kind: Telo.Invocable, use: call } }
        - { type: object, properties: { tree: { $ref: "#/$defs/N" } } }
  $defs:
    N: { anyOf: [{ const: 0 }, { type: array, items: { $ref: "#/$defs/N" } }] }
---
kind: Self.Router
metadata: { name: router }
handler: { tree: [[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[0]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]] }
