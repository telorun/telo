modules:
  modules/http-dispatch: Fixed
  modules/http-server: Fixed
body: A response header built from CEL is accepted again. Header values were typed as
  strings, so a computed one — Retry-After from a rate limiter, Location from a created
  id — arrived as a compiled CEL object and the route was refused at boot with a message
  about the header rather than about CEL. The dispatcher already expanded them; only the
  validation disagreed.
