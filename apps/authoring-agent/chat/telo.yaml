kind: Telo.Library
metadata:
  name: Chat
  version: 0.0.0
  description: |
    The authoring agent's chat backend: an OpenAI-backed Ai.AgentStream with
    workspace-rooted fs tools (write_file / edit_file / read_file / list_dir /
    delete_file) plus telo_check and a general `telo` CLI tool. `telo check` runs
    automatically after every write/edit, so the agent always validates. Every
    subprocess is execed without a shell as a keyless one (OPENAI_API_KEY unset),
    and the `telo` tool may only name a subcommand listed in `teloVerbs` —
    inspection verbs by default, with `run` / `publish` / `install` / `upgrade`
    absent, so an anonymous prompt can neither execute a manifest on this host nor
    reach the operator's key or registry credentials. Plus live Telo hub discovery tools (an
    AiMcp.ToolProvider over the hub's MCP endpoint — search_resources /
    get_module_manifest), and the turn machinery that ties them together: mint,
    list, search, rename, archive, delete, truncate and branch conversations,
    admit a turn at most once per idempotency key, claim its journal key before
    answering, record every part of it — the user's message first — in a durable
    journal in `agent.sqlite`, name an untitled conversation, summarize a history
    past `maxContextTokens`, project the journal into the model's history, serve
    the event stream and the conversation's records from the journal, abort a
    running turn, continue an interrupted one inside the same turn, and delete
    whole conversations idle past the retention window. Every change write_file,
    edit_file and delete_file make is checkpointed under its turn before the
    workspace is touched — an entry row plus the file's copies under
    `checkpoints/<turnId>/` in the state directory — so a turn's changes can be
    listed as diffs, reverted, and summarized on its record page; one workspace
    lease serializes those tools, a workspace push and each reverted path.
    Exported so the app and its tests drive the same handler. Parameterized by the
    OpenAI key, the model endpoint, the workspace directory and the agent's state
    directory, which holds `agent.sqlite`.
imports:
  Ai: oci://ghcr.io/telorun/ai@0.28.0#sha256-zpi3w-6zWjD3HGhxoMJKItuFM4ELZa-NTVHOtFacRII
  OpenAI: oci://ghcr.io/telorun/openai@0.13.0#sha256-Tt9DaH254A972an-WTH_mtJOy9HAuUuH_SK1_bfOvHM
  HttpClient: oci://ghcr.io/telorun/http-client@0.23.0#sha256-6WAIh0ajnTlkWNuP-59e1qNVUXVSJDWZxvPVACQg1AM
  AiMcp: oci://ghcr.io/telorun/ai-mcp@0.23.0#sha256-AtK6YNh3oQJkAlTFE4iYkxr4HTzw-O-bInBjgNHaup0
  Mcp: oci://ghcr.io/telorun/mcp-client@0.16.0#sha256-uGRA31NI6oUiT8Pr88uBvMqIvCgoG5QLASMIshc7c-A
  Fs: oci://ghcr.io/telorun/fs@0.14.0#sha256-N5xTrQgDJ91sb_XrS6mPLsH_g0_70yj1S3xBB_hLDdA
  TextDiff: oci://ghcr.io/telorun/text-diff@0.3.0#sha256-FaVk4PVZVI1-ryRkgdTmN1MNtEP1E8bjAXXl365nSW4
  Shell: oci://ghcr.io/telorun/shell@0.13.0#sha256-h4-z6gdCjduwxgU1n7o5eol8RYgsxBCS2iQcxpCV_u0
  Sql: oci://ghcr.io/telorun/sql@0.28.0#sha256-JC2SN6Ha8hlq9gnRGahvVNVwe-cUXHXtS8rdeo1BC24
  SQLite: oci://ghcr.io/telorun/sqlite@0.10.0#sha256-qTwG1VYpO8_AGN2UaJPWEIHyt1rt8OUlxLKtLcJkf4Q
  RecordStream: oci://ghcr.io/telorun/record-stream@0.20.0#sha256-hRwLGfhayzKJ27aKx8vp_hZoX3LTYNMsMNoMlAbWnBs
  RecordStreamSql: oci://ghcr.io/telorun/record-stream-sql@0.8.0#sha256-hUM8JPvjMJkMUEmXOXNkhvC5QxFe9VIQw_7rAXCuv9Y
  Stream: oci://ghcr.io/telorun/stream@0.14.0#sha256-4lK-_jEZ4H1CCdxyLGrsfmkWj5PTXsf2b8NYk0RTxGk
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  Lease: oci://ghcr.io/telorun/lease@0.14.0#sha256-Q9fVDAE4m7amXF8k9NolFtxjjoHH84LRpv11j5q6r1k
  KvStoreMemory: oci://ghcr.io/telorun/kv-store-memory@0.8.0#sha256-GmMDeJ2eYatJ0_ewaUI6A6bnfkqlphjd4YKWtqZ5d2Y
  CacheMemory: oci://ghcr.io/telorun/cache-memory@0.10.0#sha256-yPwUSVVhRMiqQYQ9cbptorm1cA-HnJW6pLHRZ-8-qPA
  RateLimit: oci://ghcr.io/telorun/rate-limit@0.13.0#sha256-wHzRZi3uI7c12dRSULXQBO8GRYqhJj6gos6xv6eZj7g
  Idempotency: oci://ghcr.io/telorun/idempotency@0.11.0#sha256-hd4NvqYA6OioV89wn7SNk7BXrHIFYzv0cNL68Cscgd4
  KvStoreSql: oci://ghcr.io/telorun/kv-store-sql@0.14.0#sha256-DY-CKnlGAPmco-fkHRfo6NkxEVwJkwf6YPlo7qbrMG4
  SecretScan: oci://ghcr.io/telorun/secret-scan@0.3.0#sha256-j5LTmj50zPdy65badRWFTPmICPURIf1n4Q-Iaq6dFSo
  Log: oci://ghcr.io/telorun/log@0.3.0#sha256-zHq0Vq_G85EDj7Wfbcla8_6hvE4imxgVQoMZsxZwIwE
  Timer: oci://ghcr.io/telorun/timer@0.9.0#sha256-Phjx5KkREnLAB68DlKZUx5bRkDosEO3WaMVMUS2-pfg
secrets:
  openaiApiKey:
    type: string
variables:
  # Directory every file tool and every spawned command is rooted at. Configurable
  # because a co-resident agent edits the SESSION's shared workspace volume, which
  # the runner mounts at a path of its choosing — the agent is one writer on that
  # volume beside the application containers, not the owner of a directory inside
  # its own container. A host path the importer supplies absolute: the standalone
  # default lives on the Application, which is where a relative path is anchored.
  workspaceDir:
    type: string
    x-telo-type: Telo.HostPath
  # The agent's own state — `agent.sqlite` (conversation history and the
  # admission record `Idempotency-Key` replays from). The Application defaults it
  # to `.telo-agent` inside the workspace, so a co-resident agent keeps its
  # conversations on the session volume, which outlives the container. The
  # directory is excluded from every listing the agent and its clients see.
  stateDir:
    type: string
    x-telo-type: Telo.HostPath
  model:
    type: string
    # THE model this agent runs on — declared once, here, and inherited by every
    # importer including the tests, so a test exercises what the app ships. It
    # used to be restated as a literal at the root and in four tests, which made
    # this line dead config: changing it looked like an upgrade and did nothing.
    default: gpt-5.2
  reasoningEffort:
    type: string
    enum: [ minimal, low, medium, high ]
    # How hard the model thinks before each turn. A variable rather than a
    # literal for the same reason `model` is one: it is the knob an operator
    # tunes per deployment, and it trades answer quality against latency and
    # spend on every turn of every tool loop.
    #
    # `medium` because this agent's work is structural — deciding what resources
    # an application needs and how they wire together — which is where thinking
    # pays for itself; `minimal` exists for a deployment that wants the old
    # behaviour back without editing the manifest.
    default: medium
  budgetLimit:
    type: integer
    # Max total tokens spent across all turns per window (operator spend cap).
    default: 4000000
  budgetWindow:
    type: string
    default: "1h"
  reservePerTurn:
    type: integer
    # Worst-case tokens debited at turn start; settled to actual on completion.
    default: 40000
  ipLimit:
    type: integer
    # Max turns started per client IP per window (coarse per-abuser throttle).
    default: 20
  ipWindow:
    type: string
    default: "1m"
  teloProgram:
    type: array
    items: { type: string }
    # How to invoke the `telo` CLI: the program, plus any leading arguments it
    # needs (a test points this at this checkout's entry point, so the agent
    # validates against the very checker that will judge its output).
    #
    # ONE variable rather than a separate argv per call site: the check loop and
    # the `telo` tool must never end up driving different CLI builds, and two
    # variables is exactly how that happens — an override updates one and the
    # other silently keeps the globally-installed binary.
    #
    # Every call site appends its own subcommand and args, and the whole list is
    # execed WITHOUT a shell, so an agent-chosen path is one argument and can
    # inject nothing.
    default: [telo]
  teloVerbs:
    type: array
    items: { type: string }
    # Which `telo` subcommands the `telo` tool may invoke. The agent supplies
    # the whole argv, so this list — not the agent — decides what the CLI is
    # allowed to do.
    #
    # The default is every verb that INSPECTS. The rest are deliberately absent:
    # `run` executes a manifest, which is arbitrary code execution on this host
    # driven by an anonymous prompt; `publish` pushes to a registry with the
    # operator's credentials; `install` and `upgrade` fetch and write; `migrate`
    # rewrites the author's YAML in place, which is the agent's own edit tools'
    # job here. Add them here only for a deployment where the caller is trusted.
    #
    # The check is on argv[0] against this list, which also closes the CLI's
    # default-command hole: `telo ./x.yaml` with no verb means `run ./x.yaml`,
    # and a bare path matches no entry here, so it is rejected rather than
    # silently executed.
    default: [check, cel, module, search]
  allowManifestRuns:
    type: boolean
    # Whether the agent may EXECUTE a manifest, through the `run_manifest` tool.
    #
    # Off by default, and the default is the security boundary rather than a
    # preference. A manifest the agent wrote is arbitrary code: it can declare a
    # Shell.Command, read any file this container can, and reach the network.
    # `Shell.LocalHost.env` is an OVERLAY, so a child inherits every operator
    # variable except the ones named there — OPENAI_API_KEY is scrubbed, and
    # whatever else the operator set is not, because a module cannot enumerate
    # it. So this must not be on where an anonymous prompt reaches the agent.
    #
    # Turn it on where the caller is the person whose container this is: a
    # per-session or co-resident agent in the user's own workspace, which is
    # already where their own `telo run --watch` executes the same manifests.
    default: false
  modelEndpoint:
    type: string
    # The OpenAI-compatible endpoint the model is called through. A test points
    # it at a local stub, so whole turns run offline and key-free.
    default: https://api.openai.com/v1
  retentionDays:
    type: integer
    minimum: 1
    # How long a conversation may sit idle before `retentionSweep` deletes it
    # whole, and how long its removed turns then keep answering 410 rather than
    # 404 — the journal's removal-marker retention.
    default: 30
  maxContextTokens:
    type: integer
    minimum: 8
    # The context a conversation may report before its older turns are
    # summarized: once the last model call of a turn reported at least this many
    # tokens (prompt plus completion), the next attempt compacts the history.
    # At least 8, so the summary call's cap (`maxContextTokens / 8` output
    # tokens) is at least 1.
    default: 120000
  maxToolResultBytes:
    type: integer
    minimum: 1
    # The most UTF-8 bytes of text one tool result feeds the model; a longer
    # result is cut and ends with a `[truncated: …]` marker.
    default: 32768
  runTimeoutMs:
    type: integer
    # A test suite terminates; an application with a server in it does not, and
    # a wrong path is an easy mistake to make. Without a bound, one of them
    # holds the turn open until the model's step budget runs out.
    default: 120000
  maxSteps:
    type: integer
    minimum: 1
    # Model responses one request may take — each carries any number of tool
    # calls, which is why the primer tells the agent to batch independent ones.
    # Building an application is several files — a feature library per domain,
    # a test per behaviour, the suite, the wiring — each with its own
    # check-and-fix, plus discovery and a test-and-fix loop. At 16 a build ran
    # out mid-way. A turn that spends the budget ends with a wrap-up reply
    # rather than an error; its real ceiling is the token budget, which settles
    # to what was actually spent.
    default: 40
  maxTurnDiffBytes:
    type: integer
    minimum: 0
    # The most bytes of checkpoint copies one turn's diff reads — at every
    # ending, at the boot catch-up and on each read of the changes route. A
    # file whose two copies do not fit what is left is listed without counts
    # and hunks. No env binding: a test lowers it.
    default: 4194304
  maxCheckpointBytes:
    type: integer
    minimum: 0
    # The most bytes of "before" copies one write_file / edit_file /
    # delete_file call may capture into its turn's checkpoint; a call that
    # would capture more is refused before anything changes.
    default: 16777216
  maxCheckpointFiles:
    type: integer
    minimum: 1
    # The most files one such call may capture — what bounds a recursive
    # delete.
    default: 1000
exports:
  resources:
    - ensureWorkspace
    - initSchema
    - chatStart
    - createConversation
    - listConversations
    - getConversation
    - updateConversation
    - deleteConversation
    - truncateConversation
    - branchConversation
    - catchUpProjections
    - abortTurn
    - continueTurn
    - releaseAttempt
    - journalSource
    - turnEvents
    - conversationRecords
    - rebuildProjection
    - retentionSweep
    - turnChanges
    - revertTurn
    - author
    - readWorkspaceFile
    - runTelo
    - runManifest
    - treeSnapshot
    - syncWorkspace
    - readiness
    - promptIdentity
    - CheckReport
---
kind: SQLite.Connection
metadata: { name: chatDb }
file: !cel "variables.stateDir.joinPath('agent.sqlite')"
---
kind: SQLite.Schema
metadata: { name: initSchema }
connection: !ref chatDb
# Imperative, not a declared `Table`: the role domain is a CHECK constraint and
# the keys are composite, which the column vocabulary cannot state. Applied in
# key order, so `create_messages` (the first shape of `messages`) always runs
# before `projection_*` replaces it, and `projection_*` run in their number's
# order.
migrations:
  create_messages:
    statement: |
      CREATE TABLE IF NOT EXISTS messages (
        id TEXT PRIMARY KEY,
        conversation_id TEXT NOT NULL,
        role TEXT NOT NULL CHECK (role IN ('system', 'user', 'assistant')),
        content TEXT NOT NULL,
        created_at TEXT NOT NULL DEFAULT (datetime('now'))
      )
  # Which turns belong to which conversation, in order. Metadata about journal
  # keys, never a copy of a record: a turn's status is read from its key.
  projection_1_turns:
    statements:
      - |
        CREATE TABLE turns (
          turn_id TEXT PRIMARY KEY,
          conversation_id TEXT NOT NULL,
          started_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%fZ', 'now')),
          active_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%fZ', 'now'))
        )
      - CREATE INDEX turns_by_conversation ON turns (conversation_id, turn_id)
  # `messages` becomes the projection of the journal: the model's history in
  # full — content as JSON, an assistant row's tool calls, `tool` rows with the
  # call they answer — one row per message, keyed by its turn and position.
  # The old table held only joined text and cannot be rebuilt into this one, so
  # it is replaced; its turns were never journaled durably.
  projection_2_messages:
    statements:
      - DROP TABLE messages
      - |
        CREATE TABLE messages (
          turn_id TEXT NOT NULL,
          seq INTEGER NOT NULL,
          conversation_id TEXT NOT NULL,
          role TEXT NOT NULL CHECK (role IN ('system', 'user', 'assistant', 'tool')),
          content TEXT NOT NULL,
          tool_calls TEXT,
          tool_call_id TEXT,
          PRIMARY KEY (turn_id, seq)
        )
      - CREATE INDEX messages_by_conversation ON messages (conversation_id, turn_id, seq)
  # How far each turn was projected, and the provider state it ended with.
  projection_3_turn_projections:
    statement: |
      CREATE TABLE turn_projections (
        turn_id TEXT PRIMARY KEY,
        conversation_id TEXT NOT NULL,
        through_id INTEGER NOT NULL,
        provider_state TEXT,
        provider_model TEXT
      )
  # When a user's abort cancelled the turn. What tells an aborted turn from one a
  # shutdown cancelled: both fail with ERR_INVOKE_CANCELLED, and only the first
  # is a deliberate ending that cannot be continued.
  projection_4_aborted_at:
    statement: ALTER TABLE turns ADD COLUMN aborted_at TEXT
  # Conversations become the agent's own: a row per conversation holding only
  # what nothing else determines — its title, archive flag, timestamps, a change
  # counter and a deletion tombstone. Every legacy conversation keeps its id.
  # A turn is marked `removed_at` before its key and row are deleted, so a
  # deletion a crash cut short is finished by the next sweep. The projection
  # gains the per-turn readings a conversation is summed from; it is cleared
  # here and rebuilt from the journal by `catchUpProjections` at boot. A branch
  # being copied is `assembling`: hidden from every route until it is whole.
  projection_5_conversations:
    statements:
      - |
        CREATE TABLE conversations (
          id TEXT PRIMARY KEY,
          title TEXT,
          archived INTEGER NOT NULL DEFAULT 0,
          created_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%fZ', 'now')),
          updated_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%fZ', 'now')),
          revision INTEGER NOT NULL DEFAULT 0,
          removed_at TEXT,
          assembling INTEGER NOT NULL DEFAULT 0
        )
      - |
        INSERT INTO conversations (id, created_at, updated_at)
        SELECT conversation_id, MIN(started_at), MAX(active_at) FROM turns GROUP BY conversation_id
      - CREATE INDEX conversations_by_activity ON conversations (updated_at, id)
      - ALTER TABLE turns ADD COLUMN removed_at TEXT
      - ALTER TABLE turns DROP COLUMN active_at
      - DELETE FROM turn_projections
      - ALTER TABLE turn_projections ADD COLUMN tokens INTEGER NOT NULL DEFAULT 0
      - ALTER TABLE turn_projections ADD COLUMN model TEXT
      - ALTER TABLE turn_projections ADD COLUMN context_tokens INTEGER
      - ALTER TABLE turn_projections ADD COLUMN summary TEXT
      - ALTER TABLE turn_projections ADD COLUMN summary_through TEXT
      # The wire shape's derived half, computed at read time from live turns:
      # the model of the latest one, two messages per turn, and every token
      # each turn's projection reports.
      - |
        CREATE VIEW conversation_view AS
        SELECT c.id, c.title, c.archived, c.created_at, c.updated_at, c.revision, c.removed_at,
               (SELECT p.model FROM turns t JOIN turn_projections p ON p.turn_id = t.turn_id
                 WHERE t.conversation_id = c.id AND t.removed_at IS NULL
                 ORDER BY t.turn_id DESC LIMIT 1) AS model,
               (SELECT COUNT(*) FROM turns t
                 WHERE t.conversation_id = c.id AND t.removed_at IS NULL) * 2 AS message_count,
               (SELECT COALESCE(SUM(p.tokens), 0) FROM turns t JOIN turn_projections p ON p.turn_id = t.turn_id
                 WHERE t.conversation_id = c.id AND t.removed_at IS NULL) AS total_tokens
        FROM conversations c
        WHERE c.assembling = 0
  # Checkpoints. An entry is one file one tool call changed: the digest it held
  # before (null: absent) and the digest the call leaves (null: deleted),
  # written before the workspace is touched and confirmed after — one whose
  # write is not known to have happened is settled from the file it names; the
  # copies are files under `checkpoints/<turn>/`. `turn_reverts` is a revert's recorded
  # outcome per path, `turn_changes` the projection of a turn's net changes its
  # summary is read from. A turn admitted from here on is `checkpointed`; an
  # older one is not and cannot be reverted. The projection gains the readings
  # a summary is built from and whether it was taken at the turn's ending; it
  # is cleared and rebuilt from the journal at boot.
  projection_6_checkpoints:
    statements:
      - |
        CREATE TABLE checkpoint_entries (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          turn_id TEXT NOT NULL,
          call_id TEXT NOT NULL,
          path TEXT NOT NULL,
          before_hash TEXT,
          after_hash TEXT,
          confirmed INTEGER NOT NULL DEFAULT 0
        )
      - CREATE INDEX checkpoint_entries_by_path ON checkpoint_entries (turn_id, path, id)
      - CREATE INDEX checkpoint_entries_by_call ON checkpoint_entries (call_id)
      - |
        CREATE TABLE turn_reverts (
          turn_id TEXT NOT NULL,
          path TEXT NOT NULL,
          status TEXT NOT NULL CHECK (status IN ('created', 'modified', 'deleted')),
          outcome TEXT NOT NULL CHECK (outcome IN ('restored', 'skipped')),
          PRIMARY KEY (turn_id, path)
        )
      - |
        CREATE TABLE turn_changes (
          turn_id TEXT NOT NULL,
          path TEXT NOT NULL,
          status TEXT NOT NULL CHECK (status IN ('created', 'modified', 'deleted')),
          before_hash TEXT,
          after_hash TEXT,
          added INTEGER,
          removed INTEGER,
          first_line INTEGER,
          check_exit_code INTEGER,
          PRIMARY KEY (turn_id, path)
        )
      - ALTER TABLE turns ADD COLUMN checkpointed INTEGER NOT NULL DEFAULT 0
      - ALTER TABLE turns ADD COLUMN reverted_at TEXT
      - DELETE FROM turn_projections
      - ALTER TABLE turn_projections ADD COLUMN prompt_tokens INTEGER NOT NULL DEFAULT 0
      - ALTER TABLE turn_projections ADD COLUMN completion_tokens INTEGER NOT NULL DEFAULT 0
      - ALTER TABLE turn_projections ADD COLUMN runs TEXT NOT NULL DEFAULT '[]'
      - ALTER TABLE turn_projections ADD COLUMN ended INTEGER NOT NULL DEFAULT 0
---
# The account, declared once: base URL and credential on the client, so the model
# kinds carry no key and the 401 re-acquire-and-retry is inherited from
# `http-client` rather than re-implemented per provider.
kind: HttpClient.BearerToken
metadata: { name: openaiKey }
token: !cel "secrets.openaiApiKey"
---
kind: HttpClient.Client
metadata: { name: openaiClient }
baseUrl: !cel "variables.modelEndpoint"
credential: !ref openaiKey
# A provider edge fails transiently — a 503 whose body is the proxy's own
# "upstream connect error … Connection refused", arriving BEFORE any headers, so
# the request never started streaming and re-sending it is sound. Without a
# budget nothing re-sends: `retryOn` defaults to 408/429/500/502/503/504 only
# once `attempts` is non-zero, so a single edge blip took down a whole turn.
#
# Three attempts, not more: an agent turn already costs seconds and tokens, and
# a provider that is still refusing after ~4s of backoff is having an outage
# rather than a blip. `honorRetryAfter` is what makes the 429 case cooperative
# instead of additive.
retry:
  attempts: 3
  initialDelay: 500
  maxDelay: 4000
  honorRetryAfter: true
---
kind: HttpClient.Request
metadata: { name: openaiRequest }
client: !ref openaiClient
---
# The responses API, not chat completions: this agent is nothing but tools, and
# `/v1/chat/completions` refuses a non-`none` reasoning effort alongside function
# tools outright. The encrypted reasoning comes back as the contract's
# `providerState` and `Ai.AgentStream` replays it, so thinking survives each tool
# loop rather than restarting on every turn.
kind: OpenAI.ResponsesModelStream
metadata: { name: model }
model: !cel "variables.model"
request: !ref openaiRequest
reasoning:
  effort: !cel "variables.reasoningEffort"
  # What the thinking a client can SHOW is: the reasoning itself comes back
  # encrypted and is only ever replayed, so without this a turn emits no
  # readable reasoning at all — which is why Studio's transcript had none. A
  # summary is a précis the endpoint writes, delivered as `reasoning-delta`
  # parts beside the text. Not a variable: it costs a handful of tokens and
  # there is no `off` value to switch to — the key's ABSENCE is off, so hiding
  # thinking is a decision for the client that renders it, not for the model.
  summary: auto
---
kind: AiMcp.ToolProvider
metadata: { name: hubTools }
client:
  kind: Mcp.HttpClient
  url: https://telo.sh/mcp
  clientInfo:
    name: authoring-agent
    version: 0.0.0
---
kind: Fs.FileWrite
metadata: { name: writeFile }
cwd: !cel "variables.workspaceDir"
---
kind: Fs.FileEdit
metadata: { name: editFile }
cwd: !cel "variables.workspaceDir"
---
kind: Fs.File
metadata: { name: readFile }
cwd: !cel "variables.workspaceDir"
---
kind: Fs.DirectoryListing
metadata: { name: listDir }
cwd: !cel "variables.workspaceDir"
---
kind: Fs.FileRemoval
metadata: { name: removeFile }
cwd: !cel "variables.workspaceDir"
---
# Path confinement, one rule for every tool and route that takes a path. LEXICAL:
# the Fs kinds resolve a relative path against the workspace and use an absolute
# one as-is, and nothing below them refuses `../`, so the decision is made on the
# text before any of them is reached. Outside when absolute, when it holds a
# backslash (a Windows separator the rule cannot reason about), when its first
# segment is a drive letter, when any segment is `..`, or when it names the
# agent's state directory or anything under it — the conversation database and
# the checkpoints are the agent's own, never workspace content. The empty path
# is the workspace root.
kind: Telo.Function
metadata:
  name: outsideWorkspace
  description: Whether a path the agent or a client supplied would leave the workspace root or enter the agent's state directory.
params:
  - name: path
    schema: { type: string }
  - name: workspaceDir
    schema: { type: string }
  - name: stateDir
    schema: { type: string }
returns:
  schema: { type: boolean }
body: !cel >-
  path.startsWith('/') || path.contains('\\') || path.split('/')[0].matches('^[A-Za-z]:')
    || path.split('/').exists(segment, segment == '..')
    || (stateDir.startsWith(workspaceDir + '/')
        && cel.bind(state, trimPrefix(stateDir, workspaceDir + '/'),
             cel.bind(target, Self.normalPath(path), target == state || target.startsWith(state + '/'))))
---
# A workspace path as the checkpoint names it: no empty and no `.` segment, so
# `./a//b.yaml` and `a/b.yaml` are one file.
kind: Telo.Function
metadata:
  name: normalPath
  description: A workspace-relative path without empty or `.` segments.
params:
  - name: path
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel "join(path.split('/').filter(segment, segment != '' && segment != '.'), '/')"
---
kind: Telo.Function
metadata:
  name: outsideWorkspaceMessage
  description: The refusal for a path outside the workspace, naming the path and restating the rule.
params:
  - name: path
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  'ERR_PATH_OUTSIDE_WORKSPACE: the path "' + path + '" is outside the workspace. A path is relative to the workspace root: '
    + 'never absolute, no backslash, no drive letter, no ".." segment, and never inside the agent\'s own state directory.'
---
# What a removal may never name, whatever the configuration: the workspace
# root, and a directory the agent's state directory lies beneath — removing
# either would take the conversation database and the checkpoints with it.
# The state directory itself and anything inside it are `outsideWorkspace`.
kind: Telo.Function
metadata:
  name: unremovable
  description: Whether a path is the workspace root or a directory holding the agent's state directory.
params:
  - name: path
    schema: { type: string }
  - name: workspaceDir
    schema: { type: string }
  - name: stateDir
    schema: { type: string }
returns:
  schema: { type: boolean }
body: !cel >-
  cel.bind(target, Self.normalPath(path),
    target == '' || (stateDir.startsWith(workspaceDir + '/')
      && Self.normalPath(trimPrefix(stateDir, workspaceDir + '/')).startsWith(target + '/')))
---
kind: Telo.Function
metadata:
  name: unremovableMessage
  description: The refusal for a removal naming the workspace root or a directory holding the agent's state directory.
params:
  - name: path
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  'ERR_PATH_OUTSIDE_WORKSPACE: refused to delete "' + path + '": it is the workspace root or holds the agent\'s own '
    + 'state directory, which is never workspace content. Nothing was removed. Delete the entries inside it one by one.'
---
# What `telo check -o json` prints on stdout: the verdict, the counts and one
# entry per diagnostic. Entries stay open, so a field a newer CLI adds is kept.
kind: Telo.JsonSchema
metadata: { name: CheckReport }
schema:
  type: object
  required: [ok, errorCount, warnCount, diagnostics]
  properties:
    ok: { type: boolean }
    errorCount: { type: integer }
    warnCount: { type: integer }
    diagnostics:
      type: array
      items:
        type: object
        required: [file, line, column, severity, message]
        properties:
          file: { type: string }
          line: { type: integer }
          column: { type: integer }
          severity: { type: string }
          code: { type: string }
          message: { type: string }
---
# The check part of a write, edit or check result as the model reads it: one
# `file:line:col CODE message` line per diagnostic, or `check: clean`, then the
# checker's own prose under `notes:` when it wrote any. Text rather than the
# JSON document: the model reads it, and an escaped JSON string is what it was
# reading before.
kind: Telo.Function
metadata:
  name: renderCheck
  description: Renders a check report and the checker's stderr as the lines a tool result carries.
params:
  - name: exitCode
    schema: { type: integer }
  - name: report
    schema: !ref CheckReport
    nullable: true
  - name: messages
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  (report != null && size(report.diagnostics) > 0
    ? join(report.diagnostics.map(d,
        d.file + ':' + string(d.line) + ':' + string(d.column) + ' '
          + (has(d.code) ? d.code + ' ' : '') + d.message), '\n')
    : exitCode == 0 ? 'check: clean' : 'check: failed with exit ' + string(exitCode))
  + (messages.trim() == '' ? '' : '\nnotes:\n' + messages.trim())
---
# A command's result as the model reads it: stdout verbatim, an `exit N` line
# only when it failed, and stderr under `stderr:` only when there is any.
kind: Telo.Function
metadata:
  name: renderRun
  description: Renders a command's exit code, stdout and stderr as the text a tool result carries.
params:
  - name: exitCode
    schema: { type: integer }
  - name: output
    schema: { type: string }
  - name: messages
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  output
    + (exitCode == 0 ? '' : (output == '' || output.endsWith('\n') ? '' : '\n') + 'exit ' + string(exitCode))
    + (messages.trim() == '' ? '' : '\nstderr:\n' + messages.trim())
---
# The refusal for content carrying a credential: every finding by line and rule
# (never the matched text, which the detector does not return), then the repair.
# Both refusals lead with their code: a tool error reaches the model as its
# message alone.
kind: Telo.Function
metadata:
  name: secretMessage
  description: The refusal for a write whose content carries a credential, naming each line and rule and the repair.
params:
  - name: path
    schema: { type: string }
  - name: findings
    schema:
      type: array
      items:
        type: object
        required: [rule, line, column]
        properties:
          rule: { type: string }
          line: { type: integer }
          column: { type: integer }
returns:
  schema: { type: string }
body: !cel >-
  'ERR_SECRET_IN_MANIFEST: refused to write "' + path + '": it would contain a credential at '
    + join(findings.map(f, 'line ' + string(f.line) + ' (' + f.rule + ')'), ', ')
    + '. Never write a secret into a file. Declare it under `secrets:` with an `env:` binding '
    + 'and read it with !cel "secrets.<name>", then write the file again.'
---
# read_file, and GET /workspace/file: the file's contents, confined.
kind: Run.Sequence
metadata: { name: readWorkspaceFile }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [content, size]
    properties:
      content: { type: string }
      size: { type: integer }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path, string(variables.workspaceDir), string(variables.stateDir))"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: read
    invoke: !ref readFile
    inputs:
      path: !cel "inputs.path"
outputs:
  content: !cel "steps.read.result.content"
  size: !cel "steps.read.result.size"
---
# list_dir: a directory's entries, confined. The exclude set is fixed here rather
# than offered as a parameter: a recursive listing of a workspace is otherwise
# mostly `.telo` cache paths, and a set the model can pass is a set it can drop.
kind: Run.Sequence
metadata: { name: listWorkspaceDir }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, recursive]
    properties:
      path: { type: string }
      recursive: { type: boolean }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [entries]
    properties:
      entries:
        type: array
        items:
          type: object
          required: [path, type]
          properties:
            path: { type: string }
            type: { type: string }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path, string(variables.workspaceDir), string(variables.stateDir))"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: list
    invoke: !ref listDir
    inputs:
      path: !cel "inputs.path"
      recursive: !cel "inputs.recursive"
      exclude: [".telo", "node_modules", ".git", "dist", ".probes", ".telo-agent"]
outputs:
  entries: !cel "steps.list.result.entries"
---
# delete_file, confined — the workspace root and a directory holding the
# agent's state directory are never removed — then checkpointed and applied
# under the workspace lease. `changes` is one Change per file the call deleted.
kind: Run.Sequence
metadata: { name: deleteWorkspaceFile }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId, path, recursive]
    properties:
      turnId: { type: string }
      path: { type: string }
      recursive: { type: boolean }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, changes]
    properties:
      path: { type: string }
      changes:
        type: array
        items: { $ref: "telo://Self/Change" }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path, string(variables.workspaceDir), string(variables.stateDir))"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  # Before anything is listed, captured or removed.
  - name: whole
    if: !cel "Self.unremovable(inputs.path, string(variables.workspaceDir), string(variables.stateDir))"
    then:
      - name: refuseWhole
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.unremovableMessage(inputs.path)"
  - name: remove
    invoke: !ref leasedWorkspace
    inputs:
      operation:
        remove:
          turnId: !cel "inputs.turnId"
          path: !cel "inputs.path"
          recursive: !cel "inputs.recursive"
outputs:
  path: !cel "inputs.path"
  changes: !cel "steps.remove.result.result.changes"
---
# Whole-workspace sync primitives, exported so the app's /workspace routes can
# snapshot (content-hash tree) and apply an explicit write/delete change set.
kind: Fs.TreeSnapshot
metadata: { name: treeSnapshot }
cwd: !cel "variables.workspaceDir"
---
kind: Fs.TreeSync
metadata: { name: treeSync }
cwd: !cel "variables.workspaceDir"
---
# One file's change as every surface reports it — a tool result's
# `output.changes`, the changes route and a turn's summary: its status, the
# digest it held before (null: it did not exist) and holds after (null:
# deleted), and the lines added and removed, null when a side is not UTF-8 text
# or is too large to compare.
kind: Telo.JsonSchema
metadata: { name: Change }
schema:
  type: object
  additionalProperties: false
  required: [path, status, before, after, added, removed]
  properties:
    path: { type: string }
    status: { type: string, enum: [created, modified, deleted] }
    before: { type: [string, "null"] }
    after: { type: [string, "null"] }
    added: { type: [integer, "null"] }
    removed: { type: [integer, "null"] }
---
# A blob's text: its bytes decoded as UTF-8 when decoding reproduces its digest,
# null when the bytes are not UTF-8 text.
kind: Telo.Function
metadata:
  name: blobText
  description: The UTF-8 text of base64 content whose digest is known, or null when the content is not UTF-8 text.
params:
  - name: content
    schema: { type: string }
  - name: digest
    schema: { type: string }
returns:
  schema:
    anyOf:
      - type: string
      - type: "null"
body: !cel "cel.bind(text, base64Decode(content), sha256(text) == digest ? dyn(text) : null)"
---
# A file's change with its line diff. A side that does not exist is the empty
# text; a side given as null is not comparable (binary, or too large to read),
# and then the counts, the hunks and the first line are null. A deleted file
# carries counts but no hunks and no first line.
kind: Telo.Function
metadata:
  name: fileChange
  description: A file's change between two digests, with its line counts, hunks and the line its first hunk starts at.
params:
  - name: path
    schema: { type: string }
  - name: before
    schema: { type: string }
    nullable: true
  - name: after
    schema: { type: string }
    nullable: true
  - name: beforeText
    schema: { type: string }
    nullable: true
  - name: afterText
    schema: { type: string }
    nullable: true
returns:
  schema:
    type: object
    additionalProperties: false
    required: [change, hunks, firstLine]
    properties:
      change: { $ref: "telo://Self/Change" }
      hunks: { type: [array, "null"] }
      firstLine: { type: [integer, "null"] }
body: !cel >-
  cel.bind(diff, beforeText == null || afterText == null ? null : dyn(TextDiff.lineDiff(beforeText, afterText)),
    cel.bind(comparable, diff != null && diff.comparable,
      {
        'change': {
          'path': path,
          'status': before == null ? 'created' : after == null ? 'deleted' : 'modified',
          'before': before,
          'after': after,
          'added': comparable ? dyn(diff.added) : null,
          'removed': comparable ? dyn(diff.removed) : null
        },
        'hunks': comparable && after != null ? dyn(diff.hunks) : null,
        'firstLine': comparable && after != null && size(diff.hunks) > 0 ? dyn(diff.hunks[0].newStart) : null
      }))
---
kind: Telo.Function
metadata:
  name: checkpointTooLargeMessage
  description: The refusal for a tool call whose checkpoint would pass a bound, naming the path, what was reached and the bound.
params:
  - name: path
    schema: { type: string }
  - name: reached
    schema: { type: integer }
  - name: bound
    schema: { type: integer }
  - name: unit
    schema: { type: string, enum: [bytes, files] }
returns:
  schema: { type: string }
body: !cel >-
  'ERR_CHECKPOINT_TOO_LARGE: refused to change "' + path + '": the call would capture ' + string(reached) + ' ' + unit
    + ' into the turn\'s checkpoint, over the ' + string(bound) + ' ' + unit + ' one call may capture. '
    + 'Nothing was changed. Ask the user to make this change themselves.'
---
# The checkpoint's copies: `<stateDir>/checkpoints/<turnId>/<sha256>`, one
# directory per turn, never shared between turns.
kind: Fs.FileWrite
metadata: { name: writeBlob }
cwd: !cel "variables.stateDir.joinPath('checkpoints')"
---
kind: Fs.File
metadata: { name: readBlob }
cwd: !cel "variables.stateDir.joinPath('checkpoints')"
---
kind: Fs.DirectoryListing
metadata: { name: listBlobs }
cwd: !cel "variables.stateDir.joinPath('checkpoints')"
---
kind: Sql.Command
metadata: { name: checkpointCommand }
connection: !ref chatDb
---
kind: Fs.TreeSync
metadata: { name: blobSync }
cwd: !cel "variables.stateDir.joinPath('checkpoints')"
---
# What is at each workspace path right now, from METADATA alone: a path's kind
# and size are its entry in its parent directory's listing — a regular `file`,
# a `directory`, or `other` (a symbolic link, a device, a socket; a link is
# never followed) — and a name the listing does not hold is `absent`. Nothing
# is read and no directory is walked. One listing per distinct parent. Where
# the parent cannot be listed, its ancestors are listed from the workspace
# root downward to learn why: a segment the listing above it does not hold, or
# holds as a regular file, makes every path beneath `absent`; a parent that IS
# there, as a directory or anything else, could simply not be listed, and that
# first listing's error is raised as it was — as is any listing that fails on
# the way down. A path that could not be listed is never given a state.
kind: Run.Sequence
metadata: { name: pathStates }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [paths]
    properties:
      paths:
        type: array
        items: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [states]
    properties:
      states:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [path, state, size]
          properties:
            path: { type: string }
            state: { type: string, enum: [file, directory, other, absent] }
            size: { type: integer }
steps:
  - name: targets
    value: !cel >-
      inputs.paths.map(p, Self.normalPath(p)).map(p, cel.bind(segments, p.split('/'),
        {'path': p, 'parent': join(slice(segments, 0, size(segments) - 1), '/'), 'name': segments[size(segments) - 1]}))
  - name: listings
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.parents"
      steps:
        - name: listed
          try:
            - name: entries
              invoke: !ref listDir
              inputs:
                path: !cel "item"
          catch:
            - name: cancelled
              if: !cel "error.code == 'ERR_INVOKE_CANCELLED'"
              then:
                - name: propagate
                  throw:
                    code: !cel "error.code"
                    message: !cel "error.message"
            - name: unlisted
              value:
                code: !cel "error.code"
                message: !cel "error.message"
                data: !cel "has(error.data) ? error.data : null"
            - name: segments
              value: !cel "item == '' ? [] : item.split('/')"
            - name: depth
              value: !cel "0"
            # Empty while the walk goes on; the workspace root has no ancestor.
            - name: verdict
              value: !cel "size(steps.segments.result) == 0 ? 'there' : ''"
            - name: walk
              while: !cel "steps.verdict.result == ''"
              do:
                - name: above
                  invoke: !ref listDir
                  inputs:
                    path: !cel "join(slice(steps.segments.result, 0, steps.depth.result), '/')"
                - name: verdict
                  value: !cel >-
                    cel.bind(found, steps.above.result.entries.filter(e, e.name == steps.segments.result[steps.depth.result]),
                      size(found) == 0 || found[0].type == 'file' ? 'absent'
                        : steps.depth.result == size(steps.segments.result) - 1 ? 'there' : '')
                - name: depth
                  value: !cel "steps.depth.result + 1"
            - name: unlistable
              if: !cel "steps.verdict.result == 'there'"
              then:
                - name: raise
                  invoke: !ref raiseRecorded
                  inputs:
                    code: !cel "string(steps.unlisted.result.code)"
                    message: !cel "string(steps.unlisted.result.message)"
                    data: !cel "steps.unlisted.result.data"
      outputs:
        parent: !cel "item"
        listed: !cel "has(steps.entries)"
        entries: !cel "has(steps.entries) ? steps.entries.result.entries : []"
    inputs:
      parents: !cel "distinct(steps.targets.result.filter(t, t.path != '').map(t, t.parent))"
outputs:
  # The empty path is the workspace root.
  states: !cel >-
    steps.targets.result.map(t,
      t.path == '' ? {'path': t.path, 'state': 'directory', 'size': 0}
        : cel.bind(l, steps.listings.result.filter(x, x.parent == t.parent)[0],
            !l.listed
              ? {'path': t.path, 'state': 'absent', 'size': 0}
              : cel.bind(found, l.entries.filter(e, e.name == t.name),
                  size(found) == 0 ? {'path': t.path, 'state': 'absent', 'size': 0}
                    : {'path': t.path, 'state': found[0].type, 'size': int(found[0].size)})))
---
# The digest of the workspace file at a path whose kind and size are already
# known from metadata, reading no more than a known copy's worth: a regular
# file is read — once, bounded by its listed size — only when that size equals
# one of the sizes given for it; a file of any other size, or one that grew
# past its listed size before the read, has no digest and counts as changed.
kind: Run.Sequence
metadata: { name: sizedDigest }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, state, size, sizes]
    properties:
      path: { type: string }
      state: { type: string, enum: [file, directory, other, absent] }
      size: { type: integer }
      sizes:
        type: array
        items: { type: integer }
steps:
  - name: candidate
    if: !cel "inputs.state == 'file' && inputs.sizes.exists(s, int(s) == int(inputs.size))"
    then:
      - name: bounded
        try:
          - name: read
            invoke: !ref readFile
            inputs:
              path: !cel "inputs.path"
              encoding: base64
              maxBytes: !cel "int(inputs.size)"
        catch:
          - name: failed
            if: !cel "error.code != 'ERR_FILE_TOO_LARGE'"
            then:
              - name: reraise
                throw:
                  code: !cel "error.code"
                  message: !cel "error.message"
                  data: !cel "has(error.data) ? error.data : null"
outputs:
  hash: !cel "has(steps.read) ? dyn(steps.read.result.sha256) : null"
---
# What the workspace holds at each path: its kind from one metadata pass over
# the paths, and its digest where `sizedDigest` reads it.
kind: Run.Sequence
metadata: { name: currentDigests }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [files]
    properties:
      files:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [path, sizes]
          properties:
            path: { type: string }
            sizes:
              type: array
              items: { type: integer }
steps:
  - name: at
    invoke: !ref pathStates
    inputs:
      paths: !cel "inputs.files.map(f, f.path)"
  - name: digests
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.files"
      steps:
        - name: digest
          invoke: !ref sizedDigest
          inputs:
            path: !cel "item.path"
            state: !cel "item.state"
            size: !cel "item.size"
            sizes: !cel "item.sizes"
      outputs:
        path: !cel "item.path"
        state: !cel "item.state"
        hash: !cel "steps.digest.result.hash"
    inputs:
      files: !cel >-
        enumerate(inputs.files).map(e, {
          'path': steps.at.result.states[e.index].path,
          'state': steps.at.result.states[e.index].state,
          'size': steps.at.result.states[e.index].size,
          'sizes': e.value.sizes
        })
outputs:
  files: !cel "steps.digests.result"
---
# One capture read: a workspace file whole, as base64, refused before any of it
# is read when it is larger than what the call's byte bound has left.
kind: Run.Sequence
metadata: { name: captureRead }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, subject, spent]
    properties:
      path: { type: string }
      # The path the tool call names, which the refusal reports.
      subject: { type: string }
      # Bytes the call has captured already.
      spent: { type: integer }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [content, sha256, size]
    properties:
      content: { type: string }
      sha256: { type: string }
      size: { type: integer }
steps:
  - name: bounded
    try:
      - name: read
        invoke: !ref readFile
        inputs:
          path: !cel "inputs.path"
          encoding: base64
          maxBytes: !cel "int(variables.maxCheckpointBytes) - int(inputs.spent)"
    catch:
      - name: tooLarge
        if: !cel "error.code == 'ERR_FILE_TOO_LARGE'"
        then:
          - name: refuseTooLarge
            throw:
              code: ERR_CHECKPOINT_TOO_LARGE
              message: !cel >-
                Self.checkpointTooLargeMessage(inputs.subject, int(inputs.spent) + int(error.data.size),
                  int(variables.maxCheckpointBytes), 'bytes')
      - name: reraise
        throw:
          code: !cel "error.code"
          message: !cel "error.message"
          data: !cel "has(error.data) ? error.data : null"
outputs:
  content: !cel "steps.read.result.content"
  sha256: !cel "steps.read.result.sha256"
  size: !cel "steps.read.result.size"
---
# Records one tool call's checkpoint entries BEFORE the workspace is touched:
# one row per path, unconfirmed, written only while the turn exists and is not
# marked removed. A call for a turn that is gone removes the copies it stored —
# the turn's directory — before it is refused, so copies exist only under live
# turns.
kind: Run.Sequence
metadata: { name: recordEntries }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId, callId, entries]
    properties:
      turnId: { type: string }
      callId: { type: string }
      entries:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [path, before, after]
          properties:
            path: { type: string }
            before: { type: [string, "null"] }
            after: { type: [string, "null"] }
steps:
  - name: insert
    invoke: !ref checkpointCommand
    inputs:
      sql: |
        INSERT INTO checkpoint_entries (turn_id, call_id, path, before_hash, after_hash)
        SELECT t.turn_id, ?, e.value ->> '$.path', e.value ->> '$.before', e.value ->> '$.after'
        FROM json_each(?) AS e JOIN turns t ON t.turn_id = ? AND t.removed_at IS NULL
        ORDER BY CAST(e.key AS INTEGER)
      bindings:
        - !cel "inputs.callId"
        - !cel "json(inputs.entries)"
        - !cel "inputs.turnId"
  - name: turnGone
    if: !cel "size(inputs.entries) > 0 && steps.insert.result.rowCount == 0"
    then:
      - name: discardCopies
        invoke: !ref blobSync
        inputs:
          delete: !cel "[inputs.turnId]"
      - name: refuseTurnGone
        throw:
          code: ERR_JOURNAL_KEY_REMOVED
          message: !cel "'Turn ' + inputs.turnId + ' was removed; nothing was changed.'"
---
# Settles entries whose write is not known to have happened, from the file each
# names: an entry is confirmed when the file holds its "after" (for a deletion:
# the path is absent) and removed otherwise. Only entries of a live turn: those
# of a turn marked removed are its removal's. What a call runs on its own
# entries when it fails after recording them (`callId`) — a cancelled call
# cannot, and leaves them to its turn's ending — what a turn's ending runs on
# that turn's leftovers (`turnId`), and what boot runs on every one (neither).
kind: Run.Sequence
metadata: { name: settleEntries }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [callId, turnId]
    properties:
      callId: { type: [string, "null"] }
      turnId: { type: [string, "null"] }
steps:
  - name: pending
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT e.id, e.turn_id, e.path, e.after_hash
        FROM checkpoint_entries e JOIN turns t ON t.turn_id = e.turn_id AND t.removed_at IS NULL
        WHERE e.confirmed = 0 AND (? IS NULL OR e.call_id = ?) AND (? IS NULL OR e.turn_id = ?)
        ORDER BY e.id
      bindings:
        - !cel "inputs.callId"
        - !cel "inputs.callId"
        - !cel "inputs.turnId"
        - !cel "inputs.turnId"
  - name: unsettled
    if: !cel "size(steps.pending.result.rows) > 0"
    then:
      # The size of each "after" copy: a file of another size is not read.
      - name: copies
        invoke:
          kind: Run.Projection
          collection: !cel "inputs.turnIds"
          steps:
            - name: blobs
              invoke: !ref listBlobs
              inputs:
                path: !cel "item"
          outputs:
            turnId: !cel "item"
            blobs: !cel "steps.blobs.result.entries"
        inputs:
          turnIds: !cel >-
            distinct(steps.pending.result.rows.filter(r, r.after_hash != null).map(r, string(r.turn_id)))
      - name: current
        invoke: !ref currentDigests
        inputs:
          files: !cel >-
            steps.pending.result.rows.map(r, {
              'path': string(r.path),
              'sizes': r.after_hash == null ? []
                : steps.copies.result.filter(c, c.turnId == string(r.turn_id))[0].blobs
                    .filter(b, b.name == string(r.after_hash)).map(b, int(b.size))
            })
      - name: confirm
        invoke: !ref checkpointCommand
        inputs:
          sql: "UPDATE checkpoint_entries SET confirmed = 1 WHERE id IN (SELECT value FROM json_each(?))"
          bindings:
            - !cel >-
              json(enumerate(steps.pending.result.rows).filter(e,
                e.value.after_hash == null ? steps.current.result.files[e.index].state == 'absent'
                  : steps.current.result.files[e.index].hash == string(e.value.after_hash))
                .map(e, int(e.value.id)))
      - name: remove
        invoke: !ref checkpointCommand
        inputs:
          sql: |
            DELETE FROM checkpoint_entries
            WHERE confirmed = 0 AND id IN (SELECT value FROM json_each(?))
          bindings: [ !cel "json(steps.pending.result.rows.map(r, int(r.id)))" ]
---
kind: Telo.Function
metadata:
  name: notFileMessage
  description: The refusal for a path that exists but is not a regular file, or a tree holding such an entry.
params:
  - name: path
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  'ERR_PATH_NOT_A_FILE: refused to change "' + path + '": it is not a regular file (a directory where a file is '
    + 'expected, a symbolic link, a device), so its content cannot be checkpointed. Nothing was changed.'
---
# Everything that writes the workspace through the agent, as ONE body the
# workspace lease runs: a write, an edit, a removal, a pushed change set or one
# batch of a revert's paths — whichever the caller names.
kind: Telo.JsonSchema
metadata: { name: WorkspaceOperation }
schema:
  type: object
  additionalProperties: false
  minProperties: 1
  maxProperties: 1
  properties:
    write:
      type: object
      additionalProperties: false
      required: [turnId, path, content]
      properties:
        turnId: { type: string }
        path: { type: string }
        content: { type: string }
    edit:
      type: object
      additionalProperties: false
      required: [turnId, path, oldString, newString]
      properties:
        turnId: { type: string }
        path: { type: string }
        oldString: { type: string }
        newString: { type: string }
    remove:
      type: object
      additionalProperties: false
      required: [turnId, path, recursive]
      properties:
        turnId: { type: string }
        path: { type: string }
        recursive: { type: boolean }
    sync:
      type: object
      additionalProperties: false
      required: [write, delete]
      properties:
        write:
          type: array
          items:
            type: object
            required: [path, content]
            properties:
              path: { type: string }
              content: { type: string }
              encoding: { type: string, enum: [utf8, base64] }
        delete:
          type: array
          items: { type: string }
    # One batch of a revert, in path order.
    revert:
      type: object
      additionalProperties: false
      required: [turnId, paths]
      properties:
        turnId: { type: string }
        paths:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required: [path, status, before, after, sizes]
            properties:
              path: { type: string }
              status: { type: string, enum: [created, modified, deleted] }
              before: { type: [string, "null"] }
              after: { type: [string, "null"] }
              # The sizes of the turn's "before" and "after" copies of the path.
              sizes:
                type: array
                items: { type: integer }
---
# One attempt at the workspace write lease: one holder at a time for the whole
# workspace, over the store the per-conversation turn lease uses. What the
# lease guarantees is that a revert never overwrites a change written through
# the agent — its comparison and its replacement are one hold, and so are a
# tool's capture and write and a whole pushed change set. `ttl` is far above the
# longest hold the checkpoint bounds allow and only frees the key if a holder
# dies. `Lease.Critical` refuses a busy key at once; that is raised as
# ERR_WORKSPACE_BUSY, so the step invoking this can retry it. Named, not
# inline in that step: a code thrown by an inline sequence is not counted in
# the enclosing sequence's throws, and the routes' `catches:` name this one.
#
# The body the lease runs returns a failure as data rather than raising it, so
# the caller's retry re-attempts only a busy lease and never the work; a
# cancellation propagates as it is.
#
# Every tool arm follows one order: what is at the path (metadata only), the
# refusals, the bounded capture read and the copies stored, the entries
# recorded, the change, the entries confirmed. A change that fails after its
# entries were recorded settles them from the files they name before it is
# raised.
kind: Run.Sequence
metadata: { name: acquireWorkspace }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [operation]
    properties:
      operation: !ref WorkspaceOperation
steps:
  - name: lease
    invoke:
      kind: Lease.Critical
      store: !ref leaseStore
      ttl: 10m
      invoke:
        kind: Run.Sequence
        inputType: !ref WorkspaceOperation
        steps:
          - name: attempt
            try:
              - name: operation
                if: !cel "has(inputs.write)"
                then:
                  # write_file: the file's current copy and the content about
                  # to be written are stored and the entry recorded, then the
                  # file is written and the entry confirmed.
                  - name: written
                    invoke:
                      kind: Run.Sequence
                      inputType:
                        kind: Telo.JsonSchema
                        schema:
                          type: object
                          additionalProperties: false
                          required: [turnId, path, content]
                          properties:
                            turnId: { type: string }
                            path: { type: string }
                            content: { type: string }
                      steps:
                        - name: call
                          value: !cel "uuidv4()"
                        - name: at
                          invoke: !ref pathStates
                          inputs:
                            paths: !cel "[inputs.path]"
                        - name: notFile
                          if: !cel "steps.at.result.states[0].state in ['directory', 'other']"
                          then:
                            - name: refuseNotFile
                              throw:
                                code: ERR_PATH_NOT_A_FILE
                                message: !cel "Self.notFileMessage(inputs.path)"
                        - name: tooLarge
                          if: !cel "steps.at.result.states[0].size > int(variables.maxCheckpointBytes)"
                          then:
                            - name: refuseTooLarge
                              throw:
                                code: ERR_CHECKPOINT_TOO_LARGE
                                message: !cel >-
                                  Self.checkpointTooLargeMessage(inputs.path, steps.at.result.states[0].size,
                                    int(variables.maxCheckpointBytes), 'bytes')
                        - name: existing
                          if: !cel "steps.at.result.states[0].state == 'file'"
                          then:
                            - name: before
                              invoke: !ref captureRead
                              inputs:
                                path: !cel "inputs.path"
                                subject: !cel "inputs.path"
                                spent: !cel "0"
                            - name: storeBefore
                              invoke: !ref writeBlob
                              inputs:
                                path: !cel "inputs.turnId + '/' + steps.before.result.sha256"
                                content: !cel "steps.before.result.content"
                                encoding: base64
                                createParents: true
                        - name: after
                          value: !cel "sha256(inputs.content)"
                        - name: storeAfter
                          invoke: !ref writeBlob
                          inputs:
                            path: !cel "inputs.turnId + '/' + steps.after.result"
                            content: !cel "inputs.content"
                            createParents: true
                        - name: diffed
                          value: !cel >-
                            Self.fileChange(Self.normalPath(inputs.path),
                              has(steps.before) ? dyn(steps.before.result.sha256) : null,
                              steps.after.result,
                              has(steps.before) ? Self.blobText(steps.before.result.content, steps.before.result.sha256) : dyn(''),
                              inputs.content)
                        - name: entries
                          invoke: !ref recordEntries
                          inputs:
                            turnId: !cel "inputs.turnId"
                            callId: !cel "steps.call.result"
                            entries: !cel >-
                              [{'path': steps.diffed.result.change.path, 'before': steps.diffed.result.change.before,
                                'after': steps.diffed.result.change.after}]
                        - name: apply
                          try:
                            - name: write
                              invoke: !ref writeFile
                              inputs:
                                path: !cel "inputs.path"
                                content: !cel "inputs.content"
                                createParents: true
                          catch:
                            - name: settle
                              invoke: !ref settleEntries
                              inputs:
                                callId: !cel "steps.call.result"
                                turnId: null
                            - name: reraise
                              throw:
                                code: !cel "error.code"
                                message: !cel "error.message"
                                data: !cel "has(error.data) ? error.data : null"
                        - name: confirm
                          invoke: !ref checkpointCommand
                          inputs:
                            sql: "UPDATE checkpoint_entries SET confirmed = 1 WHERE call_id = ?"
                            bindings: [ !cel "steps.call.result" ]
                      outputs:
                        bytesWritten: !cel "steps.write.result.bytesWritten"
                        changes: !cel >-
                          steps.diffed.result.change.before == steps.diffed.result.change.after ? [] : [steps.diffed.result.change]
                        hunks: !cel "steps.diffed.result.hunks"
                    inputs:
                      turnId: !cel "inputs.write.turnId"
                      path: !cel "inputs.write.path"
                      content: !cel "inputs.write.content"
                elseif:
                  - if: !cel "has(inputs.edit)"
                    then:
                      # edit_file: the file is read once, bounded; bytes that
                      # are not UTF-8 text are refused. When `oldString` occurs
                      # exactly once the edited text is scanned for
                      # credentials, both copies are stored and the entry
                      # recorded before the edit; otherwise nothing is
                      # checkpointed and the edit itself refuses.
                      - name: edited
                        invoke:
                          kind: Run.Sequence
                          inputType:
                            kind: Telo.JsonSchema
                            schema:
                              type: object
                              additionalProperties: false
                              required: [turnId, path, oldString, newString]
                              properties:
                                turnId: { type: string }
                                path: { type: string }
                                oldString: { type: string }
                                newString: { type: string }
                          steps:
                            - name: call
                              value: !cel "uuidv4()"
                            - name: at
                              invoke: !ref pathStates
                              inputs:
                                paths: !cel "[inputs.path]"
                            - name: notFile
                              if: !cel "steps.at.result.states[0].state in ['directory', 'other']"
                              then:
                                - name: refuseNotFile
                                  throw:
                                    code: ERR_PATH_NOT_A_FILE
                                    message: !cel "Self.notFileMessage(inputs.path)"
                            - name: tooLarge
                              if: !cel "steps.at.result.states[0].size > int(variables.maxCheckpointBytes)"
                              then:
                                - name: refuseTooLarge
                                  throw:
                                    code: ERR_CHECKPOINT_TOO_LARGE
                                    message: !cel >-
                                      Self.checkpointTooLargeMessage(inputs.path, steps.at.result.states[0].size,
                                        int(variables.maxCheckpointBytes), 'bytes')
                            - name: before
                              invoke: !ref captureRead
                              inputs:
                                path: !cel "inputs.path"
                                subject: !cel "inputs.path"
                                spent: !cel "0"
                            - name: text
                              value: !cel "Self.blobText(steps.before.result.content, steps.before.result.sha256)"
                            - name: notText
                              if: !cel "steps.text.result == null"
                              then:
                                - name: refuseNotText
                                  throw:
                                    code: ERR_FILE_NOT_TEXT
                                    message: !cel >-
                                      'ERR_FILE_NOT_TEXT: refused to edit "' + inputs.path + '": its bytes are not UTF-8 text, so an '
                                        + 'exact string replacement cannot be applied to it. Nothing was changed.'
                            - name: unique
                              value: !cel "inputs.oldString != '' && size(string(steps.text.result).split(inputs.oldString)) == 2"
                            - name: checkpoint
                              if: !cel "steps.unique.result"
                              then:
                                - name: edited
                                  value: !cel "replace(string(steps.text.result), inputs.oldString, inputs.newString)"
                                - name: findings
                                  value: !cel "SecretScan.credentialFindings(steps.edited.result)"
                                - name: secret
                                  if: !cel "size(steps.findings.result) > 0"
                                  then:
                                    - name: refuseSecret
                                      throw:
                                        code: ERR_SECRET_IN_MANIFEST
                                        message: !cel "Self.secretMessage(inputs.path, steps.findings.result)"
                                        data:
                                          path: !cel "inputs.path"
                                          findings: !cel "steps.findings.result"
                                - name: storeBefore
                                  invoke: !ref writeBlob
                                  inputs:
                                    path: !cel "inputs.turnId + '/' + steps.before.result.sha256"
                                    content: !cel "steps.before.result.content"
                                    encoding: base64
                                    createParents: true
                                - name: storeAfter
                                  invoke: !ref writeBlob
                                  inputs:
                                    path: !cel "inputs.turnId + '/' + sha256(steps.edited.result)"
                                    content: !cel "steps.edited.result"
                                    createParents: true
                                - name: diffed
                                  value: !cel >-
                                    Self.fileChange(Self.normalPath(inputs.path), steps.before.result.sha256, sha256(steps.edited.result),
                                      string(steps.text.result), steps.edited.result)
                                - name: entries
                                  invoke: !ref recordEntries
                                  inputs:
                                    turnId: !cel "inputs.turnId"
                                    callId: !cel "steps.call.result"
                                    entries: !cel >-
                                      [{'path': steps.diffed.result.change.path, 'before': steps.diffed.result.change.before,
                                        'after': steps.diffed.result.change.after}]
                            - name: apply
                              try:
                                - name: edit
                                  invoke: !ref editFile
                                  inputs:
                                    path: !cel "inputs.path"
                                    oldString: !cel "inputs.oldString"
                                    newString: !cel "inputs.newString"
                              catch:
                                - name: settle
                                  invoke: !ref settleEntries
                                  inputs:
                                    callId: !cel "steps.call.result"
                                    turnId: null
                                - name: reraise
                                  throw:
                                    code: !cel "error.code"
                                    message: !cel "error.message"
                                    data: !cel "has(error.data) ? error.data : null"
                            - name: confirm
                              invoke: !ref checkpointCommand
                              inputs:
                                sql: "UPDATE checkpoint_entries SET confirmed = 1 WHERE call_id = ?"
                                bindings: [ !cel "steps.call.result" ]
                          outputs:
                            replacements: !cel "steps.edit.result.replacements"
                            changes: !cel >-
                              has(steps.diffed) && steps.diffed.result.change.before != steps.diffed.result.change.after
                                ? [steps.diffed.result.change] : []
                            hunks: !cel "has(steps.diffed) ? steps.diffed.result.hunks : null"
                        inputs:
                          turnId: !cel "inputs.edit.turnId"
                          path: !cel "inputs.edit.path"
                          oldString: !cel "inputs.edit.oldString"
                          newString: !cel "inputs.edit.newString"
                  - if: !cel "has(inputs.remove)"
                    then:
                      # delete_file: a directory deleted recursively is
                      # enumerated first, metadata only and page by page,
                      # stopping at the first bound it crosses — no content is
                      # read before both the file count and the listed sizes
                      # pass, and a tree holding anything but regular files and
                      # directories is refused whole. Then every file is
                      # captured, one at a time, each read bounded by what the
                      # byte bound has left; the entries are recorded, the path
                      # removed and the entries confirmed. A removal that fails
                      # part-way keeps a confirmed entry for each file it had
                      # already removed.
                      - name: removed
                        invoke:
                          kind: Run.Sequence
                          inputType:
                            kind: Telo.JsonSchema
                            schema:
                              type: object
                              additionalProperties: false
                              required: [turnId, path, recursive]
                              properties:
                                turnId: { type: string }
                                path: { type: string }
                                recursive: { type: boolean }
                          steps:
                            - name: call
                              value: !cel "uuidv4()"
                            - name: at
                              invoke: !ref pathStates
                              inputs:
                                paths: !cel "[inputs.path]"
                            # A root that is a symbolic link is never listed
                            # through: its target is not the tree named.
                            - name: notFile
                              if: !cel "steps.at.result.states[0].state == 'other'"
                              then:
                                - name: refuseNotFile
                                  throw:
                                    code: ERR_PATH_NOT_A_FILE
                                    message: !cel "Self.notFileMessage(inputs.path)"
                            - name: listed
                              value: !cel >-
                                steps.at.result.states[0].state == 'file'
                                  ? [{'path': steps.at.result.states[0].path, 'type': 'file', 'size': steps.at.result.states[0].size}]
                                  : []
                            # A directory deleted without `recursive` captures
                            # nothing: the removal itself refuses it.
                            - name: tree
                              if: !cel "steps.at.result.states[0].state == 'directory' && inputs.recursive"
                              then:
                                - name: page
                                  invoke: !ref listDir
                                  inputs:
                                    path: !cel "inputs.path"
                                    recursive: true
                                    limit: !cel "int(variables.maxCheckpointFiles) + 1"
                                - name: listed
                                  value: !cel "steps.page.result.entries.filter(e, e.type != 'directory')"
                                - name: walk
                                  while: !cel >-
                                    has(steps.page.result.nextCursor)
                                      && size(steps.listed.result) <= int(variables.maxCheckpointFiles)
                                      && int(sum(steps.listed.result.map(e, e.size))) <= int(variables.maxCheckpointBytes)
                                  do:
                                    - name: page
                                      invoke: !ref listDir
                                      inputs:
                                        path: !cel "inputs.path"
                                        recursive: true
                                        cursor: !cel "steps.page.result.nextCursor"
                                        limit: !cel "int(variables.maxCheckpointFiles) + 1 - size(steps.listed.result)"
                                    - name: listed
                                      value: !cel "steps.listed.result + steps.page.result.entries.filter(e, e.type != 'directory')"
                            - name: notFiles
                              if: !cel "steps.listed.result.exists(e, e.type != 'file')"
                              then:
                                - name: refuseNotFiles
                                  throw:
                                    code: ERR_PATH_NOT_A_FILE
                                    message: !cel "Self.notFileMessage(steps.listed.result.filter(e, e.type != 'file')[0].path)"
                            - name: tooMany
                              if: !cel "size(steps.listed.result) > int(variables.maxCheckpointFiles)"
                              then:
                                - name: refuseTooMany
                                  throw:
                                    code: ERR_CHECKPOINT_TOO_LARGE
                                    message: !cel >-
                                      Self.checkpointTooLargeMessage(inputs.path, size(steps.listed.result),
                                        int(variables.maxCheckpointFiles), 'files')
                            - name: tooLarge
                              if: !cel "int(sum(steps.listed.result.map(e, e.size))) > int(variables.maxCheckpointBytes)"
                              then:
                                - name: refuseTooLarge
                                  throw:
                                    code: ERR_CHECKPOINT_TOO_LARGE
                                    message: !cel >-
                                      Self.checkpointTooLargeMessage(inputs.path, int(sum(steps.listed.result.map(e, e.size))),
                                        int(variables.maxCheckpointBytes), 'bytes')
                            - name: captured
                              value: []
                            - name: spent
                              value: !cel "0"
                            - name: capture
                              while: !cel "size(steps.captured.result) < size(steps.listed.result)"
                              do:
                                - name: before
                                  invoke: !ref captureRead
                                  inputs:
                                    path: !cel "steps.listed.result[size(steps.captured.result)].path"
                                    subject: !cel "inputs.path"
                                    spent: !cel "steps.spent.result"
                                - name: storeBefore
                                  invoke: !ref writeBlob
                                  inputs:
                                    path: !cel "inputs.turnId + '/' + steps.before.result.sha256"
                                    content: !cel "steps.before.result.content"
                                    encoding: base64
                                    createParents: true
                                - name: spent
                                  value: !cel "steps.spent.result + steps.before.result.size"
                                - name: captured
                                  value: !cel >-
                                    steps.captured.result + [Self.fileChange(steps.listed.result[size(steps.captured.result)].path,
                                      steps.before.result.sha256, null,
                                      Self.blobText(steps.before.result.content, steps.before.result.sha256), '').change]
                            - name: entries
                              invoke: !ref recordEntries
                              inputs:
                                turnId: !cel "inputs.turnId"
                                callId: !cel "steps.call.result"
                                entries: !cel "steps.captured.result.map(c, {'path': c.path, 'before': c.before, 'after': null})"
                            - name: apply
                              try:
                                - name: remove
                                  invoke: !ref removeFile
                                  inputs:
                                    path: !cel "inputs.path"
                                    recursive: !cel "inputs.recursive"
                              catch:
                                - name: settle
                                  invoke: !ref settleEntries
                                  inputs:
                                    callId: !cel "steps.call.result"
                                    turnId: null
                                - name: reraise
                                  throw:
                                    code: !cel "error.code"
                                    message: !cel "error.message"
                                    data: !cel "has(error.data) ? error.data : null"
                            - name: confirm
                              invoke: !ref checkpointCommand
                              inputs:
                                sql: "UPDATE checkpoint_entries SET confirmed = 1 WHERE call_id = ?"
                                bindings: [ !cel "steps.call.result" ]
                          outputs:
                            changes: !cel "steps.captured.result"
                        inputs:
                          turnId: !cel "inputs.remove.turnId"
                          path: !cel "inputs.remove.path"
                          recursive: !cel "inputs.remove.recursive"
                  - if: !cel "has(inputs.sync)"
                    then:
                      - name: synced
                        invoke: !ref treeSync
                        inputs:
                          write: !cel "inputs.sync.write"
                          delete: !cel "inputs.sync.delete"
                  - if: !cel "has(inputs.revert)"
                    then:
                      # One batch of a revert, within one hold. Kind and
                      # size of every path come from one listing per distinct
                      # parent directory; then each path in turn is compared,
                      # replaced and recorded. A file holding the turn's last
                      # "after" is replaced by its "before" (removed when the
                      # turn created it); one already holding the "before" is
                      # restored; anything else was changed since and is
                      # skipped, never overwritten. A file is read only when
                      # its listed size is that of one of the turn's two
                      # copies, immediately before its own replacement. The
                      # outcome is written the first time the path is
                      # evaluated and afterwards only moves to `restored`. A
                      # path that fails stops the batch and is returned as
                      # data beside whether an outcome was written before it:
                      # the paths ahead of it stay replaced and recorded.
                      - name: reverted
                        invoke:
                          kind: Run.Sequence
                          inputType:
                            kind: Telo.JsonSchema
                            schema:
                              type: object
                              additionalProperties: false
                              required: [turnId, paths]
                              properties:
                                turnId: { type: string }
                                paths:
                                  type: array
                                  items:
                                    type: object
                                    additionalProperties: false
                                    required: [path, status, before, after, sizes]
                                    properties:
                                      path: { type: string }
                                      status: { type: string, enum: [created, modified, deleted] }
                                      before: { type: [string, "null"] }
                                      after: { type: [string, "null"] }
                                      sizes:
                                        type: array
                                        items: { type: integer }
                          steps:
                            - name: at
                              invoke: !ref pathStates
                              inputs:
                                paths: !cel "inputs.paths.map(p, p.path)"
                            - name: next
                              value: !cel "0"
                            - name: recorded
                              value: !cel "false"
                            - name: batch
                              try:
                                - name: each
                                  while: !cel "steps.next.result < size(inputs.paths)"
                                  do:
                                    - name: target
                                      value: !cel "inputs.paths[steps.next.result]"
                                    - name: current
                                      invoke: !ref sizedDigest
                                      inputs:
                                        path: !cel "steps.target.result.path"
                                        state: !cel "steps.at.result.states[steps.next.result].state"
                                        size: !cel "steps.at.result.states[steps.next.result].size"
                                        sizes: !cel "steps.target.result.sizes"
                                    - name: holds
                                      value: !cel >-
                                        cel.bind(state, steps.at.result.states[steps.next.result].state, {
                                          'after': steps.target.result.after == null ? state == 'absent'
                                            : state == 'file' && steps.current.result.hash == steps.target.result.after,
                                          'before': steps.target.result.before == null ? state == 'absent'
                                            : state == 'file' && steps.current.result.hash == steps.target.result.before
                                        })
                                    - name: restore
                                      if: !cel "steps.holds.result.after && steps.target.result.before != null"
                                      then:
                                        - name: copy
                                          invoke: !ref readBlob
                                          inputs:
                                            path: !cel "inputs.turnId + '/' + string(steps.target.result.before)"
                                            encoding: base64
                                        - name: rewrite
                                          invoke: !ref writeFile
                                          inputs:
                                            path: !cel "steps.target.result.path"
                                            content: !cel "steps.copy.result.content"
                                            encoding: base64
                                            createParents: true
                                      elseif:
                                        - if: !cel "steps.holds.result.after"
                                          then:
                                            - name: delete
                                              invoke: !ref removeFile
                                              inputs:
                                                path: !cel "steps.target.result.path"
                                    - name: record
                                      invoke: !ref checkpointCommand
                                      inputs:
                                        sql: |
                                          INSERT INTO turn_reverts (turn_id, path, status, outcome)
                                          SELECT turn_id, ?, ?, ? FROM turns WHERE turn_id = ? AND removed_at IS NULL
                                          ON CONFLICT (turn_id, path) DO UPDATE SET status = excluded.status, outcome = 'restored'
                                          WHERE excluded.outcome = 'restored' AND turn_reverts.outcome <> 'restored'
                                        bindings:
                                          - !cel "steps.target.result.path"
                                          - !cel "steps.target.result.status"
                                          - !cel "steps.holds.result.after || steps.holds.result.before ? 'restored' : 'skipped'"
                                          - !cel "inputs.turnId"
                                    - name: recorded
                                      value: !cel "steps.recorded.result || steps.record.result.rowCount > 0"
                                    - name: next
                                      value: !cel "steps.next.result + 1"
                              catch:
                                - name: cancelled
                                  if: !cel "error.code == 'ERR_INVOKE_CANCELLED'"
                                  then:
                                    - name: propagate
                                      throw:
                                        code: !cel "error.code"
                                        message: !cel "error.message"
                                - name: failure
                                  value:
                                    code: !cel "error.code"
                                    message: !cel "error.message"
                                    data: !cel "has(error.data) ? error.data : null"
                          outputs:
                            recorded: !cel "steps.recorded.result"
                            failure: !cel "has(steps.failure) ? steps.failure.result : null"
                        inputs:
                          turnId: !cel "inputs.revert.turnId"
                          paths: !cel "inputs.revert.paths"
            catch:
              - name: cancelled
                if: !cel "error.code == 'ERR_INVOKE_CANCELLED'"
                then:
                  - name: propagate
                    throw:
                      code: !cel "error.code"
                      message: !cel "error.message"
              - name: failure
                value:
                  code: !cel "error.code"
                  message: !cel "error.message"
                  data: !cel "has(error.data) ? error.data : null"
        outputs:
          failure: !cel "has(steps.failure) ? steps.failure.result : null"
          result: !cel >-
            has(steps.written) ? dyn(steps.written.result)
              : has(steps.edited) ? dyn(steps.edited.result)
              : has(steps.removed) ? dyn(steps.removed.result)
              : has(steps.synced) ? dyn(steps.synced.result)
              : has(steps.reverted) ? dyn(steps.reverted.result)
              : null
    inputs:
      key: !cel "'workspace:' + string(variables.workspaceDir)"
      inputs: !cel "inputs.operation"
  - name: busy
    if: !cel "!steps.lease.result.acquired"
    then:
      - name: refuseBusy
        throw:
          code: ERR_WORKSPACE_BUSY
          message: >-
            ERR_WORKSPACE_BUSY: another change to the workspace is in progress.
            Nothing was changed; retry the call.
outputs:
  failure: !cel "steps.lease.result.result.failure"
  result: !cel "steps.lease.result.result.result"
---
# One workspace operation under the lease. Acquisition is retried here — the
# one layer that retries — and ERR_WORKSPACE_BUSY is raised when the retries
# are spent. The operation's own failure is raised as it was.
kind: Run.Sequence
metadata: { name: leasedWorkspace }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [operation]
    properties:
      operation: !ref WorkspaceOperation
steps:
  - name: hold
    invoke: !ref acquireWorkspace
    inputs:
      operation: !cel "inputs.operation"
    # About five seconds of waiting in expectation and never more than about
    # ten: a large recursive delete holds the lease for seconds, and a caller
    # behind it waits rather than fails. Full jitter, capped at 50 ms, so a
    # waiter asks again within every pause a multi-path revert leaves.
    retry:
      attempts: 200
      initialDelay: 5
      maxDelay: 50
      jitter: full
  - name: failed
    if: !cel "steps.hold.result.failure != null"
    then:
      - name: raise
        invoke: !ref raiseRecorded
        inputs:
          code: !cel "string(steps.hold.result.failure.code)"
          message: !cel "string(steps.hold.result.failure.message)"
          data: !cel "steps.hold.result.failure.data"
outputs:
  result: !cel "steps.hold.result.result"
---
# POST /workspace. Every path of the change set is judged BEFORE anything is
# applied, so a refused set leaves the workspace as it was — a path outside the
# workspace, or a `delete` entry naming the workspace root or a directory
# holding the agent's state directory — and the whole apply is one hold of the
# workspace lease. Not scanned for secrets, and not
# checkpointed: this is the user's own editor writing the user's own files.
kind: Run.Sequence
metadata: { name: syncWorkspace }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [write, delete]
    properties:
      write:
        type: array
        items:
          type: object
          required: [path, content]
          properties:
            path: { type: string }
            content: { type: string }
            encoding: { type: string, enum: [utf8, base64] }
      delete:
        type: array
        items: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [written, deleted]
    properties:
      written: { type: integer }
      deleted: { type: integer }
steps:
  - name: outside
    value: !cel >-
      inputs.write.map(w, w.path).filter(p, Self.outsideWorkspace(p, string(variables.workspaceDir), string(variables.stateDir)))
        + inputs.delete.filter(p, Self.outsideWorkspace(p, string(variables.workspaceDir), string(variables.stateDir)))
  - name: confine
    if: !cel "size(steps.outside.result) > 0"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(steps.outside.result[0]) + ' Nothing was applied.'"
          data:
            paths: !cel "steps.outside.result"
  - name: whole
    value: !cel >-
      inputs.delete.filter(p, Self.unremovable(p, string(variables.workspaceDir), string(variables.stateDir)))
  - name: keep
    if: !cel "size(steps.whole.result) > 0"
    then:
      - name: refuseWhole
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.unremovableMessage(steps.whole.result[0]) + ' Nothing was applied.'"
          data:
            paths: !cel "steps.whole.result"
  - name: apply
    invoke: !ref leasedWorkspace
    inputs:
      operation:
        sync:
          write: !cel "inputs.write"
          delete: !cel "inputs.delete"
outputs:
  written: !cel "steps.apply.result.result.written"
  deleted: !cel "steps.apply.result.result.deleted"
---
# GET /ready. Each reason is one dependency a turn needs, probed for real: the
# conversation database read, the operator's model key present, the workspace
# writable (a probe file written and removed under the agent's own state
# directory, which no listing or sync shows). An empty list is ready. Each
# message is fixed — the route is unguarded, so a failure's own text (a database
# error, an absolute path) goes to the log instead.
kind: Run.Sequence
metadata: { name: readiness }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [reasons]
    properties:
      reasons:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [SCHEMA_UNAVAILABLE, MODEL_CREDENTIAL_MISSING, WORKSPACE_NOT_WRITABLE] }
            message: { type: string }
steps:
  - name: schema
    try:
      - name: schemaRead
        invoke: !ref historyRows
        inputs:
          sql: "SELECT COUNT(*) AS n FROM turns"
          bindings: []
    # The cause goes to the operator's log; the unguarded route says only
    # which check failed.
    catch:
      - name: schemaFailure
        invoke: !ref Log.emit
        inputs:
          level: warn
          message: The readiness check could not read the conversation database.
          attributes:
            error: !cel "error.message"
  - name: workspace
    try:
      - name: probeWrite
        invoke: !ref writeFile
        inputs:
          path: .telo-agent/ready-probe
          content: ready
          createParents: true
      - name: probeRemove
        invoke: !ref removeFile
        inputs:
          path: .telo-agent/ready-probe
    catch:
      - name: workspaceFailure
        invoke: !ref Log.emit
        inputs:
          level: warn
          message: The readiness check could not write and remove a file in the workspace.
          attributes:
            error: !cel "error.message"
outputs:
  reasons: !cel >-
    (has(steps.schemaFailure) ? [{'code': 'SCHEMA_UNAVAILABLE',
        'message': 'The conversation database cannot be read.'}] : [])
    + (secrets.openaiApiKey == '' ? [{'code': 'MODEL_CREDENTIAL_MISSING',
        'message': 'No model API key is configured (OPENAI_API_KEY is empty).'}] : [])
    + (has(steps.workspaceFailure) ? [{'code': 'WORKSPACE_NOT_WRITABLE',
        'message': 'The workspace is not writable.'}] : [])
---
# The agent's prompt identity: the lowercase hex SHA-256 of the primer it runs
# with, read from the same file `author` embeds, so the two cannot disagree.
kind: Run.Sequence
metadata: { name: promptIdentity }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id: { type: string }
steps:
  - name: primer
    value: !include-text ./primer.md
outputs:
  id: !cel "sha256(steps.primer.result)"
---
# The turn journal: every record of every turn, under the turn's id, in the
# agent's own database. It is the one source of truth — the event stream, the
# records route and the model's history (the `messages` projection) are all read
# from it. No `retention:`: turns are removed only by a removal the agent
# decides — a deletion, a truncation or the retention sweep, all through
# `cascadeTurns` — never by expiry taking one turn's records alone; a removed
# turn keeps answering "removed" (410) for `retentionDays`.
kind: RecordStream.Journal
metadata: { name: turnJournal }
store:
  kind: RecordStreamSql.JournalStore
  connection: !ref chatDb
  table: turn_journal
# `int(...)`: an integer variable forwarded through an import arrives here as a
# double at runtime, though it is typed int statically.
markerRetention: !cel "duration(string(int(variables.retentionDays) * 24) + 'h')"
writerTimeout: 30s
---
# Exported so a test reads a turn exactly as the events route does.
kind: RecordStream.JournalSource
metadata: { name: journalSource }
journal: !ref turnJournal
---
kind: RecordStream.JournalRead
metadata: { name: journalRead }
journal: !ref turnJournal
---
# GET /chat/{turnId}/events. A turn nobody started is 404, a removed one 410 —
# both decided from one snapshot before any stream exists, so a route can map
# them. Otherwise the journal's own replay-then-tail: a running turn tails, a
# finished one ends, a failed one raises its recorded error (the encoder turns
# that into an `event: error` frame), and a turn removed mid-read raises
# ERR_JOURNAL_KEY_REMOVED the same way.
kind: Run.Sequence
metadata: { name: turnEvents }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId, fromId]
    properties:
      turnId: { type: string }
      fromId: { type: integer, minimum: 0 }
steps:
  - name: header
    invoke: !ref journalRead
    inputs:
      key: !cel "inputs.turnId"
      limit: 0
  - name: unknown
    if: !cel "steps.header.result.state == 'unknown'"
    then:
      - name: refuseUnknown
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'No turn ' + inputs.turnId + ' was started on this agent.'"
  - name: removed
    if: !cel "steps.header.result.state == 'removed'"
    then:
      - name: refuseRemoved
        throw:
          code: ERR_JOURNAL_KEY_REMOVED
          message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
  - name: read
    invoke: !ref journalSource
    inputs:
      key: !cel "inputs.turnId"
      fromId: !cel "inputs.fromId"
outputs:
  output: !cel "steps.read.result.output"
---
# GET /conversations/{id}/records — the display transcript, server-side: an
# existing, undeleted conversation's live turns in order, each with its status
# and its records, paged by
# (turn, record id). The page is planned from one snapshot of each turn's
# header first, so `limit` bounds the records read, not only the records
# returned, and each turn's status and error are that snapshot's.
kind: Run.Sequence
metadata: { name: conversationRecords }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, fromTurn, fromId, limit]
    properties:
      conversationId: { type: string }
      # Empty for the first page.
      fromTurn: { type: string }
      fromId: { type: integer, minimum: 0 }
      limit: { type: integer, minimum: 1, maximum: 10000 }
steps:
  - name: conversation
    invoke: !ref requireConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
  - name: turns
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT t.turn_id, t.started_at, t.aborted_at, t.checkpointed, t.reverted_at,
               COALESCE(p.prompt_tokens, 0) AS prompt_tokens,
               COALESCE(p.completion_tokens, 0) AS completion_tokens,
               COALESCE(p.tokens, 0) AS tokens, COALESCE(p.runs, '[]') AS runs
        FROM turns t LEFT JOIN turn_projections p ON p.turn_id = t.turn_id
        WHERE t.conversation_id = ? AND t.turn_id >= ? AND t.removed_at IS NULL ORDER BY t.turn_id
      bindings:
        - !cel "inputs.conversationId"
        - !cel "inputs.fromTurn"
  - name: unknownCursor
    if: !cel "inputs.fromTurn != '' && (size(steps.turns.result.rows) == 0 || steps.turns.result.rows[0].turn_id != inputs.fromTurn)"
    then:
      - name: refuseCursor
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'Turn ' + inputs.fromTurn + ' is not part of this conversation.'"
  - name: headers
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.turns"
      steps:
        - name: header
          invoke: !ref journalRead
          inputs:
            key: !cel "item.turn_id"
            limit: 0
      outputs:
        lastId: !cel "steps.header.result.lastId"
        state: !cel "steps.header.result.state"
        error: !cel "steps.header.result.error"
    inputs:
      turns: !cel "steps.turns.result.rows"
  # Where each turn's page starts, how many of its records fit, and the cursor
  # of the next page — from the last ids alone, before a single record is read.
  - name: plan
    value: !cel >-
      cel.bind(from, range(size(steps.headers.result)).map(i,
          i == 0 && inputs.fromTurn != '' ? inputs.fromId : 0),
        cel.bind(avail, range(size(steps.headers.result)).map(i,
            steps.headers.result[i].lastId > from[i] ? steps.headers.result[i].lastId - from[i] : 0),
          cel.bind(before, range(size(avail)).map(i, int(sum(slice(avail, 0, i)))),
            cel.bind(included, range(size(avail)).filter(i, before[i] < inputs.limit),
              cel.bind(take, included.map(i,
                  avail[i] < inputs.limit - before[i] ? avail[i] : inputs.limit - before[i]),
                {
                  'pages': included.map(i, {
                    'turnId': steps.turns.result.rows[i].turn_id,
                    'startedAt': steps.turns.result.rows[i].started_at,
                    'abortedAt': steps.turns.result.rows[i].aborted_at,
                    'row': steps.turns.result.rows[i],
                    'state': steps.headers.result[i].state,
                    'error': steps.headers.result[i].error,
                    'fromId': from[i],
                    'limit': take[i]
                  }),
                  'next': size(included) > 0 && take[size(included) - 1] < avail[size(included) - 1]
                    ? dyn({'fromTurn': steps.turns.result.rows[size(included) - 1].turn_id,
                       'fromId': from[size(included) - 1] + take[size(included) - 1]})
                    : size(included) < size(avail)
                      ? dyn({'fromTurn': steps.turns.result.rows[size(included)].turn_id, 'fromId': 0})
                      : null
                })))))
  # What the page's turns changed and what a revert of each recorded: the
  # projection of their net file changes and their revert outcomes.
  - name: changes
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT * FROM turn_changes WHERE turn_id IN (SELECT value FROM json_each(?)) ORDER BY turn_id, path
      bindings: [ !cel "json(steps.plan.result.pages.map(p, p.turnId))" ]
  - name: reverts
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT * FROM turn_reverts WHERE turn_id IN (SELECT value FROM json_each(?)) ORDER BY turn_id, path
      bindings: [ !cel "json(steps.plan.result.pages.map(p, p.turnId))" ]
  - name: pages
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.pages"
      steps:
        - name: page
          invoke: !ref journalRead
          inputs:
            key: !cel "item.turnId"
            fromId: !cel "item.fromId"
            limit: !cel "item.limit"
      outputs:
        turnId: !cel "item.turnId"
        # Null while the turn runs: a summary is of an ended turn.
        summary: !cel >-
          item.state == 'open' && steps.page.result.state != 'removed' ? null
            : dyn(Self.turnSummary(item.row, inputs.changes.filter(c, c.turn_id == item.turnId)))
        revert: !cel >-
          Self.revertOutcome(item.row.reverted_at, inputs.reverts.filter(r, r.turn_id == item.turnId))
        startedAt: !cel "item.startedAt"
        # The state that planned this page, not the page read's own: a turn
        # that ended between the two reads is reported `running` with the
        # records up to where it was planned, and a client attaching from its
        # last id receives the rest — never `finished` with records missing.
        # Only a removal in between wins, since the page then carries none.
        status: !cel >-
          cel.bind(state, steps.page.result.state == 'removed' ? 'removed' : item.state,
            cel.bind(status, Self.turnStatus(state, state == 'removed' ? null : item.error, item.abortedAt),
              status == 'removed' || status == 'unknown' ? 'failed' : status))
        error: !cel >-
          steps.page.result.state == 'removed' || item.state == 'removed'
            ? {'code': 'ERR_JOURNAL_KEY_REMOVED', 'message': 'This turn was removed.'}
            : item.state == 'unknown'
              ? {'code': 'ERR_TURN_NOT_FOUND', 'message': 'This turn has no records.'}
              : item.error
        records: !cel "steps.page.result.entries"
    inputs:
      pages: !cel "steps.plan.result.pages"
      changes: !cel "steps.changes.result.rows"
      reverts: !cel "steps.reverts.result.rows"
outputs:
  turns: !cel "steps.pages.result"
  next: !cel "steps.plan.result.next"
---
# Reads over the agent's own database.
kind: Sql.Query
metadata: { name: historyRows }
connection: !ref chatDb
---
# An ended turn's summary, from its projection: the files it changed on balance
# (null for a turn from before checkpoints existed), whether their checks were
# clean, the manifests it ran and the tokens every model call of it used.
# `check` is `clean` when every created or modified file's last check exited 0,
# `failing` when one exited otherwise, and null when the turn created and
# modified nothing or a file's check is not known.
kind: Telo.Function
metadata:
  name: turnSummary
  description: A turn's summary from its row joined with its projection and its projected file changes.
params:
  - name: row
    schema: { type: object }
  - name: changes
    schema: { type: array }
returns:
  schema: { type: object }
body: !cel >-
  cel.bind(codes, changes.filter(c, c.status != 'deleted').map(c, c.check_exit_code),
    {
      'files': int(row.checkpointed) == 0 ? null : dyn(changes.map(c, {
        'path': c.path,
        'status': c.status,
        'before': c.before_hash,
        'after': c.after_hash,
        'added': c.added == null ? null : dyn(int(c.added)),
        'removed': c.removed == null ? null : dyn(int(c.removed)),
        'firstLine': c.first_line == null ? null : dyn(int(c.first_line)),
        'checkExitCode': c.check_exit_code == null ? null : dyn(int(c.check_exit_code))
      })),
      'check': size(codes) == 0 ? null
        : codes.exists(code, code != null && int(code) != 0) ? dyn('failing')
        : codes.all(code, code != null) ? dyn('clean') : null,
      'runs': parseJson(string(row.runs)).map(r, {'path': r.path, 'exitCode': int(r.exitCode)}),
      'usage': {
        'promptTokens': int(row.prompt_tokens),
        'completionTokens': int(row.completion_tokens),
        'totalTokens': int(row.tokens)
      }
    })
---
kind: Telo.Function
metadata:
  name: revertOutcome
  description: A turn's recorded revert — when, and each path's outcome — or null when it was never reverted.
params:
  - name: revertedAt
    schema: { type: string }
    nullable: true
  - name: rows
    schema: { type: array }
returns:
  schema:
    anyOf:
      - type: object
      - type: "null"
body: !cel >-
  revertedAt == null ? null : dyn({
    'revertedAt': revertedAt,
    'files': rows.map(r, {'path': r.path, 'status': r.status, 'outcome': r.outcome})
  })
---
# A turn's checkpoint, one row per path, from its CONFIRMED entries only: the
# digest the path held before the turn first changed it, the digest its last
# entry left, and the size of each of those copies (null for an absent side).
kind: Run.Sequence
metadata: { name: checkpointPaths }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId]
    properties:
      turnId: { type: string }
steps:
  - name: paths
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT e.path,
               (SELECT f.before_hash FROM checkpoint_entries f
                 WHERE f.turn_id = e.turn_id AND f.path = e.path AND f.confirmed = 1
                 ORDER BY f.id LIMIT 1) AS before_hash,
               (SELECT f.after_hash FROM checkpoint_entries f
                 WHERE f.turn_id = e.turn_id AND f.path = e.path AND f.confirmed = 1
                 ORDER BY f.id DESC LIMIT 1) AS after_hash
        FROM checkpoint_entries e WHERE e.turn_id = ? AND e.confirmed = 1 GROUP BY e.path ORDER BY e.path
      bindings: [ !cel "inputs.turnId" ]
  - name: recorded
    if: !cel "size(steps.paths.result.rows) > 0"
    then:
      - name: copies
        invoke: !ref listBlobs
        inputs:
          path: !cel "inputs.turnId"
outputs:
  paths: !cel >-
    cel.bind(copies, has(steps.copies) ? steps.copies.result.entries : [],
      steps.paths.result.rows.map(r, {
        'path': string(r.path),
        'before': r.before_hash == null ? null : dyn(string(r.before_hash)),
        'after': r.after_hash == null ? null : dyn(string(r.after_hash)),
        'beforeSize': cel.bind(copy, copies.filter(c, r.before_hash != null && c.name == string(r.before_hash)),
          size(copy) > 0 ? dyn(int(copy[0].size)) : null),
        'afterSize': cel.bind(copy, copies.filter(c, r.after_hash != null && c.name == string(r.after_hash)),
          size(copy) > 0 ? dyn(int(copy[0].size)) : null)
      }))
---
# A turn's net file changes with their line diffs: one per path whose first
# "before" differs from its last "after", each compared over the turn's copies.
# The diff reads at most `maxTurnDiffBytes` of copies: taken in path order, a
# file is read and compared when the listed sizes of its two copies fit what
# the budget has left; one that does not fit is not read and carries no counts,
# hunks or first line, and a later, smaller one may still fit. Whether a side
# that was read is comparable is `TextDiff.lineDiff`'s answer alone.
kind: Run.Sequence
metadata: { name: netChanges }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId]
    properties:
      turnId: { type: string }
steps:
  - name: checkpoint
    invoke: !ref checkpointPaths
    inputs:
      turnId: !cel "inputs.turnId"
  - name: net
    value: !cel "steps.checkpoint.result.paths.filter(p, p.before != p.after)"
  # Which files fit, judged on listed sizes before anything is read.
  - name: fits
    value: []
  - name: spent
    value: !cel "0"
  - name: plan
    while: !cel "size(steps.fits.result) < size(steps.net.result)"
    do:
      - name: cost
        value: !cel >-
          cel.bind(p, steps.net.result[size(steps.fits.result)],
            (p.beforeSize == null ? 0 : int(p.beforeSize)) + (p.afterSize == null ? 0 : int(p.afterSize)))
      - name: fit
        value: !cel "steps.spent.result + steps.cost.result <= int(variables.maxTurnDiffBytes)"
      - name: spent
        value: !cel "steps.fit.result ? steps.spent.result + steps.cost.result : steps.spent.result"
      - name: fits
        value: !cel "steps.fits.result + [steps.fit.result]"
  - name: diffs
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.net"
      steps:
        - name: beforeSide
          if: !cel "item.fits && item.beforeSize != null"
          then:
            - name: beforeBlob
              invoke: !ref readBlob
              inputs:
                path: !cel "inputs.turnId + '/' + string(item.before)"
                encoding: base64
        - name: afterSide
          if: !cel "item.fits && item.afterSize != null"
          then:
            - name: afterBlob
              invoke: !ref readBlob
              inputs:
                path: !cel "inputs.turnId + '/' + string(item.after)"
                encoding: base64
      outputs:
        afterSize: !cel "item.afterSize"
        diffed: !cel >-
          Self.fileChange(item.path, item.before, item.after,
            !item.fits ? null : item.before == null ? dyn('')
              : has(steps.beforeBlob) ? Self.blobText(steps.beforeBlob.result.content, string(item.before)) : null,
            !item.fits ? null : item.after == null ? dyn('')
              : has(steps.afterBlob) ? Self.blobText(steps.afterBlob.result.content, string(item.after)) : null)
    inputs:
      turnId: !cel "inputs.turnId"
      net: !cel "enumerate(steps.net.result).map(e, merge(e.value, {'fits': steps.fits.result[e.index]}))"
outputs:
  files: !cel "steps.diffs.result.map(d, merge(d.diffed, {'afterSize': d.afterSize}))"
---
# The refusals the changes and revert routes share, from one snapshot of the
# turn's key and its row: removed (410 ERR_JOURNAL_KEY_REMOVED), never started
# (404 ERR_TURN_NOT_FOUND).
kind: Run.Sequence
metadata: { name: requireTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId]
    properties:
      turnId: { type: string }
steps:
  - name: header
    invoke: !ref journalRead
    inputs:
      key: !cel "inputs.turnId"
      limit: 0
  - name: row
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT t.conversation_id, t.checkpointed, t.reverted_at, t.removed_at,
               (SELECT MAX(l.turn_id) FROM turns l
                 WHERE l.conversation_id = t.conversation_id AND l.removed_at IS NULL) AS last_turn_id
        FROM turns t WHERE t.turn_id = ?
      bindings: [ !cel "inputs.turnId" ]
  - name: removed
    if: !cel >-
      steps.header.result.state == 'removed'
        || (size(steps.row.result.rows) > 0 && steps.row.result.rows[0].removed_at != null)
    then:
      - name: refuseRemoved
        throw:
          code: ERR_JOURNAL_KEY_REMOVED
          message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
  - name: unknown
    if: !cel "steps.header.result.state == 'unknown' || size(steps.row.result.rows) == 0"
    then:
      - name: refuseUnknown
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'No turn ' + inputs.turnId + ' was started on this agent.'"
outputs:
  conversationId: !cel "string(steps.row.result.rows[0].conversation_id)"
  lastTurnId: !cel "string(steps.row.result.rows[0].last_turn_id)"
  checkpointed: !cel "int(steps.row.result.rows[0].checkpointed) != 0"
  revertedAt: !cel "steps.row.result.rows[0].reverted_at"
---
# GET /chat/{turnId}/changes: what a turn changed on balance, each file as its
# Change with the line its first hunk starts at, its hunks from the first
# "before" to the last "after", and whether the workspace file has changed
# since — judged from the file's kind and size, and its content read only when
# its size is that of the turn's "after". One request reads at most
# `maxTurnDiffBytes` of workspace files for that, an allowance of its own
# beside the diff's: taken in path order on listed sizes before any read, a
# file that needs a read and does not fit what is left is not compared and
# answers `changedSince: null`, and a later, smaller one may still fit. Served
# for an archived conversation
# and for a running turn (its confirmed entries so far). A turn from before
# checkpoints existed answers `files: null` and `revert: null`. Refused for a
# removed turn (410), an unknown one (404) and a conversation unknown or
# deleted (404 / 410).
kind: Run.Sequence
metadata: { name: turnChanges }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId]
    properties:
      turnId: { type: string }
steps:
  - name: turn
    invoke: !ref requireTurn
    inputs:
      turnId: !cel "inputs.turnId"
  - name: conversation
    invoke: !ref requireConversation
    inputs:
      conversationId: !cel "steps.turn.result.conversationId"
  - name: checkpointed
    if: !cel "steps.turn.result.checkpointed"
    then:
      - name: net
        invoke: !ref netChanges
        inputs:
          turnId: !cel "inputs.turnId"
      - name: at
        invoke: !ref pathStates
        inputs:
          paths: !cel "steps.net.result.files.map(f, f.change.path)"
      # Per file: `read` when its content must be read and fits the allowance,
      # `skip` when it must be read and does not, `none` when metadata answers.
      - name: reads
        value: []
      - name: spent
        value: !cel "0"
      - name: plan
        while: !cel "size(steps.reads.result) < size(steps.net.result.files)"
        do:
          - name: candidate
            value: !cel >-
              cel.bind(f, steps.net.result.files[size(steps.reads.result)],
                cel.bind(state, steps.at.result.states[size(steps.reads.result)],
                  {'needed': f.afterSize != null && state.state == 'file' && state.size == int(f.afterSize),
                   'size': state.size}))
          - name: fit
            value: !cel >-
              steps.candidate.result.needed
                && steps.spent.result + steps.candidate.result.size <= int(variables.maxTurnDiffBytes)
          - name: spent
            value: !cel "steps.fit.result ? steps.spent.result + steps.candidate.result.size : steps.spent.result"
          - name: reads
            value: !cel >-
              steps.reads.result + [steps.fit.result ? 'read' : steps.candidate.result.needed ? 'skip' : 'none']
      - name: workspace
        invoke:
          kind: Run.Projection
          collection: !cel "inputs.files"
          steps:
            - name: digest
              invoke: !ref sizedDigest
              inputs:
                path: !cel "item.path"
                state: !cel "item.state"
                size: !cel "item.size"
                sizes: !cel "item.read == 'read' ? [item.size] : []"
          outputs:
            state: !cel "item.state"
            read: !cel "item.read"
            hash: !cel "steps.digest.result.hash"
        inputs:
          files: !cel >-
            enumerate(steps.at.result.states).map(e,
              {'path': e.value.path, 'state': e.value.state, 'size': e.value.size, 'read': steps.reads.result[e.index]})
      - name: reverts
        invoke: !ref historyRows
        inputs:
          sql: "SELECT path, status, outcome FROM turn_reverts WHERE turn_id = ? ORDER BY path"
          bindings: [ !cel "inputs.turnId" ]
outputs:
  files: !cel >-
    !has(steps.net) ? null : dyn(enumerate(steps.net.result.files).map(e, merge(e.value.change, {
      'firstLine': e.value.firstLine,
      'hunks': e.value.hunks,
      'changedSince': cel.bind(at, steps.workspace.result[e.index],
        e.value.change.after == null ? dyn(at.state != 'absent')
          : at.read == 'none' ? dyn(true)
          : at.read == 'skip' ? null
          : dyn(!(at.hash == e.value.change.after)))
    })))
  revert: !cel >-
    !has(steps.reverts) ? null : Self.revertOutcome(steps.turn.result.revertedAt, steps.reverts.result.rows)
---
# POST /chat/{turnId}/revert: puts back what a turn changed, in path order, in
# batches of up to 25 paths — each batch one hold of the workspace lease, with
# a 100 ms pause between holds so whoever waits for the lease gets it. Refused,
# in order: the turn removed (410) or unknown (404), its conversation deleted
# (410) or archived (409), a turn of that conversation running (409
# ERR_TURN_IN_PROGRESS), a turn from before checkpoints existed (409
# ERR_TURN_NOT_CHECKPOINTED), then a workspace that stays busy
# (ERR_WORKSPACE_BUSY). Any turn may be reverted, not only the latest; a path
# changed since is skipped. `turns.reverted_at` and the conversation's
# `revision` move when a path's outcome was written or changed — also when the
# revert then stops, busy or failed, part-way: what it recorded is stamped
# first — and when the turn's first revert runs to its end, whatever it
# restored. A revert refused or failed before any outcome was written moves
# neither.
kind: Run.Sequence
metadata: { name: revertTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId]
    properties:
      turnId: { type: string }
steps:
  - name: turn
    invoke: !ref requireTurn
    inputs:
      turnId: !cel "inputs.turnId"
  - name: conversation
    invoke: !ref requireWritableConversation
    inputs:
      conversationId: !cel "steps.turn.result.conversationId"
  # Only the conversation's last turn can be running.
  - name: last
    invoke: !ref journalRead
    inputs:
      key: !cel "steps.turn.result.lastTurnId"
      limit: 0
  - name: inProgress
    if: !cel "steps.last.result.state == 'open'"
    then:
      - name: refuseInProgress
        throw:
          code: ERR_TURN_IN_PROGRESS
          message: A turn is running in this conversation; revert once it has ended.
          data:
            activeTurnId: !cel "steps.turn.result.lastTurnId"
  - name: legacy
    if: !cel "!steps.turn.result.checkpointed"
    then:
      - name: refuseLegacy
        throw:
          code: ERR_TURN_NOT_CHECKPOINTED
          message: This turn ran before the agent kept checkpoints; its changes cannot be reverted.
  - name: checkpoint
    invoke: !ref checkpointPaths
    inputs:
      turnId: !cel "inputs.turnId"
  # A path the turn left as it found it has nothing to restore.
  - name: targets
    value: !cel >-
      steps.checkpoint.result.paths.filter(p, p.before != p.after).map(p, {
        'path': p.path,
        'status': p.before == null ? 'created' : p.after == null ? 'deleted' : 'modified',
        'before': p.before,
        'after': p.after,
        'sizes': [p.beforeSize, p.afterSize].filter(s, s != null).map(s, int(s))
      })
  - name: next
    value: !cel "0"
  - name: recorded
    value: !cel "false"
  - name: completed
    value: !cel "false"
  - name: paths
    try:
      - name: each
        while: !cel "steps.next.result < size(steps.targets.result)"
        do:
          - name: yield
            if: !cel "steps.next.result > 0"
            then:
              - name: pause
                invoke: { kind: Timer.Delay }
                inputs:
                  duration: 100ms
          - name: batch
            invoke: !ref leasedWorkspace
            inputs:
              operation:
                revert:
                  turnId: !cel "inputs.turnId"
                  paths: !cel >-
                    slice(steps.targets.result, steps.next.result,
                      steps.next.result + 25 < size(steps.targets.result)
                        ? steps.next.result + 25 : size(steps.targets.result))
          - name: recorded
            value: !cel "steps.recorded.result || steps.batch.result.result.recorded"
          - name: failed
            if: !cel "steps.batch.result.result.failure != null"
            then:
              - name: raise
                invoke: !ref raiseRecorded
                inputs:
                  code: !cel "string(steps.batch.result.result.failure.code)"
                  message: !cel "string(steps.batch.result.result.failure.message)"
                  data: !cel "steps.batch.result.result.failure.data"
          - name: next
            value: !cel "steps.next.result + 25"
      - name: completed
        value: !cel "true"
    finally:
      - name: stamp
        if: !cel "steps.recorded.result || (steps.completed.result && steps.turn.result.revertedAt == null)"
        then:
          - name: reverted
            invoke:
              kind: Sql.Transaction
              connection: !ref chatDb
              steps:
                kind: Run.Sequence
                inputType:
                  kind: Telo.JsonSchema
                  schema:
                    type: object
                    additionalProperties: false
                    required: [conversationId, turnId]
                    properties:
                      conversationId: { type: string }
                      turnId: { type: string }
                steps:
                  - name: turn
                    invoke: !ref checkpointCommand
                    inputs:
                      sql: |
                        UPDATE turns SET reverted_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                        WHERE turn_id = ? AND removed_at IS NULL
                      bindings: [ !cel "inputs.turnId" ]
                  - name: revision
                    invoke: !ref checkpointCommand
                    inputs:
                      sql: |
                        UPDATE conversations
                        SET revision = revision + 1, updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                        WHERE id = ? AND removed_at IS NULL
                      bindings: [ !cel "inputs.conversationId" ]
              inputs:
                conversationId: !cel "inputs.conversationId"
                turnId: !cel "inputs.turnId"
            inputs:
              conversationId: !cel "steps.turn.result.conversationId"
              turnId: !cel "inputs.turnId"
  - name: outcome
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT r.path, r.status, r.outcome FROM turn_reverts r WHERE r.turn_id = ? ORDER BY r.path
      bindings: [ !cel "inputs.turnId" ]
  - name: state
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT t.reverted_at, c.revision FROM turns t JOIN conversations c ON c.id = t.conversation_id
        WHERE t.turn_id = ?
      bindings: [ !cel "inputs.turnId" ]
  - name: gone
    if: !cel "size(steps.state.result.rows) == 0 || steps.state.result.rows[0].reverted_at == null"
    then:
      - name: refuseGone
        throw:
          code: ERR_JOURNAL_KEY_REMOVED
          message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
outputs:
  revert: !cel "Self.revertOutcome(string(steps.state.result.rows[0].reverted_at), steps.outcome.result.rows)"
  revision: !cel "int(steps.state.result.rows[0].revision)"
---
# The model's view of one turn, folded from its journal records: the user's
# message, then per model call an assistant row (its text, and the tool calls
# that got a result) followed by the tool rows answering the previous call. A
# `turn-continued` record closes the interrupted call the same way a
# `step-finish` does and adds its note as a user message, so a continued turn
# replays every attempt in order. A tool call with no recorded result is left
# out — the provider refuses a call with no answer, and the note names it.
# Reasoning deltas are display-only (the reasoning itself rides providerState),
# and a call cut off mid-stream keeps the text it had streamed.
kind: Telo.Function
metadata:
  name: turnMessages
  description: Folds one turn's journal records into the model messages that replay it.
params:
  - name: records
    schema: { type: array }
returns:
  schema: { type: array }
body: !cel >-
  cel.bind(ends, enumerate(records).filter(e, e.value.type in ['step-finish', 'turn-continued']).map(e, e.index),
    cel.bind(answered, records.filter(r, r.type == 'tool-result').map(r, r.toolResult.toolCallId),
      records.filter(r, r.type == 'user-message').map(r, {'role': 'user', 'content': r.content})
      + flatten(range(size(ends) + 1).map(k,
          cel.bind(segment, slice(records, k == 0 ? 0 : ends[k - 1] + 1, k < size(ends) ? ends[k] : size(records)),
            segment.filter(r, r.type == 'tool-result').map(r, {
              'role': 'tool',
              'content': r.toolResult.content,
              'toolCallId': r.toolResult.toolCallId
            })
            + cel.bind(text, join(segment.filter(r, r.type == 'text-delta').map(r, r.delta), ''),
                cel.bind(calls, segment.filter(r, r.type == 'tool-call' && r.toolCall.id in answered).map(r, r.toolCall),
                  size(calls) > 0
                    ? [{'role': 'assistant', 'content': text, 'toolCalls': calls}]
                    : text != '' ? [{'role': 'assistant', 'content': text}] : []))
            + (k < size(ends) && records[ends[k]].type == 'turn-continued'
                ? [{'role': 'user', 'content': records[ends[k]].note}]
                : []))))))
---
# What a turn IS, from one snapshot of its key and its `aborted_at`: `aborted` is
# a failure with ERR_INVOKE_CANCELLED that a user's abort caused — a shutdown's
# cancellation fails the same way and stays `failed`, continuable.
kind: Telo.Function
metadata:
  name: turnStatus
  description: A turn's status from its journal key's state, its recorded error and when a user aborted it.
params:
  - name: state
    schema: { type: string }
  - name: failure
    schema: { type: [object, "null"] }
  - name: abortedAt
    schema: { type: [string, "null"] }
returns:
  schema: { type: string, enum: [unknown, removed, running, finished, failed, aborted] }
body: !cel >-
  state == 'open' ? 'running'
    : state == 'finished' ? 'finished'
    : state == 'failed'
      ? (abortedAt != null && failure != null && has(failure.code) && failure.code == 'ERR_INVOKE_CANCELLED'
          ? 'aborted' : 'failed')
    : state
---
# A conversation as every route answers it. `title` is null until one is
# generated or set; `model`, `messageCount` and `totalTokens` are derived from
# its live turns at read time, never stored.
kind: Telo.JsonSchema
metadata: { name: Conversation }
schema:
  type: object
  additionalProperties: false
  required: [id, title, createdAt, updatedAt, model, messageCount, totalTokens, archived, revision]
  properties:
    id: { type: string }
    title: { type: [string, "null"] }
    createdAt: { type: string }
    updatedAt: { type: string }
    model: { type: [string, "null"] }
    messageCount: { type: integer }
    totalTokens: { type: integer }
    archived: { type: boolean }
    revision: { type: integer }
---
kind: Telo.Function
metadata:
  name: conversationOf
  description: A conversation's wire shape, from its row in `conversation_view`.
params:
  - name: row
    schema: { type: object }
returns:
  schema: !ref Conversation
body: !cel >-
  {'id': row.id, 'title': row.title, 'createdAt': row.created_at, 'updatedAt': row.updated_at,
   'model': row.model, 'messageCount': int(row.message_count), 'totalTokens': int(row.total_tokens),
   'archived': int(row.archived) != 0, 'revision': int(row.revision)}
---
# A message's text: a string as it is, content parts as their text parts joined.
kind: Telo.Function
metadata:
  name: contentText
  description: The text of a message's content, whether a string or a list of content parts.
params:
  - name: content
    schema: {}
returns:
  schema: { type: string }
body: !cel >-
  type(content) == type('') ? content
    : type(content) == type([])
      ? join(content.filter(p, type(p) == type({}) && 'type' in p && p.type == 'text').map(p, string(p.text)), '')
      : ''
---
# A generated title as the conversation carries it: the reply's first non-empty
# line, trimmed, without surrounding quotes or a trailing period, at most 80
# characters. Empty when nothing usable is left. Characters are code points:
# the strips and the cut are regexes, which match them, never `substring`,
# which counts UTF-16 units.
kind: Telo.Function
metadata:
  name: titleOf
  description: Sanitizes a model's reply into a conversation title.
params:
  - name: reply
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  cel.bind(lines, reply.split('\n').map(l, l.trim()).filter(l, l != ''),
    size(lines) == 0 ? ''
      : cel.bind(line, lines[0],
          cel.bind(unquoted, regexReplace(line, '^"(.*)"$|^\'(.*)\'$', '$1$2').trim(),
            cel.bind(bare, regexReplace(unquoted, '\\.$', '').trim(),
              size(bare) > 80 ? regexReplace(regexExtract(bare, '(?s)^.{0,80}'), '[\\s\\p{Z}]+$', '') : bare))))
---
# A branch's title, within the 200 characters PATCH accepts: `<title> (branch)`
# when that fits, else the source's first 190 characters, trailing whitespace
# trimmed, then `… (branch)`. Characters are code points, as PATCH counts them:
# `size` counts them, and the prefix is cut by a regex, which matches them.
kind: Telo.Function
metadata:
  name: branchTitle
  description: The title a branch of a conversation carries, from its source's title.
params:
  - name: title
    schema: { type: string }
returns:
  schema: { type: string }
body: !cel >-
  size(title) + size(' (branch)') <= 200 ? title + ' (branch)'
    : regexReplace(regexExtract(title, '(?s)^.{0,190}'), '[\\s\\p{Z}]+$', '') + '… (branch)'
---
# What a summary call reads: the previous summary, then the covered turns'
# projected messages as a transcript — the user's text, the assistant's text,
# each tool call with its arguments, and each tool result as the model got it.
kind: Telo.Function
metadata:
  name: transcriptOf
  description: Renders a previous summary and projected message rows as the transcript a summary call reads.
params:
  - name: previous
    schema: { type: string }
    nullable: true
  - name: rows
    schema:
      type: array
      items:
        type: object
        required: [role, content]
        properties:
          role: { type: string }
          content: { type: string }
          tool_calls: { type: [string, "null"] }
returns:
  schema: { type: string }
body: !cel >-
  (previous == null ? '' : 'EARLIER SUMMARY:\n' + previous + '\n\n')
    + join(rows.map(r,
        (r.role == 'user' ? 'USER: ' : r.role == 'assistant' ? 'ASSISTANT: ' : 'TOOL RESULT: ')
          + Self.contentText(parseJson(r.content))
          + (!has(r.tool_calls) || r.tool_calls == null ? ''
              : join(parseJson(r.tool_calls).map(c, '\nTOOL CALL ' + string(c.name) + ' ' + json(c.arguments)), ''))),
      '\n\n')
---
# The note a continued turn's model reads after everything the interrupted
# attempt recorded: what ended that attempt, and every tool call it started with
# no recorded result — named with its path, as an effect nobody observed, so the
# model checks before repeating it rather than assuming either outcome.
kind: Telo.Function
metadata:
  name: interruptionNote
  description: Tells the model how the previous attempt of a turn ended and which of its tool calls have no recorded result.
params:
  - name: records
    schema: { type: array }
  - name: failure
    schema: { type: [object, "null"] }
returns:
  schema: { type: string }
body: !cel >-
  cel.bind(leads, enumerate(records).filter(e, e.value.type in ['user-message', 'turn-continued']).map(e, e.index),
    cel.bind(attempt, size(leads) == 0 ? records : slice(records, leads[size(leads) - 1] + 1, size(records)),
      cel.bind(answered, attempt.filter(r, r.type == 'tool-result').map(r, r.toolResult.toolCallId),
        cel.bind(unresolved, attempt.filter(r, r.type == 'tool-call' && !(r.toolCall.id in answered)).map(r, r.toolCall),
          'TURN CONTINUED: the previous attempt at this turn was interrupted'
          + (failure == null ? '' : ' by ' + (has(failure.code) ? failure.code + ': ' : '') + failure.message)
          + '. Everything above it happened, and every tool result above is real. '
          + (size(unresolved) == 0 ? ''
              : 'These tool calls were started but no result was recorded, so their effect is unknown — check before repeating them: '
                + join(unresolved.map(c, c.name
                    + (type(c.arguments) == type({}) && 'path' in c.arguments ? ' ' + string(c.arguments.path) : '')), ', ')
                + '. ')
          + 'Continue the request from where it stopped; do not redo work that already has a result.'))))
---
# Project one turn: read its whole key, fold it, and replace its rows — the
# `messages` rows, its `turn_projections` row (how far it was projected, the
# last provider state it recorded and the model that produced it, and what its
# summary reports: its usage and the manifests it ran) and its `turn_changes`
# rows (its net file changes, diffed over its checkpoint) — in one transaction.
# The projection is never written by anything else, so it can be dropped and
# rebuilt from the journal and the checkpoint at any time. `ending` says the
# projection is the turn's last: its end handler passes it, since the key is
# still open while that handler runs.
kind: Run.Sequence
metadata: { name: projectTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, turnId, ending]
    properties:
      conversationId: { type: string }
      turnId: { type: string }
      ending: { type: boolean }
steps:
  - name: read
    invoke: !ref journalRead
    inputs:
      key: !cel "inputs.turnId"
  - name: records
    value: !cel "steps.read.result.entries.map(e, e.data)"
  - name: net
    invoke: !ref netChanges
    inputs:
      turnId: !cel "inputs.turnId"
  # Each changed file's last check: the last write_file, edit_file or
  # telo_check result naming it. A deleted file has none.
  - name: changes
    value: !cel >-
      cel.bind(checks, steps.records.result.filter(r, r.type == 'tool-result'
            && r.toolResult.name in ['write_file', 'edit_file', 'telo_check'] && has(r.toolResult.output)
            && type(r.toolResult.output) == type({})
            && 'path' in r.toolResult.output && 'checkExitCode' in r.toolResult.output)
          .map(r, {'path': Self.normalPath(string(r.toolResult.output.path)),
                   'code': int(r.toolResult.output.checkExitCode)}),
        steps.net.result.files.map(f, cel.bind(mine, checks.filter(c, c.path == f.change.path),
          merge(f.change, {
            'firstLine': f.firstLine,
            'checkExitCode': f.change.status == 'deleted' || size(mine) == 0 ? null : dyn(mine[size(mine) - 1].code)
          }))))
  - name: write
    invoke:
      kind: Sql.Transaction
      connection: !ref chatDb
      steps:
        kind: Run.Sequence
        inputType:
          kind: Telo.JsonSchema
          schema:
            type: object
            additionalProperties: false
            required:
              - conversationId
              - turnId
              - messages
              - throughId
              - providerState
              - providerModel
              - tokens
              - model
              - contextTokens
              - summary
              - summaryThrough
              - changes
              - promptTokens
              - completionTokens
              - runs
              - ended
            properties:
              conversationId: { type: string }
              turnId: { type: string }
              messages: { type: string }
              changes: { type: string }
              promptTokens: { type: integer }
              completionTokens: { type: integer }
              runs: { type: string }
              ended: { type: boolean }
              throughId: { type: integer }
              providerState: { type: [string, "null"] }
              providerModel: { type: [string, "null"] }
              tokens: { type: integer }
              model: { type: [string, "null"] }
              contextTokens: { type: [integer, "null"] }
              summary: { type: [string, "null"] }
              summaryThrough: { type: [string, "null"] }
        steps:
          - name: clear
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: "DELETE FROM messages WHERE turn_id = ?"
              bindings: [ !cel "inputs.turnId" ]
          # One statement for every row: the folded list crosses as one JSON
          # document and SQLite takes it apart.
          - name: insert
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: |
                INSERT INTO messages (turn_id, seq, conversation_id, role, content, tool_calls, tool_call_id)
                SELECT ?, CAST(m.key AS INTEGER), ?, m.value ->> '$.role', m.value -> '$.content',
                       m.value -> '$.toolCalls', m.value ->> '$.toolCallId'
                FROM json_each(?) AS m
              bindings:
                - !cel "inputs.turnId"
                - !cel "inputs.conversationId"
                - !cel "inputs.messages"
          - name: clearChanges
            invoke: !ref checkpointCommand
            inputs:
              sql: "DELETE FROM turn_changes WHERE turn_id = ?"
              bindings: [ !cel "inputs.turnId" ]
          - name: insertChanges
            invoke: !ref checkpointCommand
            inputs:
              sql: |
                INSERT INTO turn_changes (turn_id, path, status, before_hash, after_hash, added, removed,
                                          first_line, check_exit_code)
                SELECT ?, c.value ->> '$.path', c.value ->> '$.status', c.value ->> '$.before', c.value ->> '$.after',
                       c.value ->> '$.added', c.value ->> '$.removed', c.value ->> '$.firstLine',
                       c.value ->> '$.checkExitCode'
                FROM json_each(?) AS c
              bindings:
                - !cel "inputs.turnId"
                - !cel "inputs.changes"
          - name: projection
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: |
                INSERT INTO turn_projections (turn_id, conversation_id, through_id, provider_state, provider_model,
                                              tokens, model, context_tokens, summary, summary_through,
                                              prompt_tokens, completion_tokens, runs, ended)
                VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                ON CONFLICT (turn_id) DO UPDATE SET
                  through_id = excluded.through_id,
                  provider_state = excluded.provider_state,
                  provider_model = excluded.provider_model,
                  tokens = excluded.tokens,
                  model = excluded.model,
                  context_tokens = excluded.context_tokens,
                  summary = excluded.summary,
                  summary_through = excluded.summary_through,
                  prompt_tokens = excluded.prompt_tokens,
                  completion_tokens = excluded.completion_tokens,
                  runs = excluded.runs,
                  ended = excluded.ended
              bindings:
                - !cel "inputs.turnId"
                - !cel "inputs.conversationId"
                - !cel "inputs.throughId"
                - !cel "inputs.providerState"
                - !cel "inputs.providerModel"
                - !cel "inputs.tokens"
                - !cel "inputs.model"
                - !cel "inputs.contextTokens"
                - !cel "inputs.summary"
                - !cel "inputs.summaryThrough"
                - !cel "inputs.promptTokens"
                - !cel "inputs.completionTokens"
                - !cel "inputs.runs"
                - !cel "inputs.ended ? 1 : 0"
      inputs:
        conversationId: !cel "inputs.conversationId"
        turnId: !cel "inputs.turnId"
        messages: !cel "inputs.messages"
        changes: !cel "inputs.changes"
        promptTokens: !cel "inputs.promptTokens"
        completionTokens: !cel "inputs.completionTokens"
        runs: !cel "inputs.runs"
        ended: !cel "inputs.ended"
        throughId: !cel "inputs.throughId"
        providerState: !cel "inputs.providerState"
        providerModel: !cel "inputs.providerModel"
        tokens: !cel "inputs.tokens"
        model: !cel "inputs.model"
        contextTokens: !cel "inputs.contextTokens"
        summary: !cel "inputs.summary"
        summaryThrough: !cel "inputs.summaryThrough"
    inputs:
      conversationId: !cel "inputs.conversationId"
      turnId: !cel "inputs.turnId"
      messages: !cel "json(Self.turnMessages(steps.records.result))"
      throughId: !cel "steps.read.result.lastId"
      # None when a summary follows the last recorded state: that state
      # continues a history the summary has replaced. A `context-summary`
      # carrying only an error is no summary.
      providerState: !cel >-
        cel.bind(records, steps.records.result,
          cel.bind(states, enumerate(records).filter(e, e.value.type == 'provider-state').map(e, e.index),
            cel.bind(summaries, enumerate(records).filter(e, e.value.type == 'context-summary' && has(e.value.summary)).map(e, e.index),
              size(states) == 0
                || (size(summaries) > 0 && summaries[size(summaries) - 1] > states[size(states) - 1])
                ? null : dyn(json(records[states[size(states) - 1]].providerState)))))
      # The model of the attempt that recorded that state: the last lead record
      # (`user-message` or `turn-continued`) before it.
      providerModel: !cel >-
        cel.bind(states, enumerate(steps.records.result).filter(e, e.value.type == 'provider-state').map(e, e.index),
          size(states) == 0 ? null
            : cel.bind(leads, enumerate(steps.records.result).filter(e,
                  e.index < states[size(states) - 1] && e.value.type in ['user-message', 'turn-continued']),
                size(leads) > 0 ? dyn(leads[size(leads) - 1].value.model) : null))
      # Every model call the turn made, across its attempts: each call's
      # `step-finish`, plus the title and summary calls.
      tokens: !cel >-
        cel.bind(spent, steps.records.result.filter(r, r.type == 'step-finish'
            || (r.type in ['conversation-title', 'context-summary'] && has(r.usage))).map(r, int(r.usage.totalTokens)),
          size(spent) == 0 ? 0 : int(sum(spent)))
      # The model the latest attempt ran on.
      model: !cel >-
        cel.bind(leads, steps.records.result.filter(r, r.type in ['user-message', 'turn-continued']),
          size(leads) > 0 ? dyn(leads[size(leads) - 1].model) : null)
      # The context the turn's last model call reported.
      contextTokens: !cel >-
        cel.bind(calls, steps.records.result.filter(r, r.type == 'step-finish'),
          size(calls) > 0
            ? dyn(int(calls[size(calls) - 1].usage.promptTokens) + int(calls[size(calls) - 1].usage.completionTokens))
            : null)
      summary: !cel >-
        cel.bind(summaries, steps.records.result.filter(r, r.type == 'context-summary' && has(r.summary)),
          size(summaries) > 0 ? dyn(summaries[size(summaries) - 1].summary) : null)
      summaryThrough: !cel >-
        cel.bind(summaries, steps.records.result.filter(r, r.type == 'context-summary' && has(r.summary)),
          size(summaries) > 0 ? dyn(summaries[size(summaries) - 1].throughTurnId) : null)
      changes: !cel "json(steps.changes.result)"
      # The same calls `tokens` sums, by direction.
      promptTokens: !cel >-
        cel.bind(spent, steps.records.result.filter(r, r.type == 'step-finish'
            || (r.type in ['conversation-title', 'context-summary'] && has(r.usage))).map(r, int(r.usage.promptTokens)),
          size(spent) == 0 ? 0 : int(sum(spent)))
      completionTokens: !cel >-
        cel.bind(spent, steps.records.result.filter(r, r.type == 'step-finish'
            || (r.type in ['conversation-title', 'context-summary'] && has(r.usage))).map(r, int(r.usage.completionTokens)),
          size(spent) == 0 ? 0 : int(sum(spent)))
      # Every `run_manifest` call that returned a result, in order, with the
      # path its call named. A call refused as a tool error ran nothing.
      runs: !cel >-
        cel.bind(calls, steps.records.result.filter(r, r.type == 'tool-call' && r.toolCall.name == 'run_manifest'),
          json(steps.records.result.filter(r, r.type == 'tool-result' && r.toolResult.name == 'run_manifest'
                && has(r.toolResult.output) && type(r.toolResult.output) == type({})
                && 'exitCode' in r.toolResult.output)
            .map(r, cel.bind(call, calls.filter(c, c.toolCall.id == r.toolResult.toolCallId),
              {'path': size(call) > 0 && type(call[0].toolCall.arguments) == type({}) && 'path' in call[0].toolCall.arguments
                  ? string(call[0].toolCall.arguments.path) : '',
               'exitCode': int(r.toolResult.output.exitCode)}))))
      ended: !cel "inputs.ending || steps.read.result.state != 'open'"
---
# Bring the projection up to date for every turn of a conversation whose journal
# holds records the projection has not seen — the step every history read goes
# through first, so a turn that ended without its own projection (a process that
# died mid-turn) is caught up before the model sees its history.
kind: Run.Sequence
metadata: { name: catchUpProjection }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: turns
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT t.turn_id, COALESCE(p.through_id, -1) AS through_id, COALESCE(p.ended, 0) AS ended
        FROM turns t LEFT JOIN turn_projections p ON p.turn_id = t.turn_id
        WHERE t.conversation_id = ? AND t.removed_at IS NULL
        ORDER BY t.turn_id
      bindings: [ !cel "inputs.conversationId" ]
  - name: each
    invoke:
      kind: Run.Iteration
      collection: !cel "inputs.turns"
      steps:
        - name: header
          invoke: !ref journalRead
          inputs:
            key: !cel "item.turn_id"
            limit: 0
        # Behind the journal, or projected while it ran and ended since.
        - name: behind
          if: !cel >-
            steps.header.result.lastId > int(item.through_id)
              || (int(item.ended) == 0 && steps.header.result.state != 'open')
          then:
            - name: project
              invoke: !ref projectTurn
              inputs:
                conversationId: !cel "inputs.conversationId"
                turnId: !cel "item.turn_id"
                ending: false
    inputs:
      turns: !cel "steps.turns.result.rows"
      conversationId: !cel "inputs.conversationId"
---
# Rebuild a conversation's whole projection from the journal: every turn is
# projected again, whatever its rows say. What an operation that changes
# history runs afterwards, and what proves the projection is disposable.
kind: Run.Sequence
metadata: { name: rebuildProjection }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: turns
    invoke: !ref historyRows
    inputs:
      sql: "SELECT turn_id FROM turns WHERE conversation_id = ? AND removed_at IS NULL ORDER BY turn_id"
      bindings: [ !cel "inputs.conversationId" ]
  - name: each
    invoke:
      kind: Run.Iteration
      collection: !cel "inputs.turns"
      steps:
        - name: project
          invoke: !ref projectTurn
          inputs:
            conversationId: !cel "inputs.conversationId"
            turnId: !cel "item.turn_id"
            ending: false
    inputs:
      turns: !cel "steps.turns.result.rows"
      conversationId: !cel "inputs.conversationId"
---
# Boot, before any route is served. First every entry a crash left unconfirmed
# is settled from the file it names. Then every conversation holding a live
# turn with no projection row — after a migration that clears
# `turn_projections`, every conversation — or one whose projection was not
# taken at its ending is caught up: a turn a crash cut off, whose summary is
# projected here.
kind: Run.Sequence
metadata: { name: catchUpProjections }
steps:
  - name: settle
    invoke: !ref settleEntries
    inputs:
      callId: null
      turnId: null
  - name: behind
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT DISTINCT t.conversation_id FROM turns t
        WHERE t.removed_at IS NULL
          AND NOT EXISTS (SELECT 1 FROM turn_projections p WHERE p.turn_id = t.turn_id AND p.ended = 1)
        ORDER BY t.conversation_id
      bindings: []
  - name: each
    invoke:
      kind: Run.Iteration
      collection: !cel "inputs.conversations"
      steps:
        - name: catchUp
          invoke: !ref catchUpProjection
          inputs:
            conversationId: !cel "item.conversation_id"
    inputs:
      conversations: !cel "steps.behind.result.rows"
outputs:
  conversations: !cel "size(steps.behind.result.rows)"
---
# A conversation that exists and is not deleted, as its `conversation_view`
# row: 404 ERR_CONVERSATION_NOT_FOUND for an id this agent never minted (or
# whose tombstone outlived the retention window), 410 ERR_CONVERSATION_REMOVED
# for a deleted one.
kind: Run.Sequence
metadata: { name: requireConversation }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: found
    invoke: !ref historyRows
    inputs:
      sql: "SELECT * FROM conversation_view WHERE id = ?"
      bindings: [ !cel "inputs.conversationId" ]
  - name: unknown
    if: !cel "size(steps.found.result.rows) == 0"
    then:
      - name: refuseUnknown
        throw:
          code: ERR_CONVERSATION_NOT_FOUND
          message: !cel "'No conversation ' + inputs.conversationId + ' exists on this agent.'"
  - name: removed
    if: !cel "steps.found.result.rows[0].removed_at != null"
    then:
      - name: refuseRemoved
        throw:
          code: ERR_CONVERSATION_REMOVED
          message: !cel "'Conversation ' + inputs.conversationId + ' was deleted.'"
outputs:
  row: !cel "steps.found.result.rows[0]"
  conversation: !cel "Self.conversationOf(steps.found.result.rows[0])"
  archived: !cel "int(steps.found.result.rows[0].archived) != 0"
---
# The refusal for a turn-starting request on an archived conversation.
kind: Run.Sequence
metadata: { name: requireWritableConversation }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: conversation
    invoke: !ref requireConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
  - name: archived
    if: !cel "steps.conversation.result.archived"
    then:
      - name: refuseArchived
        throw:
          code: ERR_CONVERSATION_ARCHIVED
          message: !cel "'Conversation ' + inputs.conversationId + ' is archived; unarchive it to continue it.'"
outputs:
  conversation: !cel "steps.conversation.result.conversation"
---
# Why a conditional write on a conversation changed nothing — the same codes
# `requireWritableConversation` answers, decided from the row as it is now.
# Run inside the transaction whose write missed, so it reads that snapshot.
kind: Run.Sequence
metadata: { name: refuseConversationWrite }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: current
    invoke: { kind: Sql.Query, connection: !ref chatDb }
    inputs:
      sql: "SELECT removed_at, archived FROM conversations WHERE id = ? AND assembling = 0"
      bindings: [ !cel "inputs.conversationId" ]
  - name: unknown
    if: !cel "size(steps.current.result.rows) == 0"
    then:
      - name: refuseUnknown
        throw:
          code: ERR_CONVERSATION_NOT_FOUND
          message: !cel "'No conversation ' + inputs.conversationId + ' exists on this agent.'"
  - name: removed
    if: !cel "steps.current.result.rows[0].removed_at != null"
    then:
      - name: refuseRemoved
        throw:
          code: ERR_CONVERSATION_REMOVED
          message: !cel "'Conversation ' + inputs.conversationId + ' was deleted.'"
  - name: refuseArchived
    throw:
      code: ERR_CONVERSATION_ARCHIVED
      message: !cel "'Conversation ' + inputs.conversationId + ' is archived; unarchive it to continue it.'"
---
# POST /conversations. The agent mints every conversation id.
kind: Run.Sequence
metadata: { name: createConversation }
steps:
  - name: id
    value: !cel "uuidv7()"
  - name: insert
    invoke: { kind: Sql.Command, connection: !ref chatDb }
    inputs:
      sql: "INSERT INTO conversations (id) VALUES (?)"
      bindings: [ !cel "steps.id.result" ]
  - name: read
    invoke: !ref requireConversation
    inputs:
      conversationId: !cel "steps.id.result"
outputs:
  conversation: !cel "steps.read.result.conversation"
---
# GET /conversations/{id}.
kind: Run.Sequence
metadata: { name: getConversation }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: read
    invoke: !ref requireConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
outputs:
  conversation: !cel "steps.read.result.conversation"
---
# GET /conversations — newest activity first (`updated_at`, then `id`, both
# descending), archived or not, optionally filtered by `q`: a case-insensitive
# substring of the title or of the TEXT of a user or assistant message (never
# a tool call or result, reasoning or a summary). A page is cut at `limit`;
# `next` is the cursor of the following one.
kind: Run.Sequence
metadata: { name: listConversations }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [limit, archived, q, before, beforeId]
    properties:
      limit: { type: integer, minimum: 1, maximum: 200 }
      archived: { type: boolean }
      # Empty for no filter.
      q: { type: string }
      # Empty for the first page.
      before: { type: string }
      beforeId: { type: string }
steps:
  # LIKE's wildcards and its escape character are matched literally.
  - name: pattern
    value: !cel >-
      '%' + replace(replace(replace(inputs.q.trim().lowerAscii(), '\\', '\\\\'), '%', '\\%'), '_', '\\_') + '%'
  - name: page
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT * FROM conversation_view v
        WHERE v.removed_at IS NULL AND v.archived = ?
          AND (? = '' OR v.updated_at < ? OR (v.updated_at = ? AND v.id < ?))
          AND (? = ''
               OR lower(COALESCE(v.title, '')) LIKE ? ESCAPE '\'
               OR EXISTS (
                 SELECT 1 FROM messages m
                 WHERE m.conversation_id = v.id AND m.role IN ('user', 'assistant')
                   AND lower(CASE json_type(m.content)
                               WHEN 'text' THEN m.content ->> '$'
                               ELSE (SELECT group_concat(j.value ->> '$.text', '') FROM json_each(m.content) AS j
                                     WHERE j.value ->> '$.type' = 'text')
                             END) LIKE ? ESCAPE '\'))
        ORDER BY v.updated_at DESC, v.id DESC
        LIMIT ?
      bindings:
        - !cel "inputs.archived ? 1 : 0"
        - !cel "inputs.before"
        - !cel "inputs.before"
        - !cel "inputs.before"
        - !cel "inputs.beforeId"
        - !cel "inputs.q.trim()"
        - !cel "steps.pattern.result"
        - !cel "steps.pattern.result"
        - !cel "inputs.limit + 1"
outputs:
  conversations: !cel >-
    slice(steps.page.result.rows, 0, size(steps.page.result.rows) > inputs.limit ? inputs.limit : size(steps.page.result.rows))
      .map(r, Self.conversationOf(r))
  next: !cel >-
    size(steps.page.result.rows) > inputs.limit
      ? dyn({'before': steps.page.result.rows[inputs.limit - 1].updated_at,
             'beforeId': steps.page.result.rows[inputs.limit - 1].id})
      : null
---
# PATCH /conversations/{id}: rename and/or (un)archive. A title is stored
# trimmed and never reset to null.
kind: Run.Sequence
metadata: { name: updateConversation }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, title, archived]
    properties:
      conversationId: { type: string }
      # Null when the request left it unchanged.
      title: { type: [string, "null"] }
      archived: { type: [boolean, "null"] }
steps:
  - name: exists
    invoke: !ref requireConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
  - name: write
    invoke: { kind: Sql.Command, connection: !ref chatDb }
    inputs:
      sql: |
        UPDATE conversations
        SET title = COALESCE(?, title), archived = COALESCE(?, archived),
            revision = revision + 1, updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
        WHERE id = ? AND removed_at IS NULL AND assembling = 0
      bindings:
        - !cel "inputs.title == null ? null : dyn(inputs.title.trim())"
        - !cel "inputs.archived == null ? null : dyn(inputs.archived ? 1 : 0)"
        - !cel "inputs.conversationId"
  - name: read
    invoke: !ref requireConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
outputs:
  conversation: !cel "steps.read.result.conversation"
---
# Remove every marked turn of a set: its journal key first (a removed turn keeps
# answering 410 for the journal's marker retention), then its checkpoint
# directory (one that is not there is not an error), then its rows. Each step
# is safe to repeat, so a cascade a crash cut short is finished by the next one.
kind: Run.Sequence
metadata: { name: cascadeTurns }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnIds]
    properties:
      turnIds:
        type: array
        items: { type: string }
steps:
  - name: each
    invoke:
      kind: Run.Iteration
      collection: !cel "inputs.turnIds"
      steps:
        - name: removeKey
          invoke:
            kind: RecordStream.JournalRemoval
            journal: !ref turnJournal
          inputs:
            key: !cel "item"
        - name: removeBlobs
          invoke: !ref blobSync
          inputs:
            delete: !cel "[item]"
        - name: removeRows
          invoke:
            kind: Sql.Transaction
            connection: !ref chatDb
            steps:
              kind: Run.Sequence
              inputType:
                kind: Telo.JsonSchema
                schema:
                  type: object
                  additionalProperties: false
                  required: [turnId]
                  properties:
                    turnId: { type: string }
              steps:
                - name: messages
                  invoke: { kind: Sql.Command, connection: !ref chatDb }
                  inputs:
                    sql: "DELETE FROM messages WHERE turn_id = ?"
                    bindings: [ !cel "inputs.turnId" ]
                - name: projection
                  invoke: { kind: Sql.Command, connection: !ref chatDb }
                  inputs:
                    sql: "DELETE FROM turn_projections WHERE turn_id = ?"
                    bindings: [ !cel "inputs.turnId" ]
                - name: changes
                  invoke: { kind: Sql.Command, connection: !ref chatDb }
                  inputs:
                    sql: "DELETE FROM turn_changes WHERE turn_id = ?"
                    bindings: [ !cel "inputs.turnId" ]
                - name: entries
                  invoke: { kind: Sql.Command, connection: !ref chatDb }
                  inputs:
                    sql: "DELETE FROM checkpoint_entries WHERE turn_id = ?"
                    bindings: [ !cel "inputs.turnId" ]
                - name: reverts
                  invoke: { kind: Sql.Command, connection: !ref chatDb }
                  inputs:
                    sql: "DELETE FROM turn_reverts WHERE turn_id = ?"
                    bindings: [ !cel "inputs.turnId" ]
                - name: turn
                  invoke: { kind: Sql.Command, connection: !ref chatDb }
                  inputs:
                    sql: "DELETE FROM turns WHERE turn_id = ?"
                    bindings: [ !cel "inputs.turnId" ]
            inputs:
              turnId: !cel "inputs.turnId"
          inputs:
            turnId: !cel "item"
    inputs:
      turnIds: !cel "inputs.turnIds"
---
kind: Run.Sequence
metadata: { name: cascadeConversation }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: marked
    invoke: !ref historyRows
    inputs:
      sql: "SELECT turn_id FROM turns WHERE conversation_id = ? AND removed_at IS NOT NULL ORDER BY turn_id"
      bindings: [ !cel "inputs.conversationId" ]
  - name: cascade
    invoke: !ref cascadeTurns
    inputs:
      turnIds: !cel "steps.marked.result.rows.map(r, r.turn_id)"
---
# One attempt at tombstoning a conversation, and the answer as data:
# `missing`, `removed` (already tombstoned), `busy` (its latest live turn's key
# is open), `tombstoned`, or `changed` — the revision read beside the running
# check moved before the tombstone was written, so the check no longer holds.
# The tombstone is a compare-and-set on that revision, in one transaction with
# marking every live turn removed and dropping their projection rows; a turn
# admitted since is caught by the revision its admission bumped. A hidden
# (`assembling`) conversation is `missing` to a client and a conversation like
# any other to the sweep (`includeHidden`).
kind: Run.Sequence
metadata: { name: tombstoneConversation }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, includeHidden]
    properties:
      conversationId: { type: string }
      includeHidden: { type: boolean }
steps:
  - name: row
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT c.revision, c.removed_at, c.assembling,
               (SELECT MAX(t.turn_id) FROM turns t
                 WHERE t.conversation_id = c.id AND t.removed_at IS NULL) AS latest
        FROM conversations c WHERE c.id = ?
      bindings: [ !cel "inputs.conversationId" ]
  - name: visible
    value: !cel >-
      size(steps.row.result.rows) > 0
        && (inputs.includeHidden || int(steps.row.result.rows[0].assembling) == 0)
  - name: live
    value: !cel "steps.visible.result && steps.row.result.rows[0].removed_at == null"
  - name: latest
    if: !cel "steps.live.result && steps.row.result.rows[0].latest != null"
    then:
      - name: header
        invoke: !ref journalRead
        inputs:
          key: !cel "string(steps.row.result.rows[0].latest)"
          limit: 0
  - name: running
    value: !cel "has(steps.header) && steps.header.result.state == 'open'"
  - name: mark
    if: !cel "steps.live.result && !steps.running.result"
    then:
      - name: tombstone
        invoke:
          kind: Sql.Transaction
          connection: !ref chatDb
          steps:
            kind: Run.Sequence
            inputType:
              kind: Telo.JsonSchema
              schema:
                type: object
                additionalProperties: false
                required: [conversationId, revision]
                properties:
                  conversationId: { type: string }
                  revision: { type: integer }
            outputType:
              kind: Telo.JsonSchema
              schema:
                type: object
                additionalProperties: false
                required: [tombstoned]
                properties:
                  tombstoned: { type: boolean }
            steps:
              - name: stamp
                invoke: { kind: Sql.Command, connection: !ref chatDb }
                inputs:
                  sql: |
                    UPDATE conversations
                    SET removed_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), revision = revision + 1,
                        updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                    WHERE id = ? AND revision = ? AND removed_at IS NULL
                  bindings:
                    - !cel "inputs.conversationId"
                    - !cel "inputs.revision"
              - name: stamped
                if: !cel "steps.stamp.result.rowCount > 0"
                then:
                  - name: markTurns
                    invoke: { kind: Sql.Command, connection: !ref chatDb }
                    inputs:
                      sql: |
                        UPDATE turns SET removed_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                        WHERE conversation_id = ? AND removed_at IS NULL
                      bindings: [ !cel "inputs.conversationId" ]
                  - name: dropMessages
                    invoke: { kind: Sql.Command, connection: !ref chatDb }
                    inputs:
                      sql: "DELETE FROM messages WHERE conversation_id = ?"
                      bindings: [ !cel "inputs.conversationId" ]
                  - name: dropProjections
                    invoke: { kind: Sql.Command, connection: !ref chatDb }
                    inputs:
                      sql: "DELETE FROM turn_projections WHERE conversation_id = ?"
                      bindings: [ !cel "inputs.conversationId" ]
            outputs:
              tombstoned: !cel "steps.stamp.result.rowCount > 0"
          inputs:
            conversationId: !cel "inputs.conversationId"
            revision: !cel "inputs.revision"
        inputs:
          conversationId: !cel "inputs.conversationId"
          revision: !cel "int(steps.row.result.rows[0].revision)"
outputs:
  outcome: !cel >-
    !steps.visible.result ? 'missing'
      : !steps.live.result ? 'removed'
      : steps.running.result ? 'busy'
      : steps.tombstone.result.tombstoned ? 'tombstoned'
      : 'changed'
  activeTurnId: !cel "steps.running.result ? dyn(string(steps.row.result.rows[0].latest)) : null"
---
# DELETE /conversations/{id}. Tombstoned by compare-and-set, retried against the
# new revision for as long as the conversation changes under it; refused while
# its latest turn runs; then every marked turn's key and rows are removed.
# Repeating it on a tombstone finishes the removal and answers 204 again.
kind: Run.Sequence
metadata: { name: deleteConversation }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: attempt
    invoke: !ref tombstoneConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
      includeHidden: false
  - name: untilSettled
    while: !cel "steps.attempt.result.outcome == 'changed'"
    do:
      - name: attempt
        invoke: !ref tombstoneConversation
        inputs:
          conversationId: !cel "inputs.conversationId"
          includeHidden: false
  - name: missing
    if: !cel "steps.attempt.result.outcome == 'missing'"
    then:
      - name: refuseMissing
        throw:
          code: ERR_CONVERSATION_NOT_FOUND
          message: !cel "'No conversation ' + inputs.conversationId + ' exists on this agent.'"
  - name: busy
    if: !cel "steps.attempt.result.outcome == 'busy'"
    then:
      - name: refuseBusy
        throw:
          code: ERR_TURN_IN_PROGRESS
          message: A turn is running in this conversation; abort it before deleting the conversation.
          data:
            activeTurnId: !cel "steps.attempt.result.activeTurnId"
  - name: cascade
    invoke: !ref cascadeConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
---
# DELETE /conversations/{id}/turns?from=…&revision=…: removes turn `from` and
# every later one — what Retry, Edit & resend and Delete from here compose.
# Refused, in order: the conversation unknown (404) or deleted (410), archived
# (409), `from` not a live turn of it (404 ERR_TURN_NOT_FOUND), its latest turn
# running (409 ERR_TURN_IN_PROGRESS), `revision` not the current one (409
# ERR_CONVERSATION_CHANGED, compared inside the marking transaction).
kind: Run.Sequence
metadata: { name: truncateConversation }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, fromTurnId, revision]
    properties:
      conversationId: { type: string }
      fromTurnId: { type: string }
      revision: { type: integer }
steps:
  - name: conversation
    invoke: !ref requireWritableConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
  - name: turns
    invoke: !ref historyRows
    inputs:
      sql: "SELECT turn_id FROM turns WHERE conversation_id = ? AND removed_at IS NULL ORDER BY turn_id"
      bindings: [ !cel "inputs.conversationId" ]
  - name: unknownTurn
    if: !cel "!steps.turns.result.rows.exists(r, r.turn_id == inputs.fromTurnId)"
    then:
      - name: refuseUnknownTurn
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'Turn ' + inputs.fromTurnId + ' is not a turn of this conversation.'"
  - name: latest
    invoke: !ref journalRead
    inputs:
      key: !cel "string(steps.turns.result.rows[size(steps.turns.result.rows) - 1].turn_id)"
      limit: 0
  - name: running
    if: !cel "steps.latest.result.state == 'open'"
    then:
      - name: refuseRunning
        throw:
          code: ERR_TURN_IN_PROGRESS
          message: A turn is running in this conversation; abort it before removing turns.
          data:
            activeTurnId: !cel "string(steps.turns.result.rows[size(steps.turns.result.rows) - 1].turn_id)"
  - name: mark
    invoke:
      kind: Sql.Transaction
      connection: !ref chatDb
      steps:
        kind: Run.Sequence
        inputType:
          kind: Telo.JsonSchema
          schema:
            type: object
            additionalProperties: false
            required: [conversationId, fromTurnId, revision]
            properties:
              conversationId: { type: string }
              fromTurnId: { type: string }
              revision: { type: integer }
        outputType:
          kind: Telo.JsonSchema
          schema:
            type: object
            additionalProperties: false
            required: [marked, removedTurns, revision]
            properties:
              marked: { type: boolean }
              removedTurns: { type: integer }
              # The current revision when it was not the one sent.
              revision: { type: [integer, "null"] }
        steps:
          - name: stamp
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: |
                UPDATE conversations
                SET revision = revision + 1, updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                WHERE id = ? AND revision = ? AND removed_at IS NULL AND archived = 0 AND assembling = 0
              bindings:
                - !cel "inputs.conversationId"
                - !cel "inputs.revision"
          - name: outcome
            if: !cel "steps.stamp.result.rowCount == 0"
            then:
              - name: current
                invoke: { kind: Sql.Query, connection: !ref chatDb }
                inputs:
                  sql: "SELECT revision FROM conversations WHERE id = ?"
                  bindings: [ !cel "inputs.conversationId" ]
            else:
              - name: markTurns
                invoke: { kind: Sql.Query, connection: !ref chatDb }
                inputs:
                  sql: |
                    UPDATE turns SET removed_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                    WHERE conversation_id = ? AND turn_id >= ? AND removed_at IS NULL
                    RETURNING turn_id
                  bindings:
                    - !cel "inputs.conversationId"
                    - !cel "inputs.fromTurnId"
              - name: dropMessages
                invoke: { kind: Sql.Command, connection: !ref chatDb }
                inputs:
                  sql: "DELETE FROM messages WHERE conversation_id = ? AND turn_id >= ?"
                  bindings:
                    - !cel "inputs.conversationId"
                    - !cel "inputs.fromTurnId"
              - name: dropProjections
                invoke: { kind: Sql.Command, connection: !ref chatDb }
                inputs:
                  sql: "DELETE FROM turn_projections WHERE conversation_id = ? AND turn_id >= ?"
                  bindings:
                    - !cel "inputs.conversationId"
                    - !cel "inputs.fromTurnId"
        outputs:
          marked: !cel "steps.stamp.result.rowCount > 0"
          removedTurns: !cel "has(steps.markTurns) ? size(steps.markTurns.result.rows) : 0"
          revision: !cel >-
            has(steps.current) && size(steps.current.result.rows) > 0
              ? dyn(int(steps.current.result.rows[0].revision)) : null
      inputs:
        conversationId: !cel "inputs.conversationId"
        fromTurnId: !cel "inputs.fromTurnId"
        revision: !cel "inputs.revision"
    inputs:
      conversationId: !cel "inputs.conversationId"
      fromTurnId: !cel "inputs.fromTurnId"
      revision: !cel "inputs.revision"
  - name: changed
    if: !cel "!steps.mark.result.marked"
    then:
      - name: refuseChanged
        throw:
          code: ERR_CONVERSATION_CHANGED
          message: The conversation changed since it was read; reload it and try again.
          data:
            revision: !cel "steps.mark.result.revision"
  - name: cascade
    invoke: !ref cascadeConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
  - name: read
    invoke: !ref requireConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
outputs:
  removedTurns: !cel "steps.mark.result.removedTurns"
  conversation: !cel "steps.read.result.conversation"
---
# Raises a recorded error as it was — what re-fails a copied turn's key.
kind: Run.Sequence
metadata: { name: raiseRecorded }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [code, message, data]
    properties:
      code: { type: string }
      message: { type: string }
      data: {}
steps:
  - name: recorded
    value: !cel "inputs.data == null"
  # An error recorded without data is raised without it.
  - name: raise
    if: !cel "steps.recorded.result"
    then:
      - name: bare
        throw:
          code: !cel "inputs.code"
          message: !cel "inputs.message"
    else:
      - name: withData
        throw:
          code: !cel "inputs.code"
          message: !cel "inputs.message"
          data: !cel "inputs.data"
---
# One turn of a branch: the source key read ONCE — its state and every record —
# then the copy's `turns` row, then its key claimed and written record for
# record. A finished source finishes the copy; a failed one re-raises its
# recorded error into the copy, which fails it with that error. A summary's
# `throughTurnId` is remapped onto the copies. Refused while the source runs
# (409 ERR_TURN_IN_PROGRESS) or once it is removed (409 ERR_CONVERSATION_CHANGED).
kind: Run.Sequence
metadata: { name: copyTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, sourceTurnId, turnId, startedAt, abortedAt, sourceIds, copyIds]
    properties:
      conversationId: { type: string }
      sourceTurnId: { type: string }
      turnId: { type: string }
      startedAt: { type: string }
      abortedAt: { type: [string, "null"] }
      sourceIds:
        type: array
        items: { type: string }
      copyIds:
        type: array
        items: { type: string }
steps:
  - name: source
    invoke: !ref journalRead
    inputs:
      key: !cel "inputs.sourceTurnId"
  - name: running
    if: !cel "steps.source.result.state == 'open'"
    then:
      - name: refuseRunning
        throw:
          code: ERR_TURN_IN_PROGRESS
          message: A turn of the source conversation is running; branch once it has ended.
          data:
            activeTurnId: !cel "inputs.sourceTurnId"
  - name: gone
    if: !cel "!(steps.source.result.state in ['finished', 'failed'])"
    then:
      - name: refuseGone
        throw:
          code: ERR_CONVERSATION_CHANGED
          message: !cel "'Turn ' + inputs.sourceTurnId + ' was removed while the branch was copied.'"
  - name: records
    value: !cel >-
      steps.source.result.entries.map(e, e.data).map(r,
        r.type == 'context-summary' && inputs.sourceIds.exists(s, s == r.throughTurnId)
          ? cel.bind(through, inputs.copyIds[range(size(inputs.sourceIds)).filter(i, inputs.sourceIds[i] == r.throughTurnId)[0]],
              has(r.summary)
                ? dyn({'type': r.type, 'throughTurnId': through, 'summary': r.summary, 'model': r.model, 'usage': r.usage})
                : dyn({'type': r.type, 'throughTurnId': through, 'error': r.error, 'model': r.model, 'usage': r.usage}))
          : r)
  - name: writer
    value: !cel "uuidv4()"
  # Only under the branch's own conversation, while it is still being assembled
  # and not removed: a branch the sweep or a deletion took copies nothing more.
  - name: row
    invoke: { kind: Sql.Command, connection: !ref chatDb }
    inputs:
      sql: |
        INSERT INTO turns (turn_id, conversation_id, started_at, aborted_at, checkpointed, reverted_at)
        SELECT ?, c.id, ?, ?, COALESCE(s.checkpointed, 0), s.reverted_at
        FROM conversations c LEFT JOIN turns s ON s.turn_id = ?
        WHERE c.id = ? AND c.removed_at IS NULL AND c.assembling = 1
      bindings:
        - !cel "inputs.turnId"
        - !cel "inputs.startedAt"
        - !cel "inputs.abortedAt"
        - !cel "inputs.sourceTurnId"
        - !cel "inputs.conversationId"
  - name: branchGone
    if: !cel "steps.row.result.rowCount == 0"
    then:
      - name: refuseBranchGone
        throw:
          code: ERR_CONVERSATION_CHANGED
          message: The branch was removed while it was copied.
  - name: claim
    invoke:
      kind: RecordStream.JournalClaim
      journal: !ref turnJournal
    inputs:
      key: !cel "inputs.turnId"
      writer: !cel "steps.writer.result"
  - name: finished
    if: !cel "steps.source.result.state == 'finished'"
    then:
      - name: finishedRecords
        invoke: { kind: Stream.Of }
        inputs:
          items: !cel "steps.records.result"
      - name: writeFinished
        invoke:
          kind: RecordStream.JournalSink
          journal: !ref turnJournal
        inputs:
          key: !cel "inputs.turnId"
          writer: !cel "steps.writer.result"
          input: !cel "steps.finishedRecords.result.output"
    else:
      - name: failedRecords
        invoke:
          kind: Stream.Concat
          sources:
            - invoke: { kind: Stream.Of }
              inputs:
                items: !cel "context.records"
            - invoke: !ref raiseRecorded
              inputs:
                code: !cel "context.error.code"
                message: !cel "context.error.message"
                data: !cel "'data' in context.error ? context.error.data : null"
        inputs:
          context:
            records: !cel "steps.records.result"
            error: !cel "steps.source.result.error"
      # The sink fails the copy's key with the recorded error, then raises it
      # here: expected, and anything else is not.
      - name: writeFailed
        try:
          - name: drainFailed
            invoke:
              kind: RecordStream.JournalSink
              journal: !ref turnJournal
            inputs:
              key: !cel "inputs.turnId"
              writer: !cel "steps.writer.result"
              input: !cel "steps.failedRecords.result.output"
        catch:
          - name: unexpected
            if: !cel "steps.source.result.error == null || error.code != steps.source.result.error.code"
            then:
              - name: reraise
                throw:
                  code: !cel "error.code"
                  message: !cel "error.message"
                  data: !cel "has(error.data) ? error.data : null"
  # The copy's checkpoint: the source's entries and revert outcomes under the
  # copy's id, and its blobs as files of the copy's own directory.
  - name: entries
    invoke: !ref checkpointCommand
    inputs:
      sql: |
        INSERT INTO checkpoint_entries (turn_id, call_id, path, before_hash, after_hash, confirmed)
        SELECT ?, call_id, path, before_hash, after_hash, confirmed FROM checkpoint_entries
        WHERE turn_id = ? ORDER BY id
      bindings:
        - !cel "inputs.turnId"
        - !cel "inputs.sourceTurnId"
  - name: outcomes
    invoke: !ref checkpointCommand
    inputs:
      sql: |
        INSERT INTO turn_reverts (turn_id, path, status, outcome)
        SELECT ?, path, status, outcome FROM turn_reverts WHERE turn_id = ?
      bindings:
        - !cel "inputs.turnId"
        - !cel "inputs.sourceTurnId"
  - name: checkpointed
    if: !cel "steps.entries.result.rowCount > 0"
    then:
      - name: blobs
        invoke: !ref listBlobs
        inputs:
          path: !cel "inputs.sourceTurnId"
      - name: copies
        invoke:
          kind: Run.Iteration
          collection: !cel "inputs.blobs"
          steps:
            - name: source
              invoke: !ref readBlob
              inputs:
                path: !cel "inputs.sourceTurnId + '/' + item"
                encoding: base64
            - name: copy
              invoke: !ref writeBlob
              inputs:
                path: !cel "inputs.turnId + '/' + item"
                content: !cel "steps.source.result.content"
                encoding: base64
                createParents: true
        inputs:
          sourceTurnId: !cel "inputs.sourceTurnId"
          turnId: !cel "inputs.turnId"
          blobs: !cel "steps.blobs.result.entries.filter(e, e.type == 'file').map(e, e.name)"
  - name: project
    invoke: !ref projectTurn
    inputs:
      conversationId: !cel "inputs.conversationId"
      turnId: !cel "inputs.turnId"
      ending: false
---
# POST /conversations/{id}/branch: a new conversation holding a copy of every
# live turn through `throughTurnId`, record for record, under new ids minted in
# order. The new conversation's row is written FIRST, `assembling` — hidden from
# every route — then each turn is copied under it, and the mark is cleared
# last; so no turn row ever exists without its conversation row, and a branch a
# crash cut short is a hidden conversation the retention sweep removes when it
# goes idle. A refusal once the row exists removes the partial branch (its
# tombstone, then the shared cascade) and raises the refusal as it was. The
# source — which may be archived — is never modified.
kind: Run.Sequence
metadata: { name: branchConversation }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, throughTurnId]
    properties:
      conversationId: { type: string }
      throughTurnId: { type: string }
steps:
  - name: source
    invoke: !ref requireConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
  - name: turns
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT turn_id, started_at, aborted_at FROM turns
        WHERE conversation_id = ? AND removed_at IS NULL AND turn_id <= ?
        ORDER BY turn_id
      bindings:
        - !cel "inputs.conversationId"
        - !cel "inputs.throughTurnId"
  - name: unknownTurn
    if: !cel >-
      size(steps.turns.result.rows) == 0
        || steps.turns.result.rows[size(steps.turns.result.rows) - 1].turn_id != inputs.throughTurnId
    then:
      - name: refuseUnknownTurn
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'Turn ' + inputs.throughTurnId + ' is not a turn of this conversation.'"
  # Sorted, so the copies keep the source's order however the ids were minted.
  - name: ids
    value:
      conversation: !cel "uuidv7()"
      sources: !cel "steps.turns.result.rows.map(r, string(r.turn_id))"
      copies: !cel "sort(steps.turns.result.rows.map(r, uuidv7()))"
  - name: create
    invoke: { kind: Sql.Command, connection: !ref chatDb }
    inputs:
      sql: "INSERT INTO conversations (id, title, assembling) VALUES (?, ?, 1)"
      bindings:
        - !cel "steps.ids.result.conversation"
        - !cel "steps.source.result.conversation.title == null ? null : dyn(Self.branchTitle(steps.source.result.conversation.title))"
  - name: assemble
    try:
      - name: copy
        invoke:
          kind: Run.Iteration
          collection: !cel "range(size(inputs.turns))"
          steps:
            - name: turn
              invoke: !ref copyTurn
              inputs:
                conversationId: !cel "inputs.conversationId"
                sourceTurnId: !cel "inputs.sourceIds[item]"
                turnId: !cel "inputs.copyIds[item]"
                startedAt: !cel "string(inputs.turns[item].started_at)"
                abortedAt: !cel "inputs.turns[item].aborted_at == null ? null : dyn(string(inputs.turns[item].aborted_at))"
                sourceIds: !cel "inputs.sourceIds"
                copyIds: !cel "inputs.copyIds"
        inputs:
          conversationId: !cel "steps.ids.result.conversation"
          turns: !cel "steps.turns.result.rows"
          sourceIds: !cel "steps.ids.result.sources"
          copyIds: !cel "steps.ids.result.copies"
      - name: reveal
        invoke: { kind: Sql.Command, connection: !ref chatDb }
        inputs:
          sql: |
            UPDATE conversations SET assembling = 0, updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
            WHERE id = ? AND removed_at IS NULL AND assembling = 1
          bindings: [ !cel "steps.ids.result.conversation" ]
      - name: revealed
        if: !cel "steps.reveal.result.rowCount == 0"
        then:
          - name: refuseRemoved
            throw:
              code: ERR_CONVERSATION_CHANGED
              message: The branch was removed while it was copied.
    catch:
      - name: discard
        invoke: !ref discardBranch
        inputs:
          conversationId: !cel "steps.ids.result.conversation"
      - name: reraise
        throw:
          code: !cel "error.code"
          message: !cel "error.message"
          data: !cel "has(error.data) ? error.data : null"
  - name: read
    invoke: !ref requireConversation
    inputs:
      conversationId: !cel "steps.ids.result.conversation"
outputs:
  conversation: !cel "steps.read.result.conversation"
---
# Removes a branch that could not be completed: its hidden conversation is
# tombstoned with every turn copied so far marked, then the shared cascade
# removes their keys and rows. A key still claimed by the failed copy is
# removed with the rest.
kind: Run.Sequence
metadata: { name: discardBranch }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: mark
    invoke:
      kind: Sql.Transaction
      connection: !ref chatDb
      steps:
        kind: Run.Sequence
        inputType:
          kind: Telo.JsonSchema
          schema:
            type: object
            additionalProperties: false
            required: [conversationId]
            properties:
              conversationId: { type: string }
        steps:
          - name: tombstone
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: |
                UPDATE conversations
                SET removed_at = COALESCE(removed_at, strftime('%Y-%m-%dT%H:%M:%fZ', 'now')), revision = revision + 1,
                    updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                WHERE id = ? AND assembling = 1
              bindings: [ !cel "inputs.conversationId" ]
          - name: markTurns
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: |
                UPDATE turns SET removed_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                WHERE conversation_id = ? AND removed_at IS NULL
                  AND EXISTS (SELECT 1 FROM conversations c WHERE c.id = turns.conversation_id AND c.assembling = 1)
              bindings: [ !cel "inputs.conversationId" ]
      inputs:
        conversationId: !cel "inputs.conversationId"
    inputs:
      conversationId: !cel "inputs.conversationId"
  - name: cascade
    invoke: !ref cascadeConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
---
# Spend-budget state. A CacheMemory.Store for a single instance; swap to a
# CacheRedis.Store to bound spend across instances — the Cache.Store seam makes
# it a one-line change.
kind: CacheMemory.Store
metadata: { name: stateStore }
---
# Lease state. Separate from stateStore because a lease needs durability and
# atomic compare-and-set, which Cache.Store does not promise — an evicted claim
# would hand out a second concurrent turn. Process-local, like stateStore; swap
# to a KvStoreRedis.Store to serialize turns across instances.
kind: KvStoreMemory.Store
metadata: { name: leaseStore }
---
# One in-flight turn per conversation, held in memory. detach mode: admission
# acquires and learns { acquired } synchronously (ERR_TURN_IN_PROGRESS when not),
# while the turn runs detached and the lease frees on its terminal. ttl
# self-heals a conversation if a turn dies.
kind: Lease.Critical
metadata: { name: turnLock }
store: !ref leaseStore
ttl: 10m
detach: true
invoke: !ref turnRunner
---
# Operator spend cap over the shared store. Reserved worst-case at turn start
# (429 when over ceiling), settled to actual token usage on the turn's terminal.
kind: RateLimit.Budget
metadata: { name: budget }
store: !ref stateStore
limit: !cel "variables.budgetLimit"
window: !cel "variables.budgetWindow"
---
# Coarse per-client-IP throttle. Only slows an individual abuser (a rotated IP
# dodges it); the global budget is the hard operator-cost bound.
kind: RateLimit.Guard
metadata: { name: ipGuard }
store: !ref stateStore
limit: !cel "variables.ipLimit"
window: !cel "variables.ipWindow"
---
# Every command runs from ./workspace, so that directory must EXIST before the
# first one spawns: `spawn` with a missing cwd fails ENOENT, which the shell
# host reports as `interpreter not found: <program>` — a message that sends the
# reader after the program name rather than the directory. The workspace is
# runtime scratch and is gitignored, so a fresh checkout or a fresh deployment
# has none until something makes it. `ensureWorkspace` is a boot target for
# exactly that; `createParents` makes it idempotent.
kind: Fs.DirectoryCreation
metadata: { name: createDirectory }
---
kind: Run.Sequence
metadata: { name: ensureWorkspace }
steps:
  - name: create
    invoke: !ref createDirectory
    inputs:
      path: !cel "string(variables.workspaceDir)"
      createParents: true
---
kind: Shell.LocalHost
metadata: { name: localHost }
cwd: !cel "variables.workspaceDir"
# Scrub the operator's OpenAI key from every subprocess spawned on this host
# (the auto-`telo check`). The key is read only in-process by OpenaiModel; no
# exposed tool executes agent content in-process, so unsetting it here means no
# anonymous prompt can reach it through the one keyless subprocess we spawn.
env:
  OPENAI_API_KEY: null
---
kind: Shell.Command
metadata: { name: runCommand }
host: !ref localHost
---
# The check's result shape, shared by the write, edit and check sequences:
# `checkReport` is the JSON document `telo check -o json` prints (null when it
# printed nothing), `checkMessages` its stderr prose. `checkExitCode` is the
# span attribute a trace reads a failing check from.
#
# Standalone `telo check` exposed as a tool. Same fixed argv as the write/edit
# loops — the agent supplies only the path, appended to the fixed check argv
# and execed WITHOUT a shell — so this grants validation, not command access.
kind: Run.Sequence
metadata: { name: checkFile }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, checkExitCode, checkReport, checkMessages]
    properties:
      path: { type: string }
      checkExitCode: { type: integer, x-telo-span-attribute: telo.check.exit_code }
      checkReport:
        anyOf:
          - $ref: "telo://Self/CheckReport"
          - type: "null"
      checkMessages: { type: string }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path, string(variables.workspaceDir), string(variables.stateDir))"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: check
    invoke: !ref runCommand
    inputs:
      args: !cel "variables.teloProgram + ['check', '-o', 'json', inputs.path]"
outputs:
  path: !cel "inputs.path"
  checkExitCode: !cel "steps.check.result.exitCode"
  checkReport: !cel "steps.check.result.stdout.trim() == '' ? null : parseJson(steps.check.result.stdout)"
  checkMessages: !cel "steps.check.result.stderr"
---
# The general `telo` CLI, exposed as one tool. The agent supplies the argv after
# the program name; `variables.teloVerbs` decides which subcommands it may name.
#
# The program comes from `variables.teloProgram`, the same one the write/edit
# check loop uses, so the two can never drive different CLI builds.
#
# Argv is passed as a LIST and execed without a shell, so nothing the agent
# writes is interpreted: an argument containing `;` or `$(…)` is one argument.
# What the guards below add is the verb decision and path confinement, which
# argv shape alone cannot make. Every argument is judged as a path — a flag's
# value after its first `=` — because the CLI cannot say which ones it reads as
# paths; the verb itself is on the allow-list and never trips the rule.
kind: Run.Sequence
metadata: { name: runTelo }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [args]
    properties:
      args:
        type: array
        items: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [exitCode, output, messages]
    properties:
      exitCode: { type: integer }
      output: { type: string }
      messages: { type: string }
steps:
  - name: guard
    if: !cel "size(inputs.args) == 0 || !(inputs.args[0] in variables.teloVerbs)"
    then:
      - name: reject
        throw:
          code: ERR_TELO_VERB_NOT_ALLOWED
          message: !cel >-
            'telo ' + (size(inputs.args) == 0 ? '' : inputs.args[0]) +
            ' is not available here. Allowed subcommands: ' +
            join(variables.teloVerbs, ', ') +
            '. Note a bare path means `run`, which is not allowed.'
  - name: outside
    value: !cel >-
      inputs.args
        .map(a, a.startsWith('-') && a.contains('=') ? a.substring(a.indexOf('=') + 1) : a)
        .filter(p, Self.outsideWorkspace(p, string(variables.workspaceDir), string(variables.stateDir)))
  - name: confine
    if: !cel "size(steps.outside.result) > 0"
    then:
      - name: rejectPath
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(steps.outside.result[0])"
  - name: run
    invoke: !ref runCommand
    inputs:
      args: !cel "variables.teloProgram + inputs.args"
outputs:
  exitCode: !cel "steps.run.result.exitCode"
  # Kept apart for the same reason as the check loop: under `-o json` stdout is
  # a parseable document and stderr is human prose, and concatenating them
  # splices one into the other.
  output: !cel "steps.run.result.stdout"
  messages: !cel "steps.run.result.stderr"
---
# `telo run` on ONE path, exposed as the test runner.
#
# Kept apart from the general `telo` tool rather than added to `teloVerbs`,
# because it is a different decision by a different person: that list says which
# INSPECTION verbs are available, while this is the one switch that turns
# arbitrary code execution on. Folding `run` into the verb list would hide a
# security decision inside a list read as a convenience.
#
# The verb is fixed here — the agent supplies only a path, appended to a fixed
# argv and execed WITHOUT a shell — so this grants running a manifest, not
# command access. `timeoutMs` bounds a manifest that never exits.
kind: Run.Sequence
metadata: { name: runManifest }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [exitCode, output, messages]
    properties:
      exitCode: { type: integer }
      output: { type: string }
      messages: { type: string }
steps:
  - name: guard
    if: !cel "!variables.allowManifestRuns"
    then:
      - name: reject
        throw:
          code: ERR_MANIFEST_RUNS_NOT_ALLOWED
          message: >-
            Running manifests is not enabled in this deployment. Validate the
            tests with telo_check instead, and say they are ready to run.
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path, string(variables.workspaceDir), string(variables.stateDir))"
    then:
      - name: rejectPath
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: run
    invoke: !ref runCommand
    inputs:
      args: !cel "variables.teloProgram + ['run', inputs.path]"
      timeoutMs: !cel "variables.runTimeoutMs"
outputs:
  exitCode: !cel "steps.run.result.exitCode"
  # Kept apart for the same reason as the check loop: the suite writes its
  # per-test verdicts to stdout and the kernel's own diagnostics to stderr, and
  # concatenating them splices one into the other.
  output: !cel "steps.run.result.stdout"
  messages: !cel "steps.run.result.stderr"
---
# write_file / edit_file are exposed to the agent through these sequences: the
# path is confined, the resulting content is scanned for credentials BEFORE
# anything is written, the change is checkpointed under its turn and applied
# under the workspace lease, and every mutation is immediately followed by
# `telo check` on the same file, whose report is returned in the tool result.
# The agent therefore always sees diagnostics after touching a file — it cannot
# "forget" to validate — and cannot write a key into a file at all. `changes`
# is the file's Change (none when the bytes did not change) and `hunks` the
# call's own line diff, null when a side is not comparable text.
kind: Run.Sequence
metadata: { name: writeFileChecked }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId, path, content]
    properties:
      turnId: { type: string }
      path: { type: string }
      content: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, bytesWritten, checkExitCode, checkReport, checkMessages, changes, hunks]
    properties:
      path: { type: string }
      bytesWritten: { type: integer }
      checkExitCode: { type: integer, x-telo-span-attribute: telo.check.exit_code }
      checkReport:
        anyOf:
          - $ref: "telo://Self/CheckReport"
          - type: "null"
      checkMessages: { type: string }
      changes:
        type: array
        items: { $ref: "telo://Self/Change" }
      hunks: { type: [array, "null"] }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path, string(variables.workspaceDir), string(variables.stateDir))"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: findings
    value: !cel "SecretScan.credentialFindings(inputs.content)"
  - name: secret
    if: !cel "size(steps.findings.result) > 0"
    then:
      - name: refuseSecret
        throw:
          code: ERR_SECRET_IN_MANIFEST
          message: !cel "Self.secretMessage(inputs.path, steps.findings.result)"
          data:
            path: !cel "inputs.path"
            findings: !cel "steps.findings.result"
  - name: write
    invoke: !ref leasedWorkspace
    inputs:
      operation:
        write:
          turnId: !cel "inputs.turnId"
          path: !cel "inputs.path"
          content: !cel "inputs.content"
  - name: check
    invoke: !ref runCommand
    inputs:
      args: !cel "variables.teloProgram + ['check', '-o', 'json', inputs.path]"
outputs:
  path: !cel "inputs.path"
  bytesWritten: !cel "steps.write.result.result.bytesWritten"
  checkExitCode: !cel "steps.check.result.exitCode"
  checkReport: !cel "steps.check.result.stdout.trim() == '' ? null : parseJson(steps.check.result.stdout)"
  checkMessages: !cel "steps.check.result.stderr"
  changes: !cel "steps.write.result.result.changes"
  hunks: !cel "steps.write.result.result.hunks"
---
# The edit is scanned as the file it would leave: read under the lease, the one
# occurrence replaced, the result scanned. When `oldString` does not occur
# exactly once there is no result to scan — the edit itself refuses.
kind: Run.Sequence
metadata: { name: editFileChecked }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId, path, oldString, newString]
    properties:
      turnId: { type: string }
      path: { type: string }
      oldString: { type: string }
      newString: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, replacements, checkExitCode, checkReport, checkMessages, changes, hunks]
    properties:
      path: { type: string }
      replacements: { type: integer }
      checkExitCode: { type: integer, x-telo-span-attribute: telo.check.exit_code }
      checkReport:
        anyOf:
          - $ref: "telo://Self/CheckReport"
          - type: "null"
      checkMessages: { type: string }
      changes:
        type: array
        items: { $ref: "telo://Self/Change" }
      hunks: { type: [array, "null"] }
steps:
  - name: confine
    if: !cel "Self.outsideWorkspace(inputs.path, string(variables.workspaceDir), string(variables.stateDir))"
    then:
      - name: reject
        throw:
          code: ERR_PATH_OUTSIDE_WORKSPACE
          message: !cel "Self.outsideWorkspaceMessage(inputs.path)"
  - name: edit
    invoke: !ref leasedWorkspace
    inputs:
      operation:
        edit:
          turnId: !cel "inputs.turnId"
          path: !cel "inputs.path"
          oldString: !cel "inputs.oldString"
          newString: !cel "inputs.newString"
  - name: check
    invoke: !ref runCommand
    inputs:
      args: !cel "variables.teloProgram + ['check', '-o', 'json', inputs.path]"
outputs:
  path: !cel "inputs.path"
  replacements: !cel "steps.edit.result.result.replacements"
  checkExitCode: !cel "steps.check.result.exitCode"
  checkReport: !cel "steps.check.result.stdout.trim() == '' ? null : parseJson(steps.check.result.stdout)"
  checkMessages: !cel "steps.check.result.stderr"
  changes: !cel "steps.edit.result.result.changes"
  hunks: !cel "steps.edit.result.result.hunks"
---
# Every result is TEXT the model reads — a `result:` rendering per tool, never
# the output serialized as JSON. The structured output still rides the tool
# result record (`output`) for clients. The tools that change files read the
# turn they serve from the agent's caller — never from the model — and
# checkpoint under it.
kind: Ai.Tools
metadata: { name: workspaceTools }
contextType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [turnId]
    properties:
      turnId: { type: string }
tools:
  - tool: !ref writeFileChecked
    name: write_file
    description: >-
      Write a file whole, relative to the workspace root (creates parent dirs),
      then automatically run `telo check` on it. The result is text: `wrote
      <path>`, then `check: clean` or one `file:line:col CODE message` line per
      diagnostic, then any notes the checker wrote. Read the CODE to decide
      what to fix; keep fixing until the check is clean. A path outside the
      workspace fails with ERR_PATH_OUTSIDE_WORKSPACE, and content holding a
      credential is refused with ERR_SECRET_IN_MANIFEST before anything is
      written. ERR_CHECKPOINT_TOO_LARGE means the file it would replace is too
      large to checkpoint, ERR_PATH_NOT_A_FILE that the path is a directory, a
      symbolic link or a device — ask the user to make the change;
      ERR_WORKSPACE_BUSY means another change was in progress — call again.
    parameters:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
    inputs:
      turnId: !cel "context.turnId"
      path: !cel "arguments.path"
      content: !cel "arguments.content"
    result: !cel "'wrote ' + result.path + '\\n' + Self.renderCheck(result.checkExitCode, result.checkReport, result.checkMessages)"
  - tool: !ref editFileChecked
    name: edit_file
    description: >-
      Replace an exact substring in an existing file (fails if absent or not
      unique), then automatically run `telo check` on it. The result is text:
      `wrote <path>`, then `check: clean` or one `file:line:col CODE message`
      line per diagnostic, then any notes the checker wrote. Keep fixing until
      the check is clean. An edit whose result would hold a credential is
      refused with ERR_SECRET_IN_MANIFEST before anything is written. A file
      that is not UTF-8 text is refused with ERR_FILE_NOT_TEXT, one too large to
      checkpoint with ERR_CHECKPOINT_TOO_LARGE, a path that is a directory, a
      symbolic link or a device with ERR_PATH_NOT_A_FILE — ask the user to make
      the change; ERR_WORKSPACE_BUSY means another change was in progress —
      call again.
    parameters:
      type: object
      additionalProperties: false
      required: [path, oldString, newString]
      properties:
        path: { type: string }
        oldString: { type: string }
        newString: { type: string }
    inputs:
      turnId: !cel "context.turnId"
      path: !cel "arguments.path"
      oldString: !cel "arguments.oldString"
      newString: !cel "arguments.newString"
    result: !cel "'wrote ' + result.path + '\\n' + Self.renderCheck(result.checkExitCode, result.checkReport, result.checkMessages)"
  - tool: !ref readWorkspaceFile
    name: read_file
    description: >-
      Read a file, relative to the workspace root. The result is the file's
      contents exactly as they are on disk.
    parameters:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string }
    result: !cel "result.content"
  - tool: !ref listWorkspaceDir
    name: list_dir
    description: >-
      List a directory relative to the workspace root; recursive optional, and
      the whole root when `path` is omitted. The result is one path per line,
      relative to the workspace root, a directory with a trailing `/`. Caches,
      vendor directories and the agent's own state (`.telo`, `node_modules`,
      `.git`, `dist`, `.telo-agent`) are filtered out at any depth — their
      absence from a listing is not evidence that files are missing.
    parameters:
      type: object
      additionalProperties: false
      properties:
        path: { type: string }
        recursive: { type: boolean }
    inputs:
      path: !cel "'path' in arguments ? arguments.path : ''"
      recursive: !cel "'recursive' in arguments ? arguments.recursive : false"
    result: !cel "join(result.entries.map(e, e.path + (e.type == 'directory' ? '/' : '')), '\\n')"
  - tool: !ref deleteWorkspaceFile
    name: delete_file
    description: >-
      Delete a file, relative to the workspace root (or a directory tree with
      recursive: true). Fails if the path does not exist. The result is
      `deleted <path>`. After deleting a file other manifests reference, run
      telo_check on them to catch dangling imports or refs. The workspace root,
      and a directory holding the agent's own state directory, are refused
      with ERR_PATH_OUTSIDE_WORKSPACE — delete the entries inside one by one. A
      deletion that would capture more files or bytes than one call may is
      refused with ERR_CHECKPOINT_TOO_LARGE, and a symbolic link or a tree
      holding one (or a device) with ERR_PATH_NOT_A_FILE, before anything is
      deleted — ask the user to make the change; ERR_WORKSPACE_BUSY means
      another change was in progress — call again.
    parameters:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string }
        recursive: { type: boolean }
    inputs:
      turnId: !cel "context.turnId"
      path: !cel "arguments.path"
      recursive: !cel "'recursive' in arguments ? arguments.recursive : false"
    result: !cel "'deleted ' + result.path"
  - tool: !ref runTelo
    name: telo
    description: >-
      Run the `telo` CLI. `args` is the argv after the program name, as a list
      of separate strings — ["module", "manifest", "oci://ghcr.io/telorun/sql"],
      never one joined string. Available subcommands: `check` (validate
      manifests), `cel` (`cel functions` lists every CEL function with its
      signature and CALL FORM; `cel eval "<expr>"` evaluates one), `module`
      (`versions` / `manifest` / `kinds` / `resources` / `digest` for a module
      ref — read a kind's exact schema before writing against it), and `search`
      (find kinds across published modules). Pass `-o json` for a parseable
      document. Running a manifest is not available here. The result is the
      command's stdout as printed, an `exit N` line only when it failed, and its
      stderr under `stderr:` only when it wrote any. Every argument is judged as
      a workspace path: one outside it fails with ERR_PATH_OUTSIDE_WORKSPACE.
    parameters:
      type: object
      additionalProperties: false
      required: [args]
      properties:
        args:
          type: array
          items: { type: string }
    result: !cel "Self.renderRun(result.exitCode, result.output, result.messages)"
  - tool: !ref runManifest
    name: run_manifest
    description: >-
      Run a manifest, relative to the workspace root: a test suite
      (`apps/<slug>/tests/telo.yaml`), a single test file, or a throwaway probe
      that reads something and prints it. The result is its stdout as printed
      — the per-test PASS/FAIL lines, or whatever a probe printed — an `exit N`
      line only when it failed, and its stderr under `stderr:` only when it
      wrote any. Never point it at an application: it starts a server that
      never exits, so the call just times out. A probe must only READ. An
      ERR_MANIFEST_RUNS_NOT_ALLOWED error means this deployment does not permit
      executing manifests — validate with telo_check instead and say the tests
      are ready to run.
    parameters:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string }
    result: !cel "Self.renderRun(result.exitCode, result.output, result.messages)"
  - tool: !ref checkFile
    name: telo_check
    description: >-
      Run `telo check` on a manifest file, relative to the workspace root. Use
      it to re-validate a file you did not just write — e.g. after deleting or
      renaming something it references. The result is `check: clean` or one
      `file:line:col CODE message` line per diagnostic, then any notes the
      checker wrote.
    parameters:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string }
    result: !cel "Self.renderCheck(result.checkExitCode, result.checkReport, result.checkMessages)"
---
kind: Ai.AgentStream
metadata: { name: author }
model: !ref model
# The primer is a file of its own: it is prose, it is hashed as the agent's
# prompt identity (`promptIdentity`), and a literal block this size made the
# library unreadable.
system: !include-text ./primer.md
# A turn that spends its step budget ends with one more model call that may not
# use a tool and writes the wrap-up the primer describes, so the turn completes
# with a readable reply (its `finish` record carries `limit: max-steps`) rather
# than failing. `int(...)`: an integer variable forwarded through an import
# arrives as a double at runtime.
maxSteps: !cel "int(variables.maxSteps)"
onMaxSteps: conclude
conclusionPrompt: >-
  You have used every step this turn may take. Do not call a tool. Reply now
  with the wrap-up your instructions describe under "When you run out of
  steps": what is done, what is not done, and the next step.
# What one tool result may put into the context: a file read whole, a module
# manifest or a command's output would otherwise fill it in one step.
maxToolResultBytes: !cel "int(variables.maxToolResultBytes)"
# One tool at a time, in call order: a response's calls build on each other's
# effects — a file is written, then checked, then run.
maxParallelTools: 1
toolProviders:
  - provider: !ref workspaceTools
  - provider: !ref hubTools
---
# The agent's model at low effort, with no readable reasoning, for the naming
# and summary calls: on this API `max_output_tokens` bounds reasoning and reply
# together, so the operator's effort would spend a capped call's budget on
# thinking about a title or a summary.
kind: OpenAI.ResponsesModelStream
metadata: { name: lowEffortModel }
model: !cel "variables.model"
request: !ref openaiRequest
reasoning:
  effort: low
---
# What the title and summary calls run on.
kind: Ai.Buffered
metadata: { name: bufferedModel }
model: !ref lowEffortModel
---
# How a turn ends, whichever way it ends: settle its budget reservation, then
# bring its projection up to date. A turn that completed is charged what its
# `finish` record reports; any other ending is charged at least its reservation,
# and more when the model calls it completed already cost more.
kind: RecordStream.EndHandler
metadata: { name: turnEnd }
handler: !ref endTurn
inputs:
  conversationId: !cel "context.conversationId"
  turnId: !cel "context.turnId"
  reserved: !cel "context.reserved"
  # What the attempt consumed, as the model reported it: every model call that
  # finished — the agent's steps (their sum is the terminal `finish` record's),
  # plus the title and summary calls. A completed attempt is charged that; any
  # other ending at least its reservation.
  inputTokens: !cel >-
    cel.bind(calls, records.filter(r, r.type == 'step-finish'
        || (r.type in ['conversation-title', 'context-summary'] && has(r.usage))).map(r, int(r.usage.promptTokens)),
      size(calls) == 0 ? 0 : int(sum(calls)))
  outputTokens: !cel >-
    cel.bind(calls, records.filter(r, r.type == 'step-finish'
        || (r.type in ['conversation-title', 'context-summary'] && has(r.usage))).map(r, int(r.usage.completionTokens)),
      size(calls) == 0 ? 0 : int(sum(calls)))
  amount: !cel >-
    cel.bind(calls, records.filter(r, r.type == 'step-finish'
        || (r.type in ['conversation-title', 'context-summary'] && has(r.usage))).map(r, int(r.usage.totalTokens)),
      cel.bind(spent, size(calls) == 0 ? 0 : int(sum(calls)),
        outcome.state == 'completed' || spent > context.reserved ? spent : context.reserved))
---
kind: Run.Sequence
metadata: { name: endTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, turnId, reserved, amount, inputTokens, outputTokens]
    properties:
      conversationId: { type: string }
      turnId: { type: string }
      reserved: { type: integer }
      amount: { type: integer }
      # The turn's token usage, on the span that settles it.
      inputTokens: { type: integer, x-telo-span-attribute: gen_ai.usage.input_tokens }
      outputTokens: { type: integer, x-telo-span-attribute: gen_ai.usage.output_tokens }
steps:
  # Settled first: a projection that fails still ends the turn with its error,
  # but must not leave the reservation held — the projection is caught up from
  # the journal by the next history read, the reservation by nothing.
  - name: settle
    invoke: !ref budget
    inputs:
      op: settle
      key: "global"
      amount: !cel "inputs.amount"
      reserved: !cel "inputs.reserved"
  # The turn's ending is a change to its conversation whether or not the
  # projection succeeds: another client re-reads the records either way.
  - name: projection
    try:
      # What a cancelled or failed call left unsettled, before the summary
      # counts the turn's entries. No lease: nothing of this turn writes now.
      - name: settle
        invoke: !ref settleEntries
        inputs:
          callId: null
          turnId: !cel "inputs.turnId"
      - name: project
        invoke: !ref projectTurn
        inputs:
          conversationId: !cel "inputs.conversationId"
          turnId: !cel "inputs.turnId"
          ending: true
    finally:
      - name: ended
        invoke: { kind: Sql.Command, connection: !ref chatDb }
        inputs:
          sql: |
            UPDATE conversations
            SET revision = revision + 1, updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
            WHERE id = ? AND removed_at IS NULL
          bindings: [ !cel "inputs.conversationId" ]
---
# POST /chat entry. Admits a turn — per-IP throttle, spend reservation, the
# one-turn-per-conversation lease — and returns { turnId } immediately, the turn
# itself running DETACHED into the journal under that id. The client then
# consumes GET /chat/{turnId}/events to stream the reply, so a reload can
# re-attach and resume the pending turn.
#
# With an Idempotency-Key the admission runs at most once per
# `<conversationId>:<key>`: a repeat replays the original { turnId } instead of
# starting a second turn, which is what makes a client's blind retry of a POST
# that did land safe. The record lives on `agent.sqlite`, so it survives a
# restart. A refused admission throws, which releases the key — a retry after a
# 429 is a new attempt, not a replay of the refusal.
kind: Run.Sequence
metadata: { name: chatStart }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [conversationId, message, clientIp, idempotencyKey]
    properties:
      conversationId: { type: string }
      message: { type: string }
      clientIp: { type: string }
      # Empty when the request carried no Idempotency-Key header.
      idempotencyKey: { type: string, maxLength: 255 }
steps:
  # Minted outside the idempotent region: the id a fresh admission uses, and
  # unused when a repeat replays the one the first admission settled.
  - name: turn
    value:
      id: !cel "uuidv7()"
      # The token only this turn's journal sink drains under.
      writer: !cel "uuidv4()"
  # A conversation that does not exist, was deleted or is archived takes no
  # turn. Checked again where the turn row is written, which is what decides.
  - name: conversation
    invoke: !ref requireWritableConversation
    inputs:
      conversationId: !cel "inputs.conversationId"
  - name: admission
    if: !cel "inputs.idempotencyKey == ''"
    then:
      - name: direct
        invoke: !ref admitTurn
        inputs:
          conversationId: !cel "inputs.conversationId"
          turnId: !cel "steps.turn.result.id"
          writer: !cel "steps.turn.result.writer"
          message: !cel "inputs.message"
          clientIp: !cel "inputs.clientIp"
    else:
      - name: once
        invoke:
          kind: Idempotency.Once
          store:
            kind: KvStoreSql.Store
            connection: !ref chatDb
            table: turn_admissions
          # Admission is milliseconds of work; the claim only has to outlive a
          # holder that died mid-admission.
          claimTtl: 30s
          ttl: 24h
          invoke: !ref admitTurn
        inputs:
          key: !cel "inputs.conversationId + ':' + inputs.idempotencyKey"
          inputs:
            conversationId: !cel "inputs.conversationId"
            turnId: !cel "steps.turn.result.id"
            writer: !cel "steps.turn.result.writer"
            message: !cel "inputs.message"
            clientIp: !cel "inputs.clientIp"
      - name: inFlight
        if: !cel "steps.once.result.state == 'in-flight'"
        then:
          - name: refuseInFlight
            throw:
              code: ERR_IDEMPOTENCY_KEY_IN_FLIGHT
              message: >-
                A request with this Idempotency-Key is still being admitted.
                Retry it with the same key.
      # The same key names the same request: a different message under it is a
      # client bug, never a second turn and never the first turn's id.
      - name: reused
        if: !cel "steps.once.result.state == 'replayed' && steps.once.result.result.fingerprint != sha256(inputs.message)"
        then:
          - name: refuseReused
            throw:
              code: ERR_IDEMPOTENCY_KEY_REUSED
              message: >-
                This Idempotency-Key was already used for a different message in
                this conversation. Send a new key for a new message.
outputs:
  turnId: !cel "inputs.idempotencyKey == '' ? steps.direct.result.turnId : steps.once.result.result.turnId"
---
# One admission attempt. Every refusal is a coded error the route maps to its
# status. The throttle and the budget refuse before anything is written; after
# the reservation, a refused lease or any failure — of the claim, the `turns`
# row or the lease — refunds it and removes whatever of the key and the row was
# written, so a start that did not happen leaves nothing behind. A failure is
# raised as it was.
#
# The key is claimed HERE, before POST /chat answers, under a writer token only
# this turn's sink knows — so a client that opens the event stream the moment it
# has the id finds a turn that exists and tails it, and a turn that fails before
# its first record still ends with a readable error instead of a key nobody
# ever wrote.
kind: Run.Sequence
metadata: { name: admitTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [conversationId, turnId, writer, message, clientIp]
    properties:
      conversationId: { type: string }
      turnId: { type: string }
      # Minted by the caller, outside the idempotent region: a repeat must not
      # mint a second one.
      writer: { type: string }
      message: { type: string }
      clientIp: { type: string }
steps:
  # Per-IP throttle first — a rate-limited client doesn't touch the budget.
  - name: guard
    invoke: !ref ipGuard
    inputs:
      key: !cel "inputs.clientIp"
  - name: throttled
    if: !cel "!steps.guard.result.allowed"
    then:
      - name: refuseThrottled
        throw:
          code: ERR_RATE_LIMITED
          message: Too many turns started from this address. Retry after `retryAfter` seconds.
          data:
            retryAfter: !cel "steps.guard.result.retryAfter"
  # Reserve worst-case spend up front. A denied reserve refunds itself, so an
  # over-ceiling request is a clean refusal with no turn started.
  - name: reserve
    invoke: !ref budget
    inputs:
      op: reserve
      key: "global"
      amount: !cel "variables.reservePerTurn"
  - name: overBudget
    if: !cel "!steps.reserve.result.allowed"
    then:
      - name: refuseAtCapacity
        throw:
          code: ERR_AT_CAPACITY
          message: The agent's spend ceiling is reached. Retry after `retryAfter` seconds.
          data:
            retryAfter: !cel "steps.reserve.result.retryAfter"
  # Everything after the reservation takes it back when it fails — the claim,
  # the `turns` row, the lease — and, once the key is claimed, removes the key
  # and the row again, then raises the original error.
  - name: admit
    try:
      - name: claim
        invoke:
          kind: RecordStream.JournalClaim
          journal: !ref turnJournal
        inputs:
          key: !cel "inputs.turnId"
          writer: !cel "inputs.writer"
      - name: claimed
        try:
          # Written only for a live, unarchived conversation, and bumping its
          # revision in the same transaction — so a deletion that read the
          # revision before this turn existed fails its compare-and-set. The key
          # is already claimed, so the row is never visible before its key.
          - name: recordTurn
            invoke:
              kind: Sql.Transaction
              connection: !ref chatDb
              steps:
                kind: Run.Sequence
                inputType:
                  kind: Telo.JsonSchema
                  schema:
                    type: object
                    additionalProperties: false
                    required: [conversationId, turnId]
                    properties:
                      conversationId: { type: string }
                      turnId: { type: string }
                steps:
                  - name: insert
                    invoke: { kind: Sql.Command, connection: !ref chatDb }
                    inputs:
                      sql: |
                        INSERT INTO turns (turn_id, conversation_id, checkpointed)
                        SELECT ?, id, 1 FROM conversations
                        WHERE id = ? AND removed_at IS NULL AND archived = 0 AND assembling = 0
                      bindings:
                        - !cel "inputs.turnId"
                        - !cel "inputs.conversationId"
                  - name: refused
                    if: !cel "steps.insert.result.rowCount == 0"
                    then:
                      - name: refuse
                        invoke: !ref refuseConversationWrite
                        inputs:
                          conversationId: !cel "inputs.conversationId"
                  - name: admitted
                    invoke: { kind: Sql.Command, connection: !ref chatDb }
                    inputs:
                      sql: |
                        UPDATE conversations
                        SET revision = revision + 1, updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                        WHERE id = ?
                      bindings: [ !cel "inputs.conversationId" ]
              inputs:
                conversationId: !cel "inputs.conversationId"
                turnId: !cel "inputs.turnId"
            inputs:
              conversationId: !cel "inputs.conversationId"
              turnId: !cel "inputs.turnId"
          - name: startTurn
            invoke: !ref turnLock
            inputs:
              key: !cel "inputs.conversationId"
              holder: !cel "inputs.turnId"
              inputs:
                conversationId: !cel "inputs.conversationId"
                turnId: !cel "inputs.turnId"
                lead: !cel "{'type': 'user-message', 'content': inputs.message, 'model': variables.model}"
                resume: false
                reserved: !cel "steps.reserve.result.reserved"
                writer: !cel "inputs.writer"
        catch:
          - name: forgetFailedTurn
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: "DELETE FROM turns WHERE turn_id = ?"
              bindings: [ !cel "inputs.turnId" ]
          - name: releaseFailedKey
            invoke:
              kind: RecordStream.JournalRemoval
              journal: !ref turnJournal
            inputs:
              key: !cel "inputs.turnId"
          - name: raiseStartFailure
            throw:
              code: !cel "error.code"
              message: !cel "error.message"
              data: !cel "has(error.data) ? error.data : null"
    catch:
      - name: refundFailed
        invoke: !ref budget
        inputs:
          op: settle
          key: "global"
          amount: 0
          reserved: !cel "steps.reserve.result.reserved"
      - name: raiseAdmissionFailure
        throw:
          code: !cel "error.code"
          message: !cel "error.message"
          data: !cel "has(error.data) ? error.data : null"
  # A turn is already in flight for this conversation — refuse the overlap, and take
  # back everything this attempt wrote: the reservation, the `turns` row and the claimed key.
  - name: overlap
    if: !cel "!steps.startTurn.result.acquired"
    then:
      - name: refund
        invoke: !ref budget
        inputs:
          op: settle
          key: "global"
          amount: 0
          reserved: !cel "steps.reserve.result.reserved"
      - name: forgetTurn
        invoke: { kind: Sql.Command, connection: !ref chatDb }
        inputs:
          sql: "DELETE FROM turns WHERE turn_id = ?"
          bindings: [ !cel "inputs.turnId" ]
      - name: releaseKey
        invoke:
          kind: RecordStream.JournalRemoval
          journal: !ref turnJournal
        inputs:
          key: !cel "inputs.turnId"
      - name: refuseOverlap
        throw:
          code: ERR_TURN_IN_PROGRESS
          message: A turn is already running for this conversation.
          data:
            activeTurnId: !cel "steps.startTurn.result.holder"
outputs:
  turnId: !cel "inputs.turnId"
  # What a replay under the same key is compared against.
  fingerprint: !cel "sha256(inputs.message)"
---
# POST /chat/{turnId}/abort. Cancels the turn's running attempt through the
# conversation's lease — its model call and its running tool see the
# cancellation, the journal fails the key with ERR_INVOKE_CANCELLED (the event
# stream's last frame), the end handler settles the reservation to what the
# completed calls cost, and the lease frees. `aborted_at` is what tells this
# ending apart from a shutdown's cancellation: an aborted turn is not continued.
# A turn nothing is running for answers `cancelled: false`.
kind: Run.Sequence
metadata: { name: abortTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId]
    properties:
      turnId: { type: string }
steps:
  - name: header
    invoke: !ref journalRead
    inputs:
      key: !cel "inputs.turnId"
      limit: 0
  - name: removed
    if: !cel "steps.header.result.state == 'removed'"
    then:
      - name: refuseRemoved
        throw:
          code: ERR_JOURNAL_KEY_REMOVED
          message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
  - name: row
    invoke: !ref historyRows
    inputs:
      sql: "SELECT conversation_id FROM turns WHERE turn_id = ?"
      bindings: [ !cel "inputs.turnId" ]
  - name: unknown
    if: !cel "steps.header.result.state == 'unknown' || size(steps.row.result.rows) == 0"
    then:
      - name: refuseUnknown
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'No turn ' + inputs.turnId + ' was started on this agent.'"
  # Stamped BEFORE the cancel, so no read between the turn failing with
  # ERR_INVOKE_CANCELLED and the stamp reports it `failed`. Only an unstamped
  # turn is stamped, and only a stamp this request wrote is cleared again when
  # nothing was running — an earlier abort's stays.
  - name: stamp
    invoke: { kind: Sql.Command, connection: !ref chatDb }
    inputs:
      sql: "UPDATE turns SET aborted_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now') WHERE turn_id = ? AND aborted_at IS NULL"
      bindings: [ !cel "inputs.turnId" ]
  # The holder guard makes this cancel THIS turn only, never a later one the
  # conversation has started since.
  - name: cancel
    invoke: !ref turnLock
    inputs:
      op: cancel
      key: !cel "steps.row.result.rows[0].conversation_id"
      holder: !cel "inputs.turnId"
  - name: cancelled
    value: !cel "has(steps.cancel.result.cancelled) && steps.cancel.result.cancelled"
  - name: notRunning
    if: !cel "!steps.cancelled.result && steps.stamp.result.rowCount > 0"
    then:
      - name: unstamp
        invoke: { kind: Sql.Command, connection: !ref chatDb }
        inputs:
          sql: "UPDATE turns SET aborted_at = NULL WHERE turn_id = ?"
          bindings: [ !cel "inputs.turnId" ]
outputs:
  cancelled: !cel "steps.cancelled.result"
---
# POST /chat/{turnId}/continue. Re-enters an interrupted turn — failed, or cut
# off by a process that died — as another attempt at the SAME turn: its id, its
# records and its event stream stay, and the model is given the turn's recorded
# history in full plus a note naming what interrupted it and which tool calls
# have no recorded result. Refused, in order: removed (410), unknown (404), a
# turn of this conversation still running (409 ERR_TURN_IN_PROGRESS), a turn
# that finished, was aborted or has a later turn after it (409
# ERR_TURN_NOT_CONTINUABLE with the reason), then the throttle and the budget
# (429), then — once its key is taken over — a conversation deleted or archived
# or a turn removed since (410 / 409). The attempt reserves and settles on its
# own. Returns the id of the last record before the attempt: the next one is
# its `turn-continued` record.
kind: Run.Sequence
metadata: { name: continueTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId, clientIp]
    properties:
      turnId: { type: string }
      clientIp: { type: string }
steps:
  - name: attempt
    value:
      # The token only this attempt's journal sink drains under.
      writer: !cel "uuidv4()"
  # The key's state alone, for the refusals below; the note's records and the
  # error it names come from the takeover.
  - name: snapshot
    invoke: !ref journalRead
    inputs:
      key: !cel "inputs.turnId"
      limit: 0
  - name: row
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT t.conversation_id, t.aborted_at, t.removed_at,
               (SELECT MAX(l.turn_id) FROM turns l
                 WHERE l.conversation_id = t.conversation_id AND l.removed_at IS NULL) AS last_turn_id
        FROM turns t WHERE t.turn_id = ?
      bindings: [ !cel "inputs.turnId" ]
  # Removed is the key gone, or the turn marked while its key still waits for
  # the cascade.
  - name: removed
    if: !cel >-
      steps.snapshot.result.state == 'removed'
        || (size(steps.row.result.rows) > 0 && steps.row.result.rows[0].removed_at != null)
    then:
      - name: refuseRemoved
        throw:
          code: ERR_JOURNAL_KEY_REMOVED
          message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
  - name: unknown
    if: !cel "steps.snapshot.result.state == 'unknown' || size(steps.row.result.rows) == 0"
    then:
      - name: refuseUnknown
        throw:
          code: ERR_TURN_NOT_FOUND
          message: !cel "'No turn ' + inputs.turnId + ' was started on this agent.'"
  - name: conversation
    invoke: !ref requireWritableConversation
    inputs:
      conversationId: !cel "string(steps.row.result.rows[0].conversation_id)"
  - name: turn
    value:
      conversationId: !cel "steps.row.result.rows[0].conversation_id"
      lastTurnId: !cel "steps.row.result.rows[0].last_turn_id"
      status: !cel >-
        Self.turnStatus(steps.snapshot.result.state, steps.snapshot.result.error,
          steps.row.result.rows[0].aborted_at)
  # Only the conversation's last turn can be running: this one with a live
  # writer, or a later one.
  - name: last
    invoke: !ref journalRead
    inputs:
      key: !cel "steps.turn.result.lastTurnId"
      limit: 0
  - name: inProgress
    if: !cel "steps.last.result.state == 'open'"
    then:
      - name: refuseInProgress
        throw:
          code: ERR_TURN_IN_PROGRESS
          message: A turn is already running for this conversation.
          data:
            activeTurnId: !cel "steps.turn.result.lastTurnId"
  - name: notContinuable
    if: !cel >-
      steps.turn.result.status in ['finished', 'aborted'] || steps.turn.result.lastTurnId != inputs.turnId
    then:
      - name: refuseNotContinuable
        throw:
          code: ERR_TURN_NOT_CONTINUABLE
          message: !cel >-
            steps.turn.result.status == 'finished' ? 'This turn finished; there is nothing to continue.'
              : steps.turn.result.status == 'aborted' ? 'This turn was aborted; send a new message instead.'
              : 'A later turn follows this one; only the last turn of a conversation can be continued.'
          data:
            reason: !cel >-
              steps.turn.result.status == 'finished' ? 'finished'
                : steps.turn.result.status == 'aborted' ? 'aborted' : 'superseded'
  - name: guard
    invoke: !ref ipGuard
    inputs:
      key: !cel "inputs.clientIp"
  - name: throttled
    if: !cel "!steps.guard.result.allowed"
    then:
      - name: refuseThrottled
        throw:
          code: ERR_RATE_LIMITED
          message: Too many turns started from this address. Retry after `retryAfter` seconds.
          data:
            retryAfter: !cel "steps.guard.result.retryAfter"
  - name: reserve
    invoke: !ref budget
    inputs:
      op: reserve
      key: "global"
      amount: !cel "variables.reservePerTurn"
  - name: overBudget
    if: !cel "!steps.reserve.result.allowed"
    then:
      - name: refuseAtCapacity
        throw:
          code: ERR_AT_CAPACITY
          message: The agent's spend ceiling is reached. Retry after `retryAfter` seconds.
          data:
            retryAfter: !cel "steps.reserve.result.retryAfter"
  # The key is taken over FIRST, as admission claims first: while it is open a
  # deletion or truncation reading it refuses the turn as running, and one that
  # read it before fails its compare-and-set on the revision `touch` bumps. A
  # key removed since the snapshot is refused here (410), and one another
  # continue holds is running (409). Taken over before this answers, so a
  # reader attaching now tails the attempt instead of reading the previous
  # attempt's failure; the attempt's sink adopts the claim under the same
  # writer. The takeover reports the error the key held at the version it took
  # over — even when another continue failed it again since the snapshot — and
  # that error is what the note names and what a refusal restores. Until the
  # attempt is started, nothing else settles this reservation: every refusal
  # and failure gives it back and is raised as it was. Once started, the
  # attempt's own ending settles it.
  - name: start
    try:
      - name: takeOver
        invoke:
          kind: RecordStream.JournalClaim
          journal: !ref turnJournal
        inputs:
          key: !cel "inputs.turnId"
          writer: !cel "steps.attempt.result.writer"
          resume: true
      # A takeover with no error created the key: it was removed and its
      # marker forgotten since the snapshot. The created key is failed as
      # removed, so it never reads as a live turn, and the continue refused.
      - name: recreated
        if: !cel "steps.takeOver.result.error == null"
        then:
          - name: giveBackRemoved
            invoke: !ref releaseAttempt
            inputs:
              turnId: !cel "inputs.turnId"
              writer: !cel "steps.attempt.result.writer"
              failure:
                code: ERR_JOURNAL_KEY_REMOVED
                message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
          - name: refuseRecreated
            throw:
              code: ERR_JOURNAL_KEY_REMOVED
              message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
      # From here the key is this attempt's: a refusal fails it again with the
      # error the takeover reported, so it reads as it did before.
      - name: held
        try:
          # Every record the interrupted attempts wrote, read after the
          # takeover, which kept them.
          - name: records
            invoke: !ref journalRead
            inputs:
              key: !cel "inputs.turnId"
          # A new attempt drops any abort mark: an abort stamps before it
          # cancels, and an attempt that then ended another way leaves the mark
          # behind, which must not make a later cancellation of THIS attempt
          # read as `aborted`. The continue is a change to the conversation,
          # taken only while it is live and unarchived and the turn is not
          # marked removed.
          - name: touch
            invoke:
              kind: Sql.Transaction
              connection: !ref chatDb
              steps:
                kind: Run.Sequence
                inputType:
                  kind: Telo.JsonSchema
                  schema:
                    type: object
                    additionalProperties: false
                    required: [conversationId, turnId]
                    properties:
                      conversationId: { type: string }
                      turnId: { type: string }
                steps:
                  - name: bump
                    invoke: { kind: Sql.Command, connection: !ref chatDb }
                    inputs:
                      sql: |
                        UPDATE conversations
                        SET revision = revision + 1, updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                        WHERE id = ? AND removed_at IS NULL AND archived = 0 AND assembling = 0
                      bindings: [ !cel "inputs.conversationId" ]
                  - name: refused
                    if: !cel "steps.bump.result.rowCount == 0"
                    then:
                      - name: refuse
                        invoke: !ref refuseConversationWrite
                        inputs:
                          conversationId: !cel "inputs.conversationId"
                  - name: unmark
                    invoke: { kind: Sql.Command, connection: !ref chatDb }
                    inputs:
                      sql: "UPDATE turns SET aborted_at = NULL WHERE turn_id = ? AND removed_at IS NULL"
                      bindings: [ !cel "inputs.turnId" ]
                  - name: turnRemoved
                    if: !cel "steps.unmark.result.rowCount == 0"
                    then:
                      - name: refuseRemoved
                        throw:
                          code: ERR_JOURNAL_KEY_REMOVED
                          message: !cel "'Turn ' + inputs.turnId + ' was removed.'"
              inputs:
                conversationId: !cel "inputs.conversationId"
                turnId: !cel "inputs.turnId"
            inputs:
              conversationId: !cel "string(steps.turn.result.conversationId)"
              turnId: !cel "inputs.turnId"
          - name: startAttempt
            invoke: !ref turnLock
            inputs:
              key: !cel "steps.turn.result.conversationId"
              holder: !cel "inputs.turnId"
              inputs:
                conversationId: !cel "steps.turn.result.conversationId"
                turnId: !cel "inputs.turnId"
                lead: !cel >-
                  {'type': 'turn-continued',
                   'note': Self.interruptionNote(steps.records.result.entries.map(e, e.data), steps.takeOver.result.error),
                   'model': variables.model}
                resume: true
                reserved: !cel "steps.reserve.result.reserved"
                writer: !cel "steps.attempt.result.writer"
        catch:
          - name: giveBack
            invoke: !ref releaseAttempt
            inputs:
              turnId: !cel "inputs.turnId"
              writer: !cel "steps.attempt.result.writer"
              # Never null here: `recreated` refused a takeover reporting none.
              failure: !cel >-
                steps.takeOver.result.error != null ? steps.takeOver.result.error
                : {'code': 'ERR_JOURNAL_KEY_REMOVED', 'message': 'Turn ' + inputs.turnId + ' was removed.'}
          - name: raiseHeldFailure
            throw:
              code: !cel "error.code"
              message: !cel "error.message"
              data: !cel "has(error.data) ? error.data : null"
    catch:
      - name: refundFailed
        invoke: !ref budget
        inputs:
          op: settle
          key: "global"
          amount: 0
          reserved: !cel "steps.reserve.result.reserved"
      # Held under another writer: another continue of this turn took it first.
      - name: runningSince
        if: !cel "error.code == 'ERR_JOURNAL_KEY_BUSY'"
        then:
          - name: refuseRunning
            throw:
              code: ERR_TURN_IN_PROGRESS
              message: A turn is already running for this conversation.
              data:
                activeTurnId: !cel "inputs.turnId"
      - name: raiseStartFailure
        throw:
          code: !cel "error.code"
          message: !cel "error.message"
          data: !cel "has(error.data) ? error.data : null"
  # Another turn of this conversation holds the lease: give the key back, then
  # the reservation.
  - name: overlap
    if: !cel "!steps.startAttempt.result.acquired"
    then:
      - name: giveBackOverlap
        invoke: !ref releaseAttempt
        inputs:
          turnId: !cel "inputs.turnId"
          writer: !cel "steps.attempt.result.writer"
          failure: !cel >-
            steps.takeOver.result.error != null ? steps.takeOver.result.error
            : {'code': 'ERR_JOURNAL_KEY_REMOVED', 'message': 'Turn ' + inputs.turnId + ' was removed.'}
      - name: refund
        invoke: !ref budget
        inputs:
          op: settle
          key: "global"
          amount: 0
          reserved: !cel "steps.reserve.result.reserved"
      - name: refuseOverlap
        throw:
          code: ERR_TURN_IN_PROGRESS
          message: A turn is already running for this conversation.
          data:
            activeTurnId: !cel "steps.startAttempt.result.holder"
outputs:
  turnId: !cel "inputs.turnId"
  fromId: !cel "steps.takeOver.result.lastId"
---
# Gives back a failed turn's key that a continue took over but did not start:
# a sink adopts the claim under the same writer and fails the key again with
# `failure` — the error the takeover reported, or the removal a takeover that
# created the key stands for — appending nothing. A key removed meanwhile is
# already gone, which is expected too.
kind: Run.Sequence
metadata: { name: releaseAttempt }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [turnId, writer, failure]
    properties:
      turnId: { type: string }
      writer: { type: string }
      # The error to fail the key with, in the shape a journal read reports.
      failure:
        type: object
        additionalProperties: false
        required: [message]
        properties:
          code: { type: string }
          message: { type: string }
          data: {}
steps:
  - name: records
    invoke:
      kind: Stream.Concat
      sources:
        - invoke: { kind: Stream.Of }
          inputs:
            items: []
        - invoke: !ref raiseRecorded
          inputs:
            code: !cel "context.failure.code"
            message: !cel "context.failure.message"
            data: !cel "'data' in context.failure ? context.failure.data : null"
    inputs:
      context:
        failure: !cel "inputs.failure"
  - name: refail
    try:
      - name: drain
        invoke:
          kind: RecordStream.JournalSink
          journal: !ref turnJournal
        inputs:
          key: !cel "inputs.turnId"
          writer: !cel "inputs.writer"
          input: !cel "steps.records.result.output"
    catch:
      - name: unexpected
        if: !cel "error.code != inputs.failure.code && error.code != 'ERR_JOURNAL_KEY_REMOVED'"
        then:
          - name: reraise
            throw:
              code: !cel "error.code"
              message: !cel "error.message"
              data: !cel "has(error.data) ? error.data : null"
---
# Retention: every conversation not changed since `idleBefore` is deleted
# whole, through the path DELETE /conversations/{id} takes — tombstoned by
# compare-and-set, its turns marked, then each marked turn's key removed (a
# removed turn answers 410 for `retentionDays`) and its rows deleted. Then
# tombstones older than the window are forgotten and one expiry pass forgets
# removal markers past their retention. A branch a crash cut short is a hidden
# (`assembling`) conversation, idle like any other, and goes the same way.
# Every step is safe to repeat, so a sweep a crash cut short is finished by the
# next one.
kind: Run.Sequence
metadata: { name: retentionSweep }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [idleBefore]
    properties:
      idleBefore:
        x-telo-type: Telo.Timestamp
steps:
  - name: idle
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT id FROM conversations
        WHERE removed_at IS NULL AND julianday(updated_at) < julianday(?)
        ORDER BY id
      bindings: [ !cel "string(inputs.idleBefore)" ]
  # The tombstone DELETE writes, one attempt each: a conversation that changed
  # or is running is `busy` this round and swept by a later one.
  - name: tombstones
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.conversations"
      steps:
        - name: tombstone
          invoke: !ref tombstoneConversation
          inputs:
            conversationId: !cel "string(item.id)"
            includeHidden: true
      outputs:
        conversationId: !cel "string(item.id)"
        outcome: !cel "steps.tombstone.result.outcome"
    inputs:
      conversations: !cel "steps.idle.result.rows"
  # Every marked turn — this round's, and a deletion's, a truncation's or a
  # failed branch's a crash cut short. No turn row outlives its conversation
  # row: a branch writes its (hidden) conversation row before any turn.
  - name: leftovers
    invoke: !ref historyRows
    inputs:
      sql: "SELECT turn_id FROM turns WHERE removed_at IS NOT NULL ORDER BY turn_id"
      bindings: []
  - name: cascade
    invoke: !ref cascadeTurns
    inputs:
      turnIds: !cel "steps.leftovers.result.rows.map(r, string(r.turn_id))"
  # A tombstone answers 410 for the retention window, then is forgotten and
  # the conversation answers 404.
  - name: forget
    invoke: { kind: Sql.Command, connection: !ref chatDb }
    inputs:
      sql: "DELETE FROM conversations WHERE removed_at IS NOT NULL AND julianday(removed_at) < julianday(?)"
      bindings: [ !cel "string(inputs.idleBefore)" ]
  - name: expire
    invoke:
      kind: RecordStream.JournalExpiry
      journal: !ref turnJournal
outputs:
  conversations: !cel "size(steps.tombstones.result.filter(t, t.outcome == 'tombstoned'))"
  busy: !cel "steps.tombstones.result.filter(t, t.outcome in ['busy', 'changed']).map(t, t.conversationId)"
---
# The detached turn body — one attempt at a turn, run once admission or a
# continue succeeded. Its whole output is one recorded stream: the attempt's
# lead record first, then a `conversation-title` record when the conversation
# was named, a `context-summary` record when its history was compacted, then
# the preparation and the agent's own parts — so
# everything that can fail is inside the journal, and an attempt that fails
# before the model is reached still ends with its error recorded. The end
# handler projects the turn and settles this attempt's reservation, and the sink
# drains all of it into the journal under the key the caller claimed — a new
# key for a new turn, the same key taken over (`resume`) for a continued one.
kind: Run.Sequence
metadata: { name: turnRunner }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, turnId, lead, resume, reserved, writer]
    properties:
      # The turn body is a trace root — detached from the request that admitted
      # it — so the ids that name the turn ride its span.
      conversationId: { type: string, x-telo-span-attribute: gen_ai.conversation.id }
      turnId: { type: string, x-telo-span-attribute: telo.agent.turn.id }
      # `user-message { content, model }` for a new turn, `turn-continued
      # { note, model }` for a continued one — the model is what decides whether
      # the attempt's provider state may be replayed.
      lead:
        type: object
        required: [type, model]
        properties:
          type: { type: string, enum: [user-message, turn-continued] }
          model: { type: string }
      resume: { type: boolean }
      reserved: { type: integer }
      writer: { type: string }
steps:
  - name: turn
    invoke:
      kind: Stream.Concat
      sources:
        - invoke: { kind: Stream.Of }
          inputs:
            items: !cel "[context.lead]"
        - invoke: !ref nameConversation
          inputs:
            conversationId: !cel "context.conversationId"
            lead: !cel "context.lead"
        - invoke: !ref compactHistory
          inputs:
            conversationId: !cel "context.conversationId"
            turnId: !cel "context.turnId"
        - invoke: !ref agentTurn
          inputs:
            conversationId: !cel "context.conversationId"
            turnId: !cel "context.turnId"
    inputs:
      context:
        conversationId: !cel "inputs.conversationId"
        turnId: !cel "inputs.turnId"
        lead: !cel "inputs.lead"
  - name: ending
    invoke: !ref turnEnd
    inputs:
      input: !cel "steps.turn.result.output"
      context:
        conversationId: !cel "inputs.conversationId"
        turnId: !cel "inputs.turnId"
        reserved: !cel "inputs.reserved"
  - name: sink
    invoke:
      kind: RecordStream.JournalSink
      journal: !ref turnJournal
    inputs:
      key: !cel "inputs.turnId"
      input: !cel "steps.ending.result.output"
      writer: !cel "inputs.writer"
      resume: !cel "inputs.resume"
---
# A conversation's title, while it has none: every NEW turn (never a continued
# attempt) asks the agent's model, at low effort and at most 1024 output
# tokens, to name it from its first user message, then applies the sanitized
# reply only where the title is still null — a title the user set meanwhile
# stays. Its record carries the title, the model and the call's usage; the
# model and usage alone when the title was not applied; or the error it failed
# with — a reply that did not end with `stop` is ERR_TITLE_INCOMPLETE, an empty
# one ERR_TITLE_EMPTY. A failure never fails the turn and the next new turn
# retries. A cancelled turn is not a naming failure.
kind: Run.Sequence
metadata: { name: nameConversation }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, lead]
    properties:
      conversationId: { type: string }
      lead:
        type: object
        required: [type, model]
        properties:
          type: { type: string, enum: [user-message, turn-continued] }
          model: { type: string }
          content: { type: string }
steps:
  - name: conversation
    invoke: !ref historyRows
    inputs:
      sql: "SELECT title IS NULL AS untitled FROM conversations WHERE id = ?"
      bindings: [ !cel "inputs.conversationId" ]
  - name: wanted
    value: !cel >-
      inputs.lead.type == 'user-message'
        && size(steps.conversation.result.rows) > 0 && int(steps.conversation.result.rows[0].untitled) != 0
  - name: name
    if: !cel "steps.wanted.result"
    then:
      # The conversation's first user message: its earliest live turn's, which
      # is this one's own lead when nothing earlier was projected.
      - name: catchUp
        invoke: !ref catchUpProjection
        inputs:
          conversationId: !cel "inputs.conversationId"
      - name: first
        invoke: !ref historyRows
        inputs:
          sql: |
            SELECT m.content FROM messages m JOIN turns t ON t.turn_id = m.turn_id
            WHERE t.conversation_id = ? AND t.removed_at IS NULL AND m.role = 'user'
            ORDER BY m.turn_id, m.seq LIMIT 1
          bindings: [ !cel "inputs.conversationId" ]
      # Its first 4000 code points, cut by a regex (which matches code points);
      # four runs of 1000, RE2's largest repeat count.
      - name: message
        value: !cel >-
          cel.bind(text, size(steps.first.result.rows) > 0
              ? Self.contentText(parseJson(steps.first.result.rows[0].content))
              : has(inputs.lead.content) ? inputs.lead.content : '',
            regexExtract(text, '(?s)^.{0,1000}.{0,1000}.{0,1000}.{0,1000}'))
      - name: attempt
        try:
          - name: call
            invoke:
              kind: Ai.Text
              model: !ref bufferedModel
              system: >-
                You name conversations. Reply with a title of at most six words for
                the conversation that begins with the user's message. Reply with
                the title alone: no quotes, no trailing period, nothing else.
            inputs:
              prompt: !cel "steps.message.result"
              options:
                maxOutputTokens: 1024
          # A reply cut short is not a title, however its first line reads.
          - name: incomplete
            if: !cel "steps.call.result.finishReason != 'stop'"
            then:
              - name: refuseIncomplete
                throw:
                  code: ERR_TITLE_INCOMPLETE
                  message: !cel >-
                    'The naming call ended before its reply was complete (finish reason `'
                      + steps.call.result.finishReason + '`; a title may take at most 1024 output tokens).'
          - name: title
            value: !cel "Self.titleOf(steps.call.result.text)"
          - name: empty
            if: !cel "steps.title.result == ''"
            then:
              - name: refuseEmpty
                throw:
                  code: ERR_TITLE_EMPTY
                  message: The model's reply held no usable title.
          - name: apply
            invoke: { kind: Sql.Command, connection: !ref chatDb }
            inputs:
              sql: |
                UPDATE conversations
                SET title = ?, revision = revision + 1, updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
                WHERE id = ? AND title IS NULL AND removed_at IS NULL AND assembling = 0
              bindings:
                - !cel "steps.title.result"
                - !cel "inputs.conversationId"
        catch:
          - name: cancelled
            if: !cel "error.code == 'ERR_INVOKE_CANCELLED'"
            then:
              - name: propagate
                throw:
                  code: !cel "error.code"
                  message: !cel "error.message"
          - name: failure
            value:
              code: !cel "error.code"
              message: !cel "error.message"
  # A failure after the call returned still carries that call's usage, which
  # the turn is charged. A title the update did not apply — the conversation
  # was named meanwhile — is left out: the record then carries the call's model
  # and usage alone, so a `title` in it is always one the conversation took.
  - name: emit
    invoke: { kind: Stream.Of }
    inputs:
      items: !cel >-
        has(steps.failure)
          ? [has(steps.call)
              ? dyn({'type': 'conversation-title', 'error': steps.failure.result,
                     'model': inputs.lead.model, 'usage': steps.call.result.usage})
              : dyn({'type': 'conversation-title', 'error': steps.failure.result})]
          : has(steps.apply)
            ? [steps.apply.result.rowCount > 0
                ? dyn({'type': 'conversation-title', 'title': steps.title.result,
                       'model': inputs.lead.model, 'usage': steps.call.result.usage})
                : dyn({'type': 'conversation-title', 'model': inputs.lead.model, 'usage': steps.call.result.usage})]
            : []
outputs:
  output: !cel "steps.emit.result.output"
---
# Context compaction, at the start of every attempt: when the conversation's
# latest live turn up to this one reported a context (its last model call's
# prompt plus completion tokens) of at least `maxContextTokens`, the history
# before this turn — the latest summary plus the live turns after the turn it
# covers — is split: the longest run of newest turns holding at most a quarter
# of its bytes stays raw, and everything older is summarized, the previous
# summary included, by one call to the agent's model at low effort, capped at
# `maxContextTokens / 8` output tokens (at least 1: `maxContextTokens` is at
# least 8). The summary rides this turn's `context-summary` record; nothing
# to cover means no call. A failed call fails
# the turn with ERR_CONTEXT_COMPACTION_FAILED (its cause in `data.cause`),
# which a continue retries: a reply that did not end with `stop`
# (ERR_SUMMARY_INCOMPLETE) or is empty (ERR_SUMMARY_EMPTY) is first journaled
# as a `context-summary` carrying `error`, `model` and `usage` and no
# `summary`. A cancellation propagates as it is.
kind: Run.Sequence
metadata: { name: compactHistory }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, turnId]
    properties:
      conversationId: { type: string }
      turnId: { type: string }
steps:
  - name: catchUp
    invoke: !ref catchUpProjection
    inputs:
      conversationId: !cel "inputs.conversationId"
  - name: measured
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT p.context_tokens FROM turns t JOIN turn_projections p ON p.turn_id = t.turn_id
        WHERE t.conversation_id = ? AND t.removed_at IS NULL AND t.turn_id <= ? AND p.context_tokens IS NOT NULL
        ORDER BY t.turn_id DESC LIMIT 1
      bindings:
        - !cel "inputs.conversationId"
        - !cel "inputs.turnId"
  - name: previous
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT p.summary, p.summary_through, length(CAST(p.summary AS BLOB)) AS bytes
        FROM turns t JOIN turn_projections p ON p.turn_id = t.turn_id
        WHERE t.conversation_id = ? AND t.removed_at IS NULL AND t.turn_id <= ? AND p.summary IS NOT NULL
        ORDER BY t.turn_id DESC LIMIT 1
      bindings:
        - !cel "inputs.conversationId"
        - !cel "inputs.turnId"
  - name: since
    value: !cel "size(steps.previous.result.rows) > 0 ? string(steps.previous.result.rows[0].summary_through) : ''"
  - name: sizes
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT t.turn_id,
               COALESCE(SUM(length(CAST(m.content AS BLOB)) + COALESCE(length(CAST(m.tool_calls AS BLOB)), 0)), 0) AS bytes
        FROM turns t LEFT JOIN messages m ON m.turn_id = t.turn_id
        WHERE t.conversation_id = ? AND t.removed_at IS NULL AND t.turn_id > ? AND t.turn_id < ?
        GROUP BY t.turn_id ORDER BY t.turn_id
      bindings:
        - !cel "inputs.conversationId"
        - !cel "steps.since.result"
        - !cel "inputs.turnId"
  # `cover` is how many of the oldest turns the summary takes: all but the
  # longest suffix whose bytes are at most a quarter of the history's.
  - name: plan
    value: !cel >-
      cel.bind(bytes, steps.sizes.result.rows.map(r, int(r.bytes)),
        cel.bind(total, (size(bytes) == 0 ? 0 : int(sum(bytes)))
            + (size(steps.previous.result.rows) > 0 ? int(steps.previous.result.rows[0].bytes) : 0),
          cel.bind(cover, range(size(bytes) + 1).filter(k,
              k == size(bytes) || int(sum(slice(bytes, k, size(bytes)))) * 4 <= total)[0],
            {
              'compact': size(steps.measured.result.rows) > 0
                && int(steps.measured.result.rows[0].context_tokens) >= int(variables.maxContextTokens)
                && cover > 0,
              'through': cover > 0 ? string(steps.sizes.result.rows[cover - 1].turn_id) : ''
            })))
  - name: summarize
    if: !cel "steps.plan.result.compact"
    then:
      - name: covered
        invoke: !ref historyRows
        inputs:
          sql: |
            SELECT m.role, m.content, m.tool_calls FROM messages m JOIN turns t ON t.turn_id = m.turn_id
            WHERE t.conversation_id = ? AND t.removed_at IS NULL AND t.turn_id > ? AND t.turn_id <= ?
            ORDER BY m.turn_id, m.seq
          bindings:
            - !cel "inputs.conversationId"
            - !cel "steps.since.result"
            - !cel "steps.plan.result.through"
      # `int(...)`: an integer variable forwarded through an import arrives as a
      # double at runtime.
      - name: cap
        value: !cel "int(variables.maxContextTokens) / 8"
      - name: attempt
        try:
          - name: call
            invoke:
              kind: Ai.Text
              model: !ref bufferedModel
              system: >-
                You summarize conversations for an assistant that authors Telo
                manifests and will continue this one from your summary alone. Write
                what the user asked for and decided, every fact they supplied (names,
                identifiers, columns, credentials' env var names — never a secret's
                value), which files exist and what each does, what was checked or
                run and with what result, and what is still open. Keep exact names,
                paths and versions. Plain prose and lists; no preamble.
            inputs:
              prompt: !cel >-
                Self.transcriptOf(size(steps.previous.result.rows) > 0
                    ? dyn(string(steps.previous.result.rows[0].summary)) : null,
                  steps.covered.result.rows.map(r, {'role': string(r.role), 'content': string(r.content),
                    'tool_calls': r.tool_calls == null ? null : dyn(string(r.tool_calls))}))
              options:
                maxOutputTokens: !cel "steps.cap.result"
          # A summary cut short would replace the turns it covers with part of
          # what they held, so only a reply that ended with `stop` is one.
          - name: incomplete
            if: !cel "steps.call.result.finishReason != 'stop'"
            then:
              - name: refuseIncomplete
                throw:
                  code: ERR_SUMMARY_INCOMPLETE
                  message: !cel >-
                    'The summary call ended before its reply was complete (finish reason `'
                      + steps.call.result.finishReason + '`; a summary may take at most '
                      + string(steps.cap.result) + ' output tokens).'
          - name: empty
            if: !cel "steps.call.result.text.trim() == ''"
            then:
              - name: refuseEmpty
                throw:
                  code: ERR_SUMMARY_EMPTY
                  message: The model's reply held no summary.
        catch:
          - name: cancelled
            if: !cel "error.code == 'ERR_INVOKE_CANCELLED'"
            then:
              - name: propagate
                throw:
                  code: !cel "error.code"
                  message: !cel "error.message"
          - name: failure
            value:
              code: !cel "error.code"
              message: !cel "error.message"
  # The record first, then the failure: a call that returned is journaled with
  # its usage — charged, and in `tokens` — before the turn fails, and one the
  # provider refused writes nothing. A failure in a later source ends the
  # stream after the records already yielded.
  - name: emit
    invoke:
      kind: Stream.Concat
      sources:
        - invoke: { kind: Stream.Of }
          inputs:
            items: !cel "context.records"
        - invoke:
            kind: Run.Sequence
            inputType:
              kind: Telo.JsonSchema
              schema:
                type: object
                additionalProperties: false
                required: [failed, cause]
                properties:
                  failed: { type: boolean }
                  cause:
                    type: object
                    additionalProperties: false
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
            steps:
              - name: failed
                if: !cel "inputs.failed"
                then:
                  - name: raise
                    throw:
                      code: ERR_CONTEXT_COMPACTION_FAILED
                      message: !cel "'Compacting this conversation\\'s history failed: ' + inputs.cause.message"
                      data:
                        cause:
                          code: !cel "inputs.cause.code"
                          message: !cel "inputs.cause.message"
              - name: none
                invoke: { kind: Stream.Of }
                inputs:
                  items: []
            outputs:
              output: !cel "steps.none.result.output"
          inputs:
            failed: !cel "context.failed"
            cause: !cel "context.cause"
    inputs:
      context:
        records: !cel >-
          !steps.plan.result.compact ? []
            : has(steps.failure)
              ? (has(steps.call)
                  ? [dyn({'type': 'context-summary', 'throughTurnId': steps.plan.result.through,
                          'error': steps.failure.result, 'model': variables.model,
                          'usage': steps.call.result.usage})]
                  : [])
              : [dyn({'type': 'context-summary', 'throughTurnId': steps.plan.result.through,
                      'summary': steps.call.result.text.trim(), 'model': variables.model,
                      'usage': steps.call.result.usage})]
        failed: !cel "has(steps.failure)"
        cause: !cel "has(steps.failure) ? steps.failure.result : {'code': '', 'message': ''}"
outputs:
  output: !cel "steps.emit.result.output"
---
# The agent's part of a turn, invoked only once the lead record is journaled:
# catch the projection up (the lead record included), replay it as the model's
# history, and stream the agent. Returns the agent's stream.
kind: Run.Sequence
metadata: { name: agentTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId, turnId]
    properties:
      conversationId: { type: string }
      turnId: { type: string }
steps:
  - name: catchUp
    invoke: !ref catchUpProjection
    inputs:
      conversationId: !cel "inputs.conversationId"
  # The latest summary up to this turn — this turn's own when this attempt
  # compacted: the history starts from it.
  - name: summary
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT t.turn_id AS host, p.summary, p.summary_through
        FROM turns t JOIN turn_projections p ON p.turn_id = t.turn_id
        WHERE t.conversation_id = ? AND t.removed_at IS NULL AND t.turn_id <= ? AND p.summary IS NOT NULL
        ORDER BY t.turn_id DESC LIMIT 1
      bindings:
        - !cel "inputs.conversationId"
        - !cel "inputs.turnId"
  - name: readHistory
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT CASE
                 WHEN tool_calls IS NOT NULL
                   THEN json_object('role', role, 'content', json(content), 'toolCalls', json(tool_calls))
                 WHEN tool_call_id IS NOT NULL
                   THEN json_object('role', role, 'content', json(content), 'toolCallId', tool_call_id)
                 ELSE json_object('role', role, 'content', json(content))
               END AS message
        FROM messages WHERE conversation_id = ? AND turn_id > ? ORDER BY turn_id, seq
      bindings:
        - !cel "inputs.conversationId"
        - !cel "size(steps.summary.result.rows) > 0 ? string(steps.summary.result.rows[0].summary_through) : ''"
  # The reasoning the conversation last recorded, replayed only to the model
  # that produced it: another model cannot read it. This turn's own counts — a
  # continued turn's interrupted attempt recorded the latest. Never state from
  # before the latest summary: it continues a history the summary replaced (a
  # turn that compacted after recording state projects none).
  - name: previous
    invoke: !ref historyRows
    inputs:
      sql: |
        SELECT provider_state, provider_model FROM turn_projections
        WHERE conversation_id = ? AND turn_id <= ? AND turn_id >= ? AND provider_state IS NOT NULL
        ORDER BY turn_id DESC LIMIT 1
      bindings:
        - !cel "inputs.conversationId"
        - !cel "inputs.turnId"
        - !cel "size(steps.summary.result.rows) > 0 ? string(steps.summary.result.rows[0].host) : ''"
  # What is already in the workspace, handed to the agent rather than left for it
  # to remember to look up. It asked "new app, or change an existing one?" against
  # an EMPTY workspace — a question the runtime can answer for free and exactly,
  # and one that reads as not having looked. A tool the model must remember to
  # call is a tool it sometimes will not; a message in the turn is not.
  #
  # The same exclude set the `list_dir` tool fixes, so the two agree about what
  # the workspace contains.
  - name: listWorkspace
    invoke: !ref listDir
    inputs:
      path: ""
      recursive: true
      exclude: [".telo", "node_modules", ".git", "dist", ".probes", ".telo-agent"]
  - name: ask
    invoke: !ref author
    inputs:
      # What the file tools checkpoint under; never shown to the model.
      context:
        turnId: !cel "inputs.turnId"
      providerState: !cel >-
        size(steps.previous.result.rows) > 0
          && steps.previous.result.rows[0].provider_state != null
          && steps.previous.result.rows[0].provider_model == variables.model
          ? parseJson(steps.previous.result.rows[0].provider_state)
          : null
      # Both blocks are per-turn READINGS: the workspace listing moves whenever
      # the agent writes, and the clock moves always. Neither can ride the
      # `system:` block, which is a literal resolved once at load — a date
      # stamped there would be the BOOT date for the life of the process.
      #
      # APPENDED as a user turn, not prepended as a system one, and that is a
      # cost decision rather than a stylistic one. The provider hoists EVERY
      # system message into the request's `instructions` string wherever it sits,
      # so a per-turn system message puts a moving value at the head of the
      # prompt — and the head is the cacheable prefix. One clock tick there
      # re-prices the whole system prompt, uncached, on every turn of every
      # conversation, including a pure question that writes nothing. At the tail
      # they are ordinary input: `instructions` stays byte-identical across
      # turns, and the history in front of them caches too.
      #
      # They read at least as well here — this is the state as of now, stated
      # after the request it applies to. UTC, stated as UTC: a report's
      # boundaries may well want the user's own zone, and that is a question to
      # ask rather than a guess to bury in an offset.
      messages: !cel >-
        (size(steps.summary.result.rows) > 0
          ? [{'role': 'user', 'content': 'CONVERSATION SUMMARY: ' + string(steps.summary.result.rows[0].summary)}]
          : [])
        + steps.readHistory.result.rows.map(r, parseJson(r.message)) + [{
          'role': 'user',
          'content': 'CURRENT TIME: ' + nowIso() + ' (UTC). Resolve every relative period the user names — "last week", "this month", "since Friday" — against this, and say which absolute range you resolved it to. Never guess a date, and where the boundaries depend on the user timezone, ask.'
        }, {
          'role': 'user',
          'content': size(steps.listWorkspace.result.entries) == 0
            ? 'WORKSPACE STATE: the workspace is EMPTY — it contains no files at all. Anything you build is therefore new; do not ask whether to create something new or extend something existing.'
            : 'WORKSPACE STATE: the workspace contains these paths (caches and vendor directories omitted). Read them before asking anything they already answer.\n' +
              join(steps.listWorkspace.result.entries.map(e, '- ' + e.path + (e.type == 'directory' ? '/' : '')), '\n')
        }]
outputs:
  output: !cel "steps.ask.result.output"
