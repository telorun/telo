# `telo check` reports this here; a consumer's check sees nothing, so there the
# resource refuses itself when the application boots.
kind: Telo.Library
metadata:
  name: McpResourceTemplateUnnamed
  version: 1.0.0
  description: Test fixture exporting a resource entry whose template has an expression naming no variable.
imports:
  Mcp: ../../../../../
  Run: ../../../../../../run
exports:
  resources: [First]
---
kind: Run.Value
metadata: { name: answer }
value:
  text: ok
---
kind: Mcp.Resources
metadata: { name: First }
entries:
  - uriTemplate: "empty://{}/y"
    name: Entry
    handler: !ref answer
    inputs: {}
    result:
      contents:
        - { uri: "note://a", text: !cel "result.text" }
