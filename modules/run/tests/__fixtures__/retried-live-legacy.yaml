# The DEPRECATED bare-count spelling of the same policy. Every manifest published
# before `retry:` existed carries it, so leaving it unannotated would leave the
# spelling most manifests in the wild still use silently unchecked.
kind: Telo.Application
metadata:
  name: RetriedLiveLegacy
  version: 1.0.0
imports:
  Run: ../../
  Stream: ../../../stream
  Http: ../../../http-client
targets:
  - !ref seq
---
kind: Http.Request
metadata: { name: upload }
retries: 3
---
kind: Run.Sequence
metadata: { name: seq }
steps:
  - name: source
    inputs:
      items: [a, b]
    invoke:
      kind: Stream.Of
  - name: post
    inputs:
      url: http://example.test/upload
      method: POST
      body: !cel "steps.source.result.output"
    invoke: !ref upload
