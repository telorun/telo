  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/heb.traineddata.gz:
        { upstream: heb, member: package/4.0.0_best_int/heb.traineddata.gz, sha256: 9c70b524200dae77fb25e3567566eee600ccbcae9aeb89722990ccae0e84e805, executable: false }
---
kind: TesseractModel.Language
metadata:
  name: heb
  description: Hebrew, Hebrew script
code: heb
data: !module-path ./tessdata/heb.traineddata.gz
