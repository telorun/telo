kind: Telo.Application
metadata:
  name: CanUseCrud
  version: 1.0.0
imports:
  Sql: ../../sql
  SQLite: ../../sqlite
  SqlRepository: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref appSchema
  - !ref testCrud
---
kind: SQLite.Connection
metadata:
  name: db
file: ":memory:"
---
kind: SQLite.Table
metadata:
  name: users
table: users
columns:
  id: { type: integer, primaryKey: true, identity: always }
  name: { type: text, nullable: false }
---
kind: SQLite.Schema
metadata:
  name: appSchema
connection: !ref db
version: !cel "module.version"
tables: [!ref users]
---
kind: SqlRepository.Create
metadata:
  name: insertUser
connection: !ref db
table: !ref users
---
kind: SqlRepository.Read
metadata:
  name: getUsers
connection: !ref db
table: !ref users
---
kind: SqlRepository.Delete
metadata:
  name: deleteUser
connection: !ref db
table: !ref users
---
kind: Run.Sequence
metadata:
  name: testCrud
steps:
  - name: insert
    inputs:
      data:
        name: Alice
    invoke: !ref insertUser

  - name: read
    inputs:
      filters: {}
    invoke: !ref getUsers

  - name: assertRead
    inputs:
      rows: "${{ steps.read.result.rows }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          rows:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                name:
                  const: Alice

  - name: delete
    inputs:
      filters:
        name: Alice
    invoke: !ref deleteUser

  - name: readAfterDelete
    inputs:
      filters: {}
    invoke: !ref getUsers

  - name: assertEmpty
    inputs:
      rows: "${{ steps.readAfterDelete.result.rows }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          rows:
            type: array
            maxItems: 0
