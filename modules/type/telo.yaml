# DEPRECATED — use the kernel built-in `Telo.JsonSchema` instead.
#
# Declaring a data shape stopped being optional once every kind could carry an
# invocation contract: an author writing `inputType:` should not have to import a
# module first, and a library declaring its own contract should not have to
# import one purely to describe itself. So `JsonSchema` moved into the kernel
# alongside the mandatory log sinks, on the same reasoning — a capability every
# conforming runtime must provide does not belong in an installable module.
#
# This module remains, unchanged in behaviour, so published manifests that import
# it keep resolving. `kind: Type.JsonSchema` and `kind: Telo.JsonSchema` accept
# the same fields and produce the same registrations; new manifests should write
# the built-in and drop the import.
kind: Telo.Library
metadata:
  name: Type
  version: "0.12.0"
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Data]
  description: >-
    Reusable data shapes declared once and referenced anywhere a type is
    expected: a call's inputs or results, a request body, a model's output. Shapes
    inherit from one another, and CEL rules express invariants that JSON Schema alone
    cannot, each failing with its own error code.
  # No `replacedBy`: the replacement is a kernel built-in, and a module-level
  # replacement names another MODULE ref. The reason carries the instruction.
  deprecated:
    reason: >-
      Superseded by the kernel built-in `Telo.JsonSchema`, which is identical and
      needs no import. Write `kind: Telo.JsonSchema` and drop this dependency.
exports:
  kinds:
    - JsonSchema
---
# DEPRECATED — use `kind: Telo.JsonSchema`, which is identical and built in.
#
# This is now a pure ALIAS: it inherits the built-in's controller by delegation
# and declares no implementation of its own. Two copies of the same controller
# would have had to be kept identical by hand forever, in a module nobody has a
# reason to open again.
kind: Telo.Definition
metadata:
  name: JsonSchema
  description: >-
    Declares a named data shape as JSON Schema, optionally inheriting from other
    named shapes, with CEL rules for the invariants schema cannot state. Each rule
    carries an error code reported when data violates it.
  # Alias-qualified, so the hub resolves it to a linkable target. `Telo.` names a
  # kernel built-in, which resolves to no owning module ref.
  deprecated:
    reason: Identical to the kernel built-in, which needs no import.
    replacedBy: Telo.JsonSchema
extends: Telo.JsonSchema
