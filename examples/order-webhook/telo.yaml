kind: Telo.Application
metadata:
  name: OrderWebhook
  version: 1.0.0
  categories: [Transport, Reliability, Scheduling]
  description: |
    A webhook receiver that survives the things webhooks actually do to you:
    forged deliveries, redelivery, bursts, and work that must not block the response.

    The server checks each delivery's HMAC signature before the body is parsed.
    Providers retry until they get a 2xx, so the same delivery arrives more than
    once: `Idempotency.Once` claims the delivery id, runs the body at most once and
    replays the stored result for every retry. The reply reports `fresh` or
    `replayed`, so you can watch it happen. Fulfilment is not done inline: the
    handler records a pending row and a `Schedule.Interval` drains the queue in
    the background, so the provider gets its 202 immediately.

    Run, then sign and send the same delivery twice:
        body='{"deliveryId":"dlv_1","orderId":"ord_1","amountCents":4999,"currency":"EUR"}'
        sig=$(printf %s "$body" | openssl dgst -sha256 -hmac local-dev-secret | cut -d' ' -f2)
        curl -s -XPOST localhost:8099/webhooks/orders -H 'content-type: application/json' \
          -H "x-signature: sha256=$sig" -d "$body"
    The first reply says "fresh", the second "replayed" - and only one order row
    exists. A delivery with a wrong signature is a 401. Watch stdout for the
    sweeper shipping it.
requires:
  # 0.98.0: the database file is a host path, and 0.97.0 refuses the
  # expression at the in-repo sqlite's `file`.
  # 0.128.0: `Telo.Sequence`, which an older analyzer reads as UNDEFINED_KIND.
  # 0.133.0: `Telo.OpenUrl`.
  telo: ">=0.133.0"
imports:
  Http: oci://ghcr.io/telorun/http-server@0.47.0#sha256-1t54RaeyhLB_eBqp0334LcGWF2TDAdfaV2n_MVQD76A
  AuthSignature: oci://ghcr.io/telorun/auth-signature@0.2.0#sha256-xMI9RZ_1UQmfJeF28AXlyo6XuXvvnxu0JGdKcStWJVY
  Sql: oci://ghcr.io/telorun/sql@0.31.5#sha256-RQrmaix7-he4wzjCTZbaqeULSf7LQFcWwJaRadTIdYU
  SQLite: oci://ghcr.io/telorun/sqlite@0.16.0#sha256-5VSa5D5dIm88NoMDGqqytSk7mk_GsdfBSxejnNTuYHI
  Idempotency: oci://ghcr.io/telorun/idempotency@0.13.1#sha256-IVAiUM_2unMTmV-vT10wLVEYYNwh1kukPWPVIxB72pc
  KvStore: oci://ghcr.io/telorun/kv-store-memory@0.8.3#sha256-p183toK3ilaEAcXujwcf1d0F5-eD6Eu_jVkAXX5EA7A
  Schedule: oci://ghcr.io/telorun/scheduler@0.12.4#sha256-NZ5UJ4q52A8xsurxAxhyximQDGurMjvLlDMH-Oiqvzc
  Console: oci://ghcr.io/telorun/console@0.19.6#sha256-VyoTKRcqFJDNAj1fqj1shTiapLN3VbZxYC1KGaAY5F4
targets:
  - !ref migrate
  - !ref server
  - { name: openDocs, invoke: !ref openDocs, inputs: { url: !interpolate "http://localhost:${{ ports.http }}/docs/" } }
  - !ref sweeper
ports: { http: { env: PORT, protocol: tcp, default: 8099 } }
variables:
  sweepEvery: { env: SWEEP_EVERY, type: string, default: "3s" }
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: { name: Telo.HostPath, entry: file }
    default: orders.db
secrets: { webhookSecret: { env: WEBHOOK_SECRET, type: string, default: local-dev-secret } }
---
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.dbFile"
---
kind: SQLite.Schema
metadata: { name: migrate }
connection: !ref db
tables:
  - kind: SQLite.Table
    table: orders
    columns:
      order_id: { type: text, primaryKey: true }
      amount_cents: { type: integer, nullable: false }
      currency: { type: text, nullable: false }
      received_at: { type: text, nullable: false, defaultExpression: "datetime('now')" }
  - kind: SQLite.Table
    table: fulfilments
    columns:
      id: { type: integer, primaryKey: true, identity: always }
      order_id: { type: text, nullable: false }
      status: { type: text, nullable: false, default: pending }
      sent_at: { type: text }
---
kind: Sql.Command
metadata: { name: exec }
connection: !ref db
---
kind: Sql.Query
metadata: { name: query }
connection: !ref db
---
kind: Http.Api
metadata: { name: webhookRoutes }
routes:
  - request:
      path: /orders
      method: POST
      schema:
        body:
          type: object
          additionalProperties: false
          required: [deliveryId, orderId, amountCents, currency]
          properties:
            deliveryId: { type: string, minLength: 1 }
            orderId: { type: string, minLength: 1 }
            amountCents: { type: integer, minimum: 1 }
            currency: { type: string, minLength: 3, maxLength: 3 }
    maxBodyBytes: 16384
    # Where the idempotency keys live is the store: swap it for kv-store-redis and the
    # guarantee survives a restart and spans every replica. claimTtl bounds a crashed
    # in-flight attempt; ttl is how long a completed delivery stays replayable.
    handler:
      kind: Idempotency.Once
      store: { kind: KvStore.Store }
      claimTtl: "30s"
      ttl: "24h"
      invoke:
        kind: Telo.Sequence
        inputType:
          kind: Telo.JsonSchema
          schema:
            type: object
            required: [orderId, amountCents, currency]
            properties: { orderId: { type: string }, amountCents: { type: integer }, currency: { type: string } }
        steps:
          - name: insertOrder
            invoke: !ref exec
            inputs:
              sql: "INSERT INTO orders (order_id, amount_cents, currency) VALUES (?, ?, ?)"
              bindings: [!cel "inputs.orderId", !cel "inputs.amountCents", !cel "inputs.currency"]
          - name: enqueueFulfilment
            invoke: !ref exec
            inputs:
              sql: "INSERT INTO fulfilments (order_id) VALUES (?)"
              bindings: [!cel "inputs.orderId"]
        outputs:
          orderId: !cel "inputs.orderId"
    inputs:
      key: !cel "request.body.deliveryId"
      inputs:
        orderId: !cel "request.body.orderId"
        amountCents: !cel "request.body.amountCents"
        currency: !cel "request.body.currency"
    returns:
      - status: 202
        content:
          application/json:
            # `fresh` the first time, `replayed` for every redelivery.
            body: { orderId: !cel "result.result.orderId", state: !cel "result.state" }
    # `telo check` knows what the handler can throw and refuses to compile a
    # route that leaves one of those codes unrendered, ERR_CLAIM_LOST included.
    catches:
      # The claim lapsed mid-flight, so the delivery is not recorded as done.
      # A 5xx is the honest answer: it tells the provider to send it again.
      - when: !cel "error.code == 'ERR_CLAIM_LOST'"
        status: 503
        headers: { Retry-After: "5" }
        content: { application/json: { body: { error: retry_later } } }
      # The signature check raises its refusal into the route; a catch-all would
      # otherwise render it as a 500.
      - when: !cel "error.code == 'ERR_HTTP_UNAUTHENTICATED'"
        status: 401
        content: { application/json: { body: { error: unauthorized } } }
      - status: 500
        content: { application/json: { body: { error: !cel "error.code" } } }
---
kind: Http.Server
metadata: { name: server }
listen: { port: !cel "ports.http" }
openapi: { info: { title: Order webhook, version: 1.0.0 } }
mounts:
  - path: /webhooks
    mount: !ref webhookRoutes
    authentication:
      verifiers:
        - verifier:
            kind: AuthSignature.Verifier
            keys:
              - { subject: orders, algorithm: hmac-sha256, secret: !cel "secrets.webhookSecret" }
          from:
            kind: Http.FromBodySignature
            scheme: Signature
            signature: { header: x-signature, pattern: "sha256=([0-9a-f]+)", encoding: hex }
            base: [{ type: body }]
  - path: /docs
    mount: { kind: Http.Reference }
    authentication: { anonymous: allow }
---
# The background half. Same app, no queue broker, no worker process: a schedule
# is a resource, so it is declared beside the route it drains for.
kind: Schedule.Interval
metadata: { name: sweeper }
every: !cel "duration(variables.sweepEvery)"
invoke:
  kind: Telo.Sequence
  steps:
    - name: pending
      invoke: !ref query
      inputs:
        sql: "SELECT id, order_id FROM fulfilments WHERE status = 'pending' ORDER BY id LIMIT 20"
        bindings: []
    - name: ship
      if: !cel "size(steps.pending.result.rows) > 0"
      then:
        - name: mark
          invoke: !ref exec
          inputs:
            sql: "UPDATE fulfilments SET status = 'sent', sent_at = CURRENT_TIMESTAMP WHERE status = 'pending'"
            bindings: []
        - name: report
          invoke: !ref Console.writeLine
          inputs:
            output: !interpolate "{dim shipped ${{ size(steps.pending.result.rows) }} fulfilment(s)}"
---
kind: Telo.OpenUrl
metadata: { name: openDocs }
