                    headers: { type: object, additionalProperties: true }
                    params: { type: object, additionalProperties: true }
                    path: { type: string }
                    host: { type: string, description: "The request's host, lowercased and without its port — from X-Forwarded-Host only behind a trusted proxy." }
                    cookies: { type: object, additionalProperties: { type: string }, description: "The request's cookies by name, the first of a repeated name, each value as sent." }
                    lang: { type: string, description: "The language negotiated for the request: a served language tag, always present." }
                    method: { type: string }
                    ip: { type: string }
                    principal: { description: "The authenticated caller, as the mounts reaching this route authenticate it; null where anonymous callers are allowed.", x-telo-context-from-referrer: request/principal, type: [object, "null"], x-telo-context-nullable-when: { at: "0/authentication/anonymous", equals: [allow], absent: false } }
          maxBodyBytes:
            title: Max Body Bytes
            description: >-
              Largest request body this route accepts, in bytes. Replaces the
