modules:
  apps/hub: Added
body: "The hub tracks the built-in vocabulary every telo release publishes, at
  BUILTINS_REF (default oci://ghcr.io/telorun/telo), registered on every boot before
  SEED_REFS: a Telo.Builtins root is indexed (root kind Builtins, no runtime facts) and
  registrable there and refused with INGEST_ROOT_KIND_UNSUPPORTED anywhere else. Search
  hits and list_libraries entries from it carry builtin: true. get_kinds takes a telo
  version and reads every built-in at it (the latest tracked by default), heads the
  vocabulary's own kinds with a no-import line, closes every answer over the schema
  fragments, value types, zone attributes and formats it names, and refuses an untracked
  version (ERR_UNKNOWN_TELO_VERSION); its telo argument is a release as telo --version
  prints it, never an X+unreleased build, whose built-ins come from that CLI's telo
  builtins. Need types are indexed as kinds, with the runtime reach the CLI reports for
  them (the kernels serving need types, nodejs today), so a runtime filter selects them;
  an extends or replacedBy prefix of Telo resolves to BUILTINS_REF and a module's own
  name to the module, where Telo used to leave the ref empty. Ingest revision 9
  re-ingests every tracked version once."
