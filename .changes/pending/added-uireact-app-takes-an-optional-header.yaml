modules:
  modules/ui-react: Added
body: "UiReact.App takes an optional header: { start, end } of Ui.Node lists, drawn on
  every page (the not-found page included) before the title and after the navigation, in
  the new header-start and header-end parts. Header nodes travel in the application
  document and are resolved as a page's own nodes: when and leaf values evaluated per
  request over request, texts translated, composites provided, and the headers they read
  joining Vary; no browser root is in scope there. The renderer's layout draws both
  parts as wrapping rows with the end pushed to the inline end, and the default theme
  styles them."
