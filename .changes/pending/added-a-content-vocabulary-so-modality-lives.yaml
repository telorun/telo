modules:
  modules/ai: Added
body: "A content vocabulary, so modality lives in the parts rather than in kind names:
  `Ai.ContentPart` covers text, image, audio, video and file plus the output-only
  tool-call, reasoning, citation and refusal, each media part carrying bytes or a URI
  with a media type. A model returning a picture is an image part in an ordinary
  completion, not a different kind of model. `Ai.StreamPart`, `Ai.Message`,
  `Ai.ToolCall`, `Ai.TokenUsage` and `Ai.Usage` are declared once and referenced,
  replacing a message shape that was restated verbatim in four consumers' inputTypes.
  `providerState` is opaque state replayed verbatim on the next request, which is what
  lets reasoning survive a tool loop."
