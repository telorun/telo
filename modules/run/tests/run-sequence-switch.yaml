kind: Telo.Application
metadata:
  name: RunSequenceSwitch
  version: 1.0.0
imports:
  Run: ../
  Assert: ../../assert
targets:
  - !ref testSwitch
---
kind: Run.Sequence
metadata:
  name: testSwitch
steps:
  # --- switch: matching case executes, others do not ---
  - name: routeToB
    switch: "${{ 'b' }}"
    cases:
      a:
        # Would fail if reached.
        - name: branchA
          inputs:
            x: 1
          invoke:
            kind: Assert.Schema
            schema:
              type: object
              properties:
                x:
                  const: 0
      b:
        - name: branchB
          inputs:
            matched: "b"
          invoke:
            kind: Assert.Schema
            schema:
              type: object
              properties:
                matched:
                  const: "b"
      c:
        # Would fail if reached.
        - name: branchC
          inputs:
            x: 1
          invoke:
            kind: Assert.Schema
            schema:
              type: object
              properties:
                x:
                  const: 0

  - name: verifyBranchB
    inputs:
      result: "${{ steps.branchB.result }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            const: true

  # --- switch: no match falls through to default ---
  - name: routeToDefault
    switch: "${{ 'unknown' }}"
    cases:
      known:
        # Would fail if reached.
        - name: knownCase
          inputs:
            x: 1
          invoke:
            kind: Assert.Schema
            schema:
              type: object
              properties:
                x:
                  const: 0
    default:
      - name: defaultCase
        inputs:
          matched: "default"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              matched:
                const: "default"

  - name: verifyDefault
    inputs:
      result: "${{ steps.defaultCase.result }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            const: true

  # --- switch: data-driven dispatch ---
  - name: computeRole
    invoke:
      kind: Run.Value
      value:
        role: "admin"

  - name: routeByRole
    switch: "${{ steps.computeRole.result.role }}"
    cases:
      admin:
        - name: adminAction
          inputs:
            role: "${{ steps.computeRole.result.role }}"
          invoke:
            kind: Assert.Schema
            schema:
              type: object
              properties:
                role:
                  const: "admin"
      viewer:
        # Would fail if reached.
        - name: viewerAction
          inputs:
            x: 1
          invoke:
            kind: Assert.Schema
            schema:
              type: object
              properties:
                x:
                  const: 0

  - name: verifyAdminAction
    inputs:
      result: "${{ steps.adminAction.result }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            const: true

  # --- switch inside if: nesting ---
  - name: nested
    if: "${{ true }}"
    then:
      - name: innerSwitch
        switch: "${{ 'x' }}"
        cases:
          x:
            - name: nestedMatch
              inputs:
                val: "x"
              invoke:
                kind: Assert.Schema
                schema:
                  type: object
                  properties:
                    val:
                      const: "x"

  - name: verifyNested
    inputs:
      result: "${{ steps.nestedMatch.result }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            const: true
