# `self.n` in a template body step's `value:` with `n` declared `integer`: typed
# int at check and bound as an int64 at run, so `self.n * 10` checks and runs.
kind: Telo.Application
metadata: { name: TemplateSelfValueInteger }
imports: { Assert: ../../../../modules/assert }
targets: [!ref verify]
---
kind: Telo.Definition
metadata: { name: Scale }
capability: Telo.Invocable
schema: { type: object, properties: { n: { type: integer } }, required: [n] }
resources:
  - kind: Telo.Sequence
    metadata: { name: scaling }
    steps:
      - name: scaled
        value: !cel "self.n * 10"
    outputs:
      scaled: !cel "steps.scaled.result"
invoke: !ref scaling
---
kind: Telo.Sequence
metadata: { name: verify }
steps:
  - { name: scale, invoke: { kind: Self.Scale, n: 4 } }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.scale.result"
      expected: { scaled: 40 }
