# Two whole-document choices sharing a name write the same refused expression
# at the same place: each declaration reports its own finding where it is
# taken, and the two meet as one, wherever either holds.
kind: Telo.Application
metadata: { name: AlternativesMerge }
variables:
  flag1: { env: FLAG_1, type: boolean, default: false }
  flag2: { env: FLAG_2, type: boolean, default: false }
---
kind: Telo.Definition
metadata: { name: Counter }
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./probe.mjs#Probe]
schema: { type: object, properties: { count: { type: integer, x-telo-eval: compile } } }
---
!if
metadata: { name: counter }
if: !cel "variables.flag1"
then:
  kind: Self.Counter
  count: !cel "'text'"
---
!if
metadata: { name: counter }
if: !cel "variables.flag2"
then:
  kind: Self.Counter
  count: !cel "'text'"
