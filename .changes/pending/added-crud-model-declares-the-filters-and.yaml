modules:
  modules/crud: Added
body: "Crud.Model declares the filters and sorts its list accepts, in a required query
  block: query.filters, each a property with one operator, and query.sort. Breaking:
  every Crud.Model must add query (empty lists accept none), and the list route refuses
  whatever it does not declare with a 400 naming the parameter. A filter whose property
  and operator are not a declared pair answers 'is not a filter this collection
  accepts', replacing the unknown-property, unknown-operator and operator-does-not-apply
  messages; a sort by an unlisted property answers 'is not a property this collection
  sorts by'. id is no longer filterable or sortable unless declared; reading one record
  by its key is unaffected. Four rules hold query within the read shape:
  CRUD_MODEL_FILTER_UNKNOWN_PROPERTY, CRUD_MODEL_FILTER_OPERATOR_UNSUPPORTED,
  CRUD_MODEL_SORT_UNKNOWN_PROPERTY and CRUD_MODEL_SORT_UNSUPPORTED. Crud.Model is a
  Ui.Collection, and Crud.Ui shows exactly the declared filters and sortable columns
  instead of one filter per scalar property."
