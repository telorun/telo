# A try step's `when:` that produces a string, not a boolean. The value is `dyn`, so only the runtime can refuse it.
kind: Telo.Application
metadata:
  name: TryWhenDyn
  version: 1.0.0
imports:
  Run: ../../../../modules/run
variables:
  settings:
    env: SETTINGS
    type: object
    default: { flag: "false" }
targets:
  - !ref pick
---
kind: Run.Sequence
metadata: { name: pick }
steps:
  - name: guarded
    when: !cel "variables.settings.flag"
    try:
      - name: inner
        value: 1
