# The foreign key names another table resource than the target's, and both
# store the table `authors`.
kind: Telo.Library
metadata:
  name: CrudCollectionRelationForeignKeySameTable
  version: 1.0.0
  description: Test fixture exporting a collection whose foreign key and relation name one physical table through two table resources.
imports:
  Crud: ../../../../../
  SQLite: ../../../../../../sqlite
exports:
  resources: [collection]
---
kind: Telo.JsonSchema
metadata: { name: AuthorDraft }
schema: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string } } }
---
kind: Telo.JsonSchema
metadata: { name: Author }
extends: AuthorDraft
schema: { type: object, required: [id], properties: { id: { type: integer } } }
---
kind: SQLite.Table
metadata: { name: authorsTable }
table: authors
columns:
  id: { type: integer, primaryKey: true }
  name: { type: text }
---
kind: SQLite.Table
metadata: { name: authorsKeys }
table: authors
columns:
  id: { type: integer, primaryKey: true }
---
kind: Crud.Collection
metadata: { name: authors }
model: !ref Author
table: !ref authorsTable
schemas: { list: !ref Author, create: !ref AuthorDraft, update: !ref AuthorDraft }
query: { filters: [{ property: id, operator: in }], sort: [] }
---
kind: Telo.JsonSchema
metadata: { name: PostDraft }
schema:
  type: object
  required: [title]
  additionalProperties: false
  properties: { title: { type: string }, authorId: { type: integer } }
---
kind: Telo.JsonSchema
metadata: { name: Post }
extends: PostDraft
schema: { type: object, required: [id], properties: { id: { type: integer } } }
---
kind: SQLite.Table
metadata: { name: postsTable }
table: posts
columns:
  id: { type: integer, primaryKey: true }
  title: { type: text }
  author_id: { type: integer }
foreignKeys:
  author: { columns: [author_id], references: { table: !ref authorsKeys, columns: [id] } }
---
kind: Crud.Collection
metadata: { name: collection }
model: !ref Post
table: !ref postsTable
schemas: { list: !ref Post, create: !ref PostDraft, update: !ref PostDraft }
query: { filters: [], sort: [] }
relations: { authorId: { collection: !ref authors } }
