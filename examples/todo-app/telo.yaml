kind: Telo.Application
metadata:
  name: TodoApp
  version: 1.0.0
  categories: [ Transport, Storage ]
  description: |
    A complete app served as one unit: the REST todo API and the vanilla HTML/JS
    frontend that consumes it (Http.Static), on a single port. The whole REST
    surface is one declarative Crud.Resource — list / read / create / update /
    delete over the `todos` table — mounted alongside the static frontend.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.25.0#sha256-k1n8gCdP8LEwtp1xcm_DcxGk85YLbb2RrPCl6B30TUQ
  Sql: oci://ghcr.io/telorun/sql@0.21.0#sha256-aasWNQP3KaWbJaFZVg_Zzp0efD4k7rc0FaImt6aHE-k
  SQLite: oci://ghcr.io/telorun/sql-sqlite@0.7.0#sha256-0Yg6NzMGDXyPRnbRLMrEwsF10MKHMZyO1mirH3frvRI
  Crud: oci://ghcr.io/telorun/crud@0.9.0#sha256-mhAY-K234E-y-ROkKtHxIjwKHlHVfkyjq8N-fvC2CYY
targets:
  - !ref migrate
  - !ref server
# Ship the frontend into the published module artifact so `Http.Static root:
# ./public` resolves after `telo publish` / install, not just locally.
files:
  - public/app.js
  - public/index.html
  - public/style.css
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8077
---
kind: SQLite.Connection
metadata:
  name: db
file: ./todo.db
---
kind: Sql.Migrations
metadata:
  name: migrate
connection: !ref db
migrations:
  0001_create_todos:
    statement: |
      CREATE TABLE IF NOT EXISTS todos (
        id         INTEGER PRIMARY KEY AUTOINCREMENT,
        text       TEXT    NOT NULL,
        is_done    BOOLEAN NOT NULL DEFAULT FALSE,
        created_at DATETIME DEFAULT CURRENT_TIMESTAMP
      )
---
kind: Http.Server
metadata:
  name: server
port: !cel "ports.http"
openapi:
  info:
    title: Todo API
    version: 1.0.0
mounts:
  - path: /api/todos
    mount:
      # The entire REST API: CRUD over the `todos` table. Mounted at /api/todos, it
      # serves GET / (list), GET /{id}, POST /, PUT /{id}, DELETE /{id}.
      kind: Crud.Resource
      connection: !ref db
      plural: todos
      singular: todo
      # The model is the request contract too: a POST without `text`, or with a
      # property that isn't here, is rejected with a 400 before the database is
      # touched. `isDone` reads and writes the snake_case column `is_done`.
      model:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [ text ]
          additionalProperties: false
          properties:
            text: { type: string, minLength: 1 }
            isDone: { type: boolean }

  - path: /
    mount: !ref ui
---
kind: Http.Static
metadata:
  name: ui
root: ./public
