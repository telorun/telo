kind: Telo.Application
metadata:
  name: PgEnumBoots
  version: 5.0.0
  description: |
    Boot 5 — a second type is declared, and a table OUTSIDE this schema is created
    to use it.

    The outside table is what makes the next boot's refusal real rather than
    hypothetical: a type this schema owns can be depended on by something it does
    not, which is the case a drop has to survive.

    A type referenced by no DECLARED table is legal — `enums:` is what says the
    schema owns it, not the columns. Deriving ownership from the columns instead
    is what would make deleting the last column that used a type silently
    un-declare it.
imports:
  Sql: ../../../../../sql
  Postgres: ../../../../
  Run: ../../../../../run
  Assert: ../../../../../assert
variables:
  dbHost: { env: DB_HOST, type: string, default: localhost }
  dbPort: { env: DB_PORT, type: integer, default: 5432 }
  dbUser: { env: DB_USER, type: string, default: postgres }
  dbPassword: { env: DB_PASSWORD, type: string, default: postgres }
  dbName: { env: DB_NAME, type: string, default: postgres }
targets:
  - !ref appSchema
  - !ref test
---
kind: Postgres.Connection
metadata: { name: db }
connectionString: !cel >-
  'postgres://' + variables.dbUser + ':' + variables.dbPassword + '@' +
  variables.dbHost + ':' + string(variables.dbPort) + '/' + variables.dbName
---
kind: Postgres.Enum
metadata: { name: messageRole }
typeName: message_role
values: [system, user, assistant]
---
kind: Postgres.Enum
metadata: { name: messageStatus }
typeName: message_status
values: [draft, sent]
---
kind: Postgres.Table
metadata: { name: messages }
table: messages
columns:
  id: { type: bigint, primaryKey: true, identity: always }
  role: { type: !ref messageRole, nullable: false }
  body: { type: text }
---
kind: Postgres.Schema
metadata: { name: appSchema }
connection: !ref db
schema: telo_pg_enum_boots
version: !cel "module.version"
enums: [!ref messageRole, !ref messageStatus]
tables: [!ref messages]
migrations:
  20260101_outside_consumer:
    statements:
      - "CREATE SCHEMA IF NOT EXISTS telo_pg_enum_boots_other"
      - >-
        CREATE TABLE IF NOT EXISTS telo_pg_enum_boots_other.audit (
          id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          status telo_pg_enum_boots.message_status NOT NULL
        )
reclaim: { afterVersions: 1, afterDuration: 0ms }
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: readTypes
    invoke: !ref query
    inputs:
      sql: >-
        SELECT t.typname AS name FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'telo_pg_enum_boots' AND t.typtype = 'e'
        ORDER BY t.typname
  - name: assertTypes
    invoke: !ref assertTypes
    inputs:
      actual: !cel "steps.readTypes.result.rows"
      expected:
        - { name: message_role }
        - { name: message_status }
---
kind: Sql.Query
metadata: { name: query }
connection: !ref db
---
kind: Assert.Equals
metadata: { name: assertTypes }
