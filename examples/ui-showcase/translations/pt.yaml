  # Actions.
  - { text: A bare button, translation: Um botão sozinho }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "Um modelo de entrada sem propriedades desenha só o botão. Este desbloqueia todas as tarefas bloqueadas de TEL-42, e as contagens de tarefas e a tabela de TEL-42 mais abaixo são lidas de novo." }
  - { text: Unblock TEL-42, translation: Desbloquear TEL-42 }
  - { text: An answer drawn from the result, translation: Uma resposta desenhada a partir do resultado }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "A rota soma as estimativas das tarefas abertas de um projeto. Os campos são os do modelo de entrada, em duas seções, com o projeto escolhido na coleção de projetos e o ritmo em um controle deslizante; o que é informado fica guardado no endereço. A resposta é desenhada abaixo do botão: frases sobre o resultado e o registro enviado, a data em que o trabalho estaria concluído e uma lista das horas por rótulo." }
  - { text: What to count, translation: O que contar }
  - { text: How fast, translation: Com que rapidez }
  - { text: Estimate, context: verb, translation: Estimar }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} não tem trabalho em aberto."
        one: "{$hours} h em {$tasks} tarefa aberta de {$project}"
        other: "{$hours} h em {$tasks} tarefas abertas de {$project}"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation:
      plural: weeks
      cases:
        one: "Cerca de {$weeks} semana a {$pace} h por semana, concluído até"
        other: "Cerca de {$weeks} semanas a {$pace} h por semana, concluído até"
  - { text: By label, translation: Por rótulo }
  - { text: When it fails, translation: Quando falha }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "Uma árvore de falha própria da ação, desenhada sobre o erro e o registro enviado. Atribua a tarefa 4 a james@northwind.example e dá certo. Deixe o e-mail em branco, ou informe alguém de fora da equipe, e a recusa vai para o campo; a tarefa 999 responde 404, e tomas@northwind.example, que saiu, 409." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "Esta ação lê a resposta da rota de estimativa como um número de dias, que a rota não fornece: a resposta é recusada pelo modelo de saída da ação, e a árvore de falha dela diz isso." }
  - { text: Estimate in days, translation: Estimar em dias }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: a resposta não é a que este botão lê." }
  - { text: Where a success goes, translation: Para onde vai um sucesso }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "A primeira responde com a página que lista as tarefas de um projeto, e o aplicativo vai para lá. A segunda responde com a página inicial da equipe, um endereço https que substitui a página." }
  - { text: Open its tasks, translation: Abrir suas tarefas }
  - { text: Visit the homepage, translation: Visitar a página inicial }
  - { text: Reading again after a success, translation: Ler de novo após um sucesso }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "Mover uma tarefa lê de novo tanto as contagens abaixo, um leitor, quanto a tabela de TEL-42 mais abaixo. A resposta nomeia a tarefa e seu novo status." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: {$todo} a fazer, {$doing} em andamento, {$review} em revisão, {$done} concluídas, {$blocked} bloqueadas." }
  - { text: Move, translation: Mover }
  - { text: "Task {$id}, {$title}, is now", translation: "A tarefa {$id}, {$title}, agora está" }
  - { text: One press after another, translation: Um clique após o outro }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "Os comentários são enviados um após o outro, na ordem em que o botão é pressionado, por mais rápido que seja. O botão espera três caracteres e diz por quê; escolher outra tarefa limpa a última resposta. Os comentários listados no final são lidos de novo depois de cada um." }
  - { text: Add the comment, translation: Adicionar o comentário }
  - { text: Write three characters or more., translation: Escreva três caracteres ou mais. }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        one: "O comentário {$id} é o primeiro da tarefa {$title}."
        other: "Comentário {$id} adicionado à tarefa {$title}, que agora tem {$count} comentários."
  - { text: Row actions on a table, translation: Ações de linha em uma tabela }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "Cada tarefa de TEL-42 oferece três botões, e cada um é substituído pela sua resposta depois de pressionado. Iniciar é executado na hora, só em uma tarefa ainda a fazer. Fechar pergunta antes e não é oferecido em uma tarefa concluída. Atribuir abre uma caixa de diálogo para o e-mail, que a linha não fornece, e mostra a recusa do servidor no seu campo." }
  - { text: Number, translation: Número }
  - { text: Start, context: verb, translation: Iniciar }
  - { text: Closed, translation: Fechado }
  - { text: Close this task?, translation: Fechar esta tarefa? }
  - { text: Already started., translation: Já iniciada. }
  - { text: Already finished., translation: Já concluída. }
  - { text: Assign, translation: Atribuir }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} foi atribuída a {$assignee}." }
  - { text: "Task {$id} is unchanged.", translation: "A tarefa {$id} não foi alterada." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: Ações de linha em uma lista }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "Os comentários mais recentes, uma lista que um leitor desenha, com os fixados primeiro. Fixar é executado na hora em um comentário ainda não fixado, Excluir pergunta antes, e Editar pede o novo texto em uma caixa de diálogo; deixá-lo vazio é recusado no seu campo. A lista é lida de novo depois de cada ação." }
  - { text: Latest comments, translation: Comentários mais recentes }
  - { text: Pin, translation: Fixar }
  - { text: Already pinned., translation: Já fixado. }
  - { text: Delete this comment?, translation: Excluir este comentário? }
  - { text: Rewrite this comment?, translation: Reescrever este comentário? }
  - { text: More places a success goes, translation: Outros lugares para onde vai um sucesso }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "A primeira adiciona uma tarefa e vai para a página de tabelas, um endereço escrito no manifesto. A segunda responde com o endereço do manual, um arquivo que o servidor serve sob o ponto de montagem, o que é um carregamento comum. A terceira responde com o espelho da equipe, um endereço que o navegador lê como outro host: não navega para lugar nenhum, e a resposta diz isso." }
  - { text: Add it and open the tables, translation: Adicionar e abrir as tabelas }
  - { text: Open the handbook, translation: Abrir o manual }
  - { text: Open the mirror, translation: Abrir o espelho }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "A resposta foi {$mirror}, que não é um endereço para onde ir, então a página continua." }
  - { text: "Refused, and unanswered", translation: "Recusado e sem resposta" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "Só um gerente pode pausar um projeto. Sem sessão, a proteção responde 401. Conectado na página Dados como james@northwind.example, que não é gerente, a rota responde 403 sem corpo; conectado como ada@northwind.example, ela pausa o projeto e recusa, no idioma da página, um projeto que não está em andamento. A árvore de falha padrão da ação desenha cada recusa." }
  - { text: Pause the project, translation: Pausar o projeto }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "{$code} não está em andamento, então não pode ser pausado." }
  - { text: "{$name} is paused.", translation: "{$name} foi pausado." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "Esta rota manda toda requisição de volta para si mesma, então o navegador desiste e nenhuma resposta chega. A árvore de falha diz isso: o erro não traz status." }
  - { text: Call a route that never answers, translation: Chamar uma rota que nunca responde }
  - { text: "The route answered, with the status", translation: "A rota respondeu, com o status" }
  - { text: "No answer arrived, so there is no status.", translation: "Nenhuma resposta chegou, então não há status." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: Ações de linha que leem o endereço }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "A tabela lista as tarefas do projeto que o endereço nomeia, e Mover envia uma tarefa para o status que o endereço nomeia, lido da consulta da tabela no momento em que é pressionado. A linha e o endereço vinculam todos os campos da movimentação, então a caixa de diálogo dela não pergunta nada e é uma simples confirmação. Escolha um projeto e um status:" }
  - { text: TEL-42 into review, translation: TEL-42 para revisão }
  - { text: APP-5 to finished, translation: APP-5 para concluído }
  - { text: OPS-7 back to in progress, translation: OPS-7 de volta para em andamento }
  - { text: Neither, translation: Nenhum }
  - { text: Moved to, translation: Movida para }
  - { text: Move this task to the status the address names?, translation: Mover esta tarefa para o status que o endereço nomeia? }
  - { text: Choose a status above first., translation: Escolha um status acima primeiro. }

  # Components.
  - { text: A component on the page, translation: Um componente na página }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "Um componente escrito em TSX e fornecido por uma biblioteca deste exemplo, posicionado com propriedades fixas. Ele usa tudo o que o host lhe dá: mostra onde a página está, guarda no endereço qual painel está aberto, vai para outra página por navigate e por um link a partir de href, e tem um endereço https recusado. Lê a situação de TEL-42 e adiciona uma tarefa com fetch, avisa que as tarefas mudaram com notifyChanged — então a tabela abaixo é lida de novo — e conta cada mudança de que fica sabendo com onChanged, incluindo as edições e exclusões da própria tabela. Uma tarefa que ele adiciona é anunciada em uma camada própria no canto da página." }
  - { text: A component in a cell, translation: Um componente em uma célula }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "A coluna de prioridade é desenhada por um componente que recebe a prioridade de cada linha e se a tarefa está bloqueada. A tabela lista as tarefas de TEL-42 da mesma coleção em que o componente escreve, então é lida de novo quando uma tarefa é adicionada acima; as edições e exclusões dela chegam ao componente." }
  - { text: Its stylesheet, translation: Sua folha de estilos }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "Os códigos-fonte dos componentes importam uma folha de estilos própria, que o aplicativo coloca na camada telo.component: depois do tema e da marca, antes da folha de estilos do próprio aplicativo. Cada valor nela lê um token de design, então o painel e o medidor assumem a aparência de cada ponto de montagem." }

  # CRUD.
  - { text: A generated admin screen, translation: Uma tela administrativa gerada }
  - { text: "One declaration over the tasks collection the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the collection, so the screen offers exactly what the API accepts.", translation: "Uma única declaração sobre o modelo de tarefas a partir do qual a API é servida: uma barra de filtros, uma tabela paginada e ordenável, um formulário para adicionar uma tarefa e outro para alterá-la, e uma exclusão com confirmação em cada linha. As colunas, os campos e os filtros são todos derivados do modelo, então a tela oferece exatamente o que a API aceita." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "A barra fica ao lado da tabela na borda final e mostra só os filtros que você escolhe, cada um como um chip que abre seu controle. Ela guarda a escolha neste navegador sob a chave aside — a chave da barra ao lado da tabela na página Filtros, então um filtro escolhido em qualquer uma das páginas fica escolhido nas duas." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "Uma nova tarefa abre em uma gaveta a partir da borda final e fica aberta, esvaziada, para a próxima. Uma tarefa é alterada em um painel ao lado da lista, que faz parte do endereço, e sair dele com dados não salvos pergunta antes." }

  # Related records.
  - { text: "Related records", translation: "Registos relacionados" }
  - { text: "Posts and their authors", translation: "As publicações e os seus autores" }
  - { text: "Each post names its author by key. The author column shows the author's name instead, read in one request for every author on the page, and the bar's author filter offers every author by name. The create and edit forms pick the author from a list of authors, searched by name.", translation: "Cada publicação indica o seu autor pela chave. A coluna do autor mostra em vez disso o nome do autor, lido num único pedido para todos os autores da página, e o filtro de autor da barra oferece cada autor pelo nome. Os formulários de criação e edição escolhem o autor de uma lista de autores, pesquisada pelo nome." }
  - { text: "Only the authors with posts", translation: "Só os autores com publicações" }
  - { text: "These filters offer only the authors and the statuses present among the posts the other filters leave, each with how many posts it has. The posts are drawn as cards, and as a list below the breakpoint, loading more as you reach the end.", translation: "Estes filtros oferecem só os autores e os estados presentes entre as publicações que os outros filtros deixam, cada um com quantas publicações tem. As publicações são desenhadas como cartões, e abaixo do ponto de quebra como uma lista, que carrega mais ao chegar ao fim." }
  - { text: "On a board by status", translation: "Num quadro por estado" }
  - { text: "One column per status, each read and counted on its own. Drag a card to another column, or move it from its menu, to change its status; every list of posts on the page reads again.", translation: "Uma coluna por estado, cada uma lida e contada por si. Arraste um cartão para outra coluna, ou mova-o pelo seu menu, para mudar o estado; todas as listas de publicações da página são lidas de novo." }
  - { text: "On a calendar", translation: "Num calendário" }
  - { text: "The posts on the day each is published, a month at a time; the month shown reads every post dated in it. A post with no date is not on the calendar.", translation: "As publicações no dia em que cada uma é publicada, um mês de cada vez; o mês mostrado lê todas as publicações datadas nele. Uma publicação sem data não está no calendário." }
  - { text: "The authors", translation: "Os autores" }
  - { text: "The authors' own screen, generated from their collection. It reads the same address the posts' author filter and picker read, so an author added here is offered there at once.", translation: "O ecrã próprio dos autores, gerado a partir da sua coleção. Lê o mesmo endereço que o filtro e o seletor de autor das publicações leem, por isso um autor adicionado aqui é oferecido lá de imediato." }
  - { text: "Reporting lines as a tree", translation: "Hierarquia em árvore" }
  - { text: "Each person names who they report to, a relation of the people to themselves. The tree reads the people who report to nobody first, and a person's reports when they are opened. The form picks the manager from the same people.", translation: "Cada pessoa indica a quem reporta, uma relação das pessoas consigo mesmas. A árvore lê primeiro as pessoas que não reportam a ninguém, e os subordinados de uma pessoa quando é aberta. O formulário escolhe o responsável entre as mesmas pessoas." }
  # The labels of the related-records page's models.
  - { text: "Author", translation: "Autor" }
  - { text: "Draft", translation: "Rascunho" }
  - { text: "Published", translation: "Publicado" }
  - { text: "Published on", translation: "Publicado em" }
  - { text: "Reports to", translation: "Reporta a" }
  - { text: "Post", translation: "Publicação" }

  # Themes.
  - { text: Four mounts of one design, translation: Quatro pontos de montagem de um design }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "As mesmas páginas são servidas quatro vezes, e cada aplicativo nomeia seu próprio tema, marca e navegação. As páginas são um único conjunto de visões, posicionadas por referência nos quatro, então só a aparência e a navegação mudam." }
  - { text: At the root, translation: Na raiz }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "A aparência embutida, com a folha de estilos própria deste exemplo por cima, e uma marca escolhida a cada requisição: o conjunto de tokens Acme enquanto um cookie o pedir; caso contrário, os valores do próprio tema." }
  - { text: Under /radix, translation: Em /radix }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "O tema Radix: sua folha de estilos e seus treze controles — as listas de escolha, caixas de diálogo, gavetas, balões, menus e dicas — com a marca deixada a cargo do tema." }
  - { text: Under /brand, translation: Em /brand }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "Um tema próprio deste exemplo: os controles do Radix sob uma folha de estilos escrita aqui, com valores de tokens próprios. A marca do aplicativo é um conjunto de tokens, que traz a fonte Inter que o tema nomeia." }
  - { text: Under /sidebar, translation: Em /sidebar }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "A aparência embutida com a navegação em uma barra lateral ao lado da página, que se recolhe em um trilho e lembra seus grupos abertos. No celular, vira uma barra de abas ao longo da borda inferior." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "Um link é resolvido sob o ponto de montagem em que é desenhado, então os links entre os pontos de montagem e a troca de marca ficam na página Temas do aplicativo raiz." }
  - { text: Every design token, translation: Todos os tokens de design }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "Cada token do conjunto fechado como o tema e a marca desta página o definem, lido da propriedade personalizada para a qual o renderizador o projeta, com uma amostra desenhada nele. Abra outro ponto de montagem, ou troque a marca na raiz, e os valores mudam." }
  - { text: Typefaces, translation: Fontes }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "As fontes do corpo e dos títulos em cada um dos seus quatro estilos e, para cada estilo, se este aplicativo o serve. Em /brand, são os estilos regular, negrito, itálico e negrito itálico da Inter, que vêm com o exemplo e são servidos com a página; os outros dois pontos de montagem não servem nenhum e desenham com as fontes do próprio visitante." }
  - { text: Switch the mount or the brand, translation: Trocar o ponto de montagem ou a marca }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "Estes links são do próprio aplicativo: um link é resolvido sob o ponto de montagem em que é desenhado, então só o aplicativo na raiz alcança os outros dois. Cada um é um carregamento comum de outro aplicativo." }
  - { text: Open the Radix mount, translation: Abrir o ponto de montagem Radix }
  - { text: Open the brand mount, translation: Abrir o ponto de montagem da marca }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "A marca deste aplicativo é escolhida a cada requisição. A troca define ou remove um cookie e volta para cá, e enquanto o cookie existir, o conjunto de tokens Acme é usado no lugar dos valores do próprio tema." }
  - { text: Use the Acme brand, translation: Usar a marca Acme }
  - { text: "Use the theme's own values", translation: "Usar os valores do próprio tema" }

