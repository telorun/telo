                  default: false
            else:
              properties:
                nullable:
                  default: true
        properties:
          type:
            title: Type
            description: PostgreSQL type — a storage class, or a reference to an enum this schema
              declares. Parameters are structured fields (`length`, `precision`, `scale`), never
              spelled into this value, so nothing has to parse a type back apart.
            oneOf:
              - title: Storage class
                type: string
                enum:
                  - text
                  - varchar
                  - char
                  - citext
                  - uuid
                  - json
                  - jsonb
                  - boolean
                  - smallint
                  - integer
                  - bigint
                  - numeric
                  - real
                  - doublePrecision
                  - date
                  - time
                  - timestamp
                  - timestamptz
                  - interval
                  - bytea
                  - inet
                  - cidr
                  - macaddr
                  - tsvector
                x-telo-schema-map:
                  text:
                    type: string
                  varchar:
                    type: string
                  char:
                    type: string
                  citext:
                    type: string
                  uuid:
                    type: string
                  json: {}
                  jsonb: {}
                  boolean:
                    type: boolean
                  smallint:
                    type: integer
                  integer:
                    type: integer
                  bigint:
                    type: integer
                  numeric:
                    type: number
                  real:
                    type: number
                  doublePrecision:
                    type: number
                  date:
                    type: string
                  time:
                    type: string
                  timestamp:
                    type: string
                  timestamptz:
                    type: string
                  interval:
                    type: string
                  bytea:
                    x-telo-type: Telo.Bytes
                  inet:
                    type: string
                  cidr:
                    type: string
                  macaddr:
                    type: string
                  tsvector:
                    type: string
              - title: Enum type
