# A journal keeping ended keys for less than no time: refused by `telo check` at
# the declaration, and by the controller when the resource is created.
kind: Telo.Library
metadata:
  name: RetentionNegative
imports:
  RecordStream: ../../..
exports:
  resources: [journal]
---
kind: RecordStream.Journal
metadata: { name: journal }
store: { kind: RecordStream.MemoryJournalStore }
retention: "-1s"
