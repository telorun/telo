kind: Telo.Application
metadata:
  name: ChatAssumesUi
  version: 1.0.0
  description: |
    Live integration test: an application request that never mentions a
    screen still gets one. The request settles everything else — the records,
    the store, no auth, no tests — and says to build without asking, so the
    only open decision is the one the agent must take by default. It drives the
    chat library with a real Anthropic model against the live hub, drains the
    turn's records and asserts that the agent asked nothing, wrote a
    `UiReact.App` through `write_file` or `edit_file`, and left the files with
    a clean check.

    The counterpart is asks-before-building.yaml, whose answers ask for "an
    HTTP API only — no UI" and which asserts that no screen is written: the
    pair pins "a UI unless the user says otherwise", since either alone is
    satisfied by an agent that always or never builds one. Skips silently when
    ANTHROPIC_API_KEY is unset; with the key it needs the deployed hub (telo.sh)
    and ghcr.io for module resolution, or the run fails.
secrets:
  anthropicApiKey:
    env: ANTHROPIC_API_KEY
    type: string
    default: ""
variables:
  # This case owns its workspace and starts from an empty one.
  workspaceDir:
    env: ASSUMES_UI_WORKSPACE_DIR
    type: string
    x-telo-type: Telo.HostPath
    default: ./workspace/assumes-ui
  stateDir:
    env: ASSUMES_UI_STATE_DIR
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/assumes-ui
imports:
  Mcp: ../../../../modules/mcp-client
  Chat:
    source: ../
    resources:
      hub: !ref hub
    secrets:
      anthropicApiKey: !cel "secrets.anthropicApiKey"
    needs:
      agentState: { path: !cel "variables.stateDir" }
    variables:
      workspaceDir: !cel "variables.workspaceDir"
      # The agent's commands run from the workspace, two levels below the root.
      teloProgram: [bun, ../../cli/nodejs/bin/telo.ts]
  Fs: ../../../../modules/fs
  Stream: ../../../../modules/stream
  Run: ../../../../modules/run
  Assert: oci://ghcr.io/telorun/assert@0.22.0#sha256-72ysePrZIFbPDsX6TdpS4vCuzCnGCx_KVDUunxJ_0OU
targets:
  # Before ensureWorkspace, which creates the directory this removes.
  - !ref cleanWorkspace
  - !ref Chat.ensureWorkspace
  - !ref Chat.initSchema
  - !ref testAssumesUi
---
kind: Mcp.HttpClient
metadata: { name: hub }
url: https://telo.sh/mcp
clientInfo: { name: authoring-agent-test, version: 0.0.0 }
---
kind: Run.Sequence
metadata: { name: cleanWorkspace }
steps:
  - name: clean
    try:
      - name: remove
        inputs:
          path: !cel "string(variables.workspaceDir)"
          recursive: true
        invoke: { kind: Fs.FileRemoval }
    catch:
      # A first run has no directory to remove, which `Fs.FileRemoval` reports
      # with its message ending `(ENOENT)`; any other failure stops the test.
      - name: notAbsent
        if: !cel "!error.message.endsWith('(ENOENT)')"
        then:
          - name: rethrow
            throw: { code: !cel "error.code", message: !cel "error.message" }
---
kind: Run.Sequence
metadata: { name: testAssumesUi }
steps:
  - name: runIfKey
    if: !cel "secrets.anthropicApiKey != ''"
    then:
      - name: conversation
        invoke: !ref Chat.createConversation
      - name: chat
        invoke: !ref Chat.chatStart
        inputs:
          conversationId: !cel "steps.conversation.result.conversation.id"
          idempotencyKey: ""
          clientIp: test-runner
          message: |
            Build an expense tracker under apps/expenses. An expense has a
            description, an amount and the date it was spent. Keep them in an
            SQLite file named by an EXPENSES_DB env var (default expenses.db).
            No auth and no tests. Nothing else needs deciding: build it now,
            without asking.
      - name: read
        invoke: !ref Chat.journalSource
        inputs:
          key: !cel "steps.chat.result.turnId"
          fromId: 0
      - name: drain
        invoke: { kind: Stream.Collect }
        inputs:
          input: !cel "steps.read.result.output"
      - name: reply
        value: !cel "steps.drain.result.items.filter(r, r.data.type == 'text-delta').map(r, r.data.delta).join('')"
      - name: calls
        value: !cel >-
          steps.drain.result.items.filter(r, r.data.type == 'tool-call').map(r, r.data.toolCall)
      # `checks` is every verdict the write, edit and check tools returned, in
      # order: the last one is the state the agent left the files in.
      - name: assertBuiltScreen
        invoke: { kind: Assert.Equals }
        inputs:
          actual:
            askedQuestions: !cel "steps.reply.result.contains('telo-questions')"
            wroteScreen: !cel >-
              steps.calls.result.exists(c,
                (c.name == 'write_file' && string(c.arguments.content).contains('UiReact.App'))
                || (c.name == 'edit_file' && string(c.arguments.newString).contains('UiReact.App')))
            lastCheck: !cel >-
              cel.bind(checks, steps.drain.result.items.filter(r, r.data.type == 'tool-result'
                    && has(r.data.toolResult.output) && type(r.data.toolResult.output) == type({})
                    && 'checkExitCode' in r.data.toolResult.output)
                  .map(r, int(r.data.toolResult.output.checkExitCode)),
                size(checks) == 0 ? -1 : checks[size(checks) - 1])
          expected:
            askedQuestions: false
            wroteScreen: true
            lastCheck: 0
