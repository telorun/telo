kind: Telo.Application
metadata:
  name: UiSpecShapesTest
  version: 1.0.0
  description: |
    A shape of the vocabulary that holds another checks it: a markdown node's value binding, a surface spec's
    compact surface, whether the surface floats or sits in the page, and the
    surface of the page a listing node's create press opens, a button's call with no
    prompt and no effects, a filter placement's overlay and its
    compact placement, and the placement and the store of a filters node. A
    wrong nested value is refused where it
    is written, and refused again by the contract of whatever provides it when
    a value reaches that unchecked.
imports:
  Echo: ./__fixtures__/spec-echo
  Probe: ./__fixtures__/probe
  Assert: ../../assert
targets:
  - !ref written
  - !ref provided
---
kind: Assert.Manifest
metadata: { name: written }
source: ./__fixtures__/invalid/spec-shapes/telo.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedSurface/overlayCompact: /spec/compact must NOT have additional properties ('address' is not allowed)"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedSurface/panelCompact: /spec/type must be equal to one of the allowed values (dialog | drawer | popover)"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedSurface/panelCompact: /spec/compact/type must be equal to one of the allowed values (dialog | drawer)"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedNode/listingSurface: /node is missing required property 'show'"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedNode/listingSurface: /node is missing required property 'rowActionsDisplay'"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedNode/listingSurface: /node/sort must be object"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedNode/listingSurface: /node/create/to/surface/size must be equal to one of the allowed values (small | medium | large | full)"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedNode/listingSurface: /node is missing required property 'edit'"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedNode/listingSurface: /node is missing required property 'press'"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedPlacement/placementSurface: /spec/surface/type must be equal to one of the allowed values (dialog | drawer | popover)"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedPlacement/placementCompact: /spec/compact/type must be equal to one of the allowed values (collapsible | overlay)"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedNode/filtersPlacement: /node/placement/type must be equal to one of the allowed values (above | aside | collapsible | overlay | searchBox)"
    - code: SCHEMA_VIOLATION
      message: "Echo.TypedNode/filtersStore: /node/state/store/type must be equal to one of the allowed values (memory | local | session)"
---
kind: Telo.Sequence
metadata: { name: provided }
steps:
  - name: overlayCompact
    try:
      - name: overlayCompactRead
        invoke:
          kind: Probe.Read
          source:
            kind: Echo.AnySurface
            spec:
              type: dialog
              size: medium
              modal: true
              dismiss: { escape: true, outside: true, closeButton: true }
              compact:
                type: drawer
                side: end
                size: medium
                modal: true
                dismiss: { escape: true, outside: true, closeButton: true }
                address: { name: todo }
      - name: overlayCompactAccepted
        throw: { code: ACCEPTED, message: the provider's contract accepted the value }
    catch:
      - name: overlayCompactRefusal
        value: !cel "error.code + ' ' + error.message.substring(error.message.lastIndexOf('Error: '))"
  - name: panelCompact
    try:
      - name: panelCompactRead
        invoke:
          kind: Probe.Read
          source:
            kind: Echo.AnySurface
            spec:
              type: panel
              side: end
              size: medium
              dismiss: { escape: true, closeButton: true }
              compact: { type: popover, side: bottom, align: start, dismiss: { escape: true, outside: true } }
      - name: panelCompactAccepted
        throw: { code: ACCEPTED, message: the provider's contract accepted the value }
    catch:
      - name: panelCompactRefusal
        value: !cel "error.code + ' ' + error.message.substring(error.message.lastIndexOf('Error: '))"
  - name: listingSurface
    try:
      - name: listingSurfaceRead
        invoke:
          kind: Probe.Read
          source:
            kind: Echo.AnyNode
            node:
              type: listing
              fill: false
              press: null
              schema: {}
              basePath: /api/todos
              key: id
              query: {}
              form: null
              pageSize: 25
              paging: pages
              sort: { sortable: [], initial: null }
              show: { count: true }
              rowActions: []
              rowActionsDisplay: auto
              relations: {}
              empty: { type: text, fill: false, text: { set: Ui.Translations, key: noRows } }
              layout: { type: table, columns: [], reads: {} }
              delete: false
              create:
                to:
                  type: openPage
                  href: { path: { value: /todos/new }, pathParams: {}, queryParams: {} }
                  surface: { type: dialog, size: huge, modal: true, dismiss: { escape: true, outside: true, closeButton: true } }
                  keepsSurface: false
                label: { set: Ui.Translations, key: create }
              edit: null
      - name: listingSurfaceAccepted
        throw: { code: ACCEPTED, message: the provider's contract accepted the value }
    catch:
      - name: listingSurfaceRefusal
        value: !cel "error.code + ' ' + error.message.substring(error.message.lastIndexOf('Error: '))"
  - name: placementSurface
    try:
      - name: placementSurfaceRead
        invoke:
          kind: Probe.Read
          source:
            kind: Echo.AnyPlacement
            spec:
              type: overlay
              surface: { type: panel, side: end, size: medium, dismiss: { escape: true, closeButton: true } }
              show: all
              controls: direct
              summary: none
      - name: placementSurfaceAccepted
        throw: { code: ACCEPTED, message: the provider's contract accepted the value }
    catch:
      - name: placementSurfaceRefusal
        value: !cel "error.code + ' ' + error.message.substring(error.message.lastIndexOf('Error: '))"
  - name: placementCompact
    try:
      - name: placementCompactRead
        invoke:
          kind: Probe.Read
          source:
            kind: Echo.AnyPlacement
            spec: { type: above, show: all, controls: direct, summary: none, compact: { type: aside, side: start } }
      - name: placementCompactAccepted
        throw: { code: ACCEPTED, message: the provider's contract accepted the value }
    catch:
      - name: placementCompactRefusal
        value: !cel "error.code + ' ' + error.message.substring(error.message.lastIndexOf('Error: '))"
  - name: filtersPlacement
    try:
      - name: filtersPlacementRead
        invoke:
          kind: Probe.Read
          source:
            kind: Echo.AnyNode
            node:
              type: filters
              fill: false
              basePath: /api/todos
              fields: []
              content: { type: text, fill: false, text: { set: Ui.Translations, key: loading } }
              placement: { type: nowhere }
              apply: commit
              state: { address: false, store: { type: memory }, fields: [] }
              presets: []
      - name: filtersPlacementAccepted
        throw: { code: ACCEPTED, message: the provider's contract accepted the value }
    catch:
      - name: filtersPlacementRefusal
        value: !cel "error.code + ' ' + error.message.substring(error.message.lastIndexOf('Error: '))"
  - name: filtersStore
    try:
      - name: filtersStoreRead
        invoke:
          kind: Probe.Read
          source:
            kind: Echo.AnyNode
            node:
              type: filters
              fill: false
              basePath: /api/todos
              fields: []
              content: { type: text, fill: false, text: { set: Ui.Translations, key: loading } }
              placement: { type: above, show: all, controls: direct, summary: none }
              apply: commit
              state: { address: false, store: { type: server }, fields: [] }
              presets: []
      - name: filtersStoreAccepted
        throw: { code: ACCEPTED, message: the provider's contract accepted the value }
    catch:
      - name: filtersStoreRefusal
        value: !cel "error.code + ' ' + error.message.substring(error.message.lastIndexOf('Error: '))"
  - name: markdown
    invoke:
      kind: Probe.Read
      source: { kind: Echo.AnyNode, node: { type: markdown, fill: false, value: { value: "# Heading" } } }
  - name: markdownIs
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.markdown.result.node"
      expected: { type: markdown, fill: false, value: { value: "# Heading" } }
  - name: call
    invoke:
      kind: Probe.Read
      source:
        kind: Echo.AnyNode
        node:
          type: button
          fill: false
          button: { type: text }
          action:
            mutation:
              id: Test/archive
              schema: { type: object }
              method: POST
              url: { path: { value: /api/todos/archive }, pathParams: {}, queryParams: {} }
              consumed: []
              invalidates: []
              concurrency: parallel
            inputs: {}
            label: { set: Ui.Translations, key: save }
            prompt: null
            onSuccess: []
            onFailure: []
            failure: { type: text, fill: false, text: { set: Ui.Translations, key: loading } }
  - name: callIs
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "[steps.call.result.node.action.prompt, steps.call.result.node.action.onSuccess, steps.call.result.node.action.mutation.id]"
      expected: [null, [], Test/archive]
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "[steps.overlayCompactRefusal.result, steps.panelCompactRefusal.result, steps.listingSurfaceRefusal.result, steps.placementSurfaceRefusal.result, steps.placementCompactRefusal.result, steps.filtersPlacementRefusal.result, steps.filtersStoreRefusal.result]"
      expected: ["ERR_OUTPUT_INVALID Error: /compact must NOT have additional properties ('address' is not allowed)", "ERR_OUTPUT_INVALID Error: /type must be equal to one of the allowed values (dialog | drawer | popover); /compact/type must be equal to one of the allowed values (dialog | drawer)", "ERR_OUTPUT_INVALID Error: /node/create/to/surface/size must be equal to one of the allowed values (small | medium | large | full)", "ERR_OUTPUT_INVALID Error: /surface/type must be equal to one of the allowed values (dialog | drawer | popover)", "ERR_OUTPUT_INVALID Error: /compact/type must be equal to one of the allowed values (collapsible | overlay)", "ERR_OUTPUT_INVALID Error: /node/placement/type must be equal to one of the allowed values (above | aside | collapsible | overlay | searchBox)", "ERR_OUTPUT_INVALID Error: /node/state/store/type must be equal to one of the allowed values (memory | local | session)"]
