kind: Telo.Library
metadata:
  name: VarTypoLib
  version: 0.0.0
  description: |
    The same shape as ../lib, but the step reads a variable this library does not
    declare. A consumer analyzing this library's exported instance must still
    report it — the read is checked, and checked against THIS library's block
    (the diagnostic names `onlyInLib`, never the importing app's variables).
imports:
  Run: ../../../../modules/run
variables:
  onlyInLib:
    type: string
    default: hello
exports:
  resources: [ Work ]
---
kind: Run.Value
metadata: { name: Echo }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      text: { type: string }
value:
  echoed: !cel "inputs.text"
---
kind: Run.Sequence
metadata: { name: Work }
steps:
  - name: Echo
    invoke: !ref Echo
    inputs:
      text: !cel "variables.typoNotDeclared"
