# Writes `top` outside any draft from its own process.
kind: Telo.Application
metadata:
  name: CrossProcessWriter
  version: 1.0.0
include:
  - ./model.yaml
imports:
  Postgres: ../../../../../postgres
  Layers: ../../../..
  Graph: ../../../../../graph
  GraphLayers: ../../../../../graph-layers
  Run: ../../../../../run
variables:
  dbHost: { env: DB_HOST, type: string }
  dbPort: { env: DB_PORT, type: integer }
targets:
  - !ref work
---
kind: Postgres.Connection
metadata: { name: db }
connectionString: !cel >-
  'postgres://postgres:postgres@' + variables.dbHost + ':' +
  string(variables.dbPort) + '/postgres' +
  '?options=-c%20search_path%3Dpublic'
---
kind: Run.Sequence
metadata: { name: work }
steps:
  - name: write
    invoke: { kind: Graph.CreateNode, store: !ref top, node: !ref person }
    inputs: { key: race-outside, properties: { name: Outside } }
