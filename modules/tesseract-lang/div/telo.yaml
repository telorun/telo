kind: Telo.Library
metadata:
  name: TesseractLangDiv
  version: 0.2.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Recognize Dhivehi text in images, offline: the trained model for reading
