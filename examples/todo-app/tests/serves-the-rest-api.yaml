kind: Telo.Application
metadata:
  name: TodoAppExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/todo-app` and walks its REST surface: create, list, replace,
    delete, and a create the model refuses. The model IS the request contract in
    this example, so the rejected create is what shows validation happening before
    the database is touched. It then asks the declared UI for its shell and its
    first page, which is what shows the frontend is served from the same manifest.
imports:
  App: ../../../modules/app
  Run: ../../../modules/run
  HttpClient: ../../../modules/http-client
  Assert: ../../../modules/assert
targets:
  - !ref test
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    ports:
      http: 8077
targets:
  - !ref app
steps:
  # The example keeps its todos in a database file that outlives the test, so the
  # row this test creates is identified freshly on every run — otherwise a second
  # run would pick up the first run's row when it looks its id up.
  - name: subject
    value:
      text: !cel "'write the tests ' + uuidv4()"

  - name: create
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8077/api/todos
      method: POST
    inputs:
      body:
        text: !cel "steps.subject.result.text"
        isDone: false
  - name: verifyCreated
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.create.result.status"
        text: !cel "steps.create.result.body.text"
      expected:
        status: 201
        text: !cel "steps.subject.result.text"

  # The list is a page of a collection: `rows`, the `total` the filter matches,
  # and a cursor for the next page. Filtering by the text finds exactly this row.
  - name: list
    invoke:
      kind: HttpClient.Request
      method: GET
    inputs:
      url: http://127.0.0.1:8077/api/todos
      query:
        text: !cel "steps.subject.result.text"
  - name: verifyListed
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.list.result.status"
        total: !cel "steps.list.result.body.total"
        found: !cel "size(steps.list.result.body.rows)"
      expected:
        status: 200
        total: 1
        found: 1

  # The create route answers with the body it was given, so the id comes from the
  # listing — which is also what proves the row is really there.
  - name: created
    value:
      id: !cel "steps.list.result.body.rows[0].id"

  # `text` is required and may not be empty, so an empty one is refused before the
  # database is touched — and the refusal names the field.
  - name: emptyText
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8077/api/todos
      method: POST
    inputs:
      body:
        text: ""
        isDone: false
  - name: verifyRefused
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.emptyText.result.status"
        field: !cel "steps.emptyText.result.body.details[0].path"
      expected:
        status: 400
        field: text

  # PUT replaces the todo, so the body is the whole record.
  - name: complete
    invoke:
      kind: HttpClient.Request
      method: PUT
    inputs:
      url: !cel "'http://127.0.0.1:8077/api/todos/' + string(steps.created.result.id)"
      body:
        text: !cel "steps.subject.result.text"
        isDone: true
  - name: remove
    invoke:
      kind: HttpClient.Request
      method: DELETE
    inputs:
      url: !cel "'http://127.0.0.1:8077/api/todos/' + string(steps.created.result.id)"
  - name: gone
    invoke:
      kind: HttpClient.Request
      method: GET
    inputs:
      url: !cel "'http://127.0.0.1:8077/api/todos/' + string(steps.created.result.id)"
  - name: verifyLifecycle
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        completed: !cel "steps.complete.result.status"
        deleted: !cel "steps.remove.result.status"
        afterDelete: !cel "steps.gone.result.status"
      expected:
        completed: 200
        deleted: 204
        afterDelete: 404

  # The frontend is declared, not written: the shell at `/` and the page document
  # it renders both come from the UiReact.App in the same manifest.
  - name: shell
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8077/
      method: GET
  - name: page
    invoke:
      kind: HttpClient.Request
      method: GET
    inputs:
      url: http://127.0.0.1:8077/_telo/ui/page
      query:
        path: /
  - name: verifyUi
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        shell: !cel "steps.shell.result.status"
        page: !cel "steps.page.result.status"
        title: !cel "steps.page.result.body.title"
        root: !cel "steps.page.result.body.children[0].type"
      expected:
        shell: 200
        page: 200
        title: Todos
        root: filters
