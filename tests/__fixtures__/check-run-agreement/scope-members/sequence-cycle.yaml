# Invokes the library's `sequenceCycle`. Its entry-scoped check is silent about the
# library's scope members, so the kernel refuses them when the scope opens.
kind: Telo.Application
metadata:
  name: ScopeMemberSequenceCycleApp
  version: 1.0.0
imports:
  Lib: ./lib
targets:
  - name: probe
    invoke: !ref Lib.sequenceCycle
