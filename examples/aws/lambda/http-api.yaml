# Lambda.HttpApi example — API Gateway HTTP API v2 trigger with three
# routes (greeting, structured echo, error rendering via catches:).
#
# Drive it locally:
#   telo install ./http-api.yaml
#   cp node_modules/@telorun/lambda/managed.mjs ./index.mjs
#   # then via RIE with a synthetic HTTP API v2 event payload
kind: Telo.Application
metadata:
  name: LambdaHttpApiExample
  version: 1.0.0
  description: |
    `Lambda.HttpApi` example: an AWS Lambda fronted by API Gateway HTTP API
    v2. Declares two routes (GET /users/{id}, POST /orders) plus a CORS
    block and a per-route `catches:` mapping that turns a thrown
    `ORDER_INVALID` into a 400 with a structured body. See
    `examples/aws/lambda/README.md` for the full packaging + deploy walkthrough.
imports:
  Lambda: oci://ghcr.io/telorun/aws/lambda@0.12.0#sha256-m6AEJNfJguLIFgbZuNmO06pdUathLclu3dMHpgqXreQ
  Run: oci://ghcr.io/telorun/run@0.31.0#sha256-nwScCIsE4_c40LSm8abAb5qDKQxVnTU8ORlf7Xjyys4
targets:
  - !ref main
---
# GET /users/{id} → returns a greeting by id.
kind: Run.Value
metadata: { name: greetById }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      id: { type: string }
value:
  message: !cel "'Hello, user ' + inputs.id + '!'"
---
# POST /orders → echoes the parsed JSON body; throws ORDER_INVALID on
# missing fields so the route's catches: block can render a 400.
kind: Run.Sequence
metadata: { name: placeOrder }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [ body ]
    properties:
      body:
        type: object
        properties:
          sku: { type: string }
          quantity: { type: integer }
steps:
  - name: complete
    if: !cel "!has(inputs.body.sku) || !has(inputs.body.quantity)"
    then:
      - name: incomplete
        throw: { code: ORDER_INVALID, displayMessage: An order needs a sku and a quantity. }
outputs:
  orderId: !cel "'ord_' + uuidv4()"
  sku: !cel "inputs.body.sku"
  quantity: !cel "inputs.body.quantity"
---
kind: Lambda.HttpApi
metadata: { name: web }
cors:
  origin: "*"
  methods: [ GET, POST ]
  allowedHeaders: [ Content-Type ]
routes:
  - request:
      method: GET
      path: "/users/{id}"
    handler: !ref greetById
    inputs:
      id: !cel "request.params.id"
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result"
  - request:
      method: POST
      path: "/orders"
    handler: !ref placeOrder
    inputs:
      body: !cel "request.body"
    returns:
      - status: 201
        content:
          application/json:
            body: !cel "result"
    catches:
      - when: !cel "error.code == 'ORDER_INVALID'"
        status: 400
        content:
          application/json:
            body:
              error:
                code: !cel "error.code"
                message: !cel "error.message"
---
kind: Lambda.Function
metadata: { name: main }
handlers:
  - !ref web
