        reason: a conflict belongs to one draft, which only a session on this store names
    relationship:
      title: Relationship
      description: The relationship type. The store must list it in 'relationships:'.
      x-telo-ref:
        kind: Graph.Relationship
        use: dependency
  x-telo-resource-rules:
    - resolve: [/store]
      condition: !cel "self.store.?relationships.orValue([]).exists(r, r.name == self.relationship.name)"
      code: GRAPH_TYPE_NOT_IN_STORE
      message: names a relationship type its store does not list in 'relationships:'.
---
# GraphLayers.RevisionedStore — the third level of the contract: a layer whose
# every published revision is kept and readable. Everything `DraftedStore`
# promises holds; a strategy module's store kind extends this when it retains
# history.
kind: Telo.Abstract
metadata:
  name: RevisionedStore
  description: >-
    One named layer of a knowledge graph that keeps every revision it ever
    published. Any number of drafts are edited side by side, each isolated at
    the revision it started from; a draft that fell behind is merged three ways,
    property by property, against the common ancestor. The layer is built on
    pinned revisions of others, and its history is listed as a change feed.
capability: Telo.Provider
extends: Self.DraftedStore
---
kind: Telo.Definition
metadata:
  name: ListRevisions
  description: >-
    Lists the published revisions of a knowledge-graph layer a page at a time,
    newest or oldest first: each revision's number, label and note, when it was
    published and by whom, and the revisions of other layers it is pinned to.
    Asked for the revisions after a known number it is a change feed, where a
    missing number shows a gap that time could not.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#ListRevisions
throws:
  codes:
    GRAPH_CURSOR_INVALID:
      description: >-
        The cursor is malformed or was issued for another listing — another
        store, another `layer`, another `order` or another `after`.
    GRAPH_LAYER_NOT_FOUND:
      description: >-
        `layer` names a layer the store's layers table does not register.
        `data` carries `layer`.
inputType:
  type: object
  additionalProperties: false
  properties:
    order:
      title: Order
      description: >-
        `descending` lists the newest revision first, `ascending` the oldest.
      type: string
      enum: [descending, ascending]
      default: descending
    after:
      title: After
      description: >-
        A revision number: only revisions published after it are listed. A
        consumer following the layer passes the last number it holds.
      type: integer
      minimum: 0
    layer:
      title: Layer
      description: >-
        The name of the layer whose revisions are listed: any layer registered
        in the same tables, which is how a revision or label is chosen before
        it is pinned. Omitted, the store's own layer.
      type: string
      minLength: 1
    limit:
      title: Limit
      description: The most entries returned in one page.
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
    cursor:
      title: Cursor
      description: >-
        The `next` of an earlier page of this same listing, passed back unchanged
        to read the page after it. Omitted, the listing starts at its beginning.
      type: string
outputType:
  type: object
  required: [revisions]
  additionalProperties: false
  properties:
    revisions:
      title: Revisions
      description: One page of the layer's revisions, in the order asked for.
      type: array
      items:
        type: object
        required: [number, publishedAt, publishedBy, bases]
        additionalProperties: false
        properties:
          number:
            title: Number
            description: >-
              The revision's number. A layer's revisions are numbered from 1 with
              no gap.
            type: integer
          label:
            title: Label
            description: The revision's label, when it was given one.
            type: string
          message:
            title: Message
            description: The note the revision was published with.
            type: string
          publishedAt:
            title: Published At
            description: When the revision was published, by the database's clock.
            x-telo-type: Telo.Timestamp
          publishedBy:
            title: Published By
            description: Who published it.
            $ref: "telo://Self/Actor"
          bases:
            title: Bases
            description: >-
              The layers this revision is built on, in position order, each at
              the revision it is pinned to. Empty for a layer built on no other.
            type: array
            items:
              $ref: "telo://Self/PinnedBase"
    next:
      title: Next
      description: >-
        The cursor of the following page. Present only when more exist; absent on
        the last page.
      type: string
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The store whose tables hold the layer; its own layer is listed unless `layer` names another.
      x-telo-ref:
        kind: Self.RevisionedStore
        use: dependency
---
# GraphLayers.PinnedBase — one layer another is built on, at the revision it is
# pinned to. The same shape wherever a base list is returned.
kind: Telo.JsonSchema
metadata:
  name: PinnedBase
schema:
  type: object
  required: [layer, revision, position]
  additionalProperties: false
  properties:
    layer:
      title: Layer
      description: The name of the layer beneath.
      type: string
    revision:
      title: Revision
      description: The revision of that layer the pin holds. 0 is the layer before its first revision.
      type: integer
    label:
      title: Label
      description: That revision's label, when it has one.
      type: string
    position:
      title: Position
      description: The pin's place among the layer's direct bases, from 0; a lower position outranks a higher one.
      type: integer
---
kind: Telo.Definition
metadata:
  name: PinBase
  description: >-
    Builds a knowledge-graph layer on revisions of other layers, or upgrades it
    to newer ones: each named layer is pinned at a revision number, a label or
    its newest revision, all in one move. What the layer already states is
    merged property by property with what changed beneath, and what collides is
    left as conflicts to resolve before publishing.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#PinBase
throws:
  codes:
    GRAPH_LAYER_NOT_FOUND:
      description: >-
        A named layer is not registered in the store's layers table. `data`
        carries `layer`.
    GRAPH_REVISION_NOT_FOUND:
      description: >-
        A named layer has no revision of that number or label. `data` carries
        `layer` and `revision`.
    GRAPH_BASE_CYCLE:
      description: >-
        The store's own layer would lie beneath itself: a named layer is the
        store's own, or is built on it at the pinned revision. `data` carries
        `layer`.
    GRAPH_BASE_REVISION_CONFLICT:
      description: >-
        The resolved stack would hold one layer at two revisions — two pinned
        layers built on different revisions of a third, or one layer named
        twice in the call. Pin every layer that reaches it in the same call.
        `data` carries `layer` and `revisions`.
    GRAPH_BASE_LIMIT:
      description: >-
        The resolved stack would hold more layers than a stack may, the store's
        own included. `data` carries `limit`.
    GRAPH_DRAFT_CONFLICTED:
      description: >-
        Outside a draft session only: the move leaves a conflict, or a
        relationship the layer states whose endpoint no longer resolves, so
        nothing was changed. Make the move inside a draft, resolve there, and
        publish.
inputType:
  type: object
  required: [bases]
  additionalProperties: false
  properties:
    bases:
      title: Bases
      description: >-
        The pins to set, applied together as one move. A layer already pinned
        is moved to the named revision; a layer not yet pinned is added.
      type: array
      minItems: 1
      maxItems: 32
      items:
        type: object
        required: [layer]
        additionalProperties: false
        properties:
          layer:
            title: Layer
            description: The name of the layer to build on.
            type: string
            minLength: 1
          revision:
            title: Revision
            description: >-
              An integer is a revision number (0 is the layer before its first
              revision); a string is a label. Omitted, the layer's newest
              revision at the moment of the call.
            anyOf:
              - type: integer
                minimum: 0
              - type: string
                minLength: 1
                maxLength: 128
                pattern: "^[A-Za-z0-9._+-]*[A-Za-z._+-][A-Za-z0-9._+-]*$"
          position:
            title: Position
            description: >-
              The pin's place among the direct bases, from 0. Omitted, a layer
              already pinned keeps its place and a new one is appended.
            type: integer
            minimum: 0
outputType:
  type: object
  required: [bases, merged, conflicts]
  additionalProperties: false
  properties:
    bases:
      title: Bases
      description: The layer's direct bases after the move, in position order.
      type: array
      items:
        $ref: "telo://Self/PinnedBase"
    merged:
      title: Merged
      description: How many of the layer's statements were merged with a change beneath them.
      type: integer
    conflicts:
      title: Conflicts
      description: How many conflicts the move left to decide. Always 0 outside a draft session.
      type: integer
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: >-
        The layer whose bases are pinned. Inside a draft session on it the move
        is staged in that draft; outside one it is published at once.
      x-telo-ref:
        kind: Self.RevisionedStore
        use: dependency
---
kind: Telo.Definition
metadata:
  name: UnpinBase
  description: >-
    Stops building a knowledge-graph layer on one of the layers beneath it:
    the pin is removed, everything that layer alone contributed leaves the
    view, and what the upper layer states over it is merged or left as
    conflicts, exactly as when a pin moves.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#UnpinBase
throws:
  codes:
    GRAPH_BASE_NOT_PINNED:
      description: The named layer is not among the layer's direct bases. `data` carries `layer`.
    GRAPH_DRAFT_CONFLICTED:
      description: >-
        Outside a draft session only: removing the pin leaves a conflict, or a
        relationship the layer states whose endpoint no longer resolves, so
        nothing was changed. Remove it inside a draft, resolve there, and
        publish.
inputType:
  type: object
  required: [layer]
  additionalProperties: false
  properties:
    layer:
      title: Layer
      description: The name of the directly pinned layer to remove.
      type: string
      minLength: 1
outputType:
  type: object
  required: [bases, merged, conflicts]
  additionalProperties: false
  properties:
    bases:
      title: Bases
      description: The layer's direct bases after the removal, in position order.
      type: array
      items:
        $ref: "telo://Self/PinnedBase"
    merged:
      title: Merged
      description: How many of the layer's statements were merged with the change beneath them.
      type: integer
    conflicts:
      title: Conflicts
      description: How many conflicts the removal left to decide. Always 0 outside a draft session.
      type: integer
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: >-
        The layer a pin is removed from. Inside a draft session on it the
        removal is staged in that draft; outside one it is published at once.
      x-telo-ref:
        kind: Self.RevisionedStore
        use: dependency
---
kind: Telo.Definition
metadata:
  name: ListBases
  description: >-
    Lists the layers a knowledge-graph layer is directly built on, in order of
    precedence, each with the revision it is pinned to and that revision's
    label. Inside a draft session it answers for the draft, outside one for the
    layer's newest revision.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#ListBases
inputType:
  type: object
  additionalProperties: false
outputType:
  type: object
  required: [bases]
  additionalProperties: false
  properties:
    bases:
      title: Bases
      description: Every direct base, in position order. A stack is bounded, so the list is whole.
      type: array
      items:
        $ref: "telo://Self/PinnedBase"
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: The layer whose bases are listed.
      x-telo-ref:
        kind: Self.RevisionedStore
        use: dependency
---
kind: Telo.Definition
metadata:
  name: LabelRevision
  description: >-
    Gives a published revision of a knowledge-graph layer a permanent second
    name, such as a version number, that other layers can pin instead of the
    number. A label is never moved or removed and a revision carries at most
    one; labelling the same revision with the same label again changes nothing.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/graph-layers.mjs&local_path=./nodejs/src/index.ts#LabelRevision
throws:
  codes:
    GRAPH_REVISION_NOT_FOUND:
      description: >-
        The store's layer has published no revision of that number. `data`
        carries `layer` and `revision`.
    GRAPH_REVISION_LABEL_EXISTS:
      description: >-
        The label already names another revision of the layer. `data` carries
        `label` and `revision`, the revision that holds it.
    GRAPH_REVISION_LABELLED:
      description: >-
        The revision already carries another label. `data` carries `revision`
        and `label`, the label it has.
inputType:
  type: object
  required: [revision, label]
  additionalProperties: false
  properties:
    revision:
      title: Revision
      description: The number of the revision to label.
      type: integer
      minimum: 1
    label:
      title: Label
      description: >-
        1 to 128 letters, digits, `.`, `_`, `+` or `-`, at least one of which
        is not a digit, so a label is never read as a revision number.
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9._+-]*[A-Za-z._+-][A-Za-z0-9._+-]*$"
    actor:
      title: Actor
      description: Who labels the revision. Omitted, the store resource itself is recorded.
      $ref: "telo://Self/Actor"
outputType:
  type: object
  required: [revision]
  additionalProperties: false
  properties:
    revision:
      title: Revision
      type: object
      required: [number, label]
      additionalProperties: false
      properties:
        number:
          title: Number
          type: integer
        label:
          title: Label
          type: string
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: >-
        The layer whose revision is labelled. A label names a published
        revision, so the call acts the same inside a draft session as outside.
      x-telo-ref:
        kind: Self.RevisionedStore
        use: dependency
