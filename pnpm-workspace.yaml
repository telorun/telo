packages:
  - apps/studio
  - apps/hub-web
  - apps/docker-runner
  - apps/host-runner
  - apps/k8s-runner
  - benchmarks/*
  - cel/*
  - message-format/nodejs
  - cli/*
  - modules/*/*
  - modules/*/*/*
  - pages
  - kernel/*
  - sdk/*
  - analyzer/*
  - templating/*
  - release/*
  - ide/*
  - packages/*
  - packages/*/*
  # Test fixtures whose controllers are TypeScript. In the workspace so they
  # type-check against the SDK like any other controller — a fixture that only
  # ever runs through esbuild (which does not type-check) rots silently the day
  # the surface it exercises moves, which for a fixture guarding a seam is the
  # one failure it must not have.
  - tests/__fixtures__/*/nodejs
  - modules/*/tests/__fixtures__/*/nodejs
  # Example modules with TypeScript controllers, for the same reason.
  - examples/*/*/nodejs

onlyBuiltDependencies:
  - better-sqlite3
  - bun
  - esbuild

# A version is installable only once it is three days old — npm's 72-hour unpublish
# window, inside which a compromised release is usually pulled. This repo's own
# packages are exempt: the release flow installs its freshly published candidates.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@telorun/*"

# One esbuild for the whole repo. The kernel builds a local module's controller
# from source and each module's `build` script builds the bundle that ships; those
# two must produce the same bytes, and matching flags across two different esbuild
# releases does not give matching output. Declared once here so the version cannot
# drift between them.
catalog:
  esbuild: ^0.25.12
  # Pinned here for the reason esbuild is: this library DEFINES OUTPUT BYTES.
  # A rendered number is compared, stored and diffed downstream, and a minor
  # release that changes one would move it under every manifest at once.
  d3-format: 3.1.2
  # The DOM the controls contract is judged in: ui-react proves its built-ins
  # on it and ui-react-conformance holds every theme to it, so the two must be
  # one version — the DOM is part of the oracle.
  happy-dom: 21.0.4

# The catalog governs what this repo DECLARES; vite brings its own esbuild, and
# vite 5 (under vitest 2) pins ^0.21.3. esbuild only learned the `es2024` target
# in 0.24, so that copy rejected the target this repo's tsconfig sets and vitest
# printed "Unrecognized target environment" for every transformed file — hundreds
# of lines per run, drowning the failures underneath them.
#
# Consolidation onto the version already pinned above, not a fresh upgrade: the
# repo installed 0.21.5 and 0.25.12 side by side, and this leaves one. It is
# outside vite 5's declared range, which is the cost — the API vite uses
# (`transform`) is unchanged across it, and the whole suite is what verifies that.
overrides:
  esbuild: ^0.25.12
  # monaco-editor pins dompurify 3.2.7 exactly; 3.4.x carries the sanitizer fixes
  # within the same major.
  dompurify: ^3.4.18
  # vitest 2 and vite 5 take @types/node as an optional peer (>=20); a package with no
  # @types/node of its own gets the newest one pnpm finds, which is 26.x. This keeps
  # such a request on the repo's Node line; requests that cannot reach 26 (every
  # package's own ^20) are not matched.
  "@types/node@>=26": ^24.12.0
  # templating, analyzer, kernel and release pin yaml 2.8.3 exactly (the YAML reader's
  # Rust twin is held to it) and hand yaml nodes to their consumers, so a second yaml
  # in the tree breaks their types. Every ^2.8.3 range resolves to that pin.
  "yaml@^2.8.3": 2.8.3
  # ui-lucide's glyphs are generated from lucide 1.8.0 and the icon names a module
  # accepts follow that release; the React packages stay on the same one.
  lucide-react: 1.8.0
  # ui-react-radix's conformance suite is the oracle for Radix's behaviour (1.8 reports no
  # intents for several controls); a Radix update moves only with that suite passing.
  radix-ui: 1.4.3
