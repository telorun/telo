kind: Telo.Library
metadata:
  name: Gzip
  version: 0.8.3
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Data]
  description: |
    Gzip compression and decompression as a streaming codec: bytes in, compressed
    bytes out, and back again. Both directions stay streaming, so a gzipped payload
    can be piped straight into another decoder — an archive extractor, a text
    decoder — without buffering the whole thing.
imports:
  Codec: ../codec
exports:
  kinds:
    - Encoder
    - Decoder
---
# Encoder: byte stream → gzip-compressed byte stream.
kind: Telo.Definition
metadata:
  name: Encoder
  description: >-
    Compresses a byte stream with gzip as it flows, so a payload can be shrunk on its
    way to the wire without being buffered whole.
capability: Telo.Invocable
extends: Codec.Encoder
controllers:
  - pkg:telo/local/js?path=./nodejs/gzip.mjs&local_path=./nodejs/src/index.ts#EncoderController
schema:
  type: object
  additionalProperties: false
---
# Decoder: gzip byte stream → decompressed byte stream.
#
# Output stays a stream (not collected) so it pipes straight into a downstream
# decoder — e.g. `Tar.Extract` for a `.tar.gz`, or `PlainText.Decoder` for a
# gzipped text payload.
kind: Telo.Definition
metadata:
  name: Decoder
  description: >-
    Decompresses a gzip byte stream. The output stays a stream so it pipes straight
    into a downstream decoder instead of being buffered whole.
capability: Telo.Invocable
extends: Codec.Decoder
controllers:
  - pkg:telo/local/js?path=./nodejs/gzip.mjs&local_path=./nodejs/src/index.ts#DecoderController
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-stream: true
        description: Decompressed byte stream (gunzipped `input`).
    required: [ output ]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
