kind: Telo.Library
metadata:
  name: YAML
  version: 0.10.1
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Data]
  description: |
    Turns YAML text into ordinary data a manifest can read — configuration files,
    front matter, API payloads. Multi-document files come back as a list of documents
    in source order, and invalid input fails with the parser's line and column rather
    than silently.
exports:
  kinds:
    - Parse
---
# Yaml.Parse — UTF-8 string → parsed YAML documents. Multi-doc-aware
# (`yaml.parseAllDocuments`); even single-doc input always lands in `docs[0]`.
kind: Telo.Definition
metadata:
  name: Parse
  description: >-
    Parses YAML text into plain data, returning every document in the source in order,
    so multi-document files need no special handling. Invalid input raises with the
    parser's position.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/parse.mjs&local_path=./nodejs/src/parse.ts
throws:
  codes:
    ERR_PARSE_FAILED:
      description: Input was not valid YAML. The original parser error (with line/column when available) is preserved on `data`.
schema:
  type: object
  additionalProperties: false
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      text:
        type: string
        description: UTF-8 YAML source to parse.
    required: [text]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      docs:
        type: array
        description: |
          Parsed documents in source order. Empty input yields an empty array.
          Each entry mirrors the source document's top-level value — typically
          an object, but YAML permits scalars and arrays at the document root,
          so `items: {}` (any value) is the honest schema.
        items: {}
    required: [docs]
    additionalProperties: false
