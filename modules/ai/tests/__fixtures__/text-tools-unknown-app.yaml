# Consumes the library beside it; its entry-scoped check does not reach the
# library's internals, so the agent's own refusal is what remains here.
kind: Telo.Application
metadata: { name: TextToolsUnknownApp, version: 1.0.0 }
imports: { Lib: ./text-tools-unknown }
targets:
  - !ref firstRun
---
kind: Telo.Sequence
metadata: { name: firstRun }
steps:
  - name: attempt
    try:
      - name: run
        invoke: !ref Lib.agent
        inputs: { prompt: "go" }
    catch:
      - name: report
        throw:
          code: !cel "error.code"
          message: !interpolate "${{ error.code }}: ${{ error.message }}"
