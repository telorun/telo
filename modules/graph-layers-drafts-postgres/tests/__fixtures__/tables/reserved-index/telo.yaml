# A layered node table declaring an index under the 'graph_' prefix, which is the
# table kind's own. The table alone, so booting it reaches no database.
kind: Telo.Library
metadata:
  name: ReservedIndex
imports:
  Layers: ../../../..
---
kind: Layers.NodeTable
metadata: { name: people }
table: people
key: id
columns:
  id: { type: text, nullable: false }
  name: { type: text }
indexes:
  graph_people_name: { columns: [name] }
