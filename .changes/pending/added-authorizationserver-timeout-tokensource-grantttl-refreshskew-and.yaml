modules:
  modules/oauth-client: Added
body: "`AuthorizationServer.timeout`, `TokenSource.grantTtl`, `refreshSkew` and
  `claimTtl`, `Authorization.pendingTtl` and `RedirectAwait.timeout` are `Telo.Duration`
  slots: `30s`, `1h30m`, `2d` and `1w` are read, a malformed literal is refused by `telo
  check`, an integer is milliseconds, and a computed value must be a duration (`!cel
  \"duration('5m')\"`). Breaking for a value computed as a string. Text with a space
  before the unit (`5 m`) or around the value is now refused. Requires telo >=0.130.0."
