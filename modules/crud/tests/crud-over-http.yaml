kind: Telo.Application
metadata:
  name: CrudOverHttpTest
  version: 1.0.0
  description: |
    End-to-end: a templated Crud.Resource mounted on an Http.Server exercises the
    full REST lifecycle (create / list envelope / read / replace / delete / 404) against a
    SQLite table. Validates the persistent-target template controller, the
    `mount:` dispatch, and nested templated handlers resolving across imports.
imports:
  Crud: ../
  Sql: ../../sql
  SQLite: ../../sqlite
  Http: ../../http-server
  HttpClient: ../../http-client
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref migrate
  - !ref test
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: SQLite.Schema
metadata: { name: migrate }
connection: !ref db
version: !cel "module.version"
migrations:
  0001_todos:
    statement: |
      CREATE TABLE todos (
        id       INTEGER PRIMARY KEY AUTOINCREMENT,
        text     TEXT    NOT NULL,
        done     INTEGER NOT NULL DEFAULT 0,
        due_date TEXT
      )
---
# What a client writes. The read shape below extends it, so a property is
# declared once.
kind: Telo.JsonSchema
metadata: { name: TodoDraft }
schema:
  type: object
  required: [ text ]
  additionalProperties: false
  properties:
    text: { type: string, minLength: 1 }
    done: { type: integer, enum: [ 0, 1 ] }
    # camelCase property — the column is its snake_case form `due_date`.
    dueDate: { type: string, maxLength: 10 }
---
# What is read back: the draft plus the key, with `done` always present — the
# column is NOT NULL with a default, so it is optional to write and guaranteed
# to read.
kind: Telo.JsonSchema
metadata: { name: Todo }
extends: TodoDraft
schema:
  type: object
  required: [ id, done ]
  properties:
    id: { type: integer }
---
kind: Crud.Model
metadata: { name: todoModel }
schemas:
  read: !ref Todo
  list: !ref Todo
  create: !ref TodoDraft
  update: !ref TodoDraft
query:
  filters: []
  sort: []
---
kind: Crud.Resource
metadata: { name: todos }
connection: !ref db
singular: todo
plural: todos
model: !ref todoModel
---
kind: Http.Reference
metadata: { name: docs }
---
# Server is scoped to the test sequence so it is torn down (and the port freed)
# when the run completes — the kernel can then exit cleanly.
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: Http.Server
    metadata: { name: Server }
    host: 127.0.0.1
    port: 8971
    baseUrl: http://127.0.0.1:8971
    openapi:
      info:
        title: Todos API
        version: 1.0.0
    mounts:
      - path: /todos
        mount: !ref todos
      - path: /reference
        mount: !ref docs
targets:
  - !ref Server
steps:
  # The model/name config drives the OpenAPI doc: the collection is `/todos`,
  # each item lives at the renamed `/todos/{todoId}` (idParam default), and the
  # operations are named from singular/plural.
  - name: spec
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/reference/openapi.json
      method: GET
  - name: assertSpec
    inputs:
      listOp: !cel "steps.spec.result.body.paths['/todos'].get.operationId"
      getOp: !cel "steps.spec.result.body.paths['/todos/{todoId}'].get.operationId"
      createOp: !cel "steps.spec.result.body.paths['/todos'].post.operationId"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          listOp: { const: listTodos }
          getOp: { const: getTodo }
          createOp: { const: createTodo }
        required: [ listOp, getOp, createOp ]

  - name: create
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos
      method: POST
      body: { text: "Buy milk", dueDate: "2026-07-01" }
  # The answer is the record as stored: the key the table assigned, and `done`,
  # which the body left to the column's default.
  - name: assertCreated
    inputs:
      actual:
        status: !cel "steps.create.result.status"
        body: !cel "steps.create.result.body"
      expected:
        status: 201
        body: { id: 1, text: "Buy milk", done: 0, dueDate: "2026-07-01" }
    invoke:
      kind: Assert.Equals

  # Body missing the required `text` is rejected by the model schema before the
  # handler runs — no row is created, so the List below still sees exactly one.
  - name: badCreate
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos
      method: POST
      body: { done: 1 }
  # A value the model refuses is named by its property, in the validator's own
  # words — which is what lets a form mark the field it was typed into.
  - name: tooLongCreate
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos
      method: POST
      body: { text: "Buy bread", dueDate: "2026-07-01T09:00" }
  - name: assertBadCreate
    inputs:
      actual:
        missing:
          status: !cel "steps.badCreate.result.status"
          body: !cel "steps.badCreate.result.body"
        tooLong: !cel "steps.tooLongCreate.result.body.details"
      expected:
        missing:
          status: 400
          body:
            error: ValidationError
            message: Request validation failed
            status: 400
            details:
              - { location: body, path: text, message: is a required property }
        tooLong:
          - { location: body, path: dueDate, message: must NOT have more than 10 characters }
    invoke:
      kind: Assert.Equals

  - name: list
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos
      method: GET
  # The list answers with an envelope: one page of rows, the count of every
  # match, and no cursor because nothing follows.
  - name: assertList
    inputs:
      actual:
        status: !cel "steps.list.result.status"
        body: !cel "steps.list.result.body"
      expected:
        status: 200
        body:
          rows:
            - { id: 1, text: "Buy milk", done: 0, dueDate: "2026-07-01" }
          total: 1
          next: null
    invoke:
      kind: Assert.Equals

  - name: read
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos/1
      method: GET
  - name: assertRead
    inputs:
      status: !cel "steps.read.result.status"
      done: !cel "steps.read.result.body.done"
      # Round-trips the casing: written as `dueDate`, stored in column `due_date`,
      # aliased back to `dueDate` on read.
      dueDate: !cel "steps.read.result.body.dueDate"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status: { const: 200 }
          done: { const: 0 }
          dueDate: { const: "2026-07-01" }
        required: [ status, done, dueDate ]

  # PUT replaces what the update shape declares: `dueDate`, which the body
  # leaves out, is cleared — an optional property, so the row read back has no
  # such key. The answer is the record as stored.
  - name: update
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos/1
      method: PUT
      body: { text: "Buy milk", done: 1 }
  - name: readUpdated
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos/1
      method: GET
  - name: assertUpdated
    inputs:
      actual:
        status: !cel "steps.update.result.status"
        echoed: !cel "steps.update.result.body"
        row: !cel "steps.readUpdated.result.body"
      expected:
        status: 200
        echoed: { id: 1, text: "Buy milk", done: 1 }
        row: { id: 1, text: "Buy milk", done: 1 }
    invoke:
      kind: Assert.Equals

  # A body without the required `text` is no whole record: refused naming it,
  # and the row is left as it was.
  - name: partialUpdate
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos/1
      method: PUT
      body: { done: 0 }
  # `done: 5` is outside the model's enum [0, 1].
  - name: badUpdate
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos/1
      method: PUT
      body: { text: "Buy milk", done: 5 }
  # A `null` is not a way to clear a property: the body is validated as the
  # JSON it is, so it is refused naming the property. Leaving it out clears it.
  - name: nullUpdate
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos/1
      method: PUT
      body: { text: "Buy oat milk", done: 0, dueDate: null }
  - name: readAfterRefusals
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos/1
      method: GET
  - name: updateMissing
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos/99
      method: PUT
      body: { text: "Nobody" }
  - name: assertRefusedUpdates
    inputs:
      actual:
        partial:
          status: !cel "steps.partialUpdate.result.status"
          details: !cel "steps.partialUpdate.result.body.details"
        bad:
          status: !cel "steps.badUpdate.result.status"
          details: !cel "steps.badUpdate.result.body.details"
        nulled:
          status: !cel "steps.nullUpdate.result.status"
          details: !cel "steps.nullUpdate.result.body.details"
        row: !cel "steps.readAfterRefusals.result.body"
        missing: !cel "steps.updateMissing.result.status"
      expected:
        partial:
          status: 400
          details:
            - { location: body, path: text, message: is a required property }
        bad:
          status: 400
          details:
            - { location: body, path: done, message: must be equal to one of the allowed values }
        nulled:
          status: 400
          details:
            - { location: body, path: dueDate, message: must be string }
        row: { id: 1, text: "Buy milk", done: 1 }
        missing: 404
    invoke:
      kind: Assert.Equals

  - name: delete
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos/1
      method: DELETE
  - name: assertDeleted
    inputs:
      status: !cel "steps.delete.result.status"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties: { status: { const: 204 } }
        required: [ status ]

  - name: readGone
    inputs: {}
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8971/todos/1
      method: GET
  - name: assertGone
    inputs:
      status: !cel "steps.readGone.result.status"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties: { status: { const: 404 } }
        required: [ status ]
