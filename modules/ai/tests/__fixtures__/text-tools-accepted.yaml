# Text tools `telo check` accepts: a name carrying its entry's `prefix`, a tool
# named by its resource, any name beside a provider that declares no tools, and
# arguments the tool's parameters allow — a declared one, any key where the schema
# is open or has pattern properties, every required one mapped.
kind: Telo.Library
metadata: { name: TextToolsAccepted }
imports: { Ai: ../.., AiEcho: ./ai-echo.yaml, Run: ../../../run }
---
kind: Run.Value
metadata: { name: summarize }
value: { done: true }
---
kind: Ai.Tools
metadata: { name: fileTools }
tools:
  - name: apply_changes
    tool: { kind: Run.Value, value: { wrote: true } }
    parameters: { type: object, properties: { changes: { type: array } } }
  - tool: !ref summarize
    parameters: { type: object, properties: { text: { type: string } } }
  - name: open_tool
    tool: { kind: Telo.Value, value: { ok: true } }
    parameters: { type: object, required: [text], properties: { text: { type: string } } }
  - name: closed_tool
    tool: { kind: Telo.Value, value: { ok: true } }
    parameters:
      type: object
      additionalProperties: false
      patternProperties: { "^x-": { type: string } }
      required: [text]
      properties: { text: { type: string } }
---
kind: Ai.Agent
metadata: { name: prefixed }
model: { kind: AiEcho.EchoModel }
textTools:
  - tags: [telo-edit]
    tool: files_apply_changes
    arguments:
      changes: !cel "blocks.map(b, b.body)"
  - tags: [summary]
    tool: files_summarize
    arguments:
      text: !cel "blocks[0].body"
toolProviders:
  - provider: !ref fileTools
    prefix: files_
    include: [apply_changes, summarize]
---
kind: Ai.Agent
metadata: { name: lenient }
model: { kind: AiEcho.EchoModel }
textTools:
  - tags: [open]
    tool: open_tool
    arguments:
      text: !cel "blocks[0].body"
      extra: !cel "blocks[0].tag"
  - tags: [closed]
    tool: closed_tool
    arguments:
      text: !cel "blocks[0].body"
      x-note: !cel "blocks[0].tag"
toolProviders:
  - provider: !ref fileTools
---
kind: AiEcho.EchoToolProvider
metadata: { name: discovered }
advertises: [search]
---
kind: Ai.AgentStream
metadata: { name: discovering }
model: { kind: AiEcho.EchoModelStream }
textTools:
  - tags: [telo-edit]
    tool: search
    arguments:
      query: !cel "blocks[0].body"
toolProviders:
  - provider: !ref fileTools
  - provider: !ref discovered
