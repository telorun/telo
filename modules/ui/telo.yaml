      x-telo-ref: { kind: Self.FoldingFilterPlacement, use: dependency }
  x-telo-referrer-rules:
    - referrer: Self.Filters
      severity: warning
      condition: !cel >-
        has(self.compact)
        || (has(referrer.policy) && has(referrer.policy.show) && referrer.policy.show == 'chosen')
        || !has(referrer.fields)
        || !referrer.fields.exists(f, 'pinned' in f && f.pinned)
      code: UI_FILTER_PINNED_UNUSED
      message: >-
        pins a field, but nothing folds: every filter is on show whatever is
        pinned. Give the placement a `compact`, use a placement that folds, show
        only the `chosen` filters, or remove `pinned`.
---
kind: Telo.Definition
metadata:
  name: AsidePlacement
  description: >-
    Filter controls in a sidebar beside the content they filter: faceted
    search with the filters stacked in a column at the start or end edge and
    the results next to them. On a narrow viewport, where there is no room for
    a second column, the controls fold behind a toggle, or into the folding
    placement it names.
capability: Telo.Provider
extends: Self.FilterPlacement
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#AsidePlacementController
schema:
  type: object
  additionalProperties: false
  properties:
    side:
      title: Side
      description: The edge of the content the controls sit at.
      enum: [start, end]
      default: start
    compact:
      title: Compact
      description: >-
        The placement used instead on a narrow viewport: a
        `Ui.FoldingFilterPlacement`, one that folds the controls away.
        Omitted, a `Ui.CollapsiblePlacement` with its defaults.
      x-telo-ref: { kind: Self.FoldingFilterPlacement, use: dependency }
---
kind: Telo.Definition
metadata:
  name: CollapsiblePlacement
  description: >-
    Filter controls folded behind a toggle that shows how many filters are
    active: a collapsible filter section the viewer expands when needed, so
    the content keeps the space. Opens folded or unfolded, and remembers what
    the viewer last chose where the bar keeps its state.
capability: Telo.Provider
extends: Self.FoldingFilterPlacement
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#CollapsiblePlacementController
schema:
  type: object
  additionalProperties: false
  properties:
    open:
      title: Open
      description: Whether the controls are unfolded to begin with. A stored fold state overrides it.
      type: boolean
      default: false
---
kind: Telo.Definition
metadata:
  name: OverlayPlacement
  description: >-
    Filter controls in an overlay opened from a button that shows how many
    filters are active: a filter dialog, a filter drawer sliding in from an
    edge, or a popover under the button, closed with Done. Suits narrow
    viewports and screens with many filters.
capability: Telo.Provider
extends: Self.FoldingFilterPlacement
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#OverlayPlacementController
schema:
  type: object
  additionalProperties: false
  required: [surface]
  properties:
    surface:
      title: Surface
      description: The overlay the controls open in.
      x-telo-ref: { kind: Self.Overlay, use: dependency }
---
# Where a piece of interface keeps its state between visits. A store is a
# kind, so another place to keep it is another kind and nothing that names one
# changes.
kind: Telo.Abstract
metadata:
  name: StateStore
  description: >-
    Where a piece of interface keeps its state between visits, so a viewer
    finds a screen as they left it: the filters they chose, the sections they
    unfolded. Provides the place a renderer persists that state to.
capability: Telo.Provider
outputType: !ref StateStoreSpec
---
kind: Telo.Definition
metadata:
  name: LocalStore
  description: >-
    Keeps interface state in the browser's local storage: chosen filters and
    unfolded sections survive closing the tab and the browser, and are shared
    by every tab of the same application on that device. Nothing is sent to the
    server.
capability: Telo.Provider
extends: Self.StateStore
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#LocalStoreController
schema:
  type: object
  additionalProperties: false
---
kind: Telo.Definition
metadata:
  name: SessionStore
  description: >-
    Keeps interface state in the browser's session storage: chosen filters and
    unfolded sections survive a reload, belong to one tab only, and are gone
    when the tab is closed. Nothing is sent to the server.
capability: Telo.Provider
extends: Self.StateStore
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#SessionStoreController
schema:
  type: object
  additionalProperties: false
---
# How an application's navigation tree is drawn. Each way of drawing it is a
# kind of its own.
kind: Telo.Abstract
metadata:
  name: NavigationPlacement
  description: >-
    How an application's site navigation is drawn: a menu bar in the header
    with dropdowns and submenus, a sidebar collapsing to a narrow rail, the
    whole tree behind a menu button in a drawer, or a bottom tab bar. Provides
    the layout a renderer draws the navigation with, including what replaces
    it on a narrow viewport.
capability: Telo.Provider
outputType: !ref NavigationPlacementSpec
---
# A way of drawing the navigation that suits a narrow viewport: what a
# placement's `compact` names.
kind: Telo.Abstract
metadata:
  name: CompactNavigationPlacement
  description: >-
    A way of drawing site navigation that fits a phone screen, such as a menu
    button opening the whole tree in a drawer or a bottom tab bar. Used in
    place of a wider navigation layout below the application's breakpoint.
capability: Telo.Provider
extends: Self.NavigationPlacement
---
kind: Telo.Definition
metadata:
  name: HeaderNavigation
  description: >-
    Site navigation as a menu bar in the application header: pages and links
    in a row, groups opening as dropdowns, nested groups as submenus, and what
    does not fit moved under More. Replaced on a narrow viewport by a compact
    navigation, a menu button with a drawer unless another is named.
capability: Telo.Provider
extends: Self.NavigationPlacement
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#HeaderNavigationController
schema:
  type: object
  additionalProperties: false
  properties:
    compact:
      title: Compact
      description: >-
        The navigation used instead on a narrow viewport. Omitted, a
        `Ui.OverlayNavigation` with its defaults.
      x-telo-ref: { kind: Self.CompactNavigationPlacement, use: dependency }
---
kind: Telo.Definition
metadata:
  name: SidebarNavigation
  description: >-
    Site navigation as a sidebar beside the page: pages and links in a column,
    groups expanding in place, several open at once. Can collapse to a narrow
    rail whose groups open as flyouts, and remembers the open groups and
    the collapsed rail between visits. Replaced on a narrow viewport by a
    compact navigation, a drawer from the same side unless another is named.
capability: Telo.Provider
extends: Self.NavigationPlacement
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#SidebarNavigationController
schema:
  type: object
  additionalProperties: false
  properties:
    side:
      title: Side
      description: The edge of the page the sidebar sits at.
      enum: [start, end]
      default: start
    rail:
      title: Rail
      description: >-
        Lets the viewer collapse the sidebar to a rail of each top-level
        entry's icon, or its first letter when it has none, its groups opening
        beside it. Omitted, the sidebar does not collapse.
      type: object
      additionalProperties: false
      properties:
        collapsed:
          title: Collapsed
          description: Whether the sidebar starts collapsed. A stored choice overrides it.
          type: boolean
          default: false
    store:
      title: Store
      description: >-
        Where the open groups and whether the rail is collapsed are kept
        between visits. Omitted, in memory only.
      x-telo-ref: { kind: Self.StateStore, use: dependency }
    compact:
      title: Compact
      description: >-
        The navigation used instead on a narrow viewport. Omitted, a
        `Ui.OverlayNavigation` whose drawer slides in from the sidebar's side,
        with its other defaults.
      x-telo-ref: { kind: Self.CompactNavigationPlacement, use: dependency }
---
kind: Telo.Definition
metadata:
  name: OverlayNavigation
  description: >-
    Site navigation behind a menu button: the whole tree, groups expanding in
    place, in a drawer, dialog or popover the button opens. Suits phones and
    applications with many pages; a drawer sliding in from the start edge
    unless another surface is named.
capability: Telo.Provider
extends: Self.CompactNavigationPlacement
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#OverlayNavigationController
schema:
  type: object
  additionalProperties: false
  properties:
    surface:
      title: Surface
      description: >-
        The overlay the tree opens in. Omitted, a `Ui.Drawer` sliding in from
        the start edge, with its other defaults.
      x-telo-ref: { kind: Self.Overlay, use: dependency }
---
kind: Telo.Definition
metadata:
  name: TabBarNavigation
  description: >-
    Site navigation as a bottom tab bar, as phone apps have: the top-level
    pages and links as tabs along the bottom edge, a group opening its entries
    in a bottom sheet, and what does not fit under More. Suits phones, and
    applications with a few main sections on any screen.
capability: Telo.Provider
extends: Self.CompactNavigationPlacement
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#TabBarNavigationController
schema:
  type: object
  additionalProperties: false
  properties:
    visible:
      title: Visible
      description: >-
        How many tabs the bar shows at most. With more top-level entries, the
        last tab is More, holding the rest.
      type: integer
      minimum: 2
      maximum: 5
      default: 5
    surface:
      title: Surface
      description: >-
        The overlay a group's or More's entries open in, in a column. Omitted,
        a `Ui.Drawer` sliding in from the bottom edge, with its other
        defaults.
      x-telo-ref: { kind: Self.Overlay, use: dependency }
---
# A glyph drawn beside text. Each source of glyphs is a kind of its own — a
# file of the application's, an icon set's named glyph — and every one provides
# the one image file the glyph is.
kind: Telo.Abstract
metadata:
  name: Icon
  description: >-
    A single-colour glyph shown beside text, such as the icon of a menu entry
    or a sidebar link. Provides the one image file it is drawn from; a renderer
    serves the file by its content digest and paints its shape in the colour
    of the text around it, so a theme colours an icon as it colours text.
capability: Telo.Provider
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [file]
    properties:
      file:
        title: File
        description: >-
          The image the glyph is drawn from: an SVG, PNG or WebP file whose
          opaque pixels are the glyph's shape.
        x-telo-type: { name: Telo.HostPath, entry: file }
---
kind: Telo.Definition
metadata:
  name: FileIcon
  description: >-
    An icon drawn from an image file of your own, such as a brand mark or a
    symbol no icon set has: an SVG, PNG or WebP image whose shape is painted in
    the colour of the text beside it.
capability: Telo.Provider
extends: Self.Icon
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#FileIconController
schema:
  type: object
  additionalProperties: false
  required: [file]
  properties:
    file:
      title: File
      description: >-
        The image the glyph is drawn from: an SVG, PNG or WebP file whose
        opaque pixels are the glyph's shape. Write `!module-path` for a file
        that ships with the module.
      x-telo-type: { name: Telo.HostPath, entry: file }
---
# How wide a page's content is drawn: within the look's measure, or across all
# the room it has. The one definition of the values; every place an author
# writes a width names it.
kind: Telo.JsonSchema
metadata:
  name: PageWidth
schema:
  title: Page width
  description: >-
    `contained` draws the page's content no wider than the look's page measure
    (the `width.page` design token), centred; `full` lets it take all the room
    it has.
  enum: [contained, full]
---
# One page of an application: its address, its title and its nodes. Its
# composites are resolved once, when it is created; the application invokes it
# per request with the request, and it answers the page as delivered for it.
kind: Telo.Definition
metadata:
  name: Page
  description: >-
    One screen of a web application at its own address: a title and a tree of
    layout, text, data grids, forms and custom components, whose parts can be
    shown per request by a header such as a role or a tenant. Listed by an
    application to route to it and named in its navigation menu.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#PageController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [request]
    properties:
      request:
        type: object
        additionalProperties: false
        required: [headers]
        properties:
          headers:
            type: object
            additionalProperties: { type: string }
          ip: { type: string }
      # The application's width, used when the page declares none.
      pageWidth: { $ref: "telo://Self/PageWidth" }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, title, query, width, children]
    properties:
      path: { type: string }
      title: { $ref: "telo://manifest#/$defs/TextRecord" }
      query: { type: object }
      # The page's own width, else the one it was invoked with, else `contained`.
      width: { $ref: "telo://Self/PageWidth" }
      # Each a `Ui.SpecNode`, judged by the page: one that is not valid is
      # replaced by an error node.
      children:
        type: array
        items: { type: object, required: [type] }
schema:
  type: object
  additionalProperties: false
  required: [path, title, children]
  properties:
    path:
      title: Path
      description: >-
        The page's address under the application's mount: `/` followed by
        anything but `/` or `\`, holding no control character, and not under
        `/_telo`.
      type: string
      pattern: "^/(?!_telo(/|$))([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$"
    title:
      title: Title
      description: Shown above the page, and in the navigation unless an entry says otherwise.
      $ref: "telo://manifest#/$defs/Text"
      x-telo-text-values: {}
    query:
      title: Query
      description: >-
        The query parameters the page's nodes read, each a string or a list of
        strings for a key given more than once. Read as `query` by a condition
        or a value the browser draws.
      $ref: "telo://Self/QueryParameters"
    width:
      title: Width
      description: >-
        How wide the page's content is drawn: `contained` within the look's
        page measure, centred, or `full` across all the room it has. Omitted,
        the application's width applies.
      $ref: "telo://Self/PageWidth"
    children:
      title: Children
      description: >-
        The page's nodes, top to bottom. Each node's `when:` and text values
        may read the request, evaluated per request; a `shown` condition and a
        `value` or `list` node read `query` in the browser.
      type: array
      items: { $ref: "telo://Self/Node" }
      x-telo-context:
        type: object
        properties:
          request:
            x-telo-context-eval: runtime
            type: object
            properties:
              headers:
                type: object
                additionalProperties: { type: string }
              ip: { type: string }
          query:
            x-telo-context-eval: accessor
            x-telo-context-from: query
            type: object
            properties: {}
            additionalProperties: false
---
kind: Telo.Definition
metadata:
  name: View
  description: >-
    A fragment of a page declared once and placed wherever it is needed: a
    header, a summary panel, a section combining text, layout and data grids.
    Holds one node tree and provides it resolved, so a library can ship ready
    interface sections that an application drops into its own pages.
capability: Telo.Provider
extends: Self.Composite
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ViewController
schema:
  type: object
  additionalProperties: false
  required: [content]
  properties:
    content:
      title: Content
      description: The node this view stands for.
      $ref: "telo://Self/Node"
---
kind: Telo.Definition
metadata:
  name: Data
  description: >-
    Loads a record when a page is drawn and shows content built from it: an
    account panel, a sign-in gate, a context card over one API answer. Draws a
    loading state before the first answer and a failure state for a refused
    read, reloads on window focus or when a request inside answers 401, and
    passes declared page query parameters to the read.
capability: Telo.Provider
extends: Self.Composite
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#DataController
schema:
  type: object
  additionalProperties: false
  required: [model, source, content]
  examples:
    - model:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [authorized]
          properties:
            authorized: { type: boolean }
            email: { type: string }
      source: { path: /api/auth }
      reloadOn: [focus, unauthorized]
      content:
        type: stack
        children:
          - type: value
            value: !cel "data.email"
            shown:
              at: !cel "data.authorized"
              matches: { const: true }
  properties:
    model:
      title: Model
      description: The shape of the record the read answers with.
      x-telo-ref: { kind: Telo.Type, use: schema }
    query:
      title: Query
      description: >-
        The page query parameters this reader reads, each a string or a list of
        strings for a key given more than once. Read as `query`.
      $ref: "telo://Self/QueryParameters"
    source:
      title: Source
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          title: Path
          description: >-
            App-relative URL of the record: `/` followed by anything but `/` or
            `\`, holding no control character. Read with `GET`.
          type: string
          pattern: "^/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$"
        params:
          title: Parameters
          description: >-
            Query parameters sent with the read, by name: a path into `query`
            or a fixed value. A value that is absent is not sent.
          type: object
          x-telo-context:
            type: object
            properties:
              query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
          additionalProperties:
            type: [string, number, integer, boolean]
            x-telo-eval: accessor
    content:
      title: Content
      description: What is drawn once an answer is in, over `data` and `query`.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          data:
            x-telo-context-from-root: "model"
            x-telo-context-eval: accessor
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
    loading:
      title: Loading
      description: What is drawn before the first answer. Omitted, the renderer's muted loading word.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
    failure:
      title: Failure
      description: >-
        What is drawn when the read does not succeed, over `error` and `query`.
        Omitted, the error's code and message.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          error:
            x-telo-context-eval: accessor
            $ref: "telo://Self/RequestError"
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
    reloadOn:
      title: Reload on
      description: >-
        What reads the record again: `focus` — the window regains focus or the
        page returns from the back/forward cache — and `unauthorized` — a
        request made inside the content answers 401.
      type: array
      uniqueItems: true
      items: { enum: [focus, unauthorized] }
---
# What a list request may ask of a collection. A screen offers only what is
# declared here, and whatever serves the collection accepts only the same — so
# the two cannot drift apart. A kind serving a collection extends this one.
kind: Telo.Definition
metadata:
  name: Collection
  description: >-
    Declares what a list request may ask of a collection of records: which
    properties it can be filtered by and with which operator — equals, contains,
    greater or less than, one of several — and which properties it can be sorted
    by. Data grids and filter bars offer exactly these, so a screen never sends
    a query its backend would refuse.
capability: Telo.Provider
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#CollectionController
schema:
  type: object
  additionalProperties: false
  required: [query]
  examples:
    - query:
        filters:
          - { property: text, operator: contains }
          - { property: isDone, operator: eq }
        sort:
          - { property: dueOn }
  properties:
    query:
      title: Query
      description: What a list request may filter and sort by. Nothing else is accepted.
      type: object
      additionalProperties: false
      required: [filters, sort]
      properties:
        filters:
          title: Filters
          description: The accepted filters, each one property with one operator.
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [property, operator]
            properties:
              property: { title: Property, type: string }
              operator:
                title: Operator
                enum: [eq, contains, gt, gte, lt, lte, in]
        sort:
          title: Sort
          description: The properties a list may be ordered by.
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [property]
            properties:
              property: { title: Property, type: string }
---
kind: Telo.Definition
metadata:
  name: Table
  description: >-
    A data grid over a REST collection: rows fetched page by page with a cursor,
    one-click sorting on the columns the collection can be ordered by, a total
    count, per-row and per-cell conditional styling, and optional create, edit
    and delete actions. Columns come from the row model unless listed, so a
    property added to the model appears without an edit and a renamed one is
    caught before deploy.
capability: Telo.Provider
extends: Self.Composite
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#TableController
schema:
  type: object
  additionalProperties: false
  required: [model, collection, source]
  properties:
    model:
      title: Model
      description: The shape of one row.
      x-telo-ref: { kind: Telo.Type, use: schema }
    collection:
      title: Collection
      description: >-
        What the collection's list request accepts. A column sorts where its
        value is a property this lists under `query.sort`.
      x-telo-ref: { kind: Self.Collection, use: dependency }
    source:
      title: Source
      type: object
      additionalProperties: false
      required: [basePath]
      properties:
        basePath:
          title: Base path
          description: >-
            App-relative URL of the collection: `/` followed by anything but
            `/` or `\`, holding no control character.
          type: string
          pattern: "^/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$"
        filters:
          title: Filters
          description: >-
            Equalities applied to every request, keyed by model property: a
            fixed value, or a path into `query`. Each is a filter the
            collection accepts with `eq`. While one holds nothing, the table
            reads nothing.
          type: object
          x-telo-context:
            type: object
            properties:
              query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
          additionalProperties:
            type: [string, number, integer, boolean]
            x-telo-eval: accessor
            x-telo-value-schema-from: { from: /model, member: "0#" }
    rowKey:
      title: Row key
      description: The property identifying a row in item URLs.
      type: string
      default: id
    columns:
      title: Columns
      description: >-
        The columns, left to right. Omitted, there is one per model property
        but the row key, in declaration order.
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          header: { title: Header, $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
          value:
            title: Value
            description: The value shown, as a path into the row or a fixed value.
            x-telo-eval: accessor
            x-telo-context:
              type: object
              properties:
                row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor }
          cell:
            title: Cell
            description: A component drawn in place of a value.
            x-telo-ref: { kind: Self.Component, use: dependency }
          style:
            title: Style rule
            description: Styles chosen by a value of the row.
            type: object
            additionalProperties: false
            required: [by, cases]
            properties:
              by:
                title: By
                x-telo-eval: accessor
                x-telo-context:
                  type: object
                  properties:
                    row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor }
              cases:
                title: Cases
                description: Styles keyed by the plain text of the value.
                type: object
                additionalProperties: { $ref: "#/$defs/Style" }
              default: { $ref: "#/$defs/Style" }
        # Exactly one of the two.
        oneOf:
          - required: [value]
          - required: [cell]
    pageSize:
      title: Page size
      description: Rows per page, sent as `limit`.
      type: integer
      minimum: 1
      maximum: 100
      default: 25
    rowStyle:
      title: Style rule
      description: Styles chosen by a value of the row.
      type: object
      additionalProperties: false
      required: [by, cases]
      properties:
        by:
          title: By
          x-telo-eval: accessor
          x-telo-context:
            type: object
            properties:
              row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor }
        cases:
          title: Cases
          description: Styles keyed by the plain text of the value.
          type: object
          additionalProperties: { $ref: "#/$defs/Style" }
        default: { $ref: "#/$defs/Style" }
    create:
      title: Create
      description: The form that adds a row, and where and how it opens.
      type: object
      additionalProperties: false
      required: [form]
      properties:
        form:
          title: Form
          description: The form opened.
          x-telo-ref: { kind: Self.Form, use: dependency }
        surface:
          title: Surface
          description: Where the form appears. Omitted, a dialog with its defaults.
          x-telo-ref: { kind: Self.Surface, use: dependency }
        afterSubmit:
          title: After submit
          description: >-
            What the form does once the record is saved: `close`, `again` — stay
            open, back at the values a new record starts from, for another — or
            `keep` its values.
          $ref: "telo://Self/AfterCreate"
        unsaved:
          title: Unsaved input
          description: >-
            Whether leaving the form with unsaved input asks first (`confirm`)
            or drops it (`discard`).
          $ref: "telo://Self/UnsavedInput"
    edit:
      title: Edit
      description: The form that changes a row, prefilled from the record, and where and how it opens.
      type: object
      additionalProperties: false
      required: [form]
      properties:
        form:
          title: Form
          description: The form opened.
          x-telo-ref: { kind: Self.Form, use: dependency }
        surface:
          title: Surface
          description: Where the form appears. Omitted, a dialog with its defaults.
          x-telo-ref: { kind: Self.Surface, use: dependency }
        afterSubmit:
          title: After submit
          description: >-
            What the form does once the record is saved: `close`, or `keep` it
            open.
          $ref: "telo://Self/AfterEdit"
        unsaved:
          title: Unsaved input
          description: >-
            Whether leaving the form with unsaved input asks first (`confirm`)
            or drops it (`discard`).
          $ref: "telo://Self/UnsavedInput"
    delete:
      title: Delete
      description: Whether each row offers a confirmed delete.
      type: boolean
      default: false
    query:
      title: Query
      description: >-
        The page query parameters its row actions read, each a string or a
        list of strings for a key given more than once. Read as `query`.
      $ref: "telo://Self/QueryParameters"
    rowActions:
      title: Row actions
      description: >-
        Operations each row offers, in order, drawn before edit and delete,
        over `row` and `query`. A pressed one draws its action's answer in
        place of its button, kept while that row is on the shown page.
      type: array
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-from-root: "model", x-telo-context-eval: accessor }
          query: { x-telo-context-eval: accessor, x-telo-context-from: query, type: object, properties: {}, additionalProperties: false }
      items: { $ref: "telo://Self/RowAction" }
  $defs:
    StyleName:
      enum: [heading, subheading, muted, strong, accent, danger, warning, success]
    Style:
      anyOf:
        - $ref: "#/$defs/StyleName"
        - type: array
          items: { $ref: "#/$defs/StyleName" }
  x-telo-resource-rules:
    - resolve: [/model]
      in: /source/filters
      condition: !cel "has((has(self.model.schema) ? self.model.schema : self.model).properties) && key in (has(self.model.schema) ? self.model.schema : self.model).properties"
      code: UI_SOURCE_FILTER_UNKNOWN_PROPERTY
      message: >-
        filters its source by a property the row model does not declare. Use a
        property of `model`, or add this one to it.
    - resolve: [/collection]
      in: /source/filters
      condition: !cel >-
        !has(self.collection.query) || !has(self.collection.query.filters)
        || self.collection.query.filters.exists(f, f.property == key && f.operator == 'eq')
      code: UI_SOURCE_FILTER_NOT_ACCEPTED
      message: >-
        filters its source by a property the collection does not accept an
        equality on. Declare it with operator `eq` under the collection's
        `query.filters`, or remove this filter.
---
kind: Telo.Definition
metadata:
  name: Form
  description: >-
    An input form generated from a data model: a labelled control per property,
    chosen from its type — checkbox, select, number, date, text, and a
    multi-choice or tag list for a list of values — validated in the browser
    against the model's own rules before anything is sent, with the server's
    field errors shown beside the fields they name. Creates a record, or edits
    one when a data grid opens it.
capability: Telo.Provider
extends: Self.Composite
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#FormController
schema:
  type: object
  additionalProperties: false
  required: [model, source]
  properties:
    model:
      title: Model
      description: The shape of the record the form edits.
      x-telo-ref: { kind: Telo.Type, use: schema }
    source:
      title: Source
      type: object
      additionalProperties: false
      required: [basePath]
      properties:
        basePath:
          title: Base path
          description: >-
            App-relative URL of the collection written to: `/` followed by
            anything but `/` or `\`, holding no control character.
          type: string
          pattern: "^/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$"
    fields:
      title: Fields
      description: >-
        The fields, top to bottom: a property name, entered as the model
        says, or a field kind. Omitted, every model property a control can
        enter: a scalar, or a list of scalars.
      type: array
      x-telo-context:
        type: object
        properties:
          values:
            x-telo-context-from-root: "model"
            x-telo-context-eval: accessor
            x-telo-context-item-fills: ["", "/property"]
      items:
        anyOf:
          - title: Property
            description: A property, entered with the control its schema calls for.
            type: string
          - title: Field
            description: A field kind entering one property.
            x-telo-ref: { kind: Self.Field, use: call }
    groups:
      title: Groups
      description: >-
        Labelled sections the fields name by `group`. A group's fields are
        listed one after another, so the list's order is the order they are
        drawn in.
      type: array
      x-telo-context:
        type: object
        properties:
          values:
            x-telo-context-from-root: "model"
            x-telo-context-eval: accessor
      items: { $ref: "telo://Self/FieldGroup" }
    state:
      title: State
      description: >-
        Where the values entered are kept between visits. Omitted, they are
        not kept.
      $ref: "telo://Self/StateRecord"
  x-telo-resource-rules:
    - resolve: [/model, /fields]
      in: /fields
      condition: !cel >-
        !has(self.model) ||
        cel.bind(m, has(self.model.schema) ? self.model.schema : self.model,
          has(m.properties) && (type(this) == string ? this : this.property) in m.properties)
      code: UI_FIELD_UNKNOWN_PROPERTY
      message: >-
        lists a field for a property the model does not declare. Use a property
        of `model`, or add this one to it.
    - resolve: [/model]
      in: /fields
      condition: !cel >-
        !has(self.model) ||
        cel.bind(m, has(self.model.schema) ? self.model.schema : self.model,
          type(this) != string || !has(m.properties) || !(this in m.properties)
          || Self.controlFits('auto', m.properties[this], null))
      code: UI_FIELD_UNSUPPORTED
      message: >-
        lists a property no control can enter. A property name enters a
        string, a number, a boolean, one of an `enum`, or a list of those:
        remove it, give `model` a property of such a type, or name a field
        kind that enters it.
    - resolve: [/model, /fields]
      condition: !cel >-
        !has(self.model) ||
        cel.bind(m, has(self.model.schema) ? self.model.schema : self.model,
          !has(m.required) || m.required.all(r,
            has(self.fields)
              ? self.fields.exists(e, (type(e) == string ? e : e.property) == r)
              : has(m.properties) && r in m.properties && Self.controlFits('auto', m.properties[r], null)))
      code: UI_FIELD_REQUIRED_NOT_ENTERED
      message: >-
        leaves a property the model requires with no field, so a valid record
        could never be sent. List a field for every required property, or leave
        `fields` out where each one is a scalar or a list of scalars.
    - resolve: [/fields]
      in: /fields
      condition: !cel >-
        cel.bind(p, type(this) == string ? this : this.property,
          self.fields.filter(e, (type(e) == string ? e : e.property) == p).size() == 1)
      code: UI_FIELD_DUPLICATE
      message: >-
        enters a property another field enters too. Each property is entered by
        one field: remove one of the two.
    - resolve: [/fields]
      in: /fields
      condition: !cel >-
        type(this) == string || !('group' in this)
        || (has(self.groups) && self.groups.exists(g, g.name == this.group))
      code: UI_FIELD_GROUP_UNKNOWN
      message: >-
        names a group `groups` does not declare. Declare it under `groups`, or
        correct the name.
    - in: /groups
      condition: !cel "self.groups.exists_one(g, g.name == this.name)"
      code: UI_FIELD_GROUP_DUPLICATE
      message: >-
        has the name of another group. A field names its group: give each its
        own.
    - resolve: [/fields]
      in: /groups
      condition: !cel >-
        !has(self.fields) || cel.bind(gs, self.fields.map(e, type(e) != string && 'group' in e ? e.group : ''),
          enumerate(gs).filter(p, p.value == this.name && (p.index == 0 || gs[p.index - 1] != this.name)).size() <= 1)
      code: UI_FIELD_GROUP_SPLIT
      message: >-
        is named by fields that are not listed one after another. A group is
        drawn where its fields are: list them together.
    # Anchored at the resource: `in:` cannot reach into a named shape.
    - resolve: [/model, /fields]
      condition: !cel >-
        !has(self.model) ||
        cel.bind(m, has(self.model.schema) ? self.model.schema : self.model,
          !has(self.state) || !has(self.state.fields) || self.state.fields.all(k,
            has(self.fields)
              ? self.fields.exists(e, (type(e) == string ? e : e.property) == k)
              : has(m.properties) && k in m.properties && Self.controlFits('auto', m.properties[k], null)))
      code: UI_STATE_FIELD_UNKNOWN
      message: >-
        keeps a property under `state.fields` no field shows. Name only
        properties the fields enter, or leave `state.fields` out to keep every
        one.
---
kind: Telo.Definition
metadata:
  name: Action
  description: >-
    A button that runs a server operation from a page, with an optional input
    form generated from the request's data model and validated before anything
    is sent. Draws the answer as content — generated files, report links,
    search hits — and a refusal as an error, then navigates or refreshes data
    on success; presses run in parallel or one at a time. Data grids and lists
    offer one on every row.
capability: Telo.Provider
extends: Self.Composite
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ActionController
# What a call site naming an action hands it: a record of its input model.
inputType:
  type: object
  x-telo-value-schema-from: inputModel
schema:
  type: object
  additionalProperties: false
  required: [inputModel, source, label]
  examples:
    - inputModel:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [month]
          properties:
            month: { type: string, title: Month, pattern: "^[0-9]{4}-[0-9]{2}$" }
            formats:
              type: array
              title: Formats
              items: { enum: [pdf, csv] }
      outputModel:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [files]
          properties:
            files:
              type: array
              items:
                type: object
                properties:
                  name: { type: string, title: File }
                  url: { type: string, title: Download, format: uri-reference }
      source: { path: /api/reports }
      label: Generate
      result:
        type: list
        heading: Files
        rows: !cel "result.files"
        columns:
          - value: !cel "row.name"
          - value: !cel "row.url"
      onSuccess:
        refreshes: [/api/reports]
  properties:
    inputModel:
      title: Input model
      description: The shape of the record sent as the request body.
      x-telo-ref: { kind: Telo.Type, use: schema }
    outputModel:
      title: Output model
      description: >-
        The shape of the answer, read as `result`. A success's body is held to
        it before anything is drawn from it.
      x-telo-ref: { kind: Telo.Type, use: schema }
    source:
      title: Source
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          title: Path
          description: >-
            App-relative URL of the operation: `/` followed by anything but
            `/` or `\`, holding no control character.
          type: string
          pattern: "^/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$"
    label:
      title: Label
      description: The text of the button that runs the operation.
      $ref: "telo://manifest#/$defs/Text"
      x-telo-text-values: {}
    fields:
      title: Fields
      description: >-
        The fields, top to bottom: a property name, entered as the input model
        says, or a field kind. Omitted, every input model property a control
        can enter: a scalar, or a list of scalars.
      type: array
      x-telo-context:
        type: object
        properties:
          values:
            x-telo-context-from-root: "inputModel"
            x-telo-context-eval: accessor
            x-telo-context-item-fills: ["", "/property"]
      items:
        anyOf:
          - title: Property
            description: A property, entered with the control its schema calls for.
            type: string
          - title: Field
            description: A field kind entering one property.
            x-telo-ref: { kind: Self.Field, use: call }
    groups:
      title: Groups
      description: >-
        Labelled sections the fields name by `group`. A group's fields are
        listed one after another, so the list's order is the order they are
        drawn in.
      type: array
      x-telo-context:
        type: object
        properties:
          values:
            x-telo-context-from-root: "inputModel"
            x-telo-context-eval: accessor
      items: { $ref: "telo://Self/FieldGroup" }
    state:
      title: State
      description: >-
        Where the values entered are kept between visits. Omitted, they are
        not kept.
      $ref: "telo://Self/StateRecord"
    enabled:
      title: Enabled
      description: >-
        When the button can be pressed, over the form's current `values`, and
        the reason shown while it cannot. Omitted, it always can.
      $ref: "telo://Self/Enablement"
      x-telo-context:
        type: object
        properties:
          values:
            x-telo-context-from-root: "inputModel"
            x-telo-context-eval: accessor
    result:
      title: Result
      description: >-
        What is drawn from a success, over `result` (the answer), `input` (the
        record sent) and `values` (the form's current values). Omitted, a
        success draws nothing.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          result:
            x-telo-context-from-root: "outputModel"
            x-telo-context-eval: accessor
            type: object
            properties: {}
            additionalProperties: false
          input:
            x-telo-context-from-root: "inputModel"
            x-telo-context-eval: accessor
          values:
            x-telo-context-from-root: "inputModel"
            x-telo-context-eval: accessor
    failure:
      title: Failure
      description: >-
        What is drawn when the operation does not succeed — any answer but a
        2xx, no answer at all, or a 2xx body the output model refuses — over
        `error`, `input` and `values`. Omitted, the error's code and message.
      $ref: "telo://Self/Node"
      x-telo-context:
        type: object
        properties:
          error:
            x-telo-context-eval: accessor
            $ref: "telo://Self/RequestError"
          input:
            x-telo-context-from-root: "inputModel"
            x-telo-context-eval: accessor
          values:
            x-telo-context-from-root: "inputModel"
            x-telo-context-eval: accessor
    onSuccess:
      title: On success
      description: What happens once the operation succeeds, besides drawing `result`.
      type: object
      additionalProperties: false
      properties:
        navigate:
          title: Navigate
          description: >-
            Where the page goes: a path into `result`, or a fixed address. An
            app-relative path of a declared page moves within the application,
            any other loads it; an `https://` or `http://` address replaces the
            page. A value that is no such address navigates nowhere.
          type: string
          pattern: "^(/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$|https://|http://|mailto:)"
          x-telo-eval: accessor
          x-telo-context:
            type: object
            properties:
              result:
                x-telo-context-from-root: "outputModel"
                x-telo-context-eval: accessor
                type: object
                properties: {}
                additionalProperties: false
        refreshes:
          title: Refreshes
          description: >-
            App-relative paths read again: every table whose `source.basePath`
            and every reader whose `source.path` equals one of them.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$"
    concurrency:
      title: Concurrency
      description: >-
        Whether presses of this action run at once (`parallel`) or one after
        another in the order they were made on this page (`serial`). Either
        way the form, or one row, takes no press while its last is pending.
      enum: [parallel, serial]
      default: parallel
    clearAnswerOn:
      title: Clear answer on
      description: >-
        Input properties whose change clears what was drawn from the last
        answer. A new submission always clears it.
      type: array
      uniqueItems: true
      items: { type: string }
  x-telo-resource-rules:
    - resolve: [/inputModel]
      in: /clearAnswerOn
      condition: !cel "has((has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel).properties) && this in (has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel).properties"
      code: UI_ACTION_CLEAR_UNKNOWN_PROPERTY
      message: >-
        clears its answer on a property the input model does not declare, which
        never changes. Use a property of `inputModel`, or remove this entry.
    - resolve: [/inputModel, /fields]
      in: /fields
      condition: !cel >-
        cel.bind(m, has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel,
          has(m.properties) && (type(this) == string ? this : this.property) in m.properties)
      code: UI_FIELD_UNKNOWN_PROPERTY
      message: >-
        lists a field for a property the input model does not declare. Use a property
        of `inputModel`, or add this one to it.
    - resolve: [/inputModel]
      in: /fields
      condition: !cel >-
        cel.bind(m, has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel,
          type(this) != string || !has(m.properties) || !(this in m.properties)
          || Self.controlFits('auto', m.properties[this], null))
      code: UI_FIELD_UNSUPPORTED
      message: >-
        lists a property no control can enter. A property name enters a
        string, a number, a boolean, one of an `enum`, or a list of those:
        remove it, give `inputModel` a property of such a type, or name a field
        kind that enters it.
    - resolve: [/inputModel, /fields]
      condition: !cel >-
        cel.bind(m, has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel,
          !has(m.required) || m.required.all(r,
            has(self.fields)
              ? self.fields.exists(e, (type(e) == string ? e : e.property) == r)
              : has(m.properties) && r in m.properties && Self.controlFits('auto', m.properties[r], null)))
      code: UI_FIELD_REQUIRED_NOT_ENTERED
      message: >-
        leaves a property the input model requires with no field, so a valid record
        could never be sent. List a field for every required property, or leave
        `fields` out where each one is a scalar or a list of scalars.
    - resolve: [/fields]
      in: /fields
      condition: !cel >-
        cel.bind(p, type(this) == string ? this : this.property,
          self.fields.filter(e, (type(e) == string ? e : e.property) == p).size() == 1)
      code: UI_FIELD_DUPLICATE
      message: >-
        enters a property another field enters too. Each property is entered by
        one field: remove one of the two.
    - resolve: [/fields]
      in: /fields
      condition: !cel >-
        type(this) == string || !('group' in this)
        || (has(self.groups) && self.groups.exists(g, g.name == this.group))
      code: UI_FIELD_GROUP_UNKNOWN
      message: >-
        names a group `groups` does not declare. Declare it under `groups`, or
        correct the name.
    - in: /groups
      condition: !cel "self.groups.exists_one(g, g.name == this.name)"
      code: UI_FIELD_GROUP_DUPLICATE
      message: >-
        has the name of another group. A field names its group: give each its
        own.
    - resolve: [/fields]
      in: /groups
      condition: !cel >-
        !has(self.fields) || cel.bind(gs, self.fields.map(e, type(e) != string && 'group' in e ? e.group : ''),
          enumerate(gs).filter(p, p.value == this.name && (p.index == 0 || gs[p.index - 1] != this.name)).size() <= 1)
      code: UI_FIELD_GROUP_SPLIT
      message: >-
        is named by fields that are not listed one after another. A group is
        drawn where its fields are: list them together.
    # Anchored at the resource: `in:` cannot reach into a named shape.
    - resolve: [/inputModel, /fields]
      condition: !cel >-
        cel.bind(m, has(self.inputModel.schema) ? self.inputModel.schema : self.inputModel,
          !has(self.state) || !has(self.state.fields) || self.state.fields.all(k,
            has(self.fields)
              ? self.fields.exists(e, (type(e) == string ? e : e.property) == k)
              : has(m.properties) && k in m.properties && Self.controlFits('auto', m.properties[k], null)))
      code: UI_STATE_FIELD_UNKNOWN
      message: >-
        keeps a property under `state.fields` no field shows. Name only
        properties the fields enter, or leave `state.fields` out to keep every
        one.
---
kind: Telo.Definition
metadata:
  name: Filters
  description: >-
    A filter bar over the data grids it contains: one control per filter the
    collection accepts, with named presets, summary chips for what is chosen,
    and a reset. The controls can fold behind a button or open in an overlay.
    Chosen values are kept between visits and shareable in the page address;
    every grid inside narrows to them.
capability: Telo.Provider
extends: Self.Composite
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#FiltersController
schema:
  type: object
  additionalProperties: false
  required: [model, collection, content]
  properties:
    model:
      title: Model
      description: The shape of the rows being filtered.
      x-telo-ref: { kind: Telo.Type, use: schema }
    collection:
      title: Collection
      description: >-
        What the collection's list request accepts. The bar offers only filters
        this lists under `query.filters`.
      x-telo-ref: { kind: Self.Collection, use: dependency }
    fields:
      title: Fields
      description: >-
        The filters, in order. Omitted, one per filter the collection accepts,
        in the order it declares them.
      type: array
      items:
        type: object
        additionalProperties: false
        required: [property, operator]
        properties:
          property: { title: Property, type: string }
          operator:
            title: Operator
            enum: [eq, contains, gt, gte, lt, lte, in]
          pinned:
            title: Pinned
            description: >-
              Kept outside whatever the bar folds into, always on show, and
              never removable.
            type: boolean
            default: false
          control:
            title: Control
            description: >-
              How the value is entered: derived from the property (`auto`), a
              `select` list, `options` side by side, a `toggle`, a `slider`,
              typed `tags`, or `none` — drawn nowhere, set by a preset or a
              default only.
            anyOf:
              - $ref: "telo://Self/Control"
              - const: none
            default: auto
          default:
            title: Default
            description: >-
              What the filter holds until the viewer changes it: one value, or a
              list of them under `in`.
            anyOf:
              - type: [string, number, boolean]
              - type: array
                items: { type: [string, number, boolean] }
    presets:
      title: Presets
      description: >-
        Named sets of filter values, drawn as one exclusive choice. Choosing one
        sets the filters the presets name between them and leaves the rest.
      type: array
      items:
        type: object
        additionalProperties: false
        required: [label, values]
        properties:
          label: { title: Label, $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
          values:
            title: Values
            type: array
            items:
              type: object
              additionalProperties: false
              required: [property, operator, value]
              properties:
                property: { title: Property, type: string }
                operator:
                  title: Operator
                  enum: [eq, contains, gt, gte, lt, lte, in]
                value:
                  title: Value
                  anyOf:
                    - type: [string, number, boolean]
                    - type: array
                      items: { type: [string, number, boolean] }
    policy:
      title: Policy
      description: >-
        Which filters are on show, where the controls sit, how they are drawn,
        when a change applies, what summarises the bar and where its state is
        kept.
      $ref: "telo://Self/FilterPolicy"
    content:
      title: Content
      description: The node the filters apply to.
      $ref: "telo://Self/Node"
  x-telo-resource-rules:
    - resolve: [/model]
      in: /fields
      condition: !cel "!has(self.model) || has((has(self.model.schema) ? self.model.schema : self.model).properties) && this.property in (has(self.model.schema) ? self.model.schema : self.model).properties"
      code: UI_FILTER_UNKNOWN_PROPERTY
      message: >-
        filters by a property the model does not declare. Use a property of
        `model`, or add this one to it.
    # `contains` reads text and the comparisons read an ordered value, so each
    # is refused on a property whose declared type cannot carry it. Checked
    # only where the property declares one plain type.
    - resolve: [/model]
      in: /fields
      condition: !cel >-
        !has(self.model) ||
        !has((has(self.model.schema) ? self.model.schema : self.model).properties)
        || !(this.property in (has(self.model.schema) ? self.model.schema : self.model).properties)
        || !('type' in (has(self.model.schema) ? self.model.schema : self.model).properties[this.property])
        || type((has(self.model.schema) ? self.model.schema : self.model).properties[this.property].type) != string
        || (this.operator in ['eq', 'in']
            && (has(self.model.schema) ? self.model.schema : self.model).properties[this.property].type in ['string', 'number', 'integer', 'boolean'])
        || (this.operator == 'contains'
            && (has(self.model.schema) ? self.model.schema : self.model).properties[this.property].type == 'string')
        || (this.operator in ['gt', 'gte', 'lt', 'lte']
            && (has(self.model.schema) ? self.model.schema : self.model).properties[this.property].type in ['string', 'number', 'integer'])
      code: UI_FILTER_OPERATOR_UNSUPPORTED
      message: >-
        uses an operator the property's type does not support: `contains` needs a
        string, `gt` / `gte` / `lt` / `lte` a string or a number, and no operator
        applies to an object or a list.
    - resolve: [/collection]
      in: /fields
      condition: !cel >-
        !has(self.collection.query) || !has(self.collection.query.filters)
        || self.collection.query.filters.exists(f, f.property == this.property && f.operator == this.operator)
      code: UI_FILTER_NOT_ACCEPTED
      message: >-
        filters by a property and operator the collection does not accept.
        Declare the pair under the collection's `query.filters`, or remove this
        field.
    # With no `fields`, every filter the collection accepts becomes a control,
    # drawn from the model's property of that name — so each is held to what a
    # listed field is: a declared property, and an operator its type carries.
    - resolve: [/model, /collection]
      condition: !cel >-
        !has(self.model) ||
        has(self.fields) || !has(self.collection.query) || !has(self.collection.query.filters)
        || self.collection.query.filters.all(f,
             has((has(self.model.schema) ? self.model.schema : self.model).properties)
             && f.property in (has(self.model.schema) ? self.model.schema : self.model).properties
             && (!('type' in (has(self.model.schema) ? self.model.schema : self.model).properties[f.property])
                 || type((has(self.model.schema) ? self.model.schema : self.model).properties[f.property].type) != string
                 || (f.operator in ['eq', 'in']
                     && (has(self.model.schema) ? self.model.schema : self.model).properties[f.property].type in ['string', 'number', 'integer', 'boolean'])
                 || (f.operator == 'contains'
                     && (has(self.model.schema) ? self.model.schema : self.model).properties[f.property].type == 'string')
                 || (f.operator in ['gt', 'gte', 'lt', 'lte']
                     && (has(self.model.schema) ? self.model.schema : self.model).properties[f.property].type in ['string', 'number', 'integer'])))
      code: UI_FILTER_MODEL_INCOMPLETE
      message: >-
        shows every filter the collection accepts, and the model cannot answer
        for one of them: it does not declare the property, or the operator does
        not fit the property's type. Give the bar a model that can, or list the
        filters to show under `fields`.
    # State, defaults and presets are keyed by the pair, so it names one filter.
    - in: /fields
      condition: !cel "self.fields.exists_one(f, f.property == this.property && f.operator == this.operator)"
      code: UI_FILTER_DUPLICATE
      message: >-
        lists a property and operator another field already has. A filter is
        one property with one operator: remove one of the two.
    - resolve: [/model]
      in: /fields
      condition: !cel >-
        !has(self.model) ||
        !('default' in this)
        || ((!('control' in this) || this.control != 'toggle' || type(this.default) != bool || this.default != false)
        && (!has((has(self.model.schema) ? self.model.schema : self.model).properties)
        || !(this.property in (has(self.model.schema) ? self.model.schema : self.model).properties)
        || ((type(this.default) == list) == (this.operator == 'in')
            && [(has(self.model.schema) ? self.model.schema : self.model).properties[this.property]].all(p,
               (type(this.default) == list ? this.default : [this.default]).all(v,
                 (!('enum' in p) || v in p.enum)
                 && (!('type' in p) || type(p.type) != string
                     || !(p.type in ['string', 'boolean', 'integer', 'number'])
                     || (p.type == 'string' && type(v) == string)
                     || (p.type == 'boolean' && type(v) == bool)
                     || (p.type == 'integer' && (type(v) == int || (type(v) == double && double(int(v)) == v)))
                     || (p.type == 'number' && (type(v) == int || type(v) == double))))))))
      code: UI_FILTER_DEFAULT_INVALID
      message: >-
        declares a default its filter cannot hold: a value that is not of the
        property's type or not one of its `enum`, a list without the `in`
        operator, a single value with it, or `false` for a filter entered with
        a `toggle`, which holds true or nothing.
    # The one fit predicate every control rule reads, over the filter's operator.
    - resolve: [/model]
      in: /fields
      condition: !cel >-
        !has(self.model) ||
        !('control' in this) || this.control in ['auto', 'none']
        || !has((has(self.model.schema) ? self.model.schema : self.model).properties)
        || !(this.property in (has(self.model.schema) ? self.model.schema : self.model).properties)
        || Self.controlFits(this.control, (has(self.model.schema) ? self.model.schema : self.model).properties[this.property], this.operator)
      code: UI_FILTER_CONTROL_UNSUPPORTED
      message: >-
        asks for a control its filter cannot be entered with: `select` and
        `options` need an `enum` or a boolean, `toggle` a boolean with `eq`,
        `slider` a number or integer declaring `minimum` and `maximum` with
        `eq` or a comparison, and `tags` the `in` operator.
    - resolve: [/collection]
      in: /presets
      condition: !cel >-
        this.values.all(v, has(self.fields)
          ? self.fields.exists(f, f.property == v.property && f.operator == v.operator)
          : (!has(self.collection.query) || !has(self.collection.query.filters)
             || self.collection.query.filters.exists(f, f.property == v.property && f.operator == v.operator)))
      code: UI_FILTER_PRESET_UNKNOWN_FILTER
      message: >-
        sets a property and operator the bar does not show. Name a pair listed
        under `fields`, or one the collection accepts when `fields` is left out.
    - resolve: [/model]
      in: /presets
      condition: !cel >-
        !has(self.model) ||
        this.values.all(e,
          (!has(self.fields) || type(e.value) != bool || e.value != false
           || !self.fields.exists(f, f.property == e.property && f.operator == e.operator && 'control' in f && f.control == 'toggle'))
          && (!has((has(self.model.schema) ? self.model.schema : self.model).properties)
          || !(e.property in (has(self.model.schema) ? self.model.schema : self.model).properties)
          || ((type(e.value) == list) == (e.operator == 'in')
              && [(has(self.model.schema) ? self.model.schema : self.model).properties[e.property]].all(p,
                 (type(e.value) == list ? e.value : [e.value]).all(v,
                 (!('enum' in p) || v in p.enum)
                 && (!('type' in p) || type(p.type) != string
                     || !(p.type in ['string', 'boolean', 'integer', 'number'])
                     || (p.type == 'string' && type(v) == string)
                     || (p.type == 'boolean' && type(v) == bool)
                     || (p.type == 'integer' && (type(v) == int || (type(v) == double && double(int(v)) == v)))
                     || (p.type == 'number' && (type(v) == int || type(v) == double))))))))
      code: UI_FILTER_PRESET_VALUE_INVALID
      message: >-
        sets a value its filter cannot hold: one that is not of the property's
        type or not one of its `enum`, a list without the `in` operator, a
        single value with it, or `false` for a filter entered with a `toggle`,
        which holds true or nothing.
    - in: /presets
      condition: !cel "self.presets.exists_one(p, p.label == this.label)"
      code: UI_FILTER_PRESET_LABEL_DUPLICATE
      message: >-
        has the label of another preset. A preset is chosen by its label: give
        each its own.
    - resolve: [/collection]
      condition: !cel >-
        !has(self.policy) || !has(self.policy.state) || !has(self.policy.state.fields)
        || self.policy.state.fields.all(k, has(self.fields)
          ? self.fields.exists(f, f.property == k)
          : !has(self.collection.query) || !has(self.collection.query.filters)
            || self.collection.query.filters.exists(f, f.property == k))
      code: UI_STATE_FIELD_UNKNOWN
      message: >-
        keeps a property under `policy.state.fields` no filter of the bar
        shows. Name only properties its filters enter, or leave
        `state.fields` out to keep every one.
    # With a placement written, the placement's own rule answers this.
    - severity: warning
      condition: !cel >-
        (has(self.policy) && (has(self.policy.placement)
          || (has(self.policy.show) && self.policy.show == 'chosen')))
        || !has(self.fields)
        || !self.fields.exists(f, 'pinned' in f && f.pinned)
      code: UI_FILTER_PINNED_UNUSED
      message: >-
        pins a field, but nothing folds: every filter is on show whatever is
        pinned. Use a placement that folds, show only the `chosen` filters, or
        remove `pinned`.
---
# One entry of a form or an action. Its kind judges whether it can enter its
# property in the model of whoever places it: a rule on the referrer for
# `telo check`, the same answer from `invoke` at creation.
kind: Telo.Abstract
metadata:
  name: Field
  description: >-
    One entry of a data-entry form: the property it enters, the labelled
    section it is drawn in and when it is shown. Answers, for the data model
    of the form placing it, whether it can enter that property there and what
    a renderer draws for it, so a field from any module is checked against the
    model it is placed in.
capability: Telo.Invocable
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [model]
    properties:
      model:
        title: Model
        description: The schema of the record the form or action enters.
        type: object
outputType: !ref FieldAnswer
schema:
  type: object
  required: [property]
  properties:
    property:
      title: Property
      description: The model property the field enters.
      type: string
    group:
      title: Group
      description: The name of the section of `groups` the field is drawn in.
      type: string
    shown:
      title: Shown
      description: >-
        Whether the field is drawn, over the form's current `values`. A hidden
        field keeps what it holds and is neither sent nor checked, while the
        record is still held to the model.
      $ref: "telo://Self/Condition"
      x-telo-context:
        type: object
        properties:
          values: { x-telo-context-from-referrer: values, x-telo-context-eval: accessor }
---
kind: Telo.Definition
metadata:
  name: InputField
  description: >-
    A form field entering one property with a control: chosen from the
    property's type, or a select list, options side by side, an on/off switch,
    a slider or typed tags. A control the property cannot be entered with is
    caught before the page is ever served.
capability: Telo.Invocable
extends: Self.Field
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#InputFieldController
schema:
  type: object
  additionalProperties: false
  properties:
    control:
      title: Control
      description: >-
        How the value is entered: derived from the property (`auto`), a
        `select` list, `options` side by side, a `toggle`, a `slider`, or
        typed `tags`.
      $ref: "telo://Self/Control"
      default: auto
  x-telo-referrer-rules:
    - referrer: Self.Form
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, (has(referrer.model.schema) ? referrer.model.schema : referrer.model),
          !has(m.properties) || !(self.property in m.properties)
          || Self.controlFits(has(self.control) ? self.control : 'auto', m.properties[self.property], null))
      code: UI_FIELD_CONTROL_UNSUPPORTED
      message: >-
        asks for a control its property cannot be entered with. Every control
        needs one plain value or a list of them; `select` and `options` need an
        `enum` or a boolean, `toggle` a boolean, `slider` a number declaring
        `minimum` and `maximum`, and `tags` a list.
    - referrer: Self.Action
      resolve: [/inputModel]
      condition: !cel >-
        cel.bind(m, (has(referrer.inputModel.schema) ? referrer.inputModel.schema : referrer.inputModel),
          !has(m.properties) || !(self.property in m.properties)
          || Self.controlFits(has(self.control) ? self.control : 'auto', m.properties[self.property], null))
      code: UI_FIELD_CONTROL_UNSUPPORTED
      message: >-
        asks for a control its property cannot be entered with. Every control
        needs one plain value or a list of them; `select` and `options` need an
        `enum` or a boolean, `toggle` a boolean, `slider` a number declaring
        `minimum` and `maximum`, and `tags` a list.
---
kind: Telo.Definition
metadata:
  name: ChoiceField
  description: >-
    A form field choosing one value, or several for a list, from options read
    from an API: drawn as a select list or as options side by side, narrowed
    by other values of the form. An option value of another type than the
    property is caught before deploy.
capability: Telo.Invocable
extends: Self.Field
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#ChoiceFieldController
schema:
  type: object
  additionalProperties: false
  required: [options]
  properties:
    options:
      title: Options
      description: Where the options come from, over the form's current `values`.
      x-telo-ref: { kind: Self.OptionSource, use: dependency }
      x-telo-context:
        type: object
        properties:
          values: { x-telo-context-from-referrer: values, x-telo-context-eval: accessor }
    control:
      title: Control
      description: >-
        How the options are drawn: a `select` list (`auto`), or `options` side
        by side.
      $ref: "telo://Self/Control"
      default: auto
  x-telo-referrer-rules:
    - referrer: Self.Form
      resolve: [/model]
      condition: !cel >-
        cel.bind(m, (has(referrer.model.schema) ? referrer.model.schema : referrer.model),
          !has(m.properties) || !(self.property in m.properties)
          || ((!has(self.control) || self.control in ['auto', 'select', 'options'])
              && Self.controlFits('auto', m.properties[self.property], null)))
      code: UI_FIELD_CONTROL_UNSUPPORTED
      message: >-
        asks for a control a choice cannot be drawn with, or for a property no
        choice can enter. A choice is a `select` list or `options` side by side,
        over a string, a number, a boolean, or a list of those.
    - referrer: Self.Action
      resolve: [/inputModel]
      condition: !cel >-
        cel.bind(m, (has(referrer.inputModel.schema) ? referrer.inputModel.schema : referrer.inputModel),
          !has(m.properties) || !(self.property in m.properties)
          || ((!has(self.control) || self.control in ['auto', 'select', 'options'])
              && Self.controlFits('auto', m.properties[self.property], null)))
      code: UI_FIELD_CONTROL_UNSUPPORTED
      message: >-
        asks for a control a choice cannot be drawn with, or for a property no
        choice can enter. A choice is a `select` list or `options` side by side,
        over a string, a number, a boolean, or a list of those.
    - referrer: Self.Form
      resolve: [/model]
      resolveSelf: [/options/model]
      condition: !cel >-
        cel.bind(m, (has(referrer.model.schema) ? referrer.model.schema : referrer.model),
        cel.bind(o, has(self.options.model.schema) ? self.options.model.schema : self.options.model,
          !has(m.properties) || !(self.property in m.properties)
          || !('root' in self.options.value) || size(self.options.value.path) != 1
          || !has(o.properties) || !(self.options.value.path[0] in o.properties)
          || cel.bind(p, m.properties[self.property],
             cel.bind(e, (!('type' in p) ? [] : (type(p.type) == list ? p.type : [p.type]).filter(t, t != 'null')) == ['array'] ? ('items' in p && type(p.items) == map ? p.items : {}) : p,
             cel.bind(want, (!('type' in e) ? [] : (type(e.type) == list ? e.type : [e.type]).filter(t, t != 'null')),
             cel.bind(v, o.properties[self.options.value.path[0]],
             cel.bind(have, (!('type' in v) ? [] : (type(v.type) == list ? v.type : [v.type]).filter(t, t != 'null')),
               want.size() == 0 || have.size() == 0
               || have.all(t, t in want || (t == 'integer' && 'number' in want)))))))))
      code: UI_FIELD_OPTION_VALUE_MISMATCH
      message: >-
        offers options whose value is of another type than the property holds,
        or than its items hold for a list. Make the source's `value` read a
        property of the property's type, or enter another property.
    - referrer: Self.Action
      resolve: [/inputModel]
      resolveSelf: [/options/model]
      condition: !cel >-
        cel.bind(m, (has(referrer.inputModel.schema) ? referrer.inputModel.schema : referrer.inputModel),
        cel.bind(o, has(self.options.model.schema) ? self.options.model.schema : self.options.model,
          !has(m.properties) || !(self.property in m.properties)
          || !('root' in self.options.value) || size(self.options.value.path) != 1
          || !has(o.properties) || !(self.options.value.path[0] in o.properties)
          || cel.bind(p, m.properties[self.property],
             cel.bind(e, (!('type' in p) ? [] : (type(p.type) == list ? p.type : [p.type]).filter(t, t != 'null')) == ['array'] ? ('items' in p && type(p.items) == map ? p.items : {}) : p,
             cel.bind(want, (!('type' in e) ? [] : (type(e.type) == list ? e.type : [e.type]).filter(t, t != 'null')),
             cel.bind(v, o.properties[self.options.value.path[0]],
             cel.bind(have, (!('type' in v) ? [] : (type(v.type) == list ? v.type : [v.type]).filter(t, t != 'null')),
               want.size() == 0 || have.size() == 0
               || have.all(t, t in want || (t == 'integer' && 'number' in want)))))))))
      code: UI_FIELD_OPTION_VALUE_MISMATCH
      message: >-
        offers options whose value is of another type than the property holds,
        or than its items hold for a list. Make the source's `value` read a
        property of the property's type, or enter another property.
---
kind: Telo.Definition
metadata:
  name: PickerField
  description: >-
    A form field choosing a record, or several, from a large set read from an
    API: searched as the viewer types and paged as the list scrolls in a dialog
    or other overlay, the choice shown as its label and linked. Suits foreign
    keys, assignees and anything too long for a select list.
capability: Telo.Invocable
extends: Self.Field
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#PickerFieldController
schema:
  type: object
  additionalProperties: false
