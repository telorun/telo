# A library's `resources:` block — the inward half of the symmetry
# `exports.resources` already had outward. Two leaf libraries each declare that
# they need a `Sql.Connection`; the application declares ONE and hands it to
# both. The read only succeeds because the writer and the reader are on the same
# connection — the exact failure ("no such table") the block exists to remove.
kind: Telo.Application
metadata:
  name: ResourceInputs
  version: 1.0.0
imports:
  SQLite: ../modules/sqlite
  Assert: ../modules/assert
  Run: ../modules/run
  Writer:
    source: ./__fixtures__/resource-inputs/writer
    resources:
      connection: !ref db
  Reader:
    source: ./__fixtures__/resource-inputs/reader
    resources:
      connection: !ref db
targets:
  - !ref Writer.seed
  - !ref verify
---
kind: SQLite.Connection
metadata:
  name: db
file: ":memory:"
---
kind: Run.Sequence
metadata:
  name: verify
steps:
  - name: read
    invoke: !ref Reader.readNotes
  - name: assertRow
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.read.result.rows"
      expected:
        - body: from the writer
