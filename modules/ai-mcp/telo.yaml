kind: Telo.Library
metadata:
  name: AiMcp
  version: 0.28.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [AI, Transport]
  description: >-
    Brings the tools and prompts a connected MCP server offers into an AI agent, so a
    model can call them like any other tool — a prompt is rendered with the model's
    arguments and its messages handed back. The catalogue and its argument schemas are
    discovered at run time over whichever MCP transport the connection uses.
imports:
  # Import @telorun/ai for the Ai.ToolProvider abstract this definition implements.
  Ai: ../ai
  # Import @telorun/mcp-client for the Mcp.Client transport this definition wraps.
  # These two imports are the entire reason ai-mcp exists as a separate package: it is
  # the only module coupling the agnostic `ai` contract to the MCP transport.
  Mcp: ../mcp-client
exports: { kinds: [ToolProvider, PromptToolProvider] }
---
# AiMcp.ToolProvider — wraps any Mcp.Client as an Ai.ToolProvider. listTools() maps to
# `tools/list`, callTool() to `tools/call`, run under the agent turn's context: handed
# to the client, and abandoned with ERR_INVOKE_CANCELLED when that turn is cancelled. The discovered tool set and schemas are
# known only at run time (statically opaque), validated at the MCP server boundary.
kind: Telo.Definition
metadata:
  name: ToolProvider
  description: >-
    Turns a connected MCP server into a tool source for an agent: lists the tools the
    server advertises and dispatches a model-requested call over the same connection,
    abandoning it when the agent's turn is cancelled. The tool set and its schemas are
    resolved at run time, not statically.
capability: Telo.Mount
extends: Ai.ToolProvider
controllers: [pkg:telo/local/js?path=./nodejs/ai-mcp.mjs&local_path=./nodejs/src/index.ts#McpToolProviderController]
schema:
  type: object
  properties:
    client:
      title: Client
      description: Reference to any Mcp.Client implementation (Mcp.HttpClient, Mcp.StdioClient, …).
      x-telo-ref: { kind: Mcp.Client, use: dependency }
  required: [ client ]
  additionalProperties: false
---
# AiMcp.PromptToolProvider — wraps any Mcp.Client as an Ai.ToolProvider over the
# server's prompts. listTools() follows `prompts/list` to its last page, at most 100,
# and makes each prompt a tool whose parameters are its arguments (strings, closed);
# callTool() sends `prompts/get` and returns every message's content block in order.
# The result is judged here, never by the transport. A malformed list
# or get result raises ERR_MCP_PROTOCOL; a cancelled turn abandons the call with
# ERR_INVOKE_CANCELLED. A separate kind rather than a mode of ToolProvider: the two
# read different methods and map them differently.
kind: Telo.Definition
metadata:
  name: PromptToolProvider
  description: >-
    Offers every prompt a connected MCP server lists to an agent as a tool: the
    prompt's name and description become the tool's, its arguments the tool's string
    parameters. Calling it renders the prompt and returns its messages' content in
    order. Prompts are discovered at run time; a malformed answer from the server
    raises instead of looking empty.
capability: Telo.Mount
extends: Ai.ToolProvider
controllers: [pkg:telo/local/js?path=./nodejs/ai-mcp.mjs&local_path=./nodejs/src/index.ts#McpPromptToolProviderController]
schema:
  type: object
  properties:
    client:
      title: Client
      description: Reference to any Mcp.Client implementation (Mcp.HttpClient, Mcp.StdioClient, …) whose server offers prompts.
      x-telo-ref: { kind: Mcp.Client, use: dependency }
  required: [ client ]
  additionalProperties: false
