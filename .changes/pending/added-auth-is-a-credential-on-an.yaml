modules:
  modules/openai: Added
body: "Auth is a credential on an `Http.Client`, not an `apiKey` field. `OpenAI.Model`,
  `OpenAI.ModelStream`, `OpenAI.ImageModel` and `OpenAI.EmbeddingModel` now reference an
  `Http.Request` and carry no key of their own, so an account — base URL, credential,
  timeout, retry — is declared once for every OpenAI kind in an app, and the 401
  re-acquire-and-retry that `http-client` owns is inherited rather than re-implemented
  per provider. A refused request reports the endpoint's own message, since the request
  controller reads a failed status's body. Image edit, inpaint and variation send their
  multipart form as bytes under the boundary-bearing content type, so that path is
  replayable and covered by a hermetic test."
