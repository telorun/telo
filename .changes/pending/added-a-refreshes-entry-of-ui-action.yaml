modules:
  modules/ui: Added
body: A `refreshes` entry of `Ui.Action.onSuccess` and `Ui.Chat` (the new
  `Ui.RefreshTarget`) may hold a whole `*` (one segment) or `**` (any number of
  segments, none included) segment in its literal path, so `/api/projects/{id}/**`
  covers `/api/projects/7` and everything beneath it; a wildcard in any other address or
  request target is a `SCHEMA_VIOLATION`, and a computed path or `pathParams` value is
  always exact. The matching rows are `conformance/refreshes.json`.
