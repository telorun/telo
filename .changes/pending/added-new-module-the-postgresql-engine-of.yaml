modules:
  modules/idempotency-postgres: Added
body: "New module: the PostgreSQL engine of the transactional idempotency ledger. Table
  extends Postgres.Table with only the physical table name written by the author, every
  column and index internal and listed in the Postgres.Schema that creates it; Ledger
  narrows the connection, schema and table to PostgreSQL's kinds. Two ledgers claiming
  one name in one table are refused by telo check and when the second starts
  (IDEMPOTENCY_LEDGER_NAME_DUPLICATE). A concurrent transaction recording the same key
  waits on the ledger's unique index for the first to end, and the background sweep
  skips locked rows. Requires telo 0.122.0."
