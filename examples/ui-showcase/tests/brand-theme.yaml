kind: Telo.Application
metadata:
  name: UiShowcaseBrandThemeTest
  version: 1.0.0
  description: >-
    The theme the `/brand` mount of `examples/ui-showcase` draws with meets the
    renderer's contract with nothing left out: every part styled, no reserved
    layout property set, every design token given a value and read, every
    scene drawn with Radix's controls, and every vector of those controls met.
imports:
  Brand: ../brand
  Conformance: oci://ghcr.io/telorun/ui-react-conformance@0.8.1#sha256-gRW1UOq9jsEixb75tTbM7OuEoylXfibQkZ2Cyil3wq8
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref checkBrandTheme
---
kind: Telo.Sequence
metadata: { name: checkBrandTheme }
steps:
  - name: check
    invoke:
      kind: Conformance.CheckTheme
      theme: !ref Brand.theme
  - name: conforms
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.check.result.problems"
      expected: []
