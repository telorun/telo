# The history, pinning and labelling kinds over a store of the drafts strategy, which publishes
# numbered revisions and keeps only the last: the `store` slot names the level
# of the contract the kind needs.
kind: Telo.Application
metadata:
  name: RevisionsOverDraftsStore
include:
  - ../drafted-model.yaml
imports:
  GraphLayers: ../../..
  Graph: ../../../../graph
  Layers: ../../../../graph-layers-drafts-sqlite
  SQLite: ../../../../sqlite
---
kind: GraphLayers.ListRevisions
metadata: { name: listRevisions }
store: !ref team
---
kind: GraphLayers.PinBase
metadata: { name: pinBase }
store: !ref team
---
kind: GraphLayers.UnpinBase
metadata: { name: unpinBase }
store: !ref team
---
kind: GraphLayers.ListBases
metadata: { name: listBases }
store: !ref team
---
kind: GraphLayers.LabelRevision
metadata: { name: labelRevision }
store: !ref team
