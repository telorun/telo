  # Forms.
  - { text: Every control from the model, translation: Elk besturingselement uit het model }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "Zonder geschreven velden tekent het formulier één besturingselement per eigenschap, gekozen volgens haar schema: een tekstvak, een lijst voor een opsomming, getalvakken, een datum, een datum en tijd, een tijd, een vak met meerdere regels voor een document, een selectievakje, opties naast elkaar voor een lijst van een opsomming, en getypte tags voor een lijst van woorden. Een beschrijving is een hint onder haar veld, en een standaardwaarde de beginwaarde." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "Elk veld wordt tegen het model gecontroleerd zodra het is aangeraakt: de lengte van de titel, het aantal mensen, het budget in stappen van 50, de spelling van de trefwoorden. De server weigert een titel die een andere aanvraag al heeft, en zijn antwoord komt bij de titel terecht. Wat je typt, wordt bewaard in het adres en in deze browser — alles behalve de toegangscode, die het model als alleen-schrijven markeert." }
  - { text: Each control chosen by hand, translation: Elk besturingselement met de hand gekozen }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "Dezelfde aanvraag met een besturingselement geschreven voor elk veld: de titel overgelaten aan zijn afgeleide besturingselement, de soort als opties naast elkaar, de kanalen als een lijst met meerdere keuzes, het aantal mensen op een schuifregelaar, dringend als schakelaar en de trefwoorden als tags. Wat je typt, wordt alleen voor dit tabblad bewaard." }
  - { text: Requests received, translation: Ontvangen aanvragen }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "De laatste aanvragen die de twee formulieren verstuurden, opnieuw gelezen na elke keer opslaan." }
  - { text: "Choices, pickers and dates", translation: "Keuzes, kiezers en datums" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "Mensen boeken voor een project. Het project wordt gekozen uit een lijst die uit de projectencollectie wordt gelezen, elke optie met haar code als hint. De leider wordt gekozen in een dialoogvenster, gezocht op naam, uit de actieve leden met de rol die erboven is gekozen; een andere rol kiezen leest de opties opnieuw en behoudt de leider alleen als die nog past. Beoordelaars worden gekozen in een lade, meerdere tegelijk, en de sponsor in een pop-over; de sponsor begint bij een standaard e-mailadres, getoond als de naam van de persoon via één opzoeking. Helpers worden naast elkaar aangeboden, drie tegelijk, met Meer voor de rest. Een gekozen persoon linkt naar zijn of haar e-mailadres." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "De periode bestaat uit twee datums met voorinstellingen, met weken die op zondag beginnen, standaard volgende maand en met een waarschuwing boven drie maanden. De server weigert een periode die eindigt voordat ze begint of langer dan een jaar duurt, en zijn antwoord komt bij de periode terecht. De mensen rond de leider worden getoond zodra er een leider is gekozen, en het locatieadres alleen voor werk op locatie." }
  - { text: The project, translation: Het project }
  - { text: "Which project, and who leads the work.", translation: "Welk project, en wie het werk leidt." }
  - { text: Around the lead, translation: Rond de leider }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "Wie het werk beoordeelt, wie het sponsort en wie helpt." }
  - { text: When and where, translation: Wanneer en waar }
  - { text: Tomorrow, translation: Morgen }
  - { text: Next week, translation: Volgende week }
  - { text: This month, translation: Deze maand }
  - { text: Next month, translation: Volgende maand }
  - { text: Next quarter, translation: Volgend kwartaal }
  - { text: Next year, translation: Volgend jaar }
  - { text: Bookings, translation: Boekingen }
  - { text: "The latest bookings, read again after every save.", translation: "De laatste boekingen, opnieuw gelezen na elke keer opslaan." }

