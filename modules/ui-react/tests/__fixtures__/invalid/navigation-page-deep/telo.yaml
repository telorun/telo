# A navigation naming, in a group inside a group, a page with a variable in its
# path and a page with no title given no text of its own.
kind: Telo.Application
metadata: { name: UiReactNavigationPageDeep, version: 1.0.0 }
imports: { UiReact: ../../../../, Ui: ../../../../../ui }
---
kind: Ui.Page
metadata: { name: home }
path: /
title: Home
children: []
---
kind: Ui.Page
metadata: { name: plan }
path: /plans/{id}
title: Plan
children: []
---
kind: Ui.Page
metadata: { name: chat }
path: /chat
children: []
---
kind: UiReact.App
metadata: { name: nested }
title: Nested
theme: !ref UiReact.defaultTheme
pages: [!ref home, !ref plan, !ref chat]
navigation:
  items:
    - { type: page, page: !ref home }
    - type: group
      text: One
      items:
        - type: group
          text: Two
          items:
            - { type: page, page: !ref plan }
            - { type: page, page: !ref chat }
