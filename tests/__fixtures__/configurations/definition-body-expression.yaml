# A templated kind with no choice in its body writes a wrong expression in an
# unconditional entry; the module makes an unrelated choice. The finding is
# reported once, at the definition, in every configuration; neither consumer
# reports it.
kind: Telo.Application
metadata: { name: DefinitionBodyExpression }
variables: { flag: { env: FLAG, type: boolean, default: false } }
---
kind: Telo.Definition
metadata: { name: Target }
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./probe.mjs#Probe]
schema: { type: object, properties: { label: { type: string } } }
---
kind: Telo.Definition
metadata: { name: Wrapped }
capability: Telo.Runnable
schema: { type: object, properties: { label: { type: string } } }
resources:
  - kind: Telo.Sequence
    metadata: { name: sequence }
    steps:
      - { name: wrong, value: !cel "1 + 'a'" }
run: !ref sequence
---
kind: Self.Wrapped
metadata: { name: firstWrapped }
label: first
---
kind: Self.Wrapped
metadata: { name: secondWrapped }
label: second
---
kind: Self.Target
metadata: { name: chosen }
label: !if
  if: !cel "variables.flag"
  then: first
  else: second
