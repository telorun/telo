project: scheduler
kind: Added
body: Schedule.Interval and Schedule.Cron log a firing tick, a tick skipped by a closed 'when'
  gate, and each re-arm at debug. A skipped tick is otherwise indistinguishable from one that
  never came due — the schedule simply goes quiet. A failing tick now reports the thrown value
  as the record's structured error, keeping the type, stack and cause chain that the previous
  message-only attribute discarded.
