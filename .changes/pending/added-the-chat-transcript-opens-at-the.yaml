modules:
  modules/ui-react: Added
body: The chat transcript opens at the end of the conversation and stays there,
  corrected before each paint, while images, highlighted code and the layout settle and
  while a reply streams, until the viewer scrolls up; scrolling back to the end or
  sending holds it again. Only the messages near the viewport are drawn (TanStack
  Virtual), each measured as it changes, a message out of view standing in as the block
  margins of the nearest drawn one, so the styling contract reserves margin-top and
  margin-bottom on chat-message and overflow-anchor on chat-transcript. Earlier pages
  are read automatically until the viewport is filled and as the viewer nears the top,
  under a loading notice, the messages in view staying in place; the chat-earlier button
  is gone. Each message carries aria-posinset and aria-setsize (-1 while earlier pages
  remain); a message holding the focus or being edited stays drawn, and open reasoning
  and tool panels and a typed rejection reason survive their message scrolling out of
  view. Find in page finds only drawn messages.
