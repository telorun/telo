    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/ell.traineddata.gz:
        { upstream: ell, member: package/4.0.0_best_int/ell.traineddata.gz, sha256: e8a293abb398ec479176c1575aef24e2bacb0611c713f3fa996f97f0cd996fb3, executable: false }
