# A field kind from another module placed over a property it cannot rate: its
# own rule refuses it, which `ui` knows nothing about.
kind: Telo.Library
metadata:
  name: UiInvalidRating
  version: 1.0.0
  description: Test fixture exporting a form rating a property of text.
imports:
  Ui: ../../../../
  DataModel: ../../../../../data-model
  Stars: ../../external-field
exports:
  resources: [rated]
---
kind: Ui.Form
metadata:
  name: rated
model:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      note: { type: string }
presentation:
  kind: Ui.CollectionPresentation
  source:
    kind: Ui.CollectionSource
    basePath: /api/notes
    collection:
      kind: DataModel.Collection
      model: { kind: Telo.JsonSchema, schema: { type: object, required: [id], properties: { id: { type: string } } } }
      query: { filters: [], sort: [] }
fields:
  - { kind: Stars.Rating, property: note }
