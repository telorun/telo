[package]
name = "telorun-cel"
version = "0.120.1"
license = "MIT"
edition = "2021"
publish = false
description = "The CEL language for Rust: the front end — reads an expression into the ranged syntax tree, resolves namespaced calls, writes a tree back as source and answers the two tree queries — and the type system: the static types, type text and signatures, the function registry with the standard library, typing from JSON Schema, and the environment's registrations, declarations and listing — and the checker: every verdict with its code, message, range and fix, and the call each name resolved to — and RE2, the pattern language of `matches`: its parser, program and machine, twins of re2js's, over the engine's own Unicode 17.0 data. One path dependency, no host vocabulary."

[lib]
crate-type = ["rlib"]

[dependencies]
telorun-cel-value = { path = "value" }

[dev-dependencies]
serde_json = "=1.0.149"
