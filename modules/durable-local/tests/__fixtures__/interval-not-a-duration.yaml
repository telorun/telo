kind: Telo.Application
metadata: { name: DurableLocalIntervalNotADuration, version: 1.0.0 }
imports: { Local: ../../, Journal: ../../../durable-journal-file }
variables:
  journalDir: { env: INTERVAL_TEST_DIR, type: string, x-telo-type: Telo.HostPath, default: .telo/interval-not-a-duration }
---
kind: Journal.Journal
metadata: { name: journal }
directory: !cel "variables.journalDir"
---
kind: Local.Workflow
metadata: { name: flow }
journal: !ref journal
steps: []
---
kind: Local.Resumer
metadata: { name: resumer }
workflow: !ref flow
interval: every so often
