kind: Telo.Application
metadata:
  name: RateLimitGuardSmokeTest
  version: 1.0.0
  description: |
    With limit=2 per window, the first two requests for a key are allowed and
    the third is denied; an empty key fails closed. A limit an expression
    computes counts the same way.
imports:
  RateLimit: ../
  Cache: ../../cache
  CacheMemory: ../../cache-memory
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
kind: CacheMemory.Store
metadata: { name: mem }
---
kind: RateLimit.Guard
metadata: { name: limit }
store: !ref mem
limit: 2
window: "60s"
---
# A `!cel` integer is a 64-bit integer, not the number a YAML literal is.
kind: RateLimit.Guard
metadata: { name: computedLimit }
store: !ref mem
limit: !cel "1 + 1"
window: "60s"
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: r1
    invoke: !ref limit
    inputs: { key: "1.2.3.4" }
  - name: r2
    invoke: !ref limit
    inputs: { key: "1.2.3.4" }
  - name: r3
    invoke: !ref limit
    inputs: { key: "1.2.3.4" }
  - name: empty
    invoke: !ref limit
    inputs: { key: "" }
  - name: c1
    invoke: !ref computedLimit
    inputs: { key: "computed" }
  - name: c2
    invoke: !ref computedLimit
    inputs: { key: "computed" }
  - name: c3
    invoke: !ref computedLimit
    inputs: { key: "computed" }
  - name: assertComputedLimit
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        first: !cel "steps.c1.result.allowed"
        firstRemaining: !cel "steps.c1.result.remaining"
        second: !cel "steps.c2.result.allowed"
        third: !cel "steps.c3.result.allowed"
      expected:
        first: true
        firstRemaining: 1
        second: true
        third: false
  - name: assertVerdicts
    inputs:
      a1: !cel "steps.r1.result.allowed"
      a2: !cel "steps.r2.result.allowed"
      a3: !cel "steps.r3.result.allowed"
      ae: !cel "steps.empty.result.allowed"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        required: [a1, a2, a3, ae]
        properties:
          a1: { const: true }
          a2: { const: true }
          a3: { const: false }
          ae: { const: false }
