kind: Telo.Application
metadata:
  name: HttpApi
  version: 1.0.0
  description: |
    A single typed `GET /v1/hello?name=…` route. Shows how `Http.Server` mounts
    an `Http.Api`, how the request schema feeds a `!cel` expression on `inputs`,
    and how the handler's output flows into the response body via `result.*`.

    Run, then:
        curl 'http://localhost:8845/v1/hello?name=World'
imports:
  Http: oci://ghcr.io/telorun/http-server@0.29.0#sha256-6OIi1b-_cF4uMZ3O20EWRWAJn6JbgomkE4amBBMofqM
  Run: oci://ghcr.io/telorun/run@0.26.0#sha256-ZhW56yiMCImqBh0wJ4mVaUvh5WuUVIaWErASFx--wCY
targets:
  - !ref server
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8845
---
kind: Http.Server
metadata:
  name: server
port: !cel "ports.http"
openapi:
  info:
    title: Hello server
    version: 1.0.0
mounts:
  - path: /v1
    mount: !ref helloApi
---
kind: Http.Api
metadata:
  name: helloApi
routes:
  - request:
      path: /hello
      method: GET
      schema:
        query:
          type: object
          properties:
            name:
              type: string
          required: [ "name" ]
    handler: !ref sayHello
    inputs:
      name: !cel "request.query.name"
    returns:
      - status: 200
        content:
          application/json:
            schema:
              type: object
              properties:
                greeting: { type: string }
              required: [ greeting ]
              additionalProperties: false
            body:
              greeting: !cel "'Hello ' + result.message + '!'"
---
kind: Run.Value
metadata:
  name: sayHello
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      name: { type: string }
    required: [ "name" ]
    additionalProperties: false
value:
  message: !cel "inputs.name"
