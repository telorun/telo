kind: Telo.Application
metadata:
  name: ApiKeyMicroserviceRefusesTest
  version: 1.0.0
  description: |
    A tampered token, a token for another audience, a token whose id was revoked
    and a revoked API key are each refused 401 with the challenge naming the
    credential, while the same token and key were accepted before the revocation.
variables:
  dbFile:
    env: API_KEY_MICROSERVICE_REFUSES_DB
    type: string
    x-telo-type: Telo.HostPath
    default: ./.telo/api-key-microservice-refuses.db
imports:
  App: ../../../modules/app
  HttpClient: ../../../modules/http-client
  Assert: ../../../modules/assert
targets:
  - !ref test
---
kind: HttpClient.Client
metadata: { name: api }
baseUrl: http://127.0.0.1:8603
throwOnHttpError: false
---
kind: HttpClient.Client
metadata: { name: issuerClient }
baseUrl: http://127.0.0.1:8604
throwOnHttpError: false
---
kind: HttpClient.Request
metadata: { name: call }
client: !ref api
---
kind: HttpClient.Request
metadata: { name: mint }
client: !ref issuerClient
method: POST
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: issuer }
    source: ../issuer.yaml
    ports: { http: 8604 }
    secrets: { wrapKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef }
  - kind: App.Instance
    metadata: { name: service }
    source: ../telo.yaml
    ports: { http: 8603 }
    variables:
      jwksUrl: http://127.0.0.1:8604/.well-known/jwks.json
      dbFile: !cel "variables.dbFile"
targets:
  - !ref issuer
  - !ref service
steps:
  - name: adminToken
    invoke: !ref mint
    inputs:
      url: /token
      body: { subject: ops, audience: http://127.0.0.1:8603/admin, scope: keys:admin }
  - name: goodToken
    invoke: !ref mint
    inputs:
      url: /token
      body: { subject: alice, audience: http://127.0.0.1:8603/api, scope: orders:read }
  - name: otherAudience
    invoke: !ref mint
    inputs:
      url: /token
      body: { subject: alice, audience: http://other.example/api, scope: orders:read }
  - name: jti
    value: !cel "'jti-' + uuidv4()"
  - name: revocableToken
    invoke: !ref mint
    inputs:
      url: /token
      body:
        subject: alice
        audience: http://127.0.0.1:8603/api
        scope: orders:read
        jwtId: !cel "steps.jti.result"
  - name: tampered
    value: !cel "steps.goodToken.result.body.token.substring(0, size(steps.goodToken.result.body.token) - 10) + (steps.goodToken.result.body.token.substring(size(steps.goodToken.result.body.token) - 10, size(steps.goodToken.result.body.token) - 9) == 'A' ? 'B' : 'A') + steps.goodToken.result.body.token.substring(size(steps.goodToken.result.body.token) - 9)"
  - name: tamperedCall
    invoke: !ref call
    inputs:
      url: /api/orders
      headers: { authorization: !interpolate "Bearer ${{ steps.tampered.result }}" }
  - name: wrongAudienceCall
    invoke: !ref call
    inputs:
      url: /api/orders
      headers: { authorization: !interpolate "Bearer ${{ steps.otherAudience.result.body.token }}" }
  - name: beforeTokenRevoked
    invoke: !ref call
    inputs:
      url: /api/orders
      headers: { authorization: !interpolate "Bearer ${{ steps.revocableToken.result.body.token }}" }
  - name: revokeToken
    invoke: !ref call
    inputs:
      url: /admin/token-revocations
      method: POST
      headers: { authorization: !interpolate "Bearer ${{ steps.adminToken.result.body.token }}" }
      body: { jti: !cel "steps.jti.result", until: "2999-01-01T00:00:00Z" }
  - name: afterTokenRevoked
    invoke: !ref call
    inputs:
      url: /api/orders
      headers: { authorization: !interpolate "Bearer ${{ steps.revocableToken.result.body.token }}" }
  - name: issueKey
    invoke: !ref call
    inputs:
      url: /admin/api-keys
      method: POST
      headers: { authorization: !interpolate "Bearer ${{ steps.adminToken.result.body.token }}" }
      body:
        service: !cel "'billing-' + replace(uuidv4(), '-', '')"
        scopes: ["orders:read"]
  - name: beforeKeyRevoked
    invoke: !ref call
    inputs:
      url: /api/orders
      headers: { x-api-key: !cel "steps.issueKey.result.body.key" }
  - name: revokeKey
    invoke: !ref call
    inputs:
      url: !cel "'/admin/api-keys/' + steps.issueKey.result.body.id + '/revoke'"
      method: POST
      headers: { authorization: !interpolate "Bearer ${{ steps.adminToken.result.body.token }}" }
  - name: afterKeyRevoked
    invoke: !ref call
    inputs:
      url: /api/orders
      headers: { x-api-key: !cel "steps.issueKey.result.body.key" }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        tampered: { status: !cel "steps.tamperedCall.result.status", challenge: !cel "steps.tamperedCall.result.headers['www-authenticate']" }
        wrongAudience: { status: !cel "steps.wrongAudienceCall.result.status", challenge: !cel "steps.wrongAudienceCall.result.headers['www-authenticate']" }
        tokenBeforeRevoked: !cel "steps.beforeTokenRevoked.result.status"
        tokenRevoked: { status: !cel "steps.revokeToken.result.status", revoked: !cel "steps.revokeToken.result.body.revoked" }
        tokenAfterRevoked: { status: !cel "steps.afterTokenRevoked.result.status", challenge: !cel "steps.afterTokenRevoked.result.headers['www-authenticate']" }
        keyBeforeRevoked: !cel "steps.beforeKeyRevoked.result.status"
        keyRevoked: !cel "steps.revokeKey.result.status"
        keyAfterRevoked: { status: !cel "steps.afterKeyRevoked.result.status", challenge: !cel "steps.afterKeyRevoked.result.headers['www-authenticate']" }
      expected:
        tampered: { status: 401, challenge: 'Bearer error="invalid_token", error_description="The access token signature is invalid", ApiKey' }
        wrongAudience: { status: 401, challenge: 'Bearer error="invalid_token", error_description="The access token is not for this resource", ApiKey' }
        tokenBeforeRevoked: 200
        tokenRevoked: { status: 200, revoked: true }
        tokenAfterRevoked: { status: 401, challenge: 'Bearer error="invalid_token", error_description="The access token has been revoked", ApiKey' }
        keyBeforeRevoked: 200
        keyRevoked: 200
        keyAfterRevoked: { status: 401, challenge: 'Bearer, ApiKey' }
