  # Forms.
  - { text: Every control from the model, translation: Ogni controllo dal modello }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "Senza campi scritti, il modulo disegna un controllo per ogni proprietà, scelto dal suo schema: una casella di testo, un elenco per un'enumerazione, caselle numeriche, una data, una data e ora, un'ora, una casella multiriga per un documento, una casella di controllo, opzioni affiancate per un elenco di un'enumerazione e tag digitati per un elenco di parole. Una descrizione è un suggerimento sotto il suo campo, e un valore predefinito è il valore iniziale." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "Ogni campo viene verificato rispetto al modello una volta toccato: la lunghezza del titolo, il numero di persone, il budget in passi di 50, la grafia delle parole chiave. Il server rifiuta un titolo che ha già un'altra richiesta, e la sua risposta finisce sul titolo. Ciò che viene digitato è conservato nell'indirizzo e in questo browser — tutto tranne il codice di accesso, che il modello contrassegna come di sola scrittura." }
  - { text: Each control chosen by hand, translation: Ogni controllo scelto a mano }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "La stessa richiesta con un controllo scritto per ogni campo: il titolo lasciato al suo controllo derivato, il tipo come opzioni affiancate, i canali come elenco a scelta multipla, il numero di persone su un cursore, urgente come interruttore e le parole chiave come tag. Ciò che viene digitato è conservato solo per questa scheda." }
  - { text: Requests received, translation: Richieste ricevute }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "Le ultime richieste inviate dai due moduli, rilette dopo ogni salvataggio." }
  - { text: "Choices, pickers and dates", translation: "Scelte, selettori e date" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "Prenotazione di persone su un progetto. Il progetto si sceglie da un elenco letto dalla collezione dei progetti, ogni opzione con il suo codice come suggerimento. Il responsabile si sceglie in una finestra di dialogo, cercandolo per nome, tra i membri attivi del ruolo scelto sopra; scegliere un altro ruolo rilegge le opzioni e mantiene il responsabile solo se è ancora adatto. I revisori si scelgono in un cassetto, più di uno alla volta, e lo sponsor in un popover; lo sponsor parte da un'e-mail predefinita, mostrata come nome della persona grazie a una ricerca. I collaboratori sono proposti affiancati, tre alla volta, con Altro per i restanti. Una persona scelta è un link alla sua e-mail." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "Il periodo è composto da due date con preimpostazioni, con le settimane che iniziano la domenica; parte dal mese prossimo e avvisa oltre i tre mesi. Il server rifiuta un periodo che termina prima di iniziare o che dura più di un anno, e la sua risposta finisce sul periodo. Le persone attorno al responsabile sono mostrate una volta scelto un responsabile, e l'indirizzo della sede solo per il lavoro in sede." }
  - { text: The project, translation: Il progetto }
  - { text: "Which project, and who leads the work.", translation: "Quale progetto, e chi guida il lavoro." }
  - { text: Around the lead, translation: Attorno al responsabile }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "Chi revisiona il lavoro, chi lo sponsorizza e chi aiuta." }
  - { text: When and where, translation: Quando e dove }
  - { text: Tomorrow, translation: Domani }
  - { text: Next week, translation: Settimana prossima }
  - { text: This month, translation: Questo mese }
  - { text: Next month, translation: Mese prossimo }
  - { text: Next quarter, translation: Trimestre prossimo }
  - { text: Next year, translation: Anno prossimo }
  - { text: Bookings, translation: Prenotazioni }
  - { text: "The latest bookings, read again after every save.", translation: "Le ultime prenotazioni, rilette dopo ogni salvataggio." }

