# A store over one connection naming a schema that lives on another.
kind: Telo.Library
metadata:
  name: SchemaConnectionMismatch
imports:
  SQLite: ../../../../../sqlite
  GraphSql: ../../../..
exports:
  resources: [kb]
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: SQLite.Connection
metadata: { name: otherDb }
file: ":memory:"
---
kind: SQLite.Table
metadata: { name: people }
table: people
columns:
  id: { type: text, primaryKey: true }
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref otherDb
tables: [!ref people]
---
kind: GraphSql.Node
metadata: { name: person }
table: !ref people
key: id
---
kind: GraphSql.Store
metadata: { name: kb }
connection: !ref db
schema: !ref appSchema
nodes: [!ref person]
