# A whole `context` computed by one expression, which lacks the member the type
# requires, against an inline type naming its own definitions: this
# application's check cannot judge it, and the contract the kernel binds refuses
# the call when it is dispatched.
kind: Telo.Application
metadata:
  name: ValueSchemaWholeValueInlineMissing
  version: 1.0.0
imports:
  Kinds: ./kinds
  Run: ../../../../modules/run
targets:
  - !ref calls
---
kind: Run.Sequence
metadata:
  name: calls
steps:
  - name: call
    invoke: !ref Kinds.inlineCaller
    inputs:
      context: !cel "dyn({})"
