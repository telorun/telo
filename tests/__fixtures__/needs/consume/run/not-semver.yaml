kind: Telo.Application
metadata:
  name: ConsumeNotSemver
  version: 1.0.0
  description: An observed version that is not semver is refused.
imports:
  Kinds: ../kinds
---
kind: Kinds.DatabaseAccess
metadata: { name: access }
fields: { url: "postgres://db.internal:5432/orders" }
---
kind: Kinds.Database
metadata: { name: db }
access: !ref access
serverVersion: "15"
