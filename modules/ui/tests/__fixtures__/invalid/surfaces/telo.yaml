# Every surface kind handed a key it does not take, the removed page surface, a
# compact slot naming the wrong kind, a form named where a surface goes, and
# the removed spellings of an opener and of a form's presentation.
kind: Telo.Application
metadata: { name: UiInvalidSurfacesApp, version: 1.0.0 }
imports: { Ui: ../../../../, DataModel: ../../../../../data-model }
---
kind: Ui.Dialog
metadata: { name: dialogSide }
side: end
---
kind: Ui.Drawer
metadata: { name: drawerAlign }
align: start
---
kind: Ui.Popover
metadata: { name: popoverAddress }
address: { name: todo }
---
kind: Ui.InlineSurface
metadata: { name: inlineSize }
size: small
---
kind: Ui.Panel
metadata: { name: panelModal }
modal: false
---
kind: Ui.PageSurface
metadata: { name: ownPage }
address: { name: todo }
---
kind: Ui.Panel
metadata: { name: compactPopover }
compact: { kind: Ui.Popover }
---
kind: Telo.JsonSchema
metadata: { name: Todo }
schema:
  type: object
  required: [id]
  properties: { id: { type: integer }, text: { type: string } }
---
kind: Ui.CollectionPresentation
metadata: { name: todos }
source:
  kind: Ui.CollectionSource
  basePath: /api/todos
  collection:
    kind: DataModel.Collection
    schemas: { create: { kind: Telo.JsonSchema, schema: { type: object } } }
    model: !ref Todo
    query: { filters: [], sort: [] }
---
kind: Ui.Form
metadata: { name: todoForm }
model: !ref Todo
record: { presentation: !ref todos }
---
kind: Ui.Page
metadata: { name: todoPage }
path: /todos/{id}
title: Todo
children: [{ type: text, text: Todo }]
---
kind: Ui.OpenPage
metadata: { name: formAsSurface }
page: !ref todoPage
pathParams: { id: 7 }
surface: !ref todoForm
---
kind: Ui.Form
metadata: { name: legacyPresentation }
model: !ref Todo
presentation: !ref todos
---
kind: Ui.Listing
metadata: { name: legacyCreate }
model: !ref Todo
presentation: !ref todos
create:
  form: !ref todoForm
  surface: { kind: Ui.Dialog }
---
kind: Ui.Listing
metadata: { name: legacyEdit }
model: !ref Todo
presentation: !ref todos
edit:
  form: !ref todoForm
  afterSubmit: keep
