# A policy forcing an event handler onto a kept element: refused by `telo check`
# at the declaration, and by the controller at creation.
kind: Telo.Library
metadata:
  name: SanitizeEventHandlerForced
imports:
  Html: ../../../..
exports:
  resources: [policy]
---
kind: Html.SafeTree
metadata: { name: policy }
elements: [p]
setAttributes:
  p:
    onclick: alert(1)
