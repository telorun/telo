# The showcase in Spanish: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads and translated into Spanish's `one` and `other` cases (its `many`, for
# large round numbers, falls back to `other`); a word told apart by its
# context is translated once per context.
kind: I18n.Catalog
metadata:
  name: spanish
lang: es
texts:
  # Applications and pages.
  - { text: UI showcase, translation: Muestrario de interfaz }
  - { text: UI showcase — Radix, translation: Muestrario de interfaz — Radix }
  - { text: UI showcase — brand, translation: Muestrario de interfaz — marca }
  - { text: UI showcase — sidebar, translation: Muestrario de interfaz — barra lateral }
  - { text: Overview, translation: Vista general }
  - { text: Conditions, translation: Condiciones }
  - { text: Data, translation: Datos }
  - { text: Tables, translation: Tablas }
  - { text: Filters, translation: Filtros }
  - { text: Forms, translation: Formularios }
  - { text: Actions, translation: Acciones }
  - { text: Components, translation: Componentes }
  - { text: CRUD, translation: CRUD }
  - { text: Themes, translation: Temas }
  # The navigation's groups.
  - { text: Building blocks, translation: Bloques básicos }
  - { text: Input, translation: Entrada }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: Logotipo del muestrario de interfaz }
  - { text: Language, translation: Idioma }
  - { text: Theme, translation: Tema }
  - { text: Default, translation: Predeterminado }
  - { text: Radix, translation: Radix }
  - { text: Brand, translation: Marca }
  - { text: Sidebar, translation: Barra lateral }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: Por solicitud }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "Estos nodos son de la propia página, así que su when y su texto se evalúan en cada solicitud." }
  - { text: Your browser asked for Polish., translation: Tu navegador pidió polaco. }
  - { text: Your browser did not ask for Polish., translation: Tu navegador no pidió polaco. }
  - { text: The Acme brand is on., translation: La marca Acme está activada. }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "Un texto que calcula una expresión se muestra tal como se calculó, nunca traducido." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "Un enlace que esta solicitud vuelve no válido se sustituye por un nodo de error, y el resto de la página se sirve." }
  - { text: Leaves the application, translation: Sale de la aplicación }

  # The overview.
  - { text: Every node type, translation: Cada tipo de nodo }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "Una caja, una pila y unas columnas contienen otros nodos, y cada una dibuja sus hijos a su manera." }
  - { text: A box, translation: Una caja }
  - { text: Groups its children., translation: Agrupa sus hijos. }
  - { text: A stack, translation: Una pila }
  - { text: Draws its children one under another., translation: Dibuja sus hijos uno debajo de otro. }
  - { text: A badge, translation: Una insignia }
  - { text: Columns, translation: Columnas }
  - { text: "Draw their children side by side, as these three are.", translation: "Dibujan sus hijos uno al lado de otro, como estas tres." }
  - { text: Text in each style, translation: Texto en cada estilo }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "Un estilo dice qué significa un nodo; el tema decide qué aspecto tiene. Un nodo puede llevar varios." }
  - { text: Heading, translation: Encabezado }
  - { text: Subheading, translation: Subencabezado }
  - { text: Muted, translation: Atenuado }
  - { text: Strong, translation: Destacado }
  - { text: Accent, translation: Acento }
  - { text: Danger, translation: Peligro }
  - { text: Warning, translation: Advertencia }
  - { text: Success, translation: Éxito }
  - { text: Strong and accent, translation: Destacado y acento }
  - { text: Links, translation: Enlaces }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "Un enlace a una página declarada navega dentro de la aplicación; un archivo servido bajo el punto de montaje es una carga normal; https y mailto salen de ella." }
  - { text: Go to Conditions, translation: Ir a Condiciones }
  - { text: A file the server serves, translation: Un archivo que sirve el servidor }
  - { text: Write to us, translation: Escríbenos }
  - { text: Images, translation: Imágenes }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "Una imagen por dirección, la misma imagen como decoración con un alt vacío y marcado SVG dibujado como imagen, nunca insertado en la página." }
  - { text: The showcase mark, translation: El símbolo del muestrario }
  - { text: Three overlapping circles, translation: Tres círculos superpuestos }
  - { text: Values by their schema, translation: Valores según su esquema }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "Cada valor se dibuja como indica su propiedad del modelo, leído del registro del equipo que carga la página." }
  - { text: Visit the team homepage, translation: Visitar la página principal del equipo }
  - { text: "A uri, drawn as a link with a text of its own", translation: "Una uri, dibujada como enlace con un texto propio" }
  - { text: A uri-reference to a declared page, translation: Una uri-reference a una página declarada }
  - { text: A uri-reference to a served file, translation: Una uri-reference a un archivo servido }
  - { text: A mailto address, translation: Una dirección mailto }
  - { text: "An address the rule refuses, drawn as plain text", translation: "Una dirección que la regla rechaza, dibujada como texto sin formato" }
  - { text: A date, translation: Una fecha }
  - { text: A date and time, translation: Una fecha y hora }
  - { text: A boolean, translation: Un booleano }
  - { text: An enumeration's label, translation: La etiqueta de una enumeración }
  - { text: A list, translation: Una lista }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "Las filas que contiene una respuesta, nunca paginadas. Un encabezado toma por defecto el título de la propiedad, y la última columna solo se muestra mientras el equipo está contratando." }
  - { text: Projects under way, translation: Proyectos en curso }
  - { text: Project, translation: Proyecto }
  - { text: Texts, translation: Textos }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": Todavía no hay proyectos.
        one: "{$count} proyecto hasta ahora."
        other: "{$count} proyectos hasta ahora."
  - { text: "{$team} started {$project} most recently.", translation: "El proyecto que {$team} empezó más recientemente es {$project}." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "Un plural elegido en el navegador para el número que lee, y un texto cuyos valores vienen del registro." }
  - { text: Open, context: state, translation: Abierto }
  - { text: Open, context: verb, translation: Abrir }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "El texto propio de un nodo se distingue de la misma manera: la insignia dice que TEL-42 está abierto y el enlace ofrece abrir sus tareas." }
  - { text: Style rules, translation: Reglas de estilo }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "El estilo de una fila y el de una celda los elige un valor de la fila. El proyecto destacado aparece resaltado, cada estado tiene su color y un estado que ningún caso nombra toma el predeterminado. Dos columnas tienen como encabezado la misma palabra, Open, que se distingue por el contexto con que se escribe cada encabezado." }
  - { text: Composites, translation: Compuestos }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "Toda esta página es una vista que cada aplicación coloca por referencia. Debajo, una vista escrita en línea donde se coloca, y un tipo compuesto propio de este ejemplo, que no tiene controlador." }
  - { text: A view declared inline at the node that places it., translation: "Una vista declarada en línea en el nodo que la coloca." }
  - { text: A callout, translation: Un aviso destacado }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Declarado una vez como un tipo que extiende Ui.Composite y proporciona una vista, y colocado con campos propios." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: Pestañas }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "Contenido en pestañas, una pestaña a la vez. La pestaña elegida forma parte de la dirección de la página, así que al recargar o al abrir un enlace compartido se vuelve a abrir." }
  - { text: Summary, translation: Resumen }
  - { text: "A tab holds any nodes, as a box does.", translation: "Una pestaña contiene cualquier nodo, como una caja." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "Solo se dibujan los nodos de la pestaña elegida." }
  - { text: Chosen, translation: Elegida }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "Cada pestaña se entrega según su propio when, como cualquier nodo." }
  # The labels of the overview's models.
  - { text: Code, translation: Código }
  - { text: Name, translation: Nombre }
  - { text: Status, translation: Estado }
  - { text: Active, translation: Activo }
  - { text: Paused, translation: En pausa }
  - { text: Finished, translation: Terminado }
  - { text: Budget, translation: Presupuesto }
  - { text: Started, translation: Iniciado }
  - { text: Free, context: subscription, translation: Gratuito }
  - { text: Enterprise, context: subscription, translation: Empresa }
  - { text: Version, translation: Versión }
  - { text: Team, context: subscription, translation: Equipo }

  # Conditions.
  - { text: Delivered and drawn, translation: Entregado y dibujado }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "El when de un nodo decide en el servidor si se entrega; su shown decide en el navegador si un nodo entregado se dibuja." }
  - { text: Never delivered — this node is not in the page document., translation: Nunca entregado — este nodo no está en el documento de la página. }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "Entregado y nunca dibujado: el estado no es paused, así que el navegador lo mantiene oculto." }
  - { text: Delivered by its when and drawn by its shown., translation: Entregado por su when y dibujado por su shown. }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "La condición de una colocación alrededor de un compuesto cuyo nodo tiene la suya propia se envuelve en una caja, y ambas deben cumplirse." }
  - { text: Both conditions hold., translation: Se cumplen ambas condiciones. }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "Una vista cuyo contenido desactiva su propio when no proporciona ningún nodo, así que el compuesto que la coloca se omite." }
  - { text: Never provided., translation: Nunca proporcionado. }
  - { text: Every keyword of a condition, translation: Cada palabra clave de una condición }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "Cada línea de abajo se dibuja porque su condición se cumple sobre el resumen del proyecto TEL-42 que leyó esta página: estado active, cuatro miembros, velocidad 2.5, tags design y web, su responsable un gerente, una note null y ningún codename." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: trabajan en él entre 1 y 10 personas." }
  - { text: "required: the lead has an e-mail.", translation: "required: el responsable tiene un correo electrónico." }
  - { text: "properties: the lead is a manager.", translation: "properties: el responsable es gerente." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: trabajan en él al menos tres personas." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: trabajan en él como máximo nueve personas." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: la velocidad es mayor que 2." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: la velocidad es menor que 3." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: la velocidad es múltiplo de 0.5." }
  - { text: "type: the status is a string.", translation: "type: el estado es una cadena." }
  - { text: "type, as a list: the note is a string or null.", translation: "type, como lista: note es una cadena o null." }
  - { text: "const: the status is active.", translation: "const: el estado es active." }
  - { text: "enum: the status is active or paused.", translation: "enum: el estado es active o paused." }
  - { text: "not: the status is not paused.", translation: "not: el estado no es paused." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code empieza por TEL u OPS." }
  - { text: "items: every tag has at least two letters.", translation: "items: cada tag tiene al menos dos letras." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: hay al menos dos tags." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: hay como máximo cinco tags." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: ningún tag se repite." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code tiene al menos tres caracteres." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code tiene como máximo diez caracteres." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code son letras, un guion y dígitos." }
  - { text: Missing and null, translation: Ausente y null }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null es un valor presente. Un valor ausente no cumple ninguna condición, ni siquiera una bajo not, así que la ausencia se comprueba en el padre." }
  - { text: The note is present and null., translation: note está presente y es null. }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "Nunca dibujado: un codename ausente no cumple not." }
  - { text: "The project has no codename, tested on the summary.", translation: "El proyecto no tiene codename, comprobado en el resumen." }
  - { text: Query parameters, translation: Parámetros de consulta }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "Este lector declara mode, una lista de valores tag y un ticket sujeto a un patrón. Un parámetro que la dirección omite, uno único dado dos veces o un valor que su declaración rechaza cuenta como ausente." }
  - { text: Mode detailed, translation: Modo detailed }
  - { text: Two tags, translation: Dos tags }
  - { text: A valid ticket, translation: Un ticket válido }
  - { text: A refused ticket, translation: Un ticket rechazado }
  - { text: Mode given twice, translation: Modo dado dos veces }
  - { text: Clear the query, translation: Borrar la consulta }
  - { text: mode is detailed., translation: mode es detailed. }
  - { text: There are two tag values or more., translation: Hay dos valores tag o más. }
  - { text: The ticket matches its pattern., translation: ticket coincide con su patrón. }
  - { text: "No ticket, or one its pattern refuses.", translation: "Ningún ticket, o uno que su patrón rechaza." }
  - { text: Enablement, translation: Habilitación }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "El botón solo puede pulsarse mientras se cumple su condición sobre lo que contiene el formulario, y dice por qué mientras no se cumple. Un tag que el proyecto ya tiene se rechaza, y las líneas de arriba vuelven a leer el resumen después de añadir un tag." }
  - { text: Tag TEL-42, translation: Añadir tag a TEL-42 }
  - { text: Tag, translation: Tag }
  - { text: Type a tag of three letters or more., translation: Escribe un tag de tres letras o más. }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation:
      plural: count
      cases:
        one: "{$tag} añadido: TEL-42 tiene ahora {$count} tag."
        other: "{$tag} añadido: TEL-42 tiene ahora {$count} tags."
  - { text: A page's own query, translation: La consulta propia de una página }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "Esta página también declara mode, y sus propios nodos lo leen." }
  - { text: The page reads mode as detailed., translation: La página lee mode como detailed. }

  # Data.
  - { text: A reader and its parameters, translation: Un lector y sus parámetros }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "El proyecto es el parámetro project de la dirección de la página, enviado con la lectura; sin él, el parámetro no se envía y la ruta responde para TEL-42. Un código que ningún proyecto tiene dibuja el árbol de error." }
  - { text: A code no project has, translation: Un código que ningún proyecto tiene }
  - { text: No project, translation: Sin proyecto }
  - { text: Reading the project…, translation: Leyendo el proyecto… }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, dirigido por {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "Un lector anidado en el contenido de este lee a las personas que trabajan en el mismo proyecto." }
  - { text: Working on it, translation: Trabajan en él }
  - { text: Role, translation: Rol }
  - { text: E-mail, translation: Correo electrónico }
  - { text: "No answer · {$code}", translation: "Sin respuesta · {$code}" }
  - { text: Readers that fail, translation: Lectores que fallan }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "Sin árbol de error propio, los lectores dibujan el código y el mensaje del error — para un proyecto que no existe, para una ruta protegida leída sin sesión y para una respuesta que el modelo del lector rechaza (la lista de proyectos leída como un solo proyecto)." }
  - { text: "Never drawn: there is no such project.", translation: "Nunca dibujado: no existe ese proyecto." }
  - { text: "Signed in, so this reads: {$name}", translation: "Sesión iniciada, así que esto lee: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "Nunca dibujado: una lista no es un proyecto." }
  - { text: Read again on focus, translation: Relectura al recuperar el foco }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "Este lector vuelve a leer la hora del servidor cada vez que la ventana recupera el foco. Cambia a otra ventana y vuelve." }
  - { text: Read at, translation: Leído a las }
  - { text: A sign-in gate, translation: Una barrera de inicio de sesión }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "La barrera lee si hay una sesión abierta, y vuelve a leerlo cada vez que una solicitud dentro de ella responde 401. Iniciar sesión abre una sesión para un miembro del equipo; un correo electrónico que nadie del equipo tiene se rechaza en su campo. Dentro, un lector sobre una ruta protegida muestra la cuenta. Cerrar la sesión en silencio deja la cuenta en pantalla hasta que la siguiente solicitud protegida — la comprobación de abajo, o recuperar el foco — se rechaza, y entonces la barrera cambia a la vista sin sesión." }
  - { text: You are signed out., translation: No has iniciado sesión. }
  - { text: Sign in, translation: Iniciar sesión }
  - { text: "Signed in as {$name}", translation: "Sesión iniciada como {$name}" }
  - { text: "Member since {$since}", translation: "Miembro desde {$since}" }
  - { text: Check the session, translation: Comprobar la sesión }
  - { text: End the session quietly, translation: Cerrar la sesión en silencio }
  - { text: Sign out, translation: Cerrar sesión }

  # The labels of the task models.
  - { text: Task, translation: Tarea }
  - { text: Assignee, translation: Persona asignada }
  - { text: Priority, translation: Prioridad }
  - { text: Estimate, translation: Estimación }
  - { text: Due, translation: Vencimiento }
  - { text: Label, translation: Etiqueta }
  - { text: Blocked, translation: Bloqueada }
  - { text: To do, translation: Por hacer }
  - { text: In progress, translation: En curso }
  - { text: In review, translation: En revisión }
  - { text: Bug, translation: Error }
  - { text: Feature, translation: Funcionalidad }
  - { text: Chore, translation: Mantenimiento }
  - { text: Docs, translation: Documentación }
  - { text: Contact, translation: Contacto }
  - { text: Project name, translation: Nombre del proyecto }
  - { text: Brief, translation: Descripción }

  # Tables.
  - { text: Columns from the model, translation: Columnas del modelo }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "Sin columnas escritas, una tabla muestra una por cada propiedad del modelo salvo la clave de fila, cada una encabezada por su título y dibujada según su tipo. Muestra 25 filas por página, el valor predeterminado, y abre sus formularios de creación y edición en un cuadro de diálogo, la superficie que usa una tabla cuando no nombra ninguna." }
  - { text: "Written columns, sorting and style rules", translation: "Columnas escritas, ordenación y reglas de estilo" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "Columnas escritas a mano, en el orden indicado, una con un encabezado propio. Una columna se ordena donde la colección incluye su propiedad para ordenar. La fila de una tarea bloqueada aparece resaltada y en rojo, cada celda de estado tiene su color y una prioridad que ningún caso nombra toma el predeterminado. Ocho filas por página." }
  - { text: Where, translation: Dónde }
  - { text: Members behind a reference, translation: Miembros tras una referencia }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "El tablero de tareas responde cada tarea con su persona asignada y su proyecto anidados. Una columna sobre un miembro anidado toma el título y la presentación de ese miembro a través de una forma con nombre, a través de una definición propia del modelo y a través de una referencia cuyo propio título prevalece sobre la forma que nombra: el contacto es un enlace de correo y la descripción, un enlace a una página." }
  - { text: Filtered by the address, translation: Filtrada por la dirección }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "Esta tabla declara un parámetro project y lo envía como igualdad con cada solicitud. Sin proyecto en la dirección no lee nada." }
  - { text: Atlas redesign tasks, translation: Tareas del rediseño de Atlas }
  - { text: Billing migration tasks, translation: Tareas de la migración de facturación }
  - { text: Blocked tasks, translation: Tareas bloqueadas }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "Esta se filtra por un valor fijo escrito en la tabla y solo lista las tareas bloqueadas." }
  - { text: Where a form opens, translation: Dónde se abre un formulario }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "Cada tabla de abajo abre sus formularios de creación y edición en una superficie distinta. Al guardar se recargan todas las tablas de tareas de la página." }
  - { text: Dialogs, translation: Cuadros de diálogo }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "Creación en un cuadro de diálogo pequeño que sigue abierto, vacío, para otra tarea. Edición en un cuadro de diálogo grande que no bloquea la página e ignora un clic fuera; conserva sus valores tras guardar, descarta lo no guardado sin preguntar y forma parte de la dirección. Cada fila ofrece eliminar con confirmación." }
  - { text: Drawers, translation: Cajones }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "Creación en un cajón pequeño desde el borde inicial; edición en un cajón grande desde el borde final, sin botón de cerrar. Ambos se cierran tras guardar y preguntan antes de descartar lo no guardado." }
  - { text: Sheets, translation: Hojas }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "Creación en una hoja desde arriba que no bloquea la página; edición en una hoja completa desde abajo, que forma parte de la dirección." }
  - { text: Popovers, translation: Ventanas emergentes }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "Creación en una tarjeta junto al botón Nuevo, centrada en él; por debajo del punto de corte se convierte en un cuadro de diálogo completo. Edición en una tarjeta bajo el botón de la fila, alineada a su final, que un clic fuera no cierra y que sigue abierta tras guardar." }
  - { text: In line, translation: En línea }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "El formulario de creación se abre encima de las filas y el de edición bajo la fila que cambia. Por debajo del punto de corte, el formulario de creación se abre en una hoja desde abajo." }
  - { text: Panels, translation: Paneles }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "Creación en un panel pequeño en el borde inicial, que Escape no cierra. Edición en un panel grande en el borde final, que forma parte de la dirección, con las filas aún utilizables al lado; por debajo del punto de corte se convierte en una hoja desde abajo." }
  - { text: A page of its own, translation: Una página propia }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "Creación y edición sustituyen el contenido de la página bajo un mismo nombre de dirección, así que la dirección indica una tarea nueva o la tarea con esta clave, y Atrás cierra el formulario. La superficie se declara una vez y ambas la nombran." }

  # Filters.
  - { text: Every filter the collection accepts, translation: Cada filtro que acepta la colección }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "Sin campos escritos, la barra dibuja un control por cada filtro que acepta la colección, en su orden y a partir de la propiedad del modelo: una lista para una enumeración o un valor sí/no, un cuadro de texto en los demás casos, y una etiqueta sobre los dos límites de un rango. Se sitúa encima de la tabla, aplica una elección al instante y el texto escrito al pulsar Enter, y no guarda nada entre visitas." }
  - { text: Every control, translation: Cada control }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "Cada forma de introducir un filtro: texto escrito, opciones una al lado de otra, una lista, tags escritos, un control deslizante, un interruptor y dos fechas bajo una etiqueta. El filtro de proyecto no se dibuja en ninguna parte y solo lo establece un ajuste predefinido. El estado empieza con su valor predeterminado, y un ajuste predefinido establece los filtros que nombra y borra los demás que nombran los ajustes predefinidos. Los chips resumen lo elegido, y los valores forman parte de la dirección. Por debajo del punto de corte la barra se pliega, y el filtro de texto fijado queda fuera del pliegue." }
  - { text: Urgent, translation: Urgente }
  - { text: Atlas only, translation: Solo Atlas }
  - { text: Stuck, translation: Atascadas }
  - { text: "Beside, as chips, while typing", translation: "Al lado, como chips, mientras se escribe" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "Los controles se sitúan en una columna en el borde inicial. Solo se muestran los filtros que eliges: añade uno desde la lista de la barra, y quitarlo lo borra. Cada filtro es un chip que nombra su valor y abre su control. El texto escrito se aplica tras una pausa, y los dos límites de un número llevan los rótulos después de y antes de. La elección se guarda en este navegador entre visitas. Por debajo del punto de corte la barra se abre en una hoja desde abajo." }
  - { text: "Beside at the end, applied by a button", translation: "Al lado, en el final, aplicado con un botón" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "Los controles se sitúan en el borde final, y un cambio espera a Aplicar, mientras que un ajuste predefinido, Restablecer y quitar un chip de resumen se aplican al instante. Varias personas asignadas se escriben separadas por comas. La elección se guarda solo para esta pestaña y sobrevive a una recarga." }
  - { text: Due by October, translation: Vence hasta octubre }
  - { text: "Folded, starting open", translation: "Plegable, inicialmente abierta" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "Los controles se pliegan tras un conmutador que cuenta los filtros con valor, y empiezan desplegados. El filtro de texto fijado queda fuera del pliegue, y los demás se añaden desde la lista de la barra. El estado empieza en en curso; quitarlo borra también ese valor predeterminado, y Restablecer lo recupera. Los valores se guardan tanto en la dirección como en este navegador, y prevalece la dirección; el pliegue que elijas se recuerda." }
  - { text: "Folded, starting closed", translation: "Plegable, inicialmente cerrada" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "Plegada al principio. El filtro de texto fijado, Aplicar y Restablecer quedan fuera del pliegue. La etiqueta empieza en su valor predeterminado, errores, hasta que se cambia, y Restablecer recupera el predeterminado." }
  - { text: In a dialog, translation: En un cuadro de diálogo }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "Los controles se abren en un cuadro de diálogo pequeño desde un botón que cuenta los filtros con valor, y se cierran con Listo. El cuadro de diálogo abierto forma parte de la dirección, así que un enlace lo abre. El filtro de texto fijado queda junto al botón, y los chips resumen lo elegido." }
  - { text: In a drawer, translation: En un cajón }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "Los controles se abren en un cajón desde el borde inicial, que un clic fuera no cierra. Los valores escritos se aplican tras una pausa." }
  - { text: In a popover, translation: En una ventana emergente }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "Los controles se abren en una tarjeta bajo el botón, alineada a su final; por debajo del punto de corte, en una hoja desde abajo." }

