# A mount denying anonymous callers with no verifier. `telo check` reports it here; a consumer's check sees nothing, so there
# the server refuses itself when it is created.
kind: Telo.Library
metadata:
  name: Unsatisfiable
  version: 1.0.0
  description: Test fixture exporting a server refused as AUTHENTICATION_UNSATISFIABLE.
imports: { Http: ../../../../../, Auth: ../../../../../../auth }
exports: { resources: [server] }
---
kind: Auth.TrustedHeader
metadata: { name: gateway }
---
kind: Http.Api
metadata: { name: api }
routes:
  - request: { path: /ping, method: GET }
    returns: [{ status: 204 }]
---
kind: Http.Server
metadata: { name: server }
listen: { port: 8972 }
mounts:
  - path: /closed
    mount: !ref api
    authentication: {}
