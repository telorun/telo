# Wildcard segments belong to `invalidates` alone: a link and a request target
# that write one are refused, in either spelling, and an invalidation holds its
# template variables to `pathParams` beside its wildcards.
kind: Telo.Library
metadata:
  name: UiInvalidAddressWildcard
  version: 1.0.0
  description: Test fixture exporting views and mutations whose addresses hold a wildcard segment.
imports: { Ui: ../../../../../ }
exports: { resources: [literalLink, templateLink, literalTarget, templateTarget, unboundRefresh] }
---
kind: Ui.View
metadata: { name: literalLink }
content: { type: link, text: All, to: { kind: Ui.Navigate, href: /files/* } }
---
kind: Ui.View
metadata: { name: templateLink }
content: { type: link, text: Item, to: { kind: Ui.Navigate, href: { path: "/x/{id}/**", pathParams: { id: 7 } } } }
---
kind: Ui.Mutation
metadata: { name: literalTarget }
inputModel: { kind: Telo.JsonSchema, schema: { type: object, properties: {} } }
url: /api/**
---
kind: Ui.Mutation
metadata: { name: templateTarget }
inputModel: { kind: Telo.JsonSchema, schema: { type: object, properties: {} } }
url: { path: "/api/{id}/*", pathParams: { id: 7 } }
---
kind: Ui.Mutation
metadata: { name: unboundRefresh }
inputModel: { kind: Telo.JsonSchema, schema: { type: object, properties: {} } }
url: /api/go
invalidates: [{ path: "/api/{id}/**", pathParams: { idd: 7 } }]
