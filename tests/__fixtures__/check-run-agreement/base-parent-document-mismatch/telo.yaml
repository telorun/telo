# A base: field read where it sits in the parent's schema: `#` there names the
# parent's root, whose own `tree` must be an object, so `{ tree: 5 }` is refused.
kind: Telo.Application
metadata: { name: BaseParentDocumentMismatch, version: 1.0.0 }
targets:
  - invoke: !ref child
---
kind: Telo.Definition
metadata: { name: Parent }
capability: Telo.Invocable
schema:
  type: object
  properties:
    tree: { type: object, $ref: "#" }
resources:
  - { kind: Telo.Value, metadata: { name: answer }, value: 1 }
invoke: !ref answer
---
kind: Telo.Definition
metadata: { name: Child }
extends: Self.Parent
schema: { type: object }
base:
  tree: { tree: 5 }
---
kind: Self.Child
metadata: { name: child }
