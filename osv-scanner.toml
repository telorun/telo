effectiveUntil = 2027-02-17
reason = "Vulnerable code not reached: the quadratic matching is in re2js's opt-in LOOKBEHINDS mode, which Telo never enables (a lookbehind pattern is refused by Telo's RE2 profile at parse time). The 2.8.7 fix is a patch but re2js is pinned exactly in cel and templating because the cross-engine conformance vectors pin its answers and the Rust twin tracks 2.8.3. Ends when the pin is moved deliberately with the vectors re-run."

