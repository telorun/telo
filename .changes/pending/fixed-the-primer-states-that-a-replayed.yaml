modules:
  apps/authoring-agent: Fixed
body: The primer states that a replayed durable value keeps its CEL type, including a
  scheduled run's stored inputs and the result Local.Result reads, that a step's when
  guard, Run.Iteration's and Run.Projection's collection and Run.Loop's per-turn
  condition are journaled, that a
  stream cannot be iterated inside a durable body, and that a loop's maxIterations is
  not a decision and so must not be written over a clock.
