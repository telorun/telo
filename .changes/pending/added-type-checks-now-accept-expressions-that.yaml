units:
  cel: Added
body: "Type checks now accept expressions that are safe and refuse reads that fail when
  they run. A guard narrows its value wherever it is read: after note == null ? '-' :
  note or x != null && …, the proven value is typed without null as a value, an operand
  or an argument, not only where it is dereferenced; has(x.m) proves x holds m; and
  xs.map(e, p, t) checks its transform under what p proves. A conditional's branches and
  a list's elements are joined with null apart, so c ? x : null is T|null and [x, null]
  is a list of T|null, and a union joined with a type it includes stays that union. ==,
  != and in over a list accept a value that may be null. Some expressions that checked
  clean are now refused, because the read can fail when it runs: dereferencing a
  nullable member of a comprehension variable or a cel.bind name without a guard is a
  nullable-access refusal, and reading a member that only some shapes of a union declare
  is one unknown-member refusal per read, naming .? as the repair. A guard's proof no
  longer reaches a name a macro or cel.bind binds again."
