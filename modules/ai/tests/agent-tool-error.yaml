kind: Telo.Application
metadata:
  name: AgentToolErrorTest
  version: 1.0.0
imports:
  Ai: ../
  AiEcho: ./__fixtures__/ai-echo.yaml
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testToolError
---
# Echo requests a tool that doesn't exist. With the default onToolError "feedback",
# the agent records the error and feeds it back to the model rather than aborting.
kind: AiEcho.EchoModel
metadata:
  name: echo
emitToolCall:
  name: ghost
  arguments: {}
---
kind: Run.Value
metadata:
  name: multiplier
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      a: { type: number }
      b: { type: number }
value:
  product: "${{ inputs.a * inputs.b }}"
---
kind: Ai.Tools
metadata:
  name: localTools
tools:
  - tool: !ref multiplier
    name: multiply
    description: Multiply two numbers.
    parameters:
      type: object
      additionalProperties: false
      required: [ a, b ]
      properties:
        a: { type: number }
        b: { type: number }
---
kind: Ai.Agent
metadata:
  name: assistant
model: !ref echo
onToolError: feedback
toolProviders:
  - provider: !ref localTools
---
kind: Run.Sequence
metadata:
  name: testToolError
steps:
  - name: invoke
    inputs:
      prompt: "do something"
    invoke: !ref assistant
  # The unknown-tool error is surfaced as the tool result (not swallowed), then echoed.
  - name: assertText
    inputs:
      text: "${{ steps.invoke.result.text }}"
      hadError: "${{ steps.invoke.result.steps[0].toolResults[0].error }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          text:
            type: string
            const: 'Error: no such tool "ghost".'
          hadError:
            type: boolean
            const: true
        required: [ text, hadError ]
