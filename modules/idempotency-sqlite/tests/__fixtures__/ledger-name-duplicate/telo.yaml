# Two ledgers claiming one name in one table.
kind: Telo.Library
metadata:
  name: LedgerNameDuplicate
imports:
  Idempotency: ../../..
  SQLite: ../../../../sqlite
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Idempotency.Table
metadata: { name: keys }
table: idempotency_keys
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref keys]
---
kind: Idempotency.Ledger
metadata: { name: orders }
connection: !ref db
schema: !ref appSchema
table: !ref keys
name: orders
retention: 1h
---
kind: Idempotency.Ledger
metadata: { name: ordersAgain }
connection: !ref db
schema: !ref appSchema
table: !ref keys
name: orders
retention: 1h
