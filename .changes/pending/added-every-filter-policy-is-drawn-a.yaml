modules:
  modules/ui-react: Added
body: "Every filter policy is drawn. A bar sits above its content, beside it on either
  side, folded behind a toggle that counts the active filters, or in a dialog, drawer or
  popover closed with Done, with pinned filters, Apply and Reset outside whatever folds,
  no toggle where a folding placement has no filter to fold, and the compact placement
  below the application breakpoint. Under show: chosen a list offers the filters not on
  show and each one on show can be removed; controls: chips opens each control from a
  chip; the select, options, toggle, slider and tags controls are drawn; apply commit,
  typing and button, summary chips, presets, and Reset returning to the declared
  defaults are honoured. A bar declaring policy.state keeps what is applied in the query
  keys _telo.f.<key>.<property>[.<operator>] (replacing the history entry, never adding
  one, and carried across the history entries of its page) and in browser storage under
  telo.ui:<mount path>:f:<key>, the address winning at the start and every value read
  back checked against the declared filters; a store the browser will not read or write
  is reported once and the bar continues in memory. BREAKING: a filter bar's controls
  are now inside a new filters-bar part and what it filters inside a new filters-content
  part; both were direct children of filters, so a stylesheet selecting them as children
  of filters must be updated. New parts: filters-bar, filters-content, filters-toggle,
  filters-count, filters-add, filters-apply, filters-presets, filters-preset,
  filters-summary, summary-chip, summary-chip-remove, filter-remove, filter-chip,
  filter-options, filter-option, filter-toggle, filter-slider, filter-tags, filter-tag,
  filter-tag-remove, menu and menu-item. New attributes: data-placement, data-side and
  data-pending on filters, data-active on filter and filter-chip."
