kind: Telo.Application
metadata:
  name: AppTraceSpanApp
  version: 1.0.0
imports:
  Run: ../../../../../modules/run
targets:
  - !ref seq
---
kind: Run.Sequence
metadata:
  name: seq
steps:
  - name: doEcho
    invoke: !ref echo
    inputs: { value: 7 }
---
kind: Run.Value
metadata:
  name: echo
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      value: { type: integer }
value:
  echoed: !cel "inputs.value"
