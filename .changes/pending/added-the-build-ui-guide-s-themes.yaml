modules:
  apps/hub: Added
body: "The build-ui guide's themes section covers theme and brand as two keys: theme: is
  the required look of every part and its control sets, and tokens: is the brand over
  it, a closed design-token set or a list chosen per request. It covers control sets:
  any of the fourteen controls drawn in place may be replaced in any subset, while the
  eight layer controls (select, multi-select, dialog, drawer, popover, confirmation,
  menu, tooltip) are replaced as one unit."
