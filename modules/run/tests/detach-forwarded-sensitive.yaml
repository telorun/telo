kind: Telo.Application
metadata:
  name: RunDetachForwardedSensitive
  version: 1.0.0
  description: |
    The inputs Run.Detach passes through are typed by the target's input
    contract, so a field the target marks sensitive is redacted in the detach's
    own traced inputs while the rest stays verbatim.
imports: { Run: ../, Assert: ../../assert }
targets:
  - !ref call
  - !ref expectRedacted
---
kind: Run.Detach
metadata: { name: nightly }
invoke:
  kind: Run.Value
  inputType:
    kind: Telo.JsonSchema
    schema:
      type: object
      required: [token, day]
      properties: { token: { type: string, x-telo-sensitive: true }, day: { type: string } }
  value: !cel "inputs.day"
---
kind: Telo.Sequence
metadata: { name: call }
steps:
  - name: nightly
    invoke: !ref nightly
    inputs: { token: s3cr3t-token, day: "2026-11-06" }
---
kind: Assert.Events
metadata: { name: expectRedacted }
filter:
  - { type: "*" }
expect:
  - event: nightly.Invoked
    payload:
      ref: { kind: Run.Detach }
      inputs: { token: "[redacted]", day: "2026-11-06" }
      outputs: { detached: true }
