kind: Telo.Application
metadata:
  name: Values
  description: Shows each value as written, a literal mapping never mistaken for an expression.
targets:
  - !ref listener
  - !ref router
variables:
  limits:
    env: LIMITS
    type: object
    default: { tag: cel, source: "1+1" }
  region:
    env: REGION
    type: string
    default: eu
---
kind: Telo.Definition
metadata:
  name: Listener
  description: Hands each message on a topic to its handler, with the arguments it names.
capability: Telo.Service
controllers:
  - pkg:telo/local/js?path=./nodejs/values.mjs&local_path=./nodejs/src/index.ts#Listener
schema:
  type: object
  properties:
    topics:
      type: array
      x-telo-topology-role: matcher
      items: {}
    queue: { type: string, x-telo-topology-role: matcher, x-telo-eval: compile }
    invoke:
      x-telo-ref: { kind: Telo.Invocable, use: trigger.inbound, inputs: /inputs }
    inputs:
      type: object
      properties:
        next:
          x-telo-ref: { kind: Telo.Invocable, use: dependency }
---
kind: Telo.Definition
metadata:
  name: Router
  description: Hands each request to the handler of the route whose path it matches.
capability: Telo.Service
controllers:
  - pkg:telo/local/js?path=./nodejs/values.mjs&local_path=./nodejs/src/index.ts#Router
schema:
  type: object
  properties:
    routes:
      type: array
      x-telo-topology-role: entries
      items:
        type: object
        properties:
          path: { type: string, x-telo-topology-role: matcher, x-telo-eval: compile }
          handler:
            x-telo-topology-role: handler
            x-telo-ref: { kind: Telo.Invocable, use: trigger.inbound }
---
kind: Telo.Definition
metadata:
  name: Sequence
  description: Runs its steps in order.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/values.mjs&local_path=./nodejs/src/index.ts#Sequence
schema:
  type: object
  properties:
    steps:
      type: array
      x-telo-topology-role: steps
      items: { $ref: "telo://manifest#/$defs/Step" }
---
kind: Telo.Definition
metadata:
  name: Task
  description: Does one unit of work.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/values.mjs&local_path=./nodejs/src/index.ts#Task
schema:
  type: object
  properties: {}
---
kind: Values.Listener
metadata: { name: listener }
topics:
  - orders
  - { tag: cel, source: "1+1" }
queue: !cel "variables.region"
invoke: !ref work
inputs:
  next: !ref task
---
kind: Values.Sequence
metadata: { name: work }
steps:
  - name: run
    invoke: !ref task
    inputs:
      literal: { tag: cel, source: "1+1" }
      expression: !cel "1+1"
---
kind: Values.Router
metadata: { name: router }
routes:
  - path: !interpolate "/orders/${{ variables.region }}"
    handler: !ref task
---
kind: Values.Task
metadata: { name: task }
