units:
  modules/ui: Added
body: "An edit form sends a JSON merge patch of what changed instead of replacing the
  record: PATCH <basePath>/<key> as application/merge-patch+json, naming only the shown
  properties whose value differs from the record it read, an emptied field as null, and
  {} when nothing changed, so a form over fewer properties than the collection leaves
  the others alone. A listing's edit no longer sends PUT, which a collection serving the
  contract must now answer as a merge patch. A write to a path whose last read or write
  answer carried an ETag sends it as If-Match; a 412 draws the failure with the
  problem's own code, ERR_UI_PRECONDITION_FAILED when it names none (the new keyed text
  requestPreconditionFailed, translated into the fourteen languages), and the form keeps
  what was typed. The patch and validator rules are pinned by
  conformance/merge-patch.json."
