units:
  kernel: Added
body: "A generated key or password nothing supplies is never asked for field by field:
  the input resolver receives one entry for the host value TELO_HOST_SECRET_SEED (block
  host, sensitive, generable) and the host's answer is read as the seed. Exports
  resolveWorkspaceDir, KERNEL_HOST_VALUES and withoutHostValues; npm installs and cargo
  builds of controllers no longer see the host values."
