    - code: RESOURCE_RULE_VIOLATED
      message: "DataModel.Collection/collection at 'query.filters[1]': filters by a property named as a query parameter the list endpoint owns"
---
kind: Assert.Manifest
metadata: { name: filterReservedNameAtRuntime }
source: ./__fixtures__/refusals/filter-reserved-name/telo.yaml
expect:
  errors: []
  runFails: "[ERR_DATA_MODEL_FILTER_RESERVED_NAME] RuntimeError: DataModel.Collection 'collection': 'query.filters[1]' filters by 'facet', named as a query parameter the list endpoint owns"
---
kind: Assert.Manifest
metadata: { name: sortUnknownProperty }
source: ./__fixtures__/refusals/sort-unknown-property/lib/telo.yaml
expect:
