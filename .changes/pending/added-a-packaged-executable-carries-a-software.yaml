units:
  cli: Added
body: "A packaged executable carries a software bill of materials for each local module,
  built by `telo package` from the builds and staging that wrote the module's files and
  kept to the packaged platform's layers, stored in the payload's layer store
  (`cache/layers/sha256-<hex>/sbom.cdx.json`) and named by each local `modules[]`
  entry's `layers` in `telo-app.json`; a local entry's `source` is now its manifest path
  relative to `app/`, so two file manifests sharing a directory differ. `telo sbom` and
  `telo audit` of an executable read those records from the payload, never building or
  writing anything: an edited or missing one is refused naming the module and the
  executable, and a payload packaged without records is `SBOM_INCOMPLETE` (package it
  again). `telo audit`'s upgrade hint no longer needs the candidate library's own
  inputs, a lookup of a package URL with qualifiers or a subpath sends it correctly, and
  a clean run prints no empty line."
