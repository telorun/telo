# `telo check` reports this here; a consumer's check sees nothing, so there the
# resource refuses itself when the application boots.
kind: Telo.Library
metadata:
  name: McpToolTwiceAcrossBundlesStdio
  version: 1.0.0
  description: Test fixture exporting a stdio server whose two tools bundles share an entry.
imports:
  Mcp: ../../../../../
  Run: ../../../../../../run
exports:
  resources: [server]
---
kind: Run.Value
metadata: { name: answer }
value:
  text: ok
---
kind: Mcp.Tools
metadata: { name: First }
entries:
  - name: ping
    argumentsSchema: { type: object }
    handler: !ref answer
    inputs: {}
    result:
      content:
        - { type: text, text: ok }
---
kind: Mcp.Tools
metadata: { name: Second }
entries:
  - name: ping
    argumentsSchema: { type: object }
    handler: !ref answer
    inputs: {}
    result:
      content:
        - { type: text, text: ok }
---
kind: Mcp.StdioServer
metadata: { name: server }
serverInfo: { name: fixture, version: 1.0.0 }
tools: [ !ref First, !ref Second ]
