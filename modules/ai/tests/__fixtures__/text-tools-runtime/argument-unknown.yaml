# A textTools entry that maps an argument the tool's parameters refuse, refused by the agent when it first lists its
# tools, over the schema the provider advertises.
kind: Telo.Application
metadata: { name: TextToolsArgumentUnknown, version: 1.0.0 }
imports: { Ai: ../../.., AiEcho: ../ai-echo.yaml, Run: ../../../../run }
targets:
  - !ref firstRun
---
kind: Telo.Sequence
metadata: { name: firstRun }
steps:
  - name: attempt
    try:
      - name: run
        invoke: !ref agent
        inputs: { prompt: "go" }
    catch:
      - name: report
        throw:
          code: !cel "error.code"
          message: !interpolate "${{ error.code }}: ${{ error.message }}"
---
kind: Ai.Tools
metadata: { name: fileTools }
tools:
  - name: apply_changes
    tool: { kind: Run.Value, value: { wrote: true } }
    parameters:
      type: object
      additionalProperties: false
      required: [changes]
      properties: { changes: { type: array }, dryRun: { type: boolean } }
---
kind: Ai.Agent
metadata: { name: agent }
model: { kind: AiEcho.EchoModel }
textTools:
  - tags: [telo-edit]
    tool: apply_changes
    arguments:
      changes: !cel "blocks.map(b, b.body)"
      force: !cel "true"
toolProviders:
  - provider: !ref fileTools
