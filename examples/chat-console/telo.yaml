kind: Telo.Application
metadata:
  name: ChatConsole
  categories: [ AI, Streaming ]
  description: |
    Interactive REPL chat with OpenAI streaming completions. Persists the
    conversation in sqlite so each turn sees prior history and the chat survives
    process restart. Delete the file to clear history. Type `/exit` (or
    send EOF) to leave.

    Run with the OpenAI key in a sibling `.env.local` file:
        OPENAI_API_KEY=sk-...
    The CLI loads `.env.local` from the manifest's directory automatically.
imports:
  OpenAI: oci://ghcr.io/telorun/openai@0.13.0#sha256-Tt9DaH254A972an-WTH_mtJOy9HAuUuH_SK1_bfOvHM
  Http: oci://ghcr.io/telorun/http-client@0.23.0#sha256-6WAIh0ajnTlkWNuP-59e1qNVUXVSJDWZxvPVACQg1AM
  Ai: oci://ghcr.io/telorun/ai@0.28.0#sha256-zpi3w-6zWjD3HGhxoMJKItuFM4ELZa-NTVHOtFacRII
  RecordStream: oci://ghcr.io/telorun/record-stream@0.20.0#sha256-hRwLGfhayzKJ27aKx8vp_hZoX3LTYNMsMNoMlAbWnBs
  PlainText: oci://ghcr.io/telorun/plain-text-codec@0.11.0#sha256-V8zjIxeI89VhzVcKOrOTqLq7AdsNh2n51k2avdcOh-k
  Console: oci://ghcr.io/telorun/console@0.19.0#sha256-RC9Wlj4a8ysp1g3WS3z3CbmQuAsahNj4PdsJMaNfPZw
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  Sql: oci://ghcr.io/telorun/sql@0.28.0#sha256-JC2SN6Ha8hlq9gnRGahvVNVwe-cUXHXtS8rdeo1BC24
  SQLite: oci://ghcr.io/telorun/sqlite@0.10.0#sha256-qTwG1VYpO8_AGN2UaJPWEIHyt1rt8OUlxLKtLcJkf4Q
targets:
  - !ref initSchema
  - !ref chatLoop
secrets:
  openaiApiKey:
    env: OPENAI_API_KEY
    type: string
variables:
  historyFile:
    env: HISTORY_FILE
    type: string
    x-telo-type: Telo.HostPath
    default: ./tmp/chat-history.sqlite

---
# --- Persistence -----------------------------------------------------------
kind: SQLite.Connection
metadata: { name: chatDb }
file: !cel "variables.historyFile"
---
kind: SQLite.Schema
metadata: { name: initSchema }
connection: !ref chatDb
# Imperative, not a declared `Table`: the role domain is a CHECK constraint,
# which the column vocabulary cannot state — declaring the table would drop it.
migrations:
  20260501_create_messages:
    statement: |
      CREATE TABLE IF NOT EXISTS messages (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        role TEXT NOT NULL CHECK (role IN ('system', 'user', 'assistant')),
        content TEXT NOT NULL,
        created_at TEXT NOT NULL DEFAULT (datetime('now'))
      )
---
# --- AI provider -----------------------------------------------------------
# The account: base URL and credential on the client, so the model kind carries no
# key and inherits the 401 re-acquire-and-retry from `http-client`.
kind: Http.BearerToken
metadata: { name: openaiKey }
token: !cel "secrets.openaiApiKey"
---
kind: Http.Client
metadata: { name: openaiClient }
baseUrl: https://api.openai.com/v1
credential: !ref openaiKey
---
kind: Http.Request
metadata: { name: openaiRequest }
client: !ref openaiClient
---
kind: OpenAI.ChatModelStream
metadata: { name: gpt54Nano }
model: gpt-5.4-nano
request: !ref openaiRequest
---
kind: Ai.TextStream
metadata: { name: chatStream }
model: !ref gpt54Nano
system: "You are a helpful CLI assistant. Keep replies brief — one or two sentences."
---
# --- Stream pipeline -------------------------------------------------------
# Project StreamPart records to plain text-delta strings.
kind: RecordStream.ExtractText
metadata: { name: deltas }
discriminator: type
records:
  text-delta: { do: emit, field: delta }
  finish: { do: drop }
  error: { do: throw, field: error }
---
# Fan the model's stream out: one branch prints to stdout, the other captures
# the assistant text for the history INSERT.
kind: RecordStream.Tee
metadata: { name: modelTee }
---
kind: Console.WriteStream
metadata: { name: stdout }
---
# Animated wait indicator: paints `ai  ›` with a braille spinner while the
# model is preparing the first token, clears the spinner cell on the first
# delta, then forwards every item unchanged.
kind: Console.StreamWait
metadata: { name: chatSpinner }
prefix: "{magenta.bold ai}  › "
---
# Drain the captured branch of the tee into a single string for the
# assistant-row INSERT. PlainText.Decoder already accepts Stream<string>
# as a pass-through (treats each chunk as UTF-8) and concatenates into a
# single `{text}` — exactly the "drain a string stream" primitive we need.
kind: PlainText.Decoder
metadata: { name: assistantText }
---
# --- REPL ------------------------------------------------------------------
kind: Run.Sequence
metadata: { name: chatLoop }
steps:
  # do-while via shared step name `read`: pre-loop initializes; the in-body
  # `read` overwrites it each iteration. Pattern matches modules/run/tests/run-sequence-while.yaml.
  - name: read
    invoke: !ref Console.readLine
    inputs:
      prompt: "{cyan.bold you} › "
  - name: converse
    while: !cel "steps.read.result.value != '/exit'"
    do:
      # Insert the user message FIRST, then SELECT — the SELECT now
      # returns the freshly-inserted user row as the last element, so
      # the messages array passed to Ai.TextStream is just the rows
      # verbatim. No client-side composition step needed.
      - name: insertUser
        inputs:
          sql: "INSERT INTO messages (role, content) VALUES (?, ?)"
          bindings: [ "user", !cel "steps.read.result.value" ]
        invoke:
          kind: Sql.Command
          connection: !ref chatDb
      - name: readHistory
        inputs:
          sql: "SELECT role, content FROM messages ORDER BY id ASC"
        invoke:
          kind: Sql.Query
          connection: !ref chatDb
      - name: stream
        invoke: !ref chatStream
        inputs:
          messages: !cel "steps.readHistory.result.rows"
      - name: project
        invoke: !ref deltas
        inputs:
          input: !cel "steps.stream.result.output"
      - name: tee
        invoke: !ref modelTee
        inputs:
          input: !cel "steps.project.result.output"
      - name: spin
        invoke: !ref chatSpinner
        inputs:
          input: !cel "steps.tee.result.outputA"
      - name: print
        invoke: !ref stdout
        inputs:
          input: !cel "steps.spin.result.output"
      - name: collect
        invoke: !ref assistantText
        inputs:
          input: !cel "steps.tee.result.outputB"
      - name: insertAssistant
        inputs:
          sql: "INSERT INTO messages (role, content) VALUES (?, ?)"
          bindings: [ "assistant", !cel "steps.collect.result.text" ]
        invoke:
          kind: Sql.Command
          connection: !ref chatDb
      # Move cursor to a fresh line so the next read's TTY readline
      # interface doesn't refresh-erase the assistant's reply (readline
      # in TTY mode emits `\r\x1b[K` when re-prompting on a non-empty
      # current line — without this newline, the model's text gets wiped
      # the moment we ask for the next user input).
      - name: newline
        invoke: !ref Console.writeLine
        inputs:
          output: ""
      - name: read
        invoke: !ref Console.readLine
        inputs:
          prompt: "{cyan.bold you} › "
