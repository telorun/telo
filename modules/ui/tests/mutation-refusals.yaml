kind: Telo.Application
metadata:
  name: UiMutationRefusalsTest
  version: 1.0.0
  description: |
    What a call refuses, and what a mutation and a prompt refuse of what runs
    it — a key a holder's closed shape does not list (`label` on a move, the
    old `prompt: true`, a flat button), a required input left unbound, a read
    of `prompt` or of `result` the call cannot answer, an effect that is no
    effect, a `DELETE` leaving an input unsent, an entry no control can enter,
    a read of `request` or `input` where none is bound — statically and again
    when first read; and what passes: a button under a query reading the
    query's own parameters.
imports: { Assert: ../../assert, Probe: ./__fixtures__/probe }
targets:
  - !ref mutations
  - !ref rowActionAnswers
  - !ref callTreesPass
  - !ref rowActionInputsAtRuntime
  - !ref listRowActionInputsAtRuntime
  - !ref deleteInputUnsent
  - !ref deleteInputUnsentAtRuntime
---
kind: Assert.Manifest
metadata: { name: mutations }
source: ./__fixtures__/invalid/mutations/telo.yaml
expect:
  errors:
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.Listing/rowMemberUnknown: !cel: 'row.missing' is not defined (available: id, name)"
    - code: CEL_TYPE_ERROR
      message: "Ui.Listing/chainMistyped: CEL at 'rowActions[0].inputs.id' reads 'row.name', declared 'string', but archive's declared inputType expects 'integer'."
    - code: ACCESSOR_NOT_PLAIN_CHAIN
      message: "Ui.Listing/inputComputed: 'rowActions[0].inputs.id: !cel \"row.id + 1\"' is not a plain chain"
    - code: SCHEMA_VIOLATION
      message: "Ui.Listing/inputsAbsent: /rowActions/0 is missing required property 'inputs'"
    - code: CONTRACT_INPUTS_MISMATCH
      message: "Ui.Listing/inputsEmpty: inputs at 'rowActions[0].inputs' do not satisfy rename's declared inputType: / is missing required property 'name'"
    - code: SCHEMA_VIOLATION
      message: "Ui.Listing/confirmFlag: /rowActions/0/confirm matches no alternative — expected a string, or a object"
    - code: SCHEMA_VIOLATION
      message: "Ui.Listing/confirmEmpty: /rowActions/0/confirm must NOT have fewer than 1 characters"
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.Listing/queryTypo: !cel: 'query.statuss' is not defined (available: status)"
    - code: CEL_UNKNOWN_IDENTIFIER
      message: "Ui.View/listRowActions: !cel: unknown identifier 'values' — nothing by that name is in scope here."
    - code: CONTRACT_INPUTS_MISMATCH
      message: "Ui.View/listRowActions: inputs at 'content.content[0].rowActions[1].inputs' do not satisfy archive's declared inputType: / is missing required property 'id'"
    - code: SCHEMA_VIOLATION
      message: "Ui.Listing/generateNoLabel: /rowActions/0 is missing required property 'label'"
    - code: SCHEMA_VIOLATION
      message: "Ui.Listing/promptTrue: /rowActions/0/prompt must be object"
    - code: SCHEMA_VIOLATION
      message: "Ui.Listing/onSuccessTo: /rowActions/0/onSuccess must be array"
    - code: REFERENCE_KIND_MISMATCH
      message: "Ui.Listing/dialogEffect: reference at 'rowActions[0].onSuccess[0]' → 'Ui.Dialog' does not implement 'Ui.Effect' (known implementations: Ui.Navigate, Ui.OpenPage)"
    - code: CONTRACT_INPUTS_MISMATCH
      message: "Ui.Listing/inputsNoNote: inputs at 'rowActions[0].inputs' do not satisfy annotate's declared inputType: / is missing required property 'note'"
    - code: CEL_UNKNOWN_IDENTIFIER
      message: "Ui.Listing/promptNoPrompt: !cel: 'prompt' is not available here: the call asks for nothing in `prompt`."
    - code: SCHEMA_VIOLATION
      message: "Ui.Listing/moveLabel: /layout/move must NOT have additional properties ('label' is not allowed)"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Listing/moveDelete: is a `DELETE`, which sends no body, yet leaves an input property out of its `url`. Read every property of `inputModel` in a `pathParams` or `queryParams` entry as exactly `input.<property>`, or remove it from `inputModel`."
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Prompt/objectEntry at 'fields[0]': lists a property no control can enter. A property name enters a string, a number, a boolean, one of an `enum`, or a list of those: remove it, give `model` a property of such a type, or name a field kind that enters it."
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.Listing/resultUnknown: !cel: 'result.receipt' is not defined (available: none)"
    - code: SCHEMA_VIOLATION
      message: "Ui.View/flatButton: /content is missing required property 'action'"
    - code: SCHEMA_VIOLATION
      message: "Ui.View/flatButton: /content must NOT have additional properties ('inputs' is not allowed)"
    - code: SCHEMA_VIOLATION
      message: "Ui.View/flatButton: /content must NOT have additional properties ('label' is not allowed)"
    - code: SCHEMA_VIOLATION
      message: "Ui.View/flatButton: /content must NOT have additional properties ('mutation' is not allowed)"
    - code: CEL_UNKNOWN_IDENTIFIER
      message: "Ui.View/flatButton: !cel: unknown identifier 'query' — nothing by that name is in scope here."
    - code: CEL_UNKNOWN_IDENTIFIER
      message: "Ui.View/queryFailureInput: !cel: unknown identifier 'input' — nothing by that name is in scope here."
    - code: CEL_UNKNOWN_IDENTIFIER
      message: "Ui.Listing/resultReadsRequest: !cel: 'request' is not available here: a call's trees are resolved once, at creation, with no request. Read what the request holds in the page that places the call."
---
# A table and a list each offer a row a call that draws an answer, bound from
# the row: nothing is reported, and no rule is skipped.
kind: Telo.Sequence
metadata: { name: rowActionAnswers }
steps:
  - name: check
    invoke: { kind: Probe.Diagnostics, source: ./__fixtures__/row-actions/telo.yaml }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        reported: !cel "steps.check.result.reported"
        skipped: !cel "(steps.check.result.reported + steps.check.result.noted).filter(n, n.contains('_RULE_SKIPPED'))"
      expected: { reported: [], skipped: [] }
---
# A button under a query node reads the enclosing query's parameters in its
# failure tree, and its result and prompt as written, and `ui` itself holds no
# union whose branches disagree on a property: nothing is reported.
kind: Telo.Sequence
metadata: { name: callTreesPass }
steps:
  - name: check
    invoke: { kind: Probe.Diagnostics, source: ./__fixtures__/call-trees/telo.yaml }
  - { name: library, invoke: { kind: Probe.Diagnostics, source: ../telo.yaml } }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        trees: !cel "steps.check.result.reported"
        library: !cel "steps.library.result.reported"
      expected: { trees: [], library: [] }
---
kind: Assert.Manifest
