modules:
  modules/durable-local: Added
body: "`Local.Resumer.interval`, `Local.Result`'s `wait` and `poll`, and
  `Local.Schedule.after` are durations (`5s` and `100ms` when `interval` and `poll` are
  omitted): `30d`, `1w`, `1h30m` and `250ms` are read, an integer is milliseconds, and a
  malformed literal is refused by `telo check`. A computed value must now be a duration
  (`!cel \"duration(inputs.delay)\"`), not a string, and a negative `after` is refused
  when the schedule runs, so a manifest passing a computed string must change. Text with
  a space before the unit (`5 m`) or around the value is now refused. Requires telo
  >=0.130.0."
