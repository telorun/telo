project: http-client
kind: Added
body: The `retry` blocks on Client and Request, and the deprecated `retries` count,
  are declared from the shared retry fragments instead of being written out per
  kind. Client's copy had drifted — it declared no defaults at all, so a client
  policy and a request policy disagreed about every value but `attempts`. The
  schemas stay closed; `honorRetryAfter` is merged onto the shared shape rather
  than composed with allOf, which could not have kept them closed. The controller
  now reads the deprecated `delay` duration string as `initialDelay`, the way the
  step leaf does — the shared shape carries the field, so accepting it and
  ignoring it would have made one declared policy mean two different things.
