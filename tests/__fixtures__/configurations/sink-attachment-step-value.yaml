# A reference inside a step's plain value is no attachment either.
kind: Telo.Application
metadata: { name: SinkAttachmentStepValue }
variables: { flag1: { env: FLAG_1, type: boolean, default: false } }
targets:
  - !if
    if: !cel "variables.flag1"
    then: !ref seq
---
kind: Telo.Sequence
metadata: { name: seq }
steps:
  - name: a
    value: { s: !ref traces }
---
kind: Telo.LogTraceSink
metadata: { name: traces }
