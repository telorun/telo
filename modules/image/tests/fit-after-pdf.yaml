kind: Telo.Application
metadata:
  name: ImageFitAfterPdfTest
  version: 1.0.0
  description: |
    A PDF page is rendered first, so the pdf module has already loaded its
    canvas and set the process-wide addon path; an image whose body is cut short
    is then fitted by a resource created only at that moment, which points the
    path at this module's own addon before its canvas loads, and is refused as
    unsupported instead of ending the process.
imports:
  Image: ../
  Pdf: ../../pdf
  Fixture: ../../pdf/tests/__fixtures__/sample-form.yaml
  Assert: ../../assert
targets:
  - !ref test
---
# The fit resource lives in this sequence's scope, so its controller — and the
# canvas it loads — first exists after the page below has been rendered.
kind: Telo.Sequence
metadata: { name: fitCorrupt }
with:
  - { kind: Image.Fit, metadata: { name: fit } }
steps:
  - name: tryCorrupt
    try:
      - name: corrupt
        inputs:
          image: !include-bytes ./__fixtures__/truncated.png
          maxWidth: 512
          maxHeight: 512
        invoke: !ref fit
      - name: corruptAccepted
        throw: { code: NOT_REFUSED, message: the call was expected to fail }
    catch:
      - name: assertCorrupt
        inputs:
          actual: !cel "error.code"
          expected: ERR_UNSUPPORTED_IMAGE
        invoke: { kind: Assert.Equals }
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: document
    invoke: !ref Fixture.sampleFormPdf
  - name: page
    inputs:
      data: !cel "steps.document.result.data"
    invoke: { kind: Pdf.Rasterizer }
  - name: assertRendered
    inputs:
      actual: !cel "steps.page.result.mediaType"
      expected: image/png
    invoke: { kind: Assert.Equals }
  - name: fitted
    invoke: !ref fitCorrupt
