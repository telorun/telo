# A `base:` building a step body: a `value:` step reading `self` stays an
# expression, so the number an instance supplies is never read as one written
# in the step — `ratio: 3` and `ratio: 2.5` are both the doubles the field
# declares, as the whole value, as a member of a literal map, and inside a larger
# expression.
kind: Telo.Application
metadata:
  name: BaseValueStepNumber
imports:
  Run: ../../../modules/run
  Assert: ../../../modules/assert
targets:
  - !ref verify
---
kind: Telo.Definition
metadata:
  name: Scale
extends: Run.Sequence
schema:
  type: object
  properties:
    ratio: { type: number }
  required: [ratio]
base:
  steps:
    - name: whole
      value: !cel "self.ratio"
    - name: member
      value: { ratio: !cel "self.ratio" }
    - name: product
      value: !cel "self.ratio * 1.0"
---
kind: Run.Sequence
metadata:
  name: verify
steps:
  - name: integral
    invoke: { kind: Self.Scale, ratio: 3 }
  - name: fractional
    invoke: { kind: Self.Scale, ratio: 2.5 }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        integral:
          whole: !cel "steps.integral.result.whole.result * 2.0"
          member: !cel "steps.integral.result.member.result.ratio * 2.0"
          product: !cel "steps.integral.result.product.result * 2.0"
        fractional:
          whole: !cel "steps.fractional.result.whole.result * 2.0"
          member: !cel "steps.fractional.result.member.result.ratio * 2.0"
          product: !cel "steps.fractional.result.product.result * 2.0"
      expected:
        integral: { whole: 6, member: 6, product: 6 }
        fractional: { whole: 5, member: 5, product: 5 }
