  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/ita.traineddata.gz:
        { upstream: ita, member: package/4.0.0_best_int/ita.traineddata.gz, sha256: f702fcfad297ce028ede3626d1467b67939f23ff23595f9badd54681cf25a4d3, executable: false }
---
kind: TesseractModel.Language
metadata:
  name: ita
  description: Italian, Latin script
code: ita
data: !module-path ./tessdata/ita.traineddata.gz
