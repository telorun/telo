name: Release Studio

# Builds the Tauri desktop binaries for Telo Studio and publishes them as a
# GitHub Release on the external `telorun/studio` repo (the same repo the web
# build is deployed to via Pages in `studio-pages.yml`). The web image and its
# chart are the `apps/studio` unit's `docker` and `helm` rows, published with every
# other image and chart by `publish-docker.yml`.
#
# Called by the branch's Publish workflow on finals and patches only. The `gate`
# job reads whether the release moved the `apps/studio` unit from the units the
# release commit moved (`units`) before spending matrix minutes. Every job builds
# the release tag's tree, the publication commit. A re-run of the Publish run
# answers as the first did.

on:
  workflow_call:
    inputs:
      channel:
        description: 'final or patch.'
        type: string
        required: true
      version:
        description: 'The CLI version released (the release this Studio build belongs to).'
        type: string
        required: true
      tag:
        description: 'The release tag (v<version>), checked out.'
        type: string
        required: true
      units:
        description: 'JSON array of {key, name, version, ecosystem}: the units the release commit moved (release-units.mjs).'
        type: string
        default: '[]'

permissions:
  contents: read

jobs:
  gate:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      # Whether the image's `latest` tag moves forward (release-pointers.mjs).
      latest: ${{ steps.pointers.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Did the release move Studio
        id: check
        env:
          UNITS: ${{ inputs.units }}
        run: |
          set -euo pipefail
          VERSION=$(echo "${UNITS:-[]}" | jq -r '[.[] | select(.key=="apps/studio")][0].version // ""')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo "Studio released $VERSION."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "The release did not move apps/studio; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the release scripts' dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      - name: Does the latest tag move forward
        id: pointers
        run: node scripts/release-pointers.mjs --version "${{ inputs.version }}" --channel "${{ inputs.channel }}"

  build:
    name: Build (${{ matrix.label }})
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            triple: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            triple: x86_64-apple-darwin
            label: macos-x64
          - os: ubuntu-22.04
            target: ''
            triple: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: ''
            triple: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Tauri 2 system libraries (webkit2gtk + tray/appindicator + packaging).
      # libdbus-1-dev is required from tauri 2.11: its `tao` 0.35 enables the
      # `dbus` feature by default on Linux, and `libdbus-sys` builds via
      # pkg-config against dbus-1.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 24, the same version the standalone release pins. This job stages the
      # telo sidecar, and that build generates the SEA blob with the Node that
      # RUNS it before injecting it into the pinned runtime — so a different
      # major here is a blob and a runtime that were never meant to meet, in the
      # one artifact the editor needs in order to run anything.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Studio's `beforeBuildCommand` only runs its own vite build, which
      # imports the built dist of these workspace deps. Build them first; the
      # `^...` selector is deps-only (excludes studio itself).
      - name: Build workspace dependencies
        run: pnpm --filter "@telorun/studio^..." build

      # Studio runs applications through `telo runner`, so it ships the telo it
      # runs them with — built from THIS commit rather than downloaded from a
      # release, which is what makes the bundled runtime derivable instead of
      # asserted and unties this build from the CLI's release schedule. Tauri
      # names a sidecar by the Rust target triple; the script translates that to
      # the CLI build's own platform tokens. A failure here fails the release:
      # an editor that cannot run anything is the outcome the sidecar exists to
      # prevent.
      - name: Stage the telo sidecar
        run: node apps/studio/scripts/stage-cli-sidecar.mjs --triple ${{ matrix.triple }}

      - name: Build Tauri bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/studio
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # Glob the single-file deliverables straight from the bundle tree. Reading
      # the filesystem (rather than tauri-action's `artifactPaths` string) sidesteps
      # Windows path-format handling, and the per-extension globs skip the macOS
      # `.app` directory (shipped inside the .dmg). `target/**/release` matches both
      # the plain (`target/release`, Linux/Windows) and triple-scoped
      # (`target/<triple>/release`, macOS `--target`) layouts.
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.label }}
          path: |
            apps/studio/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/studio/src-tauri/target/**/release/bundle/msi/*.msi
            apps/studio/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/studio/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/studio/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Publish release to telorun/studio
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      # By pattern: inside the Publish run the Docker jobs' build records are
      # artifacts too, and they cannot be downloaded.
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          path: artifacts
          merge-multiple: true

      - name: List bundles
        run: ls -la artifacts

      # Cross-repo: publishes to telorun/studio's Releases using the same PAT
      # that the Pages deploy uses. softprops creates the tag/release if absent
      # and reuses it (appending assets) on re-runs of the same version.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: telorun/studio
          token: ${{ secrets.STUDIO_PAGES_TOKEN }}
          tag_name: studio-v${{ needs.gate.outputs.version }}
          name: Telo Studio v${{ needs.gate.outputs.version }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          body: |
            Desktop builds of Telo Studio v${{ needs.gate.outputs.version }}.

            | Platform | Assets |
            | --- | --- |
            | macOS (Apple Silicon) | `.dmg` — `macos-arm64` |
            | macOS (Intel) | `.dmg` — `macos-x64` |
            | Windows | `.msi` / `.exe` |
            | Linux | `.AppImage` / `.deb` |

            Each build carries the `telo` CLI it runs applications with, so a
            local run needs no separate install and no Docker.

            > These are **unsigned** builds: macOS Gatekeeper and Windows
            > SmartScreen will warn on first launch. Code signing is a follow-up.
