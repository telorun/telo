kind: Telo.Library
metadata:
  name: OctetCodec
  version: 0.10.1
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Data]
  description: |
    Raw binary on the wire: bytes pass through untouched on the way out, and on the
    way in every chunk is collected into one contiguous buffer. The codec to use for
    files, images and any payload that is already in its final byte form.
imports:
  Codec: ../codec
exports:
  kinds:
    - Encoder
    - Decoder
---
# Encoder: byte stream → byte stream (identity).
kind: Telo.Definition
metadata:
  name: Encoder
  description: >-
    Passes a byte stream through unchanged, for payloads that are already in their
    final form and need no serialization.
capability: Telo.Invocable
extends: Codec.Encoder
controllers:
  - pkg:telo/local/js?path=./nodejs/encoder-controller.mjs&local_path=./nodejs/src/encoder-controller.ts
schema:
  type: object
  additionalProperties: false
---
# Decoder: byte stream → single Uint8Array (collect).
kind: Telo.Definition
metadata:
  name: Decoder
  description: >-
    Collects every chunk of a byte stream into a single contiguous buffer, for when a
    payload has to be held whole rather than consumed incrementally.
capability: Telo.Invocable
extends: Codec.Decoder
controllers:
  - pkg:telo/local/js?path=./nodejs/decoder-controller.mjs&local_path=./nodejs/src/decoder-controller.ts
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      bytes:
        type: object
        description: Single Uint8Array formed by concatenating every chunk in `input`.
    required: [ bytes ]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
