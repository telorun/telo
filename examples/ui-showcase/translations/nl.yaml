  # Actions.
  - { text: A bare button, translation: Een kale knop }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "Een invoermodel zonder eigenschappen tekent alleen de knop. Deze deblokkeert elke geblokkeerde taak van TEL-42, en de taaktellingen en de TEL-42-tabel verderop lezen opnieuw." }
  - { text: Unblock TEL-42, translation: TEL-42 deblokkeren }
  - { text: An answer drawn from the result, translation: Een antwoord getekend uit het resultaat }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "De route telt de schattingen van de open taken van een project op. Zijn velden zijn die van het invoermodel, in twee secties, met het project gekozen uit de projectencollectie en het tempo op een schuifregelaar; wat je invoert, wordt in het adres bewaard. Het antwoord wordt onder de knop getekend: zinnen over het resultaat en het verstuurde record, de datum waarop het werk klaar zou zijn, en een lijst van de uren per label." }
  - { text: What to count, translation: Wat tellen }
  - { text: How fast, translation: Hoe snel }
  - { text: Estimate, context: verb, translation: Schatten }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} heeft geen open werk."
        one: "{$hours} uur in {$tasks} open taak van {$project}"
        other: "{$hours} uur in {$tasks} open taken van {$project}"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation:
      plural: weeks
      cases:
        one: "Ongeveer {$weeks} week bij {$pace} uur per week, klaar op"
        other: "Ongeveer {$weeks} weken bij {$pace} uur per week, klaar op"
  - { text: By label, translation: Per label }
  - { text: When it fails, translation: Als het mislukt }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "Een eigen foutboom van de actie, getekend over de fout en het verstuurde record. Wijs taak 4 toe aan james@northwind.example en het lukt. Laat het e-mailadres weg, of noem iemand die niet in het team zit, en de weigering komt bij het veld terecht; taak 999 antwoordt 404, en tomas@northwind.example, die is vertrokken, 409." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "Deze actie leest het antwoord van de schattingsroute als een aantal dagen, wat de route niet geeft: het antwoord wordt geweigerd door het uitvoermodel van de actie, en haar foutboom zegt dat." }
  - { text: Estimate in days, translation: Schatten in dagen }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: dit is niet het antwoord dat deze knop leest." }
  - { text: Where a success goes, translation: Waar een succes naartoe gaat }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "De eerste antwoordt met de pagina met de taken van een project, en de applicatie gaat daarheen. De tweede antwoordt met de homepage van het team, een https-adres dat de pagina vervangt." }
  - { text: Open its tasks, translation: Taken openen }
  - { text: Visit the homepage, translation: Homepage bezoeken }
  - { text: Reading again after a success, translation: Opnieuw lezen na een succes }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "Een taak verplaatsen leest zowel de tellingen hieronder, een lezer, als de TEL-42-tabel verderop opnieuw. Het antwoord noemt de taak en haar nieuwe status." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: {$todo} te doen, {$doing} bezig, {$review} in beoordeling, {$done} voltooid, {$blocked} geblokkeerd." }
  - { text: Move, translation: Verplaatsen }
  - { text: "Task {$id}, {$title}, is now", translation: "Taak {$id}, {$title}, is nu" }
  - { text: One press after another, translation: De ene klik na de andere }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "Opmerkingen worden na elkaar verstuurd, in de volgorde waarin de knop wordt ingedrukt, hoe snel ook. De knop wacht op drie tekens en zegt waarom; een andere taak kiezen wist het laatste antwoord. De opmerkingen onderaan worden na elke opmerking opnieuw gelezen." }
  - { text: Add the comment, translation: Opmerking toevoegen }
  - { text: Write three characters or more., translation: Schrijf drie of meer tekens. }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        one: "Opmerking {$id} is de eerste bij {$title}."
        other: "Opmerking {$id} toegevoegd aan {$title}, dat nu {$count} opmerkingen heeft."
  - { text: Row actions on a table, translation: Rijacties in een tabel }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "Elke taak van TEL-42 biedt drie knoppen, die elk na indrukken door hun antwoord worden vervangen. Starten wordt direct uitgevoerd, alleen bij een taak die nog te doen is. Sluiten vraagt het eerst, en wordt niet aangeboden bij een voltooide taak. Toewijzen opent een dialoogvenster voor het e-mailadres, dat de rij niet geeft, en toont de weigering van de server bij het veld." }
  - { text: Number, translation: Nummer }
  - { text: Start, context: verb, translation: Starten }
  - { text: Closed, translation: Gesloten }
  - { text: Close this task?, translation: Deze taak sluiten? }
  - { text: Already started., translation: Al gestart. }
  - { text: Already finished., translation: Al voltooid. }
  - { text: Assign, translation: Toewijzen }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} is toegewezen aan {$assignee}." }
  - { text: "Task {$id} is unchanged.", translation: "Taak {$id} is ongewijzigd." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: Rijacties in een lijst }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "De laatste opmerkingen, een lijst die een lezer tekent, vastgezette eerst. Vastzetten wordt direct uitgevoerd bij een opmerking die nog niet is vastgezet, Verwijderen vraagt het eerst, en Bewerken vraagt in een dialoogvenster om de nieuwe tekst; leeg laten wordt bij het veld geweigerd. De lijst wordt na elke actie opnieuw gelezen." }
  - { text: Latest comments, translation: Laatste opmerkingen }
  - { text: Pin, translation: Vastzetten }
  - { text: Already pinned., translation: Al vastgezet. }
  - { text: Delete this comment?, translation: Deze opmerking verwijderen? }
  - { text: Rewrite this comment?, translation: Deze opmerking herschrijven? }
  - { text: More places a success goes, translation: Meer plekken waar een succes naartoe gaat }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "De eerste voegt een taak toe en gaat naar de tabellenpagina, een adres dat in het manifest is geschreven. De tweede antwoordt met het adres van het handboek, een bestand dat de server onder het koppelpunt serveert en dat gewoon wordt geladen. De derde antwoordt met de spiegel van het team, een adres dat een browser als een andere host leest: het navigeert nergens heen, en het antwoord zegt dat." }
  - { text: Add it and open the tables, translation: Toevoegen en tabellen openen }
  - { text: Open the handbook, translation: Handboek openen }
  - { text: Open the mirror, translation: Spiegel openen }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "Het antwoord was {$mirror}, geen adres om naartoe te gaan, dus de pagina blijft." }
  - { text: "Refused, and unanswered", translation: "Geweigerd, en onbeantwoord" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "Alleen een manager mag een project pauzeren. Zonder sessie antwoordt de bewaker 401. Ingelogd op de pagina Gegevens als james@northwind.example, die geen manager is, antwoordt de route 403 zonder body; ingelogd als ada@northwind.example pauzeert ze het project, en weigert ze een project dat niet loopt in de taal van de pagina. De standaardfoutboom van de actie tekent elke weigering." }
  - { text: Pause the project, translation: Project pauzeren }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "{$code} loopt niet, dus het kan niet worden gepauzeerd." }
  - { text: "{$name} is paused.", translation: "{$name} is gepauzeerd." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "Deze route stuurt elk verzoek terug naar zichzelf, dus de browser geeft het op en er komt helemaal geen antwoord. De foutboom zegt dat: de fout heeft geen status." }
  - { text: Call a route that never answers, translation: Een route aanroepen die nooit antwoordt }
  - { text: "The route answered, with the status", translation: "De route antwoordde, met de status" }
  - { text: "No answer arrived, so there is no status.", translation: "Er kwam geen antwoord, dus er is geen status." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: Rijacties die het adres lezen }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "De tabel toont de taken van het project dat het adres noemt, en Verplaatsen zet een taak op de status die het adres noemt, gelezen uit de query van de tabel op het moment van indrukken. De rij en het adres binden elk veld van de verplaatsing, dus het dialoogvenster vraagt niets en is een gewone bevestiging. Kies een project en een status:" }
  - { text: TEL-42 into review, translation: TEL-42 naar beoordeling }
  - { text: APP-5 to finished, translation: APP-5 naar voltooid }
  - { text: OPS-7 back to in progress, translation: OPS-7 terug naar bezig }
  - { text: Neither, translation: Geen van beide }
  - { text: Moved to, translation: Verplaatst naar }
  - { text: Move this task to the status the address names?, translation: Deze taak verplaatsen naar de status die het adres noemt? }
  - { text: Choose a status above first., translation: Kies eerst hierboven een status. }

  # Components.
  - { text: A component on the page, translation: Een component op de pagina }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "Een component geschreven in TSX en geleverd door een bibliotheek van dit voorbeeld, geplaatst met vaste eigenschappen. Hij gebruikt alles wat de host hem geeft: hij toont waar de pagina is, houdt in het adres bij welk paneel open is, gaat naar een andere pagina via navigate en via een link uit href, en krijgt een https-adres geweigerd. Hij leest hoe TEL-42 ervoor staat en voegt een taak toe met fetch, meldt met notifyChanged dat de taken zijn gewijzigd — zodat de tabel hieronder opnieuw leest — en telt met onChanged elke wijziging waarvan hij hoort, de eigen bewerkingen en verwijderingen van de tabel inbegrepen. Een taak die hij toevoegt, wordt aangekondigd in een eigen laag in de hoek van de pagina." }
  - { text: A component in a cell, translation: Een component in een cel }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "De prioriteitskolom wordt getekend door een component die de prioriteit van elke rij krijgt en of de taak geblokkeerd is. De tabel toont de taken van TEL-42 uit dezelfde collectie waarnaar de component schrijft, dus ze leest opnieuw wanneer hierboven een taak wordt toegevoegd; haar bewerkingen en verwijderingen worden door de component gehoord." }
  - { text: Its stylesheet, translation: Zijn stylesheet }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "De bronnen van de componenten importeren een eigen stylesheet, die de applicatie in de laag telo.component plaatst: na het thema en het merk, vóór de eigen stylesheet van de applicatie. Elke waarde erin leest een designtoken, zodat de takendesk en de meter het uiterlijk van elk koppelpunt aannemen." }

  # CRUD.
  - { text: A generated admin screen, translation: Een gegenereerd beheerscherm }
  - { text: "One declaration over the tasks collection the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the collection, so the screen offers exactly what the API accepts.", translation: "Eén declaratie over het takenmodel waaruit de API wordt geserveerd: een filterbalk, een sorteerbare tabel met pagina's, een formulier om een taak toe te voegen en een om haar te wijzigen, en verwijderen met bevestiging op elke rij. De kolommen, de velden en de filters worden allemaal afgeleid uit het model, dus het scherm biedt precies wat de API accepteert." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "De balk staat naast de tabel aan de eindrand en toont alleen de filters die je kiest, elk als chip die zijn besturingselement opent. Hij bewaart zijn keuze in deze browser onder de sleutel aside — de sleutel van de balk naast de tabel op de pagina Filters, dus een filter dat op een van beide pagina's is gekozen, is op beide gekozen." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "Een nieuwe taak opent in een lade vanaf de eindrand en blijft open, leeggemaakt, voor de volgende. Een taak wordt gewijzigd in een paneel naast de lijst, dat deel uitmaakt van het adres, en wie het verlaat met niet-opgeslagen invoer, krijgt eerst een vraag." }

  # Related records.
  - { text: "Related records", translation: "Gerelateerde records" }
  - { text: "Posts and their authors", translation: "Berichten en hun auteurs" }
  - { text: "Each post names its author by key. The author column shows the author's name instead, read in one request for every author on the page, and the bar's author filter offers every author by name. The create and edit forms pick the author from a list of authors, searched by name.", translation: "Elk bericht noemt zijn auteur bij diens sleutel. De auteurskolom toont in plaats daarvan de naam van de auteur, gelezen in één verzoek voor alle auteurs op de pagina, en het auteursfilter van de balk biedt elke auteur bij naam aan. De formulieren voor aanmaken en bewerken kiezen de auteur uit een lijst van auteurs, doorzoekbaar op naam." }
  - { text: "Only the authors with posts", translation: "Alleen de auteurs met berichten" }
  - { text: "These filters offer only the authors and the statuses present among the posts the other filters leave, each with how many posts it has. The posts are drawn as cards, and as a list below the breakpoint, loading more as you reach the end.", translation: "Deze filters bieden alleen de auteurs en statussen aan die voorkomen onder de berichten die de andere filters overlaten, elk met het aantal berichten. De berichten worden als kaarten getekend, en onder het breekpunt als een lijst die meer laadt zodra je het einde bereikt." }
  - { text: "On a board by status", translation: "Op een bord per status" }
  - { text: "One column per status, each read and counted on its own. Drag a card to another column, or move it from its menu, to change its status; every list of posts on the page reads again.", translation: "Eén kolom per status, elk apart gelezen en geteld. Sleep een kaart naar een andere kolom, of verplaats hem via zijn menu, om zijn status te wijzigen; elke lijst met berichten op de pagina wordt opnieuw gelezen." }
  - { text: "On a calendar", translation: "Op een kalender" }
  - { text: "The posts on the day each is published, a month at a time; the month shown reads every post dated in it. A post with no date is not on the calendar.", translation: "De berichten op de dag dat elk verschijnt, een maand tegelijk; de getoonde maand leest elk bericht dat erin gedateerd is. Een bericht zonder datum staat niet op de kalender." }
  - { text: "The authors", translation: "De auteurs" }
  - { text: "The authors' own screen, generated from their collection. It reads the same address the posts' author filter and picker read, so an author added here is offered there at once.", translation: "Het eigen scherm van de auteurs, gegenereerd uit hun collectie. Het leest hetzelfde adres als het auteursfilter en de auteurskiezer van de berichten, dus een auteur die hier wordt toegevoegd, wordt daar meteen aangeboden." }
  - { text: "Reporting lines as a tree", translation: "Rapportagelijnen als boom" }
  - { text: "Each person names who they report to, a relation of the people to themselves. The tree reads the people who report to nobody first, and a person's reports when they are opened. The form picks the manager from the same people.", translation: "Elke persoon noemt aan wie hij rapporteert, een relatie van de mensen met zichzelf. De boom leest eerst de mensen die aan niemand rapporteren, en de medewerkers van een persoon zodra die wordt geopend. Het formulier kiest de leidinggevende uit dezelfde mensen." }
  # The labels of the related-records page's models.
  - { text: "Author", translation: "Auteur" }
  - { text: "Draft", translation: "Concept" }
  - { text: "Published", translation: "Gepubliceerd" }
  - { text: "Published on", translation: "Gepubliceerd op" }
  - { text: "Reports to", translation: "Rapporteert aan" }
  - { text: "Post", translation: "Bericht" }

  # Themes.
  - { text: Four mounts of one design, translation: Vier koppelpunten van één ontwerp }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "Dezelfde pagina's worden vier keer geserveerd, waarbij elke applicatie haar eigen thema, merk en navigatie noemt. De pagina's zijn één set weergaven, door alle vier via een verwijzing geplaatst, dus alleen het uiterlijk en de navigatie verschillen." }
  - { text: At the root, translation: Op het hoofdpad }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "Het ingebouwde uiterlijk, de eigen stylesheet van dit voorbeeld eroverheen, en een merk dat voor elk verzoek wordt gekozen: de tokenset van Acme zolang een cookie erom vraagt, anders de eigen waarden van het thema." }
  - { text: Under /radix, translation: Onder /radix }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Het Radix-thema: zijn stylesheet en zijn dertien besturingselementen — de keuzelijsten, dialoogvensters, laden, pop-overs, menu's en tooltips — met het merk overgelaten aan het thema." }
  - { text: Under /brand, translation: Onder /brand }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "Een eigen thema van dit voorbeeld: de besturingselementen van Radix onder een hier geschreven stylesheet, met eigen tokenwaarden. Het merk van de applicatie is één tokenset, die het lettertype Inter levert dat het thema noemt." }
  - { text: Under /sidebar, translation: Onder /sidebar }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "Het ingebouwde uiterlijk met de navigatie in een zijbalk naast de pagina, die inklapt tot een smalle strook en zijn geopende groepen onthoudt. Op een telefoon wordt hij een tabbalk langs de onderrand." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "Een link wordt opgelost onder het koppelpunt waarin hij wordt getekend, dus de links tussen de koppelpunten en de merkschakelaar staan op de pagina Thema's van de applicatie op het hoofdpad." }
  - { text: Every design token, translation: Elk designtoken }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "Elk token van de gesloten set zoals het thema en het merk van deze pagina het invullen, gelezen uit de CSS-eigenschap waarnaar de renderer het projecteert, met een voorbeeld erin getekend. Open een ander koppelpunt, of wissel het merk op het hoofdpad, en de waarden veranderen." }
  - { text: Typefaces, translation: Lettertypen }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "De lettertypen voor tekst en koppen in elk van hun vier stijlen, en voor elke stijl of deze applicatie hem serveert. Onder /brand zijn dat de stijlen normaal, vet, cursief en vet cursief van Inter, die met het voorbeeld worden meegeleverd en met de pagina worden geserveerd; de andere twee koppelpunten serveren er geen en tekenen met de eigen lettertypen van de bezoeker." }
  - { text: Switch the mount or the brand, translation: Koppelpunt of merk wisselen }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "Deze links zijn van deze applicatie zelf: een link wordt opgelost onder het koppelpunt waarin hij wordt getekend, dus alleen de applicatie op het hoofdpad bereikt de andere twee. Elke link laadt gewoon een andere applicatie." }
  - { text: Open the Radix mount, translation: Radix-koppelpunt openen }
  - { text: Open the brand mount, translation: Merk-koppelpunt openen }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "Het merk van deze applicatie wordt voor elk verzoek gekozen. De schakelaar zet of wist een cookie en keert hier terug, en zolang de cookie er is, wordt de tokenset van Acme gebruikt in plaats van die van het thema." }
  - { text: Use the Acme brand, translation: Merk Acme gebruiken }
  - { text: "Use the theme's own values", translation: Eigen waarden van het thema gebruiken }

