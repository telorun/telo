modules:
  apps/authoring-agent: Added
body: "Checkpoints: every change write_file, edit_file and delete_file make is recorded
  under its turn before the workspace is touched (entries in agent.sqlite, file copies
  under <AGENT_STATE_DIR>/checkpoints/<turnId>/), within MAX_CHECKPOINT_BYTES (16777216)
  and MAX_CHECKPOINT_FILES (1000) per call. GET /chat/{turnId}/changes lists a turn's
  net file changes as diffs, each with changedSince true, false or null (not compared:
  one request reads at most 4194304 bytes of workspace files, in path order, to answer
  it); POST /chat/{turnId}/revert restores every file still holding what the turn left
  and skips one changed since (refusals: 410 ERR_JOURNAL_KEY_REMOVED, 404
  ERR_TURN_NOT_FOUND, 404 ERR_CONVERSATION_NOT_FOUND, 410 ERR_CONVERSATION_REMOVED, 409
  ERR_CONVERSATION_ARCHIVED, 409 ERR_TURN_IN_PROGRESS, 409 ERR_TURN_NOT_CHECKPOINTED,
  503 ERR_WORKSPACE_BUSY). Every ended turn on GET /conversations/{id}/records carries
  summary { files, check, runs, usage } and revert. A turn's diff reads at most 4194304
  bytes of checkpoint copies, taken in path order: a file past that budget is still
  listed, with added, removed, firstLine and hunks null, in the summary and on the
  changes route alike. The file tools' output gains changes and hunks, and they can now
  fail with ERR_CHECKPOINT_TOO_LARGE, ERR_FILE_NOT_TEXT, ERR_WORKSPACE_BUSY and
  ERR_PATH_NOT_A_FILE. One workspace lease serializes those tools, POST /workspace (now
  503 ERR_WORKSPACE_BUSY when it stays held; a refused caller resends) and each batch of
  up to 25 reverted paths. A turn that spends its step budget ends completed with a
  wrap-up reply and finish.limit max-steps instead of failing with ERR_AGENT_MAX_STEPS.
  GET /capabilities lists turn-changes, turn-revert, turn-summary and turn-conclusion.
  Breaking: every tool and both /workspace routes refuse a path inside the agent's state
  directory with ERR_PATH_OUTSIDE_WORKSPACE; delete_file and each delete entry of POST
  /workspace (400, nothing applied) refuse the workspace root and a directory holding
  the state directory the same way; POST /chat/{turnId}/continue answers 410
  ERR_JOURNAL_KEY_REMOVED (was 404 ERR_TURN_NOT_FOUND) for a turn marked removed whose
  cleanup has not finished; and the database migration clears and rebuilds the turn
  projection at boot; turns recorded earlier keep their records, report summary.files
  null and cannot be reverted."
