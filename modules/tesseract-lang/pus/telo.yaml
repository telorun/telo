    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/pus.traineddata.gz:
        { upstream: pus, member: package/4.0.0_best_int/pus.traineddata.gz, sha256: 689b369c109107c4df1cd133446b9de0b10b79706a070d4c35dc885a52764105, executable: false }
