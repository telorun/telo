kind: Telo.Application
metadata:
  name: ImageFitStaticChecks
  version: 1.0.0
  description: |
    What `telo check` says about Image.Fit before anything runs: a literal box
    side, quality or format outside its range is refused against the input
    contract, and a literal limit below one against the resource's schema.
imports:
  Assert: ../../assert
targets:
  - !ref outOfRange
---
kind: Assert.Manifest
metadata: { name: outOfRange }
source: ./__fixtures__/fit-out-of-range.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: maxBytes
    - code: SCHEMA_VIOLATION
      message: maxPixels
    - code: CONTRACT_INPUTS_MISMATCH
      message: steps[0].inputs.maxWidth
    - code: CONTRACT_INPUTS_MISMATCH
      message: steps[1].inputs.maxHeight
    - code: CONTRACT_INPUTS_MISMATCH
      message: steps[2].inputs.quality
    - code: CONTRACT_INPUTS_MISMATCH
      message: steps[3].inputs.format
