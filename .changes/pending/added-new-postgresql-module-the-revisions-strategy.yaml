modules:
  modules/graph-layers-revisions-postgres: Added
body: "New PostgreSQL module: the revisions strategy for layered knowledge graphs.
  NodeTable and RelationshipTable extend the engine's Table, taking the author's columns
  and adding the version bookkeeping as internal columns with their indexes;
  LayersTable, ChangesetsTable and ChangesetBasesTable are the three bookkeeping tables,
  of which the author names only the physical table; Node, Relationship and Store
  declare the types and one layer each. Every revision a layer publishes is kept, and
  retained history is unbounded. A layer is built on other layers by pinning their
  revisions - by number, by permanent label or at the newest - and upgraded by moving a
  pin, which merges what the layer states with what changed beneath, three ways per
  property, and leaves the rest as conflicts to resolve. Any number of drafts are open
  on a layer, each reading the layer as it stood when the draft began. Published writes
  to one layer are applied one at a time, so a bulk load belongs in a draft; a write
  that changes nothing makes no revision, and a read never writes. A table kind is held
  to its engine table's rules, restated on its own fields under the engine's codes -
  with no author column allowed as primaryKey, since the table's own row id is its key -
  and reserves the graph_ prefix for column and index names in its schema. A merge or
  create of a key the store's view does not show - never stated, or hidden by the
  layer's own removal - stores the given properties plus the declared default of every
  other one. A layer is registered only by a call that changes it, never by a refused
  call or one that changes nothing."
