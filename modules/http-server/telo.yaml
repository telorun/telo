kind: Telo.Definition
metadata:
  name: FromForwardedIdentity
  description: >-
    Reads the identity a trusted reverse proxy or gateway authenticated and
    forwarded in a header. Declared only on a mount of a server that trusts the
    proxy in front of it, since any client could send the header otherwise.
capability: Telo.Invocable
extends: Self.CredentialSource
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#FromForwardedIdentityController]
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.AssertedPresentation, { type: "null" }] }
schema:
  type: object
  additionalProperties: false
  required: [header, scheme]
  properties:
    header: { title: Header, description: The header holding the subject; matched case-insensitively., type: string, minLength: 1, x-telo-eval: compile }
    scheme:
      title: Scheme
      description: The scheme a request without the header is challenged with.
      $ref: "telo://Self/AuthScheme"
      x-telo-eval: compile
  x-telo-referrer-rules:
    - referrer: Self.Server
      condition: !cel >-
        has(referrer.trustProxy) ? referrer.trustProxy == true || (referrer.trustProxy != false && referrer.trustProxy > 0)
        : has(referrer.trustForwardedHeaders) && referrer.trustForwardedHeaders
      code: HTTP_PROXY_SOURCE_UNTRUSTED
      message: >-
        reads a forwarded identity but trusts no proxy, so any client could send that header and be
        served as anyone. Set `trustProxy` to the proxy in front of this server.
    - referrer: Self.Api
      condition: !cel "false"
      code: HTTP_PROXY_SOURCE_ON_ROUTE
      message: >-
        reads a forwarded identity in a route's `authentication`. Only a mount's can: whether the
        proxy is trusted is the server's. Move the entry to the mount.
---
# Normative: docs/authentication.md and http-signature's docs/message-signatures.md.
kind: Telo.Definition
metadata:
  name: FromMessageSignature
  description: >-
    Reads an RFC 9421 HTTP message signature from the `Signature-Input` and
    `Signature` headers, requires it to cover the listed request components and
    presents the signed bytes for a verifier to check. Covering `content-digest`
    also authenticates the body, whose digest is checked. A signature that cannot
    be read or covers less is refused as malformed.
capability: Telo.Invocable
extends: Self.CredentialSource
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#FromMessageSignatureController]
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.SignaturePresentation, { type: "null" }] }
schema:
  type: object
  additionalProperties: false
  required: [components, scheme]
  properties:
    label:
      title: Label
      description: The signature to read; without one the request must carry exactly one signature.
      type: string
      pattern: "^[a-z*][a-z0-9_.*-]*$"
      x-telo-eval: compile
    components:
      title: Components
      description: >-
        What the signature must cover, and so what it authenticates: derived components (`@method`,
        `@target-uri`, `@authority`, `@scheme`, `@request-target`, `@path`, `@query`,
        `@query-param;name="x"`) and lower-case header field names. Without `content-digest` the
        body is not authenticated.
      type: array
      minItems: 1
      x-telo-eval: compile
      items:
        type: string
        pattern: "^(@method|@target-uri|@authority|@scheme|@request-target|@path|@query|@query-param;name=\"([^\"\\\\]|\\\\[\"\\\\])*\"|[a-z0-9!#$%&'*+.^_`|~-]+)$"
    scheme:
      title: Scheme
      description: The scheme a request lacking the signature, or carrying a refused one, is challenged with.
      $ref: "telo://Self/AuthScheme"
      x-telo-eval: compile
---
# Normative: docs/authentication.md and http-signature's docs/webhook-signatures.md.
kind: Telo.Definition
metadata:
  name: FromBodySignature
  description: >-
    Reads a webhook signature over the request body, the way providers sign
    their deliveries: the signature from a header, an optional timestamp, and
    the signed bytes assembled from literal text, header values and the body.
    Presents them for a verifier to check. A signature header that cannot be
    read is refused as malformed.
capability: Telo.Invocable
extends: Self.CredentialSource
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#FromBodySignatureController]
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.SignaturePresentation, { type: "null" }] }
schema:
  type: object
  additionalProperties: false
  required: [signature, base, scheme]
  properties:
    signature:
      title: Signature
      description: Where the signature is read and how it is encoded.
      type: object
      additionalProperties: false
      required: [header, encoding]
      x-telo-eval: compile
      properties:
        header: { title: Header, description: The header holding the signature; a request without it carries no credential., type: string, minLength: 1 }
        pattern:
          title: Pattern
          description: An RE2 pattern whose first group captures each signature, every match taken; without one the whole header is the signature.
          type: string
          format: re2-pattern
          pattern: "^([^\\\\\\[(]|\\\\.|\\[([^\\\\\\]]|\\\\.)*\\]|\\(\\?)*\\([^?]"
        encoding: { title: Encoding, description: How each signature is encoded., type: string, enum: [hex, base64, base64url] }
    timestamp:
      title: Timestamp
      description: Where the signing time is read; once declared, a request without a readable one is malformed.
      type: object
      additionalProperties: false
      required: [header, unit]
      x-telo-eval: compile
      properties:
        header: { title: Header, description: The header holding the timestamp., type: string, minLength: 1 }
        pattern:
          title: Pattern
          description: An RE2 pattern whose first group captures the timestamp; without one the whole header is.
          type: string
          format: re2-pattern
          pattern: "^([^\\\\\\[(]|\\\\.|\\[([^\\\\\\]]|\\\\.)*\\]|\\(\\?)*\\([^?]"
        unit: { title: Unit, description: The unit of the integer timestamp., type: string, enum: [seconds, milliseconds] }
    base:
      title: Base
      description: The signed bytes, as parts joined with nothing between them; one part must be the body.
      type: array
      minItems: 1
      x-telo-eval: compile
      items: { $ref: "telo://HttpSignature/BasePart" }
      contains: { type: object, required: [type], properties: { type: { const: body } } }
    scheme:
      title: Scheme
      description: The scheme a request lacking the signature, or carrying a refused one, is challenged with.
      $ref: "telo://Self/AuthScheme"
      x-telo-eval: compile
