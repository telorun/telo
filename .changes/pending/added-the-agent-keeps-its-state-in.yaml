modules:
  apps/authoring-agent: Added
body: "The agent keeps its state in AGENT_STATE_DIR (default
  <WORKSPACE_DIR>/.telo-agent), as agent.sqlite, so a restart on the same workspace
  keeps its conversations; the directory is hidden from GET /workspace, the WORKSPACE
  STATE listing and list_dir. Breaking: the chat library's dbFile variable is replaced
  by a required stateDir host path, workspaceDir is a required host path, and the store
  no longer lives in ./tmp (not migrated). POST /chat takes an optional Idempotency-Key
  header: a repeat returns the original turnId. Its refusals are coded: 429
  ERR_RATE_LIMITED and ERR_AT_CAPACITY with retryAfter, 409 ERR_TURN_IN_PROGRESS with
  activeTurnId, 409 ERR_IDEMPOTENCY_KEY_IN_FLIGHT, 422 ERR_IDEMPOTENCY_KEY_REUSED; a
  refused start writes no user row."
