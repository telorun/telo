# `offset` is not a paging input: a listing is resumed by cursor.
kind: Telo.Application
metadata:
  name: OffsetInput
include:
  - ../graph-model.yaml
imports:
  Sql: ../../../../sql
  SQLite: ../../../../sqlite
  Graph: ../../../../graph
  GraphSql: ../../..
  Run: ../../../../run
targets:
  - !ref appSchema
  - !ref list
---
kind: Run.Sequence
metadata: { name: list }
steps:
  - name: nodes
    invoke:
      kind: Graph.FindNodes
      store: !ref kb
      node: !ref person
    inputs: { limit: 2, offset: 1 }
  - name: relationships
    invoke:
      kind: Graph.FindRelationships
      store: !ref kb
      relationship: !ref knows
    inputs: { offset: 1 }
  - name: reached
    invoke:
      kind: Graph.Traverse
      store: !ref kb
      from: !ref person
      to: !ref person
      hops:
        - relationship: !ref knows
    inputs: { key: a, offset: 1 }
