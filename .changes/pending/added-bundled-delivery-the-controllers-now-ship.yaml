modules:
  modules/pdf: Added
body: "Bundled delivery: the controllers now ship inside the module's own artifact
  instead of the @telorun/pdf npm package, so loading them needs no package manager.
  Skia ships as a per-platform native file (darwin x64/arm64, linux x64/arm64 in gnu and
  musl, windows x64/arm64) and pdf.js's standard fonts, CMaps, wasm decoders and worker
  ship as the module's own assets. BREAKING: the module now requires telo >=0.91.0, and
  the @telorun/pdf npm package is no longer published — nothing needs to depend on it,
  since the controller is delivered with the module."
