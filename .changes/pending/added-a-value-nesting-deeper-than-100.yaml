units:
  analyzer: Added
body: 'A value nesting deeper than 100 levels — every object and array one level,
  counted from the root of each value validated on its own — is reported as
  `SCHEMA_NESTING_EXCEEDED` where its mismatch would go, and nothing else for that
  value: a `variables:` / `secrets:` default, a value an import supplies, a resource, a
  reference slot value (in place of `INVALID_REFERENCE_FORM` / `INVALID_REFERENCE`), a
  step or call `inputs:` map, a template body entry, an inline declaration, a need
  parameters and the other validated positions. A document, or an import supplied block,
  counts each such value it holds as one leaf, so a deep value is reported once. The
  limit is `maxValueDepth` in `analyzer/validation-limits.json`, shared with the Rust
  half; where the engine itself runs out of stack first, the same code says validating
  the value nests past what the engine can follow. Before, `telo check` and the load
  stopped with an uncoded "Maximum call stack size exceeded", or a value branch that
  could not finish read as refusing the value. The validation results, the judge and
  `satisfiesValueBranch` now answer valid, invalid or could-not-finish
  (`SchemaValidationOutcome` with its `cause`, `ValueBranchOutcome`) — a break for a
  caller reading them as lists or booleans.'
