kind: Telo.Application
metadata:
  name: TextInputExclusivityTest
  version: 1.0.0
imports:
  Ai: ../
  AiEcho: ./__fixtures__/ai-echo.yaml
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testBothPromptAndMessagesRejected
  - !ref testNeitherPromptNorMessagesRejected
---
kind: AiEcho.EchoModel
metadata: { name: echo }
---
kind: Ai.Text
metadata: { name: c }
model: !ref echo
---
# Both prompt AND messages → throws.
kind: Run.Sequence
metadata:
  name: testBothPromptAndMessagesRejected
steps:
  - name: try
    try:
      - name: invoke
        inputs:
          prompt: "x"
          messages:
            - { role: user, content: "y" }
        invoke: !ref c
      - name: notReached
        inputs: { note: "should not get here" }
        invoke:
          kind: Assert.Schema
          schema: { type: object, properties: { note: { const: "UNREACHABLE" } }, required: [ note ] }
    catch:
      - name: assertCaught
        inputs:
          code: "${{ error.code }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_INVALID_INPUT }
            required: [ code ]
---
# Neither prompt NOR messages → throws.
kind: Run.Sequence
metadata:
  name: testNeitherPromptNorMessagesRejected
steps:
  - name: try
    try:
      - name: invoke
        inputs: {}
        invoke: !ref c
      - name: notReached
        inputs: { note: "should not get here" }
        invoke:
          kind: Assert.Schema
          schema: { type: object, properties: { note: { const: "UNREACHABLE" } }, required: [ note ] }
    catch:
      - name: assertCaught
        inputs:
          code: "${{ error.code }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_INVALID_INPUT }
            required: [ code ]
