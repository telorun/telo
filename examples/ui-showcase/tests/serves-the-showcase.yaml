  # Actions: a bare button; an answer drawn with values and a list; a failure
  # tree of an action's own and an answer its output model refuses; successes
  # moving the page and reading other content again; presses one after
  # another, enabled by the form and clearing their answer; and row actions —
  # plain, confirmed, prompting and enabled per row — on a table and a list.
  - name: verifyActions
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        kinds: !cel "steps.nodes.result.actions.map(c, c.type)"
        bare: !cel "cel.bind(a, steps.nodes.result.actions[2], [a.path, a.label.message[0], a.fields, a.onSuccess, 'result' in a, 'answer' in a])"
        estimate:
          fields: !cel "steps.nodes.result.actions[5].fields.map(f, [f.type, f.property, has(f.control) ? f.control : '-', f.group])"
          groups: !cel "steps.nodes.result.actions[5].groups.map(g, [g.name, g.label.message[0]])"
          state: !cel "steps.nodes.result.actions[5].state"
          answer: !cel "steps.nodes.result.actions[5].answer.required"
          result: !cel "steps.nodes.result.actions[5].result.children.map(c, c.type)"
          texts: !cel "steps.nodes.result.actions[5].result.children.filter(c, c.type == 'text').map(c, c.text.values)"
          value: !cel "[steps.nodes.result.actions[5].result.children[2].value, steps.nodes.result.actions[5].result.children[2].present]"
          list: !cel "cel.bind(l, steps.nodes.result.actions[5].result.children[3], [l.heading.message[0], l.rows, l.columns.map(c, [c.header.message[0], c.value.path[0], c.labels.size()])])"
        failure:
          assign: !cel "cel.bind(a, steps.nodes.result.actions[8], [a.path, a.label.message[0], a.fields.map(f, f.property), a.failure.style, a.failure.children.map(c, [c.type, 'shown' in c ? c.shown : null]), a.failure.children[0].text.values, a.result.text.values])"
          refused: !cel "cel.bind(a, steps.nodes.result.actions[10], [a.path, a.answer.required, a.result, a.failure.style, a.failure.children[0].text.values, a.failure.children[1].value])"
        navigate: !cel "steps.nodes.result.actions[13].children.map(a, [a.path, a.fields.map(f, f.type), a.onSuccess])"
        counts: !cel "[steps.nodes.result.actions[16].source, steps.nodes.result.actions[16].content.text.values.code]"
        move: !cel "cel.bind(a, steps.nodes.result.actions[17], [a.path, a.fields.map(f, f.property), a.onSuccess, a.result.children.map(c, c.type)])"
        comment: !cel "cel.bind(a, steps.nodes.result.actions[20], [a.path, a.concurrency, a.clearAnswerOn, a.enabled, a.onSuccess, a.result.text.values])"
        table:
          source: !cel "[steps.nodes.result.actions[23].basePath, steps.nodes.result.actions[23].filters, steps.nodes.result.actions[23].pageSize]"
          rowActions: !cel >-
            steps.nodes.result.actions[23].rowActions.map(r, [r.action.path, r.action.label.message[0], r.inputs,
              has(r.confirm) ? r.confirm.message[0] : '-', has(r.prompt) ? r.prompt.fields.map(f, f.property) : [],
              has(r.enabled) ? [r.enabled.matches, r.enabled.disabledText.message[0]] : [],
              r.action.result.text.message])
        list:
          source: !cel "steps.nodes.result.actions[26].source"
          rows: !cel "steps.nodes.result.actions[26].content.rows"
          rowActions: !cel >-
            steps.nodes.result.actions[26].content.rowActions.map(r, [r.action.path, r.action.label.message[0], r.inputs,
              has(r.confirm) ? r.confirm.message[0] : '-', has(r.prompt) ? r.prompt.fields.map(f, f.property) : [],
              has(r.enabled) ? [r.enabled.at, r.enabled.matches] : [], r.action.onSuccess])
        more: !cel >-
          steps.nodes.result.actions[29].children.map(a, [a.path, a.label.message[0], a.fields.map(f, [f.type, f.property]),
            a.onSuccess, 'answer' in a])
        mirrorResult: !cel "steps.nodes.result.actions[29].children[2].result.text.values"
        pause: !cel >-
          cel.bind(a, steps.nodes.result.actions[32], [a.path, a.fields.map(f, [f.type, f.property]), a.answer.required,
            a.onSuccess, a.failure.children.map(c, c.value)])
        loop: !cel "cel.bind(a, steps.nodes.result.actions[34], [a.path, 'answer' in a, a.failure.children.map(c, 'shown' in c ? c.shown.matches : null)])"
        byAddress:
          links: !cel "steps.nodes.result.actions[37].children.map(c, c.href)"
          query: !cel "steps.nodes.result.actions[38].query"
          filters: !cel "steps.nodes.result.actions[38].filters"
          rowActions: !cel >-
            steps.nodes.result.actions[38].rowActions.map(r, [r.action.path, r.action.label.message[0], r.inputs,
              r.confirm.message[0], r.prompt.fields, r.enabled])
        polish: !cel >-
          cel.bind(a, steps.polishActions.result.body.children[0].children, [
            a[0].text.message[0], a[5].label.message[0], a[23].rowActions[0].action.label.message[0],
            a[23].rowActions[1].confirm.message[0], a[26].content.rowActions[2].prompt.fields[0].label.message[0],
            a[29].children[0].label.message[0], a[34].failure.children[1].text.message[0],
            a[38].rowActions[0].confirm.message[0]])
      expected:
        kinds:
          [
            text, text, action, text, text, action, text, text, action, text, action, text, text, columns, text, text,
            data, action, text, text, action, text, text, listing, text, text, data, text, text, columns, text, text,
            action, text, action, text, text, columns, listing,
          ]
        bare: [ /api/unblock, Unblock TEL-42, [], { refreshes: [ /api/tasks, /api/task-counts ] }, false, false ]
        estimate:
          fields:
