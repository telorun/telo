kind: Telo.Application
metadata:
  name: ConsoleIoStarterArgumentTest
  version: 1.0.0
  description: >-
    Supplies the starter's name and greeting by name, as its command line would:
    it must greet without asking and go straight to the command prompt.
imports:
  App: ../../../../modules/app
  Channel: ../../../../modules/channel
  Run: ../../../../modules/run
  Assert: ../../../../modules/assert
targets:
  - !ref app
  - !ref test
---
kind: App.Instance
metadata: { name: app }
source: ../telo.yaml
variables:
  name: Grace
  greeting: Welcome
awaitStart: false
---
kind: Channel.ReadUntil
metadata: { name: read }
channel: !ref app
timeout: "10s"
---
kind: Channel.SendLine
metadata: { name: send }
channel: !ref app
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: greeting
    invoke: !ref read
    inputs: { until: "\n> " }
  - name: sendQuit
    invoke: !ref send
    inputs: { text: quit }
  - name: farewell
    invoke: !ref read
    inputs: { until: "\n" }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        greeting: !cel "steps.greeting.result.text"
        farewell: !cel "steps.farewell.result.text"
      expected:
        greeting: "Welcome, Grace! Type help for commands.\n> "
        farewell: "Goodbye, Grace.\n"
