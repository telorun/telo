kind: Telo.Application
metadata:
  name: UiShowcaseScreenTest
  version: 1.0.0
  description: >-
    Runs `examples/ui-showcase` and reads what each of its four mounts serves:
    the application documents — pages, the navigation tree with a group and a
    group inside it and an icon on every entry, look, control sets, brand tokens chosen
    by a cookie, the derived theme's typefaces, the Polish translation, the
    header with its language and theme menus and the brand switch, a language
    chosen by a cookie and marked whichever chose it — and
    the page documents: every node
    type, values presented by their schema, a list, style rules, texts and
    composites on the overview with its nodes evaluated per request and its
    error node; every condition keyword, missing against null, query
    parameters and an enabled button; readers with parameters, loading and
    failure trees, nesting, focus reloads and a sign-in gate; tables with
    derived and written columns, style rules, members behind references,
    filters from the query and fixed ones, and forms opening on every kind of
    surface; filter bars covering every placement, policy value, control,
    presets, pins, defaults and store; forms deriving and choosing every
    control, over option sources, a date range, groups and kept state; and
    actions with answer and failure trees, navigation to a page, a file, the
    web and nowhere, refreshes, serial presses, refusals, no answer, and row
    actions on a table and a list, one reading the table's query; components
    of the example's own on a page and in a cell, served with their
    stylesheet; a generated admin screen sharing a filter state key with the
    Filters page; and the themes page with its tokens, typefaces and, on `/`,
    the links between mounts and the brand switch. `/radix`, `/brand` and
    `/sidebar` place the very same views, `/sidebar` drawing its navigation in
    a sidebar that is a tab bar on a phone, its pages at full width. The routes these call are asserted by
    `answers-every-route.yaml`, `tables-and-filters.yaml`,
    `forms-and-actions.yaml` and `components-crud-themes.yaml`.
imports:
  App: ../../../modules/app
  Run: ../../../modules/run
  HttpClient: ../../../modules/http-client
  Assert: ../../../modules/assert
variables:
  # The DIRECTORY each run's database goes in, anchored at the working
  # directory: a value supplied to the app by name must already be an absolute
  # host path. Named after the key it feeds, since `telo check` reads
  # `variables` inside an App.Instance's own `variables:` map as that map.
  dbFile:
    env: UI_SHOWCASE_TEST_DIR
    type: string
    x-telo-type: Telo.HostPath
    default: ./.telo
targets:
  - !ref test
---
kind: HttpClient.Client
metadata: { name: browser }
baseUrl: http://127.0.0.1:8151
headers:
  user-agent: showcase-test
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    # A database of its own for each run, so runs never share state.
    variables:
      dbFile: !cel "variables.dbFile.joinPath('ui-showcase-screen-' + uuidv4() + '.db')"
    ports:
      http: 8151
targets:
  - !ref app
steps:
  - name: app
    invoke: { kind: HttpClient.Request, client: !ref browser, url: /_telo/ui/app }
  - name: polishApp
    invoke: { kind: HttpClient.Request, client: !ref browser, url: /_telo/ui/app }
    inputs:
      headers: { accept-language: "pl-PL, en;q=0.5" }
  - name: acmeApp
    invoke: { kind: HttpClient.Request, client: !ref browser, url: /_telo/ui/app }
    inputs:
      headers: { cookie: "theme=dark; showcase-brand=acme" }
  - name: cookiePolishApp
    invoke: { kind: HttpClient.Request, client: !ref browser, url: /_telo/ui/app }
    inputs:
      headers: { accept-language: en, cookie: "theme=dark; showcase-lang=pl" }
  - name: cookieEnglishApp
    invoke: { kind: HttpClient.Request, client: !ref browser, url: /_telo/ui/app }
    inputs:
      headers: { accept-language: pl, cookie: showcase-lang=en }
  - name: proxiedApp
    invoke: { kind: HttpClient.Request, client: !ref browser, url: /_telo/ui/app }
    inputs:
      headers: { x-forwarded-proto: "https,http" }
  - name: radixApp
    invoke: { kind: HttpClient.Request, client: !ref browser, url: /radix/_telo/ui/app }
  - name: radixPolishApp
    invoke: { kind: HttpClient.Request, client: !ref browser, url: /radix/_telo/ui/app }
    inputs:
      headers: { cookie: showcase-lang=pl }
  - name: brandApp
    invoke: { kind: HttpClient.Request, client: !ref browser, url: /brand/_telo/ui/app }
  - name: sidebarApp
    invoke: { kind: HttpClient.Request, client: !ref browser, url: /sidebar/_telo/ui/app }
  - name: brandThemeTokens
    invoke: { kind: HttpClient.Request, client: !ref browser, responseType: text }
    inputs:
      url: !cel "steps.brandApp.result.body.stylesheets[2]"
  - name: brandTokens
    invoke: { kind: HttpClient.Request, client: !ref browser, responseType: text }
    inputs:
      url: !cel "steps.brandApp.result.body.stylesheets[4]"

  - name: overview
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/" }
  - name: polishOverview
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/" }
    inputs:
      headers: { accept-language: pl }
  - name: acmeOverview
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/" }
    inputs:
      headers: { cookie: showcase-brand=acme }
  - name: conditions
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/conditions" }
  - name: data
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/data" }
  - name: tables
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/tables" }
  - name: polishTables
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/tables" }
    inputs:
      headers: { accept-language: pl }
  - name: filters
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/filters" }
  - name: polishFilters
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/filters" }
    inputs:
      headers: { accept-language: pl }
  - name: forms
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/forms" }
  - name: polishForms
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/forms" }
    inputs:
      headers: { accept-language: pl }
  - name: actions
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/actions" }
  - name: polishActions
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/actions" }
    inputs:
      headers: { accept-language: pl }
  - name: components
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/components" }
  - name: polishComponents
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/components" }
    inputs:
      headers: { accept-language: pl }
  - name: crud
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/crud" }
  - name: polishCrud
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/crud" }
    inputs:
      headers: { accept-language: pl }
  - name: themes
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/themes" }
  - name: polishThemes
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/themes" }
    inputs:
      headers: { accept-language: pl }
  - name: acmeThemes
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/_telo/ui/page?path=/themes" }
    inputs:
      headers: { cookie: showcase-brand=acme }
  - name: radixOverview
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/radix/_telo/ui/page?path=/" }
  - name: radixConditions
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/radix/_telo/ui/page?path=/conditions" }
  - name: radixData
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/radix/_telo/ui/page?path=/data" }
  - name: radixTables
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/radix/_telo/ui/page?path=/tables" }
  - name: radixFilters
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/radix/_telo/ui/page?path=/filters" }
  - name: radixForms
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/radix/_telo/ui/page?path=/forms" }
  - name: radixActions
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/radix/_telo/ui/page?path=/actions" }
  - name: radixComponents
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/radix/_telo/ui/page?path=/components" }
  - name: radixCrud
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/radix/_telo/ui/page?path=/crud" }
  - name: radixThemes
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/radix/_telo/ui/page?path=/themes" }
  - name: brandOverview
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/brand/_telo/ui/page?path=/" }
  - name: brandConditions
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/brand/_telo/ui/page?path=/conditions" }
  - name: brandData
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/brand/_telo/ui/page?path=/data" }
  - name: brandTables
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/brand/_telo/ui/page?path=/tables" }
  - name: brandFilters
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/brand/_telo/ui/page?path=/filters" }
  - name: brandForms
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/brand/_telo/ui/page?path=/forms" }
  - name: brandActions
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/brand/_telo/ui/page?path=/actions" }
  - name: brandComponents
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/brand/_telo/ui/page?path=/components" }
  - name: brandCrud
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/brand/_telo/ui/page?path=/crud" }
  - name: brandThemes
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/brand/_telo/ui/page?path=/themes" }
  - name: sidebarOverview
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/sidebar/_telo/ui/page?path=/" }
  - name: sidebarThemes
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/sidebar/_telo/ui/page?path=/themes" }
  - name: sidebarData
    invoke: { kind: HttpClient.Request, client: !ref browser, url: "/sidebar/_telo/ui/page?path=/data" }

  # The components' module and their stylesheet, as the page loads them.
  - name: componentModule
    invoke: { kind: HttpClient.Request, client: !ref browser, responseType: text }
    inputs:
      url: !cel >-
        cel.bind(c, steps.components.result.body.children[0].children[2], '/_telo/ui/assets/' + c.module.digest + '/' + c.module.name)
  - name: componentStylesheet
    invoke: { kind: HttpClient.Request, client: !ref browser, responseType: text }
    inputs:
      url: !cel >-
        cel.bind(c, steps.components.result.body.children[0].children[2],
          '/_telo/ui/assets/' + c.stylesheets[0].digest + '/' + c.stylesheets[0].name)

  # The nodes the checks below read, by name.
  - name: nodes
    value:
      overview: !cel "steps.overview.result.body.children[0].children"
      record: !cel "steps.overview.result.body.children[0].children[13].content.children"
      perRequest: !cel "steps.overview.result.body.children[1].children"
      polishPerRequest: !cel "steps.polishOverview.result.body.children[1].children"
      acmePerRequest: !cel "steps.acmeOverview.result.body.children[1].children"
      reader: !cel "steps.conditions.result.body.children[0].children[0]"
      enablement: !cel "steps.conditions.result.body.children[0].children[3]"
      data: !cel "steps.data.result.body.children[0].children"
      tables: !cel "steps.tables.result.body.children[0].children"
      filters: !cel "steps.filters.result.body.children[0].children"
      forms: !cel "steps.forms.result.body.children[0].children"
      actions: !cel "steps.actions.result.body.children[0].children"
      components: !cel "steps.components.result.body.children[0].children"
      crud: !cel "steps.crud.result.body.children[0].children"
      themes: !cel "steps.themes.result.body.children[0].children"

  # Four mounts of one design: the same pages, under the built-in look with
  # the example's stylesheet, under Radix, under a theme of the example's own
  # with Radix's controls, and under the built-in look with the navigation in a
  # sidebar — its rail and store, and a tab bar of four tabs on a phone — every
  # entry's icon served under each mount. Every
  # mount reads a cookie for its language, and `/` also for its brand.
  - name: verifyApps
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        title: !cel "steps.app.result.body.title"
        lang: !cel "steps.app.result.body.lang"
        pages: !cel "steps.app.result.body.pages.map(p, [p.path, p.title.message[0]])"
        compactBelow: !cel "[steps.app, steps.radixApp, steps.brandApp, steps.sidebarApp].map(a, a.result.body.compactBelow)"
        samePages: !cel "[steps.radixApp, steps.brandApp, steps.sidebarApp].all(a, a.result.body.pages == steps.app.result.body.pages)"
        # Each mount's tree, each entry with the file its icon is served as.
        navigation: !cel >-
          [steps.app, steps.radixApp, steps.brandApp, steps.sidebarApp].map(a, a.result.body.navigation.items.map(e, e.type == 'group'
            ? [e.text.message[0], e.icon.substring(e.icon.lastIndexOf('/') + 1), e.items.map(i, i.type == 'group'
              ? [i.text.message[0], i.icon.substring(i.icon.lastIndexOf('/') + 1), i.items.map(j, [j.path, j.icon.substring(j.icon.lastIndexOf('/') + 1)])]
              : [i.path, i.icon.substring(i.icon.lastIndexOf('/') + 1)])]
            : [e.path, e.icon.substring(e.icon.lastIndexOf('/') + 1)]))
        placement: !cel "steps.app.result.body.navigation.placement"
        sameNavigation: !cel >-
          steps.radixApp.result.body.navigation.placement == steps.app.result.body.navigation.placement
            && steps.brandApp.result.body.navigation.placement == steps.app.result.body.navigation.placement
        sidebarPlacement: !cel "steps.sidebarApp.result.body.navigation.placement"
        titles: !cel "[steps.radixApp, steps.brandApp, steps.sidebarApp].map(a, a.result.body.title.message[0])"
        stylesheets: !cel >-
          [steps.app.result.body, steps.acmeApp.result.body, steps.radixApp.result.body, steps.brandApp.result.body, steps.sidebarApp.result.body]
            .map(a, a.stylesheets.map(s, s.substring(s.lastIndexOf('/') + 1)))
        sets: !cel "[steps.app.result.body, steps.radixApp.result.body, steps.brandApp.result.body, steps.sidebarApp.result.body].map(a, a.controls.sets.map(s, s.exports))"
        vary: !cel "[steps.app, steps.radixApp, steps.brandApp, steps.sidebarApp].map(a, a.result.headers['vary'])"
      expected:
        title: { lang: en, message: [ UI showcase ] }
        lang: en
        pages:
          - [ /, Overview ]
          - [ /conditions, Conditions ]
          - [ /data, Data ]
          - [ /tables, Tables ]
          - [ /filters, Filters ]
          - [ /forms, Forms ]
          - [ /actions, Actions ]
          - [ /components, Components ]
          - [ /crud, CRUD ]
          - [ /records, Related records ]
          - [ /themes, Themes ]
        compactBelow: [ 48rem, 48rem, 48rem, 48rem ]
        samePages: true
        navigation:
          - &tree
            - [ /, mark.svg ]
            - - Building blocks
              - blocks.svg
              - - [ /conditions, split.svg ]
                - [ /data, database.svg ]
                - [ /tables, table.svg ]
                - [ /filters, funnel.svg ]
                - [ Input, text-cursor-input.svg, [ [ /forms, clipboard-list.svg ], [ /actions, zap.svg ] ] ]
            - [ /components, puzzle.svg ]
            - [ /crud, list-checks.svg ]
            - [ /records, network.svg ]
            - [ /themes, palette.svg ]
          - *tree
          - *tree
          - *tree
        placement:
          type: header
          compact:
            type: overlay
            surface: { type: drawer, side: start, size: medium, modal: true, dismiss: { escape: true, outside: true, closeButton: true } }
        sameNavigation: true
        sidebarPlacement:
          type: sidebar
          side: start
          rail: { collapsed: false }
          store: { type: local }
          compact:
            type: tab-bar
            visible: 4
            surface: { type: drawer, side: bottom, size: medium, modal: true, dismiss: { escape: true, outside: true, closeButton: true } }
        titles: [ UI showcase — Radix, UI showcase — brand, UI showcase — sidebar ]
        stylesheets:
          - [ renderer.css, default-theme.css, showcase.css ]
          - [ renderer.css, default-theme.css, tokens.css, showcase.css ]
          - [ renderer.css, ui-react-radix.css, theme-tokens.css, radix-theme.css ]
          - [ renderer.css, ui-react-radix.css, theme-tokens.css, brand.css, tokens.css ]
          - [ renderer.css, default-theme.css, showcase.css ]
        sets:
          - []
          - &radixControls [ [ Select, MultiSelect, Listbox, Checkbox, Dialog, Drawer, Popover, Confirmation, Menu, Tooltip, Navigation, Tabs, Icon ] ]
          - *radixControls
          - []
        vary:
          - &vary "Accept-Language, Cookie, Host, X-Forwarded-Proto"
          - *vary
          - *vary
          - *vary

  # The header every application draws on every page: the mark, then two
  # menus — Language, the language in effect marked, and Theme, the four
  # mounts' home pages, another mount's by an absolute address, this mount
  # marked. The root's Theme menu adds the brand switch, each item delivered
  # only while it changes something.
  - name: verifyHeader
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        start: !cel "steps.app.result.body.header.start"
        end: !cel >-
          steps.app.result.body.header.end.map(n, [n.type, n.text.message[0],
            n.items.map(i, [i.text.message[0], i.href, has(i.style) ? i.style : null])])
        acmeTheme: !cel "steps.acmeApp.result.body.header.end[1].items.map(i, i.text.message[0])"
        radixStart: !cel "steps.radixApp.result.body.header.start == steps.app.result.body.header.start"
        radixEnd: !cel >-
          steps.radixApp.result.body.header.end.map(n, [n.text.message[0],
            n.items.map(i, [i.text.message[0], i.href, has(i.style) ? i.style : null])])
        brandEnd: !cel >-
          steps.brandApp.result.body.header.end.map(n, [n.text.message[0],
            n.items.map(i, [i.text.message[0], i.href, has(i.style) ? i.style : null])])
        sidebarEnd: !cel >-
          steps.sidebarApp.result.body.header.end.map(n, [n.text.message[0],
            n.items.map(i, [i.text.message[0], i.href, has(i.style) ? i.style : null])])
        # Behind a proxy chain the first scheme X-Forwarded-Proto lists is the
        # client's.
        proxiedTheme: !cel "steps.proxiedApp.result.body.header.end[1].items.map(i, i.href)"
      expected:
        start: [ { type: image, src: /files/mark.svg, alt: { lang: en, message: [ UI showcase logo ] } } ]
        end:
          - - menu
            - Language
            - &languages
              - [ English, "/api/lang?set=en", [ strong ] ]
              - [ Deutsch, "/api/lang?set=de", [] ]
              - [ Español, "/api/lang?set=es", [] ]
              - [ Français, "/api/lang?set=fr", [] ]
              - [ Italiano, "/api/lang?set=it", [] ]
              - [ Nederlands, "/api/lang?set=nl", [] ]
              - [ Polski, "/api/lang?set=pl", [] ]
              - [ Português, "/api/lang?set=pt", [] ]
              - [ Türkçe, "/api/lang?set=tr", [] ]
              - [ Русский, "/api/lang?set=ru", [] ]
              - [ Українська, "/api/lang?set=uk", [] ]
              - [ हिन्दी, "/api/lang?set=hi", [] ]
              - [ 日本語, "/api/lang?set=ja", [] ]
              - [ 한국어, "/api/lang?set=ko", [] ]
              - [ 中文, "/api/lang?set=zh", [] ]
          - - menu
            - Theme
            - - [ Default, /, strong ]
              - [ Radix, "http://127.0.0.1:8151/radix/", null ]
              - [ Brand, "http://127.0.0.1:8151/brand/", null ]
              - [ Sidebar, "http://127.0.0.1:8151/sidebar/", null ]
              - [ Use the Acme brand, "/api/brand?set=acme", null ]
        acmeTheme: [ Default, Radix, Brand, Sidebar, "Use the theme's own values" ]
        radixStart: true
        radixEnd:
          - [ Language, *languages ]
          - - Theme
            - - [ Default, "http://127.0.0.1:8151/", null ]
              - [ Radix, /, strong ]
              - [ Brand, "http://127.0.0.1:8151/brand/", null ]
              - [ Sidebar, "http://127.0.0.1:8151/sidebar/", null ]
        brandEnd:
          - [ Language, *languages ]
          - - Theme
            - - [ Default, "http://127.0.0.1:8151/", null ]
              - [ Radix, "http://127.0.0.1:8151/radix/", null ]
              - [ Brand, /, strong ]
              - [ Sidebar, "http://127.0.0.1:8151/sidebar/", null ]
        sidebarEnd:
          - [ Language, *languages ]
          - - Theme
            - - [ Default, "http://127.0.0.1:8151/", null ]
              - [ Radix, "http://127.0.0.1:8151/radix/", null ]
              - [ Brand, "http://127.0.0.1:8151/brand/", null ]
              - [ Sidebar, /, strong ]
        proxiedTheme: [ /, "https://127.0.0.1:8151/radix/", "https://127.0.0.1:8151/brand/", "https://127.0.0.1:8151/sidebar/", "/api/brand?set=acme" ]

  # The language in effect is the `showcase-lang` cookie's, read before the
  # Accept-Language header, under every mount; the Language menu marks it
  # whichever decided it, and English with neither.
  - name: verifyLanguageCookie
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        polish:
          lang: !cel "steps.cookiePolishApp.result.body.lang"
          pages: !cel "steps.cookiePolishApp.result.body.pages.map(p, p.title.message[0])"
          logo: !cel "steps.cookiePolishApp.result.body.header.start[0].alt"
          menus: !cel "steps.cookiePolishApp.result.body.header.end.map(n, n.text.message[0])"
        english:
          lang: !cel "steps.cookieEnglishApp.result.body.lang"
          title: !cel "steps.cookieEnglishApp.result.body.title"
        radix:
          lang: !cel "steps.radixPolishApp.result.body.lang"
          title: !cel "steps.radixPolishApp.result.body.title"
        marked: !cel >-
          [steps.app, steps.polishApp, steps.cookiePolishApp, steps.cookieEnglishApp, steps.radixPolishApp]
            .map(a, a.result.body.header.end[0].items.filter(i, size(i.style) > 0).map(i, i.text.message[0]))
      expected:
        polish:
          lang: pl
          pages: [ Przegląd, Warunki, Dane, Tabele, Filtry, Formularze, Akcje, Komponenty, CRUD, Powiązane rekordy, Motywy ]
          logo: { lang: pl, message: [ Logo pokazu interfejsu ] }
          menus: [ Język, Motyw ]
        english:
          lang: en
          title: { lang: en, message: [ UI showcase ] }
        radix:
          lang: pl
          title: { lang: pl, message: [ Pokaz interfejsu — Radix ] }
        # No header, Accept-Language Polish, the cookie Polish over English,
        # the cookie English over Polish, the cookie Polish under /radix.
        marked: [ [ English ], [ Polski ], [ Polski ], [ English ], [ Polski ] ]

