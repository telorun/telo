units:
  kernel: Added
body: 'A load is refused with `ERR_SCHEMA_NESTING_EXCEEDED` where a value nests deeper
  than 100 levels, counted as `telo check` counts it: an application whose `telo check`
  reports `SCHEMA_NESTING_EXCEEDED`, an import loading a library with a reference slot
  value too deep, an import supplied a value too deep, and a resource too deep when it
  is created, each naming `<Kind>/<name>` and the place. A contract value too deep is
  refused as `ERR_INPUT_INVALID` / `ERR_OUTPUT_INVALID` saying so. Before, the run
  stopped with an uncoded stack overflow or `ERR_RESOURCE_SCHEMA_VALIDATION_FAILED`
  quoting "Maximum call stack size exceeded"; an application default that could not be
  validated was refused as `ERR_MANIFEST_VALIDATION_FAILED`.'
