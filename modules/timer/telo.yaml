kind: Telo.Library
metadata:
  name: Timer
  version: 0.8.3
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Scheduling]
  description: |
    Waiting as a first-class step: pause for a duration before continuing, anywhere a
    call fits — between pipeline steps, in a retry backoff, in a handler. A pending
    wait is abandoned when the work around it is cancelled, so a disconnected client
    or an elapsed deadline does not hold it open.
exports:
  kinds:
    - Delay
---
# Delay: wait `duration`, then complete. Optionally echoes a `value` through
# unchanged so it composes mid-pipeline (delay-then-forward). The wait is
# cancellation-aware — if the invocation is cancelled while waiting, the timer
# is cleared and the call fails with ERR_INVOKE_CANCELLED.
kind: Telo.Definition
metadata:
  name: Delay
  description: >-
    Waits for a given duration and then completes, optionally passing a value straight
    through so it can sit mid-pipeline. Cancelling the surrounding work clears the
    wait instead of leaving it pending.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/timer.mjs&local_path=./nodejs/src/index.ts#Delay
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    examples:
      - duration: "250ms"
      - duration: "2s"
        value: { any: thing }
    properties:
      duration:
        type: string
        pattern: "^\\s*\\d+(\\.\\d+)?\\s*(ms|s|m|h)\\s*$"
        description: How long to wait before completing, e.g. "250ms", "2s", "1.5m", "1h".
      value:
        description: Optional value echoed back unchanged after the delay (pipeline passthrough).
    required: [ duration ]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      value:
        description: The input `value`, returned once the delay elapses (null when omitted).
    required: [ value ]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
