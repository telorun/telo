# The showcase's data: one SQLite database holding a small studio — its team
# record, its people, its projects with their members, tags and tasks, and the
# sessions the sign-in gate opens. Every table declares the rows it starts with
# (`seeds`), so each page is populated on a fresh database; a row edited
# through the screens stays edited, and a seeded column is restored on the next
# start. Every collection a screen lists is one `Crud.Collection` served by one
# `Crud.Api`, so its list pages, sorts, filters and writes for real.
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.dbFile"
---
kind: SQLite.Schema
metadata: { name: migrate }
connection: !ref db
tables:
  - !ref teamTable
  - !ref peopleTable
  - !ref projectsTable
  - !ref projectMembersTable
  - !ref projectTagsTable
  - !ref tasksTable
  - !ref requestsTable
  - !ref bookingsTable
  - !ref commentsTable
  - !ref sessionsTable
  - !ref authorsTable
  - !ref postsTable
  - !ref employeesTable
---
# The studio itself: one row, read by the overview.
kind: SQLite.Table
metadata: { name: teamTable }
table: team
columns:
  id: { type: integer, primaryKey: true, identity: always }
  name: { type: text, nullable: false, unique: true }
  homepage: { type: text, nullable: false }
  guide: { type: text, nullable: false }
  handbook: { type: text, nullable: false }
  contact: { type: text, nullable: false }
  mirror: { type: text, nullable: false }
  founded_on: { type: text, nullable: false }
  updated_at: { type: text, nullable: false }
  hiring: { type: integer, nullable: false, default: 0 }
  plan: { type: text, nullable: false }
seeds:
  key: [ name ]
  rows:
    - name: Northwind Studio
      homepage: https://telo.run
      guide: /data
      handbook: /files/handbook.txt
      contact: mailto:hello@northwind.example
      # An address a browser would read as another host: a value presented as
      # a link refuses it and shows it as text.
      mirror: //mirror.northwind.example/handbook
      founded_on: "2019-05-14"
      updated_at: "2026-10-21T09:30:00Z"
      hiring: 1
      plan: team
---
