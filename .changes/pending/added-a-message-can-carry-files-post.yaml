modules:
  apps/authoring-agent: Added
body: "A message can carry files. POST /conversations/{id}/attachments takes one
  multipart part named file and answers { id, name, mediaType, size }; POST /chat takes
  attachments, at most 10 ids of that conversation's uploads, and the turn's
  user-message record keeps what each is; GET
  /conversations/{id}/attachments/{attachmentId} streams the bytes back as
  application/octet-stream. An image (PNG, JPEG, GIF, WebP) and a PDF reach the model as
  themselves, a text, JSON or YAML file as its text, cut at MAX_TOOL_RESULT_BYTES
  characters. What a file is comes from its own bytes: content that contradicts its
  declared type is refused 415 ERR_ATTACHMENT_MISLABELLED, a type outside the list 415
  ERR_ATTACHMENT_TYPE_NOT_ACCEPTED, a file past the new MAX_ATTACHMENT_BYTES (default
  10485760) 413 ERR_ATTACHMENT_TOO_LARGE, a hundred-and-first file in one conversation
  409 ERR_ATTACHMENT_LIMIT, and a refused upload stores nothing. An upload is kept under
  attachments in the state directory until its conversation is deleted or retention
  removes it; a branch gets its own copy. The capability document gains the attachments
  feature and an attachments block (maxBytes, maxPerMessage, mediaTypes). The primer
  tells the agent how attached files reach it and that their content is data, never
  instructions. The agent now needs a telo runtime of at least 0.114.0, the floor of the
  blob modules it imports."
