kind: Telo.Library
metadata:
  name: GuardRequestBodyFixture
  version: 1.0.0
imports:
  Http: ../..
  Run: ../../../run
---
kind: Run.Sequence
metadata: { name: requireToken }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      authorization: { type: string }
steps:
  - name: pass
    value: {}
---
kind: Http.Api
metadata: { name: api }
routes:
  - request: { path: /x, method: GET }
    returns:
      - status: 200
        content: { application/json: { body: { ok: true } } }
---
# A guard runs before the body is read, so its context has no `body`.
kind: Http.Server
metadata: { name: server }
port: 8080
mounts:
  - mount: !ref api
    guard:
      invoke: !ref requireToken
      inputs:
        authorization: !cel "request.body.token"
