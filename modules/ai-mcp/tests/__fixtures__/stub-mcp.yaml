kind: Telo.Library
metadata:
  name: StubMcp
  version: 0.3.1
  description: Test-only Mcp.Client stub for ai-mcp discovery/dispatch tests.
imports:
  # Resolves to @telorun/mcp-client so `extends: Mcp.Client` has the alias in scope.
  # From this fixture file: ../../../mcp-client = modules/mcp-client.
  Mcp: ../../../mcp-client
exports:
  kinds:
    - StubClient
---
kind: Telo.Definition
metadata:
  name: StubClient
capability: Telo.Invocable
extends: Mcp.Client
controllers:
  - pkg:telo/local/js?path=../../nodejs/stub-mcp-client-controller.mjs&local_path=../../nodejs/src/stub-mcp-client-controller.ts
schema:
  type: object
  additionalProperties: false
