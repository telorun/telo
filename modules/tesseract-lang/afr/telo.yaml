  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/afr.traineddata.gz:
        { upstream: afr, member: package/4.0.0_best_int/afr.traineddata.gz, sha256: a2a9ec1631e4d1a80f89518bd60c680464d3b87afa1483178859c1af19fdc9df, executable: false }
---
kind: TesseractModel.Language
metadata:
