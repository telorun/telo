modules:
  modules/run: Fixed
body: "Run.Iteration's and Run.Projection's collection and Run.Loop's per-turn condition are journaled inside
  a durable run, so a resume walks the elements the run walked and stops at the turn it
  stopped at. Both are evaluated by the composer before the step engine sees a step
  list, so neither was recorded: a collection re-derived on a resume left index N naming
  a different element while the journal answered for the element that used to be there,
  with nothing to detect."
