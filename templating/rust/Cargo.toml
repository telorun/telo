[package]
name = "telo-templating"
version = "0.126.0"
license = "MIT"
edition = "2021"
publish = false
description = "Telo templating — YAML tag sentinels shared by the manifest loader and the future CEL engine."

[dependencies]
# Written order is part of what a manifest says (a tag's keys, a `...`
# splice's place, emitted map order), and it is what the Node loader keeps.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
