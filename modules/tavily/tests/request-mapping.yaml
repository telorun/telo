# What the engine sends: `POST /search` with the query, the fixed choices
# (general topic, basic depth, publication dates on, no answer, no raw content),
# `max_results` covering the slice plus one probe result up to Tavily's 20, the
# configured safe-search flag, the language as its two-letter primary subtag, the
# country as Tavily's country name and the recency hint as `time_range`. A hint
# Tavily has no form for is left out. The mock echoes the body as the title.
kind: Telo.Application
metadata: { name: TavilyRequestMappingTest, version: 1.0.0 }
imports:
  Run: ../../run
  Tavily: ..
  Http: ../../http-client
  Server: ../../http-server
  Assert: ../../assert
targets:
  - !ref requestMapping
---
kind: Http.Request
metadata: { name: request }
client: { kind: Http.Client, baseUrl: "http://127.0.0.1:18858" }
---
kind: Tavily.WebSearchEngine
metadata: { name: safe }
request: !ref request
safeSearch: true
---
kind: Tavily.WebSearchEngine
metadata: { name: unfiltered }
request: !ref request
---
kind: Run.Value
metadata: { name: echo }
value: {}
---
kind: Telo.Sequence
metadata: { name: requestMapping }
with:
  - kind: Server.Api
    metadata: { name: fakeTavily }
    routes:
      - request:
          path: /search
          method: POST
          schema: { body: { type: object, additionalProperties: true } }
        handler: !ref echo
        returns:
          - status: 200
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body:
                  results:
                    - title: !cel "json(request.body)"
                      url: https://echo.example/
                      content: echo
  - kind: Server.Server
    metadata: { name: fakeServer }
    listen: { port: 18858 }
    mounts:
      - path: /
        mount: !ref fakeTavily
targets:
  - !ref fakeServer
steps:
  - name: allHints
    invoke: !ref safe
    inputs: { query: rust async, count: 5, language: pt-BR, country: FI, freshness: month }
  # A three-letter language and a country Tavily has no name for are left out;
  # without `count`, the whole window is requested.
  - name: unmapped
    invoke: !ref unfiltered
    inputs: { query: rust async, language: fil, country: HK }
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        - !cel "parseJson(steps.allHints.result.results[0].title)"
        - !cel "parseJson(steps.unmapped.result.results[0].title)"
      expected:
        - query: rust async
          topic: general
          search_depth: basic
          include_published_date: true
          include_answer: false
          include_raw_content: false
          max_results: 6
          safe_search: true
          language: pt
          country: finland
          time_range: month
        - query: rust async
          topic: general
          search_depth: basic
          include_published_date: true
          include_answer: false
          include_raw_content: false
          max_results: 20
          safe_search: false
