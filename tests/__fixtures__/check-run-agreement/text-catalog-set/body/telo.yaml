# The library's template body translates one text twice; its own check is silent
# here, so the kernel's refusal, raised when the template creates the set, is
# pinned.
kind: Telo.Application
metadata:
  name: CatalogSetBodyApp
  version: 1.0.0
imports:
  Lib: ./lib
---
kind: Lib.Translations
metadata: { name: translations }
