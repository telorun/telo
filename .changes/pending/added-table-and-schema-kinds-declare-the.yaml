  modules/sqlite: Added
body: "Table and Schema kinds: declare the table, not the DDL. The boot pass creates
  what is absent, applies imperative migrations before and after it, and records a
  removal instead of executing it — a tombstoned object is dropped only once the
  declared number of released versions and the declared time have passed, so the version
  still running keeps reading it. A change that cannot be applied safely to existing
  data fails hard naming the table, column and reason. Each type vocabulary is the
  engine's own, and projects to JSON Schema so consumers can type the rows they read."
