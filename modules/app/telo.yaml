kind: Telo.Library
metadata:
  name: App
  version: 0.5.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Compute]
  description: >-
    Runs another application as a resource of this one: supervise several applications
    from a single manifest, or stand one up for the length of a test and call it over
    the network. The child's own variables, secrets, ports and needs — its storage
    among them — are supplied by name and validated by the child; its exit code is
    reported as observed state, and it is shut down cleanly when the scope that
    declared it ends.
requires:
  # Controllers return their effects from `init()` / `run()`; a runtime that does
  # not execute a returned chain allocates nothing and undoes nothing.
  #
  # The floor is what keeps a child's inputs from being silently dropped: an
  # older runtime's child-manifest seam took an environment map alone, so the
  # `variables:` / `secrets:` / `ports:` supplied here would reach the child as
  # nothing at all and it would boot on its defaults — a wrong port, a wrong
  # identity, and no error anywhere. The same release carries the rest of what
  # this module stands on: a start that resolves once the child is listening, and
  # the child's input and output reachable as a text channel.
  #
  # 0.93.0 carried them. `needs:` rests on the same seam: before 0.123.0 a
  # child's needs could not be supplied by name, so a `needs:` entry here would
  # reach the child as nothing and it would read its needs from its own
  # environment instead. 0.123.0 is the release that will carry it —
  # forward-declared, because 0.122.0 is the newest published one.
  telo: ">=0.123.0"
imports: { Channel: ../channel }
exports: { kinds: [Instance] }
---
# App.Instance — another application, running as a resource of this one.
#
# An application cannot be imported: it is a root, run directly. So the way to
# reach one from a test, or to run several as one, is to RUN it — which is what
# this kind declares. What crosses the boundary is the child's declared input
# contract and its exit code; nothing else, because nothing else is the child's
# public surface.
kind: Telo.Definition
metadata:
  name: Instance
  description: >-
    Starts the application at the given location when this resource runs, and shuts it
    down when the scope holding it ends. Values for the child's declared variables,
    secrets, ports and needs are supplied by name and validated against its own declarations.
    The application stays up while a child runs; once a child exits, its exit code is
    reported and it stops holding.
capability: Telo.Service
# A running child is something you can hold a conversation with, and that
# vocabulary belongs to every program reachable as text — a shell session, a
# remote host — not to applications. Extending the abstract is what lets one
# `Channel.ReadUntil` step work against any of them.
extends: Channel.Text
controllers: [pkg:telo/local/js?path=./nodejs/app.mjs&local_path=./nodejs/src/index.ts#Instance]
status:
  type: object
  properties:
    exitCode:
      title: Exit code
      description: >-
        The code the child exited with, or null while it is still running. A child that
        is still up when its scope ends is stopped rather than observed, so the value
        read after teardown is the code its shutdown produced.
      type: [integer, "null"]
schema:
  type: object
  required: [source]
  additionalProperties: false
  properties:
    source:
      title: Source
      description: >-
        Where the child application's manifest is: a path relative to the module
        declaring this resource, or a published module reference. Always a literal —
        a location computed at run time cannot be resolved, pinned or checked before
        the application starts. `telo check` follows it: a source that does not
        resolve or is not an application is refused here, and every name under
        `variables`, `secrets`, `ports` and `needs` is held to what the child
        declares before anything runs.
      type: string
      x-telo-application-source:
        variables: /variables
        secrets: /secrets
        ports: /ports
        needs: /needs
    variables:
      title: Variables
      description: >-
        Values for the child's declared `variables:`, keyed by the name the child
        declares — not by the environment variable it binds. A name the child does not
        declare is refused; one left out falls back to the child's own default.
      type: object
      additionalProperties: true
      x-telo-eval: compile
    secrets:
      title: Secrets
      description: Values for the child's declared `secrets:`, supplied like `variables`.
      type: object
      additionalProperties: true
      x-telo-eval: compile
    awaitStart:
      title: Await start
      description: >-
        Whether starting this resource waits for the child's own `targets:` to be
        dispatched — so a server it declares is already listening and the next
        step needs no retry. Default true. An application that BLOCKS ON INPUT
        never finishes dispatching its targets, so a conversation declares
        `false` and orders itself on what it reads instead.
      type: boolean
      default: true
      x-telo-eval: compile
    ports:
      title: Ports
      description: >-
        Ports for the child's declared `ports:`, keyed by the child's own port name.
        This is where a second copy of the same application is given a port of its
        own.
      type: object
      additionalProperties: { type: integer, x-telo-type: Telo.TcpPort }
      x-telo-eval: compile
    needs:
      title: Needs
      description: >-
        Fulfilments of the child's own `needs:`, keyed by the child's need name —
        each a `!ref` to a need or fulfilment of this module, handed over whole, or a
        map of the need type's fields. A need supplied here is answered before the
        child's environment and host values; the fields are validated against the
        child's need type, a required one left out is refused, and a name the child
        does not declare is refused.
      type: object
      additionalProperties:
        anyOf:
          - title: Forwarded
            description: A need or fulfilment of this module, handed to the child whole.
            x-telo-ref: { kind: Telo.Provider, use: dependency }
          - title: Fields
            description: The fields of the child's need type, by name.
            type: object
      x-telo-eval: compile
