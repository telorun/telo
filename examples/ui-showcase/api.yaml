# The routes crud does not give, over the same database: the records the
# readers show, the operations the buttons run, the session the sign-in gate
# reads, and the language and brand switches. Each speaks the contract its
# screen reads — the record contract for a reader, the action contract for a
# button.
#
# Three cookies carry state between requests: `showcase-session`, the token of
# a row in `sessions` that signing in writes and signing out deletes,
# `showcase-lang`, which every application's `lang` reads before the
# Accept-Language header, and `showcase-brand`, which picks the brand tokens of
# the `/` application.

# ---- Shapes the routes answer and the screens read ----
# The studio, as the overview reads it: one value of each shape a `value` node
# presents its own way, and the projects still running.
kind: Telo.JsonSchema
metadata:
  name: Team
schema:
  type: object
  required: [ name, homepage, guide, handbook, contact, mirror, foundedOn, updatedAt, hiring, plan, projectCount, latestProject, projects ]
  properties:
    name: { type: string, title: Team }
    homepage: { type: string, title: Homepage, format: uri }
    guide: { type: string, title: Guide, format: uri-reference }
    handbook: { type: string, title: Handbook, format: uri-reference }
    contact: { type: string, title: Contact, format: uri }
    mirror: { type: string, title: Mirror, format: uri-reference }
    foundedOn: { type: string, title: Founded, format: date }
    updatedAt: { type: string, title: Updated, format: date-time }
    hiring: { type: boolean, title: Hiring }
    plan:
      type: string
      title: Plan
      x-telo-text-context: subscription
      enum: [ free, team, enterprise ]
      oneOf:
        - { const: free, title: Free, x-telo-text-context: subscription }
        - { const: team, title: Team, x-telo-text-context: subscription }
        - { const: enterprise, title: Enterprise, x-telo-text-context: subscription }
    projectCount: { type: integer, title: Projects }
    latestProject: { type: string, title: Latest project }
    # Each a project as the projects collection reads it, members inherited
    # along `extends` included.
    projects: { type: array, items: !ref Project }
---
# One project as the conditions and data pages read it. `note` is null when the
# project has none; `codename` is left out when it has none.
kind: Telo.JsonSchema
metadata:
  name: ProjectSummary
schema:
  type: object
  required: [ code, name, status, memberCount, velocity, tags, note, lead ]
  properties:
    code: { type: string, title: Code }
    name: { type: string, title: Name }
    status: { type: string, enum: [ active, paused, done ] }
    memberCount: { type: integer, title: Members }
    velocity: { type: number, title: Velocity }
    tags: { type: array, items: { type: string } }
    note: { type: [ string, "null" ] }
    codename: { type: string }
    lead:
      type: object
      required: [ name, email, role ]
      properties:
        name: { type: string }
        email: { type: string }
        role: { type: string }
---
kind: Telo.JsonSchema
metadata:
  name: ProjectPeople
schema:
  type: object
  required: [ people ]
  properties:
    people:
      type: array
      items:
        type: object
        required: [ name, email, role ]
        properties:
          name: { type: string, title: Name }
          email: { type: string, title: E-mail }
          role: { type: string, title: Role }
---
# A tag added to the featured project. The route restates it as its body.
kind: Telo.JsonSchema
metadata:
  name: NewTag
schema:
  type: object
  additionalProperties: false
  required: [ tag ]
  properties:
    tag: { type: string, title: Tag, pattern: "^[a-z][a-z0-9-]*$", maxLength: 20 }
---
kind: Telo.JsonSchema
metadata:
  name: TagAnswer
schema:
  type: object
  required: [ tag, count ]
  properties:
    tag: { type: string }
    count: { type: integer }
---
kind: Telo.JsonSchema
metadata:
  name: Clock
schema:
  type: object
  required: [ readAt ]
  properties:
    readAt: { type: string, title: Read at, format: date-time }
---
kind: Telo.JsonSchema
metadata:
  name: Session
schema:
  type: object
  required: [ signedIn ]
  properties:
    signedIn: { type: boolean }
---
# Who signs in: a member of the team, by e-mail.
kind: Telo.JsonSchema
metadata:
  name: SignIn
schema:
  type: object
  additionalProperties: false
  required: [ email ]
  properties:
    email: { type: string, title: E-mail, minLength: 3, default: ada@northwind.example }
---
kind: Telo.JsonSchema
metadata:
  name: Account
schema:
  type: object
  required: [ name, email, memberSince ]
  properties:
    name: { type: string, title: Name }
    email: { type: string, title: E-mail }
    memberSince: { type: string, title: Member since, format: date }
---
# Who a task is assigned to, as the task board nests it.
kind: Telo.JsonSchema
metadata:
  name: Member
schema:
  type: object
  required: [ name, contact ]
  properties:
    name: { type: string, title: Assignee }
    contact: { type: string, title: Contact, format: uri }
---
# One task on the task board, its assignee and project nested in it: the
# assignee through a named shape, the project through one of this shape's own
# definitions, whose brief is a further reference titled where it is used.
kind: Telo.JsonSchema
metadata:
  name: TaskCard
schema:
  type: object
  required: [ id, title, project ]
  $defs:
    ProjectRef:
      type: object
      required: [ code, name ]
      properties:
        code: { type: string, title: Project }
        name: { type: string, title: Project name }
        brief: { $ref: "#/$defs/PageAddress", title: Brief }
    PageAddress: { type: string, title: Address, format: uri-reference }
  properties:
    id: { type: integer }
    title: { type: string, title: Task }
    assignee: !ref Member
    project: { $ref: "#/$defs/ProjectRef" }
---
# A button that sends nothing.
kind: Telo.JsonSchema
metadata:
  name: NoInput
schema:
  type: object
  additionalProperties: false
  properties: {}
---
# ---- Shapes of the forms page ----
# Work asked of the studio: one property of each type a form derives a control
# for, and an access code the form never keeps.
kind: Telo.JsonSchema
metadata:
  name: Request
schema:
  type: object
  additionalProperties: false
  required: [ title, kind ]
  properties:
    title: { type: string, title: Title, minLength: 3, maxLength: 60 }
    kind:
      type: string
      title: Kind of work
      enum: [ design, build, write, research ]
      oneOf:
        - { const: design, title: Design }
        - { const: build, title: Building }
        - { const: write, title: Writing }
        - { const: research, title: Research }
      default: design
    seats: { type: integer, title: People needed, minimum: 1, maximum: 8, default: 2 }
    budget: { type: number, title: Budget, minimum: 0, multipleOf: 50 }
    startOn: { type: string, title: Start, format: date }
    kickoffAt: { type: string, title: Kick-off, format: date-time }
    callAt: { type: string, title: Daily call, format: time }
    details: { type: string, title: Details, description: Markdown is welcome., contentMediaType: text/markdown, maxLength: 2000 }
    urgent: { type: boolean, title: Urgent }
    channels:
      type: array
      title: Keep me posted by
      uniqueItems: true
      items:
        type: string
        enum: [ email, chat, phone ]
        oneOf:
          - { const: email, title: E-mail }
          - { const: chat, title: Chat }
          - { const: phone, title: Phone }
    keywords:
      type: array
      title: Keywords
      description: Lower-case words; Enter or a comma adds one.
      maxItems: 5
      items: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    accessCode: { type: string, title: Site access code, description: Never kept between visits., minLength: 4, writeOnly: true }
---
# The latest requests, as the forms page lists them.
kind: Telo.JsonSchema
metadata:
  name: RequestList
schema:
  type: object
  required: [ requests ]
  properties:
    requests:
      type: array
      items:
        type: object
        required: [ id, title, kind, urgent, receivedAt ]
        properties:
          id: { type: integer }
          title: { type: string, title: Title }
          kind:
            type: string
            title: Kind of work
            enum: [ design, build, write, research ]
            oneOf:
              - { const: design, title: Design }
              - { const: build, title: Building }
              - { const: write, title: Writing }
              - { const: research, title: Research }
          seats: { type: integer, title: People needed }
          startOn: { type: string, title: Start, format: date }
          urgent: { type: boolean, title: Urgent }
          receivedAt: { type: string, title: Received, format: date-time }
---
# Who works on a project and when: a project, a lead of a role, the people
# around the lead, and a period of dates.
kind: Telo.JsonSchema
metadata:
  name: Booking
schema:
  type: object
  additionalProperties: false
  required: [ projectCode, leadRole, leadEmail, sponsorEmail, period ]
  properties:
    projectCode: { type: string, title: Project, pattern: "^[A-Z]{2,4}-[0-9]+$" }
    leadRole:
      type: string
      title: Lead's role
      enum: [ manager, engineer, designer, writer ]
      oneOf:
        - { const: manager, title: Manager }
        - { const: engineer, title: Engineer }
        - { const: designer, title: Designer }
        - { const: writer, title: Writer }
      default: engineer
    leadEmail: { type: string, title: Lead }
    reviewerEmails: { type: array, title: Reviewers, maxItems: 3, uniqueItems: true, items: { type: string } }
    sponsorEmail: { type: string, title: Sponsor, default: ada@northwind.example }
    helperEmails: { type: array, title: Helpers, uniqueItems: true, items: { type: string } }
    period:
      type: object
      title: Period
      description: The studio books a year at most.
      required: [ from, to ]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    onSite: { type: boolean, title: On site, default: false }
    site: { type: string, title: Site address, minLength: 3 }
    notes: { type: string, title: Notes, contentMediaType: text/plain, maxLength: 500 }
---
# The latest bookings, with the names of the people booked.
kind: Telo.JsonSchema
