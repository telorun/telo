modules:
  apps/authoring-agent: Added
body: "Every turn now opens with a CURRENT TIME message in UTC, so the agent resolves a
  relative period the user names — \"last week\", \"since Friday\" — against a real
  clock and reports the absolute range it resolved it to, rather than guessing a date or
  asking for one. It rides the same per-turn system message as WORKSPACE STATE and for
  the same reason it cannot ride the system prompt: that block is a literal resolved
  once at load, so a date stamped there would be the process's boot date for as long as
  it runs, wrong from the second day on with nothing to show it. UTC rather than an
  operator timezone, stated as UTC in the message: where a report's boundaries genuinely
  depend on the user's zone, that is a question to ask rather than an offset to bury."
