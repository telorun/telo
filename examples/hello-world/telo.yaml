kind: Telo.Application
metadata:
  name: HelloConsole
  version: 1.0.0
  description: |
    Smallest possible runnable Telo application: imports the console module and
    prints a single line via a flat `targets` invoke step. Useful as a "does my setup work?"
    smoke test and as a starting skeleton for larger script-style manifests.
    Reach for `Run.Sequence` when a boot entry needs control flow, scopes, or
    a return value.
imports:
  Console: oci://ghcr.io/telorun/console@0.17.4#sha256-T3hXxYNK-UClSE_wssnkYI-urC-4c8CEx82rSBc-dR4
targets:
  - invoke: !ref Console.writeLine
    inputs:
      output: "Hello from Telo!"
