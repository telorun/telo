kind: Telo.Application
metadata:
  name: HubOriginRefusalsTest
  version: 1.0.0
  description: |
    What the hub refuses of a module an origin serves, each refusal leaving
    nothing of the module behind:

    - Ingest, an application whose `telo module manifest --json` payload carries
      no `application` field — what a telo older than the hub reports. Indexing
      it would store an application that asks for nothing. The version is not
      indexed and `version_ingest.last_error` names the missing field.
    - Ingest, a manifest whose first document is neither a Telo.Library nor a
      Telo.Application, though a later one is. The root kind is read from the
      first document only, so this is not a module: not indexed, and
      `version_ingest.last_error` names the root kind.
    - Registration (`registerAndValidate`, what `POST /register` runs) of such a
      manifest: refused with the reason the route answers a 400 with, no module
      row created and no ingest scheduled.

    The origin reads run the fixture `__fixtures__/recorded-origin` through the
    workspace CLI, which takes the read's arguments as its own and prints what is
    recorded for the ref. The manifest bucket and the embedder are never reached.

    NEEDS A LIVE POSTGRES — a database `pnpm run test:e2e:hub` supplies from its
    own stack through DB_HOST, DB_PORT, DB_USER, DB_PASSWORD and DB_NAME, never a
    developer's database. Run only by the hub's own suite through that command.
imports:
  Run: oci://ghcr.io/telorun/run@0.32.1#sha256-kV5CLg3aUn7XH49UnwIQ1f1UmnA7s1XGvJyX67GfJN8
  Sql: oci://ghcr.io/telorun/sql@0.31.1#sha256-22VA287nKrgIO7f075c_baOM1F_2sN51P0axJ4pQ-rE
  Postgres: oci://ghcr.io/telorun/postgres@0.12.1#sha256-VNaEhwdFO0EmZR7ips4zvp1U7d1ohi72O_uTi-7E3AQ
  S3: oci://ghcr.io/telorun/s3@0.8.0#sha256-utdJQwmumCl0orYETnVY1oA7ytOZuik8syMIRZ1t_8o
  Shell: oci://ghcr.io/telorun/shell@0.13.2#sha256-Kn6rjKno79QZjBSMbjgQNNEAeg4AR7bPnchryZ4sOYk
  Embedding: oci://ghcr.io/telorun/embedding@0.12.2#sha256-XHN0qwYwQm_Lk2OaYZEiqRzEyvIHdhd6u29bfYkvT64
  OpenAI: oci://ghcr.io/telorun/openai@0.20.1#sha256-kSqphJdaw9ZPpRbo1DiX5BKJ_uuWqj5TqOL1d7QjwqQ
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  VectorStore: oci://ghcr.io/telorun/vector-store@0.11.2#sha256-X_V4hFmjTZsOvGlvV9N7kIdpQ-vsnduMukV8jNXpt8A
  VectorStorePgvector: oci://ghcr.io/telorun/vector-store-pgvector@0.20.1#sha256-BG_pTt2PgZ6U_lhfHqg_y7bd0HjgunDZX7kZjDnB0vQ
  Timer: oci://ghcr.io/telorun/timer@0.10.0#sha256-mwYLYOutKn1x3NOElOfgGc5_WZwwlnTRvgKo1XeQcfA
  RateLimit: oci://ghcr.io/telorun/rate-limit@0.14.1#sha256-KNKZRcIImlr9IWZkQVDgwIGzWIKrCh2pGWD8MN853vY
  CacheMemory: oci://ghcr.io/telorun/cache-memory@0.11.1#sha256-t7sQFquKZBO4mQ1eblT_D3m7ytIzx5FYr_QAm7wef1Y
  Assert: ../../../../modules/assert
  Schema:
    source: ../../hub-schema.yaml
    resources:
      connection: !ref db
  Ingest:
    source: ../../hub-ingest.yaml
    resources:
      connection: !ref db
      bucketPut: !ref putManifest
      embedPassage: !ref embedPassage
      vectorUpsert: !ref vectorUpsert
      vectorRemove: !ref vectorRemove
      shellHost: !ref localShell
    variables:
      # Every read runs the recorded origin, which answers the arguments appended.
      teloCommand: [bun, ../../../../../cli/nodejs/bin/telo.ts, recorded-origin]
      ingestRev: 6
  Registry:
    source: ../../hub-registry.yaml
    resources:
      connection: !ref db
      rateLimit: !ref registerRateLimit
      shellHost: !ref localShell
      scheduleIngest: !ref Ingest.scheduleIngest
    variables:
      # The same origin: the origin reader is one shared library, so both
      # importers must configure it alike.
      teloCommand: [bun, ../../../../../cli/nodejs/bin/telo.ts, recorded-origin]
      ingestRev: 6
variables:
  dbHost: { env: DB_HOST, type: string, default: localhost }
  dbPort: { env: DB_PORT, type: integer, default: 5432 }
  dbUser: { env: DB_USER, type: string, default: postgres }
  dbPassword: { env: DB_PASSWORD, type: string, default: postgres }
  dbName: { env: DB_NAME, type: string, default: postgres }
targets:
  - !ref Schema.migrations
  - !ref contractMissing
  - !ref rootKindUnsupported
  - !ref registrationRootKindRefused
---
kind: Postgres.Connection
metadata: { name: db }
access:
  kind: Postgres.DatabaseAccess
  fields:
    url:
      scheme: postgres
      host: !cel "variables.dbHost"
      port: !cel "variables.dbPort"
      user: !cel "variables.dbUser"
      password: !cel "variables.dbPassword"
      path: !cel "'/' + variables.dbName"
---
kind: Shell.LocalHost
metadata: { name: localShell }
cwd: !module-path __fixtures__
---
kind: S3.Put
metadata: { name: putManifest }
bucketRef:
  kind: S3.Bucket
  bucketName: unused
  endpoint: http://127.0.0.1:1
  forcePathStyle: true
  accessKeyId: unused
  secretAccessKey: unused
---
kind: Embedding.Passage
metadata: { name: embedPassage }
model:
  kind: OpenAI.EmbeddingModel
  model: unused
  request:
    kind: HttpClient.Request
    client: { kind: HttpClient.Client, baseUrl: http://127.0.0.1:1 }
---
kind: VectorStorePgvector.Store
metadata: { name: vectorIndex }
connection: !ref db
dimensions: 3
metric: cosine
table: resource_vectors
---
kind: VectorStore.Record
metadata: { name: vectorUpsert }
store: !ref vectorIndex
---
kind: VectorStore.Removal
metadata: { name: vectorRemove }
store: !ref vectorIndex
---
kind: Sql.Query
metadata: { name: query }
connection: !ref db
---
kind: Sql.Command
metadata: { name: exec }
connection: !ref db
---
kind: Telo.Sequence
metadata: { name: contractMissing }
steps:
  - name: reset
    invoke: !ref exec
    inputs: { sql: DELETE FROM modules WHERE id = 9311 }
  - name: seedModule
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO modules (id, ref, transport)
        VALUES (9311, 'oci://example.test/stale-app', 'oci')
  # The attempt counter is what a run id is minted from, and a durable run id is
  # never reused — so each run of this test starts its count from the clock
  # rather than from 1, whose runs an earlier run of the test already burnt.
  - name: seedIngest
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO version_ingest (module_id, version, attempt, completed_at)
        VALUES (9311, '1.0.0', EXTRACT(EPOCH FROM NOW())::int, NOW())
  - name: claim
    invoke: !ref Schema.claimVersion
    inputs:
      moduleId: "9311"
      version: 1.0.0
      digest: sha256:stale
      rev: 6
  - name: ingest
    invoke: !ref Ingest.ingestVersion
    inputs:
      moduleId: "9311"
      ref: oci://example.test/stale-app
      version: 1.0.0
      digest: sha256:stale
      latestVersion: 1.0.0
      attempt: !cel "steps.claim.result.attempt"
  # Bounded; the last reading leaves the loop, so a run that never completes
  # fails on what it showed.
  - name: await
    invoke:
      kind: Run.Loop
      maxIterations: 60
      condition: !cel "iteration == 0 || !previous.state.result.rows[0].completed"
      steps:
        - { name: wait, invoke: { kind: Timer.Delay }, inputs: { duration: 1s } }
        - name: state
          invoke: !ref query
          inputs:
            sql: >-
              SELECT completed_at IS NOT NULL AS completed
              FROM version_ingest WHERE module_id = 9311 AND version = '1.0.0'
      outputs:
        completed: !cel "steps.state.result.rows[0].completed"
  - name: state
    invoke: !ref query
    inputs:
      sql: >-
        SELECT vi.last_error AS "lastError",
               (SELECT COUNT(*)::int FROM module_versions mv WHERE mv.module_id = 9311) AS versions,
               (SELECT COUNT(*)::int FROM application_inputs i WHERE i.module_id = 9311) AS inputs,
               (SELECT COUNT(*)::int FROM search_entries e WHERE e.module_id = 9311) AS entries
        FROM version_ingest vi WHERE vi.module_id = 9311 AND vi.version = '1.0.0'
  - name: assert
    inputs:
      actual:
        completed: !cel "steps.await.result.completed"
        state: !cel "steps.state.result.rows"
      expected:
        completed: true
        state:
          - lastError: >-
              INGEST_CONTRACT_MISSING: telo module manifest oci://example.test/stale-app@1.0.0
              --json reported no `application` contract with its `dimensions` for a
              Telo.Application — the telo running the origin reads predates it; point
              TELO_COMMAND at the telo that runs this hub
            versions: 0
            inputs: 0
            entries: 0
    invoke: { kind: Assert.Equals }
---
kind: Telo.Sequence
metadata: { name: rootKindUnsupported }
steps:
  - name: reset
    invoke: !ref exec
    inputs: { sql: DELETE FROM modules WHERE id = 9312 }
  - name: seedModule
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO modules (id, ref, transport)
        VALUES (9312, 'oci://example.test/definition-root', 'oci')
  # A clock-derived attempt, for the reason given on `contractMissing`.
  - name: seedIngest
    invoke: !ref exec
    inputs:
      sql: >-
        INSERT INTO version_ingest (module_id, version, attempt, completed_at)
        VALUES (9312, '1.0.0', EXTRACT(EPOCH FROM NOW())::int, NOW())
  - name: claim
    invoke: !ref Schema.claimVersion
    inputs:
      moduleId: "9312"
      version: 1.0.0
      digest: sha256:definition-root
      rev: 6
  - name: ingest
    invoke: !ref Ingest.ingestVersion
    inputs:
      moduleId: "9312"
      ref: oci://example.test/definition-root
      version: 1.0.0
      digest: sha256:definition-root
      latestVersion: 1.0.0
      attempt: !cel "steps.claim.result.attempt"
  - name: await
    invoke:
      kind: Run.Loop
      maxIterations: 60
      condition: !cel "iteration == 0 || !previous.state.result.rows[0].completed"
      steps:
        - { name: wait, invoke: { kind: Timer.Delay }, inputs: { duration: 1s } }
        - name: state
          invoke: !ref query
          inputs:
            sql: >-
              SELECT completed_at IS NOT NULL AS completed
              FROM version_ingest WHERE module_id = 9312 AND version = '1.0.0'
      outputs:
        completed: !cel "steps.state.result.rows[0].completed"
  - name: state
    invoke: !ref query
    inputs:
      sql: >-
        SELECT vi.last_error AS "lastError",
               (SELECT COUNT(*)::int FROM module_versions mv WHERE mv.module_id = 9312) AS versions,
               (SELECT COUNT(*)::int FROM resource_kinds rk WHERE rk.module_id = 9312) AS kinds,
               (SELECT COUNT(*)::int FROM search_entries e WHERE e.module_id = 9312) AS entries
        FROM version_ingest vi WHERE vi.module_id = 9312 AND vi.version = '1.0.0'
  - name: assert
    inputs:
      actual:
        completed: !cel "steps.await.result.completed"
        state: !cel "steps.state.result.rows"
      expected:
        completed: true
        state:
          - lastError: >-
              INGEST_ROOT_KIND_UNSUPPORTED: the root document of
              oci://example.test/definition-root@1.0.0 is Telo.Definition; only a
              Telo.Library or Telo.Application is indexed
            versions: 0
            kinds: 0
            entries: 0
    invoke: { kind: Assert.Equals }
---
# Named rather than inline: a library's resource input takes only a `!ref`.
kind: RateLimit.Guard
metadata: { name: registerRateLimit }
store: { kind: CacheMemory.Store }
limit: 100
window: 1m
---
kind: Telo.Sequence
metadata: { name: registrationRootKindRefused }
steps:
  - name: reset
    invoke: !ref exec
    inputs: { sql: DELETE FROM modules WHERE ref = 'oci://example.test/definition-first' }
  - name: register
    invoke: !ref Registry.registerAndValidate
    inputs: { ref: oci://example.test/definition-first, clientIp: 127.0.0.1 }
  # Nothing recorded: no module row, and no durable run naming the ref.
  - name: state
    invoke: !ref query
    inputs:
      sql: >-
        SELECT (SELECT COUNT(*)::int FROM modules
                WHERE ref = 'oci://example.test/definition-first') AS modules,
               (SELECT COUNT(*)::int FROM telo_durable_runs
                WHERE inputs LIKE '%oci://example.test/definition-first%') AS runs
  - name: assert
    inputs:
      actual:
        register: !cel "steps.register.result"
        state: !cel "steps.state.result.rows"
      expected:
        register:
          ref: oci://example.test/definition-first
          accepted: false
          rateLimited: false
          retryAfter: 0
          error: >-
            the root document of oci://example.test/definition-first is
            Telo.Definition; only a Telo.Library or Telo.Application can be
            registered
        state:
          - { modules: 0, runs: 0 }
    invoke: { kind: Assert.Equals }
