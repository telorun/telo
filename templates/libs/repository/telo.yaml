kind: Telo.Library
metadata:
  name: NotesRepository
  version: 1.0.0
  description: |
    A reusable `Telo.Library` for a `notes` table: it owns the SQLite connection,
    the schema migration, and typed `SqlRepository` create/read resources, and
    exports them as ready-made singletons. Importers add `Migrate` to their
    `targets` and dispatch to `CreateNote` / `ListNotes` from their own routes —
    no hand-written SQL beyond the migration.
imports:
  Sql: oci://ghcr.io/telorun/sql@0.24.0#sha256-g0Bw5AjrBOGmgGbmsKFb7q833AYlutxV1fDWka47t2I
  SQLite: oci://ghcr.io/telorun/sqlite@0.4.0#sha256-G8qidbhcpiVLiCbrI8TSZZWDO95R4JM9kNX_oVenLmY
  SqlRepository: oci://ghcr.io/telorun/sql-repository@0.13.0#sha256-P4DK2k7DQoJtJOOiags02cjA4N36WCOuDe20o0TV4ek
exports:
  resources:
    - migrate
    - createNote
    - listNotes
---
kind: SQLite.Connection
metadata:
  name: db
file: ./tmp/notes.sqlite
---
kind: SQLite.Table
metadata:
  name: notes
table: notes
columns:
  id: { type: integer, primaryKey: true, identity: always }
  title: { type: text, nullable: false }
  body: { type: text }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
tables:
  - !ref notes
---
kind: SqlRepository.Create
metadata:
  name: createNote
connection: !ref db
table: !ref notes
---
kind: SqlRepository.Read
metadata:
  name: listNotes
connection: !ref db
table: !ref notes
