# A layered node table renamed from itself.
# The table alone, so booting it reaches no database.
kind: Telo.Library
metadata:
  name: TableRenameFromSelf
imports:
  Layers: ../../../..
---
kind: Layers.NodeTable
metadata: { name: people }
table: people
key: id
renamedFrom: people
columns:
  id: { type: text, nullable: false }
