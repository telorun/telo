units:
  modules/ui: Added
body: "Ui.Data is replaced by Ui.Query, a declared read that draws nothing, and the
  query node that draws one: several nodes drawing one query share one read, and a query
  can send a structured JSON body (QUERY by default, POST when an intermediary refuses
  it) composed from the page parameters and typed by input.model. Existing manifests
  keep loading and telo migrate rewrites each Ui.Data placement into a query node over a
  Ui.Query (UI_DATA_REPLACED); a Ui.Data the migration does not match is UNDEFINED_KIND.
  A query node's query root is the parameters its query declares, named or inline, so a
  read of one it does not declare is refused, and a Ui.View reads the query in force
  where it is placed, a page's or a query node's. A page's or a query's parameter named
  like a schema keyword (type, properties) is read as a parameter. The module requires
  the telo release that types and delivers these. Also: Ui.Match.format (date or
  date-time) for conditions, page query parameters and form values, and QUERY as a
  method of the record contract, answered as GET is."
