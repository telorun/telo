kind: Telo.Application
metadata:
  name: GraphLayersRevisionsSqliteStackLimit
  version: 1.0.0
  description: |
    A resolved stack holds at most 32 layers, the store's own included. Layer
    `top` is pinned to thirty-one others in one move — a stack of exactly 32 —
    and a thirty-third layer is refused with nothing changed.
imports:
  SQLite: ../../sqlite
  Graph: ../../graph
  GraphLayers: ../../graph-layers
  Layers: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref appSchema
  - !ref limit
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Layers.NodeTable
metadata: { name: people }
table: people
key: id
columns:
  id: { type: text, nullable: false }
  name: { type: text, nullable: false }
---
kind: Layers.LayersTable
metadata: { name: graphLayers }
table: graph_layers
---
kind: Layers.ChangesetsTable
metadata: { name: graphChangesets }
table: graph_changesets
---
kind: Layers.ChangesetBasesTable
metadata: { name: graphChangesetBases }
table: graph_changeset_bases
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref people, !ref graphLayers, !ref graphChangesets, !ref graphChangesetBases]
---
kind: Layers.Node
metadata: { name: person }
table: !ref people
key: id
---
kind: Assert.Equals
metadata: { name: check }
---
kind: GraphLayers.PinBase
metadata: { name: topPin }
store: !ref top
---
kind: Layers.Store
