kind: Telo.Application
metadata:
  name: ChatRetentionSweep
  version: 1.0.0
  description: |
    Retention deletes whole conversations. Conversation A is idle; conversation
    B has an equally old turn and a recent one. The sweep removes every journal
    key of A — its turns then read as removed, which the event route answers
    with 410 — and deletes A's `turns`, `messages` and `turn_projections` rows,
    while B keeps every turn, row and record. A's key was already removed before
    the sweep, as a sweep a crash cut short leaves it, and the sweep still
    finishes; a second sweep finds nothing to do. Offline, against the stub.
imports:
  Chat:
    source: ../
    secrets:
      openaiApiKey: stub-key
    variables:
      workspaceDir: !cel "variables.scratch.joinPath('workspace')"
      stateDir: !cel "variables.scratch.joinPath('state')"
      modelEndpoint: http://127.0.0.1:18485/v1
  App: oci://ghcr.io/telorun/app@0.2.0#sha256-vCNxysnNWaauCz5xcqXg2SfrotM1xhZ3VwlEzumpO2o
  Sql: oci://ghcr.io/telorun/sql@0.25.0#sha256-x8UXPZbNmoCuldq7EAcotw6KfwZr9baCKrRX_8TKaYc
  SQLite: oci://ghcr.io/telorun/sqlite@0.7.0#sha256-iAGE4n-r6dEjTPbJQkAV65pRjILsJI47aderaurBVvs
  # By path, as the chat library imports them, until they are published.
  Stream: oci://ghcr.io/telorun/stream@0.13.0#sha256-OAOZ21USu_5mBQ1IrThy73jG7gkqsWQ21s8Wh0FTaQc
  RecordStream: oci://ghcr.io/telorun/record-stream@0.18.0#sha256-lA9kmx0POJtB2MQabT5D8tdW46Bz9vx1UnOPXRcpiHI
  RecordStreamSql: oci://ghcr.io/telorun/record-stream-sql@0.4.0#sha256-LP5BOEFkOUJUKCkxW7-nbnBB4UIqvzCUpeOu-riERXQ
  Run: oci://ghcr.io/telorun/run@0.27.1#sha256-O1CdVvYs_O7Zj-PNQxMS3NdgWL6e8M2A0J9Wu0rTnIU
  Assert: oci://ghcr.io/telorun/assert@0.20.1#sha256-mnAbFggBHChh_rXaSbeEjj8y1PHyY-y42YGO2TgAClQ
variables:
  # The agent's state is a file that outlives the run; each run starts its two
  # conversations empty.
  scratch:
    env: CHAT_TEST_RETENTION_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/retention-sweep
targets:
  - !ref Chat.ensureWorkspace
  - !ref Chat.initSchema
  - !ref reset
  - !ref test
---
kind: SQLite.Connection
metadata: { name: stateDb }
file: !cel "variables.scratch.joinPath('state').joinPath('agent.sqlite')"
---
kind: Sql.Command
metadata: { name: stateCommand }
connection: !ref stateDb
---
kind: Sql.Query
metadata: { name: stateQuery }
connection: !ref stateDb
---
# The agent's journal, read and written from outside the agent.
kind: RecordStream.Journal
metadata: { name: journal }
store:
  kind: RecordStreamSql.JournalStore
  connection: !ref stateDb
  table: turn_journal
markerRetention: 1h
---
kind: RecordStream.JournalRead
metadata: { name: journalRead }
journal: !ref journal
---
kind: Run.Sequence
metadata: { name: reset }
steps:
  - name: turns
    invoke: !ref stateCommand
    inputs:
      sql: "DELETE FROM turns WHERE conversation_id IN ('a1a1a1a1-0000-4000-8000-000000000001', 'b2b2b2b2-0000-4000-8000-000000000002')"
  - name: messages
    invoke: !ref stateCommand
    inputs:
      sql: "DELETE FROM messages WHERE conversation_id IN ('a1a1a1a1-0000-4000-8000-000000000001', 'b2b2b2b2-0000-4000-8000-000000000002')"
  - name: projections
    invoke: !ref stateCommand
    inputs:
      sql: "DELETE FROM turn_projections WHERE conversation_id IN ('a1a1a1a1-0000-4000-8000-000000000001', 'b2b2b2b2-0000-4000-8000-000000000002')"
---
# One turn to its end: started, then its journal drained.
kind: Run.Sequence
metadata: { name: turn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: start
    invoke: !ref Chat.chatStart
    inputs:
      conversationId: !cel "inputs.conversationId"
      idempotencyKey: ""
      clientIp: test-runner
      message: hello
  - name: read
    invoke: !ref Chat.journalSource
    inputs:
      key: !cel "steps.start.result.turnId"
      fromId: 0
  - name: drain
    timeout: 30000
    invoke: { kind: Stream.Collect }
    inputs:
      input: !cel "steps.read.result.output"
outputs:
  turnId: !cel "steps.start.result.turnId"
---
# How many rows each conversation keeps, per table.
kind: Run.Sequence
metadata: { name: rowCounts }
steps:
  - name: counts
    invoke: !ref stateQuery
    inputs:
      sql: |
        SELECT c.id AS conversation,
               (SELECT COUNT(*) FROM turns WHERE conversation_id = c.id) AS turns,
               (SELECT COUNT(*) FROM messages WHERE conversation_id = c.id) AS messages,
               (SELECT COUNT(*) FROM turn_projections WHERE conversation_id = c.id) AS projections
        FROM (SELECT 'a1a1a1a1-0000-4000-8000-000000000001' AS id
              UNION ALL SELECT 'b2b2b2b2-0000-4000-8000-000000000002') AS c
        ORDER BY c.id
outputs:
  rows: !cel "steps.counts.result.rows"
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: stub }
    source: ./__fixtures__/provider-stub/telo.yaml
    ports: { http: 18485 }
targets: [ !ref stub ]
steps:
  - name: idleTurn
    invoke: !ref turn
    inputs: { conversationId: a1a1a1a1-0000-4000-8000-000000000001 }
  - name: oldTurn
    invoke: !ref turn
    inputs: { conversationId: b2b2b2b2-0000-4000-8000-000000000002 }
  - name: recentTurn
    invoke: !ref turn
    inputs: { conversationId: b2b2b2b2-0000-4000-8000-000000000002 }
  - name: age
    invoke: !ref stateCommand
    inputs:
      sql: "UPDATE turns SET active_at = '2000-01-01T00:00:00.000Z' WHERE turn_id IN (?, ?)"
      bindings:
        - !cel "steps.idleTurn.result.turnId"
        - !cel "steps.oldTurn.result.turnId"
  # Where a sweep a crash cut short leaves a conversation: its key removed, its
  # rows still there.
  - name: crashedSweep
    invoke:
      kind: RecordStream.JournalRemoval
      journal: !ref journal
    inputs:
      key: !cel "steps.idleTurn.result.turnId"
  - name: sweep
    invoke: !ref Chat.retentionSweep
    inputs:
      idleBefore: "2020-01-01T00:00:00Z"
  - name: counts
    invoke: !ref rowCounts
  - name: idleKey
    invoke: !ref journalRead
    inputs: { key: !cel "steps.idleTurn.result.turnId", limit: 0 }
  - name: oldKey
    invoke: !ref journalRead
    inputs: { key: !cel "steps.oldTurn.result.turnId", limit: 0 }
  - name: removedEvents
    try:
      - name: readRemoved
        invoke: !ref Chat.turnEvents
        inputs: { turnId: !cel "steps.idleTurn.result.turnId", fromId: 0 }
    catch:
      - name: removedCode
        value: !cel "error.code"
  - name: again
    invoke: !ref Chat.retentionSweep
    inputs:
      idleBefore: "2020-01-01T00:00:00Z"
  - name: wholeConversations
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        swept: !cel "steps.sweep.result.conversations"
        counts: !cel "steps.counts.result.rows"
        idleKey: !cel "steps.idleKey.result.state"
        oldKey: !cel "steps.oldKey.result.state"
        removedEvents: !cel "steps.removedCode.result"
        sweptAgain: !cel "steps.again.result.conversations"
      expected:
        swept: 1
        counts:
          - { conversation: a1a1a1a1-0000-4000-8000-000000000001, turns: 0, messages: 0, projections: 0 }
          - { conversation: b2b2b2b2-0000-4000-8000-000000000002, turns: 2, messages: 4, projections: 2 }
        idleKey: removed
        oldKey: finished
        removedEvents: ERR_JOURNAL_KEY_REMOVED
        sweptAgain: 0
