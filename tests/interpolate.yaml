kind: Telo.Application
metadata:
  name: InterpolateTest
  version: 1.0.0
  description: |
    `!interpolate` is text with holes, always a string, each hole converted
    exactly as CEL's `string()` converts it — an instant as RFC 3339, a
    duration as its plain encoding, bytes as UTF-8, a number and a bool as CEL
    writes them. A hole may hold a map literal or a string containing a brace,
    and a hole yielding the opening delimiter writes it literally.
imports:
  Run: ../modules/run
  Assert: ../modules/assert
variables:
  window:
    env: INTERPOLATE_TEST_WINDOW
    type: string
    x-telo-type: Telo.Duration
    default: 1h30m
targets:
  - !ref test
---
kind: Run.Sequence
metadata:
  name: test
steps:
  - name: render
    invoke:
      kind: Run.Value
      inputType:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [at, bytes]
          properties:
            at: { x-telo-type: Telo.Timestamp }
            bytes: { x-telo-type: Telo.Bytes }
      value:
        instant: !interpolate "at ${{ inputs.at }}"
        duration: !interpolate "every ${{ variables.window }}"
        bytes: !interpolate "said ${{ inputs.bytes }}"
        scalars: !interpolate "${{ 7 }}/${{ 2.5 }}/${{ 3u }}/${{ true }}"
        braces: !interpolate "${{ {'k': '}'}['k'] }} and ${{ '${{' }}"
    inputs:
      at: "2026-01-02T03:04:05Z"
      bytes: aGk
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.render.result"
      expected:
        instant: at 2026-01-02T03:04:05.000Z
        duration: every 5400s
        bytes: said hi
        scalars: 7/2.5/3/true
        braces: !literal "} and ${{"
