kind: Telo.Application
metadata:
  name: HostRoutingChecksTest
  version: 1.0.0
  description: |
    What `telo check` refuses about the socket a server binds and the hosts its
    mounts answer — each pinned where the kernel has a twin, by running it too.
imports:
  Assert: ../../assert
targets:
  - !ref listenMoved
  - !ref listenMovedBeside
  - !ref listenMovedBesideAtRuntime
  - !ref baseUrlRemoved
  - !ref unknownHostsWithoutHostnames
  - !ref unknownHostsWithoutHostnamesAtRuntime
  - !ref hostnameWritten
  - !ref hostnameOfAnotherKind
  - !ref hostnameOptional
  - !ref hostnameSelfSupplied
---
# The top-level spelling is refused, the rule naming where it moved.
kind: Assert.Manifest
metadata: { name: listenMoved }
source: ./__fixtures__/host-routing-checks/listen-moved.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "is missing required property 'listen'"
    - code: RESOURCE_RULE_VIOLATED
      message: "`port` is now `listen.port`"
---
kind: Assert.Manifest
metadata: { name: listenMovedBeside }
source: ./__fixtures__/host-routing-checks/listen-moved-lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "`host` is now `listen.address`"
---
# The controller's twin, reached through a consumer whose own check is silent.
kind: Assert.Manifest
metadata: { name: listenMovedBesideAtRuntime }
source: ./__fixtures__/host-routing-checks/listen-moved-consumer.yaml
expect:
  errors: []
  runFails: "ERR_HTTP_SERVER_LISTEN_MOVED"
---
kind: Assert.Manifest
metadata: { name: baseUrlRemoved }
source: ./__fixtures__/host-routing-checks/base-url.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "'baseUrl' is not allowed"
---
kind: Assert.Manifest
metadata: { name: unknownHostsWithoutHostnames }
source: ./__fixtures__/host-routing-checks/unknown-hosts-lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "sets `unknownHosts: reject`, and none of its mounts names `hostnames`"
---
kind: Assert.Manifest
metadata: { name: unknownHostsWithoutHostnamesAtRuntime }
source: ./__fixtures__/host-routing-checks/unknown-hosts-consumer.yaml
expect:
  errors: []
  runFails: "ERR_HTTP_UNKNOWN_HOSTS_NO_HOSTNAMES"
---
# A hostname is never written in a manifest: an entry is a reference to an
# address need, required and supplied only by whoever runs the application.
kind: Assert.Manifest
metadata: { name: hostnameWritten }
source: ./__fixtures__/host-routing-checks/hostnames-literal.yaml
expect:
  errors:
    - code: INVALID_REFERENCE_FORM
      message: "string reference at 'mounts[0].hostnames[0]'"
---
kind: Assert.Manifest
metadata: { name: hostnameOfAnotherKind }
source: ./__fixtures__/host-routing-checks/hostnames-kind.yaml
expect:
  errors:
    - code: REFERENCE_KIND_MISMATCH
      message: "does not match required 'Telo.PublicUrl'"
---
kind: Assert.Manifest
metadata: { name: hostnameOptional }
source: ./__fixtures__/host-routing-checks/hostnames-optional.yaml
expect:
  errors:
    - code: NEED_OPTIONAL_REFERENCED
      message: "'mounts[0].hostnames[0]' references need 'site', which is optional"
---
kind: Assert.Manifest
metadata: { name: hostnameSelfSupplied }
source: ./__fixtures__/host-routing-checks/hostnames-self-supplied.yaml
expect:
  errors:
    - code: NEED_ROOT_SUPPLY_REQUIRED
      message: "a fulfilment of it cannot be written in a manifest"
  runFails: "ERR_NEED_ROOT_SUPPLY_REQUIRED"
