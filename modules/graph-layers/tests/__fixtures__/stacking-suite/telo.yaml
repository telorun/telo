# What only a PINNED stack promises, once, for every strategy and engine whose
# layers are built on revisions of others: a layer is pinned to one or many
# others at a revision number, a label or their head, in one move; a base
# publishing again changes nothing above until a pin moves; a moved pin merges
# what is clean and leaves the rest as the same five conflict classes a stale
# draft gets, resolved the same way; a diamond is upgraded in one call; labels
# are permanent; a cursor stays on the stack it began on; and a write that
# changes nothing a layer states is no revision of it.
#
# A run supplies seven revisioned stores over the same types, none pinned to
# anything, and runs the sequences in order, starting empty. The suite pins
# them itself. Each sequence keeps to keys of its own prefix and leaves no
# draft open; the stacks it leaves are stated where a later one relies on them.
kind: Telo.Library
metadata:
  name: StackingGraphSuite
  version: 1.0.0
  description: >-
    Test fixture: the stacking suite over seven revisioned stores holding people
    who know people.
imports:
  Graph: ../../../../graph
  GraphLayers: ../../..
  Run: ../../../../run
  Assert: ../../../../assert
resources:
  base:
    kind: GraphLayers.RevisionedStore
    description: Layer `base`.
  middle:
    kind: GraphLayers.RevisionedStore
    description: Layer `middle`.
  side:
    kind: GraphLayers.RevisionedStore
    description: Layer `side`.
  top:
    kind: GraphLayers.RevisionedStore
    description: Layer `top`.
  left:
    kind: GraphLayers.RevisionedStore
    description: Layer `left`.
  right:
    kind: GraphLayers.RevisionedStore
    description: Layer `right`.
  apex:
    kind: GraphLayers.RevisionedStore
    description: Layer `apex`.
  person:
    kind: Graph.Node
    description: People keyed by a text `id`, with a non-null text `name` and an integer `age`.
  knows:
    kind: Graph.Relationship
    description: person → person, with an integer `since`.
exports:
  resources:
    - pinning
    - removals
    - upgrade
    - pinnedLinks
    - cursors
    - labels
    - diamond
    - rebasedPins
    - equalWrites
