# A step passes an argument its target's input contract declares only where a
# choice says so: the call is refused only where the member is left out.
kind: Telo.Application
metadata:
  name: StepInputsChoice
imports:
  Run: ../../../modules/run
variables:
  flag1: { env: FLAG_1, type: boolean, default: false }
targets:
  - !ref main
---
kind: Run.Value
metadata:
  name: target
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      x: !if
        if: !cel "variables.flag1"
        then: { type: integer }
value: 1
---
kind: Run.Sequence
metadata:
  name: main
steps:
  - name: call
    invoke: !ref target
    inputs: { x: 1 }
