# A bookkeeping table has no row contract: a repository over it has no column
# it can name, so nothing but the store writes it.
kind: Telo.Application
metadata:
  name: BookkeepingRepository
imports:
  SQLite: ../../../../sqlite
  SqlRepository: ../../../../sql-repository
  Layers: ../../..
  Run: ../../../../run
targets:
  - !ref write
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Layers.LayersTable
metadata: { name: graphLayers }
table: graph_layers
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref graphLayers]
---
kind: Run.Sequence
metadata: { name: write }
steps:
  - name: insert
    invoke:
      kind: SqlRepository.Create
      connection: !ref db
      table: !ref graphLayers
    inputs:
      data: { head_revision: 3 }
