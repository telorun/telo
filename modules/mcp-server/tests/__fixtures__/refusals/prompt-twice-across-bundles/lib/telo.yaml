# `telo check` reports this here; a consumer's check sees nothing, so there the
# resource refuses itself when the application boots.
kind: Telo.Library
metadata:
  name: McpPromptTwiceAcrossBundles
  version: 1.0.0
  description: Test fixture exporting an HTTP endpoint whose two prompts bundles share an entry.
imports:
  Mcp: ../../../../../
  Run: ../../../../../../run
exports:
  resources: [server]
---
kind: Run.Value
metadata: { name: answer }
value:
  text: ok
---
kind: Mcp.Prompts
metadata: { name: First }
entries:
  - name: greet
    handler: !ref answer
    inputs: {}
    result:
      messages:
        - { role: user, content: { type: text, text: ok } }
---
kind: Mcp.Prompts
metadata: { name: Second }
entries:
  - name: greet
    handler: !ref answer
    inputs: {}
    result:
      messages:
        - { role: user, content: { type: text, text: ok } }
  - name: part
    handler: !ref answer
    inputs: {}
    result:
      messages:
        - { role: user, content: { type: text, text: ok } }
---
kind: Mcp.HttpEndpoint
metadata: { name: server }
serverInfo: { name: fixture, version: 1.0.0 }
prompts: [ !ref First, !ref Second ]
