kind: Telo.Library
metadata:
  name: UiProbe
  version: 1.0.0
  description: >-
    Test fixture exposing what a value source provides, so a test can compare a
    composite's produced node with an expected literal, and what checking a
    manifest reports.
exports:
  kinds: [Read, Diagnostics]
---
kind: Telo.Definition
metadata:
  name: Read
  description: Returns what the value source it holds provides.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./probe.mjs#Read
schema:
  type: object
  required: [source]
  additionalProperties: false
  properties:
    source:
      x-telo-ref: { kind: Telo.Provider, use: call }
---
kind: Telo.Definition
metadata:
  name: Diagnostics
  description: Checks a manifest and returns what it produced as code and message — every error and warning, and apart from them every note.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./probe.mjs#Diagnostics
schema:
  type: object
  additionalProperties: false
  required: [source]
  properties:
    source: { type: string }
