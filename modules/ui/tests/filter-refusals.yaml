kind: Telo.Application
metadata:
  name: UiFilterRefusalsTest
  version: 1.0.0
  description: |
    What a filter bar refuses — a pair listed twice, a default, control or
    preset its filter cannot hold (a value relative to now on a filter that is
    no date comparison among them), a duplicate preset label — statically and
    again when the bar is first read, and where pinning a filter is a warning.
imports: { Assert: ../../assert, Probe: ./__fixtures__/probe, Run: ../../run }
targets:
  - !ref filterDuplicateAtRuntime
  - !ref filterDefaultInvalidAtRuntime
  - !ref filterControlUnsupportedAtRuntime
  - !ref presetUnknownFilterAtRuntime
  - !ref searchUndeclaredAtRuntime
  - !ref presetSearchUnsetAtRuntime
  - !ref presetValueInvalidAtRuntime
  - !ref presetRelativeInvalidAtRuntime
  - !ref presetLabelDuplicateAtRuntime
  - !ref toggleOverTextAtRuntime
  - !ref toggleUntypedAtRuntime
  - !ref toggleDefaultOffAtRuntime
  - !ref togglePresetOffAtRuntime
  - !ref filterPolicy
  - !ref pinned
---
kind: Assert.Manifest
metadata: { name: filterDuplicateAtRuntime }
source: ./__fixtures__/invalid/filter-duplicate/telo.yaml
expect:
  errors: [{ code: SCHEMA_VIOLATION, message: "Ui.Listing/sourceFilter: `filters` does not satisfy the type declared at `{ from: /model, member: 0# }`: / must NOT have additional properties ('done' is not allowed)" }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Listing/sourceFilter at 'filters.done': filters its source by a property the collection does not accept an equality on. Declare it with operator `eq` under the collection's `query.filters`, or remove this filter." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Listing/sourceFilterNotAccepted at 'filters.isDone': filters its source by a property the collection does not accept an equality on. Declare it with operator `eq` under the collection's `query.filters`, or remove this filter." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Listing/sortNotAccepted: starts sorted by a property the collection does not accept a sort on. Declare it under the collection's `query.sort`, or change `sort.by`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/formField at 'fields[2]': lists a field for a property the model does not declare. Use a property of `model`, or add this one to it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterNotAccepted at 'fields[1]': filters by a property and operator the collection does not accept. Declare the pair under the collection's `query.filters`, or remove this field." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Panel/compactAddressed: names a compact surface that declares an address. The address of a compact surface is the one of the surface it stands in for: remove `address` from it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Dialog/compactNested: names a compact surface that declares a compact surface of its own. Only one level applies: remove `compact` from it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.SplitView/splitCompactAddressed at 'aside.compact': names a compact surface that declares an address. The aside has no address of its own to stand in for: remove `address` from it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.SplitView/splitCompactNested at 'aside.compact': names a compact surface that declares a compact surface of its own. Only one level applies: remove `compact` from it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterValuesNotFaceted at 'fields[0]': offers only the values present for a property the collection does not facet. Add the property to the collection's `query.facets`, or offer `all` values." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterOptionValueMismatch at 'fields[0]': offers options whose value is of another type than the property holds. Make the source's `value` read a property of the property's type, or filter another property." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/searchUndeclared: holds a search with nothing to read it: the bar writes `search` over a collection declaring no `query.search`, or a preset sets a search on a bar that has none. Declare the properties a search reads under the collection's `query.search`, write `search` on the bar, or remove the `search` that has nothing to read." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/presetSearchUnset: holds a search with nothing to read it: the bar writes `search` over a collection declaring no `query.search`, or a preset sets a search on a bar that has none. Declare the properties a search reads under the collection's `query.search`, write `search` on the bar, or remove the `search` that has nothing to read." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterDuplicate at 'fields[0]': lists a property and operator another field already has. A filter is one property with one operator: remove one of the two." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterDuplicate at 'fields[1]': lists a property and operator another field already has. A filter is one property with one operator: remove one of the two." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterDefaultInvalid at 'fields[0]': declares a default its filter cannot hold: a value that is not of the property's type or not one of its `enum`, a list without the `in` operator, a single value with it, anything but `true` under `absent`, `false` for a filter entered with a `toggle`, which holds true or nothing, or a relative value on a filter that is not a `date` or `date-time` one with `eq`, `gt`, `gte`, `lt` or `lte`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterControlUnsupported at 'fields[0]': asks for a control its filter cannot be entered with: `select` and `options` need an `enum` or a boolean, `toggle` a boolean with `eq` or any property under `absent`, `slider` a number or integer declaring `minimum` and `maximum` with `eq` or a comparison, and `tags` the `in` operator." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/presetUnknownFilter at 'presets[0]': sets a property and operator the bar does not show. Name a pair listed under `fields`, or one the collection accepts when `fields` is left out." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/presetValueInvalid at 'presets[0]': sets a value its filter cannot hold: one that is not of the property's type or not one of its `enum`, a list without the `in` operator, a single value with it, anything but `true` under `absent`, `false` for a filter entered with a `toggle`, which holds true or nothing, or a relative value on a filter that is not a `date` or `date-time` one with `eq`, `gt`, `gte`, `lt` or `lte`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/presetRelativeInvalid at 'presets[0]': sets a value its filter cannot hold: one that is not of the property's type or not one of its `enum`, a list without the `in` operator, a single value with it, anything but `true` under `absent`, `false` for a filter entered with a `toggle`, which holds true or nothing, or a relative value on a filter that is not a `date` or `date-time` one with `eq`, `gt`, `gte`, `lt` or `lte`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/defaultRelativeInvalid at 'fields[0]': declares a default its filter cannot hold: a value that is not of the property's type or not one of its `enum`, a list without the `in` operator, a single value with it, anything but `true` under `absent`, `false` for a filter entered with a `toggle`, which holds true or nothing, or a relative value on a filter that is not a `date` or `date-time` one with `eq`, `gt`, `gte`, `lt` or `lte`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/presetLabelDuplicate at 'presets[0]': has the label of another preset. A preset is chosen by its label: give each its own." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/presetLabelDuplicate at 'presets[1]': has the label of another preset. A preset is chosen by its label: give each its own." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/toggleOverText at 'fields[0]': asks for a control its filter cannot be entered with: `select` and `options` need an `enum` or a boolean, `toggle` a boolean with `eq` or any property under `absent`, `slider` a number or integer declaring `minimum` and `maximum` with `eq` or a comparison, and `tags` the `in` operator." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/toggleUntyped at 'fields[0]': asks for a control its filter cannot be entered with: `select` and `options` need an `enum` or a boolean, `toggle` a boolean with `eq` or any property under `absent`, `slider` a number or integer declaring `minimum` and `maximum` with `eq` or a comparison, and `tags` the `in` operator." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/toggleDefaultOff at 'fields[0]': declares a default its filter cannot hold: a value that is not of the property's type or not one of its `enum`, a list without the `in` operator, a single value with it, anything but `true` under `absent`, `false` for a filter entered with a `toggle`, which holds true or nothing, or a relative value on a filter that is not a `date` or `date-time` one with `eq`, `gt`, `gte`, `lt` or `lte`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/togglePresetOff at 'presets[0]': sets a value its filter cannot hold: one that is not of the property's type or not one of its `enum`, a list without the `in` operator, a single value with it, anything but `true` under `absent`, `false` for a filter entered with a `toggle`, which holds true or nothing, or a relative value on a filter that is not a `date` or `date-time` one with `eq`, `gt`, `gte`, `lt` or `lte`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/formFieldUnsupported at 'fields[1]': lists a property no control can enter. A property name enters a string, a number, a boolean, one of an `enum`, or a list of those: remove it, give `model` a property of such a type, or name a field kind that enters it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/formFieldUnsupported at 'fields[2]': lists a property no control can enter. A property name enters a string, a number, a boolean, one of an `enum`, or a list of those: remove it, give `model` a property of such a type, or name a field kind that enters it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Action/actionFieldUnknown at 'fields[1]': lists a field for a property the input model does not declare. Use a property of `inputModel`, or add this one to it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Action/actionFieldUnsupported at 'fields[1]': lists a property no control can enter. A property name enters a string, a number, a boolean, one of an `enum`, or a list of those: remove it, give `inputModel` a property of such a type, or name a field kind that enters it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Action/actionFieldUnsupported at 'fields[2]': lists a property no control can enter. A property name enters a string, a number, a boolean, one of an `enum`, or a list of those: remove it, give `inputModel` a property of such a type, or name a field kind that enters it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Action/actionRequiredNotEntered: leaves a property the input model requires with no field, so a valid record could never be sent. List a field for every required property, or leave `fields` out where each one is a scalar or a list of scalars." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Action/actionRequiredNotEnterable: leaves a property the input model requires with no field, so a valid record could never be sent. List a field for every required property, or leave `fields` out where each one is a scalar or a list of scalars." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Action/actionClearUnknown at 'clearAnswerOn[1]': clears its answer on a property the input model does not declare, which never changes. Use a property of `inputModel`, or remove this entry." }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Listing/rowActionInputs: inputs at 'rowActions[0].inputs' do not satisfy remove's declared inputType: / is missing required property 'count'" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Listing/rowActionInputs: inputs at 'rowActions[0].inputs' do not satisfy remove's declared inputType: / must NOT have additional properties ('total' is not allowed)" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Listing/rowActionInputs: inputs at 'rowActions[0].inputs.note' do not satisfy remove's declared inputType: /note must be string" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Data/listRowActionInputs: inputs at 'content.rowActions[0].inputs' do not satisfy remove's declared inputType: / is missing required property 'count'" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Data/listRowActionInputs: inputs at 'content.rowActions[0].inputs' do not satisfy remove's declared inputType: / must NOT have additional properties ('total' is not allowed)" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.Data/listRowActionInputs: inputs at 'content.rowActions[0].inputs.note' do not satisfy remove's declared inputType: /note must be string" }]
  runFails: "Ui.Filters 'filterDuplicate': 'fields[1]' lists a property and operator another field already has ('contains' on 'text')"
