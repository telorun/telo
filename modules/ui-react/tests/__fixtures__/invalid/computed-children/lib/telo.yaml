# A page computing its list of children. The tree's structure is literal, so
# `telo check` refuses it here, and creation refuses it for a consumer whose
# own check sees nothing.
kind: Telo.Library
metadata:
  name: UiReactComputedChildren
  version: 1.0.0
  description: >-
    Test fixture exporting an application whose page computes its list of
    nodes instead of writing it.
imports: { UiReact: ../../../../../, Ui: ../../../../../../ui }
exports: { resources: [computed] }
---
kind: UiReact.App
metadata: { name: computed }
title: Computed
theme: !ref UiReact.defaultTheme
pages:
  - kind: Ui.Page
    path: /
    title: Home
    children: !cel "[]"
