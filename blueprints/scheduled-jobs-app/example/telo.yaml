kind: Telo.Application
metadata:
  name: HousekeepingJobs
  version: 1.0.0
  description: |
    Two recurring jobs built on the ScheduledJobs blueprint: a report every
    night at 02:00 Warsaw time and a cleanup at the top of every hour. There
    is no scheduler, timer or start order to write — only each job's cron
    expression and the work it runs.

        telo run ./blueprints/scheduled-jobs-app/example/telo.yaml
requires:
  telo: ">=0.126.0"
imports:
  ScheduledJobs: ..
  Run: oci://ghcr.io/telorun/run@0.31.0#sha256-nwScCIsE4_c40LSm8abAb5qDKQxVnTU8ORlf7Xjyys4
  Console: oci://ghcr.io/telorun/console@0.19.0#sha256-RC9Wlj4a8ysp1g3WS3z3CbmQuAsahNj4PdsJMaNfPZw
targets:
  - !ref jobs
---
kind: ScheduledJobs.App
metadata:
  name: jobs
jobs:
  nightlyReport:
    cron: "0 2 * * *"
    timezone: Europe/Warsaw
    invoke:
      kind: Run.Sequence
      steps:
        - name: report
          invoke: { kind: Console.WriteLine }
          inputs: { output: "Building the nightly report" }
  hourlyCleanup:
    cron: "0 * * * *"
    invoke:
      kind: Run.Sequence
      steps:
        - name: cleanup
          invoke: { kind: Console.WriteLine }
          inputs: { output: "Purging expired records" }
