# An application whose model property `text` was renamed `title`. `Crud.Ui`
# names no property, so it follows the rename by itself; the two places the
# application still spells the old name are what must be reported.
kind: Telo.Application
metadata:
  name: CrudRenamedPropertyApp
  version: 1.0.0
imports:
  Crud: ../../../
  Ui: ../../../../ui
---
kind: Telo.JsonSchema
metadata: { name: Task }
schema:
  type: object
  required: [title]
  additionalProperties: false
  properties:
    title: { type: string }
    isDone: { type: boolean }
---
# What is read back: everything a client writes, plus the key.
kind: Telo.JsonSchema
metadata: { name: TaskRecord }
extends: Task
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
---
kind: Crud.Model
metadata: { name: taskModel }
schemas:
  read: !ref TaskRecord
  list: !ref TaskRecord
  create: !ref Task
  update: !ref Task
query:
  filters:
    - { property: title, operator: contains }
  sort: []
---
kind: Crud.Ui
metadata: { name: tasks }
model: !ref taskModel
basePath: /api/tasks
---
kind: Ui.Table
metadata: { name: summary }
model: !ref Task
collection: !ref taskModel
source: { basePath: /api/tasks }
columns:
  - value: !cel "row.text"
---
kind: Ui.Filters
metadata: { name: search }
model: !ref Task
collection: !ref taskModel
fields:
  - property: text
    operator: contains
content: { type: composite, ref: !ref tasks }
