project: hub
kind: Added
body: 'Relevance floor on the semantic search arm (VECTOR_MIN_SCORE, cosine
  similarity, default 0.5). An ANN search always returns its nearest topK
  however far away they are, so a query the index has nothing like still came
  back with 50 neighbours that RRF ranked and the response presented as answers
  — "pause execution" returned the timer kind plus an object-storage bucket, a
  codec and a lease. Matches below the floor are dropped before fusion, so a
  query with no good answer now returns nothing instead of a page of noise. The
  floor applies to the vector arm only: the lexical arm has its own gate (a
  full-text match or a name substring) and thresholding it too would regress the
  exact-name lookup that hybrid ranking exists to protect. An empty query skips
  the vector arm entirely, so browsing a category is unaffected. Pinned to the
  embedding model exactly as the stored vectors are — a different model scores
  on a different scale, so re-tune alongside a re-embed.'
