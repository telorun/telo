kind: Telo.Application
metadata:
  name: TemplateStepRepeatsTest
  version: 1.0.0
  description: >-
    A named step repeat in a template body runs one step per element of the
    instance's map, in the consumer's order, invoking each element's family
    member, and publishes `steps.<name>` as a map by element key; a later repeat
    over the same source reads `steps.runs[each.key].result`, typed. An unnamed
    repeat's steps run in order and publish nothing.
imports:
  Run: ../modules/run
  Assert: ../modules/assert
targets:
  - !ref test
  - !ref ranInOrder
---
kind: Telo.Definition
metadata: { name: Pipeline }
capability: Telo.Invocable
schema:
  type: object
  required: [jobs]
  properties:
    jobs:
      type: object
      additionalProperties:
        type: object
        required: [label, factor]
        properties:
          label: { type: string }
          factor: { type: integer }
resources:
  - !for-each
    metadata: { name: tasks }
    in: !cel "self.jobs"
    emit:
      kind: Run.Sequence
      steps:
        - name: scaled
          value: !cel "each.key + ':' + each.value.label + ':' + string(each.value.factor * 10)"
      outputs:
        scaled: !cel "steps.scaled.result"
  - kind: Run.Sequence
    metadata: { name: pipeline }
    steps:
      - !for-each
        name: runs
        in: !cel "self.jobs"
        emit:
          invoke: !ref tasks[each.key]
      - !for-each
        in: !cel "self.jobs"
        emit:
          value: !cel "each.key"
      - !for-each
        name: totals
        in: !cel "self.jobs"
        emit:
          value: !cel "steps.runs[each.key].result.scaled + '!'"
    outputs:
      totals: !cel "steps.totals"
      unnamed: !cel "steps.size()"
invoke: !ref pipeline
---
kind: Self.Pipeline
metadata: { name: pipeline }
jobs:
  alpha: { label: one, factor: 1 }
  beta: { label: two, factor: 2 }
  gamma: { label: three, factor: 3 }
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: run
    invoke: !ref pipeline
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.run.result"
      expected:
        totals:
          alpha: { result: "alpha:one:10!" }
          beta: { result: "beta:two:20!" }
          gamma: { result: "gamma:three:30!" }
        unnamed: 2
---
kind: Assert.Events
metadata: { name: ranInOrder }
filter:
  - type: "*.Invoked"
expect:
  - event: "tasks['alpha'].Invoked"
  - event: "tasks['beta'].Invoked"
  - event: "tasks['gamma'].Invoked"
