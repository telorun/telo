modules:
  modules/ui-react: Added
body: "A picture in a chat shows as a fixed-size square thumbnail: in the message box
  and the edit form the moment it is attached (from the file itself, before the upload
  ends), on the message just sent while its reply is written, and in the transcript.
  Pressing one opens a full-screen media viewer over every picture of the conversation
  loaded so far, with previous and next, arrow keys and swipe, zoom and pan (buttons,
  keys, wheel, pinch, double click, drag), a link to the original, Escape to close and
  the focus returned. New parts chat-attachment-thumbnail and media-viewer,
  media-viewer-stage, media-viewer-image, media-viewer-toolbar, media-viewer-previous,
  media-viewer-position, media-viewer-next, media-viewer-zoom-out,
  media-viewer-zoom-reset, media-viewer-zoom-in, media-viewer-download; chat-image is
  now a fixed-size crop, and the default theme styles them."
