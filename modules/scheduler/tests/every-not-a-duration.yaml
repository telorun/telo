kind: Telo.Application
metadata:
  name: ScheduleEveryNotADuration
  version: 1.0.0
  description: |
    An `every` that is not a duration is refused by `telo check` at the line that
    writes it.
imports: { Assert: ../../assert }
targets: [!ref refusedAtCheck]
---
kind: Assert.Manifest
metadata: { name: refusedAtCheck }
source: ./__fixtures__/every-not-a-duration.yaml
expect:
  errors:
    - { code: SCHEMA_VIOLATION, message: "/every must be a Telo.Duration" }
