# Consumes the library beside it; its entry-scoped check does not reach the
# library's internals, so the kernel's own refusal is what remains here.
kind: Telo.Application
metadata:
  name: StandInIdenticalOwnFieldApp
imports:
  Lib:
    source: ./lib
    variables: { word: abc }
targets:
  - name: call
    invoke: !ref Lib.thing
