modules:
  modules/ui: Added
body: "ui's own texts (loading, save, the pager's range, each validation message, ...)
  are declared by key in a `Telo.KeyedTranslations` document, `Translations`, which
  declares the kind `Ui.Translations`, and ship translated into 14 languages as exported
  instances (`Ui.germanTranslations`, `Ui.polishTranslations`, ...) an application lists
  in its `translations:`. `Ui.Data` and `Ui.Listing` name the set with
  `x-telo-text-keys`. Breaking: `Ui.Words` and `Ui.words` are removed, a text `ui` fills
  is the keyed text `{ set: Ui.Translations, key }` instead of `{ word }`, `@telorun/ui`
  no longer exports `isWords` / `Words` and exports the `KeyedText` type, and the module
  requires telo >=0.129.0."
