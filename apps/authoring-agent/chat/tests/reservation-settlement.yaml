kind: Telo.Application
metadata:
  name: ChatReservationSettlement
  version: 1.0.0
  description: |
    A turn's spend reservation is always given back or settled. An admission
    that fails after reserving — here the `turns` row is refused by a trigger
    seeded into the instance's `agent.sqlite` — answers with the original error,
    leaves the turn's journal key removed, and refunds the reservation: with room
    for exactly one reservation, the next start is admitted. A turn whose
    projection fails at its ending — a trigger refusing the assistant's row —
    ends its event stream with that failure and is still settled to what it
    spent: with room for one reservation and a little more, the next start is
    admitted rather than refused for capacity. A continue that fails after
    reserving — a trigger refusing the turn's `active_at` touch — answers with
    the original error and refunds its reservation, so the next start is
    admitted. Offline, against the provider stub.
imports:
  App: oci://ghcr.io/telorun/app@0.3.0#sha256-LuwPnxFKjpaQ4Y11mIEDbTzMz41dg-degJPFhl6kdmc
  Fs: ../../../../modules/fs
  HttpClient: oci://ghcr.io/telorun/http-client@0.23.0#sha256-6WAIh0ajnTlkWNuP-59e1qNVUXVSJDWZxvPVACQg1AM
  Sse: oci://ghcr.io/telorun/sse-codec@0.13.0#sha256-xNewUQC5N5mmr1Bi0rLQXlIfrJecKLoDhidl_bk0Yew
  Stream: oci://ghcr.io/telorun/stream@0.14.0#sha256-4lK-_jEZ4H1CCdxyLGrsfmkWj5PTXsf2b8NYk0RTxGk
  Sql: oci://ghcr.io/telorun/sql@0.28.0#sha256-JC2SN6Ha8hlq9gnRGahvVNVwe-cUXHXtS8rdeo1BC24
  SQLite: oci://ghcr.io/telorun/sqlite@0.10.0#sha256-qTwG1VYpO8_AGN2UaJPWEIHyt1rt8OUlxLKtLcJkf4Q
  RecordStream: oci://ghcr.io/telorun/record-stream@0.20.0#sha256-hRwLGfhayzKJ27aKx8vp_hZoX3LTYNMsMNoMlAbWnBs
  RecordStreamSql: oci://ghcr.io/telorun/record-stream-sql@0.8.0#sha256-hUM8JPvjMJkMUEmXOXNkhvC5QxFe9VIQw_7rAXCuv9Y
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  Assert: oci://ghcr.io/telorun/assert@0.21.0#sha256-IVtedFwGjLneOTOtKmhG90rs3qMkfSg41BfAMVKY5ts
variables:
  # This test's own workspaces, emptied before each run.
  scratch:
    env: CHAT_TEST_RESERVATION_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/reservation-settlement
targets:
  - !ref test
---
# One turn's event stream, every frame read as its record type, an error frame
# as its code and message.
kind: Run.Sequence
metadata: { name: readEvents }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [url]
    properties:
      url: { type: string }
steps:
  - name: get
    timeout: 30000
    invoke: { kind: HttpClient.Request }
    inputs:
      url: !cel "inputs.url"
      responseType: stream
  - name: frames
    invoke: { kind: Sse.Decoder }
    inputs:
      input: !cel "steps.get.result.body"
  - name: all
    timeout: 30000
    invoke: { kind: Stream.Collect }
    inputs:
      input: !cel "steps.frames.result.records"
outputs:
  frames: !cel >-
    steps.all.result.items.map(r, r.event == 'error'
      ? {'type': 'error', 'code': parseJson(r.data).code, 'message': parseJson(r.data).message}
      : {'type': parseJson(r.data).data.type})
---
kind: Run.Sequence
metadata: { name: test }
steps:
  # Created first so the removal always has something to remove.
  - name: prepare
    invoke: { kind: Fs.DirectoryCreation }
    inputs:
      path: !cel "string(variables.scratch)"
      createParents: true
  - name: reset
    invoke: { kind: Fs.FileRemoval }
    inputs:
      path: !cel "string(variables.scratch)"
      recursive: true
  - name: admissionFails
    invoke:
      kind: Run.Sequence
      with:
        - kind: App.Instance
          metadata: { name: agent }
          source: ../../telo.yaml
          ports: { http: 18495 }
          variables:
            workspaceDir: !cel "variables.scratch.joinPath('admission')"
            # Nothing listens here: the admitted turn fails at its model call,
            # which is not what is under test.
            modelEndpoint: http://127.0.0.1:9/v1
            # Exactly one turn's reservation.
            budgetLimit: 40000
          secrets:
            openaiApiKey: stub-key
        # The instance's own database, reached from outside it.
        - kind: SQLite.Connection
          metadata: { name: agentDb }
          file: !cel "variables.scratch.joinPath('admission').joinPath('.telo-agent').joinPath('agent.sqlite')"
        - kind: Sql.Command
          metadata: { name: seed }
          connection: !ref agentDb
        - kind: Sql.Query
          metadata: { name: keys }
          connection: !ref agentDb
        - kind: RecordStream.JournalRead
          metadata: { name: readKey }
          journal:
            kind: RecordStream.Journal
            store:
              kind: RecordStreamSql.JournalStore
              connection: !ref agentDb
              table: turn_journal
            markerRetention: 1h
      targets: [ !ref agent ]
      steps:
        - name: refusedConversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18495/conversations
            method: POST
        - name: nextConversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18495/conversations
            method: POST
        # Every `turns` row of one conversation is refused — a failure after
        # the key is claimed.
        - name: refuseTurns
          invoke: !ref seed
          inputs:
            sql: !interpolate |
              CREATE TRIGGER refuse_turns BEFORE INSERT ON turns
              WHEN NEW.conversation_id = '${{ steps.refusedConversation.result.body.id }}'
              BEGIN SELECT RAISE(ABORT, 'turn refused by the test'); END
        - name: refused
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18495/chat
            method: POST
          inputs:
            body:
              conversationId: !cel "steps.refusedConversation.result.body.id"
              message: add a health endpoint
        - name: claimed
          invoke: !ref keys
          inputs:
            sql: "SELECT journal_key FROM turn_journal_keys"
        - name: key
          invoke: !ref readKey
          inputs:
            key: !cel "steps.claimed.result.rows[0].journal_key"
            limit: 0
        - name: next
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18495/chat
            method: POST
          inputs:
            body:
              conversationId: !cel "steps.nextConversation.result.body.id"
              message: add a health endpoint
        - name: refundedAndRemoved
          invoke: { kind: Assert.Equals }
          inputs:
            actual:
              refused: !cel "steps.refused.result.status"
              original: !cel "steps.refused.result.body.error.contains('turn refused by the test')"
              keys: !cel "size(steps.claimed.result.rows)"
              key: !cel "steps.key.result.state"
              next: !cel "steps.next.result.status"
            expected:
              refused: 500
              original: true
              keys: 1
              key: removed
              next: 200
  - name: projectionFails
    invoke:
      kind: Run.Sequence
      with:
        - kind: App.Instance
          metadata: { name: stub }
          source: ./__fixtures__/provider-stub/telo.yaml
          ports: { http: 18494 }
        - kind: App.Instance
          metadata: { name: agent }
          source: ../../telo.yaml
          ports: { http: 18496 }
          variables:
            workspaceDir: !cel "variables.scratch.joinPath('projection')"
            modelEndpoint: http://127.0.0.1:18494/v1
            # One turn's reservation and a little more: a second start fits only
            # once the first turn is settled to what it spent.
            budgetLimit: 60000
          secrets:
            openaiApiKey: stub-key
        - kind: SQLite.Connection
          metadata: { name: agentDb }
          file: !cel "variables.scratch.joinPath('projection').joinPath('.telo-agent').joinPath('agent.sqlite')"
        - kind: Sql.Command
          metadata: { name: seed }
          connection: !ref agentDb
      targets: [ !ref stub, !ref agent ]
      steps:
        - name: firstConversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18496/conversations
            method: POST
        - name: secondConversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18496/conversations
            method: POST
        # The user's row projects; the assistant's reply does not.
        - name: refuseAnswers
          invoke: !ref seed
          inputs:
            sql: |
              CREATE TRIGGER refuse_answers BEFORE INSERT ON messages
              WHEN NEW.role = 'assistant'
              BEGIN SELECT RAISE(ABORT, 'projection refused by the test'); END
        - name: first
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18496/chat
            method: POST
          inputs:
            body:
              conversationId: !cel "steps.firstConversation.result.body.id"
              message: hello
        - name: firstEvents
          invoke: !ref readEvents
          inputs:
            url: !interpolate "http://127.0.0.1:18496/chat/${{ steps.first.result.body.turnId }}/events"
        - name: second
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18496/chat
            method: POST
          inputs:
            body:
              conversationId: !cel "steps.secondConversation.result.body.id"
              message: hello
        - name: settledDespiteProjection
          invoke: { kind: Assert.Equals }
          inputs:
            actual:
              completed: !cel "steps.firstEvents.result.frames.exists(f, f.type == 'finish')"
              ended: !cel >-
                cel.bind(last, steps.firstEvents.result.frames[size(steps.firstEvents.result.frames) - 1],
                  last.type == 'error' && last.message.contains('projection refused by the test'))
              second: !cel "steps.second.result.status"
            expected:
              completed: true
              ended: true
              second: 200
  - name: continueFails
    invoke:
      kind: Run.Sequence
      with:
        - kind: App.Instance
          metadata: { name: agent }
          source: ../../telo.yaml
          ports: { http: 18497 }
          variables:
            workspaceDir: !cel "variables.scratch.joinPath('continue')"
            # Nothing listens here: every turn fails at its model call.
            modelEndpoint: http://127.0.0.1:9/v1
            # Two reservations: the failed turn is charged its own, which leaves
            # exactly one — the continue's, or the next start's once refunded.
            budgetLimit: 80000
          secrets:
            openaiApiKey: stub-key
        - kind: SQLite.Connection
          metadata: { name: agentDb }
          file: !cel "variables.scratch.joinPath('continue').joinPath('.telo-agent').joinPath('agent.sqlite')"
        - kind: Sql.Command
          metadata: { name: seed }
          connection: !ref agentDb
      targets: [ !ref agent ]
      steps:
        - name: failingConversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18497/conversations
            method: POST
        - name: nextConversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18497/conversations
            method: POST
        - name: failing
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18497/chat
            method: POST
          inputs:
            body:
              conversationId: !cel "steps.failingConversation.result.body.id"
              message: hello
        - name: failingEvents
          invoke: !ref readEvents
          inputs:
            url: !interpolate "http://127.0.0.1:18497/chat/${{ steps.failing.result.body.turnId }}/events"
        # A continue fails after reserving — at the reset of the abort mark.
        - name: refuseTouch
          invoke: !ref seed
          inputs:
            sql: |
              CREATE TRIGGER refuse_touch BEFORE UPDATE OF aborted_at ON turns
              BEGIN SELECT RAISE(ABORT, 'touch refused by the test'); END
        - name: continued
          invoke: { kind: HttpClient.Request }
          inputs:
            url: !interpolate "http://127.0.0.1:18497/chat/${{ steps.failing.result.body.turnId }}/continue"
            method: POST
        - name: next
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18497/chat
            method: POST
          inputs:
            body:
              conversationId: !cel "steps.nextConversation.result.body.id"
              message: hello
        - name: refunded
          invoke: { kind: Assert.Equals }
          inputs:
            actual:
              failed: !cel "steps.failingEvents.result.frames[size(steps.failingEvents.result.frames) - 1].type"
              continued: !cel "steps.continued.result.status"
              original: !cel "steps.continued.result.body.error.contains('touch refused by the test')"
              next: !cel "steps.next.result.status"
            expected:
              failed: error
              continued: 500
              original: true
              next: 200
