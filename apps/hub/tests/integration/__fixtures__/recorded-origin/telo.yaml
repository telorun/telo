# A stand-in origin, as the hub's origin reads see it: run as
# `<teloCommand> module versions <ref> --json --digests` or
# `<teloCommand> module manifest <ref>@<version> --json`, it answers with what is
# recorded for that ref. Modules the hub must refuse:
#
# - `oci://example.test/stale-app@1.0.0`: a Telo.Application as a CLI that
#   predates the `application` field reports it — everything else
#   `telo module manifest --json` reports, and no contract.
# - `oci://example.test/definition-root@1.0.0` (ingested) and
#   `oci://example.test/definition-first` (registered, one version, 1.0.0): a file
#   whose first document is a Telo.Definition, followed by a versioned
#   Telo.Library.
# - `oci://example.test/not-telo@0.119.0`: the built-in vocabulary, served at a
#   ref other than the one the hub tracks it at.
#
# And the built-in vocabulary at the ref the hub's tests track it at, with a
# module written against it:
#
# - `oci://example.test/telo` (0.119.0, 0.118.0): `builtins-0.119.0.yaml` is the
#   archive the renderer writes (`analyzer/nodejs/src/builtin-vocabulary/`), as
#   `telo publish` publishes it — its `layers:` index appended to the root
#   document; `builtins-0.118.0.yaml` an older, smaller one with a different
#   `Step`. 0.119.0 is reported as `telo module manifest --json` reports a
#   `Telo.Builtins` root (`runtime: null`, `application: null`), 0.118.0 as a
#   CLI predating the archive would, with a runtime block the hub must not
#   record.
# - `oci://example.test/vocab-user@1.0.0`: `vocab-user.yaml`, kinds naming
#   fragments, a value type, zone attributes, a format and a `Telo.<Kind>`
#   parent, and a need type.
kind: Telo.Application
metadata:
  name: RecordedOrigin
  version: 1.0.0
  description: >-
    Answers the hub's `telo module versions --json --digests` and `telo module
    manifest --json` reads with what is recorded for the requested ref.
imports:
  Console: ../../../../../../modules/console
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
variables:
  group:
    type: string
    arg: { position: 0 }
    default: ""
  verb:
    type: string
    arg: { position: 1 }
    default: ""
  ref:
    type: string
    arg: { position: 2 }
    default: ""
  json:
    type: boolean
    arg: json
    default: false
  digests:
    type: boolean
    arg: digests
    default: false
targets:
  - !ref answer
---
kind: Run.Sequence
metadata:
  name: answer
steps:
  - name: verbGate
    if: !cel >-
      variables.group != 'module' || !variables.json
        || !((variables.verb == 'versions' && variables.digests) || (variables.verb == 'manifest' && !variables.digests))
    then:
      - name: refuse
        throw:
          code: ERR_FIXTURE_UNSUPPORTED_READ
          message: !interpolate "this origin answers only `module versions <ref> --json --digests` and `module manifest <ref> --json`, not `${{ variables.group }} ${{ variables.verb }}`"
  # What `module versions --digests` reports, newest first.
  - name: versions
    value:
      oci://example.test/definition-first:
        - { version: 1.0.0, digest: sha256:definition-first-1.0.0 }
      oci://example.test/telo:
        - { version: 0.119.0, digest: sha256:telo-0.119.0 }
        - { version: 0.118.0, digest: sha256:telo-0.118.0 }
      oci://example.test/not-telo:
        - { version: 0.119.0, digest: sha256:not-telo-0.119.0 }
  # What `module manifest` reports.
  - name: manifests
    value:
      oci://example.test/stale-app@1.0.0:
        ref: oci://example.test/stale-app@1.0.0
        cacheKey: oci/example.test/stale-app/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Application
          metadata:
            name: StaleApp
            version: 1.0.0
          variables:
            greeting:
              env: GREETING
              type: string
              default: hello
        integrity: sha256-VhS4Qh8GkpaS4kW0l3PhD1Zz1yJ0jH8dG0Ybq1c2b2E
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/definition-root@1.0.0:
        ref: oci://example.test/definition-root@1.0.0
        cacheKey: oci/example.test/definition-root/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Definition
          metadata:
            name: Greeter
          capability: Telo.Invocable
          schema:
            type: object
          ---
          kind: Telo.Library
          metadata:
            name: DefinitionRoot
            version: 1.0.0
        integrity: sha256-2mcx3BNE8y0FfpWZw3YkM8Vh2cHgqS0b1Zk6nHnAq0Q
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/definition-first@1.0.0:
        ref: oci://example.test/definition-first@1.0.0
        cacheKey: oci/example.test/definition-first/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Definition
          metadata:
            name: Greeter
          capability: Telo.Invocable
          schema:
            type: object
          ---
          kind: Telo.Library
          metadata:
            name: DefinitionFirst
            version: 1.0.0
        integrity: sha256-QYx3n0Jm0p4Y0z4mJmQy6m7l3oK0kQqg5W5m7q8r9s0
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/telo@0.119.0:
        ref: oci://example.test/telo@0.119.0
        cacheKey: oci/example.test/telo/0.119.0/telo.yaml
        manifest: !include-text builtins-0.119.0.yaml
        integrity: sha256-5d2nyy2aZq4WmKk6Rk2kC0Jd1C3rdZQbKkn2tYmD2Yc
        runtime: null
        application: null
      oci://example.test/telo@0.118.0:
        ref: oci://example.test/telo@0.118.0
        cacheKey: oci/example.test/telo/0.118.0/telo.yaml
        manifest: !include-text builtins-0.118.0.yaml
        integrity: sha256-mXJ0R3o0bXOJjFQd8m1nE3xZ2y6dJp9w8YkUuQ8xX0E
        # As a CLI that predates the archive reports it: a runtime block, read
        # off documents that name no controllers.
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
        application: null
      oci://example.test/not-telo@0.119.0:
        ref: oci://example.test/not-telo@0.119.0
        cacheKey: oci/example.test/not-telo/0.119.0/telo.yaml
        manifest: !include-text builtins-0.119.0.yaml
        integrity: sha256-5d2nyy2aZq4WmKk6Rk2kC0Jd1C3rdZQbKkn2tYmD2Yc
        runtime: null
        application: null
      oci://example.test/vocab-user@1.0.0:
        ref: oci://example.test/vocab-user@1.0.0
        cacheKey: oci/example.test/vocab-user/1.0.0/telo.yaml
        manifest: !include-text vocab-user.yaml
        integrity: sha256-Vd6YqJ8n5m2cQf0bQ1oH0j3m2d4oKq5fX9yW8a7cB6E
        runtime:
          runtimes: { nodejs: full }
          languages: [javascript]
          portable: false
          kinds:
            - { name: Steps, runtimes: [nodejs], languages: [javascript], portable: false }
            - { name: Sink, runtimes: [nodejs], languages: [javascript], portable: false }
            - { name: Access, runtimes: [nodejs], languages: [], portable: false }
        application: null
  - name: recorded
    value: !cel "variables.verb == 'versions' ? steps.versions.result : steps.manifests.result"
  - name: refGate
    if: !cel "!(variables.ref in steps.recorded.result)"
    then:
      - name: unknownRef
        throw:
          code: ERR_FIXTURE_UNSUPPORTED_READ
          message: !interpolate "this origin records no `${{ variables.verb }}` answer for ${{ variables.ref }}"
  - name: print
    invoke: !ref Console.write
    inputs:
      output: !cel >-
        json(steps.recorded.result[variables.ref]) + '\n'
