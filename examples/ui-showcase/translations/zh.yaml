  - { text: On site, translation: "现场" }
  - { text: Site address, translation: "现场地址" }
  - { text: Notes, translation: "备注" }
  - { text: Location, translation: "所在地" }
  - { text: Joined, translation: "加入日期" }

  # Forms.
  - { text: Every control from the model, translation: "来自模型的所有控件" }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "未编写字段时，表单为每个属性绘制一个控件，按其模式选择：文本框、枚举的下拉列表、数字框、日期、日期和时间、时间、文档的多行文本框、复选框、枚举列表的并排选项，以及单词列表的输入标签。描述显示为字段下方的提示，默认值即初始值。" }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "每个字段一经触碰，就会按模型进行校验：标题长度、人数、以 50 为步长的预算、关键词的拼写。服务器会拒绝与其他申请重复的标题，其响应显示在标题字段上。输入的内容保存在地址和此浏览器中 — 门禁码除外，模型将其标记为只写。" }
  - { text: Each control chosen by hand, translation: "手动选择的各个控件" }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "同样的申请，但为每个字段编写了控件：标题沿用推导出的控件，类型为并排选项，渠道为可多选的列表，人数用滑块，紧急程度用开关，关键词用标签。输入的内容只在当前浏览器标签页中保留。" }
  - { text: Requests received, translation: "已收到的申请" }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "两个表单最近发送的申请，每次保存后重新读取。" }
  - { text: "Choices, pickers and dates", translation: "选项、选择器和日期" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "为项目预订人员。项目从读自项目集合的列表中选择，每个选项以其代码作为提示。负责人在对话框中按姓名搜索选取，范围是上方所选角色的活跃成员；选择其他角色会重新读取选项，仅当负责人仍然符合时才保留。审核人在抽屉中选取，可一次选多人；发起人在弹出框中选取，初始为一个默认电子邮箱，通过一次查询显示为该人员的姓名。协助人并排列出，每次三人，其余的通过“更多”查看。已选人员链接到其电子邮箱。" }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "时段由两个日期组成，带有预设，每周从周日开始，初始为下个月，超过三个月时会发出警告。服务器会拒绝结束早于开始或超过一年的时段，其响应显示在时段字段上。选定负责人后才显示负责人周围的人员，现场地址仅在现场工作时显示。" }
  - { text: The project, translation: "项目" }
  - { text: "Which project, and who leads the work.", translation: "哪个项目，由谁负责。" }
  - { text: Around the lead, translation: "负责人周围" }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "谁审核工作，谁发起，谁协助。" }
  - { text: When and where, translation: "时间和地点" }
  - { text: Tomorrow, translation: "明天" }
  - { text: Next week, translation: "下周" }
  - { text: This month, translation: "本月" }
  - { text: Next month, translation: "下个月" }
  - { text: Next quarter, translation: "下季度" }
  - { text: Next year, translation: "明年" }
  - { text: Bookings, translation: "预订" }
  - { text: "The latest bookings, read again after every save.", translation: "最近的预订，每次保存后重新读取。" }

