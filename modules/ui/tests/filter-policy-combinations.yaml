kind: Telo.Application
metadata:
  name: UiFilterPolicyCombinationsTest
  version: 1.0.0
  description: |
    No member of a filter bar's policy limits another: every way of showing
    filters, of drawing their controls, of applying a change and of summarising
    the bar is accepted with every placement kind, checked and provided.
imports:
  Ui: ../
  DataModel: ../../data-model
  Probe: ./__fixtures__/probe
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref main
---
kind: Telo.JsonSchema
metadata: { name: Todo }
schema:
  type: object
  required: [id]
  properties: { id: { type: integer }, text: { type: string } }
---
kind: Ui.CollectionPresentation
metadata: { name: todos }
source:
  kind: Ui.CollectionSource
  basePath: /api/todos
  collection:
    kind: DataModel.Collection
    model: !ref Todo
    query: { filters: [{ property: text, operator: contains }], sort: [] }
---
# show × controls × apply × summary, each under the four placement kinds.
kind: Ui.View
metadata: { name: every }
content:
  type: stack
  children:
    - { type: composite, ref: { kind: Ui.Filters, presentation: !ref todos, content: { type: text, text: Todos }, policy: { apply: commit, placement: { kind: Ui.AbovePlacement, show: all, controls: direct, summary: none } } } }
    - { type: composite, ref: { kind: Ui.Filters, presentation: !ref todos, content: { type: text, text: Todos }, policy: { apply: commit, placement: { kind: Ui.AsidePlacement, show: all, controls: direct, summary: none } } } }
