kind: Telo.Library
metadata:
  name: RecordStream
  version: 0.17.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Streaming, Observability, Storage]
  description: |
    Operations on streams of structured records, whatever the format: project a mixed
    record stream down to plain text, fan one stream out to two consumers, run a
    handler exactly once however a stream ends, and record a stream into a keyed,
    durable replay journal so a reader that disconnects, or outlives a restart, resumes
    from where it left off and tails live, with removal, retention, writer liveness and
    continuing a failed or abandoned recording.
exports:
  kinds:
    - ExtractText
    - Tee
    - EndHandler
    - OnComplete
    - JournalStore
    - MemoryJournalStore
    - Journal
    - JournalSink
    - JournalSource
    - JournalRemoval
    - JournalExpiry
  resources:
    - StreamOutcome
  # The entry point a dependent module's controller bundle resolves
  # `@telorun/record-stream` to: the store contract a backend implements and the
  # journal protocol, one module scope across this module and every backend.
  code:
    - specifier: "@telorun/record-stream"
      format: js
      path: ./nodejs/record-stream.mjs
      source: ./nodejs/src/index.ts
---
# Project a discriminated stream of records to a `Stream<string>`.
#
# Each item in `input` is matched on `record[discriminator]` against the
# `records` map. The matched entry's `do` action selects behaviour:
#
#   - `do: emit` — yield `record[field]` (which must be a string) downstream
#   - `do: drop` — silently skip the record
#   - `do: throw` — throw using `record[field]?.message ?? String(record[field])`
#
# Records whose discriminator value isn't listed throw `ERR_UNKNOWN_RECORD`.
kind: Telo.Definition
metadata:
  name: ExtractText
  description: >-
    Projects a stream of mixed record types down to a stream of plain text, deciding
    per record type whether to emit a field, drop it, or fail the stream.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/record-stream.mjs&local_path=./nodejs/src/index.ts#ExtractTextController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-type: Telo.Stream
        description: Async iterable of records to project.
    required: [input]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Async iterable of strings produced by the configured projection.
    required: [output]
    additionalProperties: false
schema:
  type: object
  properties:
    discriminator:
      title: Discriminator
      description: |
        Field name in each record whose value selects the action via the
        `records` map. Defaults to `type` (the universal JSON tagged-union
        convention).
      type: string
      default: type
    records:
      title: Records
      description: |
        Map from discriminator value to the action that handles it. Every
        record observed in the stream must have its discriminator value listed
        here, or the encoder throws `ERR_UNKNOWN_RECORD`.
      type: object
      additionalProperties:
        type: object
        properties:
          do:
            title: Action
            description: |
              `emit` extracts `record[field]` (must be a string) downstream.
              `drop` silently skips. `throw` raises with `record[field]?.message
              ?? String(record[field])`.
            type: string
            enum: [emit, drop, throw]
          field:
            title: Field
            description: |
              Record-key whose value is extracted by `emit` or referenced by
              `throw`. Required for those actions; ignored for `drop`.
            type: string
        required: [do]
        additionalProperties: false
  required: [records]
  additionalProperties: false
---
# Fan one input stream out to two consumers. Each output sees every item.
# When one consumer iterates ahead of the other, items are buffered in memory
# for the lagging consumer; bounded by the input stream's length.
kind: Telo.Definition
metadata:
  name: Tee
  description: Fans one input stream out to two output branches, each receiving every item in order.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/record-stream.mjs&local_path=./nodejs/src/index.ts#TeeController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-type: Telo.Stream
        description: Async iterable to fan out.
    required: [input]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      outputA:
        x-telo-type: Telo.Stream
        description: First fan-out branch — every item from `input` in order.
      outputB:
        x-telo-type: Telo.Stream
        description: Second fan-out branch — every item from `input` in order.
    required: [outputA, outputB]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
---
# How a stream ended, as a handler receives it: `completed` with no error,
# `failed` with the input's error, or `cancelled` — with the cancellation's
# error when its invocation was cancelled, with none when its consumer stopped
# reading. A handler types its `outcome` input against it by `!ref`.
kind: Telo.JsonSchema
metadata:
  name: StreamOutcome
  description: >-
    How a stream ended: completed, failed with the error that ended it, or
    cancelled, with the cancellation's error when the work was cancelled and none
    when its reader stopped early.
schema:
  type: object
  additionalProperties: false
  required: [state, error]
  properties:
    state:
      type: string
      enum: [completed, failed, cancelled]
    error:
      description: >-
        The error that ended the stream, as data — null when it completed or its
        consumer stopped reading.
      # The nullable form CEL recognises: reading a field of it unguarded is
      # CEL_NULLABLE_ACCESS.
      type: [object, "null"]
      additionalProperties: false
      required: [message]
      properties:
        code: { type: string }
        message: { type: string }
        data: {}
---
# Passthrough that runs a handler exactly once on whichever ending the stream
# reaches. Every item forwards to `output` in order as it arrives; the handler is
# called with the author's `inputs:` map, evaluated once per ending over three
# bindings — `records` (every item observed up to the ending), `context` (the
# caller's `context` input, `{}` when none) and `outcome`, a StreamOutcome:
#
#   - the input ran to its end              → completed, error null
#   - the input raised                      → failed, its code, message and data
#   - the invocation was cancelled          → cancelled, the ERR_INVOKE_CANCELLED error
#   - the consumer stopped reading          → cancelled, error null
#
# The handler runs on a context without the stream's cancellation, so it can still
# persist when the ending IS the cancellation. It is awaited before the ending
# reaches the consumer; a handler failure ends the stream with the handler's error,
# the original ending attached as its cause; so does a map that fails to evaluate.
# The map is checked against the handler's `inputType` like any other call site's
# arguments: a missing required key, a key a closed contract refuses and a
# mistyped literal are static errors. A durable
# suspension is not an ending:
# it passes through and the handler is not called. Records are buffered in memory,
# bounded by the input stream's length.
kind: Telo.Definition
metadata:
  name: EndHandler
  description: >-
    Forwards a stream live and runs a handler exactly once when it ends — completed,
    failed, cancelled or abandoned by its reader — with every record observed and
    how it ended. The handler still runs after a cancellation, so persisting a
    partial result, releasing a budget or marking work finished never depends on the
    stream succeeding.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/record-stream.mjs&local_path=./nodejs/src/index.ts#EndHandlerController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-type: Telo.Stream
        description: Async iterable to forward and observe.
      context:
        description: >-
          Caller data the handler's `inputs:` map reads as `context`; `{}` when the
          caller passes none.
        type: object
        additionalProperties: true
        default: {}
    required: [input]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type: Telo.Stream
        description: >-
          Every item from `input`, in order. Ends as the input does, once the
          handler has run; raises the input's error, the invocation's
          ERR_INVOKE_CANCELLED, or the handler's error when it fails.
    required: [output]
    additionalProperties: false
schema:
  type: object
  properties:
    handler:
      title: Handler
      description: >-
        Invocable or Runnable (e.g. a Run.Sequence) called exactly once when the
        stream ends, with the arguments `inputs` maps.
      x-telo-ref:
        kind: Telo.Executable
        use: trigger.consumer
        inputs: /inputs
    inputs:
      title: Handler inputs
      description: >-
        The handler's arguments, evaluated once per ending. CEL here reads
        `records` (every item observed), `outcome` (a StreamOutcome) and `context`
        (the caller's `context` input). Checked against the handler's `inputType`;
        a handler taking no arguments is written `inputs: {}`.
      type: object
      additionalProperties: true
      x-telo-context:
        type: object
        additionalProperties: false
        required: [records, outcome, context]
        properties:
          records:
            type: array
            description: Every item the stream carried up to its ending, in order.
          outcome:
            $ref: "telo://Self/StreamOutcome"
          context:
            type: object
            additionalProperties: true
            description: The caller's `context` input.
  required: [handler, inputs]
  additionalProperties: false
---
# Deprecated: RecordStream.EndHandler runs its handler on every ending of the stream,
# with how it ended; this kind runs it only on completion. Kept unchanged, with no
# migration, since the two call their handler with different inputs.
#
# Passthrough that fires a side effect once the input completes. Every item forwards
# to `output` in order as it arrives (the consumer streams live); when `input` runs to
# its end, the `handler` Invocable is called once with `{ records, context }` — records
# is the full list observed, context is the opaque caller data from the `context` input.
# The canonical use is persist-while-streaming: stream an AI/agent response to a client
# via `output` and, at end-of-stream, `handler` writes the turn to a store. Projection
# from records to the store's shape lives in `handler` (typically a Run.Sequence) — this
# kind does no CEL and knows nothing of the store. `handler` is not called if the input
# errors or the consumer cancels early. Records are buffered in memory, bounded by the
# input stream's length.
kind: Telo.Definition
metadata:
  name: OnComplete
  description: Forwards a stream live and, once it completes normally, invokes a handler once with all observed records.
  deprecated:
    reason: >-
      Runs its handler only when the stream completes, so a failed, cancelled or
      abandoned stream leaves no trace. Its replacement runs the handler on every
      ending and says which one it was.
    replacedBy: Self.EndHandler
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/record-stream.mjs&local_path=./nodejs/src/index.ts#OnCompleteController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-type: Telo.Stream
        description: Async iterable to forward and observe.
      context:
        description: Opaque caller data forwarded to the completion handler as `context`.
    required: [input]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Every item from `input`, in order.
    required: [output]
    additionalProperties: false
schema:
  type: object
  properties:
    handler:
      title: Handler
      description: >-
        Invocable or Runnable (e.g. a Run.Sequence) called once, after `input`
        completes normally, with `{ records, context }`. Not called if the input
        errors or the consumer cancels early.
      x-telo-ref:
        kind: Telo.Executable
        use: trigger.consumer
  required: [handler]
  additionalProperties: false
---
# RecordStream.JournalStore — the storage a journal runs over. A Telo.Provider: a
# configured store, referenced by a journal's `store:`. Normative contract:
# docs/store-contract.md.
#
#   read(key, fromId, limit)                → { header | null, entries } — one snapshot
#   putIfAbsent(key, value)                 → version | null
#   compareAndSet(key, version, value)      → version | null  (stamps the store clock)
#   compareAndAppend(key, version, record)  → { id, version } | null
#   compareAndTruncate(key, version, value) → version | null
#   compareAndDelete(key, version)          → boolean
#   scan(minAgeMs, cursor, limit)           → headers, oldest first
#   wait(key, version, timeoutMs, cancellation) → resolves on a version change,
#                                             the timeout or the cancellation;
#                                             never rejects on the last two
#
# Journal-agnostic: a header value and a record are opaque typed frames, and no
# backend names a journal state. The protocol lives once, in RecordStream.Journal
# (`@telorun/record-stream`), so no backend re-expresses the ownership guard.
kind: Telo.Abstract
metadata:
  name: JournalStore
  description: >-
    Storage for keyed, append-only record logs: per key a small versioned header and
    an ordered log with gap-free ids, read as one consistent snapshot, written only
    by conditional updates that report a lost race instead of failing, scanned by
    age, and waited on for changes. What a durable, resumable stream buffer needs.
capability: Telo.Provider
---
# The store in one process's memory: conditional writes are atomic because each
# runs to completion on the event loop. Nothing survives a restart.
kind: Telo.Definition
metadata:
  name: MemoryJournalStore
  description: >-
    Keeps resumable stream records in the running process's memory, with atomic
    conditional writes within that process and waiting readers woken on every
    change. Nothing is shared between instances or survives a restart, so it fits
    development, tests and single-process runs.
extends: Self.JournalStore
controllers:
  - pkg:telo/local/js?path=./nodejs/record-stream.mjs&local_path=./nodejs/src/index.ts#MemoryJournalStoreController
schema:
  type: object
  additionalProperties: false
---
# RecordStream.Journal — a keyed, offset-addressable replay journal over a store.
# A producer claims a key and streams records into it (JournalSink); a consumer
# reads from any id and tails live (JournalSource). The protocol — claims,
# heartbeats, terminal states, removal markers, expiry, the stale-writer rule —
# lives here, once, above whichever store `store:` names.
kind: Telo.Definition
metadata:
  name: Journal
  description: >-
    A keyed replay journal for detached streams: each key's records are kept in
    order with increasing ids, so a reader that disconnects, or comes back after a
    restart on a durable store, resumes exactly where it left off. Tracks whether
    each key is live, finished, failed, removed or abandoned by a writer that
    stopped sending heartbeats.
capability: Telo.Provider
controllers:
  - pkg:telo/local/js?path=./nodejs/record-stream.mjs&local_path=./nodejs/src/index.ts#JournalController
schema:
  type: object
  additionalProperties: false
  required: [store, retention]
  properties:
    store:
      title: Store
      description: >-
        Where the records live. An inline memory store keeps them for one process; a
        durable store keeps them across restarts and processes.
      x-telo-ref:
        kind: Self.JournalStore
        use: dependency
    retention:
      title: Retention
      description: >-
        How long a finished or failed key is kept after it ended before an expiry
        pass removes it — and how long the removal marker is then kept.
      x-telo-type: Telo.Duration
    # No `default:` — the kernel fills defaults without decoding them into an
    # instance type, so a written `30s` default fails validation at boot.
    writerTimeout:
      title: Writer timeout
      description: >-
        How long a writer may go without a heartbeat before its key is failed as
        abandoned; the writer sends one every third of it. 30s when omitted.
      x-telo-type: Telo.Duration
  x-telo-resource-rules:
    - condition: !cel "!has(self.writerTimeout) || duration(self.writerTimeout) > duration('0s')"
      code: RECORD_STREAM_WRITER_TIMEOUT_NOT_POSITIVE
      message: >-
        sets `writerTimeout` to zero or less; every writer would be judged abandoned
        before its first heartbeat.
    - condition: !cel "!has(self.retention) || duration(self.retention) >= duration('0s')"
      code: RECORD_STREAM_RETENTION_NEGATIVE
      message: sets a negative `retention`; a key cannot be kept for less than no time.
---
# Claim a key in a Journal, then drain a stream into it. The claim happens before
# the first record is pulled. With `resume: true` an existing key is continued
# rather than refused when its last writer failed or stopped heartbeating: the log
# is kept and ids continue from its last one. A heartbeat runs every third of the
# journal's writer timeout for as long as the drain does, records or not. On normal
# completion the key is finished; on an input error it is failed (the error's
# code, message and data recorded for readers) and the error rethrown. A refused
# write stops the drain, cancels the input and raises its code. Invoke it
# detached to run work in the background and hand the key to a reader.
#
# The input stream's own error is re-raised unchanged and is NOT in `throws:` —
# it is whatever the producer raises, which no literal list can name. So a
# `catches:` entry naming such a code is UNDECLARED_THROW_CODE at `telo check`,
# and a trace records the failed drain as InvokeRejected.Undeclared.
kind: Telo.Definition
metadata:
  name: JournalSink
  description: >-
    Drains a stream into the replay journal under a key it claims first, appending
    each record with an increasing id and marking the key finished or failed when
    the stream ends. Sends heartbeats while it runs, so readers can tell a slow
    writer from a dead one, and can resume a recording whose writer failed or died,
    continuing its ids so readers pick up where they stopped.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/record-stream.mjs&local_path=./nodejs/src/index.ts#JournalSinkController
throws:
  codes:
    ERR_INVALID_INPUT:
      description: "`input` did not resolve to a stream."
    ERR_JOURNAL_KEY_BUSY:
      description: >-
        The key already exists and belongs to another writer — live, finished or,
        without `resume`, failed. Raised when claiming it, before any record is
        pulled, or later if another writer took it.
    ERR_JOURNAL_KEY_REMOVED:
      description: The key was removed, before the claim or while the drain ran.
    ERR_JOURNAL_WRITER_LOST:
      description: >-
        The key was failed as abandoned because this writer's heartbeat was older
        than its timeout; its next write is refused.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [key, input]
    properties:
      key:
        type: string
        minLength: 1
        description: Key to claim and append under (e.g. a turn id).
      input:
        x-telo-type: Telo.Stream
        description: Async iterable of records to journal.
      resume:
        type: boolean
        default: false
        description: >-
          Continue the key instead of refusing it when it exists and its last writer
          failed, or its writer stopped heartbeating (that key is failed as lost
          first). The records already there are kept and new ids follow the last
          one. A key with a live writer, a finished key and a removed key are still
          refused.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [key, count]
    properties:
      key: { type: string }
      count:
        type: integer
        description: Number of records this drain appended before the stream completed.
schema:
  type: object
  additionalProperties: false
  required: [journal]
  properties:
    journal:
      title: Journal
      description: The journal to write into.
      x-telo-ref:
        kind: Self.Journal
        use: dependency
---
# Read a key back from a Journal: `{ id, data }` entries with id greater than
# `fromId` (0 replays from the start), then the key's state decides — tail while
# live, end once finished, raise the recorded error once failed, raise
# ERR_JOURNAL_WRITER_LOST once its writer is judged dead, raise
# ERR_JOURNAL_KEY_REMOVED once removed. A key never written is waited for.
#
# Only ERR_JOURNAL_KEY_REMOVED at open is raised by the call itself, so only it
# is in `throws:`; everything else is raised by the returned stream, and listed
# on `output`. The stream ends when its consumer stops, and raises
# ERR_INVOKE_CANCELLED when this invocation is cancelled.
kind: Telo.Definition
metadata:
  name: JournalSource
  description: >-
    Reads a recorded stream back from a given offset, replaying what was missed and
    then following it live until it finishes — how a reconnecting client picks up
    exactly where it dropped. A failed stream re-raises its recorded error, and a
    removed or abandoned one says so with a distinct code.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/record-stream.mjs&local_path=./nodejs/src/index.ts#JournalSourceController
# `throws:` is what the CALL raises; the stream it returns raises later, where
# no `catches:` for this call can see it — so the stream's codes are listed on
# `output` instead.
throws:
  codes:
    ERR_JOURNAL_KEY_REMOVED:
      description: Raised by the call when the key is already removed at open.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [key]
    properties:
      key:
        type: string
        minLength: 1
        description: Key to read.
      fromId:
        type: integer
        minimum: 0
        default: 0
        description: Yield entries with id greater than this (0 = from the start).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-type: Telo.Stream
        description: >-
          Async iterable of `{ id, data }` entries, then live tail until the key
          ends. Raised by the stream, not the call: ERR_JOURNAL_KEY_REMOVED when the
          key is removed or expired mid-read, ERR_JOURNAL_WRITER_LOST when its writer
          stopped heartbeating, a failed key's recorded error with its original
          code, and ERR_INVOKE_CANCELLED when the reading invocation is cancelled.
          Ends when its consumer stops.
schema:
  type: object
  additionalProperties: false
  required: [journal]
  properties:
    journal:
      title: Journal
      description: The journal to read from.
      x-telo-ref:
        kind: Self.Journal
        use: dependency
---
kind: Telo.Definition
metadata:
  name: JournalRemoval
  description: >-
    Removes one recorded stream by key: its records are deleted and readers are
    told it was removed rather than left waiting. Reports whether the key was
    removed or was never there; removing it twice reports removed again.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/record-stream.mjs&local_path=./nodejs/src/index.ts#JournalRemovalController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [key]
    properties:
      key:
        type: string
        minLength: 1
        description: Key to remove.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [outcome]
    properties:
      outcome:
        type: string
        enum: [removed, unknown]
        description: "`removed` — the key is removed (also when it already was); `unknown` — no such key."
schema:
  type: object
  additionalProperties: false
  required: [journal]
  properties:
    journal:
      title: Journal
      description: The journal to remove the key from.
      x-telo-ref:
        kind: Self.Journal
        use: dependency
---
# One expiry pass. A provider performs no observable I/O at init and has no run(),
# so the journal owns no timer: an application triggers this from its scheduler.
kind: Telo.Definition
metadata:
  name: JournalExpiry
  description: >-
    Applies a replay journal's retention: deletes the records of every stream that
    finished or failed longer ago than the retention window, fails streams whose
    writer stopped sending heartbeats, and returns how many streams it removed. Run
    it on a schedule.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/record-stream.mjs&local_path=./nodejs/src/index.ts#JournalExpiryController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [count]
    properties:
      count:
        type: integer
        description: Number of finished or failed keys whose records this pass removed.
schema:
  type: object
  additionalProperties: false
  required: [journal]
  properties:
    journal:
      title: Journal
      description: The journal whose retention to apply.
      x-telo-ref:
        kind: Self.Journal
        use: dependency
