modules:
  apps/hub: Added
body: GET /search/modules takes deprecated and contractOnly (include, the default, or
  exclude), applied before the page is cut, so total and every page count what is
  listed; the response echoes both and reports what they left out as hidden.deprecated
  and hidden.contractOnly. total is now reported for a page with no hits. GET
  /dependents is paged with limit (1 to 100, default 50) and offset and reports total;
  find_dependents takes the same two arguments and returns each importer as ref, name
  and a one-sentence summary instead of its whole description. The search resource
  refuses a sort outside relevance, name and recent for every caller, not only on the
  HTTP route.
