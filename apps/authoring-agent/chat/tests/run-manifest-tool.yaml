kind: Telo.Application
metadata:
  name: ChatRunTestsTool
  version: 1.0.0
  description: |
    The `run_manifest` gate, without any AI. Executing a manifest is the one thing
    the agent can do that is arbitrary code execution, so whether it is allowed
    is a single operator switch rather than an entry in the verb list — and the
    switch is only worth having if it is closed by default and actually closes.
    These assert that it refuses before spawning anything when off, and composes
    exactly `<program> run <path>` when on.

    No model and no API key: the tool never reaches Anthropic, and `echo` stands in
    for the CLI so the argv itself is what gets asserted (the `telo-cli-tool`
    precedent — it also drops a dependency on which interpreter CI happens to
    run).
imports:
  Mcp: ../../../../modules/mcp-client
  ChatOff:
    source: ../
    resources:
      hub: !ref hub
    secrets:
      anthropicApiKey: dummy-key-never-used
    needs:
      agentState: { path: !cel "variables.scratch.joinPath('state-off')" }
    variables:
      workspaceDir: !cel "variables.scratch.joinPath('workspace')"
      teloProgram: [echo]
      # The default, restated: what this case asserts is that the default is the
      # closed one, so reading it from the library would assert nothing.
      allowManifestRuns: false
  ChatOn:
    source: ../
    resources:
      hub: !ref hub
    secrets:
      anthropicApiKey: dummy-key-never-used
    needs:
      agentState: { path: !cel "variables.scratch.joinPath('state-on')" }
    variables:
      workspaceDir: !cel "variables.scratch.joinPath('workspace')"
      teloProgram: [echo]
      allowManifestRuns: true
  Run: ../../../../modules/run
  Assert: oci://ghcr.io/telorun/assert@0.22.0#sha256-72ysePrZIFbPDsX6TdpS4vCuzCnGCx_KVDUunxJ_0OU
variables:
  # Where this case's workspace and agent state live — the library takes both
  # as host paths, and neither is ever read here beyond the spawned program's cwd.
  scratch:
    env: CHAT_TEST_RUN_MANIFEST_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/run-manifest-tool
targets:
  # The workspace is gitignored, so a fresh checkout has none — and every
  # command spawns with it as cwd.
  - !ref ChatOff.ensureWorkspace
  - !ref testRefusedWhenOff
  - !ref testRunsWhenOn
---
# The hub the chat library discovers modules through.
kind: Mcp.HttpClient
metadata: { name: hub }
url: https://telo.sh/mcp
clientInfo: { name: authoring-agent-test, version: 0.0.0 }
---
# Off is the default, and it must refuse BEFORE anything is spawned — an error
# the agent can read and act on, not a silent no-op.
kind: Run.Sequence
metadata: { name: testRefusedWhenOff }
steps:
  - name: attempt
    try:
      - name: run
        invoke: !ref ChatOff.runManifest
        inputs:
          path: apps/todo/tests/telo.yaml
      # Reaching here means the guard did NOT fire and the program was spawned.
      # Without this the case passes green having asserted nothing: `echo`
      # succeeds, no error is raised, and `catch:` never runs — so the one thing
      # this exists to prove, that the default closes, would go unchecked.
      - name: guardDidNotFire
        throw:
          code: ERR_GUARD_DID_NOT_FIRE
          message: runManifest ran the program with allowManifestRuns off.
    catch:
      - name: assertCode
        invoke: { kind: Assert.Equals }
        inputs:
          actual: !cel "error.code"
          expected: ERR_MANIFEST_RUNS_NOT_ALLOWED
---
# On, the verb is FIXED and the agent's path is one argument appended to it.
# Pinning the whole line is what catches the two ways this could go wrong: a
# dropped program prefix, and a path that reached the shell as anything but a
# single argument.
kind: Run.Sequence
metadata: { name: testRunsWhenOn }
steps:
  - name: run
    invoke: !ref ChatOn.runManifest
    inputs:
      path: apps/todo/tests/telo.yaml
  - name: assertArgv
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        exitCode: !cel "steps.run.result.exitCode"
        argv: !cel "trim(steps.run.result.output)"
      expected:
        exitCode: 0
        argv: "run apps/todo/tests/telo.yaml"
