# A stand-in origin, as the hub's origin reads see it: run as
# `<teloCommand> module versions <ref> --json --digests` or
# `<teloCommand> module manifest <ref>@<version> --json`, it answers with what is
# recorded for that ref. Modules the hub must refuse:
#
# - `oci://example.test/stale-app@1.0.0`: a Telo.Application as a CLI that
#   predates the `application` field reports it — everything else
#   `telo module manifest --json` reports, and no contract.
# - `oci://example.test/definition-root@1.0.0` (ingested) and
#   `oci://example.test/definition-first` (registered, one version, 1.0.0): a file
#   whose first document is a Telo.Definition, followed by a versioned
#   Telo.Library.
# - `oci://example.test/not-telo@0.119.0`: the built-in vocabulary, served at a
#   ref other than the one the hub tracks it at.
#
# - `oci://example.test/with-candidate` (1.0.0-rc.1, 1.0.0): a final and its
#   release candidate; the hub indexes finals only and drops a candidate it
#   already indexed. Its manifests are never read.
#
# - the advisory fixtures, answered to `module sbom <ref>@<version>` as the CLI
#   answers: a record, or the SBOM_INCOMPLETE refusal of an artifact that has
#   none. `web` (1.1.0, 1.0.0) ships @fastify/static 10.1.1 / 10.1.0; `shop`
#   pins web 1.0.0; `legacy` and the `oldshop` pinning it were published before
#   the record; `embeds` ships an embedded SQLite (`pkg:generic`), at two
#   revisions and none, and a zlib whose `vcs_url` names no commit, and the
#   `sqlshop` pinning it.
#
# - the nested-module fixtures, answered as the CLI answers a ref naming a module
#   inside an artifact (`oci://<repo>@sha256:<digest>/<path>`, the digest the
#   ingest test gives: `sha256:<version>`), `module manifest` in its text form
#   and `module sbom`: `nestshop` imports `./chat`, which imports `../tools`
#   (shipping @fastify/static 10.1.0) and web 1.1.0 by its pin; `nestlegacy`
#   imports `./old`, published before the record.
#
# And the built-in vocabulary at the ref the hub's tests track it at, with a
# module written against it:
#
# - `oci://example.test/telo` (0.120.0-rc.1, 0.119.0, 0.118.0): the candidate
#   has no recorded manifest, since the hub must never read it. `builtins-0.119.0.yaml` is the
#   archive the renderer writes (`analyzer/nodejs/src/builtin-vocabulary/`), as
#   `telo publish` publishes it — its `layers:` index appended to the root
#   document; `builtins-0.118.0.yaml` an older, smaller one with a different
#   `Step`. 0.119.0 is reported as `telo module manifest --json` reports a
#   `Telo.Builtins` root (`runtime: null`, `application: null`), 0.118.0 as a
#   CLI predating the archive would, with a runtime block the hub must not
#   record.
# - `oci://example.test/vocab-user@1.0.0`: `vocab-user.yaml`, kinds naming
#   fragments, a value type, zone attributes, a format and a `Telo.<Kind>`
#   parent, and a need type.
kind: Telo.Application
metadata:
  name: RecordedOrigin
  version: 1.0.0
  description: >-
    Answers the hub's `telo module versions --json --digests` and `telo module
    manifest --json` reads with what is recorded for the requested ref.
imports:
  Console: oci://ghcr.io/telorun/console@0.19.5#sha256-aWnhpC9EodktO29y8zxc5YeFvgMwYD1bP0NkRsK2lic
  Run: oci://ghcr.io/telorun/run@0.35.1#sha256-m6oA-tLMj4v0JvzkvRt17CBuWzXSYpumtxyNRb3qVz8
variables:
  group: { type: string, arg: { position: 0 }, default: "" }
  verb: { type: string, arg: { position: 1 }, default: "" }
  ref: { type: string, arg: { position: 2 }, default: "" }
  json: { type: boolean, arg: json, default: false }
  digests: { type: boolean, arg: digests, default: false }
targets:
  - !ref answer
---
kind: Run.Sequence
metadata: { name: answer }
steps:
  - name: verbGate
    if: !cel >-
      variables.group != 'module'
        || !((variables.verb == 'versions' && variables.json && variables.digests)
             || (variables.verb == 'manifest' && !variables.digests)
             || (variables.verb == 'sbom' && !variables.json && !variables.digests))
    then:
      - name: refuse
        throw:
          code: ERR_FIXTURE_UNSUPPORTED_READ
          message: !interpolate "this origin answers only `module versions <ref> --json --digests`, `module manifest <ref> [--json]` and `module sbom <ref>`, not `${{ variables.group }} ${{ variables.verb }}`"
  # What `module versions --digests` reports, newest first.
  - name: versions
    value:
      oci://example.test/definition-first:
        - { version: 1.0.0, digest: sha256:definition-first-1.0.0 }
      oci://example.test/telo:
        - { version: 0.120.0-rc.1, digest: sha256:telo-0.120.0-rc.1 }
        - { version: 0.119.0, digest: sha256:telo-0.119.0 }
        - { version: 0.118.0, digest: sha256:telo-0.118.0 }
      oci://example.test/not-telo:
        - { version: 0.119.0, digest: sha256:not-telo-0.119.0 }
      oci://example.test/with-candidate:
        - { version: 1.0.0-rc.1, digest: sha256:with-candidate-1.0.0-rc.1 }
        - { version: 1.0.0, digest: sha256:with-candidate-1.0.0 }
  # What `module manifest` reports.
  - name: manifests
    value:
      oci://example.test/stale-app@1.0.0:
        ref: oci://example.test/stale-app@1.0.0
        cacheKey: oci/example.test/stale-app/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Application
          metadata:
            name: StaleApp
            version: 1.0.0
          variables:
            greeting:
              env: GREETING
              type: string
              default: hello
        integrity: sha256-VhS4Qh8GkpaS4kW0l3PhD1Zz1yJ0jH8dG0Ybq1c2b2E
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/definition-root@1.0.0:
        ref: oci://example.test/definition-root@1.0.0
        cacheKey: oci/example.test/definition-root/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Definition
          metadata:
            name: Greeter
          capability: Telo.Invocable
          schema:
            type: object
          ---
          kind: Telo.Library
          metadata:
            name: DefinitionRoot
            version: 1.0.0
        integrity: sha256-2mcx3BNE8y0FfpWZw3YkM8Vh2cHgqS0b1Zk6nHnAq0Q
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/definition-first@1.0.0:
        ref: oci://example.test/definition-first@1.0.0
        cacheKey: oci/example.test/definition-first/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Definition
          metadata:
            name: Greeter
          capability: Telo.Invocable
          schema:
            type: object
          ---
          kind: Telo.Library
          metadata:
            name: DefinitionFirst
            version: 1.0.0
        integrity: sha256-QYx3n0Jm0p4Y0z4mJmQy6m7l3oK0kQqg5W5m7q8r9s0
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/telo@0.119.0:
        ref: oci://example.test/telo@0.119.0
        cacheKey: oci/example.test/telo/0.119.0/telo.yaml
        manifest: !include-text builtins-0.119.0.yaml
        integrity: sha256-5d2nyy2aZq4WmKk6Rk2kC0Jd1C3rdZQbKkn2tYmD2Yc
        runtime: null
        application: null
      oci://example.test/telo@0.118.0:
        ref: oci://example.test/telo@0.118.0
        cacheKey: oci/example.test/telo/0.118.0/telo.yaml
        manifest: !include-text builtins-0.118.0.yaml
        integrity: sha256-mXJ0R3o0bXOJjFQd8m1nE3xZ2y6dJp9w8YkUuQ8xX0E
        # As a CLI that predates the archive reports it: a runtime block, read
        # off documents that name no controllers.
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
        application: null
      oci://example.test/not-telo@0.119.0:
        ref: oci://example.test/not-telo@0.119.0
        cacheKey: oci/example.test/not-telo/0.119.0/telo.yaml
        manifest: !include-text builtins-0.119.0.yaml
        integrity: sha256-5d2nyy2aZq4WmKk6Rk2kC0Jd1C3rdZQbKkn2tYmD2Yc
        runtime: null
        application: null
      oci://example.test/vocab-user@1.0.0:
        ref: oci://example.test/vocab-user@1.0.0
        cacheKey: oci/example.test/vocab-user/1.0.0/telo.yaml
        manifest: !include-text vocab-user.yaml
        integrity: sha256-Vd6YqJ8n5m2cQf0bQ1oH0j3m2d4oKq5fX9yW8a7cB6E
        runtime:
          runtimes: { nodejs: full }
          languages: [javascript]
          portable: false
          kinds:
            - { name: Steps, runtimes: [nodejs], languages: [javascript], portable: false }
            - { name: Sink, runtimes: [nodejs], languages: [javascript], portable: false }
            - { name: Access, runtimes: [nodejs], languages: [], portable: false }
        application: null
      oci://example.test/web@1.0.0:
        ref: oci://example.test/web@1.0.0
        cacheKey: oci/example.test/web/1.0.0/telo.yaml
        manifest: !include-text web-1.0.0.yaml
        integrity: sha256-Hc2nT7yU4oB9eR1wL6kZ3mX8vP5aJ0dGfS2qN7iKtE4
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/web@1.1.0:
        ref: oci://example.test/web@1.1.0
        cacheKey: oci/example.test/web/1.1.0/telo.yaml
        manifest: !include-text web-1.1.0.yaml
        integrity: sha256-q8Vd1kR3mZ7wT2pXc5LbN9fH4jE6sA0uYgK1oQ3iWzM
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/legacy@1.0.0:
        ref: oci://example.test/legacy@1.0.0
        cacheKey: oci/example.test/legacy/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Library
          metadata:
            name: Legacy
            version: 1.0.0
        integrity: sha256-Z3aQs8Q0qiXMrxwC8RFylKFbxqMv4BE1d1wJ_akPtb8
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/embeds@1.0.0:
        ref: oci://example.test/embeds@1.0.0
        cacheKey: oci/example.test/embeds/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Library
          metadata:
            name: Embeds
            version: 1.0.0
          layers: [{ role: sbom, blob: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", integrity: "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }]
        integrity: sha256-Vq3J8nR2xT5mL9cK1wF7hD4pZ6sA0eY2uG8bN3iQ5oE
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/shop@1.0.0:
        ref: oci://example.test/shop@1.0.0
        cacheKey: oci/example.test/shop/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Library
          metadata:
            name: Shop
            version: 1.0.0
          imports:
            Web: oci://example.test/web@1.0.0#sha256-Hc2nT7yU4oB9eR1wL6kZ3mX8vP5aJ0dGfS2qN7iKtE4
          layers: [{ role: sbom, blob: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", integrity: "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }]
        integrity: sha256-2mcx3BNE8y0FfpWZw3YkM8Vh2cHgqS0b1Zk6nHnAq0Q
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/oldshop@1.0.0:
        ref: oci://example.test/oldshop@1.0.0
        cacheKey: oci/example.test/oldshop/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Library
          metadata:
            name: Oldshop
            version: 1.0.0
          imports:
            Legacy: oci://example.test/legacy@1.0.0#sha256-Z3aQs8Q0qiXMrxwC8RFylKFbxqMv4BE1d1wJ_akPtb8
          layers: [{ role: sbom, blob: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", integrity: "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }]
        integrity: sha256-5d2nyy2aZq4WmKk6Rk2kC0Jd1C3rdZQbKkn2tYmD2Yc
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/sqlshop@1.0.0:
        ref: oci://example.test/sqlshop@1.0.0
        cacheKey: oci/example.test/sqlshop/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Library
          metadata:
            name: Sqlshop
            version: 1.0.0
          imports:
            Embeds: oci://example.test/embeds@1.0.0#sha256-Vq3J8nR2xT5mL9cK1wF7hD4pZ6sA0eY2uG8bN3iQ5oE
          layers: [{ role: sbom, blob: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", integrity: "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }]
        integrity: sha256-VhS4Qh8GkpaS4kW0l3PhD1Zz1yJ0jH8dG0Ybq1c2b2E
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/nestshop@1.0.0:
        ref: oci://example.test/nestshop@1.0.0
        cacheKey: oci/example.test/nestshop/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Library
          metadata:
            name: Nestshop
            version: 1.0.0
          imports:
            Chat: ./chat#sha256-Cq3J8nR2xT5mL9cK1wF7hD4pZ6sA0eY2uG8bN3iQ5oE
          layers: [{ role: sbom, blob: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", integrity: "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }]
        integrity: sha256-Nq3J8nR2xT5mL9cK1wF7hD4pZ6sA0eY2uG8bN3iQ5oE
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
      oci://example.test/nestlegacy@1.0.0:
        ref: oci://example.test/nestlegacy@1.0.0
        cacheKey: oci/example.test/nestlegacy/1.0.0/telo.yaml
        manifest: |
          kind: Telo.Library
          metadata:
            name: Nestlegacy
            version: 1.0.0
          imports:
            Old: ./old#sha256-Oq3J8nR2xT5mL9cK1wF7hD4pZ6sA0eY2uG8bN3iQ5oE
          layers: [{ role: sbom, blob: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", integrity: "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }]
        integrity: sha256-Lq3J8nR2xT5mL9cK1wF7hD4pZ6sA0eY2uG8bN3iQ5oE
        runtime: { runtimes: {}, languages: [], portable: true, kinds: [] }
  # What `module manifest` prints in its text form, for a module nested in an
  # artifact, keyed by its identity.
  - name: nestedManifests
    value:
      oci://example.test/nestshop@sha256:1.0.0/chat: |
        kind: Telo.Library
        metadata:
          name: Chat
          version: 1.0.0
        imports:
          Tools: ../tools#sha256-Tq3J8nR2xT5mL9cK1wF7hD4pZ6sA0eY2uG8bN3iQ5oE
          Web: oci://example.test/web@1.1.0#sha256-q8Vd1kR3mZ7wT2pXc5LbN9fH4jE6sA0uYgK1oQ3iWzM
        layers: [{ role: sbom, blob: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", integrity: "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }]
      oci://example.test/nestshop@sha256:1.0.0/tools: |
        kind: Telo.Library
        metadata:
          name: Tools
          version: 1.0.0
        layers: [{ role: sbom, blob: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", integrity: "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }]
      oci://example.test/nestlegacy@sha256:1.0.0/old: |
        kind: Telo.Library
        metadata:
          name: Old
          version: 1.0.0
  # What `module sbom` reports, keyed by the pinned ref: the record as the CLI
  # prints it. A ref with no entry is an artifact published without one.
  - name: sboms
    value:
      oci://example.test/web@1.0.0:
        bomFormat: CycloneDX
        specVersion: "1.6"
        version: 1
        metadata: { component: { type: library, name: Web, version: 1.0.0 } }
        components:
          - type: library
            bom-ref: pkg:npm/%40fastify/static@10.1.0
            name: "@fastify/static"
            version: 10.1.0
            purl: pkg:npm/%40fastify/static@10.1.0
            properties: [{ name: "telo:layer", value: "role=library" }]
      oci://example.test/web@1.1.0:
        bomFormat: CycloneDX
        specVersion: "1.6"
        version: 1
        metadata: { component: { type: library, name: Web, version: 1.1.0 } }
        components:
          - type: library
            bom-ref: pkg:npm/%40fastify/static@10.1.1
            name: "@fastify/static"
            version: 10.1.1
            purl: pkg:npm/%40fastify/static@10.1.1
            properties: [{ name: "telo:layer", value: "role=library" }]
      oci://example.test/embeds@1.0.0:
        bomFormat: CycloneDX
        specVersion: "1.6"
        version: 1
        metadata: { component: { type: library, name: Embeds, version: 1.0.0 } }
        components:
          - type: library
            bom-ref: pkg:generic/sqlite@3.51.3
            name: sqlite
            version: 3.51.3
            purl: pkg:generic/sqlite@3.51.3
            cpe: "cpe:2.3:a:sqlite:sqlite:3.51.3:*:*:*:*:*:*:*"
            properties: [{ name: "telo:layer", value: "role=native;abi=node-141;arch=amd64;format=node;libc=gnu;os=linux" }]
          # The same version at two revisions: two components.
          - type: library
            bom-ref: pkg:generic/sqlite@3.51.3?vcs_url=git%2Bhttps%3A%2F%2Fgithub.com%2Fsqlite%2Fsqlite%40a5333afb9ad1aa473f8963b92caeaa955f47dc74
            name: sqlite
            version: 3.51.3
            purl: pkg:generic/sqlite@3.51.3?vcs_url=git%2Bhttps%3A%2F%2Fgithub.com%2Fsqlite%2Fsqlite%40a5333afb9ad1aa473f8963b92caeaa955f47dc74
            properties: [{ name: "telo:layer", value: "role=assets" }]
          - type: library
            bom-ref: pkg:generic/sqlite@3.51.3?vcs_url=git%2Bhttps%3A%2F%2Fgithub.com%2Fsqlite%2Fsqlite%400b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c
            name: sqlite
            version: 3.51.3
            purl: pkg:generic/sqlite@3.51.3?vcs_url=git%2Bhttps%3A%2F%2Fgithub.com%2Fsqlite%2Fsqlite%400b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c
            properties: [{ name: "telo:layer", value: "role=assets" }]
          # A vcs_url qualifier with no `@<commit>`: no repository, and no failed ingest.
          - type: library
            bom-ref: pkg:generic/zlib@1.3.1?vcs_url=git%2Bhttps%3A%2F%2Fgithub.com%2Fmadler%2Fzlib
            name: zlib
            version: 1.3.1
            purl: pkg:generic/zlib@1.3.1?vcs_url=git%2Bhttps%3A%2F%2Fgithub.com%2Fmadler%2Fzlib
            properties: [{ name: "telo:layer", value: "role=assets" }]
          - type: library
            bom-ref: pkg:npm/kysely@0.28.15
            name: kysely
            version: 0.28.15
            purl: pkg:npm/kysely@0.28.15
            properties: [{ name: "telo:layer", value: "role=controller;format=js" }]
      oci://example.test/shop@1.0.0:
        bomFormat: CycloneDX
        specVersion: "1.6"
        version: 1
        metadata: { component: { type: library, name: Shop, version: 1.0.0 } }
      oci://example.test/nestshop@1.0.0:
        bomFormat: CycloneDX
        specVersion: "1.6"
        version: 1
        metadata: { component: { type: library, name: Nestshop, version: 1.0.0 } }
      oci://example.test/nestlegacy@1.0.0:
        bomFormat: CycloneDX
        specVersion: "1.6"
        version: 1
        metadata: { component: { type: library, name: Nestlegacy, version: 1.0.0 } }
      oci://example.test/nestshop@sha256:1.0.0/chat:
        bomFormat: CycloneDX
        specVersion: "1.6"
        version: 1
        metadata: { component: { type: library, name: Chat, version: 1.0.0 } }
      oci://example.test/nestshop@sha256:1.0.0/tools:
        bomFormat: CycloneDX
        specVersion: "1.6"
        version: 1
        metadata: { component: { type: library, name: Tools, version: 1.0.0 } }
        components:
          - type: library
            bom-ref: pkg:npm/%40fastify/static@10.1.0
            name: "@fastify/static"
            version: 10.1.0
            purl: pkg:npm/%40fastify/static@10.1.0
            properties: [{ name: "telo:layer", value: "role=library" }]
      oci://example.test/oldshop@1.0.0:
        bomFormat: CycloneDX
        specVersion: "1.6"
        version: 1
        metadata: { component: { type: library, name: Oldshop, version: 1.0.0 } }
      oci://example.test/sqlshop@1.0.0:
        bomFormat: CycloneDX
        specVersion: "1.6"
        version: 1
        metadata: { component: { type: library, name: Sqlshop, version: 1.0.0 } }
  - name: sbomGate
    if: !cel "variables.verb == 'sbom' && !(variables.ref in steps.sboms.result)"
    then:
      - name: noRecord
        throw:
          code: SBOM_INCOMPLETE
          message: !interpolate "${{ variables.ref }} was published without a software bill of materials"
  - name: recorded
    value: !cel >-
      variables.verb == 'versions' ? steps.versions.result
        : (variables.verb == 'sbom' ? steps.sboms.result
            : (variables.json ? steps.manifests.result : steps.nestedManifests.result))
  - name: refGate
    if: !cel "!(variables.ref in steps.recorded.result)"
    then:
      - name: unknownRef
        throw:
          code: ERR_FIXTURE_UNSUPPORTED_READ
          message: !interpolate "this origin records no `${{ variables.verb }}` answer for ${{ variables.ref }}"
  - name: print
    invoke: !ref Console.write
    inputs:
      output: !cel >-
        variables.verb == 'manifest' && !variables.json
          ? steps.recorded.result[variables.ref]
          : json(steps.recorded.result[variables.ref]) + '\n'
