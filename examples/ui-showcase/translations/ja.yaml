# The showcase in Japanese: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads and translated into Japanese's single form, `other`, with an `=0` case
# where it reads better; a word told apart by its context is translated once
# per context.
kind: I18n.Catalog
metadata:
  name: japanese
lang: ja
texts:
  # Applications and pages.
  - { text: UI showcase, translation: "UI ショーケース" }
  - { text: UI showcase — Radix, translation: "UI ショーケース — Radix" }
  - { text: UI showcase — brand, translation: "UI ショーケース — ブランド" }
  - { text: UI showcase — sidebar, translation: "UI ショーケース — サイドバー" }
  - { text: Overview, translation: "概要" }
  - { text: Conditions, translation: "条件" }
  - { text: Data, translation: "データ" }
  - { text: Tables, translation: "テーブル" }
  - { text: Filters, translation: "フィルター" }
  - { text: Forms, translation: "フォーム" }
  - { text: Actions, translation: "アクション" }
  - { text: Components, translation: "コンポーネント" }
  - { text: CRUD, translation: "CRUD" }
  - { text: Themes, translation: "テーマ" }
  # The navigation's groups.
  - { text: Building blocks, translation: "構成要素" }
  - { text: Input, translation: "入力" }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: "UI ショーケースのロゴ" }
  - { text: Language, translation: "言語" }
  - { text: Theme, translation: "テーマ" }
  - { text: Default, translation: "デフォルト" }
  - { text: Radix, translation: "Radix" }
  - { text: Brand, translation: "ブランド" }
  - { text: Sidebar, translation: "サイドバー" }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: "リクエストごと" }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "これらのノードはページ自身のものなので、when とテキストはリクエストごとに評価されます。" }
  - { text: Your browser asked for Polish., translation: "ブラウザーはポーランド語を要求しました。" }
  - { text: Your browser did not ask for Polish., translation: "ブラウザーはポーランド語を要求しませんでした。" }
  - { text: The Acme brand is on., translation: "Acme ブランドが有効です。" }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "式で算出されたテキストは算出されたとおりに表示され、翻訳されることはありません。" }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "このリクエストによって無効になったリンクはエラーノードに置き換えられ、ページの残りはそのまま配信されます。" }
  - { text: Leaves the application, translation: "アプリケーションの外へ移動します" }

  # The overview.
  - { text: Every node type, translation: "すべてのノード種別" }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "ボックス、スタック、カラムは他のノードを含み、それぞれ独自の方法で子を描画します。" }
  - { text: A box, translation: "ボックス" }
  - { text: Groups its children., translation: "子をグループにまとめます。" }
  - { text: A stack, translation: "スタック" }
  - { text: Draws its children one under another., translation: "子を縦に並べて描画します。" }
  - { text: A badge, translation: "バッジ" }
  - { text: Columns, translation: "カラム" }
  - { text: "Draw their children side by side, as these three are.", translation: "この 3 つのように、子を横に並べて描画します。" }
  - { text: Text in each style, translation: "各スタイルのテキスト" }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "スタイルはノードの意味を表し、その見た目はテーマが決めます。1 つのノードに複数のスタイルを付けられます。" }
  - { text: Heading, translation: "見出し" }
  - { text: Subheading, translation: "小見出し" }
  - { text: Muted, translation: "控えめ" }
  - { text: Strong, translation: "強調" }
  - { text: Accent, translation: "アクセント" }
  - { text: Danger, translation: "危険" }
  - { text: Warning, translation: "警告" }
  - { text: Success, translation: "成功" }
  - { text: Strong and accent, translation: "強調とアクセント" }
  - { text: Links, translation: "リンク" }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "宣言されたページへのリンクはアプリケーション内で移動します。マウント配下で配信されるファイルへのリンクは通常の読み込みになり、https と mailto はアプリケーションの外へ移動します。" }
  - { text: Go to Conditions, translation: "条件へ移動" }
  - { text: A file the server serves, translation: "サーバーが配信するファイル" }
  - { text: Write to us, translation: "お問い合わせ" }
  - { text: Images, translation: "画像" }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "アドレスで指定した画像、空の alt を持つ装飾としての同じ画像、そしてページに挿入されることなく画像として描画される SVG マークアップです。" }
  - { text: The showcase mark, translation: "ショーケースのマーク" }
  - { text: Three overlapping circles, translation: "重なり合う 3 つの円" }
  - { text: Values by their schema, translation: "スキーマに基づく値" }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "各値はページが読み込むチームのレコードから読み取られ、モデルのプロパティが示すとおりに描画されます。" }
  - { text: Visit the team homepage, translation: "チームのホームページへ" }
  - { text: "A uri, drawn as a link with a text of its own", translation: "独自のテキストを持つリンクとして描画される uri" }
  - { text: A uri-reference to a declared page, translation: "宣言されたページへの uri-reference" }
  - { text: A uri-reference to a served file, translation: "配信されるファイルへの uri-reference" }
  - { text: A mailto address, translation: "mailto アドレス" }
  - { text: "An address the rule refuses, drawn as plain text", translation: "ルールで拒否され、プレーンテキストとして描画されるアドレス" }
  - { text: A date, translation: "日付" }
  - { text: A date and time, translation: "日時" }
  - { text: A boolean, translation: "真偽値" }
  - { text: An enumeration's label, translation: "列挙値のラベル" }
  - { text: A list, translation: "リスト" }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "1 つの応答に含まれる行で、ページ分割はされません。見出しはデフォルトでプロパティのタイトルになり、最後のカラムはチームが採用中のときだけ表示されます。" }
  - { text: Projects under way, translation: "進行中のプロジェクト" }
  - { text: Project, translation: "プロジェクト" }
  - { text: Texts, translation: "テキスト" }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": "まだプロジェクトはありません。"
        other: "これまでに {$count} 件のプロジェクトがあります。"
  - { text: "{$team} started {$project} most recently.", translation: "最近では {$team} が {$project} を開始しました。" }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "読み取った数値に応じてブラウザーで選ばれる複数形と、値をレコードから得るテキストです。" }
  - { text: Open, context: state, translation: "オープン" }
  - { text: Open, context: verb, translation: "開く" }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "ノード自身のテキストも同じ方法で区別されます。バッジは TEL-42 がオープンであることを示し、リンクはそのタスクを開くことを促します。" }
  - { text: Style rules, translation: "スタイルルール" }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "行とセルのスタイルは行の値によって選ばれます。注目のプロジェクトは強調され、各ステータスには固有の色があり、どのケースにも該当しないステータスにはデフォルトが適用されます。2 つのカラムの見出しは同じ単語 Open ですが、それぞれの見出しに付けられたコンテキストによって区別されます。" }
  - { text: Composites, translation: "コンポジット" }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "このページ全体は、各アプリケーションが参照によって配置するビューです。下には、配置する場所にインラインで書かれたビューと、コントローラーを持たないこのサンプル独自のコンポジット種別があります。" }
  - { text: A view declared inline at the node that places it., translation: "配置するノードにインラインで宣言されたビューです。" }
  - { text: A callout, translation: "コールアウト" }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Ui.Composite を拡張してビューを提供する種別として一度だけ宣言され、独自のフィールドを指定して配置されます。" }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: "タブ" }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "タブに分けられたコンテンツで、一度に 1 つのタブを表示します。選択したタブはページのアドレスの一部なので、再読み込みや共有リンクで同じタブが開きます。" }
  - { text: Summary, translation: "サマリー" }
  - { text: "A tab holds any nodes, as a box does.", translation: "タブはボックスと同様に任意のノードを含められます。" }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "選択したタブのノードだけが描画されます。" }
  - { text: Chosen, translation: "選択中" }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "各タブは、他のノードと同様に自身の when によって配信されます。" }
  # The labels of the overview's models.
  - { text: Code, translation: "コード" }
  - { text: Name, translation: "名前" }
  - { text: Status, translation: "ステータス" }
  - { text: Active, translation: "稼働中" }
  - { text: Paused, translation: "一時停止" }
  - { text: Finished, translation: "完了" }
  - { text: Budget, translation: "予算" }
  - { text: Started, translation: "開始日" }
  - { text: Free, context: subscription, translation: "無料" }
  - { text: Enterprise, context: subscription, translation: "エンタープライズ" }
  - { text: Version, translation: "バージョン" }
  - { text: Team, context: subscription, translation: "チーム" }

  # Conditions.
  - { text: Delivered and drawn, translation: "配信と描画" }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "ノードの when はサーバー上でそのノードを配信するかを決め、shown は配信されたノードを描画するかをブラウザーで決めます。" }
  - { text: Never delivered — this node is not in the page document., translation: "配信されません — このノードはページのドキュメントに含まれていません。" }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "配信されますが描画されません。ステータスが paused ではないため、ブラウザーはこれを非表示のままにします。" }
  - { text: Delivered by its when and drawn by its shown., translation: "when によって配信され、shown によって描画されます。" }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "ノード自体に条件を持つコンポジットに配置側の条件が付くと、ボックスで囲まれ、両方の条件が満たされる必要があります。" }
  - { text: Both conditions hold., translation: "両方の条件が満たされています。" }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "自身の when によってコンテンツが無効になったビューはノードを提供しないため、それを配置するコンポジットは省かれます。" }
  - { text: Never provided., translation: "提供されません。" }
  - { text: Every keyword of a condition, translation: "条件のすべてのキーワード" }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "以下の各行は、このページが読み取ったプロジェクト TEL-42 のサマリーに対して条件が満たされているため描画されます。ステータスは active、メンバーは 4 人、ベロシティは 2.5、タグは design と web、責任者はマネージャー、note は null、codename はありません。" }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: 1～10 人が取り組んでいます。" }
  - { text: "required: the lead has an e-mail.", translation: "required: 責任者にメールアドレスがあります。" }
  - { text: "properties: the lead is a manager.", translation: "properties: 責任者はマネージャーです。" }
  - { text: "minimum: at least three people work on it.", translation: "minimum: 3 人以上が取り組んでいます。" }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: 取り組んでいるのは 9 人以下です。" }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: ベロシティは 2 より大きい値です。" }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: ベロシティは 3 より小さい値です。" }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: ベロシティは 0.5 の倍数です。" }
  - { text: "type: the status is a string.", translation: "type: ステータスは文字列です。" }
  - { text: "type, as a list: the note is a string or null.", translation: "type（リスト）: note は文字列または null です。" }
  - { text: "const: the status is active.", translation: "const: ステータスは active です。" }
  - { text: "enum: the status is active or paused.", translation: "enum: ステータスは active または paused です。" }
  - { text: "not: the status is not paused.", translation: "not: ステータスは paused ではありません。" }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code は TEL または OPS で始まります。" }
  - { text: "items: every tag has at least two letters.", translation: "items: すべてのタグは 2 文字以上です。" }
  - { text: "minItems: there are at least two tags.", translation: "minItems: タグは 2 つ以上あります。" }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: タグは 5 つ以下です。" }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: 重複するタグはありません。" }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code は 3 文字以上です。" }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code は 10 文字以下です。" }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code は英字、ハイフン、数字で構成されています。" }
  - { text: Missing and null, translation: "欠落と null" }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "null は存在する値です。欠落した値は not の下の条件も含めてどの条件も満たさないため、欠落は親で判定します。" }
  - { text: The note is present and null., translation: "note は存在し、値は null です。" }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "描画されません。欠落した codename は not を満たしません。" }
  - { text: "The project has no codename, tested on the summary.", translation: "プロジェクトには codename がありません（サマリーで判定）。" }
  - { text: Query parameters, translation: "クエリパラメーター" }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "このリーダーは mode、tag の値のリスト、パターンに従う ticket を宣言しています。アドレスで省略されたパラメーター、単一のはずが 2 回指定されたパラメーター、宣言で拒否される値は、欠落として扱われます。" }
  - { text: Mode detailed, translation: "mode を detailed に" }
  - { text: Two tags, translation: "タグを 2 つ" }
  - { text: A valid ticket, translation: "有効な ticket" }
  - { text: A refused ticket, translation: "拒否される ticket" }
  - { text: Mode given twice, translation: "mode を 2 回指定" }
  - { text: Clear the query, translation: "クエリをクリア" }
  - { text: mode is detailed., translation: "mode は detailed です。" }
  - { text: There are two tag values or more., translation: "tag の値が 2 つ以上あります。" }
  - { text: The ticket matches its pattern., translation: "ticket がパターンに一致しています。" }
  - { text: "No ticket, or one its pattern refuses.", translation: "ticket がないか、パターンで拒否される ticket です。" }
  - { text: Enablement, translation: "有効化" }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "このボタンは、フォームの内容に対する条件が満たされている間だけ押すことができ、満たされていない間はその理由を表示します。プロジェクトに既にあるタグは拒否され、タグを追加すると上の各行はサマリーを再読み込みします。" }
  - { text: Tag TEL-42, translation: "TEL-42 にタグ付け" }
  - { text: Tag, translation: "タグ" }
  - { text: Type a tag of three letters or more., translation: "3 文字以上のタグを入力してください。" }
  - { text: "Tagged {$tag}: TEL-42 has {$count} tags now.", translation: "{$tag} をタグ付けしました。TEL-42 のタグは {$count} 個になりました。" }
  - { text: A page's own query, translation: "ページ自身のクエリ" }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "このページも mode を宣言しており、ページ自身のノードがそれを読み取ります。" }
  - { text: The page reads mode as detailed., translation: "ページは mode を detailed として読み取っています。" }

  # Data.
  - { text: A reader and its parameters, translation: "リーダーとそのパラメーター" }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "プロジェクトはページのアドレスの project パラメーターで、読み取り時に送信されます。指定がない場合パラメーターは送信されず、ルートは TEL-42 について応答します。どのプロジェクトにも該当しないコードでは失敗ツリーが描画されます。" }
  - { text: A code no project has, translation: "どのプロジェクトにもないコード" }
  - { text: No project, translation: "プロジェクトなし" }
  - { text: Reading the project…, translation: "プロジェクトを読み込み中…" }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}（責任者: {$lead}）" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "このリーダーのコンテンツ内にネストされたリーダーが、同じプロジェクトに取り組むメンバーを読み取ります。" }
  - { text: Working on it, translation: "担当メンバー" }
  - { text: Role, translation: "役割" }
  - { text: E-mail, translation: "メールアドレス" }
  - { text: "No answer · {$code}", translation: "応答なし · {$code}" }
  - { text: Readers that fail, translation: "失敗するリーダー" }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "独自の失敗ツリーがない場合、リーダーはエラーのコードとメッセージを描画します — 存在しないプロジェクト、セッションなしで読み取った保護されたルート、そしてリーダーのモデルが拒否する応答（1 つのプロジェクトとして読み取ったプロジェクト一覧）の場合です。" }
  - { text: "Never drawn: there is no such project.", translation: "描画されません。そのようなプロジェクトはありません。" }
  - { text: "Signed in, so this reads: {$name}", translation: "サインイン済みのため読み取れました: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "描画されません。リストはプロジェクトではありません。" }
  - { text: Read again on focus, translation: "フォーカス時に再読み込み" }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "このリーダーは、ウィンドウがフォーカスを取り戻すたびにサーバーの時刻を再読み込みします。別のウィンドウに切り替えてから戻ってみてください。" }
  - { text: Read at, translation: "読み込み日時" }
  - { text: A sign-in gate, translation: "サインインゲート" }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "ゲートはセッションが開いているかを読み取り、内部のリクエストが 401 を返すたびに再読み込みします。サインインするとチームメンバーのセッションが開きます。チームの誰のものでもないメールアドレスは、そのフィールドで拒否されます。内部では、保護されたルートに対するリーダーがアカウントを表示します。セッションを静かに終了しても、次の保護されたリクエスト — 下の確認、またはフォーカス — が拒否されるまでアカウントは画面に残り、その時点でゲートはサインアウト後の表示に切り替わります。" }
  - { text: You are signed out., translation: "サインアウトしています。" }
  - { text: Sign in, translation: "サインイン" }
  - { text: "Signed in as {$name}", translation: "{$name} としてサインイン中" }
  - { text: "Member since {$since}", translation: "{$since} からメンバー" }
  - { text: Check the session, translation: "セッションを確認" }
  - { text: End the session quietly, translation: "セッションを静かに終了" }
  - { text: Sign out, translation: "サインアウト" }

  # The labels of the task models.
  - { text: Task, translation: "タスク" }
  - { text: Assignee, translation: "担当者" }
  - { text: Priority, translation: "優先度" }
  - { text: Estimate, translation: "見積もり" }
  - { text: Due, translation: "期限" }
  - { text: Label, translation: "ラベル" }
  - { text: Blocked, translation: "ブロック中" }
  - { text: To do, translation: "未着手" }
  - { text: In progress, translation: "進行中" }
  - { text: In review, translation: "レビュー中" }
  - { text: Bug, translation: "バグ" }
  - { text: Feature, translation: "機能" }
  - { text: Chore, translation: "雑務" }
  - { text: Docs, translation: "ドキュメント" }
  - { text: Contact, translation: "連絡先" }
  - { text: Project name, translation: "プロジェクト名" }
  - { text: Brief, translation: "概要書" }

  # Tables.
  - { text: Columns from the model, translation: "モデルから生成されるカラム" }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "カラムを記述しない場合、テーブルは行キーを除くモデルの各プロパティにつき 1 つのカラムを表示し、それぞれの見出しはタイトル、描画は型に従います。1 ページにはデフォルトの 25 行を表示し、作成・編集フォームは、サーフェスを指定しない場合にテーブルが使うダイアログで開きます。" }
  - { text: "Written columns, sorting and style rules", translation: "記述したカラム、並べ替え、スタイルルール" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "手書きのカラムを指定した順に並べ、1 つには独自の見出しを付けています。コレクションが並べ替え対象としてプロパティを挙げているカラムは並べ替えできます。ブロック中のタスクの行は強調された赤で、各ステータスのセルには固有の色があり、どのケースにも該当しない優先度にはデフォルトが適用されます。1 ページに 8 行です。" }
  - { text: Where, translation: "場所" }
  - { text: Members behind a reference, translation: "参照先のメンバー" }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "タスクボードは、担当者とプロジェクトをネストした各タスクを返します。ネストされたメンバーに対するカラムは、名前付きシェイプ、モデル自身の定義、そして参照先のシェイプより自身のタイトルが優先される参照を通じて、そのメンバーのタイトルと表示方法を引き継ぎます。連絡先はメールリンクに、概要書はページへのリンクになります。" }
  - { text: Filtered by the address, translation: "アドレスで絞り込み" }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "このテーブルは project パラメーターを宣言し、すべてのリクエストで等価条件として送信します。アドレスにプロジェクトがない場合は何も読み取りません。" }
  - { text: Atlas redesign tasks, translation: "Atlas リデザインのタスク" }
  - { text: Billing migration tasks, translation: "請求システム移行のタスク" }
  - { text: Blocked tasks, translation: "ブロック中のタスク" }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "こちらはテーブルに記述した固定値で絞り込まれ、ブロック中のタスクだけを一覧表示します。" }
  - { text: Where a form opens, translation: "フォームを開く場所" }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "以下の各テーブルは、作成・編集フォームをそれぞれ異なるサーフェスで開きます。保存すると、ページ上のすべてのタスクテーブルが再読み込みされます。" }
  - { text: Dialogs, translation: "ダイアログ" }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "作成は小さなダイアログで行い、保存後も空になって開いたままなので次のタスクを続けて作成できます。編集は大きなダイアログで行い、ページをブロックせず、外側のクリックを無視します。保存後も値を保持し、未保存の入力は確認なしで破棄し、アドレスの一部になります。各行には確認付きの削除があります。" }
  - { text: Drawers, translation: "ドロワー" }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "作成は開始側の端から開く小さなドロワーで、編集は終了側の端から開く閉じるボタンのない大きなドロワーで行います。どちらも保存後に閉じ、未保存の入力を破棄する前に確認します。" }
  - { text: Sheets, translation: "シート" }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "作成はページをブロックしない上部からのシートで、編集はアドレスの一部となる下部からの全画面シートで行います。" }
  - { text: Popovers, translation: "ポップオーバー" }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "作成は「新規」ボタンの横に、ボタンを中心として表示されるカードで行い、ブレークポイント未満では全画面ダイアログになります。編集は行のボタンの下に、その終端に揃えて表示されるカードで行い、外側をクリックしても閉じず、保存後も開いたままです。" }
  - { text: In line, translation: "インライン" }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "作成フォームは行の上に、編集フォームは変更する行の下に開きます。ブレークポイント未満では、作成フォームは下部からのシートで開きます。" }
  - { text: Panels, translation: "パネル" }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "作成は開始側の端にある小さなパネルで行い、Escape では閉じません。編集は終了側の端にある大きなパネルで行い、アドレスの一部となり、横の行はそのまま操作できます。ブレークポイント未満では下部からのシートになります。" }
  - { text: A page of its own, translation: "専用のページ" }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "作成と編集は 1 つのアドレス名のもとでページのコンテンツを置き換えるので、アドレスは新しいタスクかこのキーのタスクのどちらかを表し、「戻る」でフォームが閉じます。サーフェスは一度だけ宣言され、両方から名前で参照されます。" }

  # Filters.
  - { text: Every filter the collection accepts, translation: "コレクションが受け付けるすべてのフィルター" }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "フィールドを記述しない場合、バーはコレクションが受け付けるフィルターごとに 1 つのコントロールを、その順序でモデルのプロパティに基づいて描画します。列挙値やはい/いいえの値にはリスト、それ以外には入力ボックス、範囲の 2 つの境界には 1 つのラベルを付けます。バーはテーブルの上に置かれ、選択は即座に、入力したテキストは Enter で適用し、訪問の間で何も保持しません。" }
  - { text: Every control, translation: "すべてのコントロール" }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "フィルターの入力方法をすべて示します。テキスト入力、横並びの選択肢、リスト、タグ入力、スライダー、スイッチ、そして 1 つのラベルの下の 2 つの日付です。プロジェクトのフィルターはどこにも描画されず、プリセットだけが設定します。ステータスはデフォルト値から始まり、プリセットはそのプリセットが指定するフィルターを設定し、他のプリセットが指定するフィルターをクリアします。チップが選択内容を要約し、値はアドレスの一部になります。ブレークポイント未満ではバーが折りたたまれ、固定されたテキストフィルターは折りたたみの外に残ります。" }
  - { text: Urgent, translation: "緊急" }
  - { text: Atlas only, translation: "Atlas のみ" }
  - { text: Stuck, translation: "停滞中" }
  - { text: "Beside, as chips, while typing", translation: "横に配置、チップ表示、入力中に適用" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "コントロールは開始側の端に縦に並びます。表示されるのは選んだフィルターだけです。バーのリストから追加し、削除するとクリアされます。各フィルターは値を示すチップで、クリックするとコントロールが開きます。入力したテキストは少し間を置いてから適用され、数値の 2 つの境界には「より後」と「より前」のキャプションが付きます。選択内容はこのブラウザーに訪問をまたいで保持されます。ブレークポイント未満では、バーは下部からのシートで開きます。" }
  - { text: "Beside at the end, applied by a button", translation: "終了側の横に配置、ボタンで適用" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "コントロールは終了側の端に置かれ、変更は「適用」を押すまで待機しますが、プリセット、「リセット」、要約チップの削除は即座に適用されます。複数の担当者はカンマ区切りで入力します。選択内容はこのタブでのみ保持され、再読み込み後も残ります。" }
  - { text: Due by October, translation: "10 月までが期限" }
  - { text: "Folded, starting open", translation: "折りたたみ式、最初は展開" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "コントロールは、値を持つフィルターの数を表示するトグルの中に折りたたまれ、最初は展開されています。固定されたテキストフィルターは折りたたみの外に残り、その他はバーのリストから追加します。ステータスは「進行中」から始まります。削除するとそのデフォルトもクリアされ、「リセット」で元に戻ります。値はアドレスとこのブラウザーの両方に保持され、アドレスが優先されます。選んだ折りたたみ状態も記憶されます。" }
  - { text: "Folded, starting closed", translation: "折りたたみ式、最初は折りたたみ" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "最初は折りたたまれています。固定されたテキストフィルター、「適用」、「リセット」は折りたたみの外に残ります。ラベルは変更されるまでデフォルト値の「バグ」で始まり、「リセット」でデフォルトに戻ります。" }
  - { text: In a dialog, translation: "ダイアログ内" }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "コントロールは、値を持つフィルターの数を表示するボタンから小さなダイアログで開き、「完了」で閉じます。開いたダイアログはアドレスの一部なので、リンクから開けます。固定されたテキストフィルターはボタンの横に残り、チップが選択内容を要約します。" }
  - { text: In a drawer, translation: "ドロワー内" }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "コントロールは開始側の端からのドロワーで開き、外側をクリックしても閉じません。入力した値は少し間を置いてから適用されます。" }
  - { text: In a popover, translation: "ポップオーバー内" }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "コントロールはボタンの下に、その終端に揃えたカードで開きます。ブレークポイント未満では下部からのシートで開きます。" }

  # The labels of the forms page's models.
  - { text: Title, translation: "タイトル" }
  - { text: Kind of work, translation: "作業の種類" }
  - { text: Design, translation: "デザイン" }
  - { text: Building, translation: "構築" }
  - { text: Writing, translation: "執筆" }
  - { text: Research, translation: "調査" }
