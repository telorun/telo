# Invokes the library's `conjunct`. Its entry-scoped check is silent about the
# library's resources, so the string at the reference slot is refused at run.
kind: Telo.Application
metadata:
  name: RefSlotReachValueConjunctApp
  version: 1.0.0
imports:
  Lib: ./lib
targets:
  - name: probe
    invoke: !ref Lib.conjunct
