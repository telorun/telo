# Dispatches the instance whose contract reaches a mark through an array item.
# This consumer's entry-scoped check is silent about the library's contract.
kind: Telo.Application
metadata:
  name: SpanAttributeThroughItems
  version: 1.0.0
imports:
  Lib: ./lib
targets:
  - invoke: !ref Lib.throughItems
    inputs:
      steps: [{ id: s1 }]
