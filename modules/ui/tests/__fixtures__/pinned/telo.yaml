# A pinned filter on bars of every placement. Pinning says something only
# where something folds — an aside bar folds on a narrow viewport.
kind: Telo.Application
metadata:
  name: UiPinnedApp
  version: 1.0.0
imports:
  Ui: ../../../
  DataModel: ../../../../data-model
---
kind: Telo.JsonSchema
metadata:
  name: Todo
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
    text: { type: string }
---
kind: Ui.CollectionPresentation
metadata: { name: todos }
source:
  kind: Ui.CollectionSource
  basePath: /api/todos
  collection:
    kind: DataModel.Collection
    model: !ref Todo
    query:
      filters:
        - { property: text, operator: contains }
      sort: []
---
kind: Ui.Filters
metadata:
  name: omitted
presentation: !ref todos
fields:
  - { property: text, operator: contains, pinned: true }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: above
presentation: !ref todos
fields:
  - { property: text, operator: contains, pinned: true }
policy:
  placement: { kind: Ui.AbovePlacement }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: aside
presentation: !ref todos
fields:
  - { property: text, operator: contains, pinned: true }
policy:
  placement: { kind: Ui.AsidePlacement, side: end }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: collapsible
presentation: !ref todos
fields:
  - { property: text, operator: contains, pinned: true }
policy:
  placement: { kind: Ui.CollapsiblePlacement }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: overlay
presentation: !ref todos
fields:
  - { property: text, operator: contains, pinned: true }
policy:
  placement: { kind: Ui.OverlayPlacement, surface: { kind: Ui.Drawer } }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: aboveCompact
presentation: !ref todos
fields:
  - { property: text, operator: contains, pinned: true }
policy:
  placement: { kind: Ui.AbovePlacement, compact: { kind: Ui.CollapsiblePlacement } }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: asideCompact
presentation: !ref todos
fields:
  - { property: text, operator: contains, pinned: true }
policy:
  placement:
    kind: Ui.AsidePlacement
    compact: { kind: Ui.OverlayPlacement, surface: { kind: Ui.Dialog } }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: omittedChosen
presentation: !ref todos
fields:
  - { property: text, operator: contains, pinned: true }
policy:
  show: chosen
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: aboveChosen
presentation: !ref todos
fields:
  - { property: text, operator: contains, pinned: true }
policy:
  show: chosen
  placement: { kind: Ui.AbovePlacement }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: aboveUnpinned
presentation: !ref todos
fields:
  - { property: text, operator: contains }
policy:
  placement: { kind: Ui.AbovePlacement }
content: { type: text, text: Todos }
