  modules/sse-codec: Fixed
  modules/ndjson-codec: Fixed
  modules/mcp-client: Fixed
  modules/ai: Fixed
body: A CEL value JSON has no form for is written in its plain encoding where it leaves
  for a reader outside Telo - an SSE data payload, an NDJSON line, an MCP tool call's
  arguments and a structured tool result fed back to a model - a timestamp as RFC 3339
  text in UTC, a duration as seconds such as 5400s, bytes as base64url, a uint as its
  digits, where a duration used to be written as an empty object.
