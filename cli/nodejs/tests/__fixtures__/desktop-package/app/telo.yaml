kind: Telo.Application
metadata: { name: DesktopPackageFixture, version: 1.0.0 }
lang: en
imports:
  Console: ../../../../../../modules/console
  Desktop: ../../../../../../modules/desktop
  Http: ../../../../../../modules/http-server
ports: { http: { env: DESKTOP_FIXTURE_PORT } }
needs:
  desktopHost:
    kind: Telo.DesktopHost
    parameters: { identifier: run.telo.tests.desktoppackage, productName: Fixture, icon: !module-path icon.png, port: http }
  data: { kind: Telo.DurableDirectory }
targets:
  - !ref report
  - !ref server
  - !ref mainWindow
---
kind: Telo.Sequence
metadata: { name: report }
steps:
  - name: say
    invoke: { kind: Console.WriteLine }
    inputs:
      output: !interpolate "data=${{ string(resources.data.path) }}"
---
kind: Http.Server
metadata: { name: server }
listen: { port: !cel "ports.http" }
mounts:
  - { path: /, mount: !ref pages }
---
kind: Http.Api
metadata: { name: pages }
routes:
  - request: { path: /, method: GET }
    handler: { kind: Telo.Value, value: {} }
    returns:
      - { status: 200, content: { text/html: { body: "<h1>Hello</h1>" } } }
---
kind: Desktop.Window
metadata: { name: mainWindow }
host: !ref desktopHost
title: Fixture
onClose: close
