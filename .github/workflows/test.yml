      - name: Run package unit tests
        if: needs.select.outputs.platform_unit_mode == 'full' || (needs.select.outputs.platform_unit_mode == 'selected' && needs.select.outputs.unit_test_args != '[]')
        shell: bash
        env:
          TEST_ARGS: ${{ needs.select.outputs.unit_test_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$TEST_ARGS" | tr -d '\r')
