kind: Telo.Application
metadata:
  name: ChatFindKinds
  version: 1.0.0
  description: |
    Discovery, offline against the provider stub and a local stand-in for the
    hub. The agent calls `find_kinds` once; behind it a second agent searches
    the hub and names a kind, and the definitions of what it named are fetched
    from the hub itself. What the agent is shown is the choice and those
    definitions — the hub's search answer reaches only the second agent's
    requests, never the agent's own. The library index leads the agent's
    messages. The turn is charged for every model call made on its behalf,
    the second agent's two included: with 15 tokens a call, naming (15), the
    agent's two calls (30) and the search's two (30) are 75.
imports:
  Mcp: ../../../../modules/mcp-client
  Chat:
    source: ../
    resources:
      hub: !ref hub
    secrets:
      openaiApiKey: stub-key
    needs:
      agentState: { path: !cel "variables.scratch.joinPath('state')" }
    variables:
      workspaceDir: !cel "variables.scratch.joinPath('workspace')"
      modelEndpoint: http://127.0.0.1:18560/v1
      hubPublisher: example.test
  App: oci://ghcr.io/telorun/app@0.4.0#sha256-lztFuzxL_5KCX_wITAdVmckveRilao1AVDRUlU8XNIA
  Stream: ../../../../modules/stream
  Run: ../../../../modules/run
  HttpClient: ../../../../modules/http-client
  Assert: oci://ghcr.io/telorun/assert@0.21.1#sha256-9CCELeaW54ph9v7qtM1zBRq9-gqXK4fwF0NubWAhsN4
variables:
  scratch:
    env: CHAT_TEST_FIND_KINDS_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/find-kinds
targets:
  - !ref Chat.ensureWorkspace
  - !ref Chat.initSchema
  - !ref test
---
# The local hub stand-in the chat library discovers through.
kind: Mcp.HttpClient
metadata: { name: hub }
url: http://127.0.0.1:18561/mcp
clientInfo: { name: authoring-agent-test, version: 0.0.0 }
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: stub }
    source: ./__fixtures__/provider-stub/telo.yaml
    ports: { http: 18560 }
  - kind: App.Instance
    metadata: { name: hubStub }
    source: ./__fixtures__/hub-stub/telo.yaml
    ports: { http: 18561 }
targets: [ !ref stub, !ref hubStub ]
steps:
  - name: conversation
    invoke: !ref Chat.createConversation
  # What the second agent answers once it has searched, carried to it inside
  # the need the agent passes on.
  - name: choice
    value: !cel >-
      base64Encode(json({'found': [{'need': 'greet someone', 'ref': 'oci://example.test/greeter',
                                    'kinds': ['Hello'], 'note': 'the only greeter'}],
                         'notFound': [{'need': 'fly', 'tried': ['fly', 'aviation']}]}))
  - name: start
    invoke: !ref Chat.chatStart
    inputs:
      conversationId: !cel "steps.conversation.result.conversation.id"
      idempotencyKey: ""
      clientIp: test-runner
      message: !cel >-
        'build it STUB_CALLS:' + base64Encode(json([{'name': 'find_kinds',
          'arguments': {'needs': ['greet someone STUB_DISCOVERY:' + steps.choice.result, 'fly']}}]))
  - name: read
    invoke: !ref Chat.journalSource
    inputs:
      key: !cel "steps.start.result.turnId"
      fromId: 0
  - name: drain
    timeout: 30000
    invoke: { kind: Stream.Collect }
    inputs:
      input: !cel "steps.read.result.output"
  - name: sent
    invoke:
      kind: HttpClient.Request
      client: { kind: HttpClient.Client }
    inputs: { url: http://127.0.0.1:18560/requests }
  - name: after
    invoke: !ref Chat.getConversation
    inputs: { conversationId: !cel "steps.conversation.result.conversation.id" }
  - name: requests
    value: !cel >-
      steps.sent.result.body.requests.map(r, {
        'who': string(r.instructions).startsWith('You find Telo modules') ? 'search'
          : string(r.instructions).startsWith('You name conversations') ? 'naming' : 'agent',
        'text': json(r.input),
        'tools': has(r.tools) ? r.tools.map(t, string(t.name)) : []})
  - name: shown
    value: !cel >-
      steps.drain.result.items.filter(r, r.data.type == 'tool-result' && r.data.toolResult.name == 'find_kinds')
        .map(r, string(r.data.toolResult.content))[0]
  - name: assert
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        callers: !cel "steps.requests.result.map(r, r.who).filter(w, w != 'naming')"
        # The agent may fetch definitions, ask for a search and read a guide,
        # never search itself.
        agentHubTools: !cel >-
          sort(steps.requests.result.filter(r, r.who == 'agent')[0].tools
            .filter(t, t in ['find_kinds', 'get_kinds', 'search_resources', 'get_module_manifest',
                             'find_implementations', 'find_instances', 'list_libraries', 'guide_build_ui']))
        searchTools: !cel "sort(steps.requests.result.filter(r, r.who == 'search')[0].tools)"
        shown: !cel >-
          [steps.shown.result.contains('FOUND\n- greet someone: Hello in oci://example.test/greeter — the only greeter'),
           steps.shown.result.contains('NOT FOUND\n- fly (searched: ["fly","aviation"])'),
           steps.shown.result.contains('#   Greeter: oci://example.test/greeter@1.0.0#sha256-stub'),
           steps.shown.result.contains('HUB_DEFINITION from oci://example.test/greeter')]
        searchAnswerReached: !cel >-
          [steps.requests.result.filter(r, r.who == 'search').exists(r, r.text.contains('HUB_SEARCH_HIT')),
           steps.requests.result.filter(r, r.who == 'agent').exists(r, r.text.contains('HUB_SEARCH_HIT'))]
        indexLeads: !cel >-
          steps.requests.result.filter(r, r.who == 'agent').all(r,
            json(parseJson(r.text)[0]).contains('LIBRARY INDEX:')
              && json(parseJson(r.text)[0]).contains('- Greeter (oci://example.test/greeter): Greets people for example.test. Kinds: Hello.')
              && json(parseJson(r.text)[0]).contains('- Telo (oci://ghcr.io/telorun/telo): The built-in vocabulary. Kinds: Application. builtin: true — write its kinds as Telo.<Kind> and import nothing.'))
        totalTokens: !cel "steps.after.result.conversation.totalTokens"
      expected:
        callers: [agent, search, search, agent]
        agentHubTools: [find_kinds, get_kinds, guide_build_ui]
        # The stand-in serves no `find_implementations` / `find_instances`.
        searchTools: [search_resources]
        shown: [true, true, true, true]
        searchAnswerReached: [true, false]
        indexLeads: true
        totalTokens: 75
