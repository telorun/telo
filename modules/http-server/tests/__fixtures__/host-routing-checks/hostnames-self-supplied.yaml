kind: Telo.Application
metadata: { name: HostnamesSelfSupplied, version: 1.0.0, description: A hostnames entry naming an address written in the manifest. }
imports:
  Http: ../../../
targets: [ !ref server ]
---
kind: Telo.PublicUrl
metadata: { name: site }
fields:
  url: https://shop.example
---
kind: Http.Server
metadata: { name: server }
listen: { port: 8942 }
mounts:
  - hostnames: [ !ref site ]
    path: /
    mount: !ref api
---
kind: Http.Api
metadata: { name: api }
routes:
  - request: { path: /, method: GET }
    returns:
      - status: 200
        content: { application/json: { body: { ok: true } } }
