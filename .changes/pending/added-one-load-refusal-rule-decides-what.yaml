units:
  analyzer: Added
body: "One load refusal rule decides what a kernel refuses a load with: `loadRefusal`
  reads the loaded graph and the analysis and returns the first group that refuses — the
  import failures, the parse and coded loader findings, the version conflicts, the
  module-file claims, an entry that is a `Telo.Library`, a failed library migration, the
  metadata stamps, the need table's refusals, then the analysis's errors — as data a
  kernel raises, with `importFailureRefusal`, `migrationFailureRefusal` and
  `needRefusal` for the refusals raised outside a load. The Rust analyzer carries its
  twin, `load_refusal`, and the entry assembly its `telo check` and its kernel share."
