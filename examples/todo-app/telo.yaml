kind: Telo.Application
metadata:
  name: TodoApp
  version: 1.0.0
  categories: [Transport, Storage, UI]
  description: |
    A complete app served as one unit, with no hand-written frontend: the REST
    todo API (one Crud.Api over the `todos` collection) and an admin UI declared
    in the same manifest (UiReact.App) — a filterable, sortable, paged listing
    with create, edit and delete — on a single port. Its first page is one line
    that also says how the filter bar behaves and which page each button opens; its
    second is the same screen written out, with presets and a pinned filter. The
    UI and the API share one collection, so renaming a property is a `telo check`
    error rather than a broken page, and a column the database fills in is read
    by both and written by neither.
# Module `lang:` — the language this application's texts are written in — is
# read from 0.121.0.
requires: { telo: ">=0.133.0" }
lang: en
imports:
  Http: ../../modules/http-server
  Sql: ../../modules/sql
  SQLite: ../../modules/sqlite
  Crud: ../../modules/crud
  CrudUi: ../../modules/crud-ui
  Ui: ../../modules/ui
  UiReact: ../../modules/ui-react
targets:
  - !ref migrate
  - !ref server
  - { name: openApp, invoke: !ref openApp, inputs: { url: !interpolate "http://localhost:${{ ports.http }}" } }
ports: { http: { env: PORT, protocol: tcp, default: 8077 } }
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: { name: Telo.HostPath, entry: file }
    default: todo.db
---
# What creates a todo: its title alone. A new todo is not done — the column's
# default says so — and the create form has the one field.
kind: Telo.JsonSchema
metadata: { name: NewTodo }
schema:
  type: object
  required: [text]
  additionalProperties: false
  properties: { text: { type: string, title: Task, minLength: 1 } }
---
# What an update replaces. `isDone` is required, so an update leaving it out is
# refused rather than clearing it; leaving out the optional `dueOn` clears it.
kind: Telo.JsonSchema
metadata: { name: TodoEdit }
extends: NewTodo
schema:
  type: object
  required: [isDone]
  properties:
    isDone: { type: boolean, title: Done }
    dueOn: { type: string, title: Due, format: date }
---
# What is read back: everything written, the key, and `createdAt`, which the
# table fills in. It is in no write shape, so no request can set it.
kind: Telo.JsonSchema
metadata: { name: Todo }
extends: TodoEdit
schema:
  type: object
  required: [id]
  properties: { id: { type: integer }, createdAt: { type: string, title: Created } }
---
# One collection for the API and the UI: a record's shape for each operation,
# and what the list may be filtered and sorted by. The API accepts nothing
# else, and the UI offers exactly this.
kind: Crud.Collection
metadata: { name: todos }
model: !ref Todo
table: !ref todosTable
schemas: { list: !ref Todo, create: !ref NewTodo, update: !ref TodoEdit }
query:
  filters:
    - { property: text, operator: contains }
    - { property: isDone, operator: eq }
    # A date range is two filters on one property: from this day, to this day.
    - { property: dueOn, operator: gte }
    - { property: dueOn, operator: lte }
  sort: [{ property: text }, { property: dueOn }, { property: createdAt }]
---
# Where the browser reads the collection: the path the API is mounted at.
kind: CrudUi.CollectionSource
metadata: { name: todosSource }
collection: !ref todos
basePath: /api/todos
---
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.dbFile"
---
kind: SQLite.Table
metadata: { name: todosTable }
table: todos
columns:
  id: { type: integer, primaryKey: true, identity: always }
  text: { type: text, nullable: false }
  is_done: { type: integer, nullable: false, default: 0 }
  due_on: { type: text }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata: { name: migrate }
connection: !ref db
tables: [!ref todosTable]
---
# How the written-out screen on `/status` shows the collection; its bar, its
# listing and both forms name it.
kind: Ui.CollectionPresentation
metadata: { name: todosPresentation }
source: !ref todosSource
---
# A todo's screens are pages: the listing opens them in a drawer, and each is
# reached by its own address too. The new-todo form starts empty again after a
# save, so several can be added in a row.
kind: Ui.Page
metadata: { name: newTodoPage }
path: /todos/new
title: New todo
children:
  - type: composite
    ref:
      kind: Ui.Form
      model: !ref NewTodo
      record: { presentation: !ref todosPresentation }
      afterSubmit: again
---
# The edit form starts from the todo the query reads and sends only what changed.
kind: Ui.Page
metadata: { name: todoPage }
path: /todos/{id}
title: Todo
children:
  - type: query
    query:
      kind: Ui.Query
      model: !ref Todo
      url: { path: "/api/todos/{id}", pathParams: { id: !cel "params.id" } }
    content:
      - type: composite
        ref:
          kind: Ui.Form
          model: !ref TodoEdit
          record: { presentation: !ref todosPresentation, key: !cel "data.id" }
          initialValues: !cel "data"
---
kind: Ui.Page
metadata: { name: todosPage }
path: /
title: Todos
children:
  - { type: text, text: Todos, style: title }
  - type: composite
    ref:
      kind: CrudUi.Admin
      source: !ref todosSource
      # The bar shows only the filters chosen, as chips, kept in the address
      # and the browser.
      filters:
        placement: { kind: Ui.AbovePlacement, show: chosen, summary: chips }
        state: { key: todos, address: true, store: { kind: Ui.LocalStore } }
      create:
        # A drawer, and a full-size dialog on a narrow screen.
        to:
          kind: Ui.OpenPage
          page: !ref newTodoPage
          surface: { kind: Ui.Drawer, side: end, compact: { kind: Ui.Dialog, size: full } }
      edit:
        to:
          kind: Ui.OpenPage
          page: !ref todoPage
          pathParams: { id: !cel "row.id" }
          surface: { kind: Ui.Drawer, side: end, address: { name: todo } }
---
kind: Ui.Page
metadata: { name: statusPage }
path: /status
title: By status
children:
  - { type: text, text: Todos by status, style: title }
  - type: composite
    ref:
      kind: Ui.Filters
      presentation: !ref todosPresentation
      # The bar folds behind a toggle.
      policy: { placement: { kind: Ui.CollapsiblePlacement } }
      fields:
        # Pinned: the search box stays outside the fold.
        - { property: text, operator: contains, pinned: true }
        # No control: the presets below are the only way to set it.
        - { property: isDone, operator: eq, control: none }
        # Behind the toggle: a range of due days, from one to another.
        - { property: dueOn, operator: gte }
        - { property: dueOn, operator: lte }
      presets:
        - { label: All, values: [] }
        - { label: Open, values: [{ property: isDone, operator: eq, value: false }] }
        - { label: Done, values: [{ property: isDone, operator: eq, value: true }] }
      content:
        type: composite
        ref:
          kind: Ui.Listing
          presentation: !ref todosPresentation
          model: !ref Todo
          # A destination with nothing but its page opens it in a dialog.
          create: { to: { kind: Ui.OpenPage, page: !ref newTodoPage } }
          edit: { to: { kind: Ui.OpenPage, page: !ref todoPage, pathParams: { id: !cel "row.id" } } }
          delete: true
---
# The whole frontend. `/` is one `CrudUi.Admin` — listing and filters come
# from the collection — given keys that say how it behaves and which pages its
# buttons open. `/status` is the same screen written out by hand.
kind: UiReact.App
metadata: { name: ui }
title: Todos
theme: !ref UiReact.defaultTheme
tokens: { kind: Ui.DesignTokens, color.accent: "#1f8fff", radius.md: 6px }
pages: [!ref todosPage, !ref statusPage, !ref newTodoPage, !ref todoPage]
layout:
  kind: Ui.PageLayout
  header:
    - type: pane
      ref:
        kind: Ui.Navbar
        title: Todos
        navigation:
          items:
            - { type: page, page: !ref todosPage }
            - { type: page, page: !ref statusPage }
---
kind: Http.Server
metadata: { name: server }
listen: { port: !cel "ports.http" }
openapi: { info: { title: Todo API, version: 1.0.0 } }
mounts:
  - path: /api/todos
    # The entire REST API over the collection's table: GET / (a paged list,
    # filtered and sorted by what its `query` declares), GET /{id}, POST /,
    # PUT /{id} (replace) and DELETE /{id}; both writes answer with the todo.
    mount: { kind: Crud.Api, connection: !ref db, plural: todos, singular: todo, collection: !ref todos }
  - { path: /, mount: !ref ui }
---
kind: Telo.OpenUrl
metadata: { name: openApp }
