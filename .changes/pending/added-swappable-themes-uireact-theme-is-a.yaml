modules:
  modules/ui-react: Added
body: "Swappable themes. UiReact.Theme is a look — stylesheets placed in the telo.theme
  layer, token defaults, and UiReact.Controls sets drawn in place of the built-in
  controls they implement — and UiReact.Controls is a set of controls a module ships
  (entry, implements), checked against ui_react_controls-2 before the application
  starts. The built-in look moved out of code into the exported instance
  UiReact.defaultTheme, one stylesheet that now styles every part, the picker, date
  range, field groups and field descriptions included, and declares no reserved
  property. The application document names a theme's control sets in controls.sets,
  places each set's stylesheet in telo.control and serves no built-in mechanics for a
  control a set replaces. Two entries of a theme's controls implementing one control are
  refused, the same set listed through two aliases included (UI_THEME_CONTROL_DUPLICATE
  at each entry / ERR_UI_THEME_CONTROL_DUPLICATE naming both). Breaking:
  UiReact.App.theme is required and names one UiReact.Theme (theme: !ref
  UiReact.defaultTheme for the built-in look); the brand moves to the new tokens: field,
  one Ui.DesignTokens or a list of { tokens, when } chosen per request; defaultTheme is
  removed — a look of the application's own is a theme holding only stylesheets."
