  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/por.traineddata.gz:
        { upstream: por, member: package/4.0.0_best_int/por.traineddata.gz, sha256: dacebc1386ddaaf8389f81094236cca0d690897cde693d48cbdaa881c86e2b4c, executable: false }
---
kind: TesseractModel.Language
metadata:
  name: por
  description: Portuguese, Latin script
code: por
data: !module-path ./tessdata/por.traineddata.gz
