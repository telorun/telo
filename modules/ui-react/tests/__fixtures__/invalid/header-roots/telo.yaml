# A header node whose condition reads the query, a root only a page binds.
kind: Telo.Library
metadata:
  name: UiReactHeaderRoots
  version: 1.0.0
  description: >-
    Test fixture exporting an application whose header node reads the query
    in its condition, though no query is in scope in the header.
imports:
  UiReact: ../../../../
  Ui: ../../../../../ui
exports:
  resources: [headed]
---
kind: UiReact.App
metadata:
  name: headed
title: Headed
words: !ref Ui.words
theme: !ref UiReact.defaultTheme
header:
  end:
    - type: text
      text: Tabbed
      shown:
        at: !cel "query.tab"
        matches: { const: one }
pages:
  - path: /
    title: Home
    query:
      tab: { type: string }
    children:
      - { type: text, text: Home }
