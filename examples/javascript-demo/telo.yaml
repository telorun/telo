kind: Telo.Application
metadata:
  name: JavaScriptDemo
  version: 1.0.0
  description: A demo showcasing a JavaScript script run from flat `targets`.
imports:
  JavaScript: ../../modules/javascript
  Console: ../../modules/console
targets:
  - name: step1
    invoke: !ref multiplyBy2
    inputs:
      value: 42
  - name: printResult
    invoke: !ref Console.writeLine
    inputs:
      output: !interpolate |
        Evaluated JavaScript code.
        Result is: ${{ steps.step1.result.result }}
---
kind: JavaScript.Script
metadata:
  name: multiplyBy2
code: |
  function main({ value }) {
    return { result: value * 2 }
  }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      value: { type: number }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      result: { type: number }
