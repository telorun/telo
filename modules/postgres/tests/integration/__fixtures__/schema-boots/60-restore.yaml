kind: Telo.Application
metadata:
  name: PgSchemaBoots
  version: 6.0.0
  description: |
    Boot 7 — the rename is called off. `email` is declared again while its
    tombstone is still outstanding, so the tombstone is CLEARED and its budget
    discarded rather than counted down: the column was never dropped, and the
    declaration is authoritative again. The data it held throughout is still
    there, which is the property the whole deferral exists to preserve.

    `displayName` keeps the column the previous boot copied into, and drops its
    `renamedFrom:` — the source is a declared column again, so the mention would
    now describe a rename that is not happening.
imports:
  Sql: ../../../../../sql
  Postgres: ../../../../
  Run: ../../../../../run
  Assert: ../../../../../assert
variables:
  dbHost: { env: DB_HOST, type: string, default: localhost }
  dbPort: { env: DB_PORT, type: integer, default: 5432 }
  dbUser: { env: DB_USER, type: string, default: postgres }
  dbPassword: { env: DB_PASSWORD, type: string, default: postgres }
  dbName: { env: DB_NAME, type: string, default: postgres }
targets:
  - !ref appSchema
  - !ref test
---
kind: Postgres.Connection
metadata: { name: db }
connectionString: !cel >-
  'postgres://' + variables.dbUser + ':' + variables.dbPassword + '@' +
  variables.dbHost + ':' + string(variables.dbPort) + '/' + variables.dbName
---
kind: Postgres.Table
metadata: { name: users }
table: users
columns:
  id: { type: integer, primaryKey: true }
  createdAt: { type: timestamptz, nullable: false, defaultExpression: "now()" }
  # Restated exactly as boot 1 declared it. A restored column has to come back as
  # the column that is there: declaring it nullable, or without its unique
  # constraint, would be drift rather than revival — and refused as such.
  email: { type: text, nullable: false, unique: true }
  displayName: { type: text }
  handle: { type: text }
---
# Declared unchanged by every boot from here on: a foreign key is read back from
# the catalogue on each of them, through the same array shape the index columns
# use, so it is the FK half of that read that these boots keep exercising.
kind: Postgres.Table
metadata: { name: sessions }
table: sessions
columns:
  id: { type: integer, primaryKey: true }
  userId: { type: integer, nullable: false }
indexes:
  # The composite key below references this pair, and PostgreSQL requires a
  # unique constraint on whatever a foreign key points at.
  sessions_id_user_key: { columns: [id, userId], unique: true }
foreignKeys:
  sessions_user_fk:
    columns: [userId]
    references:
      table: !ref users
      columns: [id]
    onDelete: cascade
---
# A COMPOSITE foreign key, so both column lists carry more than one entry — the
# shape a single-column key cannot tell apart from a corrupted read.
kind: Postgres.Table
metadata: { name: sessionEvents }
table: session_events
columns:
  id: { type: integer, primaryKey: true }
  sessionId: { type: integer, nullable: false }
  sessionUserId: { type: integer, nullable: false }
foreignKeys:
  session_events_session_fk:
    columns: [sessionId, sessionUserId]
    references:
      table: !ref sessions
      columns: [id, userId]
    onDelete: cascade
---
kind: Postgres.Schema
metadata: { name: appSchema }
connection: !ref db
schema: telo_pg_schema_boots
version: !cel "module.version"
tables: [!ref users, !ref sessions, !ref sessionEvents]
# A policy is declared, so a still-outstanding tombstone WOULD be eligible by
# now — which is what makes the revival load-bearing rather than incidental.
reclaim: { afterVersions: 1, afterDuration: 0ms }
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: assertRevived
    invoke: !ref assertRevived
    inputs:
      actual: !cel "resources.appSchema.status.revived"
      expected: ["column users.email"]
  - name: assertNothingReclaimed
    invoke: !ref assertNothingReclaimed
    inputs:
      actual: !cel "resources.appSchema.status.reclaimed"
      expected: []
  - name: assertNothingHeld
    invoke: !ref assertNothingHeld
    inputs:
      actual: !cel "resources.appSchema.status.pendingReclamation"
      expected: []
  - name: assertNoInertRenames
    invoke: !ref assertNoInertRenames
    inputs:
      actual: !cel "resources.appSchema.status.inertRenames"
      expected: []
  - name: read
    invoke: !ref readUsers
    inputs:
      sql: >-
        SELECT email, "displayName" FROM telo_pg_schema_boots.users WHERE id = 1
  - name: assertDataIntact
    invoke: !ref assertDataIntact
    inputs:
      actual: !cel "steps.read.result.rows"
      expected:
        - email: "a@example.com"
          displayName: "a@example.com"
---
kind: Sql.Query
metadata: { name: readUsers }
connection: !ref db
---
kind: Assert.Equals
metadata: { name: assertRevived }
---
kind: Assert.Equals
metadata: { name: assertNothingReclaimed }
---
kind: Assert.Equals
metadata: { name: assertNothingHeld }
---
kind: Assert.Equals
metadata: { name: assertNoInertRenames }
---
kind: Assert.Equals
metadata: { name: assertDataIntact }
