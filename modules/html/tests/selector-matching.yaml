# A nested field's selector is matched against the whole page, so an ancestor
# outside the scope element still counts: `article` is above `#sec`.
kind: Run.Sequence
metadata: { name: nestedScope }
steps:
  - name: parse
    invoke: { kind: Html.JsonTree }
    inputs: { html: !cel "variables.page" }
  - name: extract
    invoke:
      kind: Html.Extraction
      fields:
        section:
          selector: "#sec"
          fields:
            paragraphs: { selector: ":is(article p)", type: text, many: true }
    inputs: { document: !cel "steps.parse.result" }
  - name: assertMatches
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.extract.result.fields.section.paragraphs"
      expected: [one, two]
