kind: Telo.Application
metadata:
  name: ImageBlankSmokeTest
  version: 1.0.0
  description: |
    Smoke test for Image.Blank — produces a 120×80 canvas and asserts the
    output is a PNG with the requested dimensions, mediaType, and that a
    per-invocation color is accepted. A second sequence asserts a jpeg format
    override yields image/jpeg with the JPEG magic bytes. Further sequences
    assert that a zero width, an unrecognized CSS color, a bad format, and an
    out-of-range quality raise ERR_INVALID_INPUT (canvas would otherwise
    silently keep its previous fill color or clamp the quality). Dimensions
    and a quality an expression computes render as the same literals do.
# The bad format reaches the call from a variable, whose declared type (a
# string) is all `telo check` knows of it, so the value meets the RUNTIME
# contract boundary this test is about.
variables:
  badFormat:
    env: TEST_IMAGE_BAD_FORMAT
    type: string
    default: tiff
imports:
  Image: ../
  JS: ../../javascript
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testBlank
  - !ref testJpegFormat
  - !ref testComputedInputs
  - !ref testZeroWidth
  - !ref testBadColor
  - !ref testBadFormat
  - !ref testBadQuality
---
kind: Image.Blank
metadata: { name: canvas }
---
kind: JS.Script
metadata: { name: detectFormat }
code: |
  async function main(input) {
    const b = input.image;
    const png = b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47;
    const jpeg = b[0] === 0xff && b[1] === 0xd8;
    return { magic: png ? "png" : jpeg ? "jpeg" : "other" };
  }
---
kind: Run.Sequence
metadata: { name: testBlank }
steps:
  - name: blank
    inputs: { width: 120, height: 80, color: "#003366" }
    invoke: !ref canvas
  - name: detect
    inputs:
      image: !cel "steps.blank.result.image"
    invoke: !ref detectFormat
  - name: assertBlank
    inputs:
      width: !cel "steps.blank.result.width"
      height: !cel "steps.blank.result.height"
      mediaType: !cel "steps.blank.result.mediaType"
      magic: !cel "steps.detect.result.magic"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          width: { const: 120 }
          height: { const: 80 }
          mediaType: { const: image/png }
          magic: { const: png }
        required: [ width, height, mediaType, magic ]
---
kind: Run.Sequence
metadata: { name: testJpegFormat }
steps:
  - name: blank
    inputs: { width: 120, height: 80, format: jpeg, quality: 70 }
    invoke: !ref canvas
  - name: detect
    inputs:
      image: !cel "steps.blank.result.image"
    invoke: !ref detectFormat
  - name: assertJpeg
    inputs:
      mediaType: !cel "steps.blank.result.mediaType"
      magic: !cel "steps.detect.result.magic"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          mediaType: { const: image/jpeg }
          magic: { const: jpeg }
        required: [ mediaType, magic ]
---
# A `!cel` integer is a 64-bit integer, not the number a YAML literal is.
kind: Run.Sequence
metadata: { name: testComputedInputs }
steps:
  - name: blank
    inputs: { width: !cel "60 * 2", height: !cel "80", format: jpeg, quality: !cel "70" }
    invoke: !ref canvas
  - name: assertComputed
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        width: !cel "steps.blank.result.width"
        height: !cel "steps.blank.result.height"
        mediaType: !cel "steps.blank.result.mediaType"
      expected: { width: 120, height: 80, mediaType: image/jpeg }
---
kind: Run.Sequence
metadata: { name: testZeroWidth }
steps:
  - name: tryBlank
    try:
      - name: blank
        # Deliberately invalid, routed through CEL: a literal is rejected by
        # `telo check` (CONTRACT_INPUTS_MISMATCH), and this test is about the
        # RUNTIME boundary — which is how a real violation arrives anyway, from a
        # computed value rather than something visible in the manifest.
        inputs: { width: !cel "0", height: 80 }
        invoke: !ref canvas
    catch:
      - name: caught
        inputs:
          code: !cel "error.code"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_INPUT_INVALID }
            required: [ code ]
---
kind: Run.Sequence
metadata: { name: testBadColor }
steps:
  - name: tryBlank
    try:
      - name: blank
        inputs: { width: 8, height: 8, color: not-a-color }
        invoke: !ref canvas
    catch:
      - name: caught
        inputs:
          code: !cel "error.code"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_INVALID_INPUT }
            required: [ code ]
---
kind: Run.Sequence
metadata: { name: testBadFormat }
steps:
  - name: tryBlank
    try:
      - name: blank
        # Deliberately invalid, read from a variable: a literal — written plainly
        # or as a CEL literal — is rejected by `telo check`, and this test is
        # about the RUNTIME boundary, which is how a real violation arrives
        # anyway: from a value the manifest does not show.
        inputs: { width: 8, height: 8, format: !cel "variables.badFormat" }
        invoke: !ref canvas
    catch:
      - name: caught
        inputs:
          code: !cel "error.code"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_INPUT_INVALID }
            required: [ code ]
---
kind: Run.Sequence
metadata: { name: testBadQuality }
steps:
  - name: tryBlank
    try:
      # Library would silently clamp 150 → 100; the controller rejects it.
      - name: blank
        # Deliberately invalid, routed through CEL: a literal is rejected by
        # `telo check` (CONTRACT_INPUTS_MISMATCH), and this test is about the
        # RUNTIME boundary — which is how a real violation arrives anyway, from a
        # computed value rather than something visible in the manifest.
        inputs: { width: 8, height: 8, format: jpeg, quality: !cel "150" }
        invoke: !ref canvas
    catch:
      - name: caught
        inputs:
          code: !cel "error.code"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_INPUT_INVALID }
            required: [ code ]
