# Calls the library's function; the kernel refuses the signature's reference
# where it resolves the shape.
kind: Telo.Application
metadata: { name: SignatureShapeKindApp, version: 1.0.0 }
imports: { Lib: ./lib }
targets:
  - name: measured
    invoke: !ref measured
---
kind: Telo.Value
metadata: { name: measured }
value: !cel "Lib.measure(1)"
