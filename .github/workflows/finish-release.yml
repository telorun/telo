name: Finish release

# Dispatched at a release branch in candidates. Builds the final Version PR itself:
# leaves prerelease mode, versions the branch and opens `chore(release): version
# packages` from `changeset-release/<branch>`, replacing an open rc Version PR (which
# is then never published). `.changeset/pre.json` is deleted in that same PR.
#
# Run at the branch ref (`gh workflow run finish-release.yml --ref release/0.85`):
# the branch's own copy of this file and its scripts do the work.

on:
  workflow_dispatch:

concurrency:
  group: finish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finish:
    name: Finish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TELO_BOT_TOKEN }}

      - name: Check
        id: check
        run: node scripts/release-branch.mjs finish-check --ref "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse while a Publish run is in progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --workflow publish.yml --branch "$GITHUB_REF_NAME" --json status --jq '[.[]|select(.status!="completed")]|length')
          if [ "$n" != "0" ]; then
            echo "::error::a Publish run of $GITHUB_REF_NAME is in progress; dispatch Finish release after it completes."
            exit 1
          fi

      - name: Version the final
        run: node scripts/release-version.mjs --final

      # TELO_BOT_TOKEN so the branch's required checks run on the PR. Publish's
      # changesets step rebuilds this same branch and PR.
      - name: Open the Version PR
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TELO_BOT_TOKEN }}
          branch: changeset-release/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          body: |
            Publishes `${{ steps.check.outputs.release }}.0` from `${{ github.ref_name }}`: leaves prerelease mode and deletes `.changeset/pre.json`. Merging it publishes and tags the final.

            An rc Version PR that was open is replaced by this one and its candidate is not published.

      - name: Finish
        env:
          RELEASE: ${{ steps.check.outputs.release }}
          NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "::error::Error: the Version PR was not opened; nothing differs from $GITHUB_REF_NAME."
            exit 1
          fi
          echo "Opened #$NUMBER \"chore(release): version packages\" into $GITHUB_REF_NAME: $RELEASE.0, with .changeset/pre.json deleted."
