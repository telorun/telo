modules:
  modules/ui-react: Added
body: "Breaking for themes: the header's row is now its only child, the new
  `header-content` part, so a rule written `header > header-start` (or over any other
  part of the row) matches nothing and must go through `header-content`; and every theme
  must now give the `width.page` and `space.page` design tokens a value, which a
  contained page's measure and the page and header inset are drawn from.
  `UiReact.App.pageWidth` (`contained` by default) is forwarded to every page, whose
  document carries `width`; `UiReact.App.header.width` (default: `pageWidth`) is
  resolved into the application document as `header.width`, the same on every page, and
  the application document now always carries `header`. `page` and `header` carry
  `data-width`; the base layer insets `main` by `space.page`, draws a contained page no
  wider than `width.page`, centred, and insets the header's content by the same
  expression, so it lines up with a contained page — beside a sidebar too, where the
  header becomes a subgrid of every column and a contained row sits over the page
  column. Reserved: `page`/`max-width`, `margin-inline`, `main`/`padding-inline`,
  `header`/`display`, `grid-template-columns`, `padding-inline`,
  `header-content`/`padding-inline`, `grid-column`. The default theme sets `width.page`
  `64rem` and `space.page` `1.5rem` as tokens, and the contract data lists the tokens
  the renderer reads (`rendererTokens`)."
