# A valid drafted graph the module's own tests and each fixture build on: people
# who know people, in a `shared` layer and a `team` layer built on it, with the
# two bookkeeping tables. A partial rather than an imported library, so every
# reference a rule reads is a local one.
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Layers.NodeTable
metadata: { name: people }
table: people
key: id
columns:
  id: { type: text, nullable: false }
  name: { type: text, nullable: false }
  age: { type: integer }
---
kind: Layers.RelationshipTable
metadata: { name: knowsTable }
table: knows
sourceColumn: source
targetColumn: target
columns:
  source: { type: text, nullable: false }
  target: { type: text, nullable: false }
  since: { type: integer }
---
kind: Layers.LayersTable
metadata: { name: graphLayers }
table: graph_layers
---
kind: Layers.DraftsTable
metadata: { name: graphDrafts }
table: graph_drafts
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref people, !ref knowsTable, !ref graphLayers, !ref graphDrafts]
---
kind: Layers.Node
metadata: { name: person }
table: !ref people
key: id
---
kind: Layers.Relationship
metadata: { name: knows }
table: !ref knowsTable
source: !ref person
target: !ref person
sourceColumn: source
targetColumn: target
---
kind: Layers.Store
metadata: { name: shared }
connection: !ref db
schema: !ref appSchema
layer: shared
nodes: [!ref person]
relationships: [!ref knows]
layers: !ref graphLayers
drafts: !ref graphDrafts
---
kind: Layers.Store
metadata: { name: team }
connection: !ref db
schema: !ref appSchema
layer: team
bases: [!ref shared]
nodes: [!ref person]
relationships: [!ref knows]
layers: !ref graphLayers
drafts: !ref graphDrafts
