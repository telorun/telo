kind: Telo.Application
metadata:
  name: AgentToolLoopTest
  version: 1.0.0
imports:
  Ai: ../
  AiEcho: ./__fixtures__/ai-echo.yaml
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testAgentLoop
---
# Echo emits one deterministic tool call (multiply 6×7) on the first turn when tools
# are present, then echoes the tool result on the second turn — driving a full agent
# loop without a live model.
kind: AiEcho.EchoModel
metadata:
  name: echo
emitToolCall:
  name: multiply
  arguments: { a: 6, b: 7 }
---
kind: Run.Value
metadata:
  name: multiplier
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      a: { type: number }
      b: { type: number }
value:
  product: "${{ inputs.a * inputs.b }}"
---
kind: Ai.Tools
metadata:
  name: localTools
tools:
  - tool: !ref multiplier
    name: multiply
    description: Multiply two numbers.
    parameters:
      type: object
      additionalProperties: false
      required: [ a, b ]
      properties:
        a: { type: number }
        b: { type: number }
---
kind: Ai.Agent
metadata:
  name: assistant
model: !ref echo
system: "Use tools when needed."
toolProviders:
  - provider: !ref localTools
---
kind: Run.Sequence
metadata:
  name: testAgentLoop
steps:
  - name: invoke
    inputs:
      prompt: "multiply 6 and 7"
    invoke: !ref assistant
  # Turn 1 → tool call multiply(6,7) → Multiplier returns {product:42} → tool message
  # content is the JSON-stringified output. Turn 2 → Echo echoes that content as the
  # final answer.
  - name: assertText
    inputs:
      text: "${{ steps.invoke.result.text }}"
      finishReason: "${{ steps.invoke.result.finishReason }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          text:
            type: string
            const: '{"product":42}'
          finishReason:
            type: string
            const: stop
        required: [ text, finishReason ]
  - name: assertTrace
    inputs:
      toolName: "${{ steps.invoke.result.steps[0].toolCalls[0].name }}"
      toolResult: "${{ steps.invoke.result.steps[0].toolResults[0].content }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          toolName:
            type: string
            const: multiply
          toolResult:
            type: string
            const: '{"product":42}'
        required: [ toolName, toolResult ]
