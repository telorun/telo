name: E2E Tests

# End-to-end suites that stand up, or reach out to, something real — a
# docker-compose stack, a live model, the live hub. Each job is self-contained.
#
# They are separate from the module suite for a second reason too: an app's
# tests pin PUBLISHED module versions, so they also fail while a change has
# landed in this repo but not yet been released and re-pinned. That is a real
# signal about the release sequence, and it should not make a module-suite
# failure ambiguous.
#
# PULL REQUESTS ONLY. These are the expensive suites — a compose stack with a
# model sidecar, and tens of minutes of live agent turns — and running them
# again on the merge commit re-pays for a result the PR already gave. The cost
# is that nothing catches a break arriving through a path the PR gate does not
# watch (`cli/`, `kernel/`); `workflow_dispatch` is how that gets run on demand
# when a change there is suspected.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Brings up the discovery-hub stack (db=pgvector, storage, embedder, hub) via
  # docker-compose and runs `apps/hub/test-suite-e2e.yaml` against the live HTTP
  # + MCP surface. The embedder is a self-hosted embeddinggemma-300m sidecar, so
  # the suite exercises the full semantic (vector) ranking path, not just lexical.
  hub:
    name: Hub E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check hub manifest
        run: pnpm run check apps/hub/telo.yaml

      # The container no longer reaches into the workspace — the tracker uses the
      # `telo` the base image ships. This build is kept as a compile check for
      # the host-side e2e suite below.
      - name: Build workspace packages
        run: pnpm -r run build

      - name: Bring up hub stack
        run: |
          mkdir -p apps/hub/.telo
          # Generous wait-timeout: the embedder pulls the TEI image and downloads
          # the embeddinggemma-300m ONNX weights on first boot before it is healthy.
          docker compose up -d --build --wait --wait-timeout 420 db storage embedder hub \
            || { echo "::group::hub stack failed to come up"; \
                 docker compose ps -a; docker compose logs --no-color; \
                 echo "::endgroup::"; exit 1; }

      - name: Wait for the first tracking pass to finish
        run: |
          # The hub is healthy well before its first tracking pass finishes, and
          # the pass walks SEED_REFS in order. Waiting only on "some vector rows
          # exist" let the suite start after the first ref embedded, so
          # assertions about a ref late in the seed (console is last) raced the
          # tracker and saw an index holding only its earlier entries.
          #
          # Waiting on `last_tracked_at` alone is the same mistake one level up,
          # and it let this race back in: that column is stamped when a ref's
          # pass ENDS — success or failure — by a different step than the one
          # that writes the kind rows, so the gate can pass over an index holding
          # a fraction of them. The suite then fails on an assertion diff about
          # search results rather than on "the index is not ready", which is what
          # it actually saw.
          #
          # So wait on what the assertions READ, and read it the way the hub
          # does: every search path joins `rk.version = m.latest_version`, so a
          # module is queryable only once its LATEST version's kinds are in.
          # Counting kinds at any version is not the same test and passed over
          # exactly this — `console` carries 40 kind rows across its versions and
          # 4 at its latest, `run` 104 and 7 — so a gate counting rows saw both
          # as ready while a search for either returned nothing. Plus at least
          # one embedding, for the semantic assertion.
          # And treat a recorded `last_error` as a hard failure rather than as a
          # ref that finished — a failed ingest satisfies `last_tracked_at` and
          # would otherwise be reported, minutes later, as a mysteriously empty
          # search. Expected count comes from the hub's own environment, so
          # editing SEED_REFS never leaves this gate behind.
          expected=$(docker compose exec -T hub printenv SEED_REFS | jq 'length' 2>/dev/null || echo "")
          if ! [ "${expected:-0}" -gt 0 ] 2>/dev/null; then
            echo "::error::could not read SEED_REFS from the hub container"
            exit 1
          fi
          echo "seeded refs: $expected"
          psql() { docker compose exec -T db psql -U postgres -d hub -tAc "$1" 2>/dev/null | tr -d '[:space:]'; }
          for i in $(seq 1 60); do
            failed=$(psql "SELECT count(*) FROM modules WHERE last_error IS NOT NULL" || echo 0)
            if [ "${failed:-0}" -gt 0 ]; then
              echo "::error::$failed seeded ref(s) failed to ingest"
              docker compose exec -T db psql -U postgres -d hub \
                -c "SELECT ref, last_error FROM modules WHERE last_error IS NOT NULL ORDER BY ref"
              docker compose logs --no-color hub
              exit 1
            fi
            total=$(psql "SELECT count(*) FROM modules" || echo 0)
            indexed=$(psql "SELECT count(*) FROM modules m WHERE coalesce(m.latest_version, '') <> '' AND EXISTS (SELECT 1 FROM resource_kinds rk WHERE rk.module_id = m.id AND rk.version = m.latest_version)" || echo 0)
            kinds=$(psql "SELECT count(*) FROM resource_kinds rk JOIN modules m ON m.id = rk.module_id AND m.latest_version = rk.version" || echo 0)
            vectors=$(psql "SELECT count(*) FROM resource_vectors" || echo 0)
            echo "modules: ${indexed:-0}/${total:-0} queryable of $expected seeded; kinds at latest: ${kinds:-0}; resource_vectors: ${vectors:-0}"
            if [ "${total:-0}" -ge "$expected" ] && [ "${indexed:-0}" -ge "$expected" ] \
               && [ "${vectors:-0}" -gt 0 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::hub never indexed a LATEST-version kind for every seeded ref"
          docker compose exec -T db psql -U postgres -d hub \
            -c "SELECT m.ref, m.latest_version, m.last_tracked_at, m.last_error,
                       count(rk.*) FILTER (WHERE rk.version = m.latest_version) AS kinds_at_latest,
                       count(rk.*) AS kinds_any_version
                  FROM modules m LEFT JOIN resource_kinds rk ON rk.module_id = m.id
                 GROUP BY m.id, m.ref, m.latest_version, m.last_tracked_at, m.last_error
                 ORDER BY m.ref" || true
          docker compose logs --no-color hub embedder
          exit 1

      - name: Run hub e2e suite
        run: pnpm run test:e2e:hub

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop hub stack
        if: always()
        run: docker compose down -v

  # The authoring agent drives a real model against the live hub and authors a
  # manifest against PINNED PUBLISHED modules. No stack to bring up — what makes
  # it e2e is the live model and registry — but it is separated from the module
  # suite on the same grounds as the hub's: a red run here can mean "not
  # released and re-pinned yet" rather than "the code is wrong".
  authoring-agent:
    name: Authoring Agent E2E
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The suite drives a real model through whole agent turns, so it costs
      # tens of minutes and real tokens on every run. Gated on the agent's own
      # files rather than skipped by a workflow-level `paths:` filter: a job
      # that never STARTS never reports, and a required check that never
      # reports blocks the merge it was meant to guard. This job always runs and
      # always reports; what it skips is the expensive part.
      #
      # Knowingly NOT in the trigger set: `cli/` and `kernel/`. The agent runs
      # `telo` from this checkout, so a change there really can break it — but
      # including them would re-run the suite on most pull requests, which is
      # the cost this gate exists to remove. Nothing else covers that coupling
      # now the workflow no longer runs on main, so a change there that is
      # expected to reach the agent wants a manual `workflow_dispatch`.
      - name: Decide whether the agent changed
        id: changed
        shell: bash
        run: |
          # A manual dispatch is someone asking for this suite by name.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Full history is already checked out (fetch-depth: 0), so this only
          # makes sure the base branch ref exists locally. NOT shallow: a
          # depth-limited ref has no merge base with HEAD, and the three-dot
          # diff below needs one.
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          # FAIL OPEN. A gate that cannot work out what changed must run the
          # suite, not skip it: skipping turns a broken gate into a silently
          # disabled test, which is the one outcome worse than paying for a run.
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD") || {
            echo "run=true" >> $GITHUB_OUTPUT
            echo "Could not diff against the base — running the suite anyway." >> $GITHUB_STEP_SUMMARY
            exit 0
          }
          if printf '%s\n' "$changed" \
             | grep -qE '^(apps/authoring-agent/|\.github/workflows/e2e\.yml$)'; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No authoring-agent changes — skipping the live suite." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Setup Node.js
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        if: steps.changed.outputs.run == 'true'
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run authoring agent e2e suite
        if: steps.changed.outputs.run == 'true'
        run: pnpm run test:e2e:authoring-agent
