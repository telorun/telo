      message: "names a key column that cannot hold one statement per layer"
---
kind: Assert.Manifest
metadata: { name: nodeKeyNotLayerableAtRuntime }
source: ./__fixtures__/rules/node-key-not-layerable-app.yaml
expect:
  errors: []
  runFails: "GRAPH_NODE_KEY_NOT_LAYERABLE"
---
kind: Assert.Manifest
metadata: { name: nodeTableUnique }
source: ./__fixtures__/rules/node-table-unique/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "is stored in a table that declares a primary key, a unique column or a unique index"
---
kind: Assert.Manifest
metadata: { name: nodeTableUniqueAtRuntime }
source: ./__fixtures__/rules/node-table-unique-app.yaml
expect:
  errors: []
  runFails: "GRAPH_TABLE_UNIQUE_DECLARED"
---
kind: Assert.Manifest
metadata: { name: endpointUnknownColumn }
source: ./__fixtures__/rules/endpoint-unknown-column/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "names a sourceColumn or targetColumn its table does not declare"
---
kind: Assert.Manifest
metadata: { name: endpointUnknownColumnAtRuntime }
