kind: Telo.Library
metadata:
  name: CrudFixtureCountless
  version: 1.0.0
  description: >-
    Test fixture: a database connection that returns the rows it was given for
    every statement that reads columns, and no row at all for a count.
imports:
  Sql: ../../../../sql
exports:
  kinds: [Connection]
---
kind: Telo.Definition
metadata:
  name: Connection
  description: >-
    Answers a column read with the configured rows and a count with an empty
    result, as a driver that reports no row count would.
capability: Telo.Provider
extends: Sql.Connection
controllers:
  - pkg:telo/local/js?path=./connection.mjs#Connection
schema:
  type: object
  additionalProperties: false
  required: [rows]
  properties:
    rows:
      type: array
      items: { type: object }
