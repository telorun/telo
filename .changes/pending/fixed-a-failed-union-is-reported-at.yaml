units:
  analyzer: Fixed
  kernel: Fixed
body: "A failed union is reported at the variant its tag selects. A branch whose own
  schema refuses the value's JSON type is no candidate, and a tag is a place every
  candidate constrains by const or enum in its own schema, so a constant under items or
  a nested union no longer hides the real defect behind `matches no alternative`. A
  required member a branch pins to a constant or an enum is a selector: a branch it
  refuses is the wrong shape and is listed among the alternatives (`one with 'address'
  equal to true`), not reported as a failure. The kernel's failure path now decides a
  union nested in a named shape it reaches, as `telo check` does."
