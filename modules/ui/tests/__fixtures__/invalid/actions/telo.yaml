# Actions and row actions that each write something `telo check` refuses on
# the line it was written: a key the kind does not take (`lists` among them), a
# list of the answer read from something that is no list or by an expression, a
# column reading a member its row or its answer does not declare, a navigation
# or a refresh that is no address, and row inputs — of a table or of a list —
# that cannot make a record of the action they are handed to or read a root
# nothing binds there.
kind: Telo.Application
metadata:
  name: UiInvalidActionsApp
  version: 1.0.0
imports:
  Ui: ../../../../
  DataModel: ../../../../../data-model
---
kind: Telo.JsonSchema
metadata:
  name: Request
schema:
  type: object
  properties:
    month: { type: string }
---
kind: Telo.JsonSchema
metadata:
  name: Answer
schema:
  type: object
  properties:
    kind: { type: string }
    files:
      type: array
      items:
        type: object
        properties:
          name: { type: string }
---
kind: Ui.Action
metadata:
  name: strayKey
inputModel: !ref Request
source: { path: /api/reports }
label: Generate
method: PUT
---
kind: Ui.Action
metadata:
  name: rowTypo
inputModel: !ref Request
outputModel: !ref Answer
source: { path: /api/reports }
label: Generate
result:
  type: list
  rows: !cel "result.files"
  columns:
    - value: !cel "row.nmae"
---
kind: Ui.Action
metadata:
  name: rowsNotAList
inputModel: !ref Request
outputModel: !ref Answer
source: { path: /api/reports }
label: Generate
result:
  type: list
  rows: !cel "result.kind"
  columns:
    - value: !cel "result.kind"
---
kind: Ui.Action
metadata:
  name: rowsComputed
inputModel: !ref Request
outputModel: !ref Answer
source: { path: /api/reports }
label: Generate
result:
  type: list
  rows: !cel "size(result.files)"
  columns:
    - value: !cel "result.kind"
---
kind: Ui.Action
metadata:
  name: noAnswerModel
inputModel: !ref Request
source: { path: /api/reports }
label: Generate
result:
  type: list
  rows: !cel "result.files"
  columns:
    - value: fixed
---
kind: Ui.Action
metadata:
  name: listsRemoved
inputModel: !ref Request
outputModel: !ref Answer
source: { path: /api/reports }
label: Generate
lists: []
---
kind: Ui.Action
metadata:
  name: navigateOff
inputModel: !ref Request
source: { path: /api/reports }
label: Generate
onSuccess:
  navigate: ftp://files.example/report
  refreshes: [api/reports]
---
kind: Telo.JsonSchema
metadata:
  name: Todo
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
    name: { type: string }
---
kind: Telo.JsonSchema
metadata:
  name: Archive
schema:
  type: object
  additionalProperties: false
  required: [id]
  properties:
    id: { type: integer }
    status: { type: string }
---
kind: Telo.JsonSchema
metadata:
  name: Rename
schema:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name: { type: string }
---
kind: Ui.Action
metadata:
  name: archive
inputModel: !ref Archive
source: { path: /api/todos/archive }
label: Archive
---
kind: Ui.Action
metadata:
  name: rename
inputModel: !ref Rename
source: { path: /api/todos/rename }
label: Rename
---
kind: Ui.CollectionPresentation
metadata: { name: todos }
source:
  kind: Ui.CollectionSource
  basePath: /api/todos
  collection:
    kind: DataModel.Collection
    model: !ref Todo
    query: { filters: [], sort: [] }
---
# Each map is held to its own action's model, so this one is clean.
kind: Ui.Listing
metadata:
  name: eachItsOwn
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref archive
    inputs: { id: !cel "row.id", status: archived }
  - action: !ref rename
    inputs: { name: !cel "row.name" }
    confirm: Rename it?
---
kind: Ui.Listing
metadata:
  name: rowMemberUnknown
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref archive
    inputs: { id: !cel "row.missing" }
---
kind: Ui.Listing
metadata:
  name: chainMistyped
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref archive
    inputs: { id: !cel "row.name" }
---
kind: Ui.Listing
metadata:
  name: inputComputed
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref archive
    inputs: { id: !cel "row.id + 1" }
---
kind: Ui.Listing
metadata:
  name: inputsAbsent
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref rename
---
kind: Ui.Listing
metadata:
  name: inputsEmpty
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref rename
    inputs: {}
---
kind: Ui.Listing
metadata:
  name: confirmFlag
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref rename
    inputs: { name: !cel "row.name" }
    confirm: true
---
kind: Ui.Listing
metadata:
  name: confirmEmpty
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref rename
    inputs: { name: !cel "row.name" }
    confirm: ""
---
kind: Ui.Listing
metadata:
  name: queryTypo
model: !ref Todo
presentation: !ref todos
query:
  status: { type: string }
rowActions:
  - action: !ref archive
    inputs: { id: !cel "row.id", status: !cel "query.statuss" }
---
# A list's row actions: one reads a root no form binds here, one leaves the
# action's required input unbound.
kind: Ui.Data
metadata:
  name: listRowActions
model:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      todos: { type: array, items: !ref Todo }
source: { path: /api/todos }
content:
  type: list
  rows: !cel "data.todos"
  columns: [{ value: !cel "row.name" }]
  rowActions:
    - action: !ref archive
      inputs: { id: !cel "row.id", status: !cel "values.folder" }
    - action: !ref archive
      inputs: { status: !cel "row.name" }
