kind: Telo.Library
metadata:
  name: CacheMemory
  version: 0.8.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Performance, Storage]
  description: |
    In-process cache storage: entries live in the running process's memory with the
    usual fresh and stale windows, bounded by a maximum entry count. Needs no
    external service, so it suits single-instance deployments, local development
    and tests.
imports:
  Cache: ../cache
exports:
  kinds:
    - Store
---
kind: Telo.Definition
metadata:
  name: Store
  description: >-
    Caches entries in the process's own memory, bounded by a maximum entry count that
    evicts the oldest write first. Nothing is shared between instances and nothing
    survives a restart.
capability: Telo.Provider
extends: Cache.Store
controllers:
  - pkg:telo/local/js?path=./nodejs/store-controller.mjs&local_path=./nodejs/src/store-controller.ts
schema:
  type: object
  additionalProperties: false
  properties:
    maxEntries:
      title: Max Entries
      type: integer
      minimum: 1
      default: 10000
      description: >-
        Maximum number of entries retained. When exceeded, the oldest-written
        entry is evicted (FIFO).
