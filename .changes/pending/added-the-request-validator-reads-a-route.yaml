units:
  modules/http-server: Added
body: "The request validator reads a route schema's `pattern`, `patternProperties` keys
  and `format: regex` as RE2, through the same seam as every Telo validator, and a
  route's request and response schemas are judged before the app runs: a pattern RE2
  cannot read (a lookahead, a backreference) is refused by `telo check` at the pattern,
  and the load is refused with it. Breaking: such a route no longer starts, and `.`,
  `\\s` and `\\S` in a request pattern match as RE2 matches them."
