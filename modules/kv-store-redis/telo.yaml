kind: Telo.Library
metadata:
  name: KeyValueStoreRedis
  version: 0.9.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Storage]
  description: |
    Redis-backed key/value storage with atomic conditional writes, shared across every
    instance of an application and namespaced by a key prefix. Each write is decided
    at the server in a single step, so two callers racing for the same key can never
    both win. When Redis is unreachable, operations fail loudly rather than falling
    back. Run the server with eviction disabled.
requires:
  # 0.82.0: controllers return their effects from `init()` / `run()`; a runtime that
  # does not execute a returned chain allocates nothing and undoes nothing.
  # 0.129.0: `durationMs` from `@telorun/sdk`, which an older runtime lacks (controller load fails).
  # 0.130.0: a `d` / `w` duration literal at a `Telo.Duration` slot reads only from this release.
  telo: ">=0.130.0"
imports: { KvStore: ../kv-store }
exports: { kinds: [Store] }
---
kind: Telo.Definition
metadata:
  name: Store
  description: >-
    Stores records in Redis under a key prefix, with every conditional write decided
    atomically at the server so racing callers cannot both succeed. Requires a server
    configured not to evict keys before their TTL.
capability: Telo.Provider
extends: KvStore.Store
controllers: [pkg:telo/local/js?path=./nodejs/kv-store-redis.mjs&local_path=./nodejs/src/index.ts#store]
schema:
  type: object
  required: [url]
  additionalProperties: false
  properties:
    url:
      title: URL
      type: string
      x-telo-eval: compile
      description: Redis connection URL, e.g. `redis://localhost:6379` or `rediss://…`.
    keyPrefix:
      title: Key Prefix
      type: string
      default: "telo:kv:"
      x-telo-eval: compile
      description: >-
        Prefix applied to every key, so unrelated key spaces can share one Redis
        instance without colliding.
    connectTimeout:
      title: Connect Timeout
      x-telo-type: { name: Telo.Duration, minimum: 0s }
      x-telo-eval: compile
      description: How long to wait for a Redis connection before failing; `2s` when omitted.
