# Consumes the unpinned library. Its analysis is entry-scoped, so the library's
# block is invisible here — the kernel's refusal to hand over an unverifiable
# staged asset is what fails it.
kind: Telo.Application
metadata:
  name: UnpinnedAssetApp
  version: 1.0.0
imports:
  Lib: ./lib/unpinned.yaml
targets:
  - invoke: !ref read
---
kind: Lib.Reader
metadata:
  name: read
