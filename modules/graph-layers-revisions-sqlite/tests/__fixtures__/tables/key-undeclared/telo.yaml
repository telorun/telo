# A layered node table whose 'key' names no column it declares. No node type
# references it, so only the table kind's own rule can report it.
kind: Telo.Library
metadata:
  name: KeyUndeclared
imports:
  Layers: ../../../..
  SQLite: ../../../../../sqlite
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Layers.NodeTable
metadata: { name: people }
table: people
key: uid
columns:
  id: { type: text, nullable: false }
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref people]
