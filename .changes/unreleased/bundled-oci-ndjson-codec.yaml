project: ndjson-codec
kind: Added
body: >-
  The controller now ships inside the module artifact as a bundle (pkg:telo/local/js) instead of being fetched from npm at load. Importing this module needs no npm registry at run time, and its version is a single number again: metadata.version. The kernel builds the controller from source while the module is a working copy, so a checkout needs no build step.
time: 2026-08-01T00:00:00.000000000+00:00
