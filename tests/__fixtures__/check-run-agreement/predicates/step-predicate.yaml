# A step `if:` that produces a string, not a boolean.
kind: Telo.Application
metadata:
  name: StepPredicate
  version: 1.0.0
imports:
  Run: ../../../../modules/run
variables:
  flag:
    env: FLAG
    type: string
    default: "false"
targets:
  - !ref pick
---
kind: Run.Sequence
metadata: { name: pick }
steps:
  - name: branch
    if: !cel "variables.flag"
    then:
      - name: taken
        value: true
