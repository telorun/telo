        kinds: [text, text, listing, component, text, text, listing, component, text, text, listing, component, text, text, stack, component, text, text, listing, component, text, text, text, text, listing, component, text, text, listing, component, text, text, listing, component, text, text, listing, component, text, text, listing, component, text, text, listing, component, text, text, listing, component]
        derived:
          columns:
            - [ title, Task ]
            - [ "-", Project ]
            - [ "-", Assignee ]
            - [ status, Status ]
            - [ priority, Priority ]
            - [ estimate, Estimate ]
            - [ dueOn, Due ]
            - [ "-", Label ]
            - [ "-", Blocked ]
          pageSize: 25
          create:
            - openPage
            - { value: /tasks/new }
            - &dialog { type: dialog, size: medium, modal: true, dismiss: { escape: true, outside: true, closeButton: true } }
          edit:
            - openPage
