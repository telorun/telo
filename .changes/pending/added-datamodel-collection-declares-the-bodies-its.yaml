units:
  modules/data-model: Added
body: "DataModel.Collection declares the bodies its writes accept as schemas: { create,
  update }, each a Telo.Type, published beside the model; a write left out is one the
  collection does not accept. The collection contract now updates by PATCH
  <basePath>/<key value>, a JSON Merge Patch (application/merge-patch+json) answering
  200 with the stored record, and PUT leaves the contract. A collection may send a
  strong ETag on read-one and on every write answer and honour If-Match on PATCH and
  DELETE, answering a stale validator with 412."
