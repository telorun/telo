kind: Telo.Application
metadata:
  name: ScoreApi
  version: 1.0.0
  description: Lead scoring API — designed to exercise as much CEL as possible per request.
imports:
  Http: ../../modules/http-server
  Run: ../../modules/run
targets:
  - !ref server
---
# Pure passthrough — keeps the handler trivial so per-request time is dominated
# by CEL evaluation in the route-level inputs and returns blocks.
kind: Run.Value
metadata:
  name: passThrough
  module: ScoreApi
value: !cel "inputs"
---
kind: Http.Server
metadata:
  name: server
  module: ScoreApi
baseUrl: http://localhost:8845
port: 8845
mounts:
  - path: /v1
    mount: !ref routes
---
kind: Http.Api
metadata:
  name: routes
  module: ScoreApi
routes:
  # POST /score — lead scoring, ~70 CEL expressions per request.
  #
  # Type discipline: JSON-parsed numbers come into CEL as dyn<double>; literal
  # ints in CEL are int. CEL has no overload for `int OP dyn<double>`, so
  # numeric literals here use `.0` suffix to stay in the double domain, and
  # `size()` — which returns int — is wrapped in `double()` wherever its result
  # takes part in that arithmetic. Serialization needs no such cast: an int
  # reaches the wire as its exact digits.
  - request:
      path: /score
      method: POST
      schema:
        body:
          type: object
          required: [ lead ]
          properties:
            lead:
              type: object
    handler: !ref passThrough
    # Route-level inputs (~20 CEL) — pre-compute reusable signals once and
    # pass them to the handler. The handler returns them verbatim so the
    # `returns` block sees them as `result.*`.
    inputs:
      email: !cel "request.body.lead.email"
      domain: !cel "request.body.lead.email.split('@')[1]"
      validEmail: !cel "request.body.lead.email.contains('@') && double(size(request.body.lead.email)) > 5.0"
      companyName: !cel "request.body.lead.company.name"
      companySize: !cel "request.body.lead.company.employees"
      companyAge: !cel "2026.0 - request.body.lead.company.founded"
      country: !cel "request.body.lead.company.country"
      industry: !cel "request.body.lead.company.industry"
      plan: !cel "request.body.lead.plan"
      source: !cel "request.body.lead.attrs.source"
      hasUtm: !cel "has(request.body.lead.attrs.utm)"
      utmCampaign: !cel "has(request.body.lead.attrs.utm) ? request.body.lead.attrs.utm.campaign : 'none'"
      eventCount: !cel "double(size(request.body.lead.events))"
      eventTypes: !cel "request.body.lead.events.map(e, e.type)"
      # Per-iteration predicates intentionally do meaningful AST work — multiple
      # comparisons, nested has() checks, in-list membership, string ops — so
      # tree-walking vs bytecode dispatch is exercised at scale across 100 events.
      demoCount: !cel "double(size(request.body.lead.events.filter(e, e.type == 'demo_request' && has(e.ts) && e.ts.startsWith('2026') && double(e.score) > 30.0)))"
      pricingCount: !cel "double(size(request.body.lead.events.filter(e, e.type == 'pricing_view' && has(e.ts) && double(e.score) > 20.0 && double(size(e.tags)) > 0.0)))"
      contactCount: !cel "double(size(request.body.lead.events.filter(e, e.type == 'contact_sales' && double(e.score) > 10.0)))"
      intentCount: !cel "double(size(request.body.lead.events.filter(e, e.type in ['demo_request', 'pricing_view', 'contact_sales'] && double(e.score) > 25.0 && has(e.ts) && e.ts.startsWith('2026'))))"
      hasIntent: !cel "request.body.lead.events.exists(e, e.type in ['demo_request', 'pricing_view', 'contact_sales'] && double(e.score) > 50.0)"
      allEventsValid: !cel "request.body.lead.events.all(e, has(e.type) && double(size(e.type)) > 0.0 && has(e.ts) && double(size(e.ts)) > 10.0)"
      # Tag-membership checks via flat `in` against each event's tag list.
      # cel-vm has a bug with nested comprehension macros (e.tags.exists inside
      # events.filter), so we use the equivalent flat form: `'tag' in e.tags`.
      priorityCount: !cel "double(size(request.body.lead.events.filter(e, 'priority' in e.tags || 'high' in e.tags || 'enterprise' in e.tags)))"
      engagedCount: !cel "double(size(request.body.lead.events.filter(e, 'engaged' in e.tags || 'returning' in e.tags)))"
      hasEnterpriseTag: !cel "request.body.lead.events.exists(e, 'enterprise' in e.tags)"
      avgScore: !cel "double(size(request.body.lead.events)) > 0.0 ? request.body.lead.events.map(e, double(e.score)).filter(s, s > 0.0).map(s, s) : []"
      highScoreCount: !cel "double(size(request.body.lead.events.filter(e, double(e.score) > 50.0)))"
      tagDiversity: !cel "double(size(request.body.lead.events.map(e, e.tags).filter(ts, double(size(ts)) > 1.0)))"
    returns:
      - status: 200
        # Returns body (~50 CEL) — derive a rich response from `result.*`
        # (which is whatever inputs computed, since the handler is passthrough).
        content:
          application/json:
            body:
              lead:
                email: !cel "result.email"
                domain: !cel "result.domain"
                validEmail: !cel "result.validEmail"
                corporateDomain: !cel "result.domain.endsWith('.com') || result.domain.endsWith('.io') || result.domain.endsWith('.co')"
                personal: !cel "result.domain in ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com', 'icloud.com']"
              company:
                name: !cel "result.companyName"
                employees: !cel "result.companySize"
                sizeBand: !cel "result.companySize > 1000.0 ? 'enterprise' : result.companySize > 100.0 ? 'mid' : result.companySize > 10.0 ? 'smb' : 'startup'"
                ageYears: !cel "result.companyAge"
                established: !cel "result.companyAge > 5.0"
                new: !cel "result.companyAge <= 2.0"
                country: !cel "result.country"
                region: !cel "result.country == 'US' || result.country in ['CA', 'MX'] ? 'NA' : result.country in ['DE', 'FR', 'NL', 'UK', 'IE', 'ES', 'IT'] ? 'EU' : result.country in ['JP', 'SG', 'AU', 'IN'] ? 'APAC' : 'OTHER'"
                priorityCountry: !cel "result.country in ['US', 'DE', 'UK', 'JP', 'CA']"
                industry: !cel "result.industry"
                isB2B: !cel "result.industry in ['saas', 'fintech', 'enterprise', 'manufacturing']"
              events:
                total: !cel "result.eventCount"
                demos: !cel "result.demoCount"
                pricing: !cel "result.pricingCount"
                contact: !cel "result.contactCount"
                intent: !cel "result.intentCount"
                types: !cel "result.eventTypes"
                hasIntent: !cel "result.hasIntent"
                allValid: !cel "result.allEventsValid"
                engaged: !cel "result.eventCount > 5.0"
                veryEngaged: !cel "result.eventCount > 15.0"
                highVolume: !cel "result.eventCount > 50.0"
                intentRatio: !cel "result.eventCount > 0.0 ? result.intentCount / result.eventCount : 0.0"
                priorityCount: !cel "result.priorityCount"
                engagedCount: !cel "result.engagedCount"
                hasEnterpriseTag: !cel "result.hasEnterpriseTag"
                highScoreCount: !cel "result.highScoreCount"
                tagDiversity: !cel "result.tagDiversity"
                scoredEvents: !cel "result.avgScore"
                qualityRatio: !cel "result.eventCount > 0.0 ? result.highScoreCount / result.eventCount : 0.0"
                priorityRatio: !cel "result.eventCount > 0.0 ? result.priorityCount / result.eventCount : 0.0"
              plan:
                current: !cel "result.plan"
                paid: !cel "result.plan != 'free' && result.plan != 'trial'"
                tier: !cel "result.plan == 'enterprise' ? 4.0 : result.plan == 'growth' ? 3.0 : result.plan == 'starter' ? 2.0 : result.plan == 'trial' ? 1.0 : 0.0"
                isPremium: !cel "result.plan == 'enterprise' || result.plan == 'growth'"
              attrs:
                source: !cel "result.source"
                organic: !cel "result.source in ['organic', 'direct', 'referral']"
                paid: !cel "result.source in ['ppc', 'sem', 'social', 'display']"
                hasUtm: !cel "result.hasUtm"
                utmCampaign: !cel "result.utmCampaign"
              score:
                company: !cel "result.companySize > 1000.0 ? 50.0 : result.companySize > 100.0 ? 30.0 : result.companySize > 10.0 ? 15.0 : 5.0"
                engagement: !cel "result.eventCount * 3.0 + result.intentCount * 10.0"
                plan: !cel "result.plan == 'enterprise' ? 40.0 : result.plan == 'growth' ? 25.0 : result.plan == 'starter' ? 10.0 : 0.0"
                geo: !cel "result.country == 'US' ? 20.0 : result.country in ['DE', 'FR', 'NL', 'UK', 'CA', 'AU'] ? 15.0 : 5.0"
                source: !cel "result.source in ['organic', 'direct', 'referral'] ? 10.0 : 5.0"
                industry: !cel "result.industry in ['saas', 'fintech', 'enterprise'] ? 15.0 : 5.0"
                email: !cel "result.validEmail ? 5.0 : 0.0"
                total: !cel "(result.companySize > 1000.0 ? 50.0 : result.companySize > 100.0 ? 30.0 : result.companySize > 10.0 ? 15.0 : 5.0) + (result.eventCount * 3.0 + result.intentCount * 10.0) + (result.plan == 'enterprise' ? 40.0 : result.plan == 'growth' ? 25.0 : result.plan == 'starter' ? 10.0 : 0.0) + (result.country == 'US' ? 20.0 : result.country in ['DE', 'FR', 'NL', 'UK', 'CA', 'AU'] ? 15.0 : 5.0) + (result.source in ['organic', 'direct', 'referral'] ? 10.0 : 5.0) + (result.industry in ['saas', 'fintech', 'enterprise'] ? 15.0 : 5.0) + (result.validEmail ? 5.0 : 0.0)"
              tier: !cel "((result.companySize > 1000.0 ? 50.0 : result.companySize > 100.0 ? 30.0 : result.companySize > 10.0 ? 15.0 : 5.0) + (result.eventCount * 3.0 + result.intentCount * 10.0) + (result.plan == 'enterprise' ? 40.0 : result.plan == 'growth' ? 25.0 : result.plan == 'starter' ? 10.0 : 0.0) + (result.country == 'US' ? 20.0 : result.country in ['DE', 'FR', 'NL', 'UK', 'CA', 'AU'] ? 15.0 : 5.0) + (result.source in ['organic', 'direct', 'referral'] ? 10.0 : 5.0) + (result.industry in ['saas', 'fintech', 'enterprise'] ? 15.0 : 5.0) + (result.validEmail ? 5.0 : 0.0)) > 120.0 ? 'A' : ((result.companySize > 1000.0 ? 50.0 : result.companySize > 100.0 ? 30.0 : result.companySize > 10.0 ? 15.0 : 5.0) + (result.eventCount * 3.0 + result.intentCount * 10.0) + (result.plan == 'enterprise' ? 40.0 : result.plan == 'growth' ? 25.0 : result.plan == 'starter' ? 10.0 : 0.0) + (result.country == 'US' ? 20.0 : 5.0) + (result.source in ['organic', 'direct', 'referral'] ? 10.0 : 5.0) + (result.industry in ['saas', 'fintech', 'enterprise'] ? 15.0 : 5.0) + (result.validEmail ? 5.0 : 0.0)) > 80.0 ? 'B' : 'C'"
              summary: !cel "result.companyName + ' (' + (result.companySize > 1000.0 ? 'enterprise' : result.companySize > 100.0 ? 'mid' : 'small') + ', ' + result.country + ') — ' + string(result.eventCount) + ' events on ' + result.plan + ' plan'"
