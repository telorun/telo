---
# The image half of the same account, over the same injected request: a
# different HTTP surface, including the multipart one edit, inpaint and variation
# use — framed as bytes and sent under the boundary-bearing content type, which
# `Http.Request` carries like any other byte body. `$defs/Intent` is what
# Ai.Image derives its own `intent` field from (x-telo-schema-from), so naming a
# mode this endpoint has no route for fails `telo check` instead of throwing at
# dispatch.
kind: Telo.Definition
metadata:
  name: ImageModel
  description: >-
    An image model served by OpenAI or an OpenAI-compatible endpoint: model id, the
    request every call goes through, and default request options (size, quality,
    count, output format) that per-call overrides win over. Generation, editing,
    inpainting and variations.
capability: Telo.Provider
extends: Ai.ImageModel
controllers:
  - pkg:telo/local/js?path=./nodejs/openai.mjs&local_path=./nodejs/src/index.ts#ImageModelController
schema:
  type: object
  properties:
    model:
      title: Model ID
      description: OpenAI image model identifier passed to the API (e.g. gpt-image-1, dall-e-3).
      type: string
    request:
      title: Request
      description: >-
        The HTTP request every call is made through. Its client carries the base URL
        and the credential, so an account is declared once and the 401
        re-acquire-and-retry is inherited rather than re-implemented here. Point it at
        a client whose `baseUrl` is the endpoint (`https://api.openai.com/v1`, or a
        gateway's).
      x-telo-ref:
        kind: Http.Request
        use: call
    options:
      title: Options
      description: >-
        Model-level defaults as camelCase OpenAI image request params (size, quality,
        n, outputFormat, background, …), normalized to snake_case. Merged beneath
        Ai.Image.options and its per-call inputs.options; downstream wins.
      type: object
      additionalProperties: true
  required: [ model, request ]
  additionalProperties: false
  $defs:
    # The reference-image modes this endpoint routes: edit and inpaint go to
    # /images/edits, variation to /images/variations. Style and structure
    # conditioning have no route here, so they are absent rather than accepted and
    # rejected later.
    Intent:
      title: Intent
      type: string
      enum: [ edit, inpaint, variation ]
  examples:
    - model: gpt-image-1
      request: !ref openaiRequest
      options:
        size: 1024x1024
        quality: low
    - model: dall-e-3
      request: !ref openaiRequest
      options:
        size: 1024x1024
---
# The embeddings endpoint, which was its own module until the merge. One module
# per SYSTEM rather than per endpoint: moderation, audio, batch and files arrive
# as further kinds here rather than as a module apiece.
kind: Telo.Definition
metadata:
  name: EmbeddingModel
  description: >-
    An embedding model served by OpenAI or an OpenAI-compatible endpoint: model id,
    the request every call goes through — whose client carries the base URL and the
    credential — and an optional output dimensionality.
capability: Telo.Provider
extends: Embedding.Model
controllers:
  - pkg:telo/local/js?path=./nodejs/openai.mjs&local_path=./nodejs/src/index.ts#EmbeddingModelController
schema:
  type: object
  required: [model, request]
  additionalProperties: false
  properties:
    model:
      title: Model ID
      description: OpenAI embedding model identifier (e.g. text-embedding-3-small).
      type: string
    request:
      title: Request
      description: >-
        The HTTP request every call is made through. Its client carries the base URL
        and the credential, so an account is declared once and the 401
        re-acquire-and-retry is inherited rather than re-implemented here.
      x-telo-ref:
        kind: Http.Request
        use: call
    dimensions:
      title: Dimensions
      description: Output dimensionality. v3 models support truncating to fewer dimensions.
      type: integer
      minimum: 1
    options:
      title: Options
      description: Extra request params merged into the /embeddings body; per-call options win.
      type: object
      additionalProperties: true
  examples:
    - model: text-embedding-3-small
      request: !ref openaiRequest
      dimensions: 1536
