units:
  analyzer: Added
body: "x-telo-context-from reads its path from the object holding the region and may
  cross reference sites, each segment after one continuing in the declaration it names,
  resolved in the module that wrote the reference. Where the path lands decides the
  reading: a value at a reference site is the type it names (its properties, required
  kept), any other value a property map, so a map with an entry named type or properties
  is read as names rather than as a JSON Schema. A crossing that cannot be resolved
  here, such as a library's resource input, leaves the binding open; a declaration with
  no such field leaves it closed and empty. Go-to-declaration on such a binding lands on
  the crossed declaration's field. An x-telo-value-schema-from finding names a pointer
  location as a path of the resource (input.model), in full from an inline declaration's
  place."
