units:
  apps/docker-runner: Security
  apps/k8s-runner: Security
body: "An application's kernel debug stream, whose event payloads can include secrets,
  is no longer reachable from the session's network: telo run --inspect binds 127.0.0.1
  inside the workload, and the runner reads the stream through the session supervisor's
  authenticated port forward, so a run no longer opens with the '[inspect] binding
  0.0.0.0' warning while its debug events still arrive. A session's containers left by
  an earlier runner build speak the previous supervisor generation and are recreated
  when the runner adopts the session."
