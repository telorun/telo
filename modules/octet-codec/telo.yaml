kind: Telo.Library
metadata:
  name: OctetCodec
  version: 0.11.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Data]
  description: |
    Raw binary on the wire: bytes pass through untouched on the way out, and on the
    way in every chunk is collected into one contiguous buffer. The codec to use for
    files, images and any payload that is already in its final byte form.
imports:
  Codec: ../codec
exports:
  kinds:
    - Encoder
    - Decoder
---
# Encoder: byte stream → byte stream (identity).
kind: Telo.Definition
metadata:
  name: Encoder
  description: >-
    Passes a byte stream through unchanged, for payloads that are already in their
    final form and need no serialization.
capability: Telo.Invocable
extends: Codec.Encoder
controllers:
  - pkg:telo/local/js?path=./nodejs/octet-codec.mjs&local_path=./nodejs/src/index.ts#EncoderController
schema:
  type: object
  additionalProperties: false
---
# Decoder: byte stream → single Uint8Array (collect).
kind: Telo.Definition
metadata:
  name: Decoder
  description: >-
    Collects every chunk of a byte stream into a single contiguous buffer, for when a
    payload has to be held whole rather than consumed incrementally.
capability: Telo.Invocable
extends: Codec.Decoder
controllers:
  - pkg:telo/local/js?path=./nodejs/octet-codec.mjs&local_path=./nodejs/src/index.ts#DecoderController
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      bytes:
        x-telo-type: Telo.Bytes
        description: Every chunk in `input`, concatenated into one run of bytes.
    required: [ bytes ]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
