kind: Telo.Application
metadata: { name: NamedShapeSlot }
lang: en
imports: { V: ../__fixtures__/views }
targets: []
---
kind: V.Data
metadata: { name: me }
source: { path: /api/me }
reloadOn: [focus, unauthorized]
content: { type: text, text: Signed in }
---
