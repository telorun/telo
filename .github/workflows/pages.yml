name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the sitemap derives each page's <lastmod> from the
          # file's git log, which a shallow clone does not carry.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm --filter "@telorun/pages..." build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}
          # Set only here: this is the build that becomes telo.run, so no local
          # or preview build can report into the production Plausible site.
          PLAUSIBLE_DOMAIN: telo.run

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
