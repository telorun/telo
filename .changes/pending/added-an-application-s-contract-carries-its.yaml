modules:
  apps/hub: Added
body: "An application's contract carries its requiredness: each input's `required` is
  true only where some configuration of the application requires it, with `requiredWhen`
  listing those configurations, a `default` is served only where one is declared, and
  `dimensions` names each key's values and the environment variables it is read from.
  Ingest revision 10 re-ingests every tracked version to record them, and refuses an
  application whose `telo module manifest --json` payload carries no `dimensions`."
