kind: Telo.Application
metadata:
  name: TodoApp
  version: 1.0.0
  categories: [ Transport, Storage ]
  description: |
    A complete app served as one unit: the REST todo API and the vanilla HTML/JS
    frontend that consumes it (`Http.Static`), on a single port. The whole REST
    surface is one declarative `Crud.Resource` — list / read / create / update /
    delete over the `todos` table — mounted alongside the static frontend.

    Run, then open http://localhost:8077.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.37.0#sha256-oUJEa_MoII_3QxsUplbceh0NkOSY1Sztd1JsVtBmcJ8
  Sql: oci://ghcr.io/telorun/sql@0.28.0#sha256-JC2SN6Ha8hlq9gnRGahvVNVwe-cUXHXtS8rdeo1BC24
  SQLite: oci://ghcr.io/telorun/sqlite@0.10.0#sha256-qTwG1VYpO8_AGN2UaJPWEIHyt1rt8OUlxLKtLcJkf4Q
  Crud: oci://ghcr.io/telorun/crud@0.26.0#sha256-6QhGLwE7wRFRUJoOjtNveov8xzl8BWWPD9QaF2cRiZg
targets:
  - !ref migrate
  - !ref server
# Studio's starter import copies only literal `files:` entries.
files:
  - public/app.js
  - public/index.html
  - public/style.css
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8077
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: Telo.HostPath
    default: todo.db
---
kind: SQLite.Connection
metadata:
  name: db
file: !cel "variables.dbFile"
---
kind: SQLite.Table
metadata:
  name: todos
table: todos
columns:
  id: { type: integer, primaryKey: true, identity: always }
  text: { type: text, nullable: false }
  is_done: { type: integer, nullable: false, default: 0 }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
tables:
  - !ref todos
---
kind: Http.Server
metadata:
  name: server
port: !cel "ports.http"
openapi:
  info:
    title: Todo API
    version: 1.0.0
mounts:
  - path: /api/todos
    mount:
      kind: Crud.Resource
      connection: !ref db
      plural: todos
      singular: todo
      model:
        kind: Crud.Model
        schemas:
          read: !ref Todo
          list: !ref Todo
          create: !ref TodoDraft
          update: !ref TodoDraft
        query:
          filters:
            - { property: isDone, operator: eq }
          sort: []

  - path: /
    mount: !ref ui
---
# What a client writes.
kind: Telo.JsonSchema
metadata:
  name: TodoDraft
schema:
  type: object
  required: [ text ]
  additionalProperties: false
  properties:
    text: { type: string, minLength: 1 }
    isDone: { type: boolean }
---
# What is read back: the draft plus the key the table assigns.
kind: Telo.JsonSchema
metadata:
  name: Todo
extends: TodoDraft
schema:
  type: object
  required: [ id, isDone ]
  properties:
    id: { type: integer }
---
kind: Http.Static
metadata:
  name: ui
root: !module-path ./public
