kind: Telo.Library
metadata:
  name: TemplatedServer
  version: 1.0.0
  description: |
    Reusable Telo.Library that defines a single `helloApi` (`Http.Api`) plus
    the `sayHello` handler it dispatches to. Importers receive `helloApi`
    under their chosen alias and can mount it on any `Http.Server`. Paired
    with `telo.yaml`, which mounts the same library twice
    under `/v1` and `/v2` to show import + mount reuse.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.40.0#sha256-_siVH-ocHHO9CzJB00KYSR7-VhMXsFiJGQXGhqtgfns
  Run: oci://ghcr.io/telorun/run@0.30.0#sha256-xce3zcKQZYXAuMPQqUW4R0avisqZWYowLDLeaP7wXkc
exports:
  resources:
    - helloApi
---
kind: Http.Api
metadata:
  name: helloApi
routes:
  - request:
      path: /hello
      method: GET
      schema:
        query:
          type: object
          properties:
            name:
              type: string
          required: [ "name" ]
    handler: !ref sayHello
    inputs:
      name: !cel "request.query.name" # CEL expression
    returns:
      - status: 200
        content:
          application/json:
            schema:
              type: object
              properties:
                greeting: { type: string }
                nice: { type: string }
              required: [ greeting, nice ]
              additionalProperties: false
            body:
              greeting: !interpolate "${{ result.message }}!"
              nice: "WOW"
---
kind: Run.Value
metadata:
  name: sayHello
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      name: { type: string }
value:
  message: !cel "'Hello ' + inputs.name + '!'"
---
