kind: Telo.Application
metadata:
  name: FeedbackApiExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/feedback-api-repo` and posts, lists and rejects feedback. The
    rejected rating is the assertion worth having: the request schema is what keeps
    an out-of-range value from ever reaching the database.
imports:
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    ports: { http: 8844 }
targets:
  - !ref app
steps:
  - name: post
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8844/v1/feedback
      method: POST
    inputs: { body: { text: the docs made sense, rating: 5 } }
  - name: verifyPosted
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.post.result.status"
        body: !cel "steps.post.result.body"
      expected: { status: 201, body: { ok: true, message: Feedback received } }

  - name: badRating
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8844/v1/feedback
      method: POST
    inputs: { body: { text: out of range, rating: 9 } }
  - name: verifyRejected
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.badRating.result.status"
      expected: 400

  - name: list
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8844/v1/feedback
      method: GET
  - name: verifyListed
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.list.result.status"
        text: !cel "steps.list.result.body[0].text"
        rating: !cel "steps.list.result.body[0].rating"
      expected: { status: 200, text: the docs made sense, rating: 5 }
