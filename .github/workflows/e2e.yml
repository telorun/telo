name: E2E Tests

# End-to-end suites that stand up, or reach out to, something real — a
# docker-compose stack, a live model, the live hub. Each job is self-contained.
#
# They are separate from the module suite for a second reason too: an app's
# tests pin PUBLISHED module versions, so they also fail while a change has
# landed in this repo but not yet been released and re-pinned. That is a real
# signal about the release sequence, and it should not make a module-suite
# failure ambiguous.
#
# PULL REQUESTS ONLY. These are the expensive suites — a compose stack with a
# model sidecar, and live model conversations — and running them again on the
# merge commit re-pays for a result the PR already gave. The cost is that
# nothing catches a break arriving through a path a job's gate does not watch;
# `workflow_dispatch` is how that gets run on demand when a change there is
# suspected.
#
# The authoring agent's suite is not here: it runs only on demand, from
# `authoring-agent-e2e.yml`.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # `pnpm run test:e2e:hub` — the same command a developer runs — stands up a
  # fresh discovery-hub stack (db=pgvector, storage, embedder, hub, and hub-web on
  # its production target) under a compose project of its own, waits for the
  # hub's first tracking pass, runs `apps/hub/test-suite-e2e.yaml` then
  # `apps/hub-web/test-suite-e2e.yaml`, and tears the stack down. The hub suite's
  # integration tests run against the stack's own db, through the `DB_*` the
  # command supplies — this job sets none. The embedder is
  # a self-hosted embeddinggemma-300m sidecar, so the suite exercises the full
  # semantic (vector) ranking path, not just lexical.
  hub:
    name: Hub E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gated on what the hub stack is made of, same reasoning and same shape
      # as the job below: this job always runs and always reports, and what it
      # skips is the build and the compose stack.
      #
      # The runtime IS in the trigger set here, unlike below: the hub container
      # mounts this checkout and runs its CLI, so a change to the runtime is a
      # change to the hub. `modules/` is not — the hub and hub-web pin
      # PUBLISHED modules. hub-web, the compose files and the command that
      # drives the stack are not manifests, so they are matched by path beside
      # what `telo changed` walks.
      - name: Decide whether the hub changed
        id: changed
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run() { echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT_NAME" = "pull_request" ] || run
          git fetch --no-tags origin "$BASE_REF" || true
          base="origin/$BASE_REF"
          # FAIL OPEN: only a diff that was taken and an explicit empty
          # `affected` list skip.
          changed=$(git diff --name-only "$base...HEAD") || run
          if grep -qE '^((kernel|analyzer|sdk|templating|cel|cli|apps/hub|apps/hub-web)/|(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|Dockerfile[^/]*|docker-compose[^/]*\.ya?ml|scripts/hub-e2e\.mjs|\.github/workflows/e2e\.yml)$)' <<<"$changed"; then run; fi
          affected=$(pnpm run --silent telo changed \
               apps/hub/telo.yaml apps/hub/test-suite-e2e.yaml apps/hub-web/test-suite-e2e.yaml \
               --base "$base" -o json | jq '.affected | length') || run
          [ "$affected" = "0" ] || run
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "No hub or runtime changes — skipping the hub e2e suite." >> "$GITHUB_STEP_SUMMARY"

      - name: Check hub manifest
        if: steps.changed.outputs.run == 'true'
        run: pnpm run check apps/hub/telo.yaml

      # The hub container mounts the checkout and runs its CLI, both for the hub
      # itself and for every origin read. This build is kept as a compile check
      # for the host-side e2e suites.
      - name: Build workspace packages
        if: steps.changed.outputs.run == 'true'
        run: pnpm -r run build

      # On failure the suites' output and the stack's logs are in `e2e-logs/`;
      # `--debug` writes each suite's event log (`.telo.debug.jsonl`) beside it.
      - name: Run hub e2e
        if: steps.changed.outputs.run == 'true'
        run: pnpm run test:e2e:hub

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-hub-logs
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            e2e-logs/
            apps/hub/.telo.debug.jsonl
            apps/hub-web/.telo.debug.jsonl

  # The two interactive examples — `agent-console` and `chat-console` — driven
  # through real conversations against a real model. They are here rather than in
  # the module suite because they cost tokens and minutes on every run. What they
  # cover is not coverable any other way — a REPL's second turn exists only
  # because its first was answered.
  live-examples:
    name: Live example conversations
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gated on the two examples' own dependency graphs rather than skipped
      # by a workflow-level `paths:` filter: a job that never starts never
      # reports, and a required check that never reports blocks the merge it
      # was meant to guard. This job always runs and always reports; what it
      # skips is the expensive part.
      #
      # `telo changed` walks the same relative-`imports:` edges `telo release`
      # propagates a version bump along, so a change to a local sibling either
      # example imports is caught the same way release would attribute it —
      # without building anything. Neither example currently imports one
      # relatively (both pin published `oci://` modules), so today this is
      # equivalent to globbing each example's own directory, but it stops
      # being a silent gap the day one of them starts to.
      - name: Decide whether a live example changed
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          # FAIL OPEN: only an explicit empty `affected` list skips. A crash, a
          # bad flag or a missing toolchain yields no list, and treating that as
          # "nothing changed" turns a broken gate into a silently disabled test
          # — the one outcome worse than paying for a run.
          affected=$(pnpm run --silent telo changed \
               examples/agent-console/telo.yaml examples/chat-console/telo.yaml \
               examples/test-suite-live.yaml .github/workflows/e2e.yml \
               --base "origin/${{ github.base_ref }}" -o json | jq '.affected | length') || true
          if [ "$affected" = "0" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No agent-console/chat-console changes — skipping the live suite." >> $GITHUB_STEP_SUMMARY
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Run the live example suite
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p e2e-logs
          # Not `pnpm exec`: it puts a RELATIVE `./node_modules/.bin` first on PATH,
          # and Bun's spawn stops at it with ENOENT for a child whose working
          # directory differs — a test's `bun …/telo.ts` then cannot start.
          export PATH="$PWD/node_modules/.bin:$PATH"
          bun ./cli/nodejs/bin/telo.ts --debug ./examples/test-suite-live.yaml 2>&1 | tee e2e-logs/live-examples.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-examples-logs
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            e2e-logs/
            examples/.telo.debug.jsonl

  # A session's own containers through the k8s runner's chart: a kind cluster
  # (whose CNI enforces NetworkPolicy), the runner and the kernel built from this
  # tree, the chart installed with `session.containers.enabled=true`, and one
  # container-backed integration test run unchanged as a RUN session over `/v1`
  # — `scripts/runner-containers-e2e.mjs --kubernetes`, the same session the
  # script runs against the docker runner locally. The session must exit 0 and
  # leave no pod or network policy behind. The test's PostgreSQL runs as
  # `999:999` with its data in the container layer, which is what the session
  # namespace's `restricted` Pod Security standard has to admit.
  runner-containers:
    name: Runner session containers (kind)
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # FAIL OPEN, like the jobs above: only a diff that was taken and reaches
      # none of the runner, the runtime, the two container modules, the test or
      # this workflow skips.
      - name: Decide whether the runner's session containers changed
        id: changed
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run() { echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT_NAME" = "pull_request" ] || run
          git fetch --no-tags origin "$BASE_REF" || true
          base="origin/$BASE_REF"
          changed=$(git diff --name-only "$base...HEAD") || run
          if grep -qE '^((kernel|analyzer|sdk|templating|cel|cli|packages/runner-core|apps/k8s-runner)/|(pnpm-lock\.yaml|scripts/runner-containers-e2e\.mjs|\.github/workflows/e2e\.yml)$)' <<<"$changed"; then run; fi
          affected=$(pnpm run --silent telo changed \
               modules/vector-store-pgvector/tests/integration/filtered-top-k.yaml \
               --base "$base" -o json | jq '.affected | length') || run
          [ "$affected" = "0" ] || run
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "No runner or container-module changes — skipping the kind session-container run." >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        if: steps.changed.outputs.run == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the kind cluster
        if: steps.changed.outputs.run == 'true'
        uses: helm/kind-action@v1
        with:
          version: v0.27.0
          cluster_name: telo

      # Every image a session needs is loaded into the node, so nothing is pulled
      # from inside the cluster: the runner and the kernel built from this tree,
      # the bundle-fetch init image and the test's database.
      - name: Build and load the images
        if: steps.changed.outputs.run == 'true'
        run: |
          docker build -f apps/k8s-runner/Dockerfile --target production -t telo-k8s-runner:e2e .
          docker build -f cli/nodejs/Dockerfile --target lean-slim -t telo-dev/node:local .
          docker pull busybox:stable
          docker pull pgvector/pgvector:pg18
          kind load docker-image --name telo telo-k8s-runner:e2e telo-dev/node:local busybox:stable pgvector/pgvector:pg18

      - name: Install the chart with session containers on
        if: steps.changed.outputs.run == 'true'
        run: |
          helm install telo-runner apps/k8s-runner/chart --wait --timeout 5m \
            --set image.repository=telo-k8s-runner \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set session.image=telo-dev/node:local \
            --set session.baseImages.enabled=false \
            --set sessionRouting.mode=none \
            --set session.containers.enabled=true

      - name: Run a container-backed test as a session
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          kubectl -n telo-runner port-forward svc/telo-k8s-runner 8062:8062 > port-forward.log 2>&1 &
          node scripts/runner-containers-e2e.mjs --kubernetes \
            --runner-url http://127.0.0.1:8062 \
            --namespace telo-sessions \
            --image telo-dev/node:local

      - name: Show the cluster on failure
        if: failure() && steps.changed.outputs.run == 'true'
        run: |
          kubectl get pods,networkpolicies -A -o wide || true
          kubectl -n telo-sessions describe pods || true
          kubectl -n telo-runner logs deploy/telo-k8s-runner --tail 300 || true
          cat port-forward.log || true
