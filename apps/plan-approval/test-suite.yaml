kind: Telo.Application
metadata:
  name: PlanApprovalTestSuite
  version: 1.0.0
  description: |
    The plan-approval server's own tests, offline: each boots the server with
    its own port and SQLite file and drives it over HTTP. Separate from the repo
    suite, which excludes `apps/**`.

        telo ./apps/plan-approval/test-suite.yaml
variables:
  include:
    type: array
    items: { type: string }
    arg: include
    description: Glob pattern selecting the test manifests to run, relative to this file.
    default:
    - "tests/*.yaml"
  exclude:
    type: array
    items: { type: string }
    arg: exclude
    description: Glob pattern excluding test manifests, relative to this file.
    default:
    - "**/__fixtures__/**"
  filter:
    type: string
    arg: { position: 0 }
    description: Run only the tests whose path contains this text.
    default: ""
  concurrency:
    type: integer
    minimum: 1
    arg: concurrency
    description: How many tests run at once.
    default: 3
imports:
  Test: oci://ghcr.io/telorun/test@0.12.1#sha256-LoRRakT2KUhuzX6lYbeV538caqd05AjutR7JDUpTwHY
targets:
  - !ref runAll
---
kind: Test.Suite
metadata: { name: runAll }
include: !cel "variables.include"
exclude: !cel "variables.exclude"
filter: !cel "variables.filter"
concurrency: !cel "variables.concurrency"
