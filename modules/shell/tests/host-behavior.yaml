kind: Telo.Application
metadata:
  name: ShellHostBehavior
  version: 1.0.0
  description: |
    Shell.LocalHost behaviors: the configured `cwd` is honored, stdin is
    delivered, a command that ignores stdin doesn't crash the kernel (EPIPE on
    the writable is absorbed), and `timeoutMs` kills the command and throws.
imports:
  Shell: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
kind: Shell.LocalHost
metadata: { name: root }
cwd: /
---
kind: Shell.LocalHost
metadata: { name: local }
---
kind: Run.Sequence
metadata:
  name: test
steps:
  - name: cwd
    inputs:
      command: pwd
    invoke:
      kind: Shell.Command
      host: !ref root

  - name: stdin
    inputs:
      command: cat
      stdin: piped-input
    invoke:
      kind: Shell.Command
      host: !ref local

  # `true` exits immediately without reading stdin — writing to it would EPIPE.
  # The controller absorbs that, so this returns cleanly rather than crashing.
  - name: stdinIgnored
    inputs:
      command: "true"
      stdin: ignored
    invoke:
      kind: Shell.Command
      host: !ref local

  - name: assertBasics
    inputs:
      actual:
        cwd: !cel "steps.cwd.result.stdout"
        stdin: !cel "steps.stdin.result.stdout"
        ignoredCode: !cel "steps.stdinIgnored.result.exitCode"
      expected:
        cwd: "/\n"
        stdin: piped-input
        ignoredCode: 0
    invoke:
      kind: Assert.Equals

  - name: timeout
    try:
      - name: sleep
        inputs:
          command: "sleep 5"
          timeoutMs: 100
        invoke:
          kind: Shell.Command
          host: !ref local
    catch:
      - name: assertTimedOut
        inputs:
          actual: !cel "error.message"
          pattern: "timed out"
        invoke:
          kind: Assert.Matches
