units:
  cel: Added
body: "The type checker reads more of a JSON Schema, and reads unions member by member.
  A record type's `open` flag is replaced by `additionalFields`, the type of every
  member the record does not declare (absent: closed), so `additionalProperties: {type:
  string}` beside `properties` types an undeclared member as a string; a host reading
  `open` reads whether `additionalFields` is present instead. `absentFields` names the
  members whose schema admits no value (`false`, `not: {}`), which only a presence test
  reads; a closed record keeps them too. An open record now stands wherever a
  string-keyed map does, so `'k' in x` checks over one. A list type carries a tuple's
  positions as `prefixElements` and the type past them as `additionalElements`, read
  from `items` with `additionalItems` and from `prefixItems` with `items`: a literal
  index reads its position, and one past a closed tuple is refused. `not` removes the
  types it excludes wholly (`type: [string, \"null\"], not: {type: \"null\"}` reads as
  `string`) and `if` / `then` / `else` reads as the union of its two branches; neither
  is reported as unread any more. `tupleOf` and `recordOf` build the two shapes. A call
  or operator no overload takes as written is resolved over each combination of its
  union-typed arguments' members, at most `UNION_EXPANSION_LIMIT` (64), so `type(x)`
  over `string|map` and `string(x)` over a duration or a timestamp check, while
  `string(x)` over `int|null` is still refused, now naming the combination no overload
  takes (`string(null) is taken by none`); a call past the limit is refused, asking for
  a type test, and a call no overload of its name takes at its number of arguments is
  refused as written, never expanded. `==` / `!=` against `null` check over any type,
  and `==`, `!=` and `in` check where their sides share a type (`int|string ==
  int|bool`), while `1 == 'a'` is still refused. `type(x) == string` (with `!=`, `!` and
  `type(e)` on the other side) narrows `x` in the branch it guards, as a null test does.
  A type parameter bound at several arguments takes their join, so `xs + ys` over a list
  of string maps and a list of records checks and `[1] + ['a']` is still refused. A
  comprehension over a union of lists and maps binds the union of their elements and
  keys. A member read through `allOf` names the part that types it: at a record's field
  or undeclared members, a list's element, a tuple's position or rest and a map's value,
  one a single part types other than `dyn` is located at that part's node in
  `schemaNode` and `resultOrigins`, one several parts type is located nowhere, a member
  declared absent at the first part declaring it so, and two equal unions meet member by
  member; `schemaDependencies` through an intersection lists what the meet compared
  rather than every part whole. `patternParts` carries a record's `patternProperties`
  one schema part at a time: each part's entries in written order, each pattern (matched
  as RE2) with the type it gives, and the part's `additionalFields`, the type it gives a
  member another part's pattern matches and none of its own does. A member a pattern
  matches is typed by the meet of its `properties` entry and every matching pattern, or
  with no `properties` entry by the meet over the parts of each part's matching entries,
  else that part's `additionalFields`, and by the record's `additionalFields` only where
  no pattern matches, located at the one node that applies and nowhere where several do,
  so every `allOf` of records carrying patterns is read exactly and `allOf: [S, S]` is
  S; a pattern admitting no value makes the names it matches absent; and a record with
  patterns stands wherever a string-keyed map does. A meet that cannot hold at a member
  position is now absence rather than `intersection-empty` for the whole schema: the
  field is absent, the pattern entry admits no value, undeclared members close, a list
  holds no element and a map no entry, and `intersection-empty` is reported only at a
  registration's root. A computed-key index on any record now reads the union of every
  field, pattern and undeclared member type, each from its own node, rather than `dyn`,
  so `x[k] + 1` over `{a: string, b: integer}` is refused. A pattern RE2 refuses is
  reported `shape-not-read` and leaves the undeclared members `dyn`. Record equality,
  the environment digest, `schemaOwnTypesAgree` and `schemaDependencies` carry
  `patternParts`; `recordOf` / `record_of` take the parts as their last argument, and
  the Rust crate's `RecordType::admits_undeclared` is removed. CEL type text (`typeName`
  on a check result, every diagnostic naming a type): written whole up to 64 type nodes,
  then cut with `...`. `ResolvedCall.argumentTypes` now holds each namespaced call
  argument's type itself (`CelType[]`; in `telorun-cel`, `Vec<CelType>`), and the text
  it held moves to `argumentTypeNames` (`argument_type_names`): a host that read the
  text reads `argumentTypeNames` instead, and one that parsed it reads the type. A named
  type's arguments are compared as types, so `Box<{a: int}>` and `Box<{b: string}>` —
  both printed `Box<map>` — are now refused as different type arguments.
  `NamespaceListing.functions` now lists each function as `{ declaration, resultType? }`
  (`NamespaceFunctionListing` in both engines) where it listed strings: `declaration` is
  the text an entry was — a result declared as a schema now cut as every printed type is
  — and `resultType` is the CEL type of a result declared as a JSON Schema, present
  exactly then, which the environment digest reads structurally. `convertsToString`
  (`converts_to_string`) now answers whether a call `string(x)` over the type resolves
  as the checker resolves one, so a union every member of which converts converts."
