kind: Telo.Library
metadata:
  name: MigrationLib
  version: 1.0.0
imports:
  Sql: ../../../
  SQLite: ../../../../sqlite
exports:
  resources: [ db, migrate ]
---
kind: SQLite.Connection
metadata:
  name: db
file: ":memory:"
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
version: !cel "module.version"
migrations:
  20260401_create_users:
    statements:
      - "CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT NOT NULL)"
      - "INSERT INTO users (id, name) VALUES (1, 'Alice')"
