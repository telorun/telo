project: oauth-client
kind: Fixed
body: >-
  `AuthorizationServer`'s declared `outputType` now includes
  `issuerParameterSupported` and `timeoutMs`, which it has always returned. The
  contract forbade them under `additionalProperties: false`; nothing enforced it,
  so the drift went unseen until the kernel began validating provider results.
