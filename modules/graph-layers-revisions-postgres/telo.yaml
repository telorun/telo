kind: Telo.Library
metadata:
  name: GraphLayersRevisionsPostgres
  version: 0.1.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Storage, Data]
  description: >-
    Keeps versioned knowledge graphs in PostgreSQL: every entity type and link type is
    a table the application declares, shared by all layers, and every published
    revision of a layer is retained. A layer is built on pinned revisions or
    labelled releases of other layers and upgraded by moving a pin, merging
    three ways per property. Parallel drafts read consistent snapshots and
    publish atomically; history is a change feed by revision number.
requires:
  # The node and relationship kinds write `x-telo-schema-projection-from` on the
  # kind document, the relationship kind in its object form (`{ from, omit }`).
  # 0.104.0 checks this file clean but reads neither kind as projecting, so a
  # graph operation over a revisioned relationship type is refused
  # (SCHEMA_PROJECTION_FROM_UNRESOLVED). Verified by execution (run there on the SQLite twin, whose kind documents write the same syntax): with
  # this block stripped, `run` of relationship operations over a revisioned
  # store fails on 0.104.0 and passes on 0.105.0, 0.107.0 and 0.113.0; with it,
  # `check` on 0.104.0 reports MODULE_REQUIRES_NEWER_RUNTIME. The drafting and
  # history operations are `GraphLayers`' kinds and carry that module's own,
  # higher floor: the drafting suite and this module's own run whole from
  # 0.108.0.
  telo: ">=0.105.0"
imports:
  GraphLayersSql: ../graph-layers-sql
  Postgres: ../postgres
exports:
  kinds:
    - NodeTable
    - RelationshipTable
    - Node
    - Relationship
    - Store
    - LayersTable
    - ChangesetsTable
    - ChangesetBasesTable
---
# GraphLayersRevisionsPostgres.NodeTable — a `Postgres.Table` whose rows are VERSIONS of node statements:
# one per changeset and key, each current from one revision of its layer to
# another. The author declares the node's own columns in the engine's
# vocabulary; `base:` adds the version bookkeeping as internal columns and the
# indexes its three access paths read through, so none of it reaches a
# contract. `columns` is forwarded bare: a column typed by a `!ref` to an enum
# must cross as the reference it is.
kind: Telo.Definition
metadata:
  name: NodeTable
  description: >-
    One PostgreSQL table holding a type of graph entity for every layer and every
    revision at once: the application declares the entity's own columns and its
    key, and the table adds the version bookkeeping and the indexes that keep
    one current statement per layer and key and serve reads as of any revision.
    Created and migrated by the schema that lists it.
extends: Postgres.Table
x-telo-schema-projection:
  entries: /columns
  key: type
  nullable: nullable
  array: array
  reference:
    from: values
    keyword: enum
    base: { type: string }
schema:
  type: object
  additionalProperties: false
  required: [table, key, columns]
  examples:
    - table: people
      key: id
      columns:
        id: { type: text, nullable: false }
        name: { type: text }
  properties:
    table:
      title: Table
      description: The physical table name.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    key:
      title: Key
      description: >-
        The column identifying a node within a layer; the table keeps one current
        statement per layer and key. Declare it `nullable: false`.
      type: string
      minLength: 1
    columns:
      title: Columns
      description: >-
        The node's own columns, keyed by name: the key and every property. The
        version bookkeeping columns are added by the table and never written here:
        no name may begin `graph_`.
      type: object
      minProperties: 1
      # `graph_` is the table's own: the bookkeeping columns `base:` adds.
      propertyNames:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        not:
          pattern: "^graph_"
      additionalProperties:
        type: object
        additionalProperties: false
        required:
          - type
        not:
          required:
            - default
            - defaultExpression
        allOf:
          - if:
              required:
                - nullable
              properties:
                nullable:
                  const: true
              anyOf:
                - required:
                    - primaryKey
                  properties:
                    primaryKey:
                      const: true
                - required:
                    - identity
            then: false
          - if:
              anyOf:
                - required:
                    - primaryKey
                  properties:
                    primaryKey:
                      const: true
                - required:
                    - identity
            then:
              properties:
                nullable:
                  default: false
            else:
              properties:
                nullable:
                  default: true
        properties:
          type:
            title: Type
            description: PostgreSQL type — a storage class, or a reference to an enum this schema
              declares. Parameters are structured fields (`length`, `precision`, `scale`), never
              spelled into this value, so nothing has to parse a type back apart.
            oneOf:
              - title: Storage class
                type: string
                enum:
                  - text
                  - varchar
                  - char
                  - citext
                  - uuid
                  - json
                  - jsonb
                  - boolean
                  - smallint
                  - integer
                  - bigint
                  - numeric
                  - real
                  - doublePrecision
                  - date
                  - time
                  - timestamp
                  - timestamptz
                  - interval
                  - bytea
                  - inet
                  - cidr
                  - macaddr
                  - tsvector
                x-telo-schema-map:
                  text:
                    type: string
                  varchar:
                    type: string
                  char:
                    type: string
                  citext:
                    type: string
                  uuid:
                    type: string
                  json: {}
                  jsonb: {}
                  boolean:
                    type: boolean
                  smallint:
                    type: integer
                  integer:
                    type: integer
                  bigint:
                    type: integer
                  numeric:
                    type: number
                  real:
                    type: number
                  doublePrecision:
                    type: number
                  date:
                    type: string
                  time:
                    type: string
                  timestamp:
                    type: string
                  timestamptz:
                    type: string
                  interval:
                    type: string
                  bytea:
                    x-telo-type: Telo.Bytes
                  inet:
                    type: string
                  cidr:
                    type: string
                  macaddr:
                    type: string
                  tsvector:
                    type: string
              - title: Enum type
                description: "A `!ref` to an enum this schema declares. `use: schema` for the reason a
                  foreign key's target table takes it: what the reconciler needs is the physical
                  name, which the declaration carries, so nothing here requires the type to be
                  constructed first."
                type: object
                x-telo-ref:
                  kind: Postgres.Enum
                  use: schema
          length:
            title: Length
            description: Character length for `varchar` / `char`.
            type: integer
            minimum: 1
          precision:
            title: Precision
            description: Total digits for `numeric`.
            type: integer
            minimum: 1
          scale:
            title: Scale
            description: Fractional digits for `numeric`.
            type: integer
            minimum: 0
          array:
            title: Array
            description: Declares the column as a one-dimensional array of `type`. Multi-dimensional
              arrays project as one level.
            type: boolean
            default: false
          nullable:
            title: Nullable
            description: Whether the column admits NULL. Omitted, it is false on a primary key or an
              identity column and true on any other.
            type: boolean
          primaryKey:
            title: Primary Key
            type: boolean
            default: false
          unique:
            title: Unique
            type: boolean
            default: false
          identity:
            title: Identity
            description: Makes the column `GENERATED … AS IDENTITY`. `always` refuses a
              caller-supplied value; `by default` allows one.
            type: string
            enum:
              - always
              - by default
          default:
            title: Default
            description: "A typed literal, checkable against the column's own type. Mutually
              exclusive with `defaultExpression`: nothing can tell `gen_random_uuid` the
              function from the string by looking at it."
          defaultExpression:
            title: Default Expression
            description: Raw PostgreSQL expression evaluated by the database (`gen_random_uuid()`, `now()`).
            type: string
            contentMediaType: application/sql
            x-telo-widget: code
          renamedFrom:
            title: Renamed From
            description: The column this one supersedes. The pass adds this column, copies the old
              one into it and tombstones the old one — a native rename would take effect
              immediately and break the version still running. During the window writes land
              only in the new column, so a rollback reads stale data.
            type: string
    indexes:
      title: Indexes
      description: >-
        Further indexes keyed by name — for a property a filter reads. None may be
        unique, and none may be named `graph_…`, the prefix of the table's own
        indexes; an index may name the table's bookkeeping columns.
      type: object
      propertyNames:
        not:
          pattern: "^graph_"
      additionalProperties:
        type: object
        additionalProperties: false
        required:
          - columns
        properties:
          columns:
            title: Columns
            type: array
            minItems: 1
            items:
              type: string
          unique:
            title: Unique
            type: boolean
            default: false
          method:
            title: Method
            description: Index method (`btree`, `gin`, `gist`, `hash`, `brin`).
            type: string
            enum:
              - btree
              - gin
              - gist
              - hash
              - brin
              - spgist
          where:
            title: Where
            description: Partial-index predicate.
            type: string
            contentMediaType: application/sql
            x-telo-widget: code
    checks:
      title: Checks
      description: >-
        Named table-level predicates in PostgreSQL's own SQL, keyed by constraint
        name. A predicate holds for every row, whichever layer states it.
      type: object
      propertyNames:
        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
      additionalProperties:
        type: object
        additionalProperties: false
        required:
          - expression
        properties:
          expression:
            title: Expression
            description: The predicate, in PostgreSQL's own SQL.
            type: string
            minLength: 1
          validate:
            title: Validate
            description: "`deferred` adds the constraint `NOT VALID`, so it is enforced for new rows
              immediately and the existing ones are scanned on a later pass — which is what
              keeps adding a constraint to a large table from holding a lock while every row
              is read."
            type: string
            enum:
              - immediate
              - deferred
            default: immediate
    renamedFrom:
      title: Renamed From
      description: The physical table this declaration supersedes, renamed in place.
      type: string
  # The engine table's own rules, restated on this kind's fields under the
  # engine's codes. A kind that maps onto its parent with `base:` has a schema of
  # its own and inherits no rule, so without these a mistake the engine table
  # judges only at creation would pass `telo check`. The module's unit test fails when the
  # engine table gains a rule that is neither restated here nor on its written
  # exclusion list. The bookkeeping columns `base:` adds are named literally: an
  # index may name them, and a rename may not take one as its source.
  x-telo-resource-rules:
    - condition: !cel >-
        self.key in self.columns
          && (!has(self.indexes) || self.indexes.all(i, self.indexes[i].columns.all(c,
            c in self.columns || c in ['graph_row', 'graph_layer', 'graph_changeset', 'graph_from_revision', 'graph_to_revision', 'graph_effect', 'graph_over', 'graph_beneath', 'graph_resolution', 'graph_resolved_by_type', 'graph_resolved_by_id'])))
      code: SQL_INDEX_UNKNOWN_COLUMN
      message: >-
        names a column this table does not declare, as its 'key' or in an index.
        The index cannot be created — the table's own index is built on the key.
    - in: /columns
      condition: !cel "this.?renamedFrom.orValue('') != key"
      code: SQL_RENAME_FROM_SELF
      message: declares renamedFrom itself, which describes no rename.
    - in: /columns
      condition: !cel >-
        !(this.?renamedFrom.orValue('') in self.columns
          || this.?renamedFrom.orValue('') in ['graph_row', 'graph_layer', 'graph_changeset', 'graph_from_revision', 'graph_to_revision', 'graph_effect', 'graph_over', 'graph_beneath', 'graph_resolution', 'graph_resolved_by_type', 'graph_resolved_by_id'])
      code: SQL_RENAME_SOURCE_STILL_DECLARED
      message: >-
        renames from a column this table also declares. A rename's source is the
        column being retired, so declaring both would copy one live column into
        another and retire neither.
    # The table's own row id is its primary key, so one column marked here is
    # already a second.
    - condition: !cel >-
        size(self.columns.filter(c, self.columns[c].?primaryKey.orValue(false))) == 0
      code: SQL_COMPOSITE_PRIMARY_KEY
      message: >-
        marks a column as primaryKey. The table's own row id is its primary key,
        and a composite primary key is not expressible as a per-column flag.
    - condition: !cel "!has(self.renamedFrom) || self.renamedFrom != self.table"
      code: SQL_TABLE_RENAME_FROM_SELF
      message: declares renamedFrom itself, which describes no rename.
  x-telo-referrer-rules:
    - referrer: Postgres.Schema
      peers: /enums
      condition: !cel >-
        self.columns.all(c, self.columns[c].type.?name.orValue('') == ''
          || peers.exists(e, e.metadata.name == self.columns[c].type.name))
      code: SQL_ENUM_NOT_DECLARED
      message: >-
        has a column whose type references an enum this schema does not list in
        'enums:'. The list is what the ledger records as owned, so an unlisted
        type is one nothing creates, reclaims or renames — add it to 'enums:'.
    - referrer: Postgres.Schema
      peers: /tables
      condition: !cel >-
        !has(self.renamedFrom) || !peers.exists(p, p.table == self.renamedFrom)
      code: SQL_TABLE_RENAME_SOURCE_STILL_DECLARED
      message: >-
        renames from a table this schema also declares. A rename's source is the
        table being retired, so declaring both would rename one live table onto
        another and retire neither.
    - referrer: Postgres.Schema
      peers: /tables
      condition: !cel >-
        !has(self.renamedFrom)
          || !peers.exists(p, p.?renamedFrom.orValue('') == self.renamedFrom)
      code: SQL_TABLE_RENAME_SOURCE_CLAIMED_TWICE
      message: >-
        renames from a table another declaration in this schema also claims. One
        retired table has one successor, or neither rename can be told from a
        drop-and-create.
base:
  table: !cel "self.table"
  renamedFrom: !cel "self.renamedFrom"
  columns: !cel "self.columns"
  internalColumns:
    graph_row: { type: uuid, nullable: false, primaryKey: true }
    graph_layer: { type: uuid, nullable: false }
    graph_changeset: { type: uuid, nullable: false }
    graph_from_revision: { type: bigint }
    graph_to_revision: { type: bigint }
    graph_effect: { type: text, nullable: false }
    graph_over: { type: uuid }
    graph_beneath: { type: uuid }
    graph_resolution: { type: text }
    graph_resolved_by_type: { type: text }
    graph_resolved_by_id: { type: text }
  # One row per changeset and key, and a draft's rows as one range; one current
  # statement per layer and key, kept by the database; and the index every
  # published read goes through, which holds no draft row.
  indexes: !cel >-
    merge(has(self.indexes) ? self.indexes : {},
      { 'graph_' + self.table + '_changeset_key':
          { 'columns': ['graph_changeset', self.key], 'unique': true },
        'graph_' + self.table + '_layer_current':
          { 'columns': ['graph_layer', self.key], 'unique': true,
            'where': 'graph_from_revision IS NOT NULL AND graph_to_revision IS NULL' },
        'graph_' + self.table + '_layer_key':
          { 'columns': ['graph_layer', self.key, 'graph_from_revision'],
            'where': 'graph_from_revision IS NOT NULL' } })
  checks: !cel "self.checks"
---
# GraphLayersRevisionsPostgres.RelationshipTable — the same arrangement for relationship
# statements, over the ordered pair, with each range indexed a second time
# leading on the target so a hop followed backwards is as cheap as one followed
# forwards.
kind: Telo.Definition
metadata:
  name: RelationshipTable
  description: >-
    One PostgreSQL table holding a type of graph link for every layer and every
    revision at once: the application declares the link's own columns and its
    two endpoint columns, and the table adds the version bookkeeping and the
    indexes that keep one current statement per layer and pair, serve reads as
    of any revision and make a hop cheap in either direction.
extends: Postgres.Table
x-telo-schema-projection:
  entries: /columns
  key: type
  nullable: nullable
  array: array
  reference:
    from: values
    keyword: enum
    base: { type: string }
