          - { path: { value: /api/bookings }, pathParams: {}, queryParams: {} }
          - [ Project, Lead, Sponsor, From, To ]
        polish: [ Każda kontrolka z modelu, Tytuł, Budowa, Wokół prowadzącego, Przyszły miesiąc, Od ]

  # Actions: a bare button; an answer drawn with values and a list; a failure
  # tree of an action's own and an answer its output model refuses; successes
  # moving the page and reading other content again; presses one after
  # another, enabled by the form and clearing their answer; and row actions —
  # plain, confirmed, prompting and enabled per row — on a table and a list.
  - name: verifyActions
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        kinds: !cel "steps.nodes.result.actions.map(c, c.type)"
        bare: !cel "cel.bind(a, steps.nodes.result.actions[2].action, [a.mutation.url.path.value, a.label.message[0], a.inputs, a.mutation.invalidates, 'result' in a, 'answer' in a.mutation])"
        estimate:
          fields: !cel "steps.nodes.result.actions[6].fields.map(f, [f.type, f.property, has(f.control) ? f.control : '-', f.group])"
          groups: !cel "steps.nodes.result.actions[6].groups.map(g, [g.name, g.label.message[0]])"
          state: !cel "steps.nodes.result.actions[6].state"
          answer: !cel "steps.nodes.result.actions[6].onSubmit.mutation.answer.required"
          result: !cel "steps.nodes.result.actions[6].onSubmit.result.children.map(c, c.type)"
          texts: !cel "steps.nodes.result.actions[6].onSubmit.result.children.filter(c, c.type == 'text').map(c, c.text.values)"
          value: !cel "[steps.nodes.result.actions[6].onSubmit.result.children[2].value, steps.nodes.result.actions[6].onSubmit.result.children[2].present]"
          list: !cel "cel.bind(l, steps.nodes.result.actions[6].onSubmit.result.children[3], [l.heading.message[0], l.rows, l.columns.map(c, [c.header.message[0], c.value.path[0], c.labels.size()])])"
        failure:
          assign: !cel "cel.bind(a, steps.nodes.result.actions[10].children[0], [a.onSubmit.mutation.url.path.value, a.onSubmit.label.message[0], a.fields.map(f, f.property), a.onSubmit.failure.style, a.onSubmit.failure.children.map(c, [c.type, 'shown' in c ? c.shown : null]), a.onSubmit.failure.children[0].text.values, a.onSubmit.result.text.values])"
          refused: !cel "cel.bind(a, steps.nodes.result.actions[10].children[2], [a.onSubmit.mutation.url.path.value, a.onSubmit.mutation.answer.required, a.onSubmit.result, a.onSubmit.failure.style, a.onSubmit.failure.children[0].text.values, a.onSubmit.failure.children[1].value])"
        navigate: !cel "steps.nodes.result.actions[14].children.map(a, a.type == 'form' ? [a.onSubmit.mutation.url.path.value, a.fields.map(f, f.type), a.onSuccess] : [a.action.mutation.url.path.value, [], a.action.onSuccess])"
        counts: !cel "[steps.nodes.result.actions[18].children[0].query.url, steps.nodes.result.actions[18].children[0].content[0].text.values.code]"
        move: !cel "cel.bind(a, steps.nodes.result.actions[18].children[1], [a.onSubmit.mutation.url.path.value, a.fields.map(f, f.property), a.onSubmit.mutation.invalidates, a.onSubmit.result.children.map(c, c.type)])"
        comment: !cel "cel.bind(a, steps.nodes.result.actions[22], [a.onSubmit.mutation.url.path.value, a.onSubmit.mutation.concurrency, a.clearAnswerOn, a.onSubmit.enabled, a.onSubmit.mutation.invalidates, a.onSubmit.result.text.values])"
        table:
          source: !cel "[steps.nodes.result.actions[26].basePath, steps.nodes.result.actions[26].filters, steps.nodes.result.actions[26].pageSize]"
          rowActions: !cel >-
            steps.nodes.result.actions[26].rowActions.map(r, [r.mutation.url.path.value, r.label.message[0], r.inputs,
              has(r.confirm) ? r.confirm.message[0] : '-', r.prompt != null ? r.prompt.fields.map(f, f.property) : [],
              has(r.enabled) ? [r.enabled.matches, r.enabled.disabledText.message[0]] : [],
              r.result.text.message])
        list:
          url: !cel "steps.nodes.result.actions[30].query.url"
          rows: !cel "steps.nodes.result.actions[30].content[0].rows"
          rowActions: !cel >-
            steps.nodes.result.actions[30].content[0].rowActions.map(r, [r.mutation.url.path.value, r.label.message[0], r.inputs,
              has(r.confirm) ? r.confirm.message[0] : '-', r.prompt != null ? r.prompt.fields.map(f, f.property) : [],
              has(r.enabled) ? [r.enabled.at, r.enabled.matches] : [], r.mutation.invalidates])
        more: !cel >-
          steps.nodes.result.actions[34].children.map(a, a.type == 'form'
            ? [a.onSubmit.mutation.url.path.value, a.onSubmit.label.message[0], a.fields.map(f, [f.type, f.property]), a.onSuccess, a.onSubmit.mutation.invalidates, 'answer' in a.onSubmit.mutation]
            : [a.action.mutation.url.path.value, a.action.label.message[0], [], a.action.onSuccess, a.action.mutation.invalidates, 'answer' in a.action.mutation])
        mirrorResult: !cel "steps.nodes.result.actions[34].children[2].action.result.text.values"
        pause: !cel >-
          cel.bind(a, steps.nodes.result.actions[38].children[0], [a.onSubmit.mutation.url.path.value, a.fields.map(f, [f.type, f.property]), a.onSubmit.mutation.answer.required,
            a.onSubmit.mutation.invalidates, a.onSubmit.failure.children.map(c, c.value)])
        loop: !cel "cel.bind(a, steps.nodes.result.actions[38].children[2].action, [a.mutation.url.path.value, 'answer' in a.mutation, a.failure.children.map(c, 'shown' in c ? c.shown.matches : null)])"
        byAddress:
          links: !cel "steps.nodes.result.actions[42].children[0].children.map(c, c.to.href.path.value)"
          query: !cel "steps.nodes.result.actions[42].children[1].query"
          filters: !cel "steps.nodes.result.actions[42].children[1].filters"
          rowActions: !cel >-
            steps.nodes.result.actions[42].children[1].rowActions.map(r, [r.mutation.url.path.value, r.label.message[0], r.inputs,
              r.confirm.message[0], r.prompt, r.enabled])
        polish: !cel >-
          cel.bind(a, steps.polishActions.result.body.children[0].children, [
            a[0].text.message[0], a[6].onSubmit.label.message[0], a[26].rowActions[0].label.message[0],
            a[26].rowActions[1].confirm.message[0], a[30].content[0].rowActions[2].prompt.fields[0].label.message[0],
            a[34].children[0].onSubmit.label.message[0], a[38].children[2].action.failure.children[1].text.message[0],
            a[42].children[1].rowActions[0].confirm.message[0]])
      expected:
        kinds:
          [
            text, text, button, component, text, text, form, component, text, text, stack, component, text, text, columns, component,
            text, text, stack, component, text, text, form, component, text, text, listing, component, text, text, query, component,
            text, text, columns, component, text, text, stack, component, text, text, stack, component,
          ]
        bare: [ /api/unblock, Unblock TEL-42, {}, [ { path: { value: /api/tasks }, pathParams: {}, queryParams: {} }, { path: { value: /api/task-counts }, pathParams: {}, queryParams: {} } ], false, false ]
        estimate:
          fields:
            - [ choice, projectCode, auto, scope ]
            - [ input, labels, auto, scope ]
            - [ input, includeBlocked, auto, scope ]
            - [ input, pace, slider, speed ]
          groups: [ [ scope, What to count ], [ speed, How fast ] ]
          state: { key: estimate, address: true, store: { type: memory }, fields: [ projectCode, labels, includeBlocked, pace ] }
          answer: [ projectCode, hours, tasks, weeks, finishBy, breakdown ]
          result: [ text, text, value, list ]
          texts:
            - hours: { root: result, path: [ hours ] }
              tasks: { root: result, path: [ tasks ] }
              project: { root: result, path: [ projectCode ] }
            - { weeks: { root: result, path: [weeks] }, pace: { root: input, path: [pace] } }
          value: [ { root: result, path: [ finishBy ] }, { type: string, format: date } ]
          list:
            - By label
            - { root: result, path: [ breakdown ] }
            - [ [ Label, label, 5 ], [ Tasks, tasks, 0 ], [ Hours, hours, 0 ] ]
        failure:
          assign:
            - /api/assign
            - Assign
            - [ id, assigneeEmail ]
            - danger
            - - [ text, null ]
              - [ text, { at: { root: error, path: [] }, matches: { required: [ status ] } } ]
              - [ value, null ]
            - { id: { root: input, path: [ id ] } }
            - { title: { root: result, path: [ title ] }, assignee: { root: result, path: [ assignee ] } }
          refused:
            - /api/estimate
            - [ days ]
            - { type: value, fill: false, value: { root: result, path: [ days ] }, labels: [], present: { type: integer } }
            - warning
            - { code: { root: error, path: [ code ] } }
            - { root: error, path: [ message ] }
        navigate:
          - [ /api/project-page, [ choice ], [ { type: navigate, href: { path: { root: result, path: [ page ] }, pathParams: {}, queryParams: {} } } ] ]
          - [ /api/homepage, [], [ { type: navigate, href: { path: { root: result, path: [ homepage ] }, pathParams: {}, queryParams: {} } } ] ]
        counts: [ { path: { value: /api/task-counts }, pathParams: {}, queryParams: { code: { value: TEL-42 } } }, { root: data, path: [ code ] } ]
        move: [ /api/task-status, [ id, status ], [ { path: { value: /api/task-counts }, pathParams: {}, queryParams: {} }, { path: { value: /api/tasks }, pathParams: {}, queryParams: {} } ], [ text, value ] ]
