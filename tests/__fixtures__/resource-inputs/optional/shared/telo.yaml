# One instantiation for the whole application, so every import must agree on
# whether it supplies the optional store.
kind: Telo.Library
metadata:
  name: SharedOptionalStore
  version: 0.0.0
  description: Test fixture sharing one holder of an optional store.
lifecycle: shared
imports:
  Kinds: ../kinds
resources:
  store:
    kind: Kinds.Store
    optional: true
exports:
  resources: [holder]
--- !if
metadata: { name: fallback }
if: !cel "resources.store == null"
then:
  kind: Kinds.Store
  label: fallback
---
kind: Kinds.Holder
metadata:
  name: holder
store: !if
  if: !cel "resources.store != null"
  then: !ref store
  else: !ref fallback
