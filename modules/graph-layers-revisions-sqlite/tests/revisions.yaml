kind: Telo.Application
metadata:
  name: GraphLayersRevisionsSqliteRevisions
  version: 1.0.0
  description: |
    What is this strategy's own, beyond the shared drafting suite. A layer read
    and written outside any draft behaves as one graph, and every write is a
    retained revision. Each OpenDraft opens another draft, isolated from its
    siblings and reading the layer at the revision it was opened on even after
    a sibling publishes; of two drafts on one parent the first publishes and the
    second is stale, rebases, and is conflicted only on the keys both changed. A
    rebase merges three ways, per property: what one side alone changed merges,
    what both changed alike merges, and a real conflict names the properties
    that clashed and lists the ancestor. A conflict's token stops matching once
    any row it was decided from is written again, for each of the five classes.
    Superseded rows are kept with contiguous revision ranges, the history is
    listed in both orders and after a number, a read paged across a publish
    stays on the revision of its first page, and a cursor never crosses a
    session boundary, another draft or a rebase. A node delete in a draft
    writes the node's row and one retraction per relationship the layer itself
    states there. A write joins the caller's transaction, so one rolled back
    left no revision.
include:
  - ./__fixtures__/revisions-model.yaml
imports:
  Sql: ../../sql
  SQLite: ../../sqlite
  Graph: ../../graph
  GraphLayers: ../../graph-layers
  Layers: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref appSchema
  - !ref oneGraph
  - !ref parallelDrafts
  - !ref threeWayMerge
  - !ref staleTokens
  - !ref history
  - !ref pinnedReads
  - !ref cursors
  - !ref nodeDeleteInDraft
  - !ref writeJoinsATransaction
