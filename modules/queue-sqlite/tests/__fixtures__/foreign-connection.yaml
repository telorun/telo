# The transactional enqueue inside a transaction on another connection than its
# queue's: the zone's kind matches, its correlation does not.
kind: Telo.Application
metadata:
  name: EnqueueForeignConnection
  version: 1.0.0
imports:
  QueueSql: ../../../queue-sql
  Queue: ../..
  Sql: ../../../sql
  Run: ../../../run
  SQLite: ../../../sqlite
targets:
  - !ref appSchema
  - invoke: !ref otherTx
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: SQLite.Connection
metadata: { name: otherDb }
file: ":memory:"
---
kind: Queue.Table
metadata: { name: messages }
table: queue_messages
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref messages]
---
kind: Queue.Queue
metadata: { name: jobs }
connection: !ref db
schema: !ref appSchema
table: !ref messages
name: jobs
retention: 1h
messageType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      n: { type: integer }
---
kind: Sql.Transaction
metadata: { name: otherTx }
connection: !ref otherDb
steps:
  kind: Run.Sequence
  steps:
    - name: enqueue
      invoke: { kind: QueueSql.Enqueue, queue: !ref jobs }
      inputs: { message: { n: 1 } }
