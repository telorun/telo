name: Tests

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
    # `labeled` / `unlabeled` so adding or removing `full-ci` re-runs the checks.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  checks:
    name: Static & release checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release gate, for every unit — npm packages, crates, images, charts,
      # the .vsix and modules. It does NOT fail because a payload moved: a changed
      # unit with no fragment ships as an unattributed patch and only warns. It fails
      # when no consistent plan can be formed — a fragment naming no unit, a level
      # above the marker's `maxBump: minor`, a unit whose version locations disagree,
      # a telo floor the release would leave wrong — including a `>=unreleased` floor
      # in a plan that moves no telo version.
      #
      # Not PR-only: a malformed fragment breaks the release whenever it is reached,
      # so it must never sit on main either. It needs no credentials — the committed
      # ledger is what it compares against. A layer is the file set the package
      # manager packs (its `prepack` building the payload), `cargo package --list`, a
      # Docker context or a chart, so the workspace is built first, and the gate runs
      # the Node build of the CLI, as the release job does. `base` is HEAD for a push
      # and for the release machinery's own pull request (its diff is the release);
      # `carried-by` names the live release branch when the tree checked is main's,
      # so a fragment it already carries plans nothing.
      - name: Read the release gate refs
        id: gates
        run: node scripts/release-branch.mjs gate-refs

      - name: Build the workspace for the release gate
        run: pnpm -r --if-present build

      # A linking crate's cargo layer reads its closure across every platform
      # (`cargo metadata --locked --offline`), so every platform's crates are fetched first.
      - name: Fetch every platform's crates
        run: cargo fetch --locked

      - name: Check the release plan
        env:
          BASE: ${{ steps.gates.outputs.base }}
          CARRIED_BY: ${{ steps.gates.outputs.carried-by }}
        run: node ./cli/nodejs/bin/telo.mjs release check --base "$BASE" ${CARRIED_BY:+--carried-by "$CARRIED_BY"}

      # A release branch whose final is published takes patches only: a pull request
      # into it may plan no unit above `patch`.
      - name: Check the plan is patch-only
        if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
        env:
          BASE: ${{ steps.gates.outputs.base }}
          CARRIED_BY: ${{ steps.gates.outputs.carried-by }}
        run: node scripts/release-patch-gate.mjs --base "$BASE" ${CARRIED_BY:+--carried-by "$CARRIED_BY"}

      # A doc that hardcodes a version for a ref this repo publishes goes stale
      # silently and reads as current to whoever copies it. The `<version>` marker
      # is substituted at site build time; this is what keeps it used.
      - name: Check documentation version pins
        run: pnpm run check:docs

      # The controller protocol's spec and its message set are two halves of one
      # contract, and either half can be edited without the other. A wrong
      # inventory row reads as authoritative to whoever implements a second
      # kernel from it, so the two are checked against each other here.
      - name: Check the controller protocol
        run: pnpm run check:controller-protocol

      # Two licenses share this repository, and they stay separable only while
      # nothing MIT depends on anything that is not. A declaration nothing checks
      # drifts the first time a package gains a convenient import.
      - name: Check the license boundary
        run: pnpm run check:licenses

      # A link into the repository is relative, so GitHub resolves it against the
      # ref being viewed and the site build and npm / .vsix packing rewrite it to
      # the tag they publish. An absolute URL is pinned to one ref and goes stale;
      # a module's files may not reach into the tree at all, since its bytes must
      # not depend on which release publishes it.
      - name: Check links
        run: pnpm run check:links

      # The release scripts (cut, finish, publish, the record, the gate, pointers) are exercised
      # against scratch git repositories.
      - name: Test the release scripts
        run: node --test scripts/tests/*.test.mjs

      # `@telorun/cel`'s own suite deliberately runs with no vectors directory
      # reachable, so the conformance replay lives under its own config and is
      # driven only from here. This is the one artifact naming
      # `templating/cel-conformance`, and it holds the engine to every row at both
      # the check and the value level: a row carrying a cel-spec answer must be
      # answered or excused BY NAME, or the gate fails. Unwired, the two
      # completeness invariants it enforces ran only when a human typed the path.
      - name: Check the CEL conformance vectors
        run: pnpm run check:cel-conformance

      # `build` compiles the library config (`src` only), so a type error in the
      # package's own tests or in its conformance drivers was invisible to every
      # gate — and one was live. This covers `src`, `tests` and `conformance`.
      - name: Check the CEL package's types
        run: pnpm --filter @telorun/cel run check:types

      - name: Check module manifests
        run: pnpm run check modules/*/telo.yaml packages/runner-core/workspace-app/telo.yaml

      # Both levels, plus the manifests that are not named `telo.yaml`: an example
      # made of several applications keeps them in subdirectories, so a one-level
      # glob checks the entry and silently skips everything it imports.
      # `money-transfer/broken.yaml` is deliberately invalid and stays out.
      - name: Check example manifests
        run: >-
          pnpm run check examples/*/telo.yaml examples/*/*/telo.yaml
          examples/schema-evolution/v1.yaml examples/templated-api/library.yaml

      # A starter is copied VERBATIM by users, so it is the last thing that
      # should be checked by nothing — and it was: the only invocation lived in
      # package.json's `ci` script, which no workflow runs.
      - name: Check starter and blueprint manifests
        run: pnpm run check starters/apps/*/telo.yaml starters/libs/*/telo.yaml blueprints/*/telo.yaml

      # Every branch imports the working copy; the published form exists only in release tags.
      # The relative form needs no release plan, so the TS entry runs it with no build.
      - name: Check imports of workspace modules are relative (fix with `pnpm run imports -- --as=relative`)
        env:
          TELO_CLI: pnpm exec bun ./cli/nodejs/bin/telo.ts
        run: pnpm run imports -- --as=relative --check

      # The docs and Studio load these by URL, and an HTTP source cannot expand
      # an `include:` glob — which a filesystem check never notices. The repo
      # root is served so relative imports of `modules/` resolve too.
      - name: Check example, starter and blueprint manifests over HTTP
        run: |
          set -euo pipefail
          pnpm run starters --dir . --port 8787 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8787/examples/hello-world/telo.yaml && break
            sleep 1
          done
          urls=()
          for f in examples/*/telo.yaml examples/*/*/telo.yaml starters/apps/*/telo.yaml starters/libs/*/telo.yaml blueprints/*/telo.yaml; do
            urls+=("http://127.0.0.1:8787/$f")
          done
          pnpm run check "${urls[@]}"

      # Packaging is picky in ways a build is not — `@types/vscode` outranking
      # `engines.vscode` fails here while `tsc` and esbuild both pass. Running it
      # per-PR keeps that failure off `vscode-release.yml`, which Publish calls
      # to package the same way at a release and has no PR to fail instead.
      - name: Check the VS Code extension packages
        run: pnpm --filter "./ide/vscode" vsix

      # The release PR's gate on the publication commit its merge makes: every import
      # must come out published, or await this release's own publish. The release plan
      # it reads digests the controller builds, so the workspace is built for it alone.
      - name: Check every import of the release PR publishes (a module with changes its version does not carry fails here)
        if: startsWith(github.head_ref, 'release-version/')
        timeout-minutes: 20
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: pnpm run check:release-imports

  # Decides once which manifest tests every platform job runs. A pull request
  # runs only the test manifests its diff reaches — through each manifest's own
  # file, its `__fixtures__/`, its relative imports and the workspace packages
  # their controllers bundle (`telo changed`). Everything runs on a push to
  # main, and whenever the change is to what EVERY test stands on: the runtime,
  # the test runner, the suites, the dependency set or this workflow.
  #
  # `mode` is `full`, `selected` or `none`; `args` is a JSON array of suite
  # arguments (`--include <path>` pairs), empty for a full run. Consumers read
  # both through `env:`, never by interpolating them into a script: a path is
  # a file name a pull request chose.
  #
  # It decides the same for everything else a job does, so that a job whose
  # subject the diff does not reach starts, reports, and skips its build and
  # its tests (`scripts/select-package-tests.mjs` holds the rules):
  #
  # - `unit_mode` / `unit_build_args` / `unit_test_args`: the workspace
  #   packages whose unit tests run — the changed ones and their dependents —
  #   as pnpm `--filter` pairs, empty for a full run;
  # - `integration_mode` / `integration_args`: the Postgres suite's tests;
  # - `package_integration`, `suites`, `rust`: `true` or `false` for the
  #   package integration tests, the example / starter / blueprint suites with
  #   the cross-platform manifest checks, and cargo.
  #
  # Every job keeps STARTING: a job that never starts never reports, and a
  # required check that never reports blocks the merge it was meant to guard.
  select:
    name: Select manifest tests
    runs-on: ubuntu-latest

    outputs:
      mode: ${{ steps.select.outputs.mode }}
      args: ${{ steps.select.outputs.args }}
      unit_mode: ${{ steps.packages.outputs.unit_mode }}
      unit_build_args: ${{ steps.packages.outputs.unit_build_args }}
      unit_test_args: ${{ steps.packages.outputs.unit_test_args }}
      package_integration: ${{ steps.packages.outputs.package_integration }}
      suites: ${{ steps.packages.outputs.suites }}
      rust: ${{ steps.packages.outputs.rust }}
      # The full macOS / Windows / Bun / Docker-image jobs gate only on a
      # `release/*` branch; on main they read these as "nothing to run" and are
      # skipped. The same values as above otherwise.
      platform_mode: ${{ steps.branch.outputs.release == 'true' && steps.select.outputs.mode || 'none' }}
      platform_unit_mode: ${{ steps.branch.outputs.release == 'true' && steps.packages.outputs.unit_mode || 'none' }}
      platform_suites: ${{ steps.branch.outputs.release == 'true' && steps.packages.outputs.suites || 'false' }}
      core_mode: ${{ steps.packages.outputs.core_mode }}
      core_build_args: ${{ steps.packages.outputs.core_build_args }}
      core_test_args: ${{ steps.packages.outputs.core_test_args }}
      integration_mode: ${{ steps.integration.outputs.integration_mode }}
      integration_args: ${{ steps.integration.outputs.integration_args }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The branch the change lands on: the PR's base, else the pushed branch. A pull
      # request carrying the `full-ci` label, or whose head commit message holds
      # `[full ci]`, is run as a release would be: every platform and every manifest test.
      - name: Detect a release branch
        id: branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="${BASE_REF:-$REF_NAME}"
          full=false
          if [ -n "$HEAD_SHA" ]; then
            jq -e 'index("full-ci")' <<<"$LABELS" >/dev/null && full=true
            git log -1 --format=%B "$HEAD_SHA" | grep -qiF '[full ci]' && full=true
          fi
          case "$target" in
            release/*) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "release=$full" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"

      # FAIL OPEN at every step: a diff that cannot be taken, or a `telo
      # changed` that fails, runs everything. Only an explicit empty `affected`
      # list runs nothing.
      - name: Select the manifest tests this change reaches
        id: select
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ steps.branch.outputs.full }}
        run: |
          full() {
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "args=[]" >> "$GITHUB_OUTPUT"
            echo "$1 — running every manifest test." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$EVENT_NAME" = "pull_request" ] || full "Not a pull request"
          [ "$FULL_CI" = "true" ] && full "Marked full-ci"
          git fetch --no-tags origin "$BASE_REF" || true
          base="origin/$BASE_REF"
          changed=$(git diff --name-only "$base...HEAD") || full "Could not diff against $base"
          # Plain paths, deliberately not `telo changed`: a manifest under
          # kernel/ imports modules, so it would report a module change as a
          # runtime change.
          if grep -qE '^(kernel|analyzer|sdk|templating|cli|modules/test)/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|test-suite(-windows)?\.yaml|\.github/workflows/test\.yml)$' <<<"$changed"; then
            full "The runtime, the test runner, a suite, the dependency set or this workflow changed"
          fi
          # The suites apply their own `exclude:` on top, so the glob need not
          # restate them.
          json=$(pnpm run --silent telo changed '**/tests/*.yaml' --base "$base" -o json) \
            || full "telo changed failed"
          # Drop what the suites exclude, or a change touching only those leaves
          # them an empty run (a failure).
          json=$(jq -c '.affected |= map(select(test("^(apps|examples|starters|blueprints|workspace|\\.claude)/") | not))' <<<"$json") \
            || full "Could not filter the selection"
          count=$(jq '.affected | length' <<<"$json") || full "telo changed returned no answer"
          if [ "$count" = "0" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "args=[]" >> "$GITHUB_OUTPUT"
            echo "No manifest test is reached by this change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "mode=selected" >> "$GITHUB_OUTPUT"
          echo "args=$(jq -c '[.affected[] | "--include", .]' <<<"$json")" >> "$GITHUB_OUTPUT"
          {
            echo "Running the $count manifest tests this change reaches:"
            echo
            jq -r '.affected[] | "- `" + . + "`"' <<<"$json"
          } >> "$GITHUB_STEP_SUMMARY"

      # FAIL OPEN, like the step above: anything but an answer from the script
      # is a full run of everything.
      - name: Select the packages and suites this change reaches
        id: packages
        if: always()
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ steps.branch.outputs.full }}
        run: |
          emit() {
            {
              echo "unit_mode=$(jq -r '.mode' <<<"$1")"
              echo "unit_build_args=$(jq -c '.buildArgs' <<<"$1")"
              echo "unit_test_args=$(jq -c '.testArgs' <<<"$1")"
              echo "package_integration=$(jq -r '.packageIntegration' <<<"$1")"
              echo "suites=$(jq -r '.suites' <<<"$1")"
              echo "rust=$(jq -r '.rust' <<<"$1")"
              echo "core_mode=$(jq -r '.core.mode' <<<"$1")"
              echo "core_build_args=$(jq -c '.core.buildArgs' <<<"$1")"
              echo "core_test_args=$(jq -c '.core.testArgs' <<<"$1")"
            } >> "$GITHUB_OUTPUT"
            {
              echo
              echo "Package tests: **$(jq -r '.mode' <<<"$1")** — $(jq -r '.reason' <<<"$1")."
              jq -r '.packages[] | "- `" + . + "`"' <<<"$1"
              echo
              echo "Suites: $(jq -r '.suites' <<<"$1"). Cargo: $(jq -r '.rust' <<<"$1"). Package integration tests: $(jq -r '.packageIntegration' <<<"$1")."
            } >> "$GITHUB_STEP_SUMMARY"
          }
          full() {
            emit "$(jq -cn --arg reason "$1" '{mode:"full",reason:$reason,packages:[],testArgs:[],buildArgs:[],packageIntegration:true,suites:true,rust:true,core:{mode:"full",buildArgs:["--filter","@telorun/analyzer...","--filter","@telorun/kernel...","--filter","@telorun/cli..."],testArgs:["--filter","@telorun/analyzer","--filter","@telorun/kernel","--filter","@telorun/cli"]}}')"
            exit 0
          }
          [ "$EVENT_NAME" = "pull_request" ] || full "Not a pull request"
          [ "$FULL_CI" = "true" ] && full "Marked full-ci"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD") || full "Could not diff against origin/$BASE_REF"
          json=$(node scripts/select-package-tests.mjs <<<"$changed") || full "The selection script failed"
          jq -e '.mode == "full" or .mode == "selected" or .mode == "none"' <<<"$json" >/dev/null \
            || full "The selection script returned no answer"
          emit "$json"

      # The Postgres suite's tests, by the same rule as the root suite's: a
      # full manifest run is a full run here, otherwise only what the diff
      # reaches.
      - name: Select the integration tests this change reaches
        id: integration
        if: always()
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          MANIFEST_MODE: ${{ steps.select.outputs.mode }}
        run: |
          full() {
            echo "integration_mode=full" >> "$GITHUB_OUTPUT"
            echo "integration_args=[]" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$EVENT_NAME" = "pull_request" ] || full
          [ "$MANIFEST_MODE" = "selected" ] || [ "$MANIFEST_MODE" = "none" ] || full
          base="origin/$BASE_REF"
          changed=$(git diff --name-only "$base...HEAD") || full
          if grep -qE '^test-suite-integration\.yaml$' <<<"$changed"; then full; fi
          json=$(pnpm run --silent telo changed '**/tests/integration/*.yaml' --base "$base" -o json) || full
          json=$(jq -c '.affected |= map(select(test("^(apps|\\.claude)/") | not))' <<<"$json") || full
          count=$(jq '.affected | length' <<<"$json") || full
          if [ "$count" = "0" ]; then
            echo "integration_mode=none" >> "$GITHUB_OUTPUT"
            echo "integration_args=[]" >> "$GITHUB_OUTPUT"
            echo "No integration test is reached by this change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "integration_mode=selected" >> "$GITHUB_OUTPUT"
          echo "integration_args=$(jq -c '[.affected[] | "--include", .]' <<<"$json")" >> "$GITHUB_OUTPUT"

  bun:
    name: "Linux: manifest tests (Bun)"
    runs-on: ubuntu-latest
    needs: select
    if: needs.select.outputs.platform_mode != 'none' || needs.select.outputs.platform_suites == 'true'

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Staged files are fetched from third parties on first use; cache them so a
      # flaky download fails one job at most once per key.
      - name: Restore staged module files
        id: staged
        uses: ./.github/actions/restore-staged-files
        with:
          scope: ${{ github.job }}

      - name: Run tests (bun)
        if: needs.select.outputs.platform_mode != 'none'
        shell: bash
        env:
          SUITE_ARGS: ${{ needs.select.outputs.args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$SUITE_ARGS")
          pnpm test "${args[@]}"

      # `telo check` says an example parses; it says nothing about whether the
      # application still does what its README claims. Each example owns its
      # tests, and these suites run every one of them — standing the example up
      # on a port of the test's own and calling it, which is what catches a route
      # that silently stopped serving.
      #
      # Separate from the module suite, and from each other, because an example
      # and a starter both import PUBLISHED modules: a red run here can mean the
      # release sequence is behind rather than that the code is wrong, and that
      # signal must not make a red module suite ambiguous.
      - name: Run the example test suites (bun)
        if: needs.select.outputs.platform_suites == 'true'
        run: pnpm run telo ./examples/test-suite.yaml

      - name: Run the starter test suites (bun)
        if: needs.select.outputs.platform_suites == 'true'
        run: pnpm run telo ./starters/test-suite.yaml

      - name: Run the blueprint test suites (bun)
        if: needs.select.outputs.platform_suites == 'true'
        run: pnpm run telo ./blueprints/test-suite.yaml

      - name: Save staged module files
        if: always() && steps.staged.outputs.key != '' && steps.staged.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-staged-files
        with:
          key: ${{ steps.staged.outputs.key }}
          paths: ${{ steps.staged.outputs.paths }}

  integration:
    name: "Linux: integration tests (Postgres)"
    runs-on: ubuntu-latest
    needs: select
    if: needs.select.outputs.integration_mode != 'none'

    # The tests the root suite deliberately cannot hold: each starts the
    # database it needs as a container of its own, through the runner's Docker
    # engine at its default socket, and removes it when it ends. `test-suite.yaml`
    # must pass on a clean checkout with nothing running, so a red module suite
    # means the code is wrong rather than that something was not up — which is
    # exactly what mixing these in would cost.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Staged files are fetched from third parties on first use; cache them so a
      # flaky download fails one job at most once per key.
      - name: Restore staged module files
        id: staged
        uses: ./.github/actions/restore-staged-files
        with:
          scope: ${{ github.job }}

      # Anonymous pulls are limited per IP, and a hosted runner shares its IP
      # with everyone else's jobs. The tests pull through the engine API, which
      # carries no credentials, so the image they all run is pulled here as the
      # project's account first and the tests find it present. A fork's pull
      # request holds no secrets and pulls anonymously, as before.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
