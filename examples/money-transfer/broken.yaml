# The mistake, kept runnable-adjacent so you can see the checker catch it:
#
#     telo check ./examples/money-transfer/broken.yaml
#
# `moveMoney` declares `transaction: !ref transferTx`, so it may only be reached
# through that transaction's body. `payout` calls it directly, which is a write
# outside the transaction — reported as ZONE_REQUIREMENT_UNSATISFIED before the
# app ever starts. Everything else here is identical to `telo.yaml`.
kind: Telo.Application
metadata:
  name: MoneyTransferBroken
  version: 1.0.0
  description: |
    Deliberately invalid companion to `telo.yaml`: it invokes a
    transaction-bound statement from outside the transaction. Kept so the
    execution-zone diagnostic can be seen rather than described.
imports:
  Sql: oci://ghcr.io/telorun/sql@0.28.1#sha256-ZlxQTTYQtAhK2aAyLRYMwBN-U4b8ww4ulu0SVnIxFu8
  SQLite: oci://ghcr.io/telorun/sqlite@0.11.0#sha256-QdM_zH8JQGB2URI9uT0hM5lnWGKLed-4NvFk81V7Xs4
  Run: oci://ghcr.io/telorun/run@0.29.1#sha256-EMlCpjQJfCDI8XUNNqx6z5q02zinb6Gd_yMgJ4_mcqQ
targets:
  - !ref payout
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Sql.Transaction
metadata: { name: transferTx }
connection: !ref db
steps: !ref transferWrites
inputs:
  amountCents: !cel "inputs.amountCents"
---
kind: Run.Sequence
metadata: { name: transferWrites }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      amountCents: { type: integer }
steps:
  - name: debit
    invoke: !ref moveMoney
    inputs:
      sql: !sql "UPDATE accounts SET balance_cents = balance_cents - ${{ inputs.amountCents }} WHERE id = 1"
---
kind: Sql.Command
metadata: { name: moveMoney }
transaction: !ref transferTx
---
# The bug: a second caller that reaches the statement directly. At runtime this
# would move money outside the transaction — silently, and only sometimes.
kind: Run.Sequence
metadata: { name: payout }
steps:
  - name: sneak
    invoke: !ref moveMoney
    inputs:
      sql: "UPDATE accounts SET balance_cents = balance_cents - 100 WHERE id = 1"
