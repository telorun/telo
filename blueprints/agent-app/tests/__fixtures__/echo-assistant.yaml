kind: Telo.Application
metadata:
  name: EchoAssistant
  version: 1.0.0
  description: >-
    An AgentApp over a model that echoes, so the blueprint's endpoints, history
    and tool wiring can be exercised without a provider.
imports:
  AgentApp: ../..
  Echo: ./echo-model.yaml
  Run: oci://ghcr.io/telorun/run@0.31.0#sha256-nwScCIsE4_c40LSm8abAb5qDKQxVnTU8ORlf7Xjyys4
targets:
  - !ref assistant
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8855
variables:
  history:
    env: CONVERSATIONS_FILE
    type: string
    x-telo-type: Telo.HostPath
---
kind: AgentApp.App
metadata:
  name: assistant
port: !cel "ports.http"
history: !cel "variables.history"
model:
  kind: Echo.Model
system: Answer briefly.
tools:
  - tool:
      kind: Run.Value
      value: { status: shipped }
    name: order_status
    description: Where an order is.
    parameters:
      type: object
      properties:
        orderId: { type: string }
