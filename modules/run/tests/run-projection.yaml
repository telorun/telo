kind: Telo.Application
metadata:
  name: RunProjection
  version: 1.0.0
imports:
  Run: ../
  Assert: ../../assert
targets:
  - !ref verifyProjection
  - !ref verifyIndexIsInteger
---
kind: Run.Projection
metadata:
  name: doubleEach
collection: !cel "[1, 2, 3]"
steps:
  - name: double
    inputs:
      n: !cel "item"
    invoke:
      kind: Run.Value
      inputs:
        n: {}
      value:
        doubled: !cel "double(inputs.n) * 2.0"
outputs:
  value: !cel "steps.double.result.doubled"
  at: !cel "index"
---
kind: Run.Sequence
metadata:
  name: verifyProjection
steps:
  - name: project
    invoke: !ref doubleEach
  - name: check
    inputs:
      result: !cel "steps.project.result"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            type: array
            const:
              - { value: 2, at: 0 }
              - { value: 4, at: 1 }
              - { value: 6, at: 2 }
---
# `index` is declared `type: integer`, so a CEL int64 — it must compose with an
# integer literal with no cast. Asserting `!cel "index"` bare (above) passes
# whether it arrives as an int or a double; only arithmetic against an int
# literal exercises the overload that used to fail at dispatch.
kind: Run.Projection
metadata:
  name: positionEach
collection: !cel "['a', 'b']"
steps:
  - name: label
    inputs:
      ordinal: !cel "index + 1"
    invoke:
      kind: Run.Value
      inputs:
        ordinal: {}
      value:
        ordinal: !cel "inputs.ordinal"
outputs:
  ordinal: !cel "steps.label.result.ordinal"
  next: !cel "index + 1"
---
kind: Run.Sequence
metadata:
  name: verifyIndexIsInteger
steps:
  - name: project
    invoke: !ref positionEach
  - name: check
    inputs:
      actual: !cel "steps.project.result"
      expected:
        - { ordinal: 1, next: 1 }
        - { ordinal: 2, next: 2 }
    invoke:
      kind: Assert.Equals
