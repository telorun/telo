kind: Telo.Application
metadata:
  name: NightlyReportExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/nightly-report` and asks for the report over HTTP. The example
    wires one report resource to two triggers — a cron schedule and a route — and
    the route is the half a test can reach without waiting for a clock. The cron is
    set to a date the test will never see, so what comes back is this request's
    work and nothing else.
imports:
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    ports: { http: 8044 }
    variables: { reportCron: "0 3 1 1 *" }
targets:
  - !ref app
steps:
  - name: report
    invoke: { kind: HttpClient.Request, url: http://127.0.0.1:8044/report, method: GET }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.report.result.status"
        rows: !cel "size(steps.report.result.body) > 0"
      expected: { status: 200, rows: true }
