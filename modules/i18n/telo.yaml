kind: Telo.Library
metadata:
  name: I18n
  version: 0.3.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Data]
  description: >-
    Translation of an application's texts into the caller's language: one function
    formatting a text with its values and plural rules in the language asked for,
    translated by the application's own translations, falling back through
    regional variants to the source.
# Reading the application's translations needs the seam of 0.129.0.
requires: { telo: ">=0.129.0" }
lang: en
exports: { kinds: [Catalog], resources: [translate] }
---
kind: Telo.Definition
metadata:
  name: Catalog
  description: >-
    Translations of a module's texts into one language: each entry names a source
    text, with an optional context telling the same words apart, and the message
    translating it, plural cases included. Every value is written literally and
    checked against its source's placeholders and the language's plural categories.
  deprecated:
    reason: Translations are a built-in kind listed in the application's translations block.
    replacedBy: Telo.TextTranslations
capability: Telo.Provider
extends: Telo.Translations
controllers: [pkg:telo/local/js?path=./nodejs/i18n.mjs&local_path=./nodejs/src/index.ts#Catalog]
schema: { $ref: "telo://manifest#/$defs/TextCatalog" }
---
kind: Telo.Definition
metadata:
  name: Translator
  description: >-
    Translates a text into a requested language and formats it with its values:
    the language falls back through its shorter variants to the source text,
    numbers are written by the language's rules, and plural cases are chosen for
    the counts given. A text no translation covers is formatted as written, in
    its own language.
capability: Telo.Callable
deterministic: true
controllers: [pkg:telo/local/js?path=./nodejs/i18n.mjs&local_path=./nodejs/src/index.ts#Translator]
params:
  - name: text
    description: The source text, written at the call — a message, or `{ text, context }`.
    schema: { $ref: "telo://manifest#/$defs/Text" }
  - name: lang
    description: The language to translate into, one resolved tag (`pl-PL`); never a preference list.
    schema: { type: string, format: language-tag }
  - name: values
    description: A value for every placeholder and plural selector the text reads, by name.
    optional: true
    schema: { type: object, x-telo-text-values-for: /text }
returns: { schema: { type: string } }
schema: { type: object, additionalProperties: false }
---
kind: Self.Translator
metadata: { name: translate }
