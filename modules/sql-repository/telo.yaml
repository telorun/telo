kind: Telo.Library
metadata:
  name: SqlRepository
  version: 0.9.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Storage, Data]
  description: >-
    Table-level create, read, update and delete handlers that generate their SQL from
    the shape of the call: filters become a WHERE clause, a data object becomes the
    column list. Values always bind as parameters, so a domain operation maps to a
    table without hand-written statements.
exports:
  kinds:
    - Read
    - Create
    - Update
    - Delete
imports:
  Sql: ../sql
---
kind: Telo.Definition
metadata:
  name: Read
  description: >-
    Fetches rows from a table, filtering on each column given at the call site and
    returning every row when none are. Filter values bind as parameters rather than
    being written into the statement.
capability: Telo.Invocable
schema:
  type: object
  required: [connection, table]
  examples:
    - connection:
        kind: SQLite.Connection
        name: Db
      table: users
  properties:
    connection:
      title: Connection
      description: Reference to the SQL connection resource.
      x-telo-ref:
        kind: Sql.Connection
        use: dependency
    table:
      title: Table
      description: Database table name.
      type: string
resources:
  - kind: Sql.Query
    metadata:
      name: "${{ self.name }}-query"
    connection: "${{ self.connection }}"
inputs:
  sql: "${{ 'SELECT * FROM ' + self.table + (keys(inputs.filters).size() > 0 ? ' WHERE ' + join(keys(inputs.filters).map(k, k + ' = ?'), ' AND ') : '') }}"
  bindings: "${{ keys(inputs.filters).map(k, inputs.filters[k]) }}"
invoke:
  kind: Sql.Query
  name: "${{ self.name }}-query"

---
kind: Telo.Definition
metadata:
  name: Create
  description: >-
    Inserts a row into a table, taking the columns from the keys of the object passed
    at the call site so a domain object maps straight to a row. Values bind as
    parameters.
capability: Telo.Invocable
schema:
  type: object
  required: [connection, table]
  examples:
    - connection:
        kind: SQLite.Connection
        name: Db
      table: users
  properties:
    connection:
      title: Connection
      description: Reference to the SQL connection resource.
      x-telo-ref:
        kind: Sql.Connection
        use: dependency
    table:
      title: Table
      description: Database table name.
      type: string
resources:
  - kind: Sql.Command
    metadata:
      name: "${{ self.name }}-exec"
    connection: "${{ self.connection }}"
invoke: "${{ self.name }}-exec"
inputs:
  sql: "${{ 'INSERT INTO ' + self.table + ' (' + join(keys(inputs.data), ', ') + ') VALUES (' + join(keys(inputs.data).map(k, '?'), ', ') + ')' }}"
  bindings: "${{ keys(inputs.data).map(k, inputs.data[k]) }}"

---
kind: Telo.Definition
metadata:
  name: Delete
  description: >-
    Removes rows from a table matching the filters given at the call site. At least
    one filter is required, so a call can never delete the whole table by omission.
capability: Telo.Invocable
schema:
  type: object
  required: [connection, table]
  examples:
    - connection:
        kind: SQLite.Connection
        name: Db
      table: users
  properties:
    connection:
      title: Connection
      description: Reference to the SQL connection resource.
      x-telo-ref:
        kind: Sql.Connection
        use: dependency
    table:
      title: Table
      description: Database table name.
      type: string
resources:
  - kind: Sql.Command
    metadata:
      name: "${{ self.name }}-exec"
    connection: "${{ self.connection }}"
invoke: "${{ self.name }}-exec"
inputs:
  sql: "${{ 'DELETE FROM ' + self.table + ' WHERE ' + join(keys(inputs.filters).map(k, k + ' = ?'), ' AND ') }}"
  bindings: "${{ keys(inputs.filters).map(k, inputs.filters[k]) }}"

---
kind: Telo.Definition
metadata:
  name: Update
  description: >-
    Updates rows in a table, taking the columns to set from the data object given at
    the call site and the rows to touch from its filters. All values bind as
    parameters.
capability: Telo.Invocable
schema:
  type: object
  required: [connection, table]
  examples:
    - connection:
        kind: SQLite.Connection
        name: Db
      table: users
  properties:
    connection:
      title: Connection
      description: Reference to the SQL connection resource.
      x-telo-ref:
        kind: Sql.Connection
        use: dependency
    table:
      title: Table
      description: Database table name.
      type: string
resources:
  - kind: Sql.Command
    metadata:
      name: "${{ self.name }}-exec"
    connection: "${{ self.connection }}"
invoke: "${{ self.name }}-exec"
inputs:
  sql: "${{ 'UPDATE ' + self.table + ' SET ' + join(keys(inputs.data).map(k, k + ' = ?'), ', ') + ' WHERE ' + join(keys(inputs.filters).map(k, k + ' = ?'), ' AND ') }}"
  bindings: "${{ keys(inputs.data).map(k, inputs.data[k]) + keys(inputs.filters).map(k, inputs.filters[k]) }}"
