kind: Telo.Library
metadata:
  name: PrivateFunctionLib
  version: 1.0.0
  description: >-
    Fixture library declaring one exported function and one it keeps private.
exports:
  resources: [shown]
---
kind: Telo.Function
metadata:
  name: shown
  description: Returns its argument.
params:
  - name: n
    schema: { type: integer }
returns:
  schema: { type: integer }
body: !cel "n"
---
kind: Telo.Function
metadata:
  name: hidden
  description: Returns its argument, and is not exported.
params:
  - name: n
    schema: { type: integer }
returns:
  schema: { type: integer }
body: !cel "n"
