kind: Telo.Application
metadata:
  name: CommandLineArgumentsExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/command-line-arguments` with its inputs supplied by name — the
    way a parent application starts it, and the source that wins over the command
    line — and checks what it printed.
imports:
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  Channel: oci://ghcr.io/telorun/channel@0.4.0#sha256-nD_0ZsyaVddeihAxep3t4y7Di0V0wSRrscxi5Pb5uuE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref app
  - !ref test
---
kind: App.Instance
metadata: { name: app }
source: ../telo.yaml
awaitStart: false
variables:
  name: Ada
  also: [Grace, Linus]
  greeting: Hi
  shout: true
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: printed
    invoke:
      kind: Channel.ReadUntil
      channel: !ref app
      timeout: "10s"
    inputs: { until: "HI, LINUS!\n" }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.printed.result.text"
      expected: "HI, ADA!\nHI, GRACE!\nHI, LINUS!\n"
