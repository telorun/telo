kind: Telo.Library
metadata:
  name: CrudUi
  version: 0.11.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [UI, Data]
  description: >-
    A ready admin screen over a database-backed REST collection from one
    declaration: a filter bar, a paged listing drawn as a table, cards, a board
    or any other layout, create and edit buttons opening pages you declare, and a
    confirmed delete. Related records are shown by name, all derived from the
    data model.
requires: { telo: ">=0.141.0" }
restrictions:
  - requires: { telo: ">=0.126.0" }
    reason: "0.125.1 checks this module clean and fails at boot: its forward past a source reads the instance, so the body's forms and listing get no `model` (ERR_RESOURCE_SCHEMA_VALIDATION_FAILED)."
imports: { Crud: ../crud, UiKit: ../ui }
exports: { kinds: [CollectionSource, Admin] }
---
kind: Telo.Definition
metadata:
  name: CollectionSource
  description: >-
    Where a browser reads a database-backed collection of records from: the
    collection, with the record shape of every operation — list row, create
    and update bodies — and the app-relative URL its REST API is mounted at.
    Written once and used by admin screens, listings, filters and pickers.
capability: Telo.Provider
extends: UiKit.CollectionSource
schema:
  type: object
  properties:
    collection:
      title: Collection
      description: The collection read, with the shape of each of its operations.
      x-telo-ref: { kind: Crud.Collection, use: dependency }
---
# The screen a hand-written `ui` page would hold, generated from the collection:
# `docs/admin.md` lists this body as a manifest, and a test proves the two render
# the same page. Every key but `source` is forwarded as written, so what an
# omitted one means is the `ui` side's.
kind: Telo.Definition
metadata:
  name: Admin
  description: >-
    A ready admin screen over a REST collection: a filter bar, a sortable paged
    listing, create and edit buttons that open pages you declare, and a
    confirmed delete on every record. Columns, filters and related-record labels
    are derived from the data model, so a property added to it appears without
    an edit.
capability: Telo.Provider
extends: UiKit.Composite
schema:
  type: object
  additionalProperties: false
  required: [source]
  examples:
    - source: !ref tasksSource
  properties:
    source:
      title: Source
      description: >-
        The collection shown and the URL its API is mounted at under the
        application's mount.
      x-telo-ref: { kind: Self.CollectionSource, use: dependency }
    relations:
      title: Relations
      description: >-
        How each related record is read, labelled and searched, keyed by a
        property the collection relates. Omitted, related records are shown by
        key.
      $ref: "telo://UiKit/Relations"
    filters:
      title: Filters
      description: >-
        How the filter bar behaves: where its controls sit and how they are
        drawn (which filters are on show, how each is entered, what summarises
        the bar, written on the placement), when a change applies and where its
        state is kept.
      $ref: "telo://UiKit/FilterPolicy"
    create:
      title: Create
      description: >-
        The create button: where it goes, usually an opened page of a new
        record, and its name. Omitted, no button. Over `values`, the property
        values a layout's create gesture proposes, `{}` from the button.
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { $ref: "telo://UiKit/Press#/properties/to" }
        label: { $ref: "telo://UiKit/Press#/properties/label" }
      x-telo-context:
        type: object
        properties:
          values: { x-telo-context-ref-from: source/collection/schemas/list, x-telo-context-partial: true, x-telo-context-eval: accessor }
          query: { x-telo-context-eval: accessor, type: object, properties: {}, additionalProperties: false }
    edit:
      title: Edit
      description: >-
        Drawn among each record's actions: where it goes over `row`, usually an
        opened page of that record, and its name. Without `press`, pressing a
        record does the same.
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { $ref: "telo://UiKit/Press#/properties/to" }
        label: { $ref: "telo://UiKit/Press#/properties/label" }
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-ref-from: source/collection/schemas/list, x-telo-context-eval: accessor }
          query: { x-telo-context-eval: accessor, type: object, properties: {}, additionalProperties: false }
    paging:
      title: Paging
      description: >-
        How further pages are reached: a pager (`pages`), a "Load more"
        control (`more`), or the next page loaded as the end comes into view
        (`scroll`).
      enum: [pages, more, scroll]
    layout:
      title: Layout
      description: >-
        How the records are drawn, over `row`, one record of the list. Omitted,
        a table with one column per property of the list shape but the key.
      x-telo-ref: { kind: UiKit.ListingLayout, use: call }
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-ref-from: source/collection/schemas/list, x-telo-context-eval: accessor }
          query: { x-telo-context-eval: accessor, type: object, properties: {}, additionalProperties: false }
    compact:
      title: Compact
      description: >-
        How the records are drawn below the application's breakpoint. Omitted,
        `layout` is drawn at every width.
      x-telo-ref: { kind: UiKit.ListingLayout, use: call }
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-ref-from: source/collection/schemas/list, x-telo-context-eval: accessor }
          query: { x-telo-context-eval: accessor, type: object, properties: {}, additionalProperties: false }
    press:
      title: Press
      description: >-
        What pressing a record does, and its name, over `row`, one record of the
        list. Written, editing is the record's edit button; omitted, pressing a
        record does what `edit` does.
      $ref: "telo://UiKit/Press"
      x-telo-context:
        type: object
        properties:
          row: { x-telo-context-ref-from: source/collection/schemas/list, x-telo-context-eval: accessor }
          query: { x-telo-context-eval: accessor, type: object, properties: {}, additionalProperties: false }
resources:
  - kind: UiKit.CollectionPresentation
    metadata: { name: presentation }
    source: !cel "self.source"
    relations: !cel "self.relations"
  - kind: UiKit.Listing
    metadata: { name: listing }
    presentation: !ref presentation
    model: !cel "self.source.collection.schemas.list"
    paging: !cel "self.paging"
    create: !cel "self.create"
    edit: !cel "self.edit"
    delete: true
    layout: !cel "self.layout"
    compact: !cel "self.compact"
    press: !cel "self.press"
  - kind: UiKit.Filters
    metadata: { name: filters }
    presentation: !ref presentation
    policy: !cel "self.filters"
    content: { type: composite, ref: !ref listing }
provide: !ref filters
