# A control set replacing the nine layer controls of the third generation and
# not the combobox, the tenth.
kind: Telo.Library
metadata:
  name: UiReactControlsLayersPartial
  version: 1.0.0
  description: >-
    Test fixture exporting a control set that implements nine of the layer
    controls, without the combobox.
imports: { UiReact: ../../../../../ }
exports:
  resources: [nineLayers]
  browser:
    - specifier: "@fixture/nine-layers"
      path: ./browser/nine-layers.js
      source: ./nine-layers.js
      abi: ui_react_controls-4
      external: [react, react/jsx-runtime, react-dom]
      exports: [Select, MultiSelect, Dialog, Drawer, Popover, Confirmation, Menu, Tooltip, Navigation]
---
kind: UiReact.Controls
metadata: { name: nineLayers }
entry: "@fixture/nine-layers"
implements: [Select, MultiSelect, Dialog, Drawer, Popover, Confirmation, Menu, Tooltip, Navigation]
