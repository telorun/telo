modules:
  apps/hub: Added
body: "A publisher's API key sent as Authorization: Bearer <key> to POST /register skips
  its per-address rate limit when it grants register:unlimited; a key that is presented
  and refused is answered 401, never served anonymously. Keys are stored as digests in
  the hub's own database and issued, listed and revoked with admin.yaml (telo run
  admin.yaml issue|list|revoke), a separate application the image warms beside the hub
  so it runs offline in the hub's container."
