modules:
  modules/ui-react: Added
body: Draws a split view's frame (data-frame) and toggle as its button display says, a
  list layout's frame and a link node's button (data-button) as a button-shaped anchor.
  The controls contract ui_react_controls-3 gains the glyphs go, panel-close and
  panel-open, and expand and collapse become disclosure chevrons; the sidebar toggle
  draws the panel glyphs. The default theme mirrors the panel glyphs when exactly one of
  an aside at the end edge and a right-to-left page holds, and the go glyph in a
  right-to-left page. A link drawn from a record's own content carries data-record,
  which is what the themes restyle.
