              compact: { type: drawer, side: bottom, size: medium, modal: true, dismiss: { escape: true, outside: true, closeButton: true } }
            - openPage
            - { type: inline }
            - { onSuccess: [], onFailure: [] }
          # Panels.
          - - openPage
            - { type: panel, side: start, size: small, dismiss: { escape: false, closeButton: true } }
            - openPage
            - type: panel
              side: end
              size: large
              dismiss: { escape: true, closeButton: true }
              address: { name: taskPanel }
              compact: { type: drawer, side: bottom, size: medium, modal: true, dismiss: { escape: true, outside: true, closeButton: true } }
            - false
        # A page of its own: both navigate.
        ownPage:
          - { type: navigate, href: { path: { value: /tasks/new }, pathParams: {}, queryParams: {} } }
          - { type: navigate, href: { path: { value: "/tasks/{id}" }, pathParams: { id: { root: row, path: [ id ] } }, queryParams: {} } }
