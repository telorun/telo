kind: Telo.Application
metadata:
  name: SchemaEvolutionExampleTest
  version: 1.0.0
  description: >-
    Runs release 1, then release 2 against the same database, in that order — which
    is the example: a rename applied as expand-contract, a removed column kept as a
    tombstone, and a reclaim that only happens once the grace window has passed.
    Release 2 is then run a second time, because a declaration that cannot be
    re-applied to the database it just produced is the failure this whole design
    exists to prevent.
imports:
  Run: oci://ghcr.io/telorun/run@0.32.1#sha256-kV5CLg3aUn7XH49UnwIQ1f1UmnA7s1XGvJyX67GfJN8
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  Timer: oci://ghcr.io/telorun/timer@0.10.0#sha256-mwYLYOutKn1x3NOElOfgGc5_WZwwlnTRvgKo1XeQcfA
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
variables:
  # Anchored at the working directory, as the example's own `dbFile` is: a value
  # supplied by name must already be an absolute host path.
  dbFile:
    env: SCHEMA_EVOLUTION_TEST_DB
    type: string
    x-telo-type: Telo.HostPath
    default: ./.telo/schema-evolution-test.db
targets:
  - !ref releaseOne
  - !ref releaseTwo
  - !ref releaseTwoAgain
  - !ref test
---
kind: App.Instance
metadata: { name: releaseOne }
source: ../v1.yaml
variables:
  dbFile: !cel "variables.dbFile"
---
kind: App.Instance
metadata: { name: releaseTwo }
source: ../telo.yaml
variables:
  dbFile: !cel "variables.dbFile"
---
kind: App.Instance
metadata: { name: releaseTwoAgain }
source: ../telo.yaml
variables:
  dbFile: !cel "variables.dbFile"
---
kind: Run.Loop
metadata: { name: awaitReleases }
condition: !cel >-
  resources.releaseOne.status.exitCode == null ||
  resources.releaseTwo.status.exitCode == null ||
  resources.releaseTwoAgain.status.exitCode == null
maxIterations: 300
steps:
  - { name: wait, invoke: { kind: Timer.Delay }, inputs: { duration: 20ms } }
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: awaitExits
    invoke: !ref awaitReleases
  - name: verifyEachRelease
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        releaseOne: !cel "resources.releaseOne.status.exitCode"
        releaseTwo: !cel "resources.releaseTwo.status.exitCode"
        releaseTwoAgain: !cel "resources.releaseTwoAgain.status.exitCode"
      expected: { releaseOne: 0, releaseTwo: 0, releaseTwoAgain: 0 }
