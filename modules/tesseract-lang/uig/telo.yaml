      ./tessdata/uig.traineddata.gz:
        { upstream: uig, member: package/4.0.0_best_int/uig.traineddata.gz, sha256: 3be33a65775f3dbfd72c0feb0b66a3f2198bb14378537ab770f583eb1f9fbad7, executable: false }
