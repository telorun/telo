# Slicing Tavily's one ranked list. A call requests the slice plus one probe
# result, up to Tavily's maximum of 20, and returns the slice; the probe is what
# shows more remain. Nothing past the 20th result is reachable, and the cursor
# stays valid under any `count`.
kind: Telo.Application
metadata:
  name: TavilyPagingTest
  version: 1.0.0
imports:
  Tavily: ..
  WebSearch: ../../web-search
  Http: ../../http-client
  Server: ../../http-server
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref paging
---
kind: Tavily.WebSearchEngine
metadata: { name: engine }
request:
  kind: Http.Request
  client: { kind: Http.Client, baseUrl: "http://localhost:18860" }
---
# More results than Tavily's maximum exist for `deep`; the mock serves as many as
# `max_results` asks for.
kind: Run.Value
metadata: { name: canned }
value:
  paging: [a1, a2, a3, a4, a5, a6, a7]
  deep: !cel "range(25).map(i, 'd' + string(i + 1))"
---
kind: Run.Sequence
metadata: { name: paging }
with:
  - kind: Server.Api
    metadata: { name: FakeTavily }
    routes:
      - request:
          path: /search
          method: POST
          schema:
            body: { type: object, additionalProperties: true }
        handler: !ref canned
        returns:
          - status: 200
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel >-
                  {'results': request.body.query in result
                    ? cel.bind(all, result[request.body.query],
                        slice(all, 0, int(request.body.max_results) < size(all) ? int(request.body.max_results) : size(all))
                          .map(t, {'title': t, 'url': 'https://example.com/' + t, 'content': t}))
                    : []}
  - kind: Server.Server
    metadata: { name: FakeServer }
    port: 18860
    mounts:
      - path: /
        mount: !ref FakeTavily
targets:
  - !ref FakeServer
steps:
  - name: first
    invoke: !ref engine
    inputs: { query: paging, count: 3 }
  - name: second
    invoke: !ref engine
    inputs: { query: paging, count: 3, cursor: !cel "steps.first.result.nextCursor" }
  - name: third
    invoke: !ref engine
    inputs: { query: paging, count: 3, cursor: !cel "steps.second.result.nextCursor" }
  - name: anyCount
    invoke: !ref engine
    inputs: { query: paging, count: 10, cursor: !cel "steps.first.result.nextCursor" }
  - name: noCount
    invoke: !ref engine
    inputs: { query: paging }
  # The window ends at the 20th result.
  - name: deepFirst
    invoke: !ref engine
    inputs: { query: deep, count: 10 }
  - name: deepSecond
    invoke: !ref engine
    inputs: { query: deep, count: 10, cursor: !cel "steps.deepFirst.result.nextCursor" }
  - name: nothing
    invoke: !ref engine
    inputs: { query: nothing, count: 3 }
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        - !cel "steps.first.result"
        - !cel "steps.second.result"
        - !cel "steps.third.result"
        - !cel "steps.anyCount.result"
        - !cel "steps.noCount.result"
        - !cel "steps.deepFirst.result.nextCursor"
        - !cel "steps.deepSecond.result"
        - !cel "steps.nothing.result"
      expected: !cel >-
        cel.bind(item, ['a1', 'a2', 'a3', 'a4', 'a5', 'a6', 'a7'].map(t, {'title': t, 'url': 'https://example.com/' + t, 'snippet': t}),
        cel.bind(deep, range(20).map(i, 'd' + string(i + 1)).map(t, {'title': t, 'url': 'https://example.com/' + t, 'snippet': t}),
          [
            {'results': slice(item, 0, 3), 'nextCursor': WebSearch.sealCursor('tavily', {'query': 'paging'}, '3')},
            {'results': slice(item, 3, 6), 'nextCursor': WebSearch.sealCursor('tavily', {'query': 'paging'}, '6')},
            {'results': slice(item, 6, 7)},
            {'results': slice(item, 3, 7)},
            {'results': item},
            WebSearch.sealCursor('tavily', {'query': 'deep'}, '10'),
            {'results': slice(deep, 10, 20)},
            {'results': []}
          ]))
