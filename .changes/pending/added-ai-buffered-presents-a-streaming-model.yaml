modules:
  modules/ai: Added
body: "`Ai.Buffered` presents a streaming model as a buffered one, so a provider that
  only streams is usable by `Ai.Text` and `Ai.Agent` — most of the calls anyone makes.
  Written as a manifest rather than a controller, which is the point of declaring the
  contract at all: the fold is a `Run.Sequence` that drives the stream, collects the
  parts and folds them into one answer with its usage and finish reason. The whole input
  is passed through rather than enumerated, so the adapter cannot silently drop a field
  the abstract gains later. Not for a provider whose endpoint offers a buffered call —
  collecting a stream to hand back one answer pays a stream's latency for a buffer's
  result."
