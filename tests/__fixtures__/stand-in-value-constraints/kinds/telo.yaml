# A kind whose own fields carry value constraints, evaluated at creation — the
# shape of `OTLP.Sink.timeout`.
kind: Telo.Library
metadata:
  name: StandInKinds
imports:
  Run: ../../../../modules/run
exports:
  kinds: [Timed, Waiting]
---
kind: Telo.Definition
metadata:
  name: Timed
capability: Telo.Invocable
schema:
  type: object
  properties:
    timeout:
      type: string
      pattern: "^\\d+(ms|s)$"
      x-telo-eval: compile
    count:
      type: integer
      x-telo-eval: compile
invoke: !ref echo
resources:
  - kind: Run.Value
    metadata:
      name: echo
    value: !cel "self.timeout"
---
# An own field that is a union of references alone.
kind: Telo.Definition
metadata:
  name: Waiting
capability: Telo.Invocable
schema:
  type: object
  properties:
    wait:
      x-telo-eval: compile
      anyOf:
        - { $ref: "#/$defs/Seconds" }
        - { $ref: "#/$defs/Count" }
  $defs:
    Seconds: { type: string, pattern: "^\\d+s$" }
    Count: { type: integer }
invoke: !ref echo
resources:
  - kind: Run.Value
    metadata:
      name: echo
    value: !cel "self.wait"
