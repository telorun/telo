inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [messages]
    properties:
      messages:
        type: array
        minItems: 1
        items: !ref Message
      options:
        type: object
        additionalProperties: true
      tools:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, parameters]
          properties:
            name: { type: string }
            description: { type: string }
            parameters:
              type: object
              additionalProperties: true
      toolChoice:
        type: string
        enum: [auto, none]
        description: >-
          Whether this call may ask for a tool. `auto`, the meaning when absent, leaves
          it to the model; `none` asks for an answer without requesting a tool, while
          `tools` stay declared so the calls already in `messages` remain valid.
      providerState: {}
      responseFormat:
        type: object
        additionalProperties: true
    dependencies:
      toolChoice: [tools]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        description: >-
          The answer's parts, in order, ending with exactly one `finish`. Whatever
          fails after the call has returned rejects the iteration; parts already
          yielded still reach the consumer, so a forwarder can flush what it has and
          encode an error frame from the catch. A caller that received the stream
          reads it to its `finish` or cancels it. A tool call may be preceded by
          `tool-call-delta` parts carrying its arguments as they are written: each
          names the call's id — never empty, and the `id` of the `tool-call` that
          follows — and its tool name, and none is emitted before that id is known.
          The implementation assigns the id, unique across every call of a run.
        x-telo-type:
          name: Telo.Stream
          of:
            $ref: "telo://Self/StreamPart"
---
kind: Telo.Definition
metadata:
  name: Text
  description: >-
    Generates a buffered text completion from a prompt or a message list, returning
    the completed text with token usage and a finish reason. Takes a default system
    prompt and per-call option overrides.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiTextController
# `inherit`: what the model throws escapes this kind unchanged, so its codes are
# part of this kind's union and a route's `catches:` may name them.
throws:
  inherit: true
  codes:
    ERR_INVALID_INPUT:
      description: >-
        The call was malformed in a way its declared shape does not state — both
        `prompt` and `messages`, neither, or an empty message list.
    ERR_INVALID_REFERENCE:
      description: >-
        `model` did not resolve to a live model instance. A wiring failure, not a
        request failure.
    ERR_CONTRACT_VIOLATION:
      description: A provider reported a token count that is not a representable integer.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      prompt: { type: string }
      messages:
        type: array
        items: !ref Message
      system: !ref SystemPrompt
      options: { type: object, additionalProperties: true }
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      text: { type: string }
      usage:
        $ref: "telo://Self/Usage"
      finishReason:
        $ref: "telo://Self/FinishReason"
    required: [text, usage, finishReason]
    additionalProperties: false
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.Model implementation (OpenAI.ChatModel, OpenAI.ResponsesModel, or a third-party provider).
      x-telo-ref:
        kind: Self.Model
        use: call
    system:
      title: System prompt
      description: >-
        Default system message: text, or a non-empty list of text parts when one
        marks a prompt-cache breakpoint. Runtime inputs.system takes precedence
        when set.
      # The SystemPrompt shape, written out with its text part: a kind's schema
      # reaches an unexported shape by reference only in some check orders. Held
      # to the shape and to ContentPart's text part by the module's unit test.
      anyOf:
        - type: string
          contentMediaType: text/markdown
          x-telo-widget: code
        - type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [type, text]
            properties:
              type: { const: text }
              text: { type: string }
              cacheBreakpoint: { type: boolean }
    options:
      title: Options
      description: Completion-level option overrides. Shallow-merged between the model's options and runtime inputs.options; downstream wins.
      type: object
      additionalProperties: true
  required: [model]
  additionalProperties: false
  examples:
    - model: !ref Gpt4oMini
      system: |
        You are a concise assistant. Answer in one sentence.
      options:
        temperature: 0.2
        maxTokens: 256
---
# Streaming consumer. Drives Ai.Model.stream() and forwards the StreamPart
# iterable on `result.output` per the streaming-Invocable convention. Encoding
# (NDJSON / SSE / plain text / raw bytes) is the consumer's responsibility —
# pipe through a format-codec encoder (Ndjson.Encoder from @telorun/ndjson-codec,
# Sse.Encoder from @telorun/sse-codec, PlainText.Encoder from @telorun/plain-text-codec,
# Octet.Encoder from @telorun/octet-codec), or iterate `result.output` directly
# in a JS.Script step.
kind: Telo.Definition
metadata:
  name: TextStream
  description: >-
    Streams a text completion token by token as an async iterable of text deltas
    ending in one finish record. Same prompt, system and option inputs as a buffered
    completion; encoding the stream is the consumer's job. The call makes the model
    call: what the model refuses it with rejects this call unchanged, and anything
    later rejects the iteration.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiTextStreamController
# `inherit`: what the model throws escapes this kind unchanged, so its codes are
# part of this kind's union and a route's `catches:` may name them.
throws:
  inherit: true
  codes:
    ERR_INVALID_INPUT:
      description: >-
        The call was malformed in a way its declared shape does not state — both
        `prompt` and `messages`, neither, or an empty message list.
    ERR_INVALID_REFERENCE:
      description: >-
        `model` did not resolve to a live model instance. A wiring failure, not a
        request failure.
    ERR_CONTRACT_VIOLATION:
      description: A provider reported a token count that is not a representable integer.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      prompt: { type: string }
      messages:
        type: array
        items: !ref Message
      system: !ref SystemPrompt
      options: { type: object, additionalProperties: true }
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type: Telo.Stream
        description: >-
          Async iterable of StreamPart records, ending with exactly one `finish`. A
          failure after the call has returned rejects the iteration rather than
          yielding a part.
    required: [output]
    additionalProperties: false
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.ModelStream implementation.
      x-telo-ref:
        kind: Self.ModelStream
        # Both, and the pair is the honest reading: the invocation is a real
        # dispatch that returns a handle — and can be refused, which rejects this
        # call — and then the response, the transform chain and every later
        # failure happen while the CONSUMER drains, after this call has returned. So a zone's lifetime stops at the streaming
        # boundary rather than falsely extending over work that outlives it.
        use: [call, trigger.consumer]
    system:
      title: System prompt
      description: >-
        Default system message: text, or a non-empty list of text parts when one
        marks a prompt-cache breakpoint. Runtime inputs.system takes precedence
        when set.
      # The SystemPrompt shape, written out with its text part: a kind's schema
      # reaches an unexported shape by reference only in some check orders. Held
      # to the shape and to ContentPart's text part by the module's unit test.
      anyOf:
        - type: string
          contentMediaType: text/markdown
          x-telo-widget: code
        - type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [type, text]
            properties:
              type: { const: text }
              text: { type: string }
              cacheBreakpoint: { type: boolean }
    options:
      title: Options
      description: Per-resource option overrides. Shallow-merged with the model's options and runtime inputs.options; downstream wins.
      type: object
      additionalProperties: true
  required: [model]
  additionalProperties: false
  examples:
    - model: !ref Gpt4oMini
      system: |
        You are a concise assistant. Answer in one sentence.
      options:
        temperature: 0.7
---
# Ai.ToolProvider — abstract source of callable tools, mounted into an Ai.Agent the
# same way an Http.Api mounts into an Http.Server. Implementations expose a runtime
# instance with two methods (documented convention, like Ai.Model's invoke/stream):
#   listTools(): ToolDescriptor[]        — what to advertise to the model
#   callTool(name, arguments, ctx): any  — dispatch a model-requested call; `ctx` is
#                                          the agent invocation's context, handed on
#                                          to the tool so a cancelled turn stops it
# and one optional method:
#   toolRequiresApproval(name, arguments, context): boolean
#                                        — whether this call needs a decision
#                                          before it runs; absent means it does not.
#                                          Any answer but a boolean fails the call
# `Ai.Tools` (static list, here) and `AiMcp.ToolProvider` (MCP discovery, in
# @telorun/ai-mcp) both implement it; the agent never learns which.
kind: Telo.Abstract
metadata:
  name: ToolProvider
  description: >-
    A source of callable tools mounted into an agent: it advertises the tools a model
    may request, dispatches a requested call by name, and may say that a call needs
    approval before it runs. Backed by a fixed list or by tools discovered from a
    remote server at runtime.
capability: Telo.Mount
---
# Ai.Tools — a static list of tools, each wrapping any Telo.Invocable. The built-in
# Ai.ToolProvider implementation.
kind: Telo.Definition
metadata:
  name: Tools
  description: >-
    Exposes a fixed list of resources as tools an agent can call, each declaring the
    JSON Schema of the arguments the model must produce. Optional CEL maps those
    arguments, and typed data from the agent's caller, into the call and shapes its
    result. A tool can require human-in-the-loop approval before it runs.
capability: Telo.Mount
extends: Self.ToolProvider
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiToolsController
schema:
  type: object
  properties:
    contextType:
      title: Context type
      description: >-
        The shape of the caller data the tools' `inputs:` mappings read as `context` —
        a named type reference or an inline type definition. An agent mounting this
        provider requires its own `context` input to satisfy it. Without it `context`
        is empty, so a mapping reading a field of it is refused.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    tools:
      title: Tools
      description: The tools this provider exposes.
      type: array
      items:
        type: object
        properties:
          tool:
            title: Tool
            description: |
              Reference to any Telo.Invocable or Telo.Runnable to expose as a tool.
              A Run.Sequence (a Runnable with callable inputs/outputs) can wrap a
              multi-step pipeline as a single tool.
            x-telo-ref:
              kind: Telo.Executable
              use: call
          name:
            title: Name
            description: Tool name the model sees. Defaults to the referenced resource name.
            type: string
          description:
            title: Description
            description: Human/model-facing description of what the tool does.
            type: string
          parameters:
            title: Parameters
            description: JSON Schema for the arguments the model must produce. Required.
            type: object
            additionalProperties: true
          inputs:
            title: Inputs mapping
            description: |
              Optional CEL mapping into the invocable's input, from the model's
              `arguments` and from `context` — the data the agent's caller passed,
              typed by `contextType`. Omit to forward `arguments` verbatim.
            type: object
            additionalProperties: true
            x-telo-context:
              type: object
              properties:
                arguments:
                  x-telo-context-from: "parameters/properties"
                # Typed by the declared `contextType`; with none declared the
                # node's own keywords stand, a closed empty object.
                context:
                  type: object
                  properties: {}
                  additionalProperties: false
                  x-telo-context-from-root: contextType
          approval:
            title: Approval
            description: >-
              Whether a call to this tool needs a decision before it runs: `true`, or a
              CEL expression over the call's `arguments` and the caller's `context`,
              evaluated for each call. A call that needs one is put to the agent's
              `approver`, or ends the run asking its caller.
            type: boolean
            default: false
            x-telo-context:
              type: object
              properties:
                arguments:
                  x-telo-context-from: "parameters/properties"
                context:
                  type: object
                  properties: {}
                  additionalProperties: false
                  x-telo-context-from-root: contextType
          result:
            title: Result mapping
            description: |
              Optional CEL expression shaping the invocable's `result` into what is
              fed back to the model: a string, or a content part / list of content
              parts (`{type: image, data, mediaType}`) for a multimodal result.
              Omit to write the output as plain JSON.
            # Not `type: string`: the runtime has always accepted content parts
            # (see `agent-tools.ts`), so constraining the evaluated CEL to a
            # string rejected a shipped feature — visible only once the value is
            # written in `!cel` form, which is type-checked against this schema.
            anyOf:
              - type: string
              - type: object
              - type: array
            x-telo-context:
              type: object
              properties:
                result:
                  x-telo-context-ref-from: "tool/outputType"
        required: [tool, parameters]
        additionalProperties: false
  required: [tools]
  additionalProperties: false
  # A name the entry's own filter removes is the agent's own rule to report, so
  # it holds here. A tool's name is its `name`, else its resource's.
  x-telo-referrer-rules:
    - referrer: Self.Agent
      peers: /toolProviders
      condition: !cel >-
        !has(entry.approval) || !has(entry.approval.include) ||
        entry.approval.include.all(n,
        (has(entry.include) && !(n in entry.include)) ||
        (has(entry.exclude) && n in entry.exclude) ||
        self.tools.exists(t, (has(t.name) ? t.name : t.tool.name) == n))
      code: AGENT_APPROVAL_UNKNOWN_TOOL
      message: >-
        lists a tool in `approval.include` that this provider does not declare, so
        the name gates nothing. Names are matched bare, before any `prefix`.
    - referrer: Self.AgentStream
      peers: /toolProviders
      condition: !cel >-
        !has(entry.approval) || !has(entry.approval.include) ||
        entry.approval.include.all(n,
        (has(entry.include) && !(n in entry.include)) ||
        (has(entry.exclude) && n in entry.exclude) ||
        self.tools.exists(t, (has(t.name) ? t.name : t.tool.name) == n))
      code: AGENT_STREAM_APPROVAL_UNKNOWN_TOOL
      message: >-
        lists a tool in `approval.include` that this provider does not declare, so
        the name gates nothing. Names are matched bare, before any `prefix`.
  examples:
    - tools:
        - tool: !ref GetWeather
          name: get_weather
          description: Get the current weather at a latitude/longitude (open-meteo).
          parameters:
            type: object
            additionalProperties: false
            required: [latitude, longitude]
            properties:
              latitude: { type: number, description: "Latitude in decimal degrees." }
              longitude: { type: number, description: "Longitude in decimal degrees." }
          inputs:
            url: /v1/forecast
            method: GET
            query:
              latitude: !cel "arguments.latitude"
              longitude: !cel "arguments.longitude"
              current_weather: "true"
          result: !cel "result.body"
---
# Ai.Agent — a tool-use loop. Invoked like Ai.Text (prompt xor messages, plus
# system/options); calls the model with the merged tool set, executes any requested
# tools via their providers, replays results, and loops until the model finishes or
# maxSteps is hit. A tool call that needs a decision is settled first — by the
# caller's `approvals`, by the `approver`, or by ending the run asking.
kind: Telo.Definition
metadata:
  name: Agent
  description: >-
    Runs a tool-use loop: calls the model, executes the tools it requests in parallel
    up to a bound, replays the results, and repeats until the model finishes or a step
    limit is reached. Returns the final text with accumulated usage, each model call,
    each tool result and the messages to persist. Tool calls can wait for
    human-in-the-loop approval, and a paused run resumes.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiAgentController
# `inherit`: what the model throws escapes this kind unchanged, so its codes are
# part of this kind's union and a route's `catches:` may name them.
throws:
  inherit: true
  codes:
    ERR_INVALID_INPUT:
      description: >-
        The call was malformed in a way its declared shape does not state — both
        `prompt` and `messages`, neither, or an empty message list; an `approvals`
        entry beside `prompt`, one naming a tool call that is not pending, or two
        for one call; or two pending tool calls sharing an id.
    ERR_INVALID_REFERENCE:
      description: >-
        `model` did not resolve to a live model instance. A wiring failure, not a
        request failure.
    ERR_CONTRACT_VIOLATION:
      description: >-
        A provider reported a token count that is not a representable integer, one
        model response carried two tool calls sharing an id, or a tool provider
        answered whether a call needs approval with something other than a boolean.
        The last is a failure of that tool call, which does not run: fed back to the
        model or raised, as `onToolError` says.
    ERR_AGENT_MAX_STEPS:
      description: >-
        The loop did not converge within `maxSteps` and `onMaxSteps` is `throw`. Raised
        rather than returned so it reaches a `catch:` and a route's `catches:`.
    ERR_AGENT_UNKNOWN_TOOL:
      description: The model asked for a tool no mounted provider advertises.
    ERR_AGENT_TOOL_COLLISION:
      description: Two mounted providers advertise the same tool name.
    ERR_AGENT_APPROVAL_UNKNOWN_TOOL:
      description: >-
        A tool provider entry's `approval.include` names a tool the entry does not
        expose, so the name would gate nothing. Raised when the tools are assembled,
        before any model call.
    ERR_AGENT_APPROVAL_DECISION_INVALID:
      description: >-
        The approver's answer, as `approver.result` mapped it, is not a decision:
        it is not an object, `decision` is not `approve`, `reject` or `defer`,
        `reason` is not a string, or it carries another key. The call it was asked
        about stays pending.
      data:
        type: object
        required: [toolCallId, name]
        properties:
          toolCallId:
            type: string
            description: The id of the tool call the approver was asked about.
          name:
            type: string
            description: The tool's name as the model saw it.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      prompt: { type: string }
      messages:
        type: array
        items: !ref Message
      system: !ref SystemPrompt
      options: { type: object, additionalProperties: true }
      context:
        description: >-
          Data from the caller for the tools to read: each mounted provider's `inputs:`
          mappings see it as `context`, and it must satisfy the `contextType` of every
          provider that declares one. Never sent to the model.
        type: object
        default: {}
        x-telo-value-schema-from: /toolProviders/*/provider/contextType
      approvals:
        description: >-
          Decisions on the tool calls `messages` leaves pending — the calls of its
          last assistant turn that no tool message answers. An approved call runs
          without being judged again; a refused one is not run and the model is told
          it was denied, with `reason`. A pending call with no entry is judged
          afresh. An `approvals` entry beside `prompt` is refused.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [toolCallId, approved]
          properties:
            toolCallId:
              type: string
              description: The id of the pending tool call this decides.
            approved: { type: boolean }
            reason:
              type: string
              description: Why, told to the model when the call is refused.
      providerState:
        description: >-
          Opaque state a previous run returned as `providerState`, handed unchanged
          to the first model call.
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      text: { type: string }
      # Accumulated across the loop's turns.
      usage:
        $ref: "telo://Self/Usage"
      finishReason:
        $ref: "telo://Self/FinishReason"
      limit:
        description: >-
          The bound that ended the run: `max-steps` when the step budget ran out
          before the model finished. Absent when the model finished on its own.
        type: string
        enum: [max-steps]
      interrupt:
        description: >-
          Why the run stopped before the model finished: `approval` when tool calls
          are waiting for a decision, listed in `approvalRequests`. Continue by
          invoking again with the conversation — the input messages followed by
          `messages` — and an `approvals` entry per call. Never beside `limit`.
        type: string
        enum: [approval]
      approvalRequests:
        description: The tool calls waiting for a decision, in the order the model asked for them.
        type: array
        items: !ref ToolCall
      approvalDecisions:
        description: >-
          What the approver answered, one entry per call it was asked about, in the
          order it answered. Absent when it was never asked.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [toolCallId, name, decision]
          properties:
            toolCallId: { type: string }
            name: { type: string }
            decision:
              type: string
              enum: [approve, reject, defer]
            reason: { type: string }
      messages:
        description: >-
          Every message the run appended to the conversation, in order: each
          assistant turn, each tool result, the final answer. The input messages
          followed by these is the conversation to persist and to pass to the next
          run.
        type: array
        items: !ref Message
      providerState:
        description: >-
          Opaque model state to pass back as the next run's `providerState`: the
          last state a model call produced, or the input `providerState` when no
          call produced one, absent when neither.
      steps:
        description: >-
          One entry per model call the run made, the answering and the concluding
          call included. A run that resumes pending calls adds no entry for them.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [text, toolCalls]
          properties:
            text:
              type: string
              description: The text the model wrote on that call.
            toolCalls:
              description: The tools the model asked for on that call, in the order it asked.
              type: array
              items: !ref ToolCall
      toolResults:
        description: >-
          One entry per tool call the run settled — ran, failed or was denied —
          including calls a previous run left pending, in the order they were
          recorded. A call still waiting has none and is listed in
          `approvalRequests`.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [toolCallId, name, content]
          properties:
            toolCallId:
              type: string
              description: The id of the tool call this answers.
            name:
              type: string
              description: The tool's name as the model saw it.
            content:
              description: What was fed back to the model — text, or content parts.
              anyOf:
                - type: string
                - type: array
                  items:
                    $ref: "telo://Self/ContentPart"
            error:
              type: boolean
              description: True when the call failed and `content` is the error fed back.
            denied:
              type: boolean
              description: >-
                True when the call was decided against — by the caller or by the
                agent's approver — and never ran; `content` is what the model was
                told. A denial is not an error.
    required: [text, usage, finishReason, steps, toolResults, messages]
    additionalProperties: false
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.Model implementation.
      x-telo-ref:
        kind: Self.Model
        use: call
    system:
      title: System prompt
      description: >-
        Default system message: text, or a non-empty list of text parts when one
        marks a prompt-cache breakpoint. Runtime inputs.system takes precedence
        when set.
      # The SystemPrompt shape, written out with its text part: a kind's schema
      # reaches an unexported shape by reference only in some check orders. Held
      # to the shape and to ContentPart's text part by the module's unit test.
      anyOf:
        - type: string
          contentMediaType: text/markdown
          x-telo-widget: code
        - type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [type, text]
            properties:
              type: { const: text }
              text: { type: string }
              cacheBreakpoint: { type: boolean }
    options:
      title: Options
      description: Completion-level option overrides passed to the model each turn.
      type: object
      additionalProperties: true
    maxSteps:
      title: Max steps
      description: Maximum model turns before the loop is bounded.
      type: integer
      minimum: 1
      default: 8
      x-telo-eval: compile
    onMaxSteps:
      title: On max steps
      description: >-
        What happens when `maxSteps` turns pass without the model finishing. throw →
        raise ERR_AGENT_MAX_STEPS; return → hand back the last turn's text; conclude →
        make one more model call that may not use a tool, ending with
        `conclusionPrompt`, and hand back its answer. `return` and `conclude` mark the
        result `limit: max-steps`.
      type: string
      enum: [throw, return, conclude]
      default: throw
    conclusionPrompt:
      title: Conclusion prompt
      description: >-
        The final user message of the call `onMaxSteps: conclude` makes. Only legal
        with `conclude`.
      type: string
      contentMediaType: text/markdown
      x-telo-widget: code
      default: >-
        You have reached the limit of steps for this run and can call no more tools.
        Using only what you have learned so far, write your final answer now: say what
        is done, what is not done, and what the next step would be.
    onToolError:
      title: On tool error
      description: >-
        feedback → record the error and return it to the model, while the tools running
        beside it finish; throw → abort the invoke with the first tool error, cancelling
        the tools still running. A cancelled turn and a durable suspension are not tool
        errors and always propagate.
      type: string
      enum: [feedback, throw]
      default: feedback
    maxToolResultBytes:
      title: Max tool result bytes
      description: >-
        Bounds the UTF-8 bytes of text each tool result feeds the model, error results
        included. A longer result keeps its longest whole-character prefix and ends with
        a line saying how many bytes were cut; media parts are neither counted nor cut,
        and the result record's output stays whole. Unset: unbounded.
      type: integer
      minimum: 1
      x-telo-eval: compile
    maxParallelTools:
      title: Max parallel tools
      description: >-
        How many of the tool calls of one model response run at once. Calls start in
        the order the model asked for them, and the model is given their results in
        that order whatever order they complete in. `1` runs one call at a time, in
        call order — for tools that depend on each other's side effects within one
        response.
      type: integer
      minimum: 1
      default: 4
      x-telo-eval: compile
    toolProviders:
      title: Tool providers
      description: Tool sources mounted into the agent — static lists (Ai.Tools) or runtime discovery (e.g. AiMcp.ToolProvider).
      type: array
      items:
        type: object
        properties:
          provider:
            title: Provider
            description: Reference to any Ai.ToolProvider implementation.
            x-telo-ref:
              kind: Self.ToolProvider
              # listTools/callTool are convention methods on a held provider,
              # not bound entry points (invoke/provide/run) — the tool ITSELF
              # is dispatched (Ai.Tools' tool slot carries the call edge).
              use: dependency
          prefix:
            title: Prefix
            description: Namespaces this provider's tool names to avoid collisions.
            type: string
          include:
            title: Include
            description: Optional allowlist matched against the provider's bare tool names (before any prefix is applied).
            type: array
            items: { type: string }
          exclude:
            title: Exclude
            description: Optional denylist matched against the provider's bare tool names (before any prefix is applied).
            type: array
            items: { type: string }
          approval:
            title: Approval
            description: >-
              Which of this entry's tools need a decision before a call to them runs,
              by bare tool name (before any prefix), over the tools the entry exposes
              after its own `include` / `exclude`. `{}` gates every one; `include`
              gates exactly the names it lists; `exclude` takes names out of the gated
              set. A tool's own provider may gate a call as well; neither ungates what
              the other gates.
            type: object
            additionalProperties: false
            properties:
              include:
                title: Include
                description: >-
                  The tools that need a decision. Each must be a tool this entry
                  exposes. An empty list gates none.
                type: array
                items: { type: string }
              exclude:
                title: Exclude
                description: >-
                  Tools that need no decision — the form to use when the provider's
                  tool list may grow, since a tool added later is then gated. A name
                  the entry does not expose is ignored.
                type: array
                items: { type: string }
        required: [provider]
        additionalProperties: false
    approver:
      title: Approver
      description: >-
        What decides a tool call that needs a decision, in place of the caller: it is
        asked once per such call and answers approve (the tool runs), reject (the
        model is told the call was denied) or defer (the run ends asking its caller).
        A decision the caller supplied in `approvals` is never put to it. A failed
        ask fails the run whatever `onToolError` says.
      type: object
      additionalProperties: false
      required: [invoke, inputs, result]
      properties:
        invoke:
          title: Invoke
          description: The resource asked for each decision — a reference or an inline declaration.
          x-telo-ref:
            kind: Telo.Executable
            use: call
            # The sibling map holding this call's arguments, typed by the
            # target's declared inputType.
            inputs: /inputs
        inputs:
          title: Inputs mapping
          description: >-
            CEL mapping into the approver's input from the call being judged:
            `toolCall` (`id`, `name` as the model saw it, `arguments`) and `tool`
            (`name`, `description`, `parameters`).
          type: object
          additionalProperties: true
          x-telo-context:
            type: object
            additionalProperties: false
            properties:
              toolCall:
                type: object
                additionalProperties: false
                properties:
                  id: { type: string }
                  name: { type: string }
                  arguments: { type: object, additionalProperties: true }
              tool:
                type: object
                additionalProperties: false
                properties:
                  name: { type: string }
                  description: { type: string }
                  parameters: { type: object, additionalProperties: true }
        result:
          title: Result mapping
          description: >-
            CEL mapping from the approver's `result` to the decision: `decision` is
            `approve`, `reject` or `defer`; `reason` is told to the model on a reject
            and reported with the decision.
          type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision:
              type: string
              enum: [approve, reject, defer]
            reason:
              type: string
          x-telo-context:
            type: object
            additionalProperties: false
            properties:
              result:
                x-telo-context-ref-from: "invoke/outputType"
  required: [model]
  additionalProperties: false
  x-telo-resource-rules:
    - condition: !cel "!has(self.conclusionPrompt) || (has(self.onMaxSteps) && self.onMaxSteps == 'conclude')"
      code: AI_CONCLUSION_PROMPT_UNUSED
      message: >-
        sets `conclusionPrompt` without `onMaxSteps: conclude`; the prompt is sent only
        by the concluding call, so it would never be used.
    - in: /toolProviders
      condition: !cel >-
        !has(this.approval) || !has(this.approval.include) ||
        this.approval.include.all(n,
        (!has(this.include) || n in this.include) && (!has(this.exclude) || !(n in this.exclude)))
      code: AI_APPROVAL_NAME_FILTERED
      message: >-
        lists a tool in `approval.include` that its own `include` / `exclude` removes;
        the entry never exposes that tool, so the name gates nothing.
  examples:
    - model: !ref Gpt4oMini
      system: |
        You are a helpful CLI assistant. Use the available tools when they help
        answer; don't guess at facts you can look up. Keep replies brief.
      maxSteps: 6
      toolProviders:
        - provider: !ref WeatherTools
        - provider: !ref RegistryTools
          prefix: "registry_"
---
# Ai.AgentStream — the streaming tool-use agent. Same loop and config as Ai.Agent,
# but it forwards the run as a Stream on `result.output` (per the streaming-Invocable
# convention) instead of a buffered object: the assistant's text streams token-by-token
# and every tool call surfaces the moment it happens. Pipe `result.output` through a
# format-codec encoder (Sse.Encoder / Ndjson.Encoder) in an Http.Api `mode: stream`
# route to serve it over SSE. Each record is an Ai.AgentStreamPart. The first model
# call is dispatched by the invocation itself, so a request the model refuses
# outright fails the CALL — where a route's `catches:` can still answer it — unless
# the run resumes pending tool calls, which are settled first, as the stream is read. Any
# later failure — and a cancelled turn, whose cancellation also reaches every
# running tool — rejects the iteration rather than yielding a record. The tools of
# one model call run side by side up to `maxParallelTools`.
kind: Telo.Definition
metadata:
  name: AgentStream
  description: >-
    Runs a tool-use loop and streams it as it happens: assistant text deltas, every tool
    call with a stable id and its result, each model call's usage, and the messages to
    persist. Tools run in parallel up to a bound and can wait for human-in-the-loop
    approval. Cancelling the run stops the model and every running tool.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiAgentStreamController
# `inherit`: what the model throws escapes this kind unchanged, so its codes are
# part of this kind's union and a route's `catches:` may name them.
throws:
  inherit: true
  codes:
    ERR_INVALID_INPUT:
      description: >-
        The call was malformed in a way its declared shape does not state — both
        `prompt` and `messages`, neither, or an empty message list; an `approvals`
        entry beside `prompt`, one naming a tool call that is not pending, or two
        for one call; or two pending tool calls sharing an id. Decided from
        the input alone, so it rejects the call rather than the iteration.
    ERR_INVALID_REFERENCE:
      description: >-
        `model` did not resolve to a live model instance. A wiring failure, not a
        request failure.
    ERR_CONTRACT_VIOLATION:
      description: >-
        A provider reported a token count that is not a representable integer, a model
        stream ended without a `finish` part, a `tool-call-delta` named no call id, one
        model response carried two tool calls sharing an id, or a tool provider
        answered whether a call needs approval with something other than a boolean.
        The last is a failure of that tool call, which does not run: fed back to the
        model or raised, as `onToolError` says.
    ERR_AGENT_MAX_STEPS:
      description: >-
        The loop did not converge within `maxSteps` and `onMaxSteps` is `throw`. Raised
        rather than returned so it reaches a `catch:` and a route's `catches:`.
    ERR_AGENT_UNKNOWN_TOOL:
      description: The model asked for a tool no mounted provider advertises.
    ERR_AGENT_TOOL_COLLISION:
      description: Two mounted providers advertise the same tool name.
    ERR_AGENT_APPROVAL_UNKNOWN_TOOL:
      description: >-
        A tool provider entry's `approval.include` names a tool the entry does not
        expose, so the name would gate nothing. Raised when the tools are assembled,
        before any model call.
    ERR_AGENT_APPROVAL_DECISION_INVALID:
      description: >-
        The approver's answer, as `approver.result` mapped it, is not a decision:
        it is not an object, `decision` is not `approve`, `reject` or `defer`,
        `reason` is not a string, or it carries another key. The call it was asked
        about stays pending.
      data:
        type: object
        required: [toolCallId, name]
        properties:
          toolCallId:
            type: string
            description: The id of the tool call the approver was asked about.
          name:
            type: string
            description: The tool's name as the model saw it.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      prompt: { type: string }
      messages:
        type: array
        items: !ref Message
      system: !ref SystemPrompt
      options: { type: object, additionalProperties: true }
      providerState:
        description: >-
          Opaque state a previous run's `provider-state` part carried, handed
          unchanged to the first model call.
      context:
        description: >-
          Data from the caller for the tools to read: each mounted provider's `inputs:`
          mappings see it as `context`, and it must satisfy the `contextType` of every
          provider that declares one. Never sent to the model.
        type: object
        default: {}
        x-telo-value-schema-from: /toolProviders/*/provider/contextType
      approvals:
        description: >-
          Decisions on the tool calls `messages` leaves pending — the calls of its
          last assistant turn that no tool message answers. An approved call runs
          without being judged again; a refused one is not run and the model is told
          it was denied, with `reason`. A pending call with no entry is judged
          afresh. An `approvals` entry beside `prompt` is refused.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [toolCallId, approved]
          properties:
            toolCallId:
              type: string
              description: The id of the pending tool call this decides.
            approved: { type: boolean }
            reason:
              type: string
              description: Why, told to the model when the call is refused.
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type:
          name: Telo.Stream
          of:
            $ref: "telo://Self/AgentStreamPart"
        description: >-
          The run's parts in order: each model call's own parts (text and reasoning
          deltas, content parts, tool-call argument deltas, tool calls, provider state)
          closed by a `step-finish` with that call's usage, then a `tool-result` per
          tool it ran, in the order the tools completed; after the last call, one
          terminal `finish` with the usage of every call summed. Each message the run
          appends to the conversation follows as a `message` part: the assistant turn
          after its `step-finish`, a tool message right after its `tool-result`. A
          call that needs a decision is reported by a `tool-approval-decision` when
          the approver answers, or by a `tool-approval-request` once the turn's other
          calls have settled, after which `finish` is marked `interrupt: approval`. A
          run given pending calls settles them before any model call. A failure or a
          cancelled turn rejects the iteration instead.
    required: [output]
    additionalProperties: false
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.ModelStream implementation.
      x-telo-ref:
        kind: Self.ModelStream
        # Both, and the pair is the honest reading: the invocation is a real
        # dispatch that returns a handle — and can be refused, which rejects this
        # call — and then the response, the transform chain and every later
        # failure happen while the CONSUMER drains, after this call has returned. So a zone's lifetime stops at the streaming
        # boundary rather than falsely extending over work that outlives it.
        use: [call, trigger.consumer]
    system:
      title: System prompt
      description: >-
        Default system message: text, or a non-empty list of text parts when one
        marks a prompt-cache breakpoint. Runtime inputs.system takes precedence
        when set.
      # The SystemPrompt shape, written out with its text part: a kind's schema
      # reaches an unexported shape by reference only in some check orders. Held
      # to the shape and to ContentPart's text part by the module's unit test.
      anyOf:
        - type: string
          contentMediaType: text/markdown
          x-telo-widget: code
        - type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [type, text]
            properties:
              type: { const: text }
              text: { type: string }
              cacheBreakpoint: { type: boolean }
    options:
      title: Options
      description: Completion-level option overrides passed to the model each turn.
      type: object
      additionalProperties: true
    maxSteps:
      title: Max steps
      description: Maximum model turns before the loop is bounded.
      type: integer
      minimum: 1
      default: 8
      x-telo-eval: compile
    onMaxSteps:
      title: On max steps
      description: >-
        What happens when `maxSteps` turns pass without the model finishing. throw →
        raise ERR_AGENT_MAX_STEPS, rejecting the iteration so a `catch:` or a route's
        `catches:` can name it; return → emit a terminal finish with the last turn's
        finishReason; conclude → make one more model call that may not use a tool,
        ending with `conclusionPrompt`, and emit its parts — never a tool call or a
        tool call's argument deltas — before the terminal finish.
        `return` and `conclude` mark that finish `limit: max-steps`.
      type: string
      enum: [throw, return, conclude]
      default: throw
    conclusionPrompt:
      title: Conclusion prompt
      description: >-
        The final user message of the call `onMaxSteps: conclude` makes. Only legal
        with `conclude`.
      type: string
      contentMediaType: text/markdown
      x-telo-widget: code
      default: >-
        You have reached the limit of steps for this run and can call no more tools.
        Using only what you have learned so far, write your final answer now: say what
        is done, what is not done, and what the next step would be.
    onToolError:
      title: On tool error
      description: >-
        feedback → emit a tool-result with error:true and continue, while the tools
        running beside it finish; throw → raise the first tool error, cancelling the
        tools still running and rejecting the iteration. Parts already emitted still
        reach the consumer, and an encoder frames the rejection for the wire. A cancelled turn and
        a durable suspension are not tool errors and always propagate.
      type: string
      enum: [feedback, throw]
      default: feedback
    maxToolResultBytes:
      title: Max tool result bytes
      description: >-
        Bounds the UTF-8 bytes of text each tool result feeds the model, error results
        included. A longer result keeps its longest whole-character prefix and ends with
        a line saying how many bytes were cut; media parts are neither counted nor cut,
        and the result record's output stays whole. Unset: unbounded.
      type: integer
      minimum: 1
      x-telo-eval: compile
    maxParallelTools:
      title: Max parallel tools
      description: >-
        How many of the tool calls of one model response run at once. Calls start in
        the order the model asked for them, and the model is given their results in
        that order whatever order they complete in. `1` runs one call at a time, in
        call order — for tools that depend on each other's side effects within one
        response.
      type: integer
      minimum: 1
      default: 4
      x-telo-eval: compile
    toolProviders:
      title: Tool providers
      description: Tool sources mounted into the agent — static lists (Ai.Tools) or runtime discovery (e.g. AiMcp.ToolProvider).
      type: array
      items:
        type: object
        properties:
          provider:
            title: Provider
            description: Reference to any Ai.ToolProvider implementation.
            x-telo-ref:
              kind: Self.ToolProvider
              # listTools/callTool are convention methods on a held provider,
              # not bound entry points (invoke/provide/run) — the tool ITSELF
              # is dispatched (Ai.Tools' tool slot carries the call edge).
              use: dependency
          prefix:
            title: Prefix
            description: Namespaces this provider's tool names to avoid collisions.
            type: string
          include:
            title: Include
            description: Optional allowlist matched against the provider's bare tool names (before any prefix is applied).
            type: array
            items: { type: string }
          exclude:
            title: Exclude
            description: Optional denylist matched against the provider's bare tool names (before any prefix is applied).
            type: array
            items: { type: string }
          approval:
            title: Approval
            description: >-
              Which of this entry's tools need a decision before a call to them runs,
              by bare tool name (before any prefix), over the tools the entry exposes
              after its own `include` / `exclude`. `{}` gates every one; `include`
              gates exactly the names it lists; `exclude` takes names out of the gated
              set. A tool's own provider may gate a call as well; neither ungates what
              the other gates.
            type: object
            additionalProperties: false
            properties:
              include:
                title: Include
                description: >-
                  The tools that need a decision. Each must be a tool this entry
                  exposes. An empty list gates none.
                type: array
                items: { type: string }
              exclude:
                title: Exclude
                description: >-
                  Tools that need no decision — the form to use when the provider's
                  tool list may grow, since a tool added later is then gated. A name
                  the entry does not expose is ignored.
                type: array
                items: { type: string }
        required: [provider]
        additionalProperties: false
    approver:
      title: Approver
      description: >-
        What decides a tool call that needs a decision, in place of the caller: it is
        asked once per such call and answers approve (the tool runs), reject (the
        model is told the call was denied) or defer (the run ends asking its caller).
        A decision the caller supplied in `approvals` is never put to it. A failed
        ask fails the run whatever `onToolError` says.
      type: object
      additionalProperties: false
      required: [invoke, inputs, result]
      properties:
        invoke:
          title: Invoke
          description: The resource asked for each decision — a reference or an inline declaration.
          x-telo-ref:
            kind: Telo.Executable
            use: call
            # The sibling map holding this call's arguments, typed by the
            # target's declared inputType.
            inputs: /inputs
        inputs:
          title: Inputs mapping
          description: >-
            CEL mapping into the approver's input from the call being judged:
            `toolCall` (`id`, `name` as the model saw it, `arguments`) and `tool`
            (`name`, `description`, `parameters`).
          type: object
          additionalProperties: true
          x-telo-context:
            type: object
            additionalProperties: false
            properties:
              toolCall:
                type: object
                additionalProperties: false
                properties:
                  id: { type: string }
                  name: { type: string }
                  arguments: { type: object, additionalProperties: true }
              tool:
                type: object
                additionalProperties: false
                properties:
                  name: { type: string }
                  description: { type: string }
                  parameters: { type: object, additionalProperties: true }
        result:
          title: Result mapping
          description: >-
            CEL mapping from the approver's `result` to the decision: `decision` is
            `approve`, `reject` or `defer`; `reason` is told to the model on a reject
            and reported with the decision.
          type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision:
              type: string
              enum: [approve, reject, defer]
            reason:
              type: string
          x-telo-context:
            type: object
            additionalProperties: false
            properties:
              result:
                x-telo-context-ref-from: "invoke/outputType"
  required: [model]
  additionalProperties: false
  x-telo-resource-rules:
    - condition: !cel "!has(self.conclusionPrompt) || (has(self.onMaxSteps) && self.onMaxSteps == 'conclude')"
      code: AI_CONCLUSION_PROMPT_UNUSED
      message: >-
        sets `conclusionPrompt` without `onMaxSteps: conclude`; the prompt is sent only
        by the concluding call, so it would never be used.
    - in: /toolProviders
      condition: !cel >-
        !has(this.approval) || !has(this.approval.include) ||
        this.approval.include.all(n,
        (!has(this.include) || n in this.include) && (!has(this.exclude) || !(n in this.exclude)))
      code: AI_APPROVAL_NAME_FILTERED
      message: >-
        lists a tool in `approval.include` that its own `include` / `exclude` removes;
        the entry never exposes that tool, so the name gates nothing.
  examples:
    - model: !ref Gpt4oMini
      system: |
        You author Telo manifests. Use the tools to edit files and validate with
        `telo check`. Keep replies brief.
      maxSteps: 12
      toolProviders:
        - provider: !ref WorkspaceTools
---
# The result of an image generation, declared once and referenced by BOTH
# Ai.ImageModel's outputType and Ai.Image's, so the provider contract and the
# operation's cannot drift apart. The request shapes are deliberately not shared:
# `intent` and the merged `options` are configuration on the operation and per-call
# input on the model.
#
# `images` holds what was produced; `finishReason` says why there may be fewer than
# asked for. A refusal carries no bytes, so it is reported here rather than as a
# per-image reason — that would make `data` nullable and put a null guard on every
# happy path. All-filtered is an empty array; some-filtered is a short one.
kind: Telo.JsonSchema
metadata:
  name: ImageResult
  description: >-
    The images a generation produced, each with its bytes and media type, plus why
    the run ended, what it cost, and any text the model returned alongside. Fewer
    images than requested means the rest were refused.
schema:
  type: object
  required: [images, finishReason]
  additionalProperties: false
  properties:
    images:
      description: One entry per produced image, in provider order. Empty when every image was refused.
      type: array
      items:
        type: object
        required: [data, mediaType]
        additionalProperties: false
        properties:
          data:
            description: Encoded image bytes, ready to write, overlay, or send back to a model.
            x-telo-type: Telo.Bytes
          mediaType:
            description: MIME type of the encoded bytes (image/png, image/jpeg, image/webp).
            type: string
          width:
            description: Pixel width, when the provider reports it. Not derived from the bytes here — decode them if you need it guaranteed.
            type: integer
            minimum: 1
          height:
            description: Pixel height, when the provider reports it.
            type: integer
            minimum: 1
          details:
            description: Provider-specific extras for this image (seed, safety flags, …).
            type: object
            additionalProperties: true
    finishReason:
      description: >-
        Why the run ended. `content-filter` means some or all images were refused —
        compare the array length against what was requested to tell which.
      type: string
      enum: [stop, content-filter, error, other]
    usage:
      description: What the run cost, when the provider reports it at all. Omitted entirely when it does not.
      type: object
      required: [unit, total]
      additionalProperties: false
      properties:
        unit:
          description: What `total` counts — tokens, credits, seconds, images. Open vocabulary; providers name their own.
          type: string
        total:
          description: The quantity billed, in `unit`. The one number a spend aggregator can total across providers.
          type: number
          minimum: 0
        details:
          description: The provider's own breakdown (input/output token split, per-image cost, …).
          type: object
          additionalProperties: true
    text:
      description: Text the model returned alongside the images — a rewritten prompt, or commentary from a chat-native image model.
      type: string
---
# Ai.ImageModel — the abstract image generator every provider implements. Like
# Ai.Model it is a Telo.Provider: a configured handle (model id, API key, default
# options), not an operation you invoke directly.
#
# Unlike Ai.Model, its call shape is DECLARED here rather than being a documented
# convention, and the method is `invoke` — the kernel's bound entry point. That is
# what makes the contract enforceable: the kernel binds `invoke` at its single
# instance-production site and AJV-checks both directions at dispatch, so Ai.Image
# validates nothing by hand, `telo check` sees the shape, and a provider written in
# any language implements a manifest-declared contract instead of a TypeScript
# interface. Cancellation rides the InvokeContext passed as the second argument
# (the kernel forwards every argument through the bound entry point), never a
# `signal` inside the input — an AbortSignal is not declarable data.
#
# A provider narrows the reference-image modes it serves by declaring `$defs/Intent`
# in its own schema; Ai.Image derives its `intent` field from that, so an intent a
# backend cannot serve is a static error rather than a runtime one.
kind: Telo.Abstract
metadata:
  name: ImageModel
  description: >-
    A configured handle to an image model — credentials, model id and default options
    — that generation operations drive to turn a prompt, and optionally reference
    pictures, into image bytes.
capability: Telo.Provider
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      prompt:
        description: What to draw. Required unless the intent generates from the reference alone.
        type: string
      intent:
        description: >-
          What the reference images are for, resolved from the operation's config.
          Absent means plain text-to-image. Each provider declares the values it
          serves in its own `$defs/Intent`.
        type: string
      images:
        description: Reference images the intent operates on.
        type: array
        minItems: 1
        items:
          type: object
          required: [data, mediaType]
          additionalProperties: false
          properties:
            data:
              description: Encoded image bytes.
              x-telo-type: Telo.Bytes
            mediaType: { type: string }
      mask:
        description: Which region to repaint, as an image whose transparent area marks the target. Required under an inpainting intent.
        type: object
        required: [data, mediaType]
        additionalProperties: false
        properties:
          data:
            description: Encoded mask bytes.
            x-telo-type: Telo.Bytes
          mediaType: { type: string }
      options:
        description: Request options, already merged by the operation from its own and the caller's.
        type: object
        additionalProperties: true
outputType:
  kind: Telo.JsonSchema
  schema:
    $ref: "telo://Self/ImageResult"
---
# Ai.Image — the buffered generation operation, symmetric to Ai.Text. It merges
# options, forwards cancellation, and hands the call to the model; the kernel
# contract-checks what comes back, so there is no hand-rolled result validation here.
#
# `intent` is CONFIG, not a per-call input: its acceptable values come from the
# referenced provider's `$defs/Intent` (x-telo-schema-from), which is what turns an
# unsupported mode into a `telo check` error. The cost is that intent is fixed per
# resource — generating and editing with one model means two Ai.Image resources,
# which also reads better declaratively.
kind: Telo.Definition
metadata:
  name: Image
  description: >-
    Generates pictures from a prompt, or reworks pictures you supply, returning the
    encoded bytes with their media type plus why the run ended and what it cost.
    Refused images come back as a short list rather than an error.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/ai.mjs&local_path=./nodejs/src/index.ts#AiImageController
throws:
  codes:
    ERR_INVALID_INPUT:
      description: >-
        `prompt` is missing with no intent configured, or `images` / `mask` are
        supplied with no intent to say what they are for, or an intent is configured
        and no `images` were supplied. Mode-specific requirements — which intents
        need a mask, which can run without a prompt — are the provider's, and surface
        with the same code from there. A malformed `inputs` shape is the kernel's
        `ERR_INPUT_INVALID`, not this.
    ERR_INVALID_REFERENCE:
      description: >-
        The referenced `model` is not a live Ai.ImageModel instance — check that the
        resource exists and that its controller loaded.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      prompt:
        description: What to draw. Required unless the configured intent generates from the reference alone.
        type: string
      images:
        description: Reference images the configured intent operates on. Only meaningful when `intent` is set.
        type: array
        minItems: 1
        items:
          type: object
          required: [data, mediaType]
          additionalProperties: false
          properties:
            data:
              description: Encoded image bytes.
              x-telo-type: Telo.Bytes
            mediaType: { type: string }
      mask:
        description: Which region to repaint, as an image whose transparent area marks the target. Required under an inpainting intent.
        type: object
        required: [data, mediaType]
        additionalProperties: false
        properties:
          data:
            description: Encoded mask bytes.
            x-telo-type: Telo.Bytes
          mediaType: { type: string }
      options:
        description: Per-call option overrides. Shallow-merged over this resource's `options`; the call wins.
        type: object
        additionalProperties: true
outputType:
  kind: Telo.JsonSchema
  schema:
    $ref: "telo://Self/ImageResult"
schema:
  type: object
  properties:
    model:
      title: Model
      description: Reference to any Ai.ImageModel implementation.
      x-telo-ref:
        kind: Self.ImageModel
        # invoke() is the kernel's bound entry point, dispatched and contract-checked
        # during this resource's own invocation — the Ai.Text treatment, not the
        # Embedding.Query one, whose embed() is a plain method on a held instance.
        use: call
    intent:
      title: Intent
      description: >-
        What the reference images passed to this resource are for. Omit for plain
        text-to-image. The accepted values come from the referenced model, so a mode
        it cannot serve fails `telo check`.
      # The base type is declared as well as derived: the derived schema is what
      # narrows the values, but stating `string` keeps the kernel's own config
      # validation and the editor's field rendering honest without either having to
      # resolve the sibling ref first.
      type: string
      x-telo-schema-from: "model/$defs/Intent"
    options:
      title: Options
      description: Request-level option defaults (size, quality, count, …). Per-call inputs.options wins.
      type: object
      additionalProperties: true
  required: [model]
  additionalProperties: false
  examples:
    - model: !ref Painter
      options:
        size: 1024x1024
        quality: low
    - model: !ref Painter
      intent: inpaint
---
# Ai.Buffered — a buffered model built out of a streaming one.
#
# It exists for a provider that only streams, and for third parties: without it,
# such a provider is unusable by `Ai.Text` and `Ai.Agent`, which is most of the
# calls anyone makes. Not for OpenAI, whose buffered kind sends a genuinely
# non-streaming request and is the better thing to use when the endpoint offers
# it — collecting a stream to hand back one answer pays a stream's latency for a
# buffer's result.
#
# Written as a MANIFEST rather than a controller, which is the point: the
# declared contract is what makes an adapter like this expressible at all. The
# fold is a `Run.Sequence` whose steps drive the streaming model and drain it.
kind: Telo.Definition
metadata:
  name: Buffered
  description: >-
    Presents a streaming model as a buffered one: it drives the stream, collects every
    part and folds them into a single completed answer with its usage and finish
    reason. For a provider that only streams, and for consumers that want one answer
    rather than a sequence.
capability: Telo.Invocable
extends: Self.Model
# What the streaming model throws is what this throws: the fold catches nothing.
throws:
  inherit: true
schema:
  type: object
  additionalProperties: false
  required: [model]
  properties:
    model:
      title: Model
      description: The streaming model to drive and collect.
      x-telo-ref:
        kind: Self.ModelStream
        use: [call, trigger.consumer]
resources:
  - kind: Run.Sequence
    # A literal name: the body's children live in this instance's own child
    # context, so it is unique there, and a literal is what lets
    # `validate-template-dispatch` check that `invoke:` names a sibling at all.
    metadata:
      name: fold
    steps:
      - name: start
        # The WHOLE input, passed through. Enumerating the fields here would be
        # a second copy of the contract that silently drops whatever the
        # abstract gains next — and it already dropped `tools`, which turned an
        # agent's first turn into a plain answer with nothing to report it.
        inputs: !cel "inputs"
        invoke: !cel "self.model"
      - name: parts
        inputs:
          input: !cel "steps.start.result.output"
        invoke:
          kind: Stream.Collect
      # One traversal per bucket, rather than recomputing the same
      # filter/map/join chain inside several output expressions.
      - name: buckets
        value:
          texts: !cel "steps.parts.result.items.filter(p, p.type == 'text-delta').map(p, p.delta)"
          reasoning: !cel "steps.parts.result.items.filter(p, p.type == 'reasoning-delta').map(p, p.delta)"
          finishes: !cel "steps.parts.result.items.filter(p, p.type == 'finish')"
          states: !cel "steps.parts.result.items.filter(p, p.type == 'provider-state')"
          contentParts: !cel "steps.parts.result.items.filter(p, p.type == 'content-part').map(p, p.part)"
          toolCalls: !cel "steps.parts.result.items.filter(p, p.type == 'tool-call').map(p, p.toolCall)"
      # `finish` is the only terminator and a failure rejects rather than
      # yielding, so exactly one exists by contract — but a provider that ends
      # without one would make `[0]` a raw CEL index error, so the count is
      # tested rather than assumed.
      - name: folded
        value:
          text: !cel "steps.buckets.result.texts.join('')"
          content: !cel >-
            (size(steps.buckets.result.texts) == 0 ? [] : [{'type': 'text', 'text': steps.buckets.result.texts.join('')}]) +
            (size(steps.buckets.result.reasoning) == 0 ? [] : [{'type': 'reasoning', 'text': steps.buckets.result.reasoning.join('')}]) +
            steps.buckets.result.contentParts
          usage: !cel >-
            size(steps.buckets.result.finishes) == 1 ? steps.buckets.result.finishes[0].usage :
            {'promptTokens': 0, 'completionTokens': 0, 'totalTokens': 0}
          finishReason: !cel >-
            size(steps.buckets.result.finishes) == 1 ? steps.buckets.result.finishes[0].finishReason : 'other'
          toolCalls: !cel "steps.buckets.result.toolCalls"
          providerState: !cel >-
            size(steps.buckets.result.states) == 0 ? null :
            steps.buckets.result.states[size(steps.buckets.result.states) - 1].providerState
    # The fold, in two pure steps: bucket the parts once each, then assemble.
    # Every part type the vocabulary carries is folded, not just text. Dropping
    # `provider-state` was the serious one — it is what lets reasoning survive a
    # tool loop, so an agent over a Buffered-wrapped provider lost the chain
    # silently, `providerState` being optional on the output.
    outputs: !cel "steps.folded.result"
invoke: !ref fold
inputs: !cel "inputs"
