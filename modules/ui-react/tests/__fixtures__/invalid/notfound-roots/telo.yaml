# A not-found node whose condition reads the query, a root only a page binds.
kind: Telo.Library
metadata:
  name: UiReactNotFoundRoots
  version: 1.0.0
  description: >-
    Test fixture exporting an application whose not-found node reads the query
    in its condition, though no query is in scope there.
imports: { UiReact: ../../../../, Ui: ../../../../../ui }
exports: { resources: [headed] }
---
kind: UiReact.App
metadata: { name: headed }
title: Headed
theme: !ref UiReact.defaultTheme
notFound:
  - type: text
    text: Missing
    shown:
      at: !cel "query.tab"
      matches: { const: one }
pages:
  - kind: Ui.Page
    path: /
    title: Home
    query: { tab: { type: string } }
    children:
      - { type: text, text: Home }
