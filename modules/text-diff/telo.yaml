kind: Telo.Library
metadata:
  name: TextDiff
  version: "0.3.1"
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Data]
  description: >-
    Compare two texts line by line, or apply a SEARCH/REPLACE patch to a text. A line
    diff returns the lines added and removed, grouped into hunks with context, as
    data. A patch applies its sections in order, each matching exactly once, and a
    refusal names the failing section. For reviewing generated text, showing what an
    edit changed, or applying model-written edits.
exports: { kinds: [LineDiff, ApplyPatch], resources: [lineDiff, applyPatch] }
---
kind: Telo.Definition
metadata:
  name: LineDiff
  description: >-
    Compares a before and an after text by lines and returns the counts of added
    and removed lines plus hunks: each a run of changes with its unchanged
    neighbours and its line ranges on both sides. A final line lacking a newline is
    marked. When either text exceeds the configured byte limit the result says it
    is not comparable and carries no counts or hunks.
capability: Telo.Callable
deterministic: true
params:
  - { name: before, schema: { type: string } }
  - { name: after, schema: { type: string } }
returns:
  schema:
    type: object
    additionalProperties: false
    required: [ comparable, added, removed, hunks ]
    properties:
      comparable:
        description: False when either text is over `maxInputBytes`; the other fields are then null.
        type: boolean
      added:
        description: Lines present in `after` and not in `before`.
        type: [ integer, "null" ]
        minimum: 0
      removed:
        description: Lines present in `before` and not in `after`.
        type: [ integer, "null" ]
        minimum: 0
      hunks:
        description: The changes in order, each with its context. Empty when the texts are equal.
        type: [ array, "null" ]
        items:
          type: object
          additionalProperties: false
          required: [ oldStart, oldLines, newStart, newLines, lines ]
          properties:
            oldStart:
              description: >-
                1-based number of the hunk's first line in `before`. When the hunk
                holds no line of `before`, the line it follows (0 at the start).
              type: integer
              minimum: 0
            oldLines:
              description: How many lines of `before` the hunk spans — its context and removed lines.
              type: integer
              minimum: 0
            newStart:
              description: >-
                1-based number of the hunk's first line in `after`. When the hunk
                holds no line of `after`, the line it follows (0 at the start).
              type: integer
              minimum: 0
            newLines:
              description: How many lines of `after` the hunk spans — its context and added lines.
              type: integer
              minimum: 0
            lines:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [ op, text ]
                properties:
                  op:
                    description: Whether the line is unchanged, only in `after`, or only in `before`.
                    type: string
                    enum: [ context, added, removed ]
                  text: { description: "The line, without its newline.", type: string }
                  noNewline:
                    description: Present, and true, on a text's final line when no newline ends it.
                    type: boolean
controllers: [pkg:telo/local/js?path=./nodejs/text-diff.mjs&local_path=./nodejs/src/index.ts#LineDiff]
schema:
  type: object
  additionalProperties: false
  properties:
    contextLines:
      title: Context lines
      description: Unchanged lines kept on each side of a change.
      type: integer
      minimum: 0
      default: 3
    maxInputBytes:
      title: Max input bytes
      description: >-
        The most UTF-8 bytes either text may hold. A call with a larger one returns
        `comparable: false` without comparing.
      type: integer
      minimum: 0
      default: 262144
  examples:
    - { contextLines: 3, maxInputBytes: 262144 }
---
kind: Self.LineDiff
metadata:
  name: lineDiff
  description: >-
    Line diff of two texts with three lines of context around each change, for
    texts of up to 256 KiB each; a larger one is reported as not comparable.
---
kind: Telo.Definition
metadata:
  name: ApplyPatch
  description: >-
    Applies SEARCH/REPLACE edit sections to a text: each section replaces the one
    exact match of its search text, in order. Returns the patched text, or why the
    patch was refused — the code, the failing section and, when a search matched
    more than once, the lines it matched. A patch that does not apply is a returned
    result, never an error, and no partial text is returned.
capability: Telo.Callable
deterministic: true
params:
  - { name: text, schema: { type: string } }
  - { name: patch, schema: { type: string } }
returns:
  schema:
    type: object
    additionalProperties: false
    required: [ applied, text, code, section, lines ]
    properties:
      applied:
        description: True when every section applied. The other fields are then null.
        type: boolean
      text:
        description: The patched text. Null when `applied` is false.
        type: [ string, "null" ]
      code:
        description: Why the patch was refused. Null when `applied` is true.
        type: [ string, "null" ]
        enum: [ EDIT_BLOCK_MALFORMED, EDIT_SECTION_ABSENT, EDIT_SECTION_AMBIGUOUS, null ]
      section:
        description: >-
          1-based number of the refused section. Null when the patch as a whole is
          malformed or over the limit, and when `applied` is true.
        type: [ integer, "null" ]
        minimum: 1
      lines:
        description: >-
          1-based line of every match of an ambiguous section, in the text the earlier
          sections left. Null otherwise.
        type: [ array, "null" ]
        items: { type: integer, minimum: 1 }
controllers: [pkg:telo/local/js?path=./nodejs/text-diff.mjs&local_path=./nodejs/src/index.ts#ApplyPatch]
schema:
  type: object
  additionalProperties: false
  properties:
    maxInputBytes:
      title: Max input bytes
      description: >-
        The most UTF-8 bytes the text and the patch each may hold. A larger one is
        refused as malformed without being applied.
      type: integer
      minimum: 0
      default: 262144
  examples:
    - { maxInputBytes: 262144 }
---
kind: Self.ApplyPatch
metadata:
  name: applyPatch
  description: >-
    Applies SEARCH/REPLACE edit sections to a text of up to 256 KiB, returning the
    patched text or the refusal with its code and failing section; a larger input
    is refused as malformed.
