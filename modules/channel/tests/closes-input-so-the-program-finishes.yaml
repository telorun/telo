kind: Telo.Application
metadata:
  name: ClosesInputSoTheProgramFinishesTest
  version: 1.0.0
  description: >-
    Closing the input side lets a program that is waiting for a line stop waiting
    and finish on its own, and its exit code is then the code it CHOSE rather than
    the one a shutdown imposed. That distinction is why closing input is an
    operation instead of a side effect of tearing the program down.
imports:
  App: ../../app
  Channel: ../
  Run: ../../run
  Timer: ../../timer
  Assert: ../../assert
targets:
  - !ref quiz
  - !ref test
---
kind: App.Instance
metadata: { name: quiz }
source: ./__fixtures__/quiz/telo.yaml
# It blocks on its first prompt, so its targets never all finish dispatching.
awaitStart: false
---
kind: Channel.ReadUntil
metadata: { name: read }
channel: !ref quiz
timeout: "10s"
---
kind: Channel.End
metadata: { name: endInput }
channel: !ref quiz
---
kind: Run.Loop
metadata: { name: awaitExit }
condition: !cel "resources.quiz.status.exitCode == null"
maxIterations: 200
steps:
  - name: wait
    invoke: { kind: Timer.Delay }
    inputs:
      duration: 20ms
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: firstPrompt
    invoke: !ref read
    inputs: { until: "Name: " }

  # No answer — the program is told there will not be one. It reads end of input,
  # takes the empty answers and runs to completion.
  - name: closeInput
    invoke: !ref endInput
  # Twice, because a caller that has said "no more input" should not have to
  # remember whether it already said it.
  - name: closeAgain
    invoke: !ref endInput

  - name: awaitExit
    invoke: !ref awaitExit
  - name: verifyCleanExit
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "resources.quiz.status.exitCode"
      expected: 0
