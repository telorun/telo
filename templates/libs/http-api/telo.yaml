kind: Telo.Library
metadata:
  name: HelloApiLibrary
  version: 1.0.0
  description: |
    A reusable `Telo.Library` that defines a single `HelloApi` (`Http.Api`) plus
    the `SayHello` handler it dispatches to. Importers receive `HelloApi` under
    their chosen alias and can mount it on any `Http.Server` — define the route
    once, mount it on as many paths/servers as you like.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.26.0#sha256-qCiZuU7_9wnxCn2QuA0oKM0H7OyvSd2aFcoXSv3vgFo
  Run: oci://ghcr.io/telorun/run@0.24.2#sha256-BFRCvbtbCRmj6SAu60wo_qbiQCJj1bGqKaKnhQwPJfw
exports:
  resources:
    - helloApi
---
kind: Http.Api
metadata:
  name: helloApi
routes:
  - request:
      path: /hello
      method: GET
      schema:
        query:
          type: object
          properties:
            name:
              type: string
          required: [ "name" ]
    handler: !ref sayHello
    inputs:
      name: !cel "request.query.name"
    returns:
      - status: 200
        content:
          application/json:
            schema:
              type: object
              properties:
                greeting: { type: string }
              required: [ greeting ]
              additionalProperties: false
            body:
              greeting: !cel "'Hello ' + result.message + '!'"
---
kind: Run.Value
metadata:
  name: sayHello
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      name: { type: string }
    required: [ "name" ]
    additionalProperties: false
value:
  message: !cel "inputs.name"
