  # Actions.
  - { text: A bare button, translation: Sam przycisk }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "Model wejścia bez właściwości rysuje sam przycisk. Ten odblokowuje każde zablokowane zadanie TEL-42, a liczniki zadań i tabela TEL-42 niżej odczytują się ponownie." }
  - { text: Unblock TEL-42, translation: Odblokuj TEL-42 }
  - { text: An answer drawn from the result, translation: Odpowiedź narysowana z wyniku }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "Trasa sumuje szacunki otwartych zadań projektu. Pola pochodzą z modelu wejścia, w dwóch sekcjach; projekt wybiera się z kolekcji projektów, a tempo na suwaku, a to, co wpisano, jest zachowane w adresie. Odpowiedź jest rysowana pod przyciskiem: zdania z wyniku i wysłanego rekordu, data, do której praca byłaby gotowa, i lista godzin według etykiet." }
  - { text: What to count, translation: Co liczyć }
  - { text: How fast, translation: Jak szybko }
  - { text: Estimate, context: verb, translation: Oszacuj }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} nie ma otwartej pracy."
        one: "{$hours} godz. w {$tasks} otwartym zadaniu projektu {$project}"
        few: "{$hours} godz. w {$tasks} otwartych zadaniach projektu {$project}"
        many: "{$hours} godz. w {$tasks} otwartych zadaniach projektu {$project}"
        other: "{$hours} godz. w {$tasks} otwartego zadania projektu {$project}"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation:
      plural: weeks
      cases:
        one: "Około {$weeks} tygodnia przy {$pace} godz. tygodniowo, gotowe do"
        few: "Około {$weeks} tygodni przy {$pace} godz. tygodniowo, gotowe do"
        many: "Około {$weeks} tygodni przy {$pace} godz. tygodniowo, gotowe do"
        other: "Około {$weeks} tygodnia przy {$pace} godz. tygodniowo, gotowe do"
  - { text: By label, translation: Według etykiet }
  - { text: When it fails, translation: Gdy się nie uda }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "Własne drzewo błędu akcji, rysowane z błędu i wysłanego rekordu. Przypisz zadanie 4 do james@northwind.example, a się uda. Pomiń e-mail albo podaj kogoś spoza zespołu, a odmowa trafi na pole; zadanie 999 daje 404, a tomas@northwind.example, który odszedł, 409." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "Ta akcja czyta odpowiedź trasy szacunku jako liczbę dni, której trasa nie podaje: model wyjścia akcji odrzuca odpowiedź, a jej drzewo błędu o tym mówi." }
  - { text: Estimate in days, translation: Oszacuj w dniach }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: to nie jest odpowiedź, którą czyta ten przycisk." }
  - { text: Where a success goes, translation: Dokąd prowadzi sukces }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "Pierwsza odpowiada stroną z zadaniami projektu, a aplikacja tam przechodzi. Druga odpowiada stroną domową zespołu, adresem https, który zastępuje stronę." }
  - { text: Open its tasks, translation: Otwórz jego zadania }
  - { text: Visit the homepage, translation: Odwiedź stronę domową }
  - { text: Reading again after a success, translation: Ponowny odczyt po sukcesie }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "Przeniesienie zadania odczytuje ponownie i liczniki poniżej — czytnik — i tabelę TEL-42 niżej. Odpowiedź podaje zadanie i jego nowy status." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: do zrobienia {$todo}, w toku {$doing}, w przeglądzie {$review}, zakończone {$done}, zablokowane {$blocked}." }
  - { text: Move, translation: Przenieś }
  - { text: "Task {$id}, {$title}, is now", translation: "Zadanie {$id}, {$title}, ma teraz status" }
  - { text: One press after another, translation: Jedno naciśnięcie po drugim }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "Komentarze są wysyłane jeden po drugim, w kolejności naciśnięć przycisku, choćby najszybszych. Przycisk czeka na trzy znaki i mówi dlaczego; wybór innego zadania czyści ostatnią odpowiedź. Komentarze wymienione na dole odczytują się ponownie po każdym." }
  - { text: Add the comment, translation: Dodaj komentarz }
  - { text: Write three characters or more., translation: Napisz co najmniej trzy znaki. }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        one: "Komentarz {$id} jest pierwszy przy zadaniu {$title}."
        few: "Dodano komentarz {$id} do zadania {$title}, które ma teraz {$count} komentarze."
        many: "Dodano komentarz {$id} do zadania {$title}, które ma teraz {$count} komentarzy."
        other: "Dodano komentarz {$id} do zadania {$title}, które ma teraz {$count} komentarza."
  - { text: Row actions on a table, translation: Akcje wierszy w tabeli }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "Każde zadanie TEL-42 ma trzy przyciski, a każdy po naciśnięciu zastępuje jego odpowiedź. Rozpocznij działa od razu, tylko dla zadania do zrobienia. Zamknij najpierw pyta i nie jest dostępne dla zakończonego zadania. Przypisz otwiera okno na e-mail, którego wiersz nie podaje, i pokazuje odmowę serwera przy jego polu." }
  - { text: Number, translation: Numer }
  - { text: Start, context: verb, translation: Rozpocznij }
  - { text: Closed, translation: Zamknięto }
  - { text: Close this task?, translation: Zamknąć to zadanie? }
  - { text: Already started., translation: Już rozpoczęte. }
  - { text: Already finished., translation: Już zakończone. }
  - { text: Assign, translation: Przypisz }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} przypisano osobie {$assignee}." }
  - { text: "Task {$id} is unchanged.", translation: "Zadanie {$id} się nie zmieniło." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: Akcje wierszy na liście }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "Ostatnie komentarze, lista rysowana przez czytnik, przypięte najpierw. Przypnij działa od razu dla nieprzypiętego komentarza, Usuń najpierw pyta, a Edytuj prosi o nową treść w oknie; pozostawienie jej pustej jest odrzucane przy jej polu. Lista odczytuje się ponownie po każdej akcji." }
  - { text: Latest comments, translation: Ostatnie komentarze }
  - { text: Pin, translation: Przypnij }
  - { text: Already pinned., translation: Już przypięty. }
  - { text: Delete this comment?, translation: Usunąć ten komentarz? }
  - { text: Rewrite this comment?, translation: Przepisać ten komentarz? }
  - { text: More places a success goes, translation: "Inne miejsca, dokąd prowadzi sukces" }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "Pierwsza dodaje zadanie i przechodzi na stronę tabel, pod adres zapisany w manifeście. Druga odpowiada adresem podręcznika, pliku serwowanego przez serwer pod adresem aplikacji, który ładuje się zwyczajnie. Trzecia odpowiada adresem kopii zespołu, który przeglądarka czyta jako inny host: nie prowadzi nigdzie, a odpowiedź o tym mówi." }
  - { text: Add it and open the tables, translation: Dodaj i otwórz tabele }
  - { text: Open the handbook, translation: Otwórz podręcznik }
  - { text: Open the mirror, translation: Otwórz kopię }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "Odpowiedzią był adres {$mirror}, pod który nie można przejść, więc strona zostaje." }
  - { text: "Refused, and unanswered", translation: "Odmowa i brak odpowiedzi" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "Wstrzymać projekt może tylko kierownik. Bez sesji strażnik odpowiada 401. Po zalogowaniu na stronie danych jako james@northwind.example, który nie jest kierownikiem, trasa odpowiada 403 bez treści; po zalogowaniu jako ada@northwind.example wstrzymuje projekt, a projektu, który nie jest w toku, odmawia w języku strony. Domyślne drzewo błędu akcji rysuje każdą odmowę." }
  - { text: Pause the project, translation: Wstrzymaj projekt }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "Projekt {$code} nie jest w toku, więc nie można go wstrzymać." }
  - { text: "{$name} is paused.", translation: "Projekt {$name} jest wstrzymany." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "Ta trasa odsyła każde żądanie do siebie, więc przeglądarka się poddaje i nie nadchodzi żadna odpowiedź. Drzewo błędu o tym mówi: błąd nie ma statusu." }
  - { text: Call a route that never answers, translation: "Wywołaj trasę, która nigdy nie odpowiada" }
  - { text: "The route answered, with the status", translation: "Trasa odpowiedziała, ze statusem" }
  - { text: "No answer arrived, so there is no status.", translation: "Nie nadeszła żadna odpowiedź, więc nie ma statusu." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: Akcje wierszy czytające adres }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "Tabela wymienia zadania projektu wskazanego w adresie, a Przenieś przenosi zadanie do statusu wskazanego w adresie, odczytanego z zapytania tabeli w chwili naciśnięcia. Wiersz i adres wiążą każde pole przeniesienia, więc jego okno o nic nie pyta i jest zwykłym potwierdzeniem. Wybierz projekt i status:" }
  - { text: TEL-42 into review, translation: TEL-42 do przeglądu }
  - { text: APP-5 to finished, translation: APP-5 do zakończonych }
  - { text: OPS-7 back to in progress, translation: OPS-7 z powrotem do pracy }
  - { text: Neither, translation: Żadne }
  - { text: Moved to, translation: Przeniesiono do }
  - { text: Move this task to the status the address names?, translation: Przenieść to zadanie do statusu wskazanego w adresie? }
  - { text: Choose a status above first., translation: Najpierw wybierz status powyżej. }

  # Components.
  - { text: A component on the page, translation: Komponent na stronie }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "Komponent napisany w TSX i dostarczany przez bibliotekę tego przykładu, umieszczony ze stałymi właściwościami. Używa wszystkiego, co daje mu gospodarz: pokazuje, gdzie jest strona, trzyma w adresie, który panel jest otwarty, przechodzi na inną stronę przez navigate i przez odnośnik z href, a adres https zostaje mu odrzucony. Odczytuje stan TEL-42 i dodaje zadanie przez fetch, ogłasza zmianę zadań przez notifyChanged — więc tabela poniżej odczytuje się ponownie — i liczy każdą zmianę, o której usłyszy przez onChanged, łącznie z edycjami i usunięciami w samej tabeli. Dodane zadanie ogłasza we własnej warstwie w rogu strony." }
  - { text: A component in a cell, translation: Komponent w komórce }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "Kolumnę priorytetu rysuje komponent, który dostaje priorytet każdego wiersza i to, czy zadanie jest zablokowane. Tabela wymienia zadania TEL-42 z tej samej kolekcji, do której pisze komponent, więc odczytuje się ponownie, gdy powyżej doda się zadanie; jej edycje i usunięcia słyszy komponent." }
  - { text: Its stylesheet, translation: Jego arkusz stylów }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "Źródła komponentów importują własny arkusz stylów, który aplikacja umieszcza w warstwie telo.component: po motywie i marce, przed własnym arkuszem aplikacji. Każda wartość w nim czyta token projektu, więc panel i miernik przyjmują wygląd każdego punktu montowania." }

  # CRUD.
  - { text: A generated admin screen, translation: Wygenerowany ekran administracyjny }
  - { text: "One declaration over the tasks model the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the model, so the screen offers exactly what the API accepts.", translation: "Jedna deklaracja nad modelem zadań, z którego serwowane jest API: pasek filtrów, sortowana tabela ze stronami, formularz dodawania zadania i formularz jego zmiany oraz potwierdzane usuwanie w każdym wierszu. Kolumny, pola i filtry wynikają z modelu, więc ekran oferuje dokładnie to, co przyjmuje API." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "Pasek stoi obok tabeli przy końcowej krawędzi i pokazuje tylko wybrane filtry, każdy jako żeton otwierający swoją kontrolkę. Swój wybór trzyma w tej przeglądarce pod kluczem aside — kluczem paska obok tabeli na stronie filtrów, więc filtr wybrany na jednej stronie jest wybrany na obu." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "Nowe zadanie otwiera się w szufladzie od końcowej krawędzi i zostaje otwarte, wyczyszczone, dla następnego. Zadanie zmienia się w panelu obok listy, który jest częścią adresu, a opuszczenie go z niezapisanymi danymi najpierw pyta." }

  # Themes.
  - { text: Four mounts of one design, translation: Cztery punkty montowania jednego projektu }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "Te same strony są serwowane cztery razy, a każda aplikacja nazywa własny motyw, markę i nawigację. Strony to jeden zestaw widoków umieszczanych przez odwołanie we wszystkich czterech, więc różnią się tylko wygląd i nawigacja." }
  - { text: At the root, translation: W katalogu głównym }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "Wbudowany wygląd, nad nim własny arkusz stylów tego przykładu i marka wybierana przy każdym żądaniu: zestaw tokenów Acme, gdy prosi o niego ciasteczko, a w przeciwnym razie wartości samego motywu." }
  - { text: Under /radix, translation: Pod /radix }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Motyw Radix: jego arkusz stylów i trzynaście kontrolek — listy wyboru, okna, szuflady, dymki, menu i podpowiedzi — z marką pozostawioną motywowi." }
  - { text: Under /brand, translation: Pod /brand }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "Własny motyw tego przykładu: kontrolki Radix pod napisanym tu arkuszem stylów, z własnymi wartościami tokenów. Marka aplikacji to jeden zestaw tokenów, który dostarcza krój Inter nazwany przez motyw." }
  - { text: Under /sidebar, translation: Pod /sidebar }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "Wbudowany wygląd z nawigacją w pasku bocznym obok strony, który zwija się do wąskiej szyny i pamięta otwarte grupy. Na telefonie staje się paskiem kart przy dolnej krawędzi." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "Odnośnik rozwiązuje się pod punktem montowania, w którym go narysowano, więc odnośniki między punktami montowania i przełącznik marki są na stronie motywów aplikacji głównej." }
  - { text: Every design token, translation: Każdy token projektu }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "Każdy token zamkniętego zestawu tak, jak nadają mu wartość motyw i marka tej strony, odczytany z właściwości CSS, do której rzutuje go renderer, z próbką narysowaną w nim. Otwórz inny punkt montowania albo przełącz markę w aplikacji głównej, a wartości się zmienią." }
  - { text: Typefaces, translation: Kroje pisma }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "Kroje tekstu i nagłówków w każdym z czterech odmian oraz, dla każdej odmiany, czy serwuje ją ta aplikacja. Pod /brand to zwykła, pogrubiona, kursywa i pogrubiona kursywa kroju Inter, dostarczane z przykładem i serwowane ze stroną; dwa pozostałe punkty montowania nie serwują żadnej i rysują czcionkami przeglądarki." }
  - { text: Switch the mount or the brand, translation: Przełącz punkt montowania lub markę }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "Te odnośniki należą do tej aplikacji: odnośnik rozwiązuje się pod punktem montowania, w którym go narysowano, więc tylko aplikacja główna sięga do dwóch pozostałych. Każdy to zwykłe załadowanie innej aplikacji." }
  - { text: Open the Radix mount, translation: Otwórz punkt montowania Radix }
  - { text: Open the brand mount, translation: Otwórz punkt montowania marki }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "Marka tej aplikacji jest wybierana przy każdym żądaniu. Przełącznik ustawia lub usuwa ciasteczko i wraca tutaj, a dopóki ciasteczko jest, zamiast wartości motywu używany jest zestaw tokenów Acme." }
  - { text: Use the Acme brand, translation: Użyj marki Acme }
  - { text: "Use the theme's own values", translation: "Użyj wartości motywu" }

