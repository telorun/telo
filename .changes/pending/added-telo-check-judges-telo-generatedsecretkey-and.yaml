units:
  analyzer: Added
body: "`telo check` judges `Telo.GeneratedSecretKey` and `Telo.GeneratedPassword` needs:
  a password whose character sets hold a character twice or whose minimums exceed its
  length is `NEED_PARAMETERS_INVALID`, and a literal key or password its need's
  parameters refuse — a field-by-field supply, or a fulfilment handed over whole — is
  `NEED_VALUE_INVALID`. A need forwarded whole, at an import or to a child application,
  must now state every parameter of the need it supplies with an equal value for every
  type but `Telo.DurableDirectory` (`NEED_FORWARD_INCOMPATIBLE`, naming both parameter
  sets) — a forward with differing parameters that passed before is now refused."
