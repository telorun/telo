project: collection
kind: Added
body: 'Collection.Fold — accumulate a collection into one value with author-defined
  state. An `accumulate:` CEL step produces the next accumulator once per element
  over `initial:`, `while:` optionally stops the run early (checked BEFORE each element,
  so a fold that stops once a balance is exhausted never consumes the element that
  would overdraw it), and `value:` projects the finished state (write `!cel "acc"` when the accumulator
  already is the result). This is the general form of Summarize, whose aggregator vocabulary
  is fixed: a running balance, a greedy allocation across records, a dedupe that remembers,
  or a state machine over an event list all depend on what earlier elements produced,
  which sum/avg/min/max/size cannot express. `initial:` / `accumulate:` / `value:`
  are unconstrained value slots, so a scalar accumulator is as expressible as a record
  one. Two independent optional contracts: `accType:` types `acc` inside while/accumulate/value
  and holds BOTH the seed and the step to that shape at analysis time, and `outputType:`
  types the result for callers and is checked against `value:`. Iterations are bounded
  by the collection''s length and `while:` can only shorten the run. The result is
  returned bare rather than under a named key, unlike the sibling kinds — their result
  shapes are fixed, a fold''s is the author''s.'
