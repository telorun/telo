# A computed argument this application's check cannot judge, which the first of two readers' types refuses:
# the contract the kernel binds refuses the call when it is dispatched.
kind: Telo.Application
metadata:
  name: ValueSchemaOwnDefsComputedRefusedFirst
  version: 1.0.0
imports:
  Kinds: ./kinds
  Run: ../../../../modules/run
targets:
  - !ref calls
---
kind: Run.Sequence
metadata:
  name: calls
steps:
  - name: call
    invoke: !ref Kinds.bothCaller
    inputs:
      context:
        label: !cel "dyn(7)"
        count: 7
