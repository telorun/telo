kind: Telo.Application
metadata:
  name: DurableScheduledValues
  version: 1.0.0
  description: |
    A SCHEDULED run starts with the inputs it was scheduled with, as the values they were.

    A scheduled start has no caller at the moment it runs, so the run record stores its
    inputs and the resumer starts the body from them. Stored as plain JSON, a timestamp
    came back as text and a 64-bit int as a double — so the body failed only once it was
    resumed (`no such overload: dyn<string> + google.protobuf.Duration`), while the same
    body started directly completed. Each value is asserted through an operation nothing
    of the wrong type satisfies.

    The resumer is `with:`-scoped, so the kernel hold it takes ends with the sequence.
imports:
  Local: ../
  Journal: ../../durable-journal-file
  Run: ../../run
  Assert: ../../assert
variables:
  journalDir:
    env: DURABLE_SCHEDULED_VALUES_TEST_DIR
    type: string
    x-telo-type: Telo.HostPath
    default: .telo/durable-scheduled-values-test
targets:
  - !ref test
---
kind: Journal.Journal
metadata: { name: journal }
directory: !cel "variables.journalDir"
---
kind: Local.Workflow
metadata: { name: later }
journal: !ref journal
inputs:
  at: !cel "inputs.at"
  big: !cel "inputs.big"
steps:
  - name: check
    value:
      shifted: !cel "inputs.at + duration('1h') == timestamp('2026-01-15T10:30:00Z')"
      intExact: !cel "inputs.big == 9007199254740993"
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: Local.Resumer
    metadata: { name: resumer }
    workflow: !ref later
    interval: 100ms
targets:
  - !ref resumer
steps:
  - name: ticket
    value: !cel "'s' + string(nowMillis())"
  - name: scheduled
    invoke:
      kind: Local.Schedule
      workflow: !ref later
      runId: !cel "'scheduled:' + inputs.ticket"
      after: 1ms
      inputs:
        at: !cel "timestamp('2026-01-15T09:30:00Z')"
        big: !cel "9007199254740993"
    inputs:
      ticket: !cel "steps.ticket.result"
  - name: finished
    invoke:
      kind: Local.Result
      journal: !ref journal
      wait: 15s
    inputs:
      run: !cel "steps.scheduled.result.runId"
  - name: assertStarted
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.finished.result.status"
        check: !cel "steps.finished.result.result.steps.check.result"
      expected:
        status: completed
        check:
          shifted: true
          intExact: true
