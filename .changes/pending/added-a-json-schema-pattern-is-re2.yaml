units:
  sdk: Added
body: "A JSON Schema pattern is RE2: `schemaPattern` is the one seam every validator
  reads a schema's `pattern`, `patternProperties` keys and `format: regex` through — an
  unanchored RE2 search, the `u` flag accepted, any other flag refused, a refusal worded
  `invalid RE2 pattern \"<pattern>\": <kind>` carrying where the schema holds it — and
  `SCHEMA_REGEX_FORMAT` is `format: regex` as its verdict. Breaking: a pattern RE2
  cannot read (lookaround, a backreference, an ECMAScript-only escape) is refused, and
  `.`, `\\s`, `\\S` and `\\p{…}` match as RE2 matches them. `opaqueSchemaView` presents
  bytes, an instant, a duration and a host's typed value to a schema as an object with
  no members, equal to an equal value."
