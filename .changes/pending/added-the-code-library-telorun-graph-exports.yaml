modules:
  modules/graph: Added
body: "The code library @telorun/graph exports what a module adding a listing operation
  over a Graph.Store needs, so it pages through the graph's own cursor instead of
  building one - GraphListing (binds a cursor to the listing's subject, yields the page
  for the store, and raises GRAPH_CURSOR_INVALID), boundName and declaredName, quoteKey,
  and assertNodeListed and assertRelationshipListed, the creation twins of
  GRAPH_TYPE_NOT_IN_STORE - and what a backend reads its inputs and writes its tail
  with: filterOperands, every comparison a where holds as operator, property and value
  with an unknown operator refused, and encodeKeyTail and decodeKeyTail, the key values
  of a listing's last item as tail text. A tail carries each key in the value domain's
  own one-to-one encoding, so a listing resumes after any key an operation returns; text
  that is not such a tail, of another arity or of an encoding generation the runtime
  does not read yields no value, and a key outside the value domain is refused with
  ERR_TYPED_FRAME_UNENCODABLE. The envelope's encoding, version and digest stay private.
  No operation, kind or cursor changes."
