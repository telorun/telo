modules:
  modules/durable: Added
body: '`Durable.Sleep.for` and `Durable.Await.timeout`, and the `timeout` an await call
  takes as an input, are durations: `30d`, `1w`, `1h30m` and `250ms` are read, an
  integer is milliseconds, and a malformed literal is refused by `telo check`. A
  computed value must now be a duration (`!cel "duration(inputs.delay)"`), not a string,
  and a negative one is refused when the sleep or await runs, so a manifest passing a
  computed string must change. Text with a space before the unit (`5 m`) or around the
  value is now refused. Requires telo >=0.130.0.'
