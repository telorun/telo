kind: Telo.Application
metadata:
  name: RecordStreamJournalSmoke
  version: 1.0.0
  description: |
    The journal's shared behaviour suite over the in-memory store: replay, tail,
    finish and failure; a reader waiting for a key not yet written; removal and its
    outcomes; a second writer refused; a paused writer kept live by its heartbeat;
    expiry; removal between two pages; and typed values surviving the round trip.
imports:
  Suite:
    source: ./__fixtures__/journal-suite
    resources: { store: !ref store }
  RecordStream: ../
targets:
  - !ref Suite.expiry
  - !ref Suite.markerRetention
  - !ref Suite.roundTrip
  - !ref Suite.typedValues
  - !ref Suite.failedReplaysCode
  - !ref Suite.unknownKeyWaits
  - !ref Suite.removal
  - !ref Suite.secondWriterBusy
  - !ref Suite.pausedWriterStaysLive
  - !ref Suite.removedAcrossPages
  - !ref Suite.cancelledRead
  - !ref Suite.resumeContinuesFailed
  - !ref Suite.resumeKeyStates
  - !ref Suite.resumeLiveWriterBusy
  - !ref Suite.readSnapshot
  - !ref Suite.readStates
  - !ref Suite.claimAdopted
  - !ref Suite.claimOneDrain
  - !ref Suite.claimRefusals
  - !ref Suite.claimResumeTakesOver
  - !ref Suite.claimSameWriterEnded
  - !ref Suite.claimGoesStale
---
kind: RecordStream.MemoryJournalStore
metadata: { name: store }
