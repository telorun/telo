kind: Telo.Application
metadata:
  name: CustomKindLibraryStarterTest
  version: 1.0.0
  description: >-
    Runs an application that declares one resource of each kind the library
    defines, against a receiver that answers 200 only to the request each kind
    is supposed to send. A webhook must arrive with its standing header and the
    caller's payload; a pager alert must arrive as the full event envelope, with
    the library's configured source inside it.
imports:
  Run: oci://ghcr.io/telorun/run@0.32.1#sha256-kV5CLg3aUn7XH49UnwIQ1f1UmnA7s1XGvJyX67GfJN8
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  Http: oci://ghcr.io/telorun/http-server@0.44.0#sha256-nW6yftlrG4eHd0e511nB8ArmN04Y2DKEkwRy5BaSldI
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: Http.Api
    metadata: { name: receiver }
    routes:
      - request:
          path: /chat
          method: POST
          schema:
            body: { type: object, additionalProperties: true }
            headers: { type: object, properties: { x-team: { type: string } } }
        handler: { kind: Run.Value, value: {} }
        returns:
          - status: 200
            when: !cel "request.headers['x-team'] == 'billing' && request.body.text == 'disk almost full'"
            content: { application/json: { body: { ok: true } } }
          - { status: 400, content: { application/json: { body: { ok: false } } } }
      - request:
          path: /pager
          method: POST
          schema: { body: { type: object, additionalProperties: true } }
        handler: { kind: Run.Value, value: {} }
        returns:
          - status: 202
            when: !cel >-
              request.body.routing_key == 'key-123' && request.body.event_action == 'trigger' &&
              request.body.payload.summary == 'database is down' &&
              request.body.payload.severity == 'critical' && request.body.payload.source == 'billing'
            content: { application/json: { body: { status: success } } }
          - status: 400
            content: { application/json: { body: { status: invalid event } } }
  - kind: Http.Server
    metadata: { name: receiverServer }
    listen: { port: 8072 }
    mounts:
      - path: /
        mount: !ref receiver
  - kind: App.Instance
    metadata: { name: app }
    source: ./__fixtures__/alerting-app.yaml
    ports: { http: 8203 }
    variables: { receiverUrl: http://127.0.0.1:8072 }
targets:
  - !ref receiverServer
  - !ref app
steps:
  - name: chat
    invoke: { kind: HttpClient.Request, url: http://127.0.0.1:8203/chat, method: POST }
  - name: page
    invoke: { kind: HttpClient.Request, url: http://127.0.0.1:8203/page, method: POST }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        chat: !cel "steps.chat.result.body"
        page: !cel "steps.page.result.body"
      expected: { chat: { status: 200 }, page: { status: 202 } }
