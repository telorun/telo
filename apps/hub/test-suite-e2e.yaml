kind: Telo.Application
metadata:
  name: HubE2ESuite
  version: 1.0.0
  description: |
    End-to-end suite for the discovery hub. Run only through
    `pnpm run test:e2e:hub`, which stands up a fresh compose stack of its own,
    waits for the hub's first tracking pass over the seeded refs, runs this
    suite and then hub-web's, and tears the stack down; pointed at a
    long-running development stack it is unsupported. The `tests/e2e/` tests hit
    the hub at http://localhost:8040 and assert only on the seeded refs
    (`oci://ghcr.io/telorun/*`). The `tests/integration/` tests run the hub's own
    libraries in process against a PostgreSQL with pgvector, which the repo's
    integration suite does not have: the stack's own `db`, whose connection
    `pnpm run test:e2e:hub` supplies as DB_HOST, DB_PORT, DB_USER, DB_PASSWORD
    and DB_NAME from its own stack, never a developer's database — in a
    database of their own rather than the live hub's. Kept separate from the in-process suite (`test-suite.yaml` at the repo
    root), which has no Postgres or S3 backend and therefore can't exercise these
    routes.
variables:
  include:
    type: array
    items: { type: string }
    arg: include
    description: Glob pattern selecting the test manifests to run, relative to this file.
    default:
    - "tests/e2e/*.yaml"
    - "tests/integration/*.yaml"
  exclude:
    type: array
    items: { type: string }
    arg: exclude
    description: Glob pattern excluding test manifests, relative to this file.
    default:
    - "**/__fixtures__/**"
  filter:
    type: string
    arg: { position: 0 }
    description: Run only the tests whose path contains this text.
    default: ""
  concurrency:
    type: integer
    minimum: 1
    arg: concurrency
    description: How many tests run at once.
    default: 3
imports:
  Test: oci://ghcr.io/telorun/test@0.12.1#sha256-LoRRakT2KUhuzX6lYbeV538caqd05AjutR7JDUpTwHY
targets:
  - !ref runAll
---
kind: Test.Suite
metadata:
  name: runAll
include: !cel "variables.include"
exclude: !cel "variables.exclude"
filter: !cel "variables.filter"
concurrency: !cel "variables.concurrency"
