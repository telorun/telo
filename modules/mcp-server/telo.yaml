kind: Telo.Library
metadata:
  name: McpServer
  version: "0.19.0"
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Transport, AI]
  description: >-
    Exposes an application to AI clients over the Model Context Protocol: bundle
    existing resources as callable tools, readable resources and fetchable prompts,
    then serve them either over standard input and output for a locally spawned
    server, or over HTTP with optional per-session state.
requires:
  # Controllers return their effects from `init()` / `run()`; a runtime that does
  # not execute a returned chain allocates nothing and undoes nothing.
  telo: ">=0.82.0"
exports:
  kinds:
    - StdioServer
    - HttpEndpoint
    - Tools
    - Resources
    - Prompts
---
# Mcp.Tools — passive bundle of tool entries. A transport (StdioServer or
# HttpEndpoint) references one or more Mcp.Tools bundles via its `tools:` array
# and registers their entries with an MCP SDK Server at init.
kind: "Telo.Definition"
metadata:
  name: "Tools"
  description: >-
    A bundle of tools an MCP server advertises to clients: each entry names a tool,
    declares the arguments a model must supply, and points at the resource that runs
    when the tool is called.
capability: Telo.Type
controllers:
  - pkg:telo/local/js?path=./nodejs/mcp-server.mjs&local_path=./nodejs/src/index.ts#ToolsController
schema:
  type: "object"
  additionalProperties: false
  properties:
    entries:
      title: Entries
      description: Tool entries advertised to MCP clients.
      type: "array"
      x-telo-topology-role: entries
      items:
        title: Tool Entry
        description: Single MCP tool advertised via tools/list and dispatched via tools/call.
        type: "object"
        additionalProperties: false
        properties:
          name:
            title: Name
            description: Unique tool identifier; sent in tools/call requests.
            type: "string"
            minLength: 1
            x-telo-topology-role: matcher
          description:
            title: Description
            description: Human-readable summary surfaced to MCP clients.
            type: "string"
          argumentsSchema:
            title: Arguments Schema
            description: JSON Schema describing the tool's `arguments` object. Validated by the MCP SDK on every tools/call.
            type: "object"
          handler:
            title: Handler
            description: Resource that implements the tool's behaviour — Invocable or Runnable. Receives the result of `inputs:` and returns a value rendered by `result:`.
            x-telo-topology-role: handler
            # Accept either capability so dual-mode kinds like Run.Sequence fit.
            x-telo-ref:
              kind: Telo.Executable
              use: trigger.inbound
              inputs: /inputs
          inputs:
            title: Inputs
            description: CEL expressions mapping the MCP request scope onto the handler's input shape.
            type: "object"
            additionalProperties: true
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                request:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    arguments: { type: object, additionalProperties: true }
                    meta: { type: object, additionalProperties: true }
                    session:
                      type: object
                      additionalProperties: false
                      properties:
                        id: { type: string }
                        clientInfo: { type: object, additionalProperties: true }
                        capabilities: { type: object, additionalProperties: true }
          result:
            title: Result
            description: Full MCP CallToolResult envelope (`content`, optional `isError`, `structuredContent`, `_meta`). Rendered from the handler's output via CEL. `content` is required at the manifest level; the runtime check enforces that the CEL-expanded value is an array of content blocks.
            type: "object"
            additionalProperties: true
            required: [content]
            properties:
              content:
                title: Content
                description: Array of MCP content blocks rendered by CEL.
              isError: {}
              structuredContent: {}
              _meta: {}
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                request:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    arguments: { type: object, additionalProperties: true }
                result:
                  x-telo-context-ref-from: "handler/outputType"
                  type: object
                  additionalProperties: true
          catches:
            title: Catches
            description: Maps thrown InvokeError into JSON-RPC error responses. Distinct from `result.isError`, which is for soft tool failures rendered as content.
            type: "array"
            x-telo-outcome-list: catches
            x-telo-catches-for: handler
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                error:
                  type: object
                  additionalProperties: false
                  properties:
                    code: { type: string, x-telo-caught-member: code }
                    message: { type: string }
                    data: { type: object, additionalProperties: true, x-telo-caught-member: data }
                request:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    arguments: { type: object, additionalProperties: true }
            items:
              title: Catch Entry
              description: Conditional rendering rule for a thrown InvokeError.
              type: "object"
              additionalProperties: false
              properties:
                code:
                  title: Code
                  description: Telo error code matched by this entry. Omit alongside `when:` for catch-all.
                  type: "string"
                when:
                  title: When
                  description: CEL predicate selecting this entry. Sees `error` and `request`.
                  type: "boolean"
                error:
                  title: Error
                  description: JSON-RPC error envelope rendered for matching throws.
                  type: "object"
                  additionalProperties: false
                  properties:
                    code:
                      title: JSON-RPC Code
                      description: JSON-RPC error code (integer). Conventionally negative for application errors.
                      type: "integer"
                    message:
                      title: JSON-RPC Message
                      description: Error message surfaced to the MCP client.
                      type: "string"
                    data:
                      title: JSON-RPC Data
                      description: Optional structured error data.
                  required: ["code", "message"]
              required: ["error"]
        required: ["name", "argumentsSchema", "handler", "inputs", "result"]
  required: ["entries"]
  x-telo-resource-rules:
    - in: /entries
      condition: !cel "size(self.entries.filter(e, e.name == this.name)) == 1"
      code: MCP_TOOL_DUPLICATE
      message: >-
        declares a name another entry of this bundle already declares. A client calls a
        tool by its name, so each must name one entry.
---
# Mcp.Resources — passive bundle of resource entries, served by a transport
# through resources/list, resources/templates/list and resources/read.
kind: "Telo.Definition"
metadata:
  name: "Resources"
  description: >-
    A bundle of readable resources an MCP server advertises: each entry names a URI a
    client can list and read, and points at the resource that produces its contents.
capability: Telo.Type
controllers:
  - pkg:telo/local/js?path=./nodejs/mcp-server.mjs&local_path=./nodejs/src/index.ts#ResourcesController
schema:
  type: "object"
  additionalProperties: false
  properties:
    entries:
      title: Entries
      description: Resource entries advertised to MCP clients.
      type: "array"
      x-telo-topology-role: entries
      items:
        title: Resource Entry
        description: Single MCP resource advertised via resources/list and read via resources/read.
        type: "object"
        additionalProperties: false
        properties:
          uri:
            title: URI
            description: Concrete resource URI, listed by resources/list. Exactly one of `uri:` and `uriTemplate:` is declared.
            type: "string"
            minLength: 1
            x-telo-topology-role: matcher
          uriTemplate:
            title: URI Template
            description: RFC 6570 URI template, listed by resources/templates/list. A read whose URI matches it reaches the handler with the template's variables as `request.params`. Variables arrive as written in the URI, without percent-decoding.
            type: "string"
            # Every '{' closes and names a variable; twinned in the controller.
            pattern: "^([^{}]|\\{[^{}]+\\})+$"
          name:
            title: Name
            description: Human-readable resource label.
            type: "string"
          description:
            title: Description
            description: Summary surfaced to MCP clients.
            type: "string"
          mimeType:
            title: MIME Type
            description: Default Content-Type advertised for this resource.
            type: "string"
          handler:
            title: Handler
            description: Resource that produces contents on read — Invocable or Runnable.
            x-telo-topology-role: handler
            x-telo-ref:
              kind: Telo.Executable
              use: trigger.inbound
              inputs: /inputs
          inputs:
            title: Inputs
            description: CEL expressions mapping the MCP request scope onto the handler's input shape.
            type: "object"
            additionalProperties: true
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                request:
                  type: object
                  additionalProperties: false
                  properties:
                    uri: { type: string }
                    params: { type: object, additionalProperties: true }
                    meta: { type: object, additionalProperties: true }
                    session:
                      type: object
                      additionalProperties: false
                      properties:
                        id: { type: string }
                        clientInfo: { type: object, additionalProperties: true }
                        capabilities: { type: object, additionalProperties: true }
          result:
            title: Result
            description: MCP ReadResourceResult envelope (`contents`, optional `_meta`), rendered from the handler's output via CEL.
            type: "object"
            additionalProperties: true
            required: [contents]
            properties:
              contents:
                title: Contents
                description: Array of resource contents, each carrying `uri` and either `text` or `blob`. A bytes value at `blob` is sent as base64.
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                request:
                  type: object
                  additionalProperties: false
                  properties:
                    uri: { type: string }
                    params: { type: object, additionalProperties: true }
                result:
                  x-telo-context-ref-from: "handler/outputType"
                  type: object
                  additionalProperties: true
          catches:
            title: Catches
            description: Maps a thrown InvokeError to a JSON-RPC error response.
            type: "array"
            x-telo-outcome-list: catches
            x-telo-catches-for: handler
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                error:
                  type: object
                  additionalProperties: false
                  properties:
                    code: { type: string, x-telo-caught-member: code }
                    message: { type: string }
                    data: { type: object, additionalProperties: true, x-telo-caught-member: data }
                request:
                  type: object
                  additionalProperties: false
                  properties:
                    uri: { type: string }
                    params: { type: object, additionalProperties: true }
            items:
              type: "object"
              additionalProperties: false
              properties:
                code: { type: "string" }
                when: { type: "boolean" }
                error:
                  type: "object"
                  additionalProperties: false
                  properties:
                    code: { type: "integer" }
                    message: { type: "string" }
                    data:
                      type: "object"
                      additionalProperties: true
                  required: ["code", "message"]
              required: ["error"]
        required: ["name", "handler", "inputs", "result"]
        oneOf:
          - required: ["uri"]
          - required: ["uriTemplate"]
  required: ["entries"]
  x-telo-resource-rules:
    - in: /entries
      condition: !cel >-
        size(self.entries.filter(e,
          (has(e.uri) ? e.uri : has(e.uriTemplate) ? e.uriTemplate : '') == (has(this.uri) ? this.uri : has(this.uriTemplate) ? this.uriTemplate : ''))) == 1
      code: MCP_RESOURCE_DUPLICATE
      message: >-
        declares a URI another entry of this bundle already declares. A client reads a
        resource by its URI, so each must name one entry.
---
# Mcp.Prompts — passive bundle of prompt entries, served by a transport through
# prompts/list and prompts/get.
kind: "Telo.Definition"
metadata:
  name: "Prompts"
  description: >-
    A bundle of prompts an MCP server offers: each entry names a prompt a client can
    list and fetch with arguments, and points at the resource that renders its
    messages.
capability: Telo.Type
controllers:
  - pkg:telo/local/js?path=./nodejs/mcp-server.mjs&local_path=./nodejs/src/index.ts#PromptsController
schema:
  type: "object"
  additionalProperties: false
  properties:
    entries:
      title: Entries
      description: Prompt entries advertised to MCP clients.
      type: "array"
      x-telo-topology-role: entries
      items:
        title: Prompt Entry
        description: Single MCP prompt advertised via prompts/list and dispatched via prompts/get.
        type: "object"
        additionalProperties: false
        properties:
          name:
            title: Name
            description: Unique prompt identifier.
            type: "string"
            minLength: 1
            x-telo-topology-role: matcher
          description:
            title: Description
            type: "string"
          arguments:
            title: Arguments
            description: Flat list of named prompt parameters. A prompts/get leaving out one marked `required` is refused before the handler runs.
            type: "array"
            items:
              type: "object"
              additionalProperties: false
              properties:
                name: { type: "string" }
                description: { type: "string" }
                required: { type: "boolean" }
              required: ["name"]
          handler:
            title: Handler
            description: Resource that produces the prompt message array on get — Invocable or Runnable.
            x-telo-topology-role: handler
            x-telo-ref:
              kind: Telo.Executable
              use: trigger.inbound
              inputs: /inputs
          inputs:
            title: Inputs
            description: CEL expressions mapping the MCP request scope onto the handler's input shape.
            type: "object"
            additionalProperties: true
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                request:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    arguments: { type: object, additionalProperties: { type: string } }
                    meta: { type: object, additionalProperties: true }
                    session:
                      type: object
                      additionalProperties: false
                      properties:
                        id: { type: string }
                        clientInfo: { type: object, additionalProperties: true }
                        capabilities: { type: object, additionalProperties: true }
          result:
            title: Result
            description: MCP GetPromptResult envelope (`messages`, optional `description`, `_meta`), rendered from the handler's output via CEL.
            type: "object"
            additionalProperties: true
            required: [messages]
            properties:
              messages:
                title: Messages
                description: Array of prompt messages, each `{ role, content }`.
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                request:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    arguments: { type: object, additionalProperties: { type: string } }
                result:
                  x-telo-context-ref-from: "handler/outputType"
                  type: object
                  additionalProperties: true
          catches:
            title: Catches
            description: Maps a thrown InvokeError to a JSON-RPC error response.
            type: "array"
            x-telo-outcome-list: catches
            x-telo-catches-for: handler
            x-telo-context:
              type: object
              additionalProperties: false
              properties:
                error:
                  type: object
                  additionalProperties: false
                  properties:
                    code: { type: string, x-telo-caught-member: code }
                    message: { type: string }
                    data: { type: object, additionalProperties: true, x-telo-caught-member: data }
                request:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    arguments: { type: object, additionalProperties: { type: string } }
            items:
              type: "object"
              additionalProperties: false
              properties:
                code: { type: "string" }
                when: { type: "boolean" }
                error:
                  type: "object"
                  additionalProperties: false
                  properties:
                    code: { type: "integer" }
                    message: { type: "string" }
                    data:
                      type: "object"
                      additionalProperties: true
                  required: ["code", "message"]
              required: ["error"]
        required: ["name", "handler", "inputs", "result"]
  required: ["entries"]
  x-telo-resource-rules:
    - in: /entries
      condition: !cel "size(self.entries.filter(e, e.name == this.name)) == 1"
      code: MCP_PROMPT_DUPLICATE
      message: >-
        declares a name another entry of this bundle already declares. A client fetches
        a prompt by its name, so each must name one entry.
---
# Mcp.StdioServer — Telo.Service. Owns a single MCP SDK Server bound to
# stdin/stdout. References Mcp.Tools / Mcp.Resources / Mcp.Prompts bundles by
# name; entries from every referenced bundle are merged at init (cross-bundle
# duplicate matchers throw).
kind: "Telo.Definition"
metadata:
  name: "StdioServer"
  description: >-
    Serves the application's tools, resources and prompts to an MCP client over
    standard input and output — the shape a desktop client or editor expects when it
    launches a server as a child process.
capability: Telo.Service
controllers:
  - pkg:telo/local/js?path=./nodejs/mcp-server.mjs&local_path=./nodejs/src/index.ts#StdioServerController
schema:
  type: "object"
  additionalProperties: false
  properties:
    serverInfo:
      title: Server Info
      description: Identity advertised to MCP clients during initialize.
      # A CEL slot so an app can advertise `module.version` instead of restating
      # its own version in a second place nothing keeps in sync.
      x-telo-eval: compile
      type: "object"
      additionalProperties: false
      properties:
        name:
          title: Name
          type: "string"
        version:
          title: Version
          type: "string"
      required: ["name", "version"]
    instructions:
      title: Instructions
      description: |
        Optional primer surfaced to the client on `initialize` (carried on the
        SDK `Server`'s `instructions` option). Compatible MCP clients pass this
        to their LLM as system context, so it's the natural place to teach a
        model how to use the exposed tools.
      type: "string"
    tools:
      title: Tools
      description: Mcp.Tools bundles whose entries should be exposed by this transport.
      type: "array"
      items:
        x-telo-ref:
          kind: Self.Tools
          use: dependency
    resources:
      title: Resources
      description: Mcp.Resources bundles whose entries should be exposed by this transport.
      type: "array"
      items:
        x-telo-ref:
          kind: Self.Resources
          use: dependency
    prompts:
      title: Prompts
      description: Mcp.Prompts bundles whose entries should be exposed by this transport.
      type: "array"
      items:
        x-telo-ref:
          kind: Self.Prompts
          use: dependency
  required: ["serverInfo"]
  # A client addresses an entry by its name or URI alone, so the bundles one
  # transport serves must not share one.
  x-telo-resource-rules:
    - resolve: [/tools]
      in: /tools
      condition: !cel >-
        this.entries.all(e,
          size(self.tools.filter(b, b.entries.exists(x, x.name == e.name))) == 1)
      code: MCP_TOOL_DUPLICATE
      message: >-
        declares a tool name another bundle of this server also declares, or is listed
        twice.
    - resolve: [/resources]
      in: /resources
      condition: !cel >-
        this.entries.all(e,
          size(self.resources.filter(b, b.entries.exists(x,
            (has(x.uri) ? x.uri : has(x.uriTemplate) ? x.uriTemplate : '') == (has(e.uri) ? e.uri : has(e.uriTemplate) ? e.uriTemplate : '')))) == 1)
      code: MCP_RESOURCE_DUPLICATE
      message: >-
        declares a resource URI another bundle of this server also declares, or is
        listed twice.
    - resolve: [/prompts]
      in: /prompts
      condition: !cel >-
        this.entries.all(e,
          size(self.prompts.filter(b, b.entries.exists(x, x.name == e.name))) == 1)
      code: MCP_PROMPT_DUPLICATE
      message: >-
        declares a prompt name another bundle of this server also declares, or is
        listed twice.
---
# Mcp.HttpEndpoint — Telo.Mount. Mounts on Http.Server at a chosen path; owns
# a per-session map keyed by the Mcp-Session-Id header. Each session owns its
# own SDK Server instance built from the resolved bundle refs.
kind: "Telo.Definition"
metadata:
  name: "HttpEndpoint"
  description: >-
    Serves the application's tools, resources and prompts to MCP clients over HTTP,
    mounted alongside the rest of an application's routes, with optional per-session
    state for stateful clients.
capability: Telo.Mount
controllers:
  - pkg:telo/local/js?path=./nodejs/mcp-server.mjs&local_path=./nodejs/src/index.ts#HttpEndpointController
schema:
  type: "object"
  additionalProperties: false
  properties:
    serverInfo:
      title: Server Info
      description: Identity advertised to MCP clients during initialize.
      # A CEL slot so an app can advertise `module.version` instead of restating
      # its own version in a second place nothing keeps in sync.
      x-telo-eval: compile
      type: "object"
      additionalProperties: false
      properties:
        name:
          title: Name
          type: "string"
        version:
          title: Version
          type: "string"
      required: ["name", "version"]
    instructions:
      title: Instructions
      description: |
        Optional primer surfaced to the client on `initialize` (carried on the
        SDK `Server`'s `instructions` option). Compatible MCP clients pass this
        to their LLM as system context, so it's the natural place to teach a
        model how to use the exposed tools.
      type: "string"
    stateful:
      title: Stateful
      description: |
        When true, the endpoint mints an `Mcp-Session-Id` on initialize and
        binds follow-up requests to that session's in-memory SDK Server. When
        false (default), every request is independent — required for
        horizontally scaled deployments without sticky session affinity at the
        load balancer. Stateless mode is appropriate for tools-only servers; opt
        in to stateful only when you need server-pushed notifications,
        resumable streams, or per-session state.
      type: "boolean"
      default: false
    tools:
      title: Tools
      description: Mcp.Tools bundles whose entries should be exposed by this transport.
      type: "array"
      items:
        x-telo-ref:
          kind: Self.Tools
          use: dependency
    resources:
      title: Resources
      description: Mcp.Resources bundles whose entries should be exposed by this transport.
      type: "array"
      items:
        x-telo-ref:
          kind: Self.Resources
          use: dependency
    prompts:
      title: Prompts
      description: Mcp.Prompts bundles whose entries should be exposed by this transport.
      type: "array"
      items:
        x-telo-ref:
          kind: Self.Prompts
          use: dependency
  required: ["serverInfo"]
  # A client addresses an entry by its name or URI alone, so the bundles one
  # transport serves must not share one.
  x-telo-resource-rules:
    - resolve: [/tools]
      in: /tools
      condition: !cel >-
        this.entries.all(e,
          size(self.tools.filter(b, b.entries.exists(x, x.name == e.name))) == 1)
      code: MCP_TOOL_DUPLICATE
      message: >-
        declares a tool name another bundle of this server also declares, or is listed
        twice.
    - resolve: [/resources]
      in: /resources
      condition: !cel >-
        this.entries.all(e,
          size(self.resources.filter(b, b.entries.exists(x,
            (has(x.uri) ? x.uri : has(x.uriTemplate) ? x.uriTemplate : '') == (has(e.uri) ? e.uri : has(e.uriTemplate) ? e.uriTemplate : '')))) == 1)
      code: MCP_RESOURCE_DUPLICATE
      message: >-
        declares a resource URI another bundle of this server also declares, or is
        listed twice.
    - resolve: [/prompts]
      in: /prompts
      condition: !cel >-
        this.entries.all(e,
          size(self.prompts.filter(b, b.entries.exists(x, x.name == e.name))) == 1)
      code: MCP_PROMPT_DUPLICATE
      message: >-
        declares a prompt name another bundle of this server also declares, or is
        listed twice.
