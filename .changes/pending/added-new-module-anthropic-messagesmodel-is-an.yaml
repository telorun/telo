modules:
  modules/anthropic: Added
body: "New module. `Anthropic.MessagesModel` is an `Ai.Model` over Anthropic's Messages
  API, called through an injected `Http.Request` whose client carries the base URL and
  the `x-api-key` credential — no vendor SDK and no key on the kind. Configuration is
  closed: `model`, `request`, `maxTokens` (required; the API has no default),
  `cacheLifetime` (`5m` default, or `1h`), `betas` (sent as `anthropic-beta`) and
  `options` (camelCase request parameters, which may not name `model`, `messages`,
  `system`, `tools`, `toolChoice` or `stream`, nor — on the resource — `maxTokens`,
  which a call's own options may still override). The controller sends
  `anthropic-version: 2023-06-01`. Every system message is hoisted in order; images go
  by bytes or http(s) URL (JPEG, PNG, GIF, WebP), PDF files by bytes or http(s) URL and
  plain-text files by bytes, and anything else is refused before the request as
  `ERR_MODEL_CONTENT_UNSUPPORTED`; consecutive tool messages are one user turn;
  `toolChoice: none` is sent with the tools still declared. A content part's
  `cacheBreakpoint` becomes a cache breakpoint at the configured lifetime — the last
  four in a request are honoured and earlier ones dropped — and usage reports
  `cachedPromptTokens` and `cacheWritePromptTokens`, with `promptTokens` the whole
  prompt. Thinking is returned as `reasoning` parts and carried through a tool loop as
  `providerState`. The kind restates the thirteen failure codes `Ai.Model` declares and
  raises nothing else, classifying by HTTP status and the API's error type. A call
  carrying `responseFormat`, or a structural key in its `options`, is
  `ERR_MODEL_REQUEST_REJECTED`. Requires telo >=0.114.0."
