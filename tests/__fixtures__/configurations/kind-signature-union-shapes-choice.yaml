# A callable abstract whose first parameter is one of two named shapes, each a
# string only where its own choice writes it; an implementation's parameter is
# a string. The parameter is refused only where neither shape is a string.
kind: Telo.Application
metadata: { name: KindSignatureUnionShapes }
variables:
  flag2: { env: FLAG_2, type: boolean, default: false }
  flag3: { env: FLAG_3, type: boolean, default: false }
---
kind: Telo.JsonSchema
metadata: { name: A }
schema: !if
  if: !cel "variables.flag2"
  then: { type: string }
  else: { type: object }
---
kind: Telo.JsonSchema
metadata: { name: B }
schema: !if
  if: !cel "variables.flag3"
  then: { type: string }
  else: { type: object }
---
kind: Telo.Abstract
metadata: { name: Format }
capability: Telo.Callable
params:
  - name: input
    schema:
      anyOf:
        - { $ref: "telo://Self/A" }
        - { $ref: "telo://Self/B" }
returns: { schema: { type: string } }
---
kind: Telo.Definition
metadata: { name: Plain }
extends: Self.Format
capability: Telo.Callable
controllers: [pkg:telo/local/js?path=./probe.mjs#Plain]
deterministic: true
params:
  - { name: input, schema: { type: string } }
returns: { schema: { type: string } }
