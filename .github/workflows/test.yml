  # code path — they cover the platform axes that differ underneath one: an
  # arm64 runner (native prebuilds for esbuild, sqlite's staged better-sqlite3
  # addon and the cargo fixture crates), a case-INSENSITIVE default filesystem, and BSD rather than
  # GNU userland. An import whose casing disagrees with the file on disk passes
  # here and on Windows, and fails only on Linux; the reverse never happens. So
  # these jobs are not redundant with the ubuntu ones, but they are the cheapest
  # to reason about when they go red.
  macos-unit:
    name: "macOS: package unit tests"
