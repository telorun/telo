# An import omitting the optional store: the library declares its default and holds that.
kind: Telo.Application
metadata:
  name: OptionalOmitted
  version: 1.0.0
imports:
  Run: ../../../../modules/run
  Assert: ../../../../modules/assert
  Kinds: ./kinds
  Lib: ./lib
targets:
  - !ref verify

---
kind: Run.Sequence
metadata:
  name: verify
steps:
  - name: held
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "resources.Lib.holder.label"
      expected: fallback
