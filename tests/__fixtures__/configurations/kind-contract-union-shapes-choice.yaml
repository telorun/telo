# An abstract's output member is one of two named shapes, each a string only
# where its own choice writes it; an implementation narrows the member to a
# string. The union is refused only where neither shape is a string, and each
# shape compared with the member is refused there too.
kind: Telo.Application
metadata: { name: KindContractUnionShapes }
variables:
  flag2: { env: FLAG_2, type: boolean, default: false }
  flag3: { env: FLAG_3, type: boolean, default: false }
---
kind: Telo.JsonSchema
metadata: { name: A }
schema: !if
  if: !cel "variables.flag2"
  then: { type: string }
  else: { type: object }
---
kind: Telo.JsonSchema
metadata: { name: B }
schema: !if
  if: !cel "variables.flag3"
  then: { type: string }
  else: { type: object }
---
kind: Telo.Abstract
metadata: { name: Step }
capability: Telo.Invocable
outputType:
  type: object
  required: [v]
  properties:
    v:
      anyOf:
        - !ref A
        - !ref B
---
kind: Telo.Definition
metadata: { name: Narrow }
extends: Self.Step
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./probe.mjs#Narrow]
outputType: { type: object, required: [v], properties: { v: { type: string } } }
