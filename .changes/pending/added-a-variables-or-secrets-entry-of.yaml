units:
  analyzer: Added
body: "A `variables:` or `secrets:` entry of a library or an application may be typed by
  a `$ref` to a recursive built-in fragment such as `Text`: each entry is a JSON Schema
  position of its own, so such a module checks and loads. A library entry that is not a
  JSON Schema (`type: strng`) is now refused as `SCHEMA_VIOLATION` at the entry."
