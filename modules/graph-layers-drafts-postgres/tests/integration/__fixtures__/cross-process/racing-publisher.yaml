# Publishes the open draft of `top` while another process writes the layer
# outside any draft. If that write lands first the publish is refused as stale,
# which this process records as a node in `base`.
kind: Telo.Application
metadata:
  name: CrossProcessRacingPublisher
  version: 1.0.0
include:
  - ./model.yaml
imports:
  Postgres: ../../../../../postgres
  Layers: ../../../..
  Graph: ../../../../../graph
  GraphLayers: ../../../../../graph-layers
  Run: ../../../../../run
variables:
  dbHost: { env: DB_HOST, type: string }
  dbPort: { env: DB_PORT, type: integer }
targets:
  - !ref work
---
kind: Postgres.Connection
metadata: { name: db }
access:
  kind: Postgres.DatabaseAccess
  fields:
    url:
      scheme: postgres
      host: !cel "variables.dbHost"
      port: !cel "variables.dbPort"
      user: postgres
      password: postgres
      path: /postgres
      query: { options: "-c search_path=public" }
---
kind: Run.Sequence
metadata: { name: work }
steps:
  - name: open
    invoke: { kind: GraphLayers.OpenDraft, store: !ref top }
    inputs: {}
  - name: publish
    try:
      - name: attempt
        invoke: { kind: GraphLayers.Publish, store: !ref top }
        inputs: { draft: !cel "steps.open.result.draft.id" }
    catch:
      - name: record
        invoke: { kind: Graph.CreateNode, store: !ref base, node: !ref person }
        inputs: { key: race-refused, properties: { name: !cel "error.code" } }
