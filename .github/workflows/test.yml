      - name: Run package unit tests
        if: needs.select.outputs.unit_mode == 'full' || (needs.select.outputs.unit_mode == 'selected' && needs.select.outputs.unit_test_args != '[]')
        shell: bash
        env:
          TEST_ARGS: ${{ needs.select.outputs.unit_test_args }}
        run: |
          args=(); while IFS= read -r a; do args+=("$a"); done < <(jq -r '.[]' <<<"$TEST_ARGS" | tr -d '\r')
          pnpm -r "${args[@]}" --no-bail test

      - name: Check module manifests
        if: needs.select.outputs.suites == 'true'
        run: pnpm run check modules/*/telo.yaml packages/runner-core/workspace-app/telo.yaml

      - name: Check example manifests
        if: needs.select.outputs.suites == 'true'
