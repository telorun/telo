name: Publish

# Runs on a release branch only: pushes to main publish nothing. The branch's own
# copy of this file does the work, so a fix to the pipeline is a PR into the branch.
# A branch is frozen once a newer `release/*` branch exists, and every job below
# refuses on it as its first step.
#
# Every release — a candidate, final, patch, module or packages release — runs, in
# order: the unit tags and npm (`release`), modules (`publish-modules`), the
# publication commit and every tag of the release (`publication`), the Record release
# dispatch (`record`, never for a candidate), the artifact check (`artifact-check`),
# then everything built from the tag. Every run also rebuilds the release PR
# (`release-pr`) from what `telo release status` plans.

on:
  push:
    branches: ["release/*"]
  # Recovery. Every job here derives its work from what is already published rather
  # than from a previous step's exit code, so a dispatch re-runs them safely: npm
  # publish skips what exists, module publish skips an already-pushed version and
  # re-derives the module release's tag from the versions the commit moved, the
  # publication commit is the same commit and its tags are found in place, and the
  # GitHub Release step skips a tag that already has one.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # npm packages ONLY, from the release commit's moved units: the unit tags first,
  # so the links every packed package names exist, then each npm row of `telo
  # release order` npm does not hold yet (`publish-packages.mjs`, `rc` for a
  # candidate, `latest` otherwise). Modules, images and the GitHub Release are the
  # jobs below, so none of them can strand another.
  release:
    name: Publish npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      # `[{ key, name, version, ecosystem }]`: one row per package of every unit the
      # release commit moved (release-units.mjs).
      units: ${{ steps.units.outputs.units }}
      # candidate | final | patch | none — what this run released (release-channel.mjs).
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      # The release versioned candidates (`<final>-rc.<k>`).
      candidates: ${{ steps.release.outputs.candidates }}
      # The release commit moved units no release tag names yet, or this run is its re-run.
      released: ${{ steps.release.outputs.released }}
      # The tag this run names its release by: `v<line version>`, or
      # `packages-<x.y>-[rc.]<n>`; the `publication` job makes it.
      release-tag: ${{ steps.release.outputs.release-tag }}
      # The release tag main records: empty for a candidate.
      record-tag: ${{ steps.release.outputs.record-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Build workspace
        run: pnpm -r --if-present build

      # Read from the commit, never from an earlier step, so a re-run of an old
      # publish classifies as the first did.
      - name: Read the units the release commit moved
        id: units
        run: node scripts/release-units.mjs

      - name: Classify the release
        id: release
        env:
          MOVED_UNITS: ${{ steps.units.outputs.units }}
        run: node scripts/release-channel.mjs classify

      # `<unit key>@<version>` on the release commit, before anything publishes: a
      # packed package's links name it. TELO_BOT_TOKEN, since the rulesets let only
      # the release workflows create tags.
      - name: Tag the released units
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ steps.units.outputs.commit }}
        run: |
          git checkout --quiet --detach "$RELEASE_COMMIT"
          node scripts/release-tag.mjs --units
          git checkout --quiet --detach "$GITHUB_SHA"

      - name: Publish npm packages
        if: steps.release.outputs.released == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run publish-packages

      # `rc` follows a final or patch, and only forward. A candidate publishes under
      # `rc` already.
      - name: Move the rc dist-tag
        if: steps.release.outputs.channel == 'final' || steps.release.outputs.channel == 'patch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          MOVED_UNITS: ${{ steps.units.outputs.units }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: node scripts/release-dist-tags.mjs

  # The release PR, `chore(release): version` from `release-version/<branch>`, on
  # every run: `telo release status` planning a unit is what makes one. Candidacy is
  # derived (`release-version.mjs`): while `v<x.y>.0` is absent and no open release
  # PR's head carries final versions, `telo release apply --candidate`. With nothing
  # planned the apply writes nothing and no PR is opened. Its own job, so a failure
  # here leaves the release this run published free to be tagged.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      # TELO_BOT_TOKEN: the release PR is pushed with the checkout's credentials, and a
      # push made with the default token starts no checks.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TELO_BOT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Build workspace
        run: pnpm -r --if-present build

      - name: Is the release PR a candidate
        id: candidacy
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-version.mjs

      # A linking crate's cargo layer reads its closure across every platform
      # (`cargo metadata --locked --offline`), so every platform's crates are fetched first.
      - name: Fetch every platform's crates
        run: cargo fetch --locked

      # Writes every planned version into each package of its unit, the changelogs
      # (a final), the ledger and the `>=unreleased` floors the line's release names;
      # the plan it printed, captured before it consumed the fragments, is the body.
      - name: Apply the release plan
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
          CANDIDATE: ${{ steps.candidacy.outputs.candidate }}
        run: |
          flag=""
          if [ "$CANDIDATE" = "true" ]; then flag="--candidate"; fi
          node ./cli/nodejs/bin/telo.mjs release apply --base HEAD $flag -o json > "$RUNNER_TEMP/release-plan.json"

      - name: Render the PR body
        env:
          CANDIDATE: ${{ steps.candidacy.outputs.candidate }}
        run: |
          flag=""
          if [ "$CANDIDATE" = "true" ]; then flag="--candidate"; fi
          node scripts/release-pr-body.mjs "$RUNNER_TEMP/release-plan.json" $flag > "$RUNNER_TEMP/release-body.md"

      # The bot token pushes the PR branch and opens the PR, so the required checks
      # run on it; `telo release check` skips coverage on its head branch.
      - name: Open or rebuild the release PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TELO_BOT_TOKEN }}
          branch: release-version/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "chore(release): version"
          commit-message: "chore(release): version"
          body-path: ${{ runner.temp }}/release-body.md

  # Module ARTIFACTS publish here, not in the npm release script.
  #
  # The job builds artifacts with the WORKSPACE CLI (`node ./cli/nodejs/bin/telo.mjs`,
  # `--skip-controllers`), so nothing resolves from npm; it runs after the npm
  # `release` job of the same run so that every floor a module declares names a
  # published telo — a candidate's floor its `<surface>-rc.<k>` CLI. Candidates
  # publish their module versions too, so an rc tag's consumers resolve every pin;
  # `telo publish` never moves a module's OCI `latest` to one.
  #
  # The script pushes only a version absent at the registry, so nothing is
  # republished and a version a commit merely recorded is not pushed. A commit that
  # moved module versions is the module release `modules-<major>.<minor>-<n>`, named
  # by this job on every run (a re-run finds the tag in place or recounts the same
  # number); `publication` makes the tag.
  # `vars.TELO_OCI_REGISTRY` unset skips it entirely.
  publish-modules:
    name: Publish module artifacts
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.released == 'true' && vars.TELO_OCI_REGISTRY != '' }}
    permissions:
      contents: read
      packages: write
    outputs:
      modules-tag: ${{ steps.number.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD^ for the moved versions, tags for the numbering

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Build workspace
        run: pnpm -r --if-present build

      # The OCI transport reads the ambient Docker credential chain, so logging in
      # here is what authorizes the push.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A mirror cannot be built up incrementally from empty: `telo publish`
      # hard-fails when a relative sibling does not already resolve at the
      # destination. `scripts/publish-oci-backfill.mjs` repairs a partially-pushed
      # mirror.
      - name: Publish module manifests
        id: publish
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: pnpm run publish-modules

      # A commit that moved module versions is a module release, whether this run or an
      # earlier one pushed them: a re-run re-derives the same tag.
      - name: Number the module release
        id: number
        if: steps.publish.outputs.moved-in-commit != '' && steps.publish.outputs.moved-in-commit != '0'
        env:
          CANDIDATES: ${{ needs.release.outputs.candidates }}
        run: node scripts/release-channel.mjs modules-tag

  # The built-in vocabulary of every telo release, `<registry>/telo@<version>`.
  #
  # Its source is npm, not this checkout: each `@telorun/analyzer` release ships
  # its archive at `src/builtin-vocabulary/`, and `scripts/publish-builtins.mjs`
  # pushes that directory, taken out of the released tarball, for every version
  # whose tag is missing — so the artifact is the release's own bytes, published
  # by the checkout's CLI. Not a step of the npm `release` job, where a failure
  # after the npm publish would have nothing to retry: this reconciles on every
  # push of the branch, so a missed version heals on the next one. It runs after `release` (and
  # whatever it did) so the version that job just published is pushed in the same
  # run. `vars.TELO_OCI_REGISTRY` unset skips it, as it does module publishing.
  publish-builtins:
    name: Publish the built-in vocabulary
    runs-on: ubuntu-latest
    needs: release
    if: ${{ always() && vars.TELO_OCI_REGISTRY != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Build workspace
        run: pnpm -r --if-present build

      # The OCI transport reads the ambient Docker credential chain.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the built-in vocabulary of each release
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node scripts/publish-builtins.mjs

  # Every tag of a release, a candidate's included, on the PUBLICATION COMMIT:
  # the branchless child of this run's commit whose only change is `telo release
  # imports --as=published` over the consumer roots, so a tag carries pins to
  # published artifacts while the branch keeps relative imports. After npm and module
  # publishing, so every import it pins is published. The commit is a function of
  # this run's commit and the registry's pins, so a re-run makes the same one and
  # finds its tags in place; with nothing to rewrite the tags name this commit.
  # TELO_BOT_TOKEN pushes the tags, which the rulesets let only the release workflows
  # create.
  publication:
    name: Publication commit and tags
    runs-on: ubuntu-latest
    needs: [release, publish-modules]
    if: >-
      ${{ always() && needs.release.result == 'success' &&
      (needs.publish-modules.result == 'success' || needs.publish-modules.result == 'skipped') &&
      (needs.release.outputs.release-tag != '' || needs.publish-modules.outputs.modules-tag != '') }}
    permissions:
      contents: write
      packages: read
    outputs:
      # The commit every tag of the release names; this run's commit when nothing was rewritten.
      sha: ${{ steps.publication.outputs.sha }}
      publication: ${{ steps.publication.outputs.publication }}
      # The tag the app images build from and main records: on one commit, modules
      # over packages over v. A candidate's carries `-rc.` and is never recorded.
      tag: ${{ steps.tags.outputs.tag }}
    steps:
      # The release commit, installed and built: the rewrite's release plan digests
      # the controller builds this checkout makes.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Build workspace
        run: pnpm -r --if-present build

      # A linking crate's cargo layer reads its closure across every platform
      # (`cargo metadata --locked --offline`), so every platform's crates are fetched first.
      - name: Fetch every platform's crates
        run: cargo fetch --locked

      # The pins are read from the registry.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the recorded tag
        id: tags
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
          MODULES_TAG: ${{ needs.publish-modules.outputs.modules-tag }}
        run: echo "tag=${MODULES_TAG:-$RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Make the publication commit and tag the release
        id: publication
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
          MODULES_TAG: ${{ needs.publish-modules.outputs.modules-tag }}
        run: |
          tags=()
          if [ -n "$RELEASE_TAG" ]; then tags+=(--tag "$RELEASE_TAG"); fi
          if [ -n "$MODULES_TAG" ]; then tags+=(--tag "$MODULES_TAG"); fi
          node scripts/publication-commit.mjs --release "$GITHUB_SHA" "${tags[@]}" --push

      # The release's GitHub Release, once its tag exists: `v<version>` is a draft
      # until the standalone CLI's job promotes it, a candidate's a pre-release. Read
      # from the units the release commit moved, so a re-run writes the same release.
      - name: Create the GitHub Release
        if: needs.release.outputs.release-tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ steps.publication.outputs.sha }}
          MOVED_UNITS: ${{ needs.release.outputs.units }}
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
          RELEASE_CHANNEL: ${{ needs.release.outputs.channel }}
        run: node scripts/github-releases.mjs

  # Main learns what shipped through a generated record, never a merge: Record
  # release (record-release.yml, main's own copy, run at main's tip) rebuilds the
  # one record PR of this line from the branch's newest release tag. Dispatched
  # once per run once the tags exist, after a final, patch, packages-only or module
  # release, never after a candidate (a tag holding `-rc.`); a second dispatch
  # rebuilds the same PR.
  # TELO_BOT_TOKEN, since a dispatch made with the default token starts nothing.
  record:
    name: Record the release on main
    runs-on: ubuntu-latest
    needs: publication
    if: ${{ always() && needs.publication.result == 'success' && needs.publication.outputs.tag != '' && !contains(needs.publication.outputs.tag, '-rc.') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Dispatch Record release
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publication.outputs.tag }}
        run: gh workflow run record-release.yml --ref main -f tag="$TAG"

  # What the tag ships, checked as a user receives it: the publication commit in a
  # fresh checkout (no `.telo` cache), its imports pinned to published artifacts.
  # `telo check` over the consumer roots and the example, starter and blueprint
  # suites. It gates everything built from the tag below, never the tags or the
  # record above: they say what was published, and a red check leaves the release
  # tagged and recorded with no installers, images, Studio or site until a re-run
  # that passes or the next patch completes it.
  artifact-check:
    name: Check the published release
    runs-on: ubuntu-latest
    needs: publication
    if: ${{ always() && needs.publication.result == 'success' }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout the publication commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publication.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Restore staged module files
        id: staged
        uses: ./.github/actions/restore-staged-files
        with:
          scope: ${{ github.job }}

      - name: Check example manifests
        run: >-
          pnpm run check examples/*/telo.yaml examples/*/*/telo.yaml
          examples/schema-evolution/v1.yaml examples/templated-api/library.yaml

      - name: Check starter and blueprint manifests
        run: pnpm run check starters/apps/*/telo.yaml starters/libs/*/telo.yaml blueprints/*/telo.yaml

      - name: Check app manifests
        run: pnpm run check apps/*/telo.yaml

      - name: Run the example test suites
        run: pnpm run telo ./examples/test-suite.yaml

      - name: Run the starter test suites
        run: pnpm run telo ./starters/test-suite.yaml

      - name: Run the blueprint test suites
        run: pnpm run telo ./blueprints/test-suite.yaml

      - name: Save staged module files
        if: always() && steps.staged.outputs.key != '' && steps.staged.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-staged-files
        with:
          key: ${{ steps.staged.outputs.key }}
          paths: ${{ steps.staged.outputs.paths }}

  # `stable` follows the newest final release's publication commit, forward only, once
  # the artifact check passed on it. A failed push shows red and blocks nothing: the
  # pointer is the least of what a release produces.
  stable:
    name: Move the stable branch
    runs-on: ubuntu-latest
    needs: [release, publication, artifact-check]
    if: >-
      ${{ always() && needs.publication.result == 'success' &&
      needs.artifact-check.result == 'success' && needs.release.outputs.release-tag != '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout the publication commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publication.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the release scripts' dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      - name: Move stable
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
          PUBLICATION_SHA: ${{ needs.publication.outputs.sha }}
        run: node scripts/release-stable.mjs --tag "$RELEASE_TAG" --sha "$PUBLICATION_SHA"

  # Kernel images (`telorun/node` and its variants) on every channel but `none`, from
  # npm: not built from the tag, so neither the publication nor the artifact check
  # gates them. `latest`, `<major>` and `<major>.<minor>` move only forward.
  docker-kernel:
    name: Publish kernel Docker images
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.channel != 'none' }}
    # A called workflow's permissions can only be equal to or narrower than the
    # caller job's.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      images: kernel
      units: ${{ needs.release.outputs.units }}
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # The image of every `docker` row and the chart of every `helm` row among the units
  # the release moved, built from the publication tag once the artifact check
  # passed; a candidate's under its unit's `-rc.<k>`, moving no pointer. A release
  # that did not move the CLI builds them on the branch's last released telo. After
  # the kernel images their bases and the k8s-runner's session default name. An app
  # image's `latest` moves only forward.
  docker-apps:
    name: Publish app Docker images
    needs: [release, publication, artifact-check, docker-kernel]
    if: >-
      ${{ always() && needs.artifact-check.result == 'success' &&
      (needs.docker-kernel.result == 'success' || needs.docker-kernel.result == 'skipped') }}
    # The k8s-runner CHART job's `packages: write` has to be granted here as well —
    # without it the helm push 403s on the release path only, where nothing else
    # exercises it.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      images: apps
      ref: ${{ needs.publication.outputs.tag }}
      units: ${{ needs.release.outputs.units }}
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # The assets of the release `tag` names. Each is a called workflow, so the files
  # that build them are this branch's. The release is a DRAFT until the standalone
  # CLI's job publishes it, once every installer is attached and verified. Each runs
  # once the artifact check of the release's publication commit passed.
  cli-standalone:
    name: Standalone CLI
    needs: [release, artifact-check]
    if: >-
      ${{ always() && needs.release.result == 'success' && needs.release.outputs.channel != 'none' &&
      needs.artifact-check.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/cli-standalone-release.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # A candidate's `.vsix` is an asset of the pre-release; a final's or patch's also
  # goes to the Marketplace, which accepts no prerelease version.
  vscode:
    name: VS Code extension
    needs: [release, artifact-check]
    if: >-
      ${{ always() && needs.release.result == 'success' &&
      needs.release.outputs.channel != 'none' &&
      contains(fromJSON(needs.release.outputs.units).*.key, 'ide/vscode') &&
      needs.artifact-check.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/vscode-release.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
      units: ${{ needs.release.outputs.units }}
    secrets: inherit

  # Studio publishes at the final: its desktop builds, web image and chart, and
  # its web build (an asset of the release, and the pages) — a candidate carries an
  # rc version and publishes none of it.
  studio:
    name: Studio
    needs: [release, artifact-check]
    if: >-
      ${{ always() && needs.release.result == 'success' &&
      (needs.release.outputs.channel == 'final' || needs.release.outputs.channel == 'patch') &&
      contains(fromJSON(needs.release.outputs.units).*.key, 'apps/studio') &&
      needs.artifact-check.result == 'success' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/studio-release.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
      units: ${{ needs.release.outputs.units }}
    secrets: inherit

  studio-pages:
    name: Studio pages
    needs: [release, artifact-check]
    if: >-
      ${{ always() && needs.release.result == 'success' &&
      (needs.release.outputs.channel == 'final' || needs.release.outputs.channel == 'patch') &&
      needs.artifact-check.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/studio-pages.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # Builds the docs site from the release's own tag, attaches it to the release,
  # and deploys: the newest final at `/`, and while a candidate is open its build
  # at `/next/`.
  site:
    name: Docs site
    needs: [release, artifact-check]
    if: >-
      ${{ always() && needs.release.result == 'success' && needs.release.outputs.channel != 'none' &&
      needs.artifact-check.result == 'success' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      deploy: true
    secrets: inherit
