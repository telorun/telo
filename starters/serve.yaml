kind: Telo.Application
metadata:
  name: StartersServer
  version: 1.0.0
  description: |
    Serves a directory over HTTP so a locally running Studio can load the
    starter gallery from the checkout instead of the published one.

    Run from the repository root:
        pnpm run starters
    That serves a published-form copy of this directory (`starters-published/`,
    rebuilt on each start); `--dir <path>` or `STARTERS_DIR` serves a directory as it is. Then set
    Studio's "Starter gallery source" to http://localhost:8787. The local docker
    compose stack runs the same script as its `starters` service.

    Files are read per request. The starters' own imports are relative paths to
    this checkout's modules; the copy's are the published, pinned form.
requires:
  # A host-path variable declaring `entry:` needs 0.121.0.
  telo: ">=0.121.0"
imports:
  Http: ../modules/http-server
targets:
  - !ref server
ports:
  http:
    env: STARTERS_PORT
    arg: port
    protocol: tcp
    default: 8787
variables:
  host:
    env: STARTERS_HOST
    arg: host
    type: string
    default: 127.0.0.1
    description: The address to listen on; 0.0.0.0 inside a container.
  dir:
    env: STARTERS_DIR
    arg: dir
    type: string
    x-telo-type: { name: Telo.HostPath, entry: directory }
    default: starters
    description: The directory holding starters.json, resolved against the working directory.
---
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
  address: !cel "variables.host"
# Studio's dev page is another origin.
cors:
  origin: "*"
  methods: [ GET ]
mounts:
  - path: /
    mount:
      kind: Http.Static
      root: !cel "variables.dir"
      index: starters.json
