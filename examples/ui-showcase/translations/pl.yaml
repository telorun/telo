# The showcase in Polish: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads and translated into Polish's four cases; a word told apart by its
# context is translated once per context.
kind: I18n.Catalog
metadata:
  name: polish
lang: pl
texts:
  # Applications and pages.
  - { text: UI showcase, translation: Pokaz interfejsu }
  - { text: UI showcase — Radix, translation: Pokaz interfejsu — Radix }
  - { text: UI showcase — brand, translation: Pokaz interfejsu — marka }
  - { text: UI showcase — sidebar, translation: Pokaz interfejsu — pasek boczny }
  - { text: Overview, translation: Przegląd }
  - { text: Conditions, translation: Warunki }
  - { text: Data, translation: Dane }
  - { text: Tables, translation: Tabele }
  - { text: Filters, translation: Filtry }
  - { text: Forms, translation: Formularze }
  - { text: Actions, translation: Akcje }
  - { text: Components, translation: Komponenty }
  - { text: CRUD, translation: CRUD }
  - { text: Themes, translation: Motywy }
  # The navigation's groups.
  - { text: Building blocks, translation: Elementy }
  - { text: Input, translation: Wprowadzanie }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: Logo pokazu interfejsu }
  - { text: Language, translation: Język }
  - { text: Theme, translation: Motyw }
  - { text: Default, translation: Domyślny }
  - { text: Radix, translation: Radix }
  - { text: Brand, translation: Marka }
  - { text: Sidebar, translation: Pasek boczny }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: Na każde żądanie }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "Te węzły należą do samej strony, więc ich when i tekst są obliczane przy każdym żądaniu." }
  - { text: Your browser asked for Polish., translation: Twoja przeglądarka poprosiła o polski. }
  - { text: Your browser did not ask for Polish., translation: Twoja przeglądarka nie poprosiła o polski. }
  - { text: The Acme brand is on., translation: Marka Acme jest włączona. }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "Tekst obliczony przez wyrażenie jest pokazywany tak, jak go obliczono, i nigdy nie jest tłumaczony." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "Odnośnik, który to żądanie czyni niepoprawnym, zastępuje węzeł błędu, a reszta strony jest wysyłana." }
  - { text: Leaves the application, translation: Opuszcza aplikację }

  # The overview.
  - { text: Every node type, translation: Każdy rodzaj węzła }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "Pudełko, stos i kolumny zawierają inne węzły, a każde rysuje swoje dzieci na swój sposób." }
  - { text: A box, translation: Pudełko }
  - { text: Groups its children., translation: Grupuje swoje dzieci. }
  - { text: A stack, translation: Stos }
  - { text: Draws its children one under another., translation: Rysuje swoje dzieci jedno pod drugim. }
  - { text: A badge, translation: Plakietka }
  - { text: Columns, translation: Kolumny }
  - { text: "Draw their children side by side, as these three are.", translation: "Rysują swoje dzieci obok siebie, tak jak te trzy." }
  - { text: Text in each style, translation: Tekst w każdym stylu }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "Styl mówi, co węzeł znaczy; motyw decyduje, jak to wygląda. Węzeł może mieć kilka stylów." }
  - { text: Heading, translation: Nagłówek }
  - { text: Subheading, translation: Podtytuł }
  - { text: Muted, translation: Przygaszony }
  - { text: Strong, translation: Wyróżniony }
  - { text: Accent, translation: Akcent }
  - { text: Danger, translation: Zagrożenie }
  - { text: Warning, translation: Ostrzeżenie }
  - { text: Success, translation: Sukces }
  - { text: Strong and accent, translation: Wyróżniony i akcent }
  - { text: Links, translation: Odnośniki }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "Odnośnik do zadeklarowanej strony przechodzi w obrębie aplikacji; plik serwowany pod jej adresem ładuje się zwyczajnie; https i mailto ją opuszczają." }
  - { text: Go to Conditions, translation: Przejdź do warunków }
  - { text: A file the server serves, translation: Plik serwowany przez serwer }
  - { text: Write to us, translation: Napisz do nas }
  - { text: Images, translation: Obrazy }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "Obraz z adresu, ten sam obraz jako ozdoba z pustym alt i znaczniki SVG rysowane jako obraz, nigdy niewstawiane do strony." }
  - { text: The showcase mark, translation: Znak pokazu }
  - { text: Three overlapping circles, translation: Trzy nachodzące na siebie koła }
  - { text: Values by their schema, translation: Wartości według ich schematu }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "Każda wartość jest rysowana tak, jak mówi jej właściwość modelu, odczytana z rekordu zespołu ładowanego przez stronę." }
  - { text: Visit the team homepage, translation: Odwiedź stronę zespołu }
  - { text: "A uri, drawn as a link with a text of its own", translation: "Adres uri, rysowany jako odnośnik z własnym tekstem" }
  - { text: A uri-reference to a declared page, translation: Odwołanie uri-reference do zadeklarowanej strony }
  - { text: A uri-reference to a served file, translation: Odwołanie uri-reference do serwowanego pliku }
  - { text: A mailto address, translation: Adres mailto }
  - { text: "An address the rule refuses, drawn as plain text", translation: "Adres odrzucony przez regułę, rysowany jako zwykły tekst" }
  - { text: A date, translation: Data }
  - { text: A date and time, translation: Data i godzina }
  - { text: A boolean, translation: Wartość logiczna }
  - { text: An enumeration's label, translation: Etykieta wyliczenia }
  - { text: A list, translation: Lista }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "Wiersze jednej odpowiedzi, nigdy niestronicowane. Nagłówek domyślnie jest tytułem właściwości, a ostatnia kolumna jest pokazywana tylko, gdy zespół rekrutuje." }
  - { text: Projects under way, translation: Trwające projekty }
  - { text: Project, translation: Projekt }
  - { text: Texts, translation: Teksty }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": Jeszcze nie ma projektów.
        one: "{$count} projekt do tej pory."
        few: "{$count} projekty do tej pory."
        many: "{$count} projektów do tej pory."
        other: "{$count} projektu do tej pory."
  - { text: "{$team} started {$project} most recently.", translation: "{$team} najpóźniej rozpoczął projekt {$project}." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "Liczba mnoga wybrana w przeglądarce dla odczytanej liczby i tekst z wartościami z rekordu." }
  - { text: Open, context: state, translation: Otwarte }
  - { text: Open, context: verb, translation: Otwórz }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "Własny tekst węzła rozróżnia się tak samo: plakietka mówi, że TEL-42 jest otwarty, a odnośnik proponuje otwarcie jego zadań." }
  - { text: Style rules, translation: Reguły stylu }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "Styl wiersza i komórki wybiera wartość wiersza. Wyróżniony projekt jest pogrubiony, każdy status ma swój kolor, a status, którego nie nazywa żaden przypadek, dostaje styl domyślny. Dwie kolumny mają nagłówek z tym samym słowem, Open, rozróżnionym kontekstem, z jakim zapisano każdy nagłówek." }
  - { text: Composites, translation: Kompozyty }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "Cała ta strona jest widokiem, który każda aplikacja umieszcza przez odwołanie. Poniżej widok zapisany tam, gdzie jest umieszczony, i własny rodzaj kompozytu tego przykładu, który nie ma kontrolera." }
  - { text: A view declared inline at the node that places it., translation: "Widok zadeklarowany w węźle, który go umieszcza." }
  - { text: A callout, translation: Wyróżniona uwaga }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Zadeklarowana raz jako rodzaj rozszerzający Ui.Composite, który dostarcza widok, i umieszczona z własnymi polami." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: Karty }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "Treść w kartach, jedna karta naraz. Wybrana karta jest częścią adresu strony, więc odświeżenie lub udostępniony odnośnik otwiera ją ponownie." }
  - { text: Summary, translation: Podsumowanie }
  - { text: "A tab holds any nodes, as a box does.", translation: "Karta mieści dowolne węzły, tak jak pudełko." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "Rysowane są tylko węzły wybranej karty." }
  - { text: Chosen, translation: Wybrana }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "Każda karta jest dostarczana według własnego when, jak każdy węzeł." }
  # The labels of the overview's models.
  - { text: Code, translation: Kod }
  - { text: Name, translation: Nazwa }
  - { text: Status, translation: Status }
  - { text: Active, translation: Aktywny }
  - { text: Paused, translation: Wstrzymany }
  - { text: Finished, translation: Zakończony }
  - { text: Budget, translation: Budżet }
  - { text: Started, translation: Rozpoczęto }
  - { text: Free, context: subscription, translation: Darmowy }
  - { text: Enterprise, context: subscription, translation: Firmowy }
  - { text: Version, translation: Wersja }
  - { text: Team, context: subscription, translation: Zespół }

  # Conditions.
  - { text: Delivered and drawn, translation: Dostarczone i narysowane }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "when węzła decyduje na serwerze, czy jest on dostarczony; jego shown decyduje w przeglądarce, czy dostarczony węzeł jest rysowany." }
  - { text: Never delivered — this node is not in the page document., translation: Nigdy niedostarczony — tego węzła nie ma w dokumencie strony. }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "Dostarczony i nigdy nierysowany: status nie jest paused, więc przeglądarka trzyma ten tekst poza zasięgiem wzroku." }
  - { text: Delivered by its when and drawn by its shown., translation: Dostarczony przez swoje when i narysowany przez swoje shown. }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "Warunek umieszczenia wokół kompozytu, którego węzeł ma własny, jest owijany pudełkiem i oba muszą być spełnione." }
  - { text: Both conditions hold., translation: Oba warunki są spełnione. }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "Widok, którego treść wyłącza jego własne when, nie dostarcza węzła, więc umieszczający go kompozyt jest pomijany." }
  - { text: Never provided., translation: Nigdy niedostarczony. }
  - { text: Every keyword of a condition, translation: Każde słowo kluczowe warunku }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "Każdy wiersz poniżej jest rysowany, bo jego warunek jest spełniony dla podsumowania projektu TEL-42 odczytanego przez stronę: status active, czterech członków, tempo 2.5, tagi design i web, kierownik jako lider, note null i brak codename." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: pracuje nad nim od 1 do 10 osób." }
  - { text: "required: the lead has an e-mail.", translation: "required: lider ma e-mail." }
  - { text: "properties: the lead is a manager.", translation: "properties: lider jest kierownikiem." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: pracują nad nim co najmniej trzy osoby." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: pracuje nad nim najwyżej dziewięć osób." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: tempo jest większe niż 2." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: tempo jest mniejsze niż 3." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: tempo jest wielokrotnością 0.5." }
  - { text: "type: the status is a string.", translation: "type: status jest napisem." }
  - { text: "type, as a list: the note is a string or null.", translation: "type jako lista: note jest napisem albo null." }
  - { text: "const: the status is active.", translation: "const: status to active." }
  - { text: "enum: the status is active or paused.", translation: "enum: status to active albo paused." }
  - { text: "not: the status is not paused.", translation: "not: status nie jest paused." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code zaczyna się od TEL albo OPS." }
  - { text: "items: every tag has at least two letters.", translation: "items: każdy tag ma co najmniej dwie litery." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: są co najmniej dwa tagi." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: jest najwyżej pięć tagów." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: żaden tag się nie powtarza." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code ma co najmniej trzy znaki." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code ma najwyżej dziesięć znaków." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code to litery, myślnik i cyfry." }
  - { text: Missing and null, translation: Brak i null }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null jest obecną wartością. Brakująca wartość nie spełnia żadnego warunku, nawet pod not, więc brak sprawdza się na rodzicu." }
  - { text: The note is present and null., translation: note jest obecne i ma wartość null. }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "Nigdy nierysowane: brakujące codename nie spełnia not." }
  - { text: "The project has no codename, tested on the summary.", translation: "Projekt nie ma codename, sprawdzone na podsumowaniu." }
  - { text: Query parameters, translation: Parametry zapytania }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "Ten czytnik deklaruje mode, listę wartości tag i ticket zgodny ze wzorcem. Parametr pominięty w adresie, pojedynczy podany dwa razy albo wartość odrzucona przez deklarację liczy się jako brakujący." }
  - { text: Mode detailed, translation: Tryb detailed }
  - { text: Two tags, translation: Dwa tagi }
  - { text: A valid ticket, translation: Poprawny ticket }
  - { text: A refused ticket, translation: Odrzucony ticket }
  - { text: Mode given twice, translation: Tryb podany dwa razy }
  - { text: Clear the query, translation: Wyczyść zapytanie }
  - { text: mode is detailed., translation: mode to detailed. }
  - { text: There are two tag values or more., translation: Są co najmniej dwie wartości tag. }
  - { text: The ticket matches its pattern., translation: ticket pasuje do swojego wzorca. }
  - { text: "No ticket, or one its pattern refuses.", translation: "Brak ticket albo taki, który wzorzec odrzuca." }
  - { text: Enablement, translation: Dostępność }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "Przycisk można nacisnąć tylko, gdy spełniony jest jego warunek nad tym, co trzyma formularz, a dopóki nie jest, mówi dlaczego. Tag, który projekt już ma, jest odrzucany, a wiersze powyżej odczytują podsumowanie ponownie po dodaniu tagu." }
  - { text: Tag TEL-42, translation: Otaguj TEL-42 }
  - { text: Tag, translation: Tag }
  - { text: Type a tag of three letters or more., translation: Wpisz tag z co najmniej trzech liter. }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation:
      plural: count
      cases:
        one: "Dodano {$tag}: TEL-42 ma teraz {$count} tag."
        few: "Dodano {$tag}: TEL-42 ma teraz {$count} tagi."
        many: "Dodano {$tag}: TEL-42 ma teraz {$count} tagów."
        other: "Dodano {$tag}: TEL-42 ma teraz {$count} tagu."
  - { text: A page's own query, translation: Zapytanie samej strony }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "Ta strona też deklaruje mode, a jej własne węzły go czytają." }
  - { text: The page reads mode as detailed., translation: Strona czyta mode jako detailed. }

  # Data.
  - { text: A reader and its parameters, translation: Czytnik i jego parametry }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "Projekt to parametr project adresu strony, wysyłany z odczytem; bez niego parametr nie jest wysyłany, a trasa odpowiada dla TEL-42. Kod, którego nie ma żaden projekt, rysuje drzewo błędu." }
  - { text: A code no project has, translation: "Kod, którego nie ma żaden projekt" }
  - { text: No project, translation: Bez projektu }
  - { text: Reading the project…, translation: Odczytywanie projektu… }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, prowadzi {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "Czytnik zagnieżdżony w treści tego odczytuje osoby pracujące nad tym samym projektem." }
  - { text: Working on it, translation: Pracują nad nim }
  - { text: Role, translation: Rola }
  - { text: E-mail, translation: E-mail }
  - { text: "No answer · {$code}", translation: "Brak odpowiedzi · {$code}" }
  - { text: Readers that fail, translation: "Czytniki, które zawodzą" }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "Bez własnego drzewa błędu czytniki rysują kod i komunikat błędu — dla projektu, który nie istnieje, dla chronionej trasy odczytanej bez sesji i dla odpowiedzi, którą odrzuca model czytnika (lista projektów odczytana jako jeden projekt)." }
  - { text: "Never drawn: there is no such project.", translation: "Nigdy nierysowane: nie ma takiego projektu." }
  - { text: "Signed in, so this reads: {$name}", translation: "Zalogowano, więc odczytano: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "Nigdy nierysowane: lista nie jest projektem." }
  - { text: Read again on focus, translation: Ponowny odczyt przy powrocie do okna }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "Ten czytnik odczytuje czas serwera ponownie za każdym razem, gdy okno odzyskuje fokus. Przełącz się do innego okna i z powrotem." }
  - { text: Read at, translation: Odczytano }
  - { text: A sign-in gate, translation: Bramka logowania }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "Bramka odczytuje, czy sesja jest otwarta, i odczytuje to ponownie, gdy żądanie wewnątrz niej dostanie odpowiedź 401. Logowanie otwiera sesję dla członka zespołu; e-mail, którego nie ma nikt w zespole, jest odrzucany przy swoim polu. Wewnątrz czytnik chronionej trasy pokazuje konto. Ciche zakończenie sesji zostawia konto na ekranie, dopóki następne chronione żądanie — sprawdzenie poniżej albo powrót do okna — nie zostanie odrzucone; wtedy bramka przełącza się na widok wylogowany." }
  - { text: You are signed out., translation: Jesteś wylogowany. }
  - { text: Sign in, translation: Zaloguj }
  - { text: "Signed in as {$name}", translation: "Zalogowano jako {$name}" }
  - { text: "Member since {$since}", translation: "Członek od {$since}" }
  - { text: Check the session, translation: Sprawdź sesję }
  - { text: End the session quietly, translation: Zakończ sesję po cichu }
  - { text: Sign out, translation: Wyloguj }

  # The labels of the task models.
  - { text: Task, translation: Zadanie }
  - { text: Assignee, translation: Osoba przypisana }
  - { text: Priority, translation: Priorytet }
  - { text: Estimate, translation: Szacunek }
  - { text: Due, translation: Termin }
  - { text: Label, translation: Etykieta }
  - { text: Blocked, translation: Zablokowane }
  - { text: To do, translation: Do zrobienia }
  - { text: In progress, translation: W toku }
  - { text: In review, translation: W przeglądzie }
  - { text: Bug, translation: Błąd }
  - { text: Feature, translation: Funkcja }
  - { text: Chore, translation: Porządki }
  - { text: Docs, translation: Dokumentacja }
  - { text: Contact, translation: Kontakt }
  - { text: Project name, translation: Nazwa projektu }
  - { text: Brief, translation: Opis }

  # Tables.
  - { text: Columns from the model, translation: Kolumny z modelu }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "Bez zapisanych kolumn tabela pokazuje po jednej na każdą właściwość modelu oprócz klucza wiersza, każdą z nagłówkiem z jej tytułu i rysowaną według jej typu. Pokazuje 25 wierszy na stronę, domyślnie, a formularze tworzenia i edycji otwiera w oknie dialogowym — powierzchni, której tabela używa, gdy żadnej nie nazywa." }
  - { text: "Written columns, sorting and style rules", translation: "Zapisane kolumny, sortowanie i reguły stylu" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "Kolumny zapisane ręcznie, w podanej kolejności, jedna z własnym nagłówkiem. Kolumna sortuje, gdy kolekcja wymienia jej właściwość do sortowania. Wiersz zablokowanego zadania jest pogrubiony i czerwony, każda komórka statusu ma swój kolor, a priorytet, którego nie nazywa żaden przypadek, dostaje styl domyślny. Osiem wierszy na stronę." }
  - { text: Where, translation: Gdzie }
  - { text: Members behind a reference, translation: Pola za odwołaniem }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "Tablica zadań zwraca każde zadanie z zagnieżdżoną osobą przypisaną i projektem. Kolumna nad zagnieżdżonym polem bierze jego tytuł i sposób prezentacji przez nazwany kształt, przez definicję samego modelu i przez odwołanie, którego własny tytuł wygrywa z kształtem, który nazywa: kontakt jest odnośnikiem pocztowym, a opis odnośnikiem do strony." }
  - { text: Filtered by the address, translation: Filtrowane przez adres }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "Ta tabela deklaruje parametr project i wysyła go jako równość z każdym żądaniem. Bez projektu w adresie niczego nie odczytuje." }
  - { text: Atlas redesign tasks, translation: Zadania przeprojektowania Atlas }
  - { text: Billing migration tasks, translation: Zadania migracji rozliczeń }
  - { text: Blocked tasks, translation: Zablokowane zadania }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "Ta jest filtrowana stałą wartością zapisaną w tabeli i wymienia tylko zablokowane zadania." }
  - { text: Where a form opens, translation: Gdzie otwiera się formularz }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "Każda tabela poniżej otwiera formularze tworzenia i edycji na innej powierzchni. Zapis odświeża każdą tabelę zadań na stronie." }
  - { text: Dialogs, translation: Okna dialogowe }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "Tworzenie w małym oknie, które zostaje otwarte i opróżnione na kolejne zadanie. Edycja w dużym oknie, które nie blokuje strony i ignoruje kliknięcie obok; po zapisie zachowuje wartości, niezapisane dane odrzuca bez pytania i jest częścią adresu. Każdy wiersz oferuje usunięcie z potwierdzeniem." }
  - { text: Drawers, translation: Szuflady }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "Tworzenie w małej szufladzie od krawędzi początkowej; edycja w dużej szufladzie od krawędzi końcowej, bez przycisku zamknięcia. Obie zamykają się po zapisie i pytają, zanim niezapisane dane zostaną odrzucone." }
  - { text: Sheets, translation: Arkusze }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "Tworzenie w arkuszu od góry, który nie blokuje strony; edycja w pełnym arkuszu od dołu, będącym częścią adresu." }
  - { text: Popovers, translation: Dymki }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "Tworzenie w karcie obok przycisku Nowy, wyśrodkowanej na nim; poniżej progu staje się pełnym oknem. Edycja w karcie pod przyciskiem wiersza, wyrównanej do jego końca, której kliknięcie obok nie zamyka i która zostaje otwarta po zapisie." }
  - { text: In line, translation: W treści }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "Formularz tworzenia otwiera się nad wierszami, a formularz edycji pod wierszem, który zmienia. Poniżej progu formularz tworzenia otwiera się w arkuszu od dołu." }
  - { text: Panels, translation: Panele }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "Tworzenie w małym panelu przy krawędzi początkowej, którego Escape nie zamyka. Edycja w dużym panelu przy krawędzi końcowej, będącym częścią adresu, z wierszami wciąż dostępnymi obok; poniżej progu staje się arkuszem od dołu." }
  - { text: A page of its own, translation: Osobna strona }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "Tworzenie i edycja zastępują treść strony pod jedną nazwą adresu, więc adres mówi albo o nowym zadaniu, albo o zadaniu o tym kluczu, a Wstecz zamyka formularz. Powierzchnia jest zadeklarowana raz i nazwana przez oba." }

  # Filters.
  - { text: Every filter the collection accepts, translation: "Każdy filtr, który przyjmuje kolekcja" }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "Bez zapisanych pól pasek rysuje jedną kontrolkę na każdy filtr przyjmowany przez kolekcję, w jej kolejności i według właściwości modelu: listę dla wyliczenia lub wartości tak/nie, w pozostałych przypadkach pole do wpisania, i jedną etykietę nad dwiema granicami zakresu. Stoi nad tabelą, wybór stosuje od razu, a wpisany tekst po Enter, i niczego nie zachowuje między wizytami." }
  - { text: Every control, translation: Każda kontrolka }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "Każdy sposób wprowadzania filtra: wpisany tekst, opcje obok siebie, lista, wpisywane tagi, suwak, przełącznik i dwie daty pod jedną etykietą. Filtr projektu nie jest nigdzie rysowany i ustawia go tylko gotowy zestaw. Status zaczyna od wartości domyślnej, a gotowy zestaw ustawia filtry, które zestawy nazywają, i czyści pozostałe przez nie nazwane. Chipy podsumowują wybór, a wartości są częścią adresu. Poniżej progu pasek się zwija, a przypięty filtr tekstu zostaje poza zwiniętą częścią." }
  - { text: Urgent, translation: Pilne }
  - { text: Atlas only, translation: Tylko Atlas }
  - { text: Stuck, translation: Utknęło }
  - { text: "Beside, as chips, while typing", translation: "Obok, jako chipy, podczas pisania" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "Kontrolki stoją w kolumnie przy krawędzi początkowej. Widać tylko wybrane filtry: dodaj filtr z listy paska, a usunięcie go czyści. Każdy filtr jest chipem z nazwą wartości, który otwiera jego kontrolkę. Wpisany tekst działa po chwili przerwy, a dwie granice liczby mają podpisy po i przed. Wybór jest zachowany w tej przeglądarce między wizytami. Poniżej progu pasek otwiera się w arkuszu od dołu." }
  - { text: "Beside at the end, applied by a button", translation: "Obok, przy końcu, stosowane przyciskiem" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "Kontrolki stoją przy krawędzi końcowej, a zmiana czeka na Zastosuj, podczas gdy gotowy zestaw, Wyczyść i usunięcie chipa podsumowania działają od razu. Kilka osób wpisuje się po przecinku. Wybór jest zachowany tylko dla tej karty i przetrwa przeładowanie." }
  - { text: Due by October, translation: Termin do października }
  - { text: "Folded, starting open", translation: "Zwijane, na początku rozwinięte" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "Kontrolki zwijają się za przełącznikiem, który liczy filtry z wartością, i na początku są rozwinięte. Przypięty filtr tekstu zostaje poza zwiniętą częścią, a pozostałe dodaje się z listy paska. Status zaczyna od wartości w toku; usunięcie go czyści także tę wartość domyślną, a Wyczyść ją przywraca. Wartości są zachowane i w adresie, i w tej przeglądarce, przy czym wygrywa adres, a wybrane zwinięcie jest zapamiętywane." }
  - { text: "Folded, starting closed", translation: "Zwijane, na początku zwinięte" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "Na początku zwinięte. Przypięty filtr tekstu, Zastosuj i Wyczyść zostają poza zwiniętą częścią. Etykieta zaczyna od wartości domyślnej, błędów, dopóki nie zostanie zmieniona, a Wyczyść przywraca wartość domyślną." }
  - { text: In a dialog, translation: W oknie dialogowym }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "Kontrolki otwierają się w małym oknie z przycisku, który liczy filtry z wartością, i zamykają przyciskiem Gotowe. Otwarte okno jest częścią adresu, więc otwiera je odnośnik. Przypięty filtr tekstu zostaje obok przycisku, a chipy podsumowują wybór." }
  - { text: In a drawer, translation: W szufladzie }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "Kontrolki otwierają się w szufladzie od krawędzi początkowej, której kliknięcie obok nie zamyka. Wpisane wartości działają po chwili przerwy." }
  - { text: In a popover, translation: W dymku }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "Kontrolki otwierają się w karcie pod przyciskiem, wyrównanej do jego końca; poniżej progu w arkuszu od dołu." }

