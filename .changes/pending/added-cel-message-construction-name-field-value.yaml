units:
  templating: Added
  analyzer: Added
  packages/ide-support: Added
body: "CEL message construction (Name{field: value}) is read by the tag engines, the
  analyzer and the editor: a construction in a manifest is type-checked like any
  expression, and its field values are walked for reads. CEL_UNKNOWN_TYPE,
  CEL_TYPE_NOT_CONSTRUCTIBLE and CEL_MISSING_FIELD are reported through the templating
  layer."
