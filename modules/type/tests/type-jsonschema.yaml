kind: Telo.Application
metadata:
  name: TypeJsonSchemaTest
  version: 1.0.0
imports:
  Type: ..
  Run: ../../run
  JavaScript: ../../javascript
  Assert: ../../assert
targets:
  - !ref testTypeValidation
  - !ref testTypeRejection
  - !ref testTypeInheritance
  - !ref testCelRules
  - !ref testOutputTypeRejection
  - !ref testMultipleRules
  - !ref testMultipleExtends
  - !ref testExtendsComposition
---
# ─── Type definitions ──────────────────────────────────────────────────────────

kind: Type.JsonSchema
metadata:
  name: AdditionInput
schema:
  type: object
  required: [ a, b ]
  properties:
    a: { type: number }
    b: { type: number }
---
kind: Type.JsonSchema
metadata:
  name: AdditionOutput
schema:
  type: object
  required: [ sum ]
  properties:
    sum: { type: number }
---
kind: Type.JsonSchema
metadata:
  name: Entity
schema:
  type: object
  required: [ id ]
  properties:
    id: { type: string }
---
kind: Type.JsonSchema
metadata:
  name: NamedEntity
extends: Entity
schema:
  type: object
  required: [ name ]
  properties:
    name: { type: string }
---
# ─── Scripts ──────────────────────────────────────────────────────────────────

kind: JavaScript.Script
metadata:
  name: addNumbers
inputType: !ref AdditionInput
outputType: !ref AdditionOutput
code: |
  function main({ a, b }) {
    return { sum: a + b }
  }
---
kind: JavaScript.Script
metadata:
  name: identity
inputType: !ref NamedEntity
code: |
  function main(input) {
    return input
  }
---
kind: Type.JsonSchema
metadata:
  name: PositiveAmount
schema:
  type: object
  required: [ amount ]
  properties:
    amount: { type: number }
rules:
  - condition: "this.amount > 0"
    code: "ERR_NON_POSITIVE"
    message: "Amount must be positive"
---
kind: JavaScript.Script
metadata:
  name: processAmount
inputType: !ref PositiveAmount
code: |
  function main({ amount }) {
    return { doubled: amount * 2 }
  }
---
# ─── Test 1: valid input passes through ───────────────────────────────────────

kind: Run.Sequence
metadata:
  name: testTypeValidation
steps:
  - name: add
    inputs:
      a: 10
      b: 20
    invoke: !ref addNumbers
  - name: verifySum
    inputs:
      sum: "${{ steps.add.result.sum }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          sum:
            type: number
            const: 30
---
# ─── Test 2: invalid input is rejected ────────────────────────────────────────

kind: Run.Sequence
metadata:
  name: testTypeRejection
steps:
  - name: badInput
    try:
      - name: callWithString
        # Deliberately invalid, routed through CEL: a literal is rejected by
        # `telo check`, and this test is about the RUNTIME contract boundary.
        inputs:
          a: !cel "'not a number'"
          b: 5
        invoke: !ref addNumbers
    catch:
      - name: verifyError
        inputs:
          msg: "${{ error.message }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              msg:
                type: string
---
# ─── Test 3: type inheritance via extends ─────────────────────────────────────

kind: Run.Sequence
metadata:
  name: testTypeInheritance
steps:
  # NamedEntity extends Entity — requires both id and name
  - name: validInherited
    inputs:
      id: "abc-123"
      name: "Alice"
    invoke: !ref identity
  - name: verifyPassthrough
    inputs:
      id: "${{ steps.validInherited.result.id }}"
      name: "${{ steps.validInherited.result.name }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          id:
            type: string
            const: "abc-123"
          name:
            type: string
            const: "Alice"
  # Missing required 'id' from parent Entity should fail
  - name: missingParentField
    try:
      - name: callWithoutId
        # Deliberately invalid, routed through CEL: a literal is rejected by
        # `telo check`, and this test is about the RUNTIME contract boundary.
        # The whole map comes from one expression so the omission is only
        # visible at runtime — a statically-absent required input is a
        # `telo check` error, and this test is about the runtime boundary.
        inputs: !cel "{'name': 'Bob'}"
        invoke: !ref identity
    catch:
      - name: verifyInheritanceError
        inputs:
          msg: "${{ error.message }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              msg:
                type: string
---
# ─── Test 4: CEL rules ───────────────────────────────────────────────────────

kind: Run.Sequence
metadata:
  name: testCelRules
steps:
  # Valid: positive amount passes both schema and rule
  - name: validAmount
    inputs:
      amount: 42
    invoke: !ref processAmount
  - name: verifyDoubled
    inputs:
      doubled: "${{ steps.validAmount.result.doubled }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          doubled:
            type: number
            const: 84
  # Invalid: zero fails the "amount > 0" CEL rule
  - name: zeroAmount
    try:
      - name: callWithZero
        inputs:
          amount: 0
        invoke: !ref processAmount
    catch:
      - name: verifyRuleError
        inputs:
          msg: "${{ error.message }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              msg:
                type: string
                pattern: "Amount must be positive$"
---
# ─── Additional type definitions ──────────────────────────────────────────────

kind: Type.JsonSchema
metadata:
  name: NonNegativeAmount
schema:
  type: object
  required: [ amount ]
  properties:
    amount: { type: number }
rules:
  - condition: "this.amount >= 0"
    code: "ERR_NEGATIVE"
    message: "Amount must not be negative"
  - condition: "this.amount <= 1000"
    code: "ERR_OVER_LIMIT"
    message: "Amount exceeds limit of 1000"
---
kind: JavaScript.Script
metadata:
  name: processNonNegative
inputType: !ref NonNegativeAmount
code: |
  function main({ amount }) {
    return { result: amount }
  }
---
kind: Type.JsonSchema
metadata:
  name: Timestamped
schema:
  type: object
  required: [ updatedAt ]
  properties:
    updatedAt: { type: string }
---
kind: Type.JsonSchema
metadata:
  name: FullEntity
extends:
  - Entity
  - Timestamped
schema:
  type: object
  required: [ label ]
  properties:
    label: { type: string }
---
kind: JavaScript.Script
metadata:
  name: fullIdentity
inputType: !ref FullEntity
code: |
  function main(input) {
    return input
  }
---
kind: JavaScript.Script
metadata:
  name: badOutput
outputType: !ref AdditionOutput
code: |
  function main() {
    return { wrong: "field" }
  }
---
# ─── Test 5: outputType validation — wrong return shape ──────────────────────

kind: Run.Sequence
metadata:
  name: testOutputTypeRejection
steps:
  - name: badReturn
    try:
      - name: callBadOutput
        invoke: !ref badOutput
    catch:
      - name: verifyOutputError
        inputs:
          msg: "${{ error.message }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              msg:
                type: string
---
# ─── Test 6: multiple CEL rules — first passes, second fails ─────────────────

kind: Run.Sequence
metadata:
  name: testMultipleRules
steps:
  # Valid: 500 passes both rules (>= 0 and <= 1000)
  - name: validMid
    inputs:
      amount: 500
    invoke: !ref processNonNegative
  - name: verifyMid
    inputs:
      result: "${{ steps.validMid.result.result }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          result:
            type: number
            const: 500
  # Invalid: -1 fails the first rule
  - name: negativeAmount
    try:
      - name: callNegative
        inputs:
          amount: -1
        invoke: !ref processNonNegative
    catch:
      - name: verifyNegativeError
        inputs:
          msg: "${{ error.message }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              msg:
                type: string
                pattern: "Amount must not be negative$"
  # Invalid: 2000 passes first rule but fails second
  - name: overLimit
    try:
      - name: callOverLimit
        inputs:
          amount: 2000
        invoke: !ref processNonNegative
    catch:
      - name: verifyLimitError
        inputs:
          msg: "${{ error.message }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              msg:
                type: string
                pattern: "Amount exceeds limit of 1000$"
---
# ─── Test 7: multiple extends ────────────────────────────────────────────────

kind: Run.Sequence
metadata:
  name: testMultipleExtends
steps:
  # FullEntity extends [Entity, Timestamped] — requires id, updatedAt, label
  - name: validFull
    inputs:
      id: "x-1"
      updatedAt: "2026-01-01"
      label: "Test"
    invoke: !ref fullIdentity
  - name: verifyFull
    inputs:
      id: "${{ steps.validFull.result.id }}"
      label: "${{ steps.validFull.result.label }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          id:
            type: string
            const: "x-1"
          label:
            type: string
            const: "Test"
  # Missing updatedAt from Timestamped parent
  - name: missingTimestamp
    try:
      - name: callWithoutTimestamp
        # Whole map from one expression: the omission is only visible at
        # runtime, which is the boundary this test is about.
        inputs: !cel "{'id': 'x-2', 'label': 'Oops'}"
        invoke: !ref fullIdentity
    catch:
      - name: verifyTimestampError
        inputs:
          msg: "${{ error.message }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              msg:
                type: string
---
# ─── Test 8: extends preserves composition keywords (allOf) ───────────────────

kind: Type.JsonSchema
metadata:
  name: Scored
extends: Entity
schema:
  type: object
  required: [ score ]
  properties:
    score: { type: integer }
  # A constraint that the merged object shape alone does not capture — it must
  # survive `extends`, not be dropped.
  allOf:
    - properties:
        score: { minimum: 10 }
---
kind: JavaScript.Script
metadata:
  name: useScored
inputType: !ref Scored
code: |
  function main(input) { return input }
---
kind: Run.Sequence
metadata:
  name: testExtendsComposition
steps:
  # Valid: id (inherited) present, score satisfies the allOf minimum.
  - name: validScore
    inputs:
      id: "x"
      score: 15
    invoke: !ref useScored
  - name: verifyValid
    inputs:
      score: !cel "steps.validScore.result.score"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          score: { const: 15 }
        required: [ score ]
  # Invalid: score 5 passes the merged object shape but violates the inherited
  # allOf minimum — must be rejected (regression: extends used to drop allOf).
  - name: lowScore
    try:
      - name: callLowScore
        # Deliberately invalid, routed through CEL: a literal is rejected by
        # `telo check`, and this test is about the RUNTIME contract boundary.
        inputs:
          id: "x"
          score: !cel "5"
        invoke: !ref useScored
    catch:
      - name: verifyCompositionError
        inputs:
          msg: !cel "error.message"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              msg:
                type: string
            required: [ msg ]
