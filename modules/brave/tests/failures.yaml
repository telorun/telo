# Every failure is a contract code, whatever the client's settings, and the raw
# HTTP status never escapes: SUBSCRIPTION_TOKEN_INVALID is
# ERR_SEARCH_ACCESS_DENIED, QUOTA_LIMITED is ERR_SEARCH_QUOTA_EXCEEDED, 429 is
# ERR_SEARCH_RATE_LIMITED, and any other error — a 422 from the engine's own
# mapping included — a body that is not Brave's search response, and an
# unreachable API are ERR_SEARCH_FAILED. A client with `throwOnHttpError` maps
# the same way.
kind: Telo.Application
metadata:
  name: BraveFailuresTest
  version: 1.0.0
imports:
  Brave: ..
  Http: ../../http-client
  Server: ../../http-server
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref failures
---
kind: Brave.WebSearchEngine
metadata: { name: engine }
request:
  kind: Http.Request
  client: { kind: Http.Client, baseUrl: "http://localhost:18850" }
---
kind: Brave.WebSearchEngine
metadata: { name: throwingEngine }
request:
  kind: Http.Request
  client: { kind: Http.Client, baseUrl: "http://localhost:18850", throwOnHttpError: true }
---
# Nothing listens on this port.
kind: Brave.WebSearchEngine
metadata: { name: unreachableEngine }
request:
  kind: Http.Request
  client: { kind: Http.Client, baseUrl: "http://localhost:18851", timeout: 2000 }
---
kind: Run.Value
metadata: { name: errors }
value:
  denied: { status: 422, code: SUBSCRIPTION_TOKEN_INVALID, detail: The provided subscription token is invalid. }
  quota: { status: 429, code: QUOTA_LIMITED, detail: The monthly quota is exhausted. }
  limited: { status: 429, code: RATE_LIMITED, detail: Request rate limit exceeded for plan. }
  invalid: { status: 422, code: VALIDATION, detail: Unable to validate request parameter(s). }
  broken: { status: 500, code: INTERNAL, detail: Something went wrong. }
---
kind: Run.Sequence
metadata: { name: failures }
with:
  - kind: Server.Api
    metadata: { name: FakeBrave }
    routes:
      - request:
          path: /res/v1/web/search
          method: GET
          schema:
            query: { type: object, additionalProperties: true }
        handler: !ref errors
        returns:
          - status: 422
            when: !cel "request.query.q in ['denied', 'invalid']"
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel "{'type': 'ErrorResponse', 'error': result[request.query.q]}"
          - status: 429
            when: !cel "request.query.q in ['quota', 'limited']"
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel "{'type': 'ErrorResponse', 'error': result[request.query.q]}"
          - status: 500
            when: !cel "request.query.q == 'broken'"
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: !cel "{'type': 'ErrorResponse', 'error': result.broken}"
          - status: 200
            when: !cel "request.query.q == 'html'"
            content:
              text/html:
                body: "<html><body>results</body></html>"
          - status: 200
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body: { type: search }
  - kind: Server.Server
    metadata: { name: FakeServer }
    port: 18850
    mounts:
      - path: /
        mount: !ref FakeBrave
targets:
  - !ref FakeServer
steps:
  - name: outcomes
    invoke:
      kind: Run.Projection
      collection:
        - { engine: plain, query: denied }
        - { engine: plain, query: quota }
        - { engine: plain, query: limited }
        - { engine: plain, query: invalid }
        - { engine: plain, query: broken }
        - { engine: plain, query: html }
        - { engine: plain, query: other }
        - { engine: throwing, query: denied }
        - { engine: throwing, query: quota }
        - { engine: throwing, query: limited }
        - { engine: throwing, query: broken }
        - { engine: unreachable, query: anything }
      steps:
        - name: attempt
          try:
            - name: pick
              switch: !cel "item.engine"
              cases:
                plain:
                  - name: plainSearch
                    invoke: !ref engine
                    inputs: { query: !cel "item.query" }
                throwing:
                  - name: throwingSearch
                    invoke: !ref throwingEngine
                    inputs: { query: !cel "item.query" }
              default:
                - name: unreachableSearch
                  invoke: !ref unreachableEngine
                  inputs: { query: !cel "item.query" }
          catch:
            - name: caught
              value:
                code: !cel "error.code"
                message: !cel >-
                  error.message.startsWith('The request to Brave failed: ')
                    ? 'The request to Brave failed: …' : error.message
      outputs: !cel "steps.caught.result"
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.outcomes.result"
      expected:
        - code: ERR_SEARCH_ACCESS_DENIED
          message: "Brave rejected the subscription token: The provided subscription token is invalid."
        - code: ERR_SEARCH_QUOTA_EXCEEDED
          message: "Brave's quota is used up: The monthly quota is exhausted."
        - code: ERR_SEARCH_RATE_LIMITED
          message: "Brave asks the caller to slow down: Request rate limit exceeded for plan."
        - code: ERR_SEARCH_FAILED
          message: "Brave answered HTTP 422: VALIDATION Unable to validate request parameter(s)."
        - code: ERR_SEARCH_FAILED
          message: "Brave answered HTTP 500: INTERNAL Something went wrong."
        - code: ERR_SEARCH_FAILED
          message: Brave answered 200 with a body that is not its search response.
        - code: ERR_SEARCH_FAILED
          message: Brave answered 200 with a body that is not its search response.
        - code: ERR_SEARCH_ACCESS_DENIED
          message: "Brave rejected the subscription token: The provided subscription token is invalid."
        - code: ERR_SEARCH_QUOTA_EXCEEDED
          message: "Brave's quota is used up: The monthly quota is exhausted."
        - code: ERR_SEARCH_RATE_LIMITED
          message: "Brave asks the caller to slow down: Request rate limit exceeded for plan."
        - code: ERR_SEARCH_FAILED
          message: "Brave answered HTTP 500: INTERNAL Something went wrong."
        - code: ERR_SEARCH_FAILED
          message: "The request to Brave failed: …"
