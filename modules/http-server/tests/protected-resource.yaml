kind: Telo.Application
metadata:
  name: ProtectedResourceTest
  version: 1.0.0
  description: |
    A mount declaring `protectedResource:` serves its RFC 9728 metadata without
    authentication, derived from its verifiers and sources: the resource is the
    mount's address and path, the authorization servers are the verifiers' issuers
    (each once), and the bearer methods come from the sources. Every 401 of that
    mount names the document; a mount without the key serves none and names none.
    A mount at the root serves the document at the bare well-known path, and a
    mount whose only verifier declares no issuer serves one without
    `authorization_servers`.
include: [./__fixtures__/authentication/keys.yaml]
imports:
  Http: ../
  HttpClient: ../../http-client
  Assert: ../../assert
  AuthBearer: ../../auth-bearer
  Auth: ../../auth
  Jose: ../../jose
targets:
  - !ref test
---
kind: AuthBearer.Jwt
metadata: { name: tokens }
keys: !ref issuerKeys
issuer: https://login.test
algorithms: [ES256]
audience: !cel "[resource]"
---
kind: Auth.TrustedHeader
metadata: { name: gateway }
---
kind: Http.Api
metadata: { name: api }
routes:
  - request: { path: /me, method: GET }
    returns: [{ status: 204 }]
---
kind: HttpClient.Client
metadata: { name: client }
baseUrl: http://127.0.0.1:8975
throwOnHttpError: false
---
kind: HttpClient.Client
metadata: { name: rootClient }
baseUrl: http://127.0.0.1:8976
throwOnHttpError: false
---
kind: HttpClient.Client
metadata: { name: gatewayClient }
baseUrl: http://127.0.0.1:8978
throwOnHttpError: false
---
kind: HttpClient.Request
metadata: { name: gatewayCall }
client: !ref gatewayClient
---
kind: HttpClient.Request
metadata: { name: call }
client: !ref client
---
kind: HttpClient.Request
metadata: { name: rootCall }
client: !ref rootClient
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: Http.Server
    metadata: { name: server }
    listen: { address: 127.0.0.1, port: 8975 }
    mounts:
      - path: /api
        mount: !ref api
        authentication:
          verifiers:
            - verifier: !ref tokens
              from: { kind: Http.FromAuthorization, schemes: [Bearer] }
            - verifier: !ref tokens
              from: { kind: Http.FromQuery, parameter: access_token, scheme: Bearer }
        protectedResource:
          scopesSupported: [orders:read, orders:write]
          resourceName: Orders API
          resourceDocumentation: https://docs.test/orders
      - path: /plain
        mount: !ref api
        authentication:
          verifiers:
            - verifier: !ref tokens
              from: { kind: Http.FromAuthorization, schemes: [Bearer] }
  - kind: Http.Server
    metadata: { name: rootServer }
    listen: { address: 127.0.0.1, port: 8976 }
    mounts:
      - path: /
        mount: !ref api
        authentication:
          verifiers:
            - verifier: !ref tokens
              from: { kind: Http.FromAuthorization, schemes: [Bearer] }
        protectedResource: {}
  - kind: Http.Server
    metadata: { name: gatewayServer }
    listen: { address: 127.0.0.1, port: 8978 }
    trustProxy: true
    mounts:
      - path: /
        mount: !ref api
        authentication:
          verifiers:
            - verifier: !ref gateway
              from: { kind: Http.FromForwardedIdentity, header: x-user, scheme: Proxy }
        protectedResource: {}
targets:
  - !ref server
  - !ref rootServer
  - !ref gatewayServer
steps:
  - name: document
    invoke: !ref call
    inputs: { url: /.well-known/oauth-protected-resource/api }
  - name: refused
    invoke: !ref call
    inputs: { url: /api/me }
  - name: plainDocument
    invoke: !ref call
    inputs: { url: /.well-known/oauth-protected-resource/plain }
  - name: plainRefused
    invoke: !ref call
    inputs: { url: /plain/me }
  - name: rootDocument
    invoke: !ref rootCall
    inputs: { url: /.well-known/oauth-protected-resource }
  - name: rootRefused
    invoke: !ref rootCall
    inputs: { url: /me }
  - name: gatewayDocument
    invoke: !ref gatewayCall
    inputs: { url: /.well-known/oauth-protected-resource }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        document:
          status: !cel "steps.document.result.status"
          type: !cel "steps.document.result.headers['content-type'].split(';')[0]"
          body: !cel "steps.document.result.body"
        refused:
          status: !cel "steps.refused.result.status"
          challenge: !cel "steps.refused.result.headers['www-authenticate']"
        plainDocument: !cel "steps.plainDocument.result.status"
        plainRefused: !cel "steps.plainRefused.result.headers['www-authenticate']"
        rootDocument: !cel "steps.rootDocument.result.body"
        rootRefused: !cel "steps.rootRefused.result.headers['www-authenticate']"
        gatewayDocument: !cel "steps.gatewayDocument.result.body"
      expected:
        document:
          status: 200
          type: application/json
          body:
            resource: http://127.0.0.1:8975/api
            authorization_servers: ["https://login.test"]
            bearer_methods_supported: [header, query]
            scopes_supported: ["orders:read", "orders:write"]
            resource_name: Orders API
            resource_documentation: https://docs.test/orders
        refused:
          status: 401
          challenge: 'Bearer resource_metadata="http://127.0.0.1:8975/.well-known/oauth-protected-resource/api"'
        plainDocument: 404
        plainRefused: Bearer
        rootDocument:
          resource: http://127.0.0.1:8976/
          authorization_servers: ["https://login.test"]
          bearer_methods_supported: [header]
        rootRefused: 'Bearer resource_metadata="http://127.0.0.1:8976/.well-known/oauth-protected-resource"'
        gatewayDocument: { resource: http://127.0.0.1:8978/ }
