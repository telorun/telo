# Invokes the library's `hostRef`. Its entry-scoped check is silent about the
# library's scope members, so the kernel refuses the member when the scope opens.
kind: Telo.Application
metadata:
  name: ScopeMemberHostRefApp
  version: 1.0.0
imports:
  Lib: ./lib
targets:
  - name: probe
    invoke: !ref Lib.hostRef
