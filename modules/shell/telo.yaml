kind: Telo.Library
metadata:
  name: shell
  version: 0.7.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Compute]
  description: >-
    Runs shell commands and programs against a configurable execution target: to
    completion, returning captured output and exit code, or streaming output as it
    arrives for long-running work. Commands take stdin, a per-call environment
    overlay, a working directory and a kill timeout, and can bypass shell parsing
    entirely so untrusted values cannot inject.
exports:
  kinds:
    - Host
    - Command
    - CommandStream
    - LocalHost
---
# Shell.Host — the abstract execution target every driver implements. A
# Telo.Provider whose instance exposes the spawn primitive the operations call.
# Consumers (Shell.Command / Shell.CommandStream) reference it via
# `x-telo-ref: Self.Host`; a concrete implementation (Shell.LocalHost,
# or a future ShellSsh.Host) satisfies the ref. The host owns command
# composition — `<shell> -c <command>`, env merge, and cwd — so the operations
# stay backend-agnostic.
kind: Telo.Abstract
metadata:
  name: Host
  description: >-
    Where shell commands run — the local machine, a remote host over SSH, a container,
    a cluster pod. It owns how a command line is composed, which interpreter runs it,
    the working directory it starts in and the base environment per-call overlays
    merge over, so the commands themselves stay independent of the target.
capability: Telo.Provider
---
kind: Telo.Definition
metadata:
  name: Command
  description: >-
    Runs a shell command or a program to completion and returns its captured output,
    error output and exit code. Give it a command line to interpret, or an argument
    list to execute directly with no shell parsing so untrusted values cannot inject.
    A non-zero exit is returned rather than raised, so the caller decides what it
    means.
capability: Telo.Invocable
controllers:
  - pkg:npm/@telorun/shell@0.3.1?local_path=./nodejs#shell-command
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    oneOf:
      - required: [command]
      - required: [args]
    properties:
      command:
        title: Command
        description: Shell command line, run as `<shell> -c <command>` on the host. Mutually exclusive with `args`.
        type: string
        minLength: 1
      args:
        title: Argv
        description: >-
          Program plus arguments, executed DIRECTLY without a shell (`args[0]`
          is the program). An argument is never reinterpreted as shell syntax,
          so an untrusted value (e.g. a file path) cannot inject. Mutually
          exclusive with `command`.
        type: array
        minItems: 1
        items: { type: string }
      env:
        title: Environment overlay
        description: >-
          Per-call environment variables, merged over the host's base env. A
          `null` value UNSETS an inherited variable (e.g. to keep a secret out
          of the child).
        type: object
        additionalProperties: { type: [string, "null"] }
      stdin:
        title: Stdin
        description: Written to the command's stdin, which is then closed.
        type: string
      timeoutMs:
        title: Timeout (ms)
        description: Kill the command and fail after this many milliseconds.
        type: integer
        minimum: 1
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [stdout, stderr, exitCode]
    properties:
      stdout: { type: string }
      stderr: { type: string }
      exitCode:
        description: The command's exit status. A non-zero code is returned, not thrown.
        type: integer
schema:
  type: object
  additionalProperties: false
  required: [host]
  properties:
    host:
      title: Host
      description: Reference to the Shell.Host the command runs on.
      x-telo-ref: Self.Host
  examples:
    - host: !ref Local
---
# Streaming variant. Forwards stdout/stderr as they arrive plus a terminal
# exit/error record on `result.output` per the streaming-Invocable convention.
# Display-oriented: there is no declarative path to a scalar exitCode — for
# pass/fail control flow use Shell.Command.
kind: Telo.Definition
metadata:
  name: CommandStream
  description: >-
    Runs a shell command and emits its output and error output as they arrive,
    followed by a terminal record carrying the exit code or the failure. For tailing
    or live-rendering long-running commands; when the exit code has to drive control
    flow, run the command to completion instead.
capability: Telo.Invocable
controllers:
  - pkg:npm/@telorun/shell@0.3.1?local_path=./nodejs#shell-command-stream
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    oneOf:
      - required: [command]
      - required: [args]
    properties:
      command:
        title: Command
        description: Shell command line, run as `<shell> -c <command>` on the host. Mutually exclusive with `args`.
        type: string
        minLength: 1
      args:
        title: Argv
        description: >-
          Program plus arguments, executed DIRECTLY without a shell (`args[0]`
          is the program). Mutually exclusive with `command`.
        type: array
        minItems: 1
        items: { type: string }
      env:
        title: Environment overlay
        description: >-
          Per-call environment variables, merged over the host's base env. A
          `null` value UNSETS an inherited variable.
        type: object
        additionalProperties: { type: [string, "null"] }
      stdin:
        title: Stdin
        description: Written to the command's stdin, which is then closed.
        type: string
      timeoutMs:
        title: Timeout (ms)
        description: Kill the command and fail after this many milliseconds.
        type: integer
        minimum: 1
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-stream: true
        description: >-
          Async iterable of records: `{type: stdout|stderr, chunk}` then a
          terminal `{type: exit, exitCode, signal}` or `{type: error, error}`.
schema:
  type: object
  additionalProperties: false
  required: [host]
  properties:
    host:
      title: Host
      description: Reference to the Shell.Host the command runs on.
      x-telo-ref: Self.Host
  examples:
    - host: !ref Local
---
# Shell.LocalHost — the bundled local driver. Runs commands via Node
# child_process on the local host. `cwd` sets the working directory commands
# start in; it is NOT a security boundary (a shell string can `cd` away, use
# absolute paths, or spawn children). Real isolation comes from where the host
# runs (the runner sandbox), not this field.
kind: Telo.Definition
metadata:
  name: LocalHost
  description: >-
    Runs commands on the machine the application itself runs on, configuring the
    working directory they start in, the shell interpreter, and a base environment
    that per-call overlays merge over. The working directory is not a sandbox.
capability: Telo.Provider
extends: Self.Host
controllers:
  - pkg:npm/@telorun/shell@0.3.1?local_path=./nodejs#local-host
schema:
  type: object
  additionalProperties: false
  properties:
    cwd:
      title: Working directory
      description: Directory commands start in (default the process working directory). Not a security boundary.
      type: string
    shell:
      title: Shell interpreter
      description: PATH name or absolute path of the interpreter. Default `/bin/sh` on POSIX, `%ComSpec%` on Windows.
      type: string
    env:
      title: Base environment
      description: >-
        Base environment variables for every command, under the per-call
        overlay. A `null` value UNSETS an inherited variable (e.g. to keep a
        secret out of every child spawned on this host).
      type: object
      additionalProperties: { type: [string, "null"] }
  examples:
    - cwd: ./workspace
    - shell: /bin/bash
      env:
        CI: "true"
