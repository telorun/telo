modules:
  apps/authoring-agent: Added
body: "The agent runs with reasoning on. Its model resource is an
  `OpenAI.ResponsesModelStream` rather than a chat-completions one, because
  `/v1/chat/completions` refuses a non-`none` reasoning effort alongside function tools
  and this agent is nothing but tools — so it previously had to run with reasoning off,
  which measurably cost it on structural work. The encrypted reasoning rides the
  contract's `providerState` and `Ai.AgentStream` replays it, so thinking survives each
  tool loop instead of restarting every turn. A new `REASONING_EFFORT` variable
  (`minimal` | `low` | `medium` | `high`, default `medium`) is the operator's dial: it
  trades answer quality against latency and spend on every turn, and `minimal` restores
  the previous behaviour without editing the manifest."
