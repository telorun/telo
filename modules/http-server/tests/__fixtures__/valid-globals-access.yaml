kind: Telo.Library
metadata:
  name: ValidGlobalsAccess
  version: 1.0.0
imports:
  Http: ../..
  Run: ../../../run
variables:
  apiKey:
    type: string
---
kind: Run.Value
metadata:
  name: handler
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      key: { type: string }
value: { ok: true }
---
kind: Http.Api
metadata:
  name: testApi
routes:
  - request:
      path: /test
      method: GET
    handler: !ref handler
    inputs:
      key: "${{ variables.apiKey }}"
    returns:
      - status: 200
        content:
          application/json:
            body:
              ok: "${{ result.ok }}"
