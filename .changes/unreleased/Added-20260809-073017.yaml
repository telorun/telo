project: fs
kind: Added
body: Fs.FileWrite and Fs.TreeSync accept raw bytes as content, alongside the existing
  utf8 and base64 string forms. A Uint8Array handed over by a byte-producing resource
  — a generated image, a decoded payload — is now written as it is, with no base64
  round trip and no JS.Script hop in between. encoding does not apply to raw bytes
  and is ignored for them.
