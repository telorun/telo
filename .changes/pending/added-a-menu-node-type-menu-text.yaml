modules:
  modules/ui: Added
body: "A menu node: { type: menu, text, items } is a button labelled text that opens a
  list of link nodes. Choosing an item follows its href exactly as clicking that link
  would — a declared page within the application, anything else by a load — under the
  same address rule, a literal refused by telo check and a computed one turning the menu
  into an error node for that request. An item whose style holds strong is the current
  choice; each item is delivered by its own when and drawn by its own shown, and a menu
  none of whose items is delivered is left out. It works anywhere a node does."
