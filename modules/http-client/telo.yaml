kind: Telo.Library
metadata:
  name: HttpClient
  version: 0.21.2
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Transport]
  description: >-
    Calls HTTP APIs: any method, with query parameters, headers and a JSON or string
    body, returning the status, headers and a parsed body. Shared connection settings
    — base URL, default headers, timeout, redirect handling — live in a reusable
    client that individual requests inherit. Bodies can be streamed and network
    failures retried.
exports:
  kinds:
    - ApiKeyHeader
    - BearerToken
    - Client
    - Credential
    - QueryKey
    - Request
---
# Http.Credential — how a client authenticates the requests made through it.
#
# The request about to be sent goes IN, so one abstract covers schemes that sign
# or key off the request itself (HMAC, SigV4, a key in a query parameter), not
# bearer tokens alone. What comes back is merged into the outgoing request.
#
# Invalidation is an INPUT, not a second operation: `forceRefresh: true` is what
# distinguishes the retry after a 401 from the first attempt. Each implementation
# decides what forcing means — a token credential bypasses its cache and
# refreshes, a static API key returns the same header unchanged. That keeps this
# a plain Telo.Invocable with one declared inputType, statically checkable and
# implementable in any language.
kind: Telo.Abstract
metadata:
  name: Credential
  description: >-
    Authenticates outbound HTTP requests: given the request about to be sent, it
    returns the headers or query parameters to merge into it. Covers bearer tokens,
    API keys and request-signing schemes alike, and can be asked to re-acquire a
    credential the server has just rejected.
capability: Telo.Invocable
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [request]
    properties:
      request:
        type: object
        additionalProperties: false
        required: [method, url]
        description: The request about to be sent, before this credential is applied.
        properties:
          method: { type: string }
          url: { type: string }
          headers:
            type: object
            additionalProperties: { type: string }
            # The request as it stands BEFORE this credential is applied already
            # carries the client's default headers — which is exactly where a
            # per-module `apiKey` field used to put its material. Marked on the
            # way IN for the same reason the result is marked on the way out.
            x-telo-sensitive: true
          query:
            type: object
            additionalProperties: { type: string }
            x-telo-sensitive: true
      forceRefresh:
        type: boolean
        default: false
        description: >-
          Re-acquire rather than reuse anything cached. Set on the single retry
          after a request was rejected as unauthenticated; the credential decides
          what re-acquiring means.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    description: What to merge into the outgoing request. Both members are optional.
    properties:
      headers:
        type: object
        additionalProperties: { type: string }
        # Auth material BY DEFINITION, and making a credential a dispatched
        # invocable turns it into an invoke OUTPUT — which rides the debug wire
        # on every call under `--inspect`, i.e. every watch session. Marked here
        # on the abstract, so every implementation inherits it rather than each
        # one remembering.
        x-telo-sensitive: true
        description: >-
          Headers to apply. They override the client's default headers, and are
          overridden in turn by a header the individual request sets, so an
          explicit per-call value is never silently replaced.
      query:
        type: object
        additionalProperties: { type: string }
        x-telo-sensitive: true
        description: Query parameters to apply, under the request's own by the same rule.
---
# The three credentials that are just a value the author already holds.
#
# Http.Credential had exactly one implementation — OAuth's — so every module
# talking to a keyed API grew its own `apiKey` field and applied it by hand,
# which is a second way to say the same thing and a second place for the 401
# retry to not happen. These cover what those fields were doing.
#
# Static means `forceRefresh` returns the same material, which the abstract
# already anticipates: re-acquiring a written-down value yields what it had, the
# retry fails again, and the error propagates — the key is wrong, not stale.
kind: Telo.Definition
metadata:
  name: BearerToken
  description: >-
    Authenticates requests with a fixed bearer token in the Authorization header, the
    scheme most HTTP APIs accept. The token is supplied from configuration, typically a
    secret, and is reused unchanged for every request.
capability: Telo.Invocable
extends: Self.Credential
controllers:
  - pkg:telo/local/js?path=./nodejs/http-client.mjs&local_path=./nodejs/src/index.ts#BearerTokenController
throws:
  codes:
    ERR_INVALID_CREDENTIAL:
      description: >-
        The configured material was absent or empty — typically a variable that
        resolved to `""`. Refused here rather than sent, which would surface as the
        server's 401 one indirection from the line that has to change.
schema:
  type: object
  additionalProperties: false
  required: [token]
  examples:
    - token: "${{ secrets.apiToken }}"
  properties:
    token:
      title: Token
      description: The token to send. Usually a secret, never a literal in a committed manifest.
      type: string
      x-telo-eval: compile
    scheme:
      title: Scheme
      description: >-
        The authorization scheme preceding the token. Defaults to `Bearer`; a handful of
        services spell the same header `Token`.
      type: string
      default: Bearer
---
kind: Telo.Definition
metadata:
  name: ApiKeyHeader
  description: >-
    Authenticates requests with a fixed key in a header the service names — `x-api-key`
    and its equivalents. The header name is configured alongside the key, so one kind
    serves every API that keys a header rather than the Authorization scheme.
capability: Telo.Invocable
extends: Self.Credential
controllers:
  - pkg:telo/local/js?path=./nodejs/http-client.mjs&local_path=./nodejs/src/index.ts#ApiKeyHeaderController
throws:
  codes:
    ERR_INVALID_CREDENTIAL:
      description: >-
        The configured material was absent or empty — typically a variable that
        resolved to `""`. Refused here rather than sent, which would surface as the
        server's 401 one indirection from the line that has to change.
schema:
  type: object
  additionalProperties: false
  required: [header, key]
  examples:
    - header: x-api-key
      key: "${{ secrets.apiKey }}"
  properties:
    header:
      title: Header
      description: Header name to carry the key, e.g. `x-api-key`.
      type: string
    key:
      title: Key
      description: The key to send. Usually a secret.
      type: string
      x-telo-eval: compile
    prefix:
      title: Prefix
      description: >-
        Text placed before the key in the header value, for services that expect one
        (`Token `, `ApiKey `). Omitted, the key is sent alone.
      type: string
---
kind: Telo.Definition
metadata:
  name: QueryKey
  description: >-
    Authenticates requests with a fixed key in a query parameter, the form older REST
    APIs and some AI endpoints require. Carried in the URL, so prefer a header where a
    service accepts one.
capability: Telo.Invocable
extends: Self.Credential
controllers:
  - pkg:telo/local/js?path=./nodejs/http-client.mjs&local_path=./nodejs/src/index.ts#QueryKeyController
throws:
  codes:
    ERR_INVALID_CREDENTIAL:
      description: >-
        The configured material was absent or empty — typically a variable that
        resolved to `""`. Refused here rather than sent, which would surface as the
        server's 401 one indirection from the line that has to change.
schema:
  type: object
  additionalProperties: false
  required: [parameter, key]
  examples:
    - parameter: key
      key: "${{ secrets.apiKey }}"
  properties:
    parameter:
      title: Parameter
      description: Query parameter name to carry the key, e.g. `key`.
      type: string
    key:
      title: Key
      description: The key to send. Usually a secret.
      type: string
      x-telo-eval: compile
---
kind: "Telo.Definition"
metadata:
  name: "Client"
  description: >-
    Holds shared HTTP connection settings — base URL, default headers such as
    Authorization, request timeout and redirect handling — as a reusable
    resource. It performs no calls itself; Request resources reference it and
    inherit these defaults, resolving their relative paths against the base URL
    and merging their own headers over the client's.
capability: Telo.Provider
controllers:
  - pkg:telo/local/js?path=./nodejs/http-client.mjs&local_path=./nodejs/src/index.ts#HttpClientController
schema:
  type: "object"
  examples:
    - baseUrl: https://jsonplaceholder.typicode.com
      headers:
        Authorization: Bearer token
      timeout: 10000
  properties:
    baseUrl:
      title: Base URL
      type: "string"
      description: "Base URL for all requests using this client"
    headers:
      title: Headers
      type: "object"
      additionalProperties:
        type: "string"
      description: "Default headers applied to all requests (e.g., Authorization)"
    timeout:
      title: Timeout
      type: "integer"
      minimum: 1
      default: 10000
      description: "Default timeout in milliseconds"
    followRedirects:
      title: Follow Redirects
      type: "boolean"
      default: true
      description: "Whether redirects should be followed automatically."
    throwOnHttpError:
      title: Throw On HTTP Error
      type: "boolean"
      description: >-
        Default for requests made through this client. An individual request
        overrides it.
    retry:
      title: Retry
      $ref: "telo://manifest#/$defs/RetryPolicy"
      description: >-
        Default retry policy for requests made through this client — the common
        case, since backoff is a property of the API being called rather than of
        one call. An individual request replaces it wholesale.
      properties:
        honorRetryAfter:
          type: boolean
          default: true
          description: >-
            Wait as long as a `Retry-After` header asks, when it asks for longer
            than the computed delay.
    credential:
      title: Credential
      x-telo-ref:
        kind: Self.Credential
        use: call
      description: >-
        Authenticates every request made through this client. The credential is
        consulted once per request; what it returns overrides the client's own
        default headers but not a header the individual request sets, so an
        explicit per-call value always wins. A response rejecting the request as
        unauthenticated re-consults it with forceRefresh and retries once.
---
kind: "Telo.Definition"
metadata:
  name: "Request"
  description: >-
    Performs an outbound HTTP call — GET, POST, PUT, PATCH, DELETE or any other method
    — with the URL, query parameters, headers and body supplied per invocation. The
    body may be text, JSON, raw bytes or a byte stream. Returns the status,
    lowercase-keyed headers and a body read as JSON, text, bytes or a stream. Which
    statuses count as success and which are worth retrying are declared per request,
    with exponential backoff and Retry-After honoured.
capability: Telo.Invocable
# The call contract. The request-parameter shape is spelled in two places that
# say different things: HERE it is what a CALLER may pass, and on `inputs:` below
# it is what an INSTANCE bakes in. They are not merged before validation — the
# kernel binds this contract and checks the caller's value before the controller
# layers the instance's values over it — which is exactly why nothing here is
# `required`: a request that bakes its own `url` is the commonest shape in the
# module, and requiring one would reject it. What the contract buys is type,
# unknown-key and type-argument checking on every call site; without it the
# step-input validator skips this kind entirely.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      url:
        type: string
        description: Absolute URL, or a path resolved against the client's base URL.
      method:
        type: string
        description: HTTP method. Defaults to GET.
      query:
        type: object
        additionalProperties: { type: string }
        # A key in a query parameter is the whole of what `Http.QueryKey` does,
        # and a per-call one is the same material by a different route.
        x-telo-sensitive: true
        description: Query parameters appended to the URL.
      headers:
        type: object
        additionalProperties: { type: string }
        # A per-call `Authorization` is the same token a credential would have
        # supplied, and it rides the wire on every request under `--inspect`.
        x-telo-sensitive: true
        description: Request headers, merged over the client's defaults.
      body:
        description: >-
          Payload to send. A string is sent as-is (or decoded first — see
          `bodyEncoding`); an object is serialized as JSON, or as a form body when
          the content type says so; bytes and byte streams are sent verbatim.
          `anyOf` rather than `oneOf`: a reader that does not know `x-telo-type`
          sees the byte and stream branches as empty schemas matching anything, so
          under `oneOf` a plain string would match several branches and fail.
        anyOf:
          - type: string
          - type: object
          - x-telo-type: Telo.Bytes
          - x-telo-type:
              name: Telo.Stream
              of: Telo.Bytes
      bodyEncoding:
        type: string
        enum: [utf8, base64]
        default: utf8
        description: >-
          How a STRING body is interpreted. `base64` decodes it to bytes before
          sending, which is the escape hatch when the payload reaches the manifest
          as text. Does not apply to bytes or a byte stream, which are sent as they
          are. Mirrors `Fs.FileWrite.encoding`.
      responseType:
        type: string
        enum: [json, text, bytes, stream]
        description: >-
          How to read the response body. `json` (default) parses when the content
          type says JSON and falls back to text; `text` always returns a string;
          `bytes` buffers the body as raw bytes, which is what a binary payload
          needs — reading one as text corrupts it; `stream` returns a byte stream
          without buffering. Chosen per call, unlike the deprecated `mode`.
controllers:
  - pkg:telo/local/js?path=./nodejs/http-client.mjs&local_path=./nodejs/src/index.ts#HttpRequestController
throws:
  codes:
    ERR_HTTP_STATUS:
      description: >-
        The response's status was not one `success` declares, under
        `throwOnHttpError`. Carries `status`, `url` and the response body, so a caller
        reads the server's own explanation rather than a status line.
    ERR_HTTP_BODY_NOT_REPLAYABLE:
      description: >-
        A retry or a credential re-send needed the request body a second time and it
        was a consumed stream. Raised rather than re-sending nothing, which would
        succeed against an empty payload.
    ERR_HTTP_CLASSIFIER_INVALID:
      description: A `success` or `retryOn` predicate evaluated to something other than a boolean.
    ERR_INVOKE_CANCELLED:
      description: The caller's cancellation token was signalled before or during the request.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [status, headers, body]
    properties:
      status:
        type: integer
        description: HTTP response status code.
      headers:
        type: object
        additionalProperties: { type: string }
        description: Response headers, normalized to lowercase keys (per §2 of the Response Contract).
      body:
        description: |
          Parsed JSON when content-type is application/json (or null on an empty body
          with a JSON content-type); raw string otherwise. Open shape — per-call
          narrowing is the manifest author's concern (use CEL or downstream
          Type kinds).
schema:
  type: "object"
  examples:
    - client: !ref PlaceholderApi
      throwOnHttpError: true
  properties:
    client:
      title: Client
      x-telo-ref:
        kind: Self.Client
        use: dependency
      description: "Reference to an Http.Client resource. Injected as a live instance at runtime; its baseUrl, headers, and timeout supply per-request defaults."
    timeout:
      title: Timeout
      type: "integer"
      minimum: 1
      description: "Overrides the client or default timeout (in ms)"
    throwOnHttpError:
      title: Throw On HTTP Error
      type: "boolean"
      default: false
      description: >-
        Whether a response classified as a failure raises. `success` decides WHICH
        responses those are; this decides what happens to them, so the two are
        orthogonal and neither implies the other.
    success:
      title: Success
      description: >-
        Which responses count as successful — a list of status codes, or a CEL
        boolean over `status`, `headers` and `body`. Defaults to `status < 400`.
        A successful response is never retried and is never followed as a
        redirect, which is what lets a resumable upload declare
        `success: [200, 201, 308]` and have its 308 returned rather than chased.
        `body` is null when the response is streamed, so a predicate reading it
        must guard for null — the analyzer requires the guard.
      anyOf:
        - type: array
          items: { type: integer }
        - type: boolean
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
          status: { type: integer }
          headers:
            type: object
            additionalProperties: { type: string }
          body:
            type: ["object", "array", "string", "number", "boolean", "null"]
    retryOn:
      title: Retry On
      description: >-
        Which FAILED responses are worth retrying — a list of status codes, or a
        CEL boolean over the same scope as `success`. Consulted only for responses
        `success` already rejected. Defaults to 408, 429, 500, 502, 503 and 504
        when `retry.attempts` is non-zero. A predicate is what expresses a failure
        whose meaning is in the body rather than the status.
      anyOf:
        - type: array
          items: { type: integer }
        - type: boolean
      x-telo-eval: runtime
      x-telo-context:
        type: object
        properties:
          inputs: {}
          status: { type: integer }
          headers:
            type: object
            additionalProperties: { type: string }
          body:
            type: ["object", "array", "string", "number", "boolean", "null"]
    retry:
      title: Retry
      # The shared policy plus the one field only a RESPONSE can supply. Merging
      # the sibling at the `$ref` is what keeps this schema CLOSED — `allOf`
      # cannot, since a branch only ever sees its own `properties`.
      $ref: "telo://manifest#/$defs/RetryPolicy"
      description: >-
        How a retryable failure is re-attempted. Network failures are retried
        whatever `retryOn` says; a response is retried when `retryOn` accepts it.
      properties:
        honorRetryAfter:
          type: boolean
          default: true
          description: >-
            Wait as long as a `Retry-After` header asks, when it asks for longer
            than the computed delay. The server's number is better information
            than any local curve.
    retries:
      title: Retries
      $ref: "telo://manifest#/$defs/RetryAttempts"
      description: >-
        DEPRECATED — use `retry.attempts`, which this sets when `retry` is absent.
        Kept because a migration entry matches a literal document kind and a
        consumer writes `kind: <TheirAlias>.Request`, so no core entry can rewrite
        it.
    mode:
      title: Mode
      type: "string"
      enum: ["buffer", "stream"]
      default: "buffer"
      description: >-
        DEPRECATED — use the per-call `responseType`, which this maps onto
        (`buffer` → `json`, `stream` → `stream`) when a call declares none. Being
        config rather than an input is the defect: a kind wrapping Http.Request
        cannot vary it per call. Kept for the same reason as `retries`.
    inputs:
      title: Inputs
      type: "object"
      description: >-
        Request parameters baked into this instance, layered UNDER whatever a call
        passes. Spelled out here as well as in `inputType` because the two say
        different things — this is what the instance supplies, that is what a
        caller may pass — and nothing merges them before the contract is validated.
      examples:
        - url: https://jsonplaceholder.typicode.com/todos/1
          method: GET
        - url: https://jsonplaceholder.typicode.com/posts
          method: POST
          body:
            title: Hello
            body: World
            userId: 1
      properties:
        url:
          title: URL
          type: "string"
          description: "Absolute URL, or relative path if 'client' is provided"
        method:
          title: Method
          type: "string"
          default: "GET"
          description: "HTTP method to use for the request."
        query:
          title: Query
          type: "object"
          description: "Query parameters to be appended to the URL"
          additionalProperties:
            type: "string"
        headers:
          title: Headers
          type: "object"
          description: "Request-specific headers (merges with client headers)"
          additionalProperties:
            type: "string"
        body:
          title: Body
          description: >-
            Payload to send. Same shape and same reason for `anyOf` as the `inputType`
            contract's `body`.
          anyOf:
            - type: "string"
            - type: "object"
            - x-telo-type: Telo.Bytes
            - x-telo-type:
                name: Telo.Stream
                of: Telo.Bytes
        bodyEncoding:
          title: Body Encoding
          type: string
          enum: [utf8, base64]
          description: How a string `body` is interpreted. See the `inputType` contract.
        responseType:
          title: Response Type
          type: string
          enum: [json, text, bytes, stream]
          description: How to read the response body. See the `inputType` contract.
      required: ["url"]
