# A reference slot a choice fills with a value it does not take: refused only
# where the choice writes it.
kind: Telo.Application
metadata: { name: ReferenceInvalidChoice }
variables: { flag1: { env: FLAG_1, type: boolean, default: false } }
targets:
  - !ref main
---
kind: Telo.Definition
metadata: { name: Holder }
capability: Telo.Runnable
controllers: [pkg:telo/local/js?path=./probe.mjs#Probe]
schema:
  type: object
  properties: { target: { x-telo-ref: { kind: Telo.Runnable, use: call } } }
---
kind: Self.Holder
metadata: { name: main }
target: !if
  if: !cel "variables.flag1"
  then: { label: none }
  else: !ref other
---
kind: Telo.Sequence
metadata: { name: other }
steps:
  - { name: done, value: 1 }
