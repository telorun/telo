# A `!ref` to a resource of a kind declaring a `name` field, forwarded by a
# template body's bare `self.target`, stays a reference: the body's entry
# invokes `square`, whose `name` is `plaza`, and no declaration is extracted
# from the forwarded value.
kind: Telo.Application
metadata:
  name: RefNameFieldForwarded
  version: 1.0.0
imports:
  Names: ./kinds
  Run: ../../../../modules/run
  Assert: ../../../../modules/assert
targets:
  - !ref main
---
kind: Names.Named
metadata:
  name: square
name: plaza
---
kind: Run.Sequence
metadata:
  name: main
steps:
  - name: forwarded
    invoke: { kind: Names.Forward, target: !ref square }
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.forwarded.result"
      expected: { name: plaza }
