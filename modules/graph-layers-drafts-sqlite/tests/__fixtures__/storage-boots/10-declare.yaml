kind: Telo.Application
metadata:
  name: DraftedStorageBoots
  version: 1.0.0
  description: |
    Boot 1 — the schema creates each drafted table with the author's columns, the
    bookkeeping columns the table kind adds, and its indexes: unique per layer,
    key and state on a node table; unique per layer, pair and state, plus a
    target-leading one, on a relationship table. The two bookkeeping tables hold
    only internal columns, and the one-open-draft index is partial and unique.
    The store then publishes one draft, so the next boot has rows to find intact.
imports:
  Sql: ../../../../sql
  SQLite: ../../../../sqlite
  Graph: ../../../../graph
  GraphLayers: ../../../../graph-layers
  Layers: ../../..
  Run: ../../../../run
  Assert: ../../../../assert
variables:
  dbFile: { env: DRAFTED_STORAGE_BOOTS_DB, type: string, x-telo-type: Telo.HostPath, default: ./.telo/drafted-storage-boots.db }
targets:
  - !ref appSchema
  - !ref test
---
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.dbFile"
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
version: !cel "module.version"
tables: [!ref people, !ref knowsTable, !ref graphLayers, !ref graphDrafts]
---
kind: Sql.Query
metadata: { name: read }
connection: !ref db
---
kind: Assert.Equals
metadata: { name: check }
---
# What the author declares: the node's own columns, and nothing of the drafts.
kind: Layers.NodeTable
metadata: { name: people }
table: people
key: id
columns:
  id: { type: text, nullable: false }
  name: { type: text }
indexes:
  people_by_name: { columns: [name] }
---
kind: Layers.RelationshipTable
metadata: { name: knowsTable }
table: knows
sourceColumn: source
targetColumn: target
columns:
  source: { type: text, nullable: false }
  target: { type: text, nullable: false }
---
# The two bookkeeping tables: the author names each and nothing else.
kind: Layers.LayersTable
metadata: { name: graphLayers }
table: graph_layers
---
kind: Layers.DraftsTable
metadata: { name: graphDrafts }
table: graph_drafts
---
kind: Layers.Node
metadata: { name: person }
table: !ref people
key: id
---
kind: Layers.Relationship
metadata: { name: knows }
table: !ref knowsTable
source: !ref person
target: !ref person
sourceColumn: source
targetColumn: target
---
kind: Layers.Store
metadata: { name: team }
connection: !ref db
schema: !ref appSchema
layer: team
nodes: [!ref person]
relationships: [!ref knows]
layers: !ref graphLayers
drafts: !ref graphDrafts
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: peopleColumns
    invoke: !ref read
    inputs:
      sql: "SELECT name, \"notnull\" AS required FROM pragma_table_info('people') ORDER BY cid"
  - name: assertPeopleColumns
    invoke: !ref check
    inputs:
      actual: !cel "steps.peopleColumns.result.rows"
      expected:
        - { name: id, required: 1 }
        - { name: name, required: 0 }
        - { name: graph_layer, required: 1 }
        - { name: graph_state, required: 1 }
        - { name: graph_effect, required: 1 }
        - { name: graph_revision, required: 0 }
        - { name: graph_over, required: 0 }
        - { name: graph_written_at, required: 1 }
        - { name: graph_resolution, required: 0 }
        - { name: graph_resolved_by_type, required: 0 }
        - { name: graph_resolved_by_id, required: 0 }
  - name: bookkeepingColumns
    invoke: !ref read
    inputs:
      sql: >-
        SELECT 'graph_layers' AS tbl, group_concat(name, ',') AS cols FROM pragma_table_info('graph_layers')
        UNION ALL
        SELECT 'graph_drafts', group_concat(name, ',') FROM pragma_table_info('graph_drafts')
  - name: assertBookkeepingColumns
    invoke: !ref check
    inputs:
      actual: !cel "steps.bookkeepingColumns.result.rows"
      expected:
        - { tbl: graph_layers, cols: "id,name,head_revision,created_at,created_by_type,created_by_id" }
        - tbl: graph_drafts
          cols: "id,public_id,layer_id,parent_revision,message,created_at,created_by_type,created_by_id,published_at,published_by_type,published_by_id,discarded_at,discarded_by_type,discarded_by_id,revision,open_slot"
  - name: indexes
    invoke: !ref read
    inputs:
      sql: >-
        SELECT l.tbl_name AS tbl, l.name AS name, i."unique" AS uniq, i.partial AS partial,
          (SELECT group_concat(c.name, ',') FROM pragma_index_info(l.name) c) AS cols
        FROM sqlite_master l JOIN pragma_index_list(l.tbl_name) i ON i.name = l.name
        WHERE l.type = 'index' AND l.sql IS NOT NULL
          AND l.tbl_name IN ('people', 'knows', 'graph_layers', 'graph_drafts') ORDER BY l.name
  - name: assertIndexes
    invoke: !ref check
    inputs:
      actual: !cel "steps.indexes.result.rows"
      expected:
        - { tbl: graph_drafts, name: graph_graph_drafts_open, uniq: 1, partial: 1, cols: "layer_id,open_slot" }
        - { tbl: knows, name: graph_knows_layer_pair, uniq: 1, partial: 0, cols: "graph_layer,graph_state,source,target" }
        - { tbl: knows, name: graph_knows_layer_target, uniq: 0, partial: 0, cols: "graph_layer,graph_state,target,source" }
        - { tbl: people, name: graph_people_layer_key, uniq: 1, partial: 0, cols: "graph_layer,graph_state,id" }
        - { tbl: people, name: people_by_name, uniq: 0, partial: 0, cols: "name" }
  - name: assertNothingTombstoned
    invoke: !ref check
    inputs:
      actual: !cel "resources.appSchema.status.tombstoned"
      expected: []
  - name: assertNothingHeld
    invoke: !ref check
    inputs:
      actual: !cel "resources.appSchema.status.pendingReclamation"
      expected: []
  - name: open
    invoke:
      kind: GraphLayers.OpenDraft
      store: !ref team
    inputs: { message: kept across boots }
  - name: stage
    inputs: { draft: !cel "steps.open.result.draft.id" }
    invoke:
      kind: GraphLayers.DraftSession
      store: !ref team
      inputs: { draft: !cel "inputs.draft" }
      steps:
        - name: create
          invoke:
            kind: Graph.CreateNode
            store: !ref team
            node: !ref person
          inputs: { key: kept, properties: { name: Kept } }
  - name: publish
    invoke:
      kind: GraphLayers.Publish
      store: !ref team
    inputs: { draft: !cel "steps.open.result.draft.id" }
