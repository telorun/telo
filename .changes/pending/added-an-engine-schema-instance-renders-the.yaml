modules:
  modules/sql: Added
  modules/sqlite: Added
  modules/postgres: Added
body: "An engine Schema instance renders the current instant:
  SqlInstantSchema.currentInstant() answers the SQL expression for the moment the
  statement holding it runs, in the storage form of that engine's timestamp column -
  clock_timestamp() for a PostgreSQL timestamptz, fixed-width UTC text
  (YYYY-MM-DDTHH:MM:SS.sssZ) on SQLite, so a plain comparison of the column is
  chronological. A consumer recording database time writes instants only through it and
  refuses a schema instance without the member (rendersCurrentInstant). The sql code
  library also exports readInt64Column, which reads a 64-bit integer column exactly
  whether the driver hands it over as a number, a bigint or decimal text,
  readTimestampColumn, which reads a driver date or that fixed-width text, and what
  builds the fragments-and-values argument of a connection's executeTemplate:
  SqlFragments (statement text with a bound value in every gap), sqlComparison (one
  comparison over eq, ne, lt, lte, gt and gte, where a null value under eq or ne renders
  IS NULL or IS NOT NULL) and sqlWhere (the WHERE joiner). The PostgreSQL docs state
  which storage classes the driver does not return as the type a table projects - date,
  timestamp, timestamptz and interval as host objects, bigint and numeric as text - and
  that a consumer typed from the projection refuses them."
