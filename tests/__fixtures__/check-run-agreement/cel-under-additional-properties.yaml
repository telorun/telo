# A CEL value at a key described only through `additionalProperties` — a
# response header map, or a kind's `schema.properties` (whose `description`
# may be prose quoting `${{ … }}`, as published modules do — read as
# `!interpolate` once migrated). Both halves must take the map's value schema
# for the stand-in.
kind: Telo.Application
metadata:
  name: CelUnderAdditionalProperties
imports:
  Run: ../../../modules/run
targets:
  - !ref main
---
kind: Telo.Definition
metadata:
  name: Labelled
capability: Telo.Invocable
schema:
  type: object
  properties:
    labels:
      type: object
      x-telo-eval: compile
      additionalProperties: { type: string }
    token:
      type: string
      x-telo-eval: compile
      description: !interpolate The token to send; typically `${{ secrets.token }}`.
invoke: !ref echo
resources:
  - kind: Run.Value
    metadata:
      name: echo
    value: !cel "self.labels"
---
kind: Run.Sequence
metadata:
  name: main
steps:
  - name: labelled
    invoke:
      kind: Self.Labelled
      labels:
        region: !cel "'eu-' + 'west'"
      token: fixed
