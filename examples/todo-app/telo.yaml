kind: Telo.Application
metadata:
  name: TodoApp
  version: 1.0.0
  categories: [ Transport, Storage, UI ]
  description: |
    A complete app served as one unit, with no hand-written frontend: the REST
    todo API (one Crud.Resource over the `todos` table) and an admin UI declared
    in the same manifest (UiReact.App) — a filterable, sortable, paged table with
    create, edit and delete — on a single port. The UI and the API share one
    model, so renaming a property is a `telo check` error rather than a broken page.
# The UI modules are not published yet, so every import is the workspace's own
# copy. They become pinned `oci://` refs, like every other example's, once they
# are released.
imports:
  Http: ../../modules/http-server
  Sql: ../../modules/sql
  SQLite: ../../modules/sqlite
  Crud: ../../modules/crud
  Ui: ../../modules/ui
  UiReact: ../../modules/ui-react
targets:
  - !ref migrate
  - !ref server
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8077
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: Telo.HostPath
    default: todo.db
---
# One shape for a todo. The API validates request bodies against it and the UI
# derives its columns, filters and form fields from it.
kind: Telo.JsonSchema
metadata:
  name: Todo
schema:
  type: object
  # Both are required: a todo is always either done or not, so a write that
  # leaves `isDone` out is refused rather than storing an unknown state.
  required: [ text, isDone ]
  additionalProperties: false
  properties:
    text: { type: string, title: Task, minLength: 1 }
    isDone: { type: boolean, title: Done }
---
kind: SQLite.Connection
metadata:
  name: db
file: !cel "variables.dbFile"
---
kind: SQLite.Table
metadata:
  name: todos
table: todos
columns:
  id: { type: integer, primaryKey: true, identity: always }
  text: { type: text, nullable: false }
  is_done: { type: integer, nullable: false, default: 0 }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
tables:
  - !ref todos
---
kind: Ui.Theme
metadata:
  name: theme
tokens:
  color.accent: "#1f8fff"
  radius.md: 6px
---
# The whole frontend. `/` is one line — table, filters, and the create / edit
# form all come from the model. `/done` is the same thing written out by hand,
# which is what you drop down to when a screen needs something of its own: here
# a fixed filter, chosen columns and a row style.
kind: UiReact.App
metadata:
  name: ui
title: Todos
lang: en
theme: !ref theme
pages:
  - path: /
    title: Todos
    children:
      - type: composite
        ref: { kind: Crud.Ui, model: !ref Todo, basePath: /api/todos }
  - path: /done
    title: Done
    children:
      - { type: text, text: Finished todos, style: heading }
      - type: composite
        ref:
          kind: Ui.Table
          model: !ref Todo
          source: { basePath: /api/todos, filters: { isDone: true } }
          rowStyle:
            by: !cel "row.isDone"
            cases: { "true": muted }
          columns:
            - header: Task
              value: !cel "row.text"
          delete: true
---
kind: Http.Server
metadata:
  name: server
port: !cel "ports.http"
openapi:
  info:
    title: Todo API
    version: 1.0.0
mounts:
  - path: /api/todos
    mount:
      # The entire REST API: CRUD over the `todos` table. Mounted at /api/todos, it
      # serves GET / (a filterable, sortable, paged list), GET /{id}, POST /,
      # PUT /{id} (replace) and DELETE /{id}.
      kind: Crud.Resource
      connection: !ref db
      plural: todos
      singular: todo
      # The model is the request contract too: a POST without `text` or `isDone`,
      # or with a property that isn't here, is rejected with a 400 before the
      # database is touched. `isDone` reads and writes the snake_case column `is_done`.
      model: !ref Todo

  - path: /
    mount: !ref ui
