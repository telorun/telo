  modules/tesseract: Fixed
body: "A duration-valued field is read again: a duration is identified by a type key and
  carries no methods, so these controllers read one through durationNanos and build one
  with celDurationFromNanos instead of naming a class the CEL value domain no longer has
  — which failed at resource creation with 'isCelDuration is not defined', a missing
  'Duration' export, or 'value.getMilliseconds is not a function'."
