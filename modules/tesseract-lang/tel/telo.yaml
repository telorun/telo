    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/tel.traineddata.gz:
        { upstream: tel, member: package/4.0.0_best_int/tel.traineddata.gz, sha256: 8b478895dfc1f5d6baee6f8e6cf84a873793dd8948124315437ff2dc38d49fe4, executable: false }
