  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/hun.traineddata.gz:
        { upstream: hun, member: package/4.0.0_best_int/hun.traineddata.gz, sha256: 99feb1ac618ddd39942d646f1df792e5bd4504df45e1ef68e47df51db476a2ed, executable: false }
---
kind: TesseractModel.Language
metadata:
