project: vector-store-pgvector
kind: Fixed
body: 'Statements this store runs against Postgres now emit a `debug` log record each, plus
  records for transaction start, commit and rollback. The behaviour comes from
  `SqlConnectionBase` in the shared sql library, whose source is inlined into this module''s
  bundled controller — so the published artifact changed without any file under this module
  changing. Bound parameters are never logged, so an embedding vector never reaches a log.
  Republished so an import pinned to this module resolves to bytes that match the shared
  library it was built from.'
