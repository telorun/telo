name: Release VS Code Extension

# Packages the Telo VS Code extension and publishes it from the branch's Publish
# run, which calls this workflow on every channel that released a CLI:
#   candidate   the `.vsix` is an asset of the GitHub pre-release `v<cli version>`;
#               the Marketplace accepts only `major.minor.patch`, so it gets none.
#               The `.vsix` bundles its own engine, and the editor's version
#               catalog never selects a candidate engine.
#   final/patch the same asset, and the VS Code Marketplace — moved only forward.
#
# `telo-vscode` is a private workspace member, so changesets versions it but never
# publishes it and it never lands in `publishedPackages`. The release signal is its
# `package.json` version field moving in the release commit (`release-commit.mjs`:
# the tag's commit, or its first parent when that is a publication commit), which happens
# when a Version PR merges (including the automatic `updateInternalDependencies`
# bumps that follow an analyzer/kernel release). A run where it did not move
# packages nothing. Recovery is a re-run of the Publish run.
#
# The links in the packed README resolve to the release tag `v<cli version>`, the
# tag whose tree this `.vsix` is built from.

on:
  workflow_call:
    inputs:
      channel:
        description: 'candidate, final or patch.'
        type: string
        required: true
      version:
        description: 'The CLI version released.'
        type: string
        required: true
      tag:
        description: 'The release tag (v<version>), checked out, whose draft release the .vsix is attached to.'
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find the release commit
        id: release-commit
        run: node scripts/release-commit.mjs HEAD

      - name: Check extension version
        id: check
        env:
          RELEASE_COMMIT: ${{ steps.release-commit.outputs.release-commit }}
        run: |
          set -euo pipefail
          NEW=$(jq -r .version ide/vscode/package.json)
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

          OLD=$(git show "${RELEASE_COMMIT}^:ide/vscode/package.json" 2>/dev/null | jq -r .version || echo "")
          if [ "$NEW" != "$OLD" ]; then
            echo "Extension version changed: ${OLD:-<none>} -> $NEW"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Extension version unchanged ($NEW); nothing to package."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the release scripts' dependencies
        if: steps.check.outputs.release == 'true' && inputs.channel != 'candidate'
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      - name: Does the Marketplace move forward
        id: pointers
        if: steps.check.outputs.release == 'true' && inputs.channel != 'candidate'
        run: node scripts/release-pointers.mjs --version "${{ inputs.version }}" --channel "${{ inputs.channel }}"

      - name: Setup pnpm
        if: steps.check.outputs.release == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.check.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      # The `vsix` script builds its own workspace dependencies (analyzer,
      # ide-support, kernel) before esbuild, so no separate workspace build is
      # needed. It writes a fixed-name file that the CI packaging smoke check in
      # test.yml also relies on; the release asset is renamed rather than the
      # script changed, so both callers keep one code path.
      - name: Package the extension
        if: steps.check.outputs.release == 'true'
        env:
          TELO_PACK_LINKS_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pnpm --filter "./ide/vscode" vsix
          mv ide/vscode/telo-vscode.vsix \
             "ide/vscode/telo-vscode-${{ steps.check.outputs.version }}.vsix"

      - name: Attach the .vsix to the release
        if: steps.check.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-assets.mjs "${{ inputs.tag }}" "ide/vscode/telo-vscode-${{ steps.check.outputs.version }}.vsix"

      # `--skip-duplicate` so a re-run of the Publish run finds the version
      # already there and succeeds.
      - name: Publish to the VS Code Marketplace
        if: steps.check.outputs.release == 'true' && steps.pointers.outputs.latest == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          # Optional: without it the .vsix is only attached to the release, for a manual Marketplace upload.
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set, so the Marketplace is not published to; upload telo-vscode-${{ steps.check.outputs.version }}.vsix from the release by hand."
            exit 0
          fi
          pnpm --filter "./ide/vscode" exec vsce publish --skip-duplicate \
            --packagePath "telo-vscode-${{ steps.check.outputs.version }}.vsix"
