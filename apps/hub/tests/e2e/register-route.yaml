kind: Telo.Application
metadata:
  name: HubE2ERegisterRoute
  version: 1.0.0
  description: |
    End-to-end tests for the hub's open self-service registration verb
    (POST /register), run against a live hub at http://localhost:8040. Covers
    the validate-and-schedule success path (a reachable Telo module returns 202
    and its status reaches `ready`), the inline-error path (an unresolvable ref
    returns 400 with a reason, never tracked), the two rejection gates, and a
    Telo.Application: accepted, indexed with its declared contract, found only
    when a search asks for applications, and never offered as a ref to import.

    The application is `examples/agent-console` at a fixed commit of the
    repository, read over its raw GitHub URL, so the contract asserted here
    cannot move under the test.

    202, not 200: the ref is validated and recorded synchronously while the
    indexing itself is a durable run, so "accepted" is what the response can
    honestly claim. `GET /register/status?ref=` is what says when the module is
    actually searchable.
imports:
  McpClient: oci://ghcr.io/telorun/mcp-client@0.15.2#sha256-wicFctlATYrfVNE-E0yzAEVdUhj7rHb_omPubvzyLbU
  Yaml: oci://ghcr.io/telorun/yaml@0.10.3#sha256-xgWF987hJC2tA6q4SP3BUhSzZz2eSbVmVUK4DVOGupk
  Timer: oci://ghcr.io/telorun/timer@0.8.3#sha256-OlGVb6Q4aFilkXVAiB9ZK6V0aF6l-Th1jHxzUuGnYZw
  HttpClient: oci://ghcr.io/telorun/http-client@0.22.3#sha256-OtxM1NSmRcDovSy6N_tkX-pIwtty4MMwj-RPDO0QH1s
  Run: oci://ghcr.io/telorun/run@0.27.1#sha256-O1CdVvYs_O7Zj-PNQxMS3NdgWL6e8M2A0J9Wu0rTnIU
  Assert: oci://ghcr.io/telorun/assert@0.20.1#sha256-mnAbFggBHChh_rXaSbeEjj8y1PHyY-y42YGO2TgAClQ
targets:
  - !ref register_ValidRefSucceeds
  - !ref register_StatusReachesReady
  - !ref register_InvalidRefReturns400
  - !ref register_LocalPathRejected
  - !ref register_NonModuleRefused
  - !ref register_ApplicationAccepted
---
# A reachable Telo module (the seeded console module) validates and registers.
# Re-registering an already-tracked ref is idempotent (INSERT ... ON CONFLICT
# DO NOTHING), so this stays green regardless of prior runs.
kind: Run.Sequence
metadata: { name: register_ValidRefSucceeds }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: PostValidRegister }
      url: http://localhost:8040/register
      method: POST
      # Still network-bound even though indexing is asynchronous: the ref is
      # VALIDATED synchronously, which is two origin round trips (`module
      # versions`, `module manifest`), each a `telo` subprocess doing an
      # anonymous OCI token handshake. The client's 10s default is marginal
      # against that on a loaded CI runner.
      timeout: 30000
      body:
        ref: oci://ghcr.io/telorun/console
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertValidRegister }
      schema:
        type: object
        properties:
          status: { const: 202 }
          body:
            type: object
            properties:
              registered: { const: true }
              ref: { const: oci://ghcr.io/telorun/console }
              status: { const: pending }
            required: [registered, ref, status]
        required: [status, body]
---
# The other half of the 202 contract: what was accepted actually becomes
# searchable. Polls `/register/status?ref=` until the module reports `ready`,
# which is what the SPA does after a submission.
#
# The poll and the ASSERTION are separate steps, and that separation is the
# test: `Run.Loop` exhausting `maxIterations` merely stops, so an assertion
# inside the body behind `if ready` never runs when the pipeline never becomes
# ready — and a test whose only assertion did not run is a green test. The loop
# returns the last body it saw and the sequence asserts on that, so exhaustion
# fails on the status it actually observed.
kind: Run.Sequence
metadata: { name: register_StatusReachesReady }
steps:
  - name: poll
    invoke: !ref pollRegisterStatus
  - name: assert
    inputs:
      status: !cel "steps.poll.result.status"
      body: !cel "steps.poll.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertRegisterStatusReady }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              ref: { const: oci://ghcr.io/telorun/console }
              status: { const: ready }
              # At least the latest version is indexed, which is what `ready`
              # claims.
              versionsIngested: { type: integer, minimum: 1 }
              latestVersion: { type: string, minLength: 1 }
            required: [ref, status, versionsIngested, latestVersion]
        required: [status, body]
---
# Bounded: a cold ingest is a manifest read, a bucket put and an embedding call,
# none of which the request path waits for any more. `outputs:` carries the LAST
# response out of the loop so the caller can assert on it whether the loop
# finished early or ran out of budget.
kind: Run.Loop
metadata: { name: pollRegisterStatus }
maxIterations: 30
condition: !cel "iteration == 0 || previous.status.result.body.status != 'ready'"
steps:
  - name: wait
    invoke: { kind: Timer.Delay }
    inputs:
      duration: 2s
  - name: status
    invoke:
      kind: HttpClient.Request
      metadata: { name: GetRegisterStatus }
      url: http://localhost:8040/register/status?ref=oci%3A%2F%2Fghcr.io%2Ftelorun%2Fconsole
      method: GET
      timeout: 10000
outputs:
  status: !cel "steps.status.result.status"
  body: !cel "steps.status.result.body"
---
# An unresolvable ref fails validation → 400 with an inline reason, never
# inserted for tracking.
kind: Run.Sequence
metadata: { name: register_InvalidRefReturns400 }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: PostInvalidRegister }
      url: http://localhost:8040/register
      method: POST
      # Reaches the network too: the ref clears the shape gate, so the hub tries
      # to resolve it before deciding it is unregisterable.
      timeout: 30000
      body:
        ref: e2e/nonexistent-module-xyz
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertInvalidRegister }
      schema:
        type: object
        properties:
          status: { const: 400 }
          body:
            type: object
            properties:
              error: { type: string, minLength: 1 }
            required: [error]
        required: [status, body]
---
# Security boundary: a local/path-like ref must be rejected by the shape gate
# BEFORE any CLI subprocess runs. The CLI resolves a cwd-resolvable ref as a
# local manifest read off disk, so without the gate this endpoint would be a
# filesystem existence oracle. An existing and a non-existing path must be
# indistinguishable in the response.
kind: Run.Sequence
metadata: { name: register_LocalPathRejected }
steps:
  - name: existing
    invoke:
      kind: HttpClient.Request
      metadata: { name: PostLocalExisting }
      url: http://localhost:8040/register
      method: POST
      body:
        ref: /etc/passwd
  - name: missing
    invoke:
      kind: HttpClient.Request
      metadata: { name: PostLocalMissing }
      url: http://localhost:8040/register
      method: POST
      body:
        ref: /etc/telo-e2e-definitely-absent
  - name: assert
    inputs:
      existingStatus: !cel "steps.existing.result.status"
      missingStatus: !cel "steps.missing.result.status"
      # Identical bodies ⇒ no existence oracle.
      identical: !cel "json(steps.existing.result.body) == json(steps.missing.result.body)"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertLocalPathRejected }
      schema:
        type: object
        properties:
          existingStatus: { const: 400 }
          missingStatus: { const: 400 }
          identical: { const: true }
        required: [existingStatus, missingStatus, identical]
---
# A file with no module document is refused before anything is recorded: the
# origin read cannot name a version of it. This is the CLI's refusal, reached
# before the hub's own root-kind check, which only a file whose first document is
# not a module doc while a later one is would reach.
kind: Run.Sequence
metadata: { name: register_NonModuleRefused }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: PostNonModuleRef }
      url: http://localhost:8040/register
      method: POST
      timeout: 30000
      body:
        ref: https://raw.githubusercontent.com/telorun/telo/f2ac6357f1a4844afb1ff7b946d6176dd63f0d23/tests/__fixtures__/non-library-import-target.yaml
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      error: !cel "steps.hit.result.body.error"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertNonModuleRefused }
      schema:
        type: object
        properties:
          status: { const: 400 }
          error: { type: string, pattern: "declares no metadata\\.version" }
        required: [status, error]
---
# An application registers like a library and is indexed by what it asks of
# whoever runs it. Search offers it only to a caller that asks for applications,
# and the ref completions — which offer refs to import — never do.
kind: Run.Sequence
metadata: { name: register_ApplicationAccepted }
steps:
  - name: register
    invoke:
      kind: HttpClient.Request
      metadata: { name: PostApplicationRef }
      url: http://localhost:8040/register
      method: POST
      timeout: 30000
      body:
        ref: https://raw.githubusercontent.com/telorun/telo/f2ac6357f1a4844afb1ff7b946d6176dd63f0d23/examples/agent-console/telo.yaml
  - name: poll
    invoke:
      kind: Run.Loop
      maxIterations: 30
      condition: !cel "iteration == 0 || previous.status.result.body.status != 'ready'"
      steps:
        - name: wait
          invoke: { kind: Timer.Delay }
          inputs:
            duration: 2s
        - name: status
          invoke:
            kind: HttpClient.Request
            metadata: { name: GetApplicationStatus }
            url: http://localhost:8040/register/status?ref=https%3A%2F%2Fraw.githubusercontent.com%2Ftelorun%2Ftelo%2Ff2ac6357f1a4844afb1ff7b946d6176dd63f0d23%2Fexamples%2Fagent-console%2Ftelo.yaml
            method: GET
            timeout: 10000
      outputs:
        status: !cel "steps.status.result.status"
        body: !cel "steps.status.result.body"
  - name: detail
    invoke:
      kind: HttpClient.Request
      metadata: { name: GetApplicationDetail }
      url: http://localhost:8040/module?ref=https%3A%2F%2Fraw.githubusercontent.com%2Ftelorun%2Ftelo%2Ff2ac6357f1a4844afb1ff7b946d6176dd63f0d23%2Fexamples%2Fagent-console%2Ftelo.yaml
      method: GET
  - name: byDefault
    invoke:
      kind: HttpClient.Request
      metadata: { name: SearchApplicationByDefault }
      url: "http://localhost:8040/search/resources?q=agent%20console"
      method: GET
  - name: asApplication
    invoke:
      kind: HttpClient.Request
      metadata: { name: SearchApplicationEntry }
      url: "http://localhost:8040/search/resources?q=agent%20console&entry=application"
      method: GET
  - name: allThree
    invoke:
      kind: HttpClient.Request
      metadata: { name: SearchEveryEntry }
      url: "http://localhost:8040/search/resources?q=console&entry=kind&entry=instance&entry=application"
      method: GET
  - name: refs
    invoke:
      kind: HttpClient.Request
      metadata: { name: RefsForApplication }
      url: http://localhost:8040/refs?q=agent-console
      method: GET
  - name: suggest
    invoke:
      kind: McpClient.ToolsCall
      metadata: { name: SuggestApplicationRef }
      client:
        kind: McpClient.HttpClient
        url: http://localhost:8040/mcp
        clientInfo: { name: telo-test, version: 1.0.0 }
    inputs:
      name: suggest_module_refs
      arguments:
        query: agent-console
  - name: suggested
    invoke: { kind: Yaml.Parse }
    inputs:
      text: !cel "steps.suggest.result.content[0].text"
  - name: assert
    inputs:
      actual:
        registered: !cel "steps.register.result.status"
        status: !cel "steps.poll.result.body.status"
        application: !cel "steps.detail.result.body.application"
        kinds: !cel "steps.detail.result.body.kinds"
        exportedResources: !cel "steps.detail.result.body.exportedResources"
        runtime: !cel "steps.detail.result.body.module.runtime"
        inDefaultSearch: !cel >-
          steps.byDefault.result.body.hits.exists(h, h.module.ref.endsWith('/examples/agent-console/telo.yaml'))
        applicationHits: !cel >-
          steps.asApplication.result.body.hits
            .filter(h, h.module.ref.endsWith('/examples/agent-console/telo.yaml'))
            .map(h, [h.entry, h.name, h.kind, h.kindRef, h.capability, h.runtime])
        entriesRanked: !cel >-
          ['kind', 'instance', 'application'].map(t,
            steps.allThree.result.body.hits.exists(h, h.entry == t))
        refs: !cel >-
          steps.refs.result.body.refs.filter(r, r.ref.endsWith('/examples/agent-console/telo.yaml')).size()
        suggested: !cel >-
          steps.suggested.result.docs[0].refs.filter(r, r.ref.endsWith('/examples/agent-console/telo.yaml')).size()
      expected:
        registered: 202
        status: ready
        application:
          variables:
            - name: historyFile
              description: ""
              required: false
              env: HISTORY_FILE
              default: ./tmp/agent-history.sqlite
              arg: null
              schema: { type: string, x-telo-type: Telo.HostPath }
          secrets:
            - name: openaiApiKey
              description: ""
              required: true
              env: OPENAI_API_KEY
              schema: { type: string }
          ports: []
        kinds: []
        exportedResources: []
        runtime: null
        inDefaultSearch: false
        applicationHits:
          - [application, AgentConsole, Application, "", "", null]
        entriesRanked: [true, true, true]
        refs: 0
        suggested: 0
    invoke:
      kind: Assert.Equals
