# A table and a list offering a row an action that draws an answer, bound from
# the row. Neither is refused, and every rule runs on both.
kind: Telo.Library
metadata:
  name: UiRowActions
  version: 1.0.0
  description: >-
    Test fixture: a table and a list whose row actions are bound from the row,
    over actions that draw their answer.
imports:
  Ui: ../../../
  DataModel: ../../../../data-model
---
kind: Telo.JsonSchema
metadata:
  name: Todo
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
    text: { type: string }
    count: { type: integer }
---
kind: Telo.JsonSchema
metadata:
  name: Removal
schema:
  type: object
  additionalProperties: false
  required: [count]
  properties:
    count: { type: integer }
---
kind: Ui.CollectionPresentation
metadata: { name: todos }
source:
  kind: Ui.CollectionSource
  basePath: /api/todos
  collection:
    kind: DataModel.Collection
    model: !ref Todo
    query:
      filters: []
      sort: []
---
kind: Ui.Action
metadata:
  name: remove
inputModel: !ref Removal
source: { path: /api/todos/remove }
label: Remove
---
kind: Ui.Action
metadata:
  name: removeAndShow
inputModel: !ref Removal
outputModel:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      receipt: { type: string, format: uri-reference }
source: { path: /api/todos/remove }
label: Remove
result: { type: value, value: !cel "result.receipt", text: Receipt }
onSuccess: { refreshes: [/api/todos] }
---
kind: Ui.Listing
metadata:
  name: listless
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref remove
    inputs: { count: !cel "row.count" }
---
kind: Ui.Listing
metadata:
  name: answered
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref removeAndShow
    inputs: { count: !cel "row.count" }
    enabled: { at: !cel "row.count", matches: { minimum: 1 }, disabledText: Nothing to remove. }
---
kind: Ui.Data
metadata:
  name: listed
model:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      todos: { type: array, items: !ref Todo }
source: { path: /api/todos }
content:
  type: list
  rows: !cel "data.todos"
  columns: [{ value: !cel "row.text" }]
  rowActions:
    - action: !ref removeAndShow
      inputs: { count: !cel "row.count" }
