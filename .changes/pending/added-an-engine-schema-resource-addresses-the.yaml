modules:
  modules/sql: Added
  modules/postgres: Added
  modules/sqlite: Added
body: "An engine schema resource addresses the tables it lists for consumers: its
  instance renders the qualified, quoted name of a listed table from its own namespace
  and the engine's quoting (PostgreSQL qualifies with the schema's namespace, SQLite
  names the bare table), so a consumer reading or writing those tables no longer depends
  on the connection's search_path. Engine implementers add the new required member to
  their schema instance."
