name: Cut release

# Creates `release/<major>.<minor>` at the main commit it is dispatched on and
# dispatches the branch's Publish, which opens the first Version PR. Main is not
# changed: the branch carries the pending changesets and module fragments, and they
# leave main through the merge-backs.
#
# This file lives on main only: GitHub dispatches a workflow present on the default
# branch, and the branch it creates carries its own Publish.

on:
  workflow_dispatch:

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Cut
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        id: check
        run: node scripts/release-branch.mjs cut-check --ref "$GITHUB_REF_NAME"

      # TELO_BOT_TOKEN creates the ref and dispatches: both made with the default token
      # would trigger nothing, and the rulesets let only the release workflows create
      # `release/*` refs. Only these two steps see it.
      - name: Create the branch
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ steps.check.outputs.release }}
        run: |
          BRANCH="release/$RELEASE"
          if have=$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null); then
            if [ "$have" != "$GITHUB_SHA" ]; then
              echo "::error::Error: $BRANCH already exists at $have, not at $GITHUB_SHA."
              exit 1
            fi
            echo "$BRANCH already exists at $GITHUB_SHA."
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f "ref=refs/heads/$BRANCH" -f "sha=$GITHUB_SHA"
            echo "Created $BRANCH at $GITHUB_SHA."
          fi

      # The new branch's own Publish opens its first Version PR.
      - name: Dispatch Publish on the branch
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ steps.check.outputs.release }}
        run: gh workflow run publish.yml --ref "release/$RELEASE"
