kind: Telo.Library
metadata:
  name: Ui
  version: 0.10.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [UI]
  description: >-
    Declarative user interfaces written as data: pages, records read when a
    page opens, record listings drawn as tables, cards, kanban boards,
    calendars, timelines or trees with paging, row actions and related records
    shown by name, live-validated forms with pickers, filter bars with counts,
    custom components and design tokens — rendered into an admin panel or
    back-office screen without frontend code.
requires:
  # 0.128.0 refuses this file: it knows neither `Telo.KeyedTranslations`, which
  # declares `ui`'s own texts, nor `x-telo-text-keys`. Verified by execution.
  telo: ">=0.129.0"
lang: en
# The conformance rows a renderer's tests read: the interpreted profile's,
# which control fits which property, and what a listing's read plan requests.
files: [conformance/match.json, conformance/control-fits.json, conformance/listing-reads.json, conformance/addresses.json, conformance/current-location.json, conformance/refreshes.json]
# ui's own texts translated, one `Self.Translations` per language.
include: [./translations/de.yaml, ./translations/es.yaml, ./translations/fr.yaml, ./translations/hi.yaml, ./translations/it.yaml, ./translations/ja.yaml, ./translations/ko.yaml, ./translations/nl.yaml, ./translations/pl.yaml, ./translations/pt.yaml, ./translations/ru.yaml, ./translations/tr.yaml, ./translations/uk.yaml, ./translations/zh.yaml]
imports: { Font: ../font, DataModel: ../data-model, Conversation: ../conversation }
exports:
  kinds: [Translations, Composite, Surface, Overlay, ViewportOverlay, Dialog, Drawer, Popover, InlineSurface, Panel, PageSurface, FilterPlacement, FoldingFilterPlacement, AbovePlacement, AsidePlacement, CollapsiblePlacement, OverlayPlacement, StateStore, LocalStore, SessionStore, NavigationPlacement, CompactNavigationPlacement, HeaderNavigation, SidebarNavigation, OverlayNavigation, TabBarNavigation, Icon, FileIcon, ButtonDisplay, TextButton, IconButton, Page, View, CollectionSource, ConversationSource, CollectionPresentation, Chat, SplitView, Listing, ListingLayout, TableLayout, ListLayout, CardLayout, BoardLayout, CalendarLayout, TimelineLayout, TreeLayout, ComponentLayout, Form, Action, Filters, Component, ComponentExport, DesignTokens, Data, Field, InputField, ChoiceField, PickerField, DateRangeField, OptionSource, CollectionOptions]
  resources: [chineseTranslations, dutchTranslations, frenchTranslations, germanTranslations, hindiTranslations, italianTranslations, japaneseTranslations, koreanTranslations, polishTranslations, portugueseTranslations, russianTranslations, spanishTranslations, turkishTranslations, ukrainianTranslations, BoundText, Match, Condition, Enablement, RequestError, AppRelativeReference, QueryParameters, Address, RequestTarget, RefreshTarget, Control, FieldGroup, StateRecord, FieldAnswer, OptionSourceSpec, Relations, ListingLayoutSpec, ListingLayoutAnswer, controlFits, RowAction, Command, Grouping, Span, Node, SpecNode, OverlaySpec, SurfaceSpec, ButtonDisplaySpec, AfterCreate, AfterEdit, UnsavedInput, FilterPolicy, FilterPlacementSpec, StateStoreSpec, Navigation, NavigationItem, NavigationPlacementSpec, PageWidth, Frame, RowActionsDisplay]
  # The entry point a renderer's controller bundle resolves `@telorun/ui` to:
  # how a built browser entry becomes the files a page loads, so a renderer
  # addresses its own entries exactly as a placed component's are addressed.
  code:
    - specifier: "@telorun/ui"
      format: js
      path: ./nodejs/ui.mjs
      source: ./nodejs/src/index.ts
---
# A text shown to a person, or a text with the values it is formatted with —
# each value a path into a root the place it is written binds, or a fixed one —
# so a heading over an answer ("3 unpaid items") is composed where it is drawn.
kind: Telo.JsonSchema
metadata: { name: BoundText }
schema:
  anyOf:
    - { $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
    - type: object
      additionalProperties: false
      required: [text, values]
      properties:
        text:
          title: Text
          description: The text, its placeholders and plural selectors named by `values`.
          $ref: "telo://manifest#/$defs/Text"
        values:
          title: Values
          description: >-
            A value for every placeholder and plural selector the text reads, by
            name: a path into a root in scope, or a fixed value.
          type: object
          x-telo-text-values-for: /text
          additionalProperties: { x-telo-eval: accessor }
---
# A condition's schema: one closed keyword set — the interpreted profile — that
# a renderer interprets as data for conditions and for live validation alike.
# What each keyword means is pinned by the rows in `conformance/match.json`.
kind: Telo.JsonSchema
metadata: { name: Match }
schema:
  type: object
  additionalProperties: false
  properties:
    type:
      anyOf:
        - { $ref: "#/$defs/TypeName" }
        - type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/$defs/TypeName" }
    const: {}
    enum: { type: array, minItems: 1 }
    not: { $ref: "#" }
    allOf: { type: array, minItems: 1, items: { $ref: "#" } }
    anyOf: { type: array, minItems: 1, items: { $ref: "#" } }
    required: { type: array, uniqueItems: true, items: { type: string } }
    properties: { type: object, additionalProperties: { $ref: "#" } }
    items: { $ref: "#" }
    minItems: { type: integer, minimum: 0 }
    maxItems: { type: integer, minimum: 0 }
    uniqueItems: { type: boolean }
    minLength: { type: integer, minimum: 0 }
    maxLength: { type: integer, minimum: 0 }
    pattern: { type: string, format: re2-pattern }
    minimum: { type: number }
    maximum: { type: number }
    exclusiveMinimum: { type: number }
    exclusiveMaximum: { type: number }
    multipleOf: { type: number, exclusiveMinimum: 0 }
  $defs:
    TypeName: { enum: ["null", boolean, object, array, number, integer, string] }
---
# Whether something is drawn: it holds when the value `at` names validates
# against `matches`. A missing value never satisfies a condition, even under
# `not`; `null` is a present value.
kind: Telo.JsonSchema
metadata: { name: Condition }
schema:
  type: object
  additionalProperties: false
  required: [at, matches]
  properties:
    at:
      title: At
      description: The value the condition reads, as a path from a root the place it is written binds, or a fixed value.
      x-telo-eval: accessor
    matches:
      title: Matches
      description: The schema the value must satisfy.
      x-telo-match-for: /at
      $ref: "telo:Ui/Match"
---
# Whether something can be pressed: a condition plus the reason shown while it
# does not hold.
kind: Telo.JsonSchema
metadata: { name: Enablement }
schema:
  type: object
  additionalProperties: false
  required: [at, matches, disabledText]
  properties:
    at:
      title: At
      description: The value the condition reads, as a path from a root the place it is written binds, or a fixed value.
      x-telo-eval: accessor
    matches:
      title: Matches
      description: The schema the value must satisfy for the control to be enabled.
      x-telo-match-for: /at
      $ref: "telo:Ui/Match"
    disabledText:
      title: Disabled text
      description: Why the control cannot be pressed, shown while the condition does not hold.
      allOf:
        - { $ref: "telo:Ui/BoundText" }
        - { minLength: 1 }
---
# What a request that did not succeed reads as: `status` absent when nothing
# answered; `code` the problem body's `code`, else the renderer's own code for
# the status; `message` the problem's `detail`, else the renderer's own text.
kind: Telo.JsonSchema
metadata: { name: RequestError }
schema:
  type: object
  additionalProperties: false
  properties:
    status: { type: integer, title: Status }
    code: { type: string, title: Code }
    message: { type: string, title: Message }
---
# An address under the application's mount: `/` followed by anything but `/`
# or `\`, holding no control character. Every place a manifest writes one names
# this shape, alone or beside the absolute addresses it also takes.
kind: Telo.JsonSchema
metadata: { name: AppRelativeReference }
schema:
  type: string
  pattern: "^/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$"
---
# The query parameters a page or a reader declares: each a string, or a list
# of strings for a key given more than once. A name is a Telo name that does not
# begin `_telo`, which the renderer keeps for its own keys.
kind: Telo.JsonSchema
metadata: { name: QueryParameters }
schema:
  type: object
  additionalProperties: false
  patternProperties:
    "^(?!_telo)(?!(as|break|const|continue|else|false|for|function|if|import|in|let|loop|namespace|null|package|return|true|var|void|while)$)[A-Za-z_][A-Za-z0-9_]*$":
      anyOf:
        - allOf:
            - { $ref: "telo:Ui/Match" }
            - { required: [type], properties: { type: { const: string } } }
        - allOf:
            - { $ref: "telo:Ui/Match" }
            - required: [type, items]
              properties:
                type: { const: array }
                items: { required: [type], properties: { type: { const: string } } }
---
# Where a link or a navigation leads: a literal string, or a path template, the
# values that fill its `{name}` segments and the query parameters appended to it.
# It binds no root: the place it is written does. A literal path is an
# app-relative path or an `https:` / `http:` / `mailto:` address; a chain reads a
# whole address from data and is never expanded; a page reference is read as the
# page's `path`.
kind: Telo.JsonSchema
metadata: { name: Address }
schema:
  anyOf:
    - type: string
      pattern: "^[^{}]*$"
      anyOf: [{ $ref: "telo:Ui/AppRelativeReference" }, { pattern: "^(https://|http://|mailto:)" }]
      not: { pattern: "(^|/)[*]{1,2}([/?#]|$)" }
    - type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          title: Path
          description: >-
            The address: a path template whose `{name}` segments `pathParams`
            fills, a path into data holding a whole address, or the page it leads to.
          not: { type: string, pattern: "(^|/)[*]{1,2}([/?#]|$)" }
          x-telo-eval: accessor
          anyOf:
            - type: string
              anyOf: [{ $ref: "telo:Ui/AppRelativeReference" }, { pattern: "^(https://|http://|mailto:)" }]
            - { x-telo-ref: { kind: Self.Page, use: schema } }
        pathParams:
          title: Path parameters
          description: >-
            The value of each `{name}` segment of `path`: a path into a root in
            scope, or a fixed value. One that holds nothing leaves the address unresolved.
          type: object
          x-telo-path-params-for: { template: /path, through: path }
          additionalProperties: { type: [string, integer], x-telo-eval: accessor }
        queryParams:
          title: Query parameters
          description: >-
            Parameters appended to the address in the order written: a path into a
            root in scope, or a fixed value. A list repeats its key; null and an
            empty list are left out.
          type: object
          additionalProperties: false
          patternProperties:
            "^(?!_telo)(?!(as|break|const|continue|else|false|for|function|if|import|in|let|loop|namespace|null|package|return|true|var|void|while)$)[A-Za-z_][A-Za-z0-9_]*$":
              x-telo-eval: accessor
              type: [string, integer, number, boolean, array]
              items: { type: [string, integer, number, boolean] }
---
# Where a request goes: as an address, but app-relative and never a page.
kind: Telo.JsonSchema
metadata: { name: RequestTarget }
schema:
  anyOf:
    - { type: string, pattern: "^[^{}]*$", $ref: "telo:Ui/AppRelativeReference", not: { pattern: "(^|/)[*]{1,2}([/?#]|$)" } }
    - type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          title: Path
          description: >-
            The app-relative path to request: a template whose `{name}` segments
            `pathParams` fills, or a path into data holding a whole one.
          x-telo-eval: accessor
          type: string
          $ref: "telo:Ui/AppRelativeReference"
          not: { pattern: "(^|/)[*]{1,2}([/?#]|$)" }
        pathParams:
          title: Path parameters
          description: >-
            The value of each `{name}` segment of `path`: a path into a root in
            scope, or a fixed value. One that holds nothing leaves the request unsent.
          type: object
          x-telo-path-params-for: { template: /path }
          additionalProperties: { type: [string, integer], x-telo-eval: accessor }
        queryParams:
          title: Query parameters
          description: >-
            Parameters sent with the request in the order written: a path into a
            root in scope, or a fixed value. A list repeats its key; null and an
            empty list are left out.
          type: object
          additionalProperties: false
          patternProperties:
            "^(?!_telo)(?!(as|break|const|continue|else|false|for|function|if|import|in|let|loop|namespace|null|package|return|true|var|void|while)$)[A-Za-z_][A-Za-z0-9_]*$":
              x-telo-eval: accessor
              type: [string, integer, number, boolean, array]
              items: { type: [string, integer, number, boolean] }
---
# Which requests to read again: as a request target, except that a whole
# segment of a literal path may be `*` (any one segment) or `**` (any number,
# none included). A path read from data, and every value of `pathParams`, is
# exact: a `*` in either is text.
kind: Telo.JsonSchema
metadata: { name: RefreshTarget }
schema:
  anyOf:
    - { type: string, pattern: "^[^{}]*$", $ref: "telo:Ui/AppRelativeReference" }
    - type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          title: Path
          description: >-
            The app-relative path of the requests to read again: a template whose
            `{name}` segments `pathParams` fills and whose `*` / `**` segments match, or a
            path into data holding a whole one, matched exactly.
          x-telo-eval: accessor
          type: string
          $ref: "telo:Ui/AppRelativeReference"
        pathParams:
          title: Path parameters
          description: >-
            The value of each `{name}` segment of `path`: a path into a root in
            scope, or a fixed value. One that holds nothing leaves the refresh out.
          type: object
          x-telo-path-params-for: { template: /path }
          additionalProperties: { type: [string, integer], x-telo-eval: accessor }
        queryParams:
          title: Query parameters
          description: >-
            Parameters appended in the order written; matching leaves the query out: a path into a
            root in scope, or a fixed value. A list repeats its key; null and an
            empty list are left out.
          type: object
          additionalProperties: false
          patternProperties:
            "^(?!_telo)(?!(as|break|const|continue|else|false|for|function|if|import|in|let|loop|namespace|null|package|return|true|var|void|while)$)[A-Za-z_][A-Za-z0-9_]*$":
              x-telo-eval: accessor
              type: [string, integer, number, boolean, array]
              items: { type: [string, integer, number, boolean] }
---
# How a value is entered: derived from what the model says it is (`auto`), a
# `select` list, `options` side by side, a `toggle`, a `slider`, or typed
# `tags`. One vocabulary for form fields and filters, judged by `controlFits`.
kind: Telo.JsonSchema
metadata: { name: Control }
schema: { enum: [auto, select, options, toggle, slider, tags] }
---
# A labelled section of a form. Its fields name it by `group` and are listed
# one after another, so the list's order is the order they are drawn in.
kind: Telo.JsonSchema
metadata: { name: FieldGroup }
schema:
  type: object
  additionalProperties: false
  required: [name, label]
  properties:
    name:
      title: Name
      description: What the group's fields name it by, letters and digits.
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9]*$"
    label: { title: Label, description: The section's heading., $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
    description: { title: Description, description: Text shown under the heading., $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
    shown:
      title: Shown
      description: Whether the section and its fields are drawn, over the form's current `values`.
      $ref: "telo:Ui/Condition"
---
# Where the values a form, an action or a filter bar holds are kept between
# visits: the page's address, a store, or both — the address winning at start.
kind: Telo.JsonSchema
metadata: { name: StateRecord }
schema:
  type: object
  additionalProperties: false
  required: [key]
  anyOf:
    - { required: [store] }
    - { required: [address], properties: { address: { const: true } } }
  properties:
    key:
      title: Key
      description: The name the values are kept under, letters and digits.
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9]*$"
    address:
      title: Address
      description: Whether the values are part of the page's address.
      type: boolean
      default: false
    store:
      title: Store
      description: Where the values are stored between visits.
      x-telo-ref: { kind: Self.StateStore, use: dependency }
    fields:
      title: Fields
      description: >-
        The properties kept. Omitted, every property shown is kept. A property
        the model marks `writeOnly` is never kept.
      type: array
      uniqueItems: true
      items: { type: string }
---
# What a field answers for the model it is entered into: the property it
# enters, why it cannot be entered there, and — when it can — what a renderer
# draws for it.
kind: Telo.JsonSchema
metadata: { name: FieldAnswer }
schema:
  type: object
  additionalProperties: false
  required: [property, problems]
  properties:
    property: { type: string }
    problems:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [code, message]
        properties:
          code: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
          message: { type: string }
    # Present exactly when the model declares the property and nothing is wrong.
    spec: { $ref: "telo:Ui/SpecNode#/$defs/Field" }
---
# Where a field's options come from, as a renderer receives it. Tagged on
# `type`, one branch per kind of source.
kind: Telo.JsonSchema
metadata: { name: OptionSourceSpec }
schema:
  type: object
  oneOf:
    # Read through the collection contract: paged by `next`, searched with the
    # `search` pair, labelled by `value` filtered with `in`.
    - additionalProperties: false
      required: [type, schema, value, label, basePath, filters, pageSize]
      properties:
        type: { const: collection }
        schema: { type: object }
        value: { $ref: "#/$defs/Binding" }
        label: { $ref: "#/$defs/Binding" }
        hint: { $ref: "#/$defs/Binding" }
        href: { $ref: "telo:Ui/SpecNode#/$defs/Address" }
        basePath: { type: string }
        filters: { type: object, additionalProperties: { $ref: "#/$defs/Binding" } }
        # Sent as `limit` on every request, a label lookup's batches included.
        pageSize: { type: integer }
        search:
          type: object
          additionalProperties: false
          required: [property, operator]
          properties:
            property: { type: string }
            operator: { enum: [eq, contains, gt, gte, lt, lte, in] }
  $defs:
    Binding:
      oneOf:
        - type: object
          additionalProperties: false
          required: [root, path]
          properties: { root: { type: string }, path: { type: array, items: { type: string } } }
        - type: object
          additionalProperties: false
          required: [value]
          properties: { value: {} }
---
# How one set of screens shows the records a collection's properties point at,
# keyed by property. Presentation only: which records are related, and the
# value a relation holds (the target's key), are the collection's own. A kind
# forwarding a presentation's relations types them with this shape; it is
# written out in `CollectionPresentation.relations` too, since a rule's
# `resolve:` does not follow `$ref`, and a unit test holds the two equal.
kind: Telo.JsonSchema
metadata: { name: Relations }
schema:
  type: object
  additionalProperties:
    type: object
    additionalProperties: false
    required: [source, label]
    properties:
      source:
        title: Source
        description: Where the related records are read from. Its collection is the relation's target.
        x-telo-ref: { kind: Self.CollectionSource, use: dependency }
      label:
        title: Label
        description: How a related record is shown, as a path into it or a fixed text.
        type: string
        x-telo-eval: accessor
        x-telo-context:
          type: object
          properties:
            row: { x-telo-context-eval: accessor, x-telo-context-ref-from: source/collection/model }
      hint:
        title: Hint
        description: Text shown beside the label.
        type: string
        x-telo-eval: accessor
        x-telo-context:
          type: object
          properties:
            row: { x-telo-context-eval: accessor, x-telo-context-ref-from: source/collection/model }
      href:
        title: Link
        description: Where a related record links to, an address over the related `row`.
        $ref: "telo:Ui/Address"
        x-telo-context:
          type: object
          properties:
            row: { x-telo-context-eval: accessor, x-telo-context-ref-from: source/collection/model }
      search:
        title: Search
        description: >-
          The filter what the viewer types is sent as when choosing a related
          record. Omitted, the choices are not searched.
        type: object
        additionalProperties: false
        required: [property, operator]
        properties:
          property: { title: Property, type: string }
          operator: { title: Operator, enum: [eq, contains, gt, gte, lt, lte, in] }
      pageSize:
        title: Page size
        description: >-
          Related records per request, sent as `limit`: a page of choices, and
          at most this many keys per label lookup.
        type: integer
        minimum: 1
        maximum: 100
        default: 25
---
# How a layout groups records: one read per value of a property, each adding
# `<property>=<value>`.
kind: Telo.JsonSchema
metadata: { name: Grouping }
schema:
  type: object
  additionalProperties: false
  required: [property]
  properties:
    property:
      title: Property
      description: The model property records are grouped by, sent as `<property>=<value>` on each group's read.
      type: string
    values:
      title: Values
      description: >-
        Which groups are drawn: every value the property can hold — its `enum`,
        a boolean's two, or the related records of its presented relation —
        or only those `present` in the filtered records, with counts.
      enum: [all, present]
      default: all
---
# Where a record sits in time: a start, and optionally an end, each a date or
# date-time property of the model.
kind: Telo.JsonSchema
metadata: { name: Span }
schema:
  type: object
  additionalProperties: false
  required: [start]
  properties:
    start:
      title: Start
      description: The property holding when a record starts, a `date` or `date-time` string.
      type: string
    end:
      title: End
      description: >-
        The property holding when it ends, of the same format as `start`.
        Omitted, a record is an instant at `start`.
      type: string
---
# How a listing's records are drawn, as a renderer receives it: renderer-neutral
# and closed, one branch per layout, tagged on `type`. `reads` is the read plan
# — one read per group value, per shown period, or per tree level, each paged —
# so a renderer executes it and never chooses a query itself.
kind: Telo.JsonSchema
metadata: { name: ListingLayoutSpec }
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type, columns, reads]
      properties:
        type: { const: table }
        columns: { type: array, items: { $ref: "#/$defs/Column" } }
        reads: { $ref: "#/$defs/Reads" }
    # A record per item of one column, `content` drawn for each.
    - additionalProperties: false
      required: [type, content, frame, reads]
      properties:
        type: { const: list }
        content: { $ref: "telo:Ui/SpecNode" }
        frame: { $ref: "telo:Ui/Frame" }
        reads: { $ref: "#/$defs/Reads" }
    - additionalProperties: false
      required: [type, content, size, reads]
      properties:
        type: { const: cards }
        content: { $ref: "telo:Ui/SpecNode" }
        size: { enum: [small, medium, large] }
        reads: { $ref: "#/$defs/Reads" }
    # A column per group of `reads.groups`; `move` re-groups a record.
    - additionalProperties: false
      required: [type, content, reads]
      properties:
        type: { const: board }
        content: { $ref: "telo:Ui/SpecNode" }
        move: { $ref: "telo:Ui/SpecNode#/$defs/RowAction" }
        reads: { $ref: "#/$defs/Reads" }
    # Records placed on the days of `period`, the initial one shown, over
    # `reads.span`.
    - additionalProperties: false
      required: [type, period, content, reads]
      properties:
        type: { const: calendar }
        period: { enum: [month, week, day] }
        content: { $ref: "telo:Ui/SpecNode" }
        move: { $ref: "telo:Ui/SpecNode#/$defs/RowAction" }
        reads: { $ref: "#/$defs/Reads" }
    # Records as bars along time at `scale`, over `reads.span`, in a lane per
    # group of `reads.groups` when it is present.
    - additionalProperties: false
      required: [type, scale, content, reads]
      properties:
        type: { const: timeline }
        scale: { enum: [day, week, month, quarter] }
        content: { $ref: "telo:Ui/SpecNode" }
        move: { $ref: "telo:Ui/SpecNode#/$defs/RowAction" }
        reads: { $ref: "#/$defs/Reads" }
    # Root records, and a record's children under it when it is expanded,
    # over `reads.parent`.
    - additionalProperties: false
      required: [type, content, reads]
      properties:
        type: { const: tree }
        content: { $ref: "telo:Ui/SpecNode" }
        move: { $ref: "telo:Ui/SpecNode#/$defs/RowAction" }
        reads: { $ref: "#/$defs/Reads" }
    # A browser component drawing the records the plan reads; each prop a
    # fixed value, or a path into `row` delivered per record.
    - additionalProperties: false
      required: [type, module, export, external, stylesheets, props, reads]
      properties:
        type: { const: component }
        module: { $ref: "telo:Ui/SpecNode#/$defs/AssetRef" }
        export: { type: string }
        abi: { type: string }
        external: { type: array, items: { type: string } }
        stylesheets: { type: array, items: { $ref: "telo:Ui/SpecNode#/$defs/AssetRef" } }
        props:
          type: object
          additionalProperties: { $ref: "telo:Ui/SpecNode#/$defs/Binding" }
        move: { $ref: "telo:Ui/SpecNode#/$defs/RowAction" }
        reads: { $ref: "#/$defs/Reads" }
  $defs:
    # Three dimensions composing as a product; none of them is pages alone.
    Reads:
      type: object
      additionalProperties: false
      properties:
        # One read per group value, each adding `<property>=<value>`.
        groups:
          type: object
          additionalProperties: false
          required: [property, values, labels]
          properties:
            property: { type: string }
            # `present`: the values of the facet request, with counts.
            # `all`: `enum` in order, or the related records of `relation`, paged.
            values: { enum: [all, present] }
            # With `all`, the values the property can hold: its `enum`, `null`
            # aside, or a boolean's `[true, false]`.
            enum: { type: array, items: { type: [string, number, integer, boolean] } }
            # Present where the presentation presents the property's relation:
            # the key of the listing's `relations` a value is labelled through.
            relation: { type: string }
            # What each value the model labels is shown as.
            labels: { $ref: "telo:Ui/SpecNode#/$defs/Labels" }
        # Each read adds the shown period's bounds: `<start>.gte` and
        # `<start>.lte`, or with `end` the overlap pair `<start>.lte` and
        # `<end>.gte`.
        span:
          type: object
          additionalProperties: false
          required: [start, format]
          properties:
            start: { type: string }
            end: { type: string }
            # How a bound is written: a date, or a date-time.
            format: { enum: [date, date-time] }
        # Roots read with `<parent>.absent=true`, a record's children with
        # `<parent>=<key>`.
        parent: { type: string }
    Column:
      type: object
      additionalProperties: false
      required: [header, labels]
      properties:
        header: { $ref: "telo:Ui/SpecNode#/$defs/Text" }
        value: { $ref: "telo:Ui/SpecNode#/$defs/Binding" }
        # Present when the value is drawn as a link.
        href: { $ref: "telo:Ui/SpecNode#/$defs/Address" }
        # What each value the model labels is shown as.
        labels: { $ref: "telo:Ui/SpecNode#/$defs/Labels" }
        # Present when the column is sortable: the property sent as `sort`.
        sort: { type: string }
        # Present when the value is a property with a relation: the key of the
        # listing's `relations` its related record is labelled through.
        relation: { type: string }
        # The model's own description of the value, which decides how a cell
        # is shown.
        present: { type: object }
        style: { $ref: "telo:Ui/SpecNode#/$defs/StyleRule" }
        # A component node, or the error node standing in for one.
        cell: { $ref: "telo:Ui/SpecNode" }
---
# What a listing layout answers for the listing calling it: why it cannot draw
# that listing's records, and — when it can — the layout spec and the files a
# browser loads for it.
kind: Telo.JsonSchema
metadata: { name: ListingLayoutAnswer }
schema:
  type: object
  additionalProperties: false
  required: [problems, assets]
  properties:
    problems:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [code, message]
        properties:
          code: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
          message: { type: string }
    # Present exactly when nothing is wrong.
    spec: { $ref: "telo:Ui/ListingLayoutSpec" }
    assets:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [digest, name, file, mediaType]
        properties:
          digest: { type: string }
          name: { type: string }
          file: { type: string }
          mediaType: { type: string }
---
# Whether a control can enter a property. `operator` is the filter's, or null
# for a form field, whose value is a list when the property is an `array` and
# is then entered by its `items`. A control states what it needs, so a type it
# cannot read is refused: types are read with `null` set aside. A field's
# property must hold one plain value or a list of them whatever its control.
# `absent` holds whether the property is missing, so it is entered as a toggle.
kind: Telo.Function
metadata:
  name: controlFits
  description: >-
    Whether a control fits a property: auto, select, options, toggle, slider or
    tags, over a filter's operator or a form field's property. A filter on
    whether a property is absent is entered with a toggle.
params:
  - { name: control, schema: { type: string } }
  - { name: property, schema: { type: object } }
  - { name: operator, schema: { type: [string, "null"] } }
returns: { schema: { type: boolean } }
body: !cel >-
  operator == 'absent' ? control in ['auto', 'toggle', 'none'] :
  cel.bind(declared, !('type' in property) ? [] : (type(property.type) == type([]) ? property.type : [property.type]).filter(t, t != 'null'),
  cel.bind(listed, operator == null && declared == ['array'],
  cel.bind(element, !listed ? property : ('items' in property && type(property.items) == type({}) ? property.items : {}),
  cel.bind(types, !('type' in element) ? [] : (type(element.type) == type([]) ? element.type : [element.type]).filter(t, t != 'null'),
  cel.bind(plain, types.size() == 0 ? ('enum' in element && type(element.enum) == type([])) : types.all(t, t in ['string', 'number', 'integer', 'boolean']),
  cel.bind(single, operator == null ? !listed : operator in ['eq', 'gt', 'gte', 'lt', 'lte'],
    (operator != null || plain)
    && (control == 'auto' ? plain
      : control == 'select' || control == 'options' ? ('enum' in element && type(element.enum) == type([])) || types == ['boolean']
      : control == 'toggle' ? types == ['boolean'] && (operator == null ? !listed : operator == 'eq')
      : control == 'slider' ? types.size() > 0 && types.all(t, t in ['number', 'integer'])
          && 'minimum' in element && 'maximum' in element && single
      : control == 'tags' ? (operator == null ? listed : operator == 'in')
      : control == 'none' && operator != null)))))))
---
# An operation a row offers: the action run, what of the row it is sent, and
# how a press is asked and allowed. Shared by a listing's records and a list node's;
# `row` and the other roots its accessors read are bound where it is used.
kind: Telo.JsonSchema
metadata: { name: RowAction }
schema:
  type: object
  additionalProperties: false
  required: [action, inputs]
  properties:
    action:
      title: Action
      description: >-
        The operation run. Its path, input model, label, answer trees and
        `onSuccess` are used, and its fields where `prompt` asks for them; its
        own `enabled` governs its own form only.
      x-telo-ref: { kind: Self.Action, use: dependency, inputs: /inputs }
    inputs:
      title: Inputs
      description: >-
        What the operation receives, by input property: a path into the row or
        another root in scope, or a fixed value. Every input the action
        requires is bound. Read when the row's button is pressed.
      type: object
      minProperties: 1
      additionalProperties: { x-telo-eval: accessor }
    confirm:
      title: Confirm
      description: >-
        A question asked before the operation runs. Omitted, a press runs it at
        once, unless `prompt` opens a dialog.
      allOf:
        - { $ref: "telo:Ui/BoundText" }
        - { minLength: 1 }
    prompt:
      title: Prompt
      description: >-
        Whether a press opens a dialog that asks for the action's fields the
        row's `inputs` do not bind — a reason, a note — and sends them with the
        row's values. The dialog is titled with `confirm`, or with the action's
        label.
      type: boolean
      default: false
    enabled:
      title: Enabled
      description: >-
        When the row's button can be pressed, over the row and the roots in
        scope, and the reason shown while it cannot. Omitted, it always can.
      $ref: "telo:Ui/Enablement"
---
# A command a root of a region offers to the nodes drawn over it: a chat's
# export, a listing's reload. Each command is a member of that root.
kind: Telo.JsonSchema
metadata: { name: Command }
schema:
  type: object
  additionalProperties: false
  required: [offered, enabled]
  properties:
    offered: { description: Whether the owner offers the command here; a command node over one it does not is not drawn., type: boolean }
    enabled: { description: Whether it can run now; while it cannot, its button is disabled., type: boolean }
---
# One node of a page, as an author writes it. Internally tagged on `type`, each
# branch closed, so a misspelled type lists the valid ones and a stray key is
# reported on the branch it was written in. Spacing — gap, alignment, width —
# is not a field anywhere: it belongs to the styling contract of whatever
# renders the tree. `when` decides whether a node is delivered — evaluated per
# request on a page's own nodes, at creation inside a composite — and `shown`
# whether a delivered node is drawn, a condition the renderer reads over the
# roots the place it is written binds. `fill` stretches the node to the bottom
# of the page or surface body it sits in; `ui` marks every node above it.
kind: Telo.JsonSchema
metadata: { name: Node }
schema:
  type: object
  # One closed branch per `type`, each pinning it.
  oneOf:
    - additionalProperties: false
      required: [type, children]
      properties:
        type: { enum: [box, stack, columns] }
        children: { type: array, items: { $ref: "#" } }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    - additionalProperties: false
      required: [type, text]
      properties:
        type: { enum: [text, badge] }
        text: { $ref: "telo:Ui/BoundText" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    - additionalProperties: false
      required: [type, text, href]
      properties:
        type: { const: link }
        text: { $ref: "telo:Ui/BoundText" }
        href: { $ref: "telo:Ui/Address" }
        # Draws the link as a button: its text, or a glyph with the text as its name.
        button: { x-telo-ref: { kind: Self.ButtonDisplay, use: dependency } }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    # A button opening a list of links: choosing one follows its `href` as
    # clicking the link would. An item whose `style` holds `strong` is the
    # current choice. Items are delivered by their own `when`.
    - additionalProperties: false
      required: [type, text, items]
      properties:
        type: { const: menu }
        text: { $ref: "telo:Ui/BoundText" }
        # Each a `link` node.
        items:
          type: array
          minItems: 1
          items:
            allOf:
              - { $ref: "#" }
              - { properties: { type: { const: link }, button: { not: {} }, fill: { not: {} } } }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    # Content under tabs, one tab's content shown at a time. Each tab is
    # delivered by its own `when`; with `address`, the chosen tab is part of
    # the page's address under that name.
    - additionalProperties: false
      required: [type, tabs]
      properties:
        type: { const: tabs }
        tabs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [text, children]
            properties:
              text: { $ref: "telo:Ui/BoundText" }
              children: { type: array, items: { $ref: "#" } }
              when: { type: boolean, default: true }
        address:
          type: object
          additionalProperties: false
          required: [name]
          properties: { name: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]*$" } }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    - additionalProperties: false
      required: [type, src, alt]
      properties:
        type: { const: image }
        src: { type: string, anyOf: [{ $ref: "telo:Ui/AppRelativeReference" }, { pattern: "^(https://|http://)" }] }
        alt: { $ref: "telo:Ui/BoundText" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    - additionalProperties: false
      required: [type, markup, alt]
      properties:
        type: { const: svg }
        markup: { type: string }
        alt: { $ref: "telo:Ui/BoundText" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    # One value, presented as its schema says: a `format: uri` /
    # `uri-reference` string is a link, drawn as `text` when that is given.
    - additionalProperties: false
      required: [type, value]
      properties:
        type: { const: value }
        value: { x-telo-eval: accessor }
        text: { $ref: "telo:Ui/BoundText" }
        # Draws the presented value as the text of a link.
        href: { $ref: "telo:Ui/Address" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    # The rows of a list one answer holds, a column per value. Bounded by the
    # answer: it never pages — an unbounded set is a listing's.
    - additionalProperties: false
      required: [type, rows, columns]
      properties:
        type: { const: list }
        heading: { $ref: "telo:Ui/BoundText" }
        rows: { type: array, x-telo-eval: accessor }
        columns:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [value]
            properties:
              header: { $ref: "telo:Ui/BoundText" }
              value:
                x-telo-eval: accessor
                x-telo-context:
                  type: object
                  properties:
                    row: { x-telo-context-element-from-item: "2/rows", x-telo-context-eval: accessor }
              # Draws the value as the text of a link, over `row` and the roots the list is drawn under.
              href:
                $ref: "telo:Ui/Address"
                x-telo-context:
                  type: object
                  properties:
                    row: { x-telo-context-element-from-item: "2/rows", x-telo-context-eval: accessor }
              # Reads the roots the list is drawn under, never `row`.
              shown: { $ref: "telo:Ui/Condition" }
        # Operations each row offers, over `row` and the roots the list is
        # drawn under. A pressed one draws its own answer in place of its
        # button.
        rowActions:
          type: array
          x-telo-context:
            type: object
            properties:
              row: { x-telo-context-element-from-item: "0/rows", x-telo-context-eval: accessor }
          items: { $ref: "telo:Ui/RowAction" }
        # How the row actions are drawn: `auto` measures the room.
        rowActionsDisplay: { $ref: "telo:Ui/RowActionsDisplay" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    # A row of three regions: `start` and `end` at its edges, `center` centred
    # on the row however wide the sides are.
    - additionalProperties: false
      required: [type]
      properties:
        type: { const: bar }
        start: { type: array, items: { $ref: "#" } }
        center: { type: array, items: { $ref: "#" } }
        end: { type: array, items: { $ref: "#" } }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    # A button running a command a root of the region offers (`chat.stop`):
    # not drawn while the command is not offered, disabled while it cannot run.
    # `text` is its label, or the name of its glyph; `button` defaults to text.
    - additionalProperties: false
      required: [type, command, text]
      properties:
        type: { const: command }
        command: { x-telo-eval: accessor, $ref: "telo:Ui/Command" }
        text: { $ref: "telo:Ui/BoundText" }
        button: { x-telo-ref: { kind: Self.ButtonDisplay, use: dependency } }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
    - additionalProperties: false
      required: [type, ref]
      properties:
        type: { const: composite }
        ref: { x-telo-ref: { kind: Self.Composite, use: dependency } }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
        fill: { type: boolean, default: false }
  $defs:
    StyleName: { enum: [heading, subheading, muted, strong, accent, danger, warning, success] }
    Style:
      anyOf:
        - { $ref: "#/$defs/StyleName" }
        - { type: array, items: { $ref: "#/$defs/StyleName" } }
---
# What a renderer receives: the same structural nodes with every condition
# decided and every composite replaced by what it provides. Carries no resource
# name — a renderer needs nothing but this document.
kind: Telo.JsonSchema
metadata: { name: SpecNode }
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type, children, fill]
      properties:
        type: { enum: [box, stack, columns] }
        children: { type: array, items: { $ref: "#" } }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    - additionalProperties: false
      required: [type, text, fill]
      properties:
        type: { enum: [text, badge] }
        text: { $ref: "#/$defs/NodeText" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    - { $ref: "#/$defs/Link" }
    # Its items as delivered for the request, never empty.
    - additionalProperties: false
      required: [type, text, items, fill]
      properties:
        type: { const: menu }
        text: { $ref: "#/$defs/NodeText" }
        items: { type: array, minItems: 1, items: { $ref: "#/$defs/Link" } }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # Its tabs as delivered for the request, never none, each keyed by the
    # slug of the source text it was written with.
    - additionalProperties: false
      required: [type, tabs, fill]
      properties:
        type: { const: tabs }
        tabs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [key, text, children]
            properties:
              key: { type: string, minLength: 1 }
              text: { $ref: "#/$defs/NodeText" }
              children: { type: array, items: { $ref: "#" } }
        address: { $ref: "telo:Ui/OverlaySpec#/$defs/Address" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    - additionalProperties: false
      required: [type, src, alt, fill]
      properties:
        type: { const: image }
        src: { type: string, anyOf: [{ $ref: "telo:Ui/AppRelativeReference" }, { pattern: "^(https://|http://)" }] }
        alt: { $ref: "#/$defs/NodeText" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    - additionalProperties: false
      required: [type, markup, alt, fill]
      properties:
        type: { const: svg }
        markup: { type: string }
        alt: { $ref: "#/$defs/NodeText" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # Records read page by page from a collection and drawn by `layout` (by
    # `compact` below the application's breakpoint, keeping the listing's
    # state). Everything but the drawing is the listing's, whatever the layout.
    - additionalProperties: false
      required: [type, schema, basePath, key, query, pageSize, paging, sort, show, delete, rowActions, rowActionsDisplay, relations, empty, layout, fill]
      properties:
        type: { const: listing }
        schema: { type: object }
        basePath: { type: string }
        # The property identifying a record, in item URLs and across reloads.
        key: { type: string }
        # The declared query parameters its row actions read, by name; empty
        # when none is.
        query: { type: object }
        # Equalities sent with every request, each a fixed value or a path
        # into a root in scope; while one holds nothing, nothing is read.
        filters: { type: object, additionalProperties: { $ref: "#/$defs/Binding" } }
        pageSize: { type: integer }
        paging: { enum: [pages, more, scroll] }
        # `sortable`: the properties the viewer may sort by, sent as `sort`
        # (none when the order is fixed); `initial`: the order sent until the
        # viewer chooses, `-` leading a descending one.
        sort:
          type: object
          additionalProperties: false
          required: [sortable, initial]
          properties:
            sortable: { type: array, items: { type: string } }
            initial: { type: [string, "null"] }
        show:
          type: object
          additionalProperties: false
          required: [count]
          properties: { count: { type: boolean } }
        rowStyle: { $ref: "#/$defs/StyleRule" }
        create:
          type: object
          additionalProperties: false
          required: [form, surface, afterSubmit, unsaved]
          properties:
            form: { $ref: "#" }
            surface: { $ref: "telo:Ui/SurfaceSpec" }
            afterSubmit: { enum: [close, again, keep] }
            unsaved: { enum: [confirm, discard] }
        edit:
          type: object
          additionalProperties: false
          required: [form, surface, afterSubmit, unsaved]
          properties:
            form: { $ref: "#" }
            surface: { $ref: "telo:Ui/SurfaceSpec" }
            afterSubmit: { enum: [close, keep] }
            unsaved: { enum: [confirm, discard] }
        delete: { type: boolean }
        # What each record offers beyond edit and delete, in order: an
        # operation run with values of the record.
        rowActions: { type: array, items: { $ref: "#/$defs/RowAction" } }
        rowActionsDisplay: { $ref: "telo:Ui/RowActionsDisplay" }
        # The related records each property with a relation is labelled from,
        # by property: read with its key under `in`, one batch per page.
        relations: { type: object, additionalProperties: { $ref: "telo:Ui/OptionSourceSpec" } }
        # Drawn where the records would be when the reads answer none.
        empty: { $ref: "#" }
        layout: { $ref: "telo:Ui/ListingLayoutSpec" }
        compact: { $ref: "telo:Ui/ListingLayoutSpec" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    - additionalProperties: false
      required: [type, schema, basePath, fields, groups, state, fill]
      properties:
        type: { const: form }
        schema: { type: object }
        basePath: { type: string }
        fields: { type: array, items: { $ref: "#/$defs/Field" } }
        groups: { type: array, items: { $ref: "#/$defs/Group" } }
        state: { $ref: "#/$defs/State" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    - { $ref: "#/$defs/Action" }
    - additionalProperties: false
      required: [type, basePath, fields, content, show, placement, controls, apply, summary, state, presets, fill]
      properties:
        type: { const: filters }
        # The presentation's source `basePath` as written: where a `values:
        # present` field's facet request goes, and the path whose changes
        # reload its values.
        basePath: { type: string }
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [property, operator, label, labels, schema, pinned, control, values]
            properties:
              property: { type: string }
              operator: { enum: [eq, contains, gt, gte, lt, lte, in, absent] }
              label: { $ref: "#/$defs/Text" }
              labels: { $ref: "#/$defs/Labels" }
              schema: { type: object }
              pinned: { type: boolean }
              control: { enum: [auto, select, options, toggle, slider, tags, none] }
              # Every value the choices offer, or only those `present` in the
              # facet answer under the bar's other filters, each with its count.
              values: { enum: [all, present] }
              # Present where the choices are records: the property's relation,
              # or the field's own option source.
              options: { $ref: "telo:Ui/OptionSourceSpec" }
              # What the filter holds until the user changes it: always a list.
              default: { type: array, items: { type: [string, number, boolean] } }
        content: { $ref: "#" }
        show: { enum: [all, chosen] }
        placement: { $ref: "telo:Ui/FilterPlacementSpec" }
        controls: { enum: [direct, chips] }
        apply: { enum: [commit, typing, button] }
        summary: { enum: [none, chips] }
        state: { $ref: "#/$defs/State" }
        presets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label, values]
            properties:
              label: { $ref: "#/$defs/Text" }
              values:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [property, operator, value]
                  properties:
                    property: { type: string }
                    operator: { enum: [eq, contains, gt, gte, lt, lte, in, absent] }
                    value: { type: array, items: { type: [string, number, boolean] } }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    - additionalProperties: false
      required: [type, module, export, external, stylesheets, props, fill]
      properties:
        type: { const: component }
        module: { $ref: "#/$defs/AssetRef" }
        export: { type: string }
        abi: { type: string }
        external: { type: array, items: { type: string } }
        stylesheets: { type: array, items: { $ref: "#/$defs/AssetRef" } }
        props: { type: object, additionalProperties: { $ref: "#/$defs/Binding" } }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # One value of a data scope, with what its schema says about it.
    - additionalProperties: false
      required: [type, value, labels, fill]
      properties:
        type: { const: value }
        value: { $ref: "#/$defs/Binding" }
        text: { $ref: "#/$defs/NodeText" }
        # Present when the value is drawn as a link.
        href: { $ref: "#/$defs/Address" }
        # What each value the model labels is shown as.
        labels: { $ref: "#/$defs/Labels" }
        present: { type: object }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    - additionalProperties: false
      required: [type, rows, columns, rowActionsDisplay, fill]
      properties:
        type: { const: list }
        heading: { $ref: "#/$defs/NodeText" }
        rows: { $ref: "#/$defs/Binding" }
        columns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [header, value, labels]
            properties:
              header: { $ref: "#/$defs/NodeText" }
              value: { $ref: "#/$defs/Binding" }
              labels: { $ref: "#/$defs/Labels" }
              # The model's own description of the value.
              present: { type: object }
              # Present when the value is drawn as a link.
              href: { $ref: "#/$defs/Address" }
              shown: { $ref: "#/$defs/Shown" }
        rowActions: { type: array, items: { $ref: "#/$defs/RowAction" } }
        rowActionsDisplay: { $ref: "telo:Ui/RowActionsDisplay" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # Data read when it is drawn, under the record contract: `content` drawn
    # over `data` once an answer is in, `loading` before the first, `failure`
    # over `error` when the read does not succeed.
    - additionalProperties: false
      required: [type, schema, source, query, content, loading, failure, reloadOn, fill]
      properties:
        type: { const: data }
        schema: { type: object }
        source: { $ref: "#/$defs/Address" }
        # The declared query parameters, by name; empty when none is.
        query: { type: object }
        content: { $ref: "#" }
        loading: { $ref: "#" }
        failure: { $ref: "#" }
        reloadOn: { type: array, items: { enum: [focus, unauthorized] } }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # Three regions in a row, each `[]` when not written.
    - additionalProperties: false
      required: [type, start, center, end, fill]
      properties:
        type: { const: bar }
        start: { type: array, items: { $ref: "#" } }
        center: { type: array, items: { $ref: "#" } }
        end: { type: array, items: { $ref: "#" } }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # A button running the command its binding names among the roots in scope.
    - additionalProperties: false
      required: [type, command, text, button, fill]
      properties:
        type: { const: command }
        command: { $ref: "#/$defs/Binding" }
        text: { $ref: "#/$defs/NodeText" }
        button: { $ref: "telo:Ui/ButtonDisplaySpec" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # Markdown text: CommonMark with tables and task lists, raw HTML drawn as text.
    - additionalProperties: false
      required: [type, text, fill]
      properties:
        type: { const: markdown }
        text: { $ref: "#/$defs/Binding" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # A conversation drawn as a chat: what the endpoint offers, where it is
    # served, and how the page presents it. Every member is present;
    # `placeholder` is null when not drawn, `header` empty when none is.
    - additionalProperties: false
      required: [type, spec, basePath, header, placeholder, starters, show, buttons, composer, conversation, refreshes, fill]
      properties:
        type: { const: chat }
        spec: { $ref: "telo:Conversations/Spec" }
        basePath: { type: string }
        # Drawn top to bottom above the transcript, over `conversation` and `chat`.
        header: { type: array, items: { $ref: "#" } }
        placeholder: { $ref: "#/$defs/Description" }
        starters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [prompt, onChoose]
            properties: { prompt: { $ref: "#/$defs/Text" }, onChoose: { enum: [send, fill] } }
        # A switch only hides what the spec offers; none shows what it does not.
        show:
          type: object
          additionalProperties: false
          required: [reasoning, toolDetail, usage, copy]
          properties:
            reasoning: { type: boolean }
            toolDetail: { type: boolean }
            usage: { type: boolean }
            copy: { type: boolean }
        # How each configurable button is drawn: by its text, or by a glyph.
        buttons:
          type: object
          additionalProperties: false
          required: [copy, edit, regenerate, attach, send, stop]
          properties:
            copy: { $ref: "telo:Ui/ButtonDisplaySpec" }
            edit: { $ref: "telo:Ui/ButtonDisplaySpec" }
            regenerate: { $ref: "telo:Ui/ButtonDisplaySpec" }
            attach: { $ref: "telo:Ui/ButtonDisplaySpec" }
            send: { $ref: "telo:Ui/ButtonDisplaySpec" }
            stop: { $ref: "telo:Ui/ButtonDisplaySpec" }
        # Whether the composer's buttons sit inside the message box's frame.
        composer:
          type: object
          additionalProperties: false
          required: [actions]
          properties: { actions: { enum: [inside, outside] } }
        # The page query parameter naming the conversation shown; null keeps the choice in memory.
        conversation:
          anyOf:
            - { type: "null" }
            - type: object
              additionalProperties: false
              required: [parameter]
              properties: { parameter: { type: string } }
        # Requests read again when a send is admitted and when a turn ends, over `conversation.id`.
        refreshes: { type: array, items: { $ref: "#/$defs/Address" } }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # An aside beside its content, both trees. `collapse` is null when the aside
    # never folds; `state` is null when the choice is kept in memory only.
    - additionalProperties: false
      required: [type, side, size, frame, toggle, label, aside, content, collapse, compact, fill]
      properties:
        type: { const: split }
        side: { enum: [start, end] }
        size: { enum: [small, medium, large] }
        frame: { $ref: "telo:Ui/Frame" }
        toggle: { $ref: "telo:Ui/ButtonDisplaySpec" }
        label: { $ref: "#/$defs/Text" }
        # `actions` holds the button-shaped links drawn under the aside's top bar.
        aside:
          type: object
          additionalProperties: false
          required: [actions, content]
          properties:
            actions: { type: array, items: { $ref: "#/$defs/Link" } }
            content: { $ref: "#" }
        content: { $ref: "#" }
        collapse:
          anyOf:
            - { type: "null" }
            - type: object
              additionalProperties: false
              required: [collapsed, state]
              properties:
                collapsed: { type: boolean }
                state:
                  anyOf:
                    - { type: "null" }
                    - type: object
                      additionalProperties: false
                      required: [key, store]
                      properties:
                        key: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]*$" }
                        store: { $ref: "telo:Ui/StateStoreSpec" }
        # The surface the aside becomes below the application's breakpoint.
        compact: { $ref: "telo:Ui/OverlaySpec#/$defs/Compact" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    - additionalProperties: false
      required: [type, code, message, fill]
      properties:
        type: { const: error }
        code: { type: string }
        message: { type: string }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
  $defs:
    # A `link` node, and each item of a `menu`.
    Link:
      type: object
      additionalProperties: false
      required: [type, text, href, button, fill]
      properties:
        type: { const: link }
        text: { $ref: "#/$defs/NodeText" }
        href: { $ref: "#/$defs/Address" }
        # Null draws the link inline as text.
        button:
          anyOf:
            - { type: "null" }
            - { $ref: "telo:Ui/ButtonDisplaySpec" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # An address or a request target as the renderer receives it, every member
    # present: `path` a template (`value`) or data (a chain) holding a whole
    # address; the other two by name, each value a binding.
    Address:
      type: object
      additionalProperties: false
      required: [path, pathParams, queryParams]
      properties:
        path: { $ref: "#/$defs/Binding" }
        pathParams: { type: object, additionalProperties: { $ref: "#/$defs/Binding" } }
        queryParams: { type: object, additionalProperties: { $ref: "#/$defs/Binding" } }
    # A text as the renderer receives it from `ui`: the record a controller
    # was handed (its renderer translates it), or a library's keyed text.
    Text:
      anyOf:
        - { $ref: "telo://manifest#/$defs/TextRecord" }
        - { $ref: "#/$defs/KeyedText" }
    # A text of a node: a text, or a text with the values it is formatted with.
    NodeText:
      anyOf:
        - { $ref: "#/$defs/Text" }
        - { $ref: "#/$defs/BoundText" }
    BoundText:
      type: object
      additionalProperties: false
      required: [text, values]
      properties:
        text: { $ref: "telo://manifest#/$defs/TextRecord" }
        values: { type: object, additionalProperties: { $ref: "#/$defs/Binding" } }
    # A key of a keyed translation set, by the set's canonical kind
    # (`Ui.Translations`); the renderer shows the set's message for the key.
    KeyedText:
      type: object
      additionalProperties: false
      required: [set, key]
      properties:
        set: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_]*$" }
        key: { type: string, minLength: 1 }
    # A text, or none.
    Description:
      anyOf:
        - { $ref: "#/$defs/Text" }
        - { type: "null" }
    # What each value of an enumeration is shown as: a titled `const` branch's
    # title, else the string value itself. The value sent back is the value.
    Labels:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [value, label]
        properties: { value: {}, label: { $ref: "#/$defs/Text" } }
    # An operation run from a page: its form, and what it draws of the answer
    # — `result` over `result`, `input` and `values`, `failure` over `error`,
    # `input` and `values`.
    Action:
      type: object
      additionalProperties: false
      required: [type, schema, request, label, fields, groups, state, failure, onSuccess, concurrency, clearAnswerOn, fill]
      properties:
        type: { const: action }
        schema: { type: object }
        # `consumed`: the input properties the target's parameters read whole
        # (`input.<property>`), which the body leaves out.
        request:
          type: object
          additionalProperties: false
          required: [method, target, consumed]
          properties:
            method: { enum: [POST, PUT, PATCH, DELETE] }
            target: { $ref: "#/$defs/Address" }
            consumed: { type: array, items: { type: string } }
        label: { $ref: "#/$defs/Text" }
        fields: { type: array, items: { $ref: "#/$defs/Field" } }
        groups: { type: array, items: { $ref: "#/$defs/Group" } }
        state: { $ref: "#/$defs/State" }
        # Present when the button is enabled by a condition over the values.
        enabled: { $ref: "#/$defs/Enablement" }
        # Present when the answer is declared: what a success's body is held to.
        answer: { type: object }
        # Present when something is drawn from a success.
        result: { $ref: "#" }
        failure: { $ref: "#" }
        onSuccess:
          type: object
          additionalProperties: false
          required: [refreshes]
          properties:
            navigate: { $ref: "#/$defs/Address" }
            refreshes: { type: array, items: { $ref: "#/$defs/Address" } }
        concurrency: { enum: [parallel, serial] }
        clearAnswerOn: { type: array, items: { type: string } }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
        fill: { type: boolean }
    # An operation a row offers: the action, what of the row it sends, and how
    # a press is asked and allowed. The action's own `enabled` is its form's.
    RowAction:
      type: object
      additionalProperties: false
      required: [action, inputs]
      properties:
        action: { $ref: "#/$defs/Action" }
        inputs: { type: object, additionalProperties: { $ref: "#/$defs/Binding" } }
        # Present when the press asks first.
        confirm: { $ref: "#/$defs/NodeText" }
        # Present when the press opens a dialog that enters these fields of the
        # action's input model before anything is sent.
        prompt:
          type: object
          additionalProperties: false
          required: [fields]
          properties: { fields: { type: array, items: { $ref: "#/$defs/Field" } } }
        enabled: { $ref: "#/$defs/Enablement" }
    # A condition deciding whether a button can be pressed, and why not.
    Enablement:
      type: object
      additionalProperties: false
      required: [at, matches, disabledText]
      properties:
        at: { $ref: "#/$defs/Binding" }
        matches: { $ref: "telo:Ui/Match" }
        disabledText: { $ref: "#/$defs/NodeText" }
    # A field of a record being entered, drawn while `shown` holds: one branch
    # per kind of field, tagged on `type`.
    Field:
      type: object
      oneOf:
        - { $ref: "#/$defs/InputField" }
        - { $ref: "#/$defs/ChoiceField" }
        - { $ref: "#/$defs/PickerField" }
        - { $ref: "#/$defs/DateRangeField" }
    # Entered with a control: derived from the property (`auto`) or the one named.
    InputField:
      type: object
      additionalProperties: false
      required: [type, property, label, description, labels, control]
      properties:
        type: { const: input }
        property: { type: string }
        label: { $ref: "#/$defs/Text" }
        description: { $ref: "#/$defs/Description" }
        labels: { $ref: "#/$defs/Labels" }
        control: { $ref: "telo:Ui/Control" }
        group: { type: string }
        shown: { $ref: "#/$defs/Shown" }
    # One or several of the options a source offers, in a list (`auto` or
    # `select`) or side by side (`options`).
    ChoiceField:
      type: object
      additionalProperties: false
      required: [type, property, label, description, labels, control, options]
      properties:
        type: { const: choice }
        property: { type: string }
        label: { $ref: "#/$defs/Text" }
        description: { $ref: "#/$defs/Description" }
        labels: { $ref: "#/$defs/Labels" }
        control: { enum: [auto, select, options] }
        options: { $ref: "telo:Ui/OptionSourceSpec" }
        group: { type: string }
        shown: { $ref: "#/$defs/Shown" }
    # One or several options searched for and chosen in a surface of their own.
    PickerField:
      type: object
      additionalProperties: false
      required: [type, property, label, description, labels, options, surface]
      properties:
        type: { const: picker }
        property: { type: string }
        label: { $ref: "#/$defs/Text" }
        description: { $ref: "#/$defs/Description" }
        labels: { $ref: "#/$defs/Labels" }
        options: { $ref: "telo:Ui/OptionSourceSpec" }
        surface: { $ref: "telo:Ui/OverlaySpec" }
        group: { type: string }
        shown: { $ref: "#/$defs/Shown" }
    # A `from` and a `to` date, with presets computed in the viewer's time zone.
    DateRangeField:
      type: object
      additionalProperties: false
      required: [type, property, label, description, labels, presets, weekStart, initialPreset]
      properties:
        type: { const: dateRange }
        property: { type: string }
        label: { $ref: "#/$defs/Text" }
        description: { $ref: "#/$defs/Description" }
        labels: { $ref: "#/$defs/Labels" }
        presets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label, unit, offset]
            properties:
              label: { $ref: "#/$defs/Text" }
              unit: { enum: [day, week, month, quarter, year] }
              offset: { type: integer }
        weekStart: { enum: [monday, sunday] }
        # The index of the preset the field starts at, or null.
        initialPreset: { type: [integer, "null"] }
        warnLongerThan:
          type: object
          additionalProperties: false
          required: [unit, count]
          properties: { unit: { enum: [day, week, month, quarter, year] }, count: { type: integer } }
        group: { type: string }
        shown: { $ref: "#/$defs/Shown" }
    # A labelled section of a form, drawn while `shown` holds.
    Group:
      type: object
      additionalProperties: false
      required: [name, label]
      properties:
        name: { type: string }
        label: { $ref: "#/$defs/Text" }
        description: { $ref: "#/$defs/Text" }
        shown: { $ref: "#/$defs/Shown" }
    # Where entered or chosen values are kept: the properties kept, the
    # address, and the store (`memory` when none is named).
    State:
      type: object
      additionalProperties: false
      required: [address, store, fields]
      properties:
        # Present exactly when the component declares `state`.
        key: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]*$" }
        address: { type: boolean }
        store: { $ref: "telo:Ui/StateStoreSpec" }
        fields: { type: array, items: { type: string } }
    # A condition as a renderer receives it: the binding it reads and the
    # schema the value must satisfy.
    Shown:
      type: object
      additionalProperties: false
      required: [at, matches]
      properties: { at: { $ref: "#/$defs/Binding" }, matches: { $ref: "telo:Ui/Match" } }
    StyleName: { enum: [heading, subheading, muted, strong, accent, danger, warning, success] }
    Style:
      anyOf:
        - { $ref: "#/$defs/StyleName" }
        - { type: array, items: { $ref: "#/$defs/StyleName" } }
    # A row-bound value: a path from a named root, or a fixed value.
    Binding:
      oneOf:
        - type: object
          additionalProperties: false
          required: [root, path]
          properties: { root: { type: string }, path: { type: array, items: { type: string } } }
        - type: object
          additionalProperties: false
          required: [value]
          properties: { value: {} }
    StyleRule:
      type: object
      additionalProperties: false
      required: [by, cases]
      properties:
        by: { $ref: "#/$defs/Binding" }
        cases: { type: object, additionalProperties: { $ref: "#/$defs/Style" } }
        default: { $ref: "#/$defs/Style" }
    AssetRef:
      type: object
      additionalProperties: false
      required: [digest, name]
      properties: { digest: { type: string }, name: { type: string } }
---
# Where a piece of interface floats over the page, as a renderer receives it.
# Tagged on `type`, one branch per kind; every member a branch names is present,
# so a renderer reads no default of its own.
kind: Telo.JsonSchema
metadata: { name: OverlaySpec }
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type, size, modal, dismiss]
      properties:
        type: { const: dialog }
        size: { enum: [small, medium, large, full] }
        modal: { type: boolean }
        dismiss: { $ref: "#/$defs/OverlayDismiss" }
        address: { $ref: "#/$defs/Address" }
        compact: { $ref: "#/$defs/Compact" }
    - additionalProperties: false
      required: [type, side, size, modal, dismiss]
      properties:
        type: { const: drawer }
        side: { enum: [start, end, top, bottom] }
        size: { enum: [small, medium, large, full] }
        modal: { type: boolean }
        dismiss: { $ref: "#/$defs/OverlayDismiss" }
        address: { $ref: "#/$defs/Address" }
        compact: { $ref: "#/$defs/Compact" }
    - additionalProperties: false
      required: [type, side, align, dismiss]
      properties:
        type: { const: popover }
        side: { enum: [top, bottom, start, end] }
        align: { enum: [start, center, end] }
        dismiss:
          type: object
          additionalProperties: false
          required: [escape, outside]
          properties: { escape: { type: boolean }, outside: { type: boolean } }
        compact: { $ref: "#/$defs/Compact" }
  $defs:
    Address:
      type: object
      additionalProperties: false
      required: [name]
      properties: { name: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]*$" } }
    OverlayDismiss:
      type: object
      additionalProperties: false
      required: [escape, outside, closeButton]
      properties:
        escape: { type: boolean }
        outside: { type: boolean }
        closeButton: { type: boolean }
    # The surface used instead below the breakpoint: a dialog or a drawer, with
    # no address and no compact surface of its own.
    Compact:
      type: object
      oneOf:
        - additionalProperties: false
          required: [type, size, modal, dismiss]
          properties:
            type: { const: dialog }
            size: { enum: [small, medium, large, full] }
            modal: { type: boolean }
            dismiss: { $ref: "#/$defs/OverlayDismiss" }
        - additionalProperties: false
          required: [type, side, size, modal, dismiss]
          properties:
            type: { const: drawer }
            side: { enum: [start, end, top, bottom] }
            size: { enum: [small, medium, large, full] }
            modal: { type: boolean }
            dismiss: { $ref: "#/$defs/OverlayDismiss" }
---
# Where a piece of interface appears, as a renderer receives it: an overlay, or
# a place in the page itself.
kind: Telo.JsonSchema
metadata: { name: SurfaceSpec }
schema:
  type: object
  oneOf:
    - { $ref: "telo:Ui/OverlaySpec" }
    - additionalProperties: false
      required: [type]
      properties:
        type: { const: inline }
        compact: { $ref: "telo:Ui/OverlaySpec#/$defs/Compact" }
    - additionalProperties: false
      required: [type, side, size, dismiss]
      properties:
        type: { const: panel }
        side: { enum: [start, end] }
        size: { enum: [small, medium, large] }
        dismiss:
          type: object
          additionalProperties: false
          required: [escape, closeButton]
          properties: { escape: { type: boolean }, closeButton: { type: boolean } }
        address: { $ref: "telo:Ui/OverlaySpec#/$defs/Address" }
        compact: { $ref: "telo:Ui/OverlaySpec#/$defs/Compact" }
    - additionalProperties: false
      required: [type, address]
      properties:
        type: { const: page }
        address: { $ref: "telo:Ui/OverlaySpec#/$defs/Address" }
---
# What a create form does once its record is saved.
kind: Telo.JsonSchema
metadata: { name: AfterCreate }
schema: { enum: [close, again, keep], default: close }
---
# What an edit form does once its record is saved.
kind: Telo.JsonSchema
metadata: { name: AfterEdit }
schema: { enum: [close, keep], default: close }
---
# What happens to input a form holds unsaved when something would close it.
kind: Telo.JsonSchema
metadata: { name: UnsavedInput }
schema: { enum: [confirm, discard], default: confirm }
---
# What a filter bar is told about itself beyond its fields: which filters are
# on show, where its controls sit, how each is entered, when a change applies,
# what summarises it and where its state is kept. A record: no member of it
# decides which other members may be written.
kind: Telo.JsonSchema
metadata: { name: FilterPolicy }
schema:
  type: object
  additionalProperties: false
  properties:
    show:
      title: Show
      description: >-
        Which filters are on show: `all` of them, or only the `chosen` — the
        pinned ones, those added from the bar's list, and those holding a value.
      enum: [all, chosen]
      default: all
    placement:
      title: Placement
      description: Where the controls sit relative to the content. Omitted, above it.
      x-telo-ref: { kind: Self.FilterPlacement, use: dependency }
    controls:
      title: Controls
      description: >-
        How a filter is drawn: its control `direct`ly, or as `chips` — a chip
        naming the filter and its value that opens the control.
      enum: [direct, chips]
      default: direct
    apply:
      title: Apply
      description: >-
        When a change takes effect: when it is `commit`ted — a choice at once,
        typed text on Enter or on leaving the field — while `typing`, after a
        pause, or only from an Apply `button`.
      enum: [commit, typing, button]
      default: commit
    summary:
      title: Summary
      description: >-
        What summarises the bar: `none`, or a row of removable `chips`, one per
        filter holding a value.
      enum: [none, chips]
      default: none
    state:
      title: State
      description: >-
        Where the bar's values are kept between visits. Omitted, in memory
        only. At least one of `address: true` and `store` is written.
      $ref: "telo:Ui/StateRecord"
---
# Where a filter bar's controls sit, as a renderer receives it. Tagged on
# `type`, one branch per kind.
kind: Telo.JsonSchema
metadata: { name: FilterPlacementSpec }
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type]
      properties: { type: { const: above }, compact: { $ref: "#/$defs/Compact" } }
    - additionalProperties: false
      required: [type, side, compact]
      properties:
        type: { const: aside }
        side: { enum: [start, end] }
        compact: { $ref: "#/$defs/Compact" }
    - additionalProperties: false
      required: [type, open]
      properties: { type: { const: collapsible }, open: { type: boolean } }
    - additionalProperties: false
      required: [type, surface]
      properties: { type: { const: overlay }, surface: { $ref: "telo:Ui/OverlaySpec" } }
  $defs:
    # The placement used instead below the breakpoint: one that folds.
    Compact:
      type: object
      oneOf:
        - additionalProperties: false
          required: [type, open]
          properties: { type: { const: collapsible }, open: { type: boolean } }
        - additionalProperties: false
          required: [type, surface]
          properties: { type: { const: overlay }, surface: { $ref: "telo:Ui/OverlaySpec" } }
---
# Where a piece of interface keeps its state, as a renderer receives it.
# `memory` is what a bar with no store carries; no kind provides it.
kind: Telo.JsonSchema
metadata: { name: StateStoreSpec }
schema:
  type: object
  additionalProperties: false
  required: [type]
  properties: { type: { enum: [memory, local, session] } }
---
# An application's navigation: the tree of entries a renderer draws, and how it
# is drawn. A page is named by reference, never by path, so a path changes in
# one place and a library's pages are put in the tree like the application's own.
kind: Telo.JsonSchema
metadata: { name: Navigation }
schema:
  type: object
  additionalProperties: false
  properties:
    items:
      title: Items
      description: >-
        The entries, in order: a page, a link, or a group of entries. Each
        entry's `when:` may read the request, evaluated per request; a group
        none of whose entries is delivered is left out.
      type: array
      items: { $ref: "telo:Ui/NavigationItem" }
      x-telo-context:
        type: object
        properties:
          request:
            x-telo-context-eval: runtime
            type: object
            properties:
              headers: { type: object, additionalProperties: { type: string } }
              ip: { type: string }
              lang: { type: string, description: The language negotiated for the request. }
    placement:
      title: Placement
      description: >-
        How the tree is drawn. Omitted, in the header, behind a menu button on
        a narrow viewport.
      x-telo-ref: { kind: Self.NavigationPlacement, use: dependency }
---
# One entry of a navigation tree, tagged on `type`: a page the application
# serves, a link to any address, or a group of entries nested to any depth.
kind: Telo.JsonSchema
metadata: { name: NavigationItem }
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type, page]
      properties:
        type: { const: page }
        page:
          title: Page
          description: The page the entry leads to, one the application lists in its pages.
          x-telo-ref: { kind: Self.Page, use: dependency }
        text:
          title: Text
          description: What the entry says. Omitted, the page's title.
          $ref: "telo://manifest#/$defs/Text"
          x-telo-text-values: {}
        icon: { $ref: "#/$defs/Icon" }
        when:
          title: When
          description: Whether the entry is delivered, per request.
          type: boolean
          default: true
    - additionalProperties: false
      required: [type, text, href]
      properties:
        type: { const: link }
        text:
          title: Text
          description: What the entry says.
          $ref: "telo://manifest#/$defs/Text"
          x-telo-text-values: {}
        href:
          title: Address
          description: >-
            Where the entry leads: a path under the application's mount, or an
            `https:`, `http:` or `mailto:` address.
          type: string
          anyOf: [{ $ref: "telo:Ui/AppRelativeReference" }, { pattern: "^(https://|http://|mailto:)" }]
        icon: { $ref: "#/$defs/Icon" }
        when:
          title: When
          description: Whether the entry is delivered, per request.
          type: boolean
          default: true
    - additionalProperties: false
      required: [type, text, items]
      properties:
        type: { const: group }
        text:
          title: Text
          description: What the group's button says.
          $ref: "telo://manifest#/$defs/Text"
          x-telo-text-values: {}
        items:
          title: Items
          description: The group's entries, in order.
          type: array
          minItems: 1
          items: { $ref: "telo:Ui/NavigationItem" }
        icon: { $ref: "#/$defs/Icon" }
        when:
          title: When
          description: Whether the group is delivered, per request.
          type: boolean
          default: true
  $defs:
    Icon:
      title: Icon
      description: >-
        The glyph drawn before the entry's text, and in place of its first
        letter in a sidebar's rail.
      x-telo-ref: { kind: Self.Icon, use: dependency }
---
# How a navigation tree is drawn, as a renderer receives it. Tagged on `type`,
# one branch per kind; every member a branch names is present.
kind: Telo.JsonSchema
metadata: { name: NavigationPlacementSpec }
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type, compact]
      properties: { type: { const: header }, compact: { $ref: "#/$defs/Compact" } }
    # A column beside the page. `rail` is present when it collapses to one,
    # and says whether it starts collapsed; `store` keeps its open groups and
    # whether it is collapsed.
    - additionalProperties: false
      required: [type, side, store, compact]
      properties:
        type: { const: sidebar }
        side: { enum: [start, end] }
        rail:
          type: object
          additionalProperties: false
          required: [collapsed]
          properties: { collapsed: { type: boolean } }
        store: { $ref: "telo:Ui/StateStoreSpec" }
        compact: { $ref: "#/$defs/Compact" }
    - { $ref: "#/$defs/Overlay" }
    - { $ref: "#/$defs/TabBar" }
  $defs:
    # The whole tree behind a menu button, in a surface the button opens.
    Overlay:
      type: object
      additionalProperties: false
      required: [type, surface]
      properties: { type: { const: overlay }, surface: { $ref: "telo:Ui/OverlaySpec" } }
    # The top-level entries as tabs along the bottom edge, at most `visible`
    # of them; a group, or More holding the rest, opens in `surface`.
    TabBar:
      type: object
      additionalProperties: false
      required: [type, visible, surface]
      properties:
        type: { const: tab-bar }
        visible: { type: integer, minimum: 2, maximum: 5 }
        surface: { $ref: "telo:Ui/OverlaySpec" }
    # The placement used instead below the breakpoint.
    Compact:
      type: object
      oneOf:
        - { $ref: "#/$defs/Overlay" }
        - { $ref: "#/$defs/TabBar" }
---
kind: Telo.Abstract
metadata:
  name: Composite
  description: >-
    A reusable piece of interface that carries its own configuration and expands
    into renderable nodes: a data grid, an input form, a filter bar, a custom
    widget, or a group of them. Provides the node a renderer draws and the list
    of files the browser must load for it, each addressed by its content digest.
capability: Telo.Provider
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [assets]
    properties:
      # Absent when the composite has nothing to show: whoever placed it leaves
      # it out, as it would a node whose `when:` is false.
      node: { $ref: "telo://Self/SpecNode" }
      assets:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [digest, name, file, mediaType]
          properties:
            digest: { type: string, pattern: "^[0-9a-f]{64}$" }
            name: { type: string }
            file: { x-telo-type: Telo.HostPath }
            mediaType: { type: string }
---
# Where a piece of interface appears and how it is dismissed. Whoever opens a
# form names one; each way of appearing is a kind of its own.
kind: Telo.Abstract
metadata:
  name: Surface
  description: >-
    Where a piece of interface appears when it is opened and how it is
    dismissed: floating over the page, in line with the content, in a side
    panel beside it, or in place of the page. Provides the placement, size and
    dismissal settings a renderer draws a create or edit form with.
capability: Telo.Provider
outputType: !ref SurfaceSpec
---
kind: Telo.Abstract
metadata:
  name: Overlay
  description: >-
    A surface floating over the page: a centred window, a sheet sliding in from
    an edge, or a small card anchored to the control that opened it. Provides
    its placement and dismissal settings, and suits any place that needs its
    content on top of the page rather than inside it.
capability: Telo.Provider
extends: Self.Surface
outputType: !ref OverlaySpec
---
# An overlay placed against the viewport, not against what opened it: what a
# surface's `compact` names, since a card anchored to its button does not fit
# a narrow viewport.
kind: Telo.Abstract
metadata:
  name: ViewportOverlay
  description: >-
    An overlay placed against the screen rather than the button that opened
    it: a centred window or a sheet sliding in from an edge. Suits a phone
    screen, so it is what replaces a surface on a narrow viewport. Provides its
    placement and dismissal settings.
capability: Telo.Provider
extends: Self.Overlay
---
kind: Telo.Definition
metadata:
  name: Dialog
  description: >-
    A centred window over the page for a create or edit form: a modal or
    non-modal dialog in one of four sizes, closed by Escape, a click outside or
    a close button, each of which can be switched off. Can be given an address
    so an open form is linkable, and a replacement for narrow viewports.
capability: Telo.Provider
extends: Self.ViewportOverlay
controllers: [pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#DialogController]
schema:
  type: object
  additionalProperties: false
  properties:
    size:
      title: Size
      description: How much of the viewport it takes.
      enum: [small, medium, large, full]
      default: medium
    modal:
      title: Modal
      description: Whether the page behind it is blocked while it is open.
      type: boolean
      default: true
    dismiss:
      title: Dismiss
      description: The ways it can be closed besides the form's own buttons.
      type: object
      additionalProperties: false
      properties:
        escape: { title: Escape, description: The Escape key closes it., type: boolean, default: true }
        outside: { title: Outside, description: A click outside it closes it., type: boolean, default: true }
        closeButton: { title: Close button, description: It shows a close button., type: boolean, default: true }
    address:
      title: Address
      description: >-
        Makes the open surface part of the page's address, so it can be linked
        to, reloaded and left with the browser's back button.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          title: Name
          description: The name the open surface is addressed under, letters and digits.
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9]*$"
    compact:
      title: Compact
      description: >-
        The surface used instead on a narrow viewport: a `Ui.ViewportOverlay`,
        such as a dialog or a drawer. It takes the address of this one, and
        declares neither an address nor a compact surface itself.
      x-telo-ref: { kind: Self.ViewportOverlay, use: dependency }
  x-telo-resource-rules:
    - resolve: [/compact]
      condition: !cel "!has(self.compact) || !has(self.compact.address)"
      code: UI_SURFACE_COMPACT_ADDRESSED
      message: >-
        names a compact surface that declares an address. The address of a
        compact surface is the one of the surface it stands in for: remove
        `address` from it.
    - resolve: [/compact]
      condition: !cel "!has(self.compact) || !has(self.compact.compact)"
      code: UI_SURFACE_COMPACT_NESTED
      message: >-
        names a compact surface that declares a compact surface of its own.
        Only one level applies: remove `compact` from it.
