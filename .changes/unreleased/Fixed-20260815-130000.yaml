project: rate-limit
kind: Fixed
body: "'amount' and 'reserved' are declared `type: integer`, so they reach the
  controller as an int64 whenever CEL or another resource's output produced them
  — and `Number.isInteger` is false for one while `amount - reserved` throws.
  A settle fed by the matching reserve's own result was rejected as a
  non-integer. Both are read through `integerInput`, which accepts either
  representation."
