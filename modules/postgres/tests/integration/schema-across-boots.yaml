kind: Telo.Application
metadata:
  name: PostgresSchemaAcrossBoots
  version: 1.0.0
  description: |
    Deferred reclamation across REAL boots, on PostgreSQL.

    Each fixture is a separate application at its own released version, run in its
    own kernel by the suite below, against one namespace in one database — so the
    ledger each boot reads is one an earlier PROCESS wrote, and `module.version`
    genuinely moves between them. The sequence covers every state a schema object
    can pass through: declared, re-read unchanged by a second boot, dropped from
    the declaration and HELD, reclaimed, verifiably gone; then renamed
    (expand-contract, with the data copied), a rename whose source was already
    reclaimed and is therefore INERT, a tombstone REVIVED by re-declaring the
    column, the changes PostgreSQL refuses to make to data already present, and a
    second schema resource owning its own tables in the same namespace.

    The SQLite suite is the same sequence against an engine with different powers,
    and the differences are the point: PostgreSQL alters a column's type in place
    when the conversion widens, so what it refuses is narrowing, wrapping in an
    array, toggling a key or a unique constraint, and adding NOT NULL over rows
    that may hold NULL.

    Ordering is the point, so the fixtures are numbered and the suite runs one at a
    time: discovery sorts by path, and `concurrency: 1` keeps that order.

    NEEDS A LIVE POSTGRES, which is why it is under `tests/integration/`.
imports:
  Test: ../../../test
targets:
  - !ref boots
---
kind: Test.Suite
metadata: { name: boots }
include:
  - "__fixtures__/schema-boots/*.yaml"
# These fixtures ARE the test, so the default fixture exclusion is dropped — it
# exists to stop the workspace suite running them directly, which is still true
# of the suite above this one.
exclude: []
concurrency: 1
