modules:
  modules/watch: Added
body: "New module. Watch.Wait holds a call until a topic's version passes the caller's
  cursor, returning { changed, version }: at once when the version is already past it,
  within milliseconds of a publish, or with changed false at the call's timeout, capped
  by the resource's maxTimeout. Any number of waiters share a topic, a timed-out cursor
  can be waited on again, and a cancelled call releases its waiter and rethrows the
  cancellation. Watch.Publish raises a topic's version monotonically and wakes every
  waiter below it. Watch.Store is the store contract and Watch.MemoryStore the
  in-process backend. A wait inside a durable region is refused by telo check
  (ZONE_ATTRIBUTE_VIOLATED) and at runtime (ERR_WATCH_REPLAY_FORBIDDEN)."
