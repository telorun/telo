units:
  apps/k8s-runner: Added
body: Every Run of a session's application receives its own TELO_HOST_STATE_DIR
  (apps/<app name> of the session's claim, mounted once into the apps container at
  /var/lib/telo-apps, so the pod does not depend on the app set) and its own
  TELO_HOST_SECRET_SEED, derived from the runner's root seed, the session id and the
  application's name, over any value the client sent. The root seed is
  RUNNER_SECRET_SEED when set, else a secret-seed file the runner keeps in its state
  claim beside the session store. The chart takes it from a Secret reference,
  secretSeed.existingSecret with key secretSeed.existingSecretKey (default seed); with
  the PostgreSQL store and no Secret no seed is delivered and the runner logs a startup
  warning.
