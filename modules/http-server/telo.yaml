kind: Telo.Library
metadata:
  name: HttpServer
  version: "0.44.2"
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Transport]
  description: >-
    Serving HTTP: a listener bound to a port with CORS, per-mount authentication
    of the caller through bearer tokens, API keys, cookies or client certificates,
    authorization policies, request guards and a generated OpenAPI document, routers whose
    routes validate the request against a schema, map it into a handler with CEL, and
    render conditional typed responses buffered or streamed, a browsable API reference
    router, and a static file router with SPA fallback for shipping a frontend
    alongside the API.
requires:
  # Controllers return their effects from `init()` / `run()`; a runtime that does
  # not execute a returned chain allocates nothing and undoes nothing.
  #
  # Deliberately NOT raised for the scope-level `catches:` lists: verified by
  # execution, 0.87.0 reads this module with no issues, because both new
  # annotation forms degrade to silence there (`x-telo-catches-for: ""` is falsy,
  # so the list is skipped; `throwsThrough` is an unknown key inside an
  # x-telo-ref). A floor nothing can refute is a claim nothing checks.
  #
  # 0.91.0: a `sources:` entry claimed by an `assets:` pattern, which an older
  # analyzer rejects as SOURCE_ENTRY_UNCLAIMED, and `ctx.resolveControllerFile`,
  # which the Reference controller calls.
  #
  # 0.98.0: `Http.Static.root` is a `Telo.HostPath`, which 0.97.0 rejects as
  # X_TELO_TYPE_UNKNOWN (verified by execution).
  #
  # 0.104.0: the request span continues an inbound `traceparent` through
  # `openSpan`'s W3C carrier, which an older kernel ignores and so roots every
  # trace, and the controllers import `errorTypeOf` from the runtime's SDK, which
  # 0.103.2 does not export (its load fails; verified by execution).
  #
  # 0.108.0: the request binding copies a framework's own bag into a plain
  # object, asking the value domain with `isCelRecord`. `@telorun/sdk` is
  # external and collapsed to the runtime's own copy, so on a runtime whose SDK
  # does not export that name it is undefined and a route dies at creation with
  # a TypeError naming this module. Verified by execution: the published 0.107.0
  # tarball exports no such name.
  # 0.121.0: `Http.Static.root` declares `entry: directory`, which 0.120.1 rejects as
  # X_TELO_TYPE_ARGUMENT_UNKNOWN (verified by execution).
  #
  # 0.123.0: `Http.Server` declares `throws.codes` with a `displayMessage`, which
  # 0.122.0 rejects on a Service, and the controllers import the problem
  # renderer's SDK names (`formatDisplayMessage`, `valueIssue`) and call
  # `ctx.declaredDisplayMessage`, none of which an older runtime has (verified
  # by execution).
  #
  # 0.129.0: the controllers read `ctx.translations`, which an older runtime does
  # not have, to negotiate `request.lang`: a request on 0.127.0 dies with "Cannot
  # read properties of undefined (reading 'languages')" (verified by execution).
  #
  # 0.130.0: the controllers import `errorValueOf` from the SDK to write the
  # failure trace into `Http.Api.streamFailed`; a 0.129.0 runtime fails to load
  # the controller (verified by execution). The same release first reads
  # `x-telo-context-from-referrer` on an evaluated binding,
  # `x-telo-context-nullable-when`, `x-telo-ref.outputTo` and the object form of
  # `x-telo-catches-for`, which the mount authentication schema uses.
  #
  # unreleased: the `restrictions:` key below, which no published telo reads.
  telo: ">=0.133.0"
restrictions:
  - requires: { telo: ">=0.133.0" }
    reason: "The server reports `status.localUrl` from `run()`, which an older kernel refuses when a templated kind's `run:` starts the server, so that start fails."
  - requires: { telo: ">=0.133.0" }
    reason: Http.Server serves a socket the host process supplies through ctx.claimListener, which kernels before this release lack.
lang: en
imports:
  # Single source of truth for the returns:/catches: schema. EVERY slot anchors at
  # HttpDispatch.Outcomes/$defs/{Returns,Catches} — Server.notFoundHandler, the
  # two scope-level catch lists, and Api.routes[], which carried its own inline
  # copy of both shapes until they were collapsed here — so the entry shape, the
  # MIME negotiation rules and the buffer/stream oneOf live in exactly one place.
  HttpDispatch: ../http-dispatch
  # The response-encoder contract this module's own encoder slots pin.
  Codec: ../codec
  # The caller, credential and verifier contracts mount authentication speaks.
  Auth: ../auth
exports:
  kinds: [Server, Api, Reference, Static, CredentialSource, FromAuthorization, FromBasic, FromHeader, FromQuery, FromCookie, FromClientCertificate, FromForwardedIdentity]
  resources: [Authentication, Authorization, AuthScheme, CredentialRequest]
# Scalar's browser bundle, served by Reference. Lazily fetched: an app that
# declares no Reference never downloads it. `sources.scalar.version` must be the
# @scalar/fastify-api-reference release whose @scalar/core and
# @scalar/openapi-parser versions nodejs/package.json pins — the page HTML and the
# script reading it come from one release; nodejs/tests/scalar-release.test.ts
# checks it.
assets: [./assets/]
sources:
  scalar:
    version: 1.44.6
    url: https://registry.npmjs.org/@scalar/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/scalar.LICENSE]
    entries:
      ./assets/scalar/standalone.js:
        { upstream: fastify-api-reference, member: package/dist/js/standalone.js, sha256: 06257160bce05df2dd25eeced830c5e3de2ac82e59bd2861db74fc068a4e429d, executable: false }
      ./notices/scalar.LICENSE:
        { upstream: fastify-api-reference, member: package/LICENSE, sha256: 380cd0a6ad700e1f821f2a509f0dd9ff835041cee2d43daf5dedc1adb2bcc620, executable: false }
---
kind: "Telo.Definition"
metadata:
  name: "Server"
  description: >-
    Listens on a TCP port and serves HTTP through the routers mounted on it, with
    CORS, per-mount authentication of the caller and authorization policies,
    request guards, a generated OpenAPI document and custom content-type parsers. Request bodies are
    bounded in bytes: a larger one is answered 413, and a body nobody reads to its
    end closes the connection.
capability: Telo.Service
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#HttpServerController]
# The refusals this server answers itself, before or beside any route — no
# `catches:` list sees them. Declared for their texts: each is rendered as a
# problem whose `detail` is the code's display message.
throws:
  codes:
    ERR_REQUEST_BODY_TOO_LARGE:
      description: >-
        The request body is larger than `maxBodyBytes` (the route's, else the
        server's). Answered 413 with `Connection: close`.
      displayMessage: "The request body is larger than the {$maxBodyBytes} bytes this server accepts."
      data:
        type: object
        additionalProperties: false
        required: [maxBodyBytes]
        properties:
          maxBodyBytes: { type: integer, description: The limit the body exceeded, in bytes. }
          contentLength: { type: integer, description: The length the request declared, when it declared one. }
    ERR_HOST_NOT_SERVED:
      description: >-
        Under `unknownHosts: reject`, the request's host is one no mount's
        `hostnames` names. Answered 421 Misdirected Request.
      displayMessage: "This server does not serve the host {$host}."
      data:
        type: object
        additionalProperties: false
        required: [host]
        properties: { host: { type: string, description: The host the request was sent to. } }
    ERR_HTTP_UNAUTHENTICATED:
      description: >-
        A mount's authentication refused the request: no credential where anonymous
        callers are denied, or a credential that is malformed or refused. Answered
        401 with every challenge in one `WWW-Authenticate`.
      displayMessage: "Authentication is required to access this resource."
      data:
        type: object
        additionalProperties: false
        required: [reason]
        properties:
          reason: { type: string, enum: [absent, malformed, refused], description: Why the request is not authenticated. }
    ERR_HTTP_FORBIDDEN:
      description: >-
        The authorization policy denied the action. Answered 403, with
        `WWW-Authenticate: <scheme> error="insufficient_scope"` when the policy
        names the scopes the caller lacks.
      displayMessage: "You are not allowed to perform this action."
      data:
        type: object
        additionalProperties: false
        properties:
          requiredScopes: { type: array, items: { type: string }, description: The scopes that would allow the action. }
    ERR_HTTP_CROSS_ORIGIN_REFUSED:
      description: >-
        A request that changes state, authenticated by a credential the browser
        sends on its own (a cookie), came from another site. Answered 403.
      displayMessage: "This request came from another site and was refused."
    ERR_HTTP_ACCESS_CHECK_UNAVAILABLE:
      description: >-
        A credential source, verifier or policy could not decide — its keys or
        endpoint unreachable. Answered 503; the failure is the cause in the trace
        and the log, never in the response.
      displayMessage: "The access check could not be completed. Try again later."
      data:
        type: object
        additionalProperties: false
        required: [stage]
        properties:
          stage: { type: string, enum: [source, verifier, policy], description: The step that failed. }
schema:
  type: "object"
  properties:
    listen:
      title: Listen
      description: >-
        The socket this server binds: the network interface and the TCP port. When
        the host running the application holds the port's socket, the server serves
        that one and binds nothing. An address the server is REACHED at is a
        different thing — a public address need (`Telo.PublicUrl`) a mount names in
        `hostnames`.
      type: "object"
      additionalProperties: false
      required: [ "port" ]
      properties:
        address:
          title: Address
          description: >-
            Network interface the server listens on. The default `0.0.0.0` accepts
            connections from other machines, which a container, a runner session or
            any proxy in front of the app requires — leave it unset for an
            application. `127.0.0.1` accepts connections from the same machine only;
            use it for a mock server inside a test.
          type: "string"
          x-telo-eval: compile
          default: "0.0.0.0"
        port:
          title: Port
          description: TCP port the server listens on — `!cel "ports.http"` in an application.
          type: "integer"
          x-telo-eval: compile
          x-telo-type: Telo.TcpPort
          minimum: 1
          maximum: 65535
    # Kept only so a manifest still writing the old spelling is told where it
    # moved (HTTP_SERVER_LISTEN_MOVED) rather than that the key is unknown.
    host:
      title: Host (moved)
      description: Moved to `listen.address`.
      deprecated: true
      x-telo-eval: compile
    port:
      title: Port (moved)
      description: Moved to `listen.port`.
      deprecated: true
      x-telo-eval: compile
    unknownHosts:
      title: Unknown Hosts
      description: >-
        `serve` (the default) hands a request whose host no mount's `hostnames` names to the mounts
        without `hostnames`; `reject` answers it 421 with the problem `ERR_HOST_NOT_SERVED`, except
        an IP-literal host. See docs/host-routing.md.
      type: "string"
      enum: [ "serve", "reject" ]
      default: "serve"
      x-telo-eval: compile
    tls:
      title: TLS
      description: >-
        Serve HTTPS: the server's certificate and private key, and optionally
        client certificates for mutual TLS. Unreadable or mismatched material
        fails the server's creation. Omitted, the server speaks plain HTTP. For
        a deployment behind a TLS-terminating proxy leave it unset.
      type: object
      additionalProperties: false
      required: [cert, key]
      x-telo-eval: compile
      if:
        required: [clientCertificate]
        properties: { clientCertificate: { enum: [optional, required] } }
      then: { required: [clientCa], properties: { clientCa: { minItems: 1 } } }
      else: { not: { required: [clientCa] } }
      properties:
        cert:
          title: Certificate
          $ref: "#/$defs/PemSource"
          description: Server certificate chain, PEM.
        key:
          title: Private key
          $ref: "#/$defs/PemSource"
          description: >-
            Private key of `cert`. The TLS checks never log or echo it; use a
            secret or a file.
        passphrase:
          title: Key passphrase
          type: string
          description: Passphrase of an encrypted `key`.
        clientCa:
          title: Client CA certificates
          type: array
          items: { $ref: "#/$defs/PemSource" }
          description: >-
            Authorities that sign accepted client certificates. Required with
            `clientCertificate` `optional` or `required`, refused with `none`.
        clientCertificate:
          title: Client certificate
          type: string
          enum: [none, optional, required]
          default: none
          description: >-
            Mutual TLS. `required` rejects a connection that presents no
            certificate signed by `clientCa`; `optional` asks, completes the
            handshake whatever is presented and records it in
            `request.clientCertificate`; `none` does not ask.
        minVersion:
          title: Minimum TLS version
          type: string
          enum: [TLSv1.2, TLSv1.3]
          default: TLSv1.2
          description: The oldest protocol version the server negotiates.
    trustForwardedHeaders:
      title: Trust Forwarded Headers
      description: >-
        Trust the standard X-Forwarded-Proto / X-Forwarded-Host (RFC 7239)
        headers from a fronting proxy. When true, the request protocol/host and
        the OpenAPI `servers` URL reflect the proxy/ingress URL the client used.
        Without it the OpenAPI `servers` is relative and resolves against the
        origin the docs were loaded from. Default false; only enable behind a
        trusted proxy.
      type: "boolean"
      x-telo-eval: compile
      default: false
    trustProxy:
      title: Trust Proxy
      description: >-
        Trust a fronting proxy when deriving the canonical client address
        (`request.ip`) and forwarded protocol/host. `true` trusts any hop;
        an integer trusts that many proxy hops (the rightmost N entries of
        X-Forwarded-For). Supersedes `trustForwardedHeaders` when set. Only
        enable behind a trusted proxy — otherwise clients can spoof their IP.
      type: ["boolean", "integer"]
      x-telo-eval: compile
    forwardedClientCertificate:
      title: Forwarded Client Certificate
      description: >-
        Read the client certificate a TLS-terminating proxy forwards in a header
        into `request.clientCertificate`, with `verified: false, via: proxy`.
        Needs `trustProxy`. A header that cannot be read yields null; a
        certificate this listener verified itself wins.
      type: object
      additionalProperties: false
      required: [header, format]
      x-telo-eval: compile
      properties:
        header:
          title: Header
          type: string
          minLength: 1
          description: The request header holding the certificate, e.g. `x-forwarded-client-cert`.
        format:
          title: Format
          type: string
          enum: [xfcc, pem, base64-der]
          description: >-
            `xfcc` — Envoy's `x-forwarded-client-cert`, its last element's `Cert`;
            `pem` — URL-escaped PEM (nginx); `base64-der` — base64 DER, optionally
            URL-escaped, the first of a comma-separated chain (Traefik).
    preferredLanguages:
      title: Preferred Languages
      description: >-
        CEL over the request (`headers`, `cookies`, `query`, `path`, `host`,
        `method`, `ip`, `tls`, `clientCertificate`) returning language tags in
        preference order — a cookie, a path prefix, a query parameter. They are
        tried before `Accept-Language`; a malformed or unserved tag is skipped.
        Evaluated per request; the headers it reads, `Cookie` for a cookie, are
        added to the response's `Vary`.
      type: array
      items: { type: string }
      x-telo-context:
        type: object
        additionalProperties: false
        properties:
          request:
            type: object
            additionalProperties: false
            properties:
              headers: { type: object, additionalProperties: true }
              query: { type: object, additionalProperties: true }
              path: { type: string }
              host: { type: string, description: "The request's host, lowercased and without its port — from X-Forwarded-Host only behind a trusted proxy." }
              cookies: { type: object, additionalProperties: { type: string }, description: "The request's cookies by name, the first of a repeated name, each value as sent." }
              tls:
                description: "The TLS session of the socket the request arrived on: `{ protocol }`, null on a plain socket."
                type: [object, "null"]
                additionalProperties: false
                properties: { protocol: { type: string } }
              clientCertificate:
                description: "The client certificate the listener received or a trusted proxy forwarded; null when there is none."
                type: [object, "null"]
                additionalProperties: false
                properties:
                  subject: { type: object, additionalProperties: { type: string } }
                  issuer: { type: object, additionalProperties: { type: string } }
                  serialNumber: { type: string }
                  fingerprint256: { type: string }
                  validFrom: { x-telo-type: Telo.Timestamp }
                  validTo: { x-telo-type: Telo.Timestamp }
                  subjectAltNames: { type: array, items: { type: string } }
                  pem: { type: string }
                  verified: { type: boolean }
                  via: { type: string, enum: [listener, proxy] }
              method: { type: string }
              ip: { type: string }
    maxBodyBytes:
      title: Max Body Bytes
      description: >-
        Most of a request body buffered or handed to a handler, in bytes, for every mount; a larger
        one is answered 413 (`ERR_REQUEST_BODY_TOO_LARGE`), which no `catches:` list sees. A
        route's `maxBodyBytes` replaces it.
      type: "integer"
      x-telo-eval: compile
      minimum: 1
      default: 1048576
    # No `logger:` field. Request logging is not a per-server flag — it is
    # governed by the structured logging pipeline like everything else. Fastify's
    # per-request access lines are `info`-severity, so they appear whenever this
    # server's scope is at `info` or below (the default), and are suppressed by
    # raising the http-server import to `level: warn`:
    #
    #   imports:
    #     Http:
    #       source: oci://ghcr.io/telorun/http-server@<version>
    #       logging:
    #         level: warn   # server errors only, no per-request access logs
    #
    # See docs/guides/logging.md and kernel/specs/logging.md §13.3.
    openapi:
      title: OpenAPI
      description: >-
        OpenAPI document metadata. Declaring it collects an OpenAPI document from
        every mounted route's schema; mount an `Http.Reference` to serve that
        document and its browsable reference page at a path you choose.
      type: "object"
      x-telo-eval: compile
      properties:
        info:
          title: Info
          description: OpenAPI info block.
          type: "object"
          properties:
            title:
              title: Title
              description: API title shown in OpenAPI documentation.
              type: "string"
            version:
              title: Version
              description: API version shown in OpenAPI documentation.
              type: "string"
          required: [ "title", "version" ]
      required: [ "info" ]
    mounts:
      title: Mounts
      description: Mount points attached to the HTTP server.
      # A list of dispatch entries: `entries` on the array, `matcher` on the
      # field that selects one, `handler` on the reference it dispatches to —
      # the same three tokens `Http.Api.routes` and `Mcp.Tools.entries` carry.
      # It is what lets the editor render mounts as an ordered list rather than
      # as a set of nodes, and mount order is match order, which a picture of
      # nodes cannot carry.
      x-telo-topology-role: entries
      type: "array"
      # Evaluated per field rather than on the whole list: `guard` holds CEL
      # evaluated per request, which a compile mark on an ancestor would expand
      # at startup.
      items:
        title: Mount
        description: Single mount configuration.
        type: "object"
        additionalProperties: false
        required: [ "mount" ]
        # What a request on this mount reads once it is authenticated: the
        # `authorization` CEL, and — through the `mount` slot — the routes of
        # the router mounted here, which type `request.principal` from it.
        x-telo-context:
          type: object
          properties:
            request:
              type: object
              x-telo-context-eval: runtime
              additionalProperties: false
              properties:
                headers: { type: object, additionalProperties: true }
                query: { type: object, additionalProperties: true }
                path: { type: string }
                host: { type: string, description: "The request's host, lowercased and without its port — from X-Forwarded-Host only behind a trusted proxy." }
                cookies: { type: object, additionalProperties: { type: string }, description: "The request's cookies by name, the first of a repeated name, each value as sent." }
                lang: { type: string, description: "The language negotiated for the request: a served language tag, always present." }
                method: { type: string }
                ip: { type: string }
                principal:
                  $ref: "telo://Auth/Principal"
                  description: The authenticated caller; null where the mount allows anonymous callers or declares no authentication.
                  x-telo-context-nullable-when: { at: "0/authentication/anonymous", equals: [allow], absent: true }
        properties:
          path:
            title: Path
            description: URL prefix where the mount is attached.
            type: "string"
            x-telo-eval: compile
            x-telo-topology-role: matcher
          hostnames:
            title: Hostnames
            description: >-
              The hosts this mount answers: references to the application's public address needs,
              never domain names. Each need must name the port this server listens on; omitted, the
              mount answers every host. Precedence is in docs/host-routing.md.
            type: "array"
            minItems: 1
            x-telo-topology-role: matcher
            items: { x-telo-schema-from: "HttpDispatch.Request/$defs/Hostname" }
          mount:
            title: Mount
            description: >-
              Mount resource to attach — a reference to a Telo.Mount (Http.Api
              or any other mountable kind). Use a `!ref` to the resource by name; an
              `!ref <Alias>.<name>` reaches a mount exported by an imported
              library.
            x-telo-topology-role: handler
            x-telo-ref:
              kind: Telo.Mount
              use: dependency
              # `dependency` is the honest use: the server holds the mount and
              # calls a convention method on it, and control reaches a route
              # through the MOUNT's own trigger.inbound slot, not through this
              # one. Yet a throw from that route is exactly what this server
              # renders — it arrives at the server's error handler because
              # nothing below claimed it — so the throws closure and the catch
              # scope both cross here, and nowhere else a `dependency` leads.
              throwsThrough: true
          authentication:
            title: Authentication
            description: >-
              Who may call this mount's routes: the verifiers tried in order, each
              with where its credential is read, and whether a request presenting
              none is served anonymously. A credential that is presented and fails
              is a 401; it never falls through to a later verifier or to anonymous.
            $ref: "telo://Self/Authentication"
            x-telo-raises: [ERR_HTTP_UNAUTHENTICATED, ERR_HTTP_CROSS_ORIGIN_REFUSED, ERR_HTTP_ACCESS_CHECK_UNAVAILABLE]
          authorization:
            title: Authorization
            description: >-
              The policy deciding, after authentication, whether the request may
              perform `action` on `resource`; a denial is a 403. A route's own
              `authorization` replaces this one.
            $ref: "telo://Self/Authorization"
            x-telo-raises: [ERR_HTTP_FORBIDDEN, ERR_HTTP_ACCESS_CHECK_UNAVAILABLE]
          protectedResource:
            title: Protected resource
            description: >-
              Publishes this mount's OAuth 2.0 protected-resource metadata (RFC 9728) at
              `/.well-known/oauth-protected-resource<path>`, unauthenticated, on the mount's
              hostnames, and names it in every 401. The resource, authorization servers and bearer
              methods are derived from the mount's address, verifiers and sources.
            type: object
            additionalProperties: false
            properties:
              scopesSupported:
                title: Scopes supported
                description: The scopes the resource documents as supported.
                type: array
                items: { type: string, minLength: 1 }
              resourceName:
                title: Resource name
                description: A human-readable name for the resource.
                type: string
              resourceDocumentation:
                title: Resource documentation
                description: URL of documentation for developers using the resource.
                type: string
                format: uri
              resourcePolicyUri:
                title: Resource policy URI
                description: URL of the resource's data-use policy.
                type: string
                format: uri
              resourceTosUri:
                title: Resource terms of service URI
                description: URL of the resource's terms of service.
                type: string
                format: uri
          when:
            title: When
            description: >-
              Attach this mount only when the condition holds, resolved once at startup. An
              excluded mount registers no routes; the mounted resource is still created.
            type: "boolean"
            x-telo-eval: compile
            default: true
          guard:
            title: Guard
            description: >-
              An invocable run for every request matching a route of this mount, after
              authentication and authorization and before the body is read; a throw refuses the
              request through `guard.catches`, then the server's. See docs/mount-guard.md.
            type: object
            additionalProperties: false
            required: [ "invoke" ]
            properties:
              invoke:
                title: Invoke
                description: Resource invoked (or run) for each request; a throw refuses the request.
                x-telo-ref: { kind: Telo.Executable, use: trigger.inbound, inputs: /inputs }
              inputs:
                title: Inputs
                type: object
                additionalProperties: true
                default: {}
                description: >-
                  CEL expressions evaluated against the request, before its body
                  is read; the result is the guard's input. Without `inputs:`
                  the guard is called with an empty object.
                x-telo-context:
                  type: object
                  additionalProperties: false
                  properties:
                    request:
                      type: object
                      additionalProperties: false
                      properties:
                        headers: { type: object, additionalProperties: true }
                        query: { type: object, additionalProperties: true }
                        path: { type: string }
                        host: { type: string, description: "The request's host, lowercased and without its port — from X-Forwarded-Host only behind a trusted proxy." }
                        cookies: { type: object, additionalProperties: { type: string }, description: "The request's cookies by name, the first of a repeated name, each value as sent." }
                        tls:
                          description: "The TLS session of the socket the request arrived on: `{ protocol }`, null on a plain socket."
                          type: [object, "null"]
                          additionalProperties: false
                          properties: { protocol: { type: string } }
                        clientCertificate:
