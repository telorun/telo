kind: Telo.Application
metadata:
  name: ExamplesTestSuite
  version: 1.0.0
  description: |
    Runs every example's own tests, each in its own kernel.

    Separate from the module suite on purpose: an example imports PUBLISHED
    modules, which is what makes it copyable, so a red run here can mean the
    release sequence is behind rather than that the code is wrong. Mixing the two
    would make a red module suite ambiguous.

        telo ./examples/test-suite.yaml
variables:
  include:
    type: array
    items: { type: string }
    arg: include
    description: Glob pattern selecting the test manifests to run, relative to this file.
    default:
    - "*/tests/*.yaml"
  exclude:
    type: array
    items: { type: string }
    arg: exclude
    description: Glob pattern excluding test manifests, relative to this file.
    default:
    - "**/__fixtures__/**"
    # The two REPL examples drive a real model, which costs money and minutes on
    # every run. They are a suite of their own — `examples/test-suite-live.yaml` —
    # so this one stays free to run on every change.
    - "agent-console/**"
    - "chat-console/**"
  filter:
    type: string
    arg: { position: 0 }
    description: Run only the tests whose path contains this text.
    default: ""
  concurrency:
    type: integer
    minimum: 1
    arg: concurrency
    description: How many tests run at once.
    default: 3
imports:
  Test: ../modules/test
targets:
  - !ref runAll
---
kind: Test.Suite
metadata: { name: runAll }
include: !cel "variables.include"
exclude: !cel "variables.exclude"
filter: !cel "variables.filter"
concurrency: !cel "variables.concurrency"
