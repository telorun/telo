modules:
  apps/authoring-agent: Fixed
body: "Discovery goes through the hub tools, and the CLI's duplicates are named as the
  fallback they are. The prompt advertised two equally-weighted routes to a module's
  schema — `get_module_manifest` / `search_resources`, and `telo module manifest` /
  `telo search` — and the paragraph on not reading `.telo/` reached for the CLI one as
  the instruction, so a run would answer \"what fields does this kind have\" through
  either, at random. Both places now say the hub tools are the first move and the CLI
  verbs are for when a hub tool errors or returns nothing. The `telo` tool's own docs
  also said `args` is \"SEPARATE strings\" without saying a multi-word VALUE is still
  one argument, so `search http server` went out as three positionals and the CLI, which
  is strict, rejected it as an unknown argument."
