kind: Telo.Library
metadata:
  name: Filesystem
  version: 0.13.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Storage]
  description: >-
    Local filesystem access: read, write, edit in place, list, create and remove
    files and directories, plus content-hash snapshots and batch tree updates for
    syncing. Text is UTF-8 by default with base64 for binary, whole files are
    buffered in memory, and every operation resolves paths against an optional
    working directory. Not a sandbox.
requires:
  # 0.98.0: every kind's `cwd` is a `Telo.HostPath`, which an older analyzer
  # rejects as X_TELO_TYPE_UNKNOWN.
  telo: ">=0.98.0"
exports:
  kinds:
    - File
    - FileWrite
    - FileEdit
    - DirectoryListing
    - DirectoryCreation
    - TreeSnapshot
    - TreeSync
    - FileRemoval
---
# Read a file. Returns its contents (utf8 text or, with `encoding: base64`, the
# bytes base64-encoded) and byte size.
kind: Telo.Definition
metadata:
  name: File
  description: >-
    Reads a file from the local filesystem and returns its contents with its
    byte size and the sha256 digest of its bytes — utf8 text by default, or the
    raw bytes base64-encoded. Buffered whole into memory, so a byte limit can
    refuse a larger file before any of it is read. The path resolves against
    the resource's working directory unless it is absolute.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/fs.mjs&local_path=./nodejs/src/index.ts#FileController
throws:
  codes:
    ERR_FILE_TOO_LARGE:
      description: >-
        The file is larger than the call's `maxBytes`. Raised before its content
        is read; `error.data` carries `path`, `size` and `maxBytes`.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path:
        title: Path
        description: File to read, relative to `cwd` (an absolute path is used as-is).
        type: string
        minLength: 1
      encoding:
        title: Encoding
        description: Text encoding. `base64` returns binary content as a base64 string.
        type: string
        enum: [utf8, base64]
        default: utf8
      maxBytes:
        title: Max bytes
        description: >-
          The largest file this call reads. A larger one fails with
          `ERR_FILE_TOO_LARGE` before its content is read. Omitted: no limit.
        type: integer
        minimum: 0
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [content, size, sha256]
    properties:
      content:
        title: Content
        description: "File contents — utf8 text, or a base64 string when `encoding: base64`."
        type: string
      size:
        title: Size
        description: File size in bytes.
        type: integer
      sha256:
        title: SHA-256
        description: >-
          sha256 hex digest of the file's bytes — the same value a tree snapshot
          reports as the file's `hash`.
        type: string
schema:
  type: object
  additionalProperties: false
  properties:
    cwd:
      title: Working directory
      description: >-
        Absolute base directory invoke paths resolve against; omitted, the
        working directory. A directory shipped with the module is
        `!module-path ./dir`, one on the host comes from a variable declared
        `x-telo-type: Telo.HostPath`. Not a security boundary.
      type: string
      x-telo-type: Telo.HostPath
      x-telo-eval: compile
  examples:
    - cwd: /srv/workspace
---
# Write a file, replacing it whole. `createParents` makes missing parent
# directories. For surgical edits to an existing file use Fs.FileEdit.
kind: Telo.Definition
metadata:
  name: FileWrite
  description: >-
    Writes a file on the local filesystem, replacing it whole, and reports the
    number of bytes written. Content is utf8 text, a base64 string decoded to
    binary, or raw bytes taken straight from a resource that produced them;
    `createParents` makes missing parent directories first. The path
    resolves against the resource's `cwd` unless absolute — for surgical changes to
    an existing file, edit it in place instead.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/fs.mjs&local_path=./nodejs/src/index.ts#FileWriteController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, content]
    properties:
      path:
        title: Path
        description: File to write, relative to `cwd` (an absolute path is used as-is).
        type: string
        minLength: 1
      content:
        title: Content
        description: >-
          Bytes to write — utf8 text, a base64 string when `encoding: base64`, or
          raw bytes (a Uint8Array) handed over by a byte-producing resource.
        # anyOf, not oneOf: a consumer that does not know `x-telo-binary` reads the
        # byte branch as an empty schema matching everything, so under oneOf a plain
        # string would match BOTH branches and fail. anyOf degrades to permissive
        # there while still rejecting a non-byte, non-string value here.
        anyOf:
          - type: string
          - x-telo-type: Telo.Bytes
      encoding:
        title: Encoding
        description: >-
          How a string `content` is interpreted. `base64` decodes it to binary
          first. Not applicable to raw bytes, which are written as they are.
        type: string
        enum: [utf8, base64]
        default: utf8
      createParents:
        title: Create parents
        description: Create missing parent directories before writing.
        type: boolean
        default: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [bytesWritten]
    properties:
      bytesWritten:
        title: Bytes written
        description: Number of bytes written to disk.
        type: integer
schema:
  type: object
  additionalProperties: false
  properties:
    cwd:
      title: Working directory
      description: >-
        Absolute base directory invoke paths resolve against; omitted, the
        working directory. A directory shipped with the module is
        `!module-path ./dir`, one on the host comes from a variable declared
        `x-telo-type: Telo.HostPath`. Not a security boundary.
      type: string
      x-telo-type: Telo.HostPath
      x-telo-eval: compile
  examples:
    - cwd: /srv/workspace
---
# Edit a file in place by exact string replacement. Fails (rather than silently
# no-op) when `oldString` is absent, or matches more than once without
# `replaceAll`. Byte-level replacement, so comments and `!cel` tags survive.
kind: Telo.Definition
metadata:
  name: FileEdit
  description: >-
    Edits an existing file in place by exact string replacement and returns how
    many occurrences were replaced. It fails rather than silently no-opping when
    the old string is absent or matches more than once without `replaceAll`.
    Replacement is byte-level, so surrounding comments and YAML tags survive
    untouched; the path resolves against the resource's `cwd`.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/fs.mjs&local_path=./nodejs/src/index.ts#FileEditController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path, oldString, newString]
    properties:
      path:
        title: Path
        description: File to edit, relative to `cwd` (an absolute path is used as-is).
        type: string
        minLength: 1
      oldString:
        title: Old string
        description: Exact substring to replace. Must be present, and unique unless `replaceAll`.
        type: string
        minLength: 1
      newString:
        title: New string
        description: Replacement text.
        type: string
      replaceAll:
        title: Replace all
        description: Replace every occurrence instead of requiring a single match.
        type: boolean
        default: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [replacements]
    properties:
      replacements:
        title: Replacements
        description: Number of occurrences replaced.
        type: integer
schema:
  type: object
  additionalProperties: false
  properties:
    cwd:
      title: Working directory
      description: >-
        Absolute base directory invoke paths resolve against; omitted, the
        working directory. A directory shipped with the module is
        `!module-path ./dir`, one on the host comes from a variable declared
        `x-telo-type: Telo.HostPath`. Not a security boundary.
      type: string
      x-telo-type: Telo.HostPath
      x-telo-eval: compile
  examples:
    - cwd: /srv/workspace
---
# List a directory. Each entry is `{ name, path, type, size }`; `path` is
# relative to `cwd` so it can be fed back as an input. `recursive` walks
# subdirectories; `limit` / `cursor` page the result, in path order.
kind: Telo.Definition
metadata:
  name: DirectoryListing
  description: >-
    Lists the contents of a directory, returning one entry per item with its
    base name, path, type (file / directory / other) and size in bytes, sorted
    by path. Walks subdirectories on request, excludes entries by base name at
    any depth, and pages a large tree with a limit and a cursor. Entry paths
    are relative to the working directory, ready for a read, write or remove.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/fs.mjs&local_path=./nodejs/src/index.ts#DirectoryListingController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      path:
        title: Path
        description: >-
          Directory to list, relative to `cwd`. Omitted or empty lists `cwd`
          itself.
        type: string
      recursive:
        title: Recursive
        description: Walk subdirectories and include their entries.
        type: boolean
        default: false
      exclude:
        title: Exclude
        description: >-
          Base names to omit at any depth (an excluded directory is neither
          listed nor descended). Typically vendor / build / cache dirs like
          node_modules, .git, .telo.
        type: array
        items: { type: string }
      limit:
        title: Limit
        description: >-
          The most entries to return. When more remain, the result carries
          `nextCursor`, and nothing past the page is listed or measured.
          Omitted: every entry.
        type: integer
        minimum: 1
      cursor:
        title: Cursor
        description: >-
          Where to continue: the `nextCursor` of the previous page of the same
          listing. Only entries after it are returned.
        type: string
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [entries]
    properties:
      nextCursor:
        title: Next cursor
        description: >-
          Pass as `cursor` to get the entries after this page. Absent when the
          listing is complete.
        type: string
      entries:
        title: Entries
        description: >-
          The entries, sorted by path — the whole path compared by Unicode code
          point; one page of them when `limit` is set.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, path, type, size]
          properties:
            name:
              description: Entry base name.
              type: string
            path:
              description: Path relative to `cwd`.
              type: string
            type:
              description: Entry kind.
              type: string
              enum: [file, directory, other]
            size:
              description: Entry size in bytes.
              type: integer
schema:
  type: object
  additionalProperties: false
  properties:
    cwd:
      title: Working directory
      description: >-
        Absolute base directory invoke paths resolve against; omitted, the
        working directory. A directory shipped with the module is
        `!module-path ./dir`, one on the host comes from a variable declared
        `x-telo-type: Telo.HostPath`. Not a security boundary.
      type: string
      x-telo-type: Telo.HostPath
      x-telo-eval: compile
  examples:
    - cwd: /srv/workspace
---
# Create a directory. `createParents` makes missing ancestors and is idempotent
# (no error if it already exists); without it, an existing path or missing
# parent is an error.
kind: Telo.Definition
metadata:
  name: DirectoryCreation
  description: >-
    Creates a directory on the local filesystem, reporting whether it was newly
    created or already existed. With `createParents` it also makes missing
    ancestor directories and is idempotent; without it, an existing path or a
    missing parent is an error. The path resolves against the resource's `cwd`
    unless absolute.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/fs.mjs&local_path=./nodejs/src/index.ts#DirectoryCreationController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path:
        title: Path
        description: Directory to create, relative to `cwd` (an absolute path is used as-is).
        type: string
        minLength: 1
      createParents:
        title: Create parents
        description: Make missing ancestor directories; idempotent if the target exists.
        type: boolean
        default: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [created]
    properties:
      created:
        title: Created
        description: True if newly created; false if it already existed (with `createParents`).
        type: boolean
schema:
  type: object
  additionalProperties: false
  properties:
    cwd:
      title: Working directory
      description: >-
        Absolute base directory invoke paths resolve against; omitted, the
        working directory. A directory shipped with the module is
        `!module-path ./dir`, one on the host comes from a variable declared
        `x-telo-type: Telo.HostPath`. Not a security boundary.
      type: string
      x-telo-type: Telo.HostPath
      x-telo-eval: compile
  examples:
    - cwd: /srv/workspace
---
# A content-hash walk of the requested files and directories: every regular
# file as `{ path, hash, size }` (sha256 hex of its bytes), `path` relative to
# `cwd`, and the requested paths that do not exist as `missing`. Unlike
# DirectoryListing's `size`, a content hash is a reliable change detector
# (equal size != equal content), so two snapshots diff to an exact change set.
# `exclude` skips entries by base name (e.g. node_modules, .git) at any depth.
kind: Telo.Definition
metadata:
  name: TreeSnapshot
  description: >-
    Content-hashes files and directory trees: every file at or under the requested
    paths comes back with its path, byte size and the sha256 digest of its bytes,
    sorted by path, and requested paths that do not exist are listed apart. Two
    snapshots diff into an exact change set — for detecting edits, syncing or
    caching. Entries can be excluded by base name at any depth.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/fs.mjs&local_path=./nodejs/src/index.ts#TreeSnapshotController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      paths:
        title: Paths
        description: >-
          The files and directories to snapshot, each relative to `cwd`: a file
          contributes itself, a directory every file beneath it. Omitted
          snapshots `cwd` itself; an empty list snapshots nothing.
        type: array
        items: { type: string }
      exclude:
        title: Exclude
        description: >-
          Base names to skip at any depth (a directory match is not descended).
          Typically vendor / build / cache dirs like node_modules, .git, dist.
          A requested path is never excluded itself.
        type: array
        items: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [files, missing]
    properties:
      files:
        title: Files
        description: >-
          One entry per regular file, sorted by path — the whole path compared by
          Unicode code point.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [path, hash, size]
          properties:
            path:
              description: Path relative to `cwd`.
              type: string
            hash:
              description: sha256 hex digest of the file's bytes.
              type: string
            size:
              description: File size in bytes.
              type: integer
      missing:
        title: Missing
        description: >-
          The requested `paths` at which nothing exists, as they were written.
          Empty when every requested path exists.
        type: array
        items: { type: string }
schema:
  type: object
  additionalProperties: false
  properties:
    cwd:
      title: Working directory
      description: >-
        Absolute base directory invoke paths resolve against; omitted, the
        working directory. A directory shipped with the module is
        `!module-path ./dir`, one on the host comes from a variable declared
        `x-telo-type: Telo.HostPath`. Not a security boundary.
      type: string
      x-telo-type: Telo.HostPath
      x-telo-eval: compile
  examples:
    - cwd: /srv/workspace
---
# Apply an EXPLICIT change set to a tree: write each listed file (creating
# parents) and remove each deleted path. It does NOT implicitly delete files
# absent from the set, so one call serves both a full seed (all files, empty
# `delete`) and a partial delta (only what changed) without disturbing
# untouched files. Writes are applied before deletes.
kind: Telo.Definition
metadata:
  name: TreeSync
  description: >-
    Applies a batch change set to a directory tree in one call: writes each listed
    file whole, creating parent directories, then removes each listed path, and
    reports both counts. Files absent from the set are left untouched — nothing is
    ever deleted implicitly — so the same call serves a full seed or a partial delta.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/fs.mjs&local_path=./nodejs/src/index.ts#TreeSyncController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      write:
        title: Write
        description: Files to write whole (parents created). Absent from the set means untouched.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [path, content]
          properties:
            path:
              description: File to write, relative to `cwd`.
              type: string
              minLength: 1
            content:
              description: >-
                Bytes to write — utf8 text, a base64 string when `encoding: base64`,
                or raw bytes (a Uint8Array) handed over by a byte-producing resource.
              # anyOf for the same reason as Fs.FileWrite's `content` — see there.
              anyOf:
                - type: string
                - x-telo-type: Telo.Bytes
            encoding:
              description: >-
                How a string `content` is interpreted. `base64` decodes it to binary
                first. Not applicable to raw bytes, which are written as they are.
              type: string
              enum: [utf8, base64]
              default: utf8
      delete:
        title: Delete
        description: Paths to remove (relative to `cwd`). A missing path is not an error; a directory is removed recursively.
        type: array
        items: { type: string, minLength: 1 }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [written, deleted]
    properties:
      written:
        title: Written
        description: Number of files written.
        type: integer
      deleted:
        title: Deleted
        description: Number of delete paths processed.
        type: integer
schema:
  type: object
  additionalProperties: false
  properties:
    cwd:
      title: Working directory
      description: >-
        Absolute base directory invoke paths resolve against; omitted, the
        working directory. A directory shipped with the module is
        `!module-path ./dir`, one on the host comes from a variable declared
        `x-telo-type: Telo.HostPath`. Not a security boundary.
      type: string
      x-telo-type: Telo.HostPath
      x-telo-eval: compile
  examples:
    - cwd: /srv/workspace
---
# Remove a file, or a directory tree with `recursive`. A missing path is an
# error.
kind: Telo.Definition
metadata:
  name: FileRemoval
  description: >-
    Deletes a file from the local filesystem, or a whole directory tree when
    `recursive` is set. A missing path is an error rather than a silent no-op.
    The path resolves against the resource's `cwd` unless absolute.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/fs.mjs&local_path=./nodejs/src/index.ts#FileRemovalController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path:
        title: Path
        description: File or directory to remove, relative to `cwd` (an absolute path is used as-is).
        type: string
        minLength: 1
      recursive:
        title: Recursive
        description: Remove a directory and everything under it.
        type: boolean
        default: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [removed]
    properties:
      removed:
        title: Removed
        description: True when the path was removed.
        type: boolean
schema:
  type: object
  additionalProperties: false
  properties:
    cwd:
      title: Working directory
      description: >-
        Absolute base directory invoke paths resolve against; omitted, the
        working directory. A directory shipped with the module is
        `!module-path ./dir`, one on the host comes from a variable declared
        `x-telo-type: Telo.HostPath`. Not a security boundary.
      type: string
      x-telo-type: Telo.HostPath
      x-telo-eval: compile
  examples:
    - cwd: /srv/workspace
