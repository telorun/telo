kind: Telo.Application
metadata:
  name: VectorStoreMemoryTest
  version: 1.0.0
  description: |
    Exercises VectorStoreMemory.Store directly: dot-metric ranking, FIFO
    eviction past maxEntries, and metadataFilter operators ($in, $gte, $or)
    via Match and Removal. Dimensions an expression computes bound vectors the
    same way.
imports:
  VectorStore: ../../vector-store
  VectorStoreMemory: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
kind: VectorStoreMemory.Store
metadata: { name: index }
metric: dot
dimensions: 2
maxEntries: 3
---
# A `!cel` integer is a 64-bit integer, not the number a YAML literal is.
kind: VectorStoreMemory.Store
metadata: { name: computedIndex }
dimensions: !cel "1 + 1"
---
kind: VectorStore.Record
metadata: { name: write }
store: !ref index
---
kind: VectorStore.Match
metadata: { name: search }
store: !ref index
topK: 10
---
kind: VectorStore.Removal
metadata: { name: drop }
store: !ref index
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: seed
    invoke: !ref write
    inputs:
      items:
        - { id: a, vector: [1, 0], metadata: { tier: 1, kind: doc } }
        - { id: b, vector: [2, 0], metadata: { tier: 2, kind: doc } }
        - { id: c, vector: [3, 0], metadata: { tier: 3, kind: note } }
  - name: evict
    invoke: !ref write
    inputs:
      items:
        - { id: d, vector: [4, 0], metadata: { tier: 4, kind: note } }
  - name: searchAll
    invoke: !ref search
    inputs:
      vector: [1, 0]
  - name: assertEviction
    inputs:
      ok: !cel "size(steps.searchAll.result.matches) == 3"
      top: !cel "steps.searchAll.result.matches[0].id"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        required: [ok, top]
        properties:
          ok: { const: true }
          top: { const: "d" }
  - name: searchFiltered
    invoke: !ref search
    inputs:
      vector: [1, 0]
      metadataFilter:
        kind: { $in: [note] }
        tier: { $gte: 4 }
  - name: assertFiltered
    inputs:
      ok: !cel "size(steps.searchFiltered.result.matches) == 1"
      top: !cel "steps.searchFiltered.result.matches[0].id"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        required: [ok, top]
        properties:
          ok: { const: true }
          top: { const: "d" }
  - name: dropByFilter
    invoke: !ref drop
    inputs:
      metadataFilter:
        $or:
          - { kind: note }
          - { tier: { $lte: 2 } }
  - name: assertDropped
    inputs:
      removed: !cel "steps.dropByFilter.result.removed"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        required: [removed]
        properties:
          removed: { const: 3 }
  - name: rejectBadDim
    try:
      - name: badWrite
        invoke: !ref write
        inputs:
          items:
            - { id: bad, vector: [1, 2, 3] }
    catch:
      - name: assertRejected
        inputs:
          msg: !cel "error.message"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            required: [msg]
            properties:
              msg: { type: string }
  - name: verifyRejected
    inputs:
      result: !cel "steps.assertRejected.result"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        required: [result]
        properties:
          result: { const: true }
  - name: computedWrite
    invoke: { kind: VectorStore.Record, store: !ref computedIndex }
    inputs:
      items:
        - { id: a, vector: [1, 0] }
  - name: computedBadDim
    try:
      - name: computedBadWrite
        invoke: { kind: VectorStore.Record, store: !ref computedIndex }
        inputs:
          items:
            - { id: bad, vector: [1, 2, 3] }
    catch:
      - name: computedRejection
        value: !cel "error.message"
  - name: assertComputedDimensions
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        written: !cel "steps.computedWrite.result.ids"
        rejection: !cel "steps.computedRejection.result"
      expected:
        written: [a]
        rejection: 'VectorStoreMemory "cosine": expected vector of length 2, got 3.'
