    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/gla.traineddata.gz:
        { upstream: gla, member: package/4.0.0_best_int/gla.traineddata.gz, sha256: 3820983a484c7f079cfe5b6454d5f4aec458d519d920469a247f55e8cd0a6245, executable: false }
