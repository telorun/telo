kind: Telo.Application
metadata:
  name: ChatTeloCliTool
  version: 1.0.0
  description: |
    The `telo` tool's verb guard, without any AI. The guard is the whole
    security property of exposing a CLI to an anonymous prompt: argv is execed
    without a shell, so nothing the agent writes is interpreted, but argv alone
    cannot decide WHICH subcommand may run. These assert that an allowed verb
    reaches the CLI and a denied one never spawns anything, and that the
    identity query — exactly `["--version"]` — is answered by the real CLI
    whatever `teloVerbs` holds, while `--version` with anything after it is
    refused.
imports:
  Mcp: ../../../../modules/mcp-client
  Chat:
    source: ../
    resources:
      hub: !ref hub
    secrets:
      # The tool never touches the model; the key is only a required import input.
      openaiApiKey: dummy-key-never-used
    needs:
      agentState: { path: !cel "variables.scratch.joinPath('state')" }
    variables:
      workspaceDir: !cel "variables.scratch.joinPath('workspace')"
      # `echo`, not a real CLI. What this manifest owns is the VERB GUARD and
      # the argv it composes — whether `telo cel functions` prints the right
      # thing is the CLI's own business, tested in `cli/nodejs`. Echoing the
      # argv asserts both halves exactly; the identity row below needs the real
      # CLI, run through bun as the other chat tests run it.
      teloProgram: [echo]
  # The same library over the workspace CLI, with a verb list naming only
  # `check`: the identity query must not depend on what an operator lists.
  # Its own scratch, so the two imports never share agent state.
  Identity:
    source: ../
    resources:
      hub: !ref hub
    secrets:
      openaiApiKey: dummy-key-never-used
    needs:
      agentState: { path: !cel "variables.scratch.joinPath('identity/state')" }
    variables:
      workspaceDir: !cel "variables.scratch.joinPath('identity/workspace')"
      teloProgram: [bun, ../../../../../../../../cli/nodejs/bin/telo.ts]
      teloVerbs: [check]
  Run: ../../../../modules/run
  Assert: oci://ghcr.io/telorun/assert@0.21.1#sha256-9CCELeaW54ph9v7qtM1zBRq9-gqXK4fwF0NubWAhsN4
variables:
  # Where this case's workspace and agent state live — the library takes both
  # as host paths, and neither is ever read here beyond the spawned program's cwd.
  scratch:
    env: CHAT_TEST_TELO_CLI_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/telo-cli-tool
targets:
  # The workspace is gitignored, so a fresh checkout has none — and every
  # command spawns with it as cwd.
  - !ref Chat.ensureWorkspace
  - !ref Identity.ensureWorkspace
  - !ref testAllowedVerb
  - !ref testIdentityQuery
  - !ref testDeniedVerbs
---
# The hub the chat library discovers modules through.
kind: Mcp.HttpClient
metadata: { name: hub }
url: https://telo.sh/mcp
clientInfo: { name: authoring-agent-test, version: 0.0.0 }
---
# An allowed verb passes the guard, and the argv handed to the program is
# `teloProgram + args` — exactly. Pinning the whole line is what catches a
# regression in the program PREFIX: an earlier version derived it as a single
# element and silently dropped everything after it.
kind: Run.Sequence
metadata: { name: testAllowedVerb }
steps:
  - name: run
    invoke: !ref Chat.runTelo
    inputs:
      args: [cel, functions, --json]
  - name: assertOk
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        exitCode: !cel "steps.run.result.exitCode"
        argv: !cel "trim(steps.run.result.output)"
      expected:
        exitCode: 0
        argv: "cel functions --json"
---
# `["--version"]` alone reaches the CLI with no listed verb, and answers the telo
# it is (`X`, or `X+unreleased` for a working copy) — which identity exactly is
# the CLI's own test.
kind: Run.Sequence
metadata: { name: testIdentityQuery }
steps:
  - name: run
    invoke: !ref Identity.runTelo
    inputs:
      args: [--version]
  - name: assertIdentity
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        exitCode: !cel "steps.run.result.exitCode"
        identity: !cel "trim(steps.run.result.output).matches('^[0-9]+[.][0-9]+[.][0-9]+([+]unreleased)?$')"
      expected:
        exitCode: 0
        identity: true
---
# Every verb that executes, publishes or writes must be refused BEFORE anything
# is spawned. `run` is the one that matters most — and the bare-path case with
# it, because the CLI's default command turns `telo ./x.yaml` into
# `run ./x.yaml`, so a guard that only inspected a `run` literal would let a
# path straight through.
kind: Run.Sequence
metadata: { name: testDeniedVerbs }
steps:
  # The refusal names every verb the default list allows.
  - name: denyRun
    try:
      - name: attempt
        invoke: !ref Chat.runTelo
        inputs:
          args: [run, ./anything.yaml]
    catch:
      - name: assertCode
        invoke: { kind: Assert.Equals }
        inputs:
          actual:
            code: !cel "error.code"
            message: !cel "error.message"
          expected:
            code: ERR_TELO_VERB_NOT_ALLOWED
            message: "telo run is not available here. Allowed subcommands: check, cel, module, search, builtins, describe; `--version` alone is also available. Note a bare path means `run`, which is not allowed."
  - name: denyBarePath
    try:
      - name: attempt
        invoke: !ref Chat.runTelo
        inputs:
          args: [./anything.yaml]
    catch:
      - name: assertCode
        invoke: { kind: Assert.Equals }
        inputs:
          actual: !cel "error.code"
          expected: ERR_TELO_VERB_NOT_ALLOWED
  - name: denyPublish
    try:
      - name: attempt
        invoke: !ref Chat.runTelo
        inputs:
          args: [publish, ./telo.yaml]
    catch:
      - name: assertCode
        invoke: { kind: Assert.Equals }
        inputs:
          actual: !cel "error.code"
          expected: ERR_TELO_VERB_NOT_ALLOWED
  # `--version` is admitted only alone: followed by anything, its safety would
  # rest on every CLI answering it before a command.
  - name: denyVersionWithMore
    try:
      - name: attempt
        invoke: !ref Chat.runTelo
        inputs:
          args: [--version, run, ./anything.yaml]
      - name: answered
        throw:
          code: ERR_TEST_EXPECTED_REFUSAL
          message: the telo tool ran `--version run ./anything.yaml`
    catch:
      - name: assertCode
        invoke: { kind: Assert.Equals }
        inputs:
          actual: !cel "error.code"
          expected: ERR_TELO_VERB_NOT_ALLOWED
  - name: denyEmpty
    try:
      - name: attempt
        invoke: !ref Chat.runTelo
        inputs:
          args: []
    catch:
      - name: assertCode
        invoke: { kind: Assert.Equals }
        inputs:
          actual: !cel "error.code"
          expected: ERR_TELO_VERB_NOT_ALLOWED
