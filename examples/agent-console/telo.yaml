kind: Telo.Application
metadata:
  name: AgentConsole
  categories: [ AI ]
  description: |
    Interactive REPL backed by an Ai.Agent with tools. Each turn, the agent may
    call tools before answering:
      - a regular HTTP tool (`get_weather`) that fetches current weather from the
        open-meteo API via Http.Request, and
      - every tool exposed by the Telo hub's MCP server at
        https://telo.sh/mcp, discovered at runtime via AiMcp.ToolProvider.
    The conversation is persisted in sqlite so each turn sees prior history and the
    chat survives restart. Type `/exit` (or send EOF) to leave.

    Run with the OpenAI key in a sibling `.env.local` file:
        OPENAI_API_KEY=sk-...
  version: 1.0.0
imports:
  OpenAI: oci://ghcr.io/telorun/openai@0.13.0#sha256-Tt9DaH254A972an-WTH_mtJOy9HAuUuH_SK1_bfOvHM
  Ai: oci://ghcr.io/telorun/ai@0.28.0#sha256-zpi3w-6zWjD3HGhxoMJKItuFM4ELZa-NTVHOtFacRII
  AiMcp: oci://ghcr.io/telorun/ai-mcp@0.23.0#sha256-AtK6YNh3oQJkAlTFE4iYkxr4HTzw-O-bInBjgNHaup0
  Mcp: oci://ghcr.io/telorun/mcp-client@0.16.0#sha256-uGRA31NI6oUiT8Pr88uBvMqIvCgoG5QLASMIshc7c-A
  Http: oci://ghcr.io/telorun/http-client@0.23.0#sha256-6WAIh0ajnTlkWNuP-59e1qNVUXVSJDWZxvPVACQg1AM
  Console: oci://ghcr.io/telorun/console@0.19.0#sha256-RC9Wlj4a8ysp1g3WS3z3CbmQuAsahNj4PdsJMaNfPZw
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  Sql: oci://ghcr.io/telorun/sql@0.28.0#sha256-JC2SN6Ha8hlq9gnRGahvVNVwe-cUXHXtS8rdeo1BC24
  SQLite: oci://ghcr.io/telorun/sqlite@0.10.0#sha256-qTwG1VYpO8_AGN2UaJPWEIHyt1rt8OUlxLKtLcJkf4Q
targets:
  - !ref initSchema
  - !ref chatLoop
secrets:
  openaiApiKey:
    env: OPENAI_API_KEY
    type: string
variables:
  historyFile:
    env: HISTORY_FILE
    type: string
    x-telo-type: Telo.HostPath
    default: ./tmp/agent-history.sqlite

---
# --- Persistence -----------------------------------------------------------
kind: SQLite.Connection
metadata: { name: chatDb }
file: !cel "variables.historyFile"

---
kind: SQLite.Schema
metadata: { name: initSchema }
connection: !ref chatDb
# Imperative, not a declared `Table`: the role domain is a CHECK constraint,
# which the column vocabulary cannot state — declaring the table would drop it.
migrations:
  20260601_create_messages:
    statement: |
      CREATE TABLE IF NOT EXISTS messages (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        role TEXT NOT NULL CHECK (role IN ('system', 'user', 'assistant')),
        content TEXT NOT NULL,
        created_at TEXT NOT NULL DEFAULT (datetime('now'))
      )
---
# --- AI provider -----------------------------------------------------------
# The account: base URL and credential on the client, so the model kind carries no
# key and inherits the 401 re-acquire-and-retry from `http-client`.
kind: Http.BearerToken
metadata: { name: openaiKey }
token: !cel "secrets.openaiApiKey"
---
kind: Http.Client
metadata: { name: openaiClient }
baseUrl: https://api.openai.com/v1
credential: !ref openaiKey
---
kind: Http.Request
metadata: { name: openaiRequest }
client: !ref openaiClient
---
kind: OpenAI.ChatModel
metadata: { name: gpt4oMini }
model: gpt-4o-mini
request: !ref openaiRequest
---
# --- Tool: MCP server (runtime discovery) ----------------------------------
# Streamable-HTTP MCP client pointed at the Telo hub. AiMcp.ToolProvider turns
# it into an Ai.ToolProvider; the agent never learns it is MCP.
kind: Mcp.HttpClient
metadata: { name: hubMcp }
url: https://telo.sh/mcp
clientInfo: { name: agent-console, version: 1.0.0 }
---
kind: AiMcp.ToolProvider
metadata: { name: hubTools }
client: !ref hubMcp
---
# --- Tool: a regular invocable (HTTP weather lookup) -----------------------
kind: Http.Client
metadata: { name: openMeteo }
baseUrl: https://api.open-meteo.com
---
# Static request config; the latitude/longitude/query are supplied per call by the
# Ai.Tools `inputs:` mapping below.
kind: Http.Request
metadata: { name: getWeather }
client: !ref openMeteo
throwOnHttpError: true
---
# Wrap the HTTP request as a tool. The model produces { latitude, longitude }; the
# `inputs:` mapping shapes them into the open-meteo request.
kind: Ai.Tools
metadata: { name: weatherTools }
tools:
  - tool: !ref getWeather
    name: get_weather
    description: Get the current weather at a latitude/longitude (open-meteo).
    parameters:
      type: object
      additionalProperties: false
      required: [ latitude, longitude ]
      properties:
        latitude: { type: number, description: "Latitude in decimal degrees." }
        longitude: { type: number, description: "Longitude in decimal degrees." }
    inputs:
      url: /v1/forecast
      method: GET
      query:
        # Query parameters are strings on the wire, and the request contract says
        # so; the model produces numbers, so they are rendered here. Passing the
        # numbers through failed every call with an invalid-input error the model
        # could only respond to by trying again.
        latitude: !cel "string(arguments.latitude)"
        longitude: !cel "string(arguments.longitude)"
        current_weather: "true"
    result: !cel "result.body"
---
# --- Agent -----------------------------------------------------------------
kind: Ai.Agent
metadata: { name: assistant }
model: !ref gpt4oMini
system: |
  You are a helpful CLI assistant. Use the available tools when they help answer;
  don't guess at facts you can look up. Keep replies brief.
maxSteps: 6
toolProviders:
  - provider: !ref weatherTools
  - provider: !ref hubTools
    prefix: "hub_"
---
# --- REPL ------------------------------------------------------------------
kind: Run.Sequence
metadata: { name: chatLoop }
steps:
  - name: read
    invoke: !ref Console.readLine
    inputs:
      prompt: "{cyan.bold you} › "
  - name: converse
    while: !cel "steps.read.result.value != '/exit'"
    do:
      - name: insertUser
        inputs:
          sql: "INSERT INTO messages (role, content) VALUES (?, ?)"
          bindings: [ "user", !cel "steps.read.result.value" ]
        invoke:
          kind: Sql.Command
          connection: !ref chatDb
      - name: readHistory
        inputs:
          sql: "SELECT role, content FROM messages ORDER BY id ASC"
        invoke:
          kind: Sql.Query
          connection: !ref chatDb
      - name: ask
        invoke: !ref assistant
        inputs:
          messages: !cel "steps.readHistory.result.rows"
      - name: showTools
        if: !cel "steps.ask.result.steps.exists(s, s.toolCalls.size() > 0)"
        then:
          - name: printTools
            invoke: !ref Console.writeLine
            inputs:
              output: !interpolate >-
                {dim 🔧 ${{ steps.ask.result.steps
                  .map(s, s.toolCalls.map(tc, tc.name).join(', '))
                  .filter(line, line != '')
                  .join(' → ') }}}
      - name: print
        invoke: !ref Console.writeLine
        inputs:
          output: !interpolate "{magenta.bold ai}  › ${{ steps.ask.result.text }}"
      - name: insertAssistant
        inputs:
          sql: "INSERT INTO messages (role, content) VALUES (?, ?)"
          bindings: [ "assistant", !cel "steps.ask.result.text" ]
        invoke:
          kind: Sql.Command
          connection: !ref chatDb
      - name: read
        invoke: !ref Console.readLine
        inputs:
          prompt: "{cyan.bold you} › "
