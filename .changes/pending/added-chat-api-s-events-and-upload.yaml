modules:
  modules/ai-chat: Added
body: Chat.Api's events and upload routes are built from public kinds (Stream.Map,
  Stream.Recover, Sse.Encoder, Multipart.ReadPart), so its whole body names only kinds
  an importer can name and can be copied into an application's own library. Frames are
  byte for byte as before, except that a failure carrying no code ends the stream with
  code INTERNAL_ERROR, and an upload with no file part is a 400
  ERR_MULTIPART_PART_MISSING with its issue still at /body/file. A part sent as
  application/octet-stream reaches the detector as sent. StartTurn, ListConversations,
  ReadConversation, ConversationEntries, UpdateConversation, DeleteConversation,
  PutAttachment and GetAttachment declare the store codes they pass through.
