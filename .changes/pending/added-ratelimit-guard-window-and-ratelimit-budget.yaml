modules:
  modules/rate-limit: Added
body: "`RateLimit.Guard.window` and `RateLimit.Budget.window` are `Telo.Duration` slots:
  `60s`, `1h30m`, `2d` and `1w` are read, a malformed literal is refused by `telo
  check`, an integer is milliseconds, and a computed value must be a duration (`!cel
  \"duration('1h')\"`). Breaking for a `window` computed as a string. Text with a space
  before the unit (`5 m`) or around the value is now refused. Requires telo >=0.130.0."
