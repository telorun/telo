{{- if gt (int .Values.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "studio-web.name" . }}
  labels:
    {{- include "studio-web.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "studio-web.selectorLabels" . | nindent 6 }}
{{- end }}
