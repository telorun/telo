kind: Telo.Application
metadata:
  name: OpenaiAccepts
  version: 1.0.0
  description: |
    A model refuses a media part its own `accepts` does not list — with
    `ERR_MODEL_CONTENT_UNSUPPORTED`, before anything is sent — and sends one it
    does. The requests go to an address nothing listens on, so a request leaving
    a model is `ERR_MODEL_UNREACHABLE` and a refusal is the content code: a model
    with no `accepts` refuses an image, one listing `image/png` sends it, takes
    nothing else and nothing over `maxBytes`, and an image in a tool result is held
    to the same list. An entry outside what the dialect can carry at all is a
    schema violation.
imports:
  OpenAI: ../
  Http: ../../http-client
  Stream: ../../stream
  Assert: ../../assert
targets:
  - !ref ceiling
  - !ref test
---
kind: Assert.Manifest
metadata: { name: ceiling }
source: ./__fixtures__/accepts-outside-ceiling.yaml
expect:
  errors:
    - code: SCHEMA_VIOLATION
      message: "OpenAI.ChatModel/chatAudio: /accepts/0/type must be equal to one of the allowed values (image | file)"
    - code: SCHEMA_VIOLATION
      message: "OpenAI.ChatModelStream/chatStreamVideo: /accepts/0/type must be equal to one of the allowed values (image | file)"
    - code: SCHEMA_VIOLATION
      message: "OpenAI.ResponsesModel/responsesAudio: /accepts/0/type must be equal to one of the allowed values (image | file)"
    - code: SCHEMA_VIOLATION
      message: 'OpenAI.ResponsesModelStream/responsesStreamImage: /accepts/0/mediaTypes/0 must match pattern "^image/[a-z0-9][a-z0-9!#$&^_.+-]*$|^image/[*]$"'
  runFails: "Manifest validation failed"
---
kind: Http.Client
metadata: { name: nobody }
baseUrl: http://127.0.0.1:1/v1
---
kind: Http.Request
metadata: { name: request }
client: !ref nobody
---
kind: OpenAI.ChatModel
metadata: { name: chatPlain }
model: gpt-test
request: !ref request

---
kind: OpenAI.ChatModel
metadata: { name: chatLimited }
model: gpt-test
request: !ref request
accepts:
  - { type: image, mediaTypes: [image/png], maxBytes: 2 }

---
kind: OpenAI.ChatModelStream
metadata: { name: chatStreamPlain }
model: gpt-test
request: !ref request

---
kind: OpenAI.ChatModelStream
metadata: { name: chatStreamLimited }
model: gpt-test
request: !ref request
accepts:
  - { type: image, mediaTypes: [image/png], maxBytes: 2 }

---
kind: OpenAI.ResponsesModel
metadata: { name: responsesPlain }
model: gpt-test
request: !ref request

---
kind: OpenAI.ResponsesModel
metadata: { name: responsesLimited }
model: gpt-test
request: !ref request
accepts:
  - { type: image, mediaTypes: [image/png], maxBytes: 2 }

---
kind: OpenAI.ResponsesModelStream
metadata: { name: responsesStreamPlain }
model: gpt-test
request: !ref request

---
kind: OpenAI.ResponsesModelStream
metadata: { name: responsesStreamLimited }
model: gpt-test
request: !ref request
accepts:
  - { type: image, mediaTypes: [image/png], maxBytes: 2 }
---
kind: Telo.Sequence
