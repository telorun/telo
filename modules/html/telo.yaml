outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [markdown]
    properties:
      markdown: { type: string }
---
kind: Telo.Definition
metadata:
  name: Metadata
  description: >-
    Reads a page's metadata: its title, language and base URL, every meta name and
    Open Graph property with its values, every link with resolved URLs (canonical,
    alternate, feeds, icons), and each JSON-LD structured data block, reporting a
    malformed block rather than dropping it.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/html.mjs&local_path=./nodejs/src/index.ts#Metadata
throws:
  codes: {}
schema:
  type: object
  additionalProperties: false
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [document]
    properties:
      document: { $ref: "telo://Self/Parsed" }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [meta, links, jsonLd]
    properties:
      title:
        description: The first `<title>`, with whitespace collapsed.
        type: string
      lang:
        description: The root element's `lang`.
        type: string
      baseUrl:
        description: The page's base URL.
        type: string
        format: uri
      meta:
        description: >-
          Each `<meta>` `name` and `property` value, mapped to the `content` values
          carrying it in document order.
        type: object
        additionalProperties:
          type: array
          items: { type: string }
      links:
        description: Every `<link>` with an `href`, in document order.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [rel, href]
          properties:
            rel:
              description: The link types, lowercased.
              type: array
              items: { type: string }
            href:
              description: The target, resolved against the base URL when there is one.
              type: string
            type: { type: string }
            hreflang: { type: string }
            sizes: { type: string }
            media: { type: string }
            title: { type: string }
      jsonLd:
        description: >-
          Each `<script type="application/ld+json">` block in document order: its
          parsed `value`, or the parse `error` when it is malformed.
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            value:
              description: The parsed JSON-LD.
            error:
              description: Why the block is not valid JSON.
              type: string
          if: { required: [value] }
          then: { not: { required: [error] } }
          else: { required: [error] }
---
kind: Telo.Definition
metadata:
  name: MainContent
  description: >-
    Finds the main article in a web page and strips navigation, sidebars, ads and
    comment sections, returning the readable content as a page tree plus its
    title, author, excerpt, site name, language, direction and publication time.
    Clean input for reading views, summarization and archiving.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/html.mjs&local_path=./nodejs/src/index.ts#MainContent
throws:
  codes:
    ERR_HTML_NO_MAIN_CONTENT:
      description: No part of the page scored as main content.
schema:
  type: object
  additionalProperties: false
  properties:
    charThreshold:
      title: Character threshold
      description: The fewest characters an article must have to be accepted.
      type: integer
      minimum: 0
      default: 500
      x-telo-eval: compile
    nbTopCandidates:
      title: Top candidates
      description: How many top-scoring candidate elements are compared.
      type: integer
      minimum: 1
      default: 5
      x-telo-eval: compile
    keepClasses:
      title: Keep classes
      description: Keep `class` attributes in the content.
      type: boolean
      default: false
      x-telo-eval: compile
    classesToPreserve:
      title: Classes to preserve
      description: Classes kept even when `keepClasses` is false.
      type: array
      items: { type: string }
      x-telo-eval: compile
    linkDensityModifier:
      title: Link density modifier
      description: Added to the link-density limits; raise it to keep link-heavy content.
      type: number
      default: 0
      x-telo-eval: compile
    videoHosts:
      title: Video hosts
      description: >-
        Hosts whose embedded videos are kept, each matching itself and its
        subdomains. The detector's own list applies when omitted.
      type: array
      items: { type: string, format: hostname }
      x-telo-eval: compile
    jsonLd:
      title: Use JSON-LD
      description: Read title, author and dates from the page's JSON-LD.
      type: boolean
      default: true
      x-telo-eval: compile
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [document]
    properties:
      document: { $ref: "telo://Self/Parsed" }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [content]
    properties:
      content:
        description: The main content, its relative URLs resolved against the page's base URL.
        $ref: "telo://Self/Parsed"
      title: { type: string }
      byline: { type: string }
      excerpt: { type: string }
      siteName: { type: string }
      lang: { type: string }
      dir: { type: string }
      publishedTime: { type: string }
---
kind: Telo.Definition
metadata:
  name: Escape
  description: >-
    Escapes text for safe inclusion in HTML by encoding ampersands, angle brackets
    and quotes as character references, so user-supplied strings cannot inject
    markup into templates, attributes or messages.
capability: Telo.Callable
deterministic: true
params:
  - name: text
    schema: { type: string }
returns:
  schema: { type: string }
schema:
  type: object
  additionalProperties: false
controllers:
  - pkg:telo/local/js?path=./nodejs/html.mjs&local_path=./nodejs/src/index.ts#Escape
---
kind: Telo.Definition
metadata:
  name: Unescape
  description: >-
    Decodes HTML character references — named ones such as `&amp;` and `&nbsp;` and
    numeric ones such as `&#39;` — back to the characters they stand for, as a
    browser reads them in text content.
capability: Telo.Callable
deterministic: true
params:
  - name: text
    schema: { type: string }
returns:
  schema: { type: string }
schema:
  type: object
  additionalProperties: false
controllers:
  - pkg:telo/local/js?path=./nodejs/html.mjs&local_path=./nodejs/src/index.ts#Unescape
---
kind: Self.Escape
metadata:
  name: escape
  description: Escapes `&`, `<`, `>`, `"` and `'` in text for safe inclusion in HTML.
---
kind: Self.Unescape
metadata:
  name: unescape
  description: Decodes named and numeric HTML character references in text.
---
# The presets. Changing one changes what every consumer's pages keep, so an edit
# here is a changelog entry.
kind: Self.SafeTree
metadata:
  name: stripAll
  description: Sanitizes HTML down to its text, removing every element, script and style.
elements: []
---
kind: Self.SafeTree
metadata:
  name: basicFormatting
  description: >-
    Sanitizes HTML to paragraphs, line breaks, emphasis, inline code, lists,
    quotes and http, https and mailto links.
elements: [p, br, a, em, strong, code, ul, ol, li, blockquote]
attributes:
  a:
    href: { protocols: [http, https, mailto] }
---
kind: Self.SafeTree
metadata:
  name: richContent
  description: >-
    Sanitizes rendered Markdown and rich user content: basic formatting plus
    headings, tables, preformatted code with language classes, http and https
    images, rules, strikethrough, disclosure widgets and task-list checkboxes,
    with ids and names kept and prefixed `user-content-`.
elements:
  [p, br, a, em, strong, code, ul, ol, li, blockquote, h1, h2, h3, h4, h5, h6, table, thead, tbody, tr, th, td, pre, img, hr, del, details, summary, input]
attributes:
  "*":
    id: {}
    name: {}
  a:
    href: { protocols: [http, https, mailto] }
  img:
    src: { protocols: [http, https] }
    alt: {}
    title: {}
    width: {}
    height: {}
  code:
    class: { prefixes: [language-] }
setAttributes:
  input:
    type: checkbox
    disabled: ""
idPrefix: user-content-
