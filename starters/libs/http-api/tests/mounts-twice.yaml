kind: Telo.Application
metadata:
  name: HttpApiLibraryStarterTest
  version: 1.0.0
  description: >-
    Runs an application that mounts the library under two paths with two
    configurations, and calls both. Each import must answer with its own
    greeting, and the library's own validation and error mapping must reach the
    caller through the importer's server.
imports:
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref test
---
kind: HttpClient.Request
metadata: { name: call }
client: { kind: HttpClient.Client, baseUrl: http://127.0.0.1:8202 }
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ./__fixtures__/greeter-app.yaml
    ports: { http: 8202 }
targets:
  - !ref app
steps:
  - name: english
    invoke: !ref call
    inputs: { url: /en/hello, method: GET, query: { name: Ada } }
  - name: spanish
    invoke: !ref call
    inputs: { url: /es/hello, method: GET, query: { name: Ada, shout: "true" } }
  - name: info
    invoke: !ref call
    inputs: { url: /es/info, method: GET }
  - name: noName
    invoke: !ref call
    inputs: { url: /en/hello, method: GET }
  - name: number
    invoke: !ref call
    inputs: { url: /en/hello, method: GET, query: { name: "42" } }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        english: !cel "steps.english.result.body"
        spanish: !cel "steps.spanish.result.body"
        info: !cel "steps.info.result.body"
        noName: !cel "steps.noName.result.status"
        number: !cel "steps.number.result.status"
        numberBody: !cel "steps.number.result.body"
      expected:
        english: { greeting: "Hello, Ada!" }
        spanish: { greeting: "HOLA, ADA!" }
        info: { service: greeter, greeting: Hola }
        noName: 400
        number: 422
        numberBody:
          type: about:blank
          title: Unprocessable Content
          status: 422
          detail: A name is not a number.
          code: ERR_NAME_REFUSED
