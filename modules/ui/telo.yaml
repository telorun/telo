  pattern:
    message: Is not in the expected format
    description: Under a field whose value fails `pattern`.
  minimum:
    message: Must be at least {$limit}
    values: { limit: { type: number } }
    description: Under a field whose value fails `minimum`.
  maximum:
    message: Must be at most {$limit}
    values: { limit: { type: number } }
    description: Under a field whose value fails `maximum`.
  exclusiveMinimum:
    message: Must be greater than {$limit}
