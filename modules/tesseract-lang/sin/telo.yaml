kind: Telo.Library
metadata:
  name: TesseractLangSin
  version: 0.2.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Recognize Sinhala text in images, offline: the trained model for reading
    printed Sinhala (Sinhala script) with Tesseract optical character recognition.
