units:
  analyzer: Added
body: "The loader reports what it refuses about a file as a coded diagnostic on that
  file, holding back the rest of the file as for a parse failure: a module's telo.yaml
  declaring no Telo.Application or Telo.Library is MODULE_DECLARATION_MISSING (an empty
  entry included, which telo check used to pass), one declaring several is
  MODULE_DECLARATION_DUPLICATE, and an include: entry is PARTIAL_KIND_FORBIDDEN,
  PARTIAL_GLOB_UNSUPPORTED or PARTIAL_NOT_FOUND where it used to stop the load with an
  uncoded error — a missing path listed beside a glob included, which used to be dropped
  silently. An import of a library declaring several module documents is
  INVALID_IMPORT_TARGET. An import whose source failed is IMPORT_UNRESOLVED in Telo's
  words for one of five kinds — nothing exists at the target's URL, it is not a module,
  it cannot be read, the host refused the request, or the host cannot be reached —
  carried as data.sourceFailure, never the operating system's or the transport's error
  text. Sources throw the new ManifestSourceFailure."
