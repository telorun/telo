kind: Telo.Library
metadata: { name: Merge }
migrations:
  MERGE_ADDRESS_RENAMED:
    reason: A page names its address as `path`.
    rules:
      - rewrite: Self.Page
        match: { type: object, required: [address] }
        move: { /address: /path }
---
kind: Telo.Definition
metadata: { name: Route }
capability: Telo.Type
schema:
  type: object
  additionalProperties: false
  properties: { address: { type: string }, method: { type: string } }
---
kind: Telo.Definition
metadata: { name: Page }
extends: Self.Route
schema: { type: object, properties: { method: { type: string, enum: [GET, POST] } } }
