kind: Telo.Application
metadata:
  name: InstanceUnionDecoding
  version: 1.0.0
  description: |
    A slot typed `anyOf: [Telo.Duration, Telo.Timestamp]` reads a literal by the
    one branch whose plain encoding reads it: `2s` is a duration, RFC 3339 text a
    timestamp, and an integer a duration in milliseconds, since only the
    duration declares an integer form. Each row writes all three forms at one
    decode site — a resource's own config and a call's `inputs:` — and reads
    each back as its CEL type and its text.
imports: { Run: ../modules/run, Assert: ../modules/assert }
targets:
  - !ref verifyInstanceUnion
---
# The value at a config slot, read back as its CEL type and text.
kind: Telo.Definition
metadata:
  name: After
  description: Reads back the instant or delay it is configured with.
extends: Run.Value
schema:
  type: object
  required: [after]
  properties:
    after:
      anyOf:
        - { x-telo-type: Telo.Duration }
        - { x-telo-type: Telo.Timestamp }
base:
  value: !cel "(type(self.after) == type(duration('0s')) ? 'duration ' : 'timestamp ') + string(self.after)"
---
# The same union at a call's argument.
kind: Run.Value
metadata: { name: render }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [after]
    properties:
      after:
        anyOf:
          - { x-telo-type: Telo.Duration }
          - { x-telo-type: Telo.Timestamp }
value: !cel "(type(inputs.after) == type(duration('0s')) ? 'duration ' : 'timestamp ') + string(inputs.after)"
---
kind: Telo.Sequence
metadata: { name: verifyInstanceUnion }
steps:
  - { name: configDuration, invoke: { kind: Self.After, after: 2s } }
  - name: configTimestamp
    invoke: { kind: Self.After, after: "2026-01-01T00:00:00Z" }
  - { name: configInteger, invoke: { kind: Self.After, after: 1500 } }
  - name: callDuration
    invoke: !ref render
    inputs: { after: 2s }
  - name: callTimestamp
    invoke: !ref render
    inputs: { after: "2026-01-01T00:00:00Z" }
  - name: callInteger
    invoke: !ref render
    inputs: { after: 1500 }
  - name: assertRead
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        - !cel "steps.configDuration.result"
        - !cel "steps.configTimestamp.result"
        - !cel "steps.configInteger.result"
        - !cel "steps.callDuration.result"
        - !cel "steps.callTimestamp.result"
        - !cel "steps.callInteger.result"
      expected: [duration 2s, timestamp 2026-01-01T00:00:00Z, duration 1.5s, duration 2s, timestamp 2026-01-01T00:00:00Z, duration 1.5s]
