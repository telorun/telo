# A destination reads the roots bound where it is written: inside a reader's
# list column `data` and `row`, inside a listing's records `row` — for a
# destination kind of another module too — and on a page's own link neither.
kind: Telo.Application
metadata: { name: UiInvalidDestinationRootsApp, version: 1.0.0 }
imports:
  Ui: ../../../../
  DataModel: ../../../../../data-model
  Places: ../../destination-kind
---
kind: Telo.JsonSchema
metadata: { name: Team }
schema:
  type: object
  required: [owner, members]
  properties:
    owner: { type: string }
    members: { type: array, items: { type: object, required: [id], properties: { id: { type: string } } } }
---
kind: Telo.JsonSchema
metadata: { name: Person }
schema: { type: object, required: [id], properties: { id: { type: string }, name: { type: string } } }
---
kind: Ui.View
metadata: { name: team }
content:
  type: query
  query:
    kind: Ui.Query
    model: !ref Team
    url: /api/team
  content:
    - type: list
      rows: !cel "data.members"
      columns:
        - value: !cel "row.id"
          to:
            kind: Ui.Navigate
            href: { path: "/people/{id}", pathParams: { id: !cel "row.idd" }, queryParams: { owner: !cel "data.ownr" } }
---
kind: Ui.Listing
metadata: { name: people }
presentation:
  kind: Ui.CollectionPresentation
  source:
    kind: Ui.CollectionSource
    basePath: /api/people
    collection: { kind: DataModel.Collection, model: !ref Person, query: { filters: [], sort: [] } }
model: !ref Person
layout:
  kind: Ui.ListLayout
  content:
    type: stack
    children:
      - { type: link, text: Open, to: { kind: Places.Go, place: !cel "row.id" } }
      - { type: link, text: Open, to: { kind: Places.Go, place: !cel "row.idd" } }
---
kind: Ui.Page
metadata: { name: home }
path: /
title: Home
children:
  - { type: link, text: First, to: { kind: Places.Go, place: !cel "row.id" } }
