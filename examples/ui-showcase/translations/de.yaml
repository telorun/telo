# The showcase in German: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads and translated into German's two cases, `one` and `other`; a word told
# apart by its context is translated once per context.
kind: I18n.Catalog
metadata:
  name: german
lang: de
texts:
  # Applications and pages.
  - { text: UI showcase, translation: UI-Showcase }
  - { text: UI showcase — Radix, translation: UI-Showcase — Radix }
  - { text: UI showcase — brand, translation: UI-Showcase — Marke }
  - { text: UI showcase — sidebar, translation: UI-Showcase — Seitenleiste }
  - { text: Overview, translation: Übersicht }
  - { text: Conditions, translation: Bedingungen }
  - { text: Data, translation: Daten }
  - { text: Tables, translation: Tabellen }
  - { text: Filters, translation: Filter }
  - { text: Forms, translation: Formulare }
  - { text: Actions, translation: Aktionen }
  - { text: Components, translation: Komponenten }
  - { text: CRUD, translation: CRUD }
  - { text: Themes, translation: Themes }
  # The navigation's groups.
  - { text: Building blocks, translation: Bausteine }
  - { text: Input, translation: Eingabe }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: Logo des UI-Showcase }
  - { text: Language, translation: Sprache }
  - { text: Theme, translation: Theme }
  - { text: Default, translation: Standard }
  - { text: Radix, translation: Radix }
  - { text: Brand, translation: Marke }
  - { text: Sidebar, translation: Seitenleiste }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: Pro Anfrage }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "Diese Knoten gehören zur Seite selbst, daher werden ihr when und ihr Text bei jeder Anfrage ausgewertet." }
  - { text: Your browser asked for Polish., translation: Ihr Browser hat Polnisch angefordert. }
  - { text: Your browser did not ask for Polish., translation: Ihr Browser hat nicht Polnisch angefordert. }
  - { text: The Acme brand is on., translation: Die Marke Acme ist aktiv. }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "Ein von einem Ausdruck berechneter Text wird so angezeigt, wie er berechnet wurde, und nie übersetzt." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "Ein Link, den diese Anfrage ungültig macht, wird durch einen Fehlerknoten ersetzt, und der Rest der Seite wird ausgeliefert." }
  - { text: Leaves the application, translation: Verlässt die Anwendung }

  # The overview.
  - { text: Every node type, translation: Jeder Knotentyp }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "Box, Stapel und Spalten enthalten andere Knoten, und jeder zeichnet seine Kinder auf eigene Weise." }
  - { text: A box, translation: Eine Box }
  - { text: Groups its children., translation: Gruppiert ihre Kinder. }
  - { text: A stack, translation: Ein Stapel }
  - { text: Draws its children one under another., translation: Zeichnet seine Kinder untereinander. }
  - { text: A badge, translation: Ein Badge }
  - { text: Columns, translation: Spalten }
  - { text: "Draw their children side by side, as these three are.", translation: "Zeichnen ihre Kinder nebeneinander, wie diese drei." }
  - { text: Text in each style, translation: Text in jedem Stil }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "Ein Stil sagt, was ein Knoten bedeutet; das Theme entscheidet, wie das aussieht. Ein Knoten kann mehrere tragen." }
  - { text: Heading, translation: Überschrift }
  - { text: Subheading, translation: Unterüberschrift }
  - { text: Muted, translation: Gedämpft }
  - { text: Strong, translation: Hervorgehoben }
  - { text: Accent, translation: Akzent }
  - { text: Danger, translation: Gefahr }
  - { text: Warning, translation: Warnung }
  - { text: Success, translation: Erfolg }
  - { text: Strong and accent, translation: Hervorgehoben und Akzent }
  - { text: Links, translation: Links }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "Ein Link zu einer deklarierten Seite navigiert innerhalb der Anwendung; eine unter dem Einhängepunkt ausgelieferte Datei wird normal geladen; https und mailto verlassen sie." }
  - { text: Go to Conditions, translation: Zu den Bedingungen }
  - { text: A file the server serves, translation: Eine vom Server ausgelieferte Datei }
  - { text: Write to us, translation: Schreiben Sie uns }
  - { text: Images, translation: Bilder }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "Ein Bild über seine Adresse, dasselbe Bild als Dekoration mit leerem alt und SVG-Markup, das als Bild gezeichnet und nie in die Seite eingefügt wird." }
  - { text: The showcase mark, translation: Das Zeichen des Showcase }
  - { text: Three overlapping circles, translation: Drei sich überlappende Kreise }
  - { text: Values by their schema, translation: Werte nach ihrem Schema }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "Jeder Wert wird so gezeichnet, wie es seine Modelleigenschaft vorgibt, gelesen aus dem Team-Datensatz, den die Seite lädt." }
  - { text: Visit the team homepage, translation: Homepage des Teams besuchen }
  - { text: "A uri, drawn as a link with a text of its own", translation: "Eine uri, als Link mit eigenem Text gezeichnet" }
  - { text: A uri-reference to a declared page, translation: Eine uri-reference auf eine deklarierte Seite }
  - { text: A uri-reference to a served file, translation: Eine uri-reference auf eine ausgelieferte Datei }
  - { text: A mailto address, translation: Eine mailto-Adresse }
  - { text: "An address the rule refuses, drawn as plain text", translation: "Eine von der Regel abgelehnte Adresse, als reiner Text gezeichnet" }
  - { text: A date, translation: Ein Datum }
  - { text: A date and time, translation: Datum und Uhrzeit }
  - { text: A boolean, translation: Ein Wahrheitswert }
  - { text: An enumeration's label, translation: Die Bezeichnung einer Aufzählung }
  - { text: A list, translation: Eine Liste }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "Die Zeilen einer einzigen Antwort, nie seitenweise. Eine Spaltenüberschrift ist standardmäßig der Titel der Eigenschaft, und die letzte Spalte wird nur angezeigt, solange das Team Personal sucht." }
  - { text: Projects under way, translation: Laufende Projekte }
  - { text: Project, translation: Projekt }
  - { text: Texts, translation: Texte }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": Noch keine Projekte.
        one: "Bisher {$count} Projekt."
        other: "Bisher {$count} Projekte."
  - { text: "{$team} started {$project} most recently.", translation: "{$team} hat zuletzt {$project} begonnen." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "Ein im Browser für die gelesene Zahl gewählter Plural und ein Text, dessen Werte aus dem Datensatz stammen." }
  - { text: Open, context: state, translation: Offen }
  - { text: Open, context: verb, translation: Öffnen }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "Der eigene Text eines Knotens wird genauso unterschieden: Das Badge sagt, dass TEL-42 offen ist, der Link bietet an, seine Aufgaben zu öffnen." }
  - { text: Style rules, translation: Stilregeln }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "Der Stil einer Zeile und der einer Zelle werden durch einen Wert der Zeile gewählt. Das hervorgehobene Projekt ist fett, jeder Status hat seine Farbe, und ein Status, den kein Fall nennt, erhält den Standard. Zwei Spalten tragen dasselbe Wort als Überschrift, Open, unterschieden durch den Kontext, mit dem jede Überschrift geschrieben ist." }
  - { text: Composites, translation: Kompositionen }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "Diese ganze Seite ist eine Ansicht, die jede Anwendung per Referenz platziert. Darunter eine Ansicht, die direkt dort geschrieben ist, wo sie platziert wird, und eine eigene Kompositionsart dieses Beispiels, die keinen Controller hat." }
  - { text: A view declared inline at the node that places it., translation: "Eine direkt im platzierenden Knoten deklarierte Ansicht." }
  - { text: A callout, translation: Ein Hinweiskasten }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Einmal als Art deklariert, die Ui.Composite erweitert und eine Ansicht bereitstellt, und mit eigenen Feldern platziert." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: Tabs }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "Inhalt in Tabs, jeweils ein Tab. Der gewählte Tab ist Teil der Seitenadresse, sodass ein Neuladen oder ein geteilter Link ihn wieder öffnet." }
  - { text: Summary, translation: Zusammenfassung }
  - { text: "A tab holds any nodes, as a box does.", translation: "Ein Tab enthält beliebige Knoten, wie eine Box." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "Nur die Knoten des gewählten Tabs werden gezeichnet." }
  - { text: Chosen, translation: Gewählt }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "Jeder Tab wird nach seinem eigenen when ausgeliefert, wie jeder Knoten." }
  # The labels of the overview's models.
  - { text: Code, translation: Code }
  - { text: Name, translation: Name }
  - { text: Status, translation: Status }
  - { text: Active, translation: Aktiv }
  - { text: Paused, translation: Pausiert }
  - { text: Finished, translation: Abgeschlossen }
  - { text: Budget, translation: Budget }
  - { text: Started, translation: Begonnen }
  - { text: Free, context: subscription, translation: Kostenlos }
  - { text: Enterprise, context: subscription, translation: Enterprise }
  - { text: Version, translation: Version }
  - { text: Team, context: subscription, translation: Team }

  # Conditions.
  - { text: Delivered and drawn, translation: Ausgeliefert und gezeichnet }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "Das when eines Knotens entscheidet auf dem Server, ob er ausgeliefert wird; sein shown entscheidet im Browser, ob ein ausgelieferter Knoten gezeichnet wird." }
  - { text: Never delivered — this node is not in the page document., translation: Nie ausgeliefert — dieser Knoten ist nicht im Seitendokument. }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "Ausgeliefert und nie gezeichnet: Der Status ist nicht paused, daher hält der Browser dies verborgen." }
  - { text: Delivered by its when and drawn by its shown., translation: Durch sein when ausgeliefert und durch sein shown gezeichnet. }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "Die Bedingung einer Platzierung um eine Komposition, deren Knoten eine eigene hat, wird in eine Box gehüllt, und beide müssen erfüllt sein." }
  - { text: Both conditions hold., translation: Beide Bedingungen sind erfüllt. }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "Eine Ansicht, deren Inhalt ihr eigenes when abschaltet, liefert keinen Knoten, daher wird die Komposition, die sie platziert, ausgelassen." }
  - { text: Never provided., translation: Nie bereitgestellt. }
  - { text: Every keyword of a condition, translation: Jedes Schlüsselwort einer Bedingung }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "Jede Zeile unten wird gezeichnet, weil ihre Bedingung für die Zusammenfassung des Projekts TEL-42 erfüllt ist, die diese Seite gelesen hat: Status active, vier Mitglieder, Geschwindigkeit 2.5, Tags design und web, als Leitung ein Manager, note null und kein codename." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: daran arbeiten zwischen 1 und 10 Personen." }
  - { text: "required: the lead has an e-mail.", translation: "required: die Leitung hat eine E-Mail-Adresse." }
  - { text: "properties: the lead is a manager.", translation: "properties: die Leitung ist ein Manager." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: daran arbeiten mindestens drei Personen." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: daran arbeiten höchstens neun Personen." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: die Geschwindigkeit ist größer als 2." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: die Geschwindigkeit ist kleiner als 3." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: die Geschwindigkeit ist ein Vielfaches von 0.5." }
  - { text: "type: the status is a string.", translation: "type: der Status ist ein String." }
  - { text: "type, as a list: the note is a string or null.", translation: "type als Liste: note ist ein String oder null." }
  - { text: "const: the status is active.", translation: "const: der Status ist active." }
  - { text: "enum: the status is active or paused.", translation: "enum: der Status ist active oder paused." }
  - { text: "not: the status is not paused.", translation: "not: der Status ist nicht paused." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code beginnt mit TEL oder OPS." }
  - { text: "items: every tag has at least two letters.", translation: "items: jedes Tag hat mindestens zwei Buchstaben." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: es gibt mindestens zwei Tags." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: es gibt höchstens fünf Tags." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: kein Tag wiederholt sich." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code hat mindestens drei Zeichen." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code hat höchstens zehn Zeichen." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code besteht aus Buchstaben, einem Bindestrich und Ziffern." }
  - { text: Missing and null, translation: Fehlend und null }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null ist ein vorhandener Wert. Ein fehlender Wert erfüllt keine Bedingung, nicht einmal eine unter not, daher wird das Fehlen am übergeordneten Objekt geprüft." }
  - { text: The note is present and null., translation: note ist vorhanden und null. }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "Nie gezeichnet: Ein fehlendes codename erfüllt not nicht." }
  - { text: "The project has no codename, tested on the summary.", translation: "Das Projekt hat kein codename, geprüft an der Zusammenfassung." }
  - { text: Query parameters, translation: Abfrageparameter }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "Dieser Leser deklariert mode, eine Liste von tag-Werten und ein ticket, das einem Muster folgen muss. Ein Parameter, den die Adresse auslässt, ein einzelner, der zweimal angegeben ist, oder ein Wert, den seine Deklaration ablehnt, gilt als fehlend." }
  - { text: Mode detailed, translation: Modus detailed }
  - { text: Two tags, translation: Zwei Tags }
  - { text: A valid ticket, translation: Ein gültiges ticket }
  - { text: A refused ticket, translation: Ein abgelehntes ticket }
  - { text: Mode given twice, translation: Modus zweimal angegeben }
  - { text: Clear the query, translation: Abfrage leeren }
  - { text: mode is detailed., translation: mode ist detailed. }
  - { text: There are two tag values or more., translation: Es gibt zwei oder mehr tag-Werte. }
  - { text: The ticket matches its pattern., translation: ticket entspricht seinem Muster. }
  - { text: "No ticket, or one its pattern refuses.", translation: "Kein ticket oder eines, das sein Muster ablehnt." }
  - { text: Enablement, translation: Aktivierbarkeit }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "Die Schaltfläche lässt sich nur drücken, solange ihre Bedingung über den Inhalt des Formulars erfüllt ist, und sagt sonst, warum nicht. Ein Tag, das das Projekt bereits hat, wird abgelehnt, und die Zeilen oben lesen die Zusammenfassung erneut, nachdem ein Tag hinzugefügt wurde." }
  - { text: Tag TEL-42, translation: TEL-42 taggen }
  - { text: Tag, translation: Tag }
  - { text: Type a tag of three letters or more., translation: Geben Sie ein Tag mit mindestens drei Buchstaben ein. }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation:
      plural: count
      cases:
        one: "{$tag} hinzugefügt: TEL-42 hat jetzt {$count} Tag."
        other: "{$tag} hinzugefügt: TEL-42 hat jetzt {$count} Tags."
  - { text: A page's own query, translation: Die eigene Abfrage einer Seite }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "Auch diese Seite deklariert mode, und ihre eigenen Knoten lesen es." }
  - { text: The page reads mode as detailed., translation: Die Seite liest mode als detailed. }

  # Data.
  - { text: A reader and its parameters, translation: Ein Leser und seine Parameter }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "Das Projekt ist der Parameter project der Seitenadresse, der mit dem Lesen gesendet wird; fehlt er, wird kein Parameter gesendet, und die Route antwortet für TEL-42. Ein Code, den kein Projekt hat, zeichnet den Fehlerbaum." }
  - { text: A code no project has, translation: "Ein Code, den kein Projekt hat" }
  - { text: No project, translation: Kein Projekt }
  - { text: Reading the project…, translation: Projekt wird gelesen… }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, geleitet von {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "Ein im Inhalt dieses Lesers verschachtelter Leser liest die Personen, die am selben Projekt arbeiten." }
  - { text: Working on it, translation: Daran arbeiten }
  - { text: Role, translation: Rolle }
  - { text: E-mail, translation: E-Mail }
  - { text: "No answer · {$code}", translation: "Keine Antwort · {$code}" }
  - { text: Readers that fail, translation: "Leser, die fehlschlagen" }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "Ohne eigenen Fehlerbaum zeichnen Leser Code und Meldung des Fehlers — für ein Projekt, das nicht existiert, für eine geschützte Route, die ohne Sitzung gelesen wird, und für eine Antwort, die das Modell des Lesers ablehnt (die Projektliste, als ein einzelnes Projekt gelesen)." }
  - { text: "Never drawn: there is no such project.", translation: "Nie gezeichnet: Dieses Projekt gibt es nicht." }
  - { text: "Signed in, so this reads: {$name}", translation: "Angemeldet, daher wird gelesen: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "Nie gezeichnet: Eine Liste ist kein Projekt." }
  - { text: Read again on focus, translation: Erneut lesen bei Fokus }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "Dieser Leser liest die Serverzeit jedes Mal erneut, wenn das Fenster wieder den Fokus erhält. Wechseln Sie zu einem anderen Fenster und zurück." }
  - { text: Read at, translation: Gelesen um }
  - { text: A sign-in gate, translation: Eine Anmeldeschranke }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "Die Schranke liest, ob eine Sitzung offen ist, und liest erneut, sobald eine Anfrage darin mit 401 beantwortet wird. Die Anmeldung öffnet eine Sitzung für ein Mitglied des Teams; eine E-Mail-Adresse, die niemand im Team hat, wird an ihrem Feld abgelehnt. Innen zeigt ein Leser über eine geschützte Route das Konto an. Das stille Beenden der Sitzung lässt das Konto auf dem Bildschirm, bis die nächste geschützte Anfrage — die Prüfung unten oder ein Fokuswechsel — abgelehnt wird; dann wechselt die Schranke zur abgemeldeten Ansicht." }
  - { text: You are signed out., translation: Sie sind abgemeldet. }
  - { text: Sign in, translation: Anmelden }
  - { text: "Signed in as {$name}", translation: "Angemeldet als {$name}" }
  - { text: "Member since {$since}", translation: "Mitglied seit {$since}" }
  - { text: Check the session, translation: Sitzung prüfen }
  - { text: End the session quietly, translation: Sitzung still beenden }
  - { text: Sign out, translation: Abmelden }

  # The labels of the task models.
  - { text: Task, translation: Aufgabe }
  - { text: Assignee, translation: Zuständig }
  - { text: Priority, translation: Priorität }
  - { text: Estimate, translation: Schätzung }
  - { text: Due, translation: Fällig }
  - { text: Label, translation: Label }
  - { text: Blocked, translation: Blockiert }
  - { text: To do, translation: Zu erledigen }
  - { text: In progress, translation: In Arbeit }
  - { text: In review, translation: In Prüfung }
  - { text: Bug, translation: Fehler }
  - { text: Feature, translation: Funktion }
  - { text: Chore, translation: Wartung }
  - { text: Docs, translation: Dokumentation }
  - { text: Contact, translation: Kontakt }
  - { text: Project name, translation: Projektname }
  - { text: Brief, translation: Kurzbeschreibung }

  # Tables.
  - { text: Columns from the model, translation: Spalten aus dem Modell }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "Ohne geschriebene Spalten zeigt eine Tabelle je eine pro Modelleigenschaft außer dem Zeilenschlüssel, jede mit ihrem Titel als Überschrift und nach ihrem Typ gezeichnet. Sie zeigt 25 Zeilen pro Seite, den Standard, und öffnet ihre Formulare zum Anlegen und Bearbeiten in einem Dialog, der Oberfläche, die eine Tabelle verwendet, wenn sie keine nennt." }
  - { text: "Written columns, sorting and style rules", translation: "Geschriebene Spalten, Sortierung und Stilregeln" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "Von Hand geschriebene Spalten in der angegebenen Reihenfolge, eine davon mit eigener Überschrift. Eine Spalte ist sortierbar, wenn die Sammlung ihre Eigenschaft zum Sortieren aufführt. Die Zeile einer blockierten Aufgabe ist fett und rot, jede Statuszelle hat ihre Farbe, und eine Priorität, die kein Fall nennt, erhält den Standard. Acht Zeilen pro Seite." }
  - { text: Where, translation: Wo }
  - { text: Members behind a reference, translation: Felder hinter einer Referenz }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "Das Aufgabenboard liefert jede Aufgabe mit der zuständigen Person und dem Projekt darin verschachtelt. Eine Spalte über einem verschachtelten Feld übernimmt dessen Titel und Darstellung über eine benannte Form, über eine eigene Definition des Modells und über eine Referenz, deren eigener Titel Vorrang vor der benannten Form hat: Der Kontakt ist ein Mail-Link und die Kurzbeschreibung ein Link zu einer Seite." }
  - { text: Filtered by the address, translation: Nach der Adresse gefiltert }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "Diese Tabelle deklariert einen Parameter project und sendet ihn bei jeder Anfrage als Gleichheitsbedingung. Ohne Projekt in der Adresse liest sie nichts." }
  - { text: Atlas redesign tasks, translation: Aufgaben der Atlas-Neugestaltung }
  - { text: Billing migration tasks, translation: Aufgaben der Abrechnungsmigration }
  - { text: Blocked tasks, translation: Blockierte Aufgaben }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "Diese ist nach einem festen, in die Tabelle geschriebenen Wert gefiltert und listet nur blockierte Aufgaben auf." }
  - { text: Where a form opens, translation: Wo sich ein Formular öffnet }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "Jede Tabelle unten öffnet ihre Formulare zum Anlegen und Bearbeiten auf einer anderen Oberfläche. Ein Speichern lädt jede Aufgabentabelle der Seite neu." }
  - { text: Dialogs, translation: Dialoge }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "Anlegen in einem kleinen Dialog, der geöffnet und geleert für die nächste Aufgabe bleibt. Bearbeiten in einem großen Dialog, der die Seite nicht blockiert und einen Klick außerhalb ignoriert; er behält seine Werte nach dem Speichern, verwirft ungespeicherte Eingaben ohne Rückfrage und ist Teil der Adresse. Jede Zeile bietet ein bestätigtes Löschen." }
  - { text: Drawers, translation: Schubladen }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "Anlegen in einer kleinen Schublade vom Anfangsrand; Bearbeiten in einer großen Schublade vom Endrand, ohne Schließen-Schaltfläche. Beide schließen sich nach dem Speichern und fragen nach, bevor ungespeicherte Eingaben verworfen werden." }
  - { text: Sheets, translation: Blätter }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "Anlegen in einem Blatt von oben, das die Seite nicht blockiert; Bearbeiten in einem vollen Blatt von unten, das Teil der Adresse ist." }
  - { text: Popovers, translation: Popover }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "Anlegen in einer Karte neben der Schaltfläche Neu, darauf zentriert; unterhalb des Breakpoints wird sie zu einem vollen Dialog. Bearbeiten in einer Karte unter der Schaltfläche der Zeile, an deren Ende ausgerichtet, die ein Klick außerhalb nicht schließt und die nach dem Speichern geöffnet bleibt." }
  - { text: In line, translation: Eingebettet }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "Das Formular zum Anlegen öffnet sich über den Zeilen und das Formular zum Bearbeiten unter der Zeile, die es ändert. Unterhalb des Breakpoints öffnet sich das Formular zum Anlegen in einem Blatt von unten." }
  - { text: Panels, translation: Panels }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "Anlegen in einem kleinen Panel am Anfangsrand, das Escape nicht schließt. Bearbeiten in einem großen Panel am Endrand, das Teil der Adresse ist, mit weiterhin nutzbaren Zeilen daneben; unterhalb des Breakpoints wird es zu einem Blatt von unten." }
  - { text: A page of its own, translation: Eine eigene Seite }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "Anlegen und Bearbeiten ersetzen den Inhalt der Seite unter einem Adressnamen, sodass die Adresse entweder eine neue Aufgabe oder die Aufgabe mit diesem Schlüssel nennt, und Zurück schließt das Formular. Die Oberfläche wird einmal deklariert und von beiden benannt." }

  # Filters.
  - { text: Every filter the collection accepts, translation: "Jeder Filter, den die Sammlung akzeptiert" }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "Ohne geschriebene Felder zeichnet die Leiste ein Steuerelement pro Filter, den die Sammlung akzeptiert, in deren Reihenfolge und anhand der Modelleigenschaft: eine Liste für eine Aufzählung oder einen Ja/Nein-Wert, sonst ein typisiertes Eingabefeld, und eine Beschriftung über den beiden Grenzen eines Bereichs. Sie steht über der Tabelle, wendet eine Auswahl sofort und eingegebenen Text bei Enter an und speichert nichts zwischen Besuchen." }
  - { text: Every control, translation: Jedes Steuerelement }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "Jede Art, einen Filter einzugeben: eingegebener Text, Optionen nebeneinander, eine Liste, eingegebene Tags, ein Schieberegler, ein Schalter und zwei Daten unter einer Beschriftung. Der Projektfilter wird nirgends gezeichnet, und nur eine Voreinstellung setzt ihn. Der Status beginnt mit seinem Standardwert, und eine Voreinstellung setzt die Filter, die die Voreinstellungen nennen, und leert die anderen, die sie nennen. Chips fassen die Auswahl zusammen, und die Werte sind Teil der Adresse. Unterhalb des Breakpoints klappt die Leiste ein, und der angeheftete Textfilter bleibt außerhalb des eingeklappten Bereichs." }
  - { text: Urgent, translation: Dringend }
  - { text: Atlas only, translation: Nur Atlas }
  - { text: Stuck, translation: Festgefahren }
  - { text: "Beside, as chips, while typing", translation: "Daneben, als Chips, während der Eingabe" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "Die Steuerelemente stehen in einer Spalte am Anfangsrand. Nur die gewählten Filter sind sichtbar: Fügen Sie einen aus der Liste der Leiste hinzu; wird er entfernt, wird er geleert. Jeder Filter ist ein Chip, der seinen Wert nennt und sein Steuerelement öffnet. Eingegebener Text wird nach einer Pause angewendet, und die beiden Grenzen einer Zahl sind mit nach und vor beschriftet. Die Auswahl bleibt in diesem Browser über Besuche hinweg erhalten. Unterhalb des Breakpoints öffnet sich die Leiste in einem Blatt von unten." }
  - { text: "Beside at the end, applied by a button", translation: "Daneben am Ende, per Schaltfläche angewendet" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "Die Steuerelemente stehen am Endrand, und eine Änderung wartet auf Anwenden, während eine Voreinstellung, Zurücksetzen und das Entfernen eines Zusammenfassungs-Chips sofort wirken. Mehrere zuständige Personen werden durch Kommas getrennt eingegeben. Die Auswahl bleibt nur für diesen Tab erhalten und übersteht ein Neuladen." }
  - { text: Due by October, translation: Fällig bis Oktober }
  - { text: "Folded, starting open", translation: "Einklappbar, anfangs ausgeklappt" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "Die Steuerelemente klappen hinter einem Umschalter ein, der die Filter mit Wert zählt, und sind anfangs ausgeklappt. Der angeheftete Textfilter bleibt außerhalb des eingeklappten Bereichs, und die anderen werden aus der Liste der Leiste hinzugefügt. Der Status beginnt mit In Arbeit; ihn zu entfernen leert auch diesen Standardwert, und Zurücksetzen bringt ihn zurück. Die Werte bleiben sowohl in der Adresse als auch in diesem Browser erhalten, wobei die Adresse Vorrang hat, und der gewählte Klappzustand wird gespeichert." }
  - { text: "Folded, starting closed", translation: "Einklappbar, anfangs eingeklappt" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "Anfangs eingeklappt. Der angeheftete Textfilter, Anwenden und Zurücksetzen bleiben außerhalb des eingeklappten Bereichs. Das Label beginnt mit seinem Standardwert, Fehler, bis es geändert wird, und Zurücksetzen bringt den Standardwert zurück." }
  - { text: In a dialog, translation: In einem Dialog }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "Die Steuerelemente öffnen sich in einem kleinen Dialog über eine Schaltfläche, die die Filter mit Wert zählt, und schließen sich mit Fertig. Der geöffnete Dialog ist Teil der Adresse, sodass ein Link ihn öffnet. Der angeheftete Textfilter bleibt neben der Schaltfläche, und Chips fassen die Auswahl zusammen." }
  - { text: In a drawer, translation: In einer Schublade }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "Die Steuerelemente öffnen sich in einer Schublade vom Anfangsrand, die ein Klick außerhalb nicht schließt. Eingegebene Werte werden nach einer Pause angewendet." }
  - { text: In a popover, translation: In einem Popover }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "Die Steuerelemente öffnen sich in einer Karte unter der Schaltfläche, an deren Ende ausgerichtet; unterhalb des Breakpoints in einem Blatt von unten." }

