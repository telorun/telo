kind: Telo.Application
metadata:
  name: HubE2EMcpTools
  version: 1.0.0
  description: |
    End-to-end tests for the hub's MCP endpoint at /mcp, run against a live
    hub at http://localhost:8040 that has tracked the seeded refs. Locks in
    the discovery loop: `search_resources` returns kind hits carrying the exact
    module location ref, `get_module_manifest(ref)` returns the tracker-cached
    telo.yaml for that ref, and `get_module` / `list_module_versions` /
    `find_implementations` / `find_instances` / `list_categories` / `suggest_module_refs` mirror
    the hub's keyed-read HTTP routes as tools.
imports:
  McpClient: oci://ghcr.io/telorun/mcp-client@0.15.1#sha256-qOWJKsRw1H8vQiR8L0m3hnAsJf0otEPYMZ6yYzU_CbA
  Run: oci://ghcr.io/telorun/run@0.27.1#sha256-O1CdVvYs_O7Zj-PNQxMS3NdgWL6e8M2A0J9Wu0rTnIU
  Assert: oci://ghcr.io/telorun/assert@0.20.0#sha256-CHKb_ylzNVdyIA4XFFvofXSbgCUAyuaiSgWXyZKtPSI
  Yaml: oci://ghcr.io/telorun/yaml@0.10.3#sha256-xgWF987hJC2tA6q4SP3BUhSzZz2eSbVmVUK4DVOGupk
targets:
  - !ref searchResources_ReturnsKindHits
  - !ref searchResources_CarriesCategoryVocabulary
  - !ref getModule_ReturnsTrackedModuleFacts
  - !ref listModuleVersions_ReturnsPinnedVersions
  - !ref findImplementations_ListsKvStoreBackends
  - !ref findInstances_ListsSeededLanguagePacks
  - !ref listCategories_CarriesSchedulingSlug
  - !ref suggestModuleRefs_ResolvesPartialToken
  - !ref getModuleManifest_ReturnsCachedYaml
---
kind: McpClient.HttpClient
metadata: { name: hubMcp }
url: http://localhost:8040/mcp
clientInfo: { name: telo-test, version: 1.0.0 }
---
kind: McpClient.ToolsCall
metadata: { name: mcpToolCall }
client: !ref hubMcp
---
kind: Yaml.Parse
metadata: { name: parsePayload }
---
kind: Run.Sequence
metadata: { name: searchResources_ReturnsKindHits }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: search_resources
      arguments:
        query: delay a task
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  # The hit list itself is not assertable as a literal — scores and the rest of
  # the corpus move — so the claim is stated directly: the query echoes back,
  # and the seeded timer's Delay is somewhere in the results.
  - name: assert
    inputs:
      actual:
        query: !cel "steps.parse.result.docs[0].query"
        foundTimerDelay: !cel >-
          steps.parse.result.docs[0].hits.exists(h,
            h.kind == 'Delay' && h.module.ref == 'oci://ghcr.io/telorun/timer')
      expected:
        query: delay a task
        foundTimerDelay: true
    invoke:
      kind: Assert.Equals
---
kind: Run.Sequence
metadata: { name: getModuleManifest_ReturnsCachedYaml }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: get_module_manifest
      arguments:
        ref: oci://ghcr.io/telorun/timer
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  # Projected to the two facts this route owes a caller — the whole owner doc
  # carries a description, version and exports that move with every release.
  # The keys are `docKind` / `moduleName`, not `kind` / `name`: a literal object
  # carrying a `kind` key reads as an inline resource definition.
  - name: assert
    inputs:
      actual:
        docKind: !cel "steps.parse.result.docs[0].kind"
        moduleName: !cel "steps.parse.result.docs[0].metadata.name"
      expected:
        docKind: Telo.Library
        moduleName: Timer
    invoke:
      kind: Assert.Equals
---
# The facet rides on every tool response, which is the only way an agent learns
# an open, author-declared vocabulary from inside the discovery loop. Without it
# a guessed `category` was answered with an empty hit list — indistinguishable
# from "Telo has no such kind", and enough to send an agent hunting for a
# capability it had already been shown.
kind: Run.Sequence
metadata: { name: searchResources_CarriesCategoryVocabulary }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: search_resources
      arguments:
        query: repeat a step while a condition holds
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  # `run` is categorized Compute, and Run.Loop is what an app that repeats work
  # actually needs — the kind an unfiltered search has to surface.
  - name: assert
    inputs:
      actual:
        dropped: !cel "steps.parse.result.docs[0].categoryFilterDropped"
        knowsCompute: !cel "steps.parse.result.docs[0].categories.exists(c, c.category == 'compute')"
        foundRunLoop: !cel >-
          steps.parse.result.docs[0].hits.exists(h,
            h.kind == 'Loop' && h.module.ref == 'oci://ghcr.io/telorun/run')
      expected:
        dropped: false
        knowsCompute: true
        foundRunLoop: true
    invoke:
      kind: Assert.Equals
---
# get_module mirrors GET /module: keyed facts about the seeded timer module,
# not ranked hits — the kind list carries its Delay kind either way.
kind: Run.Sequence
metadata: { name: getModule_ReturnsTrackedModuleFacts }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: get_module
      arguments:
        ref: oci://ghcr.io/telorun/timer
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        moduleRef: !cel "steps.parse.result.docs[0].module.ref"
        foundDelayKind: !cel "steps.parse.result.docs[0].kinds.exists(k, k.kind == 'Delay')"
      expected:
        moduleRef: oci://ghcr.io/telorun/timer
        foundDelayKind: true
    invoke:
      kind: Assert.Equals
---
# list_module_versions mirrors GET /module/versions: the pin an agent needs to
# write a reproducible `imports:` entry.
kind: Run.Sequence
metadata: { name: listModuleVersions_ReturnsPinnedVersions }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: list_module_versions
      arguments:
        ref: oci://ghcr.io/telorun/timer
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        ref: !cel "steps.parse.result.docs[0].ref"
        hasVersions: !cel "steps.parse.result.docs[0].versions.size() > 0"
        firstHasVersionField: !cel "'version' in steps.parse.result.docs[0].versions[0]"
      expected:
        ref: oci://ghcr.io/telorun/timer
        hasVersions: true
        firstHasVersionField: true
    invoke:
      kind: Assert.Equals
---
# find_implementations mirrors GET /implementations: the seeded redis and
# memory backends both extend kv-store's Store abstract from their own module.
kind: Run.Sequence
metadata: { name: findImplementations_ListsKvStoreBackends }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: find_implementations
      arguments:
        ref: oci://ghcr.io/telorun/kv-store
        kind: Store
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        foundRedis: !cel >-
          steps.parse.result.docs[0].implementations.exists(i,
            i.ref == 'oci://ghcr.io/telorun/kv-store-redis')
        foundMemory: !cel >-
          steps.parse.result.docs[0].implementations.exists(i,
            i.ref == 'oci://ghcr.io/telorun/kv-store-memory')
      expected:
        foundRedis: true
        foundMemory: true
    invoke:
      kind: Assert.Equals
---
# find_instances mirrors GET /instances: the seeded language packs each export
# one model of tesseract-model's `Language` kind and define no kind of their own.
# They are seeded from the checkout, so the kind's owner is the local ref their
# relative import resolves to.
kind: Run.Sequence
metadata: { name: findInstances_ListsSeededLanguagePacks }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: find_instances
      arguments:
        ref: ./modules/tesseract-model
        kind: Language
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual: !cel >-
        ['pol', 'deu', 'fra'].map(code,
          steps.parse.result.docs[0].instances.exists(i,
            i.name == code && i.module.ref == './modules/tesseract-lang/' + code))
      expected: [true, true, true]
    invoke:
      kind: Assert.Equals
---
# list_categories mirrors GET /categories: browsable without a search query.
kind: Run.Sequence
metadata: { name: listCategories_CarriesSchedulingSlug }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: list_categories
      arguments: {}
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        knowsScheduling: !cel "steps.parse.result.docs[0].categories.exists(c, c.category == 'scheduling')"
      expected:
        knowsScheduling: true
    invoke:
      kind: Assert.Equals
---
# suggest_module_refs mirrors GET /refs: lexical typeahead, not semantic search.
kind: Run.Sequence
metadata: { name: suggestModuleRefs_ResolvesPartialToken }
steps:
  - name: call
    invoke: !ref mcpToolCall
    inputs:
      name: suggest_module_refs
      arguments:
        query: consol
  - name: parse
    invoke: !ref parsePayload
    inputs:
      text: !cel "steps.call.result.content[0].text"
  - name: assert
    inputs:
      actual:
        foundConsole: !cel >-
          steps.parse.result.docs[0].refs.exists(r, r.ref == 'oci://ghcr.io/telorun/console')
      expected:
        foundConsole: true
    invoke:
      kind: Assert.Equals
