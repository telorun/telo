# Reading a module from wherever it is published.
#
# Every transport-specific read goes through the generic `telo module …` CLI
# verbs, so nothing here — and nothing downstream — speaks OCI or HTTP directly.
# This library owns the whole of that boundary: how a ref pins to a version, what
# counts as a concrete version, and how a non-zero exit becomes a value the
# caller decides about rather than an exception it has to catch.
#
# `lifecycle: shared` because ingest and registration both read origins and there
# is one CLI and one shell host behind them. Isolated, each importer would get
# its own, and the two would drift the moment one gained a timeout the other
# lacked.
#
# Failures are RETURNED, not thrown: registration answers a bad ref with a 400
# carrying the reason, while ingest turns the same failure into a recorded
# attempt. Throwing here would force one of the two to catch and re-derive what
# the other reads directly.
kind: Telo.Library
metadata:
  name: HubOrigin
  description: >-
    Reads a published Telo module from its own host: which versions exist with
    each version's content digest, a version's manifest with the metadata the
    CLI derives from it, and the third-party components a version ships.
lifecycle: shared
requires:
  # `resources:` inputs and `lifecycle:` on a library.
  # 0.128.0: `Telo.Sequence`, which an older analyzer reads as UNDEFINED_KIND.
  telo: ">=0.128.0"
imports: { Shell: ../../modules/shell, Yaml: ../../modules/yaml, Run: ../../modules/run }
resources: { shellHost: { kind: Shell.LocalHost, description: Where the telo CLI runs. } }
variables:
  # The command these reads run: a program and its leading arguments, to which
  # each read appends its own. `["telo"]` by default; the composition root binds
  # the telo that runs the hub, so the CLI contract read here is the hub's own
  # generation.
  teloCommand:
    type: array
    items: { type: string }
    minItems: 1
    default: [telo]
exports: { resources: [pinnedRef, moduleVersions, moduleManifest, moduleSbom, nestedManifest] }
---
kind: Shell.Command
metadata: { name: teloCli }
host: !ref shellHost
---
kind: Yaml.Parse
metadata: { name: parseYaml }
---
# How a ref pins to one version, in one place. A direct `https://` ref addresses
# a single file at a fixed location and takes NO `@version` suffix — appending
# one produces a 404 — and neither does a local path, which is one directory on
# disk. Only an OCI ref pins, with `@<version>`.
kind: Run.Value
metadata: { name: pinnedRef }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties: { ref: { type: string }, version: { type: string } }
    required: [ref, version]
value: !cel "inputs.ref.startsWith('oci://') ? inputs.ref + '@' + inputs.version : inputs.ref"
---
# The versions a ref actually resolves to, newest-first, each with its digest
# (or, when that one tag's digest cannot be read, the reason, with `digest`
# empty), and with the `latest` tag dropped — it is an alias, not a version, and
# ingesting it would store the same content twice under two names. Prerelease
# versions (`X.Y.Z-rc.N`) are dropped too: only finals are ever indexed.
#
# One CLI process reads every digest: the reconcile pass reads every version of
# every tracked module, and a process per version was most of its cost.
kind: Telo.Sequence
metadata: { name: moduleVersions }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties: { ref: { type: string } }
    required: [ref]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      ok: { type: boolean }
      error: { type: string }
      versions:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            version: { type: string }
            # The transport-native content digest of the version. Opaque by
            # design: it exists to detect a re-pushed tag, never to be compared
            # across transports. '' when `error` says why it could not be read.
            digest: { type: string }
            error: { type: string }
          required: [version, digest, error]
      # '' when the ref resolves but publishes no concrete version.
      latest: { type: string }
    required: [ok, error, versions, latest]
steps:
  - name: run
    invoke: !ref teloCli
    inputs:
      args: !cel "variables.teloCommand + ['module', 'versions', inputs.ref, '--json', '--digests']"
      timeoutMs: 120000
  - name: parsed
    if: !cel "steps.run.result.exitCode == 0"
    then:
      - name: docs
        invoke: !ref parseYaml
        inputs:
          text: !cel "steps.run.result.stdout"
      - name: concrete
        value: !cel >-
          steps.docs.result.docs[0]
            .filter(e, string(e.version) != 'latest' && !string(e.version).contains('-'))
            .map(e, {
            'version': string(e.version),
            'digest': 'digest' in e ? string(e.digest) : '',
            'error': 'error' in e ? string(e.error) : ''
          })
outputs:
  ok: !cel "steps.run.result.exitCode == 0"
  error: !cel "steps.run.result.exitCode == 0 ? '' : steps.run.result.stderr"
  versions: !cel "'concrete' in steps ? steps.concrete.result : []"
  latest: !cel >-
    'concrete' in steps && size(steps.concrete.result) > 0 ? steps.concrete.result[0].version : ''
---
# One version's manifest, plus everything the CLI derives from it.
#
# `payload` is the verb's own JSON object verbatim — cache key, integrity, the
# runtime block — and `docs` the parsed manifest documents. Passed through rather
# than projected, because what a consumer wants out of it is the consumer's
# business: this library's job ends at "the origin answered, here is what it
# said".
kind: Telo.Sequence
metadata: { name: moduleManifest }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties: { ref: { type: string }, version: { type: string } }
    required: [ref, version]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      ok: { type: boolean }
      error: { type: string }
      payload: { type: object, additionalProperties: true }
      docs: { type: array }
    required: [ok, error, payload, docs]
steps:
  - name: pinned
    invoke: !ref pinnedRef
    inputs:
      ref: !cel "inputs.ref"
      version: !cel "inputs.version"
  - name: run
    invoke: !ref teloCli
    inputs:
      args: !cel "variables.teloCommand + ['module', 'manifest', steps.pinned.result, '--json']"
      timeoutMs: 120000
  - name: parsed
    if: !cel "steps.run.result.exitCode == 0"
    then:
      - name: payload
        invoke: !ref parseYaml
        inputs:
          text: !cel "steps.run.result.stdout"
      - name: docs
        invoke: !ref parseYaml
        inputs:
          text: !cel "steps.payload.result.docs[0].manifest"
outputs:
  ok: !cel "steps.run.result.exitCode == 0"
  error: !cel "steps.run.result.exitCode == 0 ? '' : steps.run.result.stderr"
  payload: !cel "'payload' in steps ? steps.payload.result.docs[0] : {}"
  docs: !cel "'docs' in steps ? steps.docs.result.docs : []"
---
# The third-party components one version ships, from the bill of materials its
# artifact carries (`telo module sbom`). Components are reported by purl WITHOUT
# the version, which is what an advisory database is asked by, and the version
# beside it.
#
# `recorded` is false for an artifact with no record (published before the
# layer, a direct file), which is an answer, not a failure; `complete` is true
# only for a record that names no layer holding code no producer reported. A
# local module is never read: its record is derived by running the module's own
# builders, which a seed directory on the hub's disk need not have installed, so
# its closure is simply not covered. Any other non-zero exit is a failure the
# caller records, never read as "no components".
#
# `layers` is the `layers:` index of the manifest the caller already read: the
# record is a layer of the artifact, so an index listing no `sbom` layer is that
# same "no record" answer, given without starting a CLI process.
kind: Telo.Sequence
metadata: { name: moduleSbom }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      ref: { type: string }
      version: { type: string }
      # The `layers:` index of the manifest read at this address, [] when it has none.
      layers: { type: array }
      # A module nested in the artifact: its path, and the OCI digest of the
      # artifact as resolved, which is what names it.
      path: { type: string }
      digest: { type: string }
    required: [ref, version, layers]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      ok: { type: boolean }
      error: { type: string }
      recorded: { type: boolean }
      complete: { type: boolean }
      components:
        type: array
        items:
          type: object
          additionalProperties: false
          # `vcsUrl` / `vcsRevision`: the record's `vcs_url` qualifier split at its
          # `@`, both '' unless it splits into a vcs-url and a vcs-revision, as the
          # analyzer's splitVcsQualifier reads it.
          properties:
            purl: { type: string }
            version: { type: string }
            cpe: { type: string }
            vcsUrl: { type: string }
            vcsRevision: { type: string }
          required: [purl, version, cpe, vcsUrl, vcsRevision]
    required: [ok, error, recorded, complete, components]
steps:
  - name: local
    value: !cel "inputs.ref.startsWith('./')"
  - name: layered
    value: !cel "inputs.layers.exists(l, l.?role.orValue('') == 'sbom')"
  - name: pinned
    invoke: !ref pinnedRef
    inputs:
      ref: !cel "inputs.ref"
      version: !cel "inputs.version"
  # The module nested in the artifact is named by its parent's digest, never by
  # the tag it was reached through.
  - name: address
    value: !cel >-
      inputs.?path.orValue('') == ''
        ? steps.pinned.result
        : inputs.ref + '@' + inputs.digest + '/' + inputs.path
  - name: read
    if: !cel "!steps.local.result && steps.layered.result"
    then:
      - name: run
        invoke: !ref teloCli
        inputs:
          args: !cel "variables.teloCommand + ['module', 'sbom', steps.address.result]"
          timeoutMs: 120000
      - name: parsed
        if: !cel "steps.run.result.exitCode == 0"
        then:
          - name: record
            invoke: !ref parseYaml
            inputs:
              text: !cel "steps.run.result.stdout"
outputs:
  ok: !cel >-
    steps.local.result || !steps.layered.result || steps.run.result.exitCode == 0
      || steps.run.result.stderr.contains('SBOM_INCOMPLETE')
  error: !cel >-
    steps.local.result || !steps.layered.result || steps.run.result.exitCode == 0
      || steps.run.result.stderr.contains('SBOM_INCOMPLETE')
      ? '' : steps.run.result.stderr
  recorded: !cel "'record' in steps"
  complete: !cel >-
    'record' in steps
      && !steps.record.result.docs[0].?metadata.?component.?properties.orValue([]).exists(p, p.name == 'telo:incomplete')
  components: !cel >-
    'record' in steps
      ? steps.record.result.docs[0].?components.orValue([])
          .filter(c, c.?purl.orValue('') != '')
          .map(c, cel.bind(query, string(c.purl).split('#')[0].contains('?')
                ? '&' + string(c.purl).split('#')[0].split('?')[1] : '',
              cel.bind(encoded, query.contains('&vcs_url=') ? query.split('&vcs_url=')[1].split('&')[0] : '',
                cel.bind(parts,
                  encoded.matches(r'(?i)^([^%]|%[0-7][0-9a-f]|%(c[2-9a-f]|d[0-9a-f])%[89ab][0-9a-f]|%e0%[ab][0-9a-f]%[89ab][0-9a-f]|%(e[1-9a-c]|e[ef])(%[89ab][0-9a-f]){2}|%ed%[89][0-9a-f]%[89ab][0-9a-f]|%f0%(9[0-9a-f]|[ab][0-9a-f])(%[89ab][0-9a-f]){2}|%f[1-3](%[89ab][0-9a-f]){3}|%f4%8[0-9a-f](%[89ab][0-9a-f]){2})*$')
                    ? urlDecode(encoded).split('@') : [],
                  cel.bind(vcs,
                    size(parts) == 2
                      && parts[0].matches(r'^git\+https://[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*(:[0-9]{1,5})?(/([^/%@?#\s\x00-\x1f\x7f]|%[0-9A-Fa-f]{2})+)+$')
                      && !parts[0].matches(r'/\.\.?(/|$)')
                      && parts[1].matches(r'^([0-9a-f]{40}|[0-9a-f]{64})$')
                      ? parts : ['', ''],
                    {'purl': string(c.purl).split('@')[0], 'version': string(c.?version.orValue('')),
                     'cpe': string(c.?cpe.orValue('')), 'vcsUrl': vcs[0], 'vcsRevision': vcs[1]})))))
      : []
---
# The manifest documents of a module nested in an artifact, named by the
# artifact's OCI digest and the module's path (`telo module manifest`'s text
# form), so its own imports can be followed.
kind: Telo.Sequence
metadata: { name: nestedManifest }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties: { ref: { type: string }, digest: { type: string }, path: { type: string } }
    required: [ref, digest, path]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties: { ok: { type: boolean }, error: { type: string }, docs: { type: array } }
    required: [ok, error, docs]
steps:
  - name: run
    invoke: !ref teloCli
    inputs:
      args: !cel >-
        variables.teloCommand + ['module', 'manifest', inputs.ref + '@' + inputs.digest + '/' + inputs.path]
      timeoutMs: 120000
  - name: parsed
    if: !cel "steps.run.result.exitCode == 0"
    then:
      - name: docs
        invoke: !ref parseYaml
        inputs:
          text: !cel "steps.run.result.stdout"
outputs:
  ok: !cel "steps.run.result.exitCode == 0"
  error: !cel "steps.run.result.exitCode == 0 ? '' : steps.run.result.stderr"
  docs: !cel "'docs' in steps ? steps.docs.result.docs : []"
