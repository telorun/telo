kind: Telo.Application
metadata:
  name: CrudModelRefusalsTest
  version: 1.0.0
  description: |
    What a data model refuses about its own four shapes: a read or list shape
    without the key, a write shape with it or left open, a property a read does
    not return or types differently, and an update requiring what a read may
    leave out. And about its declared query: a filter or a sort by a property a
    read does not return, an operator the property's type cannot carry, a sort
    by a list, a filter by a property named as a parameter the list route owns.
    The operator is judged by the property's plain types — `null` aside, and
    those of its listed values where it declares only `enum`. Each is reported
    by `telo check` where the model is declared, and refused by the model
    itself when a manifest reaches it without that check. A model leaving
    `query`, or its `sort`, out is a schema violation naming it, and is refused
    when it is created.
imports:
  Assert: ../../assert
targets:
  - !ref keyUndeclared
  - !ref keyUndeclaredAtRuntime
  - !ref keyWritable
  - !ref keyWritableAtRuntime
  - !ref writeShapeOpen
  - !ref writeShapeOpenAtRuntime
  - !ref propertyNotReadable
  - !ref propertyNotReadableAtRuntime
  - !ref propertyTypeDiffers
  - !ref propertyTypeDiffersAtRuntime
  - !ref updateRequiresOptional
  - !ref updateRequiresOptionalAtRuntime
  - !ref filterUnknownProperty
  - !ref filterUnknownPropertyAtRuntime
  - !ref filterOperatorUnsupported
  - !ref filterOperatorUnsupportedAtRuntime
  - !ref sortUnknownProperty
  - !ref sortUnknownPropertyAtRuntime
  - !ref sortUnsupported
  - !ref sortUnsupportedAtRuntime
  - !ref filterOperatorNullableType
  - !ref filterOperatorNullableTypeAtRuntime
  - !ref filterOperatorListedValues
  - !ref filterOperatorListedValuesAtRuntime
  - !ref filterOperatorNullableList
  - !ref filterOperatorNullableListAtRuntime
  - !ref filterReservedName
  - !ref filterReservedNameAtRuntime
  - !ref queryMissing
  - !ref queryMissingAtRuntime
  - !ref sortMissing
  - !ref sortMissingAtRuntime
---
kind: Assert.Manifest
metadata:
  name: keyUndeclared
source: ./__fixtures__/model-refusals/key-undeclared/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "Crud.Model/model at 'schemas.list': does not declare a required `id`"
---
kind: Assert.Manifest
metadata:
  name: keyUndeclaredAtRuntime
source: ./__fixtures__/model-refusals/key-undeclared/telo.yaml
expect:
  errors: []
  runFails: "Crud.Model 'model': 'schemas.list' does not declare a required 'id'"
---
kind: Assert.Manifest
