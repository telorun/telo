  # Actions.
  - { text: A bare button, translation: "单独的按钮" }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "没有属性的输入模型只绘制按钮本身。这个按钮会解除 TEL-42 所有受阻任务的阻塞，随后任务计数和下方的 TEL-42 表格会重新读取。" }
  - { text: Unblock TEL-42, translation: "解除 TEL-42 的阻塞" }
  - { text: An answer drawn from the result, translation: "根据结果绘制的响应" }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "该路由汇总一个项目所有未完成任务的估时。字段来自输入模型，分为两节：项目从项目集合中选择，进度用滑块设置；输入的内容保存在地址中。响应绘制在按钮下方：基于结果和所发送记录的语句、预计完成日期，以及按类别列出的小时数。" }
  - { text: What to count, translation: "统计什么" }
  - { text: How fast, translation: "进度" }
  - { text: Estimate, context: verb, translation: "估算" }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} 没有未完成的工作。"
        other: "{$project} 的 {$tasks} 个未完成任务共 {$hours} 小时"
  - { text: "About {$weeks} weeks at {$pace} hours a week, done by", translation: "按每周 {$pace} 小时计约需 {$weeks} 周，完成日期为" }
  - { text: By label, translation: "按类别" }
  - { text: When it fails, translation: "失败时" }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "操作自己的失败树，根据错误和所发送的记录绘制。将任务 4 分配给 james@northwind.example 即可成功。不填电子邮箱或填写非团队成员，拒绝信息会显示在该字段上；任务 999 返回 404，已离职的 tomas@northwind.example 返回 409。" }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "这个操作把估时路由的响应当作天数读取，而该路由并不返回天数：响应被操作的输出模型拒绝，其失败树会说明这一点。" }
  - { text: Estimate in days, translation: "按天估算" }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}：该响应不是此按钮所读取的响应。" }
  - { text: Where a success goes, translation: "成功后去往何处" }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "第一个按钮返回列出项目任务的页面，应用随即跳转过去。第二个按钮返回团队主页，这是一个 https 地址，会替换当前页面。" }
  - { text: Open its tasks, translation: "打开其任务" }
  - { text: Visit the homepage, translation: "访问主页" }
  - { text: Reading again after a success, translation: "成功后重新读取" }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "移动任务后，下方的计数（一个读取器）和更下方的 TEL-42 表格都会重新读取。响应会给出该任务及其新状态。" }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}：待办 {$todo}，进行中 {$doing}，审核中 {$review}，已完成 {$done}，受阻 {$blocked}。" }
  - { text: Move, translation: "移动" }
  - { text: "Task {$id}, {$title}, is now", translation: "任务 {$id}（{$title}）当前状态为" }
  - { text: One press after another, translation: "逐次提交" }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "无论按得多快，评论都会按按钮按下的顺序逐条发送。按钮要等输入至少三个字符才可用，并会说明原因；选择其他任务会清除上一次的响应。每发送一条评论，底部列出的评论都会重新读取。" }
  - { text: Add the comment, translation: "添加评论" }
  - { text: Write three characters or more., translation: "请至少输入三个字符。" }
  - { text: "Comment {$id} added to {$title}, which has {$count} comments now.", translation: "评论 {$id} 已添加到 {$title}，现在共有 {$count} 条评论。" }
  - { text: Row actions on a table, translation: "表格中的行操作" }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "TEL-42 的每个任务都提供三个按钮，按下后按钮会被其响应替换。“开始”立即执行，仅对待办任务可用。“关闭”会先询问，已完成的任务不提供此按钮。“分配”会打开对话框以输入电子邮箱（行中不包含该信息），并在该字段上显示服务器的拒绝信息。" }
  - { text: Number, translation: "编号" }
  - { text: Start, context: verb, translation: "开始" }
  - { text: Closed, translation: "已关闭" }
  - { text: Close this task?, translation: "关闭此任务？" }
  - { text: Already started., translation: "已开始。" }
  - { text: Already finished., translation: "已完成。" }
  - { text: Assign, translation: "分配" }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} 已分配给 {$assignee}。" }
  - { text: "Task {$id} is unchanged.", translation: "任务 {$id} 未发生变化。" }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: "列表中的行操作" }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "最新评论，由读取器绘制的列表，置顶的排在最前。“置顶”对尚未置顶的评论立即执行，“删除”会先询问，“编辑”会在对话框中要求输入新内容；留空会在该字段上被拒绝。每次操作后列表都会重新读取。" }
  - { text: Latest comments, translation: "最新评论" }
  - { text: Pin, translation: "置顶" }
  - { text: Already pinned., translation: "已置顶。" }
  - { text: Delete this comment?, translation: "删除此评论？" }
  - { text: Rewrite this comment?, translation: "改写此评论？" }
  - { text: More places a success goes, translation: "成功后的更多去处" }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "第一个按钮添加一个任务并跳转到表格页，该地址写在清单中。第二个按钮返回手册的地址，这是服务器在挂载点下提供的文件，按普通方式加载。第三个按钮返回团队镜像站的地址，浏览器会将其视为另一个主机：它不会跳转到任何地方，响应会说明这一点。" }
  - { text: Add it and open the tables, translation: "添加并打开表格页" }
  - { text: Open the handbook, translation: "打开手册" }
  - { text: Open the mirror, translation: "打开镜像站" }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "响应为 {$mirror}，这不是可以跳转的地址，因此页面保持不变。" }
  - { text: "Refused, and unanswered", translation: "被拒绝与无响应" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "只有经理才能暂停项目。没有会话时，守卫返回 401。在数据页以非经理身份的 james@northwind.example 登录时，路由返回不带正文的 403；以 ada@northwind.example 登录时，它会暂停项目，并以页面语言拒绝未在进行中的项目。操作的默认失败树会绘制每一种拒绝。" }
  - { text: Pause the project, translation: "暂停项目" }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "{$code} 未在进行中，因此无法暂停。" }
  - { text: "{$name} is paused.", translation: "{$name} 已暂停。" }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "该路由将每个请求都重定向回自身，因此浏览器会放弃，根本收不到任何响应。失败树会说明这一点：错误不带状态码。" }
  - { text: Call a route that never answers, translation: "调用永不响应的路由" }
  - { text: "The route answered, with the status", translation: "路由已响应，状态码为" }
  - { text: "No answer arrived, so there is no status.", translation: "未收到响应，因此没有状态码。" }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: "读取地址的行操作" }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "表格列出地址所指项目的任务，“移动”会把任务移到地址所指的状态，该状态在按下按钮时从表格的查询中读取。行和地址绑定了移动操作的所有字段，因此其对话框无需填写任何内容，只是一个简单的确认。请选择项目和状态：" }
  - { text: TEL-42 into review, translation: "TEL-42 转入审核" }
  - { text: APP-5 to finished, translation: "APP-5 转为已完成" }
  - { text: OPS-7 back to in progress, translation: "OPS-7 退回进行中" }
  - { text: Neither, translation: "都不选" }
  - { text: Moved to, translation: "已移至" }
  - { text: Move this task to the status the address names?, translation: "将此任务移到地址所指的状态？" }
  - { text: Choose a status above first., translation: "请先在上方选择状态。" }

  # Components.
  - { text: A component on the page, translation: "页面上的组件" }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "用 TSX 编写、由本示例的一个库提供的组件，以固定属性放置。它使用宿主提供的全部能力：显示页面所在位置，将展开的面板保存在地址中，通过 navigate 和基于 href 的链接跳转到其他页面，跳转到 https 地址则会被拒绝。它通过 fetch 读取 TEL-42 的状况并添加任务，通过 notifyChanged 告知任务已变更（下方表格因此重新读取），并通过 onChanged 统计它收到的每一次变更，包括表格自身的编辑和删除。它添加的任务会在页面角落、它自己的图层中提示。" }
  - { text: A component in a cell, translation: "单元格中的组件" }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "优先级列由一个组件绘制，组件接收每行的优先级以及任务是否受阻。表格列出的 TEL-42 任务来自组件写入的同一集合，因此在上方添加任务时表格会重新读取；表格的编辑和删除也会被组件收到。" }
  - { text: Its stylesheet, translation: "它的样式表" }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "组件源码导入了自己的样式表，应用将其放在 telo.component 层中：位于主题和品牌之后、应用自身样式表之前。其中每个值都读取一个设计令牌，因此工作台和仪表会呈现各个挂载点的外观。" }

  # CRUD.
  - { text: A generated admin screen, translation: "自动生成的管理界面" }
  - { text: "One declaration over the tasks collection the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the collection, so the screen offers exactly what the API accepts.", translation: "基于提供 API 的任务模型的一条声明：一个筛选栏、一个可排序的分页表格、一个添加任务的表单和一个修改任务的表单，以及每行需确认的删除。列、字段和筛选器全部由模型推导而来，因此界面提供的正是 API 所接受的内容。" }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "筛选栏位于表格旁的末尾边，只显示你选择的筛选器，每个都是一个可打开其控件的胶囊。它以键 aside 将选择保存在此浏览器中 — 这也是筛选页上表格旁筛选栏的键，因此在任一页面上选择的筛选器都会在两个页面上生效。" }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "新任务在从末尾边滑出的抽屉中打开，保存后保持打开并清空，以便添加下一个。任务在列表旁的面板中修改，该面板是地址的一部分；带着未保存的输入离开时会先询问。" }

  # Related records.
  - { text: "Related records", translation: "关联记录" }
  - { text: "Posts and their authors", translation: "文章及其作者" }
  - { text: "Each post names its author by key. The author column shows the author's name instead, read in one request for every author on the page, and the bar's author filter offers every author by name. The create and edit forms pick the author from a list of authors, searched by name.", translation: "每篇文章用键指明作者。作者列改为显示作者的姓名，页面上所有作者通过一次请求读取；筛选栏的作者筛选按姓名列出每位作者。新建和编辑表单从可按姓名搜索的作者列表中选择作者。" }
  - { text: "Only the authors with posts", translation: "只看有文章的作者" }
  - { text: "These filters offer only the authors and the statuses present among the posts the other filters leave, each with how many posts it has. The posts are drawn as cards, and as a list below the breakpoint, loading more as you reach the end.", translation: "这些筛选只列出其他筛选留下的文章中出现的作者和状态，并附上各自的文章数。文章以卡片绘制，在断点以下以列表绘制，滚动到末尾时加载更多。" }
  - { text: "On a board by status", translation: "按状态排在看板上" }
  - { text: "One column per status, each read and counted on its own. Drag a card to another column, or move it from its menu, to change its status; every list of posts on the page reads again.", translation: "每个状态一列，每列各自读取和计数。把卡片拖到另一列，或从它的菜单移动，即可更改状态；页面上的每个文章列表都会重新读取。" }
  - { text: "On a calendar", translation: "在日历上" }
  - { text: "The posts on the day each is published, a month at a time; the month shown reads every post dated in it. A post with no date is not on the calendar.", translation: "文章显示在各自的发布日期上，每次一个月；所显示的月份会读取日期在该月的每篇文章。没有日期的文章不在日历上。" }
  - { text: "The authors", translation: "作者" }
  - { text: "The authors' own screen, generated from their collection. It reads the same address the posts' author filter and picker read, so an author added here is offered there at once.", translation: "作者自己的界面，由其集合生成。它读取的地址与文章的作者筛选和选择器相同，因此在这里添加的作者会立即出现在那里。" }
  - { text: "Reporting lines as a tree", translation: "以树形展示汇报关系" }
  - { text: "Each person names who they report to, a relation of the people to themselves. The tree reads the people who report to nobody first, and a person's reports when they are opened. The form picks the manager from the same people.", translation: "每个人指明自己向谁汇报，这是人员与自身的关系。树先读取不向任何人汇报的人，展开某人时再读取其下属。表单从同一批人员中选择上级。" }
  # The labels of the related-records page's models.
  - { text: "Author", translation: "作者" }
  - { text: "Draft", translation: "草稿" }
  - { text: "Published", translation: "已发布" }
  - { text: "Published on", translation: "发布日期" }
  - { text: "Reports to", translation: "上级" }
  - { text: "Post", translation: "文章" }

  # Themes.
  - { text: Four mounts of one design, translation: "同一设计的四个挂载点" }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "同样的页面被提供四次，每个应用各自指定主题、品牌和导航。这些页面是同一组视图，四个应用都通过引用放置，因此只有外观和导航不同。" }
  - { text: At the root, translation: "根路径" }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "内置外观，其上叠加本示例自己的样式表，以及按每次请求选择的品牌：Cookie 要求时使用 Acme 令牌集，否则使用主题自身的值。" }
  - { text: Under /radix, translation: "/radix 下" }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Radix 主题：它的样式表和十三个控件 — 下拉列表、对话框、抽屉、弹出框、菜单和工具提示 — 品牌交由主题决定。" }
  - { text: Under /brand, translation: "/brand 下" }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "本示例自有的主题：Radix 的控件加上在此编写的样式表，并带有自己的令牌值。应用的品牌是一个令牌集，它附带主题所指定的 Inter 字体。" }
  - { text: Under /sidebar, translation: "/sidebar 下" }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "内置外观，导航位于页面旁的侧边栏中，侧边栏可收起为窄栏，并会记住已展开的分组。在手机上，它会变为沿底部边缘的标签栏。" }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "链接在其所绘制的挂载点下解析，因此挂载点之间的链接和品牌切换开关位于根应用的主题页上。" }
  - { text: Every design token, translation: "所有设计令牌" }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "封闭集合中的每个令牌，取值来自本页的主题和品牌，读取自渲染器将其映射到的 CSS 自定义属性，并附有用它绘制的示例。打开另一个挂载点，或在根应用中切换品牌，这些值就会改变。" }
  - { text: Typefaces, translation: "字体" }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "正文和标题字体的四种字形，以及每种字形是否由本应用提供。在 /brand 下，它们是 Inter 的常规、粗体、斜体和粗斜体字形，随示例附带并与页面一同提供；另外两个挂载点不提供任何字形，使用浏览者自己的字体绘制。" }
  - { text: Switch the mount or the brand, translation: "切换挂载点或品牌" }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "这些链接属于本应用：链接在其所绘制的挂载点下解析，因此只有根路径上的应用能访问另外两个。每个链接都是按普通方式加载另一个应用。" }
  - { text: Open the Radix mount, translation: "打开 Radix 挂载点" }
  - { text: Open the brand mount, translation: "打开品牌挂载点" }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "本应用的品牌按每次请求选择。切换开关会设置或清除一个 Cookie 并返回此处；只要该 Cookie 存在，就使用 Acme 令牌集代替主题自身的值。" }
  - { text: Use the Acme brand, translation: "使用 Acme 品牌" }
  - { text: "Use the theme's own values", translation: "使用主题自身的值" }

  # The renderer's own words, as `Ui.words` writes them.
  - { text: Loading…, translation: "加载中…" }
  - { text: No rows., translation: "暂无数据。" }
  - { text: Nothing found., translation: "未找到任何内容。" }
  - { text: Save, translation: "保存" }
  - { text: Cancel, translation: "取消" }
  - { text: Close, translation: "关闭" }
  - { text: New, translation: "新建" }
  - { text: Edit, translation: "编辑" }
  - { text: Delete, translation: "删除" }
  - { text: Delete this row?, translation: "删除此行？" }
  - { text: This cannot be undone., translation: "此操作无法撤销。" }
  - { text: Previous page, translation: "上一页" }
  - { text: "{$first}–{$last} of {$total}", translation: "第 {$first}–{$last} 条，共 {$total} 条" }
  - { text: "0 of {$total}", translation: "0 条，共 {$total} 条" }
  - { text: Next page, translation: "下一页" }
  - { text: "Yes", translation: "是" }
