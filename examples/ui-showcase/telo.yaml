# The tasks the listings and filter bars list, page, sort, filter and write.
kind: Crud.Api
metadata: { name: tasksApi }
connection: !ref db
singular: task
plural: tasks
collection: !ref tasks
---
# The team the forms' pickers and choices offer, searched by name and
# labelled by e-mail.
kind: Crud.Api
metadata: { name: peopleApi }
connection: !ref db
singular: person
plural: people
collection: !ref people
---
# The related-records page: authors, their posts — whose facet request answers
# each author's and each status's count — and the reporting lines.
kind: Crud.Api
metadata: { name: authorsApi }
connection: !ref db
singular: author
plural: authors
collection: !ref authors
---
kind: Crud.Api
metadata: { name: postsApi }
connection: !ref db
