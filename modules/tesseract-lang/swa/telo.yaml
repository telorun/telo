  tessdata:
    version: 1.0.0
    purl: pkg:npm/%40tesseract.js-data/swa
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/swa.traineddata.gz:
        { upstream: swa, member: package/4.0.0_best_int/swa.traineddata.gz, sha256: 74c7bd51f173a3f174fbc8aaf8738819aa36000566857929ba6679ad5a2cf71f, executable: false }
---
kind: TesseractModel.Language
metadata: { name: swa, description: "Swahili, Latin script" }
code: swa
data: !module-path ./tessdata/swa.traineddata.gz
