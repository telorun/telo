project: sql
kind: Added
body: 'SQL connections log each statement at debug with the statement text, row count and
  db.client.operation.duration (OpenTelemetry''s name, in OpenTelemetry''s unit: seconds),
  and transaction start, commit and rollback. Sql.Migrations now reports each applied migration
  at info — migrateToLatest already returned the per-migration results and they were being
  discarded, so a run that applied four migrations and one that found none looked identical
  afterwards; a failed migration is reported at error carrying the underlying cause. Parameters
  are never logged; the values are the data.'
