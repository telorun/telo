modules:
  modules/durable-local: Fixed
  modules/durable-journal-file: Fixed
body: "A run that is still in flight is no longer started a second time: attaching to
  one now takes its claim, and a caller that cannot take it is told the run is running
  rather than executing a duplicate copy into the same journal. A live value in a step's
  result is now refused — serializing one succeeds and yields an empty object, so the
  check that was supposed to catch it never fired. A step's recorded target carries its
  declaring module, so a replay cannot answer for a same-named resource from another
  library."
