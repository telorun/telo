kind: Telo.Application
metadata: { name: StagedApp }
assets: [./models/]
sources:
  models:
    version: 1.0.0
    purl: pkg:generic/models
    url: https://example.test/{version}/{upstream}.tar.gz
    archive: tar.gz
    notices: [./LICENSE]
    entries:
      ./models/eng.bin:
        { upstream: eng, member: eng.bin, sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, executable: false }
---
kind: Telo.Definition
metadata: { name: Model }
capability: Telo.Invocable
schema: { type: object, properties: { data: { x-telo-type: Telo.HostPath } } }
---
kind: Self.Model
metadata: { name: directory }
data: !module-path ./models
---
kind: Self.Model
metadata: { name: file }
data: !module-path ./models/eng.bin
---
kind: Telo.Definition
metadata: { name: Broken }
capability: Telo.Invokable
