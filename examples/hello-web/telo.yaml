kind: Telo.Application
metadata:
  name: HelloWeb
  version: 1.0.0
  description: |
    A two-page web app: `/` and `/settings`. It knows nothing about windows;
    `examples/hello-desktop` wraps it in a desktop shell without changing it.

    Run, then:
        curl http://localhost:8080/
imports: { Http: oci://ghcr.io/telorun/http-server@0.44.1#sha256-0eFkBJRNr4r2hyQCBHcmTKEJU24Fy76Zw5ajQMUZyEs }
ports: { http: { env: PORT, default: 8080 } }
targets:
  - !ref helloServer
---
kind: Http.Server
metadata: { name: helloServer }
listen: { port: !cel "ports.http" }
mounts:
  - { path: /, mount: !ref helloPage }
---
kind: Http.Api
metadata: { name: helloPage }
routes:
  - request: { path: /, method: GET }
    handler: { kind: Telo.Value, value: {} }
    returns:
      - { status: 200, content: { text/html: { body: "<h1>Hello, world!</h1>" } } }
  - request: { path: /settings, method: GET }
    handler: { kind: Telo.Value, value: {} }
    returns:
      - { status: 200, content: { text/html: { body: "<h1>Settings</h1>" } } }
