modules:
  apps/authoring-agent: Added
body: "The agent is safe to expose. A mount guard on every API route refuses an Origin
  outside ALLOWED_ORIGINS (403 ERR_ORIGIN_NOT_ALLOWED) and, when AGENT_TOKEN is set, a
  request without its bearer token (401 ERR_UNAUTHENTICATED, WWW-Authenticate: Bearer,
  compared in constant time); with no token one warn record at boot names what is
  exposed. New unguarded GET /health and GET /ready (503 with SCHEMA_UNAVAILABLE,
  MODEL_CREDENTIAL_MISSING or WORKSPACE_NOT_WRITABLE), and guarded GET /capabilities
  reporting the agent's name, version, auth mode and prompt id (the SHA-256 of
  chat/primer.md, where the system prompt now lives). Every file tool, every path
  argument of the telo tool, GET /workspace/file and POST /workspace refuse absolute,
  backslash, drive-letter and .. paths with ERR_PATH_OUTSIDE_WORKSPACE (routes: 400,
  nothing applied). A write or edit whose result holds a credential is refused with
  ERR_SECRET_IN_MANIFEST before anything is written. Tool results are text the model
  reads (file contents verbatim, wrote <path> plus one file:line:col CODE message line
  per diagnostic), the structured result riding the record's output. With OTLP_ENDPOINT
  set spans and logs are exported over OTLP, one trace per turn carrying
  gen_ai.conversation.id, telo.agent.turn.id, token usage and telo.check.exit_code;
  otherwise spans are written as log records. TELO_PROGRAM names the telo command the
  tools run. Requires telo >=0.104.0. Breaking: the chat library's readFile and treeSync
  exports are replaced by readWorkspaceFile and syncWorkspace, and tool results are no
  longer JSON."
