# A navigation naming a page whose path has a variable.
kind: Telo.Library
metadata:
  name: UiReactNavigationPageVariable
  version: 1.0.0
  description: >-
    Test fixture exporting an application whose navigation names a page with a
    variable in its path.
imports: { UiReact: ../../../../../, Ui: ../../../../../../ui }
exports: { resources: [linked] }
---
kind: Ui.Page
metadata: { name: inbox }
path: /
title: Inbox
children: []
---
kind: Ui.Page
metadata: { name: plan }
path: /plans/{id}
title: Plan
children: []
---
kind: UiReact.App
metadata: { name: linked }
title: Linked
theme: !ref UiReact.defaultTheme
pages: [!ref inbox, !ref plan]
navigation:
  items:
    - { type: page, page: !ref inbox }
    - { type: page, page: !ref plan }
