modules:
  modules/sql: Fixed
  modules/postgres: Fixed
  modules/sqlite: Fixed
body: A foreign key's 'references.table' was read while the table resource was still
  being created, and the kernel replaces a reference with the instance it names only
  when that instance already exists — so on the pass where it did not, every cross-table
  foreign key failed with "'references.table' does not name a table". The target is now
  resolved to its DECLARATION, which carries the physical name whether or not the table
  has been constructed, so the slot needs no ordering edge.
