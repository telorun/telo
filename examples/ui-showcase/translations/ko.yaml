  # Forms.
  - { text: Every control from the model, translation: "모델에서 가져온 모든 컨트롤" }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "필드를 작성하지 않으면 폼은 속성마다 스키마에 따라 고른 컨트롤을 하나씩 그립니다. 텍스트 상자, 열거형에는 목록, 숫자 상자, 날짜, 날짜와 시간, 시간, 문서에는 여러 줄 상자, 체크박스, 열거형 목록에는 나란히 놓인 옵션, 단어 목록에는 입력하는 태그를 그립니다. 설명은 필드 아래의 힌트가 되고, 기본값은 시작 값이 됩니다." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "각 필드는 한 번 건드리면 모델에 따라 검사됩니다. 제목 길이, 인원 수, 50 단위의 예산, 키워드 철자를 검사합니다. 서버는 다른 요청에 이미 있는 제목을 거부하며, 그 응답은 제목 필드에 표시됩니다. 입력한 내용은 주소와 이 브라우저에 유지되지만, 모델이 쓰기 전용으로 표시한 출입 코드는 예외입니다." }
  - { text: Each control chosen by hand, translation: "직접 고른 각 컨트롤" }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "같은 요청을 필드마다 컨트롤을 작성해 만든 폼입니다. 제목은 파생된 컨트롤 그대로, 종류는 나란히 놓인 옵션, 채널은 여러 개를 고르는 목록, 인원 수는 슬라이더, 긴급은 스위치, 키워드는 태그입니다. 입력한 내용은 이 탭에서만 유지됩니다." }
  - { text: Requests received, translation: "접수된 요청" }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "두 폼이 보낸 최근 요청으로, 저장할 때마다 다시 읽습니다." }
  - { text: "Choices, pickers and dates", translation: "선택, 선택기, 날짜" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "프로젝트에 사람을 배정합니다. 프로젝트는 프로젝트 컬렉션에서 읽은 목록에서 고르며, 각 옵션에는 코드가 힌트로 붙습니다. 책임자는 대화 상자에서 이름으로 검색해, 위에서 고른 역할의 활성 구성원 중에서 고릅니다. 다른 역할을 고르면 옵션을 다시 읽고, 책임자가 여전히 맞을 때만 유지합니다. 검토자는 드로어에서 여러 명을 한꺼번에, 스폰서는 팝오버에서 고릅니다. 스폰서는 기본 이메일로 시작하며, 한 번의 조회로 그 사람의 이름이 표시됩니다. 도우미는 한 번에 세 명씩 나란히 제시되고, 나머지는 더 보기로 볼 수 있습니다. 선택한 사람은 그 사람의 이메일로 연결됩니다." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "기간은 프리셋이 있는 두 날짜로, 주는 일요일에 시작하고, 처음에는 다음 달로 설정되며, 3개월을 넘으면 경고합니다. 서버는 시작 전에 끝나거나 1년을 넘는 기간을 거부하며, 그 응답은 기간 필드에 표시됩니다. 책임자 주변 사람들은 책임자를 고른 뒤에 표시되고, 현장 주소는 현장 근무일 때만 표시됩니다." }
  - { text: The project, translation: "프로젝트" }
  - { text: "Which project, and who leads the work.", translation: "어떤 프로젝트이며 누가 작업을 이끄는지." }
  - { text: Around the lead, translation: "책임자 주변" }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "누가 작업을 검토하고, 후원하고, 돕는지." }
  - { text: When and where, translation: "언제, 어디서" }
  - { text: Tomorrow, translation: "내일" }
  - { text: Next week, translation: "다음 주" }
  - { text: This month, translation: "이번 달" }
  - { text: Next month, translation: "다음 달" }
  - { text: Next quarter, translation: "다음 분기" }
  - { text: Next year, translation: "내년" }
  - { text: Bookings, translation: "예약" }
  - { text: "The latest bookings, read again after every save.", translation: "최근 예약으로, 저장할 때마다 다시 읽습니다." }

