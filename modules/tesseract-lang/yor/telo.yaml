    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/yor.traineddata.gz:
        { upstream: yor, member: package/4.0.0_best_int/yor.traineddata.gz, sha256: fde674f3f9592f192eae548cbef0958059780da82658524bbdc62c1ed892af58, executable: false }
