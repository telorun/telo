# The failing step runs in the one instance an inherited kind is, created from
# the declaration written here.
kind: Telo.Application
metadata: { name: FailureInherited }
imports:
  Assert: ../../../../../modules/assert
targets: [!ref compare]
---
kind: Telo.Definition
metadata: { name: Checks }
extends: Telo.Sequence
schema: { type: object }
---
kind: Self.Checks
metadata: { name: compare }
steps:
  - name: matches
    invoke: !ref Assert.equals
    inputs: { actual: 2, expected: 3 }
