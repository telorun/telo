name: Release VS Code Extension

# Packages the Telo VS Code extension and publishes it from the branch's Publish
# run, on every release that moved `ide/vscode` — a telo line release, or a
# packages release when only the extension moved:
#   candidate   the extension's version is a prerelease (`<final>-rc.<k>`): the
#               `.vsix` is an asset of the release's GitHub pre-release; the
#               Marketplace accepts only `major.minor.patch`, so it gets none.
#               The `.vsix` bundles its own engine, and the editor's version
#               catalog never selects a candidate engine.
#   final       the same asset, and the VS Code Marketplace — moved only forward,
#               against the extension versions earlier release tags hold.
#
# `ide/vscode` is a release unit of its own (a declared payload: the files `vsce`
# packs), versioned by `telo release apply` when what it ships moves — a bundled
# engine included. The release signal is the unit appearing among the units the
# release commit moved (`units`, from Publish).
# Recovery is a re-run of the Publish run.
#
# The links in the packed README resolve to the unit's own tag,
# `ide/vscode@<version>`, which the release placed on its release commit.

on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag (v<version> or packages-<x.y>-[rc.]<n>), checked out, whose release the .vsix is attached to.'
        type: string
        required: true
      units:
        description: 'JSON array of {key, name, version, ecosystem}: the units the release commit moved (release-units.mjs).'
        type: string
        default: '[]'
    secrets:
      VSCE_PAT:
        description: 'Visual Studio Marketplace token; without it the .vsix is only attached to the release.'
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # zizmor: ignore[excessive-permissions] attaches the .vsix to the release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Did the release move the extension
        id: check
        env:
          UNITS: ${{ inputs.units }}
        run: |
          set -euo pipefail
          VERSION=$(echo "${UNITS:-[]}" | jq -r '[.[] | select(.key=="ide/vscode")][0].version // ""')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo "The extension released $VERSION."
            echo "release=true" >> "$GITHUB_OUTPUT"
            case "$VERSION" in
              *-*) echo "candidate=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "candidate=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "The release did not move ide/vscode; nothing to package."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the release scripts' dependencies
        if: steps.check.outputs.release == 'true' && steps.check.outputs.candidate == 'false'
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      - name: Does the Marketplace move forward
        id: pointers
        if: steps.check.outputs.release == 'true' && steps.check.outputs.candidate == 'false'
        run: node scripts/release-pointers.mjs image --file ide/vscode/package.json

      - name: Setup pnpm
        if: steps.check.outputs.release == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        if: steps.check.outputs.release == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.check.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      # The `vsix` script builds its own workspace dependencies (analyzer,
      # ide-support, kernel) before esbuild, so no separate workspace build is
      # needed. It writes a fixed-name file that the CI packaging smoke check in
      # test.yml also relies on; the release asset is renamed rather than the
      # script changed, so both callers keep one code path.
      - name: Package the extension
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          pnpm --filter "./ide/vscode" vsix
          mv ide/vscode/telo-vscode.vsix \
             "ide/vscode/telo-vscode-$VERSION.vsix"

      - name: Attach the .vsix to the release
        if: steps.check.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
        run: node scripts/release-assets.mjs "$TAG" "ide/vscode/telo-vscode-$VERSION.vsix"

      # `--skip-duplicate` so a re-run of the Publish run finds the version
      # already there and succeeds.
      - name: Publish to the VS Code Marketplace
        if: steps.check.outputs.release == 'true' && steps.pointers.outputs.latest == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          # Optional: without it the .vsix is only attached to the release, for a manual Marketplace upload.
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set, so the Marketplace is not published to; upload telo-vscode-$VERSION.vsix from the release by hand."
            exit 0
          fi
          pnpm --filter "./ide/vscode" exec vsce publish --skip-duplicate \
            --packagePath "telo-vscode-$VERSION.vsix"
