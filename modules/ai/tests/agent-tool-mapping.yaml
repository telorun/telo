kind: Telo.Application
metadata:
  name: AgentToolMappingTest
  version: 1.0.0
imports:
  Ai: ../
  AiEcho: ./__fixtures__/ai-echo.yaml
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testMapping
---
kind: AiEcho.EchoModel
metadata:
  name: echo
emitToolCall:
  name: greet
  arguments: { who: "world" }
---
# Greeter's input shape ({ target }) diverges from the model-facing parameters
# ({ who }); the tool entry's `inputs:`/`result:` mappings bridge the gap.
kind: Run.Value
metadata:
  name: greeter
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      target: { type: string }
value:
  greeting: "${{ 'Hello, ' + inputs.target + '!' }}"
---
kind: Ai.Tools
metadata:
  name: greetTools
tools:
  - tool: !ref greeter
    name: greet
    description: Greet someone by name.
    parameters:
      type: object
      additionalProperties: false
      required: [ who ]
      properties:
        who: { type: string }
    inputs:
      target: "${{ arguments.who }}"
    result: "${{ result.greeting }}"
---
kind: Ai.Agent
metadata:
  name: greetAgent
model: !ref echo
toolProviders:
  - provider: !ref greetTools
---
kind: Run.Sequence
metadata:
  name: testMapping
steps:
  - name: invoke
    inputs:
      prompt: "greet the world"
    invoke: !ref greetAgent
  # arguments.who="world" → inputs maps to {target:"world"} → Greeter →
  # {greeting:"Hello, world!"} → result maps to the bare string → fed back → echoed.
  - name: assertText
    inputs:
      text: "${{ steps.invoke.result.text }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          text:
            type: string
            const: "Hello, world!"
        required: [ text ]
