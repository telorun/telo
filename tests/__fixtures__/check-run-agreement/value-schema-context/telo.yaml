# Runs the library's call that omits the caller data its reader requires. This
# consumer's entry-scoped check is silent about the library's call site, so the
# kernel's bound contract is what refuses it.
kind: Telo.Application
metadata:
  name: ValueSchemaContextApp
  version: 1.0.0
imports:
  Lib: ./lib
targets:
  - !ref Lib.callWithoutTurn
