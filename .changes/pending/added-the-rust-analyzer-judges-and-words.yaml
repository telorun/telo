units:
  analyzer: Added
body: "The Rust analyzer judges and words a schema finding as the Node analyzer does —
  the union judge deciding what a failed anyOf / oneOf reports and what a stand-in
  excuses, and the one phraser of a finding, which explains a refused format: regex
  value or patternProperties key as 'invalid RE2 pattern \"<pattern>\": <kind>' — and
  reports an Application or Library input's default: that its own declaration refuses as
  DEFAULT_INVALID, or under the value type's own code (URL_INVALID), and a port's
  default: null, word for word, so the Rust kernel refuses such a load as the Node
  kernel does."
