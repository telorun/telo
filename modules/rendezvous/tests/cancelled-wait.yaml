kind: Telo.Application
metadata:
  name: RendezvousCancelledWait
  version: 1.0.0
  description: |
    Cancelling a call that is waiting releases its waiter at once and consumes
    nothing: a delivery made afterwards is held (no waiter took it) and the next
    wait receives it.
imports:
  Rendezvous: ../
  Lease: ../../lease
  KvStoreMemory: ../../kv-store-memory
  Timer: ../../timer
  Assert: ../../assert
targets:
  - !ref test
---
kind: KvStoreMemory.Store
metadata: { name: mem }
---
kind: Rendezvous.MemoryPoint
metadata: { name: decisions }
payloadType:
  kind: Telo.JsonSchema
  schema: { type: object, required: [approved], properties: { approved: { type: boolean } } }
---
kind: Rendezvous.Await
metadata: { name: awaitLong }
point: !ref decisions
timeout: 30s
---
kind: Rendezvous.Await
metadata: { name: awaitShort }
point: !ref decisions
timeout: 2s
---
kind: Rendezvous.Deliver
metadata: { name: deliver }
point: !ref decisions
---
kind: Telo.Sequence
metadata: { name: waiting }
steps:
  - name: wait
    inputs: { key: c-1 }
    invoke: !ref awaitLong
---
kind: Lease.Critical
metadata: { name: waiter }
store: !ref mem
ttl: 60s
detach: true
invoke: !ref waiting
---
kind: Timer.Delay
metadata: { name: pause }
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: startWaiter
    invoke: !ref waiter
    inputs: { key: w1, holder: T1, inputs: {} }
  - { name: waiterOpens, invoke: !ref pause, inputs: { duration: 200ms } }
  - name: deliverWhileWaiting
    inputs: { key: c-1, payload: { approved: true } }
    invoke: !ref deliver
  - name: startWaiterAgain
    invoke: !ref waiter
    inputs: { key: w2, holder: T2, inputs: {} }
  - { name: secondWaiterOpens, invoke: !ref pause, inputs: { duration: 200ms } }
  - name: cancelWaiter
    invoke: !ref waiter
    inputs: { op: cancel, key: w2, holder: T2 }
  - { name: released, invoke: !ref pause, inputs: { duration: 200ms } }
  - name: deliverAfterCancel
    inputs: { key: c-1, payload: { approved: false } }
    invoke: !ref deliver
  - name: nextWait
    inputs: { key: c-1 }
    invoke: !ref awaitShort
  - name: assertCancelled
    inputs:
      actual:
        deliverWhileWaiting: !cel "steps.deliverWhileWaiting.result"
        cancelled: !cel "steps.cancelWaiter.result.cancelled"
        deliverAfterCancel: !cel "steps.deliverAfterCancel.result"
        nextWait: !cel "steps.nextWait.result"
      expected:
        deliverWhileWaiting: { delivered: true }
        cancelled: true
        deliverAfterCancel: { delivered: false }
        nextWait: { approved: false }
    invoke: { kind: Assert.Equals }
