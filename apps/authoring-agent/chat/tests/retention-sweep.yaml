kind: Telo.Application
metadata:
  name: ChatRetentionSweep
  version: 1.0.0
  description: |
    Retention deletes whole conversations. Conversation A has not changed since
    long ago; conversation B changed just now. The sweep tombstones A and
    removes every journal key of it — its turns then read as removed, which the
    event route answers with 410 — and deletes A's `turns`, `messages` and
    `turn_projections` rows, while B keeps every turn, row and record. A's key
    was already removed before the sweep, as a sweep a crash cut short leaves
    it, and the sweep still finishes. Conversation D was tombstoned with its
    turns marked removed and nothing else done, as a deletion a crash cut
    short leaves it: the sweep removes its keys and rows too. A second sweep
    finds nothing to do. A
    reads 410 until its tombstone is older than the window, then 404. Offline,
    against the stub.
imports:
  Chat:
    source: ../
    secrets:
      openaiApiKey: stub-key
    variables:
      workspaceDir: !cel "variables.scratch.joinPath('workspace')"
      stateDir: !cel "variables.scratch.joinPath('state')"
      modelEndpoint: http://127.0.0.1:18485/v1
  App: oci://ghcr.io/telorun/app@0.3.0#sha256-LuwPnxFKjpaQ4Y11mIEDbTzMz41dg-degJPFhl6kdmc
  Sql: oci://ghcr.io/telorun/sql@0.28.0#sha256-JC2SN6Ha8hlq9gnRGahvVNVwe-cUXHXtS8rdeo1BC24
  SQLite: oci://ghcr.io/telorun/sqlite@0.10.0#sha256-qTwG1VYpO8_AGN2UaJPWEIHyt1rt8OUlxLKtLcJkf4Q
  Stream: oci://ghcr.io/telorun/stream@0.14.0#sha256-4lK-_jEZ4H1CCdxyLGrsfmkWj5PTXsf2b8NYk0RTxGk
  RecordStream: oci://ghcr.io/telorun/record-stream@0.20.0#sha256-hRwLGfhayzKJ27aKx8vp_hZoX3LTYNMsMNoMlAbWnBs
  RecordStreamSql: oci://ghcr.io/telorun/record-stream-sql@0.8.0#sha256-hUM8JPvjMJkMUEmXOXNkhvC5QxFe9VIQw_7rAXCuv9Y
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  Assert: oci://ghcr.io/telorun/assert@0.21.0#sha256-IVtedFwGjLneOTOtKmhG90rs3qMkfSg41BfAMVKY5ts
variables:
  # The agent's state is a file that outlives the run; each run starts its two
  # conversations empty.
  scratch:
    env: CHAT_TEST_RETENTION_SCRATCH
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/retention-sweep
targets:
  - !ref Chat.ensureWorkspace
  - !ref Chat.initSchema
  - !ref test
---
kind: SQLite.Connection
metadata: { name: stateDb }
file: !cel "variables.scratch.joinPath('state').joinPath('agent.sqlite')"
---
kind: Sql.Command
metadata: { name: stateCommand }
connection: !ref stateDb
---
kind: Sql.Query
metadata: { name: stateQuery }
connection: !ref stateDb
---
# The agent's journal, read and written from outside the agent.
kind: RecordStream.Journal
metadata: { name: journal }
store:
  kind: RecordStreamSql.JournalStore
  connection: !ref stateDb
  table: turn_journal
markerRetention: 1h
---
kind: RecordStream.JournalRead
metadata: { name: journalRead }
journal: !ref journal
---
# One turn to its end: started, then its journal drained.
kind: Run.Sequence
metadata: { name: turn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [conversationId]
    properties:
      conversationId: { type: string }
steps:
  - name: start
    invoke: !ref Chat.chatStart
    inputs:
      conversationId: !cel "inputs.conversationId"
      idempotencyKey: ""
      clientIp: test-runner
      message: hello
  - name: read
    invoke: !ref Chat.journalSource
    inputs:
      key: !cel "steps.start.result.turnId"
      fromId: 0
  - name: drain
    timeout: 30000
    invoke: { kind: Stream.Collect }
    inputs:
      input: !cel "steps.read.result.output"
outputs:
  turnId: !cel "steps.start.result.turnId"
---
# How many rows each conversation keeps, per table.
kind: Run.Sequence
metadata: { name: rowCounts }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [ids]
    properties:
      ids:
        type: array
        items: { type: string }
steps:
  - name: counts
    invoke:
      kind: Run.Projection
      collection: !cel "inputs.ids"
      steps:
        - name: count
          invoke: !ref stateQuery
          inputs:
            sql: |
              SELECT (SELECT COUNT(*) FROM turns WHERE conversation_id = ?) AS turns,
                     (SELECT COUNT(*) FROM messages WHERE conversation_id = ?) AS messages,
                     (SELECT COUNT(*) FROM turn_projections WHERE conversation_id = ?) AS projections
            bindings: [ !cel "item", !cel "item", !cel "item" ]
      outputs:
        turns: !cel "int(steps.count.result.rows[0].turns)"
        messages: !cel "int(steps.count.result.rows[0].messages)"
        projections: !cel "int(steps.count.result.rows[0].projections)"
    inputs:
      ids: !cel "inputs.ids"
outputs:
  rows: !cel "steps.counts.result"
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: stub }
    source: ./__fixtures__/provider-stub/telo.yaml
    ports: { http: 18485 }
targets: [ !ref stub ]
steps:
  - name: a
    invoke: !ref Chat.createConversation
  - name: b
    invoke: !ref Chat.createConversation
  - name: idleTurn
    invoke: !ref turn
    inputs: { conversationId: !cel "steps.a.result.conversation.id" }
  - name: oldTurn
    invoke: !ref turn
    inputs: { conversationId: !cel "steps.b.result.conversation.id" }
  - name: recentTurn
    invoke: !ref turn
    inputs: { conversationId: !cel "steps.b.result.conversation.id" }
  - name: d
    invoke: !ref Chat.createConversation
  - name: halfRemovedTurn
    invoke: !ref turn
    inputs: { conversationId: !cel "steps.d.result.conversation.id" }
  - name: tombstoneD
    invoke: !ref stateCommand
    inputs:
      sql: "UPDATE conversations SET removed_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), revision = revision + 1 WHERE id = ?"
      bindings: [ !cel "steps.d.result.conversation.id" ]
  - name: markD
    invoke: !ref stateCommand
    inputs:
      sql: "UPDATE turns SET removed_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now') WHERE conversation_id = ?"
      bindings: [ !cel "steps.d.result.conversation.id" ]
  # Idleness is the conversation's last change, whenever its turns ran.
  - name: age
    invoke: !ref stateCommand
    inputs:
      sql: "UPDATE conversations SET updated_at = '2000-01-01T00:00:00.000Z' WHERE id = ?"
      bindings: [ !cel "steps.a.result.conversation.id" ]
  # Where a sweep a crash cut short leaves a conversation: its key removed, its
  # rows still there.
  - name: crashedSweep
    invoke:
      kind: RecordStream.JournalRemoval
      journal: !ref journal
    inputs:
      key: !cel "steps.idleTurn.result.turnId"
  - name: sweep
    invoke: !ref Chat.retentionSweep
    inputs:
      idleBefore: "2020-01-01T00:00:00Z"
  - name: counts
    invoke: !ref rowCounts
    inputs:
      ids:
        - !cel "steps.a.result.conversation.id"
        - !cel "steps.b.result.conversation.id"
        - !cel "steps.d.result.conversation.id"
  - name: idleKey
    invoke: !ref journalRead
    inputs: { key: !cel "steps.idleTurn.result.turnId", limit: 0 }
  - name: halfRemovedKey
    invoke: !ref journalRead
    inputs: { key: !cel "steps.halfRemovedTurn.result.turnId", limit: 0 }
  - name: oldKey
    invoke: !ref journalRead
    inputs: { key: !cel "steps.oldTurn.result.turnId", limit: 0 }
  - name: removedEvents
    try:
      - name: readRemoved
        invoke: !ref Chat.turnEvents
        inputs: { turnId: !cel "steps.idleTurn.result.turnId", fromId: 0 }
    catch:
      - name: removedCode
        value: !cel "error.code"
  - name: again
    invoke: !ref Chat.retentionSweep
    inputs:
      idleBefore: "2020-01-01T00:00:00Z"
  - name: tombstoned
    try:
      - name: readTombstoned
        invoke: !ref Chat.getConversation
        inputs: { conversationId: !cel "steps.a.result.conversation.id" }
    catch:
      - name: tombstonedCode
        value: !cel "error.code"
  # A window that ends after the tombstone was written: it is forgotten.
  - name: pastWindow
    invoke: !ref Chat.retentionSweep
    inputs:
      idleBefore: !cel "now() + duration('1h')"
  - name: forgotten
    try:
      - name: readForgotten
        invoke: !ref Chat.getConversation
        inputs: { conversationId: !cel "steps.a.result.conversation.id" }
    catch:
      - name: forgottenCode
        value: !cel "error.code"
  - name: wholeConversations
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        swept: !cel "steps.sweep.result.conversations"
        counts: !cel "steps.counts.result.rows"
        idleKey: !cel "steps.idleKey.result.state"
        oldKey: !cel "steps.oldKey.result.state"
        halfRemovedKey: !cel "steps.halfRemovedKey.result.state"
        removedEvents: !cel "steps.removedCode.result"
        sweptAgain: !cel "steps.again.result.conversations"
        tombstoned: !cel "steps.tombstonedCode.result"
        forgotten: !cel "steps.forgottenCode.result"
      expected:
        swept: 1
        counts:
          - { turns: 0, messages: 0, projections: 0 }
          - { turns: 2, messages: 4, projections: 2 }
          - { turns: 0, messages: 0, projections: 0 }
        idleKey: removed
        oldKey: finished
        halfRemovedKey: removed
        removedEvents: ERR_JOURNAL_KEY_REMOVED
        sweptAgain: 0
        tombstoned: ERR_CONVERSATION_REMOVED
        forgotten: ERR_CONVERSATION_NOT_FOUND
