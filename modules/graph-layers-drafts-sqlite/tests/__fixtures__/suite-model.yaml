# The model both behaviour suites run over: people and documents, who knows whom
# and who authored what, in drafted tables on one in-memory database, with the
# seven stores the layered suite names — a chain with a side layer, and a
# diamond. A partial, so each runner that includes it has a database of its own.
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Layers.NodeTable
metadata: { name: people }
table: people
key: id
columns:
  id: { type: text, nullable: false }
  name: { type: text, nullable: false }
  age: { type: integer }
---
kind: Layers.NodeTable
metadata: { name: documents }
table: documents
key: id
columns:
  id: { type: text, nullable: false }
  title: { type: text }
  status: { type: text, nullable: false, default: draft }
  pages: { type: integer, default: 1 }
---
kind: Layers.RelationshipTable
metadata: { name: knowsTable }
table: knows
sourceColumn: source
targetColumn: target
columns:
  source: { type: text, nullable: false }
  target: { type: text, nullable: false }
  since: { type: integer }
---
kind: Layers.RelationshipTable
metadata: { name: authoredTable }
table: authored
sourceColumn: author
targetColumn: document
columns:
  author: { type: text, nullable: false }
  document: { type: text, nullable: false }
  role: { type: text }
  share: { type: integer, default: 100 }
---
kind: Layers.LayersTable
metadata: { name: graphLayers }
table: graph_layers
---
kind: Layers.DraftsTable
metadata: { name: graphDrafts }
table: graph_drafts
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables:
  - !ref people
  - !ref documents
  - !ref knowsTable
  - !ref authoredTable
  - !ref graphLayers
  - !ref graphDrafts
---
kind: Layers.Node
metadata: { name: person }
table: !ref people
key: id
---
kind: Layers.Node
metadata: { name: document }
table: !ref documents
key: id
---
kind: Layers.Relationship
metadata: { name: knows }
table: !ref knowsTable
source: !ref person
target: !ref person
sourceColumn: source
targetColumn: target
---
kind: Layers.Relationship
metadata: { name: authored }
table: !ref authoredTable
source: !ref person
target: !ref document
sourceColumn: author
targetColumn: document
---
kind: Layers.Store
metadata: { name: base }
connection: !ref db
schema: !ref appSchema
layer: base
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
layers: !ref graphLayers
drafts: !ref graphDrafts
---
kind: Layers.Store
metadata: { name: middle }
connection: !ref db
schema: !ref appSchema
layer: middle
bases: [!ref base]
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
layers: !ref graphLayers
drafts: !ref graphDrafts
---
kind: Layers.Store
metadata: { name: side }
connection: !ref db
schema: !ref appSchema
layer: side
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
layers: !ref graphLayers
drafts: !ref graphDrafts
---
kind: Layers.Store
metadata: { name: top }
connection: !ref db
schema: !ref appSchema
layer: top
bases: [!ref middle, !ref side]
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
layers: !ref graphLayers
drafts: !ref graphDrafts
---
kind: Layers.Store
metadata: { name: left }
connection: !ref db
schema: !ref appSchema
layer: left
bases: [!ref base]
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
layers: !ref graphLayers
drafts: !ref graphDrafts
---
kind: Layers.Store
metadata: { name: right }
connection: !ref db
schema: !ref appSchema
layer: right
bases: [!ref base]
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
layers: !ref graphLayers
drafts: !ref graphDrafts
---
kind: Layers.Store
metadata: { name: apex }
connection: !ref db
schema: !ref appSchema
layer: apex
bases: [!ref left, !ref right]
nodes: [!ref person, !ref document]
relationships: [!ref knows, !ref authored]
layers: !ref graphLayers
drafts: !ref graphDrafts
