n for: remove `address` from it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.SplitView/splitCompactNested at 'aside.compact': names a compact surface that declares a compact surface of its own. Only one level applies: remove `compact` from it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterValuesNotFaceted at 'fields[0]': offers only the values present for a property the collection does not facet. Add the property to the collection's `query.facets`, or offer `all` values." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterOptionValueMismatch at 'fields[0]': offers options whose value is of another type than the property holds. Make the source's `value` read a property of the property's type, or filter another property." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/searchUndeclared: holds a search with nothing to read it: the bar writes `search` over a collection declaring no `query.search`, or a preset sets a search on a bar that has none. Declare the properties a search reads under the collection's `query.search`, write `search` on the bar, or remove the `search` that has nothing to read." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/presetSearchUnset: holds a search with nothing to read it: the bar writes `search` over a collection declaring no `query.search`, or a preset sets a search on a bar that has none. Declare the properties a search reads under the collection's `query.search`, write `search` on the bar, or remove the `search` that has nothing to read." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterDuplicate at 'fields[0]': lists a property and operator another field already has. A filter is one property with one operator: remove one of the two." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterDuplicate at 'fields[1]': lists a property and operator another field already has. A filter is one property with one operator: remove one of the two." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterDefaultInvalid at 'fields[0]': declares a default its filter cannot hold: a value that is not of the property's type or not one of its `enum`, a list without the `in` operator, a single value with it, anything but `true` under `absent`, `false` for a filter entered with a `toggle`, which holds true or nothing, or a relative value on a filter that is not a `date` or `date-time` one with `eq`, `gt`, `gte`, `lt` or `lte`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filterControlUnsupported at 'fields[0]': asks for a control its filter cannot be entered with: `select` and `options` need an `enum` or a boolean, `toggle` a boolean with `eq` or any property under `absent`, `slider` a number or integer declaring `minimum` and `maximum` with `eq` or a comparison, and `tags` the `in` operator." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/presetUnknownFilter at 'presets[0]': sets a property and operator the bar does not show. Name a pair listed under `fields`, or one the collection accepts when `fields` is left out." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/presetValueInvalid at 'presets[0]': sets a value its filter cannot hold: one that is not of the property's type or not one of its `enum`, a list without the `in` operator, a single value with it, anything but `true` under `absent`, `false` for a filter entered with a `toggle`, which holds true or nothing, or a relative value on a filter that is not a `date` or `date-time` one with `eq`, `gt`, `gte`, `lt` or `lte`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/presetRelativeInvalid at 'presets[0]': sets a value its filter cannot hold: one that is not of the property's type or not one of its `enum`, a list without the `in` operator, a single value with it, anything but `true` under `absent`, `false` for a filter entered with a `toggle`, which holds true or nothing, or a relative value on a filter that is not a `date` or `date-time` one with `eq`,