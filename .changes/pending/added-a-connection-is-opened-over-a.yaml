modules:
  modules/postgres: Added
body: "A connection is opened over a typed database-access need: Postgres.DatabaseAccess
  (url, a sensitive Telo.Url restricted to the postgres and postgresql schemes; version:
  semver; features: pgvector, postgis), referenced by Postgres.Connection.access, which
  is now required. When the connection starts it reports the server's version (from
  server_version_num) and the features whose extensions are available
  (pg_available_extensions), so a need asking for a newer server or a missing extension
  is refused at start-up with ERR_NEED_UNMET. Breaking: connectionString is removed. A
  connection writing it, or omitting access, is refused with SCHEMA_VIOLATION at telo
  check and when it is created; write access: { kind: Postgres.DatabaseAccess, fields: {
  url: <the same URL> } } instead, or reference a need. Requires telo >=0.117.0."
