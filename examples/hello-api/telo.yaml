kind: Telo.Application
metadata:
  name: HelloApiExample
  version: 1.0.0
  description: |
    Simplest possible HTTP API: a single `GET /v1/hello?name=…` route backed
    by a typed `Run.Value`. Shows how `Http.Server` mounts an `Http.Api`, how
    the request schema feeds a CEL expression on `inputs`, and how the
    handler's output flows into the response body via `result.*`.

    Run, then:
        curl 'http://localhost:8845/v1/hello?name=World'
imports:
  Http: oci://ghcr.io/telorun/http-server@0.26.0#sha256-qCiZuU7_9wnxCn2QuA0oKM0H7OyvSd2aFcoXSv3vgFo
  Run: oci://ghcr.io/telorun/run@0.24.2#sha256-BFRCvbtbCRmj6SAu60wo_qbiQCJj1bGqKaKnhQwPJfw
targets:
  - !ref exampleServer
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8845
---
kind: Http.Server
metadata:
  name: exampleServer
port: !cel "ports.http"
openapi:
  info:
    title: Hello server
    version: 1.0.0
mounts:
  - path: /v1
    mount: !ref helloApi
---
kind: Http.Api
metadata:
  name: helloApi
routes:
  - request:
      path: /hello
      method: GET
      schema:
        query:
          type: object
          properties:
            name:
              type: string
          required: [ "name" ]
    handler: !ref sayHello
    inputs:
      name: "${{ request.query.name }}" # CEL expression
    returns:
      - status: 200
        content:
          application/json:
            schema:
              type: object
              properties:
                greeting: { type: string }
                nice: { type: string }
              required: [ greeting, nice ]
              additionalProperties: false
            body:
              greeting: "${{ result.message }}!"
              nice: "WOW"
---
kind: Run.Value
metadata:
  name: sayHello
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      name: { type: string }
value:
  message: !cel "'Hello ' + inputs.name + '!'"
