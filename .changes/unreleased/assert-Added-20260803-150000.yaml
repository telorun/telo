project: assert
kind: Added
body: >-
  Renamed the module to `Assert` (`metadata.name`) and dropped its
  `metadata.namespace`, so its published identity is now the bare name `Assert`
  rather than `std/assert`. Manifests are otherwise unaffected — kinds are
  referenced through the import alias you choose (`kind: Assert.Equals`), not
  through the module name, so only the import `source` changes. The npm
  controller package stays `@telorun/assert` (npm forbids uppercase) and the
  directory stays `modules/assert`.
