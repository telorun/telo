# An inline contract naming `TextRecord`, which reaches the recursive `Message`:
# the hoisted definition lands in the inline shape's `schema`, so the kernel
# binds what `telo check` accepted. Checks clean AND runs.
kind: Telo.Application
metadata:
  name: TextRecordContract
  version: 1.0.0
imports:
  Run: ../../../../modules/run
targets:
  - !ref main
---
kind: Telo.Definition
metadata:
  name: Titled
capability: Telo.Invocable
schema:
  type: object
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [title]
    properties:
      title: { $ref: "telo://manifest#/$defs/TextRecord" }
invoke: !ref record
resources:
  - kind: Run.Value
    metadata:
      name: record
    value:
      title: { text: Hello, context: null, lang: en, computed: false }
---
kind: Run.Sequence
metadata:
  name: main
steps:
  - name: titled
    invoke:
      kind: Self.Titled
