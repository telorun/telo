project: type
kind: Deprecated
body: >-
  Superseded by the kernel built-in `Telo.JsonSchema`, which needs no import.
  Declaring a data shape stopped being optional once any kind can carry an
  invocation contract: writing `inputType:` should not require an import, and a
  library declaring its own contract should not import a module purely to
  describe itself. This module is unchanged and `Type.JsonSchema` still resolves
  and behaves identically, so published manifests importing it keep working —
  but the standard library, examples and templates have moved to the built-in,
  and new manifests should too.
time: 2026-07-31T00:00:00.000000000+00:00
