# Two kind documents declared as members of a sequence's `with:` scope: one
# whose `capability:` names no role, one carrying a key the `Telo.Definition`
# schema does not declare. A scope member is created when its scope opens, where
# the kernel refuses both; `telo check` refuses them at the member's own line,
# and so does the load's analysis before anything runs.
kind: Telo.Application
metadata:
  name: ScopedKindDocumentApp
imports:
  Run: ../../../../modules/run
targets:
  - !ref probe
---
kind: Run.Sequence
metadata: { name: probe }
with:
  - kind: Telo.Definition
    metadata: { name: Misspelled }
    capability: Telo.Invokable
    schema: { type: object }
  - kind: Telo.Definition
    metadata: { name: Misnamed }
    capability: Telo.Invocable
    controllrs:
      - pkg:npm/thing@1.0.0
    schema: { type: object }
steps:
  - name: done
    value: true
