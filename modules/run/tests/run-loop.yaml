kind: Telo.Application
metadata:
  name: RunLoop
  version: 1.0.0
imports:
  Run: ../
  Assert: ../../assert
targets:
  - !ref verifyLoop
  - !ref verifyIterationIsInteger
---
kind: Run.Loop
metadata:
  name: countToThree
condition: !cel "iteration < 3"
maxIterations: 10
steps:
  - name: tick
    inputs:
      n: !cel "iteration"
    invoke:
      kind: Run.Value
      inputs:
        n: {}
      value:
        seen: !cel "inputs.n"
outputs:
  total: !cel "iteration"
  last: !cel "previous.tick.result.seen"
---
# maxIterations flows from an untyped input; a runtime-resolved non-number must
# surface INVALID_LOOP rather than silently no-op (NaN cap → zero iterations).
kind: Run.Loop
metadata:
  name: badCap
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      cap: {}
maxIterations: !cel "inputs.cap"
steps:
  - name: tick
    invoke:
      kind: Run.Value
      value:
        ok: true
---
kind: Run.Sequence
metadata:
  name: verifyLoop
steps:
  - name: runLoop
    invoke: !ref countToThree
  - name: check
    inputs:
      total: !cel "steps.runLoop.result.total"
      last: !cel "steps.runLoop.result.last"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          total: { type: number, const: 3 }
          last: { type: number, const: 2 }
  - name: badCapFails
    try:
      - name: run
        invoke: !ref badCap
        inputs:
          cap: "not a number"
    catch:
      - name: assertBadCap
        inputs:
          code: !cel "error.code"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { type: string, const: INVALID_LOOP }
---
# `iteration` is declared `type: integer`, and a CEL integer is an int64 — so it
# must compose with an integer literal with NO cast. Handed to CEL as a JS
# number it typed as a double, and this expression failed at dispatch with
# "no such overload: dyn<double> + int" while type-checking statically. Asserting
# `!cel "iteration"` bare cannot catch that: only arithmetic against an int
# literal exercises the overload.
kind: Run.Loop
metadata:
  name: countFromOne
maxIterations: 3
steps:
  - name: tick
    inputs:
      label: !cel "'#' + string(iteration + 1)"
    invoke:
      kind: Run.Value
      inputs:
        label: {}
      value:
        label: !cel "inputs.label"
outputs:
  ordinal: !cel "iteration + 1"
  lastLabel: !cel "previous.tick.result.label"
---
kind: Run.Sequence
metadata:
  name: verifyIterationIsInteger
steps:
  - name: run
    invoke: !ref countFromOne
  - name: check
    inputs:
      actual: !cel "steps.run.result"
      expected:
        ordinal: 4
        lastLabel: "#3"
    invoke:
      kind: Assert.Equals
