kind: Telo.Application
metadata:
  name: UiReactNavigationPlacementsTest
  version: 1.0.0
  description: |
    A compact navigation placement of another module's own — a kind extending
    the compact abstract — is accepted where a compact placement goes with no
    change to ui, and a navbar in a layout reaches the renderer with every
    default filled and that compact placement as it provides it. An entry's
    icon, a file of the application's own, is served by its content digest, and
    a second instance of the application serves it before it has answered any
    document.
imports: { App: ../../app, HttpClient: ../../http-client, Assert: ../../assert }
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: fixture }
    source: ./__fixtures__/navigation-placements/telo.yaml
    ports: { http: 19319 }
  - kind: App.Instance
    metadata: { name: replica }
    source: ./__fixtures__/navigation-placements/telo.yaml
    ports: { http: 19320 }
targets:
  - !ref fixture
  - !ref replica
steps:
  - name: app
    invoke: { kind: HttpClient.Request, url: "http://127.0.0.1:19319/admin/_telo/ui/app" }
  - name: layout
    invoke: { kind: HttpClient.Request }
    inputs:
      url: !cel "'http://127.0.0.1:19319/admin/_telo/ui/layout?id=' + steps.app.result.body.layout"
  - name: glyph
    invoke: { kind: HttpClient.Request }
    inputs:
      url: !cel >-
        'http://127.0.0.1:19320/admin/_telo/ui/assets/' + steps.layout.result.body.header[0].navigation.items[0].icon.digest
        + '/' + steps.layout.result.body.header[0].navigation.items[0].icon.name
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        icon: !cel "steps.layout.result.body.header[0].navigation.items[0].icon"
        type: !cel "steps.glyph.result.headers['content-type']"
        placement: !cel "steps.layout.result.body.header[0].placement"
      expected:
        icon: { digest: fc4623b15ea93cb24bb023ca34aa2f42773be8b4761bf706f6b5e0171e032e82, name: glyph.svg }
        type: image/svg+xml
        placement:
          type: header
          compact:
            type: tab-bar
            visible: 3
            surface:
              type: drawer
              side: bottom
              size: medium
              modal: true
              dismiss: { escape: true, outside: true, closeButton: true }
