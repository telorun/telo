units:
  analyzer: Added
body: "The `member` of `x-telo-value-schema-from` also takes an absolute JSON Pointer
  (`member: /key`), read from the declaration holding each type `from` reaches — the
  field as written, else the `default:` its kind declares there — so a value is held to
  the property of a record type that a field of that same declaration names. Each type
  reached through `*` is paired with its own declaration's member. `telo check` holds a
  literal there to the property (`SCHEMA_VIOLATION`), an accessor chain by its type
  (`CEL_TYPE_ERROR`), types a contract node by it, and refuses a pointer that names no
  string in the schema of the declaration's kind (`VALUE_SCHEMA_FROM_INVALID`). Every
  relative `member` reads as before."
