kind: Telo.Library
metadata:
  name: UrlShortenerRedirect
  version: 1.0.0
  categories: [ Transport, Performance ]
  description: |
    Public side of the URL shortener: create a short link and redirect by code.
    Owns the read-through cache (Cache.View over the SQL lookup), the rate-limit
    guard, and the fire-and-forget click recorder (Run.Detach). Exports `Routes`
    for the app to mount.
requires:
  # 0.118.0: `site` is a `Telo.PublicUrl` need, a kind an older analyzer does not
  # declare.
  # 0.128.0: `Telo.Sequence`, which an older analyzer reads as UNDEFINED_KIND.
  telo: ">=0.128.0"
needs:
  # The address the short links are served at, which the importing application
  # forwards from its own root need.
  site: { kind: Telo.PublicUrl }
variables:
  dbFile:
    type: string
    x-telo-type: { name: Telo.HostPath, entry: file }
    description: Path to the shared SQLite database file.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.42.0#sha256-wF3AHGL8hGFdy7SfxXJkaXtRzLeqKtgqTVmN9anXKTk
  SqlRepository: oci://ghcr.io/telorun/sql-repository@0.20.0#sha256-F8tGToPv8R4wnTP__oCkhLWiuZV3pFWFBZA7pbB2JJs
  Sql: oci://ghcr.io/telorun/sql@0.30.0#sha256-NucxyVlxJy6byu-J21_UhzhKxaqauLe9BSC1ZSgP8_c
  Run: oci://ghcr.io/telorun/run@0.32.0#sha256-4BOwkyKZuEAr-gDIkQWEzA1UszTNrIGHyv9GFnnUkv8
  Cache: oci://ghcr.io/telorun/cache@0.13.2#sha256-VeDhniXCmWPAJocIP64qzjMZarWgCf-Rp2htAPO9NmE
  CacheMemory: oci://ghcr.io/telorun/cache-memory@0.10.2#sha256-xYLABUrdDk9MUy19uaZ1fS6ZhiLfMK0BJYL-aTdwHBE
  RateLimit: oci://ghcr.io/telorun/rate-limit@0.13.2#sha256-XsCdCjJvrSku0NeNCABW9cQJ0abAPIYYvJTlur36gm0
  Database:
    source: ../database
    variables:
      dbFile: !cel "variables.dbFile"
exports: { resources: [routes] }
---
kind: CacheMemory.Store
metadata: { name: mem }
---
kind: RateLimit.Guard
metadata: { name: limit }
store: !ref mem
limit: 60
window: "60s"
---
kind: SqlRepository.Read
metadata: { name: lookupLink }
connection: !ref Database.connection
table: !ref Database.links
---
# Read-through cache in front of the lookup: a hit skips SQL entirely, a stale
# entry is served immediately and refreshed in the background (`revalidate:
# background`), so a redirect never waits on the database.
kind: Cache.View
metadata: { name: linkView }
store: !ref mem
invoke: !ref lookupLink
ttl: "300s"
staleTtl: "3600s"
revalidate: background
---
kind: Sql.Command
metadata: { name: insertLink }
connection: !ref Database.connection
---
kind: SqlRepository.Create
metadata: { name: insertClick }
connection: !ref Database.connection
table: !ref Database.clicks
---
# Analytics must never delay the redirect: Run.Detach hands the insert to the
# kernel and returns immediately, so the 302 goes out without waiting for it.
kind: Run.Detach
metadata: { name: recordClick }
invoke: !ref insertClick
---
kind: Telo.Sequence
metadata: { name: createLink }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties: { code: { type: string }, url: { type: string }, ip: { type: string } }
steps:
  - name: guard
    invoke: !ref limit
    inputs:
      key: !cel "inputs.ip"
  - name: maybeInsert
    if: !cel "steps.guard.result.allowed"
    then:
      - name: insert
        invoke: !ref insertLink
        inputs:
          sql: "INSERT OR REPLACE INTO links (code, target) VALUES (?, ?)"
          bindings:
            - !cel "inputs.code"
            - !cel "inputs.url"
outputs:
  allowed: !cel "steps.guard.result.allowed"
  retryAfter: !cel "steps.guard.result.retryAfter"
  code: !cel "inputs.code"
  shortUrl: !cel >-
    string(resources.site.url) + (string(resources.site.url).endsWith('/') ? '' : '/') +
    inputs.code
---
kind: Telo.Sequence
metadata: { name: resolveAndRedirect }
inputType:
  kind: Telo.JsonSchema
  schema: { type: object, properties: { code: { type: string }, ip: { type: string } } }
steps:
  - name: guard
    invoke: !ref limit
    inputs:
      key: !cel "inputs.ip"
  - name: maybeResolve
    if: !cel "steps.guard.result.allowed"
    then:
      - name: resolve
        invoke: !ref linkView
        inputs:
          key: !cel "inputs.code"
          filters:
            code: !cel "inputs.code"
      - name: maybeClick
        if: !cel "size(steps.resolve.result.value.rows) > 0"
        then:
          - name: click
            invoke: !ref recordClick
            inputs:
              data:
                code: !cel "inputs.code"
                ip: !cel "inputs.ip"
outputs:
  allowed: !cel "steps.guard.result.allowed"
  retryAfter: !cel "steps.guard.result.retryAfter"
  found: !cel "has(steps.resolve) && size(steps.resolve.result.value.rows) > 0"
  target: !cel "has(steps.resolve) && size(steps.resolve.result.value.rows) > 0 ? steps.resolve.result.value.rows[0].target : ''"
---
kind: Http.Api
metadata: { name: routes }
routes:
  - request:
      path: /links
      method: POST
      schema:
        body:
          type: object
          required: [code, url]
          properties: { code: { type: string, minLength: 1 }, url: { type: string, minLength: 1 } }
    handler: !ref createLink
    inputs:
      code: !cel "request.body.code"
      url: !cel "request.body.url"
      ip: !cel "request.ip"
    returns:
      - status: 429
        when: !cel "!result.allowed"
        headers:
          Retry-After: !cel "string(result.retryAfter)"
        content: { application/json: { body: { ok: false, message: "Rate limit exceeded" } } }
      - status: 201
        content:
          application/json:
            body:
              ok: true
              code: !cel "result.code"
              shortUrl: !cel "result.shortUrl"

  - request:
      path: /{code}
      method: GET
      schema:
        params: { type: object, required: [code], properties: { code: { type: string } } }
    handler: !ref resolveAndRedirect
    inputs:
      code: !cel "request.params.code"
      ip: !cel "request.ip"
    returns:
      - status: 429
        when: !cel "!result.allowed"
        headers:
          Retry-After: !cel "string(result.retryAfter)"
        content: { application/json: { body: { ok: false, message: "Rate limit exceeded" } } }
      - status: 302
        when: !cel "result.found"
        headers:
          Location: !cel "result.target"
      - status: 404
        content: { application/json: { body: { ok: false, message: "Unknown short code" } } }
