kind: Telo.Library
metadata:
  name: TesseractLangTel
  version: 0.1.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Recognize Telugu text in images, offline: the trained model for reading
    printed Telugu (Telugu script) with Tesseract optical character recognition.
