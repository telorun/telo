# Page references the application does not list, written in a navbar, a link,
# a navigation column, another module's pane and a library's navbar.
kind: Telo.Library
metadata:
  name: UiReactUnroutedPage
  version: 1.0.0
  description: >-
    Test fixture exporting an application whose layout and pages name pages its
    pages do not list, in each place a page can be named.
imports:
  UiReact: ../../../../../
  Ui: ../../../../../../ui
  Help: ../../../../../../ui/tests/__fixtures__/help
  Docs: ../docs
exports: { resources: [draft] }
---
kind: Ui.Page
metadata: { name: home }
path: /
title: Home
children:
  - type: pane
    ref:
      kind: Help.Links
      heading: Need a hand?
      navigation:
        items:
          - { type: page, page: !ref third }
---
kind: Ui.Page
metadata: { name: second }
path: /second
title: Second
children: []
---
kind: Ui.Page
metadata: { name: third }
path: /third
title: Third
children: []
---
kind: Ui.Page
metadata: { name: fourth }
path: /fourth
title: Fourth
children: []
---
kind: Ui.Page
metadata: { name: fifth }
path: /fifth
title: Fifth
children: []
---
kind: UiReact.App
metadata: { name: draft }
title: Draft
theme: !ref UiReact.defaultTheme
pages: [!ref home, !ref Docs.listed]
layout:
  kind: Ui.PageLayout
  header:
    - type: pane
      ref:
        kind: Ui.Navbar
        title: Draft
        navigation:
          items:
            - { type: page, page: !ref second }
    - { type: pane, ref: !ref Docs.nav }
  aside:
    label: Shortcuts
    content:
      type: pane
      ref:
        kind: Ui.NavigationColumn
        navigation:
          items:
            - { type: page, page: !ref fourth }
  footer:
    - { type: link, text: Fifth, href: { path: !ref fifth } }
