modules:
  modules/session: Added
body: "New module: server-side login sessions over a durable key/value store.
  Session.Sessions holds a set of sessions with idle and absolute lifetimes,
  remembered-session lifetimes and a per-user cap; Session.Start, Rotate, End, EndAll
  and List start a session under a fresh id, replace it when privileges change, and end
  one session or every session of a user in a single write. Session.Verifier
  authenticates a session token read from a cookie, refusing ended and expired sessions,
  and slides the idle deadline with at most about ten writes per idle period. A failing
  store is ERR_SESSION_STORE_UNAVAILABLE and rotating a session the user does not hold
  is ERR_SESSION_NOT_FOUND."
