kind: Telo.Application
metadata:
  name: HttpBinaryStreamBodyTest
  version: 1.0.0
  description: |
    End-to-end test for binary request bodies. An Http.Server declares a raw
    stream content-type parser for application/gzip; a route declares its
    request.schema.body as a `Telo.Stream`, so request.body is delivered to the
    handler as a Stream<Uint8Array> (no buffering, no AJV). The handler drains
    the stream and the route echoes the bytes back; the client POSTs a known
    payload and asserts it round-tripped byte-for-byte.
imports:
  Http: ../
  HttpClient: ../../http-client
  Octet: ../../octet-codec
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testUpload
---
kind: Http.Api
metadata: { name: api }
routes:
  - request:
      path: /upload
      method: POST
      schema:
        body:
          x-telo-type:
            name: Telo.Stream
            of: Telo.Bytes
    # Drains the streamed request body into one run of bytes.
    handler:
      kind: Octet.Decoder
    inputs:
      input: !cel "request.body"
    returns:
      - status: 200
        content:
          application/json:
            body:
              length: !cel "size(result.bytes)"
              text: !cel "string(result.bytes)"
---
kind: Run.Sequence
metadata: { name: testUpload }
with:
  - kind: Http.Server
    metadata: { name: Server }
    host: 127.0.0.1
    port: 8958
    baseUrl: http://127.0.0.1:8958
    contentTypeParsers:
      - contentType: application/gzip
        stream: true
    mounts:
      - path: /
        mount: !ref api
targets:
  - !ref Server
steps:
  # The stream parser passes the bytes through undecoded.
  - name: upload
    inputs:
      url: http://127.0.0.1:8958/upload
      method: POST
      headers:
        content-type: application/gzip
      body: hello stream body
    invoke:
      kind: HttpClient.Request
  - name: assert
    inputs:
      actual:
        status: !cel "steps.upload.result.status"
        body: !cel "steps.upload.result.body"
      expected:
        status: 200
        body: { length: 17, text: hello stream body }
    invoke: !ref Assert.equals
