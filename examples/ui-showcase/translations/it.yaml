# The showcase in Italian: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads and translated into Italian's cases, `one` and `other` (`many` only
# serves large round numbers); a word told apart by its context is translated
# once per context.
kind: I18n.Catalog
metadata:
  name: italian
lang: it
texts:
  # Applications and pages.
  - { text: UI showcase, translation: "Vetrina dell'interfaccia" }
  - { text: UI showcase — Radix, translation: "Vetrina dell'interfaccia — Radix" }
  - { text: UI showcase — brand, translation: "Vetrina dell'interfaccia — marchio" }
  - { text: UI showcase — sidebar, translation: "Vetrina dell'interfaccia — barra laterale" }
  - { text: Overview, translation: Panoramica }
  - { text: Conditions, translation: Condizioni }
  - { text: Data, translation: Dati }
  - { text: Tables, translation: Tabelle }
  - { text: Filters, translation: Filtri }
  - { text: Forms, translation: Moduli }
  - { text: Actions, translation: Azioni }
  - { text: Components, translation: Componenti }
  - { text: CRUD, translation: CRUD }
  - { text: Themes, translation: Temi }
  # The navigation's groups.
  - { text: Building blocks, translation: Elementi costitutivi }
  - { text: Input, translation: Inserimento }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: "Logo della vetrina dell'interfaccia" }
  - { text: Language, translation: Lingua }
  - { text: Theme, translation: Tema }
  - { text: Default, translation: Predefinito }
  - { text: Radix, translation: Radix }
  - { text: Brand, translation: Marchio }
  - { text: Sidebar, translation: Barra laterale }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: A ogni richiesta }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "Questi nodi appartengono alla pagina stessa, quindi il loro when e il loro testo vengono valutati a ogni richiesta." }
  - { text: Your browser asked for Polish., translation: Il tuo browser ha chiesto il polacco. }
  - { text: Your browser did not ask for Polish., translation: Il tuo browser non ha chiesto il polacco. }
  - { text: The Acme brand is on., translation: Il marchio Acme è attivo. }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "Un testo calcolato da un'espressione viene mostrato così come è calcolato, mai tradotto." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "Un link che questa richiesta rende non valido viene sostituito da un nodo di errore, e il resto della pagina viene servito." }
  - { text: Leaves the application, translation: "Esce dall'applicazione" }

  # The overview.
  - { text: Every node type, translation: Ogni tipo di nodo }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "Un contenitore, una pila e delle colonne contengono altri nodi, e ciascuno disegna i propri figli a modo suo." }
  - { text: A box, translation: Un contenitore }
  - { text: Groups its children., translation: Raggruppa i propri figli. }
  - { text: A stack, translation: Una pila }
  - { text: Draws its children one under another., translation: "Disegna i propri figli uno sotto l'altro." }
  - { text: A badge, translation: Un badge }
  - { text: Columns, translation: Colonne }
  - { text: "Draw their children side by side, as these three are.", translation: "Disegnano i propri figli affiancati, come queste tre." }
  - { text: Text in each style, translation: Testo in ogni stile }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "Uno stile dice che cosa significa un nodo; il tema decide che aspetto ha. Un nodo può averne più di uno." }
  - { text: Heading, translation: Titolo }
  - { text: Subheading, translation: Sottotitolo }
  - { text: Muted, translation: Attenuato }
  - { text: Strong, translation: Marcato }
  - { text: Accent, translation: Accento }
  - { text: Danger, translation: Pericolo }
  - { text: Warning, translation: Avviso }
  - { text: Success, translation: Successo }
  - { text: Strong and accent, translation: Marcato e accento }
  - { text: Links, translation: Link }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "Un link a una pagina dichiarata si sposta all'interno dell'applicazione; un file servito sotto il punto di montaggio è un normale caricamento; https e mailto ne escono." }
  - { text: Go to Conditions, translation: Vai a Condizioni }
  - { text: A file the server serves, translation: Un file servito dal server }
  - { text: Write to us, translation: Scrivici }
  - { text: Images, translation: Immagini }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "Un'immagine da indirizzo, la stessa immagine come decorazione con alt vuoto, e markup SVG disegnato come immagine, mai inserito nella pagina." }
  - { text: The showcase mark, translation: Il simbolo della vetrina }
  - { text: Three overlapping circles, translation: Tre cerchi sovrapposti }
  - { text: Values by their schema, translation: Valori secondo il loro schema }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "Ogni valore è disegnato come indica la sua proprietà del modello, letto dal record del team che la pagina carica." }
  - { text: Visit the team homepage, translation: Visita la home page del team }
  - { text: "A uri, drawn as a link with a text of its own", translation: "Un uri, disegnato come link con un testo proprio" }
  - { text: A uri-reference to a declared page, translation: Un uri-reference a una pagina dichiarata }
  - { text: A uri-reference to a served file, translation: Un uri-reference a un file servito }
  - { text: A mailto address, translation: Un indirizzo mailto }
  - { text: "An address the rule refuses, drawn as plain text", translation: "Un indirizzo rifiutato dalla regola, disegnato come testo semplice" }
  - { text: A date, translation: Una data }
  - { text: A date and time, translation: Una data e ora }
  - { text: A boolean, translation: Un booleano }
  - { text: An enumeration's label, translation: "L'etichetta di un'enumerazione" }
  - { text: A list, translation: Un elenco }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "Le righe contenute in una sola risposta, mai paginate. Un'intestazione è per impostazione predefinita il titolo della proprietà, e l'ultima colonna è mostrata solo mentre il team sta assumendo." }
  - { text: Projects under way, translation: Progetti in corso }
  - { text: Project, translation: Progetto }
  - { text: Texts, translation: Testi }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": Ancora nessun progetto.
        one: "{$count} progetto finora."
        other: "{$count} progetti finora."
  - { text: "{$team} started {$project} most recently.", translation: "{$team} ha avviato per ultimo {$project}." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "Un plurale scelto nel browser per il numero che legge, e un testo i cui valori provengono dal record." }
  - { text: Open, context: state, translation: Aperto }
  - { text: Open, context: verb, translation: Apri }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "Il testo proprio di un nodo si distingue allo stesso modo: il badge dice che TEL-42 è aperto, il link propone di aprirne le attività." }
  - { text: Style rules, translation: Regole di stile }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "Lo stile di una riga e quello di una cella sono scelti da un valore della riga. Il progetto in evidenza è marcato, ogni stato ha il suo colore, e uno stato che nessun caso nomina prende quello predefinito. Due colonne hanno come intestazione la stessa parola, Open, distinta dal contesto con cui è scritta ciascuna intestazione." }
  - { text: Composites, translation: Compositi }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "Tutta questa pagina è una vista che ogni applicazione colloca per riferimento. Qui sotto, una vista scritta direttamente dove è collocata, e un tipo composito proprio di questo esempio, che non ha controller." }
  - { text: A view declared inline at the node that places it., translation: "Una vista dichiarata direttamente nel nodo che la colloca." }
  - { text: A callout, translation: Un richiamo }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Dichiarato una volta come tipo che estende Ui.Composite e fornisce una vista, e collocato con campi propri." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: Schede }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "Contenuto in schede, una scheda alla volta. La scheda scelta fa parte dell'indirizzo della pagina, quindi un ricaricamento o un link condiviso la riapre." }
  - { text: Summary, translation: Riepilogo }
  - { text: "A tab holds any nodes, as a box does.", translation: "Una scheda contiene qualsiasi nodo, come un contenitore." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "Vengono disegnati solo i nodi della scheda scelta." }
  - { text: Chosen, translation: Scelta }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "Ogni scheda viene inviata secondo il proprio when, come qualsiasi nodo." }
  # The labels of the overview's models.
  - { text: Code, translation: Codice }
  - { text: Name, translation: Nome }
  - { text: Status, translation: Stato }
  - { text: Active, translation: Attivo }
  - { text: Paused, translation: In pausa }
  - { text: Finished, translation: Concluso }
  - { text: Budget, translation: Budget }
  - { text: Started, translation: Avviato }
  - { text: Free, context: subscription, translation: Gratuito }
  - { text: Enterprise, context: subscription, translation: Aziendale }
  - { text: Version, translation: Versione }
  - { text: Team, context: subscription, translation: Team }

  # Conditions.
  - { text: Delivered and drawn, translation: Inviato e disegnato }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "Il when di un nodo decide sul server se viene inviato; il suo shown decide nel browser se un nodo inviato viene disegnato." }
  - { text: Never delivered — this node is not in the page document., translation: Mai inviato — questo nodo non è nel documento della pagina. }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "Inviato e mai disegnato: lo stato non è paused, quindi il browser lo tiene nascosto." }
  - { text: Delivered by its when and drawn by its shown., translation: Inviato dal suo when e disegnato dal suo shown. }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "La condizione di una collocazione attorno a un composito il cui nodo ne ha una propria viene avvolta in un contenitore, ed entrambe devono essere soddisfatte." }
  - { text: Both conditions hold., translation: Entrambe le condizioni sono soddisfatte. }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "Una vista il cui contenuto è disattivato dal suo stesso when non fornisce alcun nodo, quindi il composito che la colloca viene omesso." }
  - { text: Never provided., translation: Mai fornito. }
  - { text: Every keyword of a condition, translation: Ogni parola chiave di una condizione }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "Ogni riga qui sotto è disegnata perché la sua condizione è soddisfatta dal riepilogo del progetto TEL-42 letto da questa pagina: stato active, quattro membri, velocità 2.5, tag design e web, un manager come responsabile, una note null e nessun codename." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: ci lavorano da 1 a 10 persone." }
  - { text: "required: the lead has an e-mail.", translation: "required: il responsabile ha un'e-mail." }
  - { text: "properties: the lead is a manager.", translation: "properties: il responsabile è un manager." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: ci lavorano almeno tre persone." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: ci lavorano al massimo nove persone." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: la velocità è maggiore di 2." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: la velocità è minore di 3." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: la velocità è un multiplo di 0.5." }
  - { text: "type: the status is a string.", translation: "type: lo stato è una stringa." }
  - { text: "type, as a list: the note is a string or null.", translation: "type, come elenco: note è una stringa o null." }
  - { text: "const: the status is active.", translation: "const: lo stato è active." }
  - { text: "enum: the status is active or paused.", translation: "enum: lo stato è active o paused." }
  - { text: "not: the status is not paused.", translation: "not: lo stato non è paused." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code inizia con TEL o OPS." }
  - { text: "items: every tag has at least two letters.", translation: "items: ogni tag ha almeno due lettere." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: ci sono almeno due tag." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: ci sono al massimo cinque tag." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: nessun tag si ripete." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code ha almeno tre caratteri." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code ha al massimo dieci caratteri." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code è composto da lettere, un trattino e cifre." }
  - { text: Missing and null, translation: Mancante e null }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null è un valore presente. Un valore mancante non soddisfa alcuna condizione, nemmeno una sotto not, quindi l'assenza si verifica sul genitore." }
  - { text: The note is present and null., translation: note è presente e vale null. }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "Mai disegnato: un codename mancante non soddisfa not." }
  - { text: "The project has no codename, tested on the summary.", translation: "Il progetto non ha codename, verificato sul riepilogo." }
  - { text: Query parameters, translation: Parametri di query }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "Questo lettore dichiara mode, un elenco di valori tag e un ticket vincolato a un pattern. Un parametro che l'indirizzo omette, uno singolo indicato due volte o un valore che la sua dichiarazione rifiuta conta come mancante." }
  - { text: Mode detailed, translation: Modalità detailed }
  - { text: Two tags, translation: Due tag }
  - { text: A valid ticket, translation: Un ticket valido }
  - { text: A refused ticket, translation: Un ticket rifiutato }
  - { text: Mode given twice, translation: Modalità indicata due volte }
  - { text: Clear the query, translation: Cancella la query }
  - { text: mode is detailed., translation: mode è detailed. }
  - { text: There are two tag values or more., translation: Ci sono due o più valori tag. }
  - { text: The ticket matches its pattern., translation: ticket corrisponde al suo pattern. }
  - { text: "No ticket, or one its pattern refuses.", translation: "Nessun ticket, o uno che il suo pattern rifiuta." }
  - { text: Enablement, translation: Abilitazione }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "Il pulsante si può premere solo mentre è soddisfatta la sua condizione su ciò che contiene il modulo, e finché non lo è spiega perché. Un tag che il progetto ha già viene rifiutato, e le righe qui sopra rileggono il riepilogo dopo l'aggiunta di un tag." }
  - { text: Tag TEL-42, translation: Aggiungi un tag a TEL-42 }
  - { text: Tag, translation: Tag }
  - { text: Type a tag of three letters or more., translation: Digita un tag di tre o più lettere. }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation:
      plural: count
      cases:
        one: "Aggiunto {$tag}: ora TEL-42 ha {$count} tag."
        other: "Aggiunto {$tag}: ora TEL-42 ha {$count} tag."
  - { text: A page's own query, translation: La query della pagina stessa }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "Anche questa pagina dichiara mode, e i suoi nodi lo leggono." }
  - { text: The page reads mode as detailed., translation: La pagina legge mode come detailed. }

  # Data.
  - { text: A reader and its parameters, translation: Un lettore e i suoi parametri }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "Il progetto è il parametro project dell'indirizzo della pagina, inviato con la lettura; senza di esso il parametro non viene inviato e la route risponde per TEL-42. Un codice che nessun progetto ha disegna l'albero di errore." }
  - { text: A code no project has, translation: Un codice che nessun progetto ha }
  - { text: No project, translation: Nessun progetto }
  - { text: Reading the project…, translation: Lettura del progetto… }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, guidato da {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "Un lettore annidato nel contenuto di questo legge le persone che lavorano allo stesso progetto." }
  - { text: Working on it, translation: Ci lavorano }
  - { text: Role, translation: Ruolo }
  - { text: E-mail, translation: E-mail }
  - { text: "No answer · {$code}", translation: "Nessuna risposta · {$code}" }
  - { text: Readers that fail, translation: Lettori che falliscono }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "Senza un proprio albero di errore, i lettori disegnano il codice e il messaggio dell'errore — per un progetto che non esiste, per una route protetta letta senza sessione e per una risposta che il modello del lettore rifiuta (l'elenco dei progetti letto come un solo progetto)." }
  - { text: "Never drawn: there is no such project.", translation: "Mai disegnato: questo progetto non esiste." }
  - { text: "Signed in, so this reads: {$name}", translation: "Accesso effettuato, quindi questo legge: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "Mai disegnato: un elenco non è un progetto." }
  - { text: Read again on focus, translation: Rilettura al ritorno del focus }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "Questo lettore rilegge l'ora del server ogni volta che la finestra riprende il focus. Passa a un'altra finestra e torna qui." }
  - { text: Read at, translation: Letto alle }
  - { text: A sign-in gate, translation: Una barriera di accesso }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "La barriera legge se è aperta una sessione, e la rilegge ogni volta che una richiesta al suo interno riceve la risposta 401. L'accesso apre una sessione per un membro del team; un'e-mail che nessuno nel team ha viene rifiutata sul suo campo. All'interno, un lettore su una route protetta mostra l'account. Chiudere la sessione in silenzio lascia l'account sullo schermo finché la successiva richiesta protetta — il controllo qui sotto, o un ritorno del focus — non viene rifiutata, e allora la barriera passa alla vista senza accesso." }
  - { text: You are signed out., translation: Sei disconnesso. }
  - { text: Sign in, translation: Accedi }
  - { text: "Signed in as {$name}", translation: "Accesso effettuato come {$name}" }
  - { text: "Member since {$since}", translation: "Membro dal {$since}" }
  - { text: Check the session, translation: Verifica la sessione }
  - { text: End the session quietly, translation: Chiudi la sessione in silenzio }
  - { text: Sign out, translation: Esci }

  # The labels of the task models.
  - { text: Task, translation: Attività }
  - { text: Assignee, translation: Assegnatario }
  - { text: Priority, translation: Priorità }
  - { text: Estimate, translation: Stima }
  - { text: Due, translation: Scadenza }
  - { text: Label, translation: Etichetta }
  - { text: Blocked, translation: Bloccata }
  - { text: To do, translation: Da fare }
  - { text: In progress, translation: In corso }
  - { text: In review, translation: In revisione }
  - { text: Bug, translation: Bug }
  - { text: Feature, translation: Funzionalità }
  - { text: Chore, translation: Manutenzione }
  - { text: Docs, translation: Documentazione }
  - { text: Contact, translation: Contatto }
  - { text: Project name, translation: Nome del progetto }
  - { text: Brief, translation: Sintesi }

  # Tables.
  - { text: Columns from the model, translation: Colonne dal modello }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "Senza colonne scritte, una tabella ne mostra una per ogni proprietà del modello tranne la chiave di riga, ciascuna intestata con il suo titolo e disegnata secondo il suo tipo. Mostra 25 righe per pagina, il valore predefinito, e apre i moduli di creazione e modifica in una finestra di dialogo, la superficie che una tabella usa quando non ne nomina nessuna." }
  - { text: "Written columns, sorting and style rules", translation: "Colonne scritte, ordinamento e regole di stile" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "Colonne scritte a mano, nell'ordine indicato, una con un'intestazione propria. Una colonna è ordinabile dove la collezione elenca la sua proprietà per l'ordinamento. La riga di un'attività bloccata è marcata e rossa, ogni cella di stato ha il suo colore, e una priorità che nessun caso nomina prende quello predefinito. Otto righe per pagina." }
  - { text: Where, translation: Dove }
  - { text: Members behind a reference, translation: Campi dietro un riferimento }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "La bacheca delle attività restituisce ogni attività con il suo assegnatario e il suo progetto annidati. Una colonna su un campo annidato ne prende il titolo e la presentazione attraverso una forma con nome, attraverso una definizione propria del modello e attraverso un riferimento il cui titolo prevale sulla forma che nomina: il contatto è un link e-mail e la sintesi un link a una pagina." }
  - { text: Filtered by the address, translation: "Filtrata dall'indirizzo" }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "Questa tabella dichiara un parametro project e lo invia come uguaglianza con ogni richiesta. Senza un progetto nell'indirizzo non legge nulla." }
  - { text: Atlas redesign tasks, translation: Attività della riprogettazione di Atlas }
  - { text: Billing migration tasks, translation: Attività della migrazione della fatturazione }
  - { text: Blocked tasks, translation: Attività bloccate }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "Questa è filtrata da un valore fisso scritto nella tabella, ed elenca solo le attività bloccate." }
  - { text: Where a form opens, translation: Dove si apre un modulo }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "Ogni tabella qui sotto apre i moduli di creazione e modifica su una superficie diversa. Un salvataggio ricarica ogni tabella di attività della pagina." }
  - { text: Dialogs, translation: Finestre di dialogo }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "Creazione in una piccola finestra di dialogo che resta aperta, svuotata, per un'altra attività. Modifica in una grande finestra di dialogo che non blocca la pagina e ignora un clic all'esterno; dopo un salvataggio mantiene i valori, scarta i dati non salvati senza chiedere e fa parte dell'indirizzo. Ogni riga offre un'eliminazione con conferma." }
  - { text: Drawers, translation: Cassetti }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "Creazione in un piccolo cassetto dal bordo iniziale; modifica in un grande cassetto dal bordo finale, senza pulsante di chiusura. Entrambi si chiudono dopo un salvataggio e chiedono conferma prima di scartare i dati non salvati." }
  - { text: Sheets, translation: Fogli }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "Creazione in un foglio dall'alto che non blocca la pagina; modifica in un foglio a tutto schermo dal basso, che fa parte dell'indirizzo." }
  - { text: Popovers, translation: Popover }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "Creazione in un riquadro accanto al pulsante Nuovo, centrato su di esso; sotto la soglia diventa una finestra di dialogo completa. Modifica in un riquadro sotto il pulsante della riga, allineato alla sua fine, che un clic all'esterno non chiude e che resta aperto dopo un salvataggio." }
  - { text: In line, translation: In linea }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "Il modulo di creazione si apre sopra le righe e quello di modifica sotto la riga che modifica. Sotto la soglia il modulo di creazione si apre in un foglio dal basso." }
  - { text: Panels, translation: Pannelli }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "Creazione in un piccolo pannello sul bordo iniziale, che Esc non chiude. Modifica in un grande pannello sul bordo finale, che fa parte dell'indirizzo, con le righe ancora utilizzabili accanto; sotto la soglia diventa un foglio dal basso." }
  - { text: A page of its own, translation: Una pagina a sé }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "Creazione e modifica sostituiscono il contenuto della pagina sotto un unico nome nell'indirizzo, quindi l'indirizzo indica una nuova attività o l'attività con questa chiave, e Indietro chiude il modulo. La superficie è dichiarata una volta e nominata da entrambe." }

  # Filters.
  - { text: Every filter the collection accepts, translation: Ogni filtro che la collezione accetta }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "Senza campi scritti, la barra disegna un controllo per ogni filtro che la collezione accetta, nel suo ordine e dalla proprietà del modello: un elenco per un'enumerazione o un valore sì/no, altrimenti una casella tipizzata, e un'unica etichetta sopra i due estremi di un intervallo. Sta sopra la tabella, applica subito una scelta e il testo digitato con Invio, e non conserva nulla tra una visita e l'altra." }
  - { text: Every control, translation: Ogni controllo }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "Ogni modo di inserire un filtro: testo digitato, opzioni affiancate, un elenco, tag digitati, un cursore, un interruttore e due date sotto un'unica etichetta. Il filtro del progetto non è disegnato da nessuna parte e lo imposta solo una preimpostazione. Lo stato parte dal suo valore predefinito, e una preimpostazione imposta i filtri che le preimpostazioni nominano e cancella gli altri che nominano. I chip riassumono ciò che è scelto, e i valori fanno parte dell'indirizzo. Sotto la soglia la barra si comprime, e il filtro di testo fissato resta fuori dalla parte compressa." }
  - { text: Urgent, translation: Urgenti }
  - { text: Atlas only, translation: Solo Atlas }
  - { text: Stuck, translation: Ferme }
  - { text: "Beside, as chips, while typing", translation: "Accanto, come chip, durante la digitazione" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "I controlli stanno in una colonna sul bordo iniziale. Sono visibili solo i filtri che scegli: aggiungine uno dall'elenco della barra, e rimuoverlo lo cancella. Ogni filtro è un chip che ne indica il valore e che apre il suo controllo. Il testo digitato si applica dopo una pausa, e i due estremi di un numero hanno le didascalie dopo e prima. La scelta è conservata in questo browser tra una visita e l'altra. Sotto la soglia la barra si apre in un foglio dal basso." }
  - { text: "Beside at the end, applied by a button", translation: "Accanto alla fine, applicati con un pulsante" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "I controlli stanno sul bordo finale, e una modifica attende Applica, mentre una preimpostazione, Reimposta e la rimozione di un chip di riepilogo si applicano subito. Più assegnatari si digitano separati da virgole. La scelta è conservata solo per questa scheda e sopravvive a un ricaricamento." }
  - { text: Due by October, translation: Scadenza entro ottobre }
  - { text: "Folded, starting open", translation: "Comprimibile, inizialmente espanso" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "I controlli si comprimono dietro un pulsante che conta i filtri con un valore, e partono espansi. Il filtro di testo fissato resta fuori dalla parte compressa, e gli altri si aggiungono dall'elenco della barra. Lo stato parte da in corso; rimuoverlo cancella anche quel valore predefinito, e Reimposta lo ripristina. I valori sono conservati sia nell'indirizzo sia in questo browser, e prevale l'indirizzo; la compressione scelta viene ricordata." }
  - { text: "Folded, starting closed", translation: "Comprimibile, inizialmente compresso" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "Compresso all'inizio. Il filtro di testo fissato, Applica e Reimposta restano fuori dalla parte compressa. L'etichetta parte dal suo valore predefinito, bug, finché non viene cambiata, e Reimposta ripristina il valore predefinito." }
  - { text: In a dialog, translation: In una finestra di dialogo }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "I controlli si aprono in una piccola finestra di dialogo da un pulsante che conta i filtri con un valore, e si chiudono con Fine. La finestra aperta fa parte dell'indirizzo, quindi un link la apre. Il filtro di testo fissato resta accanto al pulsante, e i chip riassumono ciò che è scelto." }
  - { text: In a drawer, translation: In un cassetto }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "I controlli si aprono in un cassetto dal bordo iniziale, che un clic all'esterno non chiude. I valori digitati si applicano dopo una pausa." }
  - { text: In a popover, translation: In un popover }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "I controlli si aprono in un riquadro sotto il pulsante, allineato alla sua fine; sotto la soglia, in un foglio dal basso." }

