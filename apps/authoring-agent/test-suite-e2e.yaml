kind: Telo.Application
metadata:
  name: AuthoringAgentE2ESuite
  version: 1.0.0
  description: |
    The authoring agent's own tests. Separate from the repo suite because they
    drive a real model against the live hub and import the standard library from
    the checkout by relative path. Needs ANTHROPIC_API_KEY;
    the cases skip themselves when it is unset.
variables:
  include:
    type: array
    items: { type: string }
    arg: include
    description: Glob pattern selecting the test manifests to run, relative to this file.
    default: ["chat/tests/*.yaml"]
  exclude:
    type: array
    items: { type: string }
    arg: exclude
    description: Glob pattern excluding test manifests, relative to this file.
    default: ["**/__fixtures__/**"]
  filter:
    type: string
    arg: { position: 0 }
    description: Run only the tests whose path contains this text.
    default: ""
  concurrency:
    type: integer
    minimum: 1
    arg: concurrency
    description: How many tests run at once.
    default: 3
imports: { Test: oci://ghcr.io/telorun/test@0.14.1#sha256-XLWIbdY4Hzp6jRAXgBfPJXC8KBR72jTHolAAxdhA_ZM }
targets:
  - !ref runAll
---
kind: Test.Suite
metadata: { name: runAll }
include: !cel "variables.include"
exclude: !cel "variables.exclude"
filter: !cel "variables.filter"
concurrency: !cel "variables.concurrency"
