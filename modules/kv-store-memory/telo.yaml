kind: Telo.Library
metadata:
  name: KeyValueStoreMemory
  version: 0.5.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Storage]
  description: |
    In-process key/value storage with atomic conditional writes, held in the running
    process's memory. The atomicity holds within one process only — records are not
    shared between instances and do not survive a restart — so it fits development,
    tests and single-process runs.
imports:
  KvStore: ../kv-store
exports:
  kinds:
    - Store
---
kind: Telo.Definition
metadata:
  name: Store
  description: >-
    Stores records in the process's own memory, where conditional writes are atomic
    within that one process. Nothing is shared between instances or survives a
    restart, and a ceiling on retained records fails loudly rather than dropping one.
capability: Telo.Provider
extends: KvStore.Store
controllers:
  - pkg:telo/local/js?path=./nodejs/store.mjs&local_path=./nodejs/src/store.ts#store
schema:
  type: object
  additionalProperties: false
  properties:
    maxEntries:
      title: Max Entries
      type: integer
      minimum: 1
      default: 100000
      description: >-
        Safety ceiling on retained records, so a runaway key space cannot
        exhaust memory in a long-running dev process. Reaching it is an error,
        NOT a silent eviction — dropping a record would break the non-eviction
        guarantee this store exists to provide.
