kind: Telo.Library
metadata:
  name: SQL
  version: 0.22.1
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Storage]
  description: >-
    SQL database access independent of the engine: run queries and mutations with
    parameters bound safely, build a SELECT from structured parts instead of raw text,
    group writes into an all-or-nothing transaction, and apply versioned schema
    migrations at start-up.
requires:
  # The zone-attribute object form of `x-telo-provides-zone` is syntax an older
  # analyzer reads as a malformed annotation, so it would reject this module and
  # blame its author. Declaring the floor turns that into one message naming the
  # cause. Forward-declared: 0.79.0 is the release that carries the form.
  # 0.82.0: controllers return their effects from `init()` / `run()`; a runtime
  # that does not execute a returned chain allocates nothing and undoes nothing.
  telo: ">=0.82.0"
exports:
  kinds:
    - Connection
    - Query
    - Command
    - Transaction
    - Selection
    - Table
    - Schema
  # The entry point a dependent module's controller bundle resolves
  # `@telorun/sql` to, so this module's code is one module scope across every
  # consumer instead of a copy inlined into each of their bundles.
  code:
    - specifier: "@telorun/sql"
      format: js
      path: ./nodejs/sql.mjs
      source: ./nodejs/src/index.ts
---
# Sql.Connection — the abstract database handle every driver implements. A
# Telo.Provider: a configured connection to a backend, NOT an operation you
# invoke. Consumers (Sql.Query / Sql.Command / Sql.Selection / Sql.Transaction,
# and each backend's Schema kind) reference it via `x-telo-ref: Self.Connection` and a
# concrete implementation (SqlPostgres.Connection / SQLite.Connection)
# satisfies the ref. Each implementation also fixes the driver-native bind
# placeholder style, so inline `${{ }}` parameters in queries are dialect-neutral.
kind: Telo.Abstract
metadata:
  name: Connection
  description: >-
    A configured, long-lived handle to a database, held by the operations that read
    and write through it rather than invoked itself. Each engine supplies its own,
    fixing the native parameter-binding style so statements written against it stay
    engine-neutral.
capability: Telo.Provider
---
kind: Telo.Definition
metadata:
  name: Query
  description: >-
    Runs a query that reads rows back and returns them with a row count. Values
    interpolated into the statement are bound as parameters rather than spliced into
    the text, so queries stay injection-safe, and the query can join an open
    transaction.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/sql.mjs&local_path=./nodejs/src/index.ts#SqlQueryController
schema:
  type: object
  description: >-
    Runs a SQL query and returns the result rows; `result.rowCount` is the
    number of rows returned. Use for `SELECT` (and PostgreSQL `… RETURNING`).
    For mutations with no row result, use `Sql.Command`.
  properties:
    connection:
      title: Connection
      description: Reference to the SQL connection resource.
      x-telo-ref:
        kind: Self.Connection
        use: dependency
    transaction:
      title: Transaction
      description: Reference to the SQL transaction resource.
      x-telo-ref:
        kind: Self.Transaction
        use: dependency
      x-telo-requires-zone:
        zone: Self.Transaction
        key: [/connection, /transaction/connection]
        reason: the query would execute outside any transaction
    inputs:
      title: Inputs
      description: Query parameters supplied at invocation time.
      type: object
      examples:
        - sql: SELECT id, name, age FROM users WHERE id = ?
          bindings:
            - !cel "request.params.id"
        - sql: !sql "SELECT id, name FROM users WHERE id = ${{ request.params.id }}"
      properties:
        sql:
          title: SQL
          type: string
          description: >-
            SQL query text. Inline CEL interpolations are bound as parameters,
            not spliced into the text — dialect-neutral and injection-safe (the
            connection emits its own native placeholder). Embed values, not
            whole statements: a `!sql` whose entire body is a single
            interpolation binds that value as one parameter, not as SQL. On
            SQLite exactly one statement is allowed (single prepared statement);
            PostgreSQL accepts multiple.
          contentMediaType: application/sql
          x-telo-widget: code
        bindings:
          title: Bindings
          type: array
          description: >-
            Escape hatch for hand-written placeholders — SQLite anonymous `?`,
            PostgreSQL numbered `$1`, `$2`, …. When set, `sql` is used verbatim
            and these values bind positionally. Prefer inline interpolation in
            `sql` instead (binds automatically, dialect-neutral); do not combine
            the two. This is a regular YAML array — write one element per
            placeholder, and tag each element that needs a dynamic value with
            its own scalar `!cel` leaf. Do NOT build the whole array as a single
            inline CEL list literal (`!cel "[a, b, c]"`); CEL requires list
            literals to be homogeneously typed, so a mixed list of a string and
            a number fails the type checker. Per-element `!cel` leaves sidestep
            that entirely. Each value is passed to the driver as-is; drivers
            accept only primitives (string, number, bigint, null, bytes).
            Serialize an object/array first, e.g. `!cel "json(request.body)"`,
            before storing it in a TEXT/JSON column.
          examples:
            - - !cel "request.body.email"
              - !cel "json(request.body.profile)"
              - !cel "request.body.age"
      required: [sql]
---
kind: Telo.Definition
metadata:
  name: Command
  description: >-
    Executes a statement that changes data — insert, update, delete — and reports how
    many rows it affected, without reading rows back. Interpolated values bind as
    parameters instead of being spliced into the text, and the statement can join an
    open transaction.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/sql.mjs&local_path=./nodejs/src/index.ts#SqlCommandController
schema:
  type: object
  description: >-
    Executes a SQL statement and reports rows affected; `result.rowCount`
    comes from the driver's affected-row count and `result.rows` is empty
    unless the statement returns rows. Use for `INSERT` / `UPDATE` / `DELETE`
    without `RETURNING`. To read rows back, use `Sql.Query`.
  properties:
    connection:
      title: Connection
      description: Reference to the SQL connection resource.
      x-telo-ref:
        kind: Self.Connection
        use: dependency
    transaction:
      title: Transaction
      description: Reference to the SQL transaction resource.
      x-telo-ref:
        kind: Self.Transaction
        use: dependency
      x-telo-requires-zone:
        zone: Self.Transaction
        key: [/connection, /transaction/connection]
        reason: the statement would execute outside any transaction
    inputs:
      title: Inputs
      description: Statement parameters supplied at invocation time.
      type: object
      examples:
        - sql: INSERT INTO users (id, name, age) VALUES (?, ?, ?)
          bindings:
            - !cel "request.body.id"
            - !cel "request.body.name"
            - !cel "request.body.age"
        - sql: !sql "DELETE FROM users WHERE id = ${{ request.params.id }}"
      properties:
        sql:
          title: SQL
          type: string
          description: >-
            SQL statement text. Inline CEL interpolations are bound as
            parameters, not spliced into the text — dialect-neutral and
            injection-safe (the connection emits its own native placeholder).
            Embed values, not whole statements: a `!sql` whose entire body is a
            single interpolation binds that value as one parameter, not as SQL.
            On SQLite exactly one statement is allowed (single prepared
            statement); PostgreSQL accepts multiple.
          contentMediaType: application/sql
          x-telo-widget: code
        bindings:
          title: Bindings
          type: array
          description: >-
            Escape hatch for hand-written placeholders — SQLite anonymous `?`,
            PostgreSQL numbered `$1`, `$2`, …. When set, `sql` is used verbatim
            and these values bind positionally. Prefer inline interpolation in
            `sql` instead (binds automatically, dialect-neutral); do not combine
            the two. This is a regular YAML array — write one element per
            placeholder, and tag each element that needs a dynamic value with
            its own scalar `!cel` leaf. Do NOT build the whole array as a single
            inline CEL list literal (`!cel "[a, b, c]"`); CEL requires list
            literals to be homogeneously typed, so a mixed list of a string and
            a number fails the type checker. Per-element `!cel` leaves sidestep
            that entirely. Each value is passed to the driver as-is; drivers
            accept only primitives (string, number, bigint, null, bytes).
            Serialize an object/array first, e.g. `!cel "json(request.body)"`,
            before storing it in a TEXT/JSON column.
          examples:
            - - !cel "request.body.email"
              - !cel "json(request.body.profile)"
              - !cel "request.body.age"
      required: [sql]
---
kind: Telo.Definition
metadata:
  name: Transaction
  description: >-
    Wraps a body of work in a database transaction: opens one, runs the work, then
    commits on success or rolls back if it fails. Queries and statements join it by
    reference, so a group of writes becomes all-or-nothing.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/sql.mjs&local_path=./nodejs/src/index.ts#SqlTransactionController
schema:
  type: object
  required:
    - connection
    - steps
  properties:
    connection:
      title: Connection
      description: Reference to the SQL connection resource.
      x-telo-ref:
        kind: Self.Connection
        use: dependency
    steps:
      title: Steps
      description: Resource executed inside the transaction.
      x-telo-ref:
        # Telo.Executable, not Telo.Invocable: a Run.Sequence body is the whole
        # point, and the direct-statement shape the narrower constraint allowed
        # is an init-order cycle against the statement's own `transaction:` ref.
        kind: Telo.Executable
        use: call
        inputs: /inputs
      x-telo-provides-zone:
        key: /connection
        # What the region GUARANTEES about its contents, in the closed
        # zone-attribute vocabulary (`sdk/zone-attributes/`). Each value is the
        # reason, quoted verbatim by whatever enforces it.
        atomic: >-
          a rollback discards these writes, so a consumer that recorded them
          individually would be holding records of work the database erased
        noSuspend: >-
          the transaction holds this connection open, and a body that parked here
          would resume in a process where neither the connection nor the
          transaction exists
    inputs:
      title: Inputs
      type: object
      additionalProperties: true
      description: >-
        Inputs forwarded to the steps resource at invoke time. CEL here reads the
        caller's invocation input as `inputs.<field>` — the same variable a
        Run.Sequence step's inputs read.
      x-telo-context:
        type: object
        properties:
          inputs: {}
---
kind: Telo.Definition
metadata:
  name: Selection
  description: >-
    Builds and runs a query from structured parts instead of raw text — table,
    columns, filters, grouping, ordering, distinct, limit and offset. Filter values
    and paging come from the call's inputs and bind as parameters, so the query stays
    visually editable and injection-safe.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/sql.mjs&local_path=./nodejs/src/index.ts#SqlSelectionController
schema:
  type: object
  required: [from]
  examples:
    - from: users
      columns: [id, name, email, created_at]
      where:
        - { column: deleted_at, op: is_null }
        - { column: status, op: eq, value: active }
      orderBy:
        - { column: created_at, direction: desc }
      limit: 50
  properties:
    connection:
      title: Connection
      description: Reference to the SQL connection resource.
      x-telo-ref:
        kind: Self.Connection
        use: dependency
    transaction:
      title: Transaction
      description: Reference to the SQL transaction resource.
      x-telo-ref:
        kind: Self.Transaction
        use: dependency
      x-telo-requires-zone:
        zone: Self.Transaction
        key: [/connection, /transaction/connection]
        reason: the selection would execute outside any transaction
    from:
      title: From
      description: Table name to select from.
      type: string
      x-telo-eval: compile
    columns:
      title: Columns
      description: Column names or expressions to select.
      type: array
      x-telo-eval: compile
    distinct:
      title: Distinct
      description: Whether to return only distinct rows.
      type: boolean
      x-telo-eval: compile
    distinctOn:
      title: Distinct On
      description: PostgreSQL DISTINCT ON column list.
      type: array
      items:
        title: Distinct On Column
        description: Column name used in DISTINCT ON.
        type: string
      x-telo-eval: compile
    where:
      title: Where
      description: Structured where clauses.
      type: array
      x-telo-context:
        type: object
        properties:
          inputs: {}
      items:
        title: Where Clause
        description: Single where clause object.
        type: object
    groupBy:
      title: Group By
      description: Columns used for grouping.
      type: array
      items:
        title: Group By Column
        description: Column name used for grouping.
        type: string
      x-telo-eval: compile
    having:
      title: Having
      description: Structured having clauses.
      type: array
      x-telo-context:
        type: object
        properties:
          inputs: {}
      items:
        title: Having Clause
        description: Single having clause object.
        type: object
    orderBy:
      title: Order By
      description: Ordering rules for selected rows.
      type: array
      x-telo-eval: compile
      items:
        title: Order By Entry
        description: Single ordering rule.
        type: object
        properties:
          column:
            title: Column
            description: Column name to order by.
            type: string
          direction:
            title: Direction
            description: Sort direction.
            type: string
            enum: [asc, desc]
    limit:
      title: Limit
      description: Maximum number of rows returned.
      x-telo-context:
        type: object
        properties:
          inputs: {}
    offset:
      title: Offset
      description: Number of rows skipped before returning results.
      x-telo-context:
        type: object
        properties:
          inputs: {}
    inputType:
      title: Input Type
      description: Named type reference or inline type definition for invocation inputs.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    outputType:
      title: Output Type
      description: Named type reference or inline type definition for invocation outputs.
      x-telo-ref:
        kind: Telo.Type
        use: schema
---
# Sql.Table — a declared table. The abstract carries no column vocabulary,
# deliberately: a neutral type language is a lowest-common-denominator one,
# which is the ORM abstraction this design rejects. What crosses the boundary
# instead is a JSON Schema projection of the row, declared as data by each
# backend, so a consumer can type a row without anything here learning that
# `citext` exists.
kind: Telo.Abstract
metadata:
  name: Table
  description: >-
    One declared database table — its columns, indexes and foreign keys stated as
    what the table IS rather than as the steps that built it. Each engine supplies
    its own, in its own full type vocabulary, and projects the row shape to JSON
    Schema so consumers can type the rows they read.
capability: Telo.Provider
# The STRUCTURAL half of a table declaration, and only that half: the fields
# `normalizeTable` reads to decide whether the declaration is coherent. Every
# engine restates each of these in its own full vocabulary — a column's `type:`
# and its parameters are the backend's, and a child's `properties` entry replaces
# the parent's wholesale — so nothing here constrains what an engine may declare.
#
# It exists so the cross-field rules below can live here ONCE. They are checks on
# relationships the shared reconciler enforces at boot for every backend
# (`validateTable`), so declaring them per backend means each new engine silently
# ships without them: the identical manifest was two `telo check` errors on
# Postgres and clean on SQLite, which is precisely the failure the rules exist to
# move earlier. Same reasoning as `Sql.Schema`'s reclaim warning, which is
# already declared once for every backend.
schema:
  type: object
  properties:
    table:
      title: Table
      description: The physical table name.
      type: string
    columns:
      title: Columns
      description: >-
        Columns keyed by name. The key is the column's identity, which is what a
        rename is stated against.
      type: object
    indexes:
      title: Indexes
      description: Indexes keyed by name, which is their durable identity.
      type: object
    foreignKeys:
      title: Foreign Keys
      description: Foreign keys keyed by name, which is their durable identity.
      type: object
  # `condition` is TRUE when the rule holds; `this` is the element `in:` iterates
  # and `key` its map key, `self` the whole table. Each is decidable by reading
  # the YAML, and otherwise only at boot — several of them after
  # `beforeMigrations:` has already changed the database.
  x-telo-resource-rules:
    - in: /indexes
      condition: !cel "this.columns.all(c, c in self.columns)"
      code: SQL_INDEX_UNKNOWN_COLUMN
      message: >-
        names a column this table does not declare. The index cannot be created,
        and the engine's complaint would name a generated statement.
    - in: /foreignKeys
      condition: !cel "this.columns.all(c, c in self.columns)"
      code: SQL_FOREIGN_KEY_UNKNOWN_COLUMN
      message: names a column this table does not declare.
    - in: /foreignKeys
      condition: !cel "size(this.columns) == size(this.references.columns)"
      code: SQL_FOREIGN_KEY_ARITY_MISMATCH
      message: >-
        lists a different number of columns on each side. A foreign key maps its
        columns one for one.
    - in: /columns
      condition: !cel "this.?renamedFrom.orValue('') != key"
      code: SQL_RENAME_FROM_SELF
      message: declares renamedFrom itself, which describes no rename.
    - in: /columns
      condition: !cel "!(this.?renamedFrom.orValue('') in self.columns)"
      code: SQL_RENAME_SOURCE_STILL_DECLARED
      message: >-
        renames from a column this table also declares. A rename's source is the
        column being retired, so declaring both would copy one live column into
        another and retire neither.
    - condition: !cel "size(self.columns.filter(c, self.columns[c].?primaryKey.orValue(false))) <= 1"
      code: SQL_COMPOSITE_PRIMARY_KEY
      message: >-
        marks more than one column as primaryKey. A composite primary key is not
        expressible as a per-column flag — declare one column as the key, or
        create the constraint in a 'migrations:' entry.
---
# Sql.Schema — the backend-neutral half of a schema resource, and only that
# half. Tables, migrations, the statement vocabulary and the runner are the
# backend's; what a `!ref` to this abstract buys is the grace-window surface —
# the clock an irreversible drop is gated on, the policy gating it, and the
# observed state reporting what is still held. Contracting the full field
# vocabulary would be two backends re-declaring identical fields with no
# polymorphic use.
kind: Telo.Abstract
metadata:
  name: Schema
  description: >-
    Brings a database to the declared schema at start-up and reclaims what has been
    removed only once it is provably safe. Removal is recorded rather than executed:
    an object dropped from the declaration is held until a stated number of released
    versions and a stated time have passed, and is reported with its remaining budget
    until then.
capability: Telo.Runnable
schema:
  type: object
  properties:
    version:
      title: Version
      description: >-
        The released version this deployment is running, conventionally
        `!cel "module.version"`. It is the clock reclamation is gated on: the
        number of distinct versions observed since an object went missing is the
        primary eligibility signal. Required when `reclaim:` is declared, and
        read by nothing else — an app that only runs migrations declares neither. Written by the author rather than injected,
        because `module.*` is scoped to the DECLARING module — a schema resource
        inside a library would silently clock on the library's version — and this
        value gates an irreversible drop.
      type: string
      x-telo-eval: compile
    ledger:
      title: Ledger
      description: >-
        Names the history this schema keeps — its applied migrations, its observed
        versions and its tombstones — as `telo_schema_<ledger>_*` tables in the
        namespace. Omitted, they are `telo_schema_*`.

        Two schema resources over one namespace MUST name different ledgers: the
        ledger records what its schema DECLARES, so a shared one would make each
        read the other's tables as removed and eventually drop them. This is the
        same separation `flyway.table` and Alembic's `version_table` provide, and
        it has the property an identity column would not: because it is written
        down, renaming the resource that declares it changes nothing.

        Durable identity — changing it abandons the history under the old name,
        so every migration re-runs against the new one.
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    reclaim:
      title: Reclaim
      description: >-
        When a tombstoned object may actually be dropped. Both conditions must
        hold. Declaring no policy means nothing is ever dropped, so reclamation is
        opt-in by declaration; the ledger still records tombstones and reports what
        would be eligible through observed state.
      type: object
      additionalProperties: false
      required: [afterVersions, afterDuration]
      properties:
        afterVersions:
          title: After Versions
          description: >-
            How many distinct released versions must be observed after the object
            went missing. A rollback resets this count rather than pausing it:
            booting a version seen at or before the removal proves older code is
            still live.
          type: integer
          minimum: 1
        afterDuration:
          title: After Duration
          description: >-
            How much time must pass after the object went missing (`30d`, `12h`).
            The backstop to `afterVersions`, since several versions can land in an
            afternoon. `0ms` switches it off, leaving `afterVersions` alone to gate
            an irreversible drop — allowed, and reported at boot when it happens.
          type: string
          pattern: "^\\s*\\d+(\\.\\d+)?\\s*(ms|s|m|h|d)\\s*$"
  # The version is the reclamation clock and nothing else reads it, so an
  # implementation must require it exactly when a policy is declared.
  dependencies:
    reclaim: [version]
  # `0ms` is legal — the tests need it, and an author may genuinely want
  # `afterVersions` alone gating the drop — but it switches off the backstop that
  # exists because several releases can land in an afternoon. Said out loud
  # rather than passing silently. Inherited by every backend's Schema kind,
  # which extends this abstract without declaring rules of its own.
  x-telo-resource-rules:
    - condition: !cel "!has(self.reclaim) || self.reclaim.afterDuration != '0ms'"
      code: SQL_RECLAIM_DURATION_DISABLED
      severity: warning
      message: >-
        sets reclaim.afterDuration to 0ms, switching off the time backstop. An
        object removed from the declaration is then dropped as soon as
        afterVersions is met, which several releases in one afternoon can reach.
status:
  type: object
  properties:
    version:
      title: Version
      description: The version recorded for this boot.
      type: string
    digest:
      title: Digest
      description: Digest of the declaration this boot reconciled to.
      type: string
    sequence:
      title: Sequence
      description: This version's position in the observed deployment sequence.
      type: integer
    migrationsApplied:
      title: Migrations Applied
      description: Migration keys applied by this boot, in the order they ran.
      type: array
      items: { type: string }
    orphanedMigrations:
      title: Orphaned Migrations
      description: >-
        Applied keys with no declaration left. Reported, never an error — deleting
        decade-old migrations from a manifest is normal.
      type: array
      items: { type: string }
    tombstoned:
      title: Tombstoned
      description: Objects this boot recorded as removed. No DDL was emitted for them.
      type: array
      items: { type: string }
    revived:
      title: Revived
      description: Tombstoned objects the declaration brought back, so their budget is discarded.
      type: array
      items: { type: string }
    inertRenames:
      title: Inert Renames
      description: >-
        `renamedFrom:` mentions that can no longer do anything — the source column
        is neither present nor held by a tombstone, so the rename has finished
        everywhere and the mention is dead manifest text that can be deleted.
      type: array
      items: { type: string }
    reclaimed:
      title: Reclaimed
      description: Objects dropped by this boot, having aged out of the declared policy.
      type: array
      items: { type: string }
    pendingReclamation:
      title: Pending Reclamation
      description: >-
        Every tombstone still held, with what is left of its budget — so what the
        schema is holding, and for how much longer, is visible without invoking
        anything.
      type: array
      items:
        type: object
        properties:
          object:
            title: Object
            type: string
          missingSinceVersion:
            title: Missing Since Version
            type: string
          versionsRemaining:
            title: Versions Remaining
            description: Null when no policy is declared — nothing is ever dropped, so there is no budget.
            type: [integer, "null"]
          msRemaining:
            title: Ms Remaining
            description: Null when no policy is declared.
            type: [integer, "null"]
          eligible:
            title: Eligible
            type: boolean
          unreclaimable:
            title: Unreclaimable
            description: >-
              Present when this engine cannot drop an object of this kind at all.
              The tombstone stands and this says what has to happen instead —
              attempting it would fail this boot and, since the tombstone stays
              eligible, every boot after it.
            type: [string, "null"]
