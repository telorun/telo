modules:
  apps/hub: Added
body: "The hub is now a composition root over six libraries — schema, origin, ingest,
  search, catalog and registry — each handed the one connection, bucket, embedder,
  vector index and shell host it needs, so a change is read against one concern instead
  of a 2600-line file. Ingest is a durable run per module version: the manifest read,
  the bucket write and the relational writes are recorded step by step, the writes
  commit as one transaction on the connection the journal records through, and a
  transient origin failure parks rather than sleeps. POST /register answers 202 and
  schedules the work instead of ingesting inside an anonymous request; GET
  /register/status?ref= reports progress. A new version_ingest table decides what is due
  and mints each attempt's identity in one write, so two concurrent passes collapse to
  one run and a failed attempt never burns the id its retry needs. TRACK_INTERVAL and
  TRACK_LOOP are replaced by TRACK_CRON and TRACK_ENABLED, and INGEST_REV is the
  whole-registry re-ingest control."
