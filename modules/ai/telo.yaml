kind: Telo.Library
metadata:
  name: AI
  version: 0.28.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [AI]
  description: |
    Language and image models over any provider: buffered text, token-by-token
    streaming, prompt-to-picture generation and editing, and a tool-use agent loop
    that calls the model, runs the tools it asks for, and replays their results until
    it settles. Tools wrap ordinary resources, exposed as a static list or discovered
    at runtime.
# An agent's `context` input is typed by `x-telo-value-schema-from` inside its
# contract, which no runtime before 0.107.0 derives: an older one reads the file
# and leaves the caller data its tool providers declare unchecked, and refuses a
# model call whose `messages` is computed.
requires:
  telo: ">=0.107.0"
imports:
  Run: ../run
  Stream: ../stream
exports:
  kinds:
    - Model
    - ModelStream
    - Buffered
    - Text
    - TextStream
    - ToolProvider
    - Tools
    - Agent
    - AgentStream
    - ImageModel
    - Image
  resources:
    - AgentStreamPart
  # The entry point a dependent module's controller bundle resolves
  # `@telorun/ai` to, so this module's code is one module scope across every
  # consumer instead of a copy inlined into each of their bundles.
  code:
    - specifier: "@telorun/ai"
      format: js
      path: ./nodejs/ai.mjs
      source: ./nodejs/src/index.ts
---
# Ai.Message — one turn of a conversation.
#
# Declared once and referenced everywhere rather than restated per kind: it was
# copied verbatim into four consumers' inputTypes, which is four places for a
# new role or content type to be added in three of them.
kind: Telo.JsonSchema
metadata:
  name: Message
  description: One conversation turn — a role, its content as text or parts, and the tool-call bookkeeping that links an assistant's request to the result fed back to it.
schema:
  type: object
  additionalProperties: false
  required: [role, content]
  properties:
    role:
      type: string
      enum: [system, user, assistant, tool]
    content:
      description: >-
        The turn's content: a plain string, or parts when it carries anything other
        than text.
      anyOf:
        - type: string
        - type: array
          minItems: 1
          # A shape names a sibling shape by its canonical id: that is the form a
          # static check follows from inside a shape, so a literal part is judged
          # where it is written and not only at dispatch.
          items: { $ref: "telo:AI/ContentPart" }
    toolCalls:
      description: On an assistant turn, the calls the model asked for.
      type: array
      items: !ref ToolCall
    toolCallId:
      description: On a tool turn, which requested call this is the result of.
      type: string
---
kind: Telo.JsonSchema
metadata:
  name: ToolCall
  description: One tool invocation a model asked for — its id, the tool's name, and the arguments to call it with.
schema:
  type: object
  additionalProperties: false
  required: [id, name, arguments]
  properties:
    id:
      type: string
      description: The provider's id for this call, echoed back on the tool turn carrying its result.
    name: { type: string }
    arguments:
      description: The call's arguments, as the model produced them.
      type: object
      additionalProperties: true
---
# Ai.ContentPart — what a turn can be made of, in one vocabulary.
#
# MODALITY LIVES HERE, not in kind names. A model returning a picture is an
# image part in an ordinary completion; it is not a different kind of model.
# That is what stops the abstract multiplying per modality as providers add
# audio, video and documents.
#
# SHAPE lives here too, and only here: what each `type` must carry is declared
# below and enforced by the contract of whatever takes a message, so no
# operation re-checks a part by hand. Whether a model can CARRY a well-formed
# part is a different question, answered by the model.
#
# One flat object with a `type` discriminator: every property is declared once
# at the root, and the branches beside them only say which a type requires. The
# bytes stay out of the branches, since a union with an instance branch is
# exactly the shape a reader that does not know the value-type vocabulary
# mis-reads.
kind: Telo.JsonSchema
metadata:
  name: ContentPart
  description: One piece of a conversation turn — text, an image, audio, video, a document, a tool call, reasoning, a citation or a refusal. A media part carries its media type and either its bytes or an absolute URI to them, plus an optional file name, so a document is a matter of value rather than of a separate kind. A part a caller sends may mark a prompt-cache breakpoint.
schema:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type:
      type: string
      enum:
        - text
        - image
        - audio
        - video
        - file
        # Output-only from here down: a model produces these, a caller does not
        # send them.
        - tool-call
        - reasoning
        - citation
        - refusal
    text:
      type: string
      description: The text of a `text`, `reasoning` or `refusal` part.
    data:
      description: >-
        A media part's bytes — raw bytes at runtime, or base64 when a manifest
        authored them. Both spellings are legitimate and the distinction is the
        producer's, so the slot is a union rather than either one. Never beside
        `uri`.
      # `anyOf`, not `oneOf`: a reader that does not know `x-telo-type` sees the
      # byte branch as an empty schema, which MATCHES — so under `oneOf` a plain
      # base64 string would match both branches and fail, while under `anyOf` it
      # degrades to accepting. That is the documented rule, and it is why leaving
      # this untyped bought nothing.
      anyOf:
        - x-telo-type: Telo.Bytes
        - type: string
    uri:
      type: string
      description: >-
        Where a media part's bytes live, when they are referenced rather than
        carried: an absolute URI, passed to the model as written and never
        fetched here. Never beside `data`, and never a `data:` URI — bytes in
        hand go in `data`.
      # Two patterns and no lookahead, which not every regex engine has: the
      # first requires a scheme, the second refuses the one scheme that is bytes.
      allOf:
        - pattern: "^[A-Za-z][A-Za-z0-9+.-]*:"
        - pattern: "^([^Dd]|[Dd][^Aa]|[Dd][Aa][^Tt]|[Dd][Aa][Tt][^Aa]|[Dd][Aa][Tt][Aa][^:])"
    mediaType:
      type: string
      description: The media part's IANA media type, e.g. `image/png`.
    name:
      type: string
      description: A media part's file name, e.g. `report.pdf`.
    # The call a `tool-call` part carries.
    toolCall: !ref ToolCall
    citation:
      description: What a `citation` part points at.
      type: object
      additionalProperties: true
    cacheBreakpoint:
      type: boolean
      description: >-
        Marks a prompt-cache breakpoint: the request from its start through this
        part — the tools and system prompt before it included — is a prefix the
        caller expects to send again unchanged. A hint, never a requirement: a
        model that caches on its own ignores it, one that takes a limited number
        honours the last ones in request order, and the answer is the same either
        way. `false` is the same as absent. Only on a part a caller sends — text,
        image, audio, video or file.
  # What each `type` must carry, as one branch per group of types. A branch names
  # its types and requires `type`, so a part is judged by the branch it plainly is.
  # A part a model produces forbids `cacheBreakpoint` with a `false` property, so
  # the finding names the key.
  anyOf:
    - required: [type, text]
      properties:
        type: { const: text }
    - required: [type, text]
      properties:
        type: { enum: [reasoning, refusal] }
        cacheBreakpoint: false
    - required: [type, toolCall]
      properties:
        type: { const: tool-call }
        cacheBreakpoint: false
    - required: [type, citation]
      properties:
        type: { const: citation }
        cacheBreakpoint: false
    - required: [type, mediaType]
      properties:
        type: { enum: [image, audio, video, file] }
      # Exactly one of the two: one is required, and `uri` is forbidden beside
      # `data` with a `false` property, so the finding names the key at fault.
      anyOf:
        - required: [data]
        - required: [uri]
      dependencies:
        data:
          properties:
            uri: false
---
# SystemPrompt — what the four operations take as `system`.
#
# Text, or text parts: the list form exists so the prompt can carry a cache
# breakpoint, which a string has nowhere to hold. An agent's largest stable
# prefix is its tools plus its system prompt, and a breakpoint on a later user
# message does not cover it.
#
# Named by `!ref` in each operation's input contract — the form that carries the
# shape into an importer's analysis. Each operation's resource field holds a
# copy written inline, with the text part written out too, which the module's
# unit test holds to this shape and to ContentPart.
kind: Telo.JsonSchema
metadata:
  name: SystemPrompt
  description: A system prompt — plain text, or a non-empty list of text parts when one of them marks a prompt-cache breakpoint.
schema:
  anyOf:
    - type: string
      contentMediaType: text/markdown
      x-telo-widget: code
    - type: array
      minItems: 1
      items:
        allOf:
          - $ref: "telo:AI/ContentPart"
          - properties:
              type: { const: text }
---
# Ai.StreamPart — the same content, arriving in pieces.
#
# `finish` is the ONLY terminal part. A failure mid-stream rejects the iteration
# with a structured error rather than yielding one, because an error part must
# be remembered by every drainer and one that forgets truncates silently. A
# thrown error also reaches machinery a data part cannot: `catches:`, a throws
# union, a `try:` step.
#
# The field names here are load-bearing beyond this repo: an editor reading a
# forwarded stream keys on `text-delta.delta`, `tool-call.toolCall` and
# `finish.usage`. Renaming one of those is a breaking change to every consumer
# of a forwarded stream, with nothing in this repo to catch it.
#
# `tool-call-delta` is ADVISORY: a call's arguments as they are written, for a
# consumer that shows them arriving. The whole `tool-call` always follows and is
# the only part a consumer must handle. The model implementation assigns the
# call's id — see Ai.ModelStream for what it owes a delta.
kind: Telo.JsonSchema
metadata:
  name: StreamPart
  description: One piece of a streamed completion — a text or reasoning delta, a completed content part, a fragment of a tool call's arguments as they are written, the whole tool call, opaque provider state, or the single terminal record carrying usage and the finish reason.
schema:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type:
      type: string
      enum: [text-delta, reasoning-delta, content-part, tool-call-delta, tool-call, provider-state, finish]
    delta:
      type: string
      description: >-
        The text a `text-delta` or `reasoning-delta` adds; on a `tool-call-delta`, the
        next fragment of the call's argument text. A call's fragments joined in order
        are the JSON of its arguments.
    toolCallId:
      type: string
      description: >-
        On a `tool-call-delta`, the id of the call being written — never empty, and
        equal to the `id` of the `tool-call` that completes it.
    toolName:
      type: string
      description: On a `tool-call-delta`, the name of the tool being called.
    part:
      description: The completed part a `content-part` carries.
      $ref: "telo://Self/ContentPart"
    toolCall:
      description: The call a `tool-call` part carries, once its arguments are complete.
      $ref: "telo://Self/ToolCall"
    providerState:
      description: >-
        Opaque provider state, carried so a following request can replay it. See
        Ai.Model's `providerState`.
    usage:
      description: Token accounting, on the terminal `finish` part.
      $ref: "telo://Self/TokenUsage"
    finishReason:
      description: Why generation ended, on the terminal `finish` part.
      $ref: "telo://Self/FinishReason"
---
# Ai.AgentStreamPart — what a streaming agent emits: the model's parts, plus what
# only the loop knows. `step-finish` closes EACH model call with that call's usage
# and finish reason, when its stream ends and before its tools run — a call a
# cancellation interrupts before its `finish` reports none. `tool-result` reports a tool the agent ran,
# or a call that was denied and never ran.
# `finish` is the one terminator, carrying the usage of every call summed and, when
# the step budget ended the run, `limit: max-steps`.
#
# `message` is the RECORD: one for every message the run appends to the
# conversation, where it is appended — an assistant turn after its `step-finish`,
# a tool message right after its `tool-result`, the final answer before `finish`.
# The caller's own messages followed by every `message` part, in order, is the
# conversation to hand the next run; nothing else has to be reassembled from the
# other parts. It is append-only, so tool messages arrive in completion order
# and each run puts them in call order when it builds a model request.
#
# A call that needs a decision: `tool-approval-decision` reports what the
# agent's approver answered, once per ask; a call nobody decided is named by a
# `tool-approval-request` after the turn's other calls have settled, and the
# `finish` that follows is marked `interrupt: approval`. A
# `tool-call` keeps its id for the whole run: the `tool-call-delta` parts that led
# to it, the assistant message that replays it and the `tool-result` answering it
# carry the same one. The tools of one model call run side by side, so their
# `tool-result` parts arrive in completion order. A `tool-result` carries
# both what the model saw (`content`) and what the tool returned (`output`), so a
# consumer never parses the rendering back. Exported so a consumer
# (a handler persisting a transcript) types the records it reads by `!ref`.
kind: Telo.JsonSchema
metadata:
  name: AgentStreamPart
  description: One event of a streamed tool-use run — a text or reasoning delta, a completed content part, a tool call and its arguments as they are written, a tool's result or denial, one model call's usage, a message to persist, an approval decision or request, opaque provider state, or the terminal record with total usage.
schema:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type:
      type: string
      enum:
        - text-delta
        - reasoning-delta
        - content-part
        - tool-call-delta
        - tool-call
        - provider-state
        - step-finish
        - tool-result
        - message
        - tool-approval-decision
        - tool-approval-request
        - finish
    delta:
      type: string
      description: >-
        The text a `text-delta` or `reasoning-delta` adds; on a `tool-call-delta`, the
        next fragment of the call's argument text. A call's fragments joined in order
        are the JSON of its arguments.
    toolCallId:
      type: string
      description: >-
        On a `tool-call-delta`, the id of the call being written — the `id` of the
        `tool-call` that completes it and the `toolCallId` of its `tool-result`.
    toolName:
      type: string
      description: On a `tool-call-delta`, the name of the tool being called.
    part:
      description: The completed part a `content-part` carries.
      $ref: "telo://Self/ContentPart"
    toolCall:
      description: >-
        The call a `tool-call` part carries, once its arguments are complete, and the
        call a `tool-approval-request` asks a decision on. Its id is the one its
        argument deltas, an approver's decision, the tool's result, the replayed
        assistant message and a caller's `approvals` entry carry.
      $ref: "telo://Self/ToolCall"
    message:
      description: >-
        On a `message` part, a message the run appended to the conversation: an
        assistant turn, a tool's result, or the final answer. The caller's input
        messages followed by every `message` part in order is the conversation to
        pass to the next run.
      $ref: "telo://Self/Message"
    approvalDecision:
      description: >-
        On a `tool-approval-decision`, what the agent's approver answered for one
        call. On `approve` the call's `tool-result` follows when the tool finishes;
        on `reject` a `tool-result` marked `denied` follows; on `defer` the call is
        named by a `tool-approval-request` before the run ends.
      type: object
      additionalProperties: false
      required: [toolCallId, name, decision]
      properties:
        toolCallId:
          type: string
          description: The id of the `tool-call` the decision is on.
        name:
          type: string
          description: The tool's name as the model saw it.
        decision:
          type: string
          enum: [approve, reject, defer]
        reason:
          type: string
          description: The approver's reason, when it gave one.
    providerState:
      description: >-
        Opaque provider state, forwarded as the model produced it. Pass it back as
        the next run's `providerState` input to continue the model's reasoning.
    usage:
      description: >-
        On a `step-finish`, what that model call consumed; on the terminal `finish`,
        the sum over every call.
      $ref: "telo://Self/Usage"
    finishReason:
      description: Why the call (`step-finish`) or the run (`finish`) ended.
      $ref: "telo://Self/FinishReason"
    limit:
      description: >-
        On the terminal `finish`, the bound that ended the run: `max-steps` when the
        step budget ran out before the model finished. Absent when the model finished
        on its own.
      type: string
      enum: [max-steps]
    interrupt:
      description: >-
        On the terminal `finish`, why the run stopped before the model finished:
        `approval` when tool calls are waiting for a decision. Continue by running
        again with the recorded messages and an `approvals` entry per call. Never
        beside `limit`.
      type: string
      enum: [approval]
    toolResult:
      description: >-
        What a `tool-result` part carries — the executed call's result, or the
        denial of a call that never ran.
      type: object
      additionalProperties: false
      required: [toolCallId, name, content]
      properties:
        toolCallId:
          type: string
          description: The id of the `tool-call` this answers.
        name:
          type: string
          description: The tool's name as the model saw it.
        content:
          description: What was fed back to the model — text, or content parts.
          anyOf:
            - type: string
            - type: array
              items:
                $ref: "telo://Self/ContentPart"
        output:
          description: >-
            The tool's own result, before any `result:` mapping shaped what the model
            was told — for a consumer that reads what the tool returned (a pulled file
            path, a check's exit code) rather than its rendering. Plain JSON; for an MCP
            tool, its structured content when it has one, otherwise its content parts.
            Present on a call that ran and succeeded; absent when `error` or `denied`
            is true. Never sent to the model.
        error:
          type: boolean
          description: True when the call failed and `content` is the error fed back.
        denied:
          type: boolean
          description: >-
            True when the call was decided against — by the caller or by the agent's
            approver — and never ran; `content` is what the model was told. A denial
            is not an error.
---
# Why generation ended. Declared once: it was restated in five places with four
# different value sets, so a value one kind produced was rejected by the next —
# `Ai.Text` admitted `error`, which no model can produce, and omitted
# `tool-calls`, which one can, making a tool-calling finish through it a bare
# ERR_OUTPUT_INVALID.
#
# `error` is deliberately absent. A failure REJECTS; a reason code saying "the
# answer failed" competes with the mechanism that already reports failure.
#
# Image generation keeps its own vocabulary — `Ai.ImageResult.finishReason` is a
# different set of outcomes, not a narrowing of this one.
kind: Telo.JsonSchema
metadata:
  name: FinishReason
  description: Why a model stopped generating — it finished, hit a length limit, was filtered, or asked for tools.
schema:
  type: string
  enum: [stop, length, content-filter, tool-calls, other]
---
# Two usage shapes, and the difference is WHO fills them.
#
# A PROVIDER reports the token triple, plus the two breakdowns its endpoint may
# give of it. The provider-neutral half — `unit` and `total`, the pair that lets one consumer
# sum spend across modalities — is stamped by the OPERATION, since the triple
# already carries the answer and deriving it centrally is what keeps every
# existing provider unchanged. So a model's declared output requires three
# fields and an operation's requires five; collapsing them would either make
# every provider report a figure it does not have, or drop the guarantee
# exactly where a consumer reads it.
kind: Telo.JsonSchema
metadata:
  name: TokenUsage
  description: What a request consumed in tokens, as a provider reports it — the prompt, completion and total counts, how many prompt tokens were served from a cache or written to one and how many completion tokens were spent reasoning when the endpoint says, optionally already carrying the provider-neutral unit and total.
schema:
  type: object
  additionalProperties: false
  required: [promptTokens, completionTokens, totalTokens]
  properties:
    promptTokens:
      type: integer
      minimum: 0
      description: >-
        The whole prompt, the shares read from a cache and written to one
        included.
    completionTokens: { type: integer, minimum: 0 }
    totalTokens: { type: integer, minimum: 0 }
    cachedPromptTokens:
      type: integer
      minimum: 0
      description: >-
        How many of `promptTokens` were read from a cache. Absent when the endpoint
        does not say, which is not the same as zero.
    cacheWritePromptTokens:
      type: integer
      minimum: 0
      description: >-
        How many of `promptTokens` were written to a cache on this call. Absent
        when the endpoint does not say, which is not the same as zero.
    reasoningTokens:
      type: integer
      minimum: 0
      description: >-
        How many of `completionTokens` were spent reasoning. Absent when the
        endpoint does not say, which is not the same as zero.
    unit:
      type: string
      description: What `total` counts. Stamped by the operation when a provider reports none.
    total: { type: number, minimum: 0 }
---
kind: Telo.JsonSchema
metadata:
  name: Usage
  description: What a request consumed, as an operation reports it — the prompt/completion token triple, the cached and cache-written shares of the prompt and the reasoning share of the completion when the model reports them, plus a provider-neutral unit and total so spend can be summed across modalities.
schema:
  type: object
  additionalProperties: false
  required: [promptTokens, completionTokens, totalTokens, unit, total]
  properties:
    promptTokens:
      type: integer
      minimum: 0
      description: >-
        The whole prompt, the shares read from a cache and written to one
        included.
    completionTokens: { type: integer, minimum: 0 }
    totalTokens: { type: integer, minimum: 0 }
    cachedPromptTokens:
      type: integer
      minimum: 0
      description: >-
        How many of `promptTokens` were read from a cache. Absent when the model
        does not report it, which is not the same as zero.
    cacheWritePromptTokens:
      type: integer
      minimum: 0
      description: >-
        How many of `promptTokens` were written to a cache on this call. Absent
        when the model does not report it, which is not the same as zero.
    reasoningTokens:
      type: integer
      minimum: 0
      description: >-
        How many of `completionTokens` were spent reasoning. Absent when the model
        does not report it, which is not the same as zero.
    unit:
      type: string
      description: What `total` counts, so a consumer can sum across modalities.
    total: { type: number, minimum: 0 }
---
# Ai.Model — the buffered model contract every provider implements.
#
# DECLARED, not a convention. It used to be a Telo.Provider with no schema and
# no types, whose `invoke` and `stream` were duck-typed JavaScript methods
# checked at the call site with a `typeof`. That made a provider necessarily
# TypeScript: nothing was statically checked, no non-Node kernel could host one,
# and every new endpoint shape was controller work.
#
# `Telo.Invocable` rather than `Telo.Provider` because a provider template is
# reached through `provide:`, which is parameterless — so per-call messages and
# tools have nowhere to enter, and a model could not be written as a manifest at
# all. Cancellation rides the InvokeContext the kernel passes as the second
# argument, never a `signal` inside the input: an AbortSignal is not declarable
# data.
#
# Buffered and streaming are TWO abstracts, not one. A live output is exempt
# from validation, so a single always-streaming contract would take the check
# away from the buffered path too — the one Ai.Text and Ai.Agent use, and the
# majority of calls. It also makes "this endpoint does not stream" expressible
# rather than faked as a one-element stream.
kind: Telo.Abstract
metadata:
  name: Model
  description: >-
    A language model called for a complete answer: messages and optional tools go in,
    the finished content, token usage and a finish reason come back. Providers
    implement it for their own endpoint; consumers hold one and call it.
capability: Telo.Invocable
# The failure ceiling. Every kind that extends this abstract restates the whole
# list — a kind with no `throws:` is read as throwing nothing — and may raise no
# code outside it, so a `catches:` written against the abstract holds for any
# provider. The code is the retry contract: rate-limited, unavailable, timeout,
# unreachable, tool-arguments-invalid and response-invalid may be tried again;
# the rest fail the same way until the request or the account changes. `status`
# is present only when an HTTP response carried the failure.
throws:
  codes:
    ERR_MODEL_ACCESS_DENIED:
      description: >-
        The credential was refused, or it has no permission for the model. Trying
        again with the same credential fails the same way.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_RATE_LIMITED:
      description: >-
        The endpoint asked the caller to slow down. Worth trying again, after
        `retryAfterSeconds` when the endpoint named a wait.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
          retryAfterSeconds:
            type: integer
            minimum: 0
            description: >-
              How long the endpoint asked the caller to wait, in whole seconds
              rounded up, read from a standard `Retry-After` header. Absent when
              it named none.
    ERR_MODEL_QUOTA_EXCEEDED:
      description: >-
        The account's credit or plan is exhausted. Trying again fails until the
        account changes.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_UNAVAILABLE:
      description: >-
        The provider is overloaded or failing on its side, including a failure it
        reported after the answer had begun. Worth trying again.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
          retryAfterSeconds:
            type: integer
            minimum: 0
            description: >-
              How long the endpoint asked the caller to wait, in whole seconds
              rounded up, read from a standard `Retry-After` header. Absent when
              it named none.
    ERR_MODEL_TIMEOUT:
      description: >-
        No complete response arrived in time, so whether the request ran is
        unknown. Worth trying again.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_UNREACHABLE:
      description: >-
        Nothing answered: the connection was refused, the host name did not
        resolve, or the secure handshake failed. Worth trying again.
    ERR_MODEL_CONTEXT_TOO_LONG:
      description: >-
        The input exceeds the model's context window or the endpoint's request
        size limit. The same input fails the same way.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_CONTENT_REFUSED:
      description: >-
        The endpoint rejected the request on content-policy grounds. A model's own
        refusal given as its answer is not this: that arrives as a `refusal` part
        with the finish reason `content-filter`.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_REQUEST_REJECTED:
      description: >-
        The endpoint refused the request as one it cannot serve, the provider
        refused it before sending, or the request failed in a way nothing else
        here names. The same request fails the same way.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_CONTENT_UNSUPPORTED:
      description: >-
        A well-formed content part this endpoint cannot carry. Raised before
        anything is sent, so no part of the message reaches the model.
      data:
        type: object
        required: [partType]
        properties:
          partType:
            type: string
            description: The `type` of the content part that was refused.
          scheme:
            type: string
            description: >-
              The scheme of the part's `uri`, lowercased, when the scheme is why
              it was refused.
          mediaType:
            type: string
            description: The part's media type, when it has one.
    ERR_MODEL_TOOL_ARGUMENTS_INVALID:
      description: >-
        The model asked for a tool with arguments that are not a JSON object.
        Raised rather than passed on as empty arguments, which would run the tool
        with a different request than the model made. Worth trying again.
      data:
        type: object
        required: [tool]
        properties:
          tool:
            type: string
            description: The name of the tool the model asked for.
    ERR_MODEL_RESPONSE_INVALID:
      description: >-
        The endpoint reported success but the answer cannot be read: a body that
        is not the expected document, a malformed or oversized stream frame, or a
        stream that ended before the answer was complete. Worth trying again.
    ERR_INVALID_REFERENCE:
      description: >-
        A resource the model depends on did not resolve to a live instance. A
        wiring failure, not a request failure.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [messages]
    properties:
      messages:
        type: array
        minItems: 1
        items: !ref Message
      options:
        type: object
        additionalProperties: true
        description: Request options, already merged by the operation from its own and the caller's.
      tools:
        type: array
        description: The tools this call may ask for. Absent when the caller offers none.
        items:
          type: object
          additionalProperties: false
          required: [name, parameters]
          properties:
            name: { type: string }
            description: { type: string }
            parameters:
              type: object
              additionalProperties: true
              description: JSON Schema for the tool's arguments, as the model is told them.
      toolChoice:
        type: string
        enum: [auto, none]
        description: >-
          Whether this call may ask for a tool. `auto`, the meaning when absent, leaves
          it to the model; `none` asks for an answer without requesting a tool, while
          `tools` stay declared so the calls already in `messages` remain valid.
      providerState:
        description: >-
          Opaque state a previous turn produced, replayed verbatim. This is what lets
          reasoning survive a tool loop: a provider that keeps its reasoning
          server-side hands back a token here, and it must go out again unchanged on
          the next request or the chain is broken. `ai` never inspects it.
      responseFormat:
        type: object
        additionalProperties: true
        description: The shape the answer must take, e.g. a JSON schema the provider enforces.
    # A choice about tools means nothing on a call that offers none.
    dependencies:
      toolChoice: [tools]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [content, text, usage, finishReason]
    properties:
      content:
        type: array
        description: >-
          What the model produced, as parts. The whole answer including any images or
          reasoning it returned.
        # By `!ref`, which is also what carries the shape into an importer's
        # analysis — `Ai.Message` reaches it by id, which alone does not.
        items: !ref ContentPart
      text:
        type: string
        description: >-
          The text parts of `content`, concatenated. Carried beside the parts because
          the overwhelmingly common consumer wants exactly this and should not have to
          fold the list to get it.
      usage:
        $ref: "telo://Self/TokenUsage"
      finishReason:
        $ref: "telo://Self/FinishReason"
      toolCalls:
        type: array
        description: The calls the model asked for, when it asked for any.
        items:
          $ref: "telo://Self/ToolCall"
      providerState:
        description: Opaque state to replay on the next request. See the input of the same name.
      alternatives:
        type: array
        description: >-
          Further candidates, when the request asked for more than one. The first
          candidate is always the one reported in `content` / `text`.
        items:
          type: object
          additionalProperties: true
---
# Ai.ModelStream — the same contract, delivered as it is generated.
#
# A separate abstract rather than a mode of Ai.Model: see the note there. What
# differs beyond the output is the RELATION a consumer has to it, and WHEN a
# failure arrives:
#
#   - A call is REFUSED by rejecting. An implementation raises from the call
#     every refusal it can decide from the request alone, before it contacts its
#     endpoint — a caller can still answer that, since nothing has been sent on.
#   - An answer FAILS by rejecting its iteration: whatever goes wrong after the
#     call has returned — the endpoint's own refusal included — arrives while
#     the consumer drains.
#   - A caller that received a stream reads it to its `finish` or cancels it.
#
# And who names a tool call. The IMPLEMENTATION assigns a call's id — its
# endpoint's own, or one it mints (`call_<uuid>`) when the endpoint gives none —
# because only it can put the same id on a call's argument deltas and on the
# call itself:
#
#   - Every `tool-call-delta` carries a non-empty `toolCallId` equal to the `id`
#     of the `tool-call` that completes it, and that call's `toolName`.
#   - No delta is emitted for a call until its id is known. Fragments that arrive
#     earlier are held and released once it is — at the latest immediately before
#     the `tool-call`.
#   - An id is unique across the calls of a run, not just within one answer: a
#     positional id (`call_0`) repeats on the next model call.
#   - Deltas are optional. An implementation that has none emits the whole
#     `tool-call` alone.
kind: Telo.Abstract
metadata:
  name: ModelStream
  description: >-
    A language model called for a stream: the same messages and tools go in, and the
    answer arrives as parts — text deltas, tool calls and their arguments as they
    are written, a terminal record with usage — as it is generated. A failure rejects
    the call or the iteration rather than yielding an error part.
capability: Telo.Invocable
# The failure ceiling, the same list as Ai.Model's — Ai.Buffered is a model that
# throws whatever its streaming model throws, so a code on one list only would
# make the other false. Every kind that extends this abstract restates the whole
# list — a kind with no `throws:` is read as throwing nothing — and may raise no
# code outside it, so a `catches:` written against the abstract holds for any
# provider. The code is the retry contract: rate-limited, unavailable, timeout,
# unreachable, tool-arguments-invalid and response-invalid may be tried again;
# the rest fail the same way until the request or the account changes. `status`
# is present only when an HTTP response carried the failure.
throws:
  codes:
    ERR_MODEL_ACCESS_DENIED:
      description: >-
        The credential was refused, or it has no permission for the model. Trying
        again with the same credential fails the same way.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_RATE_LIMITED:
      description: >-
        The endpoint asked the caller to slow down. Worth trying again, after
        `retryAfterSeconds` when the endpoint named a wait.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
          retryAfterSeconds:
            type: integer
            minimum: 0
            description: >-
              How long the endpoint asked the caller to wait, in whole seconds
              rounded up, read from a standard `Retry-After` header. Absent when
              it named none.
    ERR_MODEL_QUOTA_EXCEEDED:
      description: >-
        The account's credit or plan is exhausted. Trying again fails until the
        account changes.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_UNAVAILABLE:
      description: >-
        The provider is overloaded or failing on its side, including a failure it
        reported after the answer had begun. Worth trying again.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
          retryAfterSeconds:
            type: integer
            minimum: 0
            description: >-
              How long the endpoint asked the caller to wait, in whole seconds
              rounded up, read from a standard `Retry-After` header. Absent when
              it named none.
    ERR_MODEL_TIMEOUT:
      description: >-
        No complete response arrived in time, so whether the request ran is
        unknown. Worth trying again.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_UNREACHABLE:
      description: >-
        Nothing answered: the connection was refused, the host name did not
        resolve, or the secure handshake failed. Worth trying again.
    ERR_MODEL_CONTEXT_TOO_LONG:
      description: >-
        The input exceeds the model's context window or the endpoint's request
        size limit. The same input fails the same way.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_CONTENT_REFUSED:
      description: >-
        The endpoint rejected the request on content-policy grounds. A model's own
        refusal given as its answer is not this: that arrives as a `refusal` part
        with the finish reason `content-filter`.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_REQUEST_REJECTED:
      description: >-
        The endpoint refused the request as one it cannot serve, the provider
        refused it before sending, or the request failed in a way nothing else
        here names. The same request fails the same way.
      data:
        type: object
        properties:
          status:
            type: integer
            description: The HTTP status that carried the failure, when a response did.
    ERR_MODEL_CONTENT_UNSUPPORTED:
      description: >-
        A well-formed content part this endpoint cannot carry. Raised before
        anything is sent, so no part of the message reaches the model.
      data:
        type: object
        required: [partType]
        properties:
          partType:
            type: string
            description: The `type` of the content part that was refused.
          scheme:
            type: string
            description: >-
              The scheme of the part's `uri`, lowercased, when the scheme is why
              it was refused.
          mediaType:
            type: string
            description: The part's media type, when it has one.
    ERR_MODEL_TOOL_ARGUMENTS_INVALID:
      description: >-
        The model asked for a tool with arguments that are not a JSON object.
        Raised rather than passed on as empty arguments, which would run the tool
        with a different request than the model made. Worth trying again.
      data:
        type: object
        required: [tool]
        properties:
          tool:
            type: string
            description: The name of the tool the model asked for.
    ERR_MODEL_RESPONSE_INVALID:
      description: >-
        The endpoint reported success but the answer cannot be read: a body that
        is not the expected document, a malformed or oversized stream frame, or a
        stream that ended before the answer was complete. Worth trying again.
    ERR_INVALID_REFERENCE:
      description: >-
        A resource the model depends on did not resolve to a live instance. A
