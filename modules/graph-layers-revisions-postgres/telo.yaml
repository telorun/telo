                  constructed first."
                type: object
                x-telo-ref:
                  kind: Postgres.Enum
                  use: schema
          length:
            title: Length
            description: Character length for `varchar` / `char`.
            type: integer
            minimum: 1
          precision:
            title: Precision
            description: Total digits for `numeric`.
            type: integer
            minimum: 1
          scale:
            title: Scale
            description: Fractional digits for `numeric`.
            type: integer
            minimum: 0
          array:
            title: Array
            description: Declares the column as a one-dimensional array of `type`. Multi-dimensional
              arrays project as one level.
            type: boolean
            default: false
          nullable:
            title: Nullable
            description: Whether the column admits NULL. Omitted, it is false on a primary key or an
              identity column and true on any other.
            type: boolean
          primaryKey:
            title: Primary Key
            type: boolean
            default: false
          unique:
            title: Unique
            type: boolean
            default: false
          identity:
            title: Identity
            description: Makes the column `GENERATED … AS IDENTITY`. `always` refuses a
              caller-supplied value; `by default` allows one.
            type: string
            enum:
              - always
              - by default
          default:
            title: Default
            description: "A typed literal, checkable against the column's own type. Mutually
              exclusive with `defaultExpression`: nothing can tell `gen_random_uuid` the
              function from the string by looking at it."
          defaultExpression:
            title: Default Expression
            description: Raw PostgreSQL expression evaluated by the database (`gen_random_uuid()`, `now()`).
            type: string
