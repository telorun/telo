units:
  analyzer: Added
  kernel: Added
  cli: Added
body: "A value fitting none of an `anyOf` / `oneOf`'s alternatives is judged alternative
  by alternative, by `telo check` and by every refusal a kernel phrases (a resource
  refused at creation, an invalid input or output, refused observed state,
  `ctx.validateSchema`): each alternative accepting the value's shape reports its own
  findings, a union of named shapes pinning a tag is read by its tag, and a `oneOf`
  several alternatives match reads `must match exactly one schema in oneOf`."
