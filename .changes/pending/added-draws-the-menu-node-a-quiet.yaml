modules:
  modules/ui-react: Added
body: "Draws the menu node: a quiet button, the new menu-trigger part with a chevron
  Icon, opening the node's links through the Menu control, the current item (a link
  styled strong) passed as the new optional MenuItem.current, which the built-in Menu
  marks aria-current and data-current on its menu-item. Every theme styles menu-trigger;
  the default theme and the scenes include it. Above compactBelow the header is one row
  — header-start, the title, the navigation taking the room left and wrapping within it,
  header-end at the inline end — and below it the header wraps; the default theme's
  header now spans the full window width with its side padding instead of centring its
  content on the page width."
