kind: Telo.Application
metadata:
  name: PgEnumBoots
  version: 12.0.0
  description: |
    Boot 12 — reference data declared beside the shape it must satisfy.

    Three rows, one of them behind a `when:` that holds. The next boot removes a
    row and turns the guard false, which is where the surprising half of the rule
    shows: a `when:` that turns false is a declaration WITHDRAWN, so those rows
    tombstone exactly as a removed one does.
imports:
  Sql: ../../../../../sql
  Postgres: ../../../../
  Run: ../../../../../run
  Assert: ../../../../../assert
variables:
  dbHost: { env: DB_HOST, type: string, default: localhost }
  dbPort: { env: DB_PORT, type: integer, default: 5432 }
  dbUser: { env: DB_USER, type: string, default: postgres }
  dbPassword: { env: DB_PASSWORD, type: string, default: postgres }
  dbName: { env: DB_NAME, type: string, default: postgres }
  environment: { env: APP_ENV, type: string, default: development }
targets:
  - !ref appSchema
  - !ref test
---
kind: Postgres.Connection
metadata: { name: db }
connectionString: !cel >-
  'postgres://' + variables.dbUser + ':' + variables.dbPassword + '@' +
  variables.dbHost + ':' + string(variables.dbPort) + '/' + variables.dbName
---
# Carried forward unchanged from the earlier boots, so the only thing these two
# boots change is the seed rows — otherwise the previous fixtures' tables would
# tombstone here and the assertions would be about them.
kind: Postgres.Enum
metadata: { name: messageRole }
typeName: conversation_role
values: [system, user, assistant]
---
kind: Postgres.Table
metadata: { name: messages }
table: conversation_messages
columns:
  id: { type: bigint, primaryKey: true, identity: always }
  role: { type: !ref messageRole, nullable: false }
  body: { type: text }
  balanceCents: { type: bigint, nullable: false, default: 0 }
  sentAt: { type: timestamptz }
checks:
  sent_implies_timestamp:
    expression: "body IS NULL OR \"sentAt\" IS NOT NULL"
    validate: deferred
---
kind: Postgres.Table
metadata: { name: people }
table: people
columns:
  id: { type: bigint, primaryKey: true, identity: always }
  email: { type: citext, nullable: false }
---
kind: Postgres.Table
metadata: { name: roles }
table: roles
columns:
  name: { type: text, primaryKey: true }
  label: { type: text, nullable: false }
  rank: { type: integer, default: 0 }
seeds:
  key: [name]
  when: !cel "variables.environment != 'production'"
  rows:
    - { name: admin, label: Administrator, rank: 100 }
    - { name: viewer, label: Viewer }
    - { name: demo, label: Demo }
---
kind: Postgres.Schema
metadata: { name: appSchema }
connection: !ref db
schema: telo_pg_enum_boots
version: !cel "module.version"
extensions: [citext]
enums: [!ref messageRole]
tables: [!ref messages, !ref people, !ref roles]
reclaim: { afterVersions: 1, afterDuration: 0ms }
---
kind: Run.Sequence
metadata: { name: test }
steps:
  # Only the columns the seed DECLARES for every row. `viewer`'s rank is the
  # operator's, which is the next boot's assertion and would make this one depend
  # on whether it had run before.
  - name: readRoles
    invoke: !ref query
    inputs:
      sql: "SELECT name, label FROM telo_pg_enum_boots.roles ORDER BY name"
  - name: assertSeeded
    invoke: !ref assertSeeded
    inputs:
      actual: !cel "steps.readRoles.result.rows"
      expected:
        - { name: admin, label: Administrator }
        - { name: demo, label: Demo }
        - { name: viewer, label: Viewer }
  # A column the seed does NOT declare is the operator's: edited in place, it
  # survives the next upsert. Set here so the following boot can prove it.
  - name: operatorEdit
    invoke: !ref command
    inputs:
      sql: "UPDATE telo_pg_enum_boots.roles SET rank = 7 WHERE name = 'viewer'"
---
kind: Sql.Query
metadata: { name: query }
connection: !ref db
---
kind: Sql.Command
metadata: { name: command }
connection: !ref db
---
kind: Assert.Equals
metadata: { name: assertSeeded }
