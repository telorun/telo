kind: Telo.Library
metadata:
  name: PDF
  version: 0.8.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Data]
  description: |
    Working with PDF documents: render a page to an image at a chosen scale, read the
    text a document renders, and add editable form fields — text boxes, checkboxes,
    signatures — at measured positions. Rendering and field placement share one
    coordinate space, the pixels of the rendered image from the top-left, so what a
    model or a human measures on the image is where the field lands.
exports:
  kinds:
    - Rasterizer
    - Text
    - FormFields
requires:
  # 0.91.0: a `sources:` entry claimed by an `assets:` pattern, which an older
  # analyzer rejects as SOURCE_ENTRY_UNCLAIMED, and `ctx.resolveControllerFile`,
  # which the controllers call for pdf.js's fonts, CMaps, wasm and worker.
  # Verified by execution: 0.90.0 reports 199 SOURCE_ENTRY_UNCLAIMED errors.
  telo: ">=0.91.0"
# Skia, through `@napi-rs/canvas`, for every platform its upstream release
# publishes. The wrapper's JavaScript inlines into the bundle; only the addon is
# staged, and the controller hands its path to the wrapper the way sqlite hands
# better-sqlite3 its `nativeBinding` — the package's own search walks up from a
# `__filename` a bundle does not have.
#
# pdf.js's fonts, CMaps and wasm decoders are staged as the module's own assets
# for the same reason: pdf.js resolves them beside its package, which a bundle
# is not, and reads them from wherever it is told instead.
native:
  - { name: canvas, format: napi, os: darwin, arch: amd64, path: ./native/darwin-amd64/skia.node }
  - { name: canvas, format: napi, os: darwin, arch: arm64, path: ./native/darwin-arm64/skia.node }
  - { name: canvas, format: napi, os: linux, arch: amd64, libc: gnu, path: ./native/linux-amd64-gnu/skia.node }
  - { name: canvas, format: napi, os: linux, arch: amd64, libc: musl, path: ./native/linux-amd64-musl/skia.node }
  - { name: canvas, format: napi, os: linux, arch: arm64, libc: gnu, path: ./native/linux-arm64-gnu/skia.node }
  - { name: canvas, format: napi, os: linux, arch: arm64, libc: musl, path: ./native/linux-arm64-musl/skia.node }
  - { name: canvas, format: napi, os: windows, arch: amd64, path: ./native/windows-amd64/skia.node }
  - { name: canvas, format: napi, os: windows, arch: arm64, path: ./native/windows-arm64/skia.node }
assets:
  - ./assets/
