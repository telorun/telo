kind: Telo.Application
metadata:
  name: UiShowcase
  version: 1.0.0
  categories: [ UI ]
  description: |
    A tour of everything a declarative screen can do, with no hand-written
    frontend, in fifteen languages: every node type and text form, conditions
    and query parameters, data readers with loading and failure states and a
    sign-in gate, data grids, filter bars, forms, actions, custom components,
    a generated admin screen, related records drawn as a table, cards, a board,
    a calendar and a tree, tabs and themes. The same pages are served four
    times — under the built-in look with a brand chosen per request, under a
    Radix theme, under a theme of the example's own with a bundled typeface,
    and with a sidebar that collapses to a rail and becomes a bottom tab bar
    on a phone. The data is a small studio's team, people, projects, tasks,
    requests, bookings, comments, blog posts and reporting lines in SQLite,
    with real sessions behind a sign-in gate.
# 0.129.0: ui's shipped translations, which an older runtime cannot load.
requires: { telo: ">=0.133.0" }
lang: en
imports:
  Run: oci://ghcr.io/telorun/run@0.33.0#sha256-2J-N_ZkFaVdrC61YdHLWFSBWK4tlj0Zu2jdY2pBaViM
  Http: oci://ghcr.io/telorun/http-server@0.44.1#sha256-0eFkBJRNr4r2hyQCBHcmTKEJU24Fy76Zw5ajQMUZyEs
  HttpDispatch: oci://ghcr.io/telorun/http-dispatch@0.19.2#sha256-Cw8rzRLrbnWWd2OaKNNDDO6V0ojGUec69fcLRhVhcdM
  Sql: oci://ghcr.io/telorun/sql@0.31.4#sha256-N-TiIeZ8rA0e9-RXCrsb1s-oLIJ1ajdAIdHbjt8kMxk
  SQLite: oci://ghcr.io/telorun/sqlite@0.14.4#sha256-iLCP1uoF4CymIEP-0-qkDtfCSEippGAMuzxh0w0nvqI
  Crud: oci://ghcr.io/telorun/crud@0.36.3#sha256-7nhX62iaxSz70B_GtZkWo2vIU8kbkDsUoOv53Wcr-XA
  CrudUi: oci://ghcr.io/telorun/crud-ui@0.5.3#sha256-PquZViXpSZ15Roq_EJAZBcJr3vWKbxGsyGmKmjgZGWo
  DataModel: oci://ghcr.io/telorun/data-model@0.3.0#sha256-kve4_9Mk2KXi4vZyvcYNBrEp-ZD_jWDWZwdbpD8qhTs
  Font: oci://ghcr.io/telorun/font@0.3.1#sha256-fAtk3J3zFm-ViF7O4lOarp-1ZrWwpEfRUFwHa-s7SN0
  I18n: oci://ghcr.io/telorun/i18n@0.3.0#sha256-V23f9x_4EphnP_otnV6hbLcmhOtMgTtePNQ2_iGVF6g
  Ui: oci://ghcr.io/telorun/ui@0.11.0#sha256-rkVNXO_R91lAVJx6pWdMdQte8anMu5Tt5OqV-j2waOw
  UiReact: oci://ghcr.io/telorun/ui-react@0.12.2#sha256-714VmipjieYNqHYL1QS0zEqlobHcLeT7KnMgvf26T2s
  Radix: oci://ghcr.io/telorun/ui-react-radix@0.8.2#sha256-o6ri8NPn_Afg1OiDH0ZrvKkpTzZRFFU2yheoodgSFzY
  UiLucide: oci://ghcr.io/telorun/ui-lucide@0.8.0#sha256-pYo9POHgBe6eyIHL38DPcqJXc8ZlPWxcYKTge2zZfpQ
  # Two libraries of the example's own: its browser components, and the theme
  # the `/brand` mount draws with.
  Components: ./components
  Brand: ./brand
# The database, the routes crud does not give, the translations with one file
# per language, and one file per page holding the view every application
# places there.
include: [./data.yaml, ./api.yaml, ./translations/en.yaml, ./translations/de.yaml, ./translations/es.yaml, ./translations/fr.yaml, ./translations/hi.yaml, ./translations/it.yaml, ./translations/ja.yaml, ./translations/ko.yaml, ./translations/nl.yaml, ./translations/pl.yaml, ./translations/pt.yaml, ./translations/ru.yaml, ./translations/tr.yaml, ./translations/uk.yaml, ./translations/zh.yaml, ./pages-overview.yaml, ./pages-conditions.yaml, ./pages-data.yaml, ./pages-tables.yaml, ./pages-filters.yaml, ./pages-forms.yaml, ./pages-actions.yaml, ./pages-components.yaml, ./pages-crud.yaml, ./pages-records.yaml, ./pages-search.yaml, ./pages-themes.yaml]
# The texts are written in English, the module's `lang`; `english` covers the
# one text crud writes with no `lang`, and ui's own texts come translated with ui.
translations:
  catalogs:
    - !ref Ui.germanTranslations
    - !ref Ui.spanishTranslations
    - !ref Ui.frenchTranslations
    - !ref Ui.italianTranslations
    - !ref Ui.dutchTranslations
    - !ref Ui.polishTranslations
    - !ref Ui.portugueseTranslations
    - !ref Ui.turkishTranslations
    - !ref Ui.russianTranslations
    - !ref Ui.ukrainianTranslations
    - !ref Ui.hindiTranslations
    - !ref Ui.japaneseTranslations
    - !ref Ui.koreanTranslations
    - !ref Ui.chineseTranslations
    - !ref english
    - !ref german
    - !ref spanish
    - !ref french
    - !ref italian
    - !ref dutch
    - !ref polish
    - !ref portuguese
    - !ref turkish
    - !ref russian
    - !ref ukrainian
    - !ref hindi
    - !ref japanese
    - !ref korean
    - !ref chinese
targets:
  - !ref migrate
  - !ref server
  - { name: openApp, invoke: !ref openApp, inputs: { url: !interpolate "http://localhost:${{ ports.http }}" } }
ports: { http: { env: PORT, protocol: tcp, default: 8150 } }
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: Telo.HostPath
    default: ./showcase.db
---
# A composite kind of the example's own, with no controller: a heading and a
# line under it, in one of the styles that carry a colour. It provides through
# a view, as any composite with no code of its own does.
kind: Telo.Definition
metadata:
  name: Callout
  description: >-
    A highlighted note for a page: a heading and one line under it, drawn in an
    accent, warning, success or danger colour.
capability: Telo.Provider
extends: Ui.Composite
schema:
  type: object
  additionalProperties: false
  required: [ heading, body, tone ]
  properties:
    heading: { $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
    body: { $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
    tone: { type: string, enum: [ accent, warning, success, danger ] }
resources:
  - kind: Ui.View
    metadata: { name: view }
    content:
      type: box
      style: !cel "self.tone"
      children:
        - { type: text, text: !cel "self.heading", style: subheading }
        - { type: text, text: !cel "self.body" }
provide: !ref view
---
# The showcase's mark, placed before the title of all four applications. An
# image's `src` resolves under the mount it is drawn in, and the files are
# served under each mount, so one view serves all four.
kind: Ui.View
metadata: { name: logo }
content: { type: image, src: /files/mark.svg, alt: UI showcase logo }
---
# The built-in look, its brand chosen per request by the `showcase-brand`
# cookie; two pages add per-request nodes a shared view cannot read. Languages,
# the shared header and its Language and Theme menus: README.md.
kind: UiReact.App
metadata: { name: showcase }
title: UI showcase
theme: !ref UiReact.defaultTheme
tokens:
  - when: !cel "'cookie' in request.headers && Self.cookie(request.headers['cookie'], 'showcase-brand') == 'acme'"
    tokens:
      kind: Ui.DesignTokens
      color.accent: "#b4232a"
      color.accent-text: "#fff8f0"
      color.background: "#fff8f0"
      radius.sm: "2px"
      radius.md: "2px"
      radius.lg: "4px"
stylesheets:
  - !module-path ./showcase.css
compactBelow: 48rem
header:
  start:
    - { type: composite, ref: !ref logo }
  end:
    - type: menu
      text: Language
      items:
        - type: link
          text: English
          href: "/api/lang?set=en"
          style: !cel "request.lang == 'en' ? ['strong'] : []"
        - type: link
          text: Deutsch
          href: "/api/lang?set=de"
          style: !cel "request.lang == 'de' ? ['strong'] : []"
        - type: link
