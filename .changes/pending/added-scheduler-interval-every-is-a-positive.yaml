modules:
  modules/scheduler: Added
body: '`Scheduler.Interval.every` is a positive `Telo.Duration`: `30s`, `1h30m`, `2d`
  and `1w` are read, a malformed or non-positive literal is refused by `telo check`, an
  integer is milliseconds, and a computed value must be a duration (`!cel
  "duration(variables.every)"`). Breaking for an `every` computed as a string. Text with
  a space before the unit (`5 m`) or around the value is now refused. Requires telo
  >=0.130.0.'
