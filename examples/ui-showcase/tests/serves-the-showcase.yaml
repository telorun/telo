  # The language in effect is the `showcase-lang` cookie's, read before the
  # Accept-Language header, under every mount; the Language menu marks it
  # whichever decided it, and English with neither.
  - name: verifyLanguageCookie
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        polish:
          lang: !cel "steps.cookiePolishApp.result.body.lang"
          pages: !cel "steps.cookiePolishApp.result.body.pages.map(p, p.title.message[0])"
          logo: !cel "steps.cookiePolishAppLayout.result.body.header[0].start[0].alt"
          menus: !cel "steps.cookiePolishAppLayout.result.body.header[0].end.map(n, n.text.message[0])"
        english:
          lang: !cel "steps.cookieEnglishApp.result.body.lang"
          title: !cel "steps.cookieEnglishApp.result.body.title"
        radix:
          lang: !cel "steps.radixPolishApp.result.body.lang"
          title: !cel "steps.radixPolishApp.result.body.title"
        marked: !cel >-
          [steps.appLayout, steps.polishAppLayout, steps.cookiePolishAppLayout, steps.cookieEnglishAppLayout, steps.radixPolishAppLayout, steps.weightedAppLayout, steps.unservedCookieAppLayout]
            .map(a, a.result.body.header[0].end[0].items.filter(i, size(i.style) > 0).map(i, i.text.message[0]))
      expected:
        polish:
          lang: pl
          pages: [ Przegląd, Warunki, Dane, Tabele, Filtry, Formularze, Akcje, Komponenty, CRUD, Powiązane rekordy, Wpis, Nowe zadanie, Utwórz zadanie, Zadanie, Szybka edycja, Nowy wpis, Edytuj wpis, Nowa osoba, Osoba, Szukaj wpisów, Wpisy obok swoich filtrów, Wpisy o wydaniach, Recenzje, Recenzja, Zmiany, Wykonawca, Motywy ]
          logo: { lang: pl, message: [ Logo pokazu interfejsu ] }
          menus: [ Język, Motyw ]
        english: { lang: en, title: { lang: en, message: [UI showcase] } }
        radix: { lang: pl, title: { lang: pl, message: [Pokaz interfejsu — Radix] } }
        # No header, Accept-Language Polish, the cookie Polish over English,
        # the cookie English over Polish, the cookie Polish under /radix, a
        # weighted header the server answers in Polish, an unserved cookie
        # the server skips for Accept-Language.
        marked: [ [ English ], [ Polski ], [ Polski ], [ English ], [ Polski ], [ Polski ], [ Polski ] ]

  # The derived theme names its typefaces and serves no face; the `/brand`
  # application's brand is one token set, which serves Inter's four faces with
  # `@font-face` and sets the two typeface tokens and nothing else.
  - name: verifyBrandTokens
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "[steps.brandThemeTokens.result.status, steps.brandTokens.result.status]"
        theme: !cel >-
          ['--telo-font-body: "Inter";', '--telo-font-heading: "Inter";', '--telo-font-mono: "Courier New";', '--telo-color-accent: #9a3412;', '@font-face']
            .map(d, steps.brandThemeTokens.result.body.contains(d))
        brand: !cel 'regexExtractAll(steps.brandTokens.result.body, "--telo-[a-z-]+")'
        faces: !cel 'size(regexExtractAll(steps.brandTokens.result.body, "@font-face [{] font-family: \"Inter\"; src: url[(][^)]*[)] format[(]\"woff2\"[)]"))'
      expected:
        status: [ 200, 200 ]
        theme: [ true, true, true, true, false ]
        brand: [ --telo-font-body, --telo-font-heading ]
        faces: 4

  # Every language the showcase serves draws ui's own texts in that language,
  # from ui's shipped translations.
  - name: served
    value: { n: !cel "0", langs: [] }
  - name: askEachLanguage
    while: !cel "steps.served.result.n < 14"
    do:
      - name: asked
        invoke: { kind: HttpClient.Request, client: !ref browser, url: /_telo/ui/app }
        inputs:
          headers:
            accept-language: !cel "['de', 'es', 'fr', 'hi', 'it', 'ja', 'ko', 'nl', 'pl', 'pt', 'ru', 'tr', 'uk', 'zh'][steps.served.result.n]"
      - name: served
        value:
          n: !cel "steps.served.result.n + 1"
          langs: !cel "steps.served.result.langs + [[steps.asked.result.body.lang, steps.asked.result.body.texts.sets['Ui.Translations'].save.lang]]"
  - name: verifyLanguages
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.served.result.langs"
      expected: [ [ de, de ], [ es, es ], [ fr, fr ], [ hi, hi ], [ it, it ], [ ja, ja ], [ ko, ko ], [ nl, nl ], [ pl, pl ], [ pt, pt ], [ ru, ru ], [ tr, tr ], [ uk, uk ], [ zh, zh ] ]

