project: sql
kind: Fixed
body: 'Sql.Transaction: the forwarded-inputs slot is now declared as `inputs`, the
  field the controller actually reads. The schema previously spelled it `bindings`,
  which nothing read — authoring it was silently ignored, and `inputs:` was rejected
  by validation. The slot is a CEL region whose expressions read the caller''s
  invocation input as `inputs.<field>` (the controller binds it under that name,
  matching how a Run.Sequence step''s inputs read), and the forwarding path is
  now covered by a manifest test. Note the rename is author-facing: a manifest
  still writing `bindings:` on a Sql.Transaction now fails validation instead of
  being silently ignored.'
