kind: Telo.Library
metadata:
  name: SQLite
  version: 0.3.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Storage]
  description: |
    Connects an application to a SQLite database — a file on disk, or an in-memory one
    that lives only as long as the process — with transactional schema changes. The
    database travels with the application, so it suits local development, tests,
    single-node deployments and embedded storage.
requires:
  # The connection inherits `Sql.Connection`'s effect chain, so a runtime that
  # discards what `init()` returns never destroys the pool — a silent leak
  # rather than a failure, which is what the floor exists to convert.
  # 0.82.1: a column's `type:` unions a storage class with a reference to a
  # declared enum. An older analyzer reads a scalar at any slot carrying an
  # `x-telo-ref` as the removed string-reference form, so it rejects every
  # consumer's `type: integer` and tells its author to write `!ref integer`.
  # Verified by execution against 0.82.0.
  telo: ">=0.82.1"
imports:
  Sql: ../sql
exports:
  kinds:
    - Connection
    - Table
    - Enum
    - Schema
---
kind: Telo.Definition
metadata:
  name: Connection
  description: >-
    A connection to a SQLite database held in a file or entirely in memory, opened on
    start-up and shared by every operation that references it.
capability: Telo.Provider
extends: Sql.Connection
controllers:
  - pkg:npm/@telorun/sqlite@0.3.0?local_path=./nodejs#connection
schema:
  type: object
  examples:
    - file: ./data.db
    - file: ":memory:"
  properties:
    file:
      title: File
      type: string
      description: >-
        Path to the SQLite database file (e.g. `./data.db`). The parent
        directory is created if missing. Omit, or use `:memory:`, for an
        in-memory database.
---
# SQLite.Table — SQLite's own vocabulary, which is honestly smaller than
# PostgreSQL's because the engine is: five storage classes, no arrays, no
# namespaces. `x-telo-schema-map` on `type` declares the JSON Schema each
# storage class projects to, so the analyzer performs a lookup and never learns
# what a storage class is.
kind: Telo.Definition
metadata:
  name: Table
  description: >-
    One SQLite table stated as what it is — named columns over the five storage
    classes, named indexes, named foreign keys. Reconciled by the Schema resource
    that lists it: absent tables and columns are created, and a removal is recorded
    rather than executed.
capability: Telo.Provider
extends: Sql.Table
controllers:
  - pkg:npm/@telorun/sqlite@0.3.0?local_path=./nodejs#table
x-telo-schema-projection:
  entries: /columns
  key: type
  nullable: nullable
  array: array
  # SQLite has no named types, so a referenced enum has no base of its own: the
  # declaration names a storage class and THIS kind's own map resolves it. Same
  # declaration, same projected node as PostgreSQL, two engine-native renderings.
  reference:
    from: values
    keyword: enum
    baseFrom: baseType
schema:
  type: object
  additionalProperties: false
  required: [table, columns]
  examples:
    - table: users
      columns:
        id: { type: integer, primaryKey: true }
        email: { type: text, nullable: false, unique: true }
  properties:
    table:
      title: Table
      description: The physical table name.
      type: string
      minLength: 1
    renamedFrom:
      title: Renamed From
      description: >-
        The physical table this declaration supersedes, rendered as
        `ALTER TABLE … RENAME TO` and applied BEFORE the reconciliation pass.

        Unlike a column's rename this is NATIVE, and the difference is not an
        oversight: a column rename is expand-contract because both names can
        coexist while the previous version of the app is still running, and a
        table has no cheap equivalent — copying every row is unbounded work, and
        writes during the overlap would land in one table and not the other. So
        the rename is immediate, and the cost is stated here: between the rename
        and the new deployment, an instance still running the previous version
        does not find the table.

        Advisory. Neither name present is a fresh database and the table is simply
        created, so a marker left in the manifest indefinitely is harmless; both
        names present is refused, naming both; and a predecessor the ledger does
        not record as owned is refused.
      type: string
    columns:
      title: Columns
      description: >-
        Columns keyed by name. The key is durable identity — tombstones key on it
        and a rename is expand-contract, never a native RENAME — so column order
        carries no meaning and a duplicate name is structurally unrepresentable.
      type: object
      minProperties: 1
      propertyNames:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      additionalProperties:
        type: object
        additionalProperties: false
        required: [type]
        # A typed literal and a backend SQL expression are separate fields
        # because nothing can tell a function call from a string by looking at
        # it — so exactly one may be set, and saying so here means `telo check`
        # reports it instead of the boot.
        not:
          required: [default, defaultExpression]
        # A primary key cannot hold NULL, and the engine enforces that whether
        # or not the declaration says so. Declaring the opposite is a
        # contradiction, and left standing it would make every boot after the
        # first plan a DROP NOT NULL on the key.
        allOf:
          - if:
              required: [primaryKey, nullable]
              properties:
                primaryKey: { const: true }
                nullable: { const: true }
            then: false
        properties:
          type:
            title: Type
            # `type: object` on the reference branch is not decoration: a branch
            # with no keywords is an empty schema matching everything, so a valid
            # storage class would match both branches and the union would fail.
            description: >-
              SQLite storage class, or a reference to an enum this schema
              declares. There is no date, boolean or UUID type — those are
              conventions over these five.
            oneOf:
            - title: Storage class
              type: string
              enum: [integer, real, text, blob, numeric]
              x-telo-schema-map:
                integer: { type: integer }
                real: { type: number }
                text: { type: string }
                blob: { x-telo-type: Telo.Bytes }
                numeric: { type: number }
            - title: Enum type
              description: >-
                A `!ref` to an enum this schema declares. SQLite has no named
                types, so the reference is rendered as a `CHECK` on this column —
                and the row contract is projected identically either way.
              type: object
              x-telo-ref:
                kind: Self.Enum
                use: schema
          nullable:
            title: Nullable
            type: boolean
            default: true
          primaryKey:
            title: Primary Key
            type: boolean
            default: false
          unique:
            title: Unique
            type: boolean
            default: false
          identity:
            title: Identity
            description: >-
              `always` makes an INTEGER PRIMARY KEY auto-increment. SQLite has one
              such mode, so the field names it rather than offering a choice.
            type: string
            enum: [always]
          default:
            title: Default
            description: >-
              A typed literal, checkable against the column's own type. Mutually
              exclusive with `defaultExpression`: nothing can tell a SQL function
              from a string by looking at it.
          defaultExpression:
            title: Default Expression
            description: Raw SQLite expression evaluated by the database (`datetime('now')`).
            type: string
            contentMediaType: application/sql
            x-telo-widget: code
          renamedFrom:
            title: Renamed From
            description: >-
              The column this one supersedes. The pass adds this column, copies the
              old one into it and tombstones the old one — a native rename would take
              effect immediately and break the version still running.
            type: string
    indexes:
      title: Indexes
      description: Indexes keyed by name, which is their durable identity.
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        required: [columns]
        properties:
          columns:
            title: Columns
            type: array
            minItems: 1
            items: { type: string }
          unique:
            title: Unique
            type: boolean
            default: false
          where:
            title: Where
            description: Partial-index predicate.
            type: string
            contentMediaType: application/sql
            x-telo-widget: code
    seeds:
      title: Seeds
      description: >-
        Reference data this table is declared to hold. Desired state, not
        history, which is why it is declared beside the shape it must satisfy
        rather than written as an insert migration: the rows are typed against
        this table's own columns at `telo check`, and a row deleted by hand comes
        back on the next boot.

        Applied after the reconciliation pass, since the table has to exist, and
        before `migrations:`, since a one-time backfill may reasonably read the
        reference data while nothing declared can depend on a migration that has
        already run once.
      type: object
      additionalProperties: false
      required: [key, rows]
      properties:
        key:
          title: Key
          description: >-
            The columns that decide whether a row is the same row — durable
            identity, the same principle as `table:` and an index name, and what
            the upsert conflicts on.
          type: array
          minItems: 1
          items: { type: string }
        when:
          title: When
          description: >-
            Declares the rows only when this holds. A `when:` that turns FALSE is
            a declaration withdrawn, so those rows tombstone on the next boot of
            a database that had them — the correct reading of the rule and the
            surprising one.
          type: boolean
          x-telo-eval: compile
        rows:
          title: Rows
          description: >-
            A row asserts the columns it STATES and no others: one it omits takes
            the column default on insert and keeps whatever is there on update.
            That is the answer to a seeded row edited in place — a column the seed
            declares is restored, one it does not is the operator's.
          type: array
          items:
            # The projection pointed at its OWN resource: the rows are typed
            # against this table's `columns:`, so a misspelled column or a value
            # of the wrong type is an error on the row's own line. Rows stay
            # partial by design — the projection emits no `required`, and the key
            # columns are insisted on by the controller.
            x-telo-schema-projection-from: ""
    checks:
      title: Checks
      description: >-
        Named table-level predicates, keyed by constraint name. The expression is
        raw SQLite SQL, for the reason a column's type vocabulary is the engine's.

        SQLite has no ADD CONSTRAINT, so a check exists only as part of the table
        it was created with: it is emitted at create time, and a later change —
        adding, editing or removing one on a live table — is refused with the
        reason. That refusal needs no expression parsing, because the ledger
        records the declaration and the pass compares this boot's against it.
      type: object
      propertyNames:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      additionalProperties:
        type: object
        additionalProperties: false
        required: [expression]
        properties:
          expression:
            title: Expression
            description: The predicate, in SQLite's own SQL.
            type: string
            minLength: 1
    foreignKeys:
      title: Foreign Keys
      description: >-
        Foreign keys keyed by name. Table-level rather than a column-level clause
        because composite keys are table-level in SQL regardless, and because a name
        is the durable identity reconciliation diffs on. SQLite has no ADD
        CONSTRAINT, so these are emitted only when the table is created; changing one
        afterwards is refused with the reason.
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        required: [columns, references]
        properties:
          columns:
            title: Columns
            type: array
            minItems: 1
            items: { type: string }
          references:
            title: References
            type: object
            additionalProperties: false
            required: [table, columns]
            properties:
              table:
                title: Table
                # Deliberately `schema` — it names a shape and registers no
                # ordering edge. What a foreign key needs from its target is the
                # physical name, which the DECLARATION carries, so nothing here
                # requires the referenced table to be constructed first. An edge
                # would also make the two most ordinary foreign keys there are
                # unbootable: a tree table references itself, and a mutual pair
                # references each other, and both are cycles.
                x-telo-ref:
                  kind: Self.Table
                  use: schema
              columns:
                title: Columns
                type: array
                minItems: 1
                items: { type: string }
          onDelete:
            title: On Delete
            type: string
            enum: [cascade, restrict, "set null", "set default", "no action"]
          onUpdate:
            title: On Update
            type: string
            enum: [cascade, restrict, "set null", "set default", "no action"]
---
kind: Telo.Definition
metadata:
  name: Enum
  description: >-
    One declared set of permitted values for the columns that reference it.
    SQLite has no named types, so nothing in the database corresponds to this
    declaration: the values are rendered as a `CHECK` on every column that uses
    it, and the same enum is projected into the row contract as on any engine
    that does have one.
capability: Telo.Provider
extends: Sql.Enum
controllers:
  - pkg:npm/@telorun/sqlite@0.3.0?local_path=./nodejs#enum
schema:
  type: object
  additionalProperties: false
  required: [typeName, baseType, values]
  examples:
    - typeName: message_role
      baseType: text
      values: [system, user, assistant]
  properties:
    typeName:
      title: Type Name
      description: >-
        This declaration's DURABLE IDENTITY. Nothing in SQLite corresponds to it,
        and it is required anyway: the ledger has to key on something written
        down, or renaming the resource would abandon the history under the old
        name — the one outcome the rejected identity column exists to prevent.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    baseType:
      title: Base Type
      description: >-
        The storage class the values sit in, and what the projected row contract
        is typed from. PostgreSQL needs no equivalent because an enum type there
        IS its own base type.
      type: string
      enum: [integer, real, text, blob, numeric]
    values:
      title: Values
      description: The permitted values, in declaration order.
      type: array
      minItems: 1
      items: { type: string, minLength: 1 }
    renamedFrom:
      title: Renamed From
      description: >-
        The physical type name this declaration supersedes. On SQLite this emits
        NO statement at all — the `CHECK`s on referencing tables never named the
        type — so the ledger key rewrite IS the rename.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
---
# SQLite.Schema — the single schema-change kind. SQLite has exactly one
# namespace, so unlike the PostgreSQL kind there is no `schema:` to name.
kind: Telo.Definition
metadata:
  name: Schema
  description: >-
    Brings a SQLite database to the declared schema at start-up: creates what is
    absent, applies imperative migrations before and after the reconciliation pass,
    and records what has been removed instead of dropping it. A removal is reclaimed
    only once the declared number of released versions and the declared time have
    passed.
capability: Telo.Runnable
extends: Sql.Schema
controllers:
  - pkg:npm/@telorun/sqlite@0.3.0?local_path=./nodejs#schema
schema:
  type: object
  additionalProperties: false
  required: [connection]
  # The version is the reclamation clock and nothing else reads it, so it is
  # required exactly when a policy is declared — an app that only runs
  # migrations writes neither.
  dependencies:
    reclaim: [version]
  examples:
    - connection: !ref Db
      version: !cel "module.version"
      tables: [!ref users]
      reclaim: { afterVersions: 3, afterDuration: 30d }
  properties:
    connection:
      title: Connection
      description: Reference to the SQLite connection this schema lives in.
      x-telo-ref:
        kind: Self.Connection
        use: dependency
    # Restated from Sql.Schema so the field is a CEL slot here: eval paths are
    # read from a kind's own schema, not from the abstract it extends, and the
    # conventional value is an expression.
    version:
      title: Version
      description: >-
        The released version this deployment is running, conventionally
        `!cel "module.version"`. The clock reclamation is gated on: the number of
        distinct versions observed since an object went missing is the primary
        eligibility signal. Required when `reclaim:` is declared and pointless
        without it. Checked for emptiness by the pass rather than here: this is a
        CEL slot, and an expression reaches validation as a placeholder.
      type: string
      x-telo-eval: compile
    tables:
      title: Tables
      description: >-
        The tables this schema declares. Reconciled in one pass, so declaration
        order is never load-bearing: cross-table constraints are deferred until every
        table exists.
      type: array
      items:
        x-telo-ref:
          kind: Self.Table
          use: dependency
    enums:
      title: Enums
      description: >-
        The enum types this schema declares and owns, listed exactly as tables
        are. SQLite has no database object behind one — the values are rendered as
        a `CHECK` on every column that references the enum — but the DECLARATION
        is a ledger object like any other, which is what lets a change to it be
        detected at all.
      type: array
      items:
        x-telo-ref:
          kind: Self.Enum
          use: dependency
    ledger:
      title: Ledger
      description: >-
        Names this schema's history, kept as `telo_schema_<ledger>_*` tables in
        the namespace (`telo_schema_*` when omitted). Two schema resources over
        one namespace must name different ledgers. Durable identity: changing it
        abandons the history under the old name.
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    prepare:
      title: Prepare
      description: >-
        Data preparation for a narrowing the reconciliation pass is about to
        attempt — backfilling a column that is about to become NOT NULL, or
        rebuilding a table SQLite cannot alter in place. Runs in key order, after
        any rename and before the pass.

        This is what every refusal already tells the author to write, which is why
        the field is named for what it is FOR rather than for where it runs
        relative to the other bucket. Formerly `beforeMigrations:`; the old
        spelling is rewritten at load, and nothing re-runs, because the ledger
        stores the migration key alone.
      type: object
      x-telo-eval: compile
      propertyNames:
        pattern: "^[A-Za-z0-9_.-]+$"
      additionalProperties:
        $ref: "#/$defs/migration"
    migrations:
      title: Migrations
      description: >-
        Migrations that run AFTER the reconciliation pass, in key order — backfills
        and cleanups. The common case: an app with no declared tables writes this
        field alone.
      type: object
      x-telo-eval: compile
      propertyNames:
        pattern: "^[A-Za-z0-9_.-]+$"
      additionalProperties:
        $ref: "#/$defs/migration"
  $defs:
    migration:
      title: Migration
      description: >-
        Either a single `statement` or an ordered list of `statements` — exactly one.
        All statements in an entry run together.
      type: object
      oneOf:
        - required: [statement]
        - required: [statements]
      properties:
        statement:
          title: Statement
          type: string
          contentMediaType: application/sql
          x-telo-widget: code
        statements:
          title: Statements
          type: array
          minItems: 1
          items:
            type: string
            contentMediaType: application/sql
            x-telo-widget: code
