modules:
  modules/ui: Added
body: "Icons are resources: Ui.Icon is an abstract providing the one image file a glyph
  is drawn from, and Ui.FileIcon an icon drawn from an SVG, PNG or WebP file given as
  file. A navigation entry (page, link or group) takes an optional icon, a Ui.Icon
  declared in place or named by reference, and reaches a renderer carrying the address
  it serves the file at; a collapsed sidebar's rail draws each top-level entry's icon.
  preparedNavigation, exported by @telorun/ui, takes a fifth argument, the function
  serving an icon's file and answering its address. Breaking for a renderer of another
  module calling preparedNavigation: it passes that function."
