  # Forms.
  - { text: Every control from the model, translation: "Chaque contrôle issu du modèle" }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "Sans champs écrits, le formulaire dessine un contrôle par propriété, choisi d'après son schéma : une zone de texte, une liste pour une énumération, des zones numériques, une date, une date et une heure, une heure, une zone multiligne pour un document, une case à cocher, des options côte à côte pour une liste d'énumération, et des tags saisis pour une liste de mots. Une description est une indication sous son champ, et une valeur par défaut la valeur de départ." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "Chaque champ est vérifié par rapport au modèle dès qu'il a été touché : la longueur du titre, le nombre de personnes, le budget par pas de 50, l'orthographe des mots-clés. Le serveur refuse un titre que porte déjà une autre demande, et sa réponse arrive sur le titre. Ce qui est saisi est conservé dans l'adresse et dans ce navigateur — tout sauf le code d'accès, que le modèle marque en écriture seule." }
  - { text: Each control chosen by hand, translation: "Chaque contrôle choisi à la main" }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "La même demande avec un contrôle écrit pour chaque champ : le titre laissé à son contrôle dérivé, le type en options côte à côte, les canaux en liste à choix multiple, le nombre de personnes sur un curseur, l'urgence en interrupteur et les mots-clés en tags. Ce qui est saisi n'est conservé que pour cet onglet." }
  - { text: Requests received, translation: "Demandes reçues" }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "Les dernières demandes envoyées par les deux formulaires, relues après chaque enregistrement." }
  - { text: "Choices, pickers and dates", translation: "Choix, sélecteurs et dates" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "Réserver des personnes pour un projet. Le projet se choisit dans une liste lue depuis la collection des projets, chaque option avec son code en indication. Le responsable se choisit dans une boîte de dialogue, recherché par nom, parmi les membres actifs du rôle choisi au-dessus ; choisir un autre rôle relit les options et ne garde le responsable que s'il convient toujours. Les relecteurs se choisissent dans un tiroir, plusieurs à la fois, et le sponsor dans une bulle ; le sponsor commence à un e-mail par défaut, affiché sous le nom de la personne grâce à une seule recherche. Les assistants sont proposés côte à côte, trois à la fois, avec Plus pour le reste. Une personne choisie renvoie vers son e-mail." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "La période est formée de deux dates avec des préréglages, ses semaines commençant le dimanche, initialisée au mois prochain et avec un avertissement au-delà de trois mois. Le serveur refuse une période qui se termine avant de commencer ou dépasse un an, et sa réponse arrive sur la période. Les personnes autour du responsable sont affichées dès qu'un responsable est choisi, et l'adresse du site seulement pour un travail sur site." }
  - { text: The project, translation: "Le projet" }
  - { text: "Which project, and who leads the work.", translation: "Quel projet, et qui dirige le travail." }
  - { text: Around the lead, translation: "Autour du responsable" }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "Qui relit le travail, qui le parraine et qui aide." }
  - { text: When and where, translation: "Quand et où" }
  - { text: Tomorrow, translation: "Demain" }
  - { text: Next week, translation: "Semaine prochaine" }
  - { text: This month, translation: "Ce mois-ci" }
  - { text: Next month, translation: "Mois prochain" }
  - { text: Next quarter, translation: "Trimestre prochain" }
  - { text: Next year, translation: "Année prochaine" }
  - { text: Bookings, translation: "Réservations" }
  - { text: "The latest bookings, read again after every save.", translation: "Les dernières réservations, relues après chaque enregistrement." }

