project: authoring-agent
kind: Added
body: 'System prompt covers the module metadata surface. The primer now
  documents the descriptive `metadata` fields (`version`, `description`,
  `repository`, `homepage`, `documentation`, `license`), structured deprecation
  (`metadata.deprecated: { reason, replacedBy? }`, with the replacement written
  as an alias-qualified kind on a kind doc and a module ref on a module doc),
  and that there is no `authors` field because the hub derives a publisher from
  the ref. It also tells the agent that runtime and language are DERIVED from a
  kind''s controllers rather than declared, and that `search_resources` takes an
  optional `runtime` argument to avoid being offered kinds the target kernel
  cannot load.'
