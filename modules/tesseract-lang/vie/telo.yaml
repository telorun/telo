    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/vie.traineddata.gz:
        { upstream: vie, member: package/4.0.0_best_int/vie.traineddata.gz, sha256: 2284f610f262a1b19ec8df9f196b9ff6ce38ddb4a66329e998941df4b8961c8d, executable: false }
