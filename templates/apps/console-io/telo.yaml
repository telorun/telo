kind: Telo.Application
metadata:
  name: ConsoleIo
  version: 1.0.0
  description: |
    Reads a line from stdin and prints a response. The smallest interactive
    app: a `Console.readLine` step whose `result.value` flows into a
    `Console.writeLine` via a `!cel` expression. A good "does my setup work"
    starting point.
imports:
  Console: oci://ghcr.io/telorun/console@0.17.4#sha256-T3hXxYNK-UClSE_wssnkYI-urC-4c8CEx82rSBc-dR4
targets:
  - name: readName
    invoke: !ref Console.readLine
    inputs:
      prompt: "What's your name? "
  - name: greet
    invoke: !ref Console.writeLine
    inputs:
      output: !cel "'Hello, ' + steps.readName.result.value + '! Welcome to Telo.'"
