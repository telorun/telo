kind: Telo.Library
metadata:
  name: CacheRedis
  version: 0.11.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Performance, Storage]
  description: |
    Redis-backed caching shared by every instance of an application — cached results
    and counters that outlive one process, under an optional key prefix so several
    apps can share a server. When Redis is unreachable it degrades to an optional
    fallback cache, reports the degradation, and recovers on its own.
requires:
  # Controllers return their effects from `init()` / `run()`; a runtime that does
  # not execute a returned chain allocates nothing and undoes nothing.
  telo: ">=0.82.0"
imports:
  Cache: ../cache
exports:
  kinds:
    - Store
---
kind: Telo.Definition
metadata:
  name: Store
  description: >-
    Caches entries in Redis so every instance shares them, optionally namespaced by a
    key prefix. When the server is unreachable it serves a fallback cache instead,
    emits degraded and recovered events, and reconnects on its own.
capability: Telo.Provider
extends: Cache.Store
controllers:
  - pkg:telo/local/js?path=./nodejs/cache-redis.mjs&local_path=./nodejs/src/index.ts#StoreController
schema:
  type: object
  required: [url]
  additionalProperties: false
  properties:
    url:
      title: URL
      type: string
      description: Redis connection URL, e.g. `redis://localhost:6379` or `rediss://…`.
    fallback:
      title: Fallback
      description: >-
        Optional Cache.Store served when Redis is unreachable (degraded mode).
        Cache failover is safe — a miss just recomputes; the degradation is
        logged and surfaced as a `cache.degraded` / `cache.recovered` event.
      x-telo-ref:
        kind: Cache.Store
        use: dependency
    connectTimeout:
      title: Connect Timeout
      type: string
      default: "2s"
      description: How long to wait for a Redis connection before degrading (duration).
    keyPrefix:
      title: Key Prefix
      type: string
      default: ""
      description: Prefix applied to every key (namespacing a shared Redis).
