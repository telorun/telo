kind: Telo.Application
metadata:
  name: ContainerPortNotExposed
  version: 1.0.0
  description: |
    A `Container.Port` naming a port its container does not publish is refused
    by `telo check` at the library declaring it, and at creation for an
    importer whose check is silent about that library's internals.
imports: { Assert: ../../assert }
targets:
  - !ref refusedAtCheck
  - !ref refusedAtCreation
---
kind: Assert.Manifest
metadata: { name: refusedAtCheck }
source: ./__fixtures__/port-not-exposed/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: names a port the container does not publish
---
kind: Assert.Manifest
metadata: { name: refusedAtCreation }
source: ./__fixtures__/port-not-exposed-app.yaml
expect:
  errors: []
  runFails: "names port 5432, which Container.Instance \"server\" does not publish (it publishes 8080)"
