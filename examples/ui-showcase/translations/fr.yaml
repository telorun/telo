# The showcase in French: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads and translated into French's cases — `one` (0 and 1), `many` (large
# round numbers such as a million) and `other`; a word told apart by its
# context is translated once per context.
kind: I18n.Catalog
metadata:
  name: french
lang: fr
texts:
  # Applications and pages.
  - { text: UI showcase, translation: "Vitrine de l'interface" }
  - { text: UI showcase — Radix, translation: "Vitrine de l'interface — Radix" }
  - { text: UI showcase — brand, translation: "Vitrine de l'interface — marque" }
  - { text: UI showcase — sidebar, translation: "Vitrine de l'interface — barre latérale" }
  - { text: Overview, translation: "Aperçu" }
  - { text: Conditions, translation: "Conditions" }
  - { text: Data, translation: "Données" }
  - { text: Tables, translation: "Tableaux" }
  - { text: Filters, translation: "Filtres" }
  - { text: Forms, translation: "Formulaires" }
  - { text: Actions, translation: "Actions" }
  - { text: Components, translation: "Composants" }
  - { text: CRUD, translation: "CRUD" }
  - { text: Themes, translation: "Thèmes" }
  # The navigation's groups.
  - { text: Building blocks, translation: "Éléments de base" }
  - { text: Input, translation: "Saisie" }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: "Logo de la vitrine de l'interface" }
  - { text: Language, translation: "Langue" }
  - { text: Theme, translation: "Thème" }
  - { text: Default, translation: "Par défaut" }
  - { text: Radix, translation: "Radix" }
  - { text: Brand, translation: "Marque" }
  - { text: Sidebar, translation: "Barre latérale" }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: "À chaque requête" }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "Ces nœuds appartiennent à la page elle-même, donc leur when et leur texte sont évalués à chaque requête." }
  - { text: Your browser asked for Polish., translation: "Votre navigateur a demandé le polonais." }
  - { text: Your browser did not ask for Polish., translation: "Votre navigateur n'a pas demandé le polonais." }
  - { text: The Acme brand is on., translation: "La marque Acme est activée." }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "Un texte calculé par une expression est affiché tel qu'il a été calculé, jamais traduit." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "Un lien que cette requête rend invalide est remplacé par un nœud d'erreur, et le reste de la page est servi." }
  - { text: Leaves the application, translation: "Quitte l'application" }

  # The overview.
  - { text: Every node type, translation: "Chaque type de nœud" }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "Une boîte, une pile et des colonnes contiennent d'autres nœuds, chacune dessinant ses enfants à sa manière." }
  - { text: A box, translation: "Une boîte" }
  - { text: Groups its children., translation: "Regroupe ses enfants." }
  - { text: A stack, translation: "Une pile" }
  - { text: Draws its children one under another., translation: "Dessine ses enfants les uns sous les autres." }
  - { text: A badge, translation: "Un badge" }
  - { text: Columns, translation: "Colonnes" }
  - { text: "Draw their children side by side, as these three are.", translation: "Dessinent leurs enfants côte à côte, comme ces trois-ci." }
  - { text: Text in each style, translation: "Texte dans chaque style" }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "Un style dit ce que signifie un nœud ; le thème décide de son apparence. Un nœud peut en porter plusieurs." }
  - { text: Heading, translation: "Titre" }
  - { text: Subheading, translation: "Sous-titre" }
  - { text: Muted, translation: "Atténué" }
  - { text: Strong, translation: "Renforcé" }
  - { text: Accent, translation: "Accent" }
  - { text: Danger, translation: "Danger" }
  - { text: Warning, translation: "Avertissement" }
  - { text: Success, translation: "Succès" }
  - { text: Strong and accent, translation: "Renforcé et accent" }
  - { text: Links, translation: "Liens" }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "Un lien vers une page déclarée navigue au sein de l'application ; un fichier servi sous le point de montage est un chargement ordinaire ; https et mailto la quittent." }
  - { text: Go to Conditions, translation: "Aller aux conditions" }
  - { text: A file the server serves, translation: "Un fichier servi par le serveur" }
  - { text: Write to us, translation: "Nous écrire" }
  - { text: Images, translation: "Images" }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "Une image désignée par son adresse, la même image en décoration avec un alt vide, et un balisage SVG dessiné comme une image, jamais inséré dans la page." }
  - { text: The showcase mark, translation: "L'emblème de la vitrine" }
  - { text: Three overlapping circles, translation: "Trois cercles qui se chevauchent" }
  - { text: Values by their schema, translation: "Valeurs selon leur schéma" }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "Chaque valeur est dessinée comme l'indique sa propriété de modèle, lue dans l'enregistrement de l'équipe que charge la page." }
  - { text: Visit the team homepage, translation: "Visiter la page d'accueil de l'équipe" }
  - { text: "A uri, drawn as a link with a text of its own", translation: "Une uri, dessinée comme un lien avec son propre texte" }
  - { text: A uri-reference to a declared page, translation: "Une uri-reference vers une page déclarée" }
  - { text: A uri-reference to a served file, translation: "Une uri-reference vers un fichier servi" }
  - { text: A mailto address, translation: "Une adresse mailto" }
  - { text: "An address the rule refuses, drawn as plain text", translation: "Une adresse refusée par la règle, dessinée en texte brut" }
  - { text: A date, translation: "Une date" }
  - { text: A date and time, translation: "Une date et une heure" }
  - { text: A boolean, translation: "Un booléen" }
  - { text: An enumeration's label, translation: "Le libellé d'une énumération" }
  - { text: A list, translation: "Une liste" }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "Les lignes que contient une réponse, jamais paginées. Un en-tête reprend par défaut le titre de la propriété, et la dernière colonne n'est affichée que tant que l'équipe recrute." }
  - { text: Projects under way, translation: "Projets en cours" }
  - { text: Project, translation: "Projet" }
  - { text: Texts, translation: "Textes" }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": "Aucun projet pour l'instant."
        one: "{$count} projet jusqu'ici."
        many: "{$count} de projets jusqu'ici."
        other: "{$count} projets jusqu'ici."
  - { text: "{$team} started {$project} most recently.", translation: "{$team} a démarré {$project} en dernier." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "Un pluriel choisi dans le navigateur selon le nombre qu'il lit, et un texte dont les valeurs viennent de l'enregistrement." }
  - { text: Open, context: state, translation: "Ouvert" }
  - { text: Open, context: verb, translation: "Ouvrir" }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "Le texte propre d'un nœud se distingue de la même façon : le badge dit que TEL-42 est ouvert, le lien propose d'ouvrir ses tâches." }
  - { text: Style rules, translation: "Règles de style" }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "Le style d'une ligne et celui d'une cellule sont choisis par une valeur de la ligne. Le projet mis en avant est renforcé, chaque statut a sa couleur, et un statut qu'aucun cas ne nomme prend le style par défaut. Deux colonnes ont pour en-tête le même mot, Open, distingué par le contexte avec lequel chaque en-tête est écrit." }
  - { text: Composites, translation: "Composites" }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "Toute cette page est une vue que chaque application place par référence. Ci-dessous, une vue écrite en ligne là où elle est placée, et un type composite propre à cet exemple, qui n'a pas de contrôleur." }
  - { text: A view declared inline at the node that places it., translation: "Une vue déclarée en ligne dans le nœud qui la place." }
  - { text: A callout, translation: "Un encadré" }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Déclaré une seule fois comme un type qui étend Ui.Composite et fournit une vue, et placé avec ses propres champs." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: "Onglets" }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "Du contenu sous des onglets, un onglet à la fois. L'onglet choisi fait partie de l'adresse de la page, donc un rechargement ou un lien partagé le rouvre." }
  - { text: Summary, translation: "Résumé" }
  - { text: "A tab holds any nodes, as a box does.", translation: "Un onglet contient n'importe quels nœuds, comme une boîte." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "Seuls les nœuds de l'onglet choisi sont dessinés." }
  - { text: Chosen, translation: "Choisi" }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "Chaque onglet est livré selon son propre when, comme tout nœud." }
  # The labels of the overview's models.
  - { text: Code, translation: "Code" }
  - { text: Name, translation: "Nom" }
  - { text: Status, translation: "Statut" }
  - { text: Active, translation: "Actif" }
  - { text: Paused, translation: "En pause" }
  - { text: Finished, translation: "Terminé" }
  - { text: Budget, translation: "Budget" }
  - { text: Started, translation: "Démarré le" }
  - { text: Free, context: subscription, translation: "Gratuit" }
  - { text: Enterprise, context: subscription, translation: "Entreprise" }
  - { text: Version, translation: "Version" }
  - { text: Team, context: subscription, translation: "Équipe" }

  # Conditions.
  - { text: Delivered and drawn, translation: "Livré et dessiné" }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "Le when d'un nœud décide sur le serveur s'il est livré ; son shown décide dans le navigateur si un nœud livré est dessiné." }
  - { text: Never delivered — this node is not in the page document., translation: "Jamais livré — ce nœud n'est pas dans le document de la page." }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "Livré et jamais dessiné : le statut n'est pas paused, donc le navigateur le garde hors de vue." }
  - { text: Delivered by its when and drawn by its shown., translation: "Livré par son when et dessiné par son shown." }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "La condition d'un placement autour d'un composite dont le nœud a sa propre condition est enveloppée dans une boîte, et les deux doivent être remplies." }
  - { text: Both conditions hold., translation: "Les deux conditions sont remplies." }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "Une vue dont le contenu est désactivé par son propre when ne fournit aucun nœud, donc le composite qui la place est omis." }
  - { text: Never provided., translation: "Jamais fourni." }
  - { text: Every keyword of a condition, translation: "Chaque mot-clé d'une condition" }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "Chaque ligne ci-dessous est dessinée parce que sa condition est remplie pour le résumé du projet TEL-42 lu par cette page : statut active, quatre membres, vélocité 2.5, tags design et web, un manager comme responsable, une note null et aucun codename." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: entre 1 et 10 personnes y travaillent." }
  - { text: "required: the lead has an e-mail.", translation: "required: le responsable a un e-mail." }
  - { text: "properties: the lead is a manager.", translation: "properties: le responsable est un manager." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: au moins trois personnes y travaillent." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: au plus neuf personnes y travaillent." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: la vélocité est supérieure à 2." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: la vélocité est inférieure à 3." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: la vélocité est un multiple de 0.5." }
  - { text: "type: the status is a string.", translation: "type: le statut est une chaîne." }
  - { text: "type, as a list: the note is a string or null.", translation: "type, sous forme de liste : la note est une chaîne ou null." }
  - { text: "const: the status is active.", translation: "const: le statut est active." }
  - { text: "enum: the status is active or paused.", translation: "enum: le statut est active ou paused." }
  - { text: "not: the status is not paused.", translation: "not: le statut n'est pas paused." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: le code commence par TEL ou OPS." }
  - { text: "items: every tag has at least two letters.", translation: "items: chaque tag a au moins deux lettres." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: il y a au moins deux tags." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: il y a au plus cinq tags." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: aucun tag ne se répète." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: le code a au moins trois caractères." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: le code a au plus dix caractères." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: le code est formé de lettres, d'un tiret et de chiffres." }
  - { text: Missing and null, translation: "Absent et null" }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null est une valeur présente. Une valeur absente ne remplit aucune condition, pas même une condition sous not, donc l'absence se teste sur le parent." }
  - { text: The note is present and null., translation: "La note est présente et vaut null." }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "Jamais dessiné : un codename absent ne remplit pas not." }
  - { text: "The project has no codename, tested on the summary.", translation: "Le projet n'a pas de codename, testé sur le résumé." }
  - { text: Query parameters, translation: "Paramètres de requête" }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "Ce lecteur déclare mode, une liste de valeurs tag et un ticket soumis à un motif. Un paramètre que l'adresse omet, un paramètre unique donné deux fois ou une valeur que sa déclaration refuse compte comme absent." }
  - { text: Mode detailed, translation: "Mode detailed" }
  - { text: Two tags, translation: "Deux tags" }
  - { text: A valid ticket, translation: "Un ticket valide" }
  - { text: A refused ticket, translation: "Un ticket refusé" }
  - { text: Mode given twice, translation: "Mode donné deux fois" }
  - { text: Clear the query, translation: "Effacer la requête" }
  - { text: mode is detailed., translation: "mode vaut detailed." }
  - { text: There are two tag values or more., translation: "Il y a au moins deux valeurs tag." }
  - { text: The ticket matches its pattern., translation: "Le ticket correspond à son motif." }
  - { text: "No ticket, or one its pattern refuses.", translation: "Aucun ticket, ou un ticket que son motif refuse." }
  - { text: Enablement, translation: "Activation" }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "Le bouton ne peut être pressé que lorsque sa condition sur le contenu du formulaire est remplie, et il indique pourquoi tant qu'elle ne l'est pas. Un tag que le projet a déjà est refusé, et les lignes ci-dessus relisent le résumé après l'ajout d'un tag." }
  - { text: Tag TEL-42, translation: "Taguer TEL-42" }
  - { text: Tag, translation: "Tag" }
  - { text: Type a tag of three letters or more., translation: "Saisissez un tag d'au moins trois lettres." }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation:
      plural: count
      cases:
        one: "Tag {$tag} ajouté : TEL-42 a maintenant {$count} tag."
        many: "Tag {$tag} ajouté : TEL-42 a maintenant {$count} de tags."
        other: "Tag {$tag} ajouté : TEL-42 a maintenant {$count} tags."
  - { text: A page's own query, translation: "La requête propre d'une page" }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "Cette page déclare aussi mode, et ses propres nœuds le lisent." }
  - { text: The page reads mode as detailed., translation: "La page lit mode comme detailed." }

  # Data.
  - { text: A reader and its parameters, translation: "Un lecteur et ses paramètres" }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "Le projet est le paramètre project de l'adresse de la page, envoyé avec la lecture ; sans lui, le paramètre n'est pas envoyé et la route répond pour TEL-42. Un code qu'aucun projet ne porte dessine l'arbre d'échec." }
  - { text: A code no project has, translation: "Un code qu'aucun projet ne porte" }
  - { text: No project, translation: "Aucun projet" }
  - { text: Reading the project…, translation: "Lecture du projet…" }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, dirigé par {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "Un lecteur imbriqué dans le contenu de celui-ci lit les personnes qui travaillent sur le même projet." }
  - { text: Working on it, translation: "Y travaillent" }
  - { text: Role, translation: "Rôle" }
  - { text: E-mail, translation: "E-mail" }
  - { text: "No answer · {$code}", translation: "Aucune réponse · {$code}" }
  - { text: Readers that fail, translation: "Lecteurs en échec" }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "Sans arbre d'échec propre, les lecteurs dessinent le code et le message de l'erreur — pour un projet qui n'existe pas, pour une route protégée lue sans session, et pour une réponse que le modèle du lecteur refuse (la liste des projets lue comme un seul projet)." }
  - { text: "Never drawn: there is no such project.", translation: "Jamais dessiné : ce projet n'existe pas." }
  - { text: "Signed in, so this reads: {$name}", translation: "Connecté, donc ceci se lit : {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "Jamais dessiné : une liste n'est pas un projet." }
  - { text: Read again on focus, translation: "Relecture au retour du focus" }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "Ce lecteur relit l'heure du serveur chaque fois que la fenêtre reprend le focus. Passez à une autre fenêtre, puis revenez." }
  - { text: Read at, translation: "Lu à" }
  - { text: A sign-in gate, translation: "Une barrière de connexion" }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "La barrière lit si une session est ouverte, et relit chaque fois qu'une requête en son sein reçoit la réponse 401. Se connecter ouvre une session pour un membre de l'équipe ; un e-mail qu'aucun membre de l'équipe n'a est refusé sur son champ. À l'intérieur, un lecteur sur une route protégée affiche le compte. Mettre fin discrètement à la session laisse le compte à l'écran jusqu'à ce que la prochaine requête protégée — la vérification ci-dessous, ou un retour du focus — soit refusée ; la barrière bascule alors sur la vue déconnectée." }
  - { text: You are signed out., translation: "Vous êtes déconnecté." }
  - { text: Sign in, translation: "Se connecter" }
  - { text: "Signed in as {$name}", translation: "Connecté en tant que {$name}" }
  - { text: "Member since {$since}", translation: "Membre depuis {$since}" }
  - { text: Check the session, translation: "Vérifier la session" }
  - { text: End the session quietly, translation: "Mettre fin discrètement à la session" }
  - { text: Sign out, translation: "Se déconnecter" }

  # The labels of the task models.
  - { text: Task, translation: "Tâche" }
  - { text: Assignee, translation: "Personne assignée" }
  - { text: Priority, translation: "Priorité" }
  - { text: Estimate, translation: "Estimation" }
  - { text: Due, translation: "Échéance" }
  - { text: Label, translation: "Étiquette" }
  - { text: Blocked, translation: "Bloqué" }
  - { text: To do, translation: "À faire" }
  - { text: In progress, translation: "En cours" }
  - { text: In review, translation: "En revue" }
  - { text: Bug, translation: "Bogue" }
  - { text: Feature, translation: "Fonctionnalité" }
  - { text: Chore, translation: "Maintenance" }
  - { text: Docs, translation: "Documentation" }
  - { text: Contact, translation: "Contact" }
  - { text: Project name, translation: "Nom du projet" }
  - { text: Brief, translation: "Descriptif" }

  # Tables.
  - { text: Columns from the model, translation: "Colonnes issues du modèle" }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "Sans colonnes écrites, un tableau en affiche une par propriété du modèle, sauf la clé de ligne, chacune avec son titre en en-tête et dessinée selon son type. Il affiche 25 lignes par page, la valeur par défaut, et ouvre ses formulaires de création et de modification dans une boîte de dialogue, la surface qu'un tableau utilise quand il n'en nomme aucune." }
  - { text: "Written columns, sorting and style rules", translation: "Colonnes écrites, tri et règles de style" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "Des colonnes écrites à la main, dans l'ordre donné, dont une avec son propre en-tête. Une colonne est triable là où la collection liste sa propriété pour le tri. La ligne d'une tâche bloquée est renforcée et rouge, chaque cellule de statut a sa couleur, et une priorité qu'aucun cas ne nomme prend le style par défaut. Huit lignes par page." }
  - { text: Where, translation: "Où" }
  - { text: Members behind a reference, translation: "Membres derrière une référence" }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "Le tableau des tâches renvoie chaque tâche avec sa personne assignée et son projet imbriqués. Une colonne sur un membre imbriqué prend le titre et la présentation de ce membre via une forme nommée, via une définition propre au modèle, et via une référence dont le titre propre l'emporte sur la forme qu'elle nomme : le contact est un lien de messagerie et le descriptif un lien vers une page." }
  - { text: Filtered by the address, translation: "Filtré par l'adresse" }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "Ce tableau déclare un paramètre project et l'envoie comme égalité avec chaque requête. Sans projet dans l'adresse, il ne lit rien." }
  - { text: Atlas redesign tasks, translation: "Tâches de la refonte Atlas" }
  - { text: Billing migration tasks, translation: "Tâches de la migration de la facturation" }
  - { text: Blocked tasks, translation: "Tâches bloquées" }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "Celui-ci est filtré par une valeur fixe écrite dans le tableau, et ne liste que les tâches bloquées." }
  - { text: Where a form opens, translation: "Où s'ouvre un formulaire" }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "Chaque tableau ci-dessous ouvre ses formulaires de création et de modification sur une surface différente. Un enregistrement recharge chaque tableau de tâches de la page." }
  - { text: Dialogs, translation: "Boîtes de dialogue" }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "Création dans une petite boîte de dialogue qui reste ouverte, vidée, pour une autre tâche. Modification dans une grande boîte de dialogue qui ne bloque pas la page et ignore un clic à l'extérieur ; elle garde ses valeurs après un enregistrement, abandonne la saisie non enregistrée sans demander, et fait partie de l'adresse. Chaque ligne propose une suppression avec confirmation." }
  - { text: Drawers, translation: "Tiroirs" }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "Création dans un petit tiroir depuis le bord de début ; modification dans un grand tiroir depuis le bord de fin, sans bouton de fermeture. Les deux se ferment après un enregistrement et demandent avant d'abandonner une saisie non enregistrée." }
  - { text: Sheets, translation: "Feuilles" }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "Création dans une feuille depuis le haut, qui ne bloque pas la page ; modification dans une feuille pleine depuis le bas, qui fait partie de l'adresse." }
  - { text: Popovers, translation: "Bulles" }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "Création dans une carte à côté du bouton Nouveau, centrée sur lui ; sous le point de rupture, elle devient une boîte de dialogue complète. Modification dans une carte sous le bouton de la ligne, alignée sur sa fin, qu'un clic à l'extérieur ne ferme pas et qui reste ouverte après un enregistrement." }
  - { text: In line, translation: "En ligne" }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "Le formulaire de création s'ouvre au-dessus des lignes et celui de modification sous la ligne qu'il change. Sous le point de rupture, le formulaire de création s'ouvre dans une feuille depuis le bas." }
  - { text: Panels, translation: "Panneaux" }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "Création dans un petit panneau au bord de début, qu'Échap ne ferme pas. Modification dans un grand panneau au bord de fin, qui fait partie de l'adresse, avec les lignes toujours utilisables à côté ; sous le point de rupture, il devient une feuille depuis le bas." }
  - { text: A page of its own, translation: "Une page à part" }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "La création et la modification remplacent le contenu de la page sous un même nom d'adresse, donc l'adresse indique soit une nouvelle tâche, soit la tâche de cette clé, et Retour ferme le formulaire. La surface est déclarée une fois et nommée par les deux." }

  # Filters.
  - { text: Every filter the collection accepts, translation: "Chaque filtre qu'accepte la collection" }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "Sans champs écrits, la barre dessine un contrôle par filtre qu'accepte la collection, dans son ordre et d'après la propriété du modèle : une liste pour une énumération ou une valeur oui/non, une zone de saisie typée sinon, et un seul libellé au-dessus des deux bornes d'un intervalle. Elle se place au-dessus du tableau, applique un choix immédiatement et le texte saisi sur Entrée, et ne conserve rien d'une visite à l'autre." }
  - { text: Every control, translation: "Chaque contrôle" }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "Chaque façon de saisir un filtre : texte saisi, options côte à côte, une liste, des tags saisis, un curseur, un interrupteur, et deux dates sous un seul libellé. Le filtre de projet n'est dessiné nulle part et seul un préréglage le définit. Le statut commence à sa valeur par défaut, et un préréglage définit les filtres que les préréglages nomment et efface les autres qu'ils nomment. Des pastilles résument le choix, et les valeurs font partie de l'adresse. Sous le point de rupture, la barre se replie, et le filtre de texte épinglé reste hors du repli." }
  - { text: Urgent, translation: "Urgent" }
  - { text: Atlas only, translation: "Atlas uniquement" }
  - { text: Stuck, translation: "Enlisé" }
  - { text: "Beside, as chips, while typing", translation: "À côté, en pastilles, pendant la saisie" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "Les contrôles se placent dans une colonne au bord de début. Seuls les filtres que vous choisissez sont affichés : ajoutez-en un depuis la liste de la barre, et le retirer l'efface. Chaque filtre est une pastille indiquant sa valeur, qui ouvre son contrôle. Le texte saisi s'applique après une pause, et les deux bornes d'un nombre sont légendées après et avant. Le choix est conservé dans ce navigateur d'une visite à l'autre. Sous le point de rupture, la barre s'ouvre dans une feuille depuis le bas." }
  - { text: "Beside at the end, applied by a button", translation: "À côté, en fin, appliqué par un bouton" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "Les contrôles se placent au bord de fin, et une modification attend Appliquer, tandis qu'un préréglage, Réinitialiser et le retrait d'une pastille de résumé s'appliquent immédiatement. Plusieurs personnes assignées se saisissent séparées par des virgules. Le choix n'est conservé que pour cet onglet, et survit à un rechargement." }
  - { text: Due by October, translation: "Échéance d'ici octobre" }
  - { text: "Folded, starting open", translation: "Replié, ouvert au départ" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "Les contrôles se replient derrière une bascule qui compte les filtres ayant une valeur, et commencent dépliés. Le filtre de texte épinglé reste hors du repli, et les autres s'ajoutent depuis la liste de la barre. Le statut commence à en cours ; le retirer efface aussi cette valeur par défaut, et Réinitialiser la rétablit. Les valeurs sont conservées à la fois dans l'adresse et dans ce navigateur, l'adresse l'emportant, et le repli que vous choisissez est mémorisé." }
  - { text: "Folded, starting closed", translation: "Replié, fermé au départ" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "Replié au départ. Le filtre de texte épinglé, Appliquer et Réinitialiser restent hors du repli. L'étiquette commence à sa valeur par défaut, bogues, jusqu'à ce qu'elle soit changée, et Réinitialiser rétablit la valeur par défaut." }
  - { text: In a dialog, translation: "Dans une boîte de dialogue" }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "Les contrôles s'ouvrent dans une petite boîte de dialogue depuis un bouton qui compte les filtres ayant une valeur, et se ferment avec OK. La boîte de dialogue ouverte fait partie de l'adresse, donc un lien l'ouvre. Le filtre de texte épinglé reste à côté du bouton, et des pastilles résument le choix." }
  - { text: In a drawer, translation: "Dans un tiroir" }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "Les contrôles s'ouvrent dans un tiroir depuis le bord de début, qu'un clic à l'extérieur ne ferme pas. Les valeurs saisies s'appliquent après une pause." }
  - { text: In a popover, translation: "Dans une bulle" }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "Les contrôles s'ouvrent dans une carte sous le bouton, alignée sur sa fin ; sous le point de rupture, dans une feuille depuis le bas." }

