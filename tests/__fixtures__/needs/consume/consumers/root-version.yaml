kind: Telo.Application
metadata:
  name: RootVersionUnverified
  version: 1.0.0
  description: States a version on its own need and forwards it whole to a library that reads it by field only.
imports:
  Kinds: ../kinds
  Lib:
    source: ../plainread
    needs:
      access: !ref access
needs:
  access:
    kind: Kinds.DatabaseAccess
    version: ">=15.0.0"
