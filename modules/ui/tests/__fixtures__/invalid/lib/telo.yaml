# Composites, surfaces and filter bars that each name something their model,
# their collection or their own shape cannot answer for. `telo check` reports
# every one here; a consumer's own check sees none of them, so there each is
# refused when it is first read.
kind: Telo.Library
metadata:
  name: UiInvalid
  version: 1.0.0
  description: >-
    Test fixture exporting listings, a form and filter bars that each name a
    property, an operator, a facet or an option source their data model or
    their collection does not support, surfaces whose compact surface is addressed or has a
    compact surface of its own, a form and actions whose fields their model
    cannot answer for or no control can enter, an action clearing its answer on
    a property its input model does not declare, and a listing and a list whose
    row action is given inputs that make no record of its input model.
imports:
  Ui: ../../../../
  DataModel: ../../../../../data-model
exports:
  resources:
    - sourceFilter
    - sourceFilterNotAccepted
    - formField
    - formFieldUnsupported
    - filterNotAccepted
    - filterValuesNotFaceted
    - filterOptionValueMismatch
    - compactAddressed
    - compactNested
    - filterDuplicate
    - filterDefaultInvalid
    - filterControlUnsupported
    - presetUnknownFilter
    - presetValueInvalid
    - presetLabelDuplicate
    - toggleOverText
    - toggleUntyped
    - toggleDefaultOff
    - togglePresetOff
    - actionFieldUnknown
    - actionFieldUnsupported
    - actionRequiredNotEntered
    - actionRequiredNotEnterable
    - actionClearUnknown
    - rowActionInputs
    - listRowActionInputs
---
kind: Telo.JsonSchema
metadata:
  name: Todo
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
    text: { type: string }
    isDone: { type: boolean }
    count: { type: integer }
---
kind: Ui.CollectionPresentation
metadata: { name: todos }
source:
  kind: Ui.CollectionSource
  basePath: /api/todos
  collection:
    kind: DataModel.Collection
    model: !ref Todo
    query: { filters: [{ property: text, operator: contains }], sort: [] }
---
kind: Ui.Listing
metadata: { name: sourceFilter }
model: !ref Todo
presentation: !ref todos
filters: { done: true }
---
kind: Ui.Listing
metadata: { name: sourceFilterNotAccepted }
model: !ref Todo
presentation: !ref todos
filters: { isDone: true }
---
kind: Ui.Form
metadata: { name: formField }
model: !ref Todo
presentation: !ref todos
fields: [id, text, title]
---
kind: Ui.Filters
metadata: { name: filterNotAccepted }
presentation: !ref todos
fields:
  - { property: text, operator: contains }
  - { property: text, operator: eq }
content: { type: text, text: Todos }
---
kind: Ui.Panel
metadata:
  name: compactAddressed
compact:
  kind: Ui.Dialog
  address: { name: todo }
---
kind: Ui.Dialog
metadata:
  name: compactNested
compact:
  kind: Ui.Drawer
  compact: { kind: Ui.Dialog }
---
# Accepts everything the bars below ask for, and facets nothing.
kind: Ui.CollectionPresentation
metadata: { name: flags }
source:
  kind: Ui.CollectionSource
  basePath: /api/todos
  collection:
    kind: DataModel.Collection
    model: !ref Todo
    query:
      filters:
        - { property: text, operator: contains }
        - { property: isDone, operator: eq }
        - { property: count, operator: gte }
      sort: []
---
kind: Ui.Filters
metadata: { name: filterValuesNotFaceted }
presentation: !ref flags
fields:
  - { property: isDone, operator: eq, values: present }
content: { type: text, text: Todos }
---
# Options whose value is text, for an integer property.
kind: Ui.Filters
metadata: { name: filterOptionValueMismatch }
presentation: !ref flags
fields:
  - property: count
    operator: gte
    options:
      kind: Ui.CollectionOptions
      model: !ref Todo
      value: !cel "row.text"
      label: !cel "row.text"
      source: { kind: Ui.CollectionSource, collection: !ref todoValues, basePath: /api/todos }
content: { type: text, text: Todos }
---
kind: DataModel.Collection
metadata: { name: todoValues }
model: !ref Todo
query: { filters: [{ property: text, operator: in }], sort: [] }
---
kind: Ui.Filters
metadata:
  name: filterDuplicate
presentation: !ref flags
fields:
  - { property: text, operator: contains }
  - { property: text, operator: contains }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: filterDefaultInvalid
presentation: !ref flags
fields:
  - { property: isDone, operator: eq, default: "yes" }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: filterControlUnsupported
presentation: !ref flags
fields:
  - { property: count, operator: gte, control: toggle }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: presetUnknownFilter
presentation: !ref flags
fields:
  - { property: isDone, operator: eq }
presets:
  - label: Big
    values:
      - { property: count, operator: gte, value: 3 }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: presetValueInvalid
presentation: !ref flags
fields:
  - { property: isDone, operator: eq }
presets:
  - label: Done
    values:
      - { property: isDone, operator: eq, value: [true] }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: presetLabelDuplicate
presentation: !ref flags
presets:
  - label: Done
    values:
      - { property: isDone, operator: eq, value: true }
  - label: Done
    values:
      - { property: isDone, operator: eq, value: false }
content: { type: text, text: Todos }
---
# A switch is on or holds nothing, over a property that says it is a boolean.
kind: Telo.JsonSchema
metadata:
  name: Loose
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
    note: { type: [string, "null"] }
    anything: {}
    isDone: { type: [boolean, "null"] }
---
kind: Ui.CollectionPresentation
metadata: { name: loose }
source:
  kind: Ui.CollectionSource
  basePath: /api/loose
  collection:
    kind: DataModel.Collection
    model: !ref Loose
    query:
      filters:
        - { property: note, operator: eq }
        - { property: anything, operator: eq }
        - { property: isDone, operator: eq }
      sort: []
---
kind: Ui.Filters
metadata:
  name: toggleOverText
presentation: !ref loose
fields:
  - { property: note, operator: eq, control: toggle }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: toggleUntyped
presentation: !ref loose
fields:
  - { property: anything, operator: eq, control: toggle }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: toggleDefaultOff
presentation: !ref loose
fields:
  - { property: isDone, operator: eq, control: toggle, default: false }
content: { type: text, text: Todos }
---
kind: Ui.Filters
metadata:
  name: togglePresetOff
presentation: !ref loose
fields:
  - { property: isDone, operator: eq, control: toggle }
presets:
  - label: Open
    values:
      - { property: isDone, operator: eq, value: false }
content: { type: text, text: Todos }
---
kind: Telo.JsonSchema
metadata:
  name: Report
schema:
  type: object
  required: [month]
  properties:
    month: { type: string }
    options:
      type: object
      properties:
        compact: { type: boolean }
    pages: { type: array, items: { type: object } }
---
kind: Ui.Form
metadata:
  name: formFieldUnsupported
model: !ref Report
presentation: !ref todos
fields: [month, options, pages]
---
# A list of scalars is a field a form can enter: nothing is reported.
kind: Ui.Form
metadata:
  name: formFieldList
model:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      tags: { type: array, items: { type: string } }
presentation: !ref todos
fields: [tags]
---
kind: Ui.Action
metadata:
  name: actionFieldUnknown
inputModel: !ref Report
source: { path: /api/reports }
label: Generate
fields: [month, year]
---
kind: Ui.Action
metadata:
  name: actionFieldUnsupported
inputModel: !ref Report
source: { path: /api/reports }
label: Generate
fields: [month, options, pages]
---
kind: Ui.Action
metadata:
  name: actionRequiredNotEntered
inputModel: !ref Report
source: { path: /api/reports }
label: Generate
fields: []
---
# No `fields`: the default set holds no field for the required `options`.
kind: Ui.Action
metadata:
  name: actionRequiredNotEnterable
inputModel:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [options]
    properties:
      options: { type: object }
source: { path: /api/reports }
label: Generate
---
kind: Telo.JsonSchema
metadata:
  name: Removal
schema:
  type: object
  additionalProperties: false
  required: [count]
  properties:
    count: { type: integer }
    note: { type: string }
---
kind: Ui.Action
metadata:
  name: remove
inputModel: !ref Removal
source: { path: /api/todos/remove }
label: Remove
---
kind: Ui.Action
metadata:
  name: actionClearUnknown
inputModel: !ref Removal
source: { path: /api/todos/remove }
label: Remove
clearAnswerOn: [count, total]
---
# A key the closed model does not declare, a value its property refuses, and
# the required input left unbound.
kind: Ui.Listing
metadata:
  name: rowActionInputs
model: !ref Todo
presentation: !ref todos
rowActions:
  - action: !ref remove
    inputs: { total: !cel "row.count", note: 5 }
---
# The same inputs, given by a row of a list a reader draws.
kind: Ui.Data
metadata:
  name: listRowActionInputs
model:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      todos: { type: array, items: !ref Todo }
source: { path: /api/todos }
content:
  type: list
  rows: !cel "data.todos"
  columns: [{ value: !cel "row.text" }]
  rowActions:
    - action: !ref remove
      inputs: { total: !cel "row.count", note: 5 }
