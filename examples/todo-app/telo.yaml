kind: Telo.Application
metadata:
  name: TodoApp
  version: 1.0.0
  categories: [ Transport, Storage ]
  description: |
    A complete app served as one unit: the REST todo API and the vanilla HTML/JS
    frontend that consumes it (Http.Static), on a single port. The whole REST
    surface is one declarative Crud.Resource — list / read / create / update /
    delete over the `todos` table — mounted alongside the static frontend.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.32.0#sha256-BCghrZHLFCpZUhbYn9MBbRM2hsLssW3KD9IqqhxEwzU
  Sql: oci://ghcr.io/telorun/sql@0.24.0#sha256-g0Bw5AjrBOGmgGbmsKFb7q833AYlutxV1fDWka47t2I
  SQLite: oci://ghcr.io/telorun/sqlite@0.5.1#sha256-EwMIFmqcg8lg56OCcySKg5NgZ4iNP7hX-no8pEfjV6c
  Crud: oci://ghcr.io/telorun/crud@0.18.0#sha256-LXRqONj6G9nVMkcqf1JJSJLO5rc7wnPOsWjpR8dPJlI
targets:
  - !ref migrate
  - !ref server
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8077
variables:
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: Telo.HostPath
    default: todo.db
---
kind: SQLite.Connection
metadata:
  name: db
file: !cel "variables.dbFile"
---
kind: SQLite.Table
metadata:
  name: todos
table: todos
columns:
  id: { type: integer, primaryKey: true, identity: always }
  text: { type: text, nullable: false }
  is_done: { type: integer, nullable: false, default: 0 }
  created_at: { type: text, defaultExpression: "datetime('now')" }
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
tables:
  - !ref todos
---
kind: Http.Server
metadata:
  name: server
port: !cel "ports.http"
openapi:
  info:
    title: Todo API
    version: 1.0.0
mounts:
  - path: /api/todos
    mount:
      # The entire REST API: CRUD over the `todos` table. Mounted at /api/todos, it
      # serves GET / (list), GET /{id}, POST /, PUT /{id}, DELETE /{id}.
      kind: Crud.Resource
      connection: !ref db
      plural: todos
      singular: todo
      # The model is the request contract too: a POST without `text`, or with a
      # property that isn't here, is rejected with a 400 before the database is
      # touched. `isDone` reads and writes the snake_case column `is_done`.
      model:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [ text ]
          additionalProperties: false
          properties:
            text: { type: string, minLength: 1 }
            isDone: { type: boolean }

  - path: /
    mount: !ref ui
---
kind: Http.Static
metadata:
  name: ui
# Ships with the module, so publishing and packaging carry it.
root: !module-path ./public
