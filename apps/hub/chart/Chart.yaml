apiVersion: v2
name: hub
description: Telo Hub API — federated discovery over Telo modules, served over HTTP and MCP. Deploys the hub alone; its database, manifest bucket and embeddings server are supplied.
type: application
# BOTH are the hub unit's version — `metadata.version` in `apps/hub/telo.yaml` —
# written by `telo release apply` (the unit's `helm` anchor): the chart deploys
# exactly one image, `telorun/hub`, tagged with that version.
version: 0.27.0
appVersion: "0.27.0"
keywords:
  - telo
  - hub
home: https://telo.run
sources:
  - https://github.com/telorun/telo
