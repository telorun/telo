kind: Telo.Application
metadata:
  name: JavaScriptDemo
  version: 1.0.0
  description: A demo showcasing a JavaScript script run from flat `targets`.
imports:
  JavaScript: oci://ghcr.io/telorun/javascript@0.10.0#sha256-ilo-aCnvVbrXDsj68GBMNmYbWEzr2SRuWaK1gT4GrRw
  Console: oci://ghcr.io/telorun/console@0.15.0#sha256-TXqhVyXKPxNKmQ2V0agBCMo6k_GWYd61192g9j5eRd0
targets:
  - name: Step1
    invoke: !ref MultiplyBy2
    inputs:
      value: 42
  - name: PrintResult
    invoke: !ref Console.writeLine
    inputs:
      output: |
        Evaluated JavaScript code.
        Result is: ${{ steps.Step1.result.result }}
---
kind: JavaScript.Script
metadata:
  name: MultiplyBy2
code: |
  function main({ value }) {
    return { result: value * 2 }
  }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      value: { type: number }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      result: { type: number }
