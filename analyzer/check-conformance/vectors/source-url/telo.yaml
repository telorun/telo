kind: Telo.Application
metadata: { name: SourceUrlApp }
sources:
  insecure:
    version: 1.0.0
    purl: pkg:generic/insecure
    url: http://example.test/{version}/{upstream}.tar.gz
    archive: tar.gz
    notices: [./LICENSE]
    entries: {}
  loopback:
    version: 1.0.0
    purl: pkg:generic/loopback
    url: http://127.0.0.1:8080/{version}.tar.gz
    archive: tar.gz
    notices: [./LICENSE]
    entries: {}
  placeholder:
    version: 1.0.0
    purl: pkg:generic/placeholder
    url: https://example.test/{os}/{version}.tar.gz
    archive: tar.gz
    notices: [./LICENSE]
    entries: {}
  relative:
    version: 1.0.0
    purl: pkg:generic/relative
    url: example.test/x.tar.gz
    archive: tar.gz
    notices: [./LICENSE]
    entries: {}
  Bad_Name:
    version: ""
    url: https://example.test/x.tar.gz
    archive: tar.gz
    notices: [../LICENSE]
    entries: {}
