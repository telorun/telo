modules:
  modules/idempotency-sql: Added
body: "New module: the shared half of a transactional idempotency ledger for SQL
  databases. The Ledger abstract (a Service: connection, schema, table, name, and a
  positive retention) records idempotency keys in a table of the application's own
  database, and Once runs a body at most once per key inside a transaction the caller
  has open on the ledger's connection: the key is recorded beside the body's writes, so
  a rollback forgets it and a commit keeps it for the retention window, after which it
  reads as absent. A concurrent call with the same key waits for the first transaction
  to end. The inputs Once forwards are checked against the body's own input contract. An
  optional fingerprint is stored as a digest of its canonical encoding, and the same key
  with a different one is refused with ERR_IDEMPOTENCY_KEY_CONFLICT. Once outside a
  transaction on its ledger's connection is refused by telo check and at run
  (ERR_ZONE_REQUIRED). A ledger removes expired keys in small background batches that
  skip rows another transaction holds, starting from its first write or earlier when it
  is a boot target, and takes no hold on the process. Requires telo 0.122.0."
