modules:
  modules/crud: Added
body: "The list route is a collection: limit (1-100, default 25), an opaque stateless
  cursor, a one-property sort with nulls last and id as tiebreaker, and filters by
  equality, contains, gt / gte / lt / lte and in, each read by the property's model
  type; limit, cursor and sort are typed in the request schema, and a bad query is the
  400 request-validation envelope naming the parameter. Crud.Ui adds a filter bar, table
  and create / edit form over a model and a base path, and expands into hand-writable
  Ui.Filters, Ui.Table and Ui.Form. Every route returns values in the model's declared
  JSON types, so a boolean is true / false on SQLite; both read routes and the update
  route run through the connection's dialect. Requires telo 0.112.0 or newer (requires:
  telo: \">=0.112.0\"). BREAKING: GET on the collection answers { rows, total, next }
  instead of a bare array, and returns at most 100 rows per request. BREAKING: PUT
  replaces the row instead of updating the columns present - its body is a whole record
  validated against the full model, as a POST body is, and a property it leaves out is
  set to NULL; a body missing a required property is a 400 naming it. A write body holds
  the properties that have a value: a null at a typed property, like a value of another
  JSON type, is a 400 naming the property, so a property is cleared by leaving it out.
  BREAKING: a read returns a record valid against the model, on read-one and in every
  list row, so the record read (less id) is accepted when sent back. A column holding
  NULL is no longer always null: it is null where the property admits null (its type
  lists \"null\", or it declares no type), left out of the record where the property is
  optional, and the type's empty value where it is required (\"\" for string, 0 for
  integer / number, false for boolean, [] for array, {} for object). The empty value is
  the type's alone and may not satisfy a further constraint on the property (minLength,
  enum, minimum). A client that tested a cleared property against null must test for its
  absence."
