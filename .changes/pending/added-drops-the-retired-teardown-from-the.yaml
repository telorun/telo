modules:
  modules/ai: Added
  modules/run: Added
  modules/vector-store-pgvector: Added
  apps/authoring-agent: Added
body: "Drops the retired `teardown()` from the surface: ai's model, image and embedding
  handle interfaces no longer declare it, and the run and vector-store-pgvector
  controllers no longer implement an empty one. Cleanup is what a controller returns
  from `init()` / `run()`. Nothing called these, so no behaviour changes; a third-party
  handle implementing `teardown()` simply has a method nobody invokes."
