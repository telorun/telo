project: kv-store-sql
kind: Added
body: >-
  Initial release. Each conditional write is one statement whose WHERE carries the
  condition: putIfAbsent is a unique-key INSERT … ON CONFLICT DO UPDATE … WHERE
  <expired>, compareAndSet/compareAndDelete guard on the stored revision. Supported
  dialects are stated explicitly (Postgres, SQLite) rather than implying any
  Sql.Connection works. `createTable` (default true) can be turned off where the
  table is owned by the app's migrations or the runtime user has no DDL grant.
  Values round-trip through BigInt-safe JSON.
time: 2026-07-26T00:00:00.000000000+02:00
