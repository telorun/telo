kind: Telo.Application
metadata:
  name: AiAgentConsole
  version: 1.0.0
  categories: [ AI ]
  description: |
    An interactive chat in the terminal, backed by an `Ai.Agent` that calls
    tools before it answers:

      - two tools: `get_weather` is an HTTP request to open-meteo, `current_time`
        is a plain value — a tool is any resource, described for the model
      - memory: the conversation is stored in SQLite, so every turn sees the
        history and the chat survives a restart
      - commands: `/history` counts what is remembered, `/clear` forgets it,
        `/exit` leaves
      - a provider failure is printed and the chat goes on, instead of ending it
      - the model and the endpoint are inputs, so the same manifest talks to any
        OpenAI-compatible server

    Set your OpenAI key in a sibling `.env.local`:
        OPENAI_API_KEY=sk-...
    Then:
        telo .
        telo . --model gpt-4o
        OPENAI_BASE_URL=http://localhost:11434/v1 telo . --model llama3.2
imports:
  OpenAI: oci://ghcr.io/telorun/openai@0.13.0#sha256-Tt9DaH254A972an-WTH_mtJOy9HAuUuH_SK1_bfOvHM
  Ai: oci://ghcr.io/telorun/ai@0.28.0#sha256-zpi3w-6zWjD3HGhxoMJKItuFM4ELZa-NTVHOtFacRII
  Http: oci://ghcr.io/telorun/http-client@0.23.0#sha256-6WAIh0ajnTlkWNuP-59e1qNVUXVSJDWZxvPVACQg1AM
  Console: oci://ghcr.io/telorun/console@0.19.0#sha256-RC9Wlj4a8ysp1g3WS3z3CbmQuAsahNj4PdsJMaNfPZw
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  Sql: oci://ghcr.io/telorun/sql@0.28.0#sha256-JC2SN6Ha8hlq9gnRGahvVNVwe-cUXHXtS8rdeo1BC24
  SQLite: oci://ghcr.io/telorun/sqlite@0.10.0#sha256-qTwG1VYpO8_AGN2UaJPWEIHyt1rt8OUlxLKtLcJkf4Q
targets:
  - !ref initSchema
  - !ref chatLoop
secrets:
  openaiApiKey:
    env: OPENAI_API_KEY
    type: string
variables:
  model:
    env: OPENAI_MODEL
    arg: { flag: model, short: m }
    type: string
    default: gpt-4o-mini
    description: The chat model to ask.
  openaiBaseUrl:
    env: OPENAI_BASE_URL
    type: string
    default: https://api.openai.com/v1
    description: Any OpenAI-compatible endpoint.
  weatherBaseUrl:
    env: WEATHER_BASE_URL
    type: string
    default: https://api.open-meteo.com
  historyFile:
    env: HISTORY_FILE
    arg: history-file
    type: string
    x-telo-type: Telo.HostPath
    default: tmp/agent-history.sqlite
---
kind: SQLite.Connection
metadata: { name: chatDb }
file: !cel "variables.historyFile"
---
kind: SQLite.Schema
metadata: { name: initSchema }
connection: !ref chatDb
# Imperative, not a declared `Table`: the role domain is a CHECK constraint,
# which the column vocabulary cannot state — declaring the table would drop it.
migrations:
  0001_create_messages:
    statement: |
      CREATE TABLE IF NOT EXISTS messages (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        role TEXT NOT NULL CHECK (role IN ('system', 'user', 'assistant')),
        content TEXT NOT NULL,
        created_at TEXT NOT NULL DEFAULT (datetime('now'))
      )
---
# The account: base URL and credential on the client, so the model kind carries no
# key and inherits the 401 re-acquire-and-retry from `http-client`.
kind: Http.BearerToken
metadata: { name: openaiKey }
token: !cel "secrets.openaiApiKey"
---
kind: Http.Client
metadata: { name: openaiClient }
baseUrl: !cel "variables.openaiBaseUrl"
credential: !ref openaiKey
---
kind: Http.Request
metadata: { name: openaiRequest }
client: !ref openaiClient
---
kind: OpenAI.ChatModel
metadata: { name: chatModel }
model: !cel "variables.model"
request: !ref openaiRequest
---
kind: Http.Client
metadata: { name: openMeteo }
baseUrl: !cel "variables.weatherBaseUrl"
---
kind: Http.Request
metadata: { name: getWeather }
client: !ref openMeteo
throwOnHttpError: true
---
kind: Ai.Tools
metadata: { name: assistantTools }
tools:
  - tool: !ref getWeather
    name: get_weather
    description: Get the current weather at a latitude/longitude (open-meteo).
    parameters:
      type: object
      additionalProperties: false
      required: [ latitude, longitude ]
      properties:
        latitude: { type: number, description: "Latitude in decimal degrees." }
        longitude: { type: number, description: "Longitude in decimal degrees." }
    inputs:
      url: /v1/forecast
      method: GET
      # A query string is text, so the numbers the model produced are written out.
      query:
        latitude: !cel "string(arguments.latitude)"
        longitude: !cel "string(arguments.longitude)"
        current_weather: "true"
    result: !cel "result.body"
  # A tool need not reach the network: any invocable will do.
  - tool:
      kind: Run.Value
      value:
        utc: !cel "nowIso()"
    name: current_time
    description: The current date and time, in UTC.
    parameters:
      type: object
      additionalProperties: false
      properties: {}
---
kind: Ai.Agent
metadata: { name: assistant }
model: !ref chatModel
system: |
  You are a helpful CLI assistant. Use the available tools when they help answer;
  don't guess at facts you can look up. Keep replies brief.
maxSteps: 6
toolProviders:
  - provider: !ref assistantTools
---
kind: Sql.Command
metadata: { name: exec }
connection: !ref chatDb
---
kind: Sql.Query
metadata: { name: readHistory }
connection: !ref chatDb
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [ rows ]
    properties:
      rows:
        type: array
        items:
          type: object
          required: [ role, content ]
          properties:
            role: { type: string }
            content: { type: string }
---
# One turn: remember what was said, ask with the whole history, remember the
# answer. A failure leaves the question stored, so asking again retries it.
kind: Run.Sequence
metadata: { name: turn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [ message ]
    properties:
      message: { type: string }
steps:
  - name: insertUser
    invoke: !ref exec
    inputs:
      sql: "INSERT INTO messages (role, content) VALUES (?, ?)"
      bindings: [ "user", !cel "inputs.message" ]
  - name: history
    invoke: !ref readHistory
    inputs:
      sql: "SELECT role, content FROM messages ORDER BY id ASC"
      bindings: []
  - name: ask
    invoke: !ref assistant
    inputs:
      messages: !cel "steps.history.result.rows"
  - name: insertAssistant
    invoke: !ref exec
    inputs:
      sql: "INSERT INTO messages (role, content) VALUES (?, ?)"
      bindings: [ "assistant", !cel "steps.ask.result.text" ]
outputs:
  text: !cel "steps.ask.result.text"
---
kind: Run.Sequence
metadata: { name: chatLoop }
steps:
  - name: read
    invoke: !ref Console.readLine
    inputs:
      prompt: "{cyan.bold you} › "
  - name: converse
    while: !cel "trim(steps.read.result.value) != '/exit'"
    do:
      - name: command
        switch: !cel "trim(steps.read.result.value)"
        cases:
          /clear:
            - name: forget
              invoke: !ref exec
              inputs:
                sql: "DELETE FROM messages"
                bindings: []
            - name: forgotten
              invoke: !ref Console.writeLine
              inputs:
                output: !cel "'{dim forgot ' + string(steps.forget.result.rowCount) + ' messages}'"
          /history:
            - name: remembered
              invoke: !ref readHistory
              inputs:
                sql: "SELECT role, content FROM messages ORDER BY id ASC"
                bindings: []
            - name: counted
              invoke: !ref Console.writeLine
              inputs:
                output: !cel "'{dim ' + string(size(steps.remembered.result.rows)) + ' messages remembered}'"
        default:
          - name: exchange
            try:
              - name: reply
                invoke: !ref turn
                inputs:
                  message: !cel "trim(steps.read.result.value)"
              - name: print
                invoke: !ref Console.writeLine
                inputs:
                  output: !cel "'{magenta.bold ai}  › ' + steps.reply.result.text"
            catch:
              - name: failed
                invoke: !ref Console.writeLine
                inputs:
                  output: !cel "'{red error} › ' + error.code + ': ' + error.message"
      - name: read
        invoke: !ref Console.readLine
        inputs:
          prompt: "{cyan.bold you} › "
