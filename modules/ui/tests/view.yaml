kind: Telo.Application
metadata:
  name: UiViewTest
  version: 1.0.0
  description: |
    A view provides its node tree resolved: every structural node kept as
    written with each text as one record (a text with context included), a
    node whose `when:` is false left out, a menu keeping only the items whose
    own `when:` holds — and left out when none does — and a composite replaced
    by what it provides, carrying the style of the node that placed it. A view
    whose own content is switched off provides no node, and is left out of its
    parent like any node that is off.
imports:
  Ui: ../
  Probe: ./__fixtures__/probe
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref main
---
kind: Ui.View
metadata:
  name: inner
content:
  type: text
  text: Inner
---
kind: Ui.View
metadata:
  name: switchedOff
content:
  type: text
  text: Never shown
  when: false
---
kind: Ui.View
metadata:
  name: page
content:
  type: stack
  style: [strong]
  children:
    - { type: text, text: Title, style: heading }
    - { type: badge, text: New, style: [accent, strong] }
    - { type: badge, text: { text: Open, context: state } }
    - { type: link, text: Docs, href: /docs }
    - type: menu
      text: Language
      style: muted
      items:
        - { type: link, text: English, href: /lang/en, style: strong }
        - { type: link, text: Hidden, href: /hidden, when: false }
        - { type: link, text: Polski, href: "https://example.com/pl" }
    - type: menu
      text: Nothing to choose
      items:
        - { type: link, text: Hidden, href: /hidden, when: false }
    - { type: image, src: /logo.png, alt: "" }
    - { type: svg, markup: "<svg xmlns='http://www.w3.org/2000/svg'/>", alt: Chart }
    - { type: text, text: Hidden, when: false }
    - type: columns
      children:
        - type: box
          children:
            - { type: composite, ref: !ref inner, style: muted }
        - { type: composite, ref: !ref switchedOff }
        - type: composite
          ref:
            kind: Ui.View
            content: { type: text, text: !cel "'v' + module.version" }
---
kind: Run.Sequence
metadata:
  name: main
steps:
  - name: read
    invoke: { kind: Probe.Read, source: !ref page }
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.read.result"
      expected:
        assets: []
        node:
          type: stack
          style: [strong]
          children:
            - { type: text, text: { text: Title, context: null, lang: und, computed: false }, style: heading }
            - { type: badge, text: { text: New, context: null, lang: und, computed: false }, style: [accent, strong] }
            - { type: badge, text: { text: Open, context: state, lang: und, computed: false } }
            - { type: link, text: { text: Docs, context: null, lang: und, computed: false }, href: /docs }
            - type: menu
              text: { text: Language, context: null, lang: und, computed: false }
              style: muted
              items:
                - { type: link, text: { text: English, context: null, lang: und, computed: false }, href: /lang/en, style: strong }
                - { type: link, text: { text: Polski, context: null, lang: und, computed: false }, href: "https://example.com/pl" }
            - { type: image, src: /logo.png, alt: { text: "", context: null, lang: und, computed: false } }
            - { type: svg, markup: "<svg xmlns='http://www.w3.org/2000/svg'/>", alt: { text: Chart, context: null, lang: und, computed: false } }
            - type: columns
              children:
                - type: box
                  children:
                    - { type: text, text: { text: Inner, context: null, lang: und, computed: false }, style: muted }
                - { type: text, text: { text: v1.0.0, context: null, lang: und, computed: true } }
