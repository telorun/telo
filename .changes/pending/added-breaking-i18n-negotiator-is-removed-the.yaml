modules:
  modules/i18n: Added
body: "Breaking: I18n.Negotiator is removed (the request language is request.lang),
  I18n.Translator loses catalogs and is no longer exported, the @telorun/i18n code
  export (catalogSetOf) is removed, and one exported instance, translate, formats a text
  through the application translations: I18n.translate(text, request.lang, values).
  I18n.Catalog is deprecated in favour of the built-in Telo.TextTranslations and still
  works."
