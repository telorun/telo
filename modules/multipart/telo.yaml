kind: Telo.Library
metadata:
  name: Multipart
  version: 0.5.0
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Data, Transport]
  description: |
    Multipart bodies: combine several parts — a JSON document, a file, a form field —
    into one payload with the boundary framing servers expect, and split a received
    payload back into its parts — collected whole, read incrementally so an upload
    larger than memory can be handled, or one named file streamed while the rest is
    never read. Covers form uploads and the metadata-plus-content shape file APIs
    use. Part content may be text or bytes.
exports: { kinds: [Encoder, Decoder, Reader, ReadPart], resources: [Part] }
---
# Not a Codec.Encoder: it takes a list of parts, not one `input`. The content type is
# an output because the generated boundary must appear in it.
kind: Telo.Definition
metadata:
  name: Encoder
  description: >-
    Combines an ordered list of parts into a single payload with the boundary framing
    servers expect, for form uploads and for sending a metadata document alongside
    file content in one request. Each part carries its own media type and optional
    field and file name. Returns the framed bytes together with the media type to
    send them under, because the generated boundary must appear in both. Text and
    byte parts are accepted, and a streamed part is never buffered.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/multipart.mjs&local_path=./nodejs/src/index.ts#EncoderController]
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [parts]
    properties:
      parts:
        type: array
        minItems: 1
        description: The parts to combine, in order. Order is preserved on the wire.
        items:
          type: object
          additionalProperties: false
          required: [content]
          properties:
            content:
              description: >-
                This part's payload. A string is encoded as UTF-8; bytes and byte
                streams are written verbatim. `anyOf` rather than `oneOf`: a reader
                that does not know `x-telo-type` sees the byte and stream branches
                as empty schemas matching anything, so under `oneOf` a plain string
                would match several branches and fail.
              anyOf:
                - { type: string }
                - { x-telo-type: Telo.Bytes }
                - { x-telo-type: { name: Telo.Stream, of: Telo.Bytes } }
            contentType:
              type: string
              description: >-
                This part's media type (`application/json`, `image/png`). Omitted
                leaves the part unlabelled, which is what a plain form field wants.
            name:
              type: string
              description: >-
                Form field name, emitted as `Content-Disposition: form-data;
                name=...`. Required by `form-data` servers; meaningless for `related`.
            filename:
              type: string
              description: >-
                Original file name, added to the part's Content-Disposition. Present
                is what makes a server treat the part as an uploaded file.
            headers:
              type: object
              additionalProperties: { type: string }
              description: >-
                Extra headers for this part, merged over the ones derived from the
                fields above. `Content-Transfer-Encoding` goes here.
      subtype:
        type: string
        default: form-data
        description: >-
          The multipart subtype — `form-data` for uploads, `related` for a metadata
          document sent with its content, `mixed` for anything else. Same framing
          throughout; only the media type differs.
      boundary:
        type: string
        description: >-
          Fixed boundary, overriding the generated one. For a reproducible payload
          (a signed request, a golden test). It is the caller's responsibility that
          it appears in no part.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output, contentType, boundary]
    properties:
      output:
        x-telo-type: { name: Telo.Stream, of: Telo.Bytes }
        description: The framed payload, ready to send as a request body.
      contentType:
        type: string
        description: >-
          The media type to send `output` under, boundary included. Send this
          verbatim — a Content-Type written by hand cannot carry the generated
          boundary and the server would find no parts.
      boundary:
        type: string
        description: The boundary used, for a caller that must reproduce the header itself.
schema: { type: object, additionalProperties: false }
---
# Not a Codec.Decoder: the boundary comes from the content type, not the bytes.
kind: Telo.Definition
metadata:
  name: Decoder
  description: >-
    Splits a received multipart payload back into its parts, reading the boundary
    from the media type the sender supplied. Each part comes back in order with its
    headers, field and file name, and content as bytes. Limits on part size, part
    count and total bytes bound the upload, and a malformed or oversized payload
    fails with a distinct code.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/multipart.mjs&local_path=./nodejs/src/index.ts#DecoderController]
throws:
  codes:
    ERR_MULTIPART_MALFORMED:
      description: >-
        The payload is not well-formed multipart. `error.data.reason`
        says how: `boundary-missing` (the media type carries no `boundary=`
        parameter), `truncated` (the payload ends before its closing boundary),
        `header-malformed` (a part's header block holds a line that is not
        `name: value`, as when a part has no blank line before its content) or
        `header-too-large` (a part's header block passes 64 KiB with no blank
        line).
      data:
        type: object
        additionalProperties: false
        required: [reason]
        properties:
          reason:
            type: string
            enum: [boundary-missing, truncated, header-malformed, header-too-large]
            description: What is wrong with the payload.
    ERR_MULTIPART_LIMIT_EXCEEDED:
      description: >-
        The payload crossed one of the call's limits. Raised as soon as
        the bytes read show it, never after collecting the payload: reading
        stops within a chunk of `maxTotalBytes`.
        `error.data.limit` names the input that was exceeded and `max` its
        value; `part` is the zero-based position of the part concerned, and
        `name` its form field name when it declared one.
      data:
        type: object
        additionalProperties: false
        required: [limit, max]
        properties:
          limit:
            type: string
            enum: [maxPartBytes, maxParts, maxTotalBytes]
            description: The input whose value was exceeded.
          max: { type: integer, description: That input's value for this call. }
          part:
            type: integer
            description: >-
              Zero-based position of the part the limit was met at. Absent for
              `maxTotalBytes`.
          name:
            type: string
            description: >-
              The form field name of that part, when `maxPartBytes` was exceeded
              by a part that declared one.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input, contentType]
    properties:
      input:
        x-telo-type: { name: Telo.Stream, of: Telo.Bytes }
        description: The received payload.
      contentType:
        type: string
        description: >-
          The media type the sender used, carrying the boundary. Taken from the
          request's Content-Type header; a value with no `boundary=` parameter is an
          error, since nothing in the bytes identifies where parts begin.
      maxPartBytes:
        type: integer
        minimum: 1
        default: 8388608
        description: >-
          Largest content one part may hold, in bytes — its headers and the
          framing around it are not counted. A part is held whole to be
          returned, so a larger one fails the decode rather than growing the buffer.
      maxParts:
        type: integer
        minimum: 1
        default: 1000
        description: >-
          Most parts the payload may hold. One more fails with
          `ERR_MULTIPART_LIMIT_EXCEEDED` before its headers are read.
      maxTotalBytes:
        type: integer
        minimum: 1
        default: 16777216
        description: >-
          Most bytes read from `input`, counting everything — framing, headers,
          preamble and content. What bounds the decode as a
          whole, since many parts under `maxPartBytes` are as large as one over it.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [parts]
    properties:
      parts:
        type: array
        description: The parts found, in the order they appeared.
        items:
          type: object
          additionalProperties: false
          required: [content, headers]
          properties:
            content: { x-telo-type: Telo.Bytes, description: "This part's payload, as raw bytes." }
            contentType:
              type: string
              description: The part's declared media type, when it carried one.
            name:
              type: string
              description: The form field name from the part's Content-Disposition.
            filename:
              type: string
              description: The file name from the part's Content-Disposition, when present.
            headers:
              type: object
              additionalProperties: { type: string }
              description: Every header the part carried, with lowercase keys.
schema: { type: object, additionalProperties: false }
---
# What an incremental read takes, shared by Reader and ReadPart.
kind: Telo.JsonSchema
metadata: { name: ReadingInput }
schema:
  type: object
  additionalProperties: false
  required: [input, contentType]
  properties:
    input:
      x-telo-type: { name: Telo.Stream, of: Telo.Bytes }
      description: The received payload.
    contentType:
      type: string
      description: >-
        The media type the sender used, carrying the boundary. A value with no
        `boundary=` parameter is an error, since nothing in the bytes identifies
        where parts begin.
    maxPartBytes:
      type: integer
      minimum: 1
      description: >-
        Largest content one part may hold, in bytes, its headers and framing not
        counted. Omitted: no limit, since a part is streamed and never held.
        Counted whether the part is read or skipped.
    maxParts:
      type: integer
      minimum: 1
      default: 1000
      description: >-
        Most parts the payload may hold. One more fails with
        `ERR_MULTIPART_LIMIT_EXCEEDED` before its headers are read.
    maxTotalBytes:
      type: integer
      minimum: 1
      description: >-
        Most bytes read from `input`, counting everything — framing, headers,
        preamble and content. Omitted: no limit.
---
kind: Telo.JsonSchema
metadata: { name: Part }
schema:
  type: object
  additionalProperties: false
  required: [content, headers]
  properties:
    content:
      x-telo-type: { name: Telo.Stream, of: Telo.Bytes }
      description: This part's payload, read incrementally.
    contentType:
      type: string
      description: The part's media type exactly as it declared it, when it carried one.
    name:
      type: string
      description: The form field name from the part's Content-Disposition.
    filename: { type: string, description: "The file name, when present." }
    headers:
      type: object
      additionalProperties: { type: string }
      description: Every header the part carried, with lowercase keys.
---
# Only a missing boundary rejects the call; every other failure surfaces where the
# streams are drained. Advancing discards the rest of the current part.
kind: Telo.Definition
metadata:
  name: Reader
  description: >-
    Reads a multipart payload incrementally: a stream of parts in order, each
    with its own stream of bytes, for uploads too large to hold in memory.
    Moving to the next part discards the rest of the current one. Optional limits
    bound part size, part count and total bytes; a malformed or oversized payload
    fails the stream with a distinct code.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/multipart.mjs&local_path=./nodejs/src/index.ts#ReaderController]
throws:
  codes:
    ERR_MULTIPART_MALFORMED:
      description: >-
        The payload is not well-formed multipart, raised as the stream is
        drained. `error.data.reason`
        says how: `boundary-missing` (the media type carries no `boundary=`
        parameter), `truncated` (the payload ends before its closing boundary),
        `header-malformed` (a part's header block holds a line that is not
        `name: value`, as when a part has no blank line before its content) or
        `header-too-large` (a part's header block passes 64 KiB with no blank
        line).
      data:
        type: object
        additionalProperties: false
        required: [reason]
        properties:
          reason:
            type: string
            enum: [boundary-missing, truncated, header-malformed, header-too-large]
            description: What is wrong with the payload.
    ERR_MULTIPART_LIMIT_EXCEEDED:
      description: >-
        The payload crossed one of the call's limits, raised as the stream is
        drained. Raised as soon as
        the bytes read show it, never after collecting the payload: reading
        stops within a chunk of `maxTotalBytes`.
        `error.data.limit` names the input that was exceeded and `max` its
        value; `part` is the zero-based position of the part concerned, and
        `name` its form field name when it declared one.
      data:
        type: object
        additionalProperties: false
        required: [limit, max]
        properties:
          limit:
            type: string
            enum: [maxPartBytes, maxParts, maxTotalBytes]
            description: The input whose value was exceeded.
          max: { type: integer, description: That input's value for this call. }
          part:
            type: integer
            description: >-
              Zero-based position of the part the limit was met at. Absent for
              `maxTotalBytes`.
          name:
            type: string
            description: >-
              The form field name of that part, when `maxPartBytes` was exceeded
              by a part that declared one.
inputType: { kind: Telo.JsonSchema, schema: { $ref: "telo:Multipart/ReadingInput" } }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [parts]
    properties:
      parts:
        description: The parts, in order. Consumed by iterating.
        x-telo-type: { name: Telo.Stream, of: { $ref: "telo://Self/Part" } }
schema: { type: object, additionalProperties: false }
---
# A first-match stream stage cannot do this: a part's content is a view into the
# payload's one cursor, which releasing the parts stream on a match would end.
kind: Telo.Definition
metadata:
  name: ReadPart
  description: >-
    Reads one named part out of a multipart upload as a stream, for a form that
    sends a single file: earlier parts are discarded, the rest of the payload is
    never read, and the file's bytes are read only as fast as they are consumed.
    A payload with no part of that name fails with a distinct code; limits bound
    part size, part count and total bytes.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/multipart.mjs&local_path=./nodejs/src/index.ts#ReadPartController]
throws:
  codes:
    ERR_MULTIPART_MALFORMED:
      description: >-
        The payload is not well-formed multipart. Met before the part, it rejects
        the call; inside it, it fails the read of `content` that meets it.
        `error.data.reason` is as Reader's.
      data:
        type: object
        additionalProperties: false
        required: [reason]
        properties:
          reason:
            type: string
            enum: [boundary-missing, truncated, header-malformed, header-too-large]
            description: What is wrong with the payload.
    ERR_MULTIPART_LIMIT_EXCEEDED:
      description: >-
        The payload crossed one of the call's limits; skipped parts count. Met
        before the part, it rejects the call; inside it, it fails the read of
        `content` that meets it. `error.data` is as Reader's.
      data:
        type: object
        additionalProperties: false
        required: [limit, max]
        properties:
          limit:
            type: string
            enum: [maxPartBytes, maxParts, maxTotalBytes]
            description: The input whose value was exceeded.
          max: { type: integer, description: That input's value for this call. }
          part: { type: integer, description: "Zero-based position of the part the limit was met at. Absent for `maxTotalBytes`." }
          name: { type: string, description: The form field name of that part, when `maxPartBytes` was exceeded by a part that declared one. }
    ERR_MULTIPART_PART_MISSING:
      description: The payload reached its closing boundary with no part named `name`.
      data:
        type: object
        additionalProperties: false
        required: [name]
        properties: { name: { type: string, description: The part name asked for. } }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input, contentType, name]
    properties:
      input: { $ref: "telo:Multipart/ReadingInput#/properties/input" }
      contentType: { $ref: "telo:Multipart/ReadingInput#/properties/contentType" }
      name: { type: string, minLength: 1, description: The form field name of the part to read. }
      maxPartBytes: { $ref: "telo:Multipart/ReadingInput#/properties/maxPartBytes" }
      maxParts: { $ref: "telo:Multipart/ReadingInput#/properties/maxParts" }
      maxTotalBytes: { $ref: "telo:Multipart/ReadingInput#/properties/maxTotalBytes" }
outputType: { kind: Telo.JsonSchema, schema: { $ref: "telo:Multipart/Part" } }
schema: { type: object, additionalProperties: false }
