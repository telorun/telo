kind: Telo.Application
metadata:
  name: UiPageActionsTest
  version: 1.0.0
  description: |
    A page's data runs mutations in place: a `button` node holding a call
    bound to the page's variables and a reader's data, asking for the entries
    it needs through a prompt — its mutation declared inline or one resource
    two buttons name by reference — and a `list` node with row and cell styles
    — each as a renderer receives it. Refused by `telo check`: a call leaving
    a required input unbound, binding a key the mutation does not take or
    reading a member the data does not declare, a prompt whose fields leave a
    required entry out, and a style chosen by anything but a plain chain; a
    call's inputs that make no record of its mutation are refused again when
    the reader is first read.
imports: { Ui: ../, Assert: ../../assert }
targets:
  - !ref main
  - !ref refused
  - !ref stylesRefused
  - !ref buttonInputsAtRuntime
---
kind: Telo.JsonSchema
metadata: { name: PlanDetail }
schema:
  type: object
  required: [plan, lines]
  properties:
    plan:
      type: object
      required: [title, latestRevision]
      properties:
        title: { type: string }
        latestRevision:
          type: object
          required: [seq, hash]
          properties: { seq: { type: integer }, hash: { type: string } }
    lines:
      type: array
      items:
        type: object
        required: [op, text]
        properties:
          op: { type: string, enum: [added, removed, context] }
          text: { type: string }
---
kind: Telo.JsonSchema
metadata: { name: PlanDecision }
schema:
  type: object
  required: [id, decision, revision, hash, author]
  properties:
    id: { type: string }
    decision: { type: string, enum: [approve, request_changes, reject] }
    revision: { type: integer }
    hash: { type: string }
    author: { type: string, title: Your name }
    note: { type: string, title: Note }
---
kind: Ui.Page
metadata: { name: plan }
path: /plans/{id}
children:
  - type: query
    query:
      kind: Ui.Query
      model: !ref PlanDetail
      url:
        path: "/api/plans/{id}"
        pathParams: { id: !cel "params.id" }
    content:
      - type: stack
        children:
          - type: button
            action:
              mutation:
                kind: Ui.Mutation
                inputModel: !ref PlanDecision
                url:
                  path: /api/plans/{id}/decisions
                  pathParams:
                    id: !cel "input.id"
              inputs:
                id: !cel "params.id"
                decision: approve
                revision: !cel "data.plan.latestRevision.seq"
                hash: !cel "data.plan.latestRevision.hash"
                author: !cel "prompt.author"
              label: Approve
              prompt:
                kind: Ui.Prompt
                model:
                  kind: Telo.JsonSchema
                  schema:
                    type: object
                    required: [author]
                    properties: { author: { type: string, title: Your name } }
          - type: list
            rows: !cel "data.lines"
            rowStyle:
              by: !cel "row.op"
              cases: { added: success, removed: danger }
            columns:
              - value: !cel "row.text"
                style:
                  by: !cel "row.op"
                  cases: { context: muted }
                  default: strong
          - type: button
            action:
              mutation: !ref decide
              inputs:
                id: !cel "params.id"
                decision: request_changes
                revision: !cel "data.plan.latestRevision.seq"
                hash: !cel "data.plan.latestRevision.hash"
                author: !cel "prompt.author"
                note: !cel "prompt.note"
              label: Decide
              prompt: !ref decisionPrompt
          - type: button
            action:
              mutation: !ref decide
              inputs:
                id: !cel "params.id"
                decision: reject
                revision: !cel "data.plan.latestRevision.seq"
                hash: !cel "data.plan.latestRevision.hash"
                author: !cel "prompt.author"
                note: !cel "prompt.note"
              label: Decide
              prompt: !ref decisionPrompt
---
kind: Ui.Mutation
metadata: { name: decide }
inputModel: !ref PlanDecision
url: { path: "/api/plans/{id}/decisions", pathParams: { id: !cel "input.id" } }
---
kind: Ui.Prompt
metadata: { name: decisionPrompt }
model:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [author]
    properties: { author: { type: string, title: Your name }, note: { type: string, title: Note } }
---
kind: Telo.Sequence
metadata: { name: main }
steps:
  - name: page
    invoke: !ref plan
    inputs: { request: { headers: {} } }
  - name: buttonIs
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel >-
        cel.bind(b, steps.page.result.children[0].content[0].children[0], {
          'members': sort(keys(b)),
          'callMembers': sort(keys(b.action)),
          'inputs': b.action.inputs,
          'prompted': b.action.prompt.fields.map(f, f.property),
          'button': b.button,
          'label': b.action.label
        })
      expected:
        members: [action, button, fill, type]
        callMembers: [failure, inputs, label, mutation, onFailure, onSuccess, prompt]
        inputs:
          id: { root: params, path: [id] }
          decision: { value: approve }
          revision: { root: data, path: [plan, latestRevision, seq] }
          hash: { root: data, path: [plan, latestRevision, hash] }
          author: { root: prompt, path: [author] }
        prompted: [author]
        button: { type: text }
        label: { text: Approve, context: null, lang: und, computed: false }
  - name: referencedActionIs
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel >-
        steps.page.result.children[0].content[0].children.filter(c, c.type == 'button').map(b, [b.action.inputs.decision, b.action.label.text, b.action.prompt.fields.map(f, f.property)])
      expected:
        - [{ value: approve }, Approve, [author]]
        - [{ value: request_changes }, Decide, [author, note]]
        - [{ value: reject }, Decide, [author, note]]
  - name: listIs
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel >-
        cel.bind(l, steps.page.result.children[0].content[0].children[1], {
          'rowStyle': l.rowStyle,
          'style': l.columns[0].style
        })
      expected:
        rowStyle: { by: { root: row, path: [op] }, cases: { added: success, removed: danger } }
        style: { by: { root: row, path: [op] }, cases: { context: muted }, default: strong }
---
kind: Assert.Manifest
metadata: { name: refused }
source: ./__fixtures__/invalid/page-actions/lib/telo.yaml
expect:
  errors:
    - code: CONTRACT_INPUTS_MISMATCH
      message: "Ui.View/authorUnprompted: inputs at 'content.content[0].action.inputs' do not satisfy decide's declared inputType: / is missing required property 'author'"
    - code: CONTRACT_INPUTS_MISMATCH
      message: "Ui.View/hashMisspelled: inputs at 'content.content[0].action.inputs' do not satisfy decide's declared inputType: / must NOT have additional properties ('hsh' is not allowed)"
    - code: RESOURCE_RULE_VIOLATED
      message: "Ui.Prompt/commentIncomplete: leaves a property the model requires with no field"
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.View/revisionTypo: !cel: 'data.plan.latestRevison' is not defined (available: id, title, latestRevision)"
---
kind: Assert.Manifest
metadata: { name: stylesRefused }
source: ./__fixtures__/invalid/list-styles/telo.yaml
expect:
  errors:
    - code: ACCESSOR_NOT_PLAIN_CHAIN
      message: "Ui.View/rowStyleComputed: 'content.content[0].rowStyle.by: !cel \"row.op + 's'\"' is not a plain chain"
    - code: ACCESSOR_NOT_PLAIN_CHAIN
      message: "Ui.View/cellStyleComputed: 'content.content[0].columns[0].style.by: !cel \"size(row.op)\"' is not a plain chain"
---
kind: Assert.Manifest
metadata: { name: buttonInputsAtRuntime }
source: ./__fixtures__/invalid/page-actions/telo.yaml
expect:
  errors: [{ code: RESOURCE_RULE_VIOLATED, message: "Ui.Prompt/commentIncomplete: leaves a property the model requires with no field, so a valid record could never be sent. List a field for every required property, or leave `fields` out where each one is a scalar or a list of scalars." }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.View/authorUnprompted: inputs at 'content.content[0].action.inputs' do not satisfy decide's declared inputType: / is missing required property 'author'" }, { code: CONTRACT_INPUTS_MISMATCH, message: "Ui.View/hashMisspelled: inputs at 'content.content[0].action.inputs' do not satisfy decide's declared inputType: / must NOT have additional properties ('hsh' is not allowed)" }, { code: CEL_UNKNOWN_FIELD, message: "Ui.View/revisionTypo: !cel: 'data.plan.latestRevison' is not defined (available: id, title, latestRevision)" }]
  runFails: "Ui.View 'authorUnprompted' content.content[0]: 'action.inputs' cannot make a record of the mutation's input model: required input 'author' is not bound."
