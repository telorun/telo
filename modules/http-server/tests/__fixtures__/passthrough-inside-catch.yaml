kind: Telo.Library
metadata:
  name: PassthroughInsideCatchFixture
  version: 1.0.0
imports:
  Http: ../..
  Run: ../../../run
---
# try block throws A or B; catch re-raises via `throw: {code: !cel "error.code"}`.
# Resolver must see that the sequence's propagated union equals the try block's {A, B}.
kind: Run.Sequence
metadata:
  name: catchAndRethrow
steps:
  - name: outer
    try:
      - name: branch
        if: !cel "true"
        then:
          - name: throwA
            throw: { code: "A", message: "a" }
        else:
          - name: throwB
            throw: { code: "B", message: "b" }
    catch:
      - name: rethrow
        throw:
          code: !cel "error.code"
          message: !cel "error.message"
---
# Route covers both A and B explicitly — zero analyzer errors.
kind: Http.Api
metadata:
  name: catchRethrowApi
routes:
  - request:
      path: /x
      method: GET
    handler: !ref catchAndRethrow
    returns:
      - status: 200
        content:
          application/json:
            body: { ok: true }
    catches:
      - when: !cel "error.code in ['A', 'B']"
        status: 400
        content:
          application/json:
            body: { error: !cel "error.message" }
