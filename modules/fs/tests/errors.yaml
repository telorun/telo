kind: Telo.Application
metadata:
  name: FsErrors
  version: 1.0.0
  description: |
    Fs error paths are surfaced, not swallowed: reading a missing file raises
    ENOENT naming the path; Fs.FileEdit fails when oldString is absent or matches
    ambiguously. The same edit with replaceAll succeeds and reports the count.
imports:
  Fs: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
kind: Fs.DirectoryCreation
metadata: { name: makeDir }
cwd: ./modules/fs/tests/__fixtures__
---
kind: Fs.FileWrite
metadata: { name: write }
cwd: ./modules/fs/tests/__fixtures__
---
kind: Fs.File
metadata: { name: read }
cwd: ./modules/fs/tests/__fixtures__
---
kind: Fs.FileEdit
metadata: { name: edit }
cwd: ./modules/fs/tests/__fixtures__
---
kind: Fs.FileRemoval
metadata: { name: remove }
cwd: ./modules/fs/tests/__fixtures__
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: reset
    try:
      - name: doReset
        inputs: { path: scratch-err, recursive: true }
        invoke: !ref remove
    catch:
      - name: noLeftover
        inputs: { actual: 1, expected: 1 }
        invoke: !ref Assert.equals

  - name: mkdir
    inputs: { path: scratch-err, createParents: true }
    invoke: !ref makeDir

  - name: seed
    inputs:
      path: scratch-err/dup.txt
      content: "x\nx\n"
    invoke: !ref write

  - name: readMissing
    try:
      - name: doRead
        inputs: { path: scratch-err/does-not-exist.txt }
        invoke: !ref read
    catch:
      - name: assertEnoent
        inputs:
          actual: !cel "error.message"
          pattern: "does-not-exist.txt.*ENOENT"
        invoke: !ref Assert.matches

  - name: editAbsent
    try:
      - name: doEdit
        inputs:
          path: scratch-err/dup.txt
          oldString: "not-present"
          newString: "z"
        invoke: !ref edit
    catch:
      - name: assertNotFound
        inputs:
          actual: !cel "error.message"
          pattern: "oldString not found"
        invoke: !ref Assert.matches

  - name: editAmbiguous
    try:
      - name: doEdit
        inputs:
          path: scratch-err/dup.txt
          oldString: "x"
          newString: "y"
        invoke: !ref edit
    catch:
      - name: assertAmbiguous
        inputs:
          actual: !cel "error.message"
          pattern: "matches 2 times"
        invoke: !ref Assert.matches

  - name: editReplaceAll
    inputs:
      path: scratch-err/dup.txt
      oldString: "x"
      newString: "y"
      replaceAll: true
    invoke: !ref edit

  - name: assertReplaceAll
    inputs:
      actual: !cel "steps.editReplaceAll.result.replacements"
      expected: 2
    invoke: !ref Assert.equals

  - name: cleanup
    inputs: { path: scratch-err, recursive: true }
    invoke: !ref remove
