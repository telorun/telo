# A store listing two node types over one table, so a row would belong to both.
kind: Telo.Library
metadata:
  name: TableShared
imports:
  SQLite: ../../../../../sqlite
  GraphSql: ../../../..
exports:
  resources: [kb]
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: SQLite.Table
metadata: { name: people }
table: people
columns:
  id: { type: text, primaryKey: true }
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref people]
---
kind: GraphSql.Node
metadata: { name: person }
table: !ref people
key: id
---
kind: GraphSql.Node
metadata: { name: user }
table: !ref people
key: id
---
kind: GraphSql.Store
metadata: { name: kb }
connection: !ref db
schema: !ref appSchema
nodes: [!ref person, !ref user]
