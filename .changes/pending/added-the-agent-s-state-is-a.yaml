modules:
  apps/authoring-agent: Added
body: "The agent's state is a durable directory it asks its host for: the need
  agentState (Telo.DurableDirectory, access single-writer), named by AGENT_STATE_DIR or
  answered under TELO_HOST_STATE_DIR as <state dir>/needs/agentState, and listed by telo
  needs report. The image sets TELO_HOST_STATE_DIR=/var/lib/telo-agent. Breaking: the
  state no longer defaults to <WORKSPACE_DIR>/.telo-agent — with neither variable set
  the agent refuses to start (ERR_NEED_UNMET), so a deployment that relied on the old
  default sets AGENT_STATE_DIR to that directory to keep its conversations; the chat
  library's stateDir variable is replaced by its agentState need; the readiness probe
  writes .telo/agent-ready-probe, so the agent never creates a .telo-agent directory in
  the workspace."
