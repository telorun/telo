# Every rule the layered SQL abstracts declare, pinned both ways: `telo check`
# refuses the declaring library (RESOURCE_RULE_VIOLATED, the rule's code in
# `data.rule`), and a consumer whose entry-scoped check is silent fails at boot
# with the controller's refusal under the same code. The abstracts have no
# engine, so the fixtures instantiate them through the SQLite strategy module —
# whose node, relationship and store kinds declare no rule of their own, so each
# of these is the abstract's, inherited.
kind: Telo.Application
metadata:
  name: GraphLayersSqlStaticRefusals
  version: 1.0.0
  description: The layered SQL graph's structural rules, refused statically and at creation.
imports:
  Assert: ../../assert
targets:
  - !ref nodeKeyUnknownColumn
  - !ref nodeKeyUnknownColumnAtRuntime
  - !ref nodeKeyMismatch
  - !ref nodeKeyMismatchAtRuntime
  - !ref nodeKeyNotLayerable
  - !ref nodeKeyNotLayerableAtRuntime
  - !ref nodeTableUnique
  - !ref nodeTableUniqueAtRuntime
  - !ref endpointUnknownColumn
  - !ref endpointUnknownColumnAtRuntime
  - !ref endpointMismatch
  - !ref endpointMismatchAtRuntime
  - !ref endpointNullable
  - !ref endpointNullableAtRuntime
  - !ref relationshipTableUnique
  - !ref relationshipTableUniqueAtRuntime
  - !ref tableNotInSchema
  - !ref tableNotInSchemaAtRuntime
  - !ref schemaConnectionMismatch
  - !ref schemaConnectionMismatchAtRuntime
  - !ref tableShared
  - !ref tableSharedAtRuntime
  - !ref baseStoreMismatch
  - !ref baseStoreMismatchAtRuntime
  - !ref baseLayerDuplicate
  - !ref baseLayerDuplicateAtRuntime
  - !ref baseOwnLayerBeneath
  - !ref baseOwnLayerBeneathAtRuntime
  - !ref endpointNotInStore
  - !ref endpointNotInStoreAtRuntime
  - !ref endpointTypeMismatch
  - !ref endpointTypeMismatchAtRuntime
  - !ref baseCycle
---
kind: Assert.Manifest
metadata: { name: nodeKeyUnknownColumn }
source: ./__fixtures__/rules/node-key-unknown-column/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "names a key column its table does not declare"
---
kind: Assert.Manifest
metadata: { name: nodeKeyUnknownColumnAtRuntime }
source: ./__fixtures__/rules/node-key-unknown-column-app.yaml
expect:
  errors: []
  runFails: "GRAPH_NODE_KEY_UNKNOWN_COLUMN"
---
kind: Assert.Manifest
metadata: { name: nodeKeyMismatch }
source: ./__fixtures__/rules/node-key-mismatch/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "names a key column other than its table's 'key'"
---
kind: Assert.Manifest
metadata: { name: nodeKeyMismatchAtRuntime }
source: ./__fixtures__/rules/node-key-mismatch-app.yaml
expect:
  errors: []
  runFails: "GRAPH_NODE_KEY_MISMATCH"
---
kind: Assert.Manifest
metadata: { name: nodeKeyNotLayerable }
source: ./__fixtures__/rules/node-key-not-layerable/telo.yaml
expect:
