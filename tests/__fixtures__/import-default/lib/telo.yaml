kind: Telo.Library
metadata:
  name: ImportDefaultLib
  version: 1.0.0
imports:
  Sql: ../../../../modules/sql
  SQLite: ../../../../modules/sqlite
variables:
  dbFile:
    type: string
    default: ":memory:"
exports:
  resources: [ db, migrate ]
---
# `file` reads the contract var `dbFile`. The importer provides no override, so it
# must resolve to the library default ":memory:" — not a missing key.
kind: SQLite.Connection
metadata:
  name: db
file: "${{ variables.dbFile }}"
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
version: !cel "module.version"
migrations:
  20260601_seed:
    statements:
      - "CREATE TABLE marker (id INTEGER PRIMARY KEY, name TEXT NOT NULL)"
      - "INSERT INTO marker (id, name) VALUES (1, 'seeded')"
