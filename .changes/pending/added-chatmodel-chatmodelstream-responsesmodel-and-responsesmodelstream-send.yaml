modules:
  modules/openai: Added
body: "ChatModel, ChatModelStream, ResponsesModel and ResponsesModelStream send the
  model contract's toolChoice as tool_choice, beside the tools they still declare: none
  tells the model to answer without calling a tool, which is what an agent's concluding
  call asks for. It is written after the merged options, so the call's own choice is
  what is sent."
