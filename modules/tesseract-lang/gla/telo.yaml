kind: Telo.Library
metadata:
  name: TesseractLangGla
  version: 0.2.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Recognize Scottish Gaelic text in images, offline: the trained model for reading
    printed Scottish Gaelic (Latin script) with Tesseract optical character recognition.
