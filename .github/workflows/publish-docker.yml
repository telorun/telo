name: Publish Docker Images

# Release images only: a push to main publishes nothing, and nothing here moves
# `:latest` on a development commit. Two triggers:
#  * workflow_call    → called twice by the branch's Publish workflow. `images: kernel`
#                       after its `release` job, on the run's commit: the kernel tag
#                       set. `images: apps` once the artifact check passed, with `ref`
#                       the publication tag the app jobs check out: the image of every
#                       `docker` row and the chart of every `helm` row among the units
#                       the release moved (`units`). `channel` / `version` say what
#                       the line released:
#                         candidate  kernel images `telorun/node:<v>` (and the slim
#                                    and rust variants) — no `latest`, no `<major>` /
#                                    `<major>.<minor>`; app images under their unit's
#                                    `-rc.<k>` version, moving no pointer.
#                         final / patch  the kernel tag set and the app images.
#                       A kernel pointer (`latest`, `<major>`, `<major>.<minor>`) moves
#                       only forward: `scripts/release-pointers.mjs` refuses it when a
#                       final tag names a higher version in its scope. An app image's
#                       own `latest` moves by its unit's version, only when no
#                       `<unit key>@<version>` tag holds a higher final
#                       (`scripts/image-tags.mjs`). A run that released no CLI
#                       (`none`) builds the app images of the units it moved on the
#                       branch's last released telo.
#  * workflow_dispatch → rebuild the release tag set of an already-published CLI
#                       version by hand, from the ref the dispatch runs at: the
#                       release tag, whose tree pins the published modules the app
#                       images boot on. `images` picks the half (default both). The
#                       recovery path for a Publish run that failed after npm publish.
#
# Published images are those of the Publish run that produced the release, built
# from its commit or its tag: the image build resolves `@telorun/*` from npm, so it
# follows the `release` job that published them. Which units a release moved is read
# once, from its release commit, by the calling run (`release-units.mjs`).

on:
  workflow_dispatch:
    inputs:
      cli-version:
        description: 'Published @telorun/cli version to build the release tag set for (e.g. 0.76.0). Empty → the version in this ref''s cli/nodejs/package.json, if it is published.'
        type: string
        default: ''
      images:
        description: 'Which images to build: the kernel tag set, the app images and charts, or both.'
        type: choice
        options: [all, kernel, apps]
        default: all
  workflow_call:
    inputs:
      images:
        description: 'kernel (the telorun/node tag set), apps (the app images and charts) or all.'
        type: string
        default: all
      ref:
        description: 'The ref the app images are built from (the publication tag); empty → the calling run''s commit.'
        type: string
        default: ''
      units:
        description: 'JSON array of {key, name, version, ecosystem}: one row per package of every unit the release commit moved (release-units.mjs).'
        type: string
        default: '[]'
      channel:
        description: 'What the calling Publish run released: candidate (0.85.0-rc.N), final (0.85.0), patch (0.85.1) or none. Empty outside a Publish run.'
        type: string
        default: ''
      version:
        description: 'The CLI version the run released (0.85.0-rc.1, 0.85.0, 0.85.1); empty when channel is none.'
        type: string
        default: ''
      tag:
        description: 'The git tag naming that release (v0.85.0-rc.1); empty when channel is none. A final''s or patch''s may not exist yet when images is kernel.'
        type: string
        default: ''

# A Publish run's two calls share the group, so they run one after the other.
concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    name: Determine build context
    runs-on: ubuntu-latest
    outputs:
      # The CLI version whose kernel tag set this run builds; empty when none.
      cli-version: ${{ steps.compute.outputs.cli-version }}
      # The telo the app images are based on: cli-version, else the branch's last
      # released CLI.
      base-version: ${{ steps.compute.outputs.base-version }}
      rust-version: ${{ steps.compute.outputs.rust-version }}
      short-sha: ${{ steps.compute.outputs.short-sha }}
      release-cli: ${{ steps.compute.outputs.release-cli }}
      # The kernel tag set is built unless `images` is `apps`.
      kernel: ${{ steps.compute.outputs.kernel }}
      # App images build unless `images` is `kernel`.
      apps: ${{ steps.compute.outputs.apps }}
      # The units the release moved: the caller's, or — dispatched at a release tag —
      # read from the tag's release commit.
      units: ${{ steps.units.outputs.units }}
      # Which shared pointers this release may move (release-pointers.mjs).
      latest: ${{ steps.pointers.outputs.latest }}
      major: ${{ steps.pointers.outputs.major }}
      minor: ${{ steps.pointers.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Tags are what the pointers are compared against.
          fetch-depth: 0
          fetch-tags: true

      - id: compute
        env:
          UNITS: ${{ inputs.units }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          DISPATCH_CLI_VERSION: ${{ inputs.cli-version }}
          IMAGES: ${{ inputs.images }}
        run: |
          case "${IMAGES:-all}" in
            all) KERNEL=true; APPS=true ;;
            kernel) KERNEL=true; APPS=false ;;
            apps) KERNEL=false; APPS=true ;;
            *) echo "::error::images is '$IMAGES'; it must be all, kernel or apps."; exit 1 ;;
          esac
          UNITS="${UNITS:-[]}"
          RUST_VERSION=$(grep -E '^ARG RUST_VERSION=' cli/nodejs/Dockerfile | head -1 | cut -d= -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          WORKSPACE_VERSION=$(jq -r .version cli/nodejs/package.json)

          # The release tag set is built for exactly one CLI version, from the most
          # specific source available: what the calling Publish run released, then
          # what it published, then an explicit dispatch input. A dispatch with
          # none names this ref's own CLI version, which must be live on npm
          # (the image build resolves `@telorun/*` from there).
          CLI_VERSION="$INPUT_VERSION"
          if [ -z "$CLI_VERSION" ]; then
            CLI_VERSION=$(echo "$UNITS" | jq -r '[.[] | select(.ecosystem=="npm" and .name=="@telorun/cli")][0].version // ""')
          fi
          if [ -z "$CLI_VERSION" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLI_VERSION="${DISPATCH_CLI_VERSION:-$WORKSPACE_VERSION}"
            npm view "@telorun/cli@$CLI_VERSION" version >/dev/null ||
              { echo "::error::@telorun/cli@$CLI_VERSION is not published; there is nothing to build images for."; exit 1; }
          fi

          # A run that released no CLI builds its app images on the branch's last
          # release, whose kernel image an earlier run published.
          BASE_VERSION="${CLI_VERSION:-$WORKSPACE_VERSION}"

          # A candidate's app images carry their unit's `-rc.<k>` and move no pointer
          # (`image-tags.mjs`), so candidates build them too.

          {
            echo "cli-version=$CLI_VERSION"
            echo "base-version=$BASE_VERSION"
            echo "rust-version=$RUST_VERSION"
            echo "short-sha=$SHORT_SHA"
            echo "kernel=$KERNEL"
            echo "apps=$APPS"
            [ -n "$CLI_VERSION" ] && echo "release-cli=true" || echo "release-cli=false"
          } >> "$GITHUB_OUTPUT"

      - name: Install the release scripts' dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      - name: Read the units the release moved
        id: units
        env:
          GIVEN: ${{ inputs.units }}
        run: |
          if [ -n "$GIVEN" ] && [ "$GIVEN" != "[]" ] || [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "units=${GIVEN:-[]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm install --frozen-lockfile
          pnpm -r --if-present build
          node scripts/release-units.mjs

      # Forward-only: a pointer moves only when no final tag names a higher version
      # in its scope, so re-running an old publish moves nothing.
      - id: pointers
        env:
          CHANNEL: ${{ inputs.channel }}
        run: node scripts/release-pointers.mjs --version "${{ steps.compute.outputs.base-version }}" --channel "${CHANNEL/none/}"

  kernel-release:
    name: Build telorun/node release tags
    if: needs.context.outputs.release-cli == 'true' && needs.context.outputs.kernel == 'true'
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tag matrix
        id: tags
        env:
          V: ${{ needs.context.outputs.cli-version }}
          RV: ${{ needs.context.outputs.rust-version }}
          MOVE_LATEST: ${{ needs.context.outputs.latest }}
          MOVE_MAJOR: ${{ needs.context.outputs.major }}
          MOVE_MINOR: ${{ needs.context.outputs.minor }}
        run: |
          MAJOR=$(echo "$V" | cut -d. -f1)
          MAJOR_MINOR=$(echo "$V" | cut -d. -f1-2)

          # The exact version always; each shared pointer only when it moves
          # forward (a candidate moves none).
          tagset() {
            local suffix="$1"
            echo "telorun/node:${V}${suffix}"
            [ "$MOVE_MINOR" = "true" ] && echo "telorun/node:${MAJOR_MINOR}${suffix}"
            [ "$MOVE_MAJOR" = "true" ] && echo "telorun/node:${MAJOR}${suffix}"
            [ "$MOVE_LATEST" = "true" ] && echo "telorun/node:latest${suffix}"
            true
          }

          {
            echo 'lean<<EOF'
            tagset ""
            echo EOF
            echo 'lean-slim<<EOF'
            tagset "-slim"
            echo EOF
            echo 'rust<<EOF'
            tagset "-rust-${RV}"
            echo EOF
            echo 'rust-slim<<EOF'
            tagset "-rust-${RV}-slim"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build & push lean
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: lean
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.lean }}
          cache-from: type=gha,scope=kernel-lean
          cache-to: type=gha,mode=max,scope=kernel-lean

      - name: Build & push lean-slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: lean-slim
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.lean-slim }}
          cache-from: type=gha,scope=kernel-lean-slim
          cache-to: type=gha,mode=max,scope=kernel-lean-slim

      # One build, both tag sets. There is no non-slim rust image: the toolchain
      # needs nothing from the fat base, so `-rust-<ver>` is the slim one under
      # its historical name rather than a second ~990 MB-heavier build.
      - name: Build & push rust-slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/nodejs/Dockerfile
          target: rust-slim
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUST_VERSION=${{ needs.context.outputs.rust-version }}
          tags: |
            ${{ steps.tags.outputs.rust }}
            ${{ steps.tags.outputs.rust-slim }}
          cache-from: |
            type=gha,scope=kernel-rust-slim
            type=gha,scope=kernel-lean-slim
          cache-to: type=gha,mode=max,scope=kernel-rust-slim

  hub:
    name: Build telorun/hub
    # Outside candidates, on the telo this run released (or the branch's last
    # release when it released no CLI): FROM telorun/node:<version>-slim. `always()`
    # lets it run when the kernel job was skipped.
    if: |
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.apps == 'true' &&
      (needs.kernel-release.result == 'success' || needs.kernel-release.result == 'skipped')
    needs: [context, kernel-release]
    runs-on: ubuntu-latest
    outputs:
      # The version this run released, or empty — consumed by the chart job, as
      # the k8s-runner job's is.
      released-version: ${{ steps.imgtags.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # the release commit's parent for the version bump, tags for the forward-only `latest`
          fetch-tags: true


      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve TELO_NODE_VERSION
        id: telo
        env:
          BASE_VERSION: ${{ needs.context.outputs.base-version }}
        run: echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install the release scripts' dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      # `<destination>:<version>` and `:sha-*` when the release moved the unit, and
      # `:latest` for a final no released version exceeds (`image-tags.mjs`).
      - name: Compute hub image tags
        id: imgtags
        env:
          MOVED_UNITS: ${{ needs.context.outputs.units }}
        run: node scripts/image-tags.mjs --key apps/hub --sha "${{ needs.context.outputs.short-sha }}"

      - name: Build & push hub
        if: steps.imgtags.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: apps/hub
          file: apps/hub/Dockerfile
          target: production
          push: true
          build-args: |
            TELO_NODE_VERSION=${{ steps.telo.outputs.version }}
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub

  runner:
    name: Build telorun/docker-runner
    # `pnpm deploy --prod` resolves the workspace's `@telorun/sdk` peer from npm,
    # which the calling Publish run has published by now. Not in candidates.
    if: needs.context.outputs.apps == 'true'
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # the release commit's parent for the version bump, tags for the forward-only `latest`
          fetch-tags: true


      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install the release scripts' dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      # `<destination>:<version>` and `:sha-*` when the release moved the unit, and
      # `:latest` for a final no released version exceeds (`image-tags.mjs`).
      - name: Compute runner image tags
        id: imgtags
        env:
          MOVED_UNITS: ${{ needs.context.outputs.units }}
        run: node scripts/image-tags.mjs --key apps/docker-runner --sha "${{ needs.context.outputs.short-sha }}"

      - name: Build & push runner
        if: steps.imgtags.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker-runner/Dockerfile
          target: production
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  hub-web:
    name: Build telorun/hub-web
    # Same gating as docker-runner: outside candidates, the :sha-* tag always and
    # :latest when it moves forward.
    if: needs.context.outputs.apps == 'true'
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # the release commit's parent for the version bump, tags for the forward-only `latest`
          fetch-tags: true


      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install the release scripts' dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      # `<destination>:<version>` and `:sha-*` when the release moved the unit, and
      # `:latest` for a final no released version exceeds (`image-tags.mjs`).
      - name: Compute hub-web image tags
        id: imgtags
        env:
          MOVED_UNITS: ${{ needs.context.outputs.units }}
        run: node scripts/image-tags.mjs --key apps/hub-web --sha "${{ needs.context.outputs.short-sha }}"

      - name: Build & push hub-web
        if: steps.imgtags.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hub-web/Dockerfile
          target: production
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=hub-web
          cache-to: type=gha,mode=max,scope=hub-web

  k8s-runner:
    name: Build telorun/k8s-runner
    # Same gating as docker-runner. It also WAITS ON THE KERNEL JOB, because it
    # bakes one of its tags as its session default: run concurrently, a failed
    # `kernel-release` would ship `k8s-runner:latest` and `:<version>` with a
    # default pointing at a `telorun/node:<v>-slim` that never gets built.
    # `always()` plus the result test lets a legitimately SKIPPED kernel job (a
    # run that released no CLI, or the `images: apps` call, whose kernel the
    # `images: kernel` call built and which Publish orders after it) not block this one.
    if: |
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.apps == 'true' &&
      (needs.kernel-release.result == 'success' || needs.kernel-release.result == 'skipped')
    needs: [context, kernel-release]
    runs-on: ubuntu-latest
    outputs:
      # The version this run released, or empty. Published so the chart job
      # consumes the answer instead of re-deriving it from the same two files —
      # which also makes "the chart is never published ahead of its image" a
      # data dependency rather than a convention.
      released-version: ${{ steps.imgtags.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # the release commit's parent for the version bump, tags for the forward-only `latest`
          fetch-tags: true


      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install the release scripts' dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      # `<destination>:<version>` and `:sha-*` when the release moved the unit, and
      # `:latest` for a final no released version exceeds (`image-tags.mjs`).
      - name: Compute k8s-runner image tags
        id: imgtags
        env:
          MOVED_UNITS: ${{ needs.context.outputs.units }}
        run: node scripts/image-tags.mjs --key apps/k8s-runner --sha "${{ needs.context.outputs.short-sha }}"

      # The session kernel is the CLI this release published; none when no CLI was released.
      - name: Pin the session kernel image
        id: session
        env:
          CLI_VERSION: ${{ needs.context.outputs.cli-version }}
        run: |
          if [ -n "$CLI_VERSION" ]; then echo "session-image=telorun/node:${CLI_VERSION}-slim" >> "$GITHUB_OUTPUT"; fi

      - name: Build & push k8s-runner
        if: steps.imgtags.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/k8s-runner/Dockerfile
          target: production
          push: true
          # Empty when no CLI was released, and an empty `build-args` line is
          # ignored by buildx — so the Dockerfile's default applies.
          build-args: |
            ${{ steps.session.outputs.session-image && format('TELO_SESSION_IMAGE={0}', steps.session.outputs.session-image) || '' }}
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=k8s-runner
          cache-to: type=gha,mode=max,scope=k8s-runner

  # The web build of Studio, the image Telo Cloud serves at `studio.telo.run` — the
  # `apps/studio` unit's `docker` row, on GHCR.
  studio-web:
    name: Build ghcr.io/telorun/studio-web
    if: needs.context.outputs.apps == 'true'
    needs: context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # tags for the forward-only `latest`
          fetch-tags: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute studio-web image tags
        id: imgtags
        env:
          MOVED_UNITS: ${{ needs.context.outputs.units }}
        run: node scripts/image-tags.mjs --key apps/studio --sha "${{ needs.context.outputs.short-sha }}"

      - name: Build & push studio-web
        if: steps.imgtags.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio/Dockerfile
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=studio-web
          cache-to: type=gha,mode=max,scope=studio-web

  charts:
    name: Publish the Helm charts
    # Every `helm` row among the units the release moved (`publish-charts.mjs`),
    # after the images: a chart's `version` and `appVersion` are its unit's version,
    # the tag the image job just pushed, so a chart never names an image the run did
    # not build. `always()` is load-bearing: a skipped kernel job up the chain would
    # otherwise skip this one.
    if: |
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.apps == 'true' &&
      (needs.hub.result == 'success' || needs.hub.result == 'skipped') &&
      (needs.k8s-runner.result == 'success' || needs.k8s-runner.result == 'skipped') &&
      (needs.studio-web.result == 'success' || needs.studio-web.result == 'skipped')
    needs: [context, hub, k8s-runner, studio-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: azure/setup-helm@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      # `telo release order` names each chart's directory and destination.
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --if-present build

      - name: Package and push the charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOVED_UNITS: ${{ needs.context.outputs.units }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          node scripts/publish-charts.mjs

  authoring-agent:
    name: Build telorun/authoring-agent
    # Outside candidates: the immutable :<version>-slim when the agent's
    # release-owned metadata.version moved in the release, :sha-<short>-slim always,
    # and :latest-slim when it moves forward. Its base is
    # telorun/node:<base-version>-slim — the telo this run released, else the
    # branch's last release; both exist, which a development version would not.
    # `always()` lets this job run when the kernel job was skipped.
    if: |
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.apps == 'true' &&
      (needs.kernel-release.result == 'success' || needs.kernel-release.result == 'skipped')
    needs: [context, kernel-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # the release commit's parent for the version bump, tags for the forward-only `latest`
          fetch-tags: true


      - uses: docker/setup-buildx-action@v3

      - name: Install the release scripts' dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @telorun/monorepo

      # `<destination>:<version>` and `:sha-*` when the release moved the unit, and
      # `:latest` for a final no released version exceeds (`image-tags.mjs`).
      - name: Compute authoring-agent image tags
        id: imgtags
        env:
          MOVED_UNITS: ${{ needs.context.outputs.units }}
        run: node scripts/image-tags.mjs --key apps/authoring-agent --sha "${{ needs.context.outputs.short-sha }}" --suffix -slim

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push authoring-agent
        if: steps.imgtags.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: apps/authoring-agent
          file: apps/authoring-agent/Dockerfile
          target: production
          push: true
          build-args: |
            TELO_NODE_VERSION=${{ needs.context.outputs.base-version }}
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha,scope=authoring-agent
          cache-to: type=gha,mode=max,scope=authoring-agent
