  required: [ "listen", "mounts" ]
  additionalProperties: false
  examples:
    - listen:
        port: !cel "ports.http"
      openapi: { info: { title: Users API, version: 1.0.0 } }
      cors: { origin: "*", methods: [GET, POST] }
      mounts:
        - path: /v1
          mount: !ref UsersApi
        - path: /reference
          mount: !ref UsersDocs
          when: !cel "variables.env != 'production'"
    - listen:
        port: !cel "ports.http"
      unknownHosts: reject
      mounts:
        - path: /healthz
          mount: !ref Health
        - hostnames: [ !ref site ]
          path: /
          mount: !ref Site
        - hostnames: [ !ref admin ]
          path: /
          mount: !ref Admin
  x-telo-resource-rules:
    - condition: !cel "!has(self.port) && !has(self.host)"
      code: HTTP_SERVER_LISTEN_MOVED
      message: >-
        writes the socket it binds at the top level, which moved under `listen:` — `port` is now
        `listen.port` and `host` is now `listen.address`: write `listen: { port: … }`.
    - condition: !cel >-
        !has(self.forwardedClientCertificate) || (has(self.trustProxy)
        ? self.trustProxy == true || (self.trustProxy != false && self.trustProxy > 0)
        : has(self.trustForwardedHeaders) && self.trustForwardedHeaders)
      code: HTTP_FORWARDED_CERTIFICATE_UNTRUSTED
      message: >-
        reads a forwarded client certificate but trusts no proxy, so any client could send
        that header. Set `trustProxy` to the proxy in front of this server, or drop
        `forwardedClientCertificate`.
    - condition: !cel "!self.mounts.exists(m, has(m.authentication)) || self.mounts.all(m, has(m.authentication))"
      code: MOUNT_IMPLICITLY_PUBLIC
      message: >-
        declares `authentication` on some mounts and not on others, so a mount without it is open to
        anyone. Declare `authentication` on every mount — `{ anonymous: allow }` for a public one.
    - condition: !cel >-
        self.mounts.all(m, !has(m.authentication) || has(m.authentication.verifiers)
        || (has(m.authentication.anonymous) && m.authentication.anonymous == 'allow'))
      code: AUTHENTICATION_UNSATISFIABLE
      message: >-
        has a mount whose `authentication` denies anonymous callers and names no verifier, so no
        request can ever be served there. List its `verifiers`, or allow anonymous callers.
    - condition: !cel >-
        self.mounts.all(m, !has(m.protectedResource)
        || (has(m.authentication) && has(m.authentication.verifiers)))
      code: PROTECTED_RESOURCE_WITHOUT_AUTHENTICATION
      message: >-
        declares `protectedResource` on a mount whose `authentication` names no verifier, so the
        metadata would describe no authentication. List the mount's `verifiers`, or remove
        `protectedResource`.
    - condition: !cel "!has(self.unknownHosts) || self.unknownHosts != 'reject' || self.mounts.exists(m, has(m.hostnames))"
      code: HTTP_UNKNOWN_HOSTS_NO_HOSTNAMES
      message: >-
        sets `unknownHosts: reject`, and none of its mounts names `hostnames`, so every request whose
        host is not an IP literal would be refused. Name the address needs each mount answers in its
        `hostnames`, or drop `unknownHosts: reject`.
  $defs:
    PemSource:
      type: object
      additionalProperties: false
      description: PEM text, given inline or as a file on the host. Exactly one of the two.
      properties:
        pem: { type: string, description: The PEM text. }
        file:
          type: string
          x-telo-type: Telo.HostPath
          description: Absolute path of a file holding the PEM text.
      oneOf:
        - { required: [pem] }
        - { required: [file] }
status:
  type: object
  additionalProperties: false
  properties:
    localUrl:
      description: >-
        The URL the socket listens on, set once it listens: `https` under `tls`,
        otherwise `http`; a wildcard address is written as `localhost`. It is
        the socket's own URL, not a public address.
      x-telo-type: { name: Telo.Url, scheme: { enum: [http, https] } }
---
kind: "Telo.Definition"
metadata:
  name: "Api"
  description: Mountable router whose routes match requests, map inputs via CEL to a handler, and render conditional typed responses.
capability: Telo.Mount
topology: Router
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#HttpApiController]
# The server's access refusals, which reach this router's catch lists. Restated
# from `Http.Server`'s and held equal to them by `nodejs/tests/access-codes.test.ts`.
throws:
  codes:
    ERR_HTTP_UNAUTHENTICATED:
      description: >-
        A mount's authentication refused the request: no credential where anonymous
        callers are denied, or a credential that is malformed or refused. Answered
        401 with every challenge in one `WWW-Authenticate`.
      displayMessage: "Authentication is required to access this resource."
      data:
        type: object
        additionalProperties: false
        required: [reason]
        properties:
          reason: { type: string, enum: [absent, malformed, refused], description: Why the request is not authenticated. }
    ERR_HTTP_FORBIDDEN:
      description: >-
        The authorization policy denied the action. Answered 403, with
        `WWW-Authenticate: <scheme> error="insufficient_scope"` when the policy
        names the scopes the caller lacks.
      displayMessage: "You are not allowed to perform this action."
      data:
        type: object
        additionalProperties: false
        properties:
          requiredScopes: { type: array, items: { type: string }, description: The scopes that would allow the action. }
    ERR_HTTP_CROSS_ORIGIN_REFUSED:
      description: >-
        A request that changes state, authenticated by a credential the browser
        sends on its own (a cookie), came from another site. Answered 403.
      displayMessage: "This request came from another site and was refused."
    ERR_HTTP_ACCESS_CHECK_UNAVAILABLE:
      description: >-
        A credential source, verifier or policy could not decide — its keys or
        endpoint unreachable. Answered 503; the failure is the cause in the trace
        and the log, never in the response.
      displayMessage: "The access check could not be completed. Try again later."
      data:
        type: object
        additionalProperties: false
        required: [stage]
        properties:
          stage: { type: string, enum: [source, verifier, policy], description: The step that failed. }
schema:
  type: "object"
  properties:
    catches:
      title: Catches
      description: >-
        Rendering rules for structured (InvokeError) throws from any route of
        this router. A route's own `catches:` entries are tried first, then
        these, then the server's; a throw no entry claims is answered 500 with
        its problem (`application/problem+json`).

        This is what lets one route override the rendering of a single code
        without restating every other. A route entry with no `when:` is a
        deliberate full override — it makes these entries unreachable for that
        route alone.

        Entries see `error`, `problem` and the request's `path` / `method` / `ip` / `cookies`. There is
        no single route here to type `request.query` / `body` / `params` from —
        those belong to a route's own list.
      x-telo-outcome-list: catches
      # The EMPTY pointer: this list covers every route of this router, not one
      # sibling field's target.
      x-telo-catches-for:
        slot: ""
        raises: [ERR_HTTP_UNAUTHENTICATED, ERR_HTTP_FORBIDDEN, ERR_HTTP_CROSS_ORIGIN_REFUSED, ERR_HTTP_ACCESS_CHECK_UNAVAILABLE]
      x-telo-schema-from: "HttpDispatch.Outcomes/$defs/Catches"
      x-telo-context:
        type: object
        additionalProperties: false
        properties:
          request:
            type: object
            additionalProperties: false
            properties:
              path: { type: string }
              host: { type: string, description: "The request's host, lowercased and without its port — from X-Forwarded-Host only behind a trusted proxy." }
              cookies: { type: object, additionalProperties: { type: string }, description: "The request's cookies by name, the first of a repeated name, each value as sent." }
              tls:
                description: "The TLS session of the socket the request arrived on: `{ protocol }`, null on a plain socket."
                type: [object, "null"]
                additionalProperties: false
                properties: { protocol: { type: string } }
              clientCertificate:
                description: "The client certificate the listener received or a trusted proxy forwarded; null when there is none."
                type: [object, "null"]
                additionalProperties: false
                properties:
                  subject: { type: object, additionalProperties: { type: string } }
                  issuer: { type: object, additionalProperties: { type: string } }
                  serialNumber: { type: string }
                  fingerprint256: { type: string }
                  validFrom: { x-telo-type: Telo.Timestamp }
                  validTo: { x-telo-type: Telo.Timestamp }
                  subjectAltNames: { type: array, items: { type: string } }
                  pem: { type: string }
                  verified: { type: boolean }
                  via: { type: string, enum: [listener, proxy] }
              lang: { type: string, description: "The language negotiated for the request: a served language tag, always present." }
              method: { type: string }
              ip: { type: string }
              principal: { description: "The authenticated caller; null when the request was refused before authenticating, or is anonymous.", anyOf: [{ $ref: "telo://Auth/Principal" }, { type: "null" }] }
          error:
            type: object
            additionalProperties: false
            properties:
              code: { type: string, x-telo-caught-member: code }
              message: { type: string }
              displayMessage:
                description: The text a person is shown for the failure, as its record; null when it carries none.
                anyOf: [{ $ref: "telo://manifest#/$defs/TextRecord" }, { type: "null" }]
              data: { type: object, additionalProperties: true, x-telo-caught-member: data }
          problem:
            type: object
            additionalProperties: false
            description: The default problem (RFC 9457) this entry would render.
            properties:
              type: { type: string }
              title: { type: [string, "null"] }
              status: { type: integer }
              detail: { type: [string, "null"] }
              code: { type: string, x-telo-caught-member: code }
              data: { type: [object, "null"], additionalProperties: true, x-telo-caught-member: data }
    routes:
      title: Routes
      description: HTTP route definitions.
      x-telo-topology-role: entries
      type: "array"
      items:
        title: Route
        description: Single route definition.
        type: "object"
        additionalProperties: false
        properties:
          operationId:
            title: Operation ID
            description: OpenAPI operationId for this route — should be unique across the document.
            type: "string"
          summary:
            title: Summary
            description: Short OpenAPI summary for this route.
            type: "string"
          description:
            title: Description
            description: Longer OpenAPI description for this route.
            type: "string"
          tags:
            title: Tags
            description: OpenAPI tags grouping this route in the generated document.
            type: "array"
            items: { type: "string" }
          request:
            title: Request
            description: >-
              Route matcher — `method` and `path` (required). Declare a nested
              `schema:` block ({ params, query, body, headers, cookies }, each a
              JSON Schema) to document and validate the request: it types the CEL
              `request.*` context AND is rendered into the generated OpenAPI
              document. Fill the schemas with `type`, `description`, and
              `examples` so the OpenAPI spec is complete.
            x-telo-topology-role: matcher
            x-telo-schema-from: "HttpDispatch.Request/$defs/Matcher"
          authentication:
            title: Authentication
            description: >-
              This route's authentication, each key replacing the mount's: an
              absent key is inherited. `{ anonymous: allow }` makes one route
              optional through the mount's verifiers.
            $ref: "telo://Self/Authentication"
            x-telo-raises: [ERR_HTTP_UNAUTHENTICATED, ERR_HTTP_CROSS_ORIGIN_REFUSED, ERR_HTTP_ACCESS_CHECK_UNAVAILABLE]
          authorization:
            title: Authorization
            description: This route's authorization, replacing the mount's.
            $ref: "telo://Self/Authorization"
            x-telo-raises: [ERR_HTTP_FORBIDDEN, ERR_HTTP_ACCESS_CHECK_UNAVAILABLE]
            x-telo-context:
