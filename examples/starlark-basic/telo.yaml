kind: Telo.Application
metadata:
  name: StarlarkDemo
  version: 1.0.0
  description: A demo showcasing a Starlark script run from flat `targets`.
imports:
  Starlark: oci://ghcr.io/telorun/starlark@0.10.0#sha256-HX1_KxwMtlNy2HTepr7Fh7XVPzTvgN_3JvaAiYU-2uM
  Console: oci://ghcr.io/telorun/console@0.15.0#sha256-TXqhVyXKPxNKmQ2V0agBCMo6k_GWYd61192g9j5eRd0
targets:
  - name: Step1
    invoke: !ref ExampleStarlarkScript
    inputs:
      value: 42
  - name: Step2
    invoke: !ref Console.writeLine
    inputs:
      output: |
        Evaluated starlark code.
        Result is: ${{ steps.Step1.result.result }}
---
kind: Starlark.Script
metadata:
  name: ExampleStarlarkScript
code: |
  def run(input):
    result = input["value"] * 2
    return {"result": result}
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      value: { type: number }
    required: [ value ]
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      result: { type: number }
    required: [ result ]
