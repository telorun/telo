# A layered node table with an index over a column it does not declare.
kind: Telo.Library
metadata:
  name: IndexUndeclaredColumn
imports:
  Layers: ../../../..
  SQLite: ../../../../../sqlite
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Layers.NodeTable
metadata: { name: people }
table: people
key: id
columns:
  id: { type: text, nullable: false }
  name: { type: text }
indexes:
  people_name: { columns: [nmae] }
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref people]
