kind: Telo.Application
metadata: { name: ApprovalsWithMessage, version: 1.0.0 }
imports: { Conversation: ../../.., Run: ../../../../run }
targets:
  - !ref refused
---
kind: Run.Value
metadata: { name: checkTurn }
inputType: !ref Conversation.TurnRequest
value: true
---
kind: Telo.Sequence
metadata: { name: refused }
steps:
  - name: turn
    invoke: !ref checkTurn
    inputs: { message: Hi, attachments: [], approvals: [{ id: apr_1, approved: true }] }
