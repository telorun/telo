modules:
  modules/ui: Added
body: "Ui.Words gains a word for every issue keyword an Http.Api validation problem may
  carry that it lacked — minProperties, maxProperties, format, additionalProperties and
  propertyNames — so a renderer words each data.issues entry as its own validation does.
  Breaking: a Ui.Words of your own must now declare these five ids. Ui.RequestError's
  code and message are documented as the problem body's code and detail, and the action,
  collection and record contracts describe the problem shape and data.issues instead of
  the old validation envelope."
