kind: Telo.Library
metadata:
  name: CatchAllNotLastFixture
  version: 1.0.0
imports:
  Http: ../..
  Run: ../../../run
---
kind: Run.Value
metadata:
  name: handler
value: { ok: true }
---
# A no-when returns: entry followed by a when:-qualified entry — the later
# entry is unreachable → CATCHALL_NOT_LAST.
kind: Http.Api
metadata:
  name: catchAllApi
routes:
  - request:
      path: /x
      method: GET
    handler: !ref handler
    returns:
      - status: 200
        content:
          application/json:
            body: { ok: true }
      - status: 201
        when: "${{ result.ok }}"
        content:
          application/json:
            body: { ok: true }
