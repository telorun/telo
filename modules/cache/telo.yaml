kind: Telo.Library
metadata:
  name: Cache
  version: 0.12.1
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Performance, Storage]
  description: |
    Caching of computed or fetched values under a key, with freshness windows: an
    entry is fresh for its TTL, then stale for a grace period, then gone. Read or
    write entries directly, or wrap an expensive call in a read-through cache that
    serves the cached value and refreshes in the background or on demand.
exports:
  kinds:
    - Store
    - Lookup
    - Entry
    - View
---
# Cache.Store — the abstract backing store every cache backend implements. A
# Telo.Provider: a configured store, NOT an operation you invoke. Consumers
# (Cache.Lookup / Cache.Entry / Cache.View) reference it via
# `x-telo-ref: Self.Store`; a concrete implementation
# (CacheMemory.Store / CacheRedis.Store) satisfies the ref. The store owns
# freshness: an entry written with a fresh window (`ttl`) and an optional stale
# grace window (`staleTtl`) reports `fresh` until `ttl` elapses, `stale` until
# `staleTtl` elapses, then `miss`.
kind: Telo.Abstract
metadata:
  name: Store
  description: >-
    A configured cache backend that holds values under a key and owns their
    freshness: an entry reports fresh until its TTL elapses, stale through an
    optional grace window, then missing. Entries may be discarded early under memory
    pressure.
capability: Telo.Provider
---
kind: Telo.Definition
metadata:
  name: Lookup
  description: >-
    Reads a cached key and reports the outcome as a miss, a fresh hit or a stale hit,
    along with the stored value and how long ago it was written.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/lookup-controller.mjs&local_path=./nodejs/src/lookup-controller.ts
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [key]
    additionalProperties: false
    properties:
      key:
        type: string
        description: Cache key to read.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [state]
    additionalProperties: false
    properties:
      state:
        type: string
        enum: [miss, fresh, stale]
        description: >-
          `miss` (absent / expired past the stale window), `fresh` (within the
          fresh window), or `stale` (past `ttl` but within `staleTtl`).
      value:
        description: The cached value, or null on `miss`.
      age:
        type: [integer, "null"]
        description: Milliseconds since the entry was written, or null on `miss`.
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: Reference to the backing cache store.
      x-telo-ref:
        kind: Self.Store
        use: dependency
---
kind: Telo.Definition
metadata:
  name: Entry
  description: >-
    Writes a value into the cache under a key, setting how long it stays fresh and how
    long it may still be served as stale afterwards.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/entry-controller.mjs&local_path=./nodejs/src/entry-controller.ts
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [key, value]
    additionalProperties: false
    properties:
      key:
        type: string
        description: Cache key to write.
      value:
        description: Value to store.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      key:
        type: string
schema:
  type: object
  required: [store]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: Reference to the backing cache store.
      x-telo-ref:
        kind: Self.Store
        use: dependency
    ttl:
      title: TTL
      type: string
      default: "0s"
      description: >-
        Fresh window as a duration (`300s`, `5m`, `1h`, `50ms`). A lookup within
        this window reports `fresh`. `0s` means the entry is never fresh.
    staleTtl:
      title: Stale TTL
      type: string
      default: "0s"
      description: >-
        Additional grace window past `ttl` during which a lookup reports
        `stale` instead of `miss`. `0s` disables the stale window.
---
# Cache.View — read-through cache decorator. Wraps an invocable (`invoke:`) and
# serves its result from `store`, refreshing per `revalidate`. Stacks as a
# decorator: the leaf points `invoke:` at the wrapped target.
kind: Telo.Definition
metadata:
  name: View
  description: >-
    Wraps an expensive call in a read-through cache: serves the stored value when it
    is fresh, and on a stale hit either refreshes in the background, reloads before
    returning, or treats it as a miss. Falls back to the stale value when the refresh
    fails.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/view-controller.mjs&local_path=./nodejs/src/view-controller.ts
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [key]
    additionalProperties: true
    properties:
      key:
        type: string
        description: >-
          Cache key. All inputs (including `key`) are forwarded to the wrapped
          target on miss / revalidation.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [state]
    additionalProperties: false
    properties:
      state:
        type: string
        enum: [miss, fresh, stale]
        description: The cache outcome (what the store held), not the freshness of `value`.
      value:
        description: The served value — cached, or freshly loaded on miss / sync revalidation.
      age:
        type: [integer, "null"]
        description: Milliseconds since the served entry was written, or null when freshly loaded.
schema:
  type: object
  required: [store, invoke]
  additionalProperties: false
  properties:
    store:
      title: Store
      description: Reference to the backing cache store.
      x-telo-ref:
        kind: Self.Store
        use: dependency
    invoke:
      title: Invoke
      description: The wrapped source-of-truth invocable, called on miss / revalidation.
      type: object
      x-telo-ref:
        kind: Telo.Invocable
        # Which dispatches actually happen is decided by `revalidate:` —
        # `background` adds the detached refresh; under `sync`/`off` the
        # controller only ever calls inline. An unconditional [call, detached]
        # would overstate the default and every graph consumer reads it.
        use:
          by: /revalidate
          cases:
            background: [call, detached]
            sync: call
            off: call
    ttl:
      title: TTL
      type: string
      default: "0s"
      description: Fresh window (duration). A lookup within this window is `fresh`.
    staleTtl:
      title: Stale TTL
      type: string
      default: "0s"
      description: Grace window past `ttl` during which the value is served `stale`.
    revalidate:
      title: Revalidate
      type: string
      enum: [background, sync, off]
      default: sync
      description: >-
        On a stale hit: `background` serves stale and refreshes detached
        (single-flight per key; the kernel drains it on teardown); `sync`
        reloads before returning (stale-if-error fallback); `off` treats
        stale as a miss.
