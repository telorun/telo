modules:
  modules/http-server: Added
body: 'BREAKING: a request body is validated as the value it is and no longer coerced to
  the type its schema declares. A value of another JSON type at a typed property ("5"
  for an integer, 1 for a boolean), and a null at a property typed string, integer,
  number or boolean, is now a 400 in the request-validation envelope naming the property
  (location: body), where it used to be converted ("5" to 5, null to "" / 0 / false) and
  accepted. A property that may be null declares it (type: [string, "null"]). Query,
  path-parameter and header values are text by transport and are still read into their
  declared types; defaults are still applied and undeclared properties are still kept or
  refused as the schema says.'
