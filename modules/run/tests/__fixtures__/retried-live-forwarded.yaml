# The live value is not produced by an earlier step — it is FORWARDED into this
# composer through its own declared inputType, which is how an uploaded body
# reaches a handler. Covering only `steps.` chains missed this shape entirely.
kind: Telo.Application
metadata:
  name: RetriedLiveForwarded
  version: 1.0.0
imports:
  Run: ../../
  Stream: ../../../stream
targets:
  - !ref boot
---
kind: Run.Sequence
metadata: { name: boot }
steps:
  - name: source
    inputs:
      items: [a, b]
    invoke:
      kind: Stream.Of
  - name: handle
    inputs:
      payload: !cel "steps.source.result.output"
    invoke: !ref handler
---
kind: Run.Sequence
metadata: { name: handler }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [payload]
    properties:
      payload:
        x-telo-type:
          name: Telo.Stream
          of: Telo.Bytes
steps:
  - name: drain
    inputs:
      input: !cel "inputs.payload"
    retry:
      attempts: 4
    invoke:
      kind: Stream.Collect
