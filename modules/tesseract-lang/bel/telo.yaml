kind: Telo.Library
metadata:
  name: TesseractLangBel
  version: 0.2.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Recognize Belarusian text in images, offline: the trained model for reading
