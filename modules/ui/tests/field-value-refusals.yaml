kind: Telo.Application
metadata:
  name: UiFieldValueRefusalsTest
  version: 1.0.0
  description: |
    What the values a field offers refuse when first read: an option source
    searching, filtering or looking a value up as its collection does not
    accept, a picker's value type, and a date range's property, default, presets
    and labels.
imports: { Assert: ../../assert }
targets:
  - !ref fieldOptionFilterNotAcceptedAtRuntime
  - !ref fieldPickerMismatchAtRuntime
  - !ref fieldRangeDefaultAtRuntime
  - !ref fieldRangeLabelDuplicateAtRuntime
  - !ref fieldRangePresetUnknownAtRuntime
  - !ref fieldRangePropertyAtRuntime
  - !ref fieldSearchNotAcceptedAtRuntime
  - !ref fieldValueNotFilterableAtRuntime
---
kind: Assert.Manifest
metadata: { name: fieldOptionFilterNotAcceptedAtRuntime }
source: ./__fixtures__/invalid/field-option-filter-not-accepted/telo.yaml
expect:
  errors: [{ code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/fieldUnknown at 'fields[0]': lists a field for a property the model does not declare. Use a property of `model`, or add this one to it." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/fieldDuplicate at 'fields[0]': enters a property another field enters too. Each property is entered by one field: remove one of the two." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/fieldDuplicate at 'fields[1]': enters a property another field enters too. Each property is entered by one field: remove one of the two." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/requiredNotEntered: leaves a property the model requires with no field, so a valid record could never be sent. List a field for every required property, or leave `fields` out where each one is a scalar or a list of scalars." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/groupUnknown at 'fields[0]': names a group `groups` does not declare. Declare it under `groups`, or correct the name." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/groupDuplicate at 'groups[0]': has the name of another group. A field names its group: give each its own." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/groupDuplicate at 'groups[1]': has the name of another group. A field names its group: give each its own." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/groupSplit at 'groups[0]': is named by fields that are not listed one after another. A group is drawn where its fields are: list them together." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Form/stateFieldUnknown: keeps a property under `state.fields` no field shows. Name only properties the fields enter, or leave `state.fields` out to keep every one." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.Filters/filtersStateFieldUnknown: keeps a property under `policy.state.fields` no filter of the bar shows. Name only properties its filters enter, `search` when the bar has one, or leave `state.fields` out to keep every one." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.DateRangeField/startsNowhere: starts at a preset it does not declare. Name the label of one of its `presets`, or remove `initialPreset`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.DateRangeField/twoMonths at 'presets[0]': has the label of another preset. A preset is chosen by its label: give each its own." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.DateRangeField/twoMonths at 'presets[1]': has the label of another preset. A preset is chosen by its label: give each its own." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.CollectionOptions/searchNotAccepted: searches with a property and operator the collection does not accept. Declare the pair under the collection's `query.filters`, or change `search`." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.CollectionOptions/valueNotFilterable: yields a value no request can look options up by: `value` must be a property of the record, read as `row.<property>`, that the collection accepts with operator `in`, so a chosen value is labelled by one request." }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.CollectionOptions/optionFilterNotAccepted at 'filters.name': filters its source by a property the collection does not accept an equality on. Declare it with operator `eq` under the collection's `query.filters`, or remove this filter." }, { code: SCHEMA_VIOLATION, message: "Ui.CollectionOptions/optionFilterUnknown: `filters` does not satisfy the type declared at `{ from: /model, member: 0# }`: / must NOT have additional properties ('nickname' is not allowed)" }, { code: RESOURCE_RULE_VIOLATED, message: "Ui.CollectionOptions/optionFilterUnknown at 'filters.nickname': filters its source by a property the collection does not accept an equality on. Declare it with operator `eq` under the collection's `query.filters`, or remove this filter." }, { code: REFERRER_RULE_VIOLATED, message: "Ui.Form/inputControl at 'fields[0]': required by Ui.InputField — asks for a control its property cannot be entered with. Every control needs one plain value or a list of them; `select` and `options` need an `enum` or a boolean, `toggle` a boolean, `slider` a number declaring `minimum` and `maximum`, and `tags` a list." }, { code: REFERRER_RULE_VIOLATED, message: "Ui.Action/actionInputControl at 'fields[0]': required by Ui.InputField — asks for a control its property cannot be entered with. Every control needs one plain value or a list of them; `select` and `options` need an `enum` or a boolean, `toggle` a boolean, `slider` a number declaring `minimum` and `maximum`, and `tags` a list." }, { code: REFERRER_RULE_VIOLATED, message: "Ui.Form/choiceControl at 'fields[0]': required by Ui.ChoiceField — asks for a control a choice cannot be drawn with, or for a property no choice can enter. A choice is a `select` list or `options` side by side, over a string, a number, a boolean, or a list of those." }, { code: REFERRER_RULE_VIOLATED, message: "Ui.Form/choiceMismatch at 'fields[0]': required by Ui.ChoiceField — offers options whose value is of another type than the property holds, or than its items hold for a list. Make the source's `value` read a property of the property's type, or enter another property." }, { code: REFERRER_RULE_VIOLATED, message: "Ui.Form/pickerMismatch at 'fields[0]': required by Ui.PickerField — offers options whose value is of another type than the property holds, or than its items hold for a list. Make the source's `value` read a property of the property's type, or enter another property." }, { code: REFERRER_RULE_VIOLATED, message: "Ui.Form/rangeProperty at 'fields[0]': required by Ui.DateRangeField — enters a property that is not a date range: an object of exactly `from` and `to`, each `type: string` with `format: date`." }, { code: REFERRER_RULE_VIOLATED, message: "Ui.Form/rangeDefault at 'fields[0]': required by Ui.DateRangeField — starts at a preset while the model gives the property a `default` too. Remove `initialPreset`, or the property's `default`." }]
  runFails: "Ui.CollectionOptions 'optionFilterNotAccepted': 'filters.name' filters its source by a property the collection does not accept an equality on"
