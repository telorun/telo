kind: Telo.Application
metadata:
  name: I18nTranslationTest
  version: 1.0.0
  description: |
    `I18n.translate(text, lang, values?)` over the application's translations: a
    placeholder and plural cases translated into Polish, a later catalog
    overriding an earlier one, a regional tag falling back to its language and an
    unserved language to the source, one text in two contexts translated apart, a
    deprecated `I18n.Catalog` taking part in the set, and a source written in
    Polish selected by Polish rules for any language.
lang: en
imports:
  I18n: ../
  Pl: ./__fixtures__/polish-source
  Shipped: ./__fixtures__/shipped-translations
  Assert: ../../assert
translations:
  catalogs:
    - kind: Telo.TextTranslations
      lang: pl
      texts:
        - { text: "Rate not found for {$user}", translation: "Brak stawki dla {$user}" }
        - text: { plural: n, cases: { one: "{$n} file", other: "{$n} files" } }
          translation:
            plural: n
            cases: { one: "{$n} plik", few: "{$n} pliki", many: "{$n} plików", other: "{$n} pliku" }
        - { text: Open, context: verb, translation: Otwórz }
        - { text: Open, context: state, translation: Otwarte }
    - kind: Telo.TextTranslations
      lang: pl
      texts:
        - { text: "Rate not found for {$user}", translation: "Nie znaleziono stawki dla {$user}" }
    - !ref Shipped.spanish
    - kind: I18n.Catalog
      lang: de
      texts:
        - { text: Open, context: verb, translation: Öffnen }
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: assertOverride
    inputs:
      actual: !cel "I18n.translate('Rate not found for {$user}', 'pl', {'user': 'Ala'})"
      expected: Nie znaleziono stawki dla Ala
    invoke: !ref Assert.equals

  - name: assertPluralCases
    inputs:
      actual: !cel >-
        [1, 3, 5].map(n, I18n.translate({'plural': 'n', 'cases': {'one': '{$n} file', 'other': '{$n} files'}}, 'pl', {'n': n}))
      expected: [1 plik, 3 pliki, 5 plików]
    invoke: !ref Assert.equals

  # `pl-PL` is served by `pl`; `fr` is served by nothing, so the English source
  # is formatted by English rules.
  - name: assertFallback
    inputs:
      actual:
        regional: !cel "I18n.translate('Rate not found for {$user}', 'pl-PL', {'user': 'Ala'})"
        unserved: !cel "I18n.translate({'plural': 'n', 'cases': {'one': '{$n} file', 'other': '{$n} files'}}, 'fr', {'n': 1})"
      expected: { regional: Nie znaleziono stawki dla Ala, unserved: 1 file }
    invoke: !ref Assert.equals

  - name: assertContexts
    inputs:
      actual:
        verb: !cel "I18n.translate({'text': 'Open', 'context': 'verb'}, 'pl')"
        state: !cel "I18n.translate({'text': 'Open', 'context': 'state'}, 'pl')"
        none: !cel "I18n.translate('Open', 'pl')"
        catalog: !cel "I18n.translate({'text': 'Open', 'context': 'verb'}, 'de')"
        shipped: !cel "I18n.translate('Rate not found for {$user}', 'es', {'user': 'Ana'})"
      expected:
        { verb: Otwórz, state: Otwarte, none: Open, catalog: Öffnen, shipped: No se encontró la tarifa de Ana }
    invoke: !ref Assert.equals

  # Written in Polish and translated into nothing: the Polish source is selected
  # by Polish plural rules.
  - name: assertPolishSource
    inputs:
      actual:
        five: !cel "Pl.files(5, 'fr')"
        two: !cel "Pl.files(2, 'fr')"
      expected: { five: 5 plików, two: 2 pliki }
    invoke: !ref Assert.equals

  - name: assertDuplicateRefused
    invoke:
      kind: Assert.Manifest
      source: ./__fixtures__/duplicate/telo.yaml
      expect:
        errors:
          - { code: MESSAGE_ENTRY_DUPLICATE }
