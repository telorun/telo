kind: Telo.Application
metadata:
  name: NotesWeb
  version: 1.0.0
  categories: [Transport, Storage, UI]
  description: |
    A notes app where every user keeps their own notes, signed in through an
    OIDC-style provider (authorization code flow). `/auth/login` sends the browser to
    the provider, `/auth/callback` checks the returned `state`, exchanges the `code`
    at the provider's token endpoint and starts a session; `/api/notes` lists,
    creates, edits and deletes the signed-in user's notes, kept in SQLite, and never
    another user's; `/`, a declared UI page, shows them or offers the sign-in. The
    provider answers either in the redirect's query or with a form POST
    (`responseMode`).

    It brings its own provider, `identity-provider/`, a stand-in that signs `alice` in
    at once, so there is nothing to register or start:
        telo run ./examples/notes-web
    To sign in through a real provider, set `PROVIDER_URL` and `CLIENT_ID` and register
    `/auth/callback` at the address you open the app at with it.
lang: en
requires: { telo: ">=0.133.0" }
imports:
  App: ../../modules/app
  Http: ../../modules/http-server
  HttpDispatch: ../../modules/http-dispatch
  HttpClient: ../../modules/http-client
  Session: ../../modules/session
  Sql: ../../modules/sql
  SQLite: ../../modules/sqlite
  Crud: ../../modules/crud
  DataModel: ../../modules/data-model
  KvStoreSql: ../../modules/kv-store-sql
  Ui: ../../modules/ui
  UiReact: ../../modules/ui-react
variables:
  providerUrl:
    env: PROVIDER_URL
    type: string
    default: ""
    description: Origin of the identity provider, serving `/authorize` and `/token`. Empty means the bundled stand-in.
  clientId:
    env: CLIENT_ID
    type: string
    default: notes-example
    description: The client id registered with the provider.
  responseMode:
    env: RESPONSE_MODE
    type: string
    enum: [query, form_post]
    default: query
    description: How the provider returns the code, in the redirect's query or as a form POST.
  standInUser:
    env: STAND_IN_USER
    type: string
    default: alice
    description: The user the bundled stand-in provider signs in.
  dbFile:
    env: DB_FILE
    type: string
    x-telo-type: { name: Telo.HostPath, entry: file }
    default: notes-web.db
    description: The SQLite file the notes are kept in.
ports:
  http: { env: PORT, default: 8080 }
  provider: { env: PROVIDER_PORT, default: 8081 }
targets:
  - !ref identityProvider
  - !ref migrate
  - !ref server
  - { name: openUi, invoke: !ref openUi, inputs: { url: !cel "resources.server.status.localUrl" } }
---
# The provider the sign-in goes through when `PROVIDER_URL` names none.
kind: App.Instance
metadata: { name: identityProvider }
source: ./identity-provider
ports: { http: !cel "ports.provider" }
variables: { subject: !cel "variables.standInUser" }
---
kind: Http.Server
metadata: { name: server }
listen: { port: !cel "ports.http" }
contentTypeParsers:
  - { contentType: application/x-www-form-urlencoded }
mounts:
  - path: /auth
    mount: !ref auth
    authentication: { anonymous: allow }
  - path: /api
    mount: !ref api
    authentication:
      anonymous: allow
      verifiers: [{ verifier: !ref sessionVerifier, from: !ref fromSessionCookie }]
  # Only a signed-in user reaches the notes; anyone else is answered 401.
  - path: /api/notes
    mount: !ref notesApi
    authentication:
      verifiers: [{ verifier: !ref sessionVerifier, from: !ref fromSessionCookie }]
  - { path: /, mount: !ref ui, authentication: { anonymous: allow } }
---
kind: Session.Sessions
metadata: { name: sessions }
# Kept beside the notes, so a restart keeps everyone signed in.
store: { kind: KvStoreSql.Store, connection: !ref db, table: notes_web_sessions }
name: notes
idleTimeout: 1800s
absoluteLifetime: 43200s
---
kind: Session.Verifier
metadata: { name: sessionVerifier }
sessions: !ref sessions
---
kind: Http.FromCookie
metadata: { name: fromSessionCookie }
cookie: !ref sessionCookie
scheme: Session
---
kind: HttpDispatch.UnprefixedCookie
metadata: { name: sessionCookie }
name: notes-session
secure: false
---
kind: HttpDispatch.UnprefixedCookie
metadata: { name: stateCookie }
name: notes-state
secure: false
---
# Checks the returned state against the one this browser was sent away with, then
# trades the code for the user and starts a session.
kind: Telo.Sequence
metadata: { name: completeSignIn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [code, state, heldStates, redirectUri]
    properties:
      code: { type: string }
      state: { type: string }
      heldStates: { type: array, items: { type: string } }
      redirectUri: { type: string }
steps:
  # A browser may hold a stale state cookie under another path beside the current one.
  - name: stateMatches
    value: !cel "inputs.code != '' && inputs.state != '' && inputs.state in inputs.heldStates"
  - name: exchange
    if: !cel "steps.stateMatches.result"
    then:
      - name: token
        invoke:
          kind: HttpClient.Request
          client:
            kind: HttpClient.Client
            baseUrl: !cel "variables.providerUrl != '' ? variables.providerUrl : 'http://127.0.0.1:' + string(ports.provider)"
            throwOnHttpError: false
          method: POST
          url: /token
        inputs:
          headers: { content-type: application/x-www-form-urlencoded }
          body:
            grant_type: authorization_code
            code: !cel "inputs.code"
            client_id: !cel "variables.clientId"
            redirect_uri: !cel "inputs.redirectUri"
      - name: user
        value: !cel "steps.token.result.status == 200 ? string(steps.token.result.body.sub) : ''"
    else:
      - { name: user, value: "" }
  - name: signedIn
    if: !cel "steps.user.result != ''"
    then:
      - name: started
        invoke: { kind: Session.Start, sessions: !ref sessions }
        inputs:
          principal:
            subject: !cel "steps.user.result"
            issuer: null
            kind: user
            claims: {}
            scopes: []
            roles: []
            permissions: []
            org: null
            amr: [oidc]
            acr: null
            sessionId: null
            authenticatedAt: null
            via: login
      - name: outcome
        value: !cel "{'accepted': true, 'token': steps.started.result.token}"
    else:
      - { name: outcome, value: { accepted: false, token: "" } }
outputs:
  accepted: !cel "steps.outcome.result.accepted"
  token: !cel "steps.outcome.result.token"
---
kind: Http.Api
metadata: { name: auth }
catches:
  - status: 503
    content: { text/html: { body: "<p>Sign-in is unavailable; try again</p>" } }
routes:
  # The return address is on the host the browser used — a runner may open the page on
  # another host than the one the app listens as — so the state cookie comes back with it.
  - request: { path: /login, method: GET }
    inputs: { callback: !cel "'http://' + request.headers.host + '/auth/callback'" }
    handler:
      kind: Telo.Value
      inputType: { kind: Telo.JsonSchema, schema: { type: object, required: [callback], properties: { callback: { type: string } } } }
      value: !cel "{'state': uuidv4(), 'callback': inputs.callback}"
    returns:
      - status: 302
        headers:
          Location: !interpolate "${{ variables.providerUrl != '' ? variables.providerUrl : 'http://127.0.0.1:' + string(ports.provider) }}/authorize?response_type=code&client_id=${{ urlEncode(variables.clientId) }}&redirect_uri=${{ urlEncode(result.callback) }}&state=${{ result.state }}&response_mode=${{ variables.responseMode }}"
        cookies: [{ cookie: !ref stateCookie, value: !cel "result.state" }]
        content: { text/html: { body: "<p>Redirecting to the provider</p>" } }
  - request: { path: /callback, method: GET }
    handler: !ref completeSignIn
    inputs:
      code: !cel "'code' in request.query ? request.query.code : ''"
      state: !cel "'state' in request.query ? request.query.state : ''"
      heldStates: !cel "'cookie' in request.headers ? request.headers.cookie.split('; ').filter(p, p.startsWith('notes-state=')).map(p, p.substring(12)) : []"
      redirectUri: !cel "'http://' + request.headers.host + '/auth/callback'"
    returns: &signInReturns
      - status: 302
        when: !cel "result.accepted"
        headers: { Location: / }
        cookies:
          - { cookie: !ref stateCookie, maxAge: 0s }
          - { cookie: !ref sessionCookie, value: !cel "result.token" }
        content: { text/html: { body: "<p>Signed in</p>" } }
      - status: 400
        cookies: [{ cookie: !ref stateCookie, maxAge: 0s }]
        content: { text/html: { body: "<p>Sign-in was refused</p>" } }
  - request: { path: /callback, method: POST }
    handler: !ref completeSignIn
    inputs:
      code: !cel "request.body.split('&').filter(p, p.startsWith('code=')).map(p, urlDecode(p.substring(5))).join('')"
      state: !cel "request.body.split('&').filter(p, p.startsWith('state=')).map(p, urlDecode(p.substring(6))).join('')"
      heldStates: !cel "'cookie' in request.headers ? request.headers.cookie.split('; ').filter(p, p.startsWith('notes-state=')).map(p, p.substring(12)) : []"
      redirectUri: !cel "'http://' + request.headers.host + '/auth/callback'"
    returns: *signInReturns
---
# Who is signed in, for the page to read; an empty `user` means nobody.
kind: Http.Api
metadata: { name: api }
routes:
  - request: { path: /session, method: GET }
    inputs: { user: !cel "request.principal != null ? request.principal.subject : ''" }
    handler:
      kind: Telo.Value
      inputType: { kind: Telo.JsonSchema, schema: { type: object, properties: { user: { type: string } } } }
      value: !cel "{'user': inputs.user}"
    returns:
      - status: 200
        content:
          application/json:
            schema: { type: object, required: [user], properties: { user: { type: string } } }
            body: !cel "{'user': result.user}"
---
kind: SQLite.Connection
metadata: { name: db }
file: !cel "variables.dbFile"
---
# `owner` is the subject of the user who wrote the note.
kind: SQLite.Table
metadata: { name: notesTable }
table: notes
columns:
  id: { type: integer, primaryKey: true, identity: always }
  owner: { type: text, nullable: false }
  text: { type: text, nullable: false }
  updated_at: { type: text, nullable: false, defaultExpression: "datetime('now')" }
indexes: { notes_owner: { columns: [owner, id] } }
---
kind: SQLite.Schema
metadata: { name: migrate }
connection: !ref db
tables: [!ref notesTable]
---
# What a note's form sends: its text alone.
kind: Telo.JsonSchema
metadata: { name: NoteText }
schema:
  type: object
  required: [text]
  additionalProperties: false
  properties: { text: { type: string, title: Note, minLength: 1 } }
---
kind: Telo.JsonSchema
metadata: { name: Note }
schema:
  type: object
  required: [id, owner, text, updatedAt]
  properties:
    id: { type: integer }
    owner: { type: string }
    text: { type: string, title: Note }
    updatedAt: { type: string, title: Updated }
---
kind: DataModel.Collection
metadata: { name: notes }
model: !ref Note
query:
  filters: [{ property: text, operator: contains }]
  sort: [{ property: updatedAt }]
---
kind: Ui.CollectionSource
metadata: { name: notesSource }
collection: !ref notes
basePath: /api/notes
---
kind: Ui.CollectionPresentation
metadata: { name: notesPresentation }
source: !ref notesSource
---
kind: Ui.Form
metadata: { name: noteForm }
model: !ref NoteText
presentation: !ref notesPresentation
---
# The signed-in user's notes, spoken in the collection contract the page's listing
# reads. Every statement is held to the caller's own rows, so another user's note
# is answered 404, as if it did not exist.
kind: Http.Api
metadata: { name: notesApi }
catches:
  - when: !cel "problem.code == 'ERR_CRUD_QUERY_INVALID'"
    status: 400
    content:
      application/problem+json:
        body:
          type: !cel "problem.type"
          title: !cel "problem.title"
          status: !cel "problem.status"
          detail: !cel "problem.detail"
          code: !cel "problem.code"
          data:
            issues: !cel "problem.data == null ? [] : problem.data.issues.map(i, {'pointer': '/query' + i.pointer, 'keyword': i.keyword, 'params': i.params})"
  - when: !cel "problem.code == 'NOTE_NOT_FOUND'"
    status: 404
    content: { application/problem+json: {} }
routes:
  - request:
      method: GET
      path: /
      schema:
        query:
          type: object
          additionalProperties: true
          properties:
            limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
            cursor: { type: string }
            sort: { type: string }
            facet: { type: string }
    inputs:
      # A key with no `.` carries no operator, which is equality.
      filters: !cel >-
        keys(request.query)
        .filter(k, !(k in ['limit', 'cursor', 'sort', 'facet']))
        .map(k, k.contains('.')
          ? {'property': k.substring(0, k.lastIndexOf('.')), 'operator': k.substring(k.lastIndexOf('.') + 1), 'value': request.query[k]}
          : {'property': k, 'value': request.query[k]})
      sort: !cel >-
        ('sort' in request.query ? request.query.sort.split(',') : [])
        .map(s, {'property': s.startsWith('-') ? s.substring(1) : s, 'direction': s.startsWith('-') ? 'desc' : 'asc'})
      facet: !cel "'facet' in request.query ? request.query.facet : null"
      limit: !cel "request.query.limit"
      cursor: !cel "'cursor' in request.query ? request.query.cursor : null"
      scope: { owner: !cel "request.principal.subject" }
    handler: { kind: Crud.Reader, connection: !ref db, collection: !ref notes, table: notes }
    returns:
      - status: 200
        content: { application/json: { body: !cel "result" } }
  - request:
      method: GET
      path: /{id}
      schema: { params: { type: object, required: [id], properties: { id: { type: integer } } } }
    inputs: { id: !cel "request.params.id", owner: !cel "request.principal.subject" }
    handler:
      kind: Telo.Sequence
      inputType: !ref NoteKey
      outputType: !ref Note
      steps:
        - name: read
          invoke: { kind: Sql.Query, connection: !ref db }
          inputs:
            sql: !sql "SELECT id, owner, text, updated_at AS updatedAt FROM notes WHERE id = ${{ inputs.id }} AND owner = ${{ inputs.owner }}"
        - &noteFound
          name: found
          if: !cel "size(steps.read.result.rows) == 0"
          then:
            - name: missing
              throw: { code: NOTE_NOT_FOUND, displayMessage: There is no such note. }
      outputs: !cel "steps.read.result.rows[0]"
    returns:
      - status: 200
        content: { application/json: { body: !cel "result" } }
  - request:
      method: POST
      path: /
      schema:
        body: &noteBody { type: object, required: [text], additionalProperties: false, properties: { text: { type: string, minLength: 1 } } }
    inputs: { text: !cel "request.body.text", owner: !cel "request.principal.subject" }
    handler:
      kind: Telo.Sequence
      inputType: !ref OwnedText
      outputType: !ref Note
      steps:
        - name: insert
          invoke: { kind: Sql.Query, connection: !ref db }
          inputs:
            sql: !sql "INSERT INTO notes (owner, text) VALUES (${{ inputs.owner }}, ${{ inputs.text }}) RETURNING id, owner, text, updated_at AS updatedAt"
      outputs: !cel "steps.insert.result.rows[0]"
    returns:
      - status: 201
        content: { application/json: { body: !cel "result" } }
  - request:
      method: PUT
      path: /{id}
      schema:
        params: { type: object, required: [id], properties: { id: { type: integer } } }
        body: *noteBody
    inputs: { id: !cel "request.params.id", text: !cel "request.body.text", owner: !cel "request.principal.subject" }
    handler:
      kind: Telo.Sequence
      inputType: !ref OwnedNote
      outputType: !ref Note
      steps:
        - name: read
          invoke: { kind: Sql.Query, connection: !ref db }
          inputs:
            sql: !sql "UPDATE notes SET text = ${{ inputs.text }}, updated_at = datetime('now') WHERE id = ${{ inputs.id }} AND owner = ${{ inputs.owner }} RETURNING id, owner, text, updated_at AS updatedAt"
        - *noteFound
      outputs: !cel "steps.read.result.rows[0]"
    returns:
      - status: 200
        content: { application/json: { body: !cel "result" } }
  - request:
      method: DELETE
      path: /{id}
      schema: { params: { type: object, required: [id], properties: { id: { type: integer } } } }
    inputs: { id: !cel "request.params.id", owner: !cel "request.principal.subject" }
    handler:
      kind: Telo.Sequence
      inputType: !ref NoteKey
      steps:
        - name: read
          invoke: { kind: Sql.Query, connection: !ref db }
          inputs:
            sql: !sql "DELETE FROM notes WHERE id = ${{ inputs.id }} AND owner = ${{ inputs.owner }} RETURNING id"
        - *noteFound
    returns:
      - { status: 204 }
---
kind: Telo.JsonSchema
metadata: { name: NoteKey }
schema:
  type: object
  required: [id, owner]
  properties: { id: { type: integer }, owner: { type: string } }
---
kind: Telo.JsonSchema
metadata: { name: OwnedText }
schema:
  type: object
  required: [owner, text]
  properties: { owner: { type: string }, text: { type: string } }
---
kind: Telo.JsonSchema
metadata: { name: OwnedNote }
schema:
  type: object
  required: [id, owner, text]
  properties: { id: { type: integer }, owner: { type: string }, text: { type: string } }
---
kind: Telo.JsonSchema
metadata: { name: Whoami }
schema: { type: object, required: [user], properties: { user: { type: string, title: User } } }
---
# The home page reads the session and shows either the user and their notes or the
# way in. The user's name is drawn as text, whatever it holds.
kind: UiReact.App
metadata: { name: ui }
title: Notes
theme: !ref UiReact.defaultTheme
pages:
  - kind: Ui.Page
    path: /
    title: Notes
    width: contained
    children:
      - { type: text, text: Notes, style: heading }
      - type: composite
        ref:
          kind: Ui.Data
          model: !ref Whoami
          source: /api/session
          # A 401 from the notes list reads the session again.
          reloadOn: [focus, unauthorized]
          content:
            type: stack
            children:
              - type: stack
                shown: { at: !cel "data.user", matches: { minLength: 1 } }
                children:
                  - { type: text, text: Signed in as, style: muted }
                  - { type: value, value: !cel "data.user", style: strong }
                  - type: composite
                    ref:
                      kind: Ui.Listing
                      presentation: !ref notesPresentation
                      model: !ref Note
                      sort: { by: { property: updatedAt, direction: descending } }
                      layout:
                        kind: Ui.TableLayout
                        columns:
                          - value: !cel "row.text"
                          - value: !cel "row.updatedAt"
                      empty: { type: text, text: No notes yet., style: muted }
                      create: { form: !ref noteForm }
                      edit: { form: !ref noteForm }
                      delete: true
              - type: stack
                shown: { at: !cel "data.user", matches: { maxLength: 0 } }
                children:
                  - { type: text, text: Sign in to see your notes., style: muted }
                  - { type: link, text: Sign in, href: /auth/login, button: { kind: Ui.TextButton }, style: accent }
          # A session the server no longer holds is refused, not read as nobody.
          failure:
            type: stack
            children:
              - type: stack
                shown: { at: !cel "error.status", matches: { const: 401 } }
                children:
                  - { type: text, text: Your session has ended. Sign in again to see your notes., style: muted }
                  - { type: link, text: Sign in, href: /auth/login, button: { kind: Ui.TextButton }, style: accent }
              - type: value
                value: !cel "error.message"
                shown: { at: !cel "error", matches: { not: { required: [status], properties: { status: { const: 401 } } } } }
---
kind: Telo.OpenUrl
metadata: { name: openUi }
