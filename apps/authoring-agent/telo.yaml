kind: Telo.Application
metadata:
  name: AuthoringAgent
  version: 0.30.2
  repository: https://github.com/telorun/telo
  description: |
    AI manifest-authoring agent. Thin HTTP/SSE root over the `chat` library, which
    owns the chat backend (Anthropic-backed Ai.AgentStream + fs/shell tools + SQLite
    history + ChatHandler). This root exposes the library's ChatHandler over a
    declared port and starts the conversation store, kept in `agent.sqlite` in
    the agent's durable state directory (AGENT_STATE_DIR, or the host's state
    directory), where every turn's records are journaled. POST /conversations mints a conversation, which is
    listed, searched, renamed, archived, deleted, truncated and branched under
    /conversations; POST /chat admits a turn into one — at most once per
    Idempotency-Key — and its records stream from GET /chat/{turnId}/events as
    Server-Sent Events; POST /chat/{turnId}/abort cancels a running turn and
    POST /chat/{turnId}/continue resumes an interrupted one inside the same turn;
    GET /conversations/{id}/records pages a conversation's records. A
    conversation is named after its first message, and its older turns are
    summarized once its context reaches MAX_CONTEXT_TOKENS. Every change the
    agent's write_file, edit_file and delete_file make is checkpointed under its
    turn: GET /chat/{turnId}/changes lists a turn's net file changes as diffs,
    POST /chat/{turnId}/revert puts them back, and every ended turn's entry on
    the records route carries a summary. Conversations idle
    for RETENTION_DAYS are deleted whole, at boot and hourly. Requires
    ANTHROPIC_API_KEY (any value when MODEL_ENDPOINT names a keyless endpoint).

    Every route of the `api` router passes one guard: an Origin outside
    ALLOWED_ORIGINS is refused 403, and when AGENT_TOKEN is set a request without
    `Authorization: Bearer <token>` is refused 401. GET /health and GET /ready
    are unguarded; GET /capabilities reports the agent's identity, prompt id and
    auth mode. OTLP_ENDPOINT exports traces and logs to a collector; unset,
    spans are written as log records.
# The chat library's agent takes a content `resolver`, whose `context` an older
# runtime cannot type (it reports the mapping as never evaluated).
#
# 0.123.0: the chat library re-raises with `rethrow: {}`, which 0.122.0 cannot
# read, so it loses the codes a route here catches (`ERR_TURN_IN_PROGRESS`,
# `ERR_CONVERSATION_CHANGED`) and refuses those entries.
#
# 0.125.0: the chat library ships inside this artifact; an older runtime resolves
# the published `./chat#sha256-…` to the separate chat artifact, unpinned.
requires:
  telo: ">=0.125.0"
imports:
  Chat:
    source: ./chat
    resources:
      hub: !ref hub
    needs:
      agentState: !ref agentState
    secrets:
      anthropicApiKey: !cel "secrets.anthropicApiKey"
    variables:
      workspaceDir: !cel "variables.workspaceDir"
      budgetLimit: !cel "variables.budgetLimit"
      allowManifestRuns: !cel "variables.allowManifestRuns"
      model: !cel "variables.model"
      modelEndpoint: !cel "variables.modelEndpoint"
      retentionDays: !cel "variables.retentionDays"
      teloProgram: !cel "variables.teloProgram"
      maxContextTokens: !cel "variables.maxContextTokens"
      maxToolResultBytes: !cel "variables.maxToolResultBytes"
      maxCheckpointBytes: !cel "variables.maxCheckpointBytes"
      maxCheckpointFiles: !cel "variables.maxCheckpointFiles"
      maxAttachmentBytes: !cel "variables.maxAttachmentBytes"
  Http: oci://ghcr.io/telorun/http-server@0.41.1#sha256-TGV1OIU5OtaAhU74roamA-r5DsdqgovsNtkxc8M4wIc
  # `Mcp` and `Run` come from where the chat library takes them, so every
  # module in this graph has one origin.
  Mcp: oci://ghcr.io/telorun/mcp-client@0.17.0#sha256-wMlnrVxgeWHAX6_f1pr7v059KzgjYHuICg5Ui68v2zc
  Octet: oci://ghcr.io/telorun/octet-codec@0.12.0#sha256-Eg9ZpVjtXbkkmFA2CTeKg69KMHPZ5F6sNbCgpbbqyXc
  Sse: oci://ghcr.io/telorun/sse-codec@0.14.0#sha256-PBgU4RhtLU6olq9WQicRc0fL_9JzF90P2PSxGinJMH4
  Scheduler: oci://ghcr.io/telorun/scheduler@0.11.0#sha256-Q6pFuiUgMWlYX2Y8SC534yALpD20t60c9ZBj7iMKVeA
  Run: oci://ghcr.io/telorun/run@0.31.0#sha256-nwScCIsE4_c40LSm8abAb5qDKQxVnTU8ORlf7Xjyys4
  Log: oci://ghcr.io/telorun/log@0.3.0#sha256-zHq0Vq_G85EDj7Wfbcla8_6hvE4imxgVQoMZsxZwIwE
  Otlp: oci://ghcr.io/telorun/otlp@0.7.1#sha256-eOjL-COsSXBxMFXQLmaljfYNuIIA-DndRvz1-0rSBSE
ports:
  http:
    env: PORT
    default: 8080
# Where the agent keeps its own state: `agent.sqlite`, the turns' checkpoints
# and the attachments. Outside the workspace, so nothing syncs it and SQLite
# runs on the filesystem it was opened on. A host names it with
# AGENT_STATE_DIR, or answers it under TELO_HOST_STATE_DIR (a runner gives each
# session's agent one; the image sets /var/lib/telo-agent). One writer at a
# time, which SQLite relies on.
needs:
  agentState:
    kind: Telo.DurableDirectory
    parameters: { access: single-writer }
    env: { path: AGENT_STATE_DIR }
variables:
  # Where the agent's file tools and spawned commands are rooted. A runner
  # standing this up as a session's co-resident agent sets it to the shared
  # workspace volume it mounts, so the agent edits the same tree the application
  # containers watch. Unset — running it standalone — keeps the local layout.
  workspaceDir:
    env: WORKSPACE_DIR
    type: string
    x-telo-type: Telo.HostPath
    default: ./workspace
  # The model every turn runs on. A turn's recorded reasoning is replayed only to
  # the model that produced it, so changing this drops it on the next turn.
  model:
    env: MODEL
    type: string
    default: claude-haiku-5-5
  # The Anthropic Messages API endpoint, a gateway, or a local test stub.
  modelEndpoint:
    env: MODEL_ENDPOINT
    type: string
    default: https://api.anthropic.com/v1
  # Days a conversation may sit idle before it is deleted whole — swept at boot
  # and hourly — and how long its removed turns then keep answering 410 Gone
  # rather than 404.
  retentionDays:
    env: RETENTION_DAYS
    type: integer
    minimum: 1
    default: 30
  budgetLimit:
    env: BUDGET_LIMIT
    type: integer
    default: 4000000
  # The context, in tokens, a conversation may reach before its older turns are
  # summarized for the model. Below the model's own window, so a turn that
  # grows it still fits. At least 8, so the summary call's cap
  # (`MAX_CONTEXT_TOKENS / 8` output tokens) is at least 1.
  maxContextTokens:
    env: MAX_CONTEXT_TOKENS
    type: integer
    minimum: 8
    default: 120000
  # The most UTF-8 bytes of text one tool result may feed the model; a longer
  # one is cut and marked `[truncated: …]`.
  maxToolResultBytes:
    env: MAX_TOOL_RESULT_BYTES
    type: integer
    minimum: 1
    default: 32768
  # The most bytes of "before" copies one write_file, edit_file or delete_file
  # call may capture into its turn's checkpoint, and the most files. A call
  # that would pass either is refused with ERR_CHECKPOINT_TOO_LARGE before
  # anything changes.
  maxCheckpointBytes:
    env: MAX_CHECKPOINT_BYTES
    type: integer
    minimum: 0
    default: 16777216
  maxCheckpointFiles:
    env: MAX_CHECKPOINT_FILES
    type: integer
    minimum: 1
    default: 1000
  # The largest file a client may attach to a message. A larger upload is
  # refused and stores nothing.
  maxAttachmentBytes:
    env: MAX_ATTACHMENT_BYTES
    type: integer
    minimum: 1
    default: 10485760
  # Lets the agent RUN the tests it writes, not merely check them.
  #
  # Off by default because it is arbitrary code execution driven by whoever is
  # prompting: a manifest the agent wrote can spawn a shell, read any file this
  # container can and reach the network, and a child inherits the operator
  # environment apart from provider keys, which are scrubbed. Safe to turn on
  # where the prompter owns the container — a per-session or co-resident agent
  # in the user's own workspace, which already runs their manifests under
  # `telo run --watch`. Do not turn it on for an agent open to anonymous
  # callers.
  allowManifestRuns:
    env: ALLOW_MANIFEST_RUNS
    type: boolean
    default: false
  # How the agent invokes the `telo` CLI — the program and any leading
  # arguments, as a JSON array — for its check loop and its `telo` tool alike.
  # The image installs `telo`; a checkout points it at its own CLI.
  teloProgram:
    env: TELO_PROGRAM
    type: array
    items: { type: string }
    default: [ telo ]
  # Origins a browser may call the guarded routes from: comma-separated, `*`
  # for any. An Origin outside the list is refused 403 — CORS alone only stops a
  # browser from READING the answer, not the request from running. A request
  # with no Origin (a CLI, a server) passes to the token check. `null` (a
  # sandboxed or file page) is refused unless listed, even under `*`.
  allowedOrigins:
    env: ALLOWED_ORIGINS
    type: string
    default: "*"
  # An OpenTelemetry collector's base URL. Set, traces go to `<url>/v1/traces`
  # and log records to `<url>/v1/logs`; empty, every finished span is written
  # as a log record to the console instead.
  otlpEndpoint:
    env: OTLP_ENDPOINT
    type: string
    default: ""
secrets:
  anthropicApiKey:
    env: ANTHROPIC_API_KEY
    type: string
  # The bearer token every guarded route requires. Empty leaves them open, and
  # the agent says so in one warning at boot. A runner that mints a per-session
  # token injects it here (the runner's `AGENT_TOKEN_ENV` is `AGENT_TOKEN`).
  agentToken:
    env: AGENT_TOKEN
    type: string
    default: ""
logging:
  sinks:
    - kind: Telo.ConsoleSink
    - sink:
        kind: Otlp.Sink
        endpoint: !interpolate "${{ variables.otlpEndpoint }}/v1/logs"
        resourceAttributes:
          service.name: authoring-agent
          service.version: !cel "module.version"
      when: !cel "variables.otlpEndpoint != ''"
tracing:
  sinks:
    - sink:
        kind: Otlp.TraceSink
        endpoint: !interpolate "${{ variables.otlpEndpoint }}/v1/traces"
        resourceAttributes:
          service.name: authoring-agent
          service.version: !cel "module.version"
      when: !cel "variables.otlpEndpoint != ''"
    # `debug`: a record per span would bury the agent's own output at `info`.
    - sink:
        kind: Telo.LogTraceSink
        level: debug
      when: !cel "variables.otlpEndpoint == ''"
targets:
  - !ref Chat.ensureWorkspace
  - !ref Chat.initSchema
  # Rebuilds whatever projection a migration cleared, before anything reads it.
  - !ref Chat.catchUpProjections
  # Retention at boot, so an agent restarted less often than hourly still
  # deletes what went idle while it was down. `int(...)`: an integer variable
  # arrives here as a double at runtime, though it is typed int statically.
  - name: sweep
    invoke: !ref Chat.retentionSweep
    inputs:
      idleBefore: !cel "now() - duration(string(int(variables.retentionDays) * 24) + 'h')"
  - !ref retention
  # Said once, at boot, where an operator reads it: with no token every route
  # answers anyone who reaches the port. Never carries a secret.
  - name: exposure
    when: !cel "secrets.agentToken == ''"
    invoke: !ref Log.emit
    inputs:
      level: warn
      message: !cel >-
        'AGENT_TOKEN is not set: every agent route answers without authentication — '
          + 'chat, conversations, workspace read and write'
          + (variables.allowManifestRuns ? ', and running manifests' : '')
          + '. Set AGENT_TOKEN to require a bearer token.'
      attributes:
        port: !cel "ports.http"
        allowedOrigins: !cel "variables.allowedOrigins"
        manifestRuns: !cel "variables.allowManifestRuns"
  - !ref server
---
# The hub the agent discovers modules through, handed to the chat library.
kind: Mcp.HttpClient
metadata: { name: hub }
url: https://telo.sh/mcp
clientInfo:
  name: authoring-agent
  version: 0.0.0
---
# Retention hourly: every conversation idle for `RETENTION_DAYS` is deleted.
kind: Scheduler.Interval
metadata: { name: retention }
every: 1h
invoke: !ref Chat.retentionSweep
inputs:
  idleBefore: !cel "now() - duration(string(int(variables.retentionDays) * 24) + 'h')"
---
kind: Sse.Encoder
metadata: { name: sseEnc }
---
kind: Http.Api
metadata: { name: api }
routes:
  - request:
      path: /chat
      method: POST
      schema:
        headers:
          type: object
          properties:
            idempotency-key:
              type: string
              minLength: 1
              maxLength: 255
              description: >-
                Optional. The same key on a retried POST returns the original
                turnId instead of starting a second turn; scoped to the
                conversation and remembered for 24 hours.
              examples: [ "0b8e6c4e-3f5a-4b1e-9a57-4d7cf1f0a2b1" ]
        body:
          type: object
          required: [conversationId, message]
          properties:
            conversationId:
              type: string
              format: uuid
              description: >-
                A conversation this agent minted (POST /conversations): unknown is
                404, deleted 410, archived 409.
              examples: [ "0192f0c1-7a3e-7cc2-9d4b-5f1e2a3b4c5d" ]
            message:
              type: string
              description: The user's message.
              examples: [ "Add an HTTP health endpoint." ]
            attachments:
              type: array
              items: { type: string }
              description: >-
                Ids of files uploaded to this conversation (POST
                /conversations/{id}/attachments) that the message carries. An
                image or a PDF reaches the model as itself, a text file as its
                text.
    handler: !ref Chat.chatStart
    inputs:
      conversationId: !cel "request.body.conversationId"
      message: !cel "request.body.message"
      attachments: !cel "has(request.body.attachments) ? request.body.attachments : []"
      clientIp: !cel "request.ip"
      idempotencyKey: !cel "'idempotency-key' in request.headers ? request.headers['idempotency-key'] : ''"
    returns:
      - status: 200
        content:
          application/json:
            body:
              turnId: !cel "result.turnId"
    # Every refusal is a coded error, so a client reads `code` from any non-200
    # body rather than inferring the reason from the status.
    catches:
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - when: !cel "error.code == 'ERR_CONVERSATION_ARCHIVED'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_ARCHIVED
      # A named attachment is not one of this conversation's — no turn started.
      - when: !cel "error.code == 'ERR_ATTACHMENT_NOT_FOUND'"
        status: 422
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_ATTACHMENT_NOT_FOUND
              attachmentIds: !cel "error.data.attachmentIds"
      - when: !cel "error.code == 'ERR_TOO_MANY_ATTACHMENTS'"
        status: 422
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TOO_MANY_ATTACHMENTS
              max: !cel "error.data.max"
      # Per-IP throttle — no turn started.
      - when: !cel "error.code == 'ERR_RATE_LIMITED'"
        status: 429
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_RATE_LIMITED
              retryAfter: !cel "error.data.retryAfter"
      # Operator spend ceiling reached — no turn started.
      - when: !cel "error.code == 'ERR_AT_CAPACITY'"
        status: 429
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_AT_CAPACITY
              retryAfter: !cel "error.data.retryAfter"
      # A turn is already in flight for this conversation. Turns of different
      # conversations can run at once; the workspace write lease serializes their writes.
      - when: !cel "error.code == 'ERR_TURN_IN_PROGRESS'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_IN_PROGRESS
              activeTurnId: !cel "error.data.activeTurnId"
      # The same Idempotency-Key is still being admitted — retry with that key.
      - when: !cel "error.code == 'ERR_IDEMPOTENCY_KEY_IN_FLIGHT'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_IDEMPOTENCY_KEY_IN_FLIGHT
      # The key was used for a different message in this conversation.
      - when: !cel "error.code == 'ERR_IDEMPOTENCY_KEY_REUSED'"
        status: 422
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_IDEMPOTENCY_KEY_REUSED
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # A turn's records as Server-Sent Events, read from the journal: a running
  # turn replays and tails, a finished one replays and ends, a failed one
  # replays and ends with an `event: error` frame carrying `{ code, message }`.
  # Each frame is a `{ id, data }` envelope whose `id:` line is the resume
  # cursor, sent back as the `Last-Event-ID` header (a browser's EventSource
  # does this by itself) or as `?lastEventId=`; the header wins.
  - request:
      path: /chat/{turnId}/events
      method: GET
      schema:
        params:
          type: object
          required: [turnId]
          properties:
            turnId: { type: string }
        query:
          type: object
          properties:
            lastEventId: { type: string, pattern: "^[0-9]+$" }
        headers:
          type: object
          properties:
            last-event-id: { type: string, pattern: "^[0-9]+$" }
    handler: !ref Chat.turnEvents
    inputs:
      turnId: !cel "request.params.turnId"
      fromId: !cel >-
        'last-event-id' in request.headers ? int(request.headers['last-event-id'])
          : has(request.query.lastEventId) ? int(request.query.lastEventId) : 0
    returns:
      - status: 200
        mode: stream
        content:
          text/event-stream:
            encoder: !ref sseEnc
    catches:
      - when: !cel "error.code == 'ERR_TURN_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_NOT_FOUND
      - when: !cel "error.code == 'ERR_JOURNAL_KEY_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_JOURNAL_KEY_REMOVED
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # Cancel a running turn. No body: the turn names its conversation. A turn not
  # running answers `cancelled: false`; the turn's event stream ends with an
  # ERR_INVOKE_CANCELLED error frame and the records route reports it `aborted`.
  - request:
      path: /chat/{turnId}/abort
      method: POST
      schema:
        params:
          type: object
          required: [turnId]
          properties:
            turnId: { type: string }
    handler: !ref Chat.abortTurn
    inputs:
      turnId: !cel "request.params.turnId"
    returns:
      - status: 200
        content:
          application/json:
            body:
              cancelled: !cel "result.cancelled"
    catches:
      - when: !cel "error.code == 'ERR_TURN_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_NOT_FOUND
      - when: !cel "error.code == 'ERR_JOURNAL_KEY_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_JOURNAL_KEY_REMOVED
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # Continue an interrupted turn inside the same turn. No body. `fromId` is the
  # last record before the new attempt, whose `turn-continued` record comes
  # next; the client re-attaches to the same event stream.
  - request:
      path: /chat/{turnId}/continue
      method: POST
      schema:
        params:
          type: object
          required: [turnId]
          properties:
            turnId: { type: string }
    handler: !ref Chat.continueTurn
    inputs:
      turnId: !cel "request.params.turnId"
      clientIp: !cel "request.ip"
    returns:
      - status: 200
        content:
          application/json:
            body:
              turnId: !cel "result.turnId"
              fromId: !cel "result.fromId"
    catches:
      - when: !cel "error.code == 'ERR_JOURNAL_KEY_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_JOURNAL_KEY_REMOVED
      - when: !cel "error.code == 'ERR_TURN_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_NOT_FOUND
      - when: !cel "error.code == 'ERR_TURN_IN_PROGRESS'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_IN_PROGRESS
              activeTurnId: !cel "error.data.activeTurnId"
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - when: !cel "error.code == 'ERR_CONVERSATION_ARCHIVED'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_ARCHIVED
      - when: !cel "error.code == 'ERR_TURN_NOT_CONTINUABLE'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_NOT_CONTINUABLE
              reason: !cel "error.data.reason"
      - when: !cel "error.code == 'ERR_RATE_LIMITED'"
        status: 429
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_RATE_LIMITED
              retryAfter: !cel "error.data.retryAfter"
      - when: !cel "error.code == 'ERR_AT_CAPACITY'"
        status: 429
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_AT_CAPACITY
              retryAfter: !cel "error.data.retryAfter"
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # What a turn changed on balance: each file with its status, digests, line
  # counts, hunks, the line its first hunk starts at and whether the workspace
  # file has changed since; and the turn's recorded revert, null until one ran.
  # Served for an archived conversation and while the turn runs. Both are null
  # for a turn from before checkpoints existed.
  - request:
      path: /chat/{turnId}/changes
      method: GET
      schema:
        params:
          type: object
          required: [turnId]
          properties:
            turnId: { type: string }
    handler: !ref Chat.turnChanges
    inputs:
      turnId: !cel "request.params.turnId"
    returns:
      - status: 200
        content:
          application/json:
            body:
              files: !cel "result.files"
              revert: !cel "result.revert"
    catches:
      - when: !cel "error.code == 'ERR_JOURNAL_KEY_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_JOURNAL_KEY_REMOVED
      - when: !cel "error.code == 'ERR_TURN_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # Put back what a turn changed. No body. Each path is restored only while it
  # still holds what the turn left; one changed since is `skipped`, never
  # overwritten. `revision` is the conversation's, moved when a path's outcome
  # was written or changed, and when the turn's first revert runs to its end.
  - request:
      path: /chat/{turnId}/revert
      method: POST
      schema:
        params:
          type: object
          required: [turnId]
          properties:
            turnId: { type: string }
    handler: !ref Chat.revertTurn
    inputs:
      turnId: !cel "request.params.turnId"
    returns:
      - status: 200
        content:
          application/json:
            body:
              revert: !cel "result.revert"
              revision: !cel "result.revision"
    catches:
      - when: !cel "error.code == 'ERR_JOURNAL_KEY_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_JOURNAL_KEY_REMOVED
      - when: !cel "error.code == 'ERR_TURN_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - when: !cel "error.code == 'ERR_CONVERSATION_ARCHIVED'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_ARCHIVED
      - when: !cel "error.code == 'ERR_TURN_IN_PROGRESS'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_IN_PROGRESS
              activeTurnId: !cel "error.data.activeTurnId"
      - when: !cel "error.code == 'ERR_TURN_NOT_CHECKPOINTED'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_NOT_CHECKPOINTED
      # The workspace lease stayed held through every retry. Paths restored
      # before that stay restored and recorded on the turn.
      - when: !cel "error.code == 'ERR_WORKSPACE_BUSY'"
        status: 503
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_WORKSPACE_BUSY
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # A conversation's records, paged by (turn, record id): each turn with its
  # status, its `{ id, data }` records, its `summary` once it has ended and its
  # `revert` once one ran, in order — the transcript every client renders
  # from. `next` is the cursor of the following page, null on the last.
  - request:
      path: /conversations/{id}/records
      method: GET
      schema:
        params:
          type: object
          required: [id]
          properties:
            id: { type: string }
        query:
          type: object
          properties:
            fromTurn:
              type: string
              description: The turn the page starts in; omitted, the conversation's first.
            fromId:
              type: integer
              minimum: 0
              description: Records of `fromTurn` after this id.
            limit:
              type: integer
              minimum: 1
              maximum: 10000
              description: Most records the page carries (default 2000).
    handler: !ref Chat.conversationRecords
    inputs:
      conversationId: !cel "request.params.id"
      fromTurn: !cel "has(request.query.fromTurn) ? request.query.fromTurn : ''"
      fromId: !cel "has(request.query.fromId) ? request.query.fromId : 0"
      limit: !cel "has(request.query.limit) ? request.query.limit : 2000"
    returns:
      - status: 200
        content:
          application/json:
            body:
              turns: !cel "result.turns"
              next: !cel "result.next"
    catches:
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - when: !cel "error.code == 'ERR_TURN_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_NOT_FOUND
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # Conversations. The agent mints every id; a conversation is readable,
  # renamable, branchable and deletable while archived, but takes no new turn.
  # A deleted one answers 410 ERR_CONVERSATION_REMOVED on every route for
  # RETENTION_DAYS, then 404 ERR_CONVERSATION_NOT_FOUND.
  - request:
      path: /conversations
      method: POST
    handler: !ref Chat.createConversation
    returns:
      - status: 201
        content:
          application/json:
            body: !cel "result.conversation"
    catches:
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # Newest activity first. `q` filters by a case-insensitive substring of the
  # title or of any user or assistant message's text; `archived=true` lists
  # only archived ones. `next` is the cursor of the following page, null on
  # the last.
  - request:
      path: /conversations
      method: GET
      schema:
        query:
          type: object
          properties:
            limit: { type: integer, minimum: 1, maximum: 200, description: Most conversations the page carries (default 50). }
            archived: { type: boolean, description: "true lists only archived conversations (default false)." }
            q: { type: string, minLength: 1, maxLength: 200, pattern: "\\S" }
            before: { type: string, description: The `updatedAt` of the previous page's last conversation. }
            beforeId: { type: string, description: The `id` of the previous page's last conversation. }
    handler: !ref Chat.listConversations
    inputs:
      limit: !cel "has(request.query.limit) ? request.query.limit : 50"
      archived: !cel "has(request.query.archived) ? request.query.archived : false"
      q: !cel "has(request.query.q) ? request.query.q : ''"
      before: !cel "has(request.query.before) ? request.query.before : ''"
      beforeId: !cel "has(request.query.beforeId) ? request.query.beforeId : ''"
    returns:
      - status: 200
        content:
          application/json:
            body:
              conversations: !cel "result.conversations"
              next: !cel "result.next"
    catches:
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  - request:
      path: /conversations/{id}
      method: GET
      schema:
        params:
          type: object
          required: [id]
          properties:
            id: { type: string }
    handler: !ref Chat.getConversation
    inputs:
      conversationId: !cel "request.params.id"
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result.conversation"
    catches:
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # Rename and/or (un)archive. A title is 1–200 characters with at least one
  # that is not a space, and is never reset to null.
  - request:
      path: /conversations/{id}
      method: PATCH
      schema:
        params:
          type: object
          required: [id]
          properties:
            id: { type: string }
        body:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            title: { type: string, minLength: 1, maxLength: 200, pattern: "\\S" }
            archived: { type: boolean }
    handler: !ref Chat.updateConversation
    inputs:
      conversationId: !cel "request.params.id"
      title: !cel "has(request.body.title) ? dyn(request.body.title) : null"
      archived: !cel "has(request.body.archived) ? dyn(request.body.archived) : null"
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result.conversation"
    catches:
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # Delete a conversation and everything it holds. Refused while its latest turn
  # runs (abort it first); repeating it finishes an interrupted removal.
  - request:
      path: /conversations/{id}
      method: DELETE
      schema:
        params:
          type: object
          required: [id]
          properties:
            id: { type: string }
    handler: !ref Chat.deleteConversation
    inputs:
      conversationId: !cel "request.params.id"
    returns:
      - status: 204
    catches:
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_TURN_IN_PROGRESS'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_IN_PROGRESS
              activeTurnId: !cel "error.data.activeTurnId"
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # Remove turn `from` and every later one, against the `revision` the client
  # last read — what Retry, Edit & resend and Delete from here compose before a
  # fresh POST /chat.
  - request:
      path: /conversations/{id}/turns
      method: DELETE
      schema:
        params:
          type: object
          required: [id]
          properties:
            id: { type: string }
        query:
          type: object
          required: [from, revision]
          properties:
            from: { type: string, description: The first turn to remove. }
            revision: { type: integer, minimum: 0, description: The conversation's revision as the client last read it. }
    handler: !ref Chat.truncateConversation
    inputs:
      conversationId: !cel "request.params.id"
      fromTurnId: !cel "request.query.from"
      revision: !cel "request.query.revision"
    returns:
      - status: 200
        content:
          application/json:
            body:
              removedTurns: !cel "result.removedTurns"
              conversation: !cel "result.conversation"
    catches:
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - when: !cel "error.code == 'ERR_CONVERSATION_ARCHIVED'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_ARCHIVED
      - when: !cel "error.code == 'ERR_TURN_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_NOT_FOUND
      - when: !cel "error.code == 'ERR_TURN_IN_PROGRESS'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_IN_PROGRESS
              activeTurnId: !cel "error.data.activeTurnId"
      - when: !cel "error.code == 'ERR_CONVERSATION_CHANGED'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_CHANGED
              revision: !cel "error.data.revision"
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # A new conversation holding a copy of every turn through `throughTurnId`.
  - request:
      path: /conversations/{id}/branch
      method: POST
      schema:
        params:
          type: object
          required: [id]
          properties:
            id: { type: string }
        body:
          type: object
          additionalProperties: false
          required: [throughTurnId]
          properties:
            throughTurnId: { type: string, description: The last turn the branch copies. }
    handler: !ref Chat.branchConversation
    inputs:
      conversationId: !cel "request.params.id"
      throughTurnId: !cel "request.body.throughTurnId"
    returns:
      - status: 201
        content:
          application/json:
            body: !cel "result.conversation"
    catches:
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - when: !cel "error.code == 'ERR_TURN_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_NOT_FOUND
      - when: !cel "error.code == 'ERR_TURN_IN_PROGRESS'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_TURN_IN_PROGRESS
              activeTurnId: !cel "error.data.activeTurnId"
      - when: !cel "error.code == 'ERR_CONVERSATION_CHANGED'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_CHANGED
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # Attach a file to a conversation: one multipart part named `file`, read as
  # it arrives. The answer is what a later POST /chat names in `attachments`.
  # A body past the route's limit is the server's own 413
  # ERR_REQUEST_BODY_TOO_LARGE; a file past MAX_ATTACHMENT_BYTES inside a
  # smaller body is 413 ERR_ATTACHMENT_TOO_LARGE. A refused upload stores
  # nothing.
  - request:
      path: /conversations/{id}/attachments
      method: POST
      schema:
        params:
          type: object
          required: [id]
          properties:
            id: { type: string }
        body:
          x-telo-type: { name: Telo.Stream, of: Telo.Bytes }
    # The file, plus room for the part's headers and the boundaries around it.
    maxBodyBytes: !cel "int(variables.maxAttachmentBytes) + 65536"
    handler: !ref Chat.storeAttachment
    inputs:
      conversationId: !cel "request.params.id"
      input: !cel "request.body"
      contentType: !cel "'content-type' in request.headers ? request.headers['content-type'] : ''"
    returns:
      - status: 201
        content:
          application/json:
            body: !cel "result.attachment"
    catches:
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - when: !cel "error.code == 'ERR_CONVERSATION_ARCHIVED'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_ARCHIVED
      - when: !cel "error.code == 'ERR_ATTACHMENT_LIMIT'"
        status: 409
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_ATTACHMENT_LIMIT
              max: !cel "error.data.max"
      - when: !cel "error.code == 'ERR_BLOB_TOO_LARGE'"
        status: 413
        content:
          application/json:
            body:
              error: !cel "'The file is larger than ' + string(error.data.maxBytes) + ' bytes, the most one attachment may be.'"
              code: ERR_ATTACHMENT_TOO_LARGE
              maxBytes: !cel "error.data.maxBytes"
      - when: !cel "error.code == 'ERR_ATTACHMENT_MISLABELLED'"
        status: 415
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_ATTACHMENT_MISLABELLED
              mediaType: !cel "error.data.mediaType"
      - when: !cel "error.code == 'ERR_ATTACHMENT_TYPE_NOT_ACCEPTED'"
        status: 415
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_ATTACHMENT_TYPE_NOT_ACCEPTED
              mediaType: !cel "error.data.mediaType"
              accepted: !cel "error.data.accepted"
      # Not multipart, more than one part, or no part named `file`.
      - when: !cel "error.code in ['ERR_ATTACHMENT_MISSING', 'ERR_MULTIPART_MALFORMED', 'ERR_MULTIPART_LIMIT_EXCEEDED']"
        status: 400
        content:
          application/json:
            body:
              error: An upload is a multipart/form-data body holding one part named `file`.
              code: ERR_ATTACHMENT_MISSING
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # An attachment's bytes, for a client drawing the transcript. Always
  # `application/octet-stream`: what the file is — name, media type, size — is
  # on the upload's answer and on the turn's `user-message` record.
  - request:
      path: /conversations/{id}/attachments/{attachmentId}
      method: GET
      schema:
        params:
          type: object
          required: [id, attachmentId]
          properties:
            id: { type: string }
            attachmentId: { type: string }
    handler: !ref Chat.readAttachment
    inputs:
      conversationId: !cel "request.params.id"
      attachmentId: !cel "request.params.attachmentId"
    returns:
      - status: 200
        mode: stream
        content:
          application/octet-stream:
            encoder: { kind: Octet.Encoder }
    catches:
      - when: !cel "error.code == 'ERR_CONVERSATION_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_NOT_FOUND
      - when: !cel "error.code == 'ERR_CONVERSATION_REMOVED'"
        status: 410
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_CONVERSATION_REMOVED
      - when: !cel "error.code == 'ERR_ATTACHMENT_NOT_FOUND'"
        status: 404
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_ATTACHMENT_NOT_FOUND
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: !cel "error.code"
  # Whole-workspace sync. GET returns a content-hash tree studio diffs
  # against its own files; POST applies an explicit write/delete change set;
  # GET /workspace/file returns one file's contents.
  - request:
      path: /workspace
      method: GET
    handler: !ref Chat.treeSnapshot
    inputs:
      # `.telo-agent` is where the agent kept its state before it had a
      # directory of its own; a workspace from then may still hold one, which
      # no client syncs in either direction.
      exclude: [node_modules, .telo, .git, dist, .telo-agent]
    returns:
      - status: 200
        content:
          application/json:
            body:
              files: !cel "result.files"
    catches:
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
  - request:
      path: /workspace
      method: POST
      schema:
        body:
          type: object
          properties:
            write:
              type: array
              items:
                type: object
                required: [path, content]
                properties:
                  path: { type: string }
                  content: { type: string }
                  encoding: { type: string, enum: [utf8, base64] }
            delete:
              type: array
              items: { type: string }
    # Every path is judged before anything is applied: one outside the
    # workspace, or a `delete` entry naming the workspace root or a directory
    # holding the state directory, refuses the whole change set (400). The
    # whole apply is one hold of the workspace lease the agent's file tools
    # and a revert take.
    handler: !ref Chat.syncWorkspace
    inputs:
      write: !cel "has(request.body.write) ? request.body.write : []"
      delete: !cel "has(request.body.delete) ? request.body.delete : []"
    returns:
      - status: 200
        content:
          application/json:
            body:
              written: !cel "result.written"
              deleted: !cel "result.deleted"
    catches:
      - when: !cel "error.code == 'ERR_PATH_OUTSIDE_WORKSPACE'"
        status: 400
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_PATH_OUTSIDE_WORKSPACE
      - when: !cel "error.code == 'ERR_WORKSPACE_BUSY'"
        status: 503
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_WORKSPACE_BUSY
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
  - request:
      path: /workspace/file
      method: GET
      schema:
        query:
          type: object
          required: [path]
          properties:
            path: { type: string }
    handler: !ref Chat.readWorkspaceFile
    inputs:
      path: !cel "request.query.path"
    returns:
      - status: 200
        content:
          application/json:
            body:
              content: !cel "result.content"
              size: !cel "result.size"
    catches:
      - when: !cel "error.code == 'ERR_PATH_OUTSIDE_WORKSPACE'"
        status: 400
        content:
          application/json:
            body:
              error: !cel "error.message"
              code: ERR_PATH_OUTSIDE_WORKSPACE
      - status: 500
        content:
          application/json:
            body:
              error: !cel "error.message"
  # Who this agent is: the application's name and version, the prompt it runs
  # with (the SHA-256 of its primer), whether it requires a token, the
  # conversation features it serves and whether it may run manifests. Guarded
  # like every `api` route.
  - request:
      path: /capabilities
      method: GET
    handler: !ref Chat.promptIdentity
    returns:
      - status: 200
        content:
          application/json:
            body:
              agent:
                name: !cel "module.name"
                version: !cel "module.version"
              prompt:
                id: !cel "result.id"
              auth: !cel "secrets.agentToken == '' ? 'none' : 'bearer'"
              # What a client may offer: `conversations` (the conversation
              # routes, their refusals on POST /chat, export), the truncation
              # and branch routes, a turn's changes and its revert, the
              # `summary` on the records route, and a spent step budget ending
              # in a wrap-up reply, and files attached to a message. A client
              # ignores an entry it does not know.
              features:
                - conversations
                - conversation-truncation
                - conversation-branching
                - turn-changes
                - turn-revert
                - turn-summary
                - turn-conclusion
                - attachments
              manifestRuns: !cel "variables.allowManifestRuns"
              # What an upload may be, so a client refuses a file before sending
              # it: the largest size, how many one message may carry, and the
              # media types taken (`type/*` is every subtype).
              attachments:
                maxBytes: !cel "int(variables.maxAttachmentBytes)"
                maxPerMessage: !cel "Chat.messageAttachmentLimit()"
                mediaTypes: !cel "Chat.attachmentTypes()"
---
# Liveness and readiness, for an orchestrator's probes: never guarded, since a
# probe carries no credential.
kind: Http.Api
metadata: { name: probes }
routes:
  - request:
      path: /health
      method: GET
    returns:
      - status: 200
        content:
          application/json:
            body:
              status: up
  - request:
      path: /ready
      method: GET
    handler: !ref Chat.readiness
    returns:
      - status: 200
        when: !cel "size(result.reasons) == 0"
        content:
          application/json:
            body:
              ready: true
              reasons: []
      - status: 503
        content:
          application/json:
            body:
              ready: false
              reasons: !cel "result.reasons"
---
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
# Behind the ingress proxy: derive request.ip from the rightmost X-Forwarded-For
# hop (the proxy's) so the per-IP guard can't be spoofed by a client-set header.
trustProxy: 1
# Studio is a browser/desktop client on a different origin; allow it to call
# the chat + workspace routes cross-origin. Tighten `origin` to the deployed
# studio origin (`https://studio.telo.run`) in production.
#
# The origin allowlist itself is the guard's: CORS only decides whether a
# browser may READ an answer, so it stays open and the guard refuses.
cors:
  origin: "*"
  methods: [GET, POST, PATCH, DELETE, OPTIONS]
  allowedHeaders: [content-type, idempotency-key, last-event-id, authorization]
mounts:
  - path: /
    mount: !ref api
    guard:
      invoke:
        kind: Run.Sequence
        inputType:
          kind: Telo.JsonSchema
          schema:
            type: object
            additionalProperties: false
            required: [origin, authorization]
            properties:
              # Empty when the request carries no such header.
              origin: { type: string }
              authorization: { type: string, x-telo-sensitive: true }
        steps:
          - name: allowed
            value: !cel "variables.allowedOrigins.split(',').map(o, o.trim()).filter(o, o != '')"
          - name: origin
            if: !cel >-
              inputs.origin != ''
                && !(inputs.origin in steps.allowed.result)
                && !(inputs.origin != 'null' && '*' in steps.allowed.result)
            then:
              - name: refuseOrigin
                throw:
                  code: ERR_ORIGIN_NOT_ALLOWED
                  displayMessage: "Origin {$origin} is not allowed to call this agent."
                  data: { origin: !cel "inputs.origin" }
          # Compared as HMACs keyed by the token, so the comparison's timing
          # says nothing about how much of a guess was right. The scheme is
          # case-insensitive, as RFC 9110 has it.
          - name: token
            if: !cel >-
              secrets.agentToken != ''
                && hmac('sha256', secrets.agentToken,
                     inputs.authorization.lowerAscii().startsWith('bearer ')
                       ? 'Bearer ' + inputs.authorization.substring(7) : inputs.authorization)
                   != hmac('sha256', secrets.agentToken, 'Bearer ' + secrets.agentToken)
            then:
              - name: refuseToken
                throw:
                  code: ERR_UNAUTHENTICATED
                  message: "This agent requires a bearer token: send Authorization: Bearer <token>."
      inputs:
        origin: !cel "'origin' in request.headers ? string(request.headers['origin']) : ''"
        authorization: !cel "'authorization' in request.headers ? string(request.headers['authorization']) : ''"
      catches:
        - when: !cel "error.code == 'ERR_ORIGIN_NOT_ALLOWED'"
          status: 403
          content:
            application/json:
              body:
                error: !cel "error.message"
                code: ERR_ORIGIN_NOT_ALLOWED
        - when: !cel "error.code == 'ERR_UNAUTHENTICATED'"
          status: 401
          headers:
            WWW-Authenticate: Bearer
          content:
            application/json:
              body:
                error: !cel "error.message"
                code: ERR_UNAUTHENTICATED
  # Mount-level `logging: { level: warn }` is deliberately absent: http-server
  # matches a mount's log floor by URL prefix, and a router mounted at the root
  # would quieten every route of the server, not only its own.
  - path: /
    mount: !ref probes
