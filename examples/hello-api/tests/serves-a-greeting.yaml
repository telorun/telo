kind: Telo.Application
metadata:
  name: HelloApiExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/hello-api` — the file a reader copies, unmodified — on a port of
    this test's own, and calls the route its README documents.
imports:
  App: oci://ghcr.io/telorun/app@0.7.2#sha256-29SmNhB_A4l2fGjs5eiV0pYRetQ8-ylNBnPHY_iqgOs
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.1#sha256-yODGL4HqbynR4aaPrcN1I2RIsmNBDn3ciL1uobA8nqA
  Assert: oci://ghcr.io/telorun/assert@0.23.0#sha256-CT1vdPTra9haCPntji5sJG0qG_acnTaeYxg0roNgZGI
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    ports: { http: 8845 }
targets:
  - !ref app
steps:
  - name: greet
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8845/v1/hello?name=World
      method: GET
  - name: verifyGreeting
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.greet.result.status"
        body: !cel "steps.greet.result.body"
      expected: { status: 200, body: { greeting: "Hello World!!", nice: WOW } }

  # The route declares `name` as required, so a request without it is refused
  # before the handler runs.
  - name: missingName
    invoke: { kind: HttpClient.Request, url: http://127.0.0.1:8845/v1/hello, method: GET }
  - name: verifyRejected
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.missingName.result.status"
      expected: 400
