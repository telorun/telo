kind: Telo.Library
metadata:
  name: TesseractLangPol
  version: 0.1.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Recognize Polish text in images, offline: the trained model for reading
    printed Polish (Latin script) with Tesseract optical character recognition.
