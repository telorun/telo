name: Authoring Agent Test

# The production image is built from a release tag by `publish-docker.yml`
# (its build context holds no `modules/`, which the checkout's relative imports
# reach), so a pull request checks the manifests only.
#
# The paths are the ones the check reads, including `modules/**`: the agent
# imports the checkout's modules by relative path.

on:
  pull_request:
    branches: [main, "release/*"]
    paths:
      - "apps/authoring-agent/**"
      - "cli/**"
      - "kernel/**"
      - "analyzer/**"
      - "templating/**"
      - "cel/**"
      - "sdk/**"
      - "modules/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/authoring-agent-test.yml"
  workflow_dispatch:

concurrency:
  group: authoring-agent-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check authoring agent manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Application, as the image runs it: the chat library is checked
      # through the import that reaches it.
      - name: Check authoring agent manifests
        run: pnpm run check apps/authoring-agent/telo.yaml
