kind: Telo.Library
metadata:
  name: SQLite
  version: 0.8.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Storage]
  description: |
    Connects an application to a SQLite database — a file on disk, or an in-memory one
    that lives only as long as the process — with transactional schema changes. The
    database travels with the application, so it suits local development, tests,
    single-node deployments and embedded storage.
  deprecated:
    reason: >-
      Superseded by `oci://ghcr.io/telorun/sqlite`, which carries the same `Connection` kind plus
      declarative schema (`Table`, `Schema`) and reclamation. The prefix restated
      the abstract this module implements, which `extends` already records, and it
      stops being true now that the module owns SQLite-specific surface that is
      not a `sql` kind. Change the `imports:` entry to the new ref; the alias and
      every `kind:` spelling are unchanged.
    replacedBy: oci://ghcr.io/telorun/sqlite
imports:
  Sql: ../sql
exports:
  kinds:
    - Connection
---
kind: Telo.Definition
metadata:
  name: Connection
  description: >-
    A connection to a SQLite database held in a file or entirely in memory, opened on
    start-up and shared by every operation that references it.
capability: Telo.Provider
extends: Sql.Connection
controllers:
  - pkg:npm/@telorun/sql-sqlite@0.8.0?local_path=./nodejs#connection
schema:
  type: object
  examples:
    - file: ./data.db
    - file: ":memory:"
  properties:
    file:
      title: File
      type: string
      description: >-
        Path to the SQLite database file (e.g. `./data.db`). The parent
        directory is created if missing. Omit, or use `:memory:`, for an
        in-memory database.
