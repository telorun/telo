name: Start release candidates

# Creates `release/<major>.<minor>` at the main commit it is dispatched on and
# dispatches the branch's Publish, which opens the first release PR (candidates).
# Main is not changed: the branch carries the pending fragments, and main
# learns what shipped only through the record PR of each release (record-release.yml).
# The cut refuses while main does not record the live branch's newest release tag.
# Publish final release dispatched at main (finish-release.yml) makes the same checks
# and the same branch, but versions it straight to the final.
#
# This file lives on main only: GitHub dispatches a workflow present on the default
# branch, and the branch it creates carries its own Publish.

on:
  workflow_dispatch:

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Cut
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release main would cut is the minor its release plan reaches for the
      # telo line (`telo release status`, the Node build of the CLI), so the
      # workspace is built.
      - name: Build workspace
        run: pnpm -r --if-present build

      # A linking crate's cargo layer reads its closure across every platform
      # (`cargo metadata --locked --offline`), so every platform's crates are fetched first.
      - name: Fetch every platform's crates
        run: cargo fetch --locked

      # Under bun: whether main records the live branch's newest tag is the record's
      # own check, which reads the analyzer from source.
      - name: Check
        id: check
        run: pnpm exec bun scripts/release-branch.mjs cut-check --ref "$GITHUB_REF_NAME"

      # A run still in progress may yet tag a release the check above could not see.
      - name: Refuse while a Publish run of the live branch is in progress
        if: steps.check.outputs.live != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE: ${{ steps.check.outputs.live }}
        run: |
          n=$(gh run list --workflow publish.yml --branch "$LIVE" --json status --jq '[.[]|select(.status!="completed")]|length')
          if [ "$n" != "0" ]; then
            echo "::error::a Publish run of $LIVE is in progress; dispatch Start release candidates after it completes."
            exit 1
          fi

      # TELO_BOT_TOKEN creates the ref and dispatches: both made with the default token
      # would trigger nothing, and the rulesets let only the release workflows create
      # `release/*` refs. Only these two steps see it.
      - name: Create the branch
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ steps.check.outputs.release }}
        run: node scripts/release-branch.mjs create-branch --branch "release/$RELEASE" --sha "$GITHUB_SHA"

      # The new branch's own Publish opens its first release PR.
      - name: Dispatch Publish on the branch
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ steps.check.outputs.release }}
        run: gh workflow run publish.yml --ref "release/$RELEASE"
