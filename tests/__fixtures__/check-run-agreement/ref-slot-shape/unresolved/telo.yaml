# Invokes the library's `missing`. Its entry-scoped check is silent about the
# library's resources, so the reference the resource names is refused at run.
kind: Telo.Application
metadata:
  name: RefSlotShapeUnresolvedApp
  version: 1.0.0
imports:
  Lib: ./lib
targets:
  - name: probe
    invoke: !ref Lib.missing
