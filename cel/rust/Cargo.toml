[package]
name = "telorun-cel"
version = "0.114.0"
license = "MIT"
edition = "2021"
publish = false
description = "The CEL language for Rust: the front end — reads an expression into the ranged syntax tree, resolves namespaced calls, writes a tree back as source and answers the two tree queries. One path dependency, no host vocabulary."

[lib]
crate-type = ["rlib"]

[dependencies]
telorun-cel-value = { path = "value" }

[dev-dependencies]
serde_json = "=1.0.149"
