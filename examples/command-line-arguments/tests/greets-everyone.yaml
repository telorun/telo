kind: Telo.Application
metadata:
  name: CommandLineArgumentsExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/command-line-arguments` with its inputs supplied by name — the
    way a parent application starts it, and the source that wins over the command
    line — and checks what it printed.
imports:
  App: oci://ghcr.io/telorun/app@0.7.2#sha256-29SmNhB_A4l2fGjs5eiV0pYRetQ8-ylNBnPHY_iqgOs
  Channel: oci://ghcr.io/telorun/channel@0.4.1#sha256-0AdimfyKquQp_v2xG3qY5IR4DnAOrI8GH1AV8fFa54I
  Assert: oci://ghcr.io/telorun/assert@0.23.0#sha256-CT1vdPTra9haCPntji5sJG0qG_acnTaeYxg0roNgZGI
targets:
  - !ref app
  - !ref test
---
kind: App.Instance
metadata: { name: app }
source: ../telo.yaml
awaitStart: false
variables:
  name: Ada
  also: [Grace, Linus]
  greeting: Hi
  shout: true
---
kind: Telo.Sequence
metadata: { name: test }
steps:
  - name: printed
    invoke:
      kind: Channel.ReadUntil
      channel: !ref app
      timeout: "10s"
    inputs: { until: "HI, LINUS!\n" }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.printed.result.text"
      expected: "HI, ADA!\nHI, GRACE!\nHI, LINUS!\n"
