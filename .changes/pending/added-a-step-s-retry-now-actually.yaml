modules:
  modules/run: Added
body: A step's `retry:` now actually retries. It was declared on four kinds and honoured
  by nothing — passed to `ctx.invoke` on one of the step leaf's four dispatch branches,
  and read by no kernel path, so a `!ref` step (the dominant shape) silently got one
  attempt. It is implemented in the leaf, where every branch passes through, and takes
  `Http.Request`'s field names — attempts, initialDelay, factor, maxDelay, jitter —
  because two spellings of backoff in one standard library make the word change meaning
  with where it is written. `delay` is kept as the older duration-string spelling, and a
  malformed one now fails `telo check` against a declared pattern instead of silently
  becoming a different backoff. A domain failure is retried; a cancellation and a
  contract violation (ERR_INPUT_INVALID and friends) are not, the latter because it is a
  property of the manifest and fails identically on every attempt. Every field declares
  its default in the schema, so the editor and a second-language step leaf read the same
  numbers rather than re-deriving them. The wait between attempts is cancellable —
  Sequence, Iteration, Loop and Projection now forward the InvokeContext they are handed
  into the step leaf, where a backoff is the one interval the kernel's own pre-dispatch
  cancellation gate cannot see. The failure that caused the wait rides on the
  cancellation as `data.pendingFailure`, so stopping mid-backoff does not lose the error
  being retried. A step's shape is now the kernel's own dispatch site
  (`telo://manifest#/$defs/InvokeStep`) rather than four hand-copied schemas, which is
  what removed 280 lines from this manifest and made `retry:` mean one thing everywhere
  it is written.
