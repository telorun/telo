kind: Telo.Application
metadata:
  name: BodyResourcesOutsideApp
  version: 1.0.0
imports:
  Run: ../../../../modules/run
  Config: ../../../../modules/config
  Kinds: ../scope-members/kinds
targets:
  - !ref pipeline
---
kind: Telo.Definition
metadata: { name: Pipeline }
capability: Telo.Runnable
schema:
  type: object
  properties:
    jobs:
      type: object
      additionalProperties: { type: object }
resources:
  - !for-each
    metadata: { name: counters }
    in: !cel "self.jobs"
    emit:
      kind: Kinds.Counter
  - kind: Kinds.Counter
    metadata: { name: tally }
  - kind: Run.Sequence
    metadata: { name: main }
    steps:
      - name: noop
        value: 1
run: !ref main
---
kind: Self.Pipeline
metadata: { name: pipeline }
jobs:
  alpha: {}
---
kind: Run.Sequence
metadata: { name: outside }
steps:
  - name: read
    value: !cel "resources.counters"
