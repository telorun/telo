# A layered node table whose column is renamed from itself.
# The table alone, so booting it reaches no database.
kind: Telo.Library
metadata:
  name: ColumnRenameFromSelf
imports:
  Layers: ../../../..
---
kind: Layers.NodeTable
metadata: { name: people }
table: people
key: id
columns:
  id: { type: text, nullable: false }
  name: { type: text, renamedFrom: name }
