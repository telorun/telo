kind: Telo.Application
metadata:
  name: HubE2EDiscoveryRoutes
  version: 1.0.0
  description: |
    End-to-end tests for the hub's discovery HTTP surface, run against a live
    hub at http://localhost:8040 that has tracked the seeded refs
    (the `oci://ghcr.io/telorun/*` set in docker-compose `SEED_REFS`, which is
    what a fresh database contains — assert only on those, never on a ref some
    other test registers). Covers /health, per-resource and per-module
    search, /refs typeahead, and /module/versions including its 404 path.
imports:
  HttpClient: oci://ghcr.io/telorun/http-client@0.16.0#sha256-Jca84EaplnO_x7MbGic28qfh7qqAUGwgeC77eXBUSoQ
  Run: oci://ghcr.io/telorun/run@0.19.0#sha256-PHumsTXpwnEAJD2nswW7ry-L0W43-fpkpwLjw7qUEHo
  Assert: oci://ghcr.io/telorun/assert@0.14.0#sha256-dYQWezypcu4qCCS1v6h5LL30w0utrr7srTavsMYj7rU
targets:
  - !ref Health
  - !ref SearchResources_FindsSeededKind
  - !ref SearchResources_SemanticMatch
  - !ref SearchModules_GroupsByModule
  - !ref Refs_FuzzyMatchesSeededRef
  - !ref ModuleVersions_ListsSeededVersions
  - !ref ModuleVersions_UntrackedReturns404
  - !ref Categories_ListsDeclaredFacet
  - !ref SearchModules_FiltersByCategory
  - !ref Implementations_ListsBackendsOfContract
---
kind: Run.Sequence
metadata: { name: Health }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitHealth }
      url: http://localhost:8040/health
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertHealth }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              status: { const: ok }
            required: [status]
        required: [status, body]
---
# The seeded timer module defines Timer.Delay; an intent-shaped lexical
# query on "delay" must surface it as a kind hit carrying the exact location
# ref + version (the shape search_resources / the editor build on).
kind: Run.Sequence
metadata: { name: SearchResources_FindsSeededKind }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitSearchResources }
      url: http://localhost:8040/search/resources?q=delay
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertSearchResources }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              query: { const: delay }
              hits:
                type: array
                items:
                  type: object
                  properties:
                    kind: { type: string }
                    capability: { type: string }
                    description: { type: string }
                    module:
                      type: object
                      properties:
                        ref: { type: string }
                        version: { type: string }
                        description: { type: string }
                        repository: { type: string }
                        license: { type: string }
                      required: [ref, version, description, repository, license]
                    score: { type: number }
                  required: [kind, capability, module, score]
                contains:
                  type: object
                  properties:
                    kind: { const: Delay }
                    module:
                      type: object
                      properties:
                        ref: { const: "oci://ghcr.io/telorun/timer" }
                      required: [ref]
                  required: [kind, module]
            required: [query, hits]
        required: [status, body]
---
# The module-first projection groups the same hits and lists every exported
# kind, so a module card needs no second manifest fetch.
kind: Run.Sequence
metadata: { name: SearchModules_GroupsByModule }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitSearchModules }
      url: http://localhost:8040/search/modules?q=console
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertSearchModules }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              hits:
                type: array
                contains:
                  type: object
                  properties:
                    module:
                      type: object
                      properties:
                        ref: { const: "oci://ghcr.io/telorun/console" }
                        repository: { type: string }
                        license: { type: string }
                      required: [ref, repository, license]
                    matchedKinds:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        properties:
                          kind: { type: string }
                          capability: { type: string }
                          description: { type: string }
                          score: { type: number }
                        required: [kind, capability, score]
                    exportedKinds:
                      type: array
                      contains: { const: WriteLine }
                    # A library's public surface is two lists, and console is
                    # the seeded module that has both: a kinds-only index would
                    # miss `writeLine`, a ready-made instance an importer
                    # references as `!ref <Alias>.writeLine`.
                    exportedResources:
                      type: array
                      contains: { const: writeLine }
                  required: [module, matchedKinds, exportedKinds, exportedResources]
            required: [hits]
        required: [status, body]
---
# Lexical typeahead: a partial (even typo-adjacent) token must complete to the
# registered ref, deduped to the latest tracked version.
kind: Run.Sequence
metadata: { name: Refs_FuzzyMatchesSeededRef }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitRefs }
      url: http://localhost:8040/refs?q=consol
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertRefs }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              refs:
                type: array
                contains:
                  type: object
                  properties:
                    ref: { const: "oci://ghcr.io/telorun/console" }
                    latestVersion: { type: string, minLength: 1 }
                    description: { type: string }
                    repository: { type: string }
                    license: { type: string }
                  required: [ref, latestVersion, description, repository, license]
            required: [refs]
        required: [status, body]
---
kind: Run.Sequence
metadata: { name: ModuleVersions_ListsSeededVersions }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitModuleVersions }
      url: http://localhost:8040/module/versions?ref=oci%3A%2F%2Fghcr.io%2Ftelorun%2Ftimer
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertModuleVersions }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              ref: { const: "oci://ghcr.io/telorun/timer" }
              # Not pinned to a version number: these are published modules
              # whose newest release moves, and what this route owes a caller
              # is a non-empty newest-first list for the ref it echoes back.
              versions:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
            required: [ref, versions]
        required: [status, body]
---
kind: Run.Sequence
metadata: { name: ModuleVersions_UntrackedReturns404 }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitUntrackedVersions }
      url: http://localhost:8040/module/versions?ref=e2e/nonexistent-module
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertUntrackedVersions }
      schema:
        type: object
        properties:
          status: { const: 404 }
          body:
            type: object
            properties:
              error: { const: Module not tracked }
            required: [error]
        required: [status, body]
---
# Semantic ranking (Phase 2): an intent-shaped query with NO substring or
# lexical overlap with the kind ("delay") must still surface Timer.Delay via
# the vector arm. This can only pass if ingest embedded the seeded kinds and the
# RRF query fuses the vector hits — it fails on lexical-only ranking.
kind: Run.Sequence
metadata: { name: SearchResources_SemanticMatch }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitSemanticSearch }
      url: "http://localhost:8040/search/resources?q=pause%20execution%20for%20a%20while"
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertSemanticSearch }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              hits:
                type: array
                minItems: 1
                contains:
                  type: object
                  properties:
                    kind: { const: Delay }
                    module:
                      type: object
                      properties:
                        ref: { const: "oci://ghcr.io/telorun/timer" }
                      required: [ref]
                  required: [kind, module]
            required: [hits]
        required: [status, body]
---
# The browse axes. Shape-only: which slugs exist depends on what the seeded
# modules declare, and the seed set is deliberately small — what must hold is
# that the facet query, the array-containment filter, and the contract join all
# execute and project the documented shape.
kind: Run.Sequence
metadata: { name: Categories_ListsDeclaredFacet }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitCategories }
      url: http://localhost:8040/categories
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertCategories }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              categories:
                type: array
                items:
                  type: object
                  properties:
                    # `category` is the derived slug (what a filter takes),
                    # `label` the authored display text.
                    category: { type: string }
                    label: { type: string }
                    modules: { type: integer }
                  required: [category, label, modules]
            required: [categories]
        required: [status, body]
---
# Browse is the same endpoint with a facet filter and no query: the response
# must carry the pagination contract (`total`) so a caller can tell a complete
# listing from a truncated one.
kind: Run.Sequence
metadata: { name: SearchModules_FiltersByCategory }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitBrowseByCategory }
      url: "http://localhost:8040/search/modules?q=&category=scheduling&limit=50"
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertBrowseByCategory }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              query: { const: "" }
              category: { const: scheduling }
              total: { type: integer }
              hits:
                type: array
                items:
                  type: object
                  properties:
                    module:
                      type: object
                      properties:
                        ref: { type: string }
                        version: { type: string }
                        # Slug matches the filter; label is whatever the author
                        # wrote (`Scheduling`), which is what a chip prints.
                        categories:
                          type: array
                          items:
                            type: object
                            properties:
                              slug: { type: string }
                              label: { type: string }
                            required: [slug, label]
                          contains:
                            type: object
                            properties:
                              slug: { const: scheduling }
                            required: [slug]
                      required: [ref, version, categories]
                  required: [module]
            required: [query, category, total, hits]
        required: [status, body]
---
kind: Run.Sequence
metadata: { name: Implementations_ListsBackendsOfContract }
steps:
  - name: hit
    invoke:
      kind: HttpClient.Request
      metadata: { name: HitImplementations }
      url: http://localhost:8040/implementations?ref=oci%3A%2F%2Fghcr.io%2Ftelorun%2Fkv-store&kind=Store
      method: GET
  - name: assert
    inputs:
      status: !cel "steps.hit.result.status"
      body: !cel "steps.hit.result.body"
    invoke:
      kind: Assert.Schema
      metadata: { name: AssertImplementations }
      schema:
        type: object
        properties:
          status: { const: 200 }
          body:
            type: object
            properties:
              extends:
                type: object
                properties:
                  ref: { const: "oci://ghcr.io/telorun/kv-store" }
                  kind: { const: Store }
                required: [ref, kind]
              # The seeded redis and memory backends both `extends` this
              # abstract from their own modules, which is the whole point of
              # the derived axis: the abstract's module never learns who
              # implements it, the resolved (ref, kind) join does.
              implementations:
                type: array
                minItems: 2
                items:
                  type: object
                  properties:
                    ref: { type: string }
                    kind: { const: Store }
                    capability: { type: string }
                  required: [ref, kind, capability]
                allOf:
                  - contains:
                      type: object
                      properties:
                        ref: { const: "oci://ghcr.io/telorun/kv-store-redis" }
                      required: [ref]
                  - contains:
                      type: object
                      properties:
                        ref: { const: "oci://ghcr.io/telorun/kv-store-memory" }
                      required: [ref]
            required: [extends, implementations]
        required: [status, body]
