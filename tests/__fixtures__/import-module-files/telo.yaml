# An import hands its library files that ship with the importing module, at an
# `imports:` entry, a module-level `Telo.Import` and a scoped import, and from
# a library importing a library: each is anchored at the importer.
kind: Telo.Application
metadata: { name: ImportModuleFiles }
imports:
  Assert: ../../../modules/assert
  Lib:
    source: ./lib
    variables: { root: !module-path ./a, note: !include-text ./note.txt }
  Outer: ./outer
  Stored:
    source: ./stored
    needs: { store: { path: !module-path ./a } }
targets: [!ref check]
---
kind: Telo.Import
metadata: { name: Top }
source: ./lib
variables: { root: !module-path ./a, note: !include-text ./note.txt }
---
kind: Telo.Sequence
metadata: { name: check }
with:
  - kind: Telo.Import
    metadata: { name: Inner }
    source: ./lib
    variables: { root: !module-path ./a, note: !include-text ./note.txt }
steps:
  - { name: here, invoke: !ref here }
  - { name: outerHere, invoke: !ref Outer.here }
  - { name: lib, invoke: !ref Lib.read }
  - { name: top, invoke: !ref Top.read }
  - { name: inner, invoke: !ref Inner.read }
  - { name: outer, invoke: !ref Outer.read }
  - { name: stored, invoke: !ref Stored.read }
  - name: same
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "[steps.lib.result, steps.top.result, steps.inner.result, steps.outer.result, steps.stored.result]"
      expected: !cel |
        [
          {'root': steps.here.result, 'note': 'Shipped beside the importer.'},
          {'root': steps.here.result, 'note': 'Shipped beside the importer.'},
          {'root': steps.here.result, 'note': 'Shipped beside the importer.'},
          {'root': steps.outerHere.result, 'note': 'Shipped beside the outer library.'},
          steps.here.result
        ]
---
# The importer's own `./a`, resolved as a resource field resolves it.
kind: Telo.Value
metadata: { name: here }
value: !module-path ./a
