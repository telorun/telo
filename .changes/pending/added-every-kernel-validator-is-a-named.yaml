units:
  kernel: Added
body: "Every kernel validator is a named configuration of the analyzer's factory:
  `ctx.validateSchema` is `schema-validate` (the first error, undeclared members
  removed, no defaults) and observed state is validated with the formats and Telo
  keywords it lacked. Breaking: a schema pattern is RE2 at creation and dispatch as at
  `telo check` — a pattern RE2 cannot read is refused at load, and `ctx.validateSchema`
  no longer runs in strict mode — the validator cache is keyed on the `re2js` version as
  well, so every validator cached before is compiled again, and the BigInt view presents
  an instance value as an object holding no members."
