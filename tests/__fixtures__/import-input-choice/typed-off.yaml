# A library's host-path input chosen per option at an `imports:` entry and at a
# scoped import: the library is handed the taken branch's value — the importer's
# own `./a` or a variable declared a host path.
kind: Telo.Application
metadata: { name: ImportInputChoiceTyped }
variables:
  flag1: { env: FLAG_1, type: boolean, default: false }
  hostDir: { env: HOST_DIR, type: string, x-telo-type: Telo.HostPath, default: ./host }
imports:
  Assert: ../../../modules/assert
  Lib:
    source: ./lib
    variables:
      root: !if { if: !cel "variables.flag1", then: !module-path ./a, else: !cel "variables.hostDir" }
targets: [!ref check]
---
kind: Telo.Sequence
metadata: { name: check }
with:
  - kind: Telo.Import
    metadata: { name: Inner }
    source: ./lib
    variables:
      root: !if { if: !cel "variables.flag1", then: !module-path ./a, else: !cel "variables.hostDir" }
steps:
  - { name: here, invoke: !ref here }
  - { name: top, invoke: !ref Lib.root }
  - { name: inner, invoke: !ref Inner.root }
  - name: same
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "[steps.top.result, steps.inner.result]"
      expected: !cel "[string(variables.hostDir), string(variables.hostDir)]"
---
# The importer's own `./a`, resolved as a resource field resolves it.
kind: Telo.Value
metadata: { name: here }
value: !module-path ./a
