# A library's host-path input supplied from an importer variable declared a
# plain string: refused at the `imports:` entry and at a scoped import whatever
# the choice, as is a relative literal — and at a scoped import a choice writes,
# where that choice is taken. An Application variable typed by a named shape is
# read through it; one naming no shape is only refused.
kind: Telo.Application
metadata: { name: HostPathImportChoice }
variables:
  flag1: { env: FLAG_1, type: boolean, default: false }
  plainDir: { env: PLAIN_DIR, type: string, default: /srv/plain }
  cfg: { env: CFG, type: object, $ref: "telo://Self/Config", default: { dir: /srv } }
  lost: { env: LOST, type: object, $ref: "telo://Self/Missing", default: {} }
imports:
  Lib:
    source: ./host-path-import-lib
    variables:
      root: !cel "variables.plainDir"
      extra: relative/dir
---
kind: Telo.JsonSchema
metadata: { name: Config }
schema: { type: object, properties: { dir: { type: string } } }
---
kind: Telo.Sequence
metadata: { name: scoped }
with:
  - kind: Telo.Import
    metadata: { name: Inner }
    source: ./host-path-import-lib
    variables:
      root: !cel "variables.plainDir"
      extra: relative/dir
steps:
  - name: sum
    value: !cel "variables.cfg.dir + 1"
  - name: lostRead
    value: !cel "variables.lost.anything"
--- !if
metadata: { name: chosen }
if: !cel "variables.flag1"
then:
  kind: Telo.Sequence
  with:
    - kind: Telo.Import
      metadata: { name: Chosen }
      source: ./host-path-import-lib
      variables:
        root: !cel "variables.plainDir"
        extra: relative/dir
  steps: [{ name: noop, value: 1 }]
--- !if
metadata: { name: shown }
if: !cel "variables.flag1"
then: { kind: Telo.Value, value: plain }
else: { kind: Telo.Value, value: host }
