# A handler reading the records of an agent stream, typed by the exported part
# shape: its declared fields check clean.
kind: Telo.Application
metadata:
  name: AgentStreamPartTyped
  version: 1.0.0
imports:
  Ai: ../../../
  Run: ../../../../run
---
kind: Run.Sequence
metadata: { name: persistTurn }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [records]
    properties:
      records:
        type: array
        items: !ref Ai.AgentStreamPart
steps:
  - name: firstUsage
    value: !cel "inputs.records[0].usage"
  - name: firstArgumentDelta
    value:
      call: !cel "inputs.records[0].toolCallId"
      tool: !cel "inputs.records[0].toolName"
  - name: firstRecord
    value:
      role: !cel "inputs.records[0].message.role"
      interrupt: !cel "inputs.records[0].interrupt"
      decision: !cel "inputs.records[0].approvalDecision.decision"
      denied: !cel "inputs.records[0].toolResult.denied"
