  - { text: "No", translation: "아니요" }
  - { text: None, translation: "없음" }
  - { text: Any, translation: "모두" }
  - { text: Select…, translation: "선택…" }
  - { text: Choose…, translation: "고르기…" }
  - { text: More, translation: "더 보기" }
  - { text: Menu, translation: "메뉴" }
  - { text: Site, translation: "사이트" }
  - { text: Collapse navigation, translation: "내비게이션 접기" }
  - { text: Expand navigation, translation: "내비게이션 펼치기" }
  - { text: "Search {$label}", translation: "{$label} 검색" }
  - { text: "Remove {$label}", translation: "{$label} 제거" }
  - { text: "Clear {$label}", translation: "{$label} 지우기" }
  - { text: Add filter, translation: "필터 추가" }
