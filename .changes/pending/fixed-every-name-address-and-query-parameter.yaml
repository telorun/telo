units:
  modules/ui: Fixed
body: "Every name, address and query-parameter pattern is written in RE2, so the module
  loads where schema patterns are RE2: an app-relative reference's control characters
  are `\\x00-\\x1f\\x7f`, a reserved word or a `_telo` prefix is excluded by `not:`
  beside a positive pattern, and a reserved query-parameter name by a
  `patternProperties` key whose schema is `false`. Each accepts the values it accepted
  before, but an excluded value now reads `matches a shape that is not allowed here` and
  an excluded query-parameter name `<name> is not allowed here` at the name itself. A
  page path declares `format: path-template`: a variable named twice reads `/path must
  be a path-template: '{id}' appears twice — each variable names one segment at offset
  <n> of \"<path>\"`, and a variable after `?` or `#` is now refused too."
