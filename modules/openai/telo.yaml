kind: Telo.Library
metadata:
  name: OpenAI
  version: 0.3.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: >-
    Language, image and embedding models for OpenAI and any OpenAI-compatible endpoint
    — Azure OpenAI, gateways, self-hosted servers — over the chat completions,
    responses, images and embeddings HTTP APIs with no vendor SDK. Supplies buffered
    completions, token streaming, tool calling, reasoning that survives a tool loop,
    prompt-to-picture generation and editing, and text vectors, to whichever operation
    holds the model.
imports:
  Ai: ../ai
  Embedding: ../embedding
  Http: ../http-client
exports:
  kinds:
    - ChatModel
    - ChatModelStream
    - Model
    - ModelStream
    - ResponsesModel
    - ResponsesModelStream
    - ImageModel
    - EmbeddingModel
---
kind: Telo.Definition
metadata:
  name: ChatModel
  description: >-
    A chat model called through the chat completions API, served by OpenAI or any
    OpenAI-compatible endpoint: model id, the request every call goes through — whose
    client carries the base URL and the credential — and default request options that
    per-call overrides win over. The portable choice; almost every compatible endpoint
    serves this API and not the responses one.
capability: Telo.Invocable
extends: Ai.Model
controllers:
  - pkg:telo/local/js?path=./nodejs/openai.mjs&local_path=./nodejs/src/index.ts#ChatModelController
throws:
  codes:
    ERR_OPENAI_REQUEST_FAILED:
      description: >-
        The endpoint refused the request or failed mid-stream. Carries the provider's
        own message and the HTTP status, so a caller reads why rather than a status
        line.
    ERR_INVALID_INPUT:
      description: >-
        A content part that cannot be sent on this dialect — a `reasoning` or
        `citation` part is produced by a model, not submitted to one.
    ERR_OPENAI_INVALID_TOOL_ARGUMENTS:
      description: >-
        The model asked for a tool with arguments that are not a JSON object. Raised
        rather than passed on as empty arguments, which would run the tool with a
        different request than the model made.
    ERR_INVALID_REFERENCE:
      description: >-
        `request` did not resolve to a live Http.Request. A reference slot on a
        resource declared inside a `with:` scope is not an injection site, so declare
        the request at module level.
schema:
  type: object
  properties:
    model:
      title: Model ID
      description: OpenAI model identifier passed to the API (e.g. gpt-4o, gpt-4o-mini).
      type: string
      # Explicit because these kinds are Telo.Invocable. A Telo.Provider's
      # fields are implicitly compile-eval; that rule stopped applying when the
      # capability changed, and without this `model: !cel "variables.model"` is
      # read as a literal.
      x-telo-eval: compile
    request:
      title: Request
      description: >-
        The HTTP request every call is made through. Its client carries the base URL
        and the credential, so an account is declared once and the 401
        re-acquire-and-retry is inherited rather than re-implemented here. Point it at
        a client whose `baseUrl` is the endpoint (`https://api.openai.com/v1`, or a
        gateway's).
      x-telo-ref:
        kind: Http.Request
        use: call
    options:
      title: Options
      description: >-
        Model-level defaults as camelCase OpenAI request params (temperature,
        maxTokens, topP, …), normalized to snake_case and merged into the request
        body. Merged beneath Ai.Text.options / Ai.TextStream.options and per-call
        inputs.options; downstream wins. The bag is open, so a name this API does not
        take is sent and refused by the endpoint rather than caught here — note that
        the token cap is `maxTokens` on this API and `maxOutputTokens` on the
        responses kinds.
      type: object
      additionalProperties: true
      x-telo-eval: compile
  required: [ model, request ]
  additionalProperties: false
  examples:
    - model: gpt-4o-mini
      request: !ref openaiRequest
    - model: gpt-4o
      request: !ref openaiRequest
      options:
        temperature: 0.2
        maxTokens: 512
---
