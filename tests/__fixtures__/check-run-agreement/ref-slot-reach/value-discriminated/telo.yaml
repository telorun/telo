# Invokes the library's `discriminated`. Its entry-scoped check is silent about
# the library's resources, so the string at the reference slot is refused at run.
kind: Telo.Application
metadata:
  name: RefSlotReachValueDiscriminatedApp
  version: 1.0.0
imports:
  Lib: ./lib
targets:
  - name: probe
    invoke: !ref Lib.discriminated
