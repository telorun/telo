kind: Telo.Application
metadata:
  name: GraphLayersDraftsPostgresLayeredSuite
  version: 1.0.0
  description: |
    The layered graph suite against a real PostgreSQL, over seven drafted stores
    used outside any draft: every behaviour the base level of the contract
    promises holds over the published state of a drafted layer.

    NEEDS A LIVE POSTGRES, which is why it is under `tests/integration/`.
include:
  - ./__fixtures__/suite-model.yaml
imports:
  Suite:
    source: ../../../graph-layers/tests/__fixtures__/layered-suite
    resources:
      base: !ref base
      middle: !ref middle
      side: !ref side
      top: !ref top
      left: !ref left
      right: !ref right
      apex: !ref apex
      person: !ref person
      document: !ref document
      knows: !ref knows
      authored: !ref authored
      refreshStacks: !ref refreshStacks
  Sql: ../../../sql
  Postgres: ../../../postgres
  Layers: ../..
  Run: ../../../run
variables:
  dbHost: { env: DB_HOST, type: string, default: localhost }
  dbPort: { env: DB_PORT, type: integer, default: 5432 }
  dbUser: { env: DB_USER, type: string, default: postgres }
  dbPassword: { env: DB_PASSWORD, type: string, default: postgres }
  dbName: { env: DB_NAME, type: string, default: postgres }
targets:
  - !ref reset
  - !ref appSchema
  - !ref Suite.overlay
  - !ref Suite.writes
  - !ref Suite.relationships
  - !ref Suite.traversals
  - !ref Suite.deletions
  - !ref Suite.retractions
  - !ref Suite.diamond
  - !ref Suite.paging
  - !ref Suite.defaults
---
# The suite must start empty — the ledger included, which lives in the same
# namespace, or a previous run's declaration would decide what this one plans.
kind: Run.Sequence
metadata: { name: reset }
steps:
  - name: drop
    invoke:
      kind: Sql.Command
      connection: !ref db
    inputs:
      sql: DROP SCHEMA IF EXISTS graph_drafts_layered_suite CASCADE
---
kind: Postgres.Schema
metadata: { name: appSchema }
connection: !ref db
schema: graph_drafts_layered_suite
ledger: graph_drafts_layered_suite
tables:
  - !ref people
  - !ref documents
  - !ref knowsTable
  - !ref authoredTable
  - !ref graphLayers
  - !ref graphDrafts
---
# A drafted store reads its bases live, so there is nothing to bring up to date.
kind: Run.Sequence
metadata: { name: refreshStacks }
steps:
  - name: nothing
    value: !cel "true"
