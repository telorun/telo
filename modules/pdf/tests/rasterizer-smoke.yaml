kind: Telo.Application
metadata:
  name: PdfRasterizerSmokeTest
  version: 1.0.0
  description: |
    Smoke test for Pdf.Rasterizer — renders page 1 of the hermetic two-page
    fixture PDF at scale 2 and asserts the rendered dimensions (300×200 pt →
    600×400 px), the page count, the reported scale, and the PNG magic bytes.
    Further sequences assert that out-of-range pages — above the page count
    and below 1 — raise ERR_INVALID_INPUT.
imports:
  Pdf: ../
  Fixture: ./__fixtures__/sample-form.yaml
  JS: ../../javascript
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testRenderPage
  - !ref testJpegFormat
  - !ref testPageOutOfRange
  - !ref testPageBelowOne
---
kind: Pdf.Rasterizer
metadata: { name: render }
scale: 2
---
kind: JS.Script
metadata: { name: detectFormat }
code: |
  async function main(input) {
    const b = input.image;
    const png = b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47;
    const jpeg = b[0] === 0xff && b[1] === 0xd8;
    return { magic: png ? "png" : jpeg ? "jpeg" : "other" };
  }
---
kind: Run.Sequence
metadata: { name: testRenderPage }
steps:
  - name: fixture
    invoke: !ref Fixture.sampleFormPdf
  - name: render
    inputs:
      data: "${{ steps.fixture.result.data }}"
      page: 1
    invoke: !ref render
  - name: assertDimensions
    inputs:
      width: "${{ steps.render.result.width }}"
      height: "${{ steps.render.result.height }}"
      pageCount: "${{ steps.render.result.pageCount }}"
      scale: "${{ steps.render.result.scale }}"
      mediaType: "${{ steps.render.result.mediaType }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          width: { const: 600 }
          height: { const: 400 }
          pageCount: { const: 2 }
          scale: { const: 2 }
          mediaType: { const: image/png }
        required: [ width, height, pageCount, scale, mediaType ]
  - name: detect
    inputs:
      image: "${{ steps.render.result.image }}"
    invoke: !ref detectFormat
  - name: assertPng
    inputs:
      magic: "${{ steps.detect.result.magic }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          magic: { const: png }
        required: [ magic ]
---
kind: Run.Sequence
metadata: { name: testJpegFormat }
steps:
  - name: fixture
    invoke: !ref Fixture.sampleFormPdf
  - name: render
    inputs:
      data: "${{ steps.fixture.result.data }}"
      page: 1
      format: jpeg
      quality: 70
    invoke: !ref render
  - name: detect
    inputs:
      image: "${{ steps.render.result.image }}"
    invoke: !ref detectFormat
  - name: assertJpeg
    inputs:
      mediaType: "${{ steps.render.result.mediaType }}"
      magic: "${{ steps.detect.result.magic }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          mediaType: { const: image/jpeg }
          magic: { const: jpeg }
        required: [ mediaType, magic ]
---
kind: Run.Sequence
metadata: { name: testPageOutOfRange }
steps:
  - name: fixture
    invoke: !ref Fixture.sampleFormPdf
  - name: tryRender
    try:
      - name: render
        inputs:
          data: "${{ steps.fixture.result.data }}"
          page: 9
        invoke: !ref render
    catch:
      - name: caught
        inputs:
          code: "${{ error.code }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_INVALID_INPUT }
            required: [ code ]
---
kind: Run.Sequence
metadata: { name: testPageBelowOne }
steps:
  - name: fixture
    invoke: !ref Fixture.sampleFormPdf
  - name: tryRender
    try:
      - name: render
        inputs:
          data: "${{ steps.fixture.result.data }}"
          # Deliberately invalid, routed through CEL: a literal is rejected by
          # `telo check`, and this test is about the RUNTIME contract boundary.
          page: !cel "0"
        invoke: !ref render
    catch:
      - name: caught
        inputs:
          code: "${{ error.code }}"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              code: { const: ERR_INPUT_INVALID }
            required: [ code ]
