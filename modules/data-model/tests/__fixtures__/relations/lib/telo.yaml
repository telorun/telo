kind: Telo.Library
metadata:
  name: DataModelRelationsLib
  version: 1.0.0
  description: Test fixture exporting a collection another module relates to.
imports:
  DataModel: ../../../../
exports:
  resources: [tags]
---
kind: Telo.JsonSchema
metadata: { name: Tag }
schema:
  type: object
  required: [id]
  properties:
    id: { type: string }
---
kind: DataModel.Collection
metadata: { name: tags }
model: !ref Tag
query:
  filters: [{ property: id, operator: in }]
  sort: []
