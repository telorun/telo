modules:
  modules/ui-react-conformance: Added
body: "New module: UiReactConformance.CheckTheme and UiReactConformance.CheckControls
  hold a ui-react theme or control set to the renderer's contract from the publishing
  module's own tests, answering { problems: [{ check, subject, message }] } — unstyled
  parts, stale unstyled entries, reserved layout properties, design tokens the theme
  gives no default or never reads, unparseable stylesheets, scenes that break under the
  theme's controls, failed behaviour vectors (each layer drawn in a root marked
  data-telo-layer) and sets that do not load — in a happy-dom window, one worker per
  check. The token names come from ui's @telorun/ui entry and their CSS spelling from
  ui-react's @telorun/ui-react-contract."
