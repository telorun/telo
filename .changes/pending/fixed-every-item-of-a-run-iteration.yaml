modules:
  modules/run: Fixed
body: Every item of a Run.Iteration, every turn of a Run.Loop and every element of a
  Run.Projection now runs when the body is durable. A composer that drives its own body
  journals under the prefix the kernel hands it for the whole dispatch, and sharing that
  one prefix across turns meant the journal — which takes the first writer at a key —
  returned turn 1's recorded outcome for turns 2..N. The work was silently skipped and
  the run still reported success. Each turn now carries its own prefix, the way the step
  engine's own while loop already did.
