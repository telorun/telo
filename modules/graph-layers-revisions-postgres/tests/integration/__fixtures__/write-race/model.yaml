# The revisioned graph every process of the concurrent-writes test shares: people in
# a `base` layer and a `top` layer over it, in one PostgreSQL namespace. A
# partial: the parent that includes it runs the schema; a child only names it.
kind: Postgres.Connection
metadata: { name: db }
connectionString: !cel >-
  'postgres://' + variables.dbUser + ':' + variables.dbPassword + '@' +
  variables.dbHost + ':' + string(variables.dbPort) + '/' + variables.dbName +
  '?options=-c%20search_path%3Dpublic'
---
kind: Layers.NodeTable
metadata: { name: people }
table: people
key: id
columns:
  id: { type: text, nullable: false }
  name: { type: text, nullable: false }
  age: { type: integer }
---
kind: Layers.LayersTable
metadata: { name: graphLayers }
table: graph_layers
---
kind: Layers.ChangesetsTable
metadata: { name: graphChangesets }
table: graph_changesets
---
kind: Layers.ChangesetBasesTable
metadata: { name: graphChangesetBases }
table: graph_changeset_bases
---
kind: Postgres.Schema
metadata: { name: appSchema }
connection: !ref db
schema: graph_revisions_write_race
ledger: graph_revisions_write_race
tables: [!ref people, !ref graphLayers, !ref graphChangesets, !ref graphChangesetBases]
---
kind: Layers.Node
metadata: { name: person }
table: !ref people
key: id
---
kind: Layers.Store
metadata: { name: base }
connection: !ref db
schema: !ref appSchema
layer: base
nodes: [!ref person]
layers: !ref graphLayers
changesets: !ref graphChangesets
changesetBases: !ref graphChangesetBases
---
kind: Layers.Store
metadata: { name: top }
connection: !ref db
schema: !ref appSchema
layer: top
nodes: [!ref person]
layers: !ref graphLayers
changesets: !ref graphChangesets
changesetBases: !ref graphChangesetBases
---
# A revisioned layer is built on pinned revisions, so `top` takes what `base`
# now holds by pinning its head. Only a registered layer can be pinned, and
# `base` is registered by the write this follows.
kind: Run.Sequence
metadata: { name: refreshStacks }
steps:
  - name: top
    invoke: { kind: GraphLayers.PinBase, store: !ref top }
    inputs: { bases: [{ layer: base }] }
