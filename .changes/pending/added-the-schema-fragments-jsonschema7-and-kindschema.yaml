units:
  analyzer: Added
body: "The schema fragments `JsonSchema7` and `KindSchema` are Telo's meta-schema: they
  read `pattern` and every `patternProperties` key as `format: regex` wherever the
  draft-07 meta-schema places a schema, and every position the built-in documents read
  as a schema is typed by them — a kind's `schema:`, `status:`, `inputType:` and
  `outputType:` (on `Telo.Definition` and `Telo.Abstract`), a `throws.codes` entry's
  `data:`, a `Telo.JsonSchema`, and an Application's or Library's `variables:` /
  `secrets:` entries. A pattern RE2 refuses is `SCHEMA_VIOLATION` at the pattern (at the
  `patternProperties` object for a key), worded `invalid RE2 pattern \"<pattern>\":
  <kind>`, and the load is refused with it; a `format: regex` value is explained with
  the same sentence. A `catches:` entry naming `ERR_INPUT_INVALID` or
  `ERR_OUTPUT_INVALID` types `error.data` as their built-in entries declare it.
  Breaking: a refused pattern is no longer `SCHEMA_COMPILE_ERROR`; a value at those
  positions that is not JSON Schema is now `SCHEMA_VIOLATION`; and reading
  `error.data.issues` of those two codes in a `catches:` entry needs a null guard."
