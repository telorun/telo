kind: Telo.Library
metadata:
  name: VectorStoreMemory
  version: 0.6.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Storage, AI]
  description: |
    An in-process vector index ranked by cosine, dot-product or euclidean similarity,
    held in the running process's memory with no external service to run. Suited to
    development, tests and small single-instance indexes.
imports:
  VectorStore: ../vector-store
exports:
  kinds:
    - Store
---
kind: Telo.Definition
metadata:
  name: Store
  description: >-
    Keeps a vector index in the process's own memory, ranked by a chosen similarity
    metric and pinned to a fixed vector length, optionally bounded by an entry count
    that evicts the oldest write. Nothing survives a restart.
capability: Telo.Provider
extends: VectorStore.Store
controllers:
  - pkg:telo/local/js?path=./nodejs/store.mjs&local_path=./nodejs/src/store.ts
schema:
  type: object
  additionalProperties: false
  properties:
    metric:
      title: Metric
      type: string
      enum: [cosine, dot, euclidean]
      default: cosine
      description: Similarity metric used to rank matches.
    dimensions:
      title: Dimensions
      type: integer
      minimum: 1
      description: Expected vector length; inserts / queries of other lengths are rejected.
    maxEntries:
      title: Max Entries
      type: integer
      minimum: 1
      description: >-
        When exceeded, the oldest-written entry is evicted (FIFO). Unbounded
        when omitted.
  examples:
    - metric: cosine
      dimensions: 1536
