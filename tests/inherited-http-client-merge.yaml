kind: Telo.Application
metadata:
  name: InheritedHttpClientMergeTest
  version: 1.0.0
imports:
  Ph: ./__fixtures__/inherited-client/telo.yaml
  Http: ../modules/http-client
  Run: ../modules/run
  Assert: ../modules/assert
targets:
  - !ref testMergeClient
---
# TaggedClient extends Http.Client with NO base: — additive merge. The author sets
# the parent's baseUrl directly (inherited field) plus its own `label`.
kind: Ph.TaggedClient
metadata:
  name: tagged
baseUrl: https://jsonplaceholder.typicode.com
label: demo
---
kind: Run.Sequence
metadata:
  name: testMergeClient
steps:
  - name: fetchUser
    inputs: {}
    invoke:
      kind: Http.Request
      client: !ref tagged
      url: /users/2
      method: GET
  - name: assertResponse
    inputs:
      status: !cel "steps.fetchUser.result.status"
      id: !cel "steps.fetchUser.result.body.id"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          status: { type: integer, const: 200 }
          id: { type: integer, const: 2 }
        required: [status, id]

  # The child's own declared field publishes beside the parent's reading: the
  # inherited controller lays it over the parent instance's snapshot, so both
  # halves are readable from one expression.
  - name: assertOwnFieldPublished
    inputs:
      actual:
        label: !cel "resources.tagged.label"
        baseUrl: !cel "resources.tagged.baseUrl"
        timeout: !cel "resources.tagged.timeout"
      expected:
        label: demo
        baseUrl: https://jsonplaceholder.typicode.com
        timeout: 10000
    invoke:
      kind: Assert.Equals
