    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/jpn_vert.traineddata.gz:
        { upstream: jpn_vert, member: package/4.0.0_best_int/jpn_vert.traineddata.gz, sha256: 3a4f4df8df8f50f3389fe0da10502effced38faef763d8e540142bdc9b770308, executable: false }
