kind: Telo.Application
metadata:
  name: BadCelOverload
  version: 1.0.0
imports:
  Run: ../../../run
  JavaScript: ../../../javascript
targets:
  - !ref TestBadOverload
---
# `.slice(int)` is not a CEL string method — `slice` is a three-argument function
# over a sequence, and the string method is `.substring(int)`. The analyzer's
# env.check() must catch this and the audit must name the signatures that exist.
kind: Run.Sequence
metadata:
  name: TestBadOverload
steps:
  - name: Typo
    inputs:
      value: "${{ inputs.s.slice(7) }}"
    invoke:
      kind: JavaScript.Script
      code: |
        function main(input) { return input }
