kind: Telo.Library
metadata:
  name: TesseractLangUig
  version: 0.1.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Recognize Uyghur text in images, offline: the trained model for reading
