  # Actions.
  - { text: A bare button, translation: "버튼만" }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "속성이 없는 입력 모델은 버튼만 그립니다. 이 버튼은 TEL-42의 차단된 작업을 모두 차단 해제하며, 아래쪽의 작업 수와 TEL-42 테이블을 다시 읽습니다." }
  - { text: Unblock TEL-42, translation: "TEL-42 차단 해제" }
  - { text: An answer drawn from the result, translation: "결과로 그린 응답" }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "라우트는 프로젝트의 열린 작업 추정치를 합산합니다. 필드는 입력 모델의 필드로 두 섹션에 나뉘며, 프로젝트는 프로젝트 컬렉션에서 고르고 속도는 슬라이더로 정합니다. 입력한 내용은 주소에 유지됩니다. 응답은 버튼 아래에 그려집니다. 결과와 보낸 레코드로 만든 문장, 작업이 완료될 날짜, 레이블별 시간 목록입니다." }
  - { text: What to count, translation: "집계 대상" }
  - { text: How fast, translation: "진행 속도" }
  - { text: Estimate, context: verb, translation: "추정하기" }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} 프로젝트에는 열린 작업이 없습니다."
        other: "{$project}의 열린 작업 {$tasks}개, {$hours}시간"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation: "주당 {$pace}시간으로 약 {$weeks}주, 완료 예정일"
  - { text: By label, translation: "레이블별" }
  - { text: When it fails, translation: "실패할 때" }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "액션 자체의 실패 트리로, 오류와 보낸 레코드를 바탕으로 그려집니다. 작업 4를 james@northwind.example에게 배정하면 성공합니다. 이메일을 비우거나 팀에 없는 사람을 지정하면 거부가 해당 필드에 표시됩니다. 작업 999는 404를, 퇴사한 tomas@northwind.example은 409를 응답합니다." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "이 액션은 추정 라우트의 응답을 일수로 읽지만 라우트는 그런 값을 주지 않습니다. 응답은 액션의 출력 모델에 의해 거부되며, 실패 트리가 이를 알려 줍니다." }
  - { text: Estimate in days, translation: "일수로 추정하기" }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: 이 버튼이 읽는 응답이 아닙니다." }
  - { text: Where a success goes, translation: "성공 후 이동하는 곳" }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "첫 번째 버튼은 프로젝트의 작업을 나열하는 페이지로 응답하며, 애플리케이션이 그 페이지로 이동합니다. 두 번째 버튼은 팀 홈페이지, 즉 페이지를 대체하는 https 주소로 응답합니다." }
  - { text: Open its tasks, translation: "작업 열기" }
  - { text: Visit the homepage, translation: "홈페이지 방문" }
  - { text: Reading again after a success, translation: "성공 후 다시 읽기" }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "작업을 이동하면 아래의 작업 수(리더)와 더 아래쪽의 TEL-42 테이블을 모두 다시 읽습니다. 응답은 작업과 새 상태를 알려 줍니다." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: 할 일 {$todo}, 진행 중 {$doing}, 검토 중 {$review}, 완료 {$done}, 차단됨 {$blocked}." }
  - { text: Move, translation: "이동" }
  - { text: "Task {$id}, {$title}, is now", translation: "작업 {$id}({$title})의 현재 상태:" }
  - { text: One press after another, translation: "한 번씩 차례로" }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "댓글은 버튼을 아무리 빨리 눌러도 누른 순서대로 하나씩 전송됩니다. 버튼은 세 글자가 입력될 때까지 기다리며 그 이유를 알려 주고, 다른 작업을 고르면 마지막 응답이 지워집니다. 아래쪽에 나열된 댓글은 전송할 때마다 다시 읽습니다." }
  - { text: Add the comment, translation: "댓글 추가" }
  - { text: Write three characters or more., translation: "세 글자 이상 입력하세요." }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation: "{$title} 작업에 댓글 {$id} 추가됨. 이제 댓글이 {$count}개입니다."
  - { text: Row actions on a table, translation: "테이블의 행 액션" }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "TEL-42의 모든 작업에는 버튼이 세 개 있으며, 각 버튼은 누르면 그 응답으로 바뀝니다. 시작하기는 아직 할 일 상태인 작업에서만 즉시 실행됩니다. 닫기는 먼저 확인을 묻고, 완료된 작업에는 제공되지 않습니다. 배정은 행에 없는 이메일을 입력받는 대화 상자를 열고, 서버의 거부를 해당 필드에 보여 줍니다." }
  - { text: Number, translation: "번호" }
  - { text: Start, context: verb, translation: "시작하기" }
  - { text: Closed, translation: "닫힘" }
  - { text: Close this task?, translation: "이 작업을 닫을까요?" }
  - { text: Already started., translation: "이미 시작되었습니다." }
  - { text: Already finished., translation: "이미 완료되었습니다." }
  - { text: Assign, translation: "배정" }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} 작업이 {$assignee}에게 배정되었습니다." }
  - { text: "Task {$id} is unchanged.", translation: "작업 {$id}에 변경 사항이 없습니다." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: "목록의 행 액션" }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "리더가 그리는 목록인 최근 댓글로, 고정된 댓글이 먼저 표시됩니다. 고정은 아직 고정되지 않은 댓글에서 즉시 실행되고, 삭제는 먼저 확인을 묻고, 편집은 대화 상자에서 새 내용을 묻습니다. 비워 두면 해당 필드에서 거부됩니다. 목록은 액션마다 다시 읽습니다." }
  - { text: Latest comments, translation: "최근 댓글" }
  - { text: Pin, translation: "고정" }
  - { text: Already pinned., translation: "이미 고정되었습니다." }
  - { text: Delete this comment?, translation: "이 댓글을 삭제할까요?" }
  - { text: Rewrite this comment?, translation: "이 댓글을 다시 작성할까요?" }
  - { text: More places a success goes, translation: "성공 후 이동하는 다른 곳" }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "첫 번째 버튼은 작업을 추가하고 매니페스트에 작성된 주소인 테이블 페이지로 이동합니다. 두 번째 버튼은 핸드북의 주소, 즉 서버가 마운트 아래에서 제공하는 파일로 응답하며, 이 파일은 일반적인 방식으로 로드됩니다. 세 번째 버튼은 팀 미러, 즉 브라우저가 다른 호스트로 읽는 주소로 응답합니다. 아무 데도 이동하지 않으며, 응답이 그렇게 알려 줍니다." }
  - { text: Add it and open the tables, translation: "추가하고 테이블 열기" }
  - { text: Open the handbook, translation: "핸드북 열기" }
  - { text: Open the mirror, translation: "미러 열기" }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "받은 응답: {$mirror}. 이동할 수 있는 주소가 아니므로 페이지에 그대로 머뭅니다." }
  - { text: "Refused, and unanswered", translation: "거부와 무응답" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "프로젝트 일시 중지는 매니저만 할 수 있습니다. 세션이 없으면 가드가 401로 응답합니다. 데이터 페이지에서 매니저가 아닌 james@northwind.example로 로그인하면 라우트가 본문 없이 403으로 응답합니다. ada@northwind.example로 로그인하면 프로젝트를 일시 중지하며, 진행 중이 아닌 프로젝트는 페이지의 언어로 거부합니다. 액션의 기본 실패 트리가 각 거부를 그립니다." }
  - { text: Pause the project, translation: "프로젝트 일시 중지" }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "{$code} 프로젝트가 진행 중이 아니어서 일시 중지할 수 없습니다." }
  - { text: "{$name} is paused.", translation: "{$name} 프로젝트가 일시 중지되었습니다." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "이 라우트는 모든 요청을 자기 자신에게 되돌려 보내므로 브라우저가 포기하고 응답이 전혀 도착하지 않습니다. 실패 트리가 이를 알려 줍니다. 오류에는 상태가 없습니다." }
  - { text: Call a route that never answers, translation: "응답하지 않는 라우트 호출" }
  - { text: "The route answered, with the status", translation: "라우트가 응답했으며, 상태는" }
  - { text: "No answer arrived, so there is no status.", translation: "응답이 도착하지 않아 상태가 없습니다." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: "주소를 읽는 행 액션" }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "테이블은 주소가 지정하는 프로젝트의 작업을 나열하고, 이동은 누르는 순간 테이블의 쿼리에서 읽은, 주소가 지정하는 상태로 작업을 옮깁니다. 행과 주소가 이동의 모든 필드를 채우므로 대화 상자는 아무것도 묻지 않는 단순한 확인 창입니다. 프로젝트와 상태를 고르세요:" }
  - { text: TEL-42 into review, translation: "TEL-42 → 검토 중" }
  - { text: APP-5 to finished, translation: "APP-5 → 완료" }
  - { text: OPS-7 back to in progress, translation: "OPS-7 → 다시 진행 중" }
  - { text: Neither, translation: "선택 안 함" }
  - { text: Moved to, translation: "이동됨:" }
  - { text: Move this task to the status the address names?, translation: "이 작업을 주소가 지정하는 상태로 이동할까요?" }
  - { text: Choose a status above first., translation: "먼저 위에서 상태를 고르세요." }

  # Components.
  - { text: A component on the page, translation: "페이지 위의 컴포넌트" }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "TSX로 작성되어 이 예제의 라이브러리가 제공하는 컴포넌트로, 고정된 속성과 함께 배치됩니다. 호스트가 제공하는 모든 것을 사용합니다. 페이지의 위치를 보여 주고, 어느 패널이 열려 있는지 주소에 유지하며, navigate와 href로 만든 링크로 다른 페이지로 이동하고, https 주소는 거부됩니다. fetch로 TEL-42의 상태를 읽고 작업을 추가하며, notifyChanged로 작업이 변경되었음을 알려 아래 테이블이 다시 읽게 하고, onChanged로 전달받은 모든 변경을 셉니다. 테이블 자체의 편집과 삭제도 포함됩니다. 추가한 작업은 페이지 모서리에 있는 자체 레이어에서 알립니다." }
  - { text: A component in a cell, translation: "셀 안의 컴포넌트" }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "우선순위 열은 각 행의 우선순위와 작업 차단 여부를 받는 컴포넌트가 그립니다. 테이블은 컴포넌트가 쓰는 것과 같은 컬렉션에서 TEL-42의 작업을 나열하므로, 위에서 작업을 추가하면 다시 읽습니다. 테이블의 편집과 삭제는 컴포넌트에 전달됩니다." }
  - { text: Its stylesheet, translation: "스타일시트" }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "컴포넌트 소스는 자체 스타일시트를 가져오며, 애플리케이션은 이를 telo.component 레이어에 둡니다. 테마와 브랜드 뒤, 애플리케이션 자체 스타일시트 앞입니다. 그 안의 모든 값은 디자인 토큰을 읽으므로 데스크와 미터는 각 마운트의 모양을 따릅니다." }

  # CRUD.
  - { text: A generated admin screen, translation: "생성된 관리 화면" }
  - { text: "One declaration over the tasks model the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the model, so the screen offers exactly what the API accepts.", translation: "API를 제공하는 작업 모델에 대한 선언 하나로 필터 바, 정렬과 페이지 나누기가 되는 테이블, 작업 추가 폼과 변경 폼, 모든 행의 확인을 거치는 삭제가 만들어집니다. 열, 필드, 필터는 모두 모델에서 파생되므로 화면은 API가 받는 것을 정확히 제공합니다." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "필터 바는 끝 가장자리에서 테이블 옆에 놓이며 선택한 필터만 보여 주고, 각 필터는 컨트롤을 여는 칩입니다. 선택은 이 브라우저에 aside 키로 유지됩니다. 이 키는 필터 페이지에서 테이블 옆에 있는 필터 바의 키이므로, 어느 페이지에서 고른 필터든 두 페이지 모두에 선택됩니다." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "새 작업은 끝 가장자리에서 나오는 드로어에서 열리며, 비워진 채로 다음 작업을 위해 열려 있습니다. 작업은 목록 옆의 패널에서 변경하며, 이 패널은 주소의 일부이고 저장하지 않은 입력이 있을 때 벗어나려 하면 먼저 묻습니다." }

  # Themes.
  - { text: Four mounts of one design, translation: "하나의 디자인, 네 개의 마운트" }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "같은 페이지가 네 번 제공되며, 각 애플리케이션이 자체 테마, 브랜드, 내비게이션을 지정합니다. 페이지는 네 곳 모두에서 참조로 배치하는 하나의 뷰 세트이므로, 모양과 내비게이션만 다릅니다." }
  - { text: At the root, translation: "루트" }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "기본 제공 모양, 그 위에 얹은 이 예제 자체의 스타일시트, 그리고 요청마다 선택되는 브랜드입니다. 쿠키가 요청하면 Acme 토큰 세트를, 그렇지 않으면 테마 자체의 값을 사용합니다." }
  - { text: Under /radix, translation: "/radix 아래" }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Radix 테마: 스타일시트와 열세 가지 컨트롤(선택 목록, 대화 상자, 드로어, 팝오버, 메뉴, 툴팁)이며, 브랜드는 테마에 맡깁니다." }
  - { text: Under /brand, translation: "/brand 아래" }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "이 예제 자체의 테마: 여기서 작성한 스타일시트를 입힌 Radix 컨트롤과 자체 토큰 값입니다. 애플리케이션의 브랜드는 하나의 토큰 세트이며, 테마가 지정하는 Inter 서체를 함께 제공합니다." }
  - { text: Under /sidebar, translation: "/sidebar 아래" }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "페이지 옆 사이드바에 내비게이션이 있는 기본 제공 모양으로, 사이드바는 레일로 접히고 열린 그룹을 기억합니다. 휴대폰에서는 아래쪽 가장자리를 따라 놓인 탭 바가 됩니다." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "링크는 그려진 마운트 아래에서 해석되므로, 마운트 간 링크와 브랜드 전환은 루트 애플리케이션의 테마 페이지에 있습니다." }
  - { text: Every design token, translation: "모든 디자인 토큰" }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "닫힌 세트의 각 토큰을 이 페이지의 테마와 브랜드가 정한 값으로, 렌더러가 투영하는 사용자 정의 속성에서 읽어 그 값으로 그린 샘플과 함께 보여 줍니다. 다른 마운트를 열거나 루트에서 브랜드를 전환하면 값이 바뀝니다." }
  - { text: Typefaces, translation: "서체" }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "본문과 제목 서체의 네 가지 스타일 각각과, 스타일마다 이 애플리케이션이 이를 제공하는지 여부입니다. /brand 아래에서는 Inter의 보통, 굵게, 기울임, 굵은 기울임 스타일이며, 예제와 함께 제공되어 페이지와 함께 전송됩니다. 다른 두 마운트는 아무것도 제공하지 않으며 사용자 자신의 글꼴로 그립니다." }
  - { text: Switch the mount or the brand, translation: "마운트 또는 브랜드 전환" }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "이 링크들은 이 애플리케이션 자체의 링크입니다. 링크는 그려진 마운트 아래에서 해석되므로, 루트의 애플리케이션만 다른 두 곳에 닿습니다. 각 링크는 다른 애플리케이션을 일반적인 방식으로 로드합니다." }
  - { text: Open the Radix mount, translation: "Radix 마운트 열기" }
  - { text: Open the brand mount, translation: "브랜드 마운트 열기" }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "이 애플리케이션의 브랜드는 요청마다 선택됩니다. 전환하면 쿠키를 설정하거나 지우고 이곳으로 돌아오며, 쿠키가 있는 동안에는 테마 자체의 값 대신 Acme 토큰 세트를 사용합니다." }
  - { text: Use the Acme brand, translation: "Acme 브랜드 사용" }
  - { text: "Use the theme's own values", translation: "테마 자체 값 사용" }

  # The renderer's own words, as `Ui.words` writes them.
  - { text: Loading…, translation: "불러오는 중…" }
  - { text: No rows., translation: "행이 없습니다." }
  - { text: Nothing found., translation: "찾은 항목이 없습니다." }
  - { text: Save, translation: "저장" }
  - { text: Cancel, translation: "취소" }
  - { text: Close, translation: "닫기" }
  - { text: New, translation: "새로 만들기" }
  - { text: Edit, translation: "편집" }
  - { text: Delete, translation: "삭제" }
  - { text: Delete this row?, translation: "이 행을 삭제할까요?" }
  - { text: This cannot be undone., translation: "이 작업은 되돌릴 수 없습니다." }
  - { text: Previous page, translation: "이전 페이지" }
  - { text: "{$first}–{$last} of {$total}", translation: "{$total}개 중 {$first}–{$last}" }
  - { text: "0 of {$total}", translation: "{$total}개 중 0" }
  - { text: Next page, translation: "다음 페이지" }
