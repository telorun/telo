[package]
name = "telo-cli"
version = "0.125.1"
license-file = "../../LICENSE"
edition = "2021"
publish = false
description = "Command-line entry point for the Rust Telo kernel. Builds the `telo` binary: one command, whichever kernel is behind it."

[[bin]]
name = "telo"
path = "src/main.rs"

[dependencies]
telo-analyzer = { path = "../../analyzer/rust" }
telo-kernel = { path = "../../kernel/rust" }

# For the loopback registry support the kernel's integration tests share.
[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Manifest key order is part of what a manifest says, and what the Node half keeps.
serde_json = { version = "1", features = ["preserve_order"] }
tar = { version = "0.4", default-features = false }
tempfile = "3"
