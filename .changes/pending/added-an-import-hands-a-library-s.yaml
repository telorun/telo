units:
  kernel: Added
body: "An import hands a library's text parameter — a `variables:` or `secrets:` entry
  typed `Text` or `Message` — to the library as the record `{ text, context, lang,
  computed }` attributed to the importing module, judged in its `lang:` when the import
  initializes; the entry's `default:` is attributed to the library, a text record an
  expression forwards is passed on unchanged, any other computed value is
  `ERR_TEXT_ARGUMENT_COMPUTED`, and a shared library compares such inputs by their
  settled records (`ERR_SHARED_LIBRARY_CONFLICT`, naming both languages). This breaks a
  library that read such an input as a plain text: it now receives a record."
