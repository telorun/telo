# A model whose declared query its own read shape contradicts. `telo check` reports
# it here; a consumer's check sees nothing, so there the model refuses itself
# when it is created.
kind: Telo.Library
metadata:
  name: CrudModelFilterOperatorUnsupported
  version: 1.0.0
  description: Test fixture exporting a data model refused as CRUD_MODEL_FILTER_OPERATOR_UNSUPPORTED.
imports:
  Crud: ../../../../../
exports:
  resources: [model]
---
kind: Telo.JsonSchema
metadata: { name: Draft }
schema:
  type: object
  required: [text]
  additionalProperties: false
  properties:
    text: { type: string }
    isDone: { type: boolean }
    tags: { type: array, items: { type: string } }
---
kind: Telo.JsonSchema
metadata: { name: Record }
extends: Draft
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
---
kind: Crud.Model
metadata: { name: model }
schemas:
  read: !ref Record
  list: !ref Record
  create: !ref Draft
  update: !ref Draft
query:
  filters:
    - { property: text, operator: contains }
    - { property: isDone, operator: contains }
  sort: []
