kind: Telo.Application
metadata:
  name: TextMessagesArrayTest
  version: 1.0.0
imports:
  Ai: ../
  AiEcho: ./__fixtures__/ai-echo.yaml
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref testMessagesArray
---
kind: AiEcho.EchoModel
metadata: { name: echo }
---
kind: Ai.Text
metadata: { name: c }
model: !ref echo
---
# Full `messages` array is passed through unchanged; Echo returns the last message's
# content. Verifies multi-turn shape without relying on prompt shorthand.
kind: Run.Sequence
metadata:
  name: testMessagesArray
steps:
  - name: invoke
    inputs:
      messages:
        - role: user
          content: "first"
        - role: assistant
          content: "ack"
        - role: user
          content: "second"
    invoke: !ref c
  - name: assert
    inputs:
      text: "${{ steps.invoke.result.text }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          text: { type: string, const: "second" }
        required: [ text ]
