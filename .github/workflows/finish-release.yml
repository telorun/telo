name: Publish final release

# Builds the final release PR itself, `chore(release): version` from
# `release-version/<branch>`: `telo release apply` versions every planned unit as a
# final (`release-pr-version.mjs --final`). Merging it publishes the final, and that
# Publish run dispatches Record release (record-release.yml), whose PR brings the
# release's state to main. Two refs:
#
# - A release branch in candidates (`gh workflow run finish-release.yml --ref
#   release/0.85`): versions the branch as the final, replacing an open rc release PR
#   (which is then never published). Its head now records final versions, so every
#   later Publish rebuild of it stays the final. The branch's own copy of this file
#   and its scripts do the work.
# - Main (`--ref main`): a cut straight to the final, with no candidates. It refuses
#   what Start release candidates refuses, creates `release/<major>.<minor>` at the
#   dispatched commit and versions it from the pending fragments.

on:
  workflow_dispatch:

# On main it shares the cut's group, so a cut and a direct final never race to one branch.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'cut-release' || format('finish-release-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      branch: ${{ steps.check.outputs.branch }}
      direct: ${{ steps.check.outputs.direct }}
      live: ${{ steps.check.outputs.live }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On main the check reads main's release plan with the Node build of the CLI.
      - name: Build workspace
        run: pnpm -r --if-present build

      # A linking crate's cargo layer reads its closure across every platform
      # (`cargo metadata --locked --offline`), so every platform's crates are fetched first.
      - name: Fetch every platform's crates
        run: cargo fetch --locked

      # Under bun: on main this is the cut's own check, which asks the record and
      # reads the analyzer from source.
      - name: Check
        id: check
        run: pnpm exec bun scripts/release-branch.mjs finish-check --ref "$GITHUB_REF_NAME"

  finish:
    name: Finish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    # The branch's Publish group: on main, the Publish run the branch's creation starts
    # waits until the release PR is open, then rebuilds it as the final; over candidates,
    # a Publish run cannot rebuild the release PR's head while it is being replaced.
    concurrency:
      group: ${{ format('publish-refs/heads/{0}', needs.check.outputs.branch) }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ needs.check.outputs.branch }}
      RELEASE: ${{ needs.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TELO_BOT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On main, the live branch's too: a run still in progress may yet tag a release
      # the check could not see.
      - name: Refuse while a Publish run is in progress
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECT: ${{ needs.check.outputs.direct }}
          LIVE: ${{ needs.check.outputs.live }}
        run: |
          branches="$BRANCH"
          if [ "$DIRECT" = "true" ] && [ -n "$LIVE" ]; then branches="$LIVE $BRANCH"; fi
          for branch in $branches; do
            n=$(gh run list --workflow publish.yml --branch "$branch" --json status --jq '[.[]|select(.status!="completed")]|length')
            if [ "$n" != "0" ]; then
              echo "::error::a Publish run of $branch is in progress; dispatch Publish final release after it completes."
              exit 1
            fi
          done

      # TELO_BOT_TOKEN: the rulesets let only the release workflows create `release/*` refs.
      - name: Create the branch
        if: needs.check.outputs.direct == 'true'
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/release-branch.mjs create-branch --branch "$BRANCH" --sha "$GITHUB_SHA"
          git fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout --quiet -B "$BRANCH" "origin/$BRANCH"

      - name: Build workspace
        run: pnpm -r --if-present build

      # A linking crate's cargo layer reads its closure across every platform
      # (`cargo metadata --locked --offline`), so every platform's crates are fetched first.
      - name: Fetch every platform's crates
        run: cargo fetch --locked

      - name: Version the final
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
          RELEASE_PLAN_FILE: ${{ runner.temp }}/release-plan.json
        run: node scripts/release-pr-version.mjs --final --branch "$BRANCH"

      - name: Describe the release PR
        env:
          DIRECT: ${{ needs.check.outputs.direct }}
        run: |
          if [ "$DIRECT" = "true" ]; then
            echo "Publishes \`$RELEASE.0\` from \`$BRANCH\`, cut from main at $GITHUB_SHA with no release candidates. Merging it publishes and tags the final." > /tmp/finish-body.md
          else
            {
              echo "Publishes \`$RELEASE.0\` from \`$BRANCH\` as its final. Merging it publishes and tags the final."
              echo
              echo "An rc release PR that was open is replaced by this one and its candidate is not published."
            } > /tmp/finish-body.md
          fi
          { cat /tmp/finish-body.md; echo; node scripts/release-pr-body.mjs "$RUNNER_TEMP/release-plan.json"; } > /tmp/release-body.md

      # TELO_BOT_TOKEN so the branch's required checks run on the PR. Publish's
      # release-pr job rebuilds this same branch and PR.
      - name: Open the release PR
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TELO_BOT_TOKEN }}
          branch: release-version/${{ needs.check.outputs.branch }}
          base: ${{ needs.check.outputs.branch }}
          title: "chore(release): version"
          commit-message: "chore(release): version"
          body-path: /tmp/release-body.md

      - name: Finish
        env:
          NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          DIRECT: ${{ needs.check.outputs.direct }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "::error::Error: the release PR was not opened; nothing differs from $BRANCH."
            exit 1
          fi
          if [ "$DIRECT" = "true" ]; then
            echo "Opened #$NUMBER \"chore(release): version\" into $BRANCH: $RELEASE.0, with no candidates."
          else
            echo "Opened #$NUMBER \"chore(release): version\" into $BRANCH: $RELEASE.0, the final over its candidates."
          fi
