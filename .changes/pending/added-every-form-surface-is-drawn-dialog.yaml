modules:
  modules/ui-react: Added
body: "Every form surface is drawn: dialog, drawer on four sides, popover, inline
  (create above the grid, edit under its row), panel beside the list, and a page surface
  in place of the page content. An addressed surface keeps what is open in the query key
  _telo.open.<name> as a history entry: opening adds one unless a form of the same table
  is already open in the address, and closing removes only that surface's key, so
  another surface open on the page stays open. A surface with compact is replaced below
  the new UiReact.App compactBelow breakpoint (default 40rem, carried in the application
  document; app carries data-compact), and one open when the viewport crosses it is
  swapped in place with what was entered. A form fills its surface, its actions at the
  bottom edge. afterSubmit close, again and keep are honoured, and under unsaved:
  confirm a form holding unsaved input asks before anything closes it — its own
  dismissal, navigation, host.navigate from a component, back and forward, and the
  browser prompt on unload. BREAKING: every dialog-* styling part is renamed into one
  family shared with confirmations — dialog-overlay, dialog, dialog-header,
  dialog-title, dialog-description, dialog-close become surface-overlay, surface,
  surface-header, surface-title, surface-description, surface-close, with new
  surface-body, table-main and table-detail parts and data-surface, data-side,
  data-size, data-align, data-modal, data-dirty and data-compact attributes; a
  stylesheet written against the dialog parts must be updated."
