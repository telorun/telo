project: rate-limit
kind: Fixed
body: RateLimit.Guard and RateLimit.Budget warn when they deny a call with a missing or empty
  'key'. The fail-closed denial is indistinguishable from a real throttle or an exhausted
  budget to the caller, so the authoring error read as a working rate limiter that rejected
  every request.
