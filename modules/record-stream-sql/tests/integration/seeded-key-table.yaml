kind: Telo.Application
metadata:
  name: RecordStreamSqlSeededKeyTablePostgres
  version: 1.0.0
  description: |
    Writer liveness over the SQL store on PostgreSQL, seeded through the key table:
    a writer lost at open, a lost writer's next append refused, and a key with no
    writer reported lost mid-tail. Each case clears its own keys first.

    NEEDS A CONTAINER ENGINE: it starts its own PostgreSQL. Kept out of `tests/` proper for exactly that reason.
imports:
  Pg:
    source: ../../../postgres/tests/__fixtures__/container
    variables: { engineUrl: !cel "variables.engineUrl" }
    secrets: { engineToken: !cel "secrets.engineToken" }
  Seeded:
    source: ../__fixtures__/seeded-suite
    variables: { table: record_stream_journal_seeded_test }
    resources: { connection: !ref db, store: !ref store }
  RecordStreamSql: ../../
  Postgres: ../../../postgres
variables:
  engineUrl: { env: TELO_HOST_CONTAINER_ENGINE_URL, type: string, default: "unix:///var/run/docker.sock" }
secrets:
  engineToken: { env: TELO_HOST_CONTAINER_ENGINE_TOKEN, type: string, default: "" }
targets:
  - !ref Seeded.lostWriter
  - !ref Seeded.orphanedKey
  - !ref Seeded.resumeStaleWriter
---
kind: Postgres.Connection
metadata: { name: db }
access: !ref Pg.databaseAccess
---
kind: RecordStreamSql.JournalStore
metadata: { name: store }
connection: !ref db
table: record_stream_journal_seeded_test
