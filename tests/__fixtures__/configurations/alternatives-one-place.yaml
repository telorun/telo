# A declaration writes alternatives at one place: a reference, an object holding
# one, a list holding one. The rule's finding belongs to exactly the
# configurations taking the alternative whose model breaks it.
kind: Telo.Application
metadata: { name: AlternativesOnePlace }
variables:
  flag1: { env: FLAG_1, type: boolean, default: false }
  level: { env: LEVEL, type: integer, enum: [1, 2, 3], default: 1 }
targets:
  - !ref direct
  - !ref switched
  - !ref boxed
  - !ref listed
---
kind: Telo.Definition
metadata: { name: Model }
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./probe.mjs#Probe]
schema: { type: object, properties: { label: { type: string } } }
---
kind: Telo.Definition
metadata: { name: Panel }
capability: Telo.Provider
controllers: [pkg:telo/local/js?path=./probe.mjs#Probe]
schema:
  type: object
  properties: { expects: { type: string } }
  x-telo-referrer-rules:
    - referrer: Self.Direct
      resolve: ["/model"]
      condition: !cel "referrer.model.?label.orValue('') == self.expects"
      code: PANEL_MODEL
      message: holds a model whose label is not the one the panel expects
    - referrer: Self.Boxed
      resolve: ["/spec/model"]
      condition: !cel "referrer.spec.model.?label.orValue('') == self.expects"
      code: PANEL_BOXED_MODEL
      message: boxes a model whose label is not the one the panel expects
    - referrer: Self.Listed
      resolve: ["/models/0"]
      condition: !cel "referrer.models[0].?label.orValue('') == self.expects"
      code: PANEL_LISTED_MODEL
      message: lists a first model whose label is not the one the panel expects
---
kind: Telo.Definition
metadata: { name: Direct }
capability: Telo.Runnable
controllers: [pkg:telo/local/js?path=./probe.mjs#Probe]
schema:
  type: object
  properties:
    model: { x-telo-ref: { kind: Self.Model, use: dependency } }
    panel: { x-telo-ref: { kind: Self.Panel, use: dependency } }
---
kind: Telo.Definition
metadata: { name: Boxed }
capability: Telo.Runnable
controllers: [pkg:telo/local/js?path=./probe.mjs#Probe]
schema:
  type: object
  properties:
    spec:
      type: object
      properties:
        model: { x-telo-ref: { kind: Self.Model, use: dependency } }
        panel: { x-telo-ref: { kind: Self.Panel, use: dependency } }
---
kind: Telo.Definition
metadata: { name: Listed }
capability: Telo.Runnable
controllers: [pkg:telo/local/js?path=./probe.mjs#Probe]
schema:
  type: object
  properties:
    models: { type: array, items: { x-telo-ref: { kind: Self.Model, use: dependency } } }
    panel: { x-telo-ref: { kind: Self.Panel, use: dependency } }
---
kind: Self.Model
metadata: { name: good }
label: orders
---
kind: Self.Model
metadata: { name: bad }
label: other
---
kind: Self.Model
metadata: { name: unlabelled }
---
kind: Self.Panel
metadata: { name: panel }
expects: orders
---
kind: Self.Direct
metadata: { name: direct }
model: !if
  if: !cel "variables.flag1"
  then: !ref good
  else: !ref bad
panel: !ref panel
---
kind: Self.Direct
metadata: { name: switched }
model: !switch
  switch: !cel "variables.level"
  cases: { "1": !ref good, "2": !ref bad }
  default: !ref unlabelled
panel: !ref panel
---
kind: Self.Boxed
metadata: { name: boxed }
spec: !if
  if: !cel "variables.flag1"
  then: { model: !ref good, panel: !ref panel }
  else: { model: !ref bad, panel: !ref panel }
---
kind: Self.Listed
metadata: { name: listed }
panel: !ref panel
models: !if
  if: !cel "variables.flag1"
  then: [!ref good]
  else: [!ref bad]
