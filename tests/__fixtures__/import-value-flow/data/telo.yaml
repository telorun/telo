kind: Telo.Library
metadata:
  name: ImportValueFlowData
  version: 1.0.0
imports:
  Sql: ../../../../modules/sql
  SQLite: ../../../../modules/sqlite
variables:
  # What the connection's `file` holds: in-memory, or a host path the importer
  # resolved.
  dbFile:
    anyOf:
      - const: ":memory:"
      - type: string
        x-telo-type: Telo.HostPath
exports:
  resources: [ db, migrate ]
---
# The connection path is the forwarded config value. Before the import-value-flow
# fix this `${{ }}` reached the controller as a compiled-value object and crashed.
kind: SQLite.Connection
metadata:
  name: db
file: !cel "variables.dbFile"
---
kind: SQLite.Schema
metadata:
  name: migrate
connection: !ref db
version: !cel "module.version"
migrations:
  20260601_seed:
    statements:
      - "CREATE TABLE marker (id INTEGER PRIMARY KEY, name TEXT NOT NULL)"
      - "INSERT INTO marker (id, name) VALUES (1, 'flowed')"
