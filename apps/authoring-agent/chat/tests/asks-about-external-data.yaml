kind: Telo.Application
metadata:
  name: ChatAsksAboutExternalData
  version: 1.0.0
  description: |
    Live integration test for the hardest case the analysis phase has to catch:
    a request that READS as a specification and is not. "Report work times from
    YouTrack, correlated with our Google spreadsheet, as a PDF" names three
    systems, a source, a join and an output format — and says nothing about
    which spreadsheet, which tab, what its columns are called, how the two sides
    are matched, or what the PDF contains. None of that is discoverable: no hub
    tool and no file in the workspace describes the user's own systems.

    This is a different assertion from asks-before-building.yaml, which sends an
    obviously thin request. A confident-sounding one is what actually got built
    from guesses — and inventing a column name produces a manifest that checks
    clean, runs, and is wrong, which is the one failure the toolchain cannot
    catch. So this asserts no file was written and that questions came back.

    Skips silently when OPENAI_API_KEY is unset.
secrets:
  openaiApiKey:
    env: OPENAI_API_KEY
    type: string
    default: ""
variables:
  workspaceDir:
    env: EXTERNAL_DATA_WORKSPACE_DIR
    type: string
    x-telo-type: Telo.HostPath
    default: ./workspace/asks-about-external-data
  # The agent's state is a file that outlives the run, so each run opens a
  # conversation of its own — a reused one would replay the last run's history.
  stateDir:
    env: EXTERNAL_DATA_STATE_DIR
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/asks-about-external-data
imports:
  Chat:
    source: ../
    secrets:
      openaiApiKey: !cel "secrets.openaiApiKey"
    variables:
      workspaceDir: !cel "variables.workspaceDir"
      stateDir: !cel "variables.stateDir"
      # No `model:` — inherited from the library, so this exercises what ships.
      teloProgram: [bun, ../../cli/nodejs/bin/telo.ts]
  Fs: oci://ghcr.io/telorun/fs@0.10.1#sha256-pj5pToa-5CERdxQQpeRNYEJmtNWsNYIGKqehjamHXUo
  Stream: oci://ghcr.io/telorun/stream@0.12.0#sha256-9k7wI-86RokMs-fb01heH4kitM5hNQcOrFj2OesahXE
  Run: oci://ghcr.io/telorun/run@0.27.1#sha256-O1CdVvYs_O7Zj-PNQxMS3NdgWL6e8M2A0J9Wu0rTnIU
  Assert: oci://ghcr.io/telorun/assert@0.20.0#sha256-CHKb_ylzNVdyIA4XFFvofXSbgCUAyuaiSgWXyZKtPSI
targets:
  - !ref cleanWorkspace
  - !ref Chat.ensureWorkspace
  - !ref Chat.initSchema
  - !ref resetState
  - !ref testAsksAboutData
---
# The agent's state is reset with the workspace. Its database is opened at boot,
# before any target runs, so it is emptied in place rather than deleted: this run
# starts with no conversation history and no admission records.
kind: Run.Sequence
metadata: { name: resetState }
steps:
  - name: messages
    invoke: !ref Chat.historyQuery
    inputs:
      sql: "DELETE FROM messages RETURNING id"
  - name: admissions
    invoke: !ref Chat.historyQuery
    inputs:
      sql: "DELETE FROM turn_admissions RETURNING store_key"
---
kind: Run.Sequence
metadata: { name: cleanWorkspace }
steps:
  - name: clean
    try:
      - name: remove
        inputs:
          path: !cel "string(variables.workspaceDir)"
          recursive: true
        # The path is absolute (a host-path variable), so no `cwd` is needed.
        invoke: { kind: Fs.FileRemoval }
    catch:
      - name: absent
        value: true
---
kind: Run.Sequence
metadata: { name: testAsksAboutData }
steps:
  - name: runIfKey
    if: !cel "secrets.openaiApiKey != ''"
    then:
      - name: chat
        invoke: !ref Chat.chatStart
        inputs:
          conversationId: !cel "'external-data-' + uuidv4()"
          idempotencyKey: ""
          clientIp: test-runner
          message: |
            Build me a report of work times from YouTrack, correlated with our
            Google spreadsheet, and output it as a PDF.
      - name: read
        invoke: !ref Chat.journalSource
        inputs:
          key: !cel "steps.chat.result.turnId"
          fromId: 0
      - name: drain
        invoke:
          kind: Stream.Collect
        inputs:
          input: !cel "steps.read.result.output"
      - name: reply
        value: !cel "steps.drain.result.items.filter(r, r.data.type == 'text-delta').map(r, r.data.delta).join('')"
      - name: assert
        inputs:
          wroteFile: !cel "steps.drain.result.items.exists(r, r.data.type == 'tool-call' && (r.data.toolCall.name == 'write_file' || r.data.toolCall.name == 'edit_file'))"
          askedQuestions: !cel "steps.reply.result.contains('telo-questions')"
          # The other half of the same rule, and the one nothing held before: a
          # name the MANIFEST declares is not a fact the user has. Asking which
          # env var holds a token makes them invent an answer whose only effect
          # is what the agent was going to write anyway. Asserted as an absence,
          # so a prompt edit that reinstates the question fails here rather than
          # passing a suite that only checks that SOME question came back.
          askedEnvVarName: !cel >-
            steps.reply.result.lowerAscii().contains('environment variable')
            || steps.reply.result.lowerAscii().contains('env var')
          # Unasserted: a failure has to show WHAT it invented instead of asking.
          reply: !cel "steps.reply.result.size() > 900 ? steps.reply.result.substring(0, 900) : steps.reply.result"
        invoke:
          kind: Assert.Schema
          schema:
            type: object
            properties:
              wroteFile: { const: false }
              askedQuestions: { const: true }
              askedEnvVarName: { const: false }
            required: [wroteFile, askedQuestions, askedEnvVarName]
