  rust:
    name: "Linux: Rust tests"
    runs-on: ubuntu-latest
    needs: select

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust cache
        if: needs.select.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Controller crates are built into the workspace-anchored `.telo` cache,
