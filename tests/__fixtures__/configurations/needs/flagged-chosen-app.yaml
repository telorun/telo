# The library's flag bound behind a choice of the importer: its need is
# required where the option the importer takes sets the flag.
kind: Telo.Application
metadata: { name: FlaggedChosenApp }
variables: { flag: { env: FLAG, type: boolean, default: false } }
imports:
  Flagged:
    source: ./flagged
    variables:
      flag: !if { if: !cel "variables.flag", then: false, else: true }
