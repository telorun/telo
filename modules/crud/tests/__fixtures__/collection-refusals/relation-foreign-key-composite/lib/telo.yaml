# A collection whose relation its composite foreign key agrees with.
kind: Telo.Library
metadata:
  name: CrudCollectionRelationForeignKeyComposite
  version: 1.0.0
  description: Test fixture exporting a collection whose composite foreign key matches its relation.
imports:
  Crud: ../../../../../
  SQLite: ../../../../../../sqlite
exports:
  resources: [collection]
---
kind: Telo.JsonSchema
metadata: { name: AuthorDraft }
schema:
  type: object
  required: [name]
  additionalProperties: false
  properties:
    name: { type: string }
---
kind: Telo.JsonSchema
metadata: { name: Author }
extends: AuthorDraft
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
---
kind: SQLite.Table
metadata: { name: authorsTable }
table: authors
columns:
  id: { type: integer, primaryKey: true }
  name: { type: text }
  tenant_id: { type: integer }
---
kind: Crud.Collection
metadata: { name: authors }
model: !ref Author
table: !ref authorsTable
schemas: { list: !ref Author, create: !ref AuthorDraft, update: !ref AuthorDraft }
query: { filters: [{ property: id, operator: in }], sort: [] }
---
kind: Telo.JsonSchema
metadata: { name: PostDraft }
schema:
  type: object
  required: [title]
  additionalProperties: false
  properties:
    title: { type: string }
    authorId: { type: integer }
    tenantId: { type: integer }
---
kind: Telo.JsonSchema
metadata: { name: Post }
extends: PostDraft
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
---
# A composite key whose column for `authorId` sits at the position of the
# target's key.
kind: SQLite.Table
metadata: { name: postsTable }
table: posts
columns:
  id: { type: integer, primaryKey: true }
  title: { type: text }
  author_id: { type: integer }
  tenant_id: { type: integer }
foreignKeys:
  author: { columns: [author_id, tenant_id], references: { table: !ref authorsTable, columns: [id, tenant_id] } }
---
kind: Crud.Collection
metadata: { name: collection }
model: !ref Post
table: !ref postsTable
schemas: { list: !ref Post, create: !ref PostDraft, update: !ref PostDraft }
query: { filters: [], sort: [] }
relations: { authorId: { collection: !ref authors } }
