kind: Telo.Library
metadata:
  name: HttpDispatch
  version: 0.19.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Transport]
  description: >-
    The shared value shapes every HTTP transport anchors against: the canonical
    request matcher — method, path, query, cookies, body, headers — the hostname an
    entry is selected by, the rules that render a handler's result or error into a
    status, headers, cookies and body, and cookie declarations whose prefix, scope
    and Secure, HttpOnly and SameSite attributes are checked before the app runs.
requires: { telo: ">=0.92.0" }
imports:
  # The response-encoder contract the Outcomes carrier's `content[mime].encoder`
  # slot pins. Naming it by alias is what makes the coupling a declared edge.
  Codec: ../codec
exports:
  kinds: [Cookie, HostCookie, Outcomes, Request, SecureCookie, UnprefixedCookie]
  resources: [CookieAttributeValue]
---
# Pure schema carrier. Never instantiated as a resource. Publishes
# $defs/Matcher — the canonical HTTP request matcher value-shape — as a single
# source of truth that every HTTP-shaped transport (http-server, lambda, ...)
# anchors against via x-telo-schema-from. Consumers keep their own
# x-telo-topology-role / x-telo-context-from annotations on the field they
# declare; the carrier owns only the structural value-shape (method, path,
# query, body, headers, cookies).
kind: Telo.Definition
metadata:
  name: Request
  description: Schema-only carrier publishing the canonical HTTP request matcher shapes — method, path, query, body, headers and cookies, and the hostname an entry is selected by.
capability: Telo.Type
schema:
  type: object
  $defs:
    Matcher:
      title: Matcher
      description: HTTP request matcher.
      type: object
      properties:
        path: { title: Path, description: Route path pattern., type: string }
        method:
          title: Method
          description: HTTP method matched by the route.
          type: string
          enum: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
        query:
          title: Query
          description: Query parameter schema for request matching.
          type: object
        body:
          title: Body
          description: Request body schema for request matching.
          type: object
        headers:
          title: Headers
          description: Header schema for request matching. Values are matched as strings against the incoming header value.
          type: object
          additionalProperties: { type: string }
        schema:
          title: Schema
          description: |
            User-supplied JSON Schemas typing the CEL-visible parts of the
            incoming request. Serves two purposes, so declare it for any route
            that takes inputs:
            (1) the analyzer reads it via
            `x-telo-context-from: "request/schema"` to populate and type-check
            the `request.{query,body,headers,params}` shape of CEL contexts
            inside `inputs:` / `returns:` / `catches:` (without it, `request.*`
            is untyped `dyn`);
            (2) the server registers these as the route's request validation
            schema and renders them into the generated OpenAPI document
            (`query` → query parameters, `params` → path parameters, `body` →
            request body, `headers` → header params, `cookies` → cookie params).
            For a good OpenAPI spec, write full property schemas with `type`,
            `description`, and `examples` on each field, not bare `{}`.
            Distinct from the top-level `query`/`body`/`headers` fields above,
            which document the matcher value-shape itself.
          type: object
          additionalProperties: false
          properties:
            params:  { type: object }
            query:   { type: object }
            body:    { type: object }
            headers: { type: object }
            cookies: { type: object }
      required: ["path", "method"]
    Hostname:
      title: Hostname
      description: >-
        One address a request's host selects an entry by: a `!ref` to a
        `Telo.PublicUrl` need, matching its URL's host exactly, or to a
        `Telo.PublicHostPattern` need, matching every host its pattern matches.
        A domain name is never written here — the need's fulfilment holds it.
      x-telo-ref: { kind: [Telo.PublicUrl, Telo.PublicHostPattern], use: dependency }
---
# Pure schema carrier. Never instantiated as a resource. Its only job is to
# publish $defs/Returns and $defs/Catches as a single source of truth that
# every HTTP-shaped transport (http-server, lambda, ...) anchors against via
# x-telo-schema-from. Consumers keep their own x-telo-outcome-list /
# x-telo-catches-for / x-telo-context annotations on the field they declare;
# the carrier owns only the value-shape (status, when, mode, headers, cookies,
# content).
kind: Telo.Definition
metadata:
  name: Outcomes
  description: Schema-only carrier publishing the canonical HTTP response returns/catches value-shapes for HTTP transports.
capability: Telo.Type
schema:
  type: object
  $defs:
    Returns:
      title: Returns
      description: Rendering rules for values the handler resolved with.
      type: array
      items:
        title: Return Entry
        description: Conditional rendering entry for a successful return.
        type: object
        # Closed, so a misspelled key is reported rather than ignored. The
        # http-server route's own copy of this shape always was; this carrier was
        # not, so the identical typo was an error on a route and silence in a
        # `notFoundHandler`.
        additionalProperties: false
        properties:
          status:
            title: Status
            description: HTTP status code for this entry.
            type: integer
            minimum: 100
            maximum: 599
          when:
            title: When
            description: CEL condition that selects this entry.
            type: boolean
          mode:
            title: Mode
            description: "buffer (default): CEL body expansion + schema validation. stream: pipe handler.result.output through content[mime].encoder, then bytes to the response."
            type: string
            enum: ["buffer", "stream"]
          headers:
            title: Headers
            description: >-
              Entry-level response headers; merged with per-MIME content[mime].headers
              (per-MIME wins). Content-Type and Set-Cookie are refused — the matched
              content key is the only Content-Type source, and `cookies` the only
              Set-Cookie one.
            type: object
            propertyNames: { not: { pattern: "^([Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Tt][Yy][Pp][Ee]|[Ss][Ee][Tt]-[Cc][Oo][Oo][Kk][Ii][Ee])$" } }
            additionalProperties: { type: string }
          cookies:
            title: Cookies
            description: >-
              Cookies this response sets or clears, each written as its own
              `Set-Cookie` header, in the order listed. A `maxAge` of zero or less
              clears the cookie.
            type: array
            items:
              type: object
              additionalProperties: false
              required: [cookie]
              properties:
                cookie:
                  title: Cookie
                  description: The cookie declaration — its name, scope and attributes.
                  x-telo-ref: { kind: Self.Cookie, use: dependency }
                value:
                  title: Value
                  description: >-
                    The cookie's value, RFC 6265 cookie-octets, optionally in double
                    quotes. Omitted, the value is empty.
                  type: string
                  pattern: '^(?:[\x21\x23-\x2B\x2D-\x3A\x3C-\x5B\x5D-\x7E]*|"[\x21\x23-\x2B\x2D-\x3A\x3C-\x5B\x5D-\x7E]*")$'
                maxAge:
                  title: Max age
                  description: How long the cookie lives, sent as whole seconds; zero or less clears it.
                  x-telo-type: Telo.Duration
                expires:
                  title: Expires
                  description: When the cookie expires. Null writes no expiry, so the cookie ends with the browser session.
                  anyOf: [{ x-telo-type: Telo.Timestamp }, { type: "null" }]
          content:
            title: Content
            description: Per-MIME response shape. Map key is the canonical Content-Type. Required when status carries a body; omit for 204/304-style empty responses.
            type: object
            # `examples`, not `enum`: the map key is any media type, and these
            # are the ones worth suggesting. An enum would close the set and
            # reject a perfectly valid vendor type.
            propertyNames:
              title: Content-Type
              type: string
              examples: [application/json, application/problem+json, text/plain, text/html, text/event-stream, application/octet-stream, application/xml, application/x-ndjson, text/csv]
            additionalProperties:
              type: object
              additionalProperties: false
              properties:
                body:
                  title: Body
                  description: CEL expression or object mapping for response body (buffer mode).
                schema:
                  title: Schema
                  description: >-
                    JSON Schema for the response body (buffer mode). Validates
                    the rendered body AND becomes this status's response schema
                    in the generated OpenAPI document — declare it for every
                    body-bearing return, with `type`, `description`, and
                    `examples` on each field so the OpenAPI spec is complete.
                  type: object
                encoder:
                  title: Encoder
                  description: Encoder ref (any kind extending Codec.Encoder) for stream mode. handler.result.output is piped through encoder.invoke({input}) and the encoder's result.output bytes flow to the response.
                  x-telo-ref:
                    kind: Codec.Encoder
                    # The dispatcher awaits encoder.invoke({input}) inline —
                    # the encoder's entry point, not a helper method.
                    use: call
                headers:
                  title: Headers
                  description: Per-MIME header overrides (merge over entry-level headers; per-MIME wins). Content-Type and Set-Cookie are refused.
                  type: object
                  propertyNames: { not: { pattern: "^([Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Tt][Yy][Pp][Ee]|[Ss][Ee][Tt]-[Cc][Oo][Oo][Kk][Ii][Ee])$" } }
                  additionalProperties: { type: string }
        required: ["status"]
        oneOf:
          - title: Buffer mode
            description: "mode: buffer (or omitted). Each content[mime] uses `body` (with optional `schema`); `encoder` is forbidden."
            anyOf:
              - { not: { required: ["mode"] } }
              - { properties: { mode: { const: "buffer" } } }
            properties:
              content:
                type: object
                additionalProperties: { type: object, not: { required: ["encoder"] } }
          - title: Stream mode
            description: "mode: stream. Every content[mime] must declare `encoder`; `body` is forbidden. `content` map must be non-empty."
            properties:
              mode: { const: "stream" }
              content:
                type: object
                minProperties: 1
                additionalProperties: { type: object, required: ["encoder"], not: { required: ["body"] } }
            required: ["mode", "content"]
    Catches:
      title: Catches
      description: Rendering rules for structured (InvokeError) throws from the handler. Buffer-mode only — by the time a catch fires there is no upstream iterable to feed an encoder.
      type: array
      items:
        title: Catch Entry
        description: Conditional rendering entry for a thrown InvokeError.
        type: object
        # Closed for the same reason `Return Entry` is.
        additionalProperties: false
        properties:
          status:
            title: Status
            description: HTTP status code for this entry.
            type: integer
            minimum: 100
            maximum: 599
          when:
            title: When
            description: CEL condition that selects this entry (sees `error`, `problem` — the default problem this entry renders — and `request`).
            type: boolean
          headers:
            title: Headers
            description: >-
              Entry-level response headers. Content-Type and Set-Cookie are refused —
              the matched content key is the only Content-Type source, and `cookies`
              the only Set-Cookie one.
            type: object
            propertyNames: { not: { pattern: "^([Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Tt][Yy][Pp][Ee]|[Ss][Ee][Tt]-[Cc][Oo][Oo][Kk][Ii][Ee])$" } }
            additionalProperties: { type: string }
          cookies:
            title: Cookies
            description: >-
              Cookies this response sets or clears, each written as its own
              `Set-Cookie` header, in the order listed. A `maxAge` of zero or less
              clears the cookie.
            type: array
            items:
              type: object
              additionalProperties: false
              required: [cookie]
              properties:
                cookie:
                  title: Cookie
                  description: The cookie declaration — its name, scope and attributes.
                  x-telo-ref: { kind: Self.Cookie, use: dependency }
                value:
                  title: Value
                  description: >-
                    The cookie's value, RFC 6265 cookie-octets, optionally in double
                    quotes. Omitted, the value is empty.
                  type: string
                  pattern: '^(?:[\x21\x23-\x2B\x2D-\x3A\x3C-\x5B\x5D-\x7E]*|"[\x21\x23-\x2B\x2D-\x3A\x3C-\x5B\x5D-\x7E]*")$'
                maxAge:
                  title: Max age
                  description: How long the cookie lives, sent as whole seconds; zero or less clears it.
                  x-telo-type: Telo.Duration
                expires:
                  title: Expires
                  description: When the cookie expires. Null writes no expiry, so the cookie ends with the browser session.
                  anyOf: [{ x-telo-type: Telo.Timestamp }, { type: "null" }]
          content:
            title: Content
            description: >-
              Per-MIME error-body shape. Buffer-mode only. Every key writes a
              `body`, except `application/problem+json`, which may omit it to
              render the entry's default problem (RFC 9457). When no key matches
              the `Accept` header the first is rendered — an error is never
              refused for `Accept`.
            type: object
            propertyNames:
              title: Content-Type
              type: string
              examples: [application/json, application/problem+json, text/plain, text/html]
            # Two copies of one entry shape, differing only in `required`: a
            # `#/$defs` pointer would resolve against the consuming kind's schema,
            # into which `x-telo-schema-from` transplants this definition.
            properties:
              application/problem+json:
                type: object
                additionalProperties: false
                properties:
                  body:
                    title: Body
                    description: CEL expression or object mapping for the error body. Omitted, the entry renders its default problem.
                  schema:
                    title: Schema
                    description: JSON Schema used to validate the rendered body.
                    type: object
                  headers:
                    title: Headers
                    description: Per-MIME header overrides (merge over entry-level headers; per-MIME wins). Content-Type and Set-Cookie are refused.
                    type: object
                    propertyNames: { not: { pattern: "^([Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Tt][Yy][Pp][Ee]|[Ss][Ee][Tt]-[Cc][Oo][Oo][Kk][Ii][Ee])$" } }
                    additionalProperties: { type: string }
            additionalProperties:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body:
                  title: Body
                  description: CEL expression or object mapping for the error body. Only an `application/problem+json` entry may omit it.
                schema:
                  title: Schema
                  description: JSON Schema used to validate the rendered body.
                  type: object
                headers:
                  title: Headers
                  description: Per-MIME header overrides (merge over entry-level headers; per-MIME wins). Content-Type and Set-Cookie are refused.
                  type: object
                  propertyNames: { not: { pattern: "^([Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Tt][Yy][Pp][Ee]|[Ss][Ee][Tt]-[Cc][Oo][Oo][Kk][Ii][Ee])$" } }
                  additionalProperties: { type: string }
        required: ["status"]
---
# One cookie a response sets: the attributes are the declaration's, so a cookie
# set by one route and cleared by another is sent with the same scope and the
# browser actually drops it. Only value and lifetime vary per response.
#
# Each kind's controller publishes the whole normalized attribute record, so a
# transport writes `Set-Cookie` from the record alone and never asks which kind
# declared it.
kind: Telo.Abstract
metadata:
  name: Cookie
  description: >-
    An HTTP cookie a response sets or clears, declared once with its name and the
    protections browsers enforce — HttpOnly, SameSite, Partitioned — so every
    response writing it sends the same attributes and scope. Secure by default:
    HttpOnly and SameSite=Lax unless the declaration relaxes them.
capability: Telo.Provider
schema:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      title: Name
      description: >-
        The cookie's name, an RFC 6265 token. A `__Host-` or `__Secure-` prefix is
        never written here: the kind that renders it adds it.
      type: string
      pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
      not: { pattern: "^__([Hh][Oo][Ss][Tt]|[Ss][Ee][Cc][Uu][Rr][Ee])-" }
    httpOnly:
      title: HttpOnly
      description: Hide the cookie from page scripts. Set false only for a cookie a script must read.
      type: boolean
      default: true
    sameSite:
      title: SameSite
      description: >-
        Which cross-site requests carry the cookie: `Strict` none, `Lax` top-level
        navigations, `None` all of them, which needs a secure cookie.
      type: string
      enum: [Strict, Lax, None]
      default: Lax
    partitioned:
      title: Partitioned
      description: Keep the cookie per top-level site (CHIPS); needs a secure cookie.
      type: boolean
      default: false
---
kind: Telo.Definition
metadata:
  name: HostCookie
  description: >-
    A host-only cookie, the strongest scope a browser offers: sent as `__Host-<name>`
    over HTTPS only, on every path of exactly the host that set it, never shared
    with subdomains. The right choice for a session cookie.
capability: Telo.Provider
extends: Self.Cookie
controllers: [pkg:telo/local/js?path=./nodejs/http-dispatch.mjs&local_path=./nodejs/src/index.ts#HostCookieController]
schema: { type: object, additionalProperties: false }
---
kind: Telo.Definition
metadata:
  name: SecureCookie
  description: >-
    A cookie sent only over HTTPS, as `__Secure-<name>`, which a browser refuses
    to accept from an insecure origin. It may name a domain to share the cookie
    with subdomains and a path to narrow where it is sent.
capability: Telo.Provider
extends: Self.Cookie
controllers: [pkg:telo/local/js?path=./nodejs/http-dispatch.mjs&local_path=./nodejs/src/index.ts#SecureCookieController]
schema:
  type: object
  additionalProperties: false
  properties:
    domain:
      title: Domain
      description: The domain the cookie is shared with, its subdomains included. Omitted, only the host that set it.
      $ref: "telo://Self/CookieAttributeValue"
    path:
      title: Path
      description: The path prefix the cookie is sent on.
      $ref: "telo://Self/CookieAttributeValue"
      pattern: "^/"
      default: /
---
kind: Telo.Definition
metadata:
  name: UnprefixedCookie
  description: >-
    A cookie with no name prefix, for a name an existing client or protocol
    dictates. Secure by default; SameSite=None and Partitioned both need it secure.
    It may name a domain and a path.
capability: Telo.Provider
extends: Self.Cookie
controllers: [pkg:telo/local/js?path=./nodejs/http-dispatch.mjs&local_path=./nodejs/src/index.ts#UnprefixedCookieController]
schema:
  type: object
  additionalProperties: false
  properties:
    domain:
      title: Domain
      description: The domain the cookie is shared with, its subdomains included. Omitted, only the host that set it.
      $ref: "telo://Self/CookieAttributeValue"
    path:
      title: Path
      description: The path prefix the cookie is sent on.
      $ref: "telo://Self/CookieAttributeValue"
      pattern: "^/"
      default: /
    secure:
      title: Secure
      description: >-
        Send the cookie over HTTPS only. Required by `sameSite: None` and
        `partitioned: true`.
      type: boolean
      default: true
  allOf:
    - if: { required: [sameSite], properties: { sameSite: { const: None } } }
      then: { properties: { secure: { const: true } } }
    - if: { required: [partitioned], properties: { partitioned: { const: true } } }
      then: { properties: { secure: { const: true } } }
---
# A cookie attribute's value as RFC 6265 allows it: printable ASCII without `;`.
kind: Telo.JsonSchema
metadata: { name: CookieAttributeValue }
schema:
  type: string
  description: A cookie attribute value — printable ASCII, no `;`.
  minLength: 1
  pattern: '^[\x20-\x3A\x3C-\x7E]+$'
