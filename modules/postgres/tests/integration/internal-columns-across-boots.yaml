kind: Telo.Application
metadata:
  name: PostgresInternalColumnsAcrossBoots
  version: 1.0.0
  description: |
    A table with internal columns across two real boots on PostgreSQL: the first
    creates it — an internal text primary key, and a partial unique index over
    one internal and one declared column — and the second, an unchanged restart,
    reads it back from the catalogue and changes nothing. A table with no row
    contract (`columns: {}`) rides along.

    NEEDS A CONTAINER ENGINE: it starts its own PostgreSQL, which is why it is under `tests/integration/`.
imports:
  Pg:
    source: ../__fixtures__/container
    variables: { engineUrl: !cel "variables.engineUrl" }
    secrets: { engineToken: !cel "secrets.engineToken" }
  Test: ../../../test
variables:
  engineUrl: { env: TELO_HOST_CONTAINER_ENGINE_URL, type: string, default: "unix:///var/run/docker.sock" }
secrets:
  engineToken: { env: TELO_HOST_CONTAINER_ENGINE_TOKEN, type: string, default: "" }
targets:
  - !ref boots
---
kind: Test.Suite
metadata: { name: boots }
include: ["__fixtures__/internal-column-boots/*.yaml"]
exclude: []
concurrency: 1
# Every boot connects to the one server this test started.
env:
  DB_HOST: !cel "resources.Pg.endpoint.status.host"
  DB_PORT: !cel "string(resources.Pg.endpoint.status.port)"
