kind: Telo.Application
metadata: { name: OpenComputedCredentials, version: 1.0.0 }
variables: { pw: { env: OPEN_PW, type: string, default: hunter2 } }
targets:
  - invoke: !ref opener
    inputs: { url: !interpolate "https://admin:${{ variables.pw }}@example.com/" }
---
kind: Telo.OpenUrl
metadata: { name: opener }
