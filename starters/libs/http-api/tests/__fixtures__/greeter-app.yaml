kind: Telo.Application
metadata:
  name: GreeterApp
  version: 1.0.0
  description: >-
    An application that mounts the library twice, each import configured
    differently — the shape the library's description promises works.
imports:
  # The workspace copy, like the library's own: importing a published copy
  # beside the library's workspace one is refused with DUPLICATE_IMPORT_ALIAS.
  Http: ../../../../../modules/http-server
  English:
    source: ../..
    variables:
      service: greeter
  Spanish:
    source: ../..
    variables:
      service: greeter
      greeting: Hola
targets:
  - !ref server
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8202
---
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
mounts:
  - path: /en
    mount: !ref English.api
  - path: /es
    mount: !ref Spanish.api
