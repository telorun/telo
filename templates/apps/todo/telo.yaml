kind: Telo.Application
metadata:
  name: TodoApp
  version: 1.0.0
  description: |
    A complete app served as one unit: the REST todo API and the vanilla HTML/JS
    frontend that consumes it (`Http.Static`), on a single port. The whole REST
    surface is one declarative `Crud.Resource` — list / read / create / update /
    delete over the `todos` table — mounted alongside the static frontend.

    Run, then open http://localhost:8077.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.19.1#sha256-ttYHRhb5HyTKVz7m9BetgWukGyknrpddBsWL_VRUXbM
  Sql: oci://ghcr.io/telorun/sql@0.13.0#sha256-ARE0QGUj8CtyNKTgIwiBFnHq1YbH-3B6nK4TLmvg_aE
  SQLite: oci://ghcr.io/telorun/sql-sqlite@0.4.0#sha256-Tx6iWpzDfFNKkmAmlzK74dsP1w4CR9e_jkU_EITvjb4
  Crud: oci://ghcr.io/telorun/crud@0.5.0#sha256-cmIbE-1L7YhLijExyDzIte14Um7Nzh0lHl5pJ32LGvs
targets:
  - !ref Migrate
  - !ref Server
files:
  - public/app.js
  - public/index.html
  - public/style.css
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8077
---
kind: SQLite.Connection
metadata:
  name: Db
file: ":memory:"
---
kind: Sql.Migrations
metadata:
  name: Migrate
connection: !ref Db
migrations:
  0001_create_todos:
    statement: |
      CREATE TABLE IF NOT EXISTS todos (
        id         INTEGER PRIMARY KEY AUTOINCREMENT,
        text       TEXT    NOT NULL,
        is_done    BOOLEAN NOT NULL DEFAULT FALSE,
        created_at DATETIME DEFAULT CURRENT_TIMESTAMP
      )
---
kind: Http.Server
metadata:
  name: Server
host: 127.0.0.1
port: !cel "ports.http"
logger: true
openapi:
  info:
    title: Todo API
    version: 1.0.0
mounts:
  - path: /api/todos
    mount:
      kind: Crud.Resource
      connection: !ref Db
      plural: todos
      singular: todo
      model:
        kind: Telo.JsonSchema
        schema:
          type: object
          properties:
            text: { type: string }
            isDone: { type: boolean }
  - path: /
    mount: !ref Ui
---
kind: Http.Static
metadata:
  name: Ui
root: ./public
