  # Actions.
  - { text: A bare button, translation: Un pulsante semplice }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "Un modello di input senza proprietà disegna solo il pulsante. Questo sblocca ogni attività bloccata di TEL-42, e i conteggi delle attività e la tabella di TEL-42 più in basso vengono riletti." }
  - { text: Unblock TEL-42, translation: Sblocca TEL-42 }
  - { text: An answer drawn from the result, translation: Una risposta disegnata dal risultato }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "La route somma le stime delle attività aperte di un progetto. I suoi campi sono quelli del modello di input, in due sezioni, con il progetto scelto dalla collezione dei progetti e il ritmo su un cursore; ciò che viene inserito è conservato nell'indirizzo. La risposta è disegnata sotto il pulsante: frasi sul risultato e sul record inviato, la data entro cui il lavoro sarebbe completato e un elenco delle ore per etichetta." }
  - { text: What to count, translation: Cosa contare }
  - { text: How fast, translation: Con che ritmo }
  - { text: Estimate, context: verb, translation: Calcola la stima }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} non ha lavoro aperto."
        one: "{$hours} ore in {$tasks} attività aperta di {$project}"
        other: "{$hours} ore in {$tasks} attività aperte di {$project}"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation:
      plural: weeks
      cases:
        one: "Circa {$weeks} settimana a {$pace} ore a settimana, completato entro il"
        other: "Circa {$weeks} settimane a {$pace} ore a settimana, completato entro il"
  - { text: By label, translation: Per etichetta }
  - { text: When it fails, translation: Quando fallisce }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "Un albero di errore proprio dell'azione, disegnato sull'errore e sul record inviato. Assegna l'attività 4 a james@northwind.example e riesce. Ometti l'e-mail, o indica qualcuno che non è nel team, e il rifiuto finisce sul campo; l'attività 999 risponde 404, e tomas@northwind.example, che se n'è andato, 409." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "Questa azione legge la risposta della route di stima come un numero di giorni, che la route non fornisce: la risposta viene rifiutata dal modello di output dell'azione, e il suo albero di errore lo dice." }
  - { text: Estimate in days, translation: Stima in giorni }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: la risposta non è quella che legge questo pulsante." }
  - { text: Where a success goes, translation: Dove porta un successo }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "La prima risponde con la pagina che elenca le attività di un progetto, e l'applicazione si sposta lì. La seconda risponde con la home page del team, un indirizzo https che sostituisce la pagina." }
  - { text: Open its tasks, translation: Apri le sue attività }
  - { text: Visit the homepage, translation: Visita la home page }
  - { text: Reading again after a success, translation: Rilettura dopo un successo }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "Spostare un'attività rilegge sia i conteggi qui sotto, un lettore, sia la tabella di TEL-42 più in basso. La risposta indica l'attività e il suo nuovo stato." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: {$todo} da fare, {$doing} in corso, {$review} in revisione, {$done} concluse, {$blocked} bloccate." }
  - { text: Move, translation: Sposta }
  - { text: "Task {$id}, {$title}, is now", translation: "L'attività {$id}, {$title}, ora è" }
  - { text: One press after another, translation: "Una pressione dopo l'altra" }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "I commenti vengono inviati uno dopo l'altro, nell'ordine in cui si preme il pulsante, per quanto rapidamente. Il pulsante attende tre caratteri e spiega perché; scegliere un'altra attività cancella l'ultima risposta. I commenti elencati in fondo vengono riletti dopo ciascuno." }
  - { text: Add the comment, translation: Aggiungi il commento }
  - { text: Write three characters or more., translation: Scrivi tre o più caratteri. }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        one: "Il commento {$id} è il primo dell'attività {$title}."
        other: "Commento {$id} aggiunto a {$title}, che ora ha {$count} commenti."
  - { text: Row actions on a table, translation: Azioni di riga in una tabella }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "Ogni attività di TEL-42 offre tre pulsanti, ciascuno sostituito dalla sua risposta una volta premuto. Avvia agisce subito, solo su un'attività ancora da fare. Chiudi chiede prima conferma, e non è offerto su un'attività conclusa. Assegna apre una finestra di dialogo per l'e-mail, che la riga non fornisce, e mostra il rifiuto del server sul suo campo." }
  - { text: Number, translation: Numero }
  - { text: Start, context: verb, translation: Avvia }
  - { text: Closed, translation: Chiusa }
  - { text: Close this task?, translation: Chiudere questa attività? }
  - { text: Already started., translation: Già avviata. }
  - { text: Already finished., translation: Già conclusa. }
  - { text: Assign, translation: Assegna }
  - { text: "{$title} is assigned to {$assignee}.", translation: "Attività {$title} assegnata a {$assignee}." }
  - { text: "Task {$id} is unchanged.", translation: "L'attività {$id} non è cambiata." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: Azioni di riga in un elenco }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "Gli ultimi commenti, un elenco disegnato da un lettore, con quelli fissati per primi. Fissa agisce subito su un commento non ancora fissato, Elimina chiede prima conferma, e Modifica chiede il nuovo testo in una finestra di dialogo; lasciarlo vuoto viene rifiutato sul suo campo. L'elenco viene riletto dopo ciascuna azione." }
  - { text: Latest comments, translation: Ultimi commenti }
  - { text: Pin, translation: Fissa }
  - { text: Already pinned., translation: Già fissato. }
  - { text: Delete this comment?, translation: Eliminare questo commento? }
  - { text: Rewrite this comment?, translation: Riscrivere questo commento? }
  - { text: More places a success goes, translation: Altri posti dove porta un successo }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "La prima aggiunge un'attività e si sposta alla pagina delle tabelle, un indirizzo scritto nel manifest. La seconda risponde con l'indirizzo del manuale, un file che il server serve sotto il punto di montaggio, che è un normale caricamento. La terza risponde con il mirror del team, un indirizzo che un browser legge come un altro host: non porta da nessuna parte, e la risposta lo dice." }
  - { text: Add it and open the tables, translation: Aggiungi e apri le tabelle }
  - { text: Open the handbook, translation: Apri il manuale }
  - { text: Open the mirror, translation: Apri il mirror }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "La risposta era {$mirror}, che non è un indirizzo a cui andare, quindi la pagina resta." }
  - { text: "Refused, and unanswered", translation: "Rifiutato, e senza risposta" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "Mettere in pausa un progetto spetta solo a un manager. Senza sessione la guardia risponde 401. Con l'accesso effettuato nella pagina Dati come james@northwind.example, che non è un manager, la route risponde 403 senza corpo; con l'accesso come ada@northwind.example, mette in pausa il progetto, e rifiuta, nella lingua della pagina, un progetto che non è in corso. L'albero di errore predefinito dell'azione disegna ogni rifiuto." }
  - { text: Pause the project, translation: Metti in pausa il progetto }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "{$code} non è in corso, quindi non può essere messo in pausa." }
  - { text: "{$name} is paused.", translation: "{$name} è in pausa." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "Questa route rimanda ogni richiesta a sé stessa, quindi il browser rinuncia e non arriva alcuna risposta. L'albero di errore lo dice: l'errore non ha alcuno stato." }
  - { text: Call a route that never answers, translation: Chiama una route che non risponde mai }
  - { text: "The route answered, with the status", translation: "La route ha risposto, con lo stato" }
  - { text: "No answer arrived, so there is no status.", translation: "Non è arrivata alcuna risposta, quindi non c'è alcuno stato." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: "Azioni di riga che leggono l'indirizzo" }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "La tabella elenca le attività del progetto indicato dall'indirizzo, e Sposta porta un'attività allo stato indicato dall'indirizzo, letto dalla query della tabella al momento della pressione. La riga e l'indirizzo vincolano ogni campo dello spostamento, quindi la sua finestra di dialogo non chiede nulla ed è una semplice conferma. Scegli un progetto e uno stato:" }
  - { text: TEL-42 into review, translation: TEL-42 in revisione }
  - { text: APP-5 to finished, translation: APP-5 come conclusa }
  - { text: OPS-7 back to in progress, translation: OPS-7 di nuovo in corso }
  - { text: Neither, translation: Nessuno }
  - { text: Moved to, translation: Spostata in }
  - { text: Move this task to the status the address names?, translation: "Spostare questa attività allo stato indicato dall'indirizzo?" }
  - { text: Choose a status above first., translation: Prima scegli uno stato qui sopra. }

  # Components.
  - { text: A component on the page, translation: Un componente nella pagina }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "Un componente scritto in TSX e fornito da una libreria di questo esempio, collocato con proprietà fisse. Usa tutto ciò che l'host gli offre: mostra dove si trova la pagina, conserva nell'indirizzo quale pannello è aperto, passa a un'altra pagina tramite navigate e tramite un link da href, e un indirizzo https gli viene rifiutato. Legge lo stato di TEL-42 e aggiunge un'attività con fetch, segnala che le attività sono cambiate con notifyChanged — così la tabella qui sotto viene riletta — e conta ogni modifica di cui viene a sapere con onChanged, comprese le modifiche e le eliminazioni della tabella stessa. Un'attività che aggiunge viene annunciata in un livello proprio nell'angolo della pagina." }
  - { text: A component in a cell, translation: Un componente in una cella }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "La colonna della priorità è disegnata da un componente che riceve la priorità di ogni riga e se l'attività è bloccata. La tabella elenca le attività di TEL-42 dalla stessa collezione in cui scrive il componente, quindi viene riletta quando sopra si aggiunge un'attività; le sue modifiche ed eliminazioni vengono recepite dal componente." }
  - { text: Its stylesheet, translation: Il suo foglio di stile }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "I sorgenti dei componenti importano un foglio di stile proprio, che l'applicazione colloca nel livello telo.component: dopo il tema e il marchio, prima del foglio di stile dell'applicazione. Ogni valore al suo interno legge un token di design, quindi il pannello e l'indicatore assumono l'aspetto di ogni punto di montaggio." }

  # CRUD.
  - { text: A generated admin screen, translation: Una schermata di amministrazione generata }
  - { text: "One declaration over the tasks model the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the model, so the screen offers exactly what the API accepts.", translation: "Un'unica dichiarazione sul modello delle attività da cui è servita l'API: una barra dei filtri, una tabella ordinabile e paginata, un modulo per aggiungere un'attività e uno per modificarla, e un'eliminazione con conferma su ogni riga. Le colonne, i campi e i filtri derivano tutti dal modello, quindi la schermata offre esattamente ciò che l'API accetta." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "La barra sta accanto alla tabella sul bordo finale e mostra solo i filtri che scegli, ciascuno come un chip che apre il suo controllo. Conserva la scelta in questo browser sotto la chiave aside — la chiave della barra accanto alla tabella nella pagina Filtri, quindi un filtro scelto in una delle due pagine è scelto in entrambe." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "Una nuova attività si apre in un cassetto dal bordo finale e resta aperta, svuotata, per la successiva. Un'attività si modifica in un pannello accanto all'elenco, che fa parte dell'indirizzo, e uscirne con dati non salvati chiede prima conferma." }

  # Themes.
  - { text: Four mounts of one design, translation: Quattro punti di montaggio di un unico design }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "Le stesse pagine sono servite quattro volte, e ogni applicazione nomina il proprio tema, marchio e navigazione. Le pagine sono un unico insieme di viste, collocate per riferimento da tutte e quattro, quindi cambiano solo l'aspetto e la navigazione." }
  - { text: At the root, translation: Alla radice }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "L'aspetto integrato, con sopra il foglio di stile proprio di questo esempio, e un marchio scelto a ogni richiesta: il set di token Acme quando un cookie lo chiede, altrimenti i valori propri del tema." }
  - { text: Under /radix, translation: Sotto /radix }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Il tema Radix: il suo foglio di stile e i suoi tredici controlli — gli elenchi di scelta, le finestre di dialogo, i cassetti, i popover, i menu e i tooltip — con il marchio lasciato al tema." }
  - { text: Under /brand, translation: Sotto /brand }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "Un tema proprio di questo esempio: i controlli di Radix sotto un foglio di stile scritto qui, con valori di token propri. Il marchio dell'applicazione è un unico set di token, che fornisce il carattere tipografico Inter nominato dal tema." }
  - { text: Under /sidebar, translation: Sotto /sidebar }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "L'aspetto integrato con la navigazione in una barra laterale accanto alla pagina, che si riduce a una striscia e ricorda i gruppi aperti. Su un telefono diventa una barra di schede lungo il bordo inferiore." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "Un link si risolve sotto il punto di montaggio in cui è disegnato, quindi i link tra i punti di montaggio e il selettore del marchio sono nella pagina Temi dell'applicazione alla radice." }
  - { text: Every design token, translation: Ogni token di design }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "Ogni token dell'insieme chiuso così come lo forniscono il tema e il marchio di questa pagina, letto dalla proprietà personalizzata su cui il renderer lo proietta, con un campione disegnato con esso. Apri un altro punto di montaggio, o cambia il marchio alla radice, e i valori cambiano." }
  - { text: Typefaces, translation: Caratteri tipografici }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "I caratteri del testo e dei titoli in ciascuno dei loro quattro stili, e per ogni stile se questa applicazione lo serve. Sotto /brand sono gli stili normale, grassetto, corsivo e grassetto corsivo di Inter, forniti con l'esempio e serviti con la pagina; gli altri due punti di montaggio non ne servono nessuno e usano i caratteri del visitatore." }
  - { text: Switch the mount or the brand, translation: Cambia punto di montaggio o marchio }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "Questi link appartengono a questa applicazione: un link si risolve sotto il punto di montaggio in cui è disegnato, quindi solo l'applicazione alla radice raggiunge gli altri due. Ciascuno è un normale caricamento di un'altra applicazione." }
  - { text: Open the Radix mount, translation: Apri il punto di montaggio Radix }
  - { text: Open the brand mount, translation: Apri il punto di montaggio del marchio }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "Il marchio di questa applicazione è scelto a ogni richiesta. Il selettore imposta o cancella un cookie e torna qui, e finché il cookie c'è viene usato il set di token Acme al posto dei valori propri del tema." }
  - { text: Use the Acme brand, translation: Usa il marchio Acme }
  - { text: "Use the theme's own values", translation: Usa i valori propri del tema }

