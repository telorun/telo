kind: Telo.Application
metadata:
  name: TodoApp
  version: 1.0.0
  categories: [ Transport, Storage ]
  description: |
    A complete app served as one unit: the REST todo API and the vanilla HTML/JS
    frontend that consumes it (`Http.Static`), on a single port. The whole REST
    surface is one declarative `Crud.Resource` — list / read / create / update /
    delete over the `todos` table — mounted alongside the static frontend.

    Run, then open http://localhost:8077.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.24.0#sha256-9smTNeAG3kqd69fqYtTC5K1QKSCogC3WA_DnVIUVV8g
  Sql: oci://ghcr.io/telorun/sql@0.20.0#sha256-PjJyQ7cexRT1y35y0U7YSpMnf8T1Wh3DRrbHU-nyR3k
  SQLite: oci://ghcr.io/telorun/sql-sqlite@0.7.0#sha256-0Yg6NzMGDXyPRnbRLMrEwsF10MKHMZyO1mirH3frvRI
  Crud: oci://ghcr.io/telorun/crud@0.9.0#sha256-mhAY-K234E-y-ROkKtHxIjwKHlHVfkyjq8N-fvC2CYY
targets:
  - !ref Migrate
  - !ref Server
files:
  - public/app.js
  - public/index.html
  - public/style.css
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8077
---
kind: SQLite.Connection
metadata:
  name: Db
file: ./todo.db
---
kind: Sql.Migrations
metadata:
  name: Migrate
connection: !ref Db
migrations:
  0001_create_todos:
    statement: |
      CREATE TABLE IF NOT EXISTS todos (
        id         INTEGER PRIMARY KEY AUTOINCREMENT,
        text       TEXT    NOT NULL,
        is_done    BOOLEAN NOT NULL DEFAULT FALSE,
        created_at DATETIME DEFAULT CURRENT_TIMESTAMP
      )
---
kind: Http.Server
metadata:
  name: Server
port: !cel "ports.http"
logger: true
openapi:
  info:
    title: Todo API
    version: 1.0.0
mounts:
  - path: /api/todos
    mount:
      kind: Crud.Resource
      connection: !ref Db
      plural: todos
      singular: todo
      model:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [ text ]
          additionalProperties: false
          properties:
            text: { type: string, minLength: 1 }
            isDone: { type: boolean }

  - path: /
    mount: !ref Ui
---
kind: Http.Static
metadata:
  name: Ui
root: ./public
