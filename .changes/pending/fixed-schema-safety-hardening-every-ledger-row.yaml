modules:
  modules/sql: Fixed
  modules/postgres: Fixed
  modules/sqlite: Fixed
body: Schema safety hardening. Every ledger row is now scoped to the schema resource
  that wrote it, so a namespace reached by two schema resources keeps two independent
  sets of objects, clocks and migration histories — previously the second boot recorded
  its own declaration as the whole truth and would tombstone, then drop, the other
  owner's tables. A primary key or identity column is non-nullable whether or not the
  declaration says so, which stops every boot after the first planning a DROP NOT NULL
  on a key. A tombstoned object the engine cannot drop is reported with a reason instead
  of attempted, since attempting it would fail that boot and every boot after it. A
  rename that changes the column's type is refused with the reason rather than reaching
  the engine as a raw assignment error or, on SQLite, silently storing unconverted
  values. Declarations that cannot mean anything are refused at resource creation,
  naming the field.
