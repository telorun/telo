kind: Telo.Application
metadata:
  name: GraphLayersDraftsSqliteLayeredSuite
  version: 1.0.0
  description: |
    The layered graph suite on an in-memory SQLite database, over seven drafted
    stores used outside any draft: every behaviour the base level of the
    contract promises holds over the published state of a drafted layer.
include:
  - ./__fixtures__/suite-model.yaml
imports:
  Suite:
    source: ../../graph-layers/tests/__fixtures__/layered-suite
    resources:
      base: !ref base
      middle: !ref middle
      side: !ref side
      top: !ref top
      left: !ref left
      right: !ref right
      apex: !ref apex
      person: !ref person
      document: !ref document
      knows: !ref knows
      authored: !ref authored
      refreshStacks: !ref refreshStacks
  SQLite: ../../sqlite
  Layers: ../
  Run: ../../run
targets:
  - !ref appSchema
  - !ref Suite.overlay
  - !ref Suite.writes
  - !ref Suite.relationships
  - !ref Suite.traversals
  - !ref Suite.deletions
  - !ref Suite.retractions
  - !ref Suite.diamond
  - !ref Suite.paging
  - !ref Suite.defaults
---
# A drafted store reads its bases live, so there is nothing to bring up to date.
kind: Run.Sequence
metadata: { name: refreshStacks }
steps:
  - name: nothing
    value: !cel "true"
