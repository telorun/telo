kind: Telo.Library
metadata:
  name: CRUD
  version: 0.33.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Storage, Data]
  description: >-
    Serves a REST API over a database table from one declaration: paginated
    lists with cursor paging and a total count, filtering, sorting and
    per-value counts limited to what the data model declares, plus read one,
    create, update and delete in parameterized SQL. Each operation has its own
    record shape, and the model is checked against the table's columns,
    primary key and foreign keys before the app runs.
requires:
  # 0.122.0 refuses the reader's `throws:` `displayMessage` as SCHEMA_VIOLATION
  # (verified by execution); 0.125.1 reads and runs this file.
  telo: ">=0.123.0"
imports: { Http: ../http-server, Sql: ../sql, DataModel: ../data-model }
exports: { kinds: [Collection, Api] }
---
# The rules below are mirrored by `shapeProblems` and `tableProblems` in
# `nodejs/src/collection-controller.ts`: keep the two alike. The filter, sort,
# facet and relation rules are inherited from `DataModel.Collection`.
kind: Telo.Definition
metadata:
  name: Collection
  description: >-
    Records stored in one database table: the record shape and the filters,
    sorts and facets a list accepts, one shape per write and per list row, and
    relations to other collections. Refuses, before the app runs and at start, a
    property with no column, a key that is not the primary key, and a relation
    its column's foreign key contradicts.
capability: Telo.Provider
extends: DataModel.Collection
controllers: [pkg:telo/local/js?path=./nodejs/crud.mjs&local_path=./nodejs/src/index.ts#CollectionController]
schema:
  type: object
  required: [schemas, table]
  examples:
    - model: !ref Todo
      table: !ref todosTable
      schemas: { list: !ref Todo, create: !ref TodoDraft, update: !ref TodoDraft }
      query:
        filters: [{ property: text, operator: contains }, { property: isDone, operator: eq }]
        sort: [{ property: text }]
  properties:
    key:
      title: Key
      description: The property identifying a record. Always `id`, the table's primary key.
      type: string
      const: id
      default: id
    table:
      title: Table
      description: >-
        The table the records are stored in. A property is stored in the
        snake_case column of its name (`dueOn` in `due_on`).
      x-telo-ref: { kind: Sql.Table, use: dependency }
    schemas:
      title: Schemas
      description: The record shape of each operation other than a read, which is `model`.
      type: object
      additionalProperties: false
      required: [list, create, update]
      properties:
        list:
          title: List
          description: One row of the list, `id` included.
          x-telo-ref: { kind: Telo.Type, use: schema }
        create:
          title: Create
          description: The body that creates a record, without `id`.
          x-telo-ref: { kind: Telo.Type, use: schema }
        update:
          title: Update
          description: The body that updates a record, without `id`. The properties it declares are the ones an update replaces.
          x-telo-ref: { kind: Telo.Type, use: schema }
  x-telo-resource-rules:
    - resolve: [/schemas/list, /schemas/create, /schemas/update]
      in: /schemas
      condition: !cel >-
        key != 'list'
        || (has(this.schema.properties) && 'id' in this.schema.properties
            && has(this.schema.required) && 'id' in this.schema.required)
      code: CRUD_COLLECTION_KEY_UNDECLARED
      message: >-
        does not declare a required `id`. Every row read carries its key: add
        `id` to this shape's properties and to its `required`.
    - resolve: [/schemas/list, /schemas/create, /schemas/update]
      in: /schemas
      condition: !cel >-
        !(key in ['create', 'update'])
        || !has(this.schema.properties) || !('id' in this.schema.properties)
      code: CRUD_COLLECTION_KEY_WRITABLE
      message: >-
        declares `id`. The key is assigned by the table and named by the URL:
        remove it from this shape.
    - resolve: [/schemas/list, /schemas/create, /schemas/update]
      in: /schemas
      condition: !cel >-
        !(key in ['create', 'update'])
        || (has(this.schema.additionalProperties) && this.schema.additionalProperties == false)
      code: CRUD_COLLECTION_WRITE_SHAPE_OPEN
      message: >-
        accepts properties it does not declare. A write body names columns: set
        `additionalProperties: false` on this shape.
    - resolve: [/model, /schemas/list, /schemas/create, /schemas/update]
      in: /schemas
      condition: !cel >-
        !has(this.schema.properties)
        || (has(self.model.schema.properties)
            ? this.schema.properties.all(p, p in self.model.schema.properties)
            : size(this.schema.properties) == 0)
      code: CRUD_COLLECTION_PROPERTY_NOT_READABLE
      message: >-
        declares a property `model` does not. Every property of a record is one
        a read returns: add it to `model`, or remove it here.
    # Compared with `null` aside, where both shapes declare a type.
    - resolve: [/model, /schemas/list, /schemas/create, /schemas/update]
      in: /schemas
      condition: !cel >-
        !has(this.schema.properties) || !has(self.model.schema.properties)
        || this.schema.properties.all(p,
             !(p in self.model.schema.properties)
             || !('type' in this.schema.properties[p])
             || !('type' in self.model.schema.properties[p])
             || (type(this.schema.properties[p].type) == string
                   ? [this.schema.properties[p].type]
                   : this.schema.properties[p].type).filter(t, t != 'null')
                == (type(self.model.schema.properties[p].type) == string
                      ? [self.model.schema.properties[p].type]
                      : self.model.schema.properties[p].type).filter(t, t != 'null'))
      code: CRUD_COLLECTION_PROPERTY_TYPE_DIFFERS
      message: >-
        types a property differently from `model`. One column has one type:
        declare the same one in both shapes.
    - resolve: [/model, /schemas/update]
      condition: !cel >-
        !has(self.schemas.update.schema.required) || !has(self.model.schema.properties)
        || self.schemas.update.schema.required.all(r,
             !(r in self.model.schema.properties)
             || (has(self.model.schema.required) && r in self.model.schema.required))
      code: CRUD_COLLECTION_UPDATE_REQUIRES_OPTIONAL
      message: >-
        requires in `schemas.update` a property `model` leaves optional, so a
        record read without it could not be sent back. Require it in `model`
        too, or make it optional in `schemas.update`.
    - resolve: [/model, /table]
      condition: !cel >-
        !has(self.model.schema.properties)
        || self.model.schema.properties.all(p,
             has(self.table.columns) && lower(regexReplace(p, '([A-Z])', '_$1')) in self.table.columns)
      code: CRUD_COLLECTION_PROPERTY_UNKNOWN_COLUMN
      message: >-
        declares a `model` property `table` has no column for. A property is
        stored in the snake_case column of its name: add the column to the
        table, or remove the property.
    - resolve: [/table]
      condition: !cel >-
        has(self.table.columns) && 'id' in self.table.columns
        && self.table.columns['id'].?primaryKey.orValue(false) == true
      code: CRUD_COLLECTION_TABLE_KEY_NOT_PRIMARY
      message: >-
        stores its records in a table whose primary key is not `id`. A record is
        addressed by `id`: declare the column `id` with `primaryKey: true`.
    # Judged only where the target's table names a physical table and a foreign
    # key covers the column, position by position — the physical tables
    # compared, as the controller compares them.
    - resolve: [/table, /table/foreignKeys/*/references/table, /relations/*/collection/table]
      in: /relations
      condition: !cel >-
        !has(this.collection.table) || !has(this.collection.table.table) || !has(self.table.foreignKeys)
        || cel.bind(column, lower(regexReplace(key, '([A-Z])', '_$1')),
           cel.bind(target, lower(regexReplace(has(this.collection.key) ? this.collection.key : 'id', '([A-Z])', '_$1')),
             self.table.foreignKeys.all(n, cel.bind(fk, self.table.foreignKeys[n],
               !(column in fk.columns)
               || (fk.references.table.?table.orValue('') == this.collection.table.table
                   && range(size(fk.columns)).all(i,
                        fk.columns[i] != column
                        || (i < size(fk.references.columns) && fk.references.columns[i] == target)))))))
      code: CRUD_COLLECTION_RELATION_FOREIGN_KEY_MISMATCH
      message: >-
        contradicts the foreign key on its column: the key references another
        table, or another column than the target's key. Make the foreign key
        reference the target's table and key column, or relate the property to
        the collection the foreign key names.
---
kind: Telo.Definition
metadata:
  name: Api
  description: >-
    Mounts a REST API over one collection's table. The list route pages with an
    opaque cursor and answers rows, a total and the next cursor, filtering and
    sorting only by declared pairs, and a facet request answers each present
    value of a property with its count. Create and update validate bodies
    against their shapes and answer with the stored record; read and delete
    address one record by key.
capability: Telo.Mount
schema:
  type: object
  additionalProperties: false
  required: [connection, collection, singular, plural]
  examples:
    - { connection: !ref db, singular: todo, plural: todos, collection: !ref todos }
  properties:
    connection:
      title: Connection
      description: The SQL connection the routes run against.
      x-telo-ref: { kind: Sql.Connection, use: dependency }
    singular:
      title: Singular name
      description: >-
        Singular noun for one item (`todo`). Defaults the id path parameter to
        `<singular>Id` and names the per-item OpenAPI operations.
      type: string
    plural:
      title: Plural name
      description: Plural noun for the collection (`todos`). Names the list operation and the OpenAPI tag.
      type: string
    idParam:
      title: Id path parameter
      description: >-
        Name of the `{…}` path parameter identifying one item. Defaults to
        `<singular>Id` (`/todos/{todoId}`); the key column stays `id`.
      type: string
    collection:
      title: Collection
      description: >-
        The records served: their table, the shape of each operation, and the
        filters, sorts and facets the list route accepts. Feeds the generated
        OpenAPI.
      x-telo-ref: { kind: Self.Collection, use: dependency }
mount: !ref api
resources:
  # The crud-internal handlers below, each given its own operation's shape; the
  # by-id reader accepts the key alone, and both writes answer with the record
  # as read.
  - kind: Self.Reader
    metadata: { name: lister }
    connection: !cel "self.connection"
    table: !cel "self.collection.table.table"
    model: !cel "self.collection.model"
    row: !cel "self.collection.schemas.list"
    query: !cel "self.collection.query"
  - kind: Self.Reader
    metadata: { name: reader }
    connection: !cel "self.connection"
    table: !cel "self.collection.table.table"
    model: !cel "self.collection.model"
    row: !cel "self.collection.model"
    query:
      filters: [{ property: id, operator: eq }]
      sort: []
  - kind: Self.Creator
    metadata: { name: creator }
    connection: !cel "self.connection"
    table: !cel "self.collection.table.table"
    model: !cel "self.collection.schemas.create"
    record: !cel "self.collection.model"
  - kind: Self.Updater
    metadata: { name: updater }
    connection: !cel "self.connection"
    table: !cel "self.collection.table.table"
    model: !cel "self.collection.schemas.update"
    record: !cel "self.collection.model"
  - kind: Self.Deleter
    metadata: { name: deleter }
    connection: !cel "self.connection"
    table: !cel "self.collection.table.table"

  # The id path parameter's VALUE is read request-side as the sole path param
  # (`values(request.params)[0]`), since no expression may mix `self` with
  # `request`.
  - kind: Http.Api
    metadata: { name: api }
    # A query the reader refuses is a 400 problem, its issues pointing into the
    # request's query.
    catches:
      - when: !cel "problem.code == 'ERR_CRUD_QUERY_INVALID'"
        status: 400
        content:
          application/problem+json:
            body:
              type: !cel "problem.type"
              title: !cel "problem.title"
              status: !cel "problem.status"
              detail: !cel "problem.detail"
              code: !cel "problem.code"
              data:
                issues: !cel "problem.data == null ? [] : problem.data.issues.map(i, {'pointer': '/query' + i.pointer, 'keyword': i.keyword, 'params': i.params})"
    routes:
      # One page of rows, or of a property's present values when `facet` names
      # it. Every other query key is a filter (`<property>` for equality); keys
      # beginning `_telo` belong to whoever renders the collection.
      - operationId: !cel "'list' + self.plural.substring(0,1).upperAscii() + self.plural.substring(1)"
        summary: !cel "'List ' + self.plural"
        tags: !cel "[self.plural]"
        request:
          method: GET
          path: /
          schema:
            query:
              type: object
              additionalProperties: true
              properties:
                limit: { type: integer, minimum: 1, maximum: 100, default: 25, description: "Rows or values to return." }
                cursor: { type: string, description: "The `next` of a previous response, passed back unchanged." }
                sort: { type: string, description: "One property the collection sorts by; `-` before it for descending. `id` order when absent." }
                facet: { type: string, description: "A property the collection facets. Answers its present values with counts instead of rows." }
        handler: !ref lister
        inputs:
          # A key with no `.` carries no operator, which is equality.
          filters: !cel >-
            keys(request.query)
            .filter(k, !(k in ['limit', 'cursor', 'sort', 'facet']) && !k.startsWith('_telo'))
            .map(k, k.contains('.')
              ? {
                  'property': k.substring(0, k.lastIndexOf('.')),
                  'operator': k.substring(k.lastIndexOf('.') + 1),
                  'value': request.query[k]
                }
              : {'property': k, 'value': request.query[k]})
          sort: !cel >-
            ('sort' in request.query ? request.query.sort.split(',') : [])
            .map(s, {
              'property': s.startsWith('-') ? s.substring(1) : s,
              'direction': s.startsWith('-') ? 'desc' : 'asc'
            })
          facet: !cel "'facet' in request.query ? request.query.facet : null"
          limit: !cel "request.query.limit"
          cursor: !cel "'cursor' in request.query ? request.query.cursor : null"
        returns:
          - status: 200
            content:
              application/json:
                body: !cel "result"
                # One object for both answers: the response serializer reads a
                # union's branches with a validator that refuses an int64.
                schema:
                  type: object
                  required: [next]
                  properties:
                    rows:
                      type: array
                      description: "A list's page of rows; absent from a facet answer."
                      items: !cel "self.collection.schemas.list.schema"
                    total: { type: integer, description: "How many rows the filters match, whatever the page; absent from a facet answer." }
                    values:
                      type: array
                      description: "A facet answer's page of present values, in value order, each with how many matching rows hold it; absent from a list."
                      items:
                        type: object
                        required: [value, count]
                        properties: { value: {}, count: { type: integer } }
                    next: { type: [string, "null"], description: "The cursor of the following page; null on the last one." }

      # Read one row by id.
      - operationId: !cel "'get' + self.singular.substring(0,1).upperAscii() + self.singular.substring(1)"
        summary: !cel "'Get a ' + self.singular"
        tags: !cel "[self.plural]"
        request:
          method: GET
          path: !cel "'/{' + (('idParam' in self) ? self.idParam : self.singular + 'Id') + '}'"
          schema:
            params:
              type: object
              required:
                - !cel "('idParam' in self) ? self.idParam : self.singular + 'Id'"
              properties: !cel "{(('idParam' in self) ? self.idParam : self.singular + 'Id'): self.collection.model.schema.properties.id}"
        handler: !ref reader
        inputs:
          filters:
            - property: id
              value: !cel "values(request.params)[0]"
          limit: 1
        returns:
          - status: 200
            when: !cel "size(result.rows) > 0"
            content:
              application/json:
                body: !cel "result.rows[0]"
                schema: !cel "self.collection.model.schema"
          - { status: 404, content: { application/json: { body: { error: not_found } } } }

      # Create a row from the JSON body, validated against the create shape, and
      # answer with the record as stored.
      - operationId: !cel "'create' + self.singular.substring(0,1).upperAscii() + self.singular.substring(1)"
        summary: !cel "'Create a ' + self.singular"
        tags: !cel "[self.plural]"
        request:
          method: POST
          path: /
          schema:
            body: !cel "self.collection.schemas.create.schema"
        handler: !ref creator
        inputs:
          data: !cel "request.body"
        returns:
          - status: 201
            content:
              application/json:
                body: !cel "result"
                schema: !cel "self.collection.model.schema"

      # Replace what the update shape declares: a property of it the body leaves
      # out is cleared, every other column keeps its value.
      - operationId: !cel "'update' + self.singular.substring(0,1).upperAscii() + self.singular.substring(1)"
        summary: !cel "'Replace a ' + self.singular"
        tags: !cel "[self.plural]"
        request:
          method: PUT
          path: !cel "'/{' + (('idParam' in self) ? self.idParam : self.singular + 'Id') + '}'"
          schema:
            params:
              type: object
              required:
                - !cel "('idParam' in self) ? self.idParam : self.singular + 'Id'"
              properties: !cel "{(('idParam' in self) ? self.idParam : self.singular + 'Id'): self.collection.model.schema.properties.id}"
            body: !cel "self.collection.schemas.update.schema"
        handler: !ref updater
        inputs:
          id: !cel "values(request.params)[0]"
          data: !cel "request.body"
        returns:
          - status: 200
            when: !cel "result.rowCount > 0"
            content:
              application/json:
                body: !cel "result.row"
                schema: !cel "self.collection.model.schema"
          - { status: 404, content: { application/json: { body: { error: not_found } } } }

      # Delete a row by id.
      - operationId: !cel "'delete' + self.singular.substring(0,1).upperAscii() + self.singular.substring(1)"
        summary: !cel "'Delete a ' + self.singular"
        tags: !cel "[self.plural]"
        request:
          method: DELETE
          path: !cel "'/{' + (('idParam' in self) ? self.idParam : self.singular + 'Id') + '}'"
          schema:
            params:
              type: object
              required:
                - !cel "('idParam' in self) ? self.idParam : self.singular + 'Id'"
              properties: !cel "{(('idParam' in self) ? self.idParam : self.singular + 'Id'): self.collection.model.schema.properties.id}"
        handler: !ref deleter
        inputs:
          filters:
            id: !cel "values(request.params)[0]"
        returns:
          - status: 204
            when: !cel "result.rowCount > 0"
          - { status: 404, content: { application/json: { body: { error: not_found } } } }
---
# Crud-internal handlers, not exported. They render through the connection's
# dialect; the reader's contract names properties and operators, never
# query-string keys, so the route's `inputs:` is what knows HTTP.
kind: Telo.Definition
metadata:
  name: Reader
  description: >-
    Reads a database table as a collection, one page at a time: rows matching a
    list of property filters, ordered by one property with nulls last, after an
    opaque cursor, with the count of every match; or one property's present
    values, each with its count. Refuses a request using a filter, sort or
    facet it was not configured to accept.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/crud.mjs&local_path=./nodejs/src/index.ts#ReaderController]
throws:
  codes:
    ERR_CRUD_QUERY_INVALID:
      description: >-
        The request asks for something the reader does not accept: a filter
        whose property and operator are not a declared pair, a sort or facet by
        a property not declared for it, a value not of the property's type, a
        limit outside 1–100, more than one sort property, a sort beside a facet,
        or a cursor that is malformed or was issued for another request. Carries
        `issues`, one `{ pointer, keyword, params }` per refused parameter, its
        pointer naming the parameter (`/sort`, `/title.contains`).
      displayMessage: "The list request is not valid."
      data:
        type: object
        additionalProperties: false
        required: [issues]
        properties:
          issues:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [pointer, keyword, params]
              properties:
                pointer: { type: string, description: "A JSON Pointer naming the refused parameter." }
                keyword: { type: string, description: "The issue keyword: a JSON Schema keyword, or `invalid`." }
                params: { type: object, description: "The facts the keyword is worded from." }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      filters:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [property, value]
          properties:
            property: { type: string }
            # Absent for equality. Left open so an undeclared one is refused
            # with the rest of the request.
            operator: { type: string }
            # Of the property's type, or its text; a list for `in`; `true` /
            # `false` for `absent`.
            value: {}
      sort:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [property]
          properties: { property: { type: string }, direction: { enum: [asc, desc], default: asc } }
      # Names the property whose present values are asked for instead of rows.
      facet: { type: [string, "null"] }
      limit: { type: integer }
      cursor: { type: [string, "null"] }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [next]
    anyOf:
      - { required: [rows, total] }
      - { required: [values] }
    properties:
      rows: { type: array, items: { type: object } }
      total: { type: integer }
      values:
        type: array
        items:
          type: object
          required: [value, count]
          properties: { value: {}, count: { type: integer } }
      next: { type: [string, "null"] }
schema:
  type: object
  additionalProperties: false
  required: [connection, table, model, row, query]
  properties:
    connection: { x-telo-ref: { kind: Sql.Connection, use: dependency } }
    table: { type: string }
    # The types of the values a request filters by.
    model: { x-telo-ref: { kind: Telo.Type, use: schema } }
    # What a request may filter, sort and facet by: nothing else is accepted.
    query:
      type: object
      additionalProperties: false
      required: [filters, sort]
      properties:
        filters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [property, operator]
            properties:
              property: { type: string }
              operator: { enum: [eq, contains, gt, gte, lt, lte, in, absent] }
        sort:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [property]
            properties: { property: { type: string } }
        facets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [property]
            properties: { property: { type: string } }
    # What a returned row holds.
    row: { x-telo-ref: { kind: Telo.Type, use: schema } }
---
kind: Telo.Definition
metadata:
  name: Creator
  description: >-
    Internal handler behind the create route: inserts one row from a validated
    record, naming only the columns its shape declares, in one parameterized
    INSERT. Returns the stored record, with its key and every value the table
    filled in.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/crud.mjs&local_path=./nodejs/src/index.ts#CreatorController]
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [data]
    properties:
      # The record, by property name.
      data: { type: object }
outputType: { kind: Telo.JsonSchema, schema: { type: object } }
schema:
  type: object
  additionalProperties: false
  required: [connection, table, model, record]
  properties:
    connection: { x-telo-ref: { kind: Sql.Connection, use: dependency } }
    table: { type: string }
    # The columns a record may set.
    model: { x-telo-ref: { kind: Telo.Type, use: schema } }
    # What the stored record is answered as.
    record: { x-telo-ref: { kind: Telo.Type, use: schema } }
---
kind: Telo.Definition
metadata:
  name: Updater
  description: >-
    Internal handler behind the update route: replaces what its shape declares
    of one row. Each of those columns is set, to the value the record holds or
    to NULL where it holds none, in one parameterized UPDATE filtered by the
    item's id; no other column is touched. Returns the stored record and the
    number of rows replaced, zero when the id names no row.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/crud.mjs&local_path=./nodejs/src/index.ts#UpdaterController]
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [id, data]
    properties:
      id: {}
      # The record, by property name.
      data: { type: object }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [rowCount]
    properties:
      rowCount: { type: integer }
      # Absent when the id names no row.
      row: { type: object }
schema:
  type: object
  additionalProperties: false
  required: [connection, table, model, record]
  properties:
    connection: { x-telo-ref: { kind: Sql.Connection, use: dependency } }
    table: { type: string }
    # The columns a record replaces.
    model: { x-telo-ref: { kind: Telo.Type, use: schema } }
    # What the stored record is answered as.
    record: { x-telo-ref: { kind: Telo.Type, use: schema } }
---
kind: Telo.Definition
metadata:
  name: Deleter
  description: >-
    Internal handler behind the delete route: runs a parameterized DELETE
    filtered by the item's id.
capability: Telo.Invocable
schema:
  type: object
  required: [connection, table]
  properties:
    connection: { x-telo-ref: { kind: Sql.Connection, use: dependency } }
    table: { type: string }
resources:
  - kind: Sql.Command
    metadata: { name: exec }
    connection: !cel "self.connection"
invoke: !ref exec
inputs:
  sql: !cel "'DELETE FROM ' + self.table + ' WHERE ' + join(keys(inputs.filters).map(k, lower(regexReplace(k, '([A-Z])', '_$1')) + ' = ?'), ' AND ')"
  bindings: !cel "keys(inputs.filters).map(k, inputs.filters[k])"
