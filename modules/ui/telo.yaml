kind: Telo.Library
metadata:
  name: Ui
  version: 0.7.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [UI]
  description: >-
    Declarative user interfaces written as data: pages built from layout, text,
    links and images, records read when a page opens with content shown by
    condition, data tables with sorting, paging and row actions, forms
    validated live against a data model with grouped fields, option lists and
    pickers read from an API, date ranges with presets and values kept between
    visits, filter bars, custom components and design tokens. A renderer turns
    the result into a web admin panel, dashboard or back-office screen without
    hand-written frontend code.
requires:
  # 0.120.1 refuses this file: it does not know `x-telo-context-eval` (an
  # unknown keyword in a context binding), the relative pointer of
  # `x-telo-context-element-from-item`, `x-telo-match-for` or format
  # `re2-pattern`. Field kinds also need what 0.121.0 adds: bindings typed by
  # the resource referencing them (`x-telo-context-from-referrer`), the members
  # a list's entries fill (`x-telo-context-item-fills`), the member form of
  # `x-telo-value-schema-from` and rules reading through several references
  # (`resolveSelf:`), and the text vocabulary its words and displayed texts
  # are written in (module `lang:`, the `Text` and `TextRecord` fragments,
  # `x-telo-text-values`). Verified by execution against 0.120.1.
  telo: ">=0.121.0"
lang: en
# The conformance rows a renderer's tests read: the interpreted profile's, and
# which control fits which property.
files:
  - conformance/match.json
  - conformance/control-fits.json
imports:
  Font: ../font
exports:
  kinds:
    - Words
    - Composite
    - Surface
    - Overlay
    - ViewportOverlay
    - Dialog
    - Drawer
    - Popover
    - InlineSurface
    - Panel
    - PageSurface
    - FilterPlacement
    - FoldingFilterPlacement
    - AbovePlacement
    - AsidePlacement
    - CollapsiblePlacement
    - OverlayPlacement
    - StateStore
    - LocalStore
    - SessionStore
    - NavigationPlacement
    - CompactNavigationPlacement
    - HeaderNavigation
    - SidebarNavigation
    - OverlayNavigation
    - TabBarNavigation
    - Icon
    - FileIcon
    - Page
    - View
    - Table
    - Form
    - Action
    - Filters
    - Collection
    - Component
    - ComponentExport
    - DesignTokens
    - Data
    - Field
    - InputField
    - ChoiceField
    - PickerField
    - DateRangeField
    - OptionSource
    - CollectionOptions
  resources:
    - words
    - BoundText
    - Match
    - Condition
    - Enablement
    - RequestError
    - QueryParameters
    - Control
    - FieldGroup
    - StateRecord
    - FieldAnswer
    - OptionSourceSpec
    - controlFits
    - RowAction
    - Node
    - SpecNode
    - OverlaySpec
    - SurfaceSpec
    - AfterCreate
    - AfterEdit
    - UnsavedInput
    - FilterPolicy
    - FilterPlacementSpec
    - StateStoreSpec
    - Navigation
    - NavigationItem
    - NavigationPlacementSpec
    - PageWidth
  # The entry point a renderer's controller bundle resolves `@telorun/ui` to:
  # how a built browser entry becomes the files a page loads, so a renderer
  # addresses its own entries exactly as a placed component's are addressed.
  code:
    - specifier: "@telorun/ui"
      format: js
      path: ./nodejs/ui.mjs
      source: ./nodejs/src/index.ts
---
# A text shown to a person, or a text with the values it is formatted with —
# each value a path into a root the place it is written binds, or a fixed one —
# so a heading over an answer ("3 unpaid items") is composed where it is drawn.
kind: Telo.JsonSchema
metadata:
  name: BoundText
schema:
  anyOf:
    - $ref: "telo://manifest#/$defs/Text"
      x-telo-text-values: {}
    - type: object
      additionalProperties: false
      required: [text, values]
      properties:
        text:
          title: Text
          description: The text, its placeholders and plural selectors named by `values`.
          $ref: "telo://manifest#/$defs/Text"
        values:
          title: Values
          description: >-
            A value for every placeholder and plural selector the text reads, by
            name: a path into a root in scope, or a fixed value.
          type: object
          x-telo-text-values-for: /text
          additionalProperties:
            x-telo-eval: accessor
---
# A condition's schema: one closed keyword set — the interpreted profile — that
# a renderer interprets as data for conditions and for live validation alike.
# What each keyword means is pinned by the rows in `conformance/match.json`.
kind: Telo.JsonSchema
metadata:
  name: Match
schema:
  type: object
  additionalProperties: false
  properties:
    type:
      anyOf:
        - $ref: "#/$defs/TypeName"
        - type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/$defs/TypeName" }
    const: {}
    enum: { type: array, minItems: 1 }
    not: { $ref: "#" }
    allOf: { type: array, minItems: 1, items: { $ref: "#" } }
    anyOf: { type: array, minItems: 1, items: { $ref: "#" } }
    required: { type: array, uniqueItems: true, items: { type: string } }
    properties:
      type: object
      additionalProperties: { $ref: "#" }
    items: { $ref: "#" }
    minItems: { type: integer, minimum: 0 }
    maxItems: { type: integer, minimum: 0 }
    uniqueItems: { type: boolean }
    minLength: { type: integer, minimum: 0 }
    maxLength: { type: integer, minimum: 0 }
    pattern: { type: string, format: re2-pattern }
    minimum: { type: number }
    maximum: { type: number }
    exclusiveMinimum: { type: number }
    exclusiveMaximum: { type: number }
    multipleOf: { type: number, exclusiveMinimum: 0 }
  $defs:
    TypeName:
      enum: ["null", boolean, object, array, number, integer, string]
---
# Whether something is drawn: it holds when the value `at` names validates
# against `matches`. A missing value never satisfies a condition, even under
# `not`; `null` is a present value.
kind: Telo.JsonSchema
metadata:
  name: Condition
schema:
  type: object
  additionalProperties: false
  required: [at, matches]
  properties:
    at:
      title: At
      description: The value the condition reads, as a path from a root the place it is written binds, or a fixed value.
      x-telo-eval: accessor
    matches:
      title: Matches
      description: The schema the value must satisfy.
      x-telo-match-for: /at
      $ref: "telo:Ui/Match"
---
# Whether something can be pressed: a condition plus the reason shown while it
# does not hold.
kind: Telo.JsonSchema
metadata:
  name: Enablement
schema:
  type: object
  additionalProperties: false
  required: [at, matches, disabledText]
  properties:
    at:
      title: At
      description: The value the condition reads, as a path from a root the place it is written binds, or a fixed value.
      x-telo-eval: accessor
    matches:
      title: Matches
      description: The schema the value must satisfy for the control to be enabled.
      x-telo-match-for: /at
      $ref: "telo:Ui/Match"
    disabledText:
      title: Disabled text
      description: Why the control cannot be pressed, shown while the condition does not hold.
      allOf:
        - $ref: "telo:Ui/BoundText"
        - minLength: 1
---
# What a request that did not succeed reads as: `status` absent when nothing
# answered; `code` the problem body's `code`, else the renderer's own code for
# the status; `message` the problem's `detail`, else the renderer's own word.
kind: Telo.JsonSchema
metadata:
  name: RequestError
schema:
  type: object
  additionalProperties: false
  properties:
    status: { type: integer, title: Status }
    code: { type: string, title: Code }
    message: { type: string, title: Message }
---
# The query parameters a page or a reader declares: each a string, or a list
# of strings for a key given more than once. A name is a Telo name that does not
# begin `_telo`, which the renderer keeps for its own keys.
kind: Telo.JsonSchema
metadata:
  name: QueryParameters
schema:
  type: object
  additionalProperties: false
  patternProperties:
    "^(?!_telo)(?!(as|break|const|continue|else|false|for|function|if|import|in|let|loop|namespace|null|package|return|true|var|void|while)$)[A-Za-z_][A-Za-z0-9_]*$":
      anyOf:
        - allOf:
            - $ref: "telo:Ui/Match"
            - required: [type]
              properties:
                type: { const: string }
        - allOf:
            - $ref: "telo:Ui/Match"
            - required: [type, items]
              properties:
                type: { const: array }
                items:
                  required: [type]
                  properties:
                    type: { const: string }
---
# How a value is entered: derived from what the model says it is (`auto`), a
# `select` list, `options` side by side, a `toggle`, a `slider`, or typed
# `tags`. One vocabulary for form fields and filters, judged by `controlFits`.
kind: Telo.JsonSchema
metadata:
  name: Control
schema:
  enum: [auto, select, options, toggle, slider, tags]
---
# A labelled section of a form. Its fields name it by `group` and are listed
# one after another, so the list's order is the order they are drawn in.
kind: Telo.JsonSchema
metadata:
  name: FieldGroup
schema:
  type: object
  additionalProperties: false
  required: [name, label]
  properties:
    name:
      title: Name
      description: What the group's fields name it by, letters and digits.
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9]*$"
    label: { title: Label, description: The section's heading., $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
    description: { title: Description, description: Text shown under the heading., $ref: "telo://manifest#/$defs/Text", x-telo-text-values: {} }
    shown:
      title: Shown
      description: Whether the section and its fields are drawn, over the form's current `values`.
      $ref: "telo:Ui/Condition"
---
# Where the values a form, an action or a filter bar holds are kept between
# visits: the page's address, a store, or both — the address winning at start.
kind: Telo.JsonSchema
metadata:
  name: StateRecord
schema:
  type: object
  additionalProperties: false
  required: [key]
  anyOf:
    - required: [store]
    - required: [address]
      properties:
        address: { const: true }
  properties:
    key:
      title: Key
      description: The name the values are kept under, letters and digits.
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9]*$"
    address:
      title: Address
      description: Whether the values are part of the page's address.
      type: boolean
      default: false
    store:
      title: Store
      description: Where the values are stored between visits.
      x-telo-ref: { kind: Self.StateStore, use: dependency }
    fields:
      title: Fields
      description: >-
        The properties kept. Omitted, every property shown is kept. A property
        the model marks `writeOnly` is never kept.
      type: array
      uniqueItems: true
      items: { type: string }
---
# What a field answers for the model it is entered into: the property it
# enters, why it cannot be entered there, and — when it can — what a renderer
# draws for it.
kind: Telo.JsonSchema
metadata:
  name: FieldAnswer
schema:
  type: object
  additionalProperties: false
  required: [property, problems]
  properties:
    property: { type: string }
    problems:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [code, message]
        properties:
          code: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
          message: { type: string }
    # Present exactly when the model declares the property and nothing is wrong.
    spec: { $ref: "telo:Ui/SpecNode#/$defs/Field" }
---
# Where a field's options come from, as a renderer receives it. Tagged on
# `type`, one branch per kind of source.
kind: Telo.JsonSchema
metadata:
  name: OptionSourceSpec
schema:
  type: object
  oneOf:
    # Read through the collection contract: paged by `next`, searched with the
    # `search` pair, labelled by `value` filtered with `in`.
    - additionalProperties: false
      required: [type, schema, value, label, basePath, filters, pageSize]
      properties:
        type: { const: collection }
        schema: { type: object }
        value: { $ref: "#/$defs/Binding" }
        label: { $ref: "#/$defs/Binding" }
        hint: { $ref: "#/$defs/Binding" }
        href: { $ref: "#/$defs/Binding" }
        basePath: { type: string }
        filters:
          type: object
          additionalProperties: { $ref: "#/$defs/Binding" }
        # Sent as `limit` on every request, a label lookup's batches included.
        pageSize: { type: integer }
        search:
          type: object
          additionalProperties: false
          required: [property, operator]
          properties:
            property: { type: string }
            operator: { enum: [eq, contains, gt, gte, lt, lte, in] }
  $defs:
    Binding:
      oneOf:
        - type: object
          additionalProperties: false
          required: [root, path]
          properties:
            root: { type: string }
            path: { type: array, items: { type: string } }
        - type: object
          additionalProperties: false
          required: [value]
          properties:
            value: {}
---
# Whether a control can enter a property. `operator` is the filter's, or null
# for a form field, whose value is a list when the property is an `array` and
# is then entered by its `items`. A control states what it needs, so a type it
# cannot read is refused: types are read with `null` set aside. A field's
# property must hold one plain value or a list of them whatever its control.
kind: Telo.Function
metadata:
  name: controlFits
  description: >-
    Whether a control fits a property: auto, select, options, toggle, slider or
    tags, over a filter's operator or a form field's property.
params:
  - name: control
    schema: { type: string }
  - name: property
    schema: { type: object }
  - name: operator
    schema: { type: [string, "null"] }
returns:
  schema: { type: boolean }
body: !cel >-
  cel.bind(declared, !('type' in property) ? [] : (type(property.type) == type([]) ? property.type : [property.type]).filter(t, t != 'null'),
  cel.bind(listed, operator == null && declared == ['array'],
  cel.bind(element, !listed ? property : ('items' in property && type(property.items) == type({}) ? property.items : {}),
  cel.bind(types, !('type' in element) ? [] : (type(element.type) == type([]) ? element.type : [element.type]).filter(t, t != 'null'),
  cel.bind(plain, types.size() == 0 ? ('enum' in element && type(element.enum) == type([])) : types.all(t, t in ['string', 'number', 'integer', 'boolean']),
  cel.bind(single, operator == null ? !listed : operator in ['eq', 'gt', 'gte', 'lt', 'lte'],
    (operator != null || plain)
    && (control == 'auto' ? plain
      : control == 'select' || control == 'options' ? ('enum' in element && type(element.enum) == type([])) || types == ['boolean']
      : control == 'toggle' ? types == ['boolean'] && (operator == null ? !listed : operator == 'eq')
      : control == 'slider' ? types.size() > 0 && types.all(t, t in ['number', 'integer'])
          && 'minimum' in element && 'maximum' in element && single
      : control == 'tags' ? (operator == null ? listed : operator == 'in')
      : control == 'none' && operator != null)))))))
---
# An operation a row offers: the action run, what of the row it is sent, and
# how a press is asked and allowed. Shared by a table's rows and a list node's;
# `row` and the other roots its accessors read are bound where it is used.
kind: Telo.JsonSchema
metadata:
  name: RowAction
schema:
  type: object
  additionalProperties: false
  required: [action, inputs]
  properties:
    action:
      title: Action
      description: >-
        The operation run. Its path, input model, label, answer trees and
        `onSuccess` are used, and its fields where `prompt` asks for them; its
        own `enabled` governs its own form only.
      x-telo-ref: { kind: Self.Action, use: dependency, inputs: /inputs }
    inputs:
      title: Inputs
      description: >-
        What the operation receives, by input property: a path into the row or
        another root in scope, or a fixed value. Every input the action
        requires is bound. Read when the row's button is pressed.
      type: object
      minProperties: 1
      additionalProperties:
        x-telo-eval: accessor
    confirm:
      title: Confirm
      description: >-
        A question asked before the operation runs. Omitted, a press runs it at
        once, unless `prompt` opens a dialog.
      allOf:
        - $ref: "telo:Ui/BoundText"
        - minLength: 1
    prompt:
      title: Prompt
      description: >-
        Whether a press opens a dialog that asks for the action's fields the
        row's `inputs` do not bind — a reason, a note — and sends them with the
        row's values. The dialog is titled with `confirm`, or with the action's
        label.
      type: boolean
      default: false
    enabled:
      title: Enabled
      description: >-
        When the row's button can be pressed, over the row and the roots in
        scope, and the reason shown while it cannot. Omitted, it always can.
      $ref: "telo:Ui/Enablement"
---
# One node of a page, as an author writes it. Internally tagged on `type`, each
# branch closed, so a misspelled type lists the valid ones and a stray key is
# reported on the branch it was written in. Layout is not a field anywhere: it
# belongs to the styling contract of whatever renders the tree. `when` decides
# whether a node is delivered — evaluated per request on a page's own nodes, at
# creation inside a composite — and `shown` whether a delivered node is drawn,
# a condition the renderer reads over the roots the place it is written binds.
kind: Telo.JsonSchema
metadata:
  name: Node
schema:
  type: object
  # One closed branch per `type`, each pinning it.
  oneOf:
    - additionalProperties: false
      required: [type, children]
      properties:
        type: { enum: [box, stack, columns] }
        children: { type: array, items: { $ref: "#" } }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
    - additionalProperties: false
      required: [type, text]
      properties:
        type: { enum: [text, badge] }
        text: { $ref: "telo:Ui/BoundText" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
    - additionalProperties: false
      required: [type, text, href]
      properties:
        type: { const: link }
        text: { $ref: "telo:Ui/BoundText" }
        href: { type: string, pattern: "^(/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$|https://|http://|mailto:)" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
    # A button opening a list of links: choosing one follows its `href` as
    # clicking the link would. An item whose `style` holds `strong` is the
    # current choice. Items are delivered by their own `when`.
    - additionalProperties: false
      required: [type, text, items]
      properties:
        type: { const: menu }
        text: { $ref: "telo:Ui/BoundText" }
        # Each a `link` node.
        items:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#"
              - properties: { type: { const: link } }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
    # Content under tabs, one tab's content shown at a time. Each tab is
    # delivered by its own `when`; with `address`, the chosen tab is part of
    # the page's address under that name.
    - additionalProperties: false
      required: [type, tabs]
      properties:
        type: { const: tabs }
        tabs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [text, children]
            properties:
              text: { $ref: "telo:Ui/BoundText" }
              children: { type: array, items: { $ref: "#" } }
              when: { type: boolean, default: true }
        address:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]*$" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
    - additionalProperties: false
      required: [type, src, alt]
      properties:
        type: { const: image }
        src: { type: string, pattern: "^(/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$|https://|http://)" }
        alt: { $ref: "telo:Ui/BoundText" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
    - additionalProperties: false
      required: [type, markup, alt]
      properties:
        type: { const: svg }
        markup: { type: string }
        alt: { $ref: "telo:Ui/BoundText" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
    # One value, presented as its schema says: a `format: uri` /
    # `uri-reference` string is a link, drawn as `text` when that is given.
    - additionalProperties: false
      required: [type, value]
      properties:
        type: { const: value }
        value: { x-telo-eval: accessor }
        text: { $ref: "telo:Ui/BoundText" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
    # The rows of a list one answer holds, a column per value. Bounded by the
    # answer: it never pages.
    - additionalProperties: false
      required: [type, rows, columns]
      properties:
        type: { const: list }
        heading: { $ref: "telo:Ui/BoundText" }
        rows:
          type: array
          x-telo-eval: accessor
        columns:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [value]
            properties:
              header: { $ref: "telo:Ui/BoundText" }
              value:
                x-telo-eval: accessor
                x-telo-context:
                  type: object
                  properties:
                    row:
                      x-telo-context-element-from-item: "2/rows"
                      x-telo-context-eval: accessor
              # Reads the roots the list is drawn under, never `row`.
              shown: { $ref: "telo:Ui/Condition" }
        # Operations each row offers, over `row` and the roots the list is
        # drawn under. A pressed one draws its own answer in place of its
        # button.
        rowActions:
          type: array
          x-telo-context:
            type: object
            properties:
              row:
                x-telo-context-element-from-item: "0/rows"
                x-telo-context-eval: accessor
          items: { $ref: "telo:Ui/RowAction" }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
    - additionalProperties: false
      required: [type, ref]
      properties:
        type: { const: composite }
        ref:
          x-telo-ref: { kind: Self.Composite, use: dependency }
        style: { $ref: "#/$defs/Style" }
        when: { type: boolean, default: true }
        shown: { $ref: "telo:Ui/Condition" }
  $defs:
    StyleName:
      enum: [heading, subheading, muted, strong, accent, danger, warning, success]
    Style:
      anyOf:
        - $ref: "#/$defs/StyleName"
        - type: array
          items: { $ref: "#/$defs/StyleName" }
---
# What a renderer receives: the same structural nodes with every condition
# decided and every composite replaced by what it provides. Carries no resource
# name — a renderer needs nothing but this document.
kind: Telo.JsonSchema
metadata:
  name: SpecNode
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type, children]
      properties:
        type: { enum: [box, stack, columns] }
        children: { type: array, items: { $ref: "#" } }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    - additionalProperties: false
      required: [type, text]
      properties:
        type: { enum: [text, badge] }
        text: { $ref: "#/$defs/NodeText" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    - $ref: "#/$defs/Link"
    # Its items as delivered for the request, never empty.
    - additionalProperties: false
      required: [type, text, items]
      properties:
        type: { const: menu }
        text: { $ref: "#/$defs/NodeText" }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/$defs/Link" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    # Its tabs as delivered for the request, never none, each keyed by the
    # slug of the source text it was written with.
    - additionalProperties: false
      required: [type, tabs]
      properties:
        type: { const: tabs }
        tabs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [key, text, children]
            properties:
              key: { type: string, minLength: 1 }
              text: { $ref: "#/$defs/NodeText" }
              children: { type: array, items: { $ref: "#" } }
        address: { $ref: "telo:Ui/OverlaySpec#/$defs/Address" }
        shown: { $ref: "#/$defs/Shown" }
    - additionalProperties: false
      required: [type, src, alt]
      properties:
        type: { const: image }
        src: { type: string, pattern: "^(/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$|https://|http://)" }
        alt: { $ref: "#/$defs/NodeText" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    - additionalProperties: false
      required: [type, markup, alt]
      properties:
        type: { const: svg }
        markup: { type: string }
        alt: { $ref: "#/$defs/NodeText" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    - additionalProperties: false
      required: [type, schema, basePath, query, rowKey, pageSize, columns, rowActions, delete]
      properties:
        type: { const: table }
        schema: { type: object }
        basePath: { type: string }
        # The declared query parameters its row actions read, by name; empty
        # when none is.
        query: { type: object }
        # Equalities sent with every request, each a fixed value or a path
        # into a root in scope; while one holds nothing, nothing is read.
        filters:
          type: object
          additionalProperties: { $ref: "#/$defs/Binding" }
        rowKey: { type: string }
        pageSize: { type: integer }
        rowStyle: { $ref: "#/$defs/StyleRule" }
        create:
          type: object
          additionalProperties: false
          required: [form, surface, afterSubmit, unsaved]
          properties:
            form: { $ref: "#" }
            surface: { $ref: "telo:Ui/SurfaceSpec" }
            afterSubmit: { enum: [close, again, keep] }
            unsaved: { enum: [confirm, discard] }
        edit:
          type: object
          additionalProperties: false
          required: [form, surface, afterSubmit, unsaved]
          properties:
            form: { $ref: "#" }
            surface: { $ref: "telo:Ui/SurfaceSpec" }
            afterSubmit: { enum: [close, keep] }
            unsaved: { enum: [confirm, discard] }
        delete: { type: boolean }
        # What each row offers beyond edit and delete, in order: an operation
        # run with values of the row.
        rowActions:
          type: array
          items: { $ref: "#/$defs/RowAction" }
        columns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [header, labels]
            properties:
              header: { $ref: "#/$defs/Text" }
              value: { $ref: "#/$defs/Binding" }
              # What each value the model labels is shown as.
              labels: { $ref: "#/$defs/Labels" }
              # Present when the column is sortable: the property sent as `sort`.
              sort: { type: string }
              # The model's own description of the value, which decides how a
              # cell is shown.
              present: { type: object }
              style: { $ref: "#/$defs/StyleRule" }
              # A component node, or the error node standing in for one.
              cell: { $ref: "#" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    - additionalProperties: false
      required: [type, schema, basePath, fields, groups, state]
      properties:
        type: { const: form }
        schema: { type: object }
        basePath: { type: string }
        fields:
          type: array
          items: { $ref: "#/$defs/Field" }
        groups:
          type: array
          items: { $ref: "#/$defs/Group" }
        state: { $ref: "#/$defs/State" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    - $ref: "#/$defs/Action"
    - additionalProperties: false
      required: [type, fields, content, show, placement, controls, apply, summary, state, presets]
      properties:
        type: { const: filters }
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [property, operator, label, labels, schema, pinned, control]
            properties:
              property: { type: string }
              operator: { enum: [eq, contains, gt, gte, lt, lte, in] }
              label: { $ref: "#/$defs/Text" }
              labels: { $ref: "#/$defs/Labels" }
              schema: { type: object }
              pinned: { type: boolean }
              control: { enum: [auto, select, options, toggle, slider, tags, none] }
              # What the filter holds until the user changes it: always a list.
              default:
                type: array
                items: { type: [string, number, boolean] }
        content: { $ref: "#" }
        show: { enum: [all, chosen] }
        placement: { $ref: "telo:Ui/FilterPlacementSpec" }
        controls: { enum: [direct, chips] }
        apply: { enum: [commit, typing, button] }
        summary: { enum: [none, chips] }
        state: { $ref: "#/$defs/State" }
        presets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label, values]
            properties:
              label: { $ref: "#/$defs/Text" }
              values:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [property, operator, value]
                  properties:
                    property: { type: string }
                    operator: { enum: [eq, contains, gt, gte, lt, lte, in] }
                    value:
                      type: array
                      items: { type: [string, number, boolean] }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    - additionalProperties: false
      required: [type, module, export, external, stylesheets, props]
      properties:
        type: { const: component }
        module: { $ref: "#/$defs/AssetRef" }
        export: { type: string }
        abi: { type: string }
        external: { type: array, items: { type: string } }
        stylesheets: { type: array, items: { $ref: "#/$defs/AssetRef" } }
        props:
          type: object
          additionalProperties: { $ref: "#/$defs/Binding" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    # One value of a data scope, with what its schema says about it.
    - additionalProperties: false
      required: [type, value, labels]
      properties:
        type: { const: value }
        value: { $ref: "#/$defs/Binding" }
        text: { $ref: "#/$defs/NodeText" }
        # What each value the model labels is shown as.
        labels: { $ref: "#/$defs/Labels" }
        present: { type: object }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    - additionalProperties: false
      required: [type, rows, columns]
      properties:
        type: { const: list }
        heading: { $ref: "#/$defs/NodeText" }
        rows: { $ref: "#/$defs/Binding" }
        columns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [header, value, labels]
            properties:
              header: { $ref: "#/$defs/NodeText" }
              value: { $ref: "#/$defs/Binding" }
              labels: { $ref: "#/$defs/Labels" }
              # The model's own description of the value.
              present: { type: object }
              shown: { $ref: "#/$defs/Shown" }
        rowActions:
          type: array
          items: { $ref: "#/$defs/RowAction" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    # Data read when it is drawn, under the record contract: `content` drawn
    # over `data` once an answer is in, `loading` before the first, `failure`
    # over `error` when the read does not succeed.
    - additionalProperties: false
      required: [type, schema, source, query, content, loading, failure, reloadOn]
      properties:
        type: { const: data }
        schema: { type: object }
        source:
          type: object
          additionalProperties: false
          required: [path, params]
          properties:
            path: { type: string }
            params:
              type: object
              additionalProperties: { $ref: "#/$defs/Binding" }
        # The declared query parameters, by name; empty when none is.
        query: { type: object }
        content: { $ref: "#" }
        loading: { $ref: "#" }
        failure: { $ref: "#" }
        reloadOn:
          type: array
          items: { enum: [focus, unauthorized] }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    - additionalProperties: false
      required: [type, code, message]
      properties:
        type: { const: error }
        code: { type: string }
        message: { type: string }
        shown: { $ref: "#/$defs/Shown" }
  $defs:
    # A `link` node, and each item of a `menu`.
    Link:
      type: object
      additionalProperties: false
      required: [type, text, href]
      properties:
        type: { const: link }
        text: { $ref: "#/$defs/NodeText" }
        href: { type: string, pattern: "^(/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$|https://|http://|mailto:)" }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    # A text as the renderer receives it from `ui`: the record a controller
    # was handed (its renderer translates it), or one of the renderer's own
    # words by id.
    Text:
      anyOf:
        - $ref: "telo://manifest#/$defs/TextRecord"
        - $ref: "#/$defs/Word"
    # A text of a node: a text, or a text with the values it is formatted with.
    NodeText:
      anyOf:
        - $ref: "#/$defs/Text"
        - $ref: "#/$defs/BoundText"
    BoundText:
      type: object
      additionalProperties: false
      required: [text, values]
      properties:
        text: { $ref: "telo://manifest#/$defs/TextRecord" }
        values:
          type: object
          additionalProperties: { $ref: "#/$defs/Binding" }
    # One of the words a renderer shows of its own, every one a property of
    # `Ui.Words`.
    Word:
      type: object
      additionalProperties: false
      required: [word]
      properties:
        word: { enum: [loading, noRows, nothingFound, save, cancel, close, newRecord, edit, delete, deleteRowQuestion, deleteRowDetail, previousPage, pagerRange, pagerEmpty, nextPage, yes, no, none, any, select, choose, more, menu, siteNavigation, collapseNavigation, expandNavigation, search, remove, clear, filters, addFilter, apply, reset, done, presets, operatorEq, operatorContains, operatorGt, operatorGte, operatorLt, operatorLte, operatorIn, filterControl, filterChip, filterGroupSummary, rangeFrom, rangeTo, rangeStartsAfterEnd, rangeLongerThanDays, rangeLongerThanWeeks, rangeLongerThanMonths, rangeLongerThanQuarters, rangeLongerThanYears, notFound, noPageAt, unsavedQuestion, unsavedDetail, discard, keepEditing, requestUnauthorized, requestForbidden, requestFailedStatus, requestFailed, recordRefused, answerNotJson, answerNotObject, answerNotModel, invalid, required, type, enum, const, not, anyOf, minLength, maxLength, pattern, minimum, maximum, exclusiveMinimum, exclusiveMaximum, multipleOf, minItems, maxItems, uniqueItems, minProperties, maxProperties, format, additionalProperties, propertyNames] }
    # A text, or none.
    Description:
      anyOf:
        - $ref: "#/$defs/Text"
        - type: "null"
    # What each value of an enumeration is shown as: a titled `const` branch's
    # title, else the string value itself. The value sent back is the value.
    Labels:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [value, label]
        properties:
          value: {}
          label: { $ref: "#/$defs/Text" }
    # An operation run from a page: its form, and what it draws of the answer
    # — `result` over `result`, `input` and `values`, `failure` over `error`,
    # `input` and `values`.
    Action:
      type: object
      additionalProperties: false
      required: [type, schema, path, label, fields, groups, state, failure, onSuccess, concurrency, clearAnswerOn]
      properties:
        type: { const: action }
        schema: { type: object }
        path: { type: string }
        label: { $ref: "#/$defs/Text" }
        fields:
          type: array
          items: { $ref: "#/$defs/Field" }
        groups:
          type: array
          items: { $ref: "#/$defs/Group" }
        state: { $ref: "#/$defs/State" }
        # Present when the button is enabled by a condition over the values.
        enabled: { $ref: "#/$defs/Enablement" }
        # Present when the answer is declared: what a success's body is held to.
        answer: { type: object }
        # Present when something is drawn from a success.
        result: { $ref: "#" }
        failure: { $ref: "#" }
        onSuccess:
          type: object
          additionalProperties: false
          required: [refreshes]
          properties:
            navigate: { $ref: "#/$defs/Binding" }
            refreshes: { type: array, items: { type: string } }
        concurrency: { enum: [parallel, serial] }
        clearAnswerOn: { type: array, items: { type: string } }
        style: { $ref: "#/$defs/Style" }
        shown: { $ref: "#/$defs/Shown" }
    # An operation a row offers: the action, what of the row it sends, and how
    # a press is asked and allowed. The action's own `enabled` is its form's.
    RowAction:
      type: object
      additionalProperties: false
      required: [action, inputs]
      properties:
        action: { $ref: "#/$defs/Action" }
        inputs:
          type: object
          additionalProperties: { $ref: "#/$defs/Binding" }
        # Present when the press asks first.
        confirm: { $ref: "#/$defs/NodeText" }
        # Present when the press opens a dialog that enters these fields of the
        # action's input model before anything is sent.
        prompt:
          type: object
          additionalProperties: false
          required: [fields]
          properties:
            fields:
              type: array
              items: { $ref: "#/$defs/Field" }
        enabled: { $ref: "#/$defs/Enablement" }
    # A condition deciding whether a button can be pressed, and why not.
    Enablement:
      type: object
      additionalProperties: false
      required: [at, matches, disabledText]
      properties:
        at: { $ref: "#/$defs/Binding" }
        matches: { $ref: "telo:Ui/Match" }
        disabledText: { $ref: "#/$defs/NodeText" }
    # A field of a record being entered, drawn while `shown` holds: one branch
    # per kind of field, tagged on `type`.
    Field:
      type: object
      oneOf:
        - $ref: "#/$defs/InputField"
        - $ref: "#/$defs/ChoiceField"
        - $ref: "#/$defs/PickerField"
        - $ref: "#/$defs/DateRangeField"
    # Entered with a control: derived from the property (`auto`) or the one named.
    InputField:
      type: object
      additionalProperties: false
      required: [type, property, label, description, labels, control]
      properties:
        type: { const: input }
        property: { type: string }
        label: { $ref: "#/$defs/Text" }
        description: { $ref: "#/$defs/Description" }
        labels: { $ref: "#/$defs/Labels" }
        control: { $ref: "telo:Ui/Control" }
        group: { type: string }
        shown: { $ref: "#/$defs/Shown" }
    # One or several of the options a source offers, in a list (`auto` or
    # `select`) or side by side (`options`).
    ChoiceField:
      type: object
      additionalProperties: false
      required: [type, property, label, description, labels, control, options]
      properties:
        type: { const: choice }
        property: { type: string }
        label: { $ref: "#/$defs/Text" }
        description: { $ref: "#/$defs/Description" }
        labels: { $ref: "#/$defs/Labels" }
        control: { enum: [auto, select, options] }
        options: { $ref: "telo:Ui/OptionSourceSpec" }
        group: { type: string }
        shown: { $ref: "#/$defs/Shown" }
    # One or several options searched for and chosen in a surface of their own.
    PickerField:
      type: object
      additionalProperties: false
      required: [type, property, label, description, labels, options, surface]
      properties:
        type: { const: picker }
        property: { type: string }
        label: { $ref: "#/$defs/Text" }
        description: { $ref: "#/$defs/Description" }
        labels: { $ref: "#/$defs/Labels" }
        options: { $ref: "telo:Ui/OptionSourceSpec" }
        surface: { $ref: "telo:Ui/OverlaySpec" }
        group: { type: string }
        shown: { $ref: "#/$defs/Shown" }
    # A `from` and a `to` date, with presets computed in the viewer's time zone.
    DateRangeField:
      type: object
      additionalProperties: false
      required: [type, property, label, description, labels, presets, weekStart, initialPreset]
      properties:
        type: { const: dateRange }
        property: { type: string }
        label: { $ref: "#/$defs/Text" }
        description: { $ref: "#/$defs/Description" }
        labels: { $ref: "#/$defs/Labels" }
        presets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label, unit, offset]
            properties:
              label: { $ref: "#/$defs/Text" }
              unit: { enum: [day, week, month, quarter, year] }
              offset: { type: integer }
        weekStart: { enum: [monday, sunday] }
        # The index of the preset the field starts at, or null.
        initialPreset: { type: [integer, "null"] }
        warnLongerThan:
          type: object
          additionalProperties: false
          required: [unit, count]
          properties:
            unit: { enum: [day, week, month, quarter, year] }
            count: { type: integer }
        group: { type: string }
        shown: { $ref: "#/$defs/Shown" }
    # A labelled section of a form, drawn while `shown` holds.
    Group:
      type: object
      additionalProperties: false
      required: [name, label]
      properties:
        name: { type: string }
        label: { $ref: "#/$defs/Text" }
        description: { $ref: "#/$defs/Text" }
        shown: { $ref: "#/$defs/Shown" }
    # Where entered or chosen values are kept: the properties kept, the
    # address, and the store (`memory` when none is named).
    State:
      type: object
      additionalProperties: false
      required: [address, store, fields]
      properties:
        # Present exactly when the component declares `state`.
        key: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]*$" }
        address: { type: boolean }
        store: { $ref: "telo:Ui/StateStoreSpec" }
        fields: { type: array, items: { type: string } }
    # A condition as a renderer receives it: the binding it reads and the
    # schema the value must satisfy.
    Shown:
      type: object
      additionalProperties: false
      required: [at, matches]
      properties:
        at: { $ref: "#/$defs/Binding" }
        matches: { $ref: "telo:Ui/Match" }
    StyleName:
      enum: [heading, subheading, muted, strong, accent, danger, warning, success]
    Style:
      anyOf:
        - $ref: "#/$defs/StyleName"
        - type: array
          items: { $ref: "#/$defs/StyleName" }
    # A row-bound value: a path from a named root, or a fixed value.
    Binding:
      oneOf:
        - type: object
          additionalProperties: false
          required: [root, path]
          properties:
            root: { type: string }
            path: { type: array, items: { type: string } }
        - type: object
          additionalProperties: false
          required: [value]
          properties:
            value: {}
    StyleRule:
      type: object
      additionalProperties: false
      required: [by, cases]
      properties:
        by: { $ref: "#/$defs/Binding" }
        cases:
          type: object
          additionalProperties: { $ref: "#/$defs/Style" }
        default: { $ref: "#/$defs/Style" }
    AssetRef:
      type: object
      additionalProperties: false
      required: [digest, name]
      properties:
        digest: { type: string }
        name: { type: string }
---
# Where a piece of interface floats over the page, as a renderer receives it.
# Tagged on `type`, one branch per kind; every member a branch names is present,
# so a renderer reads no default of its own.
kind: Telo.JsonSchema
metadata:
  name: OverlaySpec
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type, size, modal, dismiss]
      properties:
        type: { const: dialog }
        size: { enum: [small, medium, large, full] }
        modal: { type: boolean }
        dismiss: { $ref: "#/$defs/OverlayDismiss" }
        address: { $ref: "#/$defs/Address" }
        compact: { $ref: "#/$defs/Compact" }
    - additionalProperties: false
      required: [type, side, size, modal, dismiss]
      properties:
        type: { const: drawer }
        side: { enum: [start, end, top, bottom] }
        size: { enum: [small, medium, large, full] }
        modal: { type: boolean }
        dismiss: { $ref: "#/$defs/OverlayDismiss" }
        address: { $ref: "#/$defs/Address" }
        compact: { $ref: "#/$defs/Compact" }
    - additionalProperties: false
      required: [type, side, align, dismiss]
      properties:
        type: { const: popover }
        side: { enum: [top, bottom, start, end] }
        align: { enum: [start, center, end] }
        dismiss:
          type: object
          additionalProperties: false
          required: [escape, outside]
          properties:
            escape: { type: boolean }
            outside: { type: boolean }
        compact: { $ref: "#/$defs/Compact" }
  $defs:
    Address:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]*$" }
    OverlayDismiss:
      type: object
      additionalProperties: false
      required: [escape, outside, closeButton]
      properties:
        escape: { type: boolean }
        outside: { type: boolean }
        closeButton: { type: boolean }
    # The surface used instead below the breakpoint: a dialog or a drawer, with
    # no address and no compact surface of its own.
    Compact:
      type: object
      oneOf:
        - additionalProperties: false
          required: [type, size, modal, dismiss]
          properties:
            type: { const: dialog }
            size: { enum: [small, medium, large, full] }
            modal: { type: boolean }
            dismiss: { $ref: "#/$defs/OverlayDismiss" }
        - additionalProperties: false
          required: [type, side, size, modal, dismiss]
          properties:
            type: { const: drawer }
            side: { enum: [start, end, top, bottom] }
            size: { enum: [small, medium, large, full] }
            modal: { type: boolean }
            dismiss: { $ref: "#/$defs/OverlayDismiss" }
---
# Where a piece of interface appears, as a renderer receives it: an overlay, or
# a place in the page itself.
kind: Telo.JsonSchema
metadata:
  name: SurfaceSpec
schema:
  type: object
  oneOf:
    - $ref: "telo:Ui/OverlaySpec"
    - additionalProperties: false
      required: [type]
      properties:
        type: { const: inline }
        compact: { $ref: "telo:Ui/OverlaySpec#/$defs/Compact" }
    - additionalProperties: false
      required: [type, side, size, dismiss]
      properties:
        type: { const: panel }
        side: { enum: [start, end] }
        size: { enum: [small, medium, large] }
        dismiss:
          type: object
          additionalProperties: false
          required: [escape, closeButton]
          properties:
            escape: { type: boolean }
            closeButton: { type: boolean }
        address: { $ref: "telo:Ui/OverlaySpec#/$defs/Address" }
        compact: { $ref: "telo:Ui/OverlaySpec#/$defs/Compact" }
    - additionalProperties: false
      required: [type, address]
      properties:
        type: { const: page }
        address: { $ref: "telo:Ui/OverlaySpec#/$defs/Address" }
---
# What a create form does once its record is saved.
kind: Telo.JsonSchema
metadata:
  name: AfterCreate
schema:
  enum: [close, again, keep]
  default: close
---
# What an edit form does once its record is saved.
kind: Telo.JsonSchema
metadata:
  name: AfterEdit
schema:
  enum: [close, keep]
  default: close
---
# What happens to input a form holds unsaved when something would close it.
kind: Telo.JsonSchema
metadata:
  name: UnsavedInput
schema:
  enum: [confirm, discard]
  default: confirm
---
# What a filter bar is told about itself beyond its fields: which filters are
# on show, where its controls sit, how each is entered, when a change applies,
# what summarises it and where its state is kept. A record: no member of it
# decides which other members may be written.
kind: Telo.JsonSchema
metadata:
  name: FilterPolicy
schema:
  type: object
  additionalProperties: false
  properties:
    show:
      title: Show
      description: >-
        Which filters are on show: `all` of them, or only the `chosen` — the
        pinned ones, those added from the bar's list, and those holding a value.
      enum: [all, chosen]
      default: all
    placement:
      title: Placement
      description: Where the controls sit relative to the content. Omitted, above it.
      x-telo-ref: { kind: Self.FilterPlacement, use: dependency }
    controls:
      title: Controls
      description: >-
        How a filter is drawn: its control `direct`ly, or as `chips` — a chip
        naming the filter and its value that opens the control.
      enum: [direct, chips]
      default: direct
    apply:
      title: Apply
      description: >-
        When a change takes effect: when it is `commit`ted — a choice at once,
        typed text on Enter or on leaving the field — while `typing`, after a
        pause, or only from an Apply `button`.
      enum: [commit, typing, button]
      default: commit
    summary:
      title: Summary
      description: >-
        What summarises the bar: `none`, or a row of removable `chips`, one per
        filter holding a value.
      enum: [none, chips]
      default: none
    state:
      title: State
      description: >-
        Where the bar's values are kept between visits. Omitted, in memory
        only. At least one of `address: true` and `store` is written.
      $ref: "telo:Ui/StateRecord"
---
# Where a filter bar's controls sit, as a renderer receives it. Tagged on
# `type`, one branch per kind.
kind: Telo.JsonSchema
metadata:
  name: FilterPlacementSpec
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type]
      properties:
        type: { const: above }
        compact: { $ref: "#/$defs/Compact" }
    - additionalProperties: false
      required: [type, side, compact]
      properties:
        type: { const: aside }
        side: { enum: [start, end] }
        compact: { $ref: "#/$defs/Compact" }
    - additionalProperties: false
      required: [type, open]
      properties:
        type: { const: collapsible }
        open: { type: boolean }
    - additionalProperties: false
      required: [type, surface]
      properties:
        type: { const: overlay }
        surface: { $ref: "telo:Ui/OverlaySpec" }
  $defs:
    # The placement used instead below the breakpoint: one that folds.
    Compact:
      type: object
      oneOf:
        - additionalProperties: false
          required: [type, open]
          properties:
            type: { const: collapsible }
            open: { type: boolean }
        - additionalProperties: false
          required: [type, surface]
          properties:
            type: { const: overlay }
            surface: { $ref: "telo:Ui/OverlaySpec" }
---
# Where a piece of interface keeps its state, as a renderer receives it.
# `memory` is what a bar with no store carries; no kind provides it.
kind: Telo.JsonSchema
metadata:
  name: StateStoreSpec
schema:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { enum: [memory, local, session] }
---
# An application's navigation: the tree of entries a renderer draws, and how it
# is drawn. A page is named by reference, never by path, so a path changes in
# one place and a library's pages are put in the tree like the application's own.
kind: Telo.JsonSchema
metadata:
  name: Navigation
schema:
  type: object
  additionalProperties: false
  properties:
    items:
      title: Items
      description: >-
        The entries, in order: a page, a link, or a group of entries. Each
        entry's `when:` may read the request, evaluated per request; a group
        none of whose entries is delivered is left out.
      type: array
      items: { $ref: "telo:Ui/NavigationItem" }
      x-telo-context:
        type: object
        properties:
          request:
            x-telo-context-eval: runtime
            type: object
            properties:
              headers:
                type: object
                additionalProperties: { type: string }
              ip: { type: string }
    placement:
      title: Placement
      description: >-
        How the tree is drawn. Omitted, in the header, behind a menu button on
        a narrow viewport.
      x-telo-ref: { kind: Self.NavigationPlacement, use: dependency }
---
# One entry of a navigation tree, tagged on `type`: a page the application
# serves, a link to any address, or a group of entries nested to any depth.
kind: Telo.JsonSchema
metadata:
  name: NavigationItem
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type, page]
      properties:
        type: { const: page }
        page:
          title: Page
          description: The page the entry leads to, one the application lists in its pages.
          x-telo-ref: { kind: Self.Page, use: dependency }
        text:
          title: Text
          description: What the entry says. Omitted, the page's title.
          $ref: "telo://manifest#/$defs/Text"
          x-telo-text-values: {}
        icon: { $ref: "#/$defs/Icon" }
        when:
          title: When
          description: Whether the entry is delivered, per request.
          type: boolean
          default: true
    - additionalProperties: false
      required: [type, text, href]
      properties:
        type: { const: link }
        text:
          title: Text
          description: What the entry says.
          $ref: "telo://manifest#/$defs/Text"
          x-telo-text-values: {}
        href:
          title: Address
          description: >-
            Where the entry leads: a path under the application's mount, or an
            `https:`, `http:` or `mailto:` address.
          type: string
          pattern: "^(/([^/\\\\\\u0000-\\u001f\\u007f][^\\u0000-\\u001f\\u007f]*)?$|https://|http://|mailto:)"
        icon: { $ref: "#/$defs/Icon" }
        when:
          title: When
          description: Whether the entry is delivered, per request.
          type: boolean
          default: true
    - additionalProperties: false
      required: [type, text, items]
      properties:
        type: { const: group }
        text:
          title: Text
          description: What the group's button says.
          $ref: "telo://manifest#/$defs/Text"
          x-telo-text-values: {}
        items:
          title: Items
          description: The group's entries, in order.
          type: array
          minItems: 1
          items: { $ref: "telo:Ui/NavigationItem" }
        icon: { $ref: "#/$defs/Icon" }
        when:
          title: When
          description: Whether the group is delivered, per request.
          type: boolean
          default: true
  $defs:
    Icon:
      title: Icon
      description: >-
        The glyph drawn before the entry's text, and in place of its first
        letter in a sidebar's rail.
      x-telo-ref: { kind: Self.Icon, use: dependency }
---
# How a navigation tree is drawn, as a renderer receives it. Tagged on `type`,
# one branch per kind; every member a branch names is present.
kind: Telo.JsonSchema
metadata:
  name: NavigationPlacementSpec
schema:
  type: object
  oneOf:
    - additionalProperties: false
      required: [type, compact]
      properties:
        type: { const: header }
        compact: { $ref: "#/$defs/Compact" }
    # A column beside the page. `rail` is present when it collapses to one,
    # and says whether it starts collapsed; `store` keeps its open groups and
    # whether it is collapsed.
    - additionalProperties: false
      required: [type, side, store, compact]
      properties:
        type: { const: sidebar }
        side: { enum: [start, end] }
        rail:
          type: object
          additionalProperties: false
          required: [collapsed]
          properties:
            collapsed: { type: boolean }
        store: { $ref: "telo:Ui/StateStoreSpec" }
        compact: { $ref: "#/$defs/Compact" }
    - $ref: "#/$defs/Overlay"
    - $ref: "#/$defs/TabBar"
  $defs:
    # The whole tree behind a menu button, in a surface the button opens.
    Overlay:
      type: object
      additionalProperties: false
      required: [type, surface]
      properties:
        type: { const: overlay }
        surface: { $ref: "telo:Ui/OverlaySpec" }
    # The top-level entries as tabs along the bottom edge, at most `visible`
    # of them; a group, or More holding the rest, opens in `surface`.
    TabBar:
      type: object
      additionalProperties: false
      required: [type, visible, surface]
      properties:
        type: { const: tab-bar }
        visible: { type: integer, minimum: 2, maximum: 5 }
        surface: { $ref: "telo:Ui/OverlaySpec" }
    # The placement used instead below the breakpoint.
    Compact:
      type: object
      oneOf:
        - $ref: "#/$defs/Overlay"
        - $ref: "#/$defs/TabBar"
---
kind: Telo.Abstract
metadata:
  name: Composite
  description: >-
    A reusable piece of interface that carries its own configuration and expands
    into renderable nodes: a data grid, an input form, a filter bar, a custom
    widget, or a group of them. Provides the node a renderer draws and the list
    of files the browser must load for it, each addressed by its content digest.
capability: Telo.Provider
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [assets]
    properties:
      # Absent when the composite has nothing to show: whoever placed it leaves
      # it out, as it would a node whose `when:` is false.
      node: { $ref: "telo://Self/SpecNode" }
      assets:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [digest, name, file, mediaType]
          properties:
            digest: { type: string, pattern: "^[0-9a-f]{64}$" }
            name: { type: string }
            file: { x-telo-type: Telo.HostPath }
            mediaType: { type: string }
---
# Where a piece of interface appears and how it is dismissed. Whoever opens a
# form names one; each way of appearing is a kind of its own.
kind: Telo.Abstract
metadata:
  name: Surface
  description: >-
    Where a piece of interface appears when it is opened and how it is
    dismissed: floating over the page, in line with the content, in a side
    panel beside it, or in place of the page. Provides the placement, size and
    dismissal settings a renderer draws a create or edit form with.
capability: Telo.Provider
outputType: !ref SurfaceSpec
---
kind: Telo.Abstract
metadata:
  name: Overlay
  description: >-
    A surface floating over the page: a centred window, a sheet sliding in from
    an edge, or a small card anchored to the control that opened it. Provides
    its placement and dismissal settings, and suits any place that needs its
    content on top of the page rather than inside it.
capability: Telo.Provider
extends: Self.Surface
outputType: !ref OverlaySpec
---
# An overlay placed against the viewport, not against what opened it: what a
# surface's `compact` names, since a card anchored to its button does not fit
# a narrow viewport.
kind: Telo.Abstract
metadata:
  name: ViewportOverlay
  description: >-
    An overlay placed against the screen rather than the button that opened
    it: a centred window or a sheet sliding in from an edge. Suits a phone
    screen, so it is what replaces a surface on a narrow viewport. Provides its
    placement and dismissal settings.
capability: Telo.Provider
extends: Self.Overlay
---
kind: Telo.Definition
metadata:
  name: Dialog
  description: >-
    A centred window over the page for a create or edit form: a modal or
    non-modal dialog in one of four sizes, closed by Escape, a click outside or
    a close button, each of which can be switched off. Can be given an address
    so an open form is linkable, and a replacement for narrow viewports.
capability: Telo.Provider
extends: Self.ViewportOverlay
controllers:
  - pkg:telo/local/js?path=./nodejs/ui.mjs&local_path=./nodejs/src/index.ts#DialogController
schema:
  type: object
  additionalProperties: false
  properties:
    size:
      title: Size
      description: How much of the viewport it takes.
      enum: [small, medium, large, full]
      default: medium
    modal:
      title: Modal
      description: Whether the page behind it is blocked while it is open.
      type: boolean
      default: true
    dismiss:
      title: Dismiss
      description: The ways it can be closed besides the form's own buttons.
      type: object
      additionalProperties: false
      properties:
        escape: { title: Escape, description: The Escape key closes it., type: boolean, default: true }
        outside: { title: Outside, description: A click outside it closes it., type: boolean, default: true }
        closeButton: { title: Close button, description: It shows a close button., type: boolean, default: true }
    address:
      title: Address
      description: >-
        Makes the open surface part of the page's address, so it can be linked
        to, reloaded and left with the browser's back button.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          title: Name
          description: The name the open surface is addressed under, letters and digits.
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9]*$"
    compact:
      title: Compact
      description: >-
        The surface used instead on a narrow viewport: a `Ui.ViewportOverlay`,
        such as a dialog or a drawer. It takes the address of this one, and
        declares neither an address nor a compact surface itself.
      x-telo-ref: { kind: Self.ViewportOverlay, use: dependency }
  x-telo-resource-rules:
    - resolve: [/compact]
      condition: !cel "!has(self.compact) || !has(self.compact.address)"
      code: UI_SURFACE_COMPACT_ADDRESSED
      message: >-
        names a compact surface that declares an address. The address of a
        compact surface is the one of the surface it stands in for: remove
        `address` from it.
    - resolve: [/compact]
      condition: !cel "!has(self.compact) || !has(self.compact.compact)"
      code: UI_SURFACE_COMPACT_NESTED
      message: >-
        names a compact surface that declares a compact surface of its own.
        Only one level applies: remove `compact` from it.
