# A splice at a scoped import's top level: refused by the loader's scoped-import
# walk, at the member, and nothing beneath it is judged.
kind: Telo.Application
metadata: { name: ImportSpliceMember }
variables: { flag1: { env: FLAG_1, type: boolean, default: true } }
targets: [!ref scope]
---
kind: Telo.Sequence
metadata: { name: scope }
with:
  - kind: Telo.Import
    metadata: { name: Lib }
    source: ./lib
    variables: { size: 1 }
    ...: !if { if: !cel "variables.flag1", then: { variables: { size: wrong } } }
steps: [{ name: noop, value: 1 }]
