# One value per place a shape of the vocabulary holds another: a dialog whose
# compact surface is addressed, a panel whose compact surface is a popover, a
# listing node whose create surface has a size no dialog takes, a filter overlay
# in a panel, a placement whose compact placement does not fold, and a filters
# node whose placement and whose store are no kind's.
kind: Telo.Application
metadata: { name: UiInvalidSpecShapesApp, version: 1.0.0 }
imports: { Echo: ../../spec-echo }
---
kind: Echo.TypedSurface
metadata: { name: overlayCompact }
spec:
  type: dialog
  size: medium
  modal: true
  dismiss: { escape: true, outside: true, closeButton: true }
  compact:
    type: drawer
    side: end
    size: medium
    modal: true
    dismiss: { escape: true, outside: true, closeButton: true }
    address: { name: todo }
---
kind: Echo.TypedSurface
metadata: { name: panelCompact }
spec:
  type: panel
  side: end
  size: medium
  dismiss: { escape: true, closeButton: true }
  compact: { type: popover, side: bottom, align: start, dismiss: { escape: true, outside: true } }
---
kind: Echo.TypedNode
metadata: { name: listingSurface }
node:
  type: listing
  fill: false
  schema: {}
  basePath: /api/todos
  key: id
  query: {}
  pageSize: 25
  paging: pages
  sort: []
  rowActions: []
  relations: {}
  empty: { type: text, fill: false, text: { set: Ui.Translations, key: noRows } }
  layout: { type: table, columns: [], reads: {} }
  delete: false
  create:
    to:
      type: openPage
      href: { path: { value: /todos/new }, pathParams: {}, queryParams: {} }
      surface: { type: dialog, size: huge, modal: true, dismiss: { escape: true, outside: true, closeButton: true } }
      keepsSurface: false
    label: { set: Ui.Translations, key: create }
---
kind: Echo.TypedPlacement
metadata: { name: placementSurface }
spec:
  type: overlay
  surface: { type: panel, side: end, size: medium, dismiss: { escape: true, closeButton: true } }
  show: all
  controls: direct
  summary: none
---
kind: Echo.TypedPlacement
metadata: { name: placementCompact }
spec: { type: above, show: all, controls: direct, summary: none, compact: { type: aside, side: start } }
---
kind: Echo.TypedNode
metadata: { name: filtersPlacement }
node:
  type: filters
  fill: false
  basePath: /api/todos
  fields: []
  content: { type: text, fill: false, text: { set: Ui.Translations, key: loading } }
  placement: { type: nowhere }
  apply: commit
  state: { address: false, store: { type: memory }, fields: [] }
  presets: []
---
kind: Echo.TypedNode
metadata: { name: filtersStore }
node:
  type: filters
  fill: false
  basePath: /api/todos
  fields: []
  content: { type: text, fill: false, text: { set: Ui.Translations, key: loading } }
  placement: { type: above, show: all, controls: direct, summary: none }
  apply: commit
  state: { address: false, store: { type: server }, fields: [] }
  presets: []
