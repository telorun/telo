project: oauth-client
kind: Fixed
body: "The AuthorizationServer provider declares `timeoutMs` as `type: integer`,
  so it crosses that contract as an int64 — and `setTimeout` refuses one, failing
  every token-endpoint call with a BigInt conversion error. The deadline is read
  through `integerInput`."
