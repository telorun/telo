units:
  cli: Added
body: "`telo sbom <manifest>` writes one CycloneDX 1.6 software bill of materials
  covering an application's whole module closure — its own local modules (derived in
  place), every imported module's published record (reading only its `sbom` layer), the
  modules nested in an artifact and every child application — to stdout, with a summary
  on stderr; a packaged executable is accepted wherever a manifest is. `telo module sbom
  <ref>` prints one module's record, as published for an artifact (one payload blob) and
  derived for a local path. Both take `--platform` / `--abi`, spelled as on `telo
  install`, which keep only the layers that target loads. A module with no complete
  record is refused as `SBOM_INCOMPLETE` at the `imports:` entry reaching it, naming the
  chain; `--allow-incomplete` writes the document with it marked incomplete in
  `compositions`. A graph `telo check` refuses, and a local module whose build fails,
  write nothing and exit 1."
