kind: Telo.Application
metadata:
  name: RootTwoLevelsUnverified
  version: 1.0.0
  description: States a version and forwards the need through a relay to a library that reads it by field only.
imports:
  Kinds: ../kinds
  Lib:
    source: ../relay
    needs:
      access: !ref access
needs:
  access:
    kind: Kinds.DatabaseAccess
    version: ">=15.0.0"
