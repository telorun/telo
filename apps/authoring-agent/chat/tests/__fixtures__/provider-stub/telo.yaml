kind: Telo.Application
metadata:
  name: ProviderStub
  version: 1.0.0
  description: |
    Test fixture: a local stand-in for Anthropic's Messages API, so the
    agent's tests run whole turns offline and key-free. POST /v1/messages
    answers with a streamed response chosen by the request's text:
      - a naming call (system text starting `You name conversations`)
        answers `"Stub title."` and a second line, and a summary call
        (`You summarize conversations`) answers `stub summary`; neither
        heeds the directives below, only its own: STUB_TITLE_FAIL /
        STUB_SUMMARY_FAIL refuse it with 400, STUB_SUMMARY_EMPTY completes
        it with no text, STUB_TITLE_CUT / STUB_SUMMARY_CUT end it
        stop with `max_tokens` after part of its
        text — each with usage, and each with an `_ONCE` form that applies
        only to the first call of its kind carrying that marker —, and
        STUB_TITLE_SLOW holds a naming call like STUB_SLOW, and
        STUB_TITLE_LONG answers it with a 94-character line whose 80th
        character is the astral `😀`, and `STUB_TITLE_REPLY:<base64 of a
        UTF-8 text>` answers it with exactly that text;
      - a discovery call (system text starting `You find Telo modules`)
        asks for one `search_resources` call over the query `stub need`, and
        the request that carries its result answers with the text a
        `STUB_DISCOVERY:<base64 of a UTF-8 text>` directive in the request
        holds — `{"found": [], "notFound": []}` without one;
      - a message containing STUB_FAIL is refused with 400 — with
        STUB_FAIL_ONCE, only until a request carries a continued turn's note
        (`TURN CONTINUED: the previous attempt`; the system prompt names the
        marker alone), so a continued turn completes; a message containing
        STUB_BREAK is refused with 400 once the request carries a tool result,
        likewise until a request carries a continued turn's note — a turn that
        fails after its tools ran;
      - a message containing STUB_SLOW is held until a test calls POST
        /release (which releases every request received so far) or the agent
        abandons the request, so a test can act while a turn is running — and
        so is a later request carrying that message as history;
      - a message containing STUB_TOOL asks for one `list_dir` call, and the
        request that carries its result gets a text reply;
      - a message containing `STUB_CALLS:<base64 of a JSON list of
        {name, arguments}>` asks for exactly those tool calls, and the request
        that carries their results gets a text reply;
      - a message containing STUB_LOOP asks for one `list_dir` call on every
        request, until one forbids tools (`tool_choice: "none"`), which gets
        the text reply `stub wrap-up`;
      - anything else gets a text reply.
    Every agent reply carries a signed thinking block, so the agent records and
    replays provider state. Every request body is kept in order; GET /requests
    returns it with `input` and `instructions` aliases for test assertions.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.40.0#sha256-_siVH-ocHHO9CzJB00KYSR7-VhMXsFiJGQXGhqtgfns
  PlainText: oci://ghcr.io/telorun/plain-text-codec@0.11.0#sha256-V8zjIxeI89VhzVcKOrOTqLq7AdsNh2n51k2avdcOh-k
  Stream: oci://ghcr.io/telorun/stream@0.14.0#sha256-4lK-_jEZ4H1CCdxyLGrsfmkWj5PTXsf2b8NYk0RTxGk
  Sql: oci://ghcr.io/telorun/sql@0.28.1#sha256-ZlxQTTYQtAhK2aAyLRYMwBN-U4b8ww4ulu0SVnIxFu8
  SQLite: oci://ghcr.io/telorun/sqlite@0.11.0#sha256-QdM_zH8JQGB2URI9uT0hM5lnWGKLed-4NvFk81V7Xs4
  Timer: oci://ghcr.io/telorun/timer@0.9.0#sha256-Phjx5KkREnLAB68DlKZUx5bRkDosEO3WaMVMUS2-pfg
  Run: oci://ghcr.io/telorun/run@0.30.0#sha256-xce3zcKQZYXAuMPQqUW4R0avisqZWYowLDLeaP7wXkc
ports:
  http:
    env: PORT
    default: 18440
targets:
  - !ref schema
  - !ref server
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: SQLite.Schema
metadata: { name: schema }
connection: !ref db
migrations:
  create_requests:
    statement: "CREATE TABLE requests (id INTEGER PRIMARY KEY AUTOINCREMENT, body TEXT NOT NULL)"
  # Each POST /release: every request up to `through_id` is let go.
  create_releases:
    statement: "CREATE TABLE releases (through_id INTEGER NOT NULL)"
---
kind: Run.Sequence
metadata: { name: respond }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [body]
    properties:
      body: { type: object, additionalProperties: true }
steps:
  - name: record
    invoke: { kind: Sql.Query, connection: !ref db }
    inputs:
      sql: "INSERT INTO requests (body) VALUES (?) RETURNING id"
      bindings: [ !cel "json(inputs.body)" ]
  - name: request
    value: !cel "json(inputs.body)"
  # Anthropic requires each tool result to name the tool-use block it answers.
  - name: unanswerable
    value: !cel >-
      'messages' in inputs.body && type(inputs.body.messages) == type([])
        ? enumerate(inputs.body.messages).filter(e,
            type(e.value) == type({}) && 'content' in e.value
            && type(e.value.content) == type([])
            && e.value.content.exists(c, type(c) == type({}) && 'type' in c
              && c.type == 'tool_result'
              && (!('tool_use_id' in c) || c.tool_use_id == ''))).map(e, e.index)
        : []
  - name: callIdMissing
    if: !cel "size(steps.unanswerable.result) > 0"
    then:
      - name: refuseCallId
        throw:
          code: ERR_STUB_REFUSED
          message: !cel "'Invalid \\'messages[' + string(steps.unanswerable.result[0]) + '].content.tool_use_id\\': empty string.'"
  # A naming or summary call is told apart by its system text; the agent's
  # own directives never apply to it, only its own.
  - name: kind
    value: !cel >-
      has(inputs.body.system) && json(inputs.body.system).contains('You name conversations') ? 'title'
        : has(inputs.body.system) && json(inputs.body.system).contains('You summarize conversations') ? 'summary'
        : has(inputs.body.system) && json(inputs.body.system).contains('You find Telo modules') ? 'discovery'
        : 'agent'
  # A naming or summary call's own directives; empty where its kind has none.
  - name: markers
    value: !cel >-
      steps.kind.result == 'title' ? {'fail': 'STUB_TITLE_FAIL', 'empty': '', 'cut': 'STUB_TITLE_CUT'}
        : {'fail': 'STUB_SUMMARY_FAIL', 'empty': 'STUB_SUMMARY_EMPTY', 'cut': 'STUB_SUMMARY_CUT'}
  # Earlier calls of this kind that carried each directive's `_ONCE` marker too.
  - name: earlier
    invoke: { kind: Sql.Query, connection: !ref db }
    inputs:
      sql: |
        SELECT COALESCE(SUM(body LIKE ?), 0) AS fail, COALESCE(SUM(body LIKE ?), 0) AS empty,
               COALESCE(SUM(body LIKE ?), 0) AS cut
        FROM requests WHERE id < ? AND body LIKE ?
      bindings:
        - !cel "'%' + steps.markers.result.fail + '_ONCE%'"
        - !cel "'%' + steps.markers.result.empty + '_ONCE%'"
        - !cel "'%' + steps.markers.result.cut + '_ONCE%'"
        - !cel "steps.record.result.rows[0].id"
        - !cel "steps.kind.result == 'title' ? '%You name conversations%' : '%You summarize conversations%'"
  # Which directives this call obeys: its marker is present, and its `_ONCE`
  # form is not, or no earlier call of this kind carried that.
  - name: obeys
    value: !cel >-
      cel.bind(req, steps.request.result, cel.bind(m, steps.markers.result, cel.bind(prior, steps.earlier.result.rows[0], {
        'fail': steps.kind.result != 'agent' && req.contains(m.fail)
          && !(req.contains(m.fail + '_ONCE') && int(prior.fail) > 0),
        'empty': steps.kind.result != 'agent' && m.empty != '' && req.contains(m.empty)
          && !(req.contains(m.empty + '_ONCE') && int(prior.empty) > 0),
        'cut': steps.kind.result != 'agent' && req.contains(m.cut)
          && !(req.contains(m.cut + '_ONCE') && int(prior.cut) > 0)
      })))
  - name: refused
    if: !cel >-
      steps.kind.result == 'agent'
        ? (steps.request.result.contains('STUB_FAIL')
            && !(steps.request.result.contains('STUB_FAIL_ONCE') && steps.request.result.contains('TURN CONTINUED: the previous attempt')))
          || (steps.request.result.contains('STUB_BREAK') && steps.request.result.contains('"type":"tool_result"')
            && !steps.request.result.contains('TURN CONTINUED: the previous attempt'))
        : steps.obeys.result.fail
    then:
      - name: refuse
        throw:
          code: ERR_STUB_REFUSED
          message: The stub refuses this request.
  # Held until released. An agent that abandons the request (an aborted turn)
  # disconnects, which cancels this handler and ends the hold with it.
  - name: slow
    if: !cel >-
      steps.kind.result == 'agent' ? steps.request.result.contains('STUB_SLOW')
        : steps.kind.result == 'title' && steps.request.result.contains('STUB_TITLE_SLOW')
    then:
      - name: released
        invoke: !ref releasedCount
        inputs:
          sql: "SELECT COUNT(*) AS n FROM releases WHERE through_id >= ?"
          bindings: [ !cel "steps.record.result.rows[0].id" ]
      - name: hold
        while: !cel "steps.released.result.rows[0].n == 0"
        do:
          - name: poll
            invoke: { kind: Timer.Delay }
            inputs: { duration: "50ms" }
          - name: released
            invoke: !ref releasedCount
            inputs:
              sql: "SELECT COUNT(*) AS n FROM releases WHERE through_id >= ?"
              bindings: [ !cel "steps.record.result.rows[0].id" ]
  - name: scripted
    value: !cel >-
      cel.bind(directive, regexExtract(steps.request.result, 'STUB_CALLS:[A-Za-z0-9+/=]+'),
        steps.kind.result != 'agent' || directive == '' || steps.request.result.contains('"type":"tool_result"') ? []
          : parseJson(base64Decode(directive.substring(11))))
  - name: titleReply
    value: !cel >-
      cel.bind(directive, regexExtract(steps.request.result, 'STUB_TITLE_REPLY:[A-Za-z0-9+/=]+'),
        directive == '' ? '' : base64Decode(directive.substring(17)))
  - name: discoveryReply
    value: !cel >-
      cel.bind(directive, regexExtract(steps.request.result, 'STUB_DISCOVERY:[A-Za-z0-9+/=]+'),
        directive == '' ? '{"found": [], "notFound": []}' : base64Decode(directive.substring(15)))
  - name: toolResults
    value: !cel >-
      has(inputs.body.messages) && type(inputs.body.messages) == type([])
        ? inputs.body.messages.exists(m, has(m.content) && type(m.content) == type([])
            && m.content.exists(c, has(c.type) && c.type == 'tool_result'))
        : false
  - name: noTools
    value: !cel >-
      has(inputs.body.tool_choice) && type(inputs.body.tool_choice) == type({})
        && inputs.body.tool_choice.type == 'none'
  - name: calls
    value: !cel >-
      steps.kind.result == 'discovery' && !steps.toolResults.result
        ? [{'name': 'search_resources', 'arguments': {'queries': ['stub need']}}]
        : size(steps.scripted.result) > 0
          ? steps.scripted.result
          : steps.kind.result == 'agent'
              && (steps.request.result.contains('STUB_LOOP') && !steps.noTools.result
                || steps.request.result.contains('STUB_TOOL') && !steps.toolResults.result)
            ? [{'name': 'list_dir', 'arguments': {}}]
            : []
  - name: startIndex
    value: !cel >-
      has(inputs.body.thinking) && type(inputs.body.thinking) == type({})
        && inputs.body.thinking.type == 'adaptive' ? 1 : 0
  - name: events
    value: !cel >-
      [{'type': 'message_start',
        'message': {'type': 'message', 'role': 'assistant', 'content': [],
                    'usage': {'input_tokens': 10, 'output_tokens': 0}}}]
      + (steps.startIndex.result == 1
          ? [{'type': 'content_block_start', 'index': 0,
              'content_block': {'type': 'thinking', 'thinking': '', 'signature': ''}},
             {'type': 'content_block_delta', 'index': 0,
              'delta': {'type': 'thinking_delta', 'thinking': 'stub reasoning'}},
             {'type': 'content_block_delta', 'index': 0,
              'delta': {'type': 'signature_delta', 'signature': 'stub-signature'}},
             {'type': 'content_block_stop', 'index': 0}]
          : [])
      + (size(steps.calls.result) > 0
          ? flatten(enumerate(steps.calls.result).map(e,
              [
                {'type': 'content_block_start', 'index': steps.startIndex.result + e.index,
                 'content_block': {'type': 'tool_use', 'id': 'toolu_' + uuidv4(),
                                   'name': e.value.name, 'input': {}}},
                {'type': 'content_block_delta', 'index': steps.startIndex.result + e.index,
                 'delta': {'type': 'input_json_delta', 'partial_json': json(e.value.arguments)}},
                {'type': 'content_block_stop', 'index': steps.startIndex.result + e.index}
              ]))
          : steps.kind.result == 'summary' && steps.obeys.result.empty
            ? []
            : [
                {'type': 'content_block_start', 'index': steps.startIndex.result,
                 'content_block': {'type': 'text', 'text': ''}},
                {'type': 'content_block_delta', 'index': steps.startIndex.result,
                 'delta': {'type': 'text_delta',
                   'text': steps.kind.result == 'title'
                     ? steps.obeys.result.cut ? '"Stub ti'
                       : steps.titleReply.result != '' ? steps.titleReply.result
                       : steps.request.result.contains('STUB_TITLE_LONG') ? join(range(79).map(i, 'a'), '') + '😀' + ' and then more'
                       : '"Stub title."\nA second line'
                     : steps.kind.result == 'summary'
                       ? steps.obeys.result.cut ? 'stub sum' : 'stub summary'
                       : steps.kind.result == 'discovery' ? steps.discoveryReply.result
                         : steps.request.result.contains('STUB_LOOP') && steps.noTools.result
                           ? 'stub wrap-up'
                           : steps.request.result.contains('STUB_TOOL') ? 'stub tool result'
                             : 'stub reply'}},
                {'type': 'content_block_stop', 'index': steps.startIndex.result}
              ])
      + [{'type': 'message_delta',
          'delta': {'stop_reason': steps.obeys.result.cut ? 'max_tokens'
            : size(steps.calls.result) > 0 ? 'tool_use' : 'end_turn'},
          'usage': {'output_tokens': 5}},
         {'type': 'message_stop'}]
  - name: frames
    invoke: { kind: Stream.Of }
    inputs:
      items: !cel "steps.events.result.map(e, 'event: ' + e.type + '\\ndata: ' + json(e) + '\\n\\n')"
outputs:
  output: !cel "steps.frames.result.output"
---
kind: Sql.Query
metadata: { name: releasedCount }
connection: !ref db
---
kind: Http.Api
metadata: { name: api }
routes:
  - request:
      path: /v1/messages
      method: POST
      schema:
        body: { type: object, additionalProperties: true }
    handler: !ref respond
    inputs:
      body: !cel "request.body"
    returns:
      - status: 200
        mode: stream
        content:
          text/event-stream:
            encoder: { kind: PlainText.Encoder }
    catches:
      - when: !cel "error.code == 'ERR_STUB_REFUSED'"
        status: 400
        content:
          application/json:
            body:
              error:
                message: !cel "error.message"
  # Lets go of every STUB_SLOW request received so far.
  - request:
      path: /release
      method: POST
    handler:
      kind: Sql.Command
      connection: !ref db
    inputs:
      sql: "INSERT INTO releases (through_id) SELECT COALESCE(MAX(id), 0) FROM requests"
    returns:
      - status: 200
        content:
          application/json:
            body:
              released: true
  - request:
      path: /requests
      method: GET
    handler:
      kind: Sql.Query
      connection: !ref db
    inputs:
      sql: "SELECT body FROM requests ORDER BY id"
    returns:
      - status: 200
        content:
          application/json:
            body:
              requests: !cel >-
                result.rows.map(r,
                  cel.bind(body, parseJson(r.body), {
                    'model': body.model,
                    'max_tokens': body.max_tokens,
                    'thinking': has(body.thinking) ? body.thinking : null,
                    'output_config': has(body.output_config) ? body.output_config : null,
                    'messages': has(body.messages) ? body.messages : [],
                    'tools': has(body.tools) ? body.tools : [],
                    'tool_choice': has(body.tool_choice) ? body.tool_choice : null,
                    'instructions': has(body.system) ? join(body.system.map(s, s.text), '\n') : '',
                    'input': has(body.messages) ? body.messages : []
                  }))
---
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
  address: 127.0.0.1
mounts:
  - path: /
    mount: !ref api
