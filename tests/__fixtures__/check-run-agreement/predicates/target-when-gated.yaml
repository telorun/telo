# A gated boot target's `when` that produces a string, not a boolean.
kind: Telo.Application
metadata:
  name: TargetWhenGated
  version: 1.0.0
imports:
  Run: ../../../../modules/run
variables:
  flag:
    env: FLAG
    type: string
    default: "false"
targets:
  - ref: !ref noop
    when: !cel "variables.flag"
---
kind: Run.Sequence
metadata: { name: noop }
steps:
  - name: done
    value: true
