# A layer bookkeeping column is no property of the node.
kind: Telo.Application
metadata:
  name: SystemColumnProperty
include:
  - ../layered-model.yaml
imports:
  SQLite: ../../../../sqlite
  Graph: ../../../../graph
  Layers: ../../..
  Run: ../../../../run
targets:
  - !ref appSchema
  - !ref probe
---
kind: Run.Sequence
metadata: { name: probe }
steps:
  - name: call
    invoke:
      kind: Graph.CreateNode
      store: !ref team
      node: !ref person
    inputs: { key: a, properties: { name: Alice, graph_layer: team } }
