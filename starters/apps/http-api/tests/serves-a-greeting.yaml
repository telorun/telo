kind: Telo.Application
metadata:
  name: HttpApiStarterTest
  version: 1.0.0
  description: >-
    Runs the starter as a reader would and calls its one route. A starter is
    copied verbatim, so it is the last thing that should be checked only by
    `telo check`: a route that no longer serves what it advertises is copied
    just as faithfully as one that does.
imports:
  App: ../../../../modules/app
  Run: ../../../../modules/run
  HttpClient: ../../../../modules/http-client
  Assert: ../../../../modules/assert
targets:
  - !ref test
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    ports:
      http: 8847
targets:
  - !ref app
steps:
  - name: greet
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8847/v1/hello?name=World
      method: GET
  - name: verifyGreeting
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.greet.result.status"
        body: !cel "steps.greet.result.body"
      expected:
        status: 200
        body:
          greeting: Hello World!

  - name: missingName
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8847/v1/hello
      method: GET
  - name: verifyRejected
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.missingName.result.status"
      expected: 400
