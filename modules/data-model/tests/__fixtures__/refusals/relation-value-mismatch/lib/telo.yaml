# A collection `telo check` refuses where it is declared; a consumer's check
# sees nothing, so there the collection refuses itself when it is created.
kind: Telo.Library
metadata:
  name: DataModelRelationValueMismatch
  version: 1.0.0
  description: Test fixture exporting a collection refused as DATA_MODEL_RELATION_VALUE_MISMATCH.
imports:
  DataModel: ../../../../../
exports:
  resources: [collection]
---
kind: Telo.JsonSchema
metadata: { name: Post }
schema:
  type: object
  required: [id, title, done]
  properties:
    id: { type: integer }
    title: { type: string }
    done: { type: boolean }
    tags: { type: array, items: { type: string } }
    note: { type: [string, "null"] }
    authorId: { type: string }
    summary: { type: string }
---
kind: Telo.JsonSchema
metadata: { name: Author }
schema:
  type: object
  required: [id]
  properties:
    id: { type: integer }
---
kind: DataModel.Collection
metadata: { name: authors }
model: !ref Author
query:
  filters: [{ property: id, operator: in }]
  sort: []
---
kind: DataModel.Collection
metadata: { name: collection }
model: !ref Post
query: { filters: [], sort: [] }
relations:
  authorId: { collection: !ref authors }
