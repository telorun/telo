# A library variable typed by its own named shape, read inside the library.
kind: Telo.Library
metadata: { name: IntegerBehindLibShape }
variables: { cfg: { $ref: "telo://Self/Config" } }
exports: { resources: [read] }
---
kind: Telo.JsonSchema
metadata: { name: Config }
schema: { type: object, properties: { n: { type: integer } } }
---
kind: Telo.Value
metadata: { name: read }
value: !cel "variables.cfg.n + 1"
