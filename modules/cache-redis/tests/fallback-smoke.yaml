kind: Telo.Application
metadata:
  name: CacheRedisFallbackSmokeTest
  version: 1.0.0
  description: |
    Points CacheRedis.Store at an unreachable Redis with a CacheMemory.Store
    fallback. Writes and reads still succeed (served by the fallback in degraded
    mode), proving the degrade-to-fallback path without needing a live Redis.
imports:
  Cache: ../../cache
  CacheMemory: ../../cache-memory
  CacheRedis: ../
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref test
---
kind: CacheMemory.Store
metadata: { name: fallback }
---
kind: CacheRedis.Store
metadata: { name: redis }
url: "redis://127.0.0.1:6390"
connectTimeout: "500ms"
fallback: !ref fallback
---
kind: Cache.Entry
metadata: { name: put }
store: !ref redis
ttl: "60s"
---
kind: Cache.Lookup
metadata: { name: get }
store: !ref redis
---
kind: Run.Sequence
metadata: { name: test }
steps:
  - name: write
    invoke: !ref put
    inputs:
      key: "k"
      value: { ok: true }
  - name: read
    invoke: !ref get
    inputs:
      key: "k"
  - name: assert
    inputs:
      state: "${{ steps.read.result.state }}"
      ok: "${{ steps.read.result.value.ok }}"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        required: [state, ok]
        properties:
          state: { const: "fresh" }
          ok: { const: true }
