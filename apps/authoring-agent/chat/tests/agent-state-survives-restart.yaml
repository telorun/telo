kind: Telo.Application
metadata:
  name: ChatAgentStateSurvivesRestart
  version: 1.0.0
  description: |
    The agent keeps its state on the workspace volume, so a restart on the same
    WORKSPACE_DIR keeps its conversations. Boots the agent against the provider
    stub, runs one turn with a tool call to its end, reads the conversation's
    records, stops it, boots a fresh instance on the same workspace and reads
    the same page back, identical. Also pins what lands on disk:
    `.telo-agent/agent.sqlite` and nothing else. Offline and key-free.
imports:
  App: oci://ghcr.io/telorun/app@0.3.0#sha256-LuwPnxFKjpaQ4Y11mIEDbTzMz41dg-degJPFhl6kdmc
  Fs: ../../../../modules/fs
  HttpClient: oci://ghcr.io/telorun/http-client@0.23.0#sha256-6WAIh0ajnTlkWNuP-59e1qNVUXVSJDWZxvPVACQg1AM
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  Assert: oci://ghcr.io/telorun/assert@0.21.0#sha256-IVtedFwGjLneOTOtKmhG90rs3qMkfSg41BfAMVKY5ts
variables:
  # This test's own workspace, emptied before each run. Resolved against the
  # working directory, like every host path an Application reads.
  workspace:
    env: CHAT_TEST_RESTART_WORKSPACE
    type: string
    x-telo-type: Telo.HostPath
    default: apps/authoring-agent/chat/tests/.scratch/agent-state-survives-restart
targets:
  - !ref test
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: stub }
    source: ./__fixtures__/provider-stub/telo.yaml
    ports: { http: 18430 }
targets: [ !ref stub ]
steps:
  # Created first so the removal always has something to remove: a previous run
  # may or may not have left a workspace behind.
  - name: prepare
    invoke: { kind: Fs.DirectoryCreation }
    inputs:
      path: !cel "string(variables.workspace)"
      createParents: true
  - name: reset
    invoke: { kind: Fs.FileRemoval }
    inputs:
      path: !cel "string(variables.workspace)"
      recursive: true
  - name: firstBoot
    invoke:
      kind: Run.Sequence
      with:
        - kind: App.Instance
          metadata: { name: agent }
          source: ../../telo.yaml
          ports: { http: 18431 }
          variables:
            workspaceDir: !cel "variables.workspace"
            modelEndpoint: http://127.0.0.1:18430/v1
          secrets:
            openaiApiKey: stub-key
      targets: [ !ref agent ]
      steps:
        - name: conversation
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18431/conversations
            method: POST
        - name: start
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18431/chat
            method: POST
          inputs:
            body:
              conversationId: !cel "steps.conversation.result.body.id"
              message: STUB_TOOL what is in the workspace?
        # Drained to its end, so the turn is finished before the restart.
        - name: events
          timeout: 30000
          invoke: { kind: HttpClient.Request }
          inputs:
            url: !interpolate "http://127.0.0.1:18431/chat/${{ steps.start.result.body.turnId }}/events"
            responseType: text
        - name: page
          invoke: { kind: HttpClient.Request }
          inputs:
            url: !interpolate "http://127.0.0.1:18431/conversations/${{ steps.conversation.result.body.id }}/records"
      outputs:
        conversationId: !cel "steps.conversation.result.body.id"
        turnId: !cel "steps.start.result.body.turnId"
        page: !cel "steps.page.result.body"
  - name: secondBoot
    invoke:
      kind: Run.Sequence
      with:
        - kind: App.Instance
          metadata: { name: agent }
          source: ../../telo.yaml
          ports: { http: 18432 }
          variables:
            workspaceDir: !cel "variables.workspace"
            modelEndpoint: http://127.0.0.1:18430/v1
          secrets:
            openaiApiKey: stub-key
      targets: [ !ref agent ]
      steps:
        - name: page
          invoke: { kind: HttpClient.Request }
          inputs:
            url: !interpolate "http://127.0.0.1:18432/conversations/${{ inputs.conversationId }}/records"
        # The state directory is not workspace content: the agent's own tree
        # listing never shows it.
        - name: tree
          invoke:
            kind: HttpClient.Request
            url: http://127.0.0.1:18432/workspace
            method: GET
      outputs:
        page: !cel "steps.page.result.body"
        files: !cel "steps.tree.result.body.files"
    inputs:
      conversationId: !cel "steps.firstBoot.result.conversationId"
  - name: kept
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        turns: !cel "steps.firstBoot.result.page.turns.map(t, [t.turnId, t.status])"
        samePage: !cel "steps.secondBoot.result.page == steps.firstBoot.result.page"
        files: !cel "steps.secondBoot.result.files"
      expected:
        turns: [ [ !cel "steps.firstBoot.result.turnId", finished ] ]
        samePage: true
        files: []
  - name: onDisk
    invoke:
      kind: Fs.DirectoryListing
      cwd: !cel "variables.workspace"
    inputs:
      recursive: true
  - name: onlyTheDatabase
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.onDisk.result.entries.map(e, e.path)"
      expected: [.telo-agent, .telo-agent/agent.sqlite]
