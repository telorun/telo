  # Forms.
  - { text: Every control from the model, translation: Все элементы управления из модели }
  - { text: "With no fields written, the form draws one control per property, chosen from its schema: a text box, a list for an enumeration, number boxes, a date, a date and time, a time, a multi-line box for a document, a checkbox, options side by side for a list of an enumeration, and typed tags for a list of words. A description is a hint under its field, and a default the starting value.", translation: "Если поля не заданы, форма отрисовывает по одному элементу управления на свойство, выбирая его по схеме: текстовое поле, список для перечисления, числовые поля, дату, дату и время, время, многострочное поле для документа, флажок, варианты рядом для списка из перечисления и вводимые теги для списка слов. Описание становится подсказкой под полем, а значение по умолчанию — начальным значением." }
  - { text: "Each field is checked against the model once it has been touched: the title's length, the number of people, the budget in steps of 50, the keywords' spelling. The server refuses a title another request has, and its answer lands on the title. What is typed is kept in the address and in this browser — all but the access code, which the model marks write-only.", translation: "Каждое поле проверяется по модели, как только его коснулись: длина заголовка, число людей, бюджет с шагом 50, написание ключевых слов. Сервер отклоняет заголовок, который уже есть у другой заявки, и его ответ появляется у поля заголовка. Введённое сохраняется в адресе и в этом браузере — всё, кроме кода доступа, который модель помечает как доступный только для записи." }
  - { text: Each control chosen by hand, translation: Каждый элемент управления выбран вручную }
  - { text: "The same request with a control written for each field: the title left to its derived control, the kind as options side by side, the channels as a list choosing several, the number of people on a slider, urgent as a switch and the keywords as tags. What is typed is kept for this tab only.", translation: "Та же заявка с элементом управления, заданным для каждого поля: заголовок — с выведенным элементом, вид работы — вариантами рядом, каналы — списком с выбором нескольких, число людей — ползунком, срочность — переключателем, а ключевые слова — тегами. Введённое сохраняется только для этой вкладки." }
  - { text: Requests received, translation: Полученные заявки }
  - { text: "The latest requests the two forms sent, read again after every save.", translation: "Последние заявки, отправленные обеими формами; перечитываются после каждого сохранения." }
  - { text: "Choices, pickers and dates", translation: "Варианты, селекторы и даты" }
  - { text: "Booking people on a project. The project is chosen from a list read from the projects collection, each option with its code as a hint. The lead is picked in a dialog, searched by name, among the active members of the role chosen above it; choosing another role reads the options again and keeps the lead only if they still fit. Reviewers are picked in a drawer, several at once, and the sponsor in a popover; the sponsor starts at a default e-mail, shown as the person's name by one lookup. Helpers are offered side by side, three at a time, with More for the rest. A picked person links to their e-mail.", translation: "Бронирование людей на проект. Проект выбирается из списка, прочитанного из коллекции проектов, у каждого варианта код служит подсказкой. Руководитель выбирается в диалоговом окне с поиском по имени среди активных участников с ролью, выбранной выше; выбор другой роли перечитывает варианты и оставляет руководителя, только если он всё ещё подходит. Рецензенты выбираются в шторке, по нескольку сразу, а спонсор — во всплывающем окне; для спонсора изначально задан e-mail по умолчанию, который одним запросом показывается как имя человека. Помощники предлагаются рядом, по три, а остальные — под кнопкой «Ещё». Выбранный человек — это ссылка на его e-mail." }
  - { text: "The period is two dates with presets, its weeks starting on Sunday, starting at next month and warning past three months. The server refuses a period that ends before it starts or runs past a year, and its answer lands on the period. The people around the lead are shown once a lead is chosen, and the site address only for work on site.", translation: "Период — это две даты с пресетами, неделя в нём начинается с воскресенья, изначально задан следующий месяц, а для периода длиннее трёх месяцев выводится предупреждение. Сервер отклоняет период, который заканчивается раньше, чем начинается, или длится больше года, и его ответ появляется у поля периода. Люди вокруг руководителя показываются, когда руководитель выбран, а адрес объекта — только для работы на объекте." }
  - { text: The project, translation: Проект }
  - { text: "Which project, and who leads the work.", translation: "Какой проект и кто руководит работой." }
  - { text: Around the lead, translation: Вокруг руководителя }
  - { text: "Who reviews the work, who sponsors it and who helps.", translation: "Кто проверяет работу, кто её спонсирует и кто помогает." }
  - { text: When and where, translation: Когда и где }
  - { text: Tomorrow, translation: Завтра }
  - { text: Next week, translation: Следующая неделя }
  - { text: This month, translation: Этот месяц }
  - { text: Next month, translation: Следующий месяц }
  - { text: Next quarter, translation: Следующий квартал }
  - { text: Next year, translation: Следующий год }
  - { text: Bookings, translation: Бронирования }
  - { text: "The latest bookings, read again after every save.", translation: "Последние бронирования; перечитываются после каждого сохранения." }

  # The labels of the actions page's models.
  - { text: Only these labels, translation: Только эти метки }
  - { text: Count blocked tasks, translation: Учитывать заблокированные задачи }
  - { text: Hours a week, translation: Часов в неделю }
  - { text: Done by, translation: Готово к }
  - { text: No label, translation: Без метки }
  - { text: Tasks, translation: Задачи }
  - { text: Hours, translation: Часы }
  - { text: Days, translation: Дни }
  - { text: Task number, translation: Номер задачи }
  - { text: "Assignee's e-mail", translation: E-mail исполнителя }
  - { text: Comment, translation: Комментарий }
  - { text: Comment number, translation: Номер комментария }
  - { text: Pinned, translation: Закреплён }
  - { text: Written, translation: Написан }
  - { text: New text, translation: Новый текст }

  # Actions.
  - { text: A bare button, translation: Просто кнопка }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "Модель ввода без свойств отрисовывает одну кнопку. Эта кнопка разблокирует все заблокированные задачи TEL-42, а счётчики задач и таблица TEL-42 ниже перечитываются." }
  - { text: Unblock TEL-42, translation: Разблокировать TEL-42 }
  - { text: An answer drawn from the result, translation: "Ответ, отрисованный по результату" }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "Маршрут суммирует оценки открытых задач проекта. Поля взяты из модели ввода и разбиты на два раздела: проект выбирается из коллекции проектов, а темп — ползунком; введённое сохраняется в адресе. Ответ отрисовывается под кнопкой: предложения по результату и отправленной записи, дата, к которой работа была бы готова, и список часов по меткам." }
  - { text: What to count, translation: Что считать }
  - { text: How fast, translation: Как быстро }
  - { text: Estimate, context: verb, translation: Оценить }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "У проекта {$project} нет открытой работы."
        one: "{$hours} ч в {$tasks} открытой задаче проекта {$project}"
        few: "{$hours} ч в {$tasks} открытых задачах проекта {$project}"
        many: "{$hours} ч в {$tasks} открытых задачах проекта {$project}"
        other: "{$hours} ч в {$tasks} открытых задачах проекта {$project}"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation:
      plural: weeks
      cases:
        one: "Около {$weeks} недели при {$pace} ч в неделю, готово к"
        few: "Около {$weeks} недель при {$pace} ч в неделю, готово к"
        many: "Около {$weeks} недель при {$pace} ч в неделю, готово к"
        other: "Около {$weeks} недели при {$pace} ч в неделю, готово к"
  - { text: By label, translation: По меткам }
  - { text: When it fails, translation: При ошибке }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "Собственное дерево ошибки действия, отрисованное по ошибке и отправленной записи. Назначьте задачу 4 на james@northwind.example — и всё получится. Не укажите e-mail или укажите человека не из команды — и отказ появится у поля; задача 999 даёт 404, а tomas@northwind.example, который ушёл из команды, — 409." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "Это действие читает ответ маршрута оценки как число дней, которого маршрут не даёт: ответ отклоняется моделью вывода действия, и об этом сообщает его дерево ошибки." }
  - { text: Estimate in days, translation: Оценить в днях }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: это не тот ответ, который читает эта кнопка." }
  - { text: Where a success goes, translation: Куда ведёт успех }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "Первая кнопка отвечает страницей со списком задач проекта, и приложение переходит туда. Вторая отвечает сайтом команды — адресом https, который заменяет страницу." }
  - { text: Open its tasks, translation: Открыть его задачи }
  - { text: Visit the homepage, translation: Перейти на сайт }
  - { text: Reading again after a success, translation: Повторное чтение после успеха }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "Перемещение задачи перечитывает и счётчики ниже — узел чтения, — и таблицу TEL-42 ещё ниже. Ответ называет задачу и её новый статус." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: к выполнению — {$todo}, в работе — {$doing}, на проверке — {$review}, завершено — {$done}, заблокировано — {$blocked}." }
  - { text: Move, translation: Переместить }
  - { text: "Task {$id}, {$title}, is now", translation: "Задача {$id}, {$title}, теперь в статусе" }
  - { text: One press after another, translation: Нажатие за нажатием }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "Комментарии отправляются один за другим в порядке нажатий кнопки, как бы быстро её ни нажимали. Кнопка ждёт трёх символов и объясняет почему; выбор другой задачи очищает последний ответ. Комментарии в списке внизу перечитываются после каждого." }
  - { text: Add the comment, translation: Добавить комментарий }
  - { text: Write three characters or more., translation: Введите не менее трёх символов. }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        "=1": "Комментарий {$id} — первый у задачи {$title}."
        one: "Комментарий {$id} добавлен к задаче {$title}, у неё теперь {$count} комментарий."
        few: "Комментарий {$id} добавлен к задаче {$title}, у неё теперь {$count} комментария."
        many: "Комментарий {$id} добавлен к задаче {$title}, у неё теперь {$count} комментариев."
        other: "Комментарий {$id} добавлен к задаче {$title}, у неё теперь {$count} комментария."
  - { text: Row actions on a table, translation: Действия строк в таблице }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "У каждой задачи TEL-42 три кнопки, и каждая после нажатия заменяется своим ответом. «Начать» выполняется сразу и только для задачи, которая ещё ожидает выполнения. «Закрыть» сначала спрашивает и недоступна для завершённой задачи. «Назначить» открывает диалоговое окно для e-mail, которого нет в строке, и показывает отказ сервера у этого поля." }
  - { text: Number, translation: Номер }
  - { text: Start, context: verb, translation: Начать }
  - { text: Closed, translation: Закрыто }
  - { text: Close this task?, translation: Закрыть эту задачу? }
  - { text: Already started., translation: Уже начата. }
  - { text: Already finished., translation: Уже завершена. }
  - { text: Assign, translation: Назначить }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title}: назначен исполнитель {$assignee}." }
  - { text: "Task {$id} is unchanged.", translation: "Задача {$id} не изменилась." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: Действия строк в списке }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "Последние комментарии — список, который отрисовывает узел чтения, закреплённые сначала. «Закрепить» выполняется сразу для ещё не закреплённого комментария, «Удалить» сначала спрашивает, а «Изменить» запрашивает новый текст в диалоговом окне; пустой текст отклоняется у своего поля. Список перечитывается после каждого действия." }
  - { text: Latest comments, translation: Последние комментарии }
  - { text: Pin, translation: Закрепить }
  - { text: Already pinned., translation: Уже закреплён. }
  - { text: Delete this comment?, translation: Удалить этот комментарий? }
  - { text: Rewrite this comment?, translation: Переписать этот комментарий? }
  - { text: More places a success goes, translation: "Другие места, куда ведёт успех" }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "Первая кнопка добавляет задачу и переходит на страницу таблиц — по адресу, записанному в манифесте. Вторая отвечает адресом руководства — файла, который сервер отдаёт в точке монтирования и который загружается обычным образом. Третья отвечает адресом зеркала команды, который браузер считает другим хостом: перехода не происходит, и ответ об этом сообщает." }
  - { text: Add it and open the tables, translation: Добавить и открыть таблицы }
  - { text: Open the handbook, translation: Открыть руководство }
  - { text: Open the mirror, translation: Открыть зеркало }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "Ответом был адрес {$mirror}, на который нельзя перейти, поэтому страница остаётся." }
  - { text: "Refused, and unanswered", translation: "Отказ и отсутствие ответа" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "Приостановить проект может только менеджер. Без сеанса защита отвечает 401. После входа на странице данных как james@northwind.example, который не менеджер, маршрут отвечает 403 без тела; после входа как ada@northwind.example он приостанавливает проект, а проект, который не активен, отказывается приостанавливать на языке страницы. Каждый отказ отрисовывает дерево ошибки действия по умолчанию." }
  - { text: Pause the project, translation: Приостановить проект }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "Проект {$code} не активен, поэтому его нельзя приостановить." }
  - { text: "{$name} is paused.", translation: "Проект {$name} приостановлен." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "Этот маршрут отправляет каждый запрос обратно самому себе, поэтому браузер сдаётся и ответ не приходит вовсе. Дерево ошибки об этом сообщает: у ошибки нет статуса." }
  - { text: Call a route that never answers, translation: "Вызвать маршрут, который никогда не отвечает" }
  - { text: "The route answered, with the status", translation: "Маршрут ответил со статусом" }
  - { text: "No answer arrived, so there is no status.", translation: "Ответ не пришёл, поэтому статуса нет." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: "Действия строк, читающие адрес" }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "Таблица показывает задачи проекта, указанного в адресе, а «Переместить» переводит задачу в статус, указанный в адресе, — он читается из запроса таблицы в момент нажатия. Строка и адрес задают все поля перемещения, поэтому его диалоговое окно ничего не спрашивает и служит простым подтверждением. Выберите проект и статус:" }
  - { text: TEL-42 into review, translation: TEL-42 на проверку }
  - { text: APP-5 to finished, translation: APP-5 в завершённые }
  - { text: OPS-7 back to in progress, translation: OPS-7 обратно в работу }
  - { text: Neither, translation: Ни один }
  - { text: Moved to, translation: Перемещено в }
  - { text: Move this task to the status the address names?, translation: "Переместить эту задачу в статус, указанный в адресе?" }
  - { text: Choose a status above first., translation: Сначала выберите статус выше. }

  # Components.
  - { text: A component on the page, translation: Компонент на странице }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "Компонент, написанный на TSX и поставляемый библиотекой этого примера, размещён с фиксированными свойствами. Он использует всё, что даёт ему хост: показывает, где находится страница, хранит в адресе, какая панель открыта, переходит на другую страницу через navigate и по ссылке из href, а адрес https ему запрещён. Он читает состояние TEL-42 и добавляет задачу через fetch, сообщает об изменении задач через notifyChanged — поэтому таблица ниже перечитывается — и считает каждое изменение, о котором узнаёт через onChanged, включая правки и удаления в самой таблице. О добавленной задаче он сообщает в собственном слое в углу страницы." }
  - { text: A component in a cell, translation: Компонент в ячейке }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "Столбец приоритета отрисовывает компонент, которому передаются приоритет каждой строки и то, заблокирована ли задача. Таблица показывает задачи TEL-42 из той же коллекции, в которую пишет компонент, поэтому перечитывается, когда выше добавляется задача; о её правках и удалениях узнаёт компонент." }
  - { text: Its stylesheet, translation: Его таблица стилей }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "Исходники компонентов импортируют собственную таблицу стилей, которую приложение помещает в слой telo.component: после темы и бренда, перед собственной таблицей стилей приложения. Каждое значение в ней читает токен дизайна, поэтому панель и индикатор принимают облик каждой точки монтирования." }

  # CRUD.
  - { text: A generated admin screen, translation: Сгенерированный экран администрирования }
  - { text: "One declaration over the tasks collection the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the collection, so the screen offers exactly what the API accepts.", translation: "Одно объявление над моделью задач, по которой работает API: панель фильтров, сортируемая таблица с разбиением на страницы, форма добавления задачи и форма её изменения, а также удаление с подтверждением в каждой строке. Столбцы, поля и фильтры выводятся из модели, поэтому экран предлагает ровно то, что принимает API." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "Панель фильтров стоит рядом с таблицей у конечного края и показывает только выбранные вами фильтры, каждый — чипом, открывающим его элемент управления. Свой выбор она хранит в этом браузере под ключом aside — тем же, что у панели фильтров рядом с таблицей на странице фильтров, поэтому фильтр, выбранный на одной странице, выбран на обеих." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "Новая задача открывается в шторке от конечного края, которая остаётся открытой и очищается для следующей. Задача изменяется в панели рядом со списком, которая входит в адрес, а при уходе из неё с несохранёнными данными сначала задаётся вопрос." }

  # Related records.
  - { text: "Related records", translation: "Связанные записи" }
  - { text: "Posts and their authors", translation: "Публикации и их авторы" }
  - { text: "Each post names its author by key. The author column shows the author's name instead, read in one request for every author on the page, and the bar's author filter offers every author by name. The create and edit forms pick the author from a list of authors, searched by name.", translation: "Каждая публикация указывает своего автора по ключу. Столбец автора показывает вместо этого имя автора, прочитанное одним запросом для всех авторов на странице, а фильтр автора на панели предлагает каждого автора по имени. Формы создания и изменения выбирают автора из списка авторов с поиском по имени." }
  - { text: "Only the authors with posts", translation: "Только авторы с публикациями" }
  - { text: "These filters offer only the authors and the statuses present among the posts the other filters leave, each with how many posts it has. The posts are drawn as cards, and as a list below the breakpoint, loading more as you reach the end.", translation: "Эти фильтры предлагают только тех авторов и те статусы, что встречаются среди публикаций, оставленных другими фильтрами, каждый с числом его публикаций. Публикации рисуются карточками, а ниже точки перелома — списком, который подгружает ещё, когда вы доходите до конца." }
  - { text: "On a board by status", translation: "На доске по статусу" }
  - { text: "One column per status, each read and counted on its own. Drag a card to another column, or move it from its menu, to change its status; every list of posts on the page reads again.", translation: "Один столбец на статус, каждый читается и считается отдельно. Перетащите карточку в другой столбец или переместите её через её меню, чтобы изменить статус; каждый список публикаций на странице читается заново." }
  - { text: "On a calendar", translation: "В календаре" }
  - { text: "The posts on the day each is published, a month at a time; the month shown reads every post dated in it. A post with no date is not on the calendar.", translation: "Публикации в день выхода каждой, по месяцу за раз; показанный месяц читает каждую публикацию, датированную в нём. Публикация без даты в календарь не попадает." }
  - { text: "The authors", translation: "Авторы" }
  - { text: "The authors' own screen, generated from their collection. It reads the same address the posts' author filter and picker read, so an author added here is offered there at once.", translation: "Собственный экран авторов, созданный из их коллекции. Он читает тот же адрес, что фильтр и выбор автора публикаций, поэтому добавленный здесь автор сразу предлагается там." }
  - { text: "Reporting lines as a tree", translation: "Подчинённость в виде дерева" }
  - { text: "Each person names who they report to, a relation of the people to themselves. The tree reads the people who report to nobody first, and a person's reports when they are opened. The form picks the manager from the same people.", translation: "Каждый человек указывает, кому он подчиняется, — отношение людей к самим себе. Дерево сначала читает тех, кто никому не подчиняется, а подчинённых человека — когда его раскрывают. Форма выбирает руководителя среди тех же людей." }
  # The labels of the related-records page's models.
  - { text: "Author", translation: "Автор" }
  - { text: "Draft", translation: "Черновик" }
  - { text: "Published", translation: "Опубликовано" }
  - { text: "Published on", translation: "Дата публикации" }
  - { text: "Reports to", translation: "Руководитель" }
  - { text: "Post", translation: "Публикация" }

  # Themes.
  - { text: Four mounts of one design, translation: Четыре точки монтирования одного дизайна }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "Одни и те же страницы отдаются четыре раза, и каждое приложение называет свою тему, бренд и навигацию. Страницы — один набор представлений, размещаемых по ссылке во всех четырёх, поэтому различаются только облик и навигация." }
  - { text: At the root, translation: В корне }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "Встроенный облик, поверх него собственная таблица стилей этого примера и бренд, выбираемый при каждом запросе: набор токенов Acme, пока его запрашивает cookie, иначе — собственные значения темы." }
  - { text: Under /radix, translation: По адресу /radix }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Тема Radix: её таблица стилей и тринадцать элементов управления — списки выбора, диалоговые окна, шторки, всплывающие окна, меню и подсказки, — а бренд оставлен теме." }
  - { text: Under /brand, translation: По адресу /brand }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "Собственная тема этого примера: элементы управления Radix под таблицей стилей, написанной здесь, с собственными значениями токенов. Бренд приложения — один набор токенов, который поставляет шрифт Inter, названный темой." }
  - { text: Under /sidebar, translation: По адресу /sidebar }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "Встроенный облик с навигацией в боковой панели рядом со страницей, которая сворачивается в узкую полосу и запоминает открытые группы. На телефоне она становится панелью вкладок вдоль нижнего края." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "Ссылка разрешается относительно точки монтирования, в которой она отрисована, поэтому ссылки между точками монтирования и переключатель бренда находятся на странице тем корневого приложения." }
  - { text: Every design token, translation: Все токены дизайна }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "Каждый токен закрытого набора — таким, каким его задают тема и бренд этой страницы, — прочитанный из пользовательского CSS-свойства, в которое его проецирует рендерер, с образцом, отрисованным с его применением. Откройте другую точку монтирования или переключите бренд в корне — и значения изменятся." }
  - { text: Typefaces, translation: Шрифты }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "Шрифты основного текста и заголовков в каждом из четырёх начертаний и для каждого начертания — отдаёт ли его это приложение. По адресу /brand это обычное, полужирное, курсивное и полужирное курсивное начертания Inter, которые поставляются с примером и отдаются вместе со страницей; две другие точки монтирования не отдают ни одного и используют шрифты самого пользователя." }
  - { text: Switch the mount or the brand, translation: Переключить точку монтирования или бренд }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "Эти ссылки принадлежат этому приложению: ссылка разрешается относительно точки монтирования, в которой она отрисована, поэтому до двух других добирается только приложение в корне. Каждая из них — обычная загрузка другого приложения." }
  - { text: Open the Radix mount, translation: Открыть точку монтирования Radix }
  - { text: Open the brand mount, translation: Открыть точку монтирования бренда }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "Бренд этого приложения выбирается при каждом запросе. Переключатель устанавливает или удаляет cookie и возвращает сюда, а пока cookie есть, вместо собственных значений темы используется набор токенов Acme." }
  - { text: Use the Acme brand, translation: Использовать бренд Acme }
  - { text: "Use the theme's own values", translation: "Использовать значения темы" }

