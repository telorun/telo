# A handler typing its `outcome` against the shared shape: the declared fields
# check clean.
kind: Telo.Application
metadata:
  name: EndHandlerOutcomeTyped
  version: 1.0.0
imports:
  RecordStream: ../../../
  Run: ../../../../run
---
kind: RecordStream.EndHandler
metadata: { name: ending }
inputs:
  outcome: !cel "outcome"
handler:
  kind: Run.Sequence
  inputType:
    kind: Telo.JsonSchema
    schema:
      type: object
      required: [outcome]
      properties:
        outcome: !ref RecordStream.StreamOutcome
  steps:
    - name: state
      value: !cel "inputs.outcome.state"
