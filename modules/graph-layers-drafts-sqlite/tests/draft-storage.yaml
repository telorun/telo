kind: Telo.Application
metadata:
  name: GraphLayersDraftsSqliteDraftStorage
  version: 1.0.0
  description: |
    What is this strategy's own, beyond the shared drafting suite: a layer has one
    open draft; a draft of a base is never visible above it; the published side
    and the draft are compared row against row, so two sides changing different
    properties of one key collide, and each of the four ways a decision can end
    leaves on the row exactly what was decided; a relationship the layer has
    published at a node its draft withdraws is a conflict whose token stops
    matching once that relationship is written again; a base that removes an
    endpoint of a relationship the draft states leaves the draft conflicted,
    never stale; a node delete in a draft states nothing about the
    relationships a base holds; every write outside a session advances the
    layer's revision and records no draft; the tables hold who opened,
    published, discarded and resolved, with the database's own time; and a
    publish joins the caller's transaction, so one that is rolled back published
    nothing. A lifecycle listing's cursor is the graph's own envelope: one
    listing's cursor resumes no other, and an envelope version this runtime
    does not read is refused.
include:
  - ./__fixtures__/drafts-model.yaml
imports:
  Sql: ../../sql
  SQLite: ../../sqlite
  Graph: ../../graph
  GraphLayers: ../../graph-layers
  Layers: ../
  Run: ../../run
  Timer: ../../timer
  Assert: ../../assert
targets:
  - !ref appSchema
  - !ref oneDraft
  - !ref baseDraftIsPrivate
  - !ref rowAgainstRow
  - !ref standingRelationship
  - !ref baseOrphansAnEndpoint
  - !ref hubDelete
  - !ref counter
  - !ref audit
  - !ref publishJoinsATransaction
---
kind: Sql.Query
metadata: { name: read }
connection: !ref db
---
kind: Assert.Equals
metadata: { name: check }
---
kind: Graph.CreateNode
metadata: { name: teamCreatePerson }
store: !ref team
node: !ref person
