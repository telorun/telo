# A page reading who is signed in when drawn: one query over `/api/auth` drawn
# by two nodes, conditions over its answer and a declared query parameter, a
# node delivered only when a request header says so. Run it and open
# http://127.0.0.1:8121/.
kind: Telo.Application
metadata: { name: UiQueryFixtureApp, version: 1.0.0 }
imports: { Http: ../../../../http-server, Ui: ../../../../ui, UiReact: ../../../ }
ports: { http: { env: PORT, default: 8121 } }
targets:
  - !ref server
---
kind: Telo.JsonSchema
metadata: { name: Auth }
schema:
  type: object
  required: [authorized]
  properties: { authorized: { type: boolean }, email: { type: string, title: Email } }
---
# Drawn by two nodes of the page: one read between them.
kind: Ui.Query
metadata: { name: account }
model: !ref Auth
url: { path: /api/auth }
reloadOn: [focus, unauthorized]
---
kind: UiReact.App
metadata: { name: app }
title: Account
theme: !ref UiReact.defaultTheme
pages:
  - kind: Ui.Page
    path: /
    title: Account
    query: { signin: { type: string, enum: [denied, expired] } }
    children:
      - type: text
        text: Your sign-in was refused.
        shown: { at: !cel "query.signin", matches: { const: denied } }
      - type: text
        text: Staff
        when: !cel "'x-role' in request.headers && request.headers['x-role'] == 'staff'"
      - type: query
        query: !ref account
        loading: []
        failure: []
        content: [{ type: value, value: !cel "data.email", shown: { at: !cel "data.authorized", matches: { const: true } } }]
      - type: query
        query: !ref account
        content:
          - type: text
            text: Sign in first.
            shown: { at: !cel "data.authorized", matches: { const: false } }
---
kind: Http.Api
metadata: { name: authApi }
routes:
  - request: { path: /, method: GET }
    handler:
      kind: Telo.Value
      outputType: !ref Auth
      value: { authorized: true, email: ada@example.com }
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result"
---
kind: Http.Server
metadata: { name: server }
listen:
  address: 127.0.0.1
  port: !cel "ports.http"
mounts:
  - path: /api/auth
    mount: !ref authApi
  - path: /
    mount: !ref app
