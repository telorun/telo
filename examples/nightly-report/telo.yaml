kind: Telo.Application
metadata:
  name: NightlyReport
  version: 1.0.0
  categories: [ Scheduling, Data, Storage ]
  description: |
    The job every service ends up with: read yesterday's rows, roll them up, write
    a file, say what happened. Here it is a schedule, a query, a group-by and a
    file write — four resources, no script.

    `Collection.GroupBy` does the aggregation over the result set in CEL, so the
    shape of the report is visible in the manifest instead of buried in SQL or in
    a JavaScript reduce. The same rollup would work over rows from an HTTP API or
    a CSV — it is not a database feature.

    Runs once at boot so you see output immediately, then on `REPORT_CRON`
    (default 03:00 daily). To watch it tick:
        REPORT_CRON='*/10 * * * * *' telo ./examples/nightly-report
    The report lands in ./reports/orders.csv.
imports:
  Http: oci://ghcr.io/telorun/http-server@0.24.0#sha256-9smTNeAG3kqd69fqYtTC5K1QKSCogC3WA_DnVIUVV8g
  Sql: oci://ghcr.io/telorun/sql@0.20.0#sha256-PjJyQ7cexRT1y35y0U7YSpMnf8T1Wh3DRrbHU-nyR3k
  SQLite: oci://ghcr.io/telorun/sql-sqlite@0.7.0#sha256-0Yg6NzMGDXyPRnbRLMrEwsF10MKHMZyO1mirH3frvRI
  Collection: oci://ghcr.io/telorun/collection@0.7.0#sha256-IDcnCppXOA9JSTIEHxSnC7CXNJtbS96veEdq9U_tVUk
  Schedule: oci://ghcr.io/telorun/scheduler@0.7.0#sha256-9bjOxzQQkxxnPud17NRJrtEK3Hp3UyRURGMrk0wORwE
  Fs: oci://ghcr.io/telorun/fs@0.8.0#sha256-MVHKevW4zsD6o_eyQMR6oxqUvQ93P6PH7WcckOLs9tc
  Run: oci://ghcr.io/telorun/run@0.22.0#sha256-FeYAHs_krf06Dk68n5Mtjp0wLSfOvDLslREHP54BiJM
  Console: oci://ghcr.io/telorun/console@0.17.0#sha256-KqtPsRldzuy143cbP7H-z0jWgbju-NuP59ItFjkWUg4
targets:
  - !ref Migrate
  - !ref BuildReport
  - !ref Nightly
  - !ref Server
ports:
  http:
    env: PORT
    protocol: tcp
    default: 8044
variables:
  reportCron:
    env: REPORT_CRON
    type: string
    default: "0 3 * * *"
---
kind: SQLite.Connection
metadata: { name: Db }
file: ":memory:"
---
kind: Sql.Migrations
metadata: { name: Migrate }
connection: !ref Db
migrations:
  0001_orders:
    statements:
      - |
        CREATE TABLE IF NOT EXISTS orders (
          id       INTEGER PRIMARY KEY AUTOINCREMENT,
          region   TEXT NOT NULL,
          status   TEXT NOT NULL,
          total_cents INTEGER NOT NULL
        )
      - "INSERT INTO orders (region, status, total_cents) VALUES ('emea', 'paid', 12000)"
      - "INSERT INTO orders (region, status, total_cents) VALUES ('emea', 'paid', 4500)"
      - "INSERT INTO orders (region, status, total_cents) VALUES ('emea', 'refunded', 4500)"
      - "INSERT INTO orders (region, status, total_cents) VALUES ('amer', 'paid', 99000)"
      - "INSERT INTO orders (region, status, total_cents) VALUES ('amer', 'pending', 2500)"
      - "INSERT INTO orders (region, status, total_cents) VALUES ('apac', 'paid', 30500)"
---
kind: Run.Sequence
metadata: { name: BuildReport }
steps:
  - name: orders
    invoke:
      kind: Sql.Query
      connection: !ref Db
    inputs:
      sql: "SELECT region, status, total_cents FROM orders"
      bindings: []

  # The rollup. `key:` names the group, `aggregate:` reduces each group's rows —
  # both plain CEL over the records, so the report's shape is readable here
  # rather than encoded in a GROUP BY.
  - name: rollup
    invoke:
      kind: Collection.GroupBy
      collection: !cel "inputs.orders"
      key:
        region: !cel "item.region"
      aggregate:
        orders: !cel "size(group)"
        paidCents: !cel "sum(group.filter(o, o.status == 'paid').map(o, o.total_cents))"
        refundedCents: !cel "sum(group.filter(o, o.status == 'refunded').map(o, o.total_cents))"
      orderBy:
        - by: !cel "row.paidCents"
          descending: true
    inputs:
      orders: !cel "steps.orders.result.rows"

  - name: write
    invoke: { kind: Fs.FileWrite }
    inputs:
      path: ./reports/orders.csv
      createParents: true
      content: !cel >-
        'region,orders,paid_cents,refunded_cents\n' +
        steps.rollup.result.rows
          .map(r, r.region + ',' + string(r.orders) + ',' + string(r.paidCents) + ',' + string(r.refundedCents))
          .join('\n') + '\n'
  - name: report
    invoke: !ref Console.writeLine
    inputs:
      output: !cel >-
        '{green ✔} wrote ./reports/orders.csv — ' +
        string(size(steps.rollup.result.rows)) + ' regions, ' +
        string(steps.write.result.bytesWritten) + ' bytes'
outputs:
  rows: !cel "steps.rollup.result.rows"
  bytesWritten: !cel "steps.write.result.bytesWritten"
---
# A schedule does not hold the process open by itself — something long-lived has
# to. Here that is the server, which is also what makes the report available on
# demand instead of only on the hour.
kind: Http.Server
metadata: { name: Server }
port: !cel "ports.http"
logger: false
openapi:
  info:
    title: Nightly report
    version: 1.0.0
mounts:
  - path: /
    mount: !ref ReportRoutes
---
kind: Http.Api
metadata: { name: ReportRoutes }
routes:
  - request:
      path: /report
      method: GET
    handler: !ref BuildReport
    inputs: {}
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result.rows"
---
kind: Schedule.Cron
metadata: { name: Nightly }
cron: !cel "variables.reportCron"
timezone: UTC
invoke: !ref BuildReport
