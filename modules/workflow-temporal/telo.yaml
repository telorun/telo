kind: Telo.Library
metadata:
  name: workflow-temporal
  version: 0.5.0
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [Coordination]
  description: >-
    Runs workflows on a Temporal cluster, which owns their durable state, retries and
    recovery so a run survives process crashes and restarts. Steps gain Temporal's own
    execution controls — activity timeouts and retry policies.
imports:
  # Import the workflow module so `Workflow.Backend` resolves from `extends` below.
  # Required regardless of whether a consuming application also imports workflow —
  # aliases in `extends` are resolved against this file's own imports.
  Workflow: ../workflow
exports:
  kinds:
    - Backend
---
kind: Telo.Definition
metadata:
  name: Backend
  description: >-
    A connection to a Temporal cluster — server address and namespace — that executes
    workflow graphs, with per-step activity timeouts and retry policies.
capability: Telo.Provider
extends: Workflow.Backend
controllers:
  - pkg:npm/@telorun/workflow-temporal@0.2.1?local_path=./nodejs#backend
schema:
  type: object
  properties:
    namespace:
      title: Namespace
      description: Temporal namespace used for workflow execution.
      type: string
    address:
      title: Address
      type: string
      description: Temporal server address (e.g. localhost:7233)
  $defs:
    NodeOptions:
      type: object
      properties:
        scheduleToCloseTimeout:
          title: Schedule To Close Timeout
          type: string
          description: Maximum time for the entire activity (e.g. 10m)
        retryPolicy:
          title: Retry Policy
          description: Retry behavior for failed activity executions.
          type: object
          properties:
            maxAttempts:
              title: Max Attempts
              description: Maximum number of activity retry attempts.
              type: integer
            initialInterval:
              title: Initial Interval
              description: Initial delay between retry attempts.
              type: string
