kind: Telo.Application
metadata:
  name: UiSplitViewTest
  version: 1.0.0
  description: |
    A split view carries its label, both trees, whether and where its fold is
    kept, and the surface its aside becomes on a narrow viewport — written, or
    filled by ui: the start edge, a medium aside, no fold, and a drawer from
    the aside's side, empty actions, a flush frame and an icon button of the look's own for
    the toggle.
lang: en
imports: { Ui: ../, Probe: ./__fixtures__/probe, Assert: ../../assert }
targets:
  - !ref check
  - !ref actionRefused
  - !ref actionRefusedAtRuntime
  - !ref barKeyRefused
  - !ref barKeyRefusedAtRuntime
---
kind: Ui.SplitView
metadata: { name: plain }
label: Filters
aside: { content: { type: text, text: Aside } }
content: { type: text, text: Content }
---
kind: Ui.SplitView
metadata: { name: written }
side: end
size: large
frame: framed
toggle: { kind: Ui.TextButton }
label: Conversations
collapse:
  collapsed: true
  state: { key: conversations, store: { kind: Ui.SessionStore } }
aside:
  actions:
    - { type: link, text: New, href: /new, button: { kind: Ui.TextButton } }
  content: { type: stack, children: [{ type: text, text: Aside }] }
content: { type: text, text: Content }
compact: { kind: Ui.Dialog, size: small }
---
kind: Telo.Sequence
metadata: { name: check }
steps:
  - name: plain
    invoke: { kind: Probe.Read, source: !ref plain }
  - name: written
    invoke: { kind: Probe.Read, source: !ref written }
  - name: plainIs
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.plain.result.node"
      expected:
        type: split
        fill: false
        side: start
        size: medium
        frame: flush
        toggle: { type: icon, icon: null, label: hidden }
        label: { text: Filters, context: null, lang: en, computed: false }
        aside: { actions: [], content: { type: text, fill: false, text: { text: Aside, context: null, lang: en, computed: false } } }
        content: { type: text, fill: false, text: { text: Content, context: null, lang: en, computed: false } }
        collapse: null
        compact:
          type: drawer
          side: start
          size: medium
          modal: true
          dismiss: { escape: true, outside: true, closeButton: true }
  - name: writtenIs
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.written.result.node"
      expected:
        type: split
        fill: false
        side: end
        size: large
        frame: framed
        toggle: { type: text }
        label: { text: Conversations, context: null, lang: en, computed: false }
        aside:
          actions:
            - type: link
              fill: false
              text: { text: New, context: null, lang: en, computed: false }
              href: { path: { value: /new }, pathParams: {}, queryParams: {} }
              button: { type: text }
          content:
            type: stack
            fill: false
            children: [{ type: text, fill: false, text: { text: Aside, context: null, lang: en, computed: false } }]
        content: { type: text, fill: false, text: { text: Content, context: null, lang: en, computed: false } }
        collapse: { collapsed: true, state: { key: conversations, store: { type: session } } }
        compact:
          type: dialog
          size: small
          modal: true
          dismiss: { escape: true, outside: true, closeButton: true }
---
kind: Assert.Manifest
metadata: { name: actionRefused }
source: ./__fixtures__/invalid/split-actions/telo.yaml
expect:
  errors:
    - { code: SCHEMA_VIOLATION, message: "Ui.SplitView/actionNotAButton" }
---
kind: Assert.Manifest
metadata: { name: actionRefusedAtRuntime }
source: ./__fixtures__/invalid/split-actions-at-runtime/telo.yaml
expect: { errors: [], runFails: "Resource does not match schema for kind Ui.SplitView" }
---
kind: Assert.Manifest
metadata: { name: barKeyRefused }
source: ./__fixtures__/invalid/split-bar-key/telo.yaml
expect:
  errors:
    - { code: SCHEMA_VIOLATION, message: "Ui.SplitView/barKey" }
---
kind: Assert.Manifest
metadata: { name: barKeyRefusedAtRuntime }
source: ./__fixtures__/invalid/split-bar-key-at-runtime/telo.yaml
expect: { errors: [], runFails: "Resource does not match schema for kind Ui.SplitView" }
