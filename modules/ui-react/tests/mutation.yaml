kind: Telo.Application
metadata:
  name: UiReactMutationTest
  version: 1.0.0
  description: |
    An application serves a form that runs a mutation, a listing's row calls
    and a page list's row calls as the nodes they provide — each call carrying
    its mutation, its inputs and its condition — and the routes they name take
    exactly what the renderer sends: the record a jsdom test holds the form
    to is answered with the files its result is drawn from, a record the
    shared input shape refuses is the 400 envelope naming the property, and
    the record a row call binds is accepted by its route.
imports: { App: ../../app, HttpClient: ../../http-client, Assert: ../../assert }
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: fixture }
    source: ./__fixtures__/mutation/telo.yaml
    ports: { http: 19331 }
targets:
  - !ref fixture
steps:
  - name: page
    invoke: { kind: HttpClient.Request, url: "http://127.0.0.1:19331/admin/_telo/ui/page?path=/" }
  - name: verifyPage
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        status: !cel "steps.page.result.status"
        form: !cel "steps.page.result.body.children[0].type"
        formId: !cel "steps.page.result.body.children[0].id"
        onSubmit: !cel "{'label': steps.page.result.body.children[0].onSubmit.label, 'inputs': steps.page.result.body.children[0].onSubmit.inputs, 'mutation': steps.page.result.body.children[0].onSubmit.mutation.url.path.value, 'method': steps.page.result.body.children[0].onSubmit.mutation.method, 'concurrency': steps.page.result.body.children[0].onSubmit.mutation.concurrency, 'invalidates': steps.page.result.body.children[0].onSubmit.mutation.invalidates, 'result': steps.page.result.body.children[0].onSubmit.result.type}"
        listing: !cel "steps.page.result.body.children[1].type"
        rowActions: !cel "steps.page.result.body.children[1].rowActions.map(r, {'mutation': [r.mutation.id, r.mutation.url.path.value], 'label': r.label, 'result': r.result, 'inputs': r.inputs, 'confirm': r.confirm, 'enabled': r.enabled, 'prompt': r.prompt, 'onSuccess': r.onSuccess})"
        months: !cel "steps.page.result.body.children[2].rowActions.map(r, {'mutation': r.mutation.id, 'label': r.label, 'inputs': r.inputs, 'prompt': r.prompt})"
        sameMutation: !cel "steps.page.result.body.children[2].rowActions[0].mutation == steps.page.result.body.children[0].onSubmit.mutation"
      expected:
        status: 200
        form: form
        formId: UiMutationFixtureApp/reportForm
        onSubmit:
          label: { lang: und, message: [Generate] }
          inputs:
            month: { root: values, path: [month] }
            copies: { root: values, path: [copies] }
            formats: { root: values, path: [formats] }
            recipients: { root: values, path: [recipients] }
          mutation: /api/reports
          method: POST
          concurrency: serial
          invalidates: [{ path: { value: /api/todos }, pathParams: {}, queryParams: {} }]
          result: list
        listing: listing
        rowActions:
          - mutation: [UiMutationFixtureApp/archive, /api/archive]
            label: { lang: und, message: [Archive] }
            result: { type: value, fill: false, value: { root: result, path: [archived] }, labels: [], present: { type: boolean } }
            inputs: { id: { root: row, path: [id] }, status: { value: archived } }
            confirm: { lang: und, message: [Archive this task?] }
            enabled:
              at: { root: row, path: [text] }
              matches: { minLength: 1 }
              disabledText: { lang: und, message: [Name it first.] }
            prompt: null
            onSuccess: []
        months:
          - mutation: UiMutationFixtureApp/generate
            label: { lang: und, message: [Generate] }
            inputs: { month: { root: row, path: [] } }
            prompt: null
        # One mutation, however many places run it: the form's and the row's are the same declaration.
        sameMutation: true

  - name: run
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:19331/admin/api/reports
      method: POST
      headers: { content-type: application/json }
      body: !include-text ./__fixtures__/mutation/report-request.json
  - name: refused
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:19331/admin/api/reports
      method: POST
      body: { month: September }
  - name: archive
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:19331/admin/api/archive
      method: POST
      headers: { content-type: application/json }
      body: !include-text ./__fixtures__/mutation/archive-request.json
  - name: verifyRoutes
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        run:
          status: !cel "steps.run.result.status"
          body: !cel "steps.run.result.body"
        refused:
          status: !cel "steps.refused.result.status"
          body: !cel "steps.refused.result.body"
        archive:
          status: !cel "steps.archive.result.status"
          body: !cel "steps.archive.result.body"
      expected:
        run:
          status: 200
          body:
            files:
              - { name: 2026-09.pdf, url: /files/2026-09.pdf }
              - { name: 2026-09.csv, url: /files/2026-09.csv }
        refused:
          status: 400
          body:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The request is not valid.
            code: ERR_INPUT_INVALID
            data:
              issues:
                - { pointer: /body/month, keyword: pattern, params: { pattern: "^[0-9]{4}-[0-9]{2}$" } }
        archive: { status: 200, body: { archived: true } }
