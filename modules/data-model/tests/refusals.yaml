kind: Telo.Application
metadata:
  name: DataModelRefusalsTest
  version: 1.0.0
  description: |
    What a collection refuses about its own declaration: a key the model does not
    require, a filter, sort or facet by a property the model does not declare, an
    operator the property's type cannot carry (`absent` on a required property
    included), a filter named as a parameter the endpoint owns, a sort or facet
    by a list, and a relation naming an undeclared property, holding another
    type than its target's key (a target another module exports included) or
    pointing at a target that cannot be asked for keys with `in`. Each is
    reported by `telo check` where the collection is declared, and refused by
    the collection itself when a manifest reaches it without that check. A
    self-relation and a pair of collections relating to each other pass the
    check and boot.
imports: { Assert: ../../assert }
targets:
  - !ref keyUndeclared
  - !ref keyUndeclaredAtRuntime
  - !ref filterUnknownProperty
  - !ref filterUnknownPropertyAtRuntime
  - !ref filterOperatorUnsupported
  - !ref filterOperatorUnsupportedAtRuntime
  - !ref filterAbsentRequired
  - !ref filterAbsentRequiredAtRuntime
  - !ref filterReservedName
  - !ref filterReservedNameAtRuntime
  - !ref sortUnknownProperty
  - !ref sortUnknownPropertyAtRuntime
  - !ref sortUnsupported
  - !ref sortUnsupportedAtRuntime
  - !ref facetUnknownProperty
  - !ref facetUnknownPropertyAtRuntime
  - !ref facetUnsupported
  - !ref facetUnsupportedAtRuntime
  - !ref relationUnknownProperty
  - !ref relationUnknownPropertyAtRuntime
  - !ref relationValueMismatch
  - !ref relationValueMismatchAtRuntime
  - !ref relationValueMismatchAcrossModules
  - !ref relationValueMismatchAcrossModulesAtRuntime
  - !ref relationKeyNotFilterable
  - !ref relationKeyNotFilterableAtRuntime
  - !ref relations
---
kind: Assert.Manifest
metadata: { name: keyUndeclared }
source: ./__fixtures__/refusals/key-undeclared/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "DataModel.Collection/collection: does not declare its key as a required property"
---
kind: Assert.Manifest
metadata: { name: keyUndeclaredAtRuntime }
source: ./__fixtures__/refusals/key-undeclared/telo.yaml
expect:
  errors: []
  runFails: "[ERR_DATA_MODEL_KEY_UNDECLARED] RuntimeError: DataModel.Collection 'collection': 'model' does not declare a required 'id'"
---
kind: Assert.Manifest
metadata: { name: filterUnknownProperty }
source: ./__fixtures__/refusals/filter-unknown-property/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "DataModel.Collection/collection at 'query.filters[0]': filters by a property `model` does not declare"
---
kind: Assert.Manifest
metadata: { name: filterUnknownPropertyAtRuntime }
source: ./__fixtures__/refusals/filter-unknown-property/telo.yaml
expect:
  errors: []
  runFails: "[ERR_DATA_MODEL_FILTER_UNKNOWN_PROPERTY] RuntimeError: DataModel.Collection 'collection': 'query.filters[0]' filters by 'status', which 'model' does not declare"
---
kind: Assert.Manifest
metadata: { name: filterOperatorUnsupported }
source: ./__fixtures__/refusals/filter-operator-unsupported/lib/telo.yaml
expect:
  errors:
    - code: RESOURCE_RULE_VIOLATED
      message: "DataModel.Collection/collection at 'query.filters[1]': uses an operator the property's type does not support"
---
kind: Assert.Manifest
metadata: { name: filterOperatorUnsupportedAtRuntime }
source: ./__fixtures__/refusals/filter-operator-unsupported/telo.yaml
expect:
  errors: []
  runFails: "[ERR_DATA_MODEL_FILTER_OPERATOR_UNSUPPORTED] RuntimeError: DataModel.Collection 'collection': 'query.filters[1]' uses an operator the property's type does not support ('contains' on 'done', declared boolean)"
---
kind: Assert.Manifest
metadata: { name: filterAbsentRequired }
source: ./__fixtures__/refusals/filter-absent-required/lib/telo.yaml
expect:
