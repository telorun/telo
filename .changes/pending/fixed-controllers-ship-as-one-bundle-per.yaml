body: Controllers ship as one bundle per module, selected by PURL fragment, and a
  module-owned library is resolved at load through the import graph instead of being
  copied into each dependent's bundle. A shared source file compiled into two bundles
  was two module scopes, so state a module kept beside its instances silently became two
  of them.
