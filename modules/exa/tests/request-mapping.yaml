# What the engine sends: `POST /search` with the query, `numResults` covering the
# slice plus one probe result up to Exa's 100, highlights as the only contents,
# the configured moderation flag, the country hint as `userLocation` and the
# recency hint as `startPublishedDate`, the start of the window. No language and
# no search type are ever sent. The mock echoes the body as the title.
kind: Telo.Application
metadata:
  name: ExaRequestMappingTest
  version: 1.0.0
imports:
  Exa: ..
  Http: ../../http-client
  Server: ../../http-server
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref requestMapping
---
kind: Http.Request
metadata: { name: request }
client: { kind: Http.Client, baseUrl: "http://localhost:18864" }
---
kind: Exa.WebSearchEngine
metadata: { name: moderated }
request: !ref request
safeSearch: true
---
kind: Exa.WebSearchEngine
metadata: { name: unmoderated }
request: !ref request
---
kind: Run.Value
metadata: { name: echo }
value: {}
---
kind: Run.Sequence
metadata: { name: requestMapping }
with:
  - kind: Server.Api
    metadata: { name: FakeExa }
    routes:
      - request:
          path: /search
          method: POST
          schema:
            body: { type: object, additionalProperties: true }
        handler: !ref echo
        returns:
          - status: 200
            content:
              application/json:
                schema: { type: object, additionalProperties: true }
                body:
                  results:
                    - title: !cel "json(request.body)"
                      url: https://echo.example/
  - kind: Server.Server
    metadata: { name: FakeServer }
    port: 18864
    mounts:
      - path: /
        mount: !ref FakeExa
targets:
  - !ref FakeServer
steps:
  - name: allHints
    invoke: !ref moderated
    inputs: { query: rust async, count: 5, language: en, country: FI, freshness: day }
  # Without `count`, the whole window is requested.
  - name: noHints
    invoke: !ref unmoderated
    inputs: { query: rust async, language: de }
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        # The window's start is a moment ago minus one day.
        - !cel >-
          cel.bind(b, parseJson(steps.allHints.result.results[0].title),
            {'fields': size(b), 'query': b.query, 'numResults': b.numResults, 'contents': b.contents,
             'moderation': b.moderation, 'userLocation': b.userLocation,
             'startsADayAgo': now() - timestamp(b.startPublishedDate) >= duration('24h') &&
               now() - timestamp(b.startPublishedDate) < duration('25h')})
        - !cel "parseJson(steps.noHints.result.results[0].title)"
      expected:
        - { fields: 6, query: rust async, numResults: 6, contents: { highlights: true }, moderation: true, userLocation: FI, startsADayAgo: true }
        - { query: rust async, numResults: 100, contents: { highlights: true }, moderation: false }
