      message: >-
        mounts this router with a route whose `authentication` denies anonymous callers while neither
        the route nor this mount names a verifier, so no request can ever be served there. List
        `verifiers` on the route or the mount, or allow anonymous callers.
  examples:
    - routes:
        - request:
            method: GET
            path: /users/:id
            schema:
              params:
                type: object
                required: [ id ]
                properties: { id: { type: string, description: User id to fetch., examples: ["8f14e45f"] } }
              query:
                type: object
                properties:
                  expand:
                    type: string
                    description: Comma-separated list of relations to expand.
                    examples: [ "posts" ]
          inputs:
            id: !cel "request.params.id"
            expand: !cel "request.query.expand"
          handler: !ref GetUser
          returns:
            - status: 200
              content:
                application/json:
                  schema:
                    type: object
                    required: [ id, email ]
                    properties:
                      id: { type: string, description: User id., examples: ["8f14e45f"] }
                      email:
                        type: string
                        description: User's email address.
                        examples: [ "ada@example.com" ]
                  body:
                    id: !cel "result.rows[0].id"
                    email: !cel "result.rows[0].email"
---
kind: "Telo.Definition"
metadata:
  name: "Reference"
  description: >-
    Browsable API documentation as a mountable router: renders the OpenAPI
    document the server collects from its routes as an interactive reference
    page, and serves the document itself as JSON and YAML under the same prefix.
capability: Telo.Mount
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#HttpReferenceController]
schema:
  type: "object"
  additionalProperties: false
  description: >-
    Attach it to an Http.Server mount to publish the docs at a path you choose.
    The document itself is the server's — it is collected from every mounted
    route's schema and needs the server's `openapi:` block — so this renders and
    serves it, and a server without that block is an error rather than an empty
    page. Give the mount a `when:` to leave the docs out of a deployment.
  properties:
    title:
      title: Title
      description: >-
        Browser page title. Defaults to the API title from the server's
        `openapi.info`.
      type: "string"
      x-telo-eval: compile
    theme:
      title: Theme
      description: Colour preset for the reference page.
      type: "string"
      x-telo-eval: compile
      enum: [default, alternate, moon, purple, solarized, bluePlanet, deepSpace, saturn, kepler, elysiajs, fastify, mars, laserwave, none]
      default: default
  # The document is the SERVER's — collected from every mounted route's schema —
  # so a reference mounted on a server that declares no `openapi:` block has
  # nothing to render. Neither kind can state that alone, and unstated it fails
  # at boot, after the port is claimed. Declared here rather than on the server
  # because the requirement is this kind's: a server should not have to know
  # which mounts need what.
  x-telo-referrer-rules:
    - referrer: Self.Server
      condition: !cel "has(referrer.openapi)"
      code: HTTP_REFERENCE_WITHOUT_OPENAPI
      message: >-
        mounts an Http.Reference, but declares no `openapi:` block, so no OpenAPI
        document is collected and the reference has nothing to render. Declare
        `openapi.info` on this server.
  examples:
    - {}
    - { title: Todo API docs, theme: deepSpace }
---
kind: "Telo.Definition"
metadata:
  name: "Static"
  description: Serves a directory of static files as a mountable router, with SPA fallback and Cache-Control options.
capability: Telo.Mount
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#HttpStaticController]
schema:
  type: "object"
  description: >-
    Serves a directory of static assets (a built SPA, plain HTML, images, …) as
    a mountable router. Attach it to an Http.Server mount alongside an Http.Api
    so one application delivers both its API and its frontend.
  properties:
    root:
      title: Root
      description: >-
        Directory of files to serve, as an absolute path. Write a directory
        that ships with the module as `!module-path ./public`; serve a
        directory on the host (files the application writes at runtime) from a
        variable declared `x-telo-type: Telo.HostPath`.
      type: "string"
      x-telo-type: { name: Telo.HostPath, entry: directory }
      x-telo-eval: compile
    index:
      title: Index
      description: File served for the directory root. Defaults to index.html.
      type: "string"
      x-telo-eval: compile
      default: "index.html"
    spaFallback:
      title: SPA Fallback
      description: >-
        Serve the index file for any path that does not match a file, so a
        single-page app's client-side routing works on deep links / refresh.
      type: "boolean"
      x-telo-eval: compile
      default: false
    maxAge:
      title: Max Age
      description: >-
        Cache-Control max-age in seconds. When set, served assets carry a
        Cache-Control header; omit for no caching directive.
      type: "integer"
      x-telo-eval: compile
      minimum: 0
    immutable:
      title: Immutable
      description: >-
        Add the `immutable` Cache-Control directive (for content-hashed asset
        filenames that never change). Only meaningful together with maxAge.
      type: "boolean"
      x-telo-eval: compile
      default: false
  required: [ "root" ]
  examples:
    - { root: ./public }
    - root: ./dist
      spaFallback: true
      maxAge: 3600
      immutable: true
---
kind: Telo.JsonSchema
metadata:
  name: AuthScheme
  description: >-
    An HTTP authentication scheme name, as it appears in `Authorization` and
    `WWW-Authenticate` — `Bearer`, `Basic`, `DPoP`, `ApiKey`. An RFC 9110 token.
schema: { type: string, pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$" }
---
kind: Telo.JsonSchema
metadata:
  name: Authentication
  description: >-
    Who may call an HTTP mount or route: an ordered list of credential verifiers,
    each with where its credential is read — a header, the query, a cookie, a
    client certificate — and whether a request presenting no credential is served
    anonymously. A presented credential that fails is refused, never served as
    anonymous.
schema:
  type: object
  additionalProperties: false
  properties:
    verifiers:
      title: Verifiers
      description: >-
        Tried in order. An entry whose source finds no credential is skipped; the
        first presented credential decides, accepted or refused.
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [verifier, from]
        properties:
          verifier:
            title: Verifier
            description: Judges the credential and answers with the caller or a refusal.
            x-telo-ref: { kind: Auth.Verifier, use: trigger.inbound }
          from:
            title: From
            description: Where the credential is read; null when the request carries none there.
            x-telo-ref:
              kind: Self.CredentialSource
              use: trigger.inbound
              outputTo: { slot: /verifier, member: presentation }
    anonymous:
      title: Anonymous
      description: >-
        `deny` (the default) answers a request presenting no credential 401;
        `allow` serves it with a null `request.principal`.
      type: string
      enum: [allow, deny]
      default: deny
      x-telo-eval: compile
---
kind: Telo.JsonSchema
metadata:
  name: Authorization
  description: >-
    The policy deciding whether an authenticated, or anonymous, caller may perform
    an action on a resource, both written as expressions over the request and its
    principal. A denial is a 403, naming the scopes the caller lacks when the
    policy says.
schema:
  type: object
  additionalProperties: false
  required: [policy, action]
  properties:
    policy:
      title: Policy
      description: The policy asked for every request.
      x-telo-ref: { kind: Auth.Policy, use: trigger.inbound }
    action:
      title: Action
      description: What the request attempts, e.g. `request.method + ' ' + request.path`; evaluated per request.
      type: string
    resource:
      title: Resource
      description: What it is attempted on, evaluated per request; null when omitted.
---
kind: Telo.JsonSchema
metadata:
  name: CredentialRequest
  description: >-
    What a credential source reads from an HTTP request before its body: method,
    path, host, headers, query, cookies, client address, TLS session and client
    certificate.
schema:
  type: object
  required: [method, path, host, headers, query, cookies, ip, tls, clientCertificate]
  properties:
    method: { type: string }
    path: { type: string }
    host: { type: string }
    headers: { type: object, additionalProperties: true, description: Header values by lower-case name., x-telo-sensitive: true }
    query: { type: object, additionalProperties: true, x-telo-sensitive: true }
    cookies: { type: object, additionalProperties: { type: string }, x-telo-sensitive: true }
    ip: { type: string }
    tls: { type: [object, "null"], properties: { protocol: { type: string } } }
    clientCertificate:
      description: The client certificate the listener received or a trusted proxy forwarded; null when there is none.
      type: [object, "null"]
      x-telo-sensitive: true
---
# A source's reading publishes `schemes` (the authentication schemes a request
# lacking its credential is challenged with), and may publish `originCheck:
# { trustedOrigins }` (a credential the browser sends on its own) and
# `requiresTrustedProxy: true`, and `bearerMethod` (`header` or `query`, the RFC 6750
# method it reads a Bearer token by). Normative: docs/authentication.md.
kind: Telo.Abstract
metadata:
  name: CredentialSource
  description: >-
    Reads one credential from where an HTTP request carries it — a header, the
    query, a cookie, the client certificate — and answers with the presentation,
    or null when the request carries none there. A credential that is present but
    unreadable is refused as malformed, never read as absent.
capability: Telo.Invocable
inputType: !ref CredentialRequest
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.Presentation, { type: "null" }] }
throws:
  codes:
    ERR_HTTP_CREDENTIAL_MALFORMED:
      description: The request carries the credential, but it cannot be read; the transport refuses it 401.
---
kind: Telo.Definition
metadata:
  name: FromAuthorization
  description: >-
    Reads a token from the `Authorization` header under the listed schemes,
    matched case-insensitively — `Bearer`, `DPoP`. A header under another scheme
    is no credential for this source; a listed scheme with no readable token is
    refused as malformed.
capability: Telo.Invocable
extends: Self.CredentialSource
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#FromAuthorizationController]
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.TokenPresentation, { type: "null" }] }
schema:
  type: object
  additionalProperties: false
  required: [schemes]
  properties:
    schemes:
      title: Schemes
      description: The schemes a token is read under, in the spelling challenges use.
      type: array
      minItems: 1
      x-telo-eval: compile
      items: { $ref: "telo://Self/AuthScheme" }
---
kind: Telo.Definition
metadata:
  name: FromBasic
  description: >-
    Reads a user identifier and password from an `Authorization: Basic` header.
    Credentials that do not decode are refused as malformed.
capability: Telo.Invocable
extends: Self.CredentialSource
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#FromBasicController]
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.BasicPresentation, { type: "null" }] }
schema: { type: object, additionalProperties: false, properties: {} }
---
kind: Telo.Definition
metadata:
  name: FromHeader
  description: >-
    Reads a token from a named request header, such as an API key in
    `X-Api-Key`. An empty or repeated header is refused as malformed.
capability: Telo.Invocable
extends: Self.CredentialSource
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#FromHeaderController]
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.TokenPresentation, { type: "null" }] }
schema:
  type: object
  additionalProperties: false
  required: [header, scheme]
  properties:
    header: { title: Header, description: The header name; matched case-insensitively., type: string, minLength: 1, x-telo-eval: compile }
    scheme:
      title: Scheme
      description: The scheme a request lacking the header is challenged with.
      $ref: "telo://Self/AuthScheme"
      x-telo-eval: compile
---
kind: Telo.Definition
metadata:
  name: FromQuery
  description: >-
    Reads a token from a named query parameter. An empty or repeated parameter
    is refused as malformed.
capability: Telo.Invocable
extends: Self.CredentialSource
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#FromQueryController]
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.TokenPresentation, { type: "null" }] }
schema:
  type: object
  additionalProperties: false
  required: [parameter, scheme]
  properties:
    parameter: { title: Parameter, description: The query parameter name., type: string, minLength: 1, x-telo-eval: compile }
    scheme:
      title: Scheme
      description: The scheme a request lacking the parameter is challenged with.
      $ref: "telo://Self/AuthScheme"
      x-telo-eval: compile
---
kind: Telo.Definition
metadata:
  name: FromCookie
  description: >-
    Reads a token from a declared cookie, such as a session identifier. Because
    a browser sends the cookie on its own, a request authenticated through it
    that changes state must come from this site or a trusted origin.
capability: Telo.Invocable
extends: Self.CredentialSource
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#FromCookieController]
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.TokenPresentation, { type: "null" }] }
schema:
  type: object
  additionalProperties: false
  required: [cookie, scheme]
  properties:
    cookie:
      title: Cookie
      description: The cookie declaration, so its prefixed name is read.
      x-telo-ref: { kind: HttpDispatch.Cookie, use: dependency }
    scheme:
      title: Scheme
      description: The scheme a request lacking the cookie is challenged with.
      $ref: "telo://Self/AuthScheme"
      x-telo-eval: compile
    trustedOrigins:
      title: Trusted origins
      description: Other origins (`https://app.example`, no path) whose state-changing requests this cookie may authenticate.
      type: array
      x-telo-eval: compile
      items: { type: string }
  x-telo-resource-rules:
    - in: /trustedOrigins
      condition: !cel "this.matches('^https?://[^/?#@]+$')"
      code: HTTP_TRUSTED_ORIGIN_INVALID
      message: >-
        lists a trusted origin that is not an origin. Write the scheme and host, with a port when it is
        not the default, and nothing after it — `https://app.example`.
---
kind: Telo.Definition
metadata:
  name: FromClientCertificate
  description: >-
    Presents the TLS client certificate the listener received, or a trusted
    proxy forwarded, for a verifier to judge.
capability: Telo.Invocable
extends: Self.CredentialSource
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#FromClientCertificateController]
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.CertificatePresentation, { type: "null" }] }
schema:
  type: object
  additionalProperties: false
  required: [scheme]
  properties:
    scheme:
      title: Scheme
      description: The scheme a request without a certificate is challenged with.
      $ref: "telo://Self/AuthScheme"
      x-telo-eval: compile
---
kind: Telo.Definition
metadata:
  name: FromForwardedIdentity
  description: >-
    Reads the identity a trusted reverse proxy or gateway authenticated and
    forwarded in a header. Declared only on a mount of a server that trusts the
    proxy in front of it, since any client could send the header otherwise.
capability: Telo.Invocable
extends: Self.CredentialSource
controllers: [pkg:telo/local/js?path=./nodejs/http-server.mjs&local_path=./nodejs/src/index.ts#FromForwardedIdentityController]
outputType:
  kind: Telo.JsonSchema
  schema: { anyOf: [!ref Auth.AssertedPresentation, { type: "null" }] }
schema:
  type: object
  additionalProperties: false
  required: [header, scheme]
  properties:
    header: { title: Header, description: The header holding the subject; matched case-insensitively., type: string, minLength: 1, x-telo-eval: compile }
    scheme:
      title: Scheme
      description: The scheme a request without the header is challenged with.
      $ref: "telo://Self/AuthScheme"
      x-telo-eval: compile
  x-telo-referrer-rules:
    - referrer: Self.Server
      condition: !cel >-
        has(referrer.trustProxy) ? referrer.trustProxy == true || (referrer.trustProxy != false && referrer.trustProxy > 0)
        : has(referrer.trustForwardedHeaders) && referrer.trustForwardedHeaders
      code: HTTP_PROXY_SOURCE_UNTRUSTED
      message: >-
        reads a forwarded identity but trusts no proxy, so any client could send that header and be
        served as anyone. Set `trustProxy` to the proxy in front of this server.
    - referrer: Self.Api
      condition: !cel "false"
      code: HTTP_PROXY_SOURCE_ON_ROUTE
      message: >-
        reads a forwarded identity in a route's `authentication`. Only a mount's can: whether the
        proxy is trusted is the server's. Move the entry to the mount.
