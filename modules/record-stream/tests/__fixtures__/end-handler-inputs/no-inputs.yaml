# An EndHandler must say what its handler is called with.
kind: Telo.Application
metadata:
  name: EndHandlerInputsMissing
  version: 1.0.0
imports:
  RecordStream: ../../../
  Run: ../../../../run
---
kind: RecordStream.EndHandler
metadata: { name: ending }
handler:
  kind: Run.Sequence
  inputType:
    kind: Telo.JsonSchema
    schema:
      type: object
      required: [code]
      properties:
        code: { type: string }
  steps:
    - name: code
      value: !cel "inputs.code"
