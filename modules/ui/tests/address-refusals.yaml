kind: Telo.Application
metadata:
  name: UiAddressRefusalsTest
  version: 1.0.0
  description: |
    A path variable the template lacks, or a template variable nothing binds, is
    refused by `telo check` and again when the node's resource is created, and
    a row field a column's link reads that the row lacks is refused by
    `telo check`. A `*` or `**` segment in a link or a request target is
    refused in both spellings by `telo check` and again when the resource is
    created, while a refresh with one is still held to its `pathParams`.
imports: { Assert: ../../assert }
targets:
  - !ref pathParams
  - !ref pathParamsAtRuntime
  - !ref rowField
  - !ref wildcards
  - !ref wildcardAtRuntime
---
kind: Assert.Manifest
metadata: { name: pathParams }
source: ./__fixtures__/invalid/address-path-params/lib/telo.yaml
expect:
  errors:
    - { code: PATH_PARAMETER_UNBOUND, message: "Ui.View/misspelledVariable" }
    - { code: PATH_PARAMETER_UNUSED, message: "Ui.View/misspelledVariable" }
---
kind: Assert.Manifest
metadata: { name: pathParamsAtRuntime }
source: ./__fixtures__/invalid/address-path-params/telo.yaml
expect: { errors: [{ code: PATH_PARAMETER_UNBOUND, message: "Ui.View/misspelledVariable: 'href.path: /x/{id}' reads '{id}', which 'href.pathParams' does not bind. Add 'id' to 'href.pathParams'." }, { code: PATH_PARAMETER_UNUSED, message: "Ui.View/misspelledVariable: 'href.pathParams.idd' names no variable of 'href.path: /x/{id}' — it reads 'id'. Remove the entry, or name the variable it fills." }], runFails: "ERR_PATH_PARAMETER_UNBOUND" }
---
kind: Assert.Manifest
metadata: { name: rowField }
source: ./__fixtures__/invalid/address-row-field/telo.yaml
expect:
  errors:
    - code: CEL_UNKNOWN_FIELD
      message: "Ui.View/misspelledField: !cel: 'row.nmae' is not defined (available: id, name)"
---
kind: Assert.Manifest
metadata: { name: wildcards }
source: ./__fixtures__/invalid/address-wildcard/lib/telo.yaml
expect:
  errors:
    - { code: SCHEMA_VIOLATION, message: "Ui.View/literalLink: /content/to/href" }
    - { code: SCHEMA_VIOLATION, message: "Ui.View/templateLink: /content/to/href/path" }
    - { code: SCHEMA_VIOLATION, message: "Ui.Mutation/literalTarget: /url" }
    - { code: SCHEMA_VIOLATION, message: "Ui.Mutation/templateTarget: /url/path" }
    - { code: PATH_PARAMETER_UNBOUND, message: "Ui.Mutation/unboundRefresh" }
    - { code: PATH_PARAMETER_UNUSED, message: "Ui.Mutation/unboundRefresh" }
---
kind: Assert.Manifest
metadata: { name: wildcardAtRuntime }
source: ./__fixtures__/invalid/address-wildcard/telo.yaml
expect: { errors: [{ code: SCHEMA_VIOLATION, message: "Ui.View/literalLink: /content/to/href matches a shape that is not allowed here" }, { code: SCHEMA_VIOLATION, message: "Ui.View/templateLink: /content/to/href/path matches a shape that is not allowed here" }, { code: SCHEMA_VIOLATION, message: "Ui.Mutation/literalTarget: /url matches a shape that is not allowed here" }, { code: SCHEMA_VIOLATION, message: "Ui.Mutation/templateTarget: /url/path matches a shape that is not allowed here" }, { code: PATH_PARAMETER_UNBOUND, message: "Ui.Mutation/unboundRefresh: 'invalidates[0].path: /api/{id}/**' reads '{id}', which 'invalidates[0].pathParams' does not bind. Add 'id' to 'invalidates[0].pathParams'." }, { code: PATH_PARAMETER_UNUSED, message: "Ui.Mutation/unboundRefresh: 'invalidates[0].pathParams.idd' names no variable of 'invalidates[0].path: /api/{id}/**' — it reads 'id'. Remove the entry, or name the variable it fills." }], runFails: "ERR_RESOURCE_SCHEMA_VALIDATION_FAILED" }
