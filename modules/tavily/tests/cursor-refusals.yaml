# A cursor the engine cannot honour is ERR_INVALID_INPUT, raised before any
# request, with a message naming the cause: another engine's cursor, one issued
# for different inputs, and a position that is not numeric or lies beyond the
# 20 results Tavily returns.
kind: Telo.Application
metadata:
  name: TavilyCursorRefusalsTest
  version: 1.0.0
imports:
  Tavily: ..
  WebSearch: ../../web-search
  Http: ../../http-client
  Run: ../../run
  Assert: ../../assert
targets:
  - !ref cursorRefusals
---
# Nothing listens here: a refusal must come before any request is sent.
kind: Tavily.WebSearchEngine
metadata: { name: engine }
request:
  kind: Http.Request
  client: { kind: Http.Client, baseUrl: "http://localhost:18861" }
---
kind: Run.Sequence
metadata: { name: cursorRefusals }
steps:
  - name: refusals
    invoke:
      kind: Run.Projection
      collection: !cel >-
        [
          WebSearch.sealCursor('exa', {'query': 'q'}, '3'),
          WebSearch.sealCursor('tavily', {'query': 'q', 'freshness': 'day'}, '3'),
          WebSearch.sealCursor('tavily', {'query': 'q'}, 'three'),
          WebSearch.sealCursor('tavily', {'query': 'q'}, '20'),
          WebSearch.sealCursor('tavily', {'query': 'q'}, '99999999999999999999')
        ]
      steps:
        - name: attempt
          try:
            - name: search
              invoke: !ref engine
              inputs: { query: q, cursor: !cel "item" }
          catch:
            - name: caught
              value: { code: !cel "error.code", message: !cel "error.message" }
      outputs: !cel "steps.caught.result"
  - name: check
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.refusals.result"
      expected:
        - code: ERR_INVALID_INPUT
          message: The cursor was not issued by the tavily engine.
        - code: ERR_INVALID_INPUT
          message: The cursor was issued for a different query, language, country or freshness; it is valid only with the inputs it was issued for.
        - code: ERR_INVALID_INPUT
          message: The cursor holds a position the tavily engine cannot read.
        - code: ERR_INVALID_INPUT
          message: The cursor holds a position the tavily engine cannot read.
        - code: ERR_INVALID_INPUT
          message: The cursor holds a position the tavily engine cannot read.
