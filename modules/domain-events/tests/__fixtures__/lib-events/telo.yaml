kind: Telo.Library
metadata: { name: Events, version: 0.1.0 }
imports: { Domain: ../../../ }
exports: { resources: [UserCreated, announce] }
---
kind: Domain.Event
metadata: { name: UserCreated }
schema: { type: object, required: [email], properties: { email: { type: string } } }
---
kind: Domain.Event
metadata: { name: Private }
schema: { type: object }
---
kind: Domain.Emit
metadata: { name: announce }
event: !ref UserCreated
