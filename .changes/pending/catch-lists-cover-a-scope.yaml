modules:
  modules/http-server: Added
  # `Added`, not `Changed`: modules are intentionally pre-1.0, so a breaking
  # change ships as a minor and the break is described in the body below.
  modules/http-dispatch: Added
body: "`Http.Api` and `Http.Server` each accept a `catches:` list of their own, so
  error rendering is declared once per scope instead of restated on every route. A
  route's own entries are tried first, then its router's, then the server's; a throw
  no entry claims renders the same `{error: {code, message, data}}` envelope with
  status 500 that an unmatched throw produced before, so a manifest declaring no
  scope-level list is unchanged on the wire. Scope entries see `error` and the
  request's `path` / `method` / `ip`; `query` / `body` / `params` stay with a route's
  own list, because there is no single route to type them from. A route entry with no
  `when:` deliberately overrides both outer lists for that route alone.

  Crossing the mount boundary is a rethrow rather than a wider mount contract, so the
  server's list reaches every mount — a third-party one and an `Mcp.HttpEndpoint`
  included — and `notFoundHandler`, whose own entries are still tried first.
  `dispatchCatches` therefore no longer invents a response: it reports whether an entry
  matched and leaves what an unmatched throw means to the caller, which is the only
  side that knows whether another rung follows. A caller outside this repository that
  relied on the built-in 500 must render `errorEnvelope(error)` itself when the call
  returns false.

  Coverage moves with it. `UNCOVERED_THROW_CODE` and `UNBOUNDED_UNION_NEEDS_CATCHALL`
  are now asked once per dispatch site over every list that can render its throws, so a
  route declaring no `catches:` under a router that covers everything reports nothing —
  left per-list they would have fired on precisely the manifests this enables. A
  server-level catch-all consequently satisfies the unbounded-union rule for every
  mounted route.

  This module needs no higher `requires: telo:` floor, verified by execution: a previous
  runtime reads it with no issues, because both new annotation forms degrade to silence
  there. An APPLICATION writing a scope-level `catches:` should declare one, though —
  such a runtime skips the list and so reports its routes as uncovered.

  A route's `returns:` and `catches:` now anchor at `HttpDispatch.Outcomes/$defs/*` like
  every other outcome slot, instead of carrying a fourth inline copy of those shapes. The
  entry shapes are also CLOSED now, so a misspelled key is reported wherever it is written
  — a route's copy always rejected one and the shared carrier did not, which made the
  identical typo an error on a route and silence in a `notFoundHandler`."
