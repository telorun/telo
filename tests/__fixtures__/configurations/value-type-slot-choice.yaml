# A declaration's inline contract writes a value type a choice decides: the
# type names nothing only in the configurations taking the branch.
kind: Telo.Application
metadata: { name: ValueTypeSlotChoice }
variables: { flag1: { env: FLAG_1, type: boolean, default: false } }
targets:
  - !ref sequence
---
kind: Telo.Sequence
metadata: { name: sequence }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      x: !if
        if: !cel "variables.flag1"
        then: { x-telo-type: Telo.Bogus }
steps:
  - { name: add, value: 1 }
