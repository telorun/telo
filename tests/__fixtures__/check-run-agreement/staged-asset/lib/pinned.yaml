# A staged asset an assets: pattern claims, pinned and present: it checks clean,
# and the kernel verifies it before the controller reads it.
kind: Telo.Library
metadata:
  name: PinnedAsset
  version: 1.0.0
exports:
  kinds:
    - Reader
assets:
  - ./assets/
sources:
  greetings:
    version: 1.0.0
    url: https://example.test/greetings-{version}.tar.gz
    archive: tar.gz
    notices: [./LICENSE]
    entries:
      ./assets/greeting.txt:
        { upstream: any, member: greeting.txt, sha256: dc95e7b7d2f2d519beddbddedc2dd3a9a7c836ffc92a25b4158b56d47abcc61a, executable: false }
---
kind: Telo.Definition
metadata:
  name: Reader
  description: Returns the text of the library's own staged greeting asset.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./reader.mjs#reader
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      text: { type: string }
    required: [text]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
