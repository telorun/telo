kind: Telo.Application
metadata:
  name: RunSequenceInputs
  version: 1.0.0
imports:
  Run: ../
  Assert: ../../assert
targets:
  - !ref testInputs
---
# A sub-sequence invoked with caller inputs reads them via the `inputs` CEL
# variable across step `inputs:`, an `if:` predicate, and the `outputs:` mapping.
# Regression: the controller used to spread caller inputs flat, so `inputs.x`
# failed at runtime with "Unknown variable: inputs".
kind: Run.Sequence
metadata:
  name: greet
steps:
  - name: build
    if: !cel "inputs.shout"
    then:
      - name: loud
        inputs: { name: !cel "inputs.name" }
        invoke:
          kind: Run.Value
          inputType:
            kind: Telo.JsonSchema
            schema:
              type: object
              properties:
                name: { type: string }
          value:
            text: !cel "'HELLO ' + inputs.name"
    else:
      - name: quiet
        inputs: { name: !cel "inputs.name" }
        invoke:
          kind: Run.Value
          inputType:
            kind: Telo.JsonSchema
            schema:
              type: object
              properties:
                name: { type: string }
          value:
            text: !cel "'hello ' + inputs.name"
outputs:
  loud: !cel "steps.loud.result.text"
---
kind: Run.Sequence
metadata:
  name: testInputs
steps:
  - name: callGreet
    invoke: !ref greet
    inputs:
      name: telo
      shout: true
  - name: verify
    inputs:
      text: !cel "steps.callGreet.result.loud"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          text: { const: "HELLO telo" }
        required: [ text ]
