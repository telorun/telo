[package]
name = "telo-studio"
version = "0.1.0"
license-file = "../../../LICENSE"
description = "Telo Studio"
authors = ["bartosz.pasinski@codenet.pl"]
repository = ""
default-run = "telo-studio"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "telo_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Minor-pinned, and so are their npm counterparts in ../package.json. The CLI
# refuses to build when a crate's major.minor differs from its `@tauri-apps/*`
# package, and a caret range on either side lets one drift alone on the next
# lockfile refresh. Upgrading means editing both files in the same change.
tauri = { version = "2.11", features = [] }        # @tauri-apps/api
tauri-plugin-dialog = "2.7"                        # @tauri-apps/plugin-dialog
tauri-plugin-fs = "2.5"                            # @tauri-apps/plugin-fs
tauri-plugin-opener = "2.5"                        # @tauri-apps/plugin-opener
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "io-util", "net", "rt-multi-thread", "time", "macros", "sync"] }

# Telo Cloud sign-in and API transport. TLS is rustls with the ring provider
# (installed by `cloud_auth`): reqwest's default provider, aws-lc, needs NASM
# to build on Windows.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "stream", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Default features: Keychain on macOS, Credential Manager on Windows, the
# Secret Service elsewhere.
keyring = "4.2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.4"
url = "2.5"
futures-util = "0.3"

# One call: SIGTERM to the local runner, so it stops its own sessions before it
# goes. `kill()` is SIGKILL, which skips that and orphans every `telo run
# --watch` the runner started, still holding the user's ports.
[target.'cfg(unix)'.dependencies]
libc = "0.2"


[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]

# Empty workspace table makes this crate its own workspace root, decoupling
# it from the repo-root Cargo.toml's pnpm-workspace setup. Without this,
# `cargo` walks up to the root Cargo.toml and refuses to build because this
# crate isn't listed in `workspace.members` there. Tauri's own tooling does
# not depend on the parent workspace either way.
[workspace]
