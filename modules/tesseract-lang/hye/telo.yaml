    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/hye.traineddata.gz:
        { upstream: hye, member: package/4.0.0_best_int/hye.traineddata.gz, sha256: ff791a6c85736354350a487b40fa58337372e03291abf97863916aea35d603e8, executable: false }
---
kind: TesseractModel.Language
metadata:
