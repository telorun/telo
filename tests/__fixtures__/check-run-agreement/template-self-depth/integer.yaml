# `self.a.x` two levels deep, declared `integer`: typed int at check and bound
# as an int64 at run, so `self.a.x + 1` checks and runs.
kind: Telo.Application
metadata: { name: TemplateSelfDepthInteger }
imports: { Assert: ../../../../modules/assert }
targets: [!ref verify]
---
kind: Telo.Definition
metadata: { name: Bump }
capability: Telo.Invocable
schema:
  type: object
  properties:
    a:
      type: object
      properties: { x: { type: integer } }
      required: [x]
  required: [a]
resources:
  - kind: Telo.Sequence
    metadata: { name: bumping }
    steps:
      - name: bumped
        value: !cel "self.a.x + 1"
    outputs:
      bumped: !cel "steps.bumped.result"
invoke: !ref bumping
---
kind: Telo.Sequence
metadata: { name: verify }
steps:
  - { name: bump, invoke: { kind: Self.Bump, a: { x: 4 } } }
  - name: verify
    invoke: { kind: Assert.Equals }
    inputs:
      actual: !cel "steps.bump.result"
      expected: { bumped: 5 }
