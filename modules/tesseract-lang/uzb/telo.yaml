  tessdata:
    version: 1.0.0
    url: https://registry.npmjs.org/@tesseract.js-data/{upstream}/-/{upstream}-{version}.tgz
    archive: tar.gz
    notices: [./notices/tessdata.LICENSE]
    entries:
      ./tessdata/uzb.traineddata.gz:
        { upstream: uzb, member: package/4.0.0_best_int/uzb.traineddata.gz, sha256: 16d7f4a0af8722227ea447c99a2159f1a186af137c392ff8caeb69f2d4ceee20, executable: false }
---
kind: TesseractModel.Language
metadata:
