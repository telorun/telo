kind: Telo.Application
metadata:
  name: TemplatedApiExampleTest
  version: 1.0.0
  description: >-
    Runs `examples/templated-api` and calls both mounts. One library-exported route
    mounted at two paths is the whole point of the example, so both are asserted —
    a mount that quietly stopped serving would otherwise show up as a 404 nobody
    looks for.
imports:
  App: oci://ghcr.io/telorun/app@0.7.0#sha256-Za_YCZXHwq1xIPS6-J_O5SdMw6HAYxd-s8gUBZMg9II
  HttpClient: oci://ghcr.io/telorun/http-client@0.25.0#sha256-bkm9YuaTBexTNH0QDyW8_O3h9Msg5vQZl9c62NIboLE
  Assert: oci://ghcr.io/telorun/assert@0.22.1#sha256-hhbmksorbzkkGV2LXmjug1JjzzMxQvBpOLY2RyXwlUI
targets:
  - !ref test
---
kind: Telo.Sequence
metadata: { name: test }
with:
  - kind: App.Instance
    metadata: { name: app }
    source: ../telo.yaml
    ports: { http: 8846 }
targets:
  - !ref app
steps:
  - name: v1
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8846/v1/hello?name=World
      method: GET
  - name: v2
    invoke:
      kind: HttpClient.Request
      url: http://127.0.0.1:8846/v2/hello?name=World
      method: GET
  - name: verifyBothMounts
    invoke: { kind: Assert.Equals }
    inputs:
      actual:
        v1Status: !cel "steps.v1.result.status"
        v1Body: !cel "steps.v1.result.body"
        v2Status: !cel "steps.v2.result.status"
        v2Body: !cel "steps.v2.result.body"
      expected:
        v1Status: 200
        v1Body: { greeting: "Hello World!!", nice: WOW }
        v2Status: 200
        v2Body: { greeting: "Hello World!!", nice: WOW }
