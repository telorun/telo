# The showcase in Dutch: the applications' and pages' titles, every text the
# pages write, the labels of the models they draw, and the words the renderer
# draws on its own. A plural source is matched by the text its `other` case
# reads and translated into Dutch's two cases, one and other; a word told
# apart by its context is translated once per context.
kind: I18n.Catalog
metadata:
  name: dutch
lang: nl
texts:
  # Applications and pages.
  - { text: UI showcase, translation: UI-showcase }
  - { text: UI showcase — Radix, translation: UI-showcase — Radix }
  - { text: UI showcase — brand, translation: UI-showcase — merk }
  - { text: UI showcase — sidebar, translation: UI-showcase — zijbalk }
  - { text: Overview, translation: Overzicht }
  - { text: Conditions, translation: Voorwaarden }
  - { text: Data, translation: Gegevens }
  - { text: Tables, translation: Tabellen }
  - { text: Filters, translation: Filters }
  - { text: Forms, translation: Formulieren }
  - { text: Actions, translation: Acties }
  - { text: Components, translation: Componenten }
  - { text: CRUD, translation: CRUD }
  - { text: Themes, translation: "Thema's" }
  # The navigation's groups.
  - { text: Building blocks, translation: Bouwstenen }
  - { text: Input, translation: Invoer }

  # The header of every application: the mark, the Language and Theme
  # menus and the Theme menu's items. The language names are each written
  # in its own language, so neither is translated.
  - { text: UI showcase logo, translation: Logo van de UI-showcase }
  - { text: Language, translation: Taal }
  - { text: Theme, translation: Thema }
  - { text: Default, translation: Standaard }
  - { text: Radix, translation: Radix }
  - { text: Brand, translation: Merk }
  - { text: Sidebar, translation: Zijbalk }

  # The overview's nodes evaluated per request.
  - { text: Per request, translation: Per verzoek }
  - { text: "These nodes are the page's own, so their when and their text are evaluated for every request.", translation: "Deze knooppunten horen bij de pagina zelf, dus hun when en hun tekst worden bij elk verzoek geëvalueerd." }
  - { text: Your browser asked for Polish., translation: Je browser vroeg om Pools. }
  - { text: Your browser did not ask for Polish., translation: Je browser vroeg niet om Pools. }
  - { text: The Acme brand is on., translation: Het merk Acme staat aan. }
  - { text: "A text an expression computes is shown as computed, never translated.", translation: "Een tekst die een expressie berekent, wordt getoond zoals hij is berekend en nooit vertaald." }
  - { text: "A link this request makes invalid is replaced by an error node, and the rest of the page is served.", translation: "Een link die dit verzoek ongeldig maakt, wordt vervangen door een foutknooppunt, en de rest van de pagina wordt geserveerd." }
  - { text: Leaves the application, translation: Verlaat de applicatie }

  # The overview.
  - { text: Every node type, translation: Elk type knooppunt }
  - { text: "A box, a stack and columns hold other nodes, each drawing its children its own way.", translation: "Een vak, een stapel en kolommen bevatten andere knooppunten en tekenen hun kinderen elk op hun eigen manier." }
  - { text: A box, translation: Een vak }
  - { text: Groups its children., translation: Groepeert zijn kinderen. }
  - { text: A stack, translation: Een stapel }
  - { text: Draws its children one under another., translation: Tekent zijn kinderen onder elkaar. }
  - { text: A badge, translation: Een badge }
  - { text: Columns, translation: Kolommen }
  - { text: "Draw their children side by side, as these three are.", translation: "Tekenen hun kinderen naast elkaar, zoals deze drie." }
  - { text: Text in each style, translation: Tekst in elke stijl }
  - { text: "A style says what a node means; the theme decides how that looks. A node may carry several.", translation: "Een stijl zegt wat een knooppunt betekent; het thema bepaalt hoe dat eruitziet. Een knooppunt kan er meerdere hebben." }
  - { text: Heading, translation: Kop }
  - { text: Subheading, translation: Subkop }
  - { text: Muted, translation: Gedempt }
  - { text: Strong, translation: Nadruk }
  - { text: Accent, translation: Accent }
  - { text: Danger, translation: Gevaar }
  - { text: Warning, translation: Waarschuwing }
  - { text: Success, translation: Succes }
  - { text: Strong and accent, translation: Nadruk en accent }
  - { text: Links, translation: Links }
  - { text: "A link to a declared page moves within the application; a file served under the mount is an ordinary load; https and mailto leave it.", translation: "Een link naar een gedeclareerde pagina navigeert binnen de applicatie; een bestand dat onder het koppelpunt wordt geserveerd, wordt gewoon geladen; https en mailto verlaten de applicatie." }
  - { text: Go to Conditions, translation: Naar Voorwaarden }
  - { text: A file the server serves, translation: Een bestand dat de server serveert }
  - { text: Write to us, translation: Schrijf ons }
  - { text: Images, translation: Afbeeldingen }
  - { text: "An image by address, the same image as decoration with an empty alt, and SVG markup drawn as an image, never inserted into the page.", translation: "Een afbeelding via een adres, dezelfde afbeelding als decoratie met een lege alt, en SVG-opmaak getekend als afbeelding, nooit in de pagina ingevoegd." }
  - { text: The showcase mark, translation: Het beeldmerk van de showcase }
  - { text: Three overlapping circles, translation: Drie overlappende cirkels }
  - { text: Values by their schema, translation: Waarden volgens hun schema }
  - { text: "Each value is drawn as its model property says, read from the team record the page loads.", translation: "Elke waarde wordt getekend zoals haar modeleigenschap aangeeft, gelezen uit het teamrecord dat de pagina laadt." }
  - { text: Visit the team homepage, translation: Homepage van het team bezoeken }
  - { text: "A uri, drawn as a link with a text of its own", translation: "Een uri, getekend als link met een eigen tekst" }
  - { text: A uri-reference to a declared page, translation: Een uri-reference naar een gedeclareerde pagina }
  - { text: A uri-reference to a served file, translation: Een uri-reference naar een geserveerd bestand }
  - { text: A mailto address, translation: Een mailto-adres }
  - { text: "An address the rule refuses, drawn as plain text", translation: "Een adres dat de regel weigert, getekend als platte tekst" }
  - { text: A date, translation: Een datum }
  - { text: A date and time, translation: Een datum en tijd }
  - { text: A boolean, translation: Een booleaanse waarde }
  - { text: An enumeration's label, translation: Het label van een opsomming }
  - { text: A list, translation: Een lijst }
  - { text: "The rows one answer holds, never paged. A header defaults to the property's title, and the last column is shown only while the team is hiring.", translation: "De rijen van één antwoord, nooit gepagineerd. Een kop is standaard de titel van de eigenschap, en de laatste kolom wordt alleen getoond zolang het team mensen aanneemt." }
  - { text: Projects under way, translation: Lopende projecten }
  - { text: Project, translation: Project }
  - { text: Texts, translation: Teksten }
  - text: "{$count} projects so far."
    translation:
      plural: count
      cases:
        "=0": Nog geen projecten.
        one: "{$count} project tot nu toe."
        other: "{$count} projecten tot nu toe."
  - { text: "{$team} started {$project} most recently.", translation: "Het laatst gestarte project van {$team} is {$project}." }
  - { text: "A plural chosen in the browser for the number it reads, and a text whose values come from the record.", translation: "Een meervoud dat de browser kiest voor het getal dat hij leest, en een tekst waarvan de waarden uit het record komen." }
  - { text: Open, context: state, translation: Open }
  - { text: Open, context: verb, translation: Openen }
  - { text: "A node's own text is told apart the same way: the badge says TEL-42 is open, the link offers to open its tasks.", translation: "De eigen tekst van een knooppunt wordt op dezelfde manier onderscheiden: de badge zegt dat TEL-42 open is, de link biedt aan de taken ervan te openen." }
  - { text: Style rules, translation: Stijlregels }
  - { text: "A row's style and a cell's are chosen by a value of the row. The featured project is strong, each status has its colour, and a status no case names takes the default. Two columns are headed by the same word, Open, told apart by the context each header is written with.", translation: "De stijl van een rij en die van een cel worden gekozen door een waarde van de rij. Het uitgelichte project krijgt nadruk, elke status heeft zijn eigen kleur, en een status die geen enkel geval noemt, krijgt de standaardstijl. Twee kolommen hebben hetzelfde woord als kop, Open, onderscheiden door de context waarmee elke kop is geschreven." }
  - { text: Composites, translation: Composieten }
  - { text: "This whole page is a view each application places by reference. Below, a view written inline where it is placed, and a composite kind of this example's own, which has no controller.", translation: "Deze hele pagina is een weergave die elke applicatie via een verwijzing plaatst. Hieronder een weergave die inline is geschreven waar ze wordt geplaatst, en een eigen composietsoort van dit voorbeeld, die geen controller heeft." }
  - { text: A view declared inline at the node that places it., translation: Een weergave die inline is gedeclareerd bij het knooppunt dat haar plaatst. }
  - { text: A callout, translation: Een uitgelichte melding }
  - { text: "Declared once as a kind that extends Ui.Composite and provides a view, and placed with fields of its own.", translation: "Eenmaal gedeclareerd als soort die Ui.Composite uitbreidt en een weergave levert, en geplaatst met eigen velden." }
  # The overview's tabs; `Details` and `Notes` are translated with the forms' labels.
  - { text: Tabs, translation: Tabbladen }
  - { text: "Content under tabs, one tab at a time. The chosen tab is part of the page's address, so a reload or a shared link opens it again.", translation: "Inhoud onder tabbladen, één tabblad tegelijk. Het gekozen tabblad maakt deel uit van het adres van de pagina, dus herladen of een gedeelde link opent het opnieuw." }
  - { text: Summary, translation: Samenvatting }
  - { text: "A tab holds any nodes, as a box does.", translation: "Een tabblad bevat willekeurige knooppunten, net als een vak." }
  - { text: "Only the chosen tab's nodes are drawn.", translation: "Alleen de knooppunten van het gekozen tabblad worden getekend." }
  - { text: Chosen, translation: Gekozen }
  - { text: "Each tab is delivered by its own when, as any node is.", translation: "Elk tabblad wordt afgeleverd volgens zijn eigen when, zoals elk knooppunt." }
  # The labels of the overview's models.
  - { text: Code, translation: Code }
  - { text: Name, translation: Naam }
  - { text: Status, translation: Status }
  - { text: Active, translation: Actief }
  - { text: Paused, translation: Gepauzeerd }
  - { text: Finished, translation: Voltooid }
  - { text: Budget, translation: Budget }
  - { text: Started, translation: Gestart }
  - { text: Free, context: subscription, translation: Gratis }
  - { text: Enterprise, context: subscription, translation: Zakelijk }
  - { text: Version, translation: Versie }
  - { text: Team, context: subscription, translation: Team }

  # Conditions.
  - { text: Delivered and drawn, translation: Afgeleverd en getekend }
  - { text: "A node's when decides on the server whether it is delivered; its shown decides in the browser whether a delivered node is drawn.", translation: "De when van een knooppunt bepaalt op de server of het wordt afgeleverd; zijn shown bepaalt in de browser of een afgeleverd knooppunt wordt getekend." }
  - { text: Never delivered — this node is not in the page document., translation: Nooit afgeleverd — dit knooppunt staat niet in het paginadocument. }
  - { text: "Delivered and never drawn: the status is not paused, so the browser holds this out of sight.", translation: "Afgeleverd en nooit getekend: de status is niet paused, dus de browser houdt dit buiten beeld." }
  - { text: Delivered by its when and drawn by its shown., translation: Afgeleverd door zijn when en getekend door zijn shown. }
  - { text: "A placement's condition around a composite whose node has one of its own is wrapped in a box, and both must hold.", translation: "De voorwaarde van een plaatsing rond een composiet waarvan het knooppunt een eigen voorwaarde heeft, wordt in een vak verpakt, en beide moeten gelden." }
  - { text: Both conditions hold., translation: Beide voorwaarden gelden. }
  - { text: "A view whose content is switched off by its own when provides no node, so the composite placing it is left out.", translation: "Een weergave waarvan de inhoud door haar eigen when wordt uitgeschakeld, levert geen knooppunt, dus de composiet die haar plaatst wordt weggelaten." }
  - { text: Never provided., translation: Nooit geleverd. }
  - { text: Every keyword of a condition, translation: Elk sleutelwoord van een voorwaarde }
  - { text: "Each line below is drawn because its condition holds over the summary of project TEL-42 this page read: status active, four members, velocity 2.5, tags design and web, its lead a manager, a null note and no codename.", translation: "Elke regel hieronder wordt getekend omdat zijn voorwaarde geldt voor de samenvatting van project TEL-42 die deze pagina las: status active, vier leden, snelheid 2.5, tags design en web, een manager als leider, een note met null en geen codename." }
  - { text: "allOf: between 1 and 10 people work on it.", translation: "allOf: er werken 1 tot 10 mensen aan." }
  - { text: "required: the lead has an e-mail.", translation: "required: de leider heeft een e-mailadres." }
  - { text: "properties: the lead is a manager.", translation: "properties: de leider is een manager." }
  - { text: "minimum: at least three people work on it.", translation: "minimum: er werken minstens drie mensen aan." }
  - { text: "maximum: at most nine people work on it.", translation: "maximum: er werken hoogstens negen mensen aan." }
  - { text: "exclusiveMinimum: the velocity is greater than 2.", translation: "exclusiveMinimum: de snelheid is groter dan 2." }
  - { text: "exclusiveMaximum: the velocity is less than 3.", translation: "exclusiveMaximum: de snelheid is kleiner dan 3." }
  - { text: "multipleOf: the velocity is a multiple of 0.5.", translation: "multipleOf: de snelheid is een veelvoud van 0.5." }
  - { text: "type: the status is a string.", translation: "type: de status is een tekenreeks." }
  - { text: "type, as a list: the note is a string or null.", translation: "type als lijst: note is een tekenreeks of null." }
  - { text: "const: the status is active.", translation: "const: de status is active." }
  - { text: "enum: the status is active or paused.", translation: "enum: de status is active of paused." }
  - { text: "not: the status is not paused.", translation: "not: de status is niet paused." }
  - { text: "anyOf: the code starts with TEL or OPS.", translation: "anyOf: code begint met TEL of OPS." }
  - { text: "items: every tag has at least two letters.", translation: "items: elke tag heeft minstens twee letters." }
  - { text: "minItems: there are at least two tags.", translation: "minItems: er zijn minstens twee tags." }
  - { text: "maxItems: there are at most five tags.", translation: "maxItems: er zijn hoogstens vijf tags." }
  - { text: "uniqueItems: no tag repeats.", translation: "uniqueItems: geen enkele tag komt dubbel voor." }
  - { text: "minLength: the code has at least three characters.", translation: "minLength: code heeft minstens drie tekens." }
  - { text: "maxLength: the code has at most ten characters.", translation: "maxLength: code heeft hoogstens tien tekens." }
  - { text: "pattern: the code is letters, a dash and digits.", translation: "pattern: code bestaat uit letters, een streepje en cijfers." }
  - { text: Missing and null, translation: Ontbrekend en null }
  - { text: "Null is a present value. A missing value satisfies no condition, not even one under not, so absence is tested on the parent.", translation: "Null is een aanwezige waarde. Een ontbrekende waarde voldoet aan geen enkele voorwaarde, zelfs niet aan een onder not, dus afwezigheid wordt op de ouder getest." }
  - { text: The note is present and null., translation: note is aanwezig en null. }
  - { text: "Never drawn: a missing codename does not satisfy not.", translation: "Nooit getekend: een ontbrekende codename voldoet niet aan not." }
  - { text: "The project has no codename, tested on the summary.", translation: "Het project heeft geen codename, getest op de samenvatting." }
  - { text: Query parameters, translation: Queryparameters }
  - { text: "This reader declares mode, a list of tag values and a ticket held to a pattern. A parameter the address leaves out, a single one given twice or a value its declaration refuses counts as missing.", translation: "Deze lezer declareert mode, een lijst van tag-waarden en een ticket dat aan een patroon moet voldoen. Een parameter die het adres weglaat, een enkelvoudige die twee keer is opgegeven of een waarde die zijn declaratie weigert, telt als ontbrekend." }
  - { text: Mode detailed, translation: Modus detailed }
  - { text: Two tags, translation: Twee tags }
  - { text: A valid ticket, translation: Een geldig ticket }
  - { text: A refused ticket, translation: Een geweigerd ticket }
  - { text: Mode given twice, translation: Modus twee keer opgegeven }
  - { text: Clear the query, translation: Query wissen }
  - { text: mode is detailed., translation: mode is detailed. }
  - { text: There are two tag values or more., translation: Er zijn twee of meer tag-waarden. }
  - { text: The ticket matches its pattern., translation: ticket voldoet aan zijn patroon. }
  - { text: "No ticket, or one its pattern refuses.", translation: "Geen ticket, of een dat zijn patroon weigert." }
  - { text: Enablement, translation: Beschikbaarheid }
  - { text: "The button can be pressed only while its condition over what the form holds is met, and says why while it is not. A tag the project already has is refused, and the lines above read the summary again after a tag is added.", translation: "De knop kan alleen worden ingedrukt zolang zijn voorwaarde over wat het formulier bevat is vervuld, en zegt waarom zolang dat niet zo is. Een tag die het project al heeft, wordt geweigerd, en de regels hierboven lezen de samenvatting opnieuw nadat een tag is toegevoegd." }
  - { text: Tag TEL-42, translation: TEL-42 taggen }
  - { text: Tag, translation: Tag }
  - { text: Type a tag of three letters or more., translation: Typ een tag van drie of meer letters. }
  - text: "Tagged {$tag}: TEL-42 has {$count} tags now."
    translation:
      plural: count
      cases:
        one: "{$tag} toegevoegd: TEL-42 heeft nu {$count} tag."
        other: "{$tag} toegevoegd: TEL-42 heeft nu {$count} tags."
  - { text: A page's own query, translation: De eigen query van een pagina }
  - { text: "This page declares mode as well, and its own nodes read it.", translation: "Deze pagina declareert ook mode, en haar eigen knooppunten lezen het." }
  - { text: The page reads mode as detailed., translation: De pagina leest mode als detailed. }

  # Data.
  - { text: A reader and its parameters, translation: Een lezer en zijn parameters }
  - { text: "The project is the page address's project parameter, sent with the read; with none the parameter is not sent and the route answers for TEL-42. A code no project has draws the failure tree.", translation: "Het project is de parameter project van het paginadres, meegestuurd met het lezen; zonder project wordt de parameter niet meegestuurd en antwoordt de route voor TEL-42. Een code die geen enkel project heeft, tekent de foutboom." }
  - { text: A code no project has, translation: Een code die geen project heeft }
  - { text: No project, translation: Geen project }
  - { text: Reading the project…, translation: Project wordt gelezen… }
  - { text: "{$code} {$name}, led by {$lead}", translation: "{$code} {$name}, geleid door {$lead}" }
  - { text: "A reader nested in this one's content reads the people working on the same project.", translation: "Een lezer die in de inhoud van deze lezer is genest, leest de mensen die aan hetzelfde project werken." }
  - { text: Working on it, translation: Werken eraan }
  - { text: Role, translation: Rol }
  - { text: E-mail, translation: E-mail }
  - { text: "No answer · {$code}", translation: "Geen antwoord · {$code}" }
  - { text: Readers that fail, translation: Lezers die falen }
  - { text: "With no failure tree of their own, readers draw the error's code and message — for a project that does not exist, for a guarded route read with no session, and for an answer the reader's model refuses (the projects list read as one project).", translation: "Zonder eigen foutboom tekenen lezers de code en het bericht van de fout — voor een project dat niet bestaat, voor een beveiligde route die zonder sessie wordt gelezen, en voor een antwoord dat het model van de lezer weigert (de projectenlijst gelezen als één project)." }
  - { text: "Never drawn: there is no such project.", translation: "Nooit getekend: zo'n project bestaat niet." }
  - { text: "Signed in, so this reads: {$name}", translation: "Ingelogd, dus dit wordt gelezen: {$name}" }
  - { text: "Never drawn: a list is no project.", translation: "Nooit getekend: een lijst is geen project." }
  - { text: Read again on focus, translation: Opnieuw lezen bij focus }
  - { text: "This reader reads the server's time again whenever the window regains focus. Switch to another window and back.", translation: "Deze lezer leest de tijd van de server opnieuw telkens wanneer het venster weer focus krijgt. Schakel naar een ander venster en terug." }
  - { text: Read at, translation: Gelezen om }
  - { text: A sign-in gate, translation: Een inlogpoort }
  - { text: "The gate reads whether a session is open, and reads again whenever a request inside it answers 401. Signing in opens a session for a member of the team; an e-mail nobody on the team has is refused on its field. Inside, a reader over a guarded route shows the account. Ending the session quietly leaves the account on screen until the next guarded request — the check below, or a focus — is refused, and the gate then swaps to the signed-out view.", translation: "De poort leest of er een sessie open is, en leest opnieuw telkens wanneer een verzoek erbinnen 401 antwoordt. Inloggen opent een sessie voor een lid van het team; een e-mailadres dat niemand in het team heeft, wordt bij zijn veld geweigerd. Binnenin toont een lezer over een beveiligde route het account. De sessie stil beëindigen laat het account op het scherm staan tot het volgende beveiligde verzoek — de controle hieronder, of een focus — wordt geweigerd, en de poort wisselt dan naar de uitgelogde weergave." }
  - { text: You are signed out., translation: Je bent uitgelogd. }
  - { text: Sign in, translation: Inloggen }
  - { text: "Signed in as {$name}", translation: "Ingelogd als {$name}" }
  - { text: "Member since {$since}", translation: "Lid sinds {$since}" }
  - { text: Check the session, translation: Sessie controleren }
  - { text: End the session quietly, translation: Sessie stil beëindigen }
  - { text: Sign out, translation: Uitloggen }

  # The labels of the task models.
  - { text: Task, translation: Taak }
  - { text: Assignee, translation: Toegewezen aan }
  - { text: Priority, translation: Prioriteit }
  - { text: Estimate, translation: Schatting }
  - { text: Due, translation: Deadline }
  - { text: Label, translation: Label }
  - { text: Blocked, translation: Geblokkeerd }
  - { text: To do, translation: Te doen }
  - { text: In progress, translation: Bezig }
  - { text: In review, translation: In beoordeling }
  - { text: Bug, translation: Bug }
  - { text: Feature, translation: Functie }
  - { text: Chore, translation: Klusje }
  - { text: Docs, translation: Documentatie }
  - { text: Contact, translation: Contact }
  - { text: Project name, translation: Projectnaam }
  - { text: Brief, translation: Omschrijving }

  # Tables.
  - { text: Columns from the model, translation: Kolommen uit het model }
  - { text: "With no columns written, a table shows one per model property but the row key, each headed by its title and drawn by its type. It shows 25 rows to a page, the default, and opens its create and edit forms in a dialog, the surface a table uses when it names none.", translation: "Zonder geschreven kolommen toont een tabel er één per modeleigenschap behalve de rijsleutel, elk met haar titel als kop en getekend volgens haar type. Ze toont standaard 25 rijen per pagina en opent haar formulieren voor aanmaken en bewerken in een dialoogvenster, het oppervlak dat een tabel gebruikt als ze er geen noemt." }
  - { text: "Written columns, sorting and style rules", translation: "Geschreven kolommen, sorteren en stijlregels" }
  - { text: "Columns written by hand, in the order given, one with a header of its own. A column sorts where the collection lists its property for sorting. A blocked task's row is strong and red, each status cell has its colour, and a priority no case names takes the default. Eight rows to a page.", translation: "Kolommen met de hand geschreven, in de opgegeven volgorde, één met een eigen kop. Een kolom sorteert waar de collectie haar eigenschap voor sorteren noemt. De rij van een geblokkeerde taak krijgt nadruk en is rood, elke statuscel heeft haar eigen kleur, en een prioriteit die geen enkel geval noemt, krijgt de standaardstijl. Acht rijen per pagina." }
  - { text: Where, translation: Waar }
  - { text: Members behind a reference, translation: Velden achter een verwijzing }
  - { text: "The task board answers each task with its assignee and its project nested in it. A column over a nested member takes that member's title and presentation through a named shape, through a definition of the model's own, and through a reference whose own title wins over the shape it names: the contact is a mail link and the brief a link to a page.", translation: "Het takenbord beantwoordt elke taak met de toegewezen persoon en het project erin genest. Een kolom over een genest veld neemt de titel en presentatie van dat veld over via een benoemde vorm, via een eigen definitie van het model en via een verwijzing waarvan de eigen titel wint van de vorm die ze noemt: het contact is een maillink en de omschrijving een link naar een pagina." }
  - { text: Filtered by the address, translation: Gefilterd op het adres }
  - { text: "This table declares a project parameter and sends it as an equality with every request. With no project in the address it reads nothing.", translation: "Deze tabel declareert een parameter project en stuurt die bij elk verzoek mee als gelijkheid. Zonder project in het adres leest ze niets." }
  - { text: Atlas redesign tasks, translation: Taken van het Atlas-herontwerp }
  - { text: Billing migration tasks, translation: Taken van de facturatiemigratie }
  - { text: Blocked tasks, translation: Geblokkeerde taken }
  - { text: "This one is filtered by a fixed value written into the table, and lists only the tasks that are blocked.", translation: "Deze wordt gefilterd op een vaste waarde die in de tabel is geschreven, en toont alleen de geblokkeerde taken." }
  - { text: Where a form opens, translation: Waar een formulier opent }
  - { text: "Each table below opens its create and edit forms on a different surface. A save reloads every table of tasks on the page.", translation: "Elke tabel hieronder opent haar formulieren voor aanmaken en bewerken op een ander oppervlak. Opslaan herlaadt elke takentabel op de pagina." }
  - { text: Dialogs, translation: Dialoogvensters }
  - { text: "Create in a small dialog that stays open, emptied, for another task. Edit in a large dialog that does not block the page and ignores a click outside; it keeps its values after a save, drops unsaved input without asking, and is part of the address. Each row offers a confirmed delete.", translation: "Aanmaken in een klein dialoogvenster dat open blijft, leeggemaakt, voor een volgende taak. Bewerken in een groot dialoogvenster dat de pagina niet blokkeert en een klik erbuiten negeert; het behoudt zijn waarden na opslaan, verwerpt niet-opgeslagen invoer zonder te vragen en maakt deel uit van het adres. Elke rij biedt verwijderen met bevestiging." }
  - { text: Drawers, translation: Laden }
  - { text: "Create in a small drawer from the start edge; edit in a large drawer from the end edge, with no close button. Both close after a save and ask before unsaved input is dropped.", translation: "Aanmaken in een kleine lade vanaf de beginrand; bewerken in een grote lade vanaf de eindrand, zonder sluitknop. Beide sluiten na opslaan en vragen het eerst voordat niet-opgeslagen invoer wordt verworpen." }
  - { text: Sheets, translation: Bladen }
  - { text: "Create in a sheet from the top that does not block the page; edit in a full sheet from the bottom, part of the address.", translation: "Aanmaken in een blad vanaf de bovenkant dat de pagina niet blokkeert; bewerken in een volledig blad vanaf de onderkant, dat deel uitmaakt van het adres." }
  - { text: Popovers, translation: Pop-overs }
  - { text: "Create in a card beside the New button, centred on it; below the breakpoint it becomes a full dialog. Edit in a card under the row's button, aligned to its end, which a click outside does not close and which stays open after a save.", translation: "Aanmaken in een kaart naast de knop Nieuw, erop gecentreerd; onder het breekpunt wordt het een volledig dialoogvenster. Bewerken in een kaart onder de knop van de rij, uitgelijnd op het einde ervan, die niet sluit bij een klik erbuiten en open blijft na opslaan." }
  - { text: In line, translation: Inline }
  - { text: "The create form opens above the rows and the edit form under the row it changes. Below the breakpoint the create form opens in a sheet from the bottom.", translation: "Het aanmaakformulier opent boven de rijen en het bewerkformulier onder de rij die het wijzigt. Onder het breekpunt opent het aanmaakformulier in een blad vanaf de onderkant." }
  - { text: Panels, translation: Panelen }
  - { text: "Create in a small panel at the start edge, which Escape does not close. Edit in a large panel at the end edge, part of the address, with the rows still usable beside it; below the breakpoint it becomes a sheet from the bottom.", translation: "Aanmaken in een klein paneel aan de beginrand, dat Escape niet sluit. Bewerken in een groot paneel aan de eindrand, dat deel uitmaakt van het adres, met de rijen ernaast nog bruikbaar; onder het breekpunt wordt het een blad vanaf de onderkant." }
  - { text: A page of its own, translation: Een eigen pagina }
  - { text: "Create and edit replace the page's content under one address name, so the address says either a new task or the task with this key, and Back closes the form. The surface is declared once and named by both.", translation: "Aanmaken en bewerken vervangen de inhoud van de pagina onder één adresnaam, zodat het adres ofwel een nieuwe taak ofwel de taak met deze sleutel aangeeft, en Terug sluit het formulier. Het oppervlak wordt één keer gedeclareerd en door beide genoemd." }

  # Filters.
  - { text: Every filter the collection accepts, translation: Elk filter dat de collectie accepteert }
  - { text: "With no fields written, the bar draws one control per filter the collection accepts, in its order and from the model's property: a list for an enumeration or a yes/no value, a typed box otherwise, and one label over the two bounds of a range. It sits above the table, applies a choice at once and typed text on Enter, and keeps nothing between visits.", translation: "Zonder geschreven velden tekent de balk één besturingselement per filter dat de collectie accepteert, in haar volgorde en volgens de eigenschap van het model: een lijst voor een opsomming of een ja/nee-waarde, anders een invoerveld van het juiste type, en één label boven de twee grenzen van een bereik. Hij staat boven de tabel, past een keuze direct toe en getypte tekst bij Enter, en bewaart niets tussen bezoeken." }
  - { text: Every control, translation: Elk besturingselement }
  - { text: "Each way a filter is entered: typed text, options side by side, a list, typed tags, a slider, a switch, and two dates under one label. The project filter is drawn nowhere and only a preset sets it. Status starts at its default, and a preset sets the filters the presets name and clears the others they name. Chips summarise what is chosen, and the values are part of the address. Below the breakpoint the bar folds, and the pinned text filter stays outside the fold.", translation: "Elke manier om een filter in te voeren: getypte tekst, opties naast elkaar, een lijst, getypte tags, een schuifregelaar, een schakelaar en twee datums onder één label. Het projectfilter wordt nergens getekend en alleen een voorinstelling stelt het in. Status begint bij zijn standaardwaarde, en een voorinstelling stelt de filters in die de voorinstellingen noemen en wist de andere die ze noemen. Chips vatten samen wat er gekozen is, en de waarden maken deel uit van het adres. Onder het breekpunt klapt de balk in, en het vastgezette tekstfilter blijft buiten het ingeklapte deel." }
  - { text: Urgent, translation: Dringend }
  - { text: Atlas only, translation: Alleen Atlas }
  - { text: Stuck, translation: Vastgelopen }
  - { text: "Beside, as chips, while typing", translation: "Ernaast, als chips, tijdens het typen" }
  - { text: "The controls sit in a column at the start edge. Only the filters you choose are on show: add one from the bar's list, and removing it clears it. Each filter is a chip naming its value, which opens its control. Typed text applies after a pause, and two bounds of a number are captioned after and before. The choice is kept in this browser across visits. Below the breakpoint the bar opens in a sheet from the bottom.", translation: "De besturingselementen staan in een kolom aan de beginrand. Alleen de filters die je kiest zijn zichtbaar: voeg er een toe uit de lijst van de balk, en verwijderen wist het. Elk filter is een chip die zijn waarde noemt en zijn besturingselement opent. Getypte tekst wordt na een pauze toegepast, en twee grenzen van een getal krijgen de bijschriften na en voor. De keuze wordt in deze browser bewaard tussen bezoeken. Onder het breekpunt opent de balk in een blad vanaf de onderkant." }
  - { text: "Beside at the end, applied by a button", translation: "Ernaast aan het einde, toegepast met een knop" }
  - { text: "The controls sit at the end edge, and a change waits for Apply, while a preset, Reset and removing a summary chip apply at once. Several assignees are typed separated by commas. The choice is kept for this tab only, and survives a reload.", translation: "De besturingselementen staan aan de eindrand, en een wijziging wacht op Toepassen, terwijl een voorinstelling, Herstellen en het verwijderen van een samenvattingschip direct worden toegepast. Meerdere toegewezen personen typ je gescheiden door komma's. De keuze wordt alleen voor dit tabblad bewaard en blijft behouden na herladen." }
  - { text: Due by October, translation: Deadline uiterlijk oktober }
  - { text: "Folded, starting open", translation: "Inklapbaar, eerst uitgeklapt" }
  - { text: "The controls fold behind a toggle that counts the filters holding a value, and start unfolded. The pinned text filter stays outside the fold, and the others are added from the bar's list. Status starts at in progress; removing it clears that default too, and Reset brings it back. The values are kept both in the address and in this browser, the address winning, and the fold you choose is remembered.", translation: "De besturingselementen klappen in achter een schakelaar die de filters met een waarde telt, en beginnen uitgeklapt. Het vastgezette tekstfilter blijft buiten het ingeklapte deel, en de andere worden toegevoegd uit de lijst van de balk. Status begint bij bezig; verwijderen wist ook die standaardwaarde, en Herstellen brengt haar terug. De waarden worden zowel in het adres als in deze browser bewaard, waarbij het adres wint, en de inklapstand die je kiest, wordt onthouden." }
  - { text: "Folded, starting closed", translation: "Inklapbaar, eerst ingeklapt" }
  - { text: "Folded to begin with. The pinned text filter, Apply and Reset stay outside the fold. The label starts at its default, bugs, until it is changed, and Reset brings the default back.", translation: "In het begin ingeklapt. Het vastgezette tekstfilter, Toepassen en Herstellen blijven buiten het ingeklapte deel. Het label begint bij zijn standaardwaarde, bugs, tot het wordt gewijzigd, en Herstellen brengt de standaardwaarde terug." }
  - { text: In a dialog, translation: In een dialoogvenster }
  - { text: "The controls open in a small dialog from a button that counts the filters holding a value, and close with Done. The open dialog is part of the address, so a link opens it. The pinned text filter stays beside the button, and chips summarise what is chosen.", translation: "De besturingselementen openen in een klein dialoogvenster vanuit een knop die de filters met een waarde telt, en sluiten met Gereed. Het geopende dialoogvenster maakt deel uit van het adres, dus een link opent het. Het vastgezette tekstfilter blijft naast de knop, en chips vatten samen wat er gekozen is." }
  - { text: In a drawer, translation: In een lade }
  - { text: "The controls open in a drawer from the start edge, which a click outside does not close. Typed values apply after a pause.", translation: "De besturingselementen openen in een lade vanaf de beginrand, die niet sluit bij een klik erbuiten. Getypte waarden worden na een pauze toegepast." }
  - { text: In a popover, translation: In een pop-over }
  - { text: "The controls open in a card under the button, aligned to its end; below the breakpoint, in a sheet from the bottom.", translation: "De besturingselementen openen in een kaart onder de knop, uitgelijnd op het einde ervan; onder het breekpunt in een blad vanaf de onderkant." }

