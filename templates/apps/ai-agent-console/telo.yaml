kind: Telo.Application
metadata:
  name: AiAgentConsole
  version: 1.0.0
  description: |
    Interactive REPL backed by an `Ai.Agent`. Each turn the agent may call a
    weather tool (`get_weather`, an `Http.Request` to open-meteo) before
    answering. The conversation is persisted in sqlite so each turn sees prior
    history and the chat survives restart. Type `/exit` to leave.

    Set your OpenAI key in a sibling `.env.local`:
        OPENAI_API_KEY=sk-...
imports:
  OpenAI: oci://ghcr.io/telorun/openai@0.1.0#sha256-SnFe2QDJWkXtCWDcJh_fBTQ73thsdA_Cg6cNfI01i2o
  Ai: oci://ghcr.io/telorun/ai@0.18.0#sha256-OtJa8sQbyyLNKMTjbyy5-qiQWF9ouPj7a2-BSH0KGXg
  Http: oci://ghcr.io/telorun/http-client@0.22.0#sha256-UyC8nQDnKHXyPpPPHC7TS8MicesLsgDUKWBYObf5oQ4
  Console: oci://ghcr.io/telorun/console@0.17.4#sha256-T3hXxYNK-UClSE_wssnkYI-urC-4c8CEx82rSBc-dR4
  Run: oci://ghcr.io/telorun/run@0.26.0#sha256-ZhW56yiMCImqBh0wJ4mVaUvh5WuUVIaWErASFx--wCY
  Sql: oci://ghcr.io/telorun/sql@0.24.0#sha256-g0Bw5AjrBOGmgGbmsKFb7q833AYlutxV1fDWka47t2I
  SQLite: oci://ghcr.io/telorun/sqlite@0.4.0#sha256-G8qidbhcpiVLiCbrI8TSZZWDO95R4JM9kNX_oVenLmY
targets:
  - !ref initSchema
  - !ref chatLoop
secrets:
  openaiApiKey:
    env: OPENAI_API_KEY
    type: string
---
kind: SQLite.Connection
metadata: { name: chatDb }
file: ./tmp/agent-history.sqlite
---
kind: SQLite.Schema
metadata: { name: initSchema }
connection: !ref chatDb
# Imperative, not a declared `Table`: the role domain is a CHECK constraint,
# which the column vocabulary cannot state — declaring the table would drop it.
migrations:
  0001_create_messages:
    statement: |
      CREATE TABLE IF NOT EXISTS messages (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        role TEXT NOT NULL CHECK (role IN ('system', 'user', 'assistant')),
        content TEXT NOT NULL,
        created_at TEXT NOT NULL DEFAULT (datetime('now'))
      )
---
kind: OpenAI.Model
metadata: { name: gpt4oMini }
model: gpt-4o-mini
apiKey: !cel "secrets.openaiApiKey"
---
kind: Http.Client
metadata: { name: openMeteo }
baseUrl: https://api.open-meteo.com
---
kind: Http.Request
metadata: { name: getWeather }
client: !ref openMeteo
throwOnHttpError: true
---
kind: Ai.Tools
metadata: { name: weatherTools }
tools:
  - tool: !ref getWeather
    name: get_weather
    description: Get the current weather at a latitude/longitude (open-meteo).
    parameters:
      type: object
      additionalProperties: false
      required: [ latitude, longitude ]
      properties:
        latitude: { type: number, description: "Latitude in decimal degrees." }
        longitude: { type: number, description: "Longitude in decimal degrees." }
    inputs:
      url: /v1/forecast
      method: GET
      query:
        latitude: !cel "arguments.latitude"
        longitude: !cel "arguments.longitude"
        current_weather: "true"
    result: !cel "result.body"
---
kind: Ai.Agent
metadata: { name: assistant }
model: !ref gpt4oMini
system: |
  You are a helpful CLI assistant. Use the available tools when they help answer;
  don't guess at facts you can look up. Keep replies brief.
maxSteps: 6
toolProviders:
  - provider: !ref weatherTools
---
kind: Run.Sequence
metadata: { name: chatLoop }
steps:
  - name: read
    invoke: !ref Console.readLine
    inputs:
      prompt: "{cyan.bold you} › "
  - name: converse
    while: !cel "steps.read.result.value != '/exit'"
    do:
      - name: insertUser
        inputs:
          sql: "INSERT INTO messages (role, content) VALUES (?, ?)"
          bindings: [ "user", !cel "steps.read.result.value" ]
        invoke:
          kind: Sql.Command
          connection: !ref chatDb
      - name: readHistory
        inputs:
          sql: "SELECT role, content FROM messages ORDER BY id ASC"
        invoke:
          kind: Sql.Query
          connection: !ref chatDb
      - name: ask
        invoke: !ref assistant
        inputs:
          messages: !cel "steps.readHistory.result.rows"
      - name: print
        invoke: !ref Console.writeLine
        inputs:
          output: !cel "'{magenta.bold ai}  › ' + steps.ask.result.text"
      - name: insertAssistant
        inputs:
          sql: "INSERT INTO messages (role, content) VALUES (?, ?)"
          bindings: [ "assistant", !cel "steps.ask.result.text" ]
        invoke:
          kind: Sql.Command
          connection: !ref chatDb
      - name: read
        invoke: !ref Console.readLine
        inputs:
          prompt: "{cyan.bold you} › "
