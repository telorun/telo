kind: Telo.Library
metadata:
  name: CacheRedis
  version: 0.13.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Performance, Storage]
  description: |
    Redis-backed caching shared by every instance of an application — cached results
    and counters that outlive one process, under an optional key prefix so several
    apps can share a server. When Redis is unreachable it degrades to an optional
    fallback cache, reports the degradation, and recovers on its own.
requires: { telo: ">=0.133.0" }
restrictions:
  - requires: { telo: ">=0.130.0" }
    reason: "Needs the SDK's `durationMs` (0.129.0), which an older runtime lacks so the controller fails to load, and a `d` / `w` duration literal at a `Telo.Duration` slot (0.130.0); also its controllers return revertible effect chains from `init()` / `run()`, which kernels before 0.82.0 do not unwind."
imports: { Cache: ../cache }
exports: { kinds: [Store] }
---
kind: Telo.Definition
metadata:
  name: Store
  description: >-
    Caches entries in Redis so every instance shares them, optionally namespaced by a
    key prefix. When the server is unreachable it serves a fallback cache instead,
    emits degraded and recovered events, and reconnects on its own.
capability: Telo.Provider
extends: Cache.Store
controllers: [pkg:telo/local/js?path=./nodejs/cache-redis.mjs&local_path=./nodejs/src/index.ts#StoreController]
schema:
  type: object
  required: [url]
  additionalProperties: false
  properties:
    url:
      title: URL
      type: string
      description: Redis connection URL, e.g. `redis://localhost:6379` or `rediss://…`.
    fallback:
      title: Fallback
      description: >-
        Optional Cache.Store served when Redis is unreachable (degraded mode).
        Cache failover is safe — a miss just recomputes; the degradation is
        logged and surfaced as a `cache.degraded` / `cache.recovered` event.
      x-telo-ref: { kind: Cache.Store, use: dependency }
    connectTimeout:
      title: Connect Timeout
      x-telo-type: { name: Telo.Duration, minimum: 0s }
      description: How long to wait for a Redis connection before degrading; `2s` when omitted.
    keyPrefix:
      title: Key Prefix
      type: string
      default: ""
      description: Prefix applied to every key (namespacing a shared Redis).
