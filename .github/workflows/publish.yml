name: Publish

# Runs on a release branch only: pushes to main publish nothing. The branch's own
# copy of this file does the work, so a fix to the pipeline is a PR into the branch.
# A branch is frozen once a newer `release/*` branch exists, and every job below
# refuses on it as its first step.
#
# A final, patch, module or packages release runs, in order: npm (`release`), modules
# (`publish-modules`), the publication commit and every tag of the release
# (`publication`), the Record release dispatch (`record`), the artifact check
# (`artifact-check`), then everything built from the tag. A candidate tags its release
# commit in `release` and has no publication commit, record or artifact check.

on:
  push:
    branches: ["release/*"]
  # Recovery. Every job here derives its work from what is already published rather
  # than from a previous step's exit code, so a dispatch re-runs them safely: npm
  # publish skips what exists, module publish skips an already-pushed version and
  # re-derives the module release's tag from the versions the commit moved, the
  # publication commit is the same commit and its tags are found in place, and the
  # GitHub Release step skips a tag that already has one.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # npm packages ONLY. `pnpm run release` is `changeset publish` and nothing else;
  # module artifacts and Docker images are published by the jobs below / by
  # publish-docker.yml, so neither can fail this job and none of the three can
  # strand another.
  release:
    name: Release PR or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      # The branch holds changesets: this run built the release PR from them, and the
      # `release-pr` job builds none.
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
      # candidate | final | patch | none — what this run released (release-channel.mjs).
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      # `.changeset/pre.json` exists: the branch is in candidates.
      candidates: ${{ steps.release.outputs.candidates }}
      # The release tag main records (`v<version>` or `packages-<x.y>-<n>`): empty for
      # a candidate. The `publication` job makes it.
      record-tag: ${{ steps.release.outputs.record-tag }}
    steps:
      # TELO_BOT_TOKEN: the release PR is pushed with the checkout's credentials, and
      # a push made with the default token starts no checks.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TELO_BOT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Build workspace
        run: pnpm -r --if-present build

      # The release run's own tag, known before anything publishes: pack links in
      # the published tarballs (and the .vsix) point at it. `v<cli version>` when
      # this commit moves the CLI, else the numbered `packages-<x.y>-<n>`.
      - name: Name the release tag
        id: planned
        run: node scripts/release-channel.mjs pack-tag

      # `createGithubReleases: false` — the action has no per-package filter, and
      # `changeset publish` publishes module-owned packages too (their versions are
      # moved by `telo release apply`, so the action sees a version npm does not
      # have yet). That put a module's release on the npm release page under an npm
      # package's name. Releases are created by the GitHub Release steps instead,
      # which know which packages a module owns.
      - name: Build the release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # The release PR is `changeset-release/<this branch>`, based on it. The
          # branch's first one enters prerelease mode (`rc`); inside it, changesets
          # publishes under the `rc` dist-tag. A release PR whose head has no
          # `.changeset/pre.json` (Publish final release) is the final, and rebuilds as one
          # — on a branch it cut from main too, which then never enters prerelease mode.
          # Outside candidates the version command also releases the modules
          # (`release-pr-version.mjs`), so the final and every patch publish their
          # modules in the same run, after npm.
          # The bot token pushes the PR branch and opens the PR, so the required
          # checks run on it; the changeset gate exempts its head branch.
          version: node scripts/release-pr-version.mjs
          publish: pnpm run release
          commit: "chore(release): version"
          title: "chore(release): version"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          # The version step asks for the open release PR.
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TELO_PACK_LINKS_TAG: ${{ steps.planned.outputs.tag }}
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
          # Written only when the version command released the modules.
          RELEASE_PLAN_FILE: ${{ runner.temp }}/release-plan.json

      # Building the release PR leaves the checkout on that PR's version commit,
      # which would classify a release that never merged.
      - name: Return to the run's commit
        run: git checkout --quiet --detach "$GITHUB_SHA"

      # The action writes its own body, listing the changesets; the module plan the
      # version command captured before `telo release apply` is added beneath it.
      - name: Add the module release plan to the release PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          RELEASE_PLAN_FILE: ${{ runner.temp }}/release-plan.json
        run: |
          if [ ! -f "$RELEASE_PLAN_FILE" ]; then
            echo "No module release in this PR: the branch is in candidates."
            exit 0
          fi
          gh pr view "$NUMBER" --json body --jq .body > "$RUNNER_TEMP/changesets-body.md"
          node scripts/release-pr-body.mjs "$RUNNER_TEMP/changesets-body.md" "$RELEASE_PLAN_FILE" > "$RUNNER_TEMP/release-body.md"
          gh pr edit "$NUMBER" --body-file "$RUNNER_TEMP/release-body.md"

      # Read from the commit, not from the action's output, so a re-run of an old
      # publish classifies as the first did.
      - name: Classify the release
        id: release
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/release-channel.mjs classify

      # A candidate has no publication commit: its tag names its release commit, made
      # here before the GitHub Release step that names it, with the bot token the
      # rulesets let create `v*` tags. Every other release tag is made by `publication`.
      - name: Tag the candidate
        if: steps.release.outputs.channel == 'candidate' && steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
        run: node scripts/release-tag.mjs "${{ steps.release.outputs.tag }}"

      # `rc` follows a final or patch, and only forward. A candidate publishes under
      # `rc` already.
      - name: Move the rc dist-tag
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: node scripts/release-dist-tags.mjs

      # ONE release for the cycle, tagged `v<cli version>`, with the changes grouped
      # by changeset rather than by package — a changeset that moves five packages
      # used to produce five releases carrying the same text. Modules are released as
      # OCI artifacts and discovered through the hub; their changelog lives in the
      # module directory and they get no GitHub Release. A cycle that does not move
      # the CLI has no version to name itself after and falls back to one release per
      # package (only `runner-core` and `k8s-runner` can reach that path).
      # A final's or patch's is made by `publication`, once its tag exists; this step
      # makes a candidate's, and the per-package releases of a cycle without the CLI.
      # Deliberately NOT gated on `steps.changesets.outputs.published`. Re-running this
      # job re-runs `changeset publish`, which finds everything already on npm and
      # reports `published: false` — so a transient failure here (rate limit, 5xx,
      # token scope) used to make the release permanently missing, with no way to
      # retry it. The script decides for itself: it skips a tag that already has a
      # release, and recovers the package set from this commit's version bumps when
      # the action reports none.
      - name: Create the GitHub Release
        if: steps.release.outputs.channel != 'final' && steps.release.outputs.channel != 'patch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The candidate's tag names this exact commit; a per-package tag is made by
          # `changeset publish` here too.
          GITHUB_SHA: ${{ github.sha }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          # A candidate is a pre-release; only a final or patch can be `latest`.
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: node scripts/github-releases.mjs

  # The release PR when the branch holds no changesets but its modules drifted: the
  # same `changeset-release/<branch>` PR the action builds from changesets, versioning
  # the modules alone. Never in candidates, nor while changesets plan a release
  # (`modules-ready`), so it and the action never build the PR in one run. Its own job,
  # so a failure here leaves the release this run published free to be tagged.
  release-pr:
    name: Release PR from module drift
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.has-changesets == 'false' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TELO_BOT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Is the branch ready for a module release
        id: ready
        run: node scripts/release-channel.mjs modules-ready

      - name: Build workspace
        if: steps.ready.outputs.ready == 'true'
        run: pnpm -r --if-present build

      # CAPTURED BEFORE APPLY. `telo release apply` consumes the fragments the
      # changelog entries come from, so a plan read afterwards can say which
      # versions moved but not why — which is the half of the body worth reading.
      - name: Capture the release plan
        if: steps.ready.outputs.ready == 'true'
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node ./cli/nodejs/bin/telo.mjs release status -o json --base HEAD > "$RUNNER_TEMP/release-plan.json"

      # Writes every planned version into each manifest its module owns, appends
      # the changelogs, updates the ledger, and deletes the fragments it consumed.
      # A no-op when nothing drifted, so the PR step below finds no changes and
      # opens nothing.
      - name: Apply the release plan
        if: steps.ready.outputs.ready == 'true'
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node ./cli/nodejs/bin/telo.mjs release apply --base HEAD

      # A chart that deploys a module's image carries that module's version, so
      # it moves in the same PR as the version it names.
      - name: Stamp chart versions
        if: steps.ready.outputs.ready == 'true'
        run: node scripts/stamp-chart-version.mjs

      - name: Render the PR body
        if: steps.ready.outputs.ready == 'true'
        run: node scripts/module-release-pr-body.mjs "$RUNNER_TEMP/release-plan.json" > "$RUNNER_TEMP/release-body.md"

      - name: Open or rebuild the release PR
        if: steps.ready.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TELO_BOT_TOKEN }}
          branch: changeset-release/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: "chore(release): version"
          commit-message: "chore(release): version"
          body-path: ${{ runner.temp }}/release-body.md

  # Module ARTIFACTS publish here, not in the npm release script.
  #
  # TWO INDEPENDENT LEDGERS: npm packages (changesets) and module artifacts (`telo
  # release`). The job builds artifacts with the WORKSPACE CLI (`node
  # ./cli/nodejs/bin/telo.mjs`, `--skip-controllers`), so nothing resolves from npm;
  # it runs after the npm `release` job of the same run so that every floor a
  # module declares names a published telo. No module publishes in candidates.
  #
  # The script pushes only a version absent at the registry, so nothing is
  # republished and a version a commit merely recorded is not pushed. A commit that
  # moved module versions is the module release `modules-<major>.<minor>-<n>`, named
  # by this job on every run (a re-run finds the tag in place or recounts the same
  # number); `publication` makes the tag.
  # `vars.TELO_OCI_REGISTRY` unset skips it entirely.
  publish-modules:
    name: Publish module artifacts
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.candidates != 'true' && vars.TELO_OCI_REGISTRY != '' }}
    permissions:
      contents: read
      packages: write
    outputs:
      modules-tag: ${{ steps.number.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD^ for the moved versions, tags for the numbering

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Build workspace
        run: pnpm -r --if-present build

      # The OCI transport reads the ambient Docker credential chain, so logging in
      # here is what authorizes the push.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A mirror cannot be built up incrementally from empty: `telo publish`
      # hard-fails when a relative sibling does not already resolve at the
      # destination. `scripts/publish-oci-backfill.mjs` repairs a partially-pushed
      # mirror.
      - name: Publish module manifests
        id: publish
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: pnpm run publish-modules

      # A commit that moved module versions is a module release, whether this run or an
      # earlier one pushed them: a re-run re-derives the same tag.
      - name: Number the module release
        id: number
        if: steps.publish.outputs.moved-in-commit != '' && steps.publish.outputs.moved-in-commit != '0'
        run: node scripts/release-channel.mjs modules-tag

  # The built-in vocabulary of every telo release, `<registry>/telo@<version>`.
  #
  # Its source is npm, not this checkout: each `@telorun/analyzer` release ships
  # its archive at `src/builtin-vocabulary/`, and `scripts/publish-builtins.mjs`
  # pushes that directory, taken out of the released tarball, for every version
  # whose tag is missing — so the artifact is the release's own bytes, published
  # by the checkout's CLI. Not a step of the npm `release` job, where a failure
  # after `changeset publish` would have nothing to retry: this reconciles on every
  # push of the branch, so a missed version heals on the next one. It runs after `release` (and
  # whatever it did) so the version that job just published is pushed in the same
  # run. `vars.TELO_OCI_REGISTRY` unset skips it, as it does module publishing.
  publish-builtins:
    name: Publish the built-in vocabulary
    runs-on: ubuntu-latest
    needs: release
    if: ${{ always() && vars.TELO_OCI_REGISTRY != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Build workspace
        run: pnpm -r --if-present build

      # The OCI transport reads the ambient Docker credential chain.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the built-in vocabulary of each release
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node scripts/publish-builtins.mjs

  # Every tag of a final, patch, module or packages release, on the PUBLICATION COMMIT:
  # the branchless child of this run's commit whose only change is `telo release
  # imports --as=published` over the consumer roots, so a tag carries pins to
  # published artifacts while the branch keeps relative imports. After npm and module
  # publishing, so every import it pins is published. The commit is a function of
  # this run's commit and the registry's pins, so a re-run makes the same one and
  # finds its tags in place; with nothing to rewrite the tags name this commit.
  # TELO_BOT_TOKEN pushes the tags, which the rulesets let only the release workflows
  # create.
  publication:
    name: Publication commit and tags
    runs-on: ubuntu-latest
    needs: [release, publish-modules]
    if: >-
      ${{ always() && needs.release.result == 'success' &&
      (needs.publish-modules.result == 'success' || needs.publish-modules.result == 'skipped') &&
      (needs.release.outputs.record-tag != '' || needs.publish-modules.outputs.modules-tag != '') }}
    permissions:
      contents: write
      packages: read
    outputs:
      # The commit every tag of the release names; this run's commit when nothing was rewritten.
      sha: ${{ steps.publication.outputs.sha }}
      publication: ${{ steps.publication.outputs.publication }}
      # The tag main records and the app images build from: on one commit, modules over
      # packages over v.
      tag: ${{ steps.tags.outputs.tag }}
    steps:
      # The release commit, installed and built: the rewrite's release plan digests
      # the controller builds this checkout makes.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Build workspace
        run: pnpm -r --if-present build

      # The pins are read from the registry.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the recorded tag
        id: tags
        env:
          RECORD_TAG: ${{ needs.release.outputs.record-tag }}
          MODULES_TAG: ${{ needs.publish-modules.outputs.modules-tag }}
        run: echo "tag=${MODULES_TAG:-$RECORD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Make the publication commit and tag the release
        id: publication
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
          RECORD_TAG: ${{ needs.release.outputs.record-tag }}
          MODULES_TAG: ${{ needs.publish-modules.outputs.modules-tag }}
        run: |
          tags=()
          if [ -n "$RECORD_TAG" ]; then tags+=(--tag "$RECORD_TAG"); fi
          if [ -n "$MODULES_TAG" ]; then tags+=(--tag "$MODULES_TAG"); fi
          node scripts/publication-commit.mjs --release "$GITHUB_SHA" "${tags[@]}" --push

      # A final's or patch's GitHub Release, once its tag exists: a draft until the
      # standalone CLI's job promotes it. The checkout is still the release commit,
      # whose version bumps recover the package set on a re-run; the tag exists, so
      # GitHub anchors the release to it. Not gated on `published`, for the reason
      # the `release` job's step gives.
      - name: Create the GitHub Release
        if: needs.release.outputs.channel == 'final' || needs.release.outputs.channel == 'patch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.publishedPackages }}
          RELEASE_CHANNEL: ${{ needs.release.outputs.channel }}
        run: node scripts/github-releases.mjs

  # Main learns what shipped through a generated record, never a merge: Record
  # release (record-release.yml, main's own copy, run at main's tip) rebuilds the
  # one record PR of this line from the branch's newest release tag. Dispatched
  # once per run once the tags exist, after a final, patch, packages-only or module
  # release, never after a candidate; a second dispatch rebuilds the same PR.
  # TELO_BOT_TOKEN, since a dispatch made with the default token starts nothing.
  record:
    name: Record the release on main
    runs-on: ubuntu-latest
    needs: publication
    if: ${{ always() && needs.publication.result == 'success' && needs.publication.outputs.tag != '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Dispatch Record release
        env:
          GH_TOKEN: ${{ secrets.TELO_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publication.outputs.tag }}
        run: gh workflow run record-release.yml --ref main -f tag="$TAG"

  # What the tag ships, checked as a user receives it: the publication commit in a
  # fresh checkout (no `.telo` cache), its imports pinned to published artifacts.
  # `telo check` over the consumer roots and the example, starter and blueprint
  # suites. It gates everything built from the tag below, never the tags or the
  # record above: they say what was published, and a red check leaves the release
  # tagged and recorded with no installers, images, Studio or site until a re-run
  # that passes or the next patch completes it.
  artifact-check:
    name: Check the published release
    runs-on: ubuntu-latest
    needs: publication
    if: ${{ always() && needs.publication.result == 'success' }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout the publication commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publication.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: node scripts/release-branch.mjs publish-check --ref "$GITHUB_REF_NAME"

      - name: Restore staged module files
        id: staged
        uses: ./.github/actions/restore-staged-files
        with:
          scope: ${{ github.job }}

      - name: Check example manifests
        run: >-
          pnpm run check examples/*/telo.yaml examples/*/*/telo.yaml
          examples/schema-evolution/v1.yaml examples/templated-api/library.yaml

      - name: Check starter and blueprint manifests
        run: pnpm run check starters/apps/*/telo.yaml starters/libs/*/telo.yaml blueprints/*/telo.yaml

      - name: Check app manifests
        run: pnpm run check apps/*/telo.yaml

      - name: Run the example test suites
        run: pnpm run telo ./examples/test-suite.yaml

      - name: Run the starter test suites
        run: pnpm run telo ./starters/test-suite.yaml

      - name: Run the blueprint test suites
        run: pnpm run telo ./blueprints/test-suite.yaml

      - name: Save staged module files
        if: always() && steps.staged.outputs.key != '' && steps.staged.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-staged-files
        with:
          key: ${{ steps.staged.outputs.key }}
          paths: ${{ steps.staged.outputs.paths }}

  # Kernel images (`telorun/node` and its variants) on every channel but `none`, from
  # npm: not built from the tag, so neither the publication nor the artifact check
  # gates them. `latest`, `<major>` and `<major>.<minor>` move only forward.
  docker-kernel:
    name: Publish kernel Docker images
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.channel != 'none' }}
    # A called workflow's permissions can only be equal to or narrower than the
    # caller job's.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      images: kernel
      published-packages: ${{ needs.release.outputs.publishedPackages }}
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # The hub, runner, k8s-runner, hub-web and authoring-agent images (and their charts)
  # on finals, patches, module and packages releases, never in candidates, built from
  # the publication tag once the artifact check passed. A module release builds them
  # on the branch's last released telo. After the kernel images their bases and the
  # k8s-runner's session default name. An app image's `latest` moves only forward.
  docker-apps:
    name: Publish app Docker images
    needs: [release, publication, artifact-check, docker-kernel]
    if: >-
      ${{ always() && needs.artifact-check.result == 'success' &&
      (needs.docker-kernel.result == 'success' || needs.docker-kernel.result == 'skipped') }}
    # The k8s-runner CHART job's `packages: write` has to be granted here as well —
    # without it the helm push 403s on the release path only, where nothing else
    # exercises it.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      images: apps
      ref: ${{ needs.publication.outputs.tag }}
      published-packages: ${{ needs.release.outputs.publishedPackages }}
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # The assets of the release `tag` names. Each is a called workflow, so the files
  # that build them are this branch's. The release is a DRAFT until the standalone
  # CLI's job publishes it, once every installer is attached and verified. A
  # candidate's run as soon as it is tagged; a final's or patch's once the artifact
  # check passed.
  cli-standalone:
    name: Standalone CLI
    needs: [release, artifact-check]
    if: >-
      ${{ always() && needs.release.result == 'success' && needs.release.outputs.channel != 'none' &&
      (needs.release.outputs.channel == 'candidate' || needs.artifact-check.result == 'success') }}
    permissions:
      contents: write
    uses: ./.github/workflows/cli-standalone-release.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # A candidate's `.vsix` is an asset of the pre-release; a final's or patch's also
  # goes to the Marketplace, which accepts no prerelease version.
  vscode:
    name: VS Code extension
    needs: [release, artifact-check]
    if: >-
      ${{ always() && needs.release.result == 'success' && needs.release.outputs.channel != 'none' &&
      (needs.release.outputs.channel == 'candidate' || needs.artifact-check.result == 'success') }}
    permissions:
      contents: write
    uses: ./.github/workflows/vscode-release.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # Studio publishes at the final: its desktop builds, web image and chart, and
  # its web build (an asset of the release, and the pages) — a candidate carries an
  # rc version and publishes none of it.
  studio:
    name: Studio
    needs: [release, artifact-check]
    if: >-
      ${{ always() && needs.release.result == 'success' &&
      (needs.release.outputs.channel == 'final' || needs.release.outputs.channel == 'patch') &&
      needs.artifact-check.result == 'success' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/studio-release.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  studio-pages:
    name: Studio pages
    needs: [release, artifact-check]
    if: >-
      ${{ always() && needs.release.result == 'success' &&
      (needs.release.outputs.channel == 'final' || needs.release.outputs.channel == 'patch') &&
      needs.artifact-check.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/studio-pages.yml
    with:
      channel: ${{ needs.release.outputs.channel }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # Builds the docs site from the release's own tag, attaches it to the release,
  # and deploys: the newest final at `/`, and while a candidate is open its build
  # at `/next/`.
  site:
    name: Docs site
    needs: [release, artifact-check]
    if: >-
      ${{ always() && needs.release.result == 'success' && needs.release.outputs.channel != 'none' &&
      (needs.release.outputs.channel == 'candidate' || needs.artifact-check.result == 'success') }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      deploy: true
    secrets: inherit
