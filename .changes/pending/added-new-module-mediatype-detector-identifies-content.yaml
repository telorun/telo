modules:
  modules/media-type: Added
body: "New module. MediaType.Detector identifies content from its leading bytes and
  compares the answer with the media type it was declared to have. Inputs: input (bytes
  or a stream of bytes) and an optional declared, compared lower-cased and without its
  parameters; declared never fails the call, and text that is not a media type at all is
  read as no claim. Outputs: mediaType (lower-case type/subtype, no parameters),
  mislabelled (boolean) and output, a stream of every input byte unchanged. At most 4096
  leading bytes are read, before the call returns; a source failure is raised as it
  arrived, and a consumer that stops early releases the source. The recognised set is
  closed and kept as data in media-types.json: PNG, JPEG, GIF, WebP, PDF and ZIP by
  signature, and the Office Open XML document types (docx, xlsx, pptx) through their ZIP
  container, which is as far as they are vouched for. With nothing declared the result
  is what the bytes prove, or application/octet-stream; a declared type the bytes
  confirm is returned; bytes proving another type return that type, mislabelled; a
  declared type from the set with bytes proving nothing is application/octet-stream,
  mislabelled; a declared type outside the set with bytes proving nothing is returned as
  declared. The kind declares no error codes: the caller refuses. A value that is
  neither bytes nor a stream, and a stream chunk that is not bytes, are
  ERR_INPUT_INVALID."
