# Telo Hub — federated discovery
#
# Umbrella metadata index over Telo modules hosted on any transport (HTTP
# registry, OCI). Registered module refs are tracked through the generic
# `telo module versions|digest|manifest` CLI verbs, each version's `telo.yaml`
# is cached to the static manifest bucket (studio's browser-safe OCI read
# path), and every `Telo.Definition` is indexed one row per
# `(module-version, resource-kind)` for per-resource search. The hub stores
# only derived metadata — never artifact payloads — so it can vanish and every
# install still works (resolution is origin-direct).
#
# THIS FILE IS THE COMPOSITION ROOT and nothing else: it binds the environment,
# owns the one connection, the one bucket, the one embedder, the one vector index
# and the one shell host, hands each of them to the libraries that need it, and
# mounts the HTTP and MCP surfaces over what they export. The nine concerns that
# used to live here are six libraries beside it:
#
#   hub-schema.yaml   the tables, the shared derivations, the ingest claim
#   hub-origin.yaml   reading a module from wherever it is published
#   hub-ingest.yaml   one version → bucket bytes, rows and vectors, durably
#   hub-search.yaml   ranked search over kinds and modules
#   hub-catalog.yaml  keyed reads: one module, one version, one manifest
#   hub-registry.yaml validating and recording a submitted ref
#
# No library knows any other exists, apart from the two dependency edges that are
# real: ingest and registration both read origins, and both issue the claim.

kind: Telo.Application
metadata:
  name: TeloHub
  version: 0.17.0
  license: MIT
  description: >-
    Federated discovery hub: tracks registered module refs across transports,
    caches manifests, and serves per-resource search over HTTP and MCP.
requires:
  # 0.83.0: `resources:` on an import — the instances handed down to each library.
  # 0.87.0: a route's `catches:` is checked against a union the analyzer resolves
  # by following an exported entry point into its declaring library. An older
  # runtime sees `{∅}` for every cross-module handler and rejects seven of the
  # codes below.
  # 0.90.0: verified by execution, which is what moved this bound up from 0.87.0.
  # 0.87.0 rejects nine of the routes below — a `!cel` in a `when:` or a computed
  # `Retry-After` is read against the scalar the shape declares, with no
  # placeholder substituted — and 0.88/0.89 still refuse `stream@0.12.0`, which
  # this imports transitively. 0.90.0 is the first release that reads the whole
  # graph clean.
  # 0.117.0: the database is a `needs:` entry of the application, a key an older
  # analyzer refuses on a `Telo.Application`, and `postgres@0.9.0` opens a
  # connection over it.
  telo: ">=0.117.0"
imports:
  Http: oci://ghcr.io/telorun/http-server@0.38.0#sha256-QUCZmb_cvTor4YhWUAj3YdRj-kacNkmkXLnycjXLBtA
  Sql: oci://ghcr.io/telorun/sql@0.28.1#sha256-ZlxQTTYQtAhK2aAyLRYMwBN-U4b8ww4ulu0SVnIxFu8
  Postgres: oci://ghcr.io/telorun/postgres@0.9.1#sha256-lGCC0xAdN1BNitm-zMjeGFp4ODWjG91S2L4DzVgNLPk
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  Shell: oci://ghcr.io/telorun/shell@0.13.0#sha256-h4-z6gdCjduwxgU1n7o5eol8RYgsxBCS2iQcxpCV_u0
  S3: oci://ghcr.io/telorun/s3@0.8.0#sha256-utdJQwmumCl0orYETnVY1oA7ytOZuik8syMIRZ1t_8o
  Mcp: oci://ghcr.io/telorun/mcp-server@0.19.0#sha256-JczHRE8f0y-yyxl83FnOOsvlRj4AjwJUfyP-mCkC5ns
  Console: oci://ghcr.io/telorun/console@0.19.0#sha256-RC9Wlj4a8ysp1g3WS3z3CbmQuAsahNj4PdsJMaNfPZw
  Embedding: oci://ghcr.io/telorun/embedding@0.12.0#sha256-lQqgopkTtGP1RyYmoryM-mr1fv_Ey_xbMZsj3vlLEeM
  OpenAI: oci://ghcr.io/telorun/openai@0.13.0#sha256-Tt9DaH254A972an-WTH_mtJOy9HAuUuH_SK1_bfOvHM
  HttpClient: oci://ghcr.io/telorun/http-client@0.23.0#sha256-6WAIh0ajnTlkWNuP-59e1qNVUXVSJDWZxvPVACQg1AM
  CacheMemory: oci://ghcr.io/telorun/cache-memory@0.10.0#sha256-yPwUSVVhRMiqQYQ9cbptorm1cA-HnJW6pLHRZ-8-qPA
  RateLimit: oci://ghcr.io/telorun/rate-limit@0.13.0#sha256-wHzRZi3uI7c12dRSULXQBO8GRYqhJj6gos6xv6eZj7g
  VectorStore: oci://ghcr.io/telorun/vector-store@0.11.0#sha256-lmCK8i7SQuTRupTSY-s5l89wUwQuikXpjJOxI5vbNwI
  VectorStorePgvector: oci://ghcr.io/telorun/vector-store-pgvector@0.17.1#sha256--1pY1TvpmBJGsfkB1yz6i2fdV2PDQ78Bc4XxtZNXWCw
  Scheduler: oci://ghcr.io/telorun/scheduler@0.10.0#sha256-HgE-9dLBcBonFo-b81QWoKfFjgjo13P6uKKsuNnzMpQ
  Durable: oci://ghcr.io/telorun/durable-local@0.5.1#sha256-2zh8d4sURSCk3aYbZ-VyED-LuOD6-LsXCbKszuTROC4
  # ── The hub's own libraries ────────────────────────────────────────────────
  # Each is handed the instances declared below. `hub-schema` and `hub-origin`
  # declare `lifecycle: shared`, so the imports of them here and inside
  # `hub-ingest` / `hub-registry` all resolve to ONE instantiation — which is
  # what lets those two reach the claim and the CLI without the composition
  # being linearized into a chain.
  Schema:
    source: ./hub-schema.yaml
    resources:
      connection: !ref db
  Search:
    source: ./hub-search.yaml
    resources:
      connection: !ref db
      embedQuery: !ref embedQuery
      vectorMatch: !ref vectorMatch
    variables:
      minScore: !cel "variables.vectorMinScore"
  Catalog:
    source: ./hub-catalog.yaml
    resources:
      connection: !ref db
      bucketGet: !ref getManifest
    variables:
      builtinsRef: !cel "variables.builtinsRef"
  Ingest:
    source: ./hub-ingest.yaml
    resources:
      connection: !ref db
      bucketPut: !ref putManifest
      embedPassage: !ref embedPassage
      vectorUpsert: !ref vectorUpsert
      vectorRemove: !ref vectorRemove
      shellHost: !ref localShell
    variables:
      teloCommand: !cel "variables.teloCommand"
      ingestRev: !cel "variables.ingestRev"
      builtinsRef: !cel "variables.builtinsRef"
  Registry:
    source: ./hub-registry.yaml
    resources:
      connection: !ref db
      rateLimit: !ref registerRateLimit
      shellHost: !ref localShell
      scheduleIngest: !ref Ingest.scheduleIngest
    variables:
      teloCommand: !cel "variables.teloCommand"
      ingestRev: !cel "variables.ingestRev"
      allowLocalRefs: !cel "variables.allowLocalRefs"
      builtinsRef: !cel "variables.builtinsRef"
ports:
  http:
    env: PORT
    default: 8040
needs:
  # The vector index stores embeddings in pgvector, checked against the live
  # server when the connection starts.
  databaseAccess:
    kind: Postgres.DatabaseAccess
    features: [pgvector]
    env: { url: DB_CONNECTION }
variables:
  bucketName:
    env: MANIFEST_BUCKET_NAME
    type: string
  bucketEndpoint:
    env: MANIFEST_BUCKET_ENDPOINT
    type: string
  bucketForcePathStyle:
    env: MANIFEST_BUCKET_FORCE_PATH_STYLE
    type: boolean
    default: false
  # Curated first-party ref list, JSON array (e.g. '["oci://ghcr.io/telorun/console","oci://ghcr.io/acme/telo-s3"]').
  # Registered idempotently on boot; the reconcile pass ingests them.
  seedRefs:
    env: SEED_REFS
    type: array
    default: []
  # Whether SEED_REFS may name a `./`-relative module directory, read off this
  # process's own disk from its working directory — how the development stack
  # indexes the repository's unpublished modules. `/register` never accepts one.
  allowLocalRefs:
    env: ALLOW_LOCAL_REFS
    type: boolean
    default: false
  # When the reconcile pass runs. Standard 5-field cron, in UTC.
  trackCron:
    env: TRACK_CRON
    type: string
    default: "*/15 * * * *"
  # Disable the periodic reconcile (tests and one-shot ingests drive
  # `Ingest.scheduleDueVersions` directly).
  trackEnabled:
    env: TRACK_ENABLED
    type: boolean
    default: true
  # The revision of the ingest pipeline. Raising it makes every tracked version
  # due exactly once — the whole-registry re-ingest control, and what a change to
  # what ingest EXTRACTS is deployed with. Per-version and per-module re-ingest
  # is a write to `version_ingest.ingest_rev` instead; see the README.
  ingestRev:
    env: INGEST_REV
    type: integer
    default: 9
  # Where the built-in vocabulary is published — one version per telo release,
  # the module every `Telo.<Kind>` names. Registered on every boot, so a
  # deployment tracks it whatever SEED_REFS says, and the one ref a
  # `Telo.Builtins` root is indexed at: registration is open, so nobody else may
  # publish "built-in" kinds.
  builtinsRef:
    env: BUILTINS_REF
    type: string
    default: oci://ghcr.io/telorun/telo
  # The command the origin reads run, as a JSON array: a program and its leading
  # arguments (e.g. '["telo"]'). It must be the telo that runs this hub, so the
  # `telo module manifest --json` contract ingest reads is this hub's own
  # generation — the development image points it at the checkout's CLI.
  teloCommand:
    env: TELO_COMMAND
    type: array
    items: { type: string }
    minItems: 1
    default: [telo]
  # An OpenAI-compatible /embeddings API: the `/v1` base URL the embedding
  # controller appends `/embeddings` to.
  embedderBaseUrl:
    env: EMBEDDER_BASE_URL
    type: string
  # The embedding model and everything that is a property of it. The four move
  # together: the defaults are embeddinggemma-300m's, and a different model
  # needs its own vector length and its own wrappers. Changing any of them is a
  # re-embed of the whole index — see "Changing the embedding model" in the
  # README — never an in-place swap.
  embedderModel:
    env: EMBEDDER_MODEL
    type: string
    default: embeddinggemma-300m
  # The length of the vectors the model returns, fixed into the vectors table
  # when it is created.
  embedderDimensions:
    env: EMBEDDER_DIMENSIONS
    type: integer
    minimum: 1
    default: 768
  # What each text is wrapped in before it is embedded, `{text}` standing for
  # the text. A prompt-tuned model expects its exact wrappers: without them the
  # similarity spread collapses and the ranking degenerates into orthographic
  # noise ("Schema" outranking a real scheduling match for the query
  # "schedule"). A symmetric model that takes raw text is given `{text}`.
  embedderQueryPrompt:
    env: EMBEDDER_QUERY_PROMPT
    type: string
    pattern: "\\{text\\}"
    default: "task: search result | query: {text}"
  embedderPassagePrompt:
    env: EMBEDDER_PASSAGE_PROMPT
    type: string
    pattern: "\\{text\\}"
    default: "title: none | text: {text}"
  # Relevance floor for the semantic arm — see the note beside `minScore` in
  # hub-search.yaml, which is where it is applied.
  vectorMinScore:
    env: VECTOR_MIN_SCORE
    type: number
    default: 0.3
  # Per-IP budget for the open /register verb. Registration is unauthenticated
  # and reads a remote origin, so it is the one endpoint that must not be free
  # to hammer.
  registerRateLimit:
    env: REGISTER_RATE_LIMIT
    type: integer
    default: 5
  registerRateWindow:
    env: REGISTER_RATE_WINDOW
    type: string
    default: 10m
secrets:
  bucketAccessKeyId:
    env: MANIFEST_BUCKET_ACCESS_KEY_ID
    type: string
  bucketSecretAccessKey:
    env: MANIFEST_BUCKET_SECRET_ACCESS_KEY
    type: string
  # The key of an embeddings API that asks for one, sent as a bearer token.
  # Empty for a self-hosted server that takes none: no header is sent at all.
  embedderApiKey:
    env: EMBEDDER_API_KEY
    type: string
    default: ""
targets:
  # Migrations first: every read below and the ingest claim itself are written
  # against tables this creates.
  - !ref Schema.migrations
  # The built-in vocabulary, before the seed: tracked unconditionally, since a
  # deployment that left it out of SEED_REFS would admit it at this ref and
  # never index it. Idempotent, like the seed.
  - name: registerBuiltins
    invoke: !ref Registry.registerModule
    inputs:
      ref: !cel "variables.builtinsRef"
  - !ref seedModules
  - !ref hubServer
  # Continues ingest runs whose process died, and starts the ones the reconcile
  # pass and /register schedule.
  - !ref resumer
  # One pass at boot. A cron fires at calendar instants, so without this a fresh
  # deployment — or a compose stack that has just seeded its refs — would sit
  # unindexed until the next quarter hour. It only enumerates, claims and
  # schedules; the runs themselves execute through the resumer above, so this
  # does not hold the boot sequence open for the length of an ingest.
  - ref: !ref Ingest.scheduleDueVersions
    when: !cel "variables.trackEnabled"
  - ref: !ref reconcile
    when: !cel "variables.trackEnabled"
---
# ── Storage ───────────────────────────────────────────────────────────────────
# The static manifest cache (manifests.telo.sh in production): an S3-compatible
# bucket (Cloudflare R2 / MinIO) ingest writes each version's telo.yaml into at
# the deterministic `<transport>/<host>/<path…>/<version>/telo.yaml` key — the
# key the `telo` CLI computes with the analyzer's shared helper, so the write key
# and studio's read key never drift. Never artifact payloads.

kind: S3.Bucket
metadata:
  name: manifestStore
bucketName: !cel "variables.bucketName"
endpoint: !cel "variables.bucketEndpoint"
forcePathStyle: !cel "variables.bucketForcePathStyle"
accessKeyId: !cel "secrets.bucketAccessKeyId"
secretAccessKey: !cel "secrets.bucketSecretAccessKey"
createIfMissing: true
# The manifest cache is the public, cookieless read plane — studio fetches
# cached telo.yaml with anonymous CORS GETs. On R2 public access comes from the
# domain binding instead; this covers S3-compatible local/dev backends.
publicRead: true
---
kind: S3.Put
metadata:
  name: putManifest
bucketRef: !ref manifestStore
---
kind: S3.Get
metadata:
  name: getManifest
bucketRef: !ref manifestStore
---
# ── Database ──────────────────────────────────────────────────────────────────
# ONE connection, handed to every library that reads or writes. It is also the
# connection the durable journal records through, which is what makes an ingest
# step's record commit with the step — see hub-ingest.yaml.

kind: Postgres.Connection
metadata:
  name: db
access: !ref databaseAccess
---
# ── Semantic search: embedding model + pgvector index ────────────────────────
# The embedder is any OpenAI-compatible /embeddings server, the model it serves
# named by `variables.embedderModel` (a self-hosted embeddinggemma-300m sidecar
# by default); the vector index is a pgvector table the backend owns, living in the same
# database as the relational rows. The RRF search query never touches that
# table — it only fuses the ids VectorStore.Match returns.

# A bearer token that may be absent. `HttpClient.BearerToken` refuses an empty
# token, rightly — a key that resolved to "" is a misconfiguration there — and a
# `credential:` slot is a reference, so it cannot be left out for one deployment
# and present for another. This kind is the same header for a key and no header
# at all for none, which is what "the embedder may or may not ask for a key"
# means. A credential rather than a default header on the client: a client
# publishes its headers as a reading, a credential's are marked sensitive.
kind: Telo.Definition
metadata:
  name: OptionalBearerToken
capability: Telo.Invocable
extends: HttpClient.Credential
schema:
  type: object
  additionalProperties: false
  required: [token]
  properties:
    token:
      type: string
      x-telo-eval: compile
resources:
  - kind: Run.Value
    metadata: { name: nothing }
    value: {}
invoke: !ref nothing
result:
  headers: !cel "self.token == '' ? {} : {'authorization': 'Bearer ' + self.token}"
---
kind: Self.OptionalBearerToken
metadata:
  name: embedderCredential
token: !cel "secrets.embedderApiKey"
---
# The embedder's endpoint, declared as an account.
kind: HttpClient.Client
metadata:
  name: embedderClient
baseUrl: !cel "variables.embedderBaseUrl"
credential: !ref embedderCredential
---
kind: HttpClient.Request
metadata:
  name: embedderRequest
client: !ref embedderClient
---
kind: OpenAI.EmbeddingModel
metadata:
  name: embedder
model: !cel "variables.embedderModel"
request: !ref embedderRequest
queryPrompt: !cel "variables.embedderQueryPrompt"
passagePrompt: !cel "variables.embedderPassagePrompt"
---
kind: Embedding.Passage
metadata:
  name: embedPassage
model: !ref embedder
---
kind: Embedding.Query
metadata:
  name: embedQuery
model: !ref embedder
---
# The vectors table (`resource_vectors`) is provisioned by this Store on init —
# CREATE EXTENSION vector + table + HNSW index. The vector length is fixed at
# creation: an existing table keeps the length it was created with.
kind: VectorStorePgvector.Store
metadata:
  name: vectorIndex
connection: !ref db
dimensions: !cel "variables.embedderDimensions"
metric: cosine
table: resource_vectors
---
kind: VectorStore.Record
metadata:
  name: vectorUpsert
store: !ref vectorIndex
---
kind: VectorStore.Match
metadata:
  name: vectorMatch
store: !ref vectorIndex
topK: 50
---
kind: VectorStore.Removal
metadata:
  name: vectorRemove
store: !ref vectorIndex
---
# ── Rate limiting (open /register verb) ──────────────────────────────────────
# Counters live in an in-process memory store: the hub is a single instance, and
# a limiter that resets on restart is the right trade here (a Cache.Redis store
# is a drop-in swap if the hub is ever replicated). The guard is non-throwing —
# it returns a verdict and the caller maps it to a 429.

kind: CacheMemory.Store
metadata:
  name: rateLimitCounters
---
kind: RateLimit.Guard
metadata:
  name: registerRateLimit
store: !ref rateLimitCounters
limit: !cel "variables.registerRateLimit"
window: !cel "variables.registerRateWindow"
---
# ── Local shell (origin reads → telo CLI) ────────────────────────────────────
# Every transport-specific read goes through the generic `telo module …` CLI
# verbs — nothing here speaks OCI or the registry protocol directly.

kind: Shell.LocalHost
metadata:
  name: localShell
---
# ── Boot and background work ─────────────────────────────────────────────────

# The curated seed list: rows only. What ingests them is the reconcile pass,
# which is also what re-ingests them when their content moves.
kind: Run.Iteration
metadata:
  name: seedModules
collection: !cel "variables.seedRefs"
steps:
  - name: register
    invoke: !ref Registry.registerModule
    inputs:
      ref: !cel "string(item)"
---
# The reconcile pass. A cron rather than a sleep loop, so a tick means a
# calendar instant rather than "an interval after whatever the last pass took",
# and a pass that overruns does not push every later one along with it.
kind: Scheduler.Cron
metadata:
  name: reconcile
cron: !cel "variables.trackCron"
invoke: !ref Ingest.scheduleDueVersions
---
# Picks up ingest runs whose process died, and starts the ones the reconcile pass
# and /register schedule — a scheduled run is admitted immediately and executed
# here, which is what keeps the request path free of the work.
kind: Durable.Resumer
metadata:
  name: resumer
workflow: !ref Ingest.ingestVersion
interval: 2s
---
# ── HTTP surface (telo.sh) ────────────────────────────────────────────────────
# The cloud CLI: the generic read verbs plus discovery as HTTP paths. Dynamic
# reads only — the static manifest read lives on the bucket domain, and
# install/run stay origin-direct and never touch this app.

kind: Http.Server
metadata:
  name: hubServer
listen:
  port: !cel "ports.http"
cors:
  origin: "*"
  methods: "GET,POST,OPTIONS"
openapi:
  info:
    title: Telo Hub
    # The HTTP API's own version, not the app version (which changie owns) —
    # deliberately outside the release replacement.
    version: 1.0.0
    description: >-
      Federated discovery over Telo modules: per-resource search, ref
      autocomplete, and version enumeration for registered modules.
mounts:
  - path: /health
    mount: !ref health
  - path: /mcp
    mount: !ref mcpHttp
  - path: /
    mount: !ref publicApi
---
kind: Http.Api
metadata:
  name: health
routes:
  - request:
      path: /readiness
      method: GET
    returns:
      - status: 200
        content:
          application/json:
            body:
              status: "ok"
  - request:
      path: /liveness
      method: GET
    returns:
      - status: 200
        content:
          application/json:
            body:
              status: "ok"
---
kind: Http.Api
metadata:
  name: publicApi
routes:
  # Search and browse are ONE surface: `category` narrows the same query, and an
  # empty `q` degrades to an unranked listing, so `?q=&category=storage` browses
  # a category without a second endpoint that would drift from this one.
  - request:
      path: /search/resources
      method: GET
      schema:
        query:
          type: object
          properties:
            q: { type: string, default: "", description: "Search query over resource kinds." }
            category:
              type: string
              default: ""
              description: "Narrow to kinds in this category. Empty means no facet filter."
            runtime:
              type: string
              default: ""
              # Enumerated, because an unrecognized value would otherwise select
              # only portable kinds — a near-empty result set that reads as "no
              # such module" rather than "bad filter". The labels match the
              # `runtime:` field on an `imports:` entry, so `nodejs` (not `node`)
              # is what an author who has read a manifest will reach for.
              enum: ["", "nodejs", "rust"]
              description: >-
                Narrow to kinds a given kernel can load ("nodejs", "rust"). Telo
                is polyglot, so a kind's controllers decide which kernels can host
                it; without this filter a caller composing for one kernel is
                offered kinds it cannot run. Kinds with no controllers at all are
                portable and always match. Empty means no filter.
            entry:
              type: array
              items: { type: string, enum: [kind, instance, application] }
              minItems: 1
              default: [kind, instance]
              description: >-
                Entry types to rank, repeatable (`entry=kind&entry=application`):
                `kind`, `instance`, `application`. Omitted means kinds and
                instances; an application is opt-in, since it is run rather than
                imported. A `runtime` filter cannot be combined with
                `application`.
            publisher:
              type: string
              default: ""
              description: >-
                Narrow to modules published under this host and org, exactly as
                `module.publisher` reports it (`ghcr.io/telorun`). A publisher
                is derived from refs, not declared, so one with no module
                selects nothing rather than being refused. Empty means no filter.
    handler: !ref Search.searchResources
    inputs:
      q: !cel "request.query.q"
      category: !cel "request.query.category"
      runtime: !cel "request.query.runtime"
      entry: !cel "request.query.entry"
      publisher: !cel "request.query.publisher"
    returns:
      - status: 200
        content:
          application/json:
            body:
              query: !cel "request.query.q"
              category: !cel "request.query.category"
              runtime: !cel "request.query.runtime"
              publisher: !cel "request.query.publisher"
              categories: !cel "result.categories"
              categoryFilterDropped: !cel "result.categoryFilterDropped"
              hits: !cel "result.hits"
    catches:
      # A category outside the declared vocabulary is the caller's mistake, so
      # it is a 400 carrying the vocabulary — not a 200 with an empty list.
      - status: 400
        when: !cel "error.code == 'ERR_UNKNOWN_CATEGORY'"
        content:
          application/json:
            body:
              error: !cel "error.message"
      # An application's runtime reach is not indexed, so a runtime filter over
      # applications has no answer to give; an unknown entry type is refused by
      # the query schema before it gets here, and mapped for any other caller.
      - status: 400
        when: !cel "error.code == 'ERR_RUNTIME_FILTER_UNSUPPORTED' || error.code == 'ERR_UNKNOWN_ENTRY_TYPE'"
        content:
          application/json:
            body:
              code: !cel "error.code"
              error: !cel "error.message"
      # The embedding and vector backends declare no throw list, so anything
      # else is a server fault: return only the code, never an upstream message.
      - status: 500
        content:
          application/json:
            body:
              code: !cel "error.code"
              error: search failed

  - request:
      path: /search/modules
      method: GET
      schema:
        query:
          type: object
          properties:
            q: { type: string, default: "", description: "Search query, results grouped by module." }
            category:
              type: string
              default: ""
              # Not an enum — the vocabulary is open. Guarded instead: see the
              # note on /search/resources.
              description: >-
                Narrow to modules in this category. A slug outside the declared
                vocabulary is a 400, not an empty list; a recognized one that
                selects nothing for the query is dropped and reported as
                `categoryFilterDropped`. Empty means no facet filter.
            runtime:
              type: string
              default: ""
              enum: ["", "nodejs", "rust"]
              description: >-
                Narrow to modules a given kernel can load ("nodejs", "rust"). A
                module matches when that kernel runs at least one of its kinds —
                the hit's `runtime.full` says whether it covers all of them.
                Empty means no filter.
            entry:
              type: array
              items: { type: string, enum: [kind, instance, application] }
              minItems: 1
              default: [kind, instance]
              description: >-
                Entry types to rank, repeatable (`entry=kind&entry=application`):
                `kind`, `instance`, `application`. Omitted means kinds and
                instances; an application is opt-in, since it is run rather than
                imported. A `runtime` filter cannot be combined with
                `application`.
            publisher:
              type: string
              default: ""
              description: >-
                Narrow to modules published under this host and org, exactly as
                `module.publisher` reports it (`ghcr.io/telorun`). A publisher
                is derived from refs, not declared, so one with no module
                selects nothing rather than being refused. Empty means no filter.
            sort:
              type: string
              default: relevance
              # Enumerated: an unrecognized order would silently be relevance.
              enum: [relevance, name, recent]
              description: >-
                The order of the hits: `relevance` (the fused score), `name`
                (the declared module name) or `recent` (when the hub first
                tracked the listed version, newest first — the hub's own
                observation, not a publish date). With a query, `name` and
                `recent` order the ranked candidates, not the whole catalogue.
            deprecated:
              type: string
              default: include
              enum: [include, exclude]
              description: >-
                `exclude` leaves deprecated modules out of the hits and of
                `total`; `hidden.deprecated` says how many matched.
            contractOnly:
              type: string
              default: include
              enum: [include, exclude]
              description: >-
                `exclude` leaves out modules whose every exported kind is a
                contract with no implementation of its own;
                `hidden.contractOnly` says how many matched.
            limit:
              type: integer
              default: 20
              minimum: 1
              maximum: 100
              description: "Page size. Browsing a whole category needs more than a ranked top-N."
            offset: { type: integer, default: 0, minimum: 0, description: "Rows to skip." }
    handler: !ref Search.searchModules
    inputs:
      q: !cel "request.query.q"
      category: !cel "request.query.category"
      runtime: !cel "request.query.runtime"
      publisher: !cel "request.query.publisher"
      sort: !cel "request.query.sort"
      deprecated: !cel "request.query.deprecated"
      contractOnly: !cel "request.query.contractOnly"
      limit: !cel "request.query.limit"
      offset: !cel "request.query.offset"
      entry: !cel "request.query.entry"
    returns:
      - status: 200
        content:
          application/json:
            body:
              query: !cel "request.query.q"
              category: !cel "request.query.category"
              runtime: !cel "request.query.runtime"
              # Echoed so a caller can tell a hub that applied the filter and the
              # order from an older one that ignored the parameters.
              publisher: !cel "request.query.publisher"
              sort: !cel "request.query.sort"
              deprecated: !cel "request.query.deprecated"
              contractOnly: !cel "request.query.contractOnly"
              categories: !cel "result.categories"
              categoryFilterDropped: !cel "result.categoryFilterDropped"
              total: !cel "result.total"
              hidden: !cel "result.hidden"
              hits: !cel "result.hits"
    catches:
      - status: 400
        when: !cel "error.code == 'ERR_UNKNOWN_CATEGORY'"
        content:
          application/json:
            body:
              error: !cel "error.message"
      # An application's runtime reach is not indexed, so a runtime filter over
      # applications has no answer to give; an unknown entry type is refused by
      # the query schema before it gets here, and mapped for any other caller.
      - status: 400
        when: !cel "error.code == 'ERR_RUNTIME_FILTER_UNSUPPORTED' || error.code == 'ERR_UNKNOWN_ENTRY_TYPE'"
        content:
          application/json:
            body:
              code: !cel "error.code"
              error: !cel "error.message"
      - status: 500
        content:
          application/json:
            body:
              code: !cel "error.code"
              error: search failed

  # Browse, not search: the categories that actually exist, with how many
  # modules and kinds sit in each. Answered by the SAME resource the search
  # guard consults, so "what slugs exist" has one definition — publishing a slug
  # here that the guard would reject was the divergence this collapses.
  - request:
      path: /categories
      method: GET
      schema:
        query:
          type: object
          properties:
            entry:
              type: array
              items: { type: string, enum: [kind, instance, application] }
              minItems: 1
              default: [kind, instance]
              description: >-
                Entry types whose categories to list, repeatable: `kind`,
                `instance`, `application`. A category is listed when an entry of a
                requested type declares it, and `modules` counts modules with such
                an entry. Omitted means kinds and instances.
    handler: !ref Search.categoryVocabulary
    inputs:
      category: ""
      entry: !cel "request.query.entry"
    returns:
      - status: 200
        content:
          application/json:
            body:
              categories: !cel >-
                result.categories.map(c, {'category': c.category, 'label': c.label,
                                          'modules': c.modules, 'kinds': c.kinds})
    catches:
      # The query schema refuses an unknown entry type first; this maps it for
      # any other way in.
      - status: 400
        when: !cel "error.code == 'ERR_UNKNOWN_ENTRY_TYPE'"
        content:
          application/json:
            body:
              code: !cel "error.code"
              error: !cel "error.message"

  # The publishers that exist — every host and org a searchable module sits
  # under — with how many modules each holds. The values are what the
  # `publisher` filter takes.
  - request:
      path: /publishers
      method: GET
      schema:
        query:
          type: object
          properties:
            entry:
              type: array
              items: { type: string, enum: [kind, instance, application] }
              minItems: 1
              default: [kind, instance]
              description: >-
                Entry types whose publishers to list, repeatable. `modules`
                counts modules with an entry of a requested type. Omitted means
                kinds and instances.
    handler: !ref Search.publisherFacet
    inputs:
      entry: !cel "request.query.entry"
    returns:
      - status: 200
        content:
          application/json:
            body:
              publishers: !cel "result.publishers"
    catches:
      - status: 400
        when: !cel "error.code == 'ERR_UNKNOWN_ENTRY_TYPE'"
        content:
          application/json:
            body:
              code: !cel "error.code"
              error: !cel "error.message"

  # Every module importing a given module, each at its latest version — the
  # reverse of `imports:`.
  - request:
      path: /dependents
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Ref of the imported module, exactly as registered." }
            limit:
              type: integer
              default: 50
              minimum: 1
              maximum: 100
              description: "Page size."
            offset: { type: integer, default: 0, minimum: 0, description: "Rows to skip." }
          required: [ref]
    handler: !ref Catalog.dependents
    inputs:
      ref: !cel "request.query.ref"
      limit: !cel "request.query.limit"
      offset: !cel "request.query.offset"
    returns:
      - status: 200
        content:
          application/json:
            body:
              of: !cel "{'ref': request.query.ref}"
              # How many modules import it in all — what a caller holding one
              # page is not being shown, and what tells it from an older hub
              # that returned every row.
              total: !cel "result.total"
              dependents: !cel >-
                result.dependents.map(d, {'ref': d.ref, 'version': d.version, 'name': d.name,
                                          'description': d.description, 'application': d.application})

  # Every kind that implements a given contract, across module boundaries — the
  # derived grouping axis. A backend is discoverable from the abstract it
  # extends without the abstract's module knowing it exists.
  - request:
      path: /implementations
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Ref of the module owning the extended kind." }
            kind: { type: string, description: "Extended kind's suffix, e.g. Store." }
          required: [ref, kind]
    handler: !ref Catalog.implementations
    inputs:
      ref: !cel "request.query.ref"
      kind: !cel "request.query.kind"
    returns:
      - status: 200
        content:
          application/json:
            body:
              extends: !cel "{'ref': request.query.ref, 'kind': request.query.kind}"
              implementations: !cel "result.implementations"

  # Every ready-made instance of a kind, across module boundaries — the instance
  # axis. A module packaging instances of another module's kind (a language
  # model pack) is reached from the kind instead of ranking as a search result.
  - request:
      path: /instances
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Ref of the module owning the kind." }
            kind: { type: string, description: "Kind's suffix, e.g. Language." }
          required: [ref, kind]
    handler: !ref Catalog.instances
    inputs:
      ref: !cel "request.query.ref"
      kind: !cel "request.query.kind"
    returns:
      - status: 200
        content:
          application/json:
            body:
              of: !cel "{'ref': request.query.ref, 'kind': request.query.kind}"
              instances: !cel "result.instances"

  # Lexical ref typeahead (pg_trgm): completes a ref whose name the author
  # already knows — the memorable token at an OCI path's tail matches without
  # the scheme/host boilerplate, and a typo still hits. Not the semantic
  # /search/* — no embedder in this path, ever.
  - request:
      path: /refs
      method: GET
      schema:
        query:
          type: object
          properties:
            q: { type: string, default: "", description: "Fuzzy substring over registered refs." }
    handler: !ref Catalog.refSuggestions
    inputs:
      q: !cel "request.query.q"
    returns:
      - status: 200
        content:
          application/json:
            body:
              query: !cel "request.query.q"
              refs: !cel "result.refs"

  # The whole catalogue — every ref `/module` answers for — paged by `seq`, the
  # module row's id. What a sitemap is built from: search folds packs into
  # `siblings` and caps its candidates, and `/refs` stops at 20.
  - request:
      path: /modules
      method: GET
      schema:
        query:
          type: object
          properties:
            after:
              type: integer
              default: 0
              minimum: 0
              description: "Return modules whose seq is greater than this; the previous page's `next`."
            limit:
              type: integer
              default: 1000
              minimum: 1
              maximum: 1000
              description: "Page size."
    handler: !ref Catalog.trackedModules
    inputs:
      ref: ""
      after: !cel "request.query.after"
      limit: !cel "request.query.limit"
    returns:
      - status: 200
        content:
          application/json:
            body:
              modules: !cel "result.modules"
              next: !cel "result.next"
    catches:
      - status: 500
        content:
          application/json:
            body:
              code: !cel "error.code"
              error: listing failed

  # Everything a module page renders, in one call. `/search/*` answers "which
  # module should I use"; this answers "tell me about this one", which a search
  # hit cannot: it is keyed by ref rather than ranked, serves a specific version
  # rather than only the latest, and carries the full kind list with the
  # per-kind detail a card has no room for.
  - request:
      path: /module
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Module ref exactly as registered." }
            version:
              type: string
              default: ""
              description: "Tracked version to describe. Empty means the latest."
          required: [ref]
    handler: !ref Catalog.moduleDetail
    inputs:
      ref: !cel "request.query.ref"
      version: !cel "request.query.version"
    returns:
      - status: 200
        when: !cel "result.found"
        content:
          application/json:
            body:
              module: !cel "result.module"
              kinds: !cel "result.kinds"
              exportedResources: !cel "result.exportedResources"
              versions: !cel "result.versions"
              application: !cel "result.application"
              imports: !cel "result.imports"
              dependents: !cel "result.dependents"
      # One 404 for both "never registered" and "no such version": the caller's
      # next move is the same either way, and distinguishing them would leak
      # which refs are tracked.
      - status: 404
        content:
          application/json:
            body:
              error: Module not tracked

  # The cached `telo.yaml` of one version, as text — the HTTP twin of the
  # `get_module_manifest` tool, on the same handler. One 404 for an unknown ref
  # and an unknown version, as `/module` answers.
  - request:
      path: /module/manifest
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Module ref exactly as registered." }
            version:
              type: string
              default: latest
              description: "Tracked version to read, or `latest` (default)."
          required: [ref]
    handler: !ref Catalog.moduleManifestText
    inputs:
      ref: !cel "request.query.ref"
      version: !cel "request.query.version"
    returns:
      - status: 200
        content:
          text/yaml; charset=utf-8:
            body: !cel "result.text"
    catches:
      - status: 404
        when: !cel "error.code == 'ERR_NOT_FOUND'"
        content:
          application/json:
            body:
              error: Module not tracked
      - status: 500
        content:
          application/json:
            body:
              code: !cel "error.code"
              error: manifest read failed

  - request:
      path: /module/versions
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Module ref exactly as registered." }
          required: [ref]
    handler: !ref Catalog.moduleVersionList
    inputs:
      ref: !cel "request.query.ref"
    returns:
      - status: 200
        when: !cel "result.found"
        content:
          application/json:
            body:
              ref: !cel "request.query.ref"
              versions: !cel "result.versions"
      - status: 404
        content:
          application/json:
            body:
              error: Module not tracked

  # Open, unauthenticated self-service registration (the reader's browser on
  # hub.telo.run, served by apps/hub-web, POSTs here cross-origin). Validates
  # the ref resolves to a real Telo module and, on success, records it and
  # schedules its first ingest.
  #
  # 202, not 200: indexing is asynchronous now, so "accepted" is the honest
  # claim and `GET /register/status?ref=` is what says when it is searchable.
  - request:
      path: /register
      method: POST
      schema:
        body:
          type: object
          additionalProperties: false
          properties:
            ref:
              type: string
              minLength: 1
              description: "Module ref to register (e.g. oci://ghcr.io/acme/telo-s3 or https://host/path/telo.yaml)."
          required: [ref]
    handler: !ref Registry.registerAndValidate
    inputs:
      ref: !cel "request.body.ref"
      clientIp: !cel "request.ip"
    returns:
      - status: 429
        when: !cel "result.rateLimited"
        headers:
          Retry-After: !cel "string(result.retryAfter)"
        content:
          application/json:
            body:
              error: !cel "result.error"
              retryAfter: !cel "result.retryAfter"
      - status: 202
        when: !cel "result.accepted"
        content:
          application/json:
            body:
              registered: true
              ref: !cel "result.ref"
              status: pending
      - status: 400
        content:
          application/json:
            body:
              error: !cel "result.error"
    catches:
      # The CLI emits JSON on a clean exit, but a malformed payload would surface
      # as ERR_PARSE_FAILED — treat that as an unreadable module (400). Any other
      # throw is a server-side fault: return only the error CODE, never the
      # message, since this endpoint is anonymous and a raw message can carry
      # host paths or upstream detail.
      - status: 400
        when: !cel "error.code == 'ERR_PARSE_FAILED'"
        content:
          application/json:
            body:
              error: could not read module metadata
      - status: 500
        content:
          application/json:
            body:
              code: !cel "error.code"
              error: registration failed

  # What a client polls after a 202. Answered from the ROWS — the authoritative
  # record of what has been ingested — rather than from a durable run: a run is
  # per version and its id carries a digest and an attempt the client does not
  # hold, while a ref spans many versions.
  - request:
      path: /register/status
      method: GET
      schema:
        query:
          type: object
          properties:
            ref: { type: string, description: "Module ref exactly as submitted to /register." }
          required: [ref]
    handler: !ref Catalog.registrationStatus
    inputs:
      ref: !cel "request.query.ref"
    returns:
      # 404 with the SAME shape as every other answer: a client polling this
      # reads one body, and `status` is the field it branches on. A 404 whose
      # body carried only an error string is indistinguishable to that client
      # from a hub it could not reach, which is a different fact entirely.
      - status: 404
        when: !cel "result.status == 'unknown'"
        content:
          application/json:
            body:
              ref: !cel "result.ref"
              status: !cel "result.status"
              error: Module not registered
      - status: 200
        content:
          application/json:
            body:
              ref: !cel "result.ref"
              status: !cel "result.status"
              latestVersion: !cel "result.latestVersion"
              versionsKnown: !cel "result.versionsKnown"
              versionsIngested: !cel "result.versionsIngested"
              error: !cel "result.error"
              nextAttemptAt: !cel "result.nextAttemptAt"

  - request:
      path: /health
      method: GET
    handler:
      kind: Run.Value
      value:
        status: ok
    returns:
      - status: 200
        content:
          application/json:
            body:
              status: !cel "result.status"
---
# ── MCP surface ───────────────────────────────────────────────────────────────

kind: Mcp.Tools
metadata:
  name: HubTools
entries:
  # search_resources — the unit an LLM composes with is a resource kind it can
  # import, not a package. Each hit carries the kind suffix and the exact
  # module location ref to import it under a chosen alias.
  - name: search_resources
    description: |
      Search what registered Telo modules can do, on any host or transport.
      Pass one `query`, or several `queries` to search every capability you
      need in ONE call; each is answered separately under `results`.
      Hits are grouped under the module that owns them: `ref` + `version` are
      what you import, `name` on a hit is what you write after YOUR import
      alias. A hit is a kind to declare unless it says otherwise: `entry:
      instance` is a ready-made resource (`!ref <YourAlias>.<name>`, or
      `<YourAlias>.<name>(…)` for a function) of the kind in `kind`, and
      `entry: application` a runnable application — never written in
      `imports:`, run by pinned ref or stood up with `App.Instance`, with the
      inputs it asks for under `application`. A member a hit does not carry is
      empty: no `extends` means it extends nothing, no `instances` that no
      ready-made instance exists, no `runtimes` that any kernel loads it. A
      module with `builtin: true` is the built-in vocabulary: write its kinds
      as `Telo.<name>` with no import (its hits state no `runtimes`).
      Follow up with `get_kinds` for the exact schemas of the kinds you chose.
    argumentsSchema:
      type: object
      properties:
        query: { type: string, description: "What the resource should do (name or description)." }
        queries:
          type: array
          items: { type: string }
          description: "Several needs searched in one call, each answered on its own."
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 8
          description: "Most hits per query."
        category:
          type: string
          default: ""
          # Not enumerable — the vocabulary is open, so the guard is a hard
          # error naming the real slugs, rather than a silent empty set.
          description: >-
            Optional domain slug to narrow the search. OMIT IT UNLESS YOU KNOW
            THE SLUG EXISTS: categories are declared by module authors and open-
            ended, so a guessed one is rejected rather than answered.
            `list_categories` lists the real vocabulary.
        runtime:
          type: string
          default: ""
          # Enumerated so a wrong value is a tool error, not a near-empty result
          # set: an unrecognized value would match only portable kinds, which
          # reads as "nothing like that exists" rather than "bad argument".
          enum: ["", "nodejs", "rust"]
          description: >-
            Optional kernel the composed manifest will run on (`nodejs`,
            `rust`). Telo is polyglot and a kind's controllers decide which
            kernels can host it, so without this you may be offered a kind the
            target kernel cannot load. Kinds with no controllers are portable and
            always match. Omit unless the caller named a runtime. Cannot be
            combined with `application` in `entry`: an application's reach is
            not indexed.
        entry:
          type: array
          items: { type: string, enum: [kind, instance, application] }
          minItems: 1
          default: [kind, instance]
          description: >-
            Entry types to rank together: `kind` (a kind to declare), `instance`
            (a ready-made instance to reference) and `application` (a runnable
            application to run by pinned ref, never to import). Default
            `[kind, instance]`.
        publisher:
          type: string
          default: ""
          description: >-
            Optional host and org to stay within, as `list_libraries` takes it
            (`ghcr.io/telorun`). Omit unless the caller named a publisher.
      additionalProperties: false
    handler: !ref Search.searchMany
    inputs:
      queries: !cel >-
        request.arguments.?queries.orValue([])
          + (has(request.arguments.query) ? [request.arguments.query] : [])
      limit: !cel "request.arguments.?limit.orValue(8)"
      category: !cel "request.arguments.?category.orValue('')"
      runtime: !cel "request.arguments.?runtime.orValue('')"
      entry: !cel "request.arguments.?entry.orValue(['kind', 'instance'])"
      publisher: !cel "request.arguments.?publisher.orValue('')"
    result:
      content:
        - type: text
          # The grouped form, and nothing a caller cannot act on: the facet has
          # its own tool, and `categoryFilterDropped` is stated only when the
          # hits are from a widened search rather than the requested category.
          text: !cel >-
            size(result) == 0
              ? json({'error': 'pass `query` or `queries`'})
              : json({'results': result.map(r, compact({
                  'query': r.query,
                  'categoryFilterDropped': r.categoryFilterDropped ? dyn(true) : dyn(null),
                  'modules': r.modules}))})
      isError: !cel "size(result) == 0"
    catches:
      # -32602 (invalid params), not an empty hit list: a guessed category that
      # answered "no such kind" is what sent an agent hunting for a capability
      # it had already found. The message carries the real slugs.
      - when: !cel "error.code == 'ERR_UNKNOWN_CATEGORY'"
        error:
          code: -32602
          message: !cel "error.message"
      # MCP arguments are not validated against `argumentsSchema`, so an unknown
      # entry type reaches the handler and is refused there.
      - when: !cel "error.code == 'ERR_RUNTIME_FILTER_UNSUPPORTED' || error.code == 'ERR_UNKNOWN_ENTRY_TYPE'"
        error:
          code: -32602
          message: !cel "error.message"
          data:
            code: !cel "error.code"
      # A `limit` outside 1–50, or an argument of the wrong type.
      - when: !cel "error.code == 'ERR_INPUT_INVALID'"
        error:
          code: -32602
          message: !cel "error.message"
      - error:
          code: -32603
          message: !cel "'search failed: ' + error.code"

  # get_kinds — what a caller reads to WRITE a resource: the definitions of the
  # kinds it names and nothing else of their modules. Text, not JSON: the
  # documents are the manifest's own YAML, and quoting them into a JSON string
  # would cost an escape per line. The text is the catalog's, so the answer is
  # tested where it is built.
  - name: get_kinds
    description: |
      Fetch the definitions of the kinds you name — the EXACT field shapes to
      author against — across any number of modules in one call. For each
      module it returns the line to write under `imports:` (ref, version and
      integrity pin), then each asked kind's `Telo.Definition` document as its
      module wrote it: `schema`, `inputType`, `outputType`, `throws`,
      `status`. Every named shape and parent kind a definition reaches is
      included, parents in other modules too, so one call answers what fields
      a kind takes. A name the module does not define is reported with the
      kinds it does export. Prefer this to `get_module_manifest`, which
      returns a whole module.
      Built-ins (`Telo.<Kind>` parents, and the schema fragments, value types,
      zone attributes and formats a definition names) come back from the
      built-in vocabulary of one telo version, stated in the answer, with no
      import line: write them as `Telo.<Kind>`, never imported.
    argumentsSchema:
      type: object
      properties:
        kinds:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              ref: { type: string, description: "Location ref of the module owning the kind, exactly as search_resources returned it." }
              kind: { type: string, description: "The kind's name within that module, e.g. Server." }
              version: { type: string, description: "Exact version, or omit for the latest tracked one. One version is read per module." }
            required: [ref, kind]
            additionalProperties: false
        telo:
          type: string
          default: ""
          description: >-
            The telo release the manifest will run on, as `telo --version`
            prints it (`X`): every built-in is read at that version. Never pass
            an `X+unreleased` version — a working copy no hub tracks: omit
            `telo` and read the built-ins from that CLI with `telo builtins
            <names>`. Omitted, built-ins are read at the latest version the hub
            tracks; a version it does not track is refused, naming the ones it
            does.
      required: [kinds]
      additionalProperties: false
    handler: !ref Catalog.kindDefinitions
    inputs:
      kinds: !cel "request.arguments.?kinds.orValue([])"
      telo: !cel "request.arguments.?telo.orValue('')"
    result:
      content:
        - type: text
          text: !cel "result.text"
      isError: !cel "result.isError"
    catches:
      # -32602 (invalid params): the message names the versions the hub tracks.
      - when: !cel "error.code == 'ERR_UNKNOWN_TELO_VERSION'"
        error:
          code: -32602
          message: !cel "error.message"
          data:
            code: !cel "error.code"
      - error:
          code: -32603
          message: !cel "'reading kinds failed: ' + error.code"

  # list_libraries — the whole of a publisher's library in one small answer, so
  # a caller that keeps it need not search for what it can already name.
  - name: list_libraries
    description: |
      List every library the hub tracks at its latest version, one entry each:
      its ref, name, a one-sentence summary and the names of the kinds and
      ready-made instances it exports. Pass `publisher` (a host and
      organisation, e.g. `ghcr.io/telorun` for the standard library) to list
      one publisher's libraries. The entry marked `builtin: true` is the
      built-in vocabulary, whose kinds are written `Telo.<name>` with no
      import. Read it once to learn what exists, then `get_kinds` for the
      schemas of what you will use.
    argumentsSchema:
      type: object
      properties:
        publisher:
          type: string
          default: ""
          description: "Host and organisation whose libraries to list; omit for every tracked library."
      additionalProperties: false
    handler: !ref Catalog.libraryIndex
    inputs:
      publisher: !cel "request.arguments.?publisher.orValue('')"
    result:
      content:
        - type: text
          text: !cel "json({'libraries': result.libraries})"

  # get_module_manifest — keyed off the module's location ref, serving the
  # cached telo.yaml.
  - name: get_module_manifest
    description: |
      Fetch the raw `telo.yaml` for a tracked module by its location ref
      (e.g. `oci://ghcr.io/acme/telo-s3`). The response
      contains the root `Telo.Library` or `Telo.Application` document and the
      `Telo.Definition` docs that fully describe the module's public surface. `version` defaults to `latest`
      (the latest tracked version).
    argumentsSchema:
      type: object
      properties:
        ref: { type: string, description: "Module location ref exactly as returned by search_resources." }
        version:
          type: string
          default: latest
          description: Exact version to fetch, or `latest` (default).
      required: [ref]
      additionalProperties: false
    handler: !ref Catalog.moduleManifestText
    inputs:
      ref: !cel "request.arguments.ref"
      version: !cel "request.arguments.?version.orValue('latest')"
    result:
      content:
        - type: text
          text: !cel "result.text"
    catches:
      - when: !cel "error.code == 'ERR_NOT_FOUND'"
        error:
          code: -32004
          message: Module not found
      - when: !cel "error.code == 'ERR_INVALID_REFERENCE' || error.code == 'ERR_INVALID_RESPONSE'"
        error:
          code: -32603
          message: !cel "error.message"

  # get_module — keyed facts, not schema text: everything /module answers, in
  # one call, so a license/deprecation/runtime check needs no YAML parsing.
  - name: get_module
    description: |
      Look up everything the hub knows about one tracked module by its
      location ref: description, license, repository, publisher, deprecation,
      runtime reach, every EXPORTED kind (with capability, description,
      `extends` and runtime reach), every exported instance, and the full
      version list. For an application, `application` lists the variables,
      secrets and ports it declares (null for a library), and it has no kinds,
      instances or indexed runtime reach. `version` defaults to the latest tracked version. Use this
      for facts; use `get_module_manifest` when you need the exact schema to
      author against.
    argumentsSchema:
      type: object
      properties:
        ref: { type: string, description: "Module location ref exactly as returned by search_resources." }
        version:
          type: string
          default: ""
          description: "Tracked version to describe, or empty for the latest (default)."
      required: [ref]
      additionalProperties: false
    handler: !ref Catalog.moduleDetail
    inputs:
      ref: !cel "request.arguments.ref"
      version: !cel "request.arguments.?version.orValue('')"
    result:
      content:
        - type: text
          text: !cel >-
            result.found
              ? json({'module': result.module, 'kinds': result.kinds,
                      'exportedResources': result.exportedResources, 'versions': result.versions,
                      'application': result.application, 'imports': result.imports,
                      'dependents': result.dependents})
              : json({'error': 'Module not tracked', 'ref': request.arguments.ref})
      isError: !cel "!result.found"

  # list_module_versions — the import-pin lookup: an agent composing an
  # `imports:` entry has no other way to learn a version's integrity hash.
  - name: list_module_versions
    description: |
      List every version of a tracked module the hub has ingested, newest
      first, each with its `integrity` pin (the `sha256-<base64url>` hash to
      write after `@` in an `imports:` entry) when one is known. Use this to
      pin a specific version instead of importing an unpinned `latest`.
    argumentsSchema:
      type: object
      properties:
        ref: { type: string, description: "Module location ref exactly as returned by search_resources." }
      required: [ref]
      additionalProperties: false
    handler: !ref Catalog.moduleVersionList
    inputs:
      ref: !cel "request.arguments.ref"
    result:
      content:
        - type: text
          text: !cel >-
            result.found
              ? json({'ref': request.arguments.ref, 'versions': result.versions})
              : json({'error': 'Module not tracked', 'ref': request.arguments.ref})
      isError: !cel "!result.found"

  # find_implementations — the derived grouping axis: every kind that extends
  # a contract, across module boundaries, without the contract's own module
  # knowing any of them exist.
  - name: find_implementations
    description: |
      List every exported kind that extends a given contract (e.g. every
      backend of an abstract like `Sql.Connection`), across module boundaries.
      `ref` + `kind` name the contract exactly as a hit's `extends` field does
      (a `Telo.*` built-in is owned by the built-in vocabulary's ref). Use this
      after finding an abstract kind, to discover which concrete module
      implements it.
    argumentsSchema:
      type: object
      properties:
        ref: { type: string, description: "Location ref of the module owning the extended kind (the built-in vocabulary's ref for a Telo.* built-in)." }
        kind: { type: string, description: "Extended kind's suffix, e.g. Store." }
      required: [ref, kind]
      additionalProperties: false
    handler: !ref Catalog.implementations
    inputs:
      ref: !cel "request.arguments.ref"
      kind: !cel "request.arguments.kind"
    result:
      content:
        - type: text
          text: !cel >-
            json({'extends': {'ref': request.arguments.ref, 'kind': request.arguments.kind},
                  'implementations': result.implementations})

  # find_dependents — the reverse of `imports:`: every module importing a given
  # one, which is where working uses of its kinds are found.
  - name: find_dependents
    description: |
      List the tracked modules that import a given module, each at its latest
      version and with a one-sentence summary. Use it to find working examples
      of a module's kinds in use, or to see what a change to a module would
      reach. `total` is how many import it in all; page with `offset` when it
      exceeds the entries returned.
    argumentsSchema:
      type: object
      properties:
        ref: { type: string, description: "Location ref of the imported module." }
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: "Most importers to return."
        offset: { type: integer, minimum: 0, default: 0, description: "Importers to skip." }
      required: [ref]
      additionalProperties: false
    handler: !ref Catalog.dependents
    inputs:
      ref: !cel "request.arguments.ref"
      limit: !cel "request.arguments.?limit.orValue(50)"
      offset: !cel "request.arguments.?offset.orValue(0)"
    result:
      content:
        - type: text
          text: !cel >-
            json({'of': {'ref': request.arguments.ref}, 'total': result.total,
                  'dependents': result.dependents.map(d, compact({
                    'ref': d.ref, 'name': d.name, 'summary': d.summary,
                    'application': d.application ? dyn(true) : dyn(null)}))})
    catches:
      # A `limit` outside 1–100, or an argument of the wrong type.
      - when: !cel "error.code == 'ERR_INPUT_INVALID'"
        error:
          code: -32602
          message: !cel "error.message"
      - error:
          code: -32603
          message: !cel "'listing dependents failed: ' + error.code"

  # find_instances — the instance axis: every ready-made instance of a kind,
  # exported by any module, without the kind's own module knowing any of them.
  - name: find_instances
    description: |
      List every ready-made instance of a given kind that any module exports
      (e.g. every language model for an OCR recognizer), across module
      boundaries. `ref` + `kind` name the kind exactly as a hit's
      `module.ref` and `kind` do; a kind hit's `instances` count says
      whether there is anything to list. Import the returned module and
      reference the instance as `!ref <YourAlias>.<name>`.
    argumentsSchema:
      type: object
      properties:
        ref: { type: string, description: "Location ref of the module owning the kind." }
        kind: { type: string, description: "Kind's suffix, e.g. Language." }
      required: [ref, kind]
      additionalProperties: false
    handler: !ref Catalog.instances
    inputs:
      ref: !cel "request.arguments.ref"
      kind: !cel "request.arguments.kind"
    result:
      content:
        - type: text
          text: !cel >-
            json({'of': {'ref': request.arguments.ref, 'kind': request.arguments.kind},
                  'instances': result.instances})

  # list_categories — the declared grouping facet, browsable directly instead
  # of learned only as a side effect of one search_resources call.
  - name: list_categories
    description: |
      List every domain category modules or kinds declare themselves under —
      an open, author-declared vocabulary (`AI`, `Storage`, `Coordination`, …)
      — each with how many modules and kinds sit in it. Pass a slug or label to
      check it exists (as `search_resources`'s `category` argument would
      resolve it) before searching, or omit it to browse the whole facet.
    argumentsSchema:
      type: object
      properties:
        category:
          type: string
          default: ""
          description: "Optional slug or label to check against the vocabulary; omit to list every category."
        entry:
          type: array
          items: { type: string, enum: [kind, instance, application] }
          minItems: 1
          default: [kind, instance]
          description: >-
            Entry types whose categories to list: a category is listed when an
            entry of one of them declares it. Default `[kind, instance]`.
      additionalProperties: false
    handler: !ref Search.categoryVocabulary
    inputs:
      category: !cel "request.arguments.?category.orValue('')"
      entry: !cel "request.arguments.?entry.orValue(['kind', 'instance'])"
    result:
      content:
        - type: text
          text: !cel >-
            json({'categories': result.categories.map(c, {'category': c.category, 'label': c.label,
                                                          'modules': c.modules, 'kinds': c.kinds,
                                                          'selected': c.selected})})
    catches:
      - when: !cel "error.code == 'ERR_UNKNOWN_ENTRY_TYPE'"
        error:
          code: -32602
          message: !cel "error.message"
          data:
            code: !cel "error.code"

  # suggest_module_refs — fuzzy ref typeahead, not semantic search: resolves a
  # half-remembered or misspelled ref to the exact one registered with the hub.
  - name: suggest_module_refs
    description: |
      Fuzzy-match a partial or misspelled module ref (e.g. "postgres") against
      every ref registered with the hub, and return the exact ref plus its
      latest version, description, repository and license. This is lexical
      typeahead over refs, not semantic search over capability — use
      `search_resources` to find a module by what it does.
    argumentsSchema:
      type: object
      properties:
        query: { type: string, description: "Partial or approximate module ref to resolve." }
      required: [query]
      additionalProperties: false
    handler: !ref Catalog.refSuggestions
    inputs:
      q: !cel "request.arguments.query"
    result:
      content:
        - type: text
          text: !cel "json({'query': request.arguments.query, 'refs': result.refs})"
---
kind: Mcp.HttpEndpoint
metadata:
  name: mcpHttp
serverInfo:
  name: telo-hub
  version: !cel "module.version"
instructions: !literal |
  This MCP server is the **Telo hub** — federated discovery over Telo modules
  hosted on any registry or OCI host. Telo is a declarative runtime: YAML
  manifests describe desired state; the kernel resolves resources and runs a
  controller per kind. CEL expressions are written as `!cel "..."` tags.

  ## Guides — read before writing
  Each guide tool takes no arguments and returns one authoring guide: how to
  design and compose, never field schemas. Call the one that covers the work
  before writing its first file:
  - `guide_build_ui` — any screen: pages, tables, forms, actions, filters.
  - `guide_write_integration_tests` — a test that starts a real service (a
    database, a queue) as a container.
  - `guide_design_library` — any `Telo.Library`: what to export, how to make a
    kind, the importer contract.

  Fetch these for full context:
  - https://telo.run/llms.txt — guide & kind reference.
  - https://telo.run/examples.md — working example manifests.
  - https://telo.run/cel.md — CEL function reference.

  ## Composing an application
  1. `search_resources` with every capability you need as `queries`: resource
     KINDS to declare and ready-made INSTANCES to reference, grouped under the
     module that owns them. Search UNFILTERED first — `category` is an open,
     author-declared vocabulary and a guessed slug is rejected outright.
     `find_implementations` once you have an abstract kind and need a concrete
     backend; `find_instances` when a kind you need has ready-made instances.
  2. `get_kinds` for every kind you will declare, in one call: each module's
     `imports:` line with its version and integrity pin, and each kind's
     `Telo.Definition` — the EXACT field shapes you must produce. Never guess
     fields from a kind name.
  3. Write one `Telo.Application`. Declare dependencies in the `imports` map
     with the lines `get_kinds` returned (PascalCase alias → `ref@version#pin`).
     Write a kind hit as `<YourAlias>.<name>` and reference an instance hit as
     `!ref <YourAlias>.<name>` (call a function one as `<YourAlias>.<name>(…)`)
     — the prefix is the alias you chose, never a fixed name. `targets` lists
     the runnables/services to start.

  An application hit (`entry: application`) is run by pinned ref or with
  `App.Instance`, never imported. A module marked `builtin: true` is the
  built-in vocabulary: its kinds are `Telo.<name>` and need no import, and
  `get_kinds` reads them at the telo version you pass as `telo`. The other tools — `list_libraries`,
  `get_module`, `get_module_manifest`, `list_module_versions`,
  `find_dependents`, `list_categories`, `suggest_module_refs` — each say when
  to use them.

  ## Must-know
  - No `spec:` wrapper — resource fields sit at the doc top level.
  - `variables:` / `secrets:` entries each need an `env:` var name and a
    JSON-Schema `type:`.
  - Tag dynamic leaves with `!cel`, not whole inline collections.
  - Install/run resolve against the module's own host — the hub only stores
    discovery metadata and cached manifests, never artifact payloads.
# The authoring guides, one argument-less tool each. A guide is plain text kept
# at most 32768 UTF-8 bytes, so a client bounding a tool result at that size
# receives it whole.
tools:
  - !ref HubTools
  - kind: Mcp.Tools
    entries:
      - name: guide_build_ui
        description: >-
          How to build a user interface for a Telo application with the ui and
          ui-react modules: pages, tables, forms, actions, filters, surfaces and
          themes, wired to the routes they call. Read before writing any screen.
        argumentsSchema: { type: object, properties: {}, additionalProperties: false }
        handler: { kind: Run.Value, value: {} }
        inputs: {}
        result:
          content:
            - { type: text, text: !include-text guides/build-ui.md }
      - name: guide_write_integration_tests
        description: >-
          How to write Telo tests that start a real service — a PostgreSQL
          database, a queue, a server — as a disposable container, connect to
          it and clean up, so the test runs alone, in a suite and in a runner
          session. Read before writing a test that needs one.
        argumentsSchema: { type: object, properties: {}, additionalProperties: false }
        handler: { kind: Run.Value, value: {} }
        inputs: {}
        result:
          content:
            - { type: text, text: !include-text guides/write-integration-tests.md }
      - name: guide_design_library
        description: >-
          How to design a Telo library: exporting kinds or ready-made instances,
          templated kinds vs. extending one, abstract contracts, resources
          borrowed from the importer, variables, lifecycle, naming, descriptions
          and tests. Read before writing a Telo.Library.
        argumentsSchema: { type: object, properties: {}, additionalProperties: false }
        handler: { kind: Run.Value, value: {} }
        inputs: {}
        result:
          content:
            - { type: text, text: !include-text guides/design-library.md }
