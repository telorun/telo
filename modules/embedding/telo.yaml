kind: Telo.Library
metadata:
  name: Embedding
  version: 0.11.3
  repository: https://github.com/telorun/telo
  license: LicenseRef-SustainableUse
  categories: [AI]
  description: |
    Turns text into vectors for semantic search over any embedding provider. Search
    queries and stored passages are embedded through separate operations, because
    retrieval models wrap each intent differently and indexing with one wrapper while
    searching with another quietly ruins recall. Single texts or batches, in and out
    in order.
exports:
  kinds:
    - Model
    - Query
    - Passage
  # The entry point a dependent module's controller bundle resolves
  # `@telorun/embedding` to, so this module's code is one module scope across every
  # consumer instead of a copy inlined into each of their bundles.
  code:
    - specifier: "@telorun/embedding"
      format: js
      path: ./nodejs/embedding.mjs
      source: ./nodejs/src/index.ts
---
# Embedding.Model — the abstract model every embedding backend implements. A
# Telo.Provider: a configured model, NOT an operation you invoke. Consumers
# (Embedding.Query / Embedding.Passage) reference it via
# `x-telo-ref: Self.Model`; a concrete implementation
# (OpenAI.EmbeddingModel, …) satisfies the ref.
#
# The prompt templates live here, on the model, because they are a property of
# the checkpoint — embeddinggemma, E5 and BGE each mandate their own fixed
# wrapper per retrieval intent. Declaring them once means the query and passage
# sides can never drift apart: indexing with one wrapper and searching with
# another silently destroys recall, and that failure is invisible at every layer
# above. Backends inherit these fields via `extends` (merge(parent, own)).
kind: Telo.Abstract
metadata:
  name: Model
  description: >-
    A configured text-embedding model: credentials, checkpoint and the prompt
    templates that wrap a text depending on whether it is being searched for or
    indexed. Held by the embedding operations rather than invoked directly.
capability: Telo.Provider
schema:
  type: object
  properties:
    queryPrompt:
      title: Query Prompt
      description: >-
        Template wrapping each text embedded with the `query` intent. Must
        contain the `{text}` placeholder, replaced with the input. Omit for
        symmetric models that take raw text.
      type: string
      x-telo-eval: compile
      examples:
        - "task: search result | query: {text}"
    passagePrompt:
      title: Passage Prompt
      description: >-
        Template wrapping each text embedded with the `passage` intent. Must
        contain the `{text}` placeholder, replaced with the input. Omit for
        symmetric models that take raw text.
      type: string
      x-telo-eval: compile
      examples:
        - "title: none | text: {text}"
---
# Embedding.Query — embeds search queries. The controller passes the retrieval
# intent `query` to the backend (mapped to the vendor's search_query /
# RETRIEVAL_QUERY parameter); symmetric backends ignore it. Identical in shape
# to Embedding.Passage — only the baked-in intent differs.
kind: Telo.Definition
metadata:
  name: Query
  description: >-
    Embeds one search query, or a batch of them, into vectors for retrieval, using the
    model's query-side wrapping. Returns one vector per input in order, with the
    vector dimension and token usage.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/embedding.mjs&local_path=./nodejs/src/index.ts#QueryController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [input]
    additionalProperties: false
    properties:
      input:
        description: A single query, or a batch of queries, to embed.
        oneOf:
          - type: string
          - type: array
            minItems: 1
            items: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [embeddings, dimensions, usage]
    additionalProperties: false
    properties:
      embeddings:
        description: One vector per input, in input order.
        type: array
        items: { type: array, items: { type: number } }
      dimensions:
        type: integer
        minimum: 1
      usage:
        type: object
        required: [promptTokens, totalTokens]
        additionalProperties: false
        properties:
          promptTokens: { type: integer, minimum: 0 }
          totalTokens: { type: integer, minimum: 0 }
schema:
  type: object
  required: [model]
  additionalProperties: false
  properties:
    model:
      title: Model
      description: Reference to any Embedding.Model implementation.
      x-telo-ref:
        kind: Self.Model
        # embed(...) is a plain controller method, not a bound entry point
        # (invoke/provide/run) — the same shape as connection.query(). The
        # kernel's dispatch, tracing and zone machinery never see it.
        use: dependency
    options:
      title: Options
      description: Provider-specific per-call options.
      type: object
      additionalProperties: true
  examples:
    - model: !ref textEmbedding
---
# Embedding.Passage — embeds stored passages (the chunks you index).
# Structurally identical to Embedding.Query; the controller passes the intent
# `passage` (mapped to the vendor's search_document / RETRIEVAL_DOCUMENT).
kind: Telo.Definition
metadata:
  name: Passage
  description: >-
    Embeds one passage, or a batch of them, into vectors for indexing, using the
    model's document-side wrapping. Returns one vector per input in order, with the
    vector dimension and token usage.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/embedding.mjs&local_path=./nodejs/src/index.ts#PassageController
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [input]
    additionalProperties: false
    properties:
      input:
        description: A single passage, or a batch of passages, to embed.
        oneOf:
          - type: string
          - type: array
            minItems: 1
            items: { type: string }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [embeddings, dimensions, usage]
    additionalProperties: false
    properties:
      embeddings:
        description: One vector per input, in input order.
        type: array
        items: { type: array, items: { type: number } }
      dimensions:
        type: integer
        minimum: 1
      usage:
        type: object
        required: [promptTokens, totalTokens]
        additionalProperties: false
        properties:
          promptTokens: { type: integer, minimum: 0 }
          totalTokens: { type: integer, minimum: 0 }
schema:
  type: object
  required: [model]
  additionalProperties: false
  properties:
    model:
      title: Model
      description: Reference to any Embedding.Model implementation.
      x-telo-ref:
        kind: Self.Model
        # embed(...) is a plain controller method, not a bound entry point
        # (invoke/provide/run) — the same shape as connection.query(). The
        # kernel's dispatch, tracing and zone machinery never see it.
        use: dependency
    options:
      title: Options
      description: Provider-specific per-call options.
      type: object
      additionalProperties: true
  examples:
    - model: !ref textEmbedding
