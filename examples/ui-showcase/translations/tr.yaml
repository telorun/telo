  # Actions.
  - { text: A bare button, translation: Yalın bir düğme }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "Özelliği olmayan bir girdi modeli yalnızca düğmeyi çizer. Bu düğme TEL-42'nin engellenen tüm görevlerinin engelini kaldırır; görev sayıları ve aşağıdaki TEL-42 tablosu yeniden okunur." }
  - { text: Unblock TEL-42, translation: "TEL-42'nin engelini kaldır" }
  - { text: An answer drawn from the result, translation: Sonuçtan çizilen bir yanıt }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "Rota, bir projenin açık görevlerinin tahminlerini toplar. Alanları girdi modelinden gelir ve iki bölümdedir: proje projeler koleksiyonundan, tempo ise bir kaydırıcıyla seçilir; girilenler adreste saklanır. Yanıt düğmenin altında çizilir: sonuç ve gönderilen kayıt üzerine cümleler, işin biteceği tarih ve kategoriye göre saatlerin listesi." }
  - { text: What to count, translation: Ne sayılacak }
  - { text: How fast, translation: Ne hızla }
  - { text: Estimate, context: verb, translation: Tahmin et }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} projesinde açık iş yok."
        other: "{$project} projesinin {$tasks} açık görevinde {$hours} saat"
  - { text: "About {$weeks} weeks at {$pace} hours a week, done by", translation: "Haftada {$pace} saatle yaklaşık {$weeks} hafta; bitiş tarihi" }
  - { text: By label, translation: Kategoriye göre }
  - { text: When it fails, translation: Başarısız olduğunda }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "Eylemin kendi hata ağacı; hata ve gönderilen kayıt üzerinden çizilir. 4 numaralı görevi james@northwind.example adresine atayın, işlem başarılı olur. E-postayı boş bırakın ya da ekipte olmayan birini yazın, ret alanın üzerine düşer; 999 numaralı görev 404, ekipten ayrılmış olan tomas@northwind.example ise 409 yanıtı verir." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "Bu eylem tahmin rotasının yanıtını, rotanın vermediği bir gün sayısı olarak okur: yanıtı eylemin çıktı modeli reddeder ve hata ağacı bunu söyler." }
  - { text: Estimate in days, translation: Gün olarak tahmin et }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: yanıt, bu düğmenin okuduğu yanıt değil." }
  - { text: Where a success goes, translation: Başarının yönlendirdiği yer }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "İlki, bir projenin görevlerini listeleyen sayfayla yanıt verir ve uygulama oraya geçer. İkincisi, ekibin ana sayfasıyla, yani sayfanın yerini alan bir https adresiyle yanıt verir." }
  - { text: Open its tasks, translation: Görevlerini aç }
  - { text: Visit the homepage, translation: Ana sayfayı ziyaret edin }
  - { text: Reading again after a success, translation: Başarıdan sonra yeniden okuma }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "Bir görevi taşımak, hem aşağıdaki sayıları — bir okuyucu — hem de daha aşağıdaki TEL-42 tablosunu yeniden okutur. Yanıt görevi ve yeni durumunu belirtir." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: yapılacak {$todo}, devam eden {$doing}, incelemede {$review}, tamamlanan {$done}, engellenen {$blocked}." }
  - { text: Move, translation: Taşı }
  - { text: "Task {$id}, {$title}, is now", translation: "{$id} numaralı görevin ({$title}) yeni durumu" }
  - { text: One press after another, translation: Art arda basışlar }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "Yorumlar, düğmeye ne kadar hızlı basılırsa basılsın, basılış sırasıyla birbiri ardına gönderilir. Düğme üç karakter bekler ve nedenini söyler; başka bir görev seçmek son yanıtı temizler. En alttaki yorum listesi her yorumdan sonra yeniden okunur." }
  - { text: Add the comment, translation: Yorumu ekle }
  - { text: Write three characters or more., translation: En az üç karakter yazın. }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        one: "{$id} numaralı yorum, {$title} görevinin ilk yorumu."
        other: "{$id} numaralı yorum {$title} görevine eklendi; görevin artık {$count} yorumu var."
  - { text: Row actions on a table, translation: Tabloda satır eylemleri }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "TEL-42'nin her görevi üç düğme sunar; her biri basıldığında yerini yanıtına bırakır. Başlat hemen çalışır, yalnızca hâlâ yapılacak olan bir görevde. Kapat önce sorar ve tamamlanmış bir görevde sunulmaz. Ata, satırın vermediği e-posta için bir iletişim kutusu açar ve sunucunun reddini alanında gösterir." }
  - { text: Number, translation: Numara }
  - { text: Start, context: verb, translation: Başlat }
  - { text: Closed, translation: Kapatıldı }
  - { text: Close this task?, translation: Bu görev kapatılsın mı? }
  - { text: Already started., translation: Zaten başlatıldı. }
  - { text: Already finished., translation: Zaten tamamlandı. }
  - { text: Assign, translation: Ata }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} görevi şu kişiye atandı: {$assignee}." }
  - { text: "Task {$id} is unchanged.", translation: "{$id} numaralı görev değişmedi." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: Listede satır eylemleri }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "Son yorumlar; bir okuyucunun çizdiği, sabitlenmişlerin önce geldiği bir liste. Sabitle, henüz sabitlenmemiş bir yorumda hemen çalışır, Sil önce sorar, Düzenle ise yeni metni bir iletişim kutusunda ister; metni boş bırakmak alanında reddedilir. Liste her eylemden sonra yeniden okunur." }
  - { text: Latest comments, translation: Son yorumlar }
  - { text: Pin, translation: Sabitle }
  - { text: Already pinned., translation: Zaten sabitlendi. }
  - { text: Delete this comment?, translation: Bu yorum silinsin mi? }
  - { text: Rewrite this comment?, translation: Bu yorum yeniden yazılsın mı? }
  - { text: More places a success goes, translation: Başarının yönlendirdiği diğer yerler }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "İlki bir görev ekler ve manifestte yazılı bir adres olan tablolar sayfasına geçer. İkincisi, sunucunun bağlama noktası altında sunduğu bir dosya olan el kitabının adresiyle yanıt verir; bu sıradan bir yüklemedir. Üçüncüsü, ekibin yansısıyla, yani tarayıcının başka bir sunucu olarak okuduğu bir adresle yanıt verir: hiçbir yere gitmez ve yanıt bunu söyler." }
  - { text: Add it and open the tables, translation: Ekle ve tabloları aç }
  - { text: Open the handbook, translation: El kitabını aç }
  - { text: Open the mirror, translation: Yansıyı aç }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "Yanıt şuydu: {$mirror} — gidilebilecek bir adres değil, bu yüzden sayfa yerinde kalıyor." }
  - { text: "Refused, and unanswered", translation: "Reddedilen ve yanıtsız kalan" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "Bir projeyi yalnızca yönetici duraklatabilir. Oturum yoksa koruma 401 yanıtı verir. Veri sayfasında yönetici olmayan james@northwind.example olarak oturum açıldığında rota gövdesiz bir 403 yanıtı verir; ada@northwind.example olarak oturum açıldığında projeyi duraklatır, yürümeyen bir projeyi ise sayfanın dilinde reddeder. Eylemin varsayılan hata ağacı her reddi çizer." }
  - { text: Pause the project, translation: Projeyi duraklat }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "{$code} projesi yürümüyor, bu yüzden duraklatılamaz." }
  - { text: "{$name} is paused.", translation: "{$name} projesi duraklatıldı." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "Bu rota her isteği kendisine geri gönderir, bu yüzden tarayıcı vazgeçer ve hiç yanıt gelmez. Hata ağacı bunu söyler: hatanın durum kodu yoktur." }
  - { text: Call a route that never answers, translation: Hiç yanıt vermeyen bir rotayı çağır }
  - { text: "The route answered, with the status", translation: "Rota yanıt verdi, durum kodu" }
  - { text: "No answer arrived, so there is no status.", translation: "Hiç yanıt gelmedi, bu yüzden durum kodu yok." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: Adresi okuyan satır eylemleri }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "Tablo, adresin belirttiği projenin görevlerini listeler; Taşı ise bir görevi, basıldığı anda tablonun sorgusundan okunan ve adresin belirttiği duruma gönderir. Satır ve adres taşımanın her alanını bağlar, bu yüzden iletişim kutusu hiçbir şey sormaz ve sade bir onaydır. Bir proje ve bir durum seçin:" }
  - { text: TEL-42 into review, translation: TEL-42 incelemeye }
  - { text: APP-5 to finished, translation: APP-5 tamamlananlara }
  - { text: OPS-7 back to in progress, translation: OPS-7 yeniden devam edenlere }
  - { text: Neither, translation: Hiçbiri }
  - { text: Moved to, translation: "Taşındığı durum:" }
  - { text: Move this task to the status the address names?, translation: Bu görev adresin belirttiği duruma taşınsın mı? }
  - { text: Choose a status above first., translation: Önce yukarıdan bir durum seçin. }

  # Components.
  - { text: A component on the page, translation: Sayfada bir bileşen }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "TSX ile yazılmış, bu örneğin bir kütüphanesiyle gelen ve sabit özelliklerle yerleştirilmiş bir bileşen. Barındıran sayfanın ona verdiği her şeyi kullanır: sayfanın nerede olduğunu gösterir, hangi panelin açık olduğunu adreste tutar, navigate ile ve href ile verilen bir bağlantıyla başka bir sayfaya geçer ve bir https adresine gitmesine izin verilmez. fetch ile TEL-42'nin durumunu okur ve bir görev ekler, notifyChanged ile görevlerin değiştiğini duyurur — böylece aşağıdaki tablo yeniden okunur — ve onChanged ile duyduğu her değişikliği, tablonun kendi düzenlemeleri ve silmeleri de dahil, sayar. Eklediği görevi sayfanın köşesinde kendine ait bir katmanda duyurur." }
  - { text: A component in a cell, translation: Hücrede bir bileşen }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "Öncelik sütununu, her satırın önceliğini ve görevin engellenip engellenmediğini alan bir bileşen çizer. Tablo TEL-42'nin görevlerini bileşenin yazdığı koleksiyonun aynısından listeler, bu yüzden yukarıda bir görev eklendiğinde yeniden okunur; tablonun düzenlemelerini ve silmelerini bileşen duyar." }
  - { text: Its stylesheet, translation: Stil sayfası }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "Bileşenlerin kaynakları kendi stil sayfalarını içe aktarır; uygulama bunu telo.component katmanına yerleştirir: temadan ve markadan sonra, uygulamanın kendi stil sayfasından önce. İçindeki her değer bir tasarım belirtecini okur, böylece masa ve gösterge her bağlama noktasının görünüşünü alır." }

  # CRUD.
  - { text: A generated admin screen, translation: Otomatik oluşturulan bir yönetim ekranı }
  - { text: "One declaration over the tasks collection the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the collection, so the screen offers exactly what the API accepts.", translation: "API'nin sunulduğu görev modeli üzerine tek bir bildirim: bir filtre çubuğu, sıralanabilir ve sayfalı bir tablo, görev eklemek için bir form, değiştirmek için bir başka form ve her satırda onaylı silme. Sütunlar, alanlar ve filtrelerin tümü modelden türetilir, bu yüzden ekran tam olarak API'nin kabul ettiklerini sunar." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "Çubuk, tablonun yanında bitiş kenarında durur ve yalnızca seçtiğiniz filtreleri, her birini denetimini açan bir çip olarak gösterir. Seçimini bu tarayıcıda aside anahtarı altında saklar — bu, Filtreler sayfasında tablonun yanındaki çubuğun anahtarıdır; bu yüzden iki sayfadan birinde seçilen filtre ikisinde de seçili olur." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "Yeni görev, bitiş kenarından açılan bir çekmecede açılır ve bir sonraki için boşaltılıp açık kalır. Bir görev, listenin yanındaki, adresin parçası olan bir panelde değiştirilir; kaydedilmemiş girdiyle panelden çıkmak önce sorar." }

  # Related records.
  - { text: "Related records", translation: "İlişkili kayıtlar" }
  - { text: "Posts and their authors", translation: "Yazılar ve yazarları" }
  - { text: "Each post names its author by key. The author column shows the author's name instead, read in one request for every author on the page, and the bar's author filter offers every author by name. The create and edit forms pick the author from a list of authors, searched by name.", translation: "Her yazı yazarını anahtarıyla belirtir. Yazar sütunu bunun yerine yazarın adını gösterir; sayfadaki tüm yazarlar için tek bir istekle okunur ve çubuğun yazar filtresi her yazarı adıyla sunar. Oluşturma ve düzenleme formları yazarı, ada göre aranan bir yazar listesinden seçer." }
  - { text: "Only the authors with posts", translation: "Yalnızca yazısı olan yazarlar" }
  - { text: "These filters offer only the authors and the statuses present among the posts the other filters leave, each with how many posts it has. The posts are drawn as cards, and as a list below the breakpoint, loading more as you reach the end.", translation: "Bu filtreler yalnızca diğer filtrelerin bıraktığı yazılarda bulunan yazarları ve durumları, her birinin kaç yazısı olduğuyla birlikte sunar. Yazılar kart olarak, kırılma noktasının altında ise sona ulaştıkça daha fazlasını yükleyen bir liste olarak çizilir." }
  - { text: "On a board by status", translation: "Duruma göre bir panoda" }
  - { text: "One column per status, each read and counted on its own. Drag a card to another column, or move it from its menu, to change its status; every list of posts on the page reads again.", translation: "Her durum için bir sütun, her biri ayrı okunur ve sayılır. Durumunu değiştirmek için bir kartı başka bir sütuna sürükleyin ya da menüsünden taşıyın; sayfadaki her yazı listesi yeniden okunur." }
  - { text: "On a calendar", translation: "Bir takvimde" }
  - { text: "The posts on the day each is published, a month at a time; the month shown reads every post dated in it. A post with no date is not on the calendar.", translation: "Yazılar, her birinin yayımlandığı günde, bir seferde bir ay; gösterilen ay, içinde tarihlenen her yazıyı okur. Tarihi olmayan bir yazı takvimde yer almaz." }
  - { text: "The authors", translation: "Yazarlar" }
  - { text: "The authors' own screen, generated from their collection. It reads the same address the posts' author filter and picker read, so an author added here is offered there at once.", translation: "Yazarların kendi ekranı, koleksiyonlarından üretilir. Yazıların yazar filtresi ve seçicisinin okuduğu adresi okur, böylece burada eklenen bir yazar orada hemen sunulur." }
  - { text: "Reporting lines as a tree", translation: "Bir ağaç olarak raporlama hatları" }
  - { text: "Each person names who they report to, a relation of the people to themselves. The tree reads the people who report to nobody first, and a person's reports when they are opened. The form picks the manager from the same people.", translation: "Her kişi kime bağlı olduğunu belirtir: kişilerin kendileriyle ilişkisi. Ağaç önce kimseye bağlı olmayan kişileri, bir kişi açıldığında da ona bağlı olanları okur. Form, yöneticiyi aynı kişiler arasından seçer." }
  # The labels of the related-records page's models.
  - { text: "Author", translation: "Yazar" }
  - { text: "Draft", translation: "Taslak" }
  - { text: "Published", translation: "Yayımlandı" }
  - { text: "Published on", translation: "Yayın tarihi" }
  - { text: "Reports to", translation: "Bağlı olduğu kişi" }
  - { text: "Post", translation: "Yazı" }

  # Themes.
  - { text: Four mounts of one design, translation: Tek tasarımın dört bağlama noktası }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "Aynı sayfalar dört kez sunulur; her uygulama kendi temasını, markasını ve gezinmesini belirtir. Sayfalar, dördünden de referansla yerleştirilen tek bir görünüm kümesidir, bu yüzden yalnızca görünüş ve gezinme farklıdır." }
  - { text: At the root, translation: Kökte }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "Yerleşik görünüş, üzerinde bu örneğin kendi stil sayfası ve her istek için seçilen bir marka: bir çerez istediği sürece Acme belirteç kümesi, aksi halde temanın kendi değerleri." }
  - { text: Under /radix, translation: /radix altında }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Radix teması: stil sayfası ve on üç denetimi — seçim listeleri, iletişim kutuları, çekmeceler, açılır balonlar, menüler ve araç ipuçları — ile marka temaya bırakılmış olarak." }
  - { text: Under /brand, translation: /brand altında }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "Bu örneğe özgü bir tema: burada yazılmış bir stil sayfası altında Radix denetimleri, kendi belirteç değerleriyle. Uygulamanın markası, temanın adlandırdığı Inter yazı tipini getiren tek bir belirteç kümesidir." }
  - { text: Under /sidebar, translation: /sidebar altında }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "Gezinmenin sayfanın yanındaki bir kenar çubuğunda yer aldığı yerleşik görünüş; kenar çubuğu dar bir şeride daralır ve açık gruplarını hatırlar. Telefonda alt kenar boyunca bir sekme çubuğuna dönüşür." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "Bir bağlantı, çizildiği bağlama noktası altında çözümlenir; bu yüzden bağlama noktaları arasındaki bağlantılar ve marka geçişi kök uygulamanın Temalar sayfasındadır." }
  - { text: Every design token, translation: Her tasarım belirteci }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "Kapalı kümedeki her belirteç, bu sayfanın teması ve markasının verdiği haliyle; oluşturucunun onu aktardığı özel CSS özelliğinden okunur ve onunla çizilmiş bir örnekle gösterilir. Başka bir bağlama noktası açın ya da kökte markayı değiştirin, değerler değişir." }
  - { text: Typefaces, translation: Yazı tipleri }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "Gövde ve başlık yazı tiplerinin dört biçeminin her biri ve her biçem için bu uygulamanın onu sunup sunmadığı. /brand altında bunlar Inter yazı tipinin normal, kalın, italik ve kalın italik biçemleridir; örnekle birlikte gelir ve sayfayla sunulur. Diğer iki bağlama noktası hiçbirini sunmaz ve izleyicinin kendi yazı tiplerini kullanır." }
  - { text: Switch the mount or the brand, translation: Bağlama noktasını ya da markayı değiştir }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "Bu bağlantılar bu uygulamanın kendisine aittir: bir bağlantı çizildiği bağlama noktası altında çözümlenir, bu yüzden diğer ikisine yalnızca kökteki uygulama ulaşır. Her biri başka bir uygulamanın sıradan bir yüklenmesidir." }
  - { text: Open the Radix mount, translation: Radix bağlama noktasını aç }
  - { text: Open the brand mount, translation: Marka bağlama noktasını aç }
