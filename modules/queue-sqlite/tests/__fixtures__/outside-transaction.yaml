# The transactional enqueue as a boot target: nothing encloses `targets:`, so no
# transaction is open on the queue's connection.
kind: Telo.Application
metadata:
  name: EnqueueOutsideTransaction
  version: 1.0.0
imports:
  QueueSql: ../../../queue-sql
  Queue: ../..
  SQLite: ../../../sqlite
targets:
  - !ref appSchema
  - invoke: !ref enqueue
    inputs: { message: { n: 1 } }
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: Queue.Table
metadata: { name: messages }
table: queue_messages
---
kind: SQLite.Schema
metadata: { name: appSchema }
connection: !ref db
tables: [!ref messages]
---
kind: Queue.Queue
metadata: { name: jobs }
connection: !ref db
schema: !ref appSchema
table: !ref messages
name: jobs
retention: 1h
messageType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      n: { type: integer }
---
kind: QueueSql.Enqueue
metadata: { name: enqueue }
queue: !ref jobs
