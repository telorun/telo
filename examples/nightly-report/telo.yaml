kind: Telo.Application
metadata:
  name: NightlyReport
  version: 1.0.0
  categories: [ Scheduling, Data, Storage ]
  description: |
    The job every service ends up with: read yesterday's rows, roll them up, write
    a file, say what happened. Here it is a schedule, a query, a group-by and a
    file write — four resources, no script.

    `Collection.GroupBy` does the aggregation over the result set in CEL, so the
    shape of the report is visible in the manifest instead of buried in SQL or in
    a JavaScript reduce. The same rollup would work over rows from an HTTP API or
    a CSV — it is not a database feature.

    Runs once at boot so you see output immediately, then on `REPORT_CRON`
    (default 03:00 daily). To watch it tick:
        REPORT_CRON='*/10 * * * * *' telo ./examples/nightly-report
    The report lands in ./reports/orders.csv.
# 0.128.0: `Telo.Sequence`, which an older analyzer reads as UNDEFINED_KIND.
requires: { telo: ">=0.128.0" }
imports:
  Http: oci://ghcr.io/telorun/http-server@0.42.0#sha256-wF3AHGL8hGFdy7SfxXJkaXtRzLeqKtgqTVmN9anXKTk
  Sql: oci://ghcr.io/telorun/sql@0.30.0#sha256-NucxyVlxJy6byu-J21_UhzhKxaqauLe9BSC1ZSgP8_c
  SQLite: oci://ghcr.io/telorun/sqlite@0.13.0#sha256-2Q2i3j_3qR2Mcd41LBUO6YuTg_tehWQa4w6Oi5P5-w4
  Collection: oci://ghcr.io/telorun/collection@0.9.1#sha256-8X1VGM8gx2p61sf1G53hguQL4fzGckKmmd14hYxo-xg
  Schedule: oci://ghcr.io/telorun/scheduler@0.11.1#sha256-vMI7JiNJp8lhcYgRIa1MRc4ilB5GC_UXTLaf_6kbpTw
  Fs: oci://ghcr.io/telorun/fs@0.15.1#sha256-DB68pWLeWJ3An4QhSocN4KhUEB-14j0jzLheGTATKkM
  Console: oci://ghcr.io/telorun/console@0.19.1#sha256-OxO1ccClyEMMTXmfpkw8kWwjaEEPOZzPgmUXO1ZqWnE
targets:
  - !ref migrate
  - !ref buildReport
  - !ref nightly
  - !ref server
ports: { http: { env: PORT, protocol: tcp, default: 8044 } }
variables: { reportCron: { env: REPORT_CRON, type: string, default: "0 3 * * *" } }
---
kind: SQLite.Connection
metadata: { name: db }
file: ":memory:"
---
kind: SQLite.Table
metadata: { name: orders }
table: orders
columns:
  id: { type: integer, primaryKey: true, identity: always }
  region: { type: text, nullable: false }
  status: { type: text, nullable: false }
  total_cents: { type: integer, nullable: false }
---
kind: SQLite.Schema
metadata: { name: migrate }
connection: !ref db
tables:
  - !ref orders
# Seed rows are data, not shape, so they stay imperative — they run after the
# reconciliation pass, once the table exists.
migrations:
  0001_seed_orders:
    statements: ["INSERT INTO orders (region, status, total_cents) VALUES ('emea', 'paid', 12000)", "INSERT INTO orders (region, status, total_cents) VALUES ('emea', 'paid', 4500)", "INSERT INTO orders (region, status, total_cents) VALUES ('emea', 'refunded', 4500)", "INSERT INTO orders (region, status, total_cents) VALUES ('amer', 'paid', 99000)", "INSERT INTO orders (region, status, total_cents) VALUES ('amer', 'pending', 2500)", "INSERT INTO orders (region, status, total_cents) VALUES ('apac', 'paid', 30500)"]
---
kind: Telo.Sequence
metadata: { name: buildReport }
steps:
  - name: orders
    invoke:
      kind: Sql.Query
      connection: !ref db
    inputs: { sql: "SELECT region, status, total_cents FROM orders", bindings: [] }

  # The rollup. `key:` names the group, `aggregate:` reduces each group's rows —
  # both plain CEL over the records, so the report's shape is readable here
  # rather than encoded in a GROUP BY.
  - name: rollup
    invoke:
      kind: Collection.GroupBy
      collection: !cel "inputs.orders"
      key:
        region: !cel "item.region"
      aggregate:
        orders: !cel "size(group)"
        paidCents: !cel "sum(group.filter(o, o.status == 'paid').map(o, o.total_cents))"
        refundedCents: !cel "sum(group.filter(o, o.status == 'refunded').map(o, o.total_cents))"
      orderBy:
        - by: !cel "row.paidCents"
          descending: true
    inputs:
      orders: !cel "steps.orders.result.rows"

  - name: write
    invoke: { kind: Fs.FileWrite }
    inputs:
      path: ./reports/orders.csv
      createParents: true
      content: !cel >-
        'region,orders,paid_cents,refunded_cents\n' +
        steps.rollup.result.rows
          .map(r, r.region + ',' + string(r.orders) + ',' + string(r.paidCents) + ',' + string(r.refundedCents))
          .join('\n') + '\n'
  - name: report
    invoke: !ref Console.writeLine
    inputs:
      output: !cel >-
        '{green ✔} wrote ./reports/orders.csv — ' +
        string(size(steps.rollup.result.rows)) + ' regions, ' +
        string(steps.write.result.bytesWritten) + ' bytes'
outputs:
  rows: !cel "steps.rollup.result.rows"
  bytesWritten: !cel "steps.write.result.bytesWritten"
---
# The schedule holds the application open on its own, so the server is here for
# what it adds rather than to keep the process alive: the report on demand
# instead of only on the hour.
kind: Http.Server
metadata: { name: server }
listen:
  port: !cel "ports.http"
openapi: { info: { title: Nightly report, version: 1.0.0 } }
mounts:
  - path: /
    mount: !ref reportRoutes
---
kind: Http.Api
metadata: { name: reportRoutes }
routes:
  - request: { path: /report, method: GET }
    handler: !ref buildReport
    inputs: {}
    returns:
      - status: 200
        content:
          application/json:
            body: !cel "result.rows"
    catches:
      - when: !cel "error.code == 'ERR_FILE_TOO_LARGE'"
        status: 500
        content:
          application/json:
            body:
              error: !cel "error.code"
              message: !cel "error.message"
---
kind: Schedule.Cron
metadata: { name: nightly }
cron: !cel "variables.reportCron"
timezone: UTC
invoke: !ref buildReport
