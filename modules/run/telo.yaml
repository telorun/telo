kind: Telo.Definition
metadata:
  name: Projection
  description: Maps each collection element through a step body and CEL outputs into a result array, with configurable concurrency.
capability: Telo.Invocable
controllers:
  - pkg:telo/local/js?path=./nodejs/projection.mjs&local_path=./nodejs/src/projection.ts
throws:
  inherit: true
schema:
  type: object
  $defs:
    bodyStep:
      title: Step
      description: Single executable step or control-flow block. No while block — the kind is itself the loop.
      type: object
      properties:
        name:
          title: Name
          description: Unique step name.
          type: string
      oneOf:
        - title: invoke
          description: Invokes an invocable or runnable resource.
          properties:
            invoke:
              title: Invoke
              description: Resource to invoke for this step.
              x-telo-topology-role: invoke
              type: object
              x-telo-ref:
                kind: Telo.Executable
                use: call
                inputs: /inputs
            inputs:
              title: Inputs
              description: Inputs passed to the invoked resource.
              x-telo-topology-role: inputs
              type: object
              additionalProperties: true
            retry:
              title: Retry
              description: Retry policy for step invocation.
              type: object
              properties:
                attempts:
                  title: Attempts
                  description: Maximum retry attempts.
                  type: integer
                delay:
                  title: Delay
                  description: Delay between retries.
                  type: string
          required:
            - invoke
        - title: if/then/else
          description: Conditional branch; executes then or else based on a boolean expression.
          properties:
            if:
              title: If
              description: CEL boolean expression; true executes then, false executes else.
              x-telo-topology-role: predicate
              type: boolean
            elseif:
              title: Else If
              description: Additional condition-branch pairs evaluated when if is false.
              x-telo-topology-role: branch-list
              type: array
              items:
                type: object
                properties:
                  if:
                    title: If
                    description: CEL boolean expression for this else-if branch.
                    x-telo-topology-role: predicate
                    type: boolean
                  then:
                    title: Then
                    description: Steps executed when this else-if condition is true.
                    x-telo-topology-role: branch
                    type: array
                    items:
                      $ref: "#/$defs/bodyStep"
                required:
                  - if
                  - then
            then:
              title: Then
              description: Steps executed when if evaluates true.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/bodyStep"
            else:
              title: Else
              description: Steps executed when if (and all elseif conditions) evaluate false.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/bodyStep"
          required:
            - if
            - then
        - title: switch/cases/default
          description: Multi-branch dispatch; matches a value expression against case keys.
          properties:
            switch:
              title: Switch
              description: CEL expression; result matched against case keys.
              x-telo-topology-role: discriminator
              type: string
            cases:
              title: Cases
              description: Map of value to step list; executed when switch matches the key.
              x-telo-topology-role: case-map
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: "#/$defs/bodyStep"
            default:
              title: Default
              description: Steps executed when no case matches.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/bodyStep"
          required:
            - switch
            - cases
        - title: try/catch/finally
          description: Error boundary; executes try steps and handles failure via catch and finally.
          properties:
            try:
              title: Try
              description: Steps executed; halts on first failure and jumps to catch.
              x-telo-topology-role: branch
              type: array
              items:
                $ref: "#/$defs/bodyStep"
            catch:
              title: Catch
              description: Steps executed when try fails; receives error context.
              x-telo-topology-role: branch
              x-telo-error-context:
                type: object
                description: The caught failure (always present inside catch).
                properties: &projectionErrorProps
                  code:
                    description: Structured error code; INTERNAL_ERROR for plain errors.
                    type: string
                  message:
                    description: Human-readable error message.
                    type: string
                  step:
                    description: Name of the step that threw.
                    type: string
                  data:
                    description: Structured payload from an InvokeError, else undefined.
                additionalProperties: false
              type: array
              items:
                $ref: "#/$defs/bodyStep"
            finally:
              title: Finally
              description: Steps always executed after try/catch regardless of outcome.
              x-telo-topology-role: branch
              x-telo-error-context:
                type: ["object", "null"]
                description: The caught failure, or null when try (and catch) succeeded.
                properties: *projectionErrorProps
                additionalProperties: false
              type: array
              items:
                $ref: "#/$defs/bodyStep"
          required:
            - try
        - title: throw
          description: Throws an InvokeError unconditionally.
          properties:
            throw:
              title: Throw
              description: InvokeError descriptor; code is required, message/data optional.
              type: object
              properties:
                code:
                  title: Code
                  description: Structured error code; uppercase SNAKE_CASE by convention.
                  type: string
                message:
                  title: Message
                  description: Human-readable error message. Defaults to code when omitted.
                  type: string
                data:
                  title: Data
                  description: Optional structured payload attached to the error.
              required:
                - code
          required:
            - throw

        - title: value
          description: >-
            Computes a value and publishes it as `steps.<name>.result`, with no
            dispatch — no resource, no span, no topology node. For an
            intermediate derived from an earlier step: reshape a response,
            total some rows, build the next call's inputs.
          properties:
            value:
              title: Value
              description: >-
                A CEL expression — or a structure (map / array) with `!cel`
                leaves — evaluated in the step scope: `inputs`, the results of
                the steps before it, and whatever the enclosing kind binds
                (`item` / `index` / `items`, `iteration` / `previous`).
          required:
            - value
      required:
        - name
  properties:
    inputType:
      title: Input Type
      description: >-
        The projection's input contract — a named type reference or an inline type definition. Callers supply values at invoke
        time and the body reads them as `!cel "inputs.<name>"`. The kernel binds
        this contract to the resource: declared defaults are filled and every
        call is validated against it before dispatch.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    outputType:
      title: Output Type
      description: >-
        The result contract — a named type reference or an inline type definition. Declaring it types
        `steps.<name>.result` for callers, has every result slot checked
        statically by `x-telo-value-schema-from`, and has the produced value
        validated at dispatch.
      x-telo-ref:
        kind: Telo.Type
        use: schema
    collection:
      title: Collection
      description: CEL expression resolving to the array projected over.
      type: array
      x-telo-context:
        type: object
        properties:
          inputs: {}
    concurrency:
      title: Concurrency
      description: >-
        CEL integer resolving to the maximum number of elements processed at once;
        1 (default) runs strictly ordered. Sees inputs.
      type: integer
      minimum: 1
      default: 1
      x-telo-context:
        type: object
        properties:
          inputs: {}
    catches:
      title: Catches
      description: >-
        Whole-operation error contract. Maps a throw that escapes the entire
        projection to a fallback result; an unmatched throw propagates (fail-fast).
      x-telo-error-context:
        type: object
        description: The escaped failure (sees error and inputs).
        properties: *projectionErrorProps
        additionalProperties: false
      x-telo-context:
        type: object
        properties:
          inputs: {}
      type: array
      items:
        title: Catch Entry
        type: object
        properties:
          when:
            title: When
            description: CEL condition selecting this entry (sees error and inputs).
            type: boolean
          value:
            title: Value
            description: Fallback result returned when this entry matches.
    steps:
      title: Steps
      description: Body run once per element of collection. Sees item, index, items.
      x-telo-topology-role: steps
      x-telo-step-context:
        invoke: invoke
        outputType: outputType
        value: value
      x-telo-context:
        type: object
        properties:
          inputs: {}
          item: { x-telo-context-element-from: "collection" }
          index: { type: integer }
          items: { type: array }
      type: array
      items:
        $ref: "#/$defs/bodyStep"
    outputs:
      title: Outputs
      description: >-
        A CEL map (key → expression) evaluated per element over `steps.*`, `item`,
        `index`, `items`, and `inputs`. Each element's value is collected into the
        result array (input order preserved). Omit to collect the raw step map.
      type: object
      additionalProperties: true
      x-telo-context:
        type: object
        properties:
          inputs: {}
          item: { x-telo-context-element-from: "collection" }
          index: { type: integer }
          items: { type: array }
      x-telo-value-schema-from: outputType
  required:
    - collection
    - steps
  examples:
    - collection: !cel "inputs.ids"
      concurrency: 8
      steps:
        - name: fetch
          invoke: !ref FetchRecord
          inputs:
            id: !cel "item"
      outputs:
        id: !cel "item"
        name: !cel "steps.fetch.result.name"
