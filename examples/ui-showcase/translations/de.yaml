  # Actions.
  - { text: A bare button, translation: Eine bloße Schaltfläche }
  - { text: "An input model with no properties draws the button alone. This one unblocks every blocked task of TEL-42, and the task counts and the TEL-42 table further down read again.", translation: "Ein Eingabemodell ohne Eigenschaften zeichnet nur die Schaltfläche. Diese entsperrt jede blockierte Aufgabe von TEL-42, und die Aufgabenzähler und die TEL-42-Tabelle weiter unten werden erneut gelesen." }
  - { text: Unblock TEL-42, translation: TEL-42 entsperren }
  - { text: An answer drawn from the result, translation: Eine aus dem Ergebnis gezeichnete Antwort }
  - { text: "The route adds up the estimates of a project's open tasks. Its fields are the input model's, in two sections, the project chosen from the projects collection and the pace on a slider; what is entered is kept in the address. The answer is drawn under the button: sentences over the result and the record sent, the date the work would be done by, and a list of the hours by label.", translation: "Die Route summiert die Schätzungen der offenen Aufgaben eines Projekts. Ihre Felder sind die des Eingabemodells, in zwei Abschnitten, das Projekt aus der Projektsammlung gewählt und das Tempo auf einem Schieberegler; die Eingaben bleiben in der Adresse erhalten. Die Antwort wird unter der Schaltfläche gezeichnet: Sätze über das Ergebnis und den gesendeten Datensatz, das Datum, bis zu dem die Arbeit fertig wäre, und eine Liste der Stunden nach Label." }
  - { text: What to count, translation: Was gezählt wird }
  - { text: How fast, translation: Wie schnell }
  - { text: Estimate, context: verb, translation: Schätzen }
  - text: "{$hours} hours in {$tasks} open tasks of {$project}"
    translation:
      plural: tasks
      cases:
        "=0": "{$project} hat keine offene Arbeit."
        one: "{$hours} Std. in {$tasks} offenen Aufgabe von {$project}"
        other: "{$hours} Std. in {$tasks} offenen Aufgaben von {$project}"
  - text: "About {$weeks} weeks at {$pace} hours a week, done by"
    translation:
      plural: weeks
      cases:
        one: "Etwa {$weeks} Woche bei {$pace} Std. pro Woche, fertig bis"
        other: "Etwa {$weeks} Wochen bei {$pace} Std. pro Woche, fertig bis"
  - { text: By label, translation: Nach Label }
  - { text: When it fails, translation: Wenn es fehlschlägt }
  - { text: "A failure tree of the action's own, drawn over the error and the record sent. Give task 4 to james@northwind.example and it succeeds. Leave the e-mail out, or name nobody on the team, and the refusal lands on the field; task 999 answers 404, and tomas@northwind.example, who has left, 409.", translation: "Ein eigener Fehlerbaum der Aktion, gezeichnet über den Fehler und den gesendeten Datensatz. Weisen Sie Aufgabe 4 james@northwind.example zu, und es gelingt. Lassen Sie die E-Mail-Adresse weg oder nennen Sie niemanden aus dem Team, und die Ablehnung landet am Feld; Aufgabe 999 antwortet mit 404 und tomas@northwind.example, der das Team verlassen hat, mit 409." }
  - { text: "This action reads the estimate route's answer as a number of days, which the route does not give: the answer is refused by the action's output model, and its failure tree says so.", translation: "Diese Aktion liest die Antwort der Schätzungsroute als Anzahl von Tagen, die die Route nicht liefert: Die Antwort wird vom Ausgabemodell der Aktion abgelehnt, und ihr Fehlerbaum sagt das." }
  - { text: Estimate in days, translation: In Tagen schätzen }
  - { text: "{$code}: the answer is not the one this button reads.", translation: "{$code}: Das ist nicht die Antwort, die diese Schaltfläche liest." }
  - { text: Where a success goes, translation: Wohin ein Erfolg führt }
  - { text: "The first answers with the page listing a project's tasks, and the application moves there. The second answers with the team's homepage, an https address that replaces the page.", translation: "Die erste antwortet mit der Seite, die die Aufgaben eines Projekts auflistet, und die Anwendung wechselt dorthin. Die zweite antwortet mit der Homepage des Teams, einer https-Adresse, die die Seite ersetzt." }
  - { text: Open its tasks, translation: Seine Aufgaben öffnen }
  - { text: Visit the homepage, translation: Homepage besuchen }
  - { text: Reading again after a success, translation: Erneutes Lesen nach einem Erfolg }
  - { text: "Moving a task reads again both the counts below, a reader, and the TEL-42 table further down. The answer names the task and its new status.", translation: "Das Verschieben einer Aufgabe liest sowohl die Zähler unten — einen Leser — als auch die TEL-42-Tabelle weiter unten erneut. Die Antwort nennt die Aufgabe und ihren neuen Status." }
  - { text: "{$code}: {$todo} to do, {$doing} in progress, {$review} in review, {$done} finished, {$blocked} blocked.", translation: "{$code}: {$todo} zu erledigen, {$doing} in Arbeit, {$review} in Prüfung, {$done} abgeschlossen, {$blocked} blockiert." }
  - { text: Move, translation: Verschieben }
  - { text: "Task {$id}, {$title}, is now", translation: "Aufgabe {$id}, {$title}, ist jetzt" }
  - { text: One press after another, translation: Ein Klick nach dem anderen }
  - { text: "Comments are sent one after another, in the order the button is pressed, however quickly. The button waits for three characters and says why; choosing another task clears the last answer. The comments listed at the bottom read again after each one.", translation: "Kommentare werden nacheinander gesendet, in der Reihenfolge, in der die Schaltfläche gedrückt wird, egal wie schnell. Die Schaltfläche wartet auf drei Zeichen und sagt, warum; die Wahl einer anderen Aufgabe leert die letzte Antwort. Die unten aufgeführten Kommentare werden nach jedem erneut gelesen." }
  - { text: Add the comment, translation: Kommentar hinzufügen }
  - { text: Write three characters or more., translation: Schreiben Sie mindestens drei Zeichen. }
  - text: "Comment {$id} added to {$title}, which has {$count} comments now."
    translation:
      plural: count
      cases:
        one: "Kommentar {$id} ist der erste zu {$title}."
        other: "Kommentar {$id} zu {$title} hinzugefügt; die Aufgabe hat jetzt {$count} Kommentare."
  - { text: Row actions on a table, translation: Zeilenaktionen in einer Tabelle }
  - { text: "Every task of TEL-42 offers three buttons, each replaced by its answer once pressed. Start runs at once, only on a task still to do. Close asks first, and is not offered on a finished task. Assign opens a dialog for the e-mail, which the row does not give, and shows the server's refusal on its field.", translation: "Jede Aufgabe von TEL-42 bietet drei Schaltflächen, die nach dem Drücken jeweils durch ihre Antwort ersetzt werden. Starten läuft sofort, nur bei einer noch zu erledigenden Aufgabe. Schließen fragt zuerst nach und wird bei einer abgeschlossenen Aufgabe nicht angeboten. Zuweisen öffnet einen Dialog für die E-Mail-Adresse, die die Zeile nicht liefert, und zeigt die Ablehnung des Servers an ihrem Feld." }
  - { text: Number, translation: Nummer }
  - { text: Start, context: verb, translation: Starten }
  - { text: Closed, translation: Geschlossen }
  - { text: Close this task?, translation: Diese Aufgabe schließen? }
  - { text: Already started., translation: Bereits gestartet. }
  - { text: Already finished., translation: Bereits abgeschlossen. }
  - { text: Assign, translation: Zuweisen }
  - { text: "{$title} is assigned to {$assignee}.", translation: "{$title} ist {$assignee} zugewiesen." }
  - { text: "Task {$id} is unchanged.", translation: "Aufgabe {$id} ist unverändert." }
  - { text: "HTTP {$status} · {$code}", translation: "HTTP {$status} · {$code}" }
  - { text: Row actions on a list, translation: Zeilenaktionen in einer Liste }
  - { text: "The latest comments, a list a reader draws, pinned ones first. Pin runs at once on a comment not yet pinned, Delete asks first, and Edit asks for the new text in a dialog; leaving it empty is refused on its field. The list reads again after each.", translation: "Die neuesten Kommentare, eine Liste, die ein Leser zeichnet, angeheftete zuerst. Anheften läuft sofort bei einem noch nicht angehefteten Kommentar, Löschen fragt zuerst nach, und Bearbeiten fragt in einem Dialog nach dem neuen Text; ihn leer zu lassen wird an seinem Feld abgelehnt. Die Liste wird nach jeder Aktion erneut gelesen." }
  - { text: Latest comments, translation: Neueste Kommentare }
  - { text: Pin, translation: Anheften }
  - { text: Already pinned., translation: Bereits angeheftet. }
  - { text: Delete this comment?, translation: Diesen Kommentar löschen? }
  - { text: Rewrite this comment?, translation: Diesen Kommentar neu schreiben? }
  - { text: More places a success goes, translation: Weitere Ziele eines Erfolgs }
  - { text: "The first adds a task and moves to the tables page, an address written in the manifest. The second answers with the handbook's address, a file the server serves under the mount, which is an ordinary load. The third answers with the team's mirror, an address a browser reads as another host: it navigates nowhere, and the answer says so.", translation: "Die erste fügt eine Aufgabe hinzu und wechselt zur Tabellenseite, einer im Manifest geschriebenen Adresse. Die zweite antwortet mit der Adresse des Handbuchs, einer Datei, die der Server unter dem Einhängepunkt ausliefert und die normal geladen wird. Die dritte antwortet mit dem Spiegel des Teams, einer Adresse, die ein Browser als anderen Host liest: Sie navigiert nirgendwohin, und die Antwort sagt das." }
  - { text: Add it and open the tables, translation: Hinzufügen und Tabellen öffnen }
  - { text: Open the handbook, translation: Handbuch öffnen }
  - { text: Open the mirror, translation: Spiegel öffnen }
  - { text: "The answer was {$mirror}, which is no address to go to, so the page stays.", translation: "Die Antwort war {$mirror}, keine Adresse, zu der man wechseln kann, daher bleibt die Seite." }
  - { text: "Refused, and unanswered", translation: "Abgelehnt und unbeantwortet" }
  - { text: "Pausing a project is for a manager alone. With no session the guard answers 401. Signed in on the Data page as james@northwind.example, who is no manager, the route answers 403 with no body; signed in as ada@northwind.example, it pauses the project, and refuses one that is not running in the page's language. The action's default failure tree draws each refusal.", translation: "Ein Projekt pausieren darf nur ein Manager. Ohne Sitzung antwortet der Wächter mit 401. Auf der Seite Daten als james@northwind.example angemeldet, der kein Manager ist, antwortet die Route mit 403 ohne Inhalt; als ada@northwind.example angemeldet, pausiert sie das Projekt und lehnt eines, das nicht läuft, in der Sprache der Seite ab. Der Standard-Fehlerbaum der Aktion zeichnet jede Ablehnung." }
  - { text: Pause the project, translation: Projekt pausieren }
  - { text: "{$code} is not running, so it cannot be paused.", translation: "{$code} läuft nicht und kann daher nicht pausiert werden." }
  - { text: "{$name} is paused.", translation: "{$name} ist pausiert." }
  - { text: "This route sends every request back to itself, so the browser gives up and no answer arrives at all. The failure tree says so: the error carries no status.", translation: "Diese Route leitet jede Anfrage auf sich selbst zurück, daher gibt der Browser auf, und es kommt überhaupt keine Antwort an. Der Fehlerbaum sagt das: Der Fehler hat keinen Status." }
  - { text: Call a route that never answers, translation: "Eine Route aufrufen, die nie antwortet" }
  - { text: "The route answered, with the status", translation: "Die Route hat geantwortet, mit dem Status" }
  - { text: "No answer arrived, so there is no status.", translation: "Es kam keine Antwort an, daher gibt es keinen Status." }
  - { text: "{$code} · {$message}", translation: "{$code} · {$message}" }
  - { text: Row actions that read the address, translation: "Zeilenaktionen, die die Adresse lesen" }
  - { text: "The table lists the tasks of the project the address names, and Move sends a task to the status the address names, read from the table's query when it is pressed. The row and the address bind every field of the move, so its dialog asks nothing and is a plain confirmation. Choose a project and a status:", translation: "Die Tabelle listet die Aufgaben des Projekts auf, das die Adresse nennt, und Verschieben verschiebt eine Aufgabe in den Status, den die Adresse nennt, gelesen aus der Abfrage der Tabelle beim Drücken. Zeile und Adresse binden jedes Feld des Verschiebens, daher fragt sein Dialog nichts und ist eine einfache Bestätigung. Wählen Sie ein Projekt und einen Status:" }
  - { text: TEL-42 into review, translation: TEL-42 in Prüfung }
  - { text: APP-5 to finished, translation: APP-5 auf abgeschlossen }
  - { text: OPS-7 back to in progress, translation: OPS-7 zurück in Arbeit }
  - { text: Neither, translation: Keines }
  - { text: Moved to, translation: Verschoben nach }
  - { text: Move this task to the status the address names?, translation: "Diese Aufgabe in den Status verschieben, den die Adresse nennt?" }
  - { text: Choose a status above first., translation: Wählen Sie zuerst oben einen Status. }

  # Components.
  - { text: A component on the page, translation: Eine Komponente auf der Seite }
  - { text: "A component written in TSX and shipped by a library of this example, placed with fixed properties. It uses everything the host gives it: it shows where the page is, keeps which panel is open in the address, moves to another page by navigate and by a link from href, and is refused an https address. It reads how TEL-42 stands and adds a task with fetch, says the tasks changed with notifyChanged — so the table below reads again — and counts every change it hears of with onChanged, the table's own edits and deletes included. A task it adds is announced in a layer of its own at the corner of the page.", translation: "Eine in TSX geschriebene Komponente, ausgeliefert von einer Bibliothek dieses Beispiels und mit festen Eigenschaften platziert. Sie nutzt alles, was ihr der Host gibt: Sie zeigt, wo die Seite ist, hält in der Adresse fest, welches Panel offen ist, wechselt per navigate und per Link aus href zu einer anderen Seite, und eine https-Adresse wird ihr verweigert. Sie liest den Stand von TEL-42 und fügt per fetch eine Aufgabe hinzu, meldet mit notifyChanged, dass sich die Aufgaben geändert haben — sodass die Tabelle unten erneut liest — und zählt mit onChanged jede Änderung, von der sie erfährt, einschließlich der eigenen Bearbeitungen und Löschungen der Tabelle. Eine hinzugefügte Aufgabe kündigt sie in einer eigenen Ebene in der Ecke der Seite an." }
  - { text: A component in a cell, translation: Eine Komponente in einer Zelle }
  - { text: "The priority column is drawn by a component given each row's priority and whether the task is blocked. The table lists TEL-42's tasks over the same collection the component writes to, so it reads again when a task is added above; its edits and deletes are heard by the component.", translation: "Die Prioritätsspalte wird von einer Komponente gezeichnet, die die Priorität jeder Zeile erhält und ob die Aufgabe blockiert ist. Die Tabelle listet die Aufgaben von TEL-42 aus derselben Sammlung, in die die Komponente schreibt, und liest daher erneut, wenn oben eine Aufgabe hinzugefügt wird; ihre Bearbeitungen und Löschungen hört die Komponente." }
  - { text: Its stylesheet, translation: Ihr Stylesheet }
  - { text: "The components' sources import a stylesheet of their own, which the application places in the telo.component layer: after the theme and the brand, before the application's own stylesheet. Every value in it reads a design token, so the desk and the meter take each mount's look.", translation: "Die Quellen der Komponenten importieren ein eigenes Stylesheet, das die Anwendung in die Ebene telo.component legt: nach dem Theme und der Marke, vor dem eigenen Stylesheet der Anwendung. Jeder Wert darin liest ein Design-Token, sodass das Pult und die Anzeige das Aussehen jedes Einhängepunkts annehmen." }

  # CRUD.
  - { text: A generated admin screen, translation: Ein generierter Verwaltungsbildschirm }
  - { text: "One declaration over the tasks collection the API is served from: a filter bar, a sortable paged table, a form to add a task and one to change it, and a confirmed delete on every row. The columns, the fields and the filters are all derived from the collection, so the screen offers exactly what the API accepts.", translation: "Eine Deklaration über das Aufgabenmodell, aus dem die API ausgeliefert wird: eine Filterleiste, eine sortierbare Tabelle mit Seiten, ein Formular zum Hinzufügen einer Aufgabe und eines zum Ändern sowie ein bestätigtes Löschen in jeder Zeile. Spalten, Felder und Filter werden alle aus dem Modell abgeleitet, sodass der Bildschirm genau das anbietet, was die API akzeptiert." }
  - { text: "The bar sits beside the table at the end edge and shows only the filters you choose, each as a chip that opens its control. It keeps its choice in this browser under the key aside — the key of the bar beside the table on the Filters page, so a filter chosen on either page is chosen on both.", translation: "Die Leiste steht neben der Tabelle am Endrand und zeigt nur die gewählten Filter, jeden als Chip, der sein Steuerelement öffnet. Sie speichert ihre Auswahl in diesem Browser unter dem Schlüssel aside — dem Schlüssel der Leiste neben der Tabelle auf der Seite Filter, sodass ein auf einer der beiden Seiten gewählter Filter auf beiden gewählt ist." }
  - { text: "A new task opens in a drawer from the end edge and stays open, emptied, for the next one. A task is changed in a panel beside the list, which is part of the address, and leaving it with unsaved input asks first.", translation: "Eine neue Aufgabe öffnet sich in einer Schublade vom Endrand und bleibt geöffnet und geleert für die nächste. Eine Aufgabe wird in einem Panel neben der Liste geändert, das Teil der Adresse ist, und wer es mit ungespeicherten Eingaben verlässt, wird zuerst gefragt." }

  # Related records.
  - { text: "Related records", translation: "Verknüpfte Datensätze" }
  - { text: "Posts and their authors", translation: "Beiträge und ihre Autoren" }
  - { text: "Each post names its author by key. The author column shows the author's name instead, read in one request for every author on the page, and the bar's author filter offers every author by name. The create and edit forms pick the author from a list of authors, searched by name.", translation: "Jeder Beitrag nennt seinen Autor über dessen Schlüssel. Die Autorenspalte zeigt stattdessen den Namen des Autors, gelesen in einer Anfrage für alle Autoren der Seite, und der Autorenfilter der Leiste bietet jeden Autor mit Namen an. Die Formulare zum Anlegen und Bearbeiten wählen den Autor aus einer Liste von Autoren, nach Namen durchsuchbar." }
  - { text: "Only the authors with posts", translation: "Nur die Autoren mit Beiträgen" }
  - { text: "These filters offer only the authors and the statuses present among the posts the other filters leave, each with how many posts it has. The posts are drawn as cards, and as a list below the breakpoint, loading more as you reach the end.", translation: "Diese Filter bieten nur die Autoren und Status an, die unter den Beiträgen vorkommen, die die anderen Filter übrig lassen, jeweils mit der Zahl ihrer Beiträge. Die Beiträge werden als Karten gezeichnet und unterhalb des Umbruchpunkts als Liste, die mehr lädt, sobald Sie das Ende erreichen." }
  - { text: "On a board by status", translation: "Auf einem Board nach Status" }
  - { text: "One column per status, each read and counted on its own. Drag a card to another column, or move it from its menu, to change its status; every list of posts on the page reads again.", translation: "Eine Spalte pro Status, jede für sich gelesen und gezählt. Ziehen Sie eine Karte in eine andere Spalte oder verschieben Sie sie über ihr Menü, um ihren Status zu ändern; jede Liste von Beiträgen auf der Seite wird neu gelesen." }
  - { text: "On a calendar", translation: "Auf einem Kalender" }
  - { text: "The posts on the day each is published, a month at a time; the month shown reads every post dated in it. A post with no date is not on the calendar.", translation: "Die Beiträge am Tag ihrer Veröffentlichung, ein Monat nach dem anderen; der gezeigte Monat liest jeden Beitrag, der in ihm datiert ist. Ein Beitrag ohne Datum steht nicht im Kalender." }
  - { text: "The authors", translation: "Die Autoren" }
  - { text: "The authors' own screen, generated from their collection. It reads the same address the posts' author filter and picker read, so an author added here is offered there at once.", translation: "Der eigene Bildschirm der Autoren, aus ihrer Sammlung erzeugt. Er liest dieselbe Adresse wie der Autorenfilter und die Autorenauswahl der Beiträge, sodass ein hier hinzugefügter Autor dort sofort angeboten wird." }
  - { text: "Reporting lines as a tree", translation: "Berichtswege als Baum" }
  - { text: "Each person names who they report to, a relation of the people to themselves. The tree reads the people who report to nobody first, and a person's reports when they are opened. The form picks the manager from the same people.", translation: "Jede Person nennt, an wen sie berichtet: eine Beziehung der Personen zu sich selbst. Der Baum liest zuerst die Personen, die an niemanden berichten, und die Mitarbeiter einer Person, sobald sie geöffnet wird. Das Formular wählt die Führungskraft aus denselben Personen." }
  # The labels of the related-records page's models.
  - { text: "Author", translation: "Autor" }
  - { text: "Draft", translation: "Entwurf" }
  - { text: "Published", translation: "Veröffentlicht" }
  - { text: "Published on", translation: "Veröffentlicht am" }
  - { text: "Reports to", translation: "Berichtet an" }
  - { text: "Post", translation: "Beitrag" }

  # Themes.
  - { text: Four mounts of one design, translation: Vier Einhängepunkte eines Designs }
  - { text: "The same pages are served four times, each application naming its own theme, brand and navigation. The pages are one set of views, placed by reference from all four, so only the look and the navigation differ.", translation: "Dieselben Seiten werden viermal ausgeliefert, und jede Anwendung nennt ihr eigenes Theme, ihre eigene Marke und Navigation. Die Seiten sind ein einziger Satz von Ansichten, von allen vier per Referenz platziert, sodass sich nur Aussehen und Navigation unterscheiden." }
  - { text: At the root, translation: Im Stammpfad }
  - { text: "The built-in look, this example's own stylesheet over it, and a brand chosen for every request: the Acme token set while a cookie asks for it, the theme's own values otherwise.", translation: "Das eingebaute Aussehen, darüber das eigene Stylesheet dieses Beispiels, und eine für jede Anfrage gewählte Marke: der Token-Satz von Acme, solange ein Cookie danach verlangt, andernfalls die eigenen Werte des Themes." }
  - { text: Under /radix, translation: Unter /radix }
  - { text: "The Radix theme: its stylesheet and its thirteen controls — the choice lists, dialogs, drawers, popovers, menus and tooltips — with the brand left to the theme.", translation: "Das Radix-Theme: sein Stylesheet und seine dreizehn Steuerelemente — Auswahllisten, Dialoge, Schubladen, Popover, Menüs und Tooltips — wobei die Marke dem Theme überlassen bleibt." }
  - { text: Under /brand, translation: Unter /brand }
  - { text: "A theme of this example's own: Radix's controls under a stylesheet written here, with token values of its own. The application's brand is one token set, which ships the Inter typeface the theme names.", translation: "Ein eigenes Theme dieses Beispiels: die Steuerelemente von Radix unter einem hier geschriebenen Stylesheet, mit eigenen Token-Werten. Die Marke der Anwendung ist ein Token-Satz, der die Schrift Inter mitliefert, die das Theme nennt." }
  - { text: Under /sidebar, translation: Unter /sidebar }
  - { text: "The built-in look with the navigation in a sidebar beside the page, which collapses to a rail and remembers its open groups. On a phone it becomes a tab bar along the bottom edge.", translation: "Das eingebaute Aussehen mit der Navigation in einer Seitenleiste neben der Seite, die sich zu einer schmalen Leiste einklappen lässt und ihre geöffneten Gruppen speichert. Auf einem Telefon wird sie zu einer Tab-Leiste am unteren Rand." }
  - { text: "A link resolves under the mount it is drawn in, so the links between the mounts and the brand switch are on the root application's Themes page.", translation: "Ein Link wird unter dem Einhängepunkt aufgelöst, in dem er gezeichnet wird, daher liegen die Links zwischen den Einhängepunkten und der Markenschalter auf der Seite Themes der Stammanwendung." }
  - { text: Every design token, translation: Jedes Design-Token }
  - { text: "Each token of the closed set as this page's theme and brand give it, read from the custom property the renderer projects it to, with a sample drawn in it. Open another mount, or switch the brand at the root, and the values change.", translation: "Jedes Token des geschlossenen Satzes, wie Theme und Marke dieser Seite es vorgeben, gelesen aus der Custom Property, auf die der Renderer es abbildet, mit einem darin gezeichneten Beispiel. Öffnen Sie einen anderen Einhängepunkt oder wechseln Sie die Marke im Stammpfad, und die Werte ändern sich." }
  - { text: Typefaces, translation: Schriften }
  - { text: "The body and heading typefaces in each of their four faces, and for each face whether this application serves it. Under /brand they are Inter's regular, bold, italic and bold italic faces, which ship with the example and are served with the page; the other two mounts serve none and draw from the viewer's own fonts.", translation: "Die Schriften für Fließtext und Überschriften in jedem ihrer vier Schnitte und für jeden Schnitt, ob diese Anwendung ihn ausliefert. Unter /brand sind es die Schnitte Regular, Bold, Italic und Bold Italic von Inter, die mit dem Beispiel geliefert und mit der Seite ausgeliefert werden; die beiden anderen Einhängepunkte liefern keinen aus und zeichnen mit den eigenen Schriften des Betrachters." }
  - { text: Switch the mount or the brand, translation: Einhängepunkt oder Marke wechseln }
  - { text: "These links are this application's own: a link resolves under the mount it is drawn in, so only the application at the root reaches the other two. Each is an ordinary load of another application.", translation: "Diese Links gehören zu dieser Anwendung: Ein Link wird unter dem Einhängepunkt aufgelöst, in dem er gezeichnet wird, daher erreicht nur die Anwendung im Stammpfad die beiden anderen. Jeder ist ein normales Laden einer anderen Anwendung." }
  - { text: Open the Radix mount, translation: Radix-Einhängepunkt öffnen }
  - { text: Open the brand mount, translation: Marken-Einhängepunkt öffnen }
  - { text: "This application's brand is chosen for every request. The switch sets or clears a cookie and comes back here, and while the cookie is there the Acme token set is used instead of the theme's own.", translation: "Die Marke dieser Anwendung wird für jede Anfrage gewählt. Der Schalter setzt oder löscht ein Cookie und kehrt hierher zurück, und solange das Cookie da ist, wird der Token-Satz von Acme statt der eigenen Werte des Themes verwendet." }
  - { text: Use the Acme brand, translation: Marke Acme verwenden }
  - { text: "Use the theme's own values", translation: "Eigene Werte des Themes verwenden" }

