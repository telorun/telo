# Related records: posts that name their author by key, drawn as a table, as
# cards, on a board by status and on a calendar by publication day; filter bars
# offering the authors by name, every one or only those with posts; a post
# form picking its author; the authors' own screen; and the reporting lines as
# a tree. Every application places this view on its `/records` page.
kind: Ui.View
metadata: { name: recordsPage }
content:
  type: stack
  children:
    # ---- A relation, shown by name ----
    - { type: text, text: Posts and their authors, style: heading }
    - type: text
      style: muted
      text: >-
        Each post names its author by key. The author column shows the author's name instead, read in one
        request for every author on the page, and the bar's author filter offers every author by name. The
        create and edit forms pick the author from a list of authors, searched by name.
    - type: composite
      ref:
        kind: Ui.Filters
        presentation: !ref postsPresentation
        fields:
          - { property: title, operator: contains }
          - { property: authorId, operator: eq }
          - { property: status, operator: eq }
        content:
          type: composite
          ref:
            kind: Ui.Listing
            presentation: !ref postsPresentation
            model: !ref Post
            pageSize: 5
            create: { form: !ref postForm }
            edit: { form: !ref postForm }
            delete: true
            layout:
              kind: Ui.TableLayout
              columns:
                - value: !cel "row.title"
                - value: !cel "row.authorId"
                - value: !cel "row.status"
                - value: !cel "row.publishedOn"

    # ---- Only the values present, as cards ----
    - { type: text, text: Only the authors with posts, style: heading }
    - type: text
      style: muted
      text: >-
        These filters offer only the authors and the statuses present among the posts the other filters
        leave, each with how many posts it has. The posts are drawn as cards, and as a list below the
        breakpoint, loading more as you reach the end.
    - type: composite
      ref:
        kind: Ui.Filters
        presentation: !ref postsPresentation
        fields:
          - { property: authorId, operator: eq, values: present }
          - { property: status, operator: eq, values: present }
        content:
          type: composite
          ref:
            kind: Ui.Listing
            presentation: !ref postsPresentation
            model: !ref Post
            pageSize: 4
            paging: scroll
            layout:
              kind: Ui.CardLayout
              size: small
              content: &postCard
                type: stack
                children:
                  - { type: value, value: !cel "row.title" }
                  - { type: value, value: !cel "row.authorId" }
            compact: { kind: Ui.ListLayout, content: *postCard }

    # ---- On a board ----
    - { type: text, text: On a board by status, style: heading }
    - type: text
      style: muted
      text: >-
        One column per status, each read and counted on its own. Drag a card to another column, or move it
        from its menu, to change its status; every list of posts on the page reads again.
    - type: composite
      ref:
        kind: Ui.Listing
        presentation: !ref postsPresentation
        model: !ref Post
        pageSize: 5
        edit: { form: !ref postForm, surface: { kind: Ui.Drawer, side: end } }
        layout:
          kind: Ui.BoardLayout
          groups: { property: status }
          content: *postCard
          move:
            action:
              kind: Ui.Action
              inputModel: !ref PostMove
              source: { path: /api/post-status }
              label: Move
            inputs: { id: !cel "row.id", status: !cel "to.status" }

    # ---- On a calendar ----
    - { type: text, text: On a calendar, style: heading }
    - type: text
      style: muted
      text: >-
        The posts on the day each is published, a month at a time; the month shown reads every post dated in
        it. A post with no date is not on the calendar.
    - type: composite
      ref:
        kind: Ui.Listing
        presentation: !ref postsPresentation
        model: !ref Post
        edit: { form: !ref postForm }
        layout:
          kind: Ui.CalendarLayout
          span: { start: publishedOn }
          content: { type: value, value: !cel "row.title" }

    # ---- The authors ----
    - { type: text, text: The authors, style: heading }
    - type: text
      style: muted
      text: >-
        The authors' own screen, generated from their collection. It reads the same address the posts' author
        filter and picker read, so an author added here is offered there at once.
    - type: composite
      ref: { kind: CrudUi.Admin, source: !ref authorsSource }

    # ---- A tree ----
    - { type: text, text: Reporting lines as a tree, style: heading }
    - type: text
      style: muted
      text: >-
        Each person names who they report to, a relation of the people to themselves. The tree reads the
        people who report to nobody first, and a person's reports when they are opened. The form picks the
        manager from the same people.
    - type: composite
      ref:
        kind: Ui.Listing
        presentation: !ref employeesPresentation
        model: !ref Employee
        create: { form: !ref employeeForm }
        edit: { form: !ref employeeForm }
        layout:
          kind: Ui.TreeLayout
          parent: managerId
          content:
            type: columns
            children:
              - { type: value, value: !cel "row.name" }
              - { type: value, value: !cel "row.title", style: muted }
---
# The form that writes a post, opened by every listing of posts: its author is
# picked from the authors, as the presentation's relation says.
kind: Ui.Form
metadata: { name: postForm }
model: !ref PostDraft
presentation: !ref postsPresentation
---
# How the reporting lines are shown: a manager by name, with their title as a
# hint, searched by name.
kind: Ui.CollectionPresentation
metadata: { name: employeesPresentation }
source: !ref employeesSource
relations:
  managerId:
    source: !ref employeesSource
    label: !cel "row.name"
    hint: !cel "row.title"
    search: { property: name, operator: contains }
---
kind: Ui.Form
metadata: { name: employeeForm }
model: !ref EmployeeDraft
presentation: !ref employeesPresentation
---
# The page every application lists at /records, placing the view.
kind: Ui.Page
metadata: { name: recordsScreen }
path: /records
title: Related records
children:
  - { type: composite, ref: !ref recordsPage }
