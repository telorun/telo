kind: Telo.Library
metadata:
  name: Stream
  version: 0.14.1
  repository: https://github.com/telorun/telo
  license: MIT
  categories: [Streaming]
  description: |
    The ends and the middle of a stream pipeline: turn a list of values into a stream,
    drain a stream back into a list, re-frame bytes into fixed-size chunks, transform,
    accumulate or expand values as they are pulled, observe each value as it passes
    without holding it, join several producers into one stream, starting each
    only when the previous one ends, and end a stream that fails part-way with a
    final value of your own. Values may be anything — text, records, numbers — so
    the same set serves any streaming pipeline.
requires:
  # `x-telo-ref` `outputType:` (Concat's sources) is read from this release on;
  # an older analyzer refuses it as an unknown key. Forward-declared: the
  # release carrying it is pending.
  telo: ">=0.103.0"
exports: { kinds: [Of, Collect, Chunk, Map, Scan, FlatMap, Tap, Concat, Recover] }
---
# Runtime `items` take precedence over the declared list; neither is an empty stream.
kind: Telo.Definition
metadata:
  name: Of
  description: >-
    Emits a list of values as a stream, in order. The list can be fixed in the
    declaration or supplied at the call site, which lets a stored or computed value be
    replayed into a streaming consumer.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#OfController]
schema:
  type: object
  properties:
    items:
      title: Items
      description: Literal values to emit as a stream, in order. Optional — a static default overridden by runtime invoke inputs.
      type: array
  additionalProperties: false
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      items:
        title: Items
        description: Runtime values to emit as a stream, in order. When provided, overrides the statically-declared items.
        type: array
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Stream of the declared items, in order.
    required: [ output ]
    additionalProperties: false
---
# Buffered: bounded by the stream's length, so drain an unbounded stream incrementally.
kind: Telo.Definition
metadata:
  name: Collect
  description: >-
    Drains a stream to completion and returns every value as a list, in order. Running
    it drives whatever produces the stream, and the collected list can then be
    inspected or aggregated. Buffered, so it needs a finite stream.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#CollectController]
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-type: Telo.Stream
        description: Async iterable to consume to completion.
    required: [ input ]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      items: { type: array, description: "Every item observed on `input`, in order." }
    required: [ items ]
    additionalProperties: false
schema: { type: object, additionalProperties: false }
---
# Each piece carries its offset and `last`, so positional framing (a `Content-Range`)
# is CEL at the use site rather than state kept across pieces.
kind: Telo.Definition
metadata:
  name: Chunk
  description: >-
    Re-frames a stream of bytes into consecutive pieces of a fixed size, buffering
    across the boundaries the bytes happened to arrive on and splitting any piece that
    is too large. Every piece reports where it starts, how long it is, its position in
    the sequence and whether it is the final one, so range headers and sequence
    numbers can be built at the point of use. Only the last piece is short, an empty
    source yields nothing, and one piece is held in memory at a time.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#ChunkController]
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      input:
        x-telo-type: { name: Telo.Stream, of: Telo.Bytes }
        description: Byte stream to re-frame.
      size:
        type: integer
        minimum: 1
        description: >-
          Bytes per piece, overriding the declared `size`. Supplied per call for a
          size the far end dictates (a resumable upload negotiates one).
    required: [input]
    additionalProperties: false
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      output:
        x-telo-type:
          name: Telo.Stream
          of:
            type: object
            additionalProperties: false
            required: [bytes, offset, length, index, last]
            properties:
              bytes: { x-telo-type: Telo.Bytes, description: This piece's bytes. }
              offset:
                type: integer
                description: Byte offset of this piece from the start of the stream.
              length: { type: integer, description: Number of bytes in this piece. }
              index:
                type: integer
                description: Zero-based position of this piece in the sequence.
              last:
                type: boolean
                description: True for the final piece, so a consumer can close its framing.
        description: Stream of fixed-size pieces, in order.
    required: [output]
    additionalProperties: false
schema:
  type: object
  additionalProperties: false
  properties:
    size:
      title: Size
      type: integer
      minimum: 1
      description: >-
        Default bytes per piece, used when a call supplies none. Declared here when
        the size is a property of the destination rather than of the call.
---
# Map, Scan and FlatMap are lazy: work happens as the consumer pulls, and a consumer
# that stops returns each stage and so its source. Rationale: docs/map.md.
kind: Telo.Definition
metadata:
  name: Map
  description: >-
    Transforms every value of a stream with a CEL expression, one in and one out, as
    the consumer pulls. The expression sees each value and its position, so a wire
    record can be reshaped into whatever the next stage expects without buffering the
    stream.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#MapController]
throws:
  codes:
    ERR_INVALID_INPUT: { description: "`input` did not resolve to an async iterable." }
    ERR_INVALID_VALUE:
      description: >-
        `value` was written blank. Raised per call rather than at load — a key with no
        value parses to null, which the schema cannot tell from a CEL node.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input]
    properties:
      input: { x-telo-type: Telo.Stream, description: Stream whose values are transformed. }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Stream of transformed values, in order.
schema:
  type: object
  additionalProperties: false
  required: [value]
  properties:
    elementType:
      title: Element Type
      description: >-
        The contract each produced value satisfies — a named type reference or an inline
        type definition. Declaring it holds `value` to that shape at analysis time, so a
        stage that drops a field the next one reads is an error before it runs.
      x-telo-ref: { kind: Telo.Type, use: schema }
    value:
      title: Value
      description: >-
        Each output value, evaluated once per element — a CEL expression, a structure
        with `!cel` leaves, or a literal. Sees item and index.
      x-telo-context: { type: object, properties: { item: {}, index: { type: integer } } }
      x-telo-value-schema-from: elementType
---
kind: Telo.Definition
metadata:
  name: Scan
  description: >-
    Accumulates a stream and emits the running state after every value, so a consumer
    sees each intermediate result rather than only the total. Reassembling text from
    deltas is the usual case: the accumulated value is what a reader wants, and it has
    to arrive per value rather than at the end.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#ScanController]
throws:
  codes:
    ERR_INVALID_INPUT: { description: "`input` did not resolve to an async iterable." }
    ERR_INVALID_VALUE: { description: "`accumulate` was written blank." }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input]
    properties: { input: { x-telo-type: Telo.Stream, description: Stream to accumulate over. } }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Stream of emitted values, one per input value, in order.
schema:
  type: object
  additionalProperties: false
  required: [initial, accumulate]
  properties:
    accType:
      title: Accumulator Type
      description: >-
        The running state's contract — a named type reference or an inline type
        definition. Declaring it types `acc` inside `accumulate` and `emit`, and holds
        both the seed and the step to that shape at analysis time.
      x-telo-ref: { kind: Telo.Type, use: schema }
    initial:
      title: Initial
      description: The starting accumulator, evaluated once before the first value.
      x-telo-context: { type: object, properties: {} }
      x-telo-value-schema-from: accType
    accumulate:
      title: Accumulate
      description: >-
        The accumulator's next value, evaluated once per element. Sees acc, item and
        index. It REPLACES the accumulator rather than merging into it.
      x-telo-context:
        type: object
        properties:
          acc: { x-telo-context-from-root: "accType" }
          item: {}
          index: { type: integer }
      x-telo-value-schema-from: accType
    emit:
      title: Emit
      description: >-
        What to emit for this element, evaluated after `accumulate` against the NEW
        accumulator. Omitted, the accumulator itself is emitted. Declared separately
        because the state and the value worth publishing are routinely different — a
        parser accumulates a buffer and emits only the frames it completed.
      x-telo-context:
        type: object
        properties:
          acc: { x-telo-context-from-root: "accType" }
          item: {}
          index: { type: integer }
---
kind: Telo.Definition
metadata:
  name: FlatMap
  description: >-
    Expands every value of a stream into any number of values, flattened into one
    stream. One wire frame routinely carries several logical records, and a keep-alive
    carries none, so emitting a list — empty to drop the value — is what lets a stage
    change how many values flow through it.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#FlatMapController]
throws:
  codes:
    ERR_INVALID_INPUT: { description: "`input` did not resolve to an async iterable." }
    ERR_INVALID_VALUE:
      description: >-
        `values` was written blank, or evaluated to something other than an array. A
        non-array is refused rather than emitted as one value: that would make `values`
        mean two things kept apart only by what an expression happened to return.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input]
    properties:
      input: { x-telo-type: Telo.Stream, description: Stream whose values are expanded. }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Stream of the produced values, in order, flattened.
schema:
  type: object
  additionalProperties: false
  required: [values]
  properties:
    elementType:
      title: Element Type
      description: >-
        The contract each produced value satisfies — a named type reference or an inline
        type definition. Declaring it holds every element of `values` to that shape at
        analysis time.
      x-telo-ref: { kind: Telo.Type, use: schema }
    values:
      title: Values
      description: >-
        The values this element expands to, evaluated once per element. Must be an
        array; emit [] to drop the element. Sees item and index.
      type: array
      x-telo-context: { type: object, properties: { item: {}, index: { type: integer } } }
---
# The handler is awaited before each value is delivered, under the tap's own
# invocation context. Rationale: docs/tap.md.
kind: Telo.Definition
metadata:
  name: Tap
  description: >-
    Passes every value of a stream through unchanged and in order, handing each one to
    a handler just before delivering it, optionally only when a condition holds. Prints
    or records values live while a later stage consumes the same stream, without the
    stage holding any value. A handler failure stops the stream with the handler's own
    error.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#TapController]
throws:
  inherit: true
  codes:
    ERR_INVALID_INPUT: { description: "`input` did not resolve to an async iterable." }
    ERR_INVALID_VALUE:
      description: >-
        `when` evaluated to something other than a boolean for a value. Raised as the
        stream is drained, attributed to the value's position.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input]
    properties:
      input: { x-telo-type: Telo.Stream, description: Stream whose values are observed. }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-type: Telo.Stream
        description: Every value of `input`, unchanged and in order.
schema:
  type: object
  additionalProperties: false
  required: [invoke]
  properties:
    invoke:
      title: Invoke
      description: >-
        The handler each value is handed to, awaited before the value is delivered.
        Its result is discarded — a returned stream is never drained — and its
        failure rejects the drain of this stage's output.
      type: object
      x-telo-ref: { kind: Telo.Executable, use: trigger.consumer, inputs: /inputs }
    inputs:
      title: Inputs
      description: >-
        Arguments passed to the handler, evaluated once per dispatched value. Sees item
        and index. Omitted, the handler is called with no arguments.
      type: object
      additionalProperties: true
      default: {}
      x-telo-context: { type: object, properties: { item: {}, index: { type: integer } } }
    when:
      title: When
      description: >-
        Whether to dispatch the handler for this value, evaluated once per value. False
        skips the dispatch and never the delivery. Omitted, every value is dispatched.
        Sees item and index.
      type: boolean
      x-telo-context: { type: object, properties: { item: {}, index: { type: integer } } }
---
# Each source is invoked only once the previous stream ended, under the Concat's own
# invocation context; `inherit` carries their codes. Rationale: docs/concat.md.
kind: Telo.Definition
metadata:
  name: Concat
  description: >-
    Joins the streams of several producers into one, in order, starting each producer
    only when the previous one's stream has ended. A failure ends the joined stream
    with that error and nothing after it runs; a reader stopping early or a
    cancellation stops the current producer and starts no further one.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#ConcatController]
throws:
  inherit: true
  codes:
    ERR_INVALID_VALUE:
      description: >-
        A source returned no `output` stream. Raised as the stream is drained, when
        that source is reached.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    properties:
      context:
        description: >-
          Caller data each source's `inputs:` map reads as `context`; `{}` when the
          caller passes none.
        type: object
        additionalProperties: true
        default: {}
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-type: Telo.Stream
        description: >-
          Every value of each source's `output` stream, source after source. Raised
          as it is drained: a source's own error (from its invocation or its
          stream) with its original code; ERR_INVALID_VALUE when a source returns no
          `output` stream; ERR_INVOKE_CANCELLED when the invocation is cancelled.
          Ends when its consumer stops.
schema:
  type: object
  additionalProperties: false
  required: [sources]
  properties:
    sources:
      title: Sources
      description: >-
        The producers, in the order their streams are joined. Each is invoked with
        its `inputs:` when the stream before it has ended.
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [invoke]
        properties:
          invoke:
            title: Invoke
            description: >-
              Invocable or Runnable (e.g. a Run.Sequence) returning `{ output: <stream> }`.
            x-telo-ref:
              kind: Telo.Executable
              use: trigger.consumer
              inputs: /inputs
              # `telo check` refuses a source whose declared output cannot be
              # this; one declaring none is refused as it is drained
              # (ERR_INVALID_VALUE).
              outputType:
                type: object
                required: [output]
                properties: { output: { x-telo-type: Telo.Stream } }
          inputs:
            title: Inputs
            description: >-
              The source's arguments, evaluated when it is invoked. CEL here reads
              `context` (the caller's `context` input). Checked against the source's
              `inputType`. Omitted, the source is called with no arguments.
            type: object
            additionalProperties: true
            default: {}
            x-telo-context:
              type: object
              additionalProperties: false
              required: [context]
              properties:
                context:
                  type: object
                  additionalProperties: true
                  description: The caller's `context` input.
---
# Stream.Recover — what a stream ends with when its source fails.
#
# A cancellation and a suspension are always rethrown, as every catcher in Telo
# rethrows them.
kind: Telo.Definition
metadata:
  name: Recover
  description: >-
    Passes every value of a stream through unchanged; when the source fails
    part-way, logs the failure and ends the stream with a final value computed
    from the error instead, so a client receives a last record it can read rather
    than a broken connection. A condition can limit which failures are recovered;
    the others are rethrown.
capability: Telo.Invocable
controllers: [pkg:telo/local/js?path=./nodejs/stream.mjs&local_path=./nodejs/src/index.ts#RecoverController]
throws:
  codes:
    ERR_INVALID_INPUT: { description: "`input` did not resolve to an async iterable." }
    ERR_INVALID_VALUE: { description: "`when` evaluated to something other than a boolean, raised as the source fails." }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [input]
    properties:
      input: { x-telo-type: Telo.Stream, description: Stream whose failure is recovered. }
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    additionalProperties: false
    required: [output]
    properties:
      output:
        x-telo-type: Telo.Stream
        description: >-
          Every value of `input`, then `value` when it fails. A failure `when`
          declines, a cancellation and a suspension are raised as they were.
schema:
  type: object
  additionalProperties: false
  required: [value]
  properties:
    elementType:
      title: Element Type
      description: >-
        The contract `value` satisfies — a named type reference or an inline type
        definition, usually the one the stage before it declares.
      x-telo-ref: { kind: Telo.Type, use: schema }
    value:
      title: Value
      description: >-
        The last value, evaluated once when the source fails — a CEL expression, a
        structure with `!cel` leaves, or a literal. Sees error.
      x-telo-context: &recoverContext
        type: object
        properties:
          error:
            type: object
            description: The failure, as a step's catch branch reads it.
            required: [code, message, data, displayMessage]
            properties:
              code: { type: string, description: The failure's code; INTERNAL_ERROR for a failure with none. }
              message: { type: string, description: The developer's message. }
              data: { description: The failure's structured data; null when it carries none. }
              displayMessage:
                description: The text a person is shown for the failure, as its record; null when it carries none.
                anyOf:
                  - { $ref: "telo://manifest#/$defs/TextRecord" }
                  - { type: "null" }
      x-telo-value-schema-from: elementType
    when:
      title: When
      description: >-
        Whether to recover this failure, evaluated once when the source fails. False
        rethrows it. Omitted, every failure is recovered. Sees error.
      type: boolean
      x-telo-context: *recoverContext
