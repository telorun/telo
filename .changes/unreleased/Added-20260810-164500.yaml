project: collection
kind: Added
body: 'A count is written as size(group), with no double() cast. A CEL integer now
  crosses a JSON boundary as its exact digits and satisfies a declared integer slot,
  so the cast the examples and docs used to teach — which said "float" about a value
  that is an integer, and truncated past 2^53 — is no longer needed anywhere. Bucket
  identity for an integer key follows the same encoding: a size()-derived key still
  matches the same value arriving as a plain JSON int, and two distinct int64s never
  collide.'
